تالي من حروف (يرملون).\n   - **بغنة** (ينمو): \"من وال\" ★، \"من يعمل\"، \"خيرٌ مما\".\n   - **بغير غنة** (ل ر): \"من ربهم\"، \"من لدنه\".\n3. **الإقلاب** ★ (سؤال مكرر): قلب النون الساكنة أو التنوين ميماً مخفاة مع الغنة عند الباء. مثال: \"عليمٌ بذات الصدور\" ★، \"أنبئهم\"، \"من بعد\".\n4. **الإخفاء**: النطق بالنون بين الإظهار والإدغام مع الغنة عند الحروف الخمسة عشر الباقية. مثال: \"من قبل\"، \"إنسان\"، \"أنداداً\".\n\n## أحكام الميم الساكنة (ثلاثة) ★ (سؤال سابق)\n1. **الإخفاء الشفوي**: عند الباء. مثال: \"كنتم بالله\" ★، \"من دون\" (وردت في نموذج)، \"ترميهم بحجارة\".\n2. **الإدغام الشفوي** (مثلين صغير): عند الميم. مثال: \"لهم ما\"، \"كم من\".\n3. **الإظهار الشفوي**: عند بقية الحروف. مثال: \"أم حسبتم\" ★، \"عليهم نار\".\n- **حكم النون في \"ومَنْ هاجر\"** ★ (سؤال سابق): إظهار حلقي، لأن النون الساكنة جاء بعدها حرف الهاء وهو من حروف الحلق.\n\n## المدود\n- **المد الطبيعي**: لا يتوقف على سبب، مقداره حركتان. \"قال\"، \"يقول\"، \"قيل\".\n- **المد المتصل** ★: أن يأتي بعد حرف المد همز في كلمة واحدة، واجب، 4 أو 5 حركات. \"السماء\" ★، \"السوء\" ★، \"سيئت\" ★، \"جاء\".\n- **المد المنفصل** ★: حرف المد في آخر كلمة والهمز في أول الكلمة التالية، جائز، 2 أو 4 أو 5 حركات. \"يا أيها\"، \"بما أنزل\"، \"إنا أعطيناك\".\n- **الفرق بينهما** ★: المتصل الهمز في نفس الكلمة وهو واجب، والمنفصل الهمز في كلمة أخرى وهو جائز.\n- **المد اللازم** ★ (سؤال: أقسامه مع مثال): أن يأتي بعد حرف المد سكون أصلي، مقداره 6 حركات. أربعة أقسام:\n  - كلمي مثقل (سكون مدغم في كلمة): \"الضالين\"، \"الحاقة\".\n  - كلمي مخفف (سكون غير مدغم في كلمة): \"آلآن\".\n  - حرفي مثقل (في فواتح السور مدغم): \"الم\" (اللام في الميم).\n  - حرفي مخفف (غير مدغم): \"ق\"، \"ن\"، \"ص\".\n- **المد العارض للسكون**: حرف مد بعده حرف سُكّن للوقف، 2 أو 4 أو 6. \"الرحيمْ\"، \"نستعينْ\".\n- **مد البدل**: همز قبل حرف المد، حركتان. \"آمنوا\"، \"إيماناً\".\n- **مد اللين**: واو أو ياء ساكنة قبلها فتحة بعدها سكون عارض: \"خوف\"، \"البيت\".\n\n## القلقلة ★ (سؤال مكرر)\n- **تعريفها**: اضطراب الصوت عند النطق بالحرف الساكن حتى يسمع له نبرة قوية.\n- **حروفها خمسة**: قطب جد (ق ط ب ج د).\n- **مراتبها**: كبرى (الحرف المشدد الموقوف عليه: \"الحقّ\")، وسطى (الساكن الموقوف عليه في آخر الكلمة: \"أحدْ\"، \"محيطْ\")، صغرى (الساكن في وسط الكلمة: \"يجعلون\"، \"يطمعون\"). وبعضهم يجعلها مرتبتين: كبرى في الوقف وصغرى في الوصل.\n\n## حروف الصفير ★ (سؤال سابق)\nثلاثة: **الصاد، الزاي، السين**. الصفير صوت يشبه صوت الطائر يخرج من بين الثنايا وطرف اللسان.\n\n## تشديدات سورة الفاتحة ★ (سؤال سابق)\n**أربع عشرة تشديدة** (وفي البسملة ثلاث: اللّه، الرّحمن، الرّحيم، وفي السورة إحدى عشرة كما نص عليه دليل الطالب في أركان الصلاة):\n1. اللّه (بسم اللّه) 2. الرّحمن 3. الرّحيم 4. للّه (الحمد للّه) 5. ربّ 6. الرّحمن 7. الرّحيم 8. الدّين 9. إيّاك 10. إيّاك 11. الصّراط 12. الّذين 13. الضّالّين (الضاد) 14. الضّالّين (اللام).\n\n## أحكام تجويدية في سورة الزلزلة ★ (سؤال سابق: اذكر خمسة)\n1. \"بأن ربك\": إدغام بغير غنة (النون الساكنة في الراء).\n2. \"يومئذٍ يصدر\"، \"خيراً يره\"، \"شراً يره\": إدغام بغنة (التنوين في الياء).\n3. \"أشتاتاً ليروا\": إدغام بغير غنة (التنوين في اللام).\n4. \"يومئذٍ تحدث\": إخفاء حقيقي (التنوين قبل التاء).\n5. \"الإنسان\": إخفاء حقيقي (النون الساكنة قبل السين).\n6. \"الأرض\"، \"الإنسان\": لام قمرية (إظهار).\n7. \"زلزالها\"، \"أثقالها\"، \"أخبارها\": مد طبيعي حركتان.\n8. \"يره\" في الوقف: مد عارض للسكون، والهاء هاء ضمير لا صلة لها عند الوقف.\n\n## آداب تلاوة القرآن ★ (سؤال سابق)\n1. الإخلاص. 2. الطهارة من الحدث واستقبال القبلة. 3. السواك وتنظيف الفم. 4. الاستعاذة عند البدء والبسملة أول السورة (غير براءة). 5. الترتيل وعدم العجلة. 6. الخشوع والتدبر والبكاء. 7. تحسين الصوت. 8. الجهر إن لم يؤذ أحداً. 9. الوقف على رؤوس الآيات. 10. اختيار المكان الطاهر. 11. السجود عند آيات السجدة. 12. عدم قطع القراءة لكلام الدنيا.\n\n## اللام الشمسية والقمرية\n- **القمرية**: تظهر اللام مع حروف \"ابغ حجك وخف عقيمه\". \"القمر\"، \"الأرض\".\n- **الشمسية**: تدغم اللام في الحرف التالي مع بقية الحروف. \"الشمس\"، \"الرحمن\".\n\n## أحكام الراء\nتفخم إذا كانت مفتوحة أو مضمومة أو ساكنة بعد فتح أو ضم، وترقق إذا كانت مكسورة أو ساكنة بعد كسر أصلي.\n\n## الاستعاذة والبسملة\nالاستعاذة مستحبة عند بدء القراءة، والبسملة سنة عند بدء كل سورة إلا براءة، وبين السورتين ثلاثة أوجه جائزة: قطع الجميع، وصل الجميع، قطع الأول ووصل الثاني، ويمتنع وصل البسملة بآخر السورة الأولى والقطع عن الثانية.\n", "questions": [{"s": "tajweed", "q": "عرّف الإقلاب مع ذكر مثال.", "a": "قلب النون الساكنة أو التنوين ميماً مخفاة مع الغنة عند الباء. مثال: عليمٌ بذات الصدور، أنبئهم."}, {"s": "tajweed", "q": "ما الفرق بين المد المتصل والمنفصل مع مثال؟", "a": "المتصل: الهمز بعد حرف المد في كلمة واحدة، واجب 4 أو 5. مثل: السماء. المنفصل: الهمز في الكلمة التالية، جائز 2 أو 4 أو 5. مثل: بما أنزل."}, {"s": "tajweed", "q": "عرّف القلقلة وحروفها ومراتبها.", "a": "اضطراب الصوت عند النطق بالحرف ساكناً. حروفها: قطب جد. مراتبها: كبرى (المشدد الموقوف عليه)، وسطى (الساكن الموقوف عليه)، صغرى (الساكن وسط الكلمة)."}, {"s": "tajweed", "q": "ما أقسام المد اللازم مع مثال؟", "a": "كلمي مثقل (الضالين)، كلمي مخفف (آلآن)، حرفي مثقل (الم)، حرفي مخفف (ق، ن)."}, {"s": "tajweed", "q": "ما أحكام الميم الساكنة؟", "a": "الإخفاء الشفوي عند الباء (كنتم بالله)، الإدغام الشفوي عند الميم (لهم ما)، الإظهار الشفوي عند البقية (أم حسبتم)."}, {"s": "tajweed", "q": "ما حروف الصفير؟", "a": "الصاد والزاي والسين."}, {"s": "tajweed", "q": "ما حكم النون في قوله تعالى (ومن هاجر)؟", "a": "إظهار حلقي لأن بعد النون الساكنة هاء."}, {"s": "tajweed", "q": "اذكر آداب تلاوة القرآن.", "a": "الإخلاص، الطهارة واستقبال القبلة، السواك، الاستعاذة والبسملة، الترتيل، الخشوع والتدبر، تحسين الصوت، السجود عند آية السجدة، عدم قطع القراءة لكلام الدنيا."}, {"s": "tajweed", "q": "اذكر عدد التشديدات في سورة الفاتحة وأي خمس منها.", "a": "أربع عشرة تشديدة مع البسملة: اللّه، الرّحمن، الرّحيم، للّه، ربّ، الرّحمن، الرّحيم، الدّين، إيّاك، إيّاك، الصّراط، الّذين، الضّالّين (تشديدتان)."}, {"s": "tajweed", "q": "اذكر خمسة أحكام تجويدية في سورة الزلزلة.", "a": "إدغام بغير غنة: بأن ربك. إدغام بغنة: يومئذ يصدر. إخفاء: يومئذ تحدث. لام قمرية: الأرض. مد طبيعي: زلزالها. إخفاء: الإنسان."}, {"s": "tajweed", "q": "مثّل: إقلاب، إدغام بغنة، مد واجب متصل، إظهار شفوي، إخفاء شفوي.", "a": "إقلاب: عليم بذات الصدور. إدغام بغنة: من وال. متصل: السماء. إظهار شفوي: أم حسبتم. إخفاء شفوي: كنتم بالله."}]}, "mithaq": {"name": "ميثاق المسجد", "source": "لم يُرسل المقرر بعد", "notes": "## المقرر لم يُرسل بعد\n\nأرسل صور أو ملف ميثاق المسجد ليُضاف هنا.", "questions": []}}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- تحويل Markdown مبسّط ----------
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/★/g,'<mark>★</mark>');
}
function mdToHtml(src){
  const lines = src.split('\n'); let out=[], i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^---+$/.test(l.trim())){i++;continue;}
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue;}
    if(l.trim().startsWith('|')){
      let rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++;}
      rows=rows.filter(r=>!/^\|[\s:-|]+\|$/.test(r));
      let h='<div class="tbl"><table>';
      rows.forEach((r,ri)=>{const cells=r.slice(1,-1).split('|');const tag=ri===0?'th':'td';h+='<tr>'+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});
      out.push(h+'</table></div>');continue;
    }
    if(/^\s*[-•]\s+/.test(l)){
      let h='<ul>'; while(i<lines.length && /^\s*[-•]\s+/.test(lines[i])){
        let item=lines[i].replace(/^\s*[-•]\s+/,''); i++;
        let sub='';
        while(i<lines.length && /^\s{2,}[-•]\s+/.test(lines[i])){sub+=`<li>${inline(lines[i].replace(/^\s*[-•]\s+/,''))}</li>`;i++;}
        h+=`<li>${inline(item)}${sub?`<ul>${sub}</ul>`:''}</li>`;
      } out.push(h+'</ul>');continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      let h='<ol>'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`;i++;} out.push(h+'</ol>');continue;
    }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#|\||\s*[-•]\s|\s*\d+[.)]\s|---)/.test(lines[i])){p.push(lines[i]);i++;}
    if(p.length) out.push(`<p>${inline(p.join(' '))}</p>`); else i++;
  }
  return out.join('\n');
}

// ---------- تخزين محلي للتقدم (اختياري) ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

// ---------- الصفحات ----------
function daysLeft(iso){const d=new Date(iso+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}

function home(){
  crumbs.innerHTML='';
  app.innerHTML=`<section class="hero">
    <h1>اختر المسار الذي تتقدم له</h1>
    <p>ملخصات المقررات المعتمدة، وبنك أسئلة من نماذج الاختبارات السابقة، مرتبة حسب وزن الدرجات. الاختبار التحريري في ${fmtDate(DATA.tracks.imam.exam_date)}.</p>
    <div class="choices">
      ${Object.entries(DATA.tracks).map(([id,t])=>`<a class="choice" href="#/${id}"><span class="k">${esc(t.name)}</span><span class="d">${t.marks_pending?'توزيع الدرجات يُحدَّث عند وصول المقرر':Object.keys(t.marks).length+' مواد، مجموع '+Object.values(t.marks).reduce((a,b)=>a+(b||0),0)+' درجة'}</span><span class="go">ابدأ المذاكرة</span></a>`).join('')}
    </div></section>`;
}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'});}

function track(tid){
  const t=DATA.tracks[tid]; if(!t) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <span>${esc(t.name)}</span>`;
  const left=daysLeft(t.exam_date);
  const total=Object.values(t.marks).reduce((a,b)=>a+(b||0),0);
  const done=store.get('done',{});
  app.innerHTML=`<section class="hero"><h1>مسار ${esc(t.name)}</h1><p>${esc(t.oral)}.</p></section>
  <div class="stack">
    <div class="card count"><span class="n">${left>=0?left:0}</span><span class="l">${left>=0?'يوماً على الاختبار التحريري':'انتهى موعد الاختبار'} (${fmtDate(t.exam_date)})</span></div>
    ${t.marks_pending?`<div class="card"><span class="pill gold">تنبيه</span> توزيع درجات هذا المسار لم يصل بعد. المواد أدناه حسب نموذج اختبار المؤذنين السابق، والمحتوى مشترك مع مسار الإمام لأن المقرر واحد.</div>`:''}
    <h2>المواد حسب وزن الدرجات</h2>
    <div class="subjects">
      ${Object.entries(t.marks).map(([sid,m])=>{const s=DATA.subjects[sid];const d=done[sid]||{};const known=Object.values(d).filter(x=>x==='y').length;return `<a class="subj" href="#/${tid}/${sid}">
        <span class="nm">${esc(s.name)}</span>
        <span class="mk"><b>${m==null?'؟':m}</b><span>${m==null?'درجة':'درجة'}</span></span>
        <span class="src">${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''} · ${s.questions.length} سؤال${known?` · أتقنت ${known}`:''}</span>
        ${m!=null?`<span class="bar"><i style="width:${Math.round(100*m/total)}%"></i></span>`:''}
      </a>`;}).join('')}
    </div>
    <div class="card"><h2>الخطة وتحليل الاختبارات السابقة</h2><div class="notes">${mdToHtml(DATA.plan)}</div></div>
  </div>`;
}

function subject(tid,sid,mode){
  const t=DATA.tracks[tid], s=DATA.subjects[sid]; if(!t||!s) return home();
  mode = mode||store.get('mode:'+sid,'notes');
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>${esc(s.name)}</span>`;
  const m=t.marks[sid];
  app.innerHTML=`<section class="hero"><h1>${esc(s.name)} <span class="pill gold">${m==null?'الدرجة غير محددة':m+' درجة'}</span></h1><p>${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''}</p></section>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-selected="${mode==='notes'}" data-mode="notes">الملخص</button>
    <button role="tab" id="tab-quiz" aria-selected="${mode==='quiz'}" data-mode="quiz">اختبر نفسك (${s.questions.length})</button>
  </div>
  <div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{store.set('mode:'+sid,b.dataset.mode);subject(tid,sid,b.dataset.mode);});
  const pane=document.getElementById('pane');
  if(mode==='notes'){pane.innerHTML=`<div class="card notes">${mdToHtml(s.notes)}</div>`;}
  else quiz(pane,sid,s);
}

function quiz(pane,sid,s){
  const qs=s.questions; if(!qs.length){pane.innerHTML='<div class="empty">لا توجد أسئلة لهذه المادة بعد.</div>';return;}
  const done=store.get('done',{}); done[sid]=done[sid]||{};
  let order=qs.map((_,i)=>i); let idx=store.get('idx:'+sid,0)%qs.length; let shown=false;
  function render(){
    const q=qs[order[idx]]; const st=done[sid];
    const known=Object.values(st).filter(x=>x==='y').length, weak=Object.values(st).filter(x=>x==='n').length;
    pane.innerHTML=`<div class="quiz">
      <div class="prog"><span>السؤال <b>${idx+1}</b> من <b>${qs.length}</b></span><span>أتقنت <b>${known}</b></span><span>تحتاج مراجعة <b>${weak}</b></span></div>
      <div class="qcard"><div class="qn">${esc(s.name)} · ${st[order[idx]]==='y'?'<span class="pill">متقن</span>':st[order[idx]]==='n'?'<span class="pill gold">للمراجعة</span>':''}</div>
        <div class="qt">${esc(q.q)}</div>
        ${shown?`<div class="ans">${esc(q.a)}</div>`:''}
        <div class="row" style="margin-top:14px">
          ${shown?`<button class="btn ok" id="y">أعرفها</button><button class="btn no" id="n">أحتاج مراجعة</button>`:`<button class="btn primary" id="show">أظهر الإجابة</button>`}
          <button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button>
        </div></div>
      <div class="row"><button class="btn" id="weakOnly">مراجعة ما أحتاجه فقط</button><button class="btn" id="all">كل الأسئلة</button><button class="btn" id="reset">تصفير التقدم</button></div>
    </div>`;
    const go=d=>{idx=(idx+d+order.length)%order.length;shown=false;store.set('idx:'+sid,idx);render();};
    pane.querySelector('#next').onclick=()=>go(1); pane.querySelector('#prev').onclick=()=>go(-1);
    const sh=pane.querySelector('#show'); if(sh) sh.onclick=()=>{shown=true;render();};
    const y=pane.querySelector('#y'); if(y) y.onclick=()=>{st[order[idx]]='y';store.set('done',done);go(1);};
    const n=pane.querySelector('#n'); if(n) n.onclick=()=>{st[order[idx]]='n';store.set('done',done);go(1);};
    pane.querySelector('#weakOnly').onclick=()=>{const w=qs.map((_,i)=>i).filter(i=>st[i]!=='y');if(w.length){order=w;idx=0;shown=false;render();}};
    pane.querySelector('#all').onclick=()=>{order=qs.map((_,i)=>i);idx=0;shown=false;render();};
    pane.querySelector('#reset').onclick=()=>{done[sid]={};store.set('done',done);order=qs.map((_,i)=>i);idx=0;shown=false;render();};
  }
  render();
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length) return home();
  if(h.length===1) return track(h[0]);
  return subject(h[0],h[1]);
}
window.addEventListener('hashchange',route); route();
</script>
