*: من العلوم العربية.\n- **واضعه**: المشهور أن أول واضع لعلم النحو **أبو الأسود الدُّؤلي**، بأمر أمير المؤمنين عليّ بن أبي طالب رضي الله عنهما.\n- **حكم الشارع فيه**: تعلمه فرض من فروض الكفاية، وربما تعيَّن على واحد فصار فرض عين عليه.\n\n## المصنف: ابن آجُرُّوم\n- هو أبو عبد الله محمد بن داود الصَّنْهاجي المعروف بابن آجُرُّوم، **مولود سنة 672 هـ**، **متوفى سنة 723 هـ** من الهجرة النبوية.\n\n## الكلام\n- **قال المصنف**: «الكلامُ هو اللفظُ المركَّبُ المفيدُ بالوضع».\n- للفظ «الكلام» معنيان: **لغوي** و**نحوي**.\n  - الكلام اللغوي: عبارة عما تحصل بسببه فائدة، سواء أكان لفظاً أم لم يكن كالخط والإشارة.\n  - الكلام النحوي: لا بد فيه من اجتماع **أربعة أمور**: أن يكون (1) لفظاً (2) مركباً (3) مفيداً (4) موضوعاً بالوضع العربي.\n- **لفظاً**: صوت مشتمل على بعض الحروف الهجائية التي تبتدئ بالألف وتنتهي بالياء، مثل: أحمد، يكتب، سعيد. فالإشارة لا تسمى كلاماً عند النحويين.\n- **مركباً**: مؤلفاً من كلمتين أو أكثر، نحو: «محمدٌ مسافرٌ»، «العلمُ نافعٌ»، «يبلغُ المجتهدُ المجدَ»، «لكلِّ مجتهدٍ نصيبٌ»، «العلمُ خيرُ ما تسعى إليه». والكلمة الواحدة تُعتبر كلاماً إذا انضم إليها غيرها **تقديراً**، كجواب «من أخوك؟» بقولك: «محمدٌ»، والتقدير: محمدٌ أخي.\n- **مفيداً**: أن يَحسُن سكوت المتكلم عليه. فـ«إذا حضر الأستاذ» ليس كلاماً وإن كان مركباً من ثلاث كلمات؛ فإذا قلت: «إذا حضر الأستاذُ أنصتَ التلاميذُ» صار كلاماً.\n- **موضوعاً بالوضع العربي**: أن تكون الألفاظ مما وضعته العربُ للدلالة على معنى، بخلاف كلام العجم: الفُرس والترك والبربر والفرنج.\n- **أمثلة للكلام المستوفي الشروط**: الجوُّ صحوٌ. البستانُ مثمرٌ. الهلالُ ساطعٌ. السماءُ صافيةٌ. يضيءُ القمرُ ليلاً. ينجحُ المجتهدُ. لا يفلحُ الكسولُ. لا إله إلا الله. محمدٌ صفوةُ المرسلين. اللهُ ربُّنا. محمدٌ نبيُّنا.\n- **أمثلة للفظ المفرد**: محمد، علي، إبراهيم، قامَ، مِنْ.\n- **أمثلة للمركب غير المفيد**: مدينة الإسكندرية، عبدُ الله، حضرموت، لو أنصف الناس، إذا جاء الشتاء، مهما أخفى المرائي، إن طلعت الشمس.\n\n## أنواع (أقسام) الكلام\n- قال: «وأقسامه ثلاثة: اسمٌ، وفعلٌ، وحرفٌ جاء لمعنى».\n- **الاسم** لغة: ما دلَّ على مُسمَّى. واصطلاحاً: كلمة دلَّت على معنى في نفسها ولم تقترن بزمان، نحو: محمد، علي، رجل، جمل، نهر، تفاحة، ليمونة، عصا.\n- **الفعل** لغة: الحَدَث. واصطلاحاً: كلمة دلَّت على معنى في نفسها واقترنت بأحد الأزمنة الثلاثة: الماضي والحال والمستقبل، نحو: كتب، يكتب، اكتب.\n- **الحرف** لغة: الطرف. واصطلاحاً: كلمة دلَّت على معنى في غيرها، نحو «من»؛ فمعناها الابتداء ولا يتم حتى تُضَمَّ إلى غيرها: «ذهبتُ من البيت».\n\n## أنواع الفعل (ثلاثة)\n1. **الماضي**: ما دلَّ على حدث وقع في الزمان الذي قبل زمان التكلم، نحو: كتبَ، فهمَ، خرجَ، سمعَ، أبصرَ، تكلَّمَ، استغفرَ، اشتركَ.\n2. **المضارع**: ما دلَّ على حدث يقع في زمان التكلم أو بعده، نحو: يكتب، يفهم، يخرج، يسمع، ينصر، يتكلم، يستغفر، يشترك.\n3. **الأمر**: ما دلَّ على حدث يُطلَب حصوله بعد زمان التكلم، نحو: اكتب، افهم، اخرج، اسمع، انصر، تكلَّم، استغفر، اشترك.\n\n## علامات الاسم (أربع)\nقال: «فالاسم يُعرَف بالخفض، والتنوين، ودخول الألف واللام، وحروف الخفض».\n1. **الخفض**: ضد الارتفاع، وهو في الاصطلاح: الكسرة التي يُحدِثها العامل أو ما ناب عنها، نحو: «مررتُ ببكرٍ»، «هذا كتابُ عمرٍو».\n2. **التنوين**: لغة التصويت. واصطلاحاً: نون ساكنة تتبع آخر الاسم لفظاً وتفارقه خطاً، نحو: محمدٍ، وكتابٍ، وإيهِ، وصَهٍ، ومسلماتٍ، وفاطماتٍ، وحينئذٍ، وساعتئذٍ.\n3. **دخول الألف واللام** في أول الكلمة، نحو: الرجل، الغلام، الفرس، الكتاب، البيت، المدرسة.\n4. **دخول حرف من حروف الخفض**، نحو: «ذهبتُ من البيتِ إلى المدرسةِ».\n\n## حروف الخفض ومعانيها\n- وهي: **مِن، إلى، عن، على، في، رُبَّ، الباء، الكاف، اللام**، وحروف القسم: **الواو، والباء، والتاء**.\n- «مِن» للابتداء: سافرتُ من القاهرةِ. «إلى» للانتهاء: سافرتُ إلى الإسكندريةِ. «عن» للمجاوزة: رميتُ السهمَ عن القوسِ. «على» للاستعلاء: صعدتُ على الجبلِ. «في» للظرفية: الماءُ في الكوزِ. «رُبَّ» للتقليل: رُبَّ رجلٍ كريمٍ قابلني. «الباء» للتعدية: مررتُ بالوادي. «اللام» للمِلك: المالُ لمحمدٍ، وللاختصاص: البابُ للدار والحصيرُ للمسجد، وللاستحقاق: الحمدُ لله.\n- **حروف القسم ثلاثة**:\n  - **الواو**: لا تدخل إلا على الاسم الظاهر، نحو «والله»، ﴿والطورِ وكتابٍ مسطور﴾، ﴿والتينِ والزيتونِ وطورِ سينين﴾.\n  - **الباء**: لا تختص بلفظ دون لفظ، بل تدخل على الاسم الظاهر «بالله لأجتهدنَّ» وعلى الضمير «بك لأضربنَّ الكسولَ».\n  - **التاء**: لا تدخل إلا على لفظ الجلالة، نحو ﴿وتاللهِ لأكيدنَّ أصنامَكم﴾.\n\n## علامات الفعل (أربع)\nقال: «والفعل يُعرَف بـ**قد** و**السين** و**سوف** و**تاء التأنيث الساكنة**».\n- **«قد»**: تدخل على الماضي والمضارع.\n  - مع **الماضي** تدل على أحد معنيين: **التحقيق** نحو ﴿قد أفلح المؤمنون﴾ و﴿لقد رضي الله عن المؤمنين﴾، و**التقريب** نحو قول مقيم الصلاة: «قد قامت الصلاةُ» و«قد غربت الشمسُ».\n  - مع **المضارع** تدل على: **التقليل** نحو «قد يصدُق الكذوبُ»، «قد يجود البخيلُ»، «قد ينجح البليدُ»، و**التكثير** نحو «قد ينال المجتهدُ بُغيتَه»، «قد يفعل التقيُّ الخيرَ»، وقول الشاعر:\n    > قد يُدرِكُ المُتَأنِّي بعضَ حاجتِهِ *** وقد يكونُ مع المُستَعجِلِ الزَّلَلُ\n- **السين وسوف**: يدخلان على المضارع وحده، ويدلان على **التنفيس** ومعناه **الاستقبال**، إلا أن **«السين» أقل استقبالاً من «سوف»**. مثال السين: ﴿سيقول السفهاءُ من الناس﴾، ﴿سيقول لك المخلَّفون﴾. ومثال سوف: ﴿ولسوف يعطيك ربُّك فترضى﴾، ﴿سوف نصليهم ناراً﴾، ﴿سوف يؤتيهم أجورَهم﴾.\n- **تاء التأنيث الساكنة**: تدخل على **الماضي دون غيره**، وتدل على أن الاسم المسند إليه مؤنث، سواء أكان فاعلاً نحو «قالت عائشةُ أمُّ المؤمنين» أم نائب فاعل نحو «فُرِشَت دارُنا بالبُسُط». والمراد أنها ساكنة في أصل وضعها، فلا يضر تحريكها لعارض التخلص من التقاء الساكنين نحو ﴿وقالتِ اخرج عليهنَّ﴾، ﴿إذ قالتِ امرأةُ عمران﴾.\n- **تقسيم علامات الفعل ثلاثة أقسام**: (1) ما يختص بالماضي: تاء التأنيث الساكنة. (2) ما يختص بالمضارع: السين وسوف. (3) ما يشترك بينهما: **قَدْ**.\n- **علامة فعل الأمر** (تركها المؤلف): دلالته على الطلب مع قبوله ياء المخاطبة أو نون التوكيد، نحو: قُم، اقعُد، اكتُب، انظُر — «قُومي، اقعُدي»، «اكتُبنَّ، وانظُرنَّ إلى ما ينفعُك».\n\n## علامة الحرف\nقال: «والحرف ما لا يصلُح معه دليل الاسم ولا دليل الفعل».\n- فالحرف لا تدخل عليه علامة من علامات الأسماء ولا من علامات الأفعال؛ مثاله: «مِنْ» و«هَلْ» و«لَمْ»؛ فلا يصح: المِنْ، ولا مِنٌ (بالتنوين)، ولا: إلى مِنْ، ولا تدخل عليه السين ولا سوف ولا تاء التأنيث الساكنة ولا قد.\n\n## باب الإعراب\n- قال: «الإعرابُ هو تغييرُ أواخر الكلِم لاختلاف العوامل الداخلة عليها لفظاً أو تقديراً».\n- **الإعراب لغة**: الإظهار والإبانة؛ تقول: أعربتُ عما في نفسي، إذا أبنتَه وأظهرتَه.\n- المقصود بتغيير أواخر الكلِم: تغيير **أحوال** أواخر الكلم، لا تغيير نفس الأواخر.\n- مثال: «حضر محمدٌ» (مرفوع بعامل يقتضي الرفع وهو «حضر») — «رأيتُ محمداً» (نصب بعامل «رأيت») — «حظيتُ بمحمدٍ» (جر بالباء). ومثله في الفعل المضارع: «يسافرُ إبراهيمُ» — «لن يسافرَ إبراهيمُ» — «لم يسافرْ إبراهيمُ».\n- **التغيير قسمان**:\n  1. **لفظي**: ما لا يمنع من النطق به مانع، كحركات الدال من «محمد» والراء من «يسافر».\n  2. **تقديري**: ما يمنع من التلفظ به مانع من: **تعذُّر**، أو **استثقال**، أو **مناسَبة**. نحو: «يدعو الفتى والقاضي وغلامي».\n     - **التعذر**: ما آخره ألف لازمة، ويسمى **الاسم المقصور** (المنتهي بالألف)، تُقدَّر عليه جميع الحركات، مثل: الفتى، والعصا، والحِجَى، والرَّحى، والرِّضا.\n     - **الثقل**: ما آخره ياء لازمة، ويسمى **الاسم المنقوص**، تُقدَّر عليه الضمة والكسرة للثقل وتظهر عليه الفتحة لخفتها، نحو: القاضي، والداعي، والغازي، والساعي، والآتي، والرامي.\n     - **المناسَبة**: ما كان مضافاً إلى ياء المتكلم، تُقدَّر عليه الحركات كلها، نحو: غلامي، وكتابي، وصديقي، وابني، وأستاذي.\n\n## البناء\n- **البناء لغة**: وضع شيء على شيء على جهة يُراد بها الثبوت واللزوم.\n- **البناء اصطلاحاً**: لزوم آخر الكلمة حالةً واحدةً لغير عامل ولا اعتلال؛ كلزوم «كَمْ» و«مَنْ» السكون، و«هؤلاءِ» و«حَذَامِ» و«أَمْسِ» الكسر، و«مُنذُ» و«حَيثُ» الضم، و«أينَ» و«كيفَ» الفتح.\n- **ألقاب البناء أربعة**: السكون، والكسر، والضم، والفتح.\n- **المعرب**: ما تغيَّر حال آخره لفظاً أو تقديراً بسبب تغير العوامل. **والمبني**: ما لزم آخره حالةً واحدةً لغير عامل ولا اعتلال.\n\n## أنواع (أقسام) الإعراب\nقال: «وأقسامه أربعة: رفعٌ، ونصبٌ، وخفضٌ، وجزمٌ؛ فللأسماء من ذلك: الرفع والنصب والخفض، ولا جزم فيها، وللأفعال من ذلك: الرفع والنصب والجزم، ولا خفض فيها».\n- **الرفع** لغة: العلوّ والارتفاع. واصطلاحاً: تغيير مخصوص علامته الضمة وما ناب عنها. ويقع في الاسم والفعل، نحو «يقومُ عليٌّ» و«يصدحُ البلبلُ».\n- **النصب** لغة: الاستواء والاستقامة. واصطلاحاً: تغيير مخصوص علامته الفتحة وما ناب عنها. ويقع في الاسم والفعل، نحو «لن أحبَّ الكسلَ».\n- **الخفض** لغة: التسفُّل. واصطلاحاً: تغيير مخصوص علامته الكسرة وما ناب عنها. **ولا يكون إلا في الاسم**، نحو «تألمتُ من الكسولِ».\n- **الجزم** لغة: القطع. واصطلاحاً: تغيير مخصوص علامته السكون وما ناب عنه. **ولا يكون إلا في الفعل المضارع**، نحو «لم يفُزْ متكاسلٌ».\n- **خلاصة**: قسم مشترك بين الأسماء والأفعال: **الرفع والنصب**. وقسم مختص بالأسماء: **الخفض**. وقسم مختص بالأفعال: **الجزم**.\n\n## باب معرفة علامات الإعراب — علامات الرفع (أربع)\nقال: «للرفع أربع علامات: الضمة، والواو، والألف، والنون».\n- **الضمة أصلية**، والواو والألف والنون **فروع** عنها.\n### مواضع الضمة (أربعة)\n1. **الاسم المفرد** (ما ليس مثنى ولا مجموعاً ولا ملحقاً بهما ولا من الأسماء الخمسة)، مذكراً كان: محمد، علي، حمزة، أو مؤنثاً: فاطمة، عائشة، زينب. سواء ظهرت الضمة: «حضر محمدٌ»، «سافرت فاطمةُ»، أو قُدِّرت: «حضر الفتى والقاضي وأخي»، «تزوجت ليلى ونُعمى».\n2. **جمع التكسير**.\n3. **جمع المؤنث السالم**.\n4. **الفعل المضارع الذي لم يتصل بآخره شيء** — أي لم يتصل به ألف اثنين، ولا واو جماعة، ولا ياء مخاطبة، ولا نون توكيد خفيفة أو ثقيلة، ولا نون نِسوة.\n\n## جمع التكسير\n- **تعريفه**: ما دلَّ على أكثر من اثنين أو اثنتين مع **تغيُّر في صيغة مفرده**.\n- **أنواع التغير فيه ستة**:\n  1. تغيّر بالشكل ليس غير: أسَدٌ وأُسْدٌ، نَمِرٌ ونُمْرٌ.\n  2. تغيّر بالنقص ليس غير: تُهَمَة وتُهَم، تُخَمَة وتُخَم.\n  3. تغيّر بالزيادة ليس غير: صِنْوٌ وصِنْوَانٌ ﴿صنوانٌ وغيرُ صنوان﴾.\n  4. تغيّر في الشكل مع النقص: سريرٌ وسُرُرٌ، كتابٌ وكُتُبٌ، أحمرُ وحُمْرٌ، أبيضُ وبِيضٌ.\n  5. تغيّر في الشكل مع الزيادة: سببٌ وأسبابٌ، بطلٌ وأبطالٌ، هِندٌ وهُنود، سَبُعٌ وسِباعٌ، ذئبٌ وذئابٌ، شجاعٌ وشُجعانٌ.\n  6. تغيّر في الشكل مع الزيادة والنقص جميعاً: كريمٌ وكُرَماء، رغيفٌ ورُغْفَان، كاتبٌ وكُتَّاب، أميرٌ وأُمَراء.\n- كلها ترفع بالضمة، مذكراً كان: رجال، كُتَّاب، أو مؤنثاً: هنود، زيانب. وقد تكون الضمة مقدرة: سُكارى، جَرْحى، عَذارى، حَبالى (الضمة مقدرة على الألف للتعذر).\n\n## جمع المؤنث السالم\n- **تعريفه**: ما دلَّ على أكثر من اثنتين بزيادة **ألف وتاء** في آخره، نحو: زينبات، فاطمات، حمَّامات.\n- علامة رفعه الضمة الظاهرة، ولا تكون مقدرة فيه **إلا عند إضافته لياء المتكلم** نحو «هذه شجراتي وبقراتي».\n- إن كانت الألف غير زائدة (موجودة في المفرد) نحو: القاضي والقُضاة، والداعي والدُّعاة، فهو **جمع تكسير**. وكذلك إن كانت التاء غير زائدة: ميْت وأموات، بيت وأبيات، صوت وأصوات — جمع تكسير لا جمع مؤنث سالم.\n\n## الفعل المضارع المرفوع بالضمة\n- الضمة ظاهرة: يضربُ، يكتبُ. ومقدرة على الواو للثقل: يدعو، يرجو. ومقدرة على الياء للثقل: يقضي، يُرضي. ومقدرة على الألف للتعذر: يرضى، يقوى.\n- **قيد «الذي لم يتصل بآخره شيء»** يُخرِج ما اتصل به:\n  - ألف الاثنين: يكتبان، ينصران.\n  - واو الجماعة: يكتبون، ينصرون.\n  - ياء المخاطبة: تكتبين، تنصرين. (وهذه تُرفَع بثبوت النون، والألف أو الواو أو الياء فاعل)\n  - نون التوكيد خفيفة أو ثقيلة: ﴿ليُسجَننَّ وليكوناً من الصاغرين﴾ — والفعل حينئذ **مبني على الفتح**.\n  - نون النسوة: ﴿والوالداتُ يُرضِعنَ﴾ — والفعل حينئذ **مبني على السكون**.\n\n## نيابة الواو عن الضمة (موضعان)\nقال: «وأما الواو فتكون علامة للرفع في موضعين: في جمع المذكر السالم، وفي الأسماء الخمسة».\n### 1) جمع المذكر السالم\n- **تعريفه**: اسمٌ دلَّ على أكثر من اثنين، بزيادة في آخره، صالح للتجريد عن هذه الزيادة، وعطفِ مثلِه عليه.\n- أمثلة قرآنية: ﴿فرِح المخلَّفون﴾، ﴿لكن الراسخون في العلم منهم والمؤمنون﴾، ﴿ولو كره المجرمون﴾، ﴿إن يكن منكم عشرون صابرون﴾، ﴿وآخرون اعترفوا بذنوبهم﴾.\n- الزيادة هي **الواو والنون**، والنون التي بعد الواو **عوض عن التنوين** في الاسم المفرد.\n### 2) الأسماء الخمسة\n- وهي: **أبوك، وأخوك، وحموك، وفوك، وذو مالٍ** — تُرفَع بالواو نيابة عن الضمة: «حضر أبوك وأخوك وحموك وفوك وذو مال».\n- شواهد: ﴿وأبونا شيخٌ كبير﴾، ﴿من حيث أمرهم أبوهم﴾، ﴿وإنه لذو علم﴾، ﴿إني أنا أخوك﴾.\n- **شروطها الأربعة العامة**: أن تكون (1) **مفردة** (2) **مكبَّرة** (3) **مضافة** (4) **إضافتها لغير ياء المتكلم**.\n  - لو جُمعت جمع تكسير أُعربت بالحركات الظاهرة: ﴿آباءَكم وأبناءَكم﴾، ﴿إنما المؤمنون إخوةٌ﴾، ﴿فأصبحتم بنعمته إخواناً﴾.\n  - لو ثُنِّيت أُعربت إعراب المثنى بالألف رفعاً وبالياء نصباً وجراً: «أبواك ربَّياك»، ﴿ورفع أبويه على العرش﴾، ﴿فأصلحوا بين أخوَيكم﴾.\n  - ولو جُمعت جمع مذكر سالم رُفعت بالواو: «هؤلاء أبونَ وأخونَ»، «رأيت أبينَ وأخينَ» — ولم يُجمع بالواو والنون غيرُ الأب والأخ.\n  - لو صُغِّرت أُعربت بالحركات الظاهرة: «هذا أُبَيٌّ وأُخَيٌّ»، «رأيت أُبَيّاً وأُخَيّاً».\n  - لو قُطعت عن الإضافة أُعربت بالحركات الظاهرة: «هذا أبٌ»، «رأيت أباً»، «مررت بأبٍ»، ﴿وله أخٌ أو أختٌ﴾، ﴿إن يسرِق فقد سرَق أخٌ له من قبل﴾.\n  - لو أُضيفت لياء المتكلم أُعربت بحركات مقدرة منع من ظهورها اشتغال المحل بحركة المناسبة: «حضر أبي وأخي»، ﴿إن هذا أخي﴾، ﴿أنا يوسفُ وهذا أخي﴾، ﴿فألقوه على وجه أبي﴾.\n- **شروط خاصة**:\n  - **«فوك»**: يُشترط زيادةً أن **تخلو من الميم**؛ فلو اتصلت بها الميم أُعربت بالحركات الظاهرة: «هذا فمٌ حسنٌ»، «رأيت فماً حسناً»، «نظرت إلى فمٍ حسنٍ».\n  - **«ذو»**: يُشترط (1) أن تكون **بمعنى صاحب** (2) أن يكون الذي تضاف إليه **اسمَ جنسٍ ظاهراً غير وصف**؛ فإن لم تكن بمعنى صاحب (بأن كانت موصولة) فهي **مبنية**. ومثالها غير موصولة قول المتنبي:\n    > وذو العقلِ يَشقى في النعيمِ بعقلِهِ *** وأخو الجهالةِ في الشقاوةِ ينعَمُ\n\n## نيابة الألف عن الضمة (موضع واحد)\nقال: «وأما الألف فتكون علامة للرفع في تثنية الأسماء خاصة».\n- **المثنى**: كل اسم دلَّ على اثنين أو اثنتين، بزيادة في آخره، أغنت هذه الزيادة عن العاطف والمعطوف، نحو: «أقبل العُمَرَان والهِندَان» — أي: حضر عمرُ وعمرُ / حضرت هندٌ وهندٌ.\n- مثاله: «حضر الصديقان» — مرفوع وعلامة رفعه الألف نيابة عن الضمة، والنون عوض عن التنوين في «صديقٌ».\n\n## نيابة النون عن الضمة (الأفعال الخمسة)\nقال: «وأما النون فتكون علامة للرفع في الفعل المضارع، إذا اتصل به ضمير تثنية، أو ضمير جمع، أو ضمير المؤنثة المخاطبة».\n- **الأفعال الخمسة**: يقومانِ، وتقومانِ، ويقومونَ، وتقومونَ، وتقومينَ.\n- المسند إلى ألف الاثنين: «الصديقان يسافران غداً» (بالياء للغيبة)، «أنتما تسافران غداً» (بالتاء للخطاب).\n- المسند إلى ألف الاثنتين: «الهندان تسافران غداً»، «أنتما يا هندان تسافران غداً» — **لا يكون مبدوءاً إلا بالتاء** للدلالة على تأنيث الفاعل.\n- المسند إلى واو الجماعة: «الرجال المخلصون هم الذين يقومون بواجبهم»، «أنتم يا قوم تقومون بواجبكم» — يبدأ بالياء أو التاء.\n- المسند إلى ياء المؤنثة المخاطبة: «أنتِ يا هندُ تعرفين واجبَك» — **لا يكون مبدوءاً إلا بالتاء**.\n- في هذه كلها: الفعل مرفوع وعلامة رفعه **ثبوت النون**، والألف/الواو/الياء **فاعل مبني على السكون في محل رفع**.\n\n## علامات النصب (خمس)\nقال: «وللنصب خمس علامات: الفتحة، والألف، والكسرة، والياء، وحذف النون».\n- الفتحة **أصلية**، وأربع فروع عنها: الألف، والكسرة، والياء، وحذف النون.\n### مواضع الفتحة (ثلاثة)\n1. **الاسم المفرد**: «لقيتُ عليّاً»، «قابلتُ هنداً» (ظاهرة)، «لقيتُ الفتى»، «حدَّثتُ ليلى» (مقدرة على الألف للتعذر).\n2. **جمع التكسير**: «صاحبتُ الرجالَ»، «رعيتُ الهنودَ» (ظاهرة)، ﴿وترى الناسَ سُكارى﴾، ﴿وأنكحوا الأيامى﴾ (مقدرة للتعذر).\n3. **الفعل المضارع إذا دخل عليه ناصب ولم يتصل بآخره شيء** (ألف اثنين، واو جماعة، ياء مخاطبة، نون توكيد، نون نسوة): ﴿لن نبرحَ عليه عاكفين﴾ (ظاهرة)، «يسرني أن تسعى إلى المجد» (مقدرة على الألف للتعذر).\n- فإن اتصل به ألف اثنين أو واو جماعة أو ياء مخاطبة: «لن يضربا»، «لن تضربوا»، «لن تضربي» — نُصب بـ**حذف النون**.\n- وإن اتصلت به نون توكيد: «والله لن تذهبنَّ» / «لن تذهبَنْ» فهو **مبني على الفتح في محل نصب**.\n- وإن اتصلت به نون النسوة: «لن تدركنَ المجدَ إلا بالعفاف» فهو **مبني على السكون في محل نصب**.\n### نيابة الألف عن الفتحة (موضع واحد)\n- في **الأسماء الخمسة**: «رأيتُ أباكَ وأخاكَ»، «احترمْ أباك»، «انصُرْ أخاك»، «زُرْ حماك»، «نظِّفْ فاك»، «لا تحترمْ ذا المالِ لمالِه». وليس للألف موضع تنوب فيه عن الفتحة سوى هذا.\n### نيابة الكسرة عن الفتحة (موضع واحد)\n- في **جمع المؤنث السالم**: «إن الفتياتِ المهذباتِ يُدرِكْنَ المجدَ». وليس للكسرة موضع سوى هذا.\n### نيابة الياء عن الفتحة (موضعان)\n- في **التثنية** و**الجمع** (جمع المذكر السالم).\n- **الفرق**: في المثنى يكون ما قبل الياء **مفتوحاً** وما بعدها **مكسوراً**؛ وفي جمع المذكر يكون ما قبلها **مكسوراً** وما بعدها **مفتوحاً**.\n- مثال المثنى: «نظرتُ عصفورَينِ فوق الشجرة»، «اشترى أبي كتابَينِ لي ولأخي».\n- مثال جمع المذكر: «إن المتقينَ ليكسِبونَ رضا ربِّهم»، «نصحتُ المجتهدينَ بالانكباب على المذاكرة».\n### نيابة حذف النون عن الفتحة\n- في **الأفعال الخمسة** التي رفعها بثبات النون: «يسرني أن تحفظوا دروسَكم»، «يؤلمني من الكسالى أن يُهمِلوا في واجباتهم»، «يسرني أن تنالا رغباتِكما»، «يؤلمني أن تُفرِّطي في واجبِك».\n\n## علامات الخفض (ثلاث)\nقال: «وللخفض ثلاث علامات: الكسرة، والياء، والفتحة».\n- الكسرة **هي الأصل في الخفض**، والياء والفتحة **فرعان** عنها.\n### مواضع الكسرة (ثلاثة)\n1. **الاسم المفرد المنصرف**: «سعيتُ إلى محمدٍ»، «رضيتُ عن عليٍّ»، «استفدتُ من معاشرةِ خالدٍ»، «أعجبني خُلُقُ بكرٍ».\n2. **جمع التكسير المنصرف**: «مررتُ برجالٍ كرامٍ»، «رضيتُ عن أصحابٍ لنا شُجعانٍ».\n3. **جمع المؤنث السالم**: «نظرتُ إلى فتياتٍ مؤدباتٍ»، «رضيتُ عن مسلماتٍ قانتاتٍ».\n### نيابة الياء عن الكسرة (ثلاثة مواضع)\nقال: «وأما الياء فتكون علامة للخفض في ثلاثة مواضع: في الأسماء الخمسة، وفي التثنية، والجمع».\n1. **الأسماء الخمسة**: «سلِّمْ على أبيكَ صباحَ كل يومٍ»، «لا ترفعْ صوتَكَ على صوتِ أخيكَ الأكبر»، «لا تكُنْ مُحبّاً لذي المالِ إلا أن يكون مؤدباً».\n2. **المثنى**: «انظُرْ إلى الجنديَّينِ»، «سلِّمْ على الصديقَينِ».\n3. **جمع المذكر السالم**: «رضيتُ عن البكرينَ»، «نظرتُ إلى المسلمينَ الخاشعينَ».\n### نيابة الفتحة عن الكسرة (موضع واحد)\nقال: «وأما الفتحة فتكون علامة للخفض في الاسم الذي لا ينصرف».\n\n## الممنوع من الصرف (الاسم الذي لا ينصرف)\n- **معنى «لا ينصرف»**: أنه لا يقبل الصرف، و**الصرف هو التنوين**.\n- **تعريفه**: هو الذي أشبَهَ الفعلَ في وجود **علتين فرعيتين**: إحداهما ترجع إلى اللفظ، والأخرى ترجع إلى المعنى، أو وُجِدت فيه **علة واحدة تقوم مقام العلتين**.\n- **العلل الراجعة إلى المعنى اثنتان ليس غير**: (1) **العَلَمية** (2) **الوصفية**. ولا بد من وجود واحدة منهما في الممنوع بسبب علتين.\n- **العلل الراجعة إلى اللفظ ستُّ عللٍ**: (1) **التأنيث بغير ألف** (2) **العُجمة** (3) **التركيب** (4) **زيادة الألف والنون** (5) **وَزْن الفِعل** (6) **العَدْل**.\n  - لا بد من وجود واحدة من هذه العلل **مع العَلَمية**.\n  - وأما **مع الوصفية** فلا يوجد منها إلا **واحدة من ثلاث**: زيادة الألف والنون، أو وزن الفعل، أو العدل.\n\n### أمثلة الممنوع من الصرف\n- **العلمية مع التأنيث بغير ألف**: فاطمة، زينب، حمزة.\n- **العلمية مع العجمة**: إدريس، يعقوب، إبراهيم.\n- **العلمية مع التركيب**: مَعْدِيكَرِب، بَعْلَبَكُّ، قاضيخان، بُزُرْجَمِهُر، رامَهُرْمُز.\n- **العلمية مع زيادة الألف والنون**: مَروان، عثمان، غَطَفان، عَفَّان، سَحْبان، سُفيان، عِمران، قَحْطان، عَدْنان.\n- **العلمية مع وزن الفعل**: أحمدُ، يَشكُرُ، يَزيدُ، تَغلِبُ، تَدْمُرُ.\n- **العلمية مع العدل**: عُمَرُ، زُفَرُ، قُثَمُ، هُبَلُ، زُحَلُ، جُمَحُ، قُزَحُ، مُضَرُ.\n- **الوصفية مع زيادة الألف والنون**: رَيّان، شَبْعان، يَقْظان.\n- **الوصفية مع وزن الفعل**: أكرمُ، أفضلُ، أجملُ.\n- **الوصفية مع العدل**: مَثْنى، وثُلاثَ، ورُباعَ، وأُخَرُ.\n- **العلّتان اللتان تقوم كل واحدة منهما مقام العلتين**:\n  1. **صيغة منتهى الجموع**: أن يكون الاسم جمع تكسير وقع بعد ألف تكسيره **حرفان** نحو: مساجدَ، منابرَ، أفاضلَ، أماجدَ، أماثلَ، حوائضَ، طوامثَ، أو **ثلاثة أحرف وسطها ساكن** نحو: مفاتيح، عصافير، قناديل.\n  2. **ألف التأنيث المقصورة**: حُبلى، قُصوى، دُنيا، دَعوى. **أو الممدودة**: حمراء، دَعجاء، حَسناء، بَيضاء، كَحلاء، نافقاء، أصدقاء، عُلَماء.\n- هذه كلها لا يجوز تنوينها، وتُخفض بالفتحة نيابة عن الكسرة: «صلى الله على إبراهيمَ خليلِه»، «رضي الله عن عمرَ أميرِ المؤمنين» (المانع في إبراهيم: العلمية والعجمة، وفي عمر: العلمية والعدل).\n- **شرط خفض الممنوع من الصرف بالفتحة**: أن يكون **خالياً من «أل»** و**ألا يُضاف** إلى اسم بعده؛ فإن اقترن بـ«أل» أو أُضيف خُفض بالكسرة: ﴿وأنتم عاكفون في المساجدِ﴾، «مررتُ بحسناءِ قريشٍ».\n\n## علامتا الجزم\nقال: «وللجزم علامتان: السكون، والحذف».\n- **السكون** هو العلامة **الأصلية** للجزم، و**الحذف** هو العلامة **الفرعية**.\n### موضع السكون (موضع واحد)\n- **الفعل المضارع الصحيح الآخر** (الذي ليس آخره حرفاً من حروف العلة الثلاثة: الألف والواو والياء): «لم يلعَبْ عليٌّ»، «لم ينجَحْ بليدٌ»، «لم يسافرْ أخوك»، «لم يَعِدْ إبراهيمُ خالداً بشيء»، «لم يسألْ بكرٌ الأستاذَ».\n### مواضع الحذف (موضعان)\n1. **الفعل المضارع المعتل الآخر**: يُجزم بحذف حرف العلة.\n   - آخره ألف: يسعى، يرضى، يهوى، ينأى، يشقى، يبقى → «لم يسعَ عليٌّ إلى المجد» (علامة جزمه حذف الألف، والفتحة قبلها دليل عليها).\n   - آخره واو: يدعو، يرجو، يبلو، يسمو، ينبو، يقسو، ويسنو → «لم يدعُ محمدٌ إلا إلى الحق» (حذف الواو، والضمة قبلها دليل).\n   - آخره ياء: يعطي، يقضي، يستغشي، يحيي، يلوي، يهدي → «لم يُعطِ محمدٌ إلا خالداً» (حذف الياء، والكسرة قبلها دليل).\n2. **الأفعال الخمسة** التي ترفع بثبوت النون: «لم يضربا، ولم تضربا، ولم يضربوا، ولم تضربوا، ولم تضربي» — علامة جزمها **حذف النون**، والألف أو الواو أو الياء فاعل مبني على السكون في محل رفع.\n\n## فصل: المعربات قسمان\n- قسم **يُعرب بالحركات**، وقسم **يُعرب بالحروف**.\n### المعرب بالحركات (أربعة أشياء)\nقال: «فالذي يُعرَب بالحركات أربعة أشياء: الاسم المفرد، وجمع التكسير، وجمع المؤنث السالم، والفعل المضارع الذي لم يتصل بآخره شيء».\n- **الحركات ثلاث**: الضمة والفتحة والكسرة، ويُلحق بها **السكون**.\n- أمثلة: «ذاكَرَ محمدٌ الدرسَ» (اسم مفرد)، «حفِظَ التلاميذُ الدروسَ» (جمع تكسير)، «خشَعَ المؤمناتُ في الصلواتِ» (جمع مؤنث سالم)، «يذهبُ محمدٌ» (فعل مضارع).\n### الأصل فيها وما خرج عنه\nقال: «وكلها تُرفع بالضمة، وتُنصب بالفتحة، وتُخفض بالكسرة، وتُجزم بالسكون؛ وخرج عن ذلك ثلاثة أشياء: **جمع المؤنث السالم يُنصب بالكسرة**، و**الاسم الذي لا ينصرف يُخفض بالفتحة**، و**الفعل المضارع المعتل الآخر يُجزم بحذف آخره**».\n- مثال الرفع: «يسافرُ محمدٌ والأصدقاءُ والمؤمناتُ».\n- مثال النصب: «لن أخالفَ محمداً والأصدقاءَ والمؤمناتِ».\n- مثال الخفض: «مررتُ بمحمدٍ والرجالِ والمؤمناتِ وأحمدَ» (أحمدَ مخفوض بالفتحة؛ لأنه ممنوع من الصرف للعلمية ووزن الفعل).\n- مثال الجزم: «لم يسافرْ خالدٌ» (بالسكون)، «لم يسعَ بكرٌ، ولم يدعُ، ولم يقضِ» (بحذف حرف العلة).\n### المعربات بالحروف (أربعة أنواع)\nقال: «والذي يُعرَب بالحروف أربعة أنواع: **التثنية**، و**جمع المذكر السالم**، و**الأسماء الخمسة**، و**الأفعال الخمسة**، وهي: يَفعَلان، وتَفعَلان، ويَفعَلون، وتَفعَلون، وتَفعَلين».\n- **الحروف التي تكون علامة للإعراب أربعة**: الألف، والواو، والياء، والنون.\n#### إعراب المثنى\n- قال: «فأما التثنية فتُرفع بالألف، وتُنصب وتُخفض بالياء».\n- الياء **مفتوح ما قبلها مكسور ما بعدها**، ويوصل به بعد الألف أو الياء **نون** عوض عن التنوين في الاسم المفرد، **ولا تُحذف هذه النون إلا عند الإضافة**.\n- أمثلة: «حضر القاضيانِ»، «قال رجلانِ» (مرفوع بالألف) — «أحبُّ المؤدبَينِ، وأكرهُ المتكاسلَينِ» (منصوب بالياء) — «نظرتُ إلى الفارسَينِ على الفرسَينِ» (مخفوض بالياء).\n#### إعراب جمع المذكر السالم\n- قال: «وأما جمع المذكر السالم فيُرفع بالواو، ويُنصب ويُخفض بالياء».\n- الياء **مكسور ما قبلها مفتوح ما بعدها**، والنون عوض عن التنوين في المفرد، **وتُحذف عند الإضافة كنون المثنى**.\n- أمثلة: «حضر المسلمونَ»، «أفلح الآمرونَ بالمعروفِ» (مرفوع بالواو) — «رأيتُ المسلمينَ» (منصوب بالياء).\n\n## إعراب الأسماء الخمسة (ص66-67)\n- تُرفع بالواو نيابة عن الضمة، وتُنصب بالألف نيابة عن الفتحة، وتُخفض بالياء نيابة عن الكسرة.\n- مرفوعة: «إذا أَمَرَكَ أَبُوكَ فَأَطِعْهُ»، «حَضَرَ أَخُوكَ من سَفَرِه».\n- منصوبة: «أَطِعْ أَبَاكَ، وَأَحْبِبْ أَخَاكَ».\n- مخفوضة: «اسْتَمِعْ إلى أَبِيكَ»، «أَشْفِقْ على أَخِيكَ».\n- والكاف في كل ذلك مضاف إليه مبني على الفتح في محل خفض.\n\n## إعراب الأفعال الخمسة (ص67)\n- تُرفع بثبوت النون نيابة عن الضمة، وتُنصب وتُجزم بحذف النون نيابة عن الفتحة أو السكون.\n- مرفوعة: «تَكْتُبَانِ» و«تَفْهَمَانِ» (لتجرُّدها من الناصب والجازم)، والألف ضمير الاثنين فاعل مبني على السكون في محل رفع.\n- منصوبة: «لَنْ تَحْزَنَا» و«لَنْ تَفْشَلَا».\n\n## باب الأفعال وأنواعها (ص70)\n- الأفعال ثلاثة: ماضٍ، ومضارع، وأمر، نحو: ضَرَبَ، ويَضْرِبُ، واضْرِبْ.\n- الماضي: ما دلَّ على حصول شيء قبل زمن التكلم: ضَرَبَ، نَصَرَ، فَتَحَ، عَلِمَ، حَسِبَ، كَرُمَ.\n- المضارع: ما دلَّ على حصول شيء في زمن التكلم أو بعده: يَضْرِبُ، يَنْصُرُ، يَفْتَحُ، يَعْلَمُ، يَحْسِبُ، يَكْرُمُ.\n- الأمر: ما يُطلب به حصول شيء بعد زمن التكلم: اضْرِبْ، انْصُرْ، افْتَحْ، اعْلَمْ، احْسِبْ، اكْرُمْ.\n\n## أحكام الفعل (ص71-73)\n- الماضي مفتوح الآخر أبداً، والأمر مجزوم أبداً، والمضارع مرفوع أبداً حتى يدخل عليه ناصب أو جازم.\n- فتح الماضي إما ظاهر (أَكْرَمَ، سَافَرَتْ زَيْنَبُ، رَضِيَ) وإما مُقدَّر:\n  - للتعذُّر فيما آخره ألف: دَعَا، سَعَى.\n  - للمناسبة فيما اتصلت به واو الجماعة: كَتَبُوا، سَعِدُوا.\n  - لدفع كراهة توالي أربع متحركات مع ضمير الرفع المتحرك: كَتَبْتُ، كَتَبْنَ، كَتَبْنَا.\n- فعل الأمر يُبنى على ما يُجزم به مضارعه: السكون (اضْرِبْ، اكْتُبْ)، وحذف حرف العلة (ادْعُ، اقْضِ، اسْعَ)، وحذف النون (اكْتُبَا، اكْتُبُوا، اكْتُبِي). ويُبنى على الفتح مع نون التوكيد (اضْرِبَنْ، اكْتُبَنَّ).\n- علامة المضارع: حرف زائد في أوله من الأربعة التي يجمعها قولك «أَنَيْتُ» (أو: نَأَيْتُ، أَتَيْنَ، نأتي): الهمزة للمتكلم، والنون للمتكلم المعظِّم نفسه أو معه غيره، والياء للغائب، والتاء للمخاطب أو الغائبة.\n- حكم المضارع: معرب ما لم تتصل به نون التوكيد (فيُبنى على الفتح: ﴿لَيُسْجَنَنَّ وَلَيَكُونًا مِنَ الصَّاغِرِينَ﴾) أو نون النسوة (فيُبنى على السكون: ﴿وَالْوَالِدَاتُ يُرْضِعْنَ﴾).\n\n## نواصب المضارع (ص74-77)\n- النواصب عشرة: أنْ، ولنْ، وإذنْ، وكَيْ، ولامُ كَيْ، ولامُ الجُحود، وحتى، والجوابُ بالفاء والواو، وأوْ.\n- وهي على ثلاثة أقسام:\n  1. **ما ينصب بنفسه** (أربعة أحرف): أنْ، لنْ، إذنْ، كَيْ.\n     - «أنْ»: حرف مصدر ونصب واستقبال: ﴿أَطْمَعُ أَن يَغْفِرَ لِي﴾، ﴿وَأَخَافُ أَن يَأْكُلَهُ الذِّئْبُ﴾.\n     - «لنْ»: حرف نفي ونصب واستقبال: ﴿لَن نُّؤْمِنَ لَكَ﴾، ﴿لَن نَّنَالُوا الْبِرَّ﴾.\n     - «إذنْ»: حرف جواب وجزاء ونصب، بثلاثة شروط: أن تكون في صدر الجواب، وأن يكون المضارع بعدها دالاً على الاستقبال، وألا يُفصل بينها وبين المضارع فاصلٌ غير القسم أو النداء أو «لا» النافية. مثال: «إذنْ تَنْجَحَ».\n     - «كَيْ»: حرف مصدر ونصب، بشرط أن تتقدمها لام التعليل لفظاً ﴿لِكَيْلَا تَأْسَوْا﴾ أو تقديراً ﴿كَيْ لَا يَكُونَ دُولَةً﴾.\n  2. **ما ينصب بـ«أنْ» مضمرة جوازاً** (حرف واحد): لام التعليل (لام كي): ﴿لِيَغْفِرَ لَكَ اللَّهُ مَا تَقَدَّمَ مِن ذَنبِكَ وَمَا تَأَخَّرَ﴾.\n  3. **ما ينصب بـ«أنْ» مضمرة وجوباً** (خمسة أحرف):\n     - لام الجحود: ضابطها أن تُسبق بـ«ما كان» أو «لم يكن»: ﴿مَّا كَانَ اللَّهُ لِيَذَرَ الْمُؤْمِنِينَ﴾، ﴿لَّمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ﴾.\n     - حتى: تفيد الغاية ﴿حَتَّىٰ يَرْجِعَ إِلَيْنَا مُوسَىٰ﴾ أو التعليل «ذَاكِرْ حتى تَنْجَحَ».\n     - فاء السببية وواو المعية: بشرط وقوعهما في جواب نفي ﴿لَا يُقْضَىٰ عَلَيْهِمْ فَيَمُوتُوا﴾ أو طلب.\n- **أقسام الطلب ثمانية**: الأمر، والدعاء، والنهي، والاستفهام، والعَرْض، والتحضيض، والتمني، والرجاء. (ومع النفي تصير تسعة أشياء تسبق الفاء والواو).\n  - الأمر: «ذَاكِرْ فَتَنْجَحَ». الدعاء: «اللهمَّ اهْدِني فَأَعْمَلَ الخَيْرَ». النهي: «لا تَلْعَبْ فيضيعَ أَمَلُكَ». الاستفهام: «هل حَفِظْتَ دُروسَكَ فأَسْمَعَها لك». العَرْض (طلب برفق): «ألا تَزُورُنا فَنُكْرِمَكَ». التحضيض (طلب مع حثٍّ وإزعاج): «هلَّا أدَّيْتَ واجبَكَ فَيَشْكُرَكَ أبوك». التمني (طلب المستحيل أو ما فيه عُسر): «لَيْتَ لي مالاً فأَحُجَّ منه». الرجاء (طلب الأمر القريب الحصول): «لعلَّ الله يَشْفِيني فأَزُورَك».\n- وجمعها بعضهم في بيت: مُرْ، وادْعُ، وانْهَ، وسَلْ، واعرِضْ، لِحَضِّهمُ ... تَمَنَّ، وارْجُ، كذاك النَّفْيُ قد كَمُلَا\n\n## «أوْ» الناصبة (ص78)\n- الحرف الخامس من نواصب المضارع بـ«أنْ» مضمرة وجوباً: «أوْ»، بشرط أن تكون بمعنى «إلا» أو بمعنى «إلى».\n- ضابط الأولى: أن يكون ما بعدها ينقضي دُفعة: «لأَقْتُلَنَّ الكافرَ أَوْ يُسْلِمَ».\n- ضابط الثانية: أن يكون ما بعدها ينقضي شيئاً فشيئاً: «لأَسْتَسْهِلَنَّ الصَّعْبَ أَوْ أُدْرِكَ المُنَى».\n\n## جوازم المضارع (ص79-83)\n- الجوازم **ثمانية عشر**، وتنقسم قسمين:\n### أولاً: ما يجزم فعلاً واحداً (ستة أحرف، بإجماع النحاة)\n- لم، ولمَّا، وألَمْ، وألَمَّا، ولام الأمر والدعاء، و«لا» في النهي والدعاء.\n- «لم»: حرف نفي وجزم وقَلْب: ﴿لَمْ يَكُنِ الَّذِينَ كَفَرُوا﴾، ﴿قُل لَّمْ تُؤْمِنُوا﴾.\n- «لمَّا»: مثل «لم» في النفي والجزم والقلب: ﴿لَمَّا يَذُوقُوا عَذَابِ﴾.\n- «ألَمْ»: «لم» زيدت عليها همزة التقرير: ﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ﴾.\n- «ألَمَّا»: «لمَّا» زيدت عليها الهمزة: «ألَمَّا أُحْسِنْ إليك».\n- اللام: للأمر والدعاء؛ الأمر من الأعلى للأدنى «فَلْيَقُلْ خَيْراً أو لِيَصْمُتْ»، والدعاء من الأدنى للأعلى ﴿لِيَقْضِ عَلَيْنَا رَبُّكَ﴾.\n- «لا»: للنهي والدعاء؛ النهي من الأعلى للأدنى ﴿لَا تَخَفْ﴾ ﴿لَا تَقُولُوا رَاعِنَا﴾ ﴿لَا تَغْلُوا فِي دِينِكُمْ﴾، والدعاء من الأدنى للأعلى ﴿رَبَّنَا لَا تُؤَاخِذْنَا﴾ ﴿وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا﴾.\n### ثانياً: ما يجزم فعلين (فعل الشرط وجوابه) وهو أربعة أنواع\n1. **حرف باتفاق**: «إنْ» وحدَه: «إنْ تُذَاكِرْ تَنْجَحْ».\n2. **اسم باتفاق (تسعة أسماء)**: مَن، وما، وأيّ، ومتى، وأيّان، وأين، وأنَّى، وحيثما، وكيفما.\n   - مَن: «مَنْ يُكْرِمْ جارَهُ يُحْمَدْ»، ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ﴾.\n   - ما: «ما تَصْنَعْ تُجْزَ به»، ﴿وَمَا تُنفِقُوا مِنْ خَيْرٍ يُوَفَّ إِلَيْكُمْ﴾.\n   - أيّ: «أيَّ كتابٍ تَقْرَأْ تَسْتَفِدْ منه»، ﴿أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾.\n   - متى: «متى تَلْتَفِتْ إلى واجبك تَنَلْ رضا ربك».\n   - أيّان: «أيّانَ تَلْقَني أُكْرِمْكَ».\n   - أينما: ﴿أَيْنَمَا يُوَجِّههُّ لَا يَأْتِ بِخَيْرٍ﴾، ﴿أَيْنَمَا تَكُونُوا يُدْرِككُّمُ الْمَوْتُ﴾.\n   - حيثما، وكيفما: «كيفما تكُنِ الأمةُ يكُنِ الوُلاة».\n   - ويُزاد عليها «إذا» في الشعر خاصة ضرورة: «وإذا تُصِبْكَ خَصاصةٌ فَتَجَمَّلِ».\n3. **ما اختُلف فيه والأصحُّ أنه حرف**: «إذما» (حرف واحد).\n4. **ما اختُلف فيه والأصحُّ أنه اسم**: «مهما» (كلمة واحدة): ﴿مَهْمَا تَأْتِنَا بِهِ مِنْ آيَةٍ لِّتَسْحَرَنَا بِهَا فَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ﴾.\n\n## باب مرفوعات الأسماء (ص85-86)\n- المرفوعات **سبعة**: الفاعل، والمفعول الذي لم يُسمَّ فاعله (نائب الفاعل)، والمبتدأ، وخبره، واسم «كان» وأخواتها، وخبر «إنَّ» وأخواتها، والتابع للمرفوع.\n1. الفاعل: «حَضَرَ عليٌّ»، «سَافَرَ محمدٌ».\n2. نائب الفاعل: «قُطِعَ الغُصْنُ»، «سُرِقَ المتاعُ».\n3-4. المبتدأ والخبر: «محمدٌ مسافرٌ»، «عليٌّ مجتهدٌ».\n5. اسم كان وأخواتها: «كان إبراهيمُ مجتهداً»، «أصبحَ البَرْدُ شديداً».\n6. خبر إنَّ وأخواتها: «إنَّ محمداً فاضلٌ»، «إنَّ الله على كل شيءٍ قديرٌ».\n7. التابع للمرفوع، وهو أربعة أنواع:\n   - النعت: «زارني محمدٌ الفاضلُ»، «قابلني رجلٌ كريمٌ».\n   - العطف، وهو ضربان: عطف بيان «سافرَ أبو حَفْصٍ عمرُ»، وعطف نسق «تَشَارَكَ محمدٌ وخالدٌ».\n   - التوكيد: «زارني الأميرُ نَفْسُهُ».\n   - البدل: «حَضَرَ عليٌّ أَخُوكَ».\n- **ترتيب التوابع إذا اجتمعت**: النعت، ثم عطف البيان، ثم التوكيد، ثم البدل، ثم عطف النسق: «جاءَ الرَّجُلُ الكريمُ عليٌّ نَفْسُهُ صديقُكَ وأَخُوهُ».\n\n## باب الفاعل (ص87-89)\n- الفاعل لغةً: عبارة عمَّن أَوْجَدَ الفعل. واصطلاحاً: **الاسم المرفوع المذكور قبله فعلُه**.\n- «الاسم» يخرج الفعل والحرف، ويشمل الاسم الصريح (﴿قَالَ نُوحٌ﴾، ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ﴾) والمؤوَّل بالصريح (﴿أَوَلَمْ يَكْفِهِمْ أَنَّا أَنزَلْنَا﴾ أي: إنزالُنا؛ «يَسُرُّني أن تتمسك بالفضائل» أي: تَمَسُّكُك؛ «أعجبني ما صنعتَ» أي: صُنْعُكَ).\n- «المرفوع» يُخرج المنصوب والمجرور. و«المذكور قبله فعلُه» يُخرج المبتدأ واسم «إنَّ» وأخواتها، ويُخرج اسم «كان» و«كاد» وأخواتهما.\n- والمراد بالفعل ما يشمل شبه الفعل كاسم الفعل: «هَيْهَاتَ العقيقُ»، «شَتَّانَ زيدٌ وعمرٌو»، واسم الفاعل: «أَقَادِمٌ أَبُوكَ».\n- **أقسام الفاعل**: ظاهر ومُضمَر.\n  - الظاهر: ما يدلُّ على معناه بدون حاجة إلى قرينة.\n  - المضمر: ما لا يدل على المراد منه إلا بقرينة تكلُّم أو خطاب أو غَيْبة.\n- والظاهر أنواع: مفرد، ومثنى، وجمع مذكر سالم، وجمع تكسير، وكل منها مذكر أو مؤنث؛ فهذه **ثمانية أنواع**، مع كل من الماضي والمضارع.\n  - مفرد مذكر: «سَافَرَ محمدٌ، وحَضَرَ خالدٌ» / «يُسَافِرُ محمدٌ، ويحضُرُ خالدٌ».\n  - مثنى مذكر: «حَضَرَ الصَّديقَانِ، وسَافَرَ الأَخَوَانِ».\n  - جمع مذكر سالم: «حَضَرَ المُحَمَّدُونَ، وحَجَّ المسلمونَ».\n  - جمع تكسير مذكر: «حَضَرَ الأصدقاءُ، وسافرَ الزُّعَماءُ».\n\n## أنواع الفاعل المضمر (ص91-93)\n- المضمر **اثنا عشر** نوعاً: ضَرَبْتُ، وضَرَبْنَا، وضَرَبْتَ، وضَرَبْتِ، وضَرَبْتُمَا، وضَرَبْتُمْ، وضَرَبْتُنَّ، وضَرَبَ، وضَرَبَتْ، وضَرَبَا، وضَرَبُوا، وضَرَبْنَ.\n- تفصيلها: اثنان للمتكلم (واحد: ضَرَبْتُ؛ متعدد أو معظِّم نفسه: ضَرَبْنَا)، وخمسة للمخاطب، وخمسة للغائب (مفرد مذكر، مفردة مؤنثة، مثنى مطلقاً، جمع مذكر، جمع مؤنث).\n- هذه الاثنا عشر كلها **ضمير متصل**، وتعريفه: الذي لا يُبتدأ به الكلام ولا يقع بعد «إلا» في حالة الاختيار.\n- ويقابله **الضمير المنفصل**: الذي يُبتدأ به ويقع بعد «إلا» في حالة الاختيار: «ما ضَرَبَ إلا أنا... إلا نحنُ... إلا أنتَ... إلا هو... إلا هُنَّ».\n- أمثلة إعراب: «سافر المرتضى»: فاعل مرفوع بضمة مقدرة على الألف منع من ظهورها التعذر. «سيزورنا القاضي»: فاعل مرفوع بضمة مقدرة على الياء منع من ظهورها الثقل. «أقبل أخي»: فاعل مرفوع بضمة مقدرة منع من ظهورها اشتغال المحل بحركة المناسبة.\n\n## باب النائب عن الفاعل (المفعول الذي لم يُسمَّ فاعله) (ص96-97)\n- تعريفه: **الاسم المرفوع الذي لم يُذكر معه فاعلُه**.\n- إذا حُذف الفاعل وجب تغيير صورة الفعل، ويصير المفعول مرفوعاً ويأخذ أحكام الفاعل: وجوب تأخيره عن الفعل، وتأنيث فعله إن كان مؤنثاً.\n- **تغيير الفعل**: إن كان ماضياً ضُمَّ أوله وكُسِرَ ما قبل آخره: «قُطِعَ الغُصْنُ»، «حُفِظَ الدَّرْسُ». وإن كان مضارعاً ضُمَّ أوله وفُتِحَ ما قبل آخره: «يُقْطَعُ الغُصْنُ»، «يُحْفَظُ الدَّرْسُ».\n- **أقسامه**: ظاهر ومضمر (والمضمر متصل ومنفصل).\n  - الظاهر: «ضُرِبَ زيدٌ»، «يُضْرَبُ زيدٌ»، «أُكْرِمَ عمرٌو»، «يُكْرَمُ عمرٌو».\n  - المضمر اثنا عشر: ضُرِبْتُ، وضُرِبْنَا، وضُرِبْتَ، وضُرِبْتِ، وضُرِبْتُمَا، وضُرِبْتُمْ، وضُرِبْتُنَّ، وضُرِبَ، وضُرِبَتْ، وضُرِبَا، وضُرِبُوا، وضُرِبْنَ.\n- إعراب: «يُخْتَرَمُ العالِمُ»: يُخترم فعل مضارع مبني للمجهول مرفوع، العالم نائب فاعل مرفوع. «أُهِينَ الجاهِلُ»: أُهين فعل ماضٍ مبني للمجهول مبني على الفتح، الجاهل نائب فاعل مرفوع.\n\n## باب المبتدأ والخبر (ص99-101)\n- **المبتدأ**: الاسم المرفوع العاري (الخالي) عن العوامل اللفظية. فيه ثلاثة أمور: أن يكون اسماً، وأن يكون مرفوعاً، وأن يكون عارياً عن العوامل اللفظية (كالفعل و«كان» وأخواتها). مثاله: «محمدٌ حاضرٌ».\n- **الخبر**: الاسم المرفوع المُسنَد إليه؛ وهو الذي يُسنَد إلى المبتدأ ويُحمل عليه فيتم به الكلام. مثاله: «حاضر» من «محمدٌ حاضرٌ».\n- أمثلة المؤلف: «زيدٌ قائمٌ»، «الزيدانِ قائمانِ»، «الزيدونَ قائمونَ».\n- رفعهما إما بضمة ظاهرة («الله ربُّنا»، «محمدٌ نبيُّنا»)، أو مقدرة للتعذر («موسى مُصطفىً من الله»، «ليلى فُضْلَى النساءِ»)، أو مقدرة للثقل («القاضي هو الآتي»)، أو بالحروف («المجتهدانِ فائزانِ»).\n- ولا بد من تطابق المبتدأ والخبر إفراداً وتثنيةً وجمعاً وتذكيراً وتأنيثاً: «هندٌ قائمةٌ»، «الهندانِ قائمتانِ»، «الهنداتُ قائماتٌ».\n- **المبتدأ قسمان: ظاهر ومضمر**.\n  - الظاهر: «محمدٌ رسولُ الله»، «عائشةُ أمُّ المؤمنينَ».\n  - المضمر **اثنا عشر لفظاً**: أنا، ونحن، وأنتَ، وأنتِ، وأنتما، وأنتم، وأنتنَّ، وهو، وهي، وهما، وهم، وهنَّ. نحو: «أنا قائم»، «نحن قائمون». وإذا كان المبتدأ ضميراً فلا يكون إلا بارزاً منفصلاً.\n- **أقسام الخبر: مفرد وغير مفرد**.\n  - المفرد: «زيدٌ قائمٌ».\n  - غير المفرد **أربعة أشياء**: الجار والمجرور، والظرف، والفعل مع فاعله، والمبتدأ مع خبره؛ نحو: «زيدٌ في الدارِ، وزيدٌ عندَكَ، وزيدٌ قامَ أبوهُ، وزيدٌ جاريتُهُ ذاهبةٌ».\n\n## أنواع الخبر بالتفصيل (ص102)\n- المفرد: ما ليس جملة ولا شبيهاً بالجملة: «محمد قائم».\n- غير المفرد نوعان: جملة وشبه جملة.\n  - الجملة نوعان: اسمية («محمدٌ أبوهُ كريمٌ») وفعلية («محمدٌ سافرَ أبوهُ»، «خالدٌ يُضْرَبُ غلامُهُ»).\n  - ولا بد للخبر الجملة من رابط يربطه بالمبتدأ: ضمير يعود إلى المبتدأ، أو اسم إشارة: «محمدٌ هذا رجلٌ كريمٌ».\n  - شبه الجملة نوعان: الجار والمجرور («عليٌّ في المسجدِ»)، والظرف («الطائرُ فوقَ الغُصْنِ»).\n- فالخبر على التفصيل **خمسة أنواع**: مفرد، وجملة فعلية، وجملة اسمية، وجار مع مجرور، وظرف.\n\n## باب نواسخ المبتدأ والخبر (العوامل الداخلة عليهما) (ص105-106)\n- العوامل الداخلة على المبتدأ والخبر **ثلاثة أشياء**: كان وأخواتها، وإنَّ وأخواتها، وظننتُ وأخواتها.\n- القسم الأول: يرفع المبتدأ وينصب الخبر، وهو «كان» وأخواتها، وكله **أفعال**: «كان الجوُّ صافياً».\n- القسم الثاني: ينصب المبتدأ ويرفع الخبر، وهو «إنَّ» وأخواتها، وكله **حروف**: ﴿إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ﴾.\n- القسم الثالث: ينصب المبتدأ والخبر جميعاً، وهو «ظننتُ» وأخواتها، وكله **أفعال**: «ظننتُ الصديقَ أخاً».\n- وسُمِّيت «النواسخ» لأنها نَسَخَتْ (غيَّرَتْ) حكم المبتدأ والخبر وجدَّدت لهما حكماً آخر.\n\n## كان وأخواتها (ص106-109)\n- ترفع الاسم وتنصب الخبر، وهي **ثلاثة عشر فعلاً**: كان، وأمسى، وأصبح، وأضحى، وظلَّ، وبات، وصار، وليس، وما زال، وما انفكَّ، وما فتِئ، وما برِح، وما دام؛ وما تصرَّف منها (كان ويكون وكُنْ، وأصبح ويصبح وأصبِحْ).\n- معانيها: كان: اتصاف الاسم بالخبر في الماضي، إما مع الانقطاع «كان محمدٌ مجتهداً» وإما مع الاستمرار ﴿وَكَانَ رَبُّكَ قَدِيرًا﴾. أمسى: في المساء. أصبح: في الصباح. أضحى: في الضحى. ظلَّ: في جميع النهار. بات: في وقت البيات وهو الليل. صار: تحوُّل الاسم من حاله إلى الحالة التي يدل عليها الخبر «صار الطينُ إبريقاً». ليس: نفي الخبر عن الاسم في وقت الحال. وما زال وما انفكَّ وما فتِئ وما برِح: ملازمة الخبر للاسم. وما دام: ملازمة الخبر للاسم أيضاً «لا أَعْذِلُ خالداً ما دُمْتُ حيّاً».\n- **أقسامها من جهة العمل ثلاثة**:\n  1. ما يعمل بشرط تقدُّم «ما» المصدرية الظرفية عليه، وهو فعل واحد: **دام**.\n  2. ما يعمل بشرط أن يتقدَّم عليه نفيٌ أو استفهامٌ أو نهيٌ، وهو أربعة أفعال: **زال، وانفكَّ، وفتِئ، وبرِح**.\n  3. ما يعمل بغير شرط، وهو **ثمانية أفعال** وهي الباقي.\n- **أقسامها من جهة التصرف ثلاثة**:\n  1. ما يتصرف تصرفاً كاملاً (ماضٍ ومضارع وأمر)، وهو **سبعة**: كان، وأمسى، وأصبح، وأضحى، وظلَّ، وبات، وصار.\n  2. ما يتصرف تصرفاً ناقصاً (ماضٍ ومضارع لا غير)، وهو **أربعة**: فتِئ، وانفكَّ، وبرِح، وزال.\n  3. ما لا يتصرف أصلاً، وهو **فعلان**: ليس اتفاقاً، ودام على الأصح.\n- وغير الماضي يعمل عمل الماضي: ﴿وَلَا يَزَالُونَ مُخْتَلِفِينَ﴾، ﴿لَن نَّبْرَحَ عَلَيْهِ عَاكِفِينَ﴾، ﴿تَاللَّهِ تَفْتَأُ تَذْكُرُ يُوسُفَ﴾.\n\n## إنَّ وأخواتها (ص109-110)\n- **تنصب الاسم وترفع الخبر**، وهي **ستة حروف**: إنَّ، وأنَّ، ولكنَّ، وكأنَّ، وليتَ، ولعلَّ. «إنَّ زيداً قائمٌ»، «ليتَ عمراً شاخصٌ».\n- معانيها: إنَّ وأنَّ للتوكيد (تقوية نسبة الخبر للمبتدأ): «إنَّ أباكَ حاضرٌ»، «علمتُ أنَّ أباكَ مسافرٌ». لكنَّ للاستدراك (تعقيب الكلام بنفي ما يُتوهَّم ثبوته أو إثبات ما يُتوهَّم نفيه): «محمد شجاع لكنَّ صديقَهُ جبانٌ». كأنَّ للتشبيه: «كأنَّ الجاريةَ بدرٌ». ليتَ للتمني (طلب المستحيل أو ما فيه عُسْر): «ليتَ الشبابَ عائدٌ»، «ليتَ البليدَ ينجحُ». لعلَّ للترجِّي (طلب الأمر المحبوب، ولا يكون إلا في الممكن) «لعلَّ الله يرحمُني»، والتوقُّع (انتظار وقوع الأمر المكروه) «لعلَّ العدوَّ قريبٌ منَّا».\n\n## ظنَّ وأخواتها (ص110-111)\n- **تنصب المبتدأ والخبر جميعاً على أنهما مفعولان لها**؛ المبتدأ مفعول أول والخبر مفعول ثانٍ.\n- وهي **عشرة أفعال**: ظننتُ، وحسبتُ، وخِلتُ، وزعمتُ، ورأيتُ، وعلمتُ، ووجدتُ، واتخذتُ، وجعلتُ، وسمعتُ.\n- أمثلتها: «ظننتُ محمداً صديقاً»، «حسبتُ المالَ نافعاً»، «خِلتُ الحديقةَ مُثْمِرَةً»، «زعمتُ بكراً جريئاً»، «رأيتُ إبراهيمَ مُفْلِحاً»، «علمتُ الصدقَ مُنْجِياً»، «وجدتُ الصلاحَ بابَ الخيرِ»، «اتخذتُ محمداً صديقاً»، «جعلتُ الذهبَ خاتماً»، «سمعتُ خليلاً يقرأُ».\n- **وتنقسم إلى أربعة أقسام**:\n  1. ما يفيد ترجيح وقوع الخبر (أربعة): ظننتُ، وحسبتُ، وخِلتُ، وزعمتُ.\n  2. ما يفيد اليقين وتحقيق وقوع الخبر (ثلاثة): رأيتُ، وعلمتُ، ووجدتُ.\n  3. ما يفيد التصيير والانتقال (فعلان): اتخذتُ، وجعلتُ.\n  4. ما يفيد النسبة في السمع (فعل واحد): سمعتُ.\n\n## باب النعت (ص116-118)\n- النعت لغةً: الوصف. واصطلاحاً: **التابع المشتقُّ أو المؤوَّل بالمشتق، المُوَضِّح لمتبوعه في المعارف، المُخَصِّص له في النكرات**.\n- وهو **تابع للمنعوت في رفعه ونصبه وخفضه، وتعريفه وتنكيره**: «قام زيدٌ العاقلُ، ورأيتُ زيداً العاقلَ، ومررتُ بزيدٍ العاقلِ».\n- **قسماه**:\n  1. **النعت الحقيقي**: ما رَفَعَ ضميراً مستتراً يعود إلى المنعوت: «جاء محمدٌ العاقلُ».\n  2. **النعت السببي**: ما رَفَعَ اسماً ظاهراً متصلاً بضمير يعود إلى المنعوت: «جاء محمدٌ الفاضلُ أبوهُ» (الفاضل نعت لمحمد، وأبوه فاعل للفاضل).\n- النعت الحقيقي يزيد على ذلك أنه يتبع منعوته في التذكير والتأنيث، وفي الإفراد والتثنية والجمع: «رأيت محمداً العاقلَ»، «رأيت فاطمةَ المهذَّبةَ»، «رأيت المحمَّدَيْنِ العاقِلَيْنِ»، «رأيت الرجالَ العقلاءَ».\n- النعت السببي **يكون مفرداً دائماً وأبداً** ولو كان منعوته مثنى أو مجموعاً: «رأيت الوَلَدَيْنِ العاقلَ أبوهما»، «رأيت الأولادَ العاقلَ أبوهم»، ويتبع ما بعده في التذكير والتأنيث: «رأيت البناتِ العاقلَ أبوهُنَّ»، «رأيت الأولادَ العاقلةَ أمُّهُم».\n- **الخلاصة**: النعت الحقيقي يتبع منعوته في **أربعة من عشرة**: واحد من الإفراد والتثنية والجمع، وواحد من الرفع والنصب والخفض، وواحد من التذكير والتأنيث، وواحد من التعريف والتنكير.\n- والنعت السببي يتبع منعوته في **اثنين من خمسة**: واحد من الرفع والنصب والخفض، وواحد من التعريف والتنكير؛ ويتبع مرفوعه الذي بعده في واحد من التذكير والتأنيث.\n\n## المعرفة وأقسامها (ص118-120)\n- المعرفة: اللفظ الذي يدل على معيَّن، وأقسامها **خمسة**:\n  1. **الاسم المضمر (الضمير)**: أنا، أنتَ، هو. وهو ثلاثة أنواع:\n     - للمتكلم (كلمتان): أنا، ونحن.\n     - للمخاطب (خمسة ألفاظ): أنتَ، أنتِ، أنتما، أنتم، أنتنَّ.\n     - للغائب (خمسة ألفاظ): هو، هي، هما، هم، هنَّ.\n  2. **العَلَم**: ما يدل على معيَّن بدون احتياج إلى قرينة، وهو نوعان: مذكر (محمد، إبراهيم، جَبَل)، ومؤنث (فاطمة، زينب، مكة).\n  3. **الاسم المبهم**، وهو نوعان:\n     - **اسم الإشارة**: هذا (للمذكر المفرد)، هذه (للمفردة المؤنثة)، هذان أو هذَيْن (للمثنى المذكر)، هاتان أو هاتَيْن (للمثنى المؤنث)، هؤلاء (للجمع مطلقاً).\n     - **الاسم الموصول**: الذي، والتي، واللذان أو اللذَيْن، واللتان أو اللتَيْن، والذين (لجمع الذكور)، واللائي أو اللاتي (لجمع الإناث). ولا بد له من صلة بعده مشتملة على عائد يطابق الموصول.\n  4. **المحلَّى بالألف واللام**: الرجل، والكتاب، والغلام، والجارية.\n  5. **ما أُضيف إلى واحد من هذه الأربعة**: «غلامُك»، «غلامُ محمدٍ»، «غلامُ هذا الرَّجُلِ»، «غلامُ الَّذي زارنا أَمْسِ»، «غلامُ الأستاذِ».\n- **أعرفُ المعارف بعد لفظ الجلالة**: الضمير، ثم العَلَم، ثم اسم الإشارة، ثم الاسم الموصول، ثم المحلَّى بأل، ثم المضاف إليها. والمضاف في رتبة المضاف إليه إلا المضاف إلى الضمير فإنه في رتبة العَلَم.\n\n## النكرة (ص120-121)\n- تعريفها: **كل اسم شائع في جنسه لا يختصُّ به واحدٌ دون آخر**؛ أي: لم يوضع ليخصَّ واحداً بعينه بل يصلح إطلاقه على كل واحد على سبيل البدل، نحو «رجل» و«امرأة».\n- **تقريبها**: كل ما صلح دخول الألف واللام عليه، نحو: الرجل والفرس.\n- علامة النكرة: أن تصلح لأن تدخل عليها «أل» وتؤثر فيها التعريف: رجل/الرجل، غلام، جارية، صبي، فتاة، معلم.\n\n## باب العطف (ص124-125)\n- العطف لغةً: المَيْل؛ تقول: عَطَفَ فلانٌ على فلانٍ، أي مال إليه وأَشْفَقَ عليه.\n- وفي الاصطلاح **قسمان**:\n  1. **عطف البيان**: التابع الجامد المُوَضِّح لمتبوعه في المعارف، المُخَصِّص له في النكرات. مثاله في المعارف: «جاءَني محمدٌ أبوكَ». ومثاله في النكرات: ﴿مِن مَّاءٍ صَدِيدٍ﴾ (صديد عطف بيان على ماء، وكلاهما نكرة).\n  2. **عطف النسق**: التابع الذي يتوسَّط بينه وبين متبوعه أحدُ الحروف العشرة.\n- **حروف العطف عشرة**: الواو، والفاء، وثُمَّ، وأَوْ، وأَمْ، وإمَّا، وبَلْ، ولا، ولكنْ، وحتى (في بعض المواضع).\n  - **الواو**: لمطلق الجمع؛ يُعطف بها المتقارنان «جاء محمدٌ وعليٌّ» إذا كان مجيئهما معاً، ويُعطف بها السابق على المتأخر «جاء عليٌّ ومحمودٌ»، والمتأخر على السابق «جاء عليٌّ ومحمد».\n\n# ملخص النحو — التحفة السنية (ص126-183)\n\n## معاني حروف العطف (تتمة)\n- **الفاء**: للترتيب والتعقيب. الترتيب: أن الثاني بعد الأول. التعقيب: أنه عقيبه بلا مُهلة. مثال: «قدِم الفرسانُ فالمُشاةُ».\n- **ثُمَّ**: للترتيب مع التراخي (أن بين الأول والثاني مُهلة). مثال: «أرسل الله موسى ثم عيسى ثم محمداً عليهم الصلاة والسلام».\n- **أو**: للتخيير أو الإباحة. الفرق: التخيير لا يجوز معه الجمع (تزوّج هنداً أو أختَها)، والإباحة يجوز معها الجمع (ادرُس الفقهَ أو النحوَ).\n- **أم**: لطلب التعيين بعد همزة الاستفهام، نحو: «أدرستَ الفقهَ أم النحوَ؟».\n- **إمّا**: بشرط أن تُسبق بمثلها، وهي مثل «أو» في المعنيين. ﴿فَشُدُّوا الوَثَاقَ فَإِمَّا مَنًّا بَعْدُ وَإِمَّا فِدَاءً﴾، ونحو: «تزوّج إمّا هنداً وإمّا أختَها».\n- **بل**: للإضراب، ومعناها جعل ما قبلها في حكم المسكوت عنه، نحو: «ما جاء محمدٌ بل بكرٌ». شرطاها: أن يكون المعطوف بها مفرداً لا جملة، وألا يسبقها استفهام.\n- **لا**: تنفي عما بعدها نفس الحكم الذي ثبت لما قبلها، نحو: «جاء بكرٌ لا خالدٌ».\n- **لكنْ**: تدل على تقرير حكم ما قبلها وإثبات ضدّه لما بعدها، نحو: «لا أحبُّ الكسالى لكنِ المجتهدين». شروطها: أن يسبقها نفي أو نهي، وأن يكون المعطوف بها مفرداً، وألا تسبقها الواو.\n- **حتى**: للتدريج والغاية، والتدريج: الدلالة على انقضاء الحكم شيئاً فشيئاً، نحو: «يموت الناسُ حتى الأنبياءُ». وتأتي «حتى» ابتدائية غير عاطفة إذا كان ما بعدها جملة (جاء أصحابنا حتى خالدٌ حاضرٌ)، وتأتي جارّة نحو ﴿حَتَّى مَطْلَعِ الفَجْرِ﴾؛ ولهذا قال المؤلف: «وحتى في بعض المواضع».\n\n## حكم حروف العطف\nهذه الأحرف العشرة تجعل ما بعدها تابعاً لما قبلها في حكمه الإعرابي:\n- عطفٌ على مرفوع ⟵ رفع: «قابلني محمدٌ وخالدٌ».\n- على منصوب ⟵ نصب: «قابلتُ محمداً وخالداً».\n- على مخفوض ⟵ خفض: «مررتُ بمحمدٍ وخالدٍ».\n- على مجزوم ⟵ جزم: «لم يحضُر خالدٌ أو يُرسِلْ رسولاً» (يرسل: مجزوم بالسكون).\nوالاسم يُعطف على الاسم، والفعل يُعطف على الفعل.\n\n### من تدريب الإعراب (ص129-130)\n- «ما رأيتُ محمداً لكنْ وكيلَه»: لكنْ حرف عطف، وكيل معطوف على محمد منصوب بالفتحة الظاهرة، والهاء مضاف إليه مبني على الضم في محل جر.\n- «زارنا أخوك وصديقُه»: أخو فاعل مرفوع بالواو لأنه من الأسماء الخمسة، صديق معطوف على أخو مرفوع بالضمة.\n- «أخي يأكل ويشرب كثيراً»: أخي مبتدأ مرفوع بضمة مقدّرة منع من ظهورها اشتغال المحل بحركة المناسبة، والجملة من الفعل والفاعل في محل رفع خبر المبتدأ، يشرب معطوف على يأكل مرفوع، كثيراً مفعول به ليأكل منصوب.\n\n## التوكيد وأنواعه وحكمه\n- قال المصنف: «التوكيدُ تابعٌ للمؤكَّدِ في رفعِه ونصبِه وخفضِه وتعريفِه».\n- معناه في اللغة: **التقوية** (أكّدتُ الشيء ووكّدتُه؛ إذا قوّيتَه).\n- وهو نوعان:\n  1. **التوكيد اللفظي**: تكرير اللفظ بعينه أو إعادته بمرادفه؛ اسماً (جاء محمدٌ محمدٌ)، أو فعلاً (جاء جاء محمدٌ)، أو حرفاً (نَعَمْ نَعَمْ جاء محمدٌ)، ونحو (جاء حضَر أبو بكرٍ).\n  2. **التوكيد المعنوي**: «التابع الذي يرفع احتمال السهو أو التجوّز في المتبوع»؛ فلو قلتَ «جاء الأمير» احتُمل أنك سهوتَ أو توسّعتَ في الكلام وأن الجائي رسولُه، فإذا قلت «جاء الأميرُ نفسُه» أو «عينُه» ارتفع الاحتمال.\n- **حكمه**: يوافق متبوعه في إعرابه: مرفوع (حضَر خالدٌ نفسُه)، منصوب (حفظتُ القرآنَ كلَّه)، مخفوض (تدبّرتُ في الكتابِ كلِّه)، ويتبعه في تعريفه أيضاً.\n\n### ألفاظ التوكيد المعنوي\nالنفسُ، والعينُ، وكلٌّ، وأجمعُ، وتوابعُ أجمعَ وهي: أكتعُ، وأبتعُ، وأبصعُ. تقول: قام زيدٌ نفسُه، ورأيتُ القومَ كلَّهم، ومررتُ بالقومِ أجمعين.\n- **شرط النفس والعين**: أن يضاف كل منهما إلى ضمير عائد على المؤكَّد.\n  - المؤكَّد مفرد ⟵ الضمير ولفظ التوكيد مفردان: «جاء عليٌّ نفسُه»، «حضَر بكرٌ عينُه».\n  - المؤكَّد جمع ⟵ الضمير ضمير الجمع ولفظ التوكيد مجموع: «جاء الرجالُ أنفسُهم»، «حضَر الكُتّابُ أعينُهم».\n  - المؤكَّد مثنى ⟵ الأفصح أن يكون الضمير مثنى ولفظ التوكيد مجموعاً: «حضَر الرجلان أنفسُهما»، «جاء الكاتبان أعينُهما».\n- **كلٌّ ومثلها جميعٌ**: يشترط إضافتهما إلى ضمير مطابق للمؤكَّد: «جاء الجيشُ كلُّه»، «حضَر الرجالُ جميعُهم».\n- **أجمعُ**: لا يؤكَّد به غالباً إلا بعد «كلٍّ»؛ ومن الغالب ﴿فَسَجَدَ المَلائِكَةُ كُلُّهُمْ أَجْمَعُونَ﴾، ومن غير الغالب قول الراجز: «إذا ظَلِلْتُ الدَّهرَ أبكي أَجْمَعا».\n- **أكتع وأبتع وأبصع**: تُجاء بها بعد «أجمع» لزيادة التقوية، ولا يؤكَّد بها استقلالاً: «جاء القومُ أجمعون، أكتعون، أبتعون، أبصعون».\n\n### من تدريب الإعراب على التوكيد (ص133-134)\n- «قرأتُ الكتابَ كلَّه»: كل توكيد للكتاب، وتوكيد المنصوب منصوب بالفتحة الظاهرة، وكل مضاف والهاء مضاف إليه في محل خفض.\n- «زارنا الوزيرُ نفسُه»: نفس توكيد للوزير، وتوكيد المرفوع مرفوع بالضمة الظاهرة.\n- «سلّمتُ على أخيك عينِه»: أخي مخفوض بعلى وعلامة خفضه الياء نيابة عن الكسرة لأنه من الأسماء الخمسة، عين توكيد لأخي، وتوكيد المخفوض مخفوض بالكسرة الظاهرة.\n- «جاء رجالُ الجيشِ كلُّهم أجمعون»: كل توكيد لرجال مرفوع بالضمة، أجمعون توكيد ثانٍ مرفوع بالواو نيابة عن الضمة لأنه جمع مذكر سالم.\n\n## البدل وحكمه وأنواعه\n- قال المصنف: «إذا أُبدل اسمٌ من اسمٍ أو فعلٌ من فعلٍ تبعه في جميع إعرابه».\n- معناه في اللغة: **العِوَض**. واصطلاحاً: «التابع المقصود بالحكم بلا واسطة».\n- **حكمه**: يتبع المبدل منه في إعرابه:\n  - مرفوع: «حضَر إبراهيمُ أبوك».\n  - منصوب: «قابلتُ إبراهيمَ أخاك».\n  - مخفوض: «أعجبتني أخلاقُ محمدٍ خالِك».\n  - مجزوم (بدل فعل من فعل): «مَن يشكُرْ ربَّه يسجُدْ له يفُزْ».\n\n### أنواع البدل الأربعة\n1. **بدل الكل من الكل** (البدل المطابق): أن يكون البدل عينَ المبدل منه، نحو: «زارني محمدٌ عمُّك».\n2. **بدل البعض من الكل**: أن يكون البدل جزءاً من المبدل منه، أقلَّ من الباقي أو مساوياً أو أكثر، نحو: «حفظتُ القرآنَ ثلثَه أو نصفَه أو ثُلُثَيه». ويجب فيه أن يضاف إلى ضمير عائد إلى المبدل منه.\n3. **بدل الاشتمال**: أن يكون بين البدل والمبدل منه ارتباط بغير الكلية والجزئية، ويجب فيه أيضاً إضافة البدل إلى ضمير عائد، نحو: «أعجبتني الجاريةُ حديثُها»، «نفعني الأستاذُ حسنُ أخلاقِه».\n4. **بدل الغلط**، وهو ثلاثة أضرب:\n   - **بدل البَداء**: أن تقصد شيئاً فتقوله ثم يظهر لك أن غيره أفضل منه فتعدل إليه: «هذه الجارية بدرٌ... شمسٌ».\n   - **بدل النسيان**: أن تبني كلامك على ظنّ ثم تعلم خطأه فتعدل عنه: رأيتَ شبحاً فظننتَه إنساناً فقلت «رأيت إنساناً» ثم قرب منك فوجدتَه فرساً فقلت «فرساً».\n   - **بدل الغلط المحض**: أن تريد كلاماً فيسبق لسانك إلى غيره وبعد النطق تعدل إلى ما أردتَ أولاً، نحو: «رأيتُ محمداً الفرسَ».\n- ومن أمثلة المصنف: «قام زيدٌ أخوك، وأكلتُ الرغيفَ ثُلُثَه، ونفعني زيدٌ علمُه، ورأيتُ زيداً الفرسَ».\n\n## منصوبات الأسماء وعددها\nقال المصنف: «المنصوباتُ خمسةَ عشرَ، وهي: المفعولُ به، والمصدرُ، وظرفُ الزمانِ، وظرفُ المكانِ، والحالُ، والتمييزُ، والمستثنى، واسمُ لا، والمنادى، والمفعولُ من أجلِه، والمفعولُ معه، وخبرُ كانَ وأخواتِها، واسمُ إنَّ وأخواتِها، والتابعُ للمنصوب، وهو أربعةُ أشياء: النعتُ، والعطفُ، والتوكيدُ، والبدلُ».\nأمثلتها على الترتيب (كما مثّل الشارح):\n1. مفعول به: ﴿إِنَّا أَرْسَلْنَا نُوحاً﴾.\n2. مصدر: «جَذِلَ محمدٌ جَذَلاً».\n3. ظرف مكان/زمان: «جلستُ أمامَ الأستاذِ»، «حضَر أبي يومَ الخميسِ».\n4. حال: ﴿فَتَبَسَّمَ ضَاحِكاً﴾.\n5. تمييز: «تصبّبَ زيدٌ عَرَقاً».\n6. مستثنى: «حضَر القومُ إلا محمداً».\n7. اسم لا النافية: «لا طالبَ علمٍ مذمومٌ».\n8. منادى: «يا رسولَ اللهِ».\n9. مفعول لأجله: «عنّفَ الأستاذُ التلميذَ تأديباً».\n10. مفعول معه: «ذاكرتُ والمصباحَ».\n11. خبر كان / اسم إنّ: «كان إبراهيمُ صديقاً لعليٍّ»، «ليت محمداً يزورنا».\n12. نعت لمنصوب: «صاحبتُ محمداً الفاضلَ».\n13. معطوف على منصوب: «ضرَب خالدٌ عمراً وبكراً».\n14. توكيد لمنصوب: «حفظتُ القرآنَ كلَّه».\n15. بدل من منصوب: ﴿قُمِ اللَّيْلَ إِلَّا قَلِيلاً · نِصْفَهُ أَوِ انقُصْ مِنْهُ قَلِيلاً﴾.\n\n## المفعول به\n- تعريف المصنف: «هو الاسمُ المنصوبُ الذي يقعُ عليه الفعلُ»، نحو: ضربتُ زيداً، وركبتُ الفرسَ.\n- يشترط لإطلاقه اجتماع ثلاثة أمور:\n  1. أن يكون **اسماً** (لا فعلاً ولا حرفاً).\n  2. أن يكون **منصوباً** (لا مرفوعاً ولا مجروراً).\n  3. أن يكون **فعل الفاعل قد وقع عليه**، والمراد بوقوعه عليه تعلُّقه به، ثبوتاً (فهمتُ الدرسَ) أو نفياً (لم أفهمِ الدرسَ).\n\n### أنواع المفعول به: ظاهر ومضمَر\n- **الظاهر**: ما يدل على معناه بدون احتياج إلى قرينة تكلم أو خطاب أو غيبة؛ نحو: «ضرَب محمدٌ بكراً»، «يضرب خالدٌ عمراً»، «قطفَ إسماعيلُ زهرةً».\n- **المضمَر**: ما لا يدل على معناه إلا بقرينة من هذه الثلاث، وهو قسمان:\n  - **متصل**: ما لا يُبتدأ به الكلام ولا يصح وقوعه بعد «إلا» في الاختيار، وله **اثنا عشر لفظاً**: ضربني، ضربنا، ضربكَ، ضربكِ، ضربكما، ضربكم، ضربكنّ، ضربه، ضربها، ضربهما، ضربهم، ضربهنّ.\n    - الياء: للمتكلم الواحد، ويجب الفصل بينها وبين الفعل بـ**نون الوقاية**: «أطاعني محمدٌ».\n    - نا: للمتكلم المعظِّم نفسَه أو معه غيره: «أطاعَنا أبناؤنا».\n    - الكاف المفتوحة: للمخاطب المفرد المذكر؛ المكسورة: للمخاطبة المفردة المؤنثة؛ مع الميم والألف: للمثنى المخاطب مطلقاً؛ مع الميم وحدها: لجماعة الذكور المخاطبين؛ مع النون المشددة: لجماعة الإناث المخاطبات.\n    - الهاء المضمومة: للغائب المفرد المذكر؛ مع الألف: للغائبة المفردة؛ مع الميم والألف: للمثنى الغائب مطلقاً؛ مع الميم وحدها: لجماعة الذكور الغائبين؛ مع النون المشددة: لجماعة الإناث الغائبات.\n  - **منفصل**: ما يُبتدأ به الكلام ويصح وقوعه بعد «إلا» في الاختيار، وله **اثنا عشر لفظاً**: إيّايَ، إيّانا، إيّاكَ، إيّاكِ، إيّاكما، إيّاكم، إيّاكنّ، إيّاه، إيّاها، إيّاهما، إيّاهم، إيّاهنّ.\n- **والصحيح**: أن الضمير هو «إيّا» وأن ما بعده لواحقُ تدل على التكلم أو الخطاب أو الغيبة؛ نحو: «إيّايَ أطاعَ التلاميذُ»، «ما أطاعَ التلاميذُ إلا إيّايَ»، ومنه ﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾، ﴿أَمَرَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ﴾.\n\n## المصدر (المفعول المطلق)\n- تعريف المصنف: «المصدرُ هو الاسمُ المنصوبُ الذي يجيء ثالثاً في تصريف الفعل»، نحو: ضرَبَ يضرِبُ ضَرْباً.\n- والمقصود هنا معرفة **المفعول المطلق**، وهو: «ما ليس خبراً من المصادر، مما دلّ على تأكيد عامله، أو نوعِه، أو عَدَدِه». وقيد «ليس خبراً» مُخرِج للمصدر الواقع خبراً نحو: «فهمُك فهمٌ دقيقٌ».\n- **أنواعه باعتبار المعنى ثلاثة**:\n  1. **المؤكِّد لعامله**: «حفظتُ الدرسَ حفظاً»، «فرحتُ بقدومك جَذَلاً».\n  2. **المبيّن لنوع العامل**: «أحببتُ أستاذي حُبَّ الولدِ أباه»، «وقفتُ للأستاذِ وقوفَ المؤدَّب».\n  3. **المبيّن للعدد**: «ضربتُ الكسولَ ضربتين»، «ضربتُه ثلاثَ ضرباتٍ».\n- **وأقسامه من جهة موافقة عامله قسمان**:\n  1. **لفظي**: ما وافق الفعلَ الناصبَ له في لفظه (مشتملاً على حروفه) ومعناه: «قعدتُ قعوداً»، «ضربتُه ضَرْباً»، «ذهبتُ ذَهاباً».\n  2. **معنوي**: ما وافق الفعلَ في معناه ولا يوافقه في حروفه: «جلستُ قُعوداً»، «فرحتُ جَذَلاً»، «ضربتُه لَكْماً»، «أهنتُه احتقاراً»، «قمتُ وقوفاً».\n\n## ظرف الزمان وظرف المكان\n- قال المصنف: «ظرفُ الزمانِ هو اسمُ الزمانِ المنصوبُ بتقدير «في»»، نحو: اليوم، والليلة، وغَدْوة، وبُكْرة، وسَحَراً، وغداً، وعَتَمة، وصباحاً، ومساءً، وأبداً، وأمداً، وحيناً، وما أشبه ذلك.\n- **الظرف** في اللغة: الوِعاء، والمراد به عند النحاة: **المفعول فيه**، وهو نوعان: ظرف زمان وظرف مكان.\n- **ظرف الزمان**: الاسم الدال على الزمان، المنصوب باللفظ الدال على المعنى الواقع فيه، بملاحظة معنى «في» الدالة على الظرفية؛ نحو: «صمتُ يومَ الاثنين» (أي: الصيام حدث في اليوم المذكور)، بخلاف «يخاف الكسولُ يومَ الامتحانِ» فمعناه أنه يخاف نفسَ اليوم، لا أنه يخاف شيئاً واقعاً فيه.\n- **اسم الزمان قسمان**:\n  - **مختصّ**: ما دلّ على مقدار معين محدود، مثل: الشهر، والسنة، واليوم، والعام، والأسبوع.\n  - **مبهم**: ما دلّ على مقدار غير معين ولا محدود، مثل: اللحظة، والوقت، والزمان، والحين.\n  وكلاهما يجوز انتصابه على أنه مفعول فيه.\n- من ألفاظ الزمان التي ذكرها المؤلف اثنا عشر لفظاً، منها: **اليوم** (من طلوع الفجر إلى غروب الشمس): «صمتُ اليومَ»، «صمتُ يومَ الخميسِ»، **الليلة** (من غروب الشمس إلى طلوع الفجر).\n\n### ألفاظ ظرف الزمان الاثنا عشر (تتمة)\n- **اليوم**: من طلوع الفجر إلى غروب الشمس. **الليلة**: من غروب الشمس إلى طلوع الفجر («اعتكفتُ الليلةَ البارحةَ»).\n- **غُدْوة**: ما بين صلاة الصبح وطلوع الشمس («زارني صديقي غُدوةَ الأحدِ»).\n- **بُكْرة**: أول النهار («أزورك بُكرةَ السبتِ»).\n- **سَحَراً**: آخر الليل قُبيل الفجر («ذاكرتُ درسي سَحَراً»).\n- **غداً**: اسم لليوم الذي بعد يومك («إذا جئتني غداً أكرمتُك»).\n- **عَتَمة**: اسم لثلث الليل الأول («سأزورك عَتَمةً»).\n- **صباحاً**: اسم للوقت الذي يبتدئ من أول نصف الليل الثاني إلى الزوال.\n- **مساءً**: اسم للوقت الذي يبتدئ من الزوال إلى نصف الليل.\n- **أبداً** و**أمداً**: للزمان المستقبل الذي لا غاية لانتهائه («لا أصحبُ الأشرارَ أبداً»).\n- **حيناً**: اسم لزمان مبهم غير معلوم الابتداء ولا الانتهاء («صاحبتُ عليّاً حيناً من الدهر»).\n- ويُلحق بذلك كل اسم دال على الزمان مختصاً (ضَحْوة، ضُحى) أو مبهماً (وقت، ساعة، لحظة، زمان، بُرهة)، وكلها يجوز نصبها على المفعول فيه.\n\n## ظرف المكان\n- قال المصنف: «ظرفُ المكانِ هو اسمُ المكانِ المنصوبُ بتقديرِ «في»»، نحو: أمامَ، وخلفَ، وقُدّامَ، ووراءَ، وفوقَ، وتحتَ، وعندَ، ومعَ، وإزاءَ، وحِذاءَ، وتِلقاءَ، وثَمَّ، وهُنا.\n- تعريفه: «الاسم الدال على المكان، المنصوب باللفظ الدال على المعنى الواقع فيه، بملاحظة معنى «في» الدالة على الظرفية».\n- وهو قسمان:\n  - **مختصّ**: ما له صورة وحدود محصورة، مثل: الدار، والمسجد، والحديقة، والبستان.\n  - **مبهم**: ما ليس له صورة ولا حدود محصورة، مثل: وراء، وأمام.\n- **ولا ينتصب على الظرفية إلا المبهم**؛ وأما المختص فيجب جرُّه بحرف جر يدل على المراد: «اعتكفتُ في المسجدِ»، «زرتُ عليّاً في دارِه».\n- أمثلة ألفاظ المكان الثلاثة عشر: جلستُ أمامَ الأستاذِ مؤدَّباً، سار المشاةُ خلفَ الرُّكبانِ، مشى الشرطيُّ قُدّامَ الأميرِ، وقف المصلّون بعضُهم وراءَ بعضٍ، جلستُ فوقَ الكرسيِّ، وقف القِطُّ تحتَ المائدةِ، لمحمدٍ منزلةٌ عندَ الأستاذِ، سار معَ سليمانَ أخوه، لنا دارٌ إزاءَ النيلِ، جلس أخي حِذاءَ أخيك، جلس أخي تِلقاءَ دارِ أخيك، ﴿وأزلَفْنا ثَمَّ الآخَرينَ﴾، جلس محمدٌ هُنا لحظةً. ومثلُها كل ما دلّ على مكان مبهم نحو: يمين، وشمال.\n\n## الحال\n- قال المصنف: «الحالُ هو الاسمُ المنصوبُ المفسِّرُ لما انبهمَ من الهيئاتِ»، نحو: جاء زيدٌ راكباً، وركبتُ الفرسَ مُسرَجاً، ولقيتُ عبدَ اللهِ راكباً.\n- **لغةً**: ما عليه الإنسان من خير أو شر. **اصطلاحاً**: «الاسم، الفضلة، المنصوب، المفسِّر لما انبهم من الهيئات».\n  - «الاسم» يشمل الصريح (جاء محمدٌ ضاحكاً) والمؤوَّل بالصريح (جاء محمدٌ يضحكُ).\n  - «الفضلة» أخرجت الخبر (لأنه جزء من الكلام).\n  - «المنصوب» أخرج المرفوع والمجرور.\n- **ناصبها**: الفعل أو شبهه (اسم الفاعل، المصدر، الظرف، اسم الإشارة).\n- تأتي الحال: بياناً لصفة **الفاعل** (جاء عبد الله راكباً)، أو لصفة **المفعول به** (ركبتُ الفرسَ مُسرَجاً)، أو محتملة للأمرين (لقيتُ عبدَ اللهِ راكباً)، ومن **الخبر** (أنت صديقي مُخلِصاً)، ومن **المجرور بالحرف** (مررتُ بهندٍ راكبةً)، ومن **المجرور بالإضافة** ﴿أنِ اتّبِعْ مِلّةَ إبراهيمَ حَنيفاً﴾.\n- **شروط الحال وصاحبها** (قال المصنف): «ولا يكون إلا نكرة، ولا تكون إلا بعد تمام الكلام، ولا يكون صاحبها إلا معرفة».\n  - فإن جاءت معرفةً في الظاهر وجب تأويلها بنكرة: «جاء الأميرُ وحدَه» أي منفرداً، «أرسلَها العِراكَ» أي مُعتَرِكةً، «جاؤوا الأولَ فالأولَ» أي مُترتِّبين.\n  - الأصل مجيئها بعد استيفاء الكلام (أي أن يأخذ الفعل فاعله والمبتدأ خبره)، **ويجب تقديمها** إذا كانت اسم استفهام: «كيفَ قَدِمَ عليٌّ؟».\n  - **مسوّغات مجيء الحال من النكرة**: تقدّم الحال عليها (لِمَيّةَ موحشاً طَلَلُ)، أو تخصيص النكرة بإضافة ﴿في أربعةِ أيامٍ سَواءً﴾ أو بوصف.\n- **من تدريب الإعراب**: «لقيتني هندٌ باكيةً» — باكية: حال مبيّن لهيئة الفاعل منصوب بالفتحة. «لبستُ الثوبَ جديداً» — جديداً: حال مبيّن لهيئة المفعول به منصوب بالفتحة.\n\n## التمييز\n- قال المصنف: «التمييزُ هو الاسمُ المنصوبُ المفسِّرُ لما انبهمَ من الذواتِ»، نحو: تصبّبَ زيدٌ عَرَقاً، وتفقّأ بكرٌ شَحْماً، وطاب محمدٌ نفساً، واشتريتُ عشرينَ غلاماً، وملكتُ تسعينَ نعجةً، وزيدٌ أكرمُ منك أباً، وأجملُ منك وجهاً.\n- **لغةً**: التفسير مطلقاً (ميّزت كذا: فسّرته)، وفَصْلُ بعض الأمور عن بعض (ميّزتُ القومَ).\n- **اصطلاحاً**: «الاسم، الصريح، المنصوب، المفسِّر لما انبهم من الذوات أو النِّسَب». وقيد «الصريح» لإخراج الاسم المؤوَّل؛ فالتمييز لا يكون جملة ولا ظرفاً، بخلاف الحال.\n- **نوعاه**:\n  1. **تمييز الذات (تمييز المفرد)**: ما رفع إبهام اسم مذكور قبله مُجمَل الحقيقة، ويكون بعد **العدد** ﴿إني رأيتُ أحدَ عشرَ كوكباً﴾، ﴿إنّ عدّةَ الشهورِ عند اللهِ اثنا عشرَ شهراً﴾، أو بعد **المقادير**: الموزونات (اشتريتُ رِطلاً زيتاً)، المكيلات (اشتريتُ إردبّاً قمحاً)، المساحات (اشتريتُ فَدّاناً أرضاً).\n  2. **تمييز النسبة (تمييز الجملة)**: ما رفع إبهام نسبة في جملة سابقة عليه، وهو ضربان:\n     - **محوَّل**، وأنواعه ثلاثة: محوَّل عن الفاعل (تفقّأ زيدٌ شَحْماً؛ أصله: تفقّأ شحمُ زيدٍ)، ومحوَّل عن المفعول ﴿وفجّرنا الأرضَ عُيوناً﴾ (أصله: وفجّرنا عيونَ الأرضِ)، ومحوَّل عن المبتدأ ﴿أنا أكثرُ منك مالاً﴾ (أصله: مالي أكثرُ من مالِك).\n     - **غير محوَّل**: نحو «امتلأ الإناءُ ماءً».\n- **شروط التمييز** (قال المصنف): «ولا يكون إلا نكرة، ولا يكون إلا بعد تمام الكلام». ولا يجوز تقدّمه على عامله، بل لا يجيء إلا بعد استيفاء الفعل فاعله والمبتدأ خبره.\n- **من تدريب الإعراب**: «محمدٌ أكرمُ من خالدٍ نفساً» — نفساً: تمييز نسبة محوَّل عن المبتدأ منصوب بالفتحة. «عندي عشرون ذراعاً حريراً» — عشرون: مبتدأ مؤخر مرفوع بالواو لأنه ملحق بجمع المذكر السالم، ذراعاً: تمييز لعشرين منصوب، حريراً: تمييز لذراع منصوب.\n\n## الاستثناء\n- قال المصنف: «وحروفُ الاستثناءِ ثمانيةٌ، وهي: إلّا، وغيرُ، وسِوى، وسُوى، وسَواءٌ، وخلا، وعدا، وحاشا».\n- **لغةً**: مطلق الإخراج. **اصطلاحاً**: «الإخراج بإلا أو إحدى أخواتها، لشيء لولا ذلك الإخراج لكان داخلاً فيما قبل الأداة»؛ مثاله: «نجح التلاميذُ إلا عامراً».\n- **أدواته على ثلاثة أنواع**:\n  1. ما يكون **حرفاً دائماً**: «إلّا».\n  2. ما يكون **اسماً دائماً**، وهي أربع: سِوى (بالقصر وكسر السين)، وسُوى (بالقصر وضم السين)، وسَواء (بالمد وفتح السين)، وغير.\n  3. ما يكون **حرفاً تارة وفعلاً تارة**: خلا، وعدا، وحاشا.\n\n### حكم المستثنى بـ«إلّا» (ثلاثة أحوال)\n1. **وجوب النصب**: إذا كان الكلام تاماً موجَباً: «قام القومُ إلا زيداً»، «خرج الناسُ إلا عمراً».\n   - التام: ما ذُكر فيه المستثنى منه. الناقص: ما لم يُذكر فيه. الموجَب: ما لم يسبقه نفي أو شبهه (النهي والاستفهام). المنفي: ما سبقه أحد هذه الأشياء.\n2. **جواز الإتباع على البدلية مع جواز النصب على الاستثناء**: إذا كان الكلام تاماً منفياً: «ما قام القومُ إلا زيدٌ» (بالرفع على البدل، وهو الأرجح)، ويجوز «إلا زيداً» على قلة.\n3. **وجوب إجرائه على حسب العامل المذكور قبل إلّا**: إذا كان الكلام ناقصاً (ولا يكون حينئذ إلا منفياً): «ما قام إلا زيدٌ» (رفع على الفاعلية)، «ما ضربتُ إلا زيداً» (نصب على المفعولية)، «ما مررتُ إلا بزيدٍ» (جر بالحرف).\n\n### المستثنى بغير وأخواتها\n- قال المصنف: «والمستثنى بسِوى وسُوى وسَواءٍ وغيرٍ مجرورٌ لا غيرُ».\n- الاسم الواقع بعد هذه الأدوات الأربع **يجب جرّه بإضافة الأداة إليه**، وأما الأداة نفسها فتأخذ حكم الاسم الواقع بعد «إلا» على التفصيل السابق:\n  - تام موجَب ⟵ نصبها وجوباً: «قام القومُ غيرَ زيدٍ».\n  - تام منفي ⟵ إتباعها لما قبلها أو نصبها: «ما يزورني أحدٌ غيرُ الأخيارِ» أو «غيرَ الأخيارِ».\n  - ناقص منفي ⟵ على حسب العوامل: «لا تتصل بغيرِ الأخيارِ».\n\n### المستثنى بخلا وعدا وحاشا\n- قال المصنف: «والمستثنى بخلا وعدا وحاشا يجوز نصبُه وجرُّه»، نحو: «قام القومُ خلا زيداً، وزيدٍ»، و«عدا عمراً وعمرٍو»، و«حاشا بكراً وبكرٍ».\n- **السر في ذلك**: أن هذه الأدوات تستعمل أفعالاً تارة وحروفاً تارة؛ فإن قدّرتها أفعالاً نصبتَ ما بعدها على المفعولية والفاعل ضمير مستتر وجوباً، وإن قدّرتها حروفاً خفضتَ ما بعدها على الجر بها.\n- **محل التردد** إذا لم تتقدم عليهن «ما» المصدرية؛ فإن تقدمت **وجب النصب**، لأن «ما» المصدرية لا تدخل إلا على الأفعال: «قام القومُ ما خلا زيداً».\n\n## «لا» النافية للجنس (شروط إعمالها عمل إنّ)\n- قال المصنف: «اعلمْ أن «لا» تنصبُ النكراتِ بغير تنوين إذا باشرتِ النكرةَ ولم تتكرر «لا»»، نحو: «لا رجلَ في الدارِ».\n- **تعمل عمل «إنّ»** فتنصب الاسم لفظاً أو محلاً وترفع الخبر، **بأربعة شروط**:\n  1. أن يكون اسمها نكرة.\n  2. أن يكون اسمها متصلاً بها (غير مفصول عنها ولو بالخبر).\n  3. أن يكون خبرها نكرة أيضاً.\n  4. ألا تتكرر «لا».\n- **أنواع اسم «لا» ثلاثة**:\n  - **المفرد**: ما ليس مضافاً ولا شبيهاً بالمضاف (ويدخل فيه المثنى وجمع التكسير وجمع المذكر السالم وجمع المؤنث السالم). وحكمه: **يُبنى على ما يُنصب به**: «لا رجلَ في الدار» (على الفتح)، «لا رجلَينِ في الدار» (على الياء)، «لا صالحاتِ اليومَ» (على الكسرة).\n  - **المضاف**: يُنصب بالفتحة الظاهرة أو ما ناب عنها: «لا طالبَ علمٍ ممقوتٌ».\n  - **الشبيه بالمضاف**: «ما اتصل به شيء من تمام معناه»، ومثل المضاف في الحكم: «لا مستقيماً حالُه بين الناس».\n- **إذا اختلّ شرط**:\n  - وقع بعدها معرفة ⟵ **وجب الإلغاء والتكرار**: «لا محمدٌ زارني ولا بكرٌ».\n  - فُصل بينها وبين اسمها فاصل ⟵ وجب الإلغاء والتكرار: ﴿لا فيها غَوْلٌ ولا هم عنها يُنزَفون﴾ (غَوْل: مبتدأ مؤخر، فيها: خبر مقدم، ولا: نافية مهملة).\n  - **تكررت «لا»** مع استيفاء بقية الشروط ⟵ **يجوز الإعمال والإهمال**: «لا رجلَ في الدار ولا امرأةَ» (إعمال)، «لا رجلٌ في الدارِ ولا امرأةٌ» (إهمال).\n\n## المنادى\n- قال المصنف: «المنادى خمسةُ أنواع: المفردُ العَلَم، والنكرةُ المقصودةُ، والنكرةُ غيرُ المقصودة، والمضافُ، والشبيهُ بالمضاف».\n- **لغةً**: المطلوب إقباله مطلقاً. **اصطلاحاً**: «المطلوب إقباله بـ«يا» أو إحدى أخواتها».\n- **أخوات «يا»**: الهمزة (أزيدُ أقبِلْ)، وأيْ (أيْ إبراهيمُ تفهّمْ)، وأيا (أيا شَجَرَ الخابورِ...)، وهيا (هيا محمدُ تعالَ).\n- **أنواعه**:\n  1. **المفرد العَلَم**: يا محمدُ، يا فاطمةُ، يا محمدانِ، يا فاطمتانِ، يا محمدونَ، يا فاطماتُ.\n  2. **النكرة المقصودة**: التي يُقصد بها واحد معين مما يصح إطلاق لفظها عليه: «يا ظالمُ» تريد واحداً بعينه.\n  3. **النكرة غير المقصودة**: التي يقصد بها واحد غير معين: قول الواعظ «يا غافلاً تنبّهْ».\n  4. **المضاف**: «يا طالبَ العلمِ اجتهدْ».\n  5. **الشبيه بالمضاف**: ما اتصل به شيء من تمام معناه، مرفوعاً (يا حميداً فعلُه)، أو منصوباً (يا حافظاً درسَه)، أو مجروراً بحرف يتعلق به (يا محبّاً للخيرِ).\n- **حكم المنادى**: «فأما المفردُ العَلَم والنكرةُ المقصودةُ فيُبنيان على الضم من غير تنوين، نحو: يا زيدُ ويا رجلُ، والثلاثةُ الباقيةُ منصوبةٌ لا غير».\n  - يُبنى على ما يُرفع به: على الضمة (يا محمدُ، يا رجلُ، يا فاطماتُ)، وعلى الألف في المثنى (يا محمدانِ، يا فاطمتانِ)، وعلى الواو في جمع المذكر السالم (يا محمدونَ).\n  - وينصب بالفتحة أو ما ناب عنها في: النكرة غير المقصودة (يا جاهلاً تعلّمْ، يا كسولاً أقبِلْ على ما ينفعُك)، والمضاف (يا راغبَ المجدِ اعملْ له، يا محبَّ الرفعةِ ثابِرْ على السعي)، والشبيه بالمضاف (يا راغباً في السؤددِ لا تَضْجَرْ من العمل، يا حريصاً على الخيرِ استقمْ).\n\n## المفعول لأجله (المفعول من أجله / المفعول له)\n- قال المصنف: «هو الاسمُ المنصوبُ الذي يُذكَر بياناً لسبب وقوع الفعل»، نحو: «قام زيدٌ إجلالاً لعمرٍو»، و«قصدتُك ابتغاءَ معروفِك».\n- تعريفه: «الاسم، المنصوب، الذي يُذكر بياناً لسبب وقوع الفعل»، و«الاسم» يشمل الصريح والمؤوَّل به.\n- **يشترط فيه خمسة أمور**:\n  1. أن يكون **مصدراً**.\n  2. أن يكون **قلبياً**: ألا يكون دالاً على عمل من أعمال الجوارح كاليد واللسان (مثل: قراءة، وضرب).\n  3. أن يكون **علة لما قبله**.\n  4. أن يكون **متحداً مع عامله في الوقت**.\n  5. أن يكون **متحداً مع عامله في الفاعل**.\n  ومثاله المستجمع للشروط: «تأديباً» من «ضربتُ ابني تأديباً».\n- وكل اسم استوفى هذه الشروط يجوز فيه: **النصب**، و**الجر** بحرف من حروف الجر الدالة على التعليل كاللام.\n- **وله ثلاث حالات**:\n  1. **مقترن بأل**: الأكثر جرّه بحرف التعليل ويقلّ نصبه: «ضربتُ ابني للتأديبِ».\n  2. **مضاف**: يجوز الجر والنصب جوازاً متساوياً: «زرتُك محبةَ أدبِك» أو «لمحبةِ أدبِك».\n  3. **مجرد من أل والإضافة**: الأكثر فيه النصب ويقلّ جرّه: «قمتُ إجلالاً للأستاذِ».\n\n## المفعول معه\n- قال المصنف: «هو الاسمُ، المنصوبُ، الذي يُذكَر لبيانِ مَن فُعل معه الفعلُ»، نحو: «جاء الأميرُ والجيشَ»، و«استوى الماءُ والخشبةَ».\n- تعريفه عند النحاة: «الاسم، الفضلة، المنصوب بالفعل أو ما فيه معنى الفعل وحروفه، الدالّ على الذات التي وقع الفعل بمصاحبتها، المسبوق بواو تفيد المعيّة نصّاً».\n\n### تتمة المفعول معه\n- قيود التعريف: «الاسم» يشمل المفرد والمثنى والجمع والمذكر والمؤنث، والمراد الصريح دون المؤوَّل، فخرج الفعل والحرف والجملة. و«الفضلة» أي ليس ركناً في الكلام (فليس فاعلاً ولا مبتدأ ولا خبراً)، فخرجت به العمدة نحو: «اشترك زيدٌ وعمرٌو». و«المنصوب بالفعل أو ما فيه معنى الفعل وحروفه» يدل على أن **العامل فيه ضربان**: الفعل (حضَر الأميرُ والجيشَ)، والاسم الدال على معنى الفعل المشتمل على حروفه كاسم الفاعل (الأميرُ حاضرٌ والجيشَ). و«المسبوق بواو هي نصٌّ في الدلالة على المعيّة» يخرج المسبوق بواو ليست نصّاً في المعيّة، نحو: «حضَر محمدٌ وخالدٌ».\n- **الاسم الواقع بعد الواو نوعان**:\n  1. **ما يتعيّن نصبه على المفعول معه**: إذا لم يصح تشريك ما بعد الواو لما قبلها في الحكم؛ نحو: «أنا سائرٌ والجبلَ»، «ذاكرتُ والمصباحَ»، ومثال المؤلف: «استوى الماءُ والخشبةَ».\n  2. **ما يجوز نصبه وإتباعه لما قبله على العطف**: إذا صح التشريك؛ نحو: «حضَر عليٌّ ومحمدٌ» (يجوز نصب محمد على المعية ورفعه على العطف)، ومثال المؤلف: «جاء الأميرُ والجيشَ».\n- وقال المصنف: «وأما خبرُ كان وأخواتِها واسمُ إنّ وأخواتِها فقد تقدّم ذكرهما في المرفوعات، وكذلك التوابعُ فقد تقدّمتْ هناك».\n\n## المخفوضات من الأسماء\n- قال المصنف: «المخفوضاتُ ثلاثةُ أنواعٍ: مخفوضٌ بالحرفِ، ومخفوضٌ بالإضافةِ، وتابعٌ للمخفوضِ».\n- بيان ذلك: الخافض للاسم إما:\n  1. **حرف** من حروف الخفض: «أشفقتُ على خالدٍ» (خالد مجرور بعلى).\n  2. **إضافة اسم قبله إليه**، ومعنى الإضافة: نسبة الثاني للأول: «جاء غلامُ محمدٍ» (محمد مخفوض بسبب إضافة غلام إليه).\n  3. **تبعيّته لاسم مخفوض**: نعتاً («أخذتُ العلمَ عن محمدٍ الفاضلِ»)، أو معطوفاً عليه («مررتُ بمحمدٍ وخالدٍ»)، أو غير ذلك من التوابع.\n\n### أولاً: المخفوض بالحرف ومعاني حروف الخفض\nقال المصنف: «فأما المخفوضُ بالحرف فهو: ما يُخفض بمِن، وإلى، وعن، وعلى، وفي، ورُبّ، والباءِ، والكافِ، واللامِ، وحروفِ القسم وهي: الواوُ، والباءُ، والتاءُ، أو بواوِ رُبّ، وبمُذْ، ومُنذُ».\n- **مِن**: من معانيها **الابتداء**، وتجرّ الظاهر والمضمر ﴿ومنكَ ومِن نوحٍ﴾.\n- **إلى**: من معانيها **الانتهاء**، وتجرّ الظاهر والمضمر ﴿إليه يُرَدُّ عِلْمُ الساعةِ﴾، ﴿إلى اللهِ مَرْجِعُكم جميعاً﴾.\n- **عن**: من معانيها **المجاوزة**، وتجرّ الظاهر والضمير ﴿لقد رضي اللهُ عن المؤمنين﴾، ﴿رضي اللهُ عنهم ورضوا عنه﴾.\n- **على**: من معانيها **الاستعلاء**، وتجرّ الظاهر والمضمر ﴿وعليها وعلى الفُلْكِ تُحمَلون﴾.\n- **في**: من معانيها **الظرفية**، وتجرّ الظاهر والضمير ﴿وفي السماءِ رزقُكم﴾، ﴿لا فيها غَوْلٌ﴾.\n- **رُبّ**: من معانيها **التقليل**، **ولا تجرّ إلا الاسم الظاهر**: «رُبَّ رجلٍ كريمٍ لقيتُه».\n- **الباء**: من معانيها **التعدية**، وتجرّ الظاهر والضمير ﴿لنَذهبَنَّ بالذي﴾، ﴿ذهب اللهُ بنورِهم﴾.\n- **الكاف**: من معانيها **التشبيه**، **ولا تجرّ إلا الظاهر** ﴿مَثَلُ نورِه كمِشْكاةٍ﴾.\n- **اللام**: من معانيها **الاستحقاق والمِلك**، وتجرّ الظاهر والمضمر ﴿سبّح للهِ ما في السمواتِ والأرضِ﴾، ﴿له مُلْكُ السمواتِ والأرضِ﴾.\n- **حروف القسم الثلاثة**: الباء، والتاء، والواو.\n- **واو رُبّ**: كقول امرئ القيس: «وليلٍ كموجِ البحرِ أرخى سُدولَه»، وقوله: «وبَيضةِ خِدْرٍ لا يُرام خِباؤُها».\n- **مُذْ ومُنذُ**: يجرّان الأزمان، ويدلان على معنى **«مِن»** إن كان ما بعدهما ماضياً («ما رأيتُه مُذْ يومِ الخميسِ»، «ما كلّمتُه مُنذُ شهرٍ»)، وبمعنى **«في»** إن كان ما بعدهما حاضراً («لا أكلّمُه مُذْ يومِنا»، «لا ألقاه مُنذُ يومِنا»). **فإن وقع بعدهما فعل، أو كان الاسم بعدهما مرفوعاً فهما اسمان**.\n\n### ثانياً: المخفوض بالإضافة وأنواعه\n- قال المصنف: «وأما ما يُخفض بالإضافة فنحو قولك: غلامُ زيدٍ، وهو على قسمين: ما يُقدَّر باللام، وما يُقدَّر بمِنْ؛ فالذي يُقدَّر باللام نحو: غلامُ زيدٍ، والذي يُقدَّر بمِنْ نحو: ثوبُ خَزٍّ، وبابُ ساجٍ، وخاتَمُ حديدٍ».\n- والمخفوض بالإضافة على **ثلاثة أنواع** (ذكر المؤلف منها نوعين):\n  1. **إضافة على معنى «مِن»**: ضابطها أن يكون المضاف جزءاً وبعضاً من المضاف إليه، نحو: «جُبّةُ صوفٍ».\n  2. **إضافة على معنى «في»**: ضابطها أن يكون المضاف إليه ظرفاً للمضاف، نحو قوله تعالى ﴿بل مَكْرُ الليلِ﴾؛ فالليل ظرف للمكر ووقتٌ يقع فيه.\n  3. **إضافة على معنى اللام**: كل ما لا يصلح فيه أحد النوعين المذكورين، نحو: «غلامُ زيدٍ»، و«حصيرُ المسجدِ».\n- وترك المؤلف الكلام على القسم الثالث من المخفوضات وهو **المخفوض بالتبعية**؛ وعُذره أنه سبق القول عليه مفصّلاً في آخر أبواب المرفوعات (باب التوابع).\n\n## خاتمة الكتاب\nقال الشارح محمد محيي الدين عبدالحميد: «وقد كان الفراغ من كتابة هذا الشرح في (ليلة الخميس 27 من شهر رمضان سنة 1353 من الهجرة)، أعاد الله تعالى علينا من بركاته، آمين، والحمد لله رب العالمين، وصلاته وسلامه على صَفوة الصَّفوة من خلقه أجمعين، وعلى سادتنا آله وصحبه والتابعين، ولا عُدوان إلا على الظالمين، والعاقبة للمتقين».\n\n# النحو (10 درجات) — مراجعة سريعة لمعلم النحو\n\nالأسئلة السابقة: أنواع المخفوضات، المبني للمجهول، أنواع الجمل مع المثال. النمط: \"اذكر\" و\"مثّل\" و\"أعرب\".\n\n## أقسام الكلام\nاسم، فعل، حرف. **علامات الاسم**: الخفض، التنوين، دخول أل، حروف الخفض. **علامات الفعل**: قد، السين، سوف، تاء التأنيث الساكنة. **الحرف**: ما لا يصلح معه دليل الاسم ولا الفعل.\n\n## الإعراب والبناء\n- **الإعراب**: تغيير أواخر الكلم لاختلاف العوامل الداخلة عليها لفظاً أو تقديراً. أقسامه: رفع، نصب، خفض، جزم. للأسماء رفع ونصب وخفض ولا جزم، وللأفعال رفع ونصب وجزم ولا خفض.\n- **علامات الرفع أربع**: الضمة (الأصل)، الواو (جمع المذكر السالم والأسماء الخمسة)، الألف (المثنى)، النون (الأفعال الخمسة).\n- **علامات النصب خمس**: الفتحة، الألف (الأسماء الخمسة)، الكسرة (جمع المؤنث السالم)، الياء (المثنى وجمع المذكر)، حذف النون (الأفعال الخمسة).\n- **علامات الخفض ثلاث**: الكسرة، الياء (الأسماء الخمسة والمثنى وجمع المذكر)، الفتحة (الممنوع من الصرف).\n- **علامات الجزم**: السكون، الحذف (حذف حرف العلة، حذف النون).\n- **المبني**: الحروف كلها، الفعل الماضي، فعل الأمر، المضارع المتصل بنون النسوة أو نون التوكيد، الضمائر، أسماء الإشارة (إلا المثنى)، الأسماء الموصولة (إلا المثنى)، أسماء الاستفهام والشرط، بعض الظروف.\n\n## المرفوعات سبعة\n1. **الفاعل**: اسم مرفوع مذكور قبله فعله. ظاهر ومضمر.\n2. **نائب الفاعل (المفعول الذي لم يسم فاعله)** ★: اسم مرفوع لم يذكر معه فاعله. **المبني للمجهول** ★: إن كان الفعل ماضياً ضم أوله وكسر ما قبل آخره (ضُرِبَ، كُتِبَ)، وإن كان مضارعاً ضم أوله وفتح ما قبل آخره (يُضْرَبُ، يُكْتَبُ). الماضي الأجوف: قِيلَ، بِيعَ. الماضي المبدوء بتاء: تُعُلِّمَ. نائب الفاعل: المفعول به، أو الجار والمجرور، أو الظرف، أو المصدر.\n3. **المبتدأ**: اسم مرفوع عارٍ عن العوامل اللفظية. 4. **الخبر**: الاسم المرفوع المسند إليه. مفرد، وغير مفرد (جار ومجرور، ظرف، فعل مع فاعله، مبتدأ مع خبره).\n5. **اسم كان وأخواتها** (كان، أمسى، أصبح، أضحى، ظل، بات، صار، ليس، ما زال، ما انفك، ما فتئ، ما برح، ما دام): ترفع الاسم وتنصب الخبر.\n6. **خبر إن وأخواتها** (إن، أن، لكن، كأن، ليت، لعل): تنصب الاسم وترفع الخبر.\n7. **التابع للمرفوع**: النعت، العطف، التوكيد، البدل.\n- **ظن وأخواتها**: تنصب المبتدأ والخبر مفعولين (ظننت، حسبت، خلت، زعمت، رأيت، علمت، وجدت، اتخذت، جعلت، سمعت).\n\n## المنصوبات خمسة عشر\nالمفعول به، المصدر (المفعول المطلق)، ظرف الزمان، ظرف المكان، الحال، التمييز، المستثنى، اسم لا النافية للجنس، المنادى، المفعول من أجله، المفعول معه، خبر كان وأخواتها، اسم إن وأخواتها، مفعولا ظن، التابع للمنصوب.\n- **الحال**: اسم منصوب مفسر لما انبهم من الهيئات، نكرة، صاحبه معرفة. \"جاء زيد راكباً\".\n- **التمييز**: اسم منصوب مفسر لما انبهم من الذوات. \"طاب محمد نفساً\"، \"عشرون درهماً\".\n- **الاستثناء**: أدواته إلا، غير، سوى، خلا، عدا، حاشا. المستثنى بإلا ينصب إذا كان الكلام تاماً موجباً، وإن كان تاماً منفياً جاز البدل والنصب، وإن كان ناقصاً فعلى حسب العوامل.\n- **لا النافية للجنس**: تنصب النكرة بلا تنوين إذا باشرتها. \"لا رجلَ في الدار\".\n- **المنادى خمسة**: المفرد العلم والنكرة المقصودة يبنيان على الضم، والنكرة غير المقصودة والمضاف والشبيه بالمضاف تنصب.\n\n## المخفوضات ثلاثة ★ (سؤال سابق)\n1. **مخفوض بالحرف**: بحروف الجر (من، إلى، عن، على، في، رب، الباء، الكاف، اللام، حروف القسم الواو والباء والتاء، مذ ومنذ). \"مررت بزيدٍ\".\n2. **مخفوض بالإضافة**: ما يقدر باللام (\"غلام زيد\")، أو بمن (\"ثوب خز\")، أو بفي (\"مكر الليل\").\n3. **تابع للمخفوض**: النعت والعطف والتوكيد والبدل.\n\n## أنواع الجمل ★ (سؤال سابق)\n- **الجملة الاسمية**: تبدأ باسم: \"الصلاةُ نورٌ\".\n- **الجملة الفعلية**: تبدأ بفعل: \"قامَ زيدٌ\".\n- **الجملة التي لها محل من الإعراب سبع**: الواقعة خبراً، حالاً، مفعولاً به (مقول القول)، مضافاً إليه، جواباً لشرط جازم مقترناً بالفاء أو إذا، صفة، التابعة لجملة لها محل.\n- **الجملة التي لا محل لها من الإعراب سبع**: الابتدائية، الاستئنافية، الاعتراضية، التفسيرية، جواب القسم، جواب الشرط غير الجازم، صلة الموصول، التابعة لما لا محل له.\n- **شبه الجملة**: الجار والمجرور والظرف.\n\n## نواصب المضارع وجوازمه\n- **النواصب عشرة**: أن، لن، إذن، كي، لام كي، لام الجحود، حتى، الجواب بالفاء والواو، أو.\n- **الجوازم ثمانية عشر**: لم، لما، ألم، ألما، لام الأمر والدعاء، لا في النهي والدعاء، إن، ما، من، مهما، إذما، أي، متى، أيان، أين، أنى، حيثما، كيفما، إذا في الشعر.\n\n## نماذج إعراب متوقعة\n- \"إنما الأعمالُ بالنياتِ\": إنما: كافة ومكفوفة. الأعمال: مبتدأ مرفوع بالضمة. بالنيات: جار ومجرور متعلق بخبر محذوف.\n- \"بُني الإسلامُ على خمسٍ\": بني: فعل ماض مبني للمجهول. الإسلام: نائب فاعل مرفوع. على خمس: جار ومجرور.\n- \"الدينُ النصيحةُ\": مبتدأ وخبر.\n- \ : أبو بكر الصديق لما اشترى ستة عبيد مؤمنين وأعتقهم. والآية حكمها عام (سؤال سابق).\n- **الضحى**: مرض النبي ﷺ فلم يقم لليل ليلتين أو ثلاثاً، فقالت امرأة: ما أرى شيطانك إلا قد تركك.\n- **العلق**: أول ما نزل. \"أرأيت الذي ينهى\": أبو جهل. \"عبداً إذا صلى\": محمد ﷺ. \"فليدع ناديه\": قال أبو جهل: أتهددني وأنا أكثر أهل الوادي نادياً.\n- **الكوثر**: لما مات ابن النبي ﷺ قال أحد المشركين: إنه أبتر.\n- **الكافرون**: سأل الكفار النبي ﷺ أن يعبد آلهتهم سنة ويعبدوا إلهه سنة. تكرار الآيات: للتأكيد وقطع أطماع الكفار.\n- **النصر**: تسمى سورة التوديع. قال النبي ﷺ لما نزلت: \"نُعيت إليّ نفسي\".\n- **الإخلاص**: قال المشركون: اذكر لنا نسب ربك. فضلها: تعدل ثلث القرآن (حديث أبي سعيد في البخاري) ★.\n- **المسد**: أبو لهب اسمه عبد العزى، امرأته أم جميل بنت حرب أخت أبي سفيان، حمالة الحطب: تحمل الشوك وتطرحه في طريق النبي ﷺ.\n- **قريش**: تسمى سورة الإيلاف. رحلة الشتاء إلى اليمن والصيف إلى الشام.\n\n## معاني الكلمات بترتيب السور\n**النبأ**: النبأ العظيم: الخبر الهائل. مهاداً: فراشاً. أوتاداً: لتسكن الأرض. سباتاً: انقطاعاً عن الحركة. سبعاً شداداً: سبع سماوات قوية. سراجاً وهاجاً: الشمس. المعصرات: السحاب. ثجاجاً: منصباً بكثرة. يوم الفصل: لأن الله يفصل بين خلقه. الصور: القرن. أفواجاً: زمراً. مآباً: مرجعاً. أحقاباً: الزمن الطويل. حميماً: الماء الحار. غساقاً: صديد أهل النار. أتراباً: متساويات في السن. كأساً دهاقاً: مملوءة. لغواً: الكلام الباطل. الروح: جبريل. صواباً: شهد بالتوحيد.\n\n**النازعات**: النازعات: الملائكة تنزع الروح. غرقاً: من أقصى الجسد. نشطاً: الجذب بقوة. السابحات: الملائكة تسبح في السماء. السابقات: تسبق لتنفيذ أمر الله. واجفة: قلقة. زجرة واحدة: النفخة الثانية. الساهرة: أرض بيضاء يحاسب الله عليها الخلائق. طوى: الوادي في جبل سيناء. تزكى: تطهر من الشرك. الآية الكبرى: العصا. رفع سمكها: جعلها كالبناء المرتفع. الطامة الكبرى: النفخة الثانية. طغى: جاوز الحد. أيان مرساها: متى وقوعها.\n\n**عبس**: عبس: كلح بوجهه. الذكرى: الموعظة. تلهى: تتشاغل. مرفوعة: رفيعة القدر. سفرة: الملائكة يسفرون بالوحي. قضباً: القت الرطب. حدائق غلباً: النخل الغليظة الجذوع. أبّاً: ما لا يأكله الإنسان من النبات. الصاخة: صيحة الق
