<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تأهيل الأئمة والمؤذنين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F7F5EE; --surface:#FFFFFF; --ink:#1B2A23; --muted:#5E6E66; --line:#DCD9CF;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E3F0EA; --gold:#A87A20; --gold-soft:#F5EAD2;
  --danger:#9B3B2E; --ok:#2C7A4B; --radius:14px;
  --display:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
  --body:"Cairo","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121917; --surface:#1B2421; --ink:#ECEFEA; --muted:#A3B0A9; --line:#2E3A35;
    --accent:#4FB08F; --accent-ink:#0E1A15; --accent-soft:#1F332B; --gold:#D9B45E; --gold-soft:#332C1A;
    --danger:#E0796A; --ok:#66C48A;
  }
}
:root[data-theme="dark"]{
  --bg:#121917; --surface:#1B2421; --ink:#ECEFEA; --muted:#A3B0A9; --line:#2E3A35;
  --accent:#4FB08F; --accent-ink:#0E1A15; --accent-soft:#1F332B; --gold:#D9B45E; --gold-soft:#332C1A;
  --danger:#E0796A; --ok:#66C48A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
body{padding-block:0 40px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:700;text-decoration:none;color:var(--ink)}
.brand small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.02em}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.crumbs a{text-decoration:none}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.hero{padding-block:36px 20px}
.hero p{max-width:60ch;color:var(--muted);margin:10px 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}
.choice{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice .k{font-family:var(--display);font-size:1.7rem;font-weight:700}
.choice .d{color:var(--muted);font-size:.92rem;margin-top:4px}
.choice .go{display:inline-block;margin-top:14px;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px}
.stack{display:grid;gap:14px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.count .l{color:var(--muted)}
.subjects{display:grid;gap:10px;margin-top:14px}
.subj{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.subj:hover{border-color:var(--accent)}
.subj .nm{grid-area:1/1;font-family:var(--display);font-size:1.2rem;font-weight:700}
.subj .src{grid-area:2/1;font-size:.85rem;color:var(--muted)}
.subj .mk{grid-area:1/2/3/3;align-self:center;text-align:center;min-width:64px;font-variant-numeric:tabular-nums}
.subj .mk b{display:block;font-size:1.5rem;line-height:1.1;color:var(--gold)}
.subj .mk span{font-size:.72rem;color:var(--muted)}
.subj .bar{grid-area:3/1/4/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.subj .bar i{display:block;height:100%;background:var(--gold)}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,.choice:focus-visible,.subj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notes{max-width:72ch}
.notes h1{font-size:1.6rem;margin:22px 0 8px}
.notes h2{font-size:1.3rem;margin:26px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.notes h3{font-size:1.1rem;margin:18px 0 6px;color:var(--accent)}
.notes p{margin:8px 0}
.notes ul,.notes ol{padding-inline-start:22px;margin:6px 0}
.notes li{margin:3px 0}
.notes strong{color:var(--accent)}
.notes .tbl{overflow-x:auto;margin:10px 0}
.notes table{border-collapse:collapse;width:100%;font-size:.92rem}
.notes th,.notes td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}
.notes th{background:var(--accent-soft)}
.notes mark{background:var(--gold-soft);color:inherit;padding:0 3px;border-radius:3px}
.quiz{display:grid;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qcard .qn{font-size:.8rem;color:var(--muted)}
.qcard .qt{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:6px 0 12px}
.qcard .ans{border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;white-space:pre-line}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--danger);color:var(--danger)}
.prog{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink)}
.empty{color:var(--muted);padding:20px;text-align:center}
.exam-cta{display:grid;gap:8px;border:2px solid var(--gold);background:var(--gold-soft)}
.exam-cta h2{color:var(--gold)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;border-radius:10px;font-size:1rem;line-height:1.5}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--accent-soft)}
.opt.wrong{border-color:var(--danger)}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.score{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--muted);font-family:var(--body);font-weight:400}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.paper-cta{border:2px solid var(--accent);background:var(--accent-soft)}
.paper-cta h2{color:var(--accent)}
.sect{margin-top:22px;border-top:2px solid var(--line);padding-top:14px}
.sect h2{color:var(--gold)}
.sect .hint{color:var(--muted);font-size:.88rem}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:10px}
.qbox .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qbox .qno{font-family:var(--display);font-weight:700;color:var(--accent);min-width:2.2em}
.qbox .qtx{font-size:1.05rem;font-weight:600;flex:1;min-width:12ch}
.qbox .mk2{font-size:.78rem;color:var(--muted);white-space:nowrap}
.tfrow{display:flex;gap:8px;margin-top:10px}
.tfrow button{flex:0 0 auto;min-width:88px}
.wline{width:100%;border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 2px;margin-top:8px}
.wline:focus{outline:none;border-bottom-color:var(--accent)}
.warea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:10px;margin-top:8px;min-height:80px;resize:vertical}
.model{border-right:3px solid var(--gold);background:var(--gold-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:10px;white-space:pre-line;line-height:1.7}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.selfmark span{color:var(--muted);font-size:.85rem}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.badge.ok{background:var(--accent-soft);color:var(--ok)}
.badge.no{background:var(--gold-soft);color:var(--danger)}
.sticky-sub{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>

مور، إن الله طيب، من أحدث في أمرنا، لا يؤمن أحدكم حتى يكون هواه، يا ابن آدم.\n- العقيدة: شروط لا إله إلا الله، أنواع التوحيد، طريقة أهل السنة في الصفات، خصائص النبي ﷺ، أقسام الكفر، شروط تكفير المعين وموانعه، الاستثناء في الإيمان، الروح والنفس، أشراط الساعة، الإيمان باليوم الآخر، عبادة الله بالحب/الرجاء/الخوف فقط.\n- التفسير: معاني كلمات (الرادفة، الراجفة، كنود، العهن، مبثوث، وقب، كبد، مرقوم، جيدها)، أسباب النزول (عبس، المطففين، الضحى، الكوثر، الإخلاص)، من المراد بـ(الأتقى).\n- التجويد: الإقلاب، الإدغام، الإظهار والإخفاء الشفوي، المد المتصل والمنفصل واللازم، القلقلة ومراتبها، حروف الصفير، تشديدات الفاتحة، آداب التلاوة.\n- النحو: المخفوضات، المبني للمجهول، أنواع الجمل.\n\n## جدول 14 يوماً (ساعتان إلى ثلاث يومياً)\n\n| اليوم | العمل |\n|---|---|\n| 1 | الفقه: الطهارة كاملة (ماء، استنجاء، وضوء، خفين، نواقض، غسل، تيمم، حيض) |\n| 2 | الفقه: الأذان، شروط الصلاة، أركانها، واجباتها، مبطلاتها، السهو، أوقات النهي |\n| 3 | الفقه: الجمع، الجمعة، الجنائز + مراجعة يومي 1-2 |\n| 4 | الفقه: الزكاة كاملة بالأرقام + الصيام + الاعتكاف |\n| 5 | الفقه: الحج كاملاً (شروط، أنساك، محظورات، فدية، أركان، واجبات، طواف، سعي) |\n| 6 | الفقه: المعاملات (بيع، شروط، خيار، ربا، نكاح، عدة، رضاع، نفقات، أطعمة، صيد، أيمان، نذر) |\n| 7 | اختبار ذاتي في الفقه كاملاً من بنك الأسئلة |\n| 8 | الحديث: الأربعون النووية 1-20 |\n| 9 | الحديث: 21-42 + معاني الألفاظ |\n| 10 | العقيدة: كل ملخص بريق الجمان |\n| 11 | النحو: مراجعة + التفسير جزء عم (النبأ – الفجر) |\n| 12 | التفسير (البلد – الناس) + التجويد كاملاً |\n| 13 | ميثاق المسجد + اختبار شامل من بنك الأسئلة |\n| 14 | مراجعة الأخطاء فقط + تلاوة للشفوي |\n\n**القرآن للشفوي**: كل يوم 20 دقيقة تلاوة مجوّدة بصوت مسموع لجزء عم وما تحفظه من السور الطوال، مع الوقف والابتداء الصحيح.\n", "tracks": {"imam": {"name": "إمام مسجد", "exam_date": "2026-10-06", "oral": "القرآن الكريم: مقابلة شفوية بعد الاختبار التحريري", "marks": {"fiqh": 60, "hadith": 10, "aqeedah": 10, "nahw": 10, "tafsir": 4, "tajweed": 4, "mithaq": 2}, "notes": {"fiqh": "40 درجة عبادات + 20 درجة معاملات"} إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار.\n\n### باب المسح على الخفين\n**شروطه سبعة**: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما.\n\n**الفرق بين مسح الخف والجبيرة** (سؤال سابق):\n| | الخف | الجبيرة |\n|---|---|---|\n| اشتراط لبسه على طهارة | يشترط | لا يشترط على الصحيح في المذهب |\n| المدة | مؤقت: يوم وليلة للمقيم، ثلاثة أيام للمسافر | غير مؤقت، حتى البرء |\n| محل المسح | أكثر أعلى الخف | جميع الجبيرة |\n| يمسح في | الحدث الأصغر فقط | الحدث الأصغر والأكبر |\n| لا تتجاوز | - | لا تتجاوز قدر الحاجة |\n\n### باب نواقض الوضوء\n**ثمانية**: الخارج من السبيلين، خروج النجاسة من بقية البدن (الدم، القيء)، زوال العقل (نوم، إغماء)، مس الفرج بلا حائل، مباشرة الذكر الأنثى أو العكس لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة عن الإسلام.\n\n### باب ما يوجب الغسل\n- **موجباته سبعة**: انتقال المني، خروجه من مخرجه ولو دماً بلذة ما لم يكن نائماً، تغييب الحشفة كلها بلا حائل في فرج، إسلام الكافر ولو كان مرتداً، خروج الحيض، خروج دم النفاس، الموت.\n- **شروط الغسل سبعة**: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله.\n- **واجبات الغسل**: التسمية فقط.\n- **فرض الغسل**: أن يعم بالماء جميع بدنه، وداخل فمه وأنفه.\n- **سنن الغسل ثمانية**: الوضوء قبله، إزالة ما لوثه من أذى، إفراغ الماء على رأسه ثلاثاً، وعلى بقية جسده ثلاثاً، التيامن، الموالاة، إمرار اليد على الجسد، إعادة غسل رجليه بمكان آخر.\n- **الأغسال المستحبة**: ستة عشر، منها يوم الجمعة.\n\n### باب التيمم\n- **شروطه ثمانية**: النية، الإسلام، العقل، التمييز، الاستنجاء أو الاستجمار، دخول الوقت، تعذر استعمال الماء، أن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد.\n- **واجبه**: التسمية فقط.\n- **فروضه خمسة**: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، الموالاة، تعيين النية.\n- **مبطلاته خمسة**: ما أبطل الوضوء، وجود الماء، خروج الوقت، زوال المبيح له، خلع ما مسح عليه.\n\n### باب الحيض\n- **ما يحرم بالحيض تسعة**: الوطء، الطلاق، الصلاة، الصوم، الطواف، قراءة القرآن، مس المصحف، اللبث في المسجد، وكذا المرور فيه إن خافت تلويثه.\n- **ما يوجبه الحيض ثلاثة**: الغسل، البلوغ، الكفارة بالوطء فيه ولو مكرهاً أو ناسياً أو جاهلاً: يتصدق بدينار أو بنصف دينار.\n\n---\n\n## باب الأذان والإقامة\n- **شروطه ستة**: الإسلام، الذكورية، العقل، التمييز، النطق، العدالة.\n- **أركانه**: رفع الصوت به.\n- **سننه خمسة**: أن يكون صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً.\n- **حكم الأذان والإقامة** (سؤال سابق): فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس المكتوبة والجمعة، وسنة للمنفرد والمسافر.\n\n## باب شروط الصلاة\n**شروطها تسعة**: الإسلام، العقل، التمييز، الطهارة مع القدرة، دخول الوقت، ستر العورة مع القدرة، اجتناب النجاسة في البدن والثوب والبقعة مع القدرة، استقبال القبلة مع القدرة، النية.\n- **محل النية**: القلب. **حقيقتها**: العزم على فعل الشيء. **شروطها**: الإسلام، العقل، التمييز. **زمنها**: أول العبادة أو قبلها بيسير.\n\n---\n\n## كتاب الصلاة\n- **أركانها أربعة عشر**: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة وفيها إحدى عشرة تشديدة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع من السجود، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس للتشهد الأخير، التسليمتان، ترتيب الأركان.\n- **واجباتها ثمانية**: التكبير لغير الإحرام، قول \"سمع الله لمن حمده\" للإمام والمنفرد، قول \"ربنا ولك الحمد\" للإمام والمنفرد والمأموم، قول \"سبحان ربي العظيم\"، قول \"سبحان ربي الأعلى\"، قول \"رب اغفر لي\"، التشهد الأول، الجلوس للتشهد الأول.\n- **الفرق بين الركن والواجب**: الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط سهواً وجهلاً ويجبر بسجود السهو.\n- **ماذا يتحمل الإمام عن المأموم** (سؤال سابق): قراءة الفاتحة، سجود السهو، سترة الصلاة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة في الجهرية، الجهر، وسجود التلاوة إذا لم يسجد الإمام.\n- **هل يجوز للقادر الجلوس في الفرض؟** لا يجوز، لأن القيام ركن في الفرض على القادر، ويجوز في النافلة مع نصف الأجر.\n- **يسن رفع اليدين في ثلاثة مواضع**: عند تكبيرة الإحرام، عند الركوع، عند الرفع منه (وزاد بعضهم عند القيام من التشهد الأول).\n\n### مبطلات الصلاة (أربعة وعشرون، أهمها):\n1. ما أبطل الطهارة. 2. كشف العورة عمداً. 3. استدبار القبلة. 4. اتصال النجاسة به إن لم يزلها في الحال. 5. العمل الكثير عادة من غير جنسها لغير ضرورة. 6. تعمد زيادة ركن فعلي. 7. تعمد تقديم بعض الأركان على بعض. 8. تعمد السلام قبل إتمامها. 9. تعمد إحالة المعنى في القراءة. 10. فسخ النية. 11. التردد في الفسخ وبالعزم عليه. 12. القهقهة والكلام ولو سهواً. 13. سلامه عمداً قبل إمامه، أو سهواً ولم يعده بعده. 14. الأكل والشرب سوى اليسير عرفاً لناس وجاهل، ولا تبطل إن بلع ما بين أسنانه بلا مضغ.\n\n### باب سجود السهو\n**أسبابه ثلاثة**: الزيادة (كزيادة ركن)، النقص (كنقص ركن أو واجب سهواً)، الشك (في زيادة ركن أو واجب أو نقصانه).\n\n### أوقات النهي ثلاثة\nمن طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى غروب الشمس، عند قيام الشمس من الظهيرة حتى تزول عن وسط السماء.\n\n### فصل في الجمع\n- **شروط جمع التقديم أربعة**: نية الجمع عند الإحرام بالأولى، ألا يفرق بينهما بنحو نافلة، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية.\n- **شروط جمع التأخير اثنان**: نية الجمع عند الإحرام بالأولى، بقاء العذر إلى دخول وقت الثانية.\n- **متى يتم المسافر الصلاة** (سؤال سابق): إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر.\n\n### باب صلاة الجمعة\n- **تجب على ستة**: الذكر، المسلم، المكلف، الحر (لا عذر له)، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبين البلد فرسخ (5 أو 6 كيلومتر).\n- **شروط صحة الجمعة أربعة**: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدمها خطبتين.\n- **شروط صحة الخطبتين خمسة**: الوقت، النية، أن تكون في الحضر، حضور الأربعين، أن يكون الخطيب ممن تصح إمامته فيها.\n- **أركان الخطبتين ستة**: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما حيث يُسمع المصلين ولا يوجد مانع من عذر.\n\n---\n\n## كتاب الجنائز\n- **حكم صلاة الجنازة**: فرض كفاية، وتسقط بمكلف واحد ولو امرأة (سؤال سابق: تجزئ إذا صلت عليه امرأة وحدها).\n- **شروطها ثمانية**: النية، التكليف، استقبال القبلة، ستر العورة، اجتناب النجاسة، حضور الميت إن كان بالبلد، إسلام المصلي والمصلى عليه، طهارتهما.\n- **أركانها سبعة**: القيام، التكبيرات الأربع، قراءة الفاتحة، الصلاة على محمد ﷺ، الدعاء للميت، السلام، الترتيب.\n\n---\n\n## كتاب الزكاة\n- **شروط وجوبها خمسة**: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول.\n- **الأموال الزكوية خمسة**: سائمة بهيمة الأنعام، الخارج من الأرض، العسل، الأثمان، عروض التجارة.\n- **ما لا يشترط فيه حولان الحول** (سؤال سابق): الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما).\n- **شروط زكاة السائمة ثلاثة**: أن تتخذ للدر والنسل والتسمين لا للعمل، أن ترعى أكثر الحول، أن تبلغ النصاب.\n- **زكاة الخارج من الأرض**: تجب في كل ما يُكال ويُدخر، بشرطين: أن يبلغ النصاب خمسة أوسق (610 كيلو غرام)، وأن يكون مالكاً للنصاب وقت وجوبها.\n- **مقدار الزكوات**: الخارج من الأرض: يسقى بكلفة نصف العشر، بلا كلفة العشر. العسل: العشر. الركاز: الخمس. الذهب والفضة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو). المعادن: ربع العشر. عروض التجارة: ربع العشر.\n- **شروط الخارص أربعة**: مسلم، أمين، خبير، أجرته على رب الثمرة.\n- **نصاب الذهب**: 85 غراماً. **نصاب الفضة**: 595 غراماً.\n- **نصاب الغنم**: 40 شاة فيها شاة، 121 فيها شاتان، 201 فيها ثلاث شياه، ثم في كل مائة شاة. (سؤال سابق: من يملك أربعين رأساً من الغنم السائمة وحال عليها الحول: يجب عليه شاة واحدة).\n- **نصاب الإبل**: 5 فيها شاة، 10 شاتان، 15 ثلاث شياه، 20 أربع شياه، 25 بنت مخاض، 36 بنت لبون، 46 حقة، 61 جذعة، 76 بنتا لبون، 91 حقتان، 121 ثلاث بنات لبون.\n- **نصاب البقر**: 30 فيها تبيع، 40 فيها مسنة.\n- **الحلي** (سؤال سابق): الحلي المعد للاستعمال المباح أو الإعارة لا زكاة فيه على المذهب، وإن كان معداً للكراء أو الادخار أو كان محرماً ففيه الزكاة إذا بلغ النصاب وحال الحول.\n- **أصناف أهل الزكاة ثمانية**: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله (المجاهدون)، ابن السبيل.\n\n---\n\n## كتاب الصيام\n- **شروط وجوبه أربعة**: الإسلام، البلوغ، العقل، القدرة عليه.\n- **شروط صحته ستة**: الإسلام، انقطاع دم الحيض، انقطاع دم النفاس، التمييز، العقل، النية من الليل لكل يوم واجب.\n- **تعريف فرض الصوم**: الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس.\n- **المفطرات اثنا عشر**: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت إلى الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره.\n- **كفارة الجماع في نهار رمضان**: عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت عنه.\n- **إذا زال العذر عن المفطر في النهار** (سؤال سابق): يلزمه الإمساك بقية اليوم والقضاء (كمن طهرت من حيض، أو قدم مسافر مفطراً، أو برئ مريض، أو أسلم كافر، أو بلغ صبي).\n\n## كتاب الاعتكاف\n- **شروط صحته ستة**: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد.\n- **ما يبطله ستة**: الخروج من المسجد لغير عذر، نية الخروج ولو لم يخرج، الوطء في الفرج، الإنزال بالمباشرة دون الفرج، الردة، السكر.\n- **من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة له** (سؤال سابق): لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة.\n\n---\n\n## كتاب الحج\n- **شروط وجوبه خمسة**: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة شرطاً: وجود المحرم.\n- **الاستطاعة** (سؤال سابق): أن يملك زاداً وراحلة تصلح لمثله، فاضلاً عن قضاء دينه ونفقته ونفقة عياله، وعن حوائجه الأصلية من مسكن وخادم، وأن يكون الطريق آمناً.\n- **أنواع الأنساك ثلاثة**: التمتع (يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج)، الإفراد (يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة)، القِران (يحرم بالحج والعمرة معاً).\n- **محظورات الإحرام سبعة**: لبس المخيط للرجال حتى الخفين، تعمد تغطية الرأس للرجال وتغطية الوجه للأنثى، استعمال الطيب، إزالة الشعر وتقليم الأظافر، قتل صيد البر الوحشي المأكول ومنه الدلالة عليه أو الإعانة، عقد النكاح، الوطء في الفرج ودواعيه.\n- **الفدية قسمان**: (1) على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر أو الظفر والإمناء بنظرة والمباشرة بغير إنزال منٍ، وجزاء الصيد (المثل من النعم أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين مداً أو نصف صاع، أو يصوم عن طعام كل مسكين يوماً). (2) على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء ونحوه، فمن لم يجده صام ثلاثة أيام في الحج وسبعة إذا رجع.\n- **من وطئ في الحج قبل التحلل الأول أو أنزل منياً بفعل متعمداً فعليه بدنة**، ومن وطئ في العمرة قبل تمام السعي فعليه شاة.\n- **أركان الحج أربعة**: الإحرام (وهو مجرد النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة.\n- **واجبات الحج سبعة**: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، المبيت في منى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع.\n- **أركان العمرة ثلاثة**: الإحرام، الطواف، السعي. **واجباتها**: الإحرام بها من الحل، الحلق أو التقصير.\n- **أنواع التحلل** (سؤال سابق): التحلل الأول يحصل بفعل اثنين من ثلاثة: رمي، أو حلق، أو طواف، ويحل به كل شيء إلا النساء. التحلل الثاني يحصل بفعل الثلاثة، ويحل به كل شيء حتى النساء.\n- **شروط صحة الطواف أحد عشر**: النية، الإسلام، العقل، دخول وقته، ستر العورة، اجتناب النجاسة، الطهارة من الحدث، تكميل السبع أشواط، جعل البيت عن يساره، المشي مع القدرة، الموالاة.\n- **شروط صحة السعي ثمانية**: النية، الإسلام، العقل، الموالاة، المشي مع القدرة، كونه بعد الطواف، تكميل السبع أشواط، استيعاب ما بين الصفا والمروة.\n\n---\n\n# المعاملات (20 درجة)\n\n## كتاب البيع\n- **شروط البيع سبعة**: الرضى، الرشد، كون المبيع مالاً، أن يكون المبيع ملكاً للبائع أو مأذوناً له فيه، القدرة على تسليم المبيع، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً.\n- **مثالان على عدم القدرة على التسليم** (سؤال سابق): بيع الآبق، والشارد، والطير في الهواء، والسمك في الماء، والمغصوب على غير غاصبه، فهذه لا يصح بيعها.\n- **الشروط في البيع قسمان**: صحيح لازم (كشرط تأجيل الثمن، أو سكنى الدار شهراً)، وفاسد مبطل للبيع (كشرط بيع آخر، أو سلف، أو قرض، أو \"تزوجني ابنتك\").\n- **أقسام الخيار سبعة**: خيار المجلس، خيار الشرط (اشتراط الخيار إلى مدة)، خيار الغبن (الغش)، خيار التدليس (تزيين العين المراد بيعها)، خيار العيب، خيار الخلف في الصفة، خيار الخلف في قدر الثمن.\n\n### باب الربا\n- **إذا بيع المكيل بجنسه** (كالحبوب والثمار: التمر بالتمر) أو **الموزون بجنسه** (كالذهب بالذهب، الخبز بالخبز) صح بشرطين: المماثلة في القدر، والقبض قبل التفرق. (سؤال سابق)\n- **إذا بيع بغير جنسه** (ذهب بفضة، بر بشعير) صح بشرط: القبض قبل التفرق، وجاز التفاضل.\n- **إذا بيع المكيل بالموزون** جاز التفاضل والتفرق قبل القبض.\n\n## كتاب النكاح\n- **تدخل فيه الأحكام التكليفية الأربعة**: يُسن لذي شهوة لا يخاف الزنا، **يجب على من يخاف الزنا** (سؤال سابق: متى يكون الزواج واجباً؟)، يباح لمن لا شهوة له، يحرم بدار الحرب لغير الضرورة.\n- **النظر ثمانية أقسام**: نظر الرجل البالغ للحرة البالغة الأجنبية لغير حاجة لا يجوز. نظره لمن لا تُشتهى كعجوز يجوز لوجهها خاصة. نظره للشهادة عليها أو لمعاملتها يجوز لوجهها وكذا كفيها لحاجة. نظره لحرة بالغة يخطبها يجوز للوجه والرقبة واليد والقدم. نظره لذوات محارمه يجوز للوجه والرقبة واليد والقدم والرأس والساق. نظره للمداواة يجوز للمواضع التي يحتاج إليها. نظر المرأة للمرأة وللرجل الأجنبي، ونظر الرجل للرجل ولو أمرد يجوز إلى ما عدا ما بين السرة والركبة. نظره لزوجته وأمته المباحة له ولو لشهوة يجوز لجميع البدن.\n- **أركان النكاح**: الإيجاب \"أنكحتك\"، والقبول مرتبين \"قبلت\".\n- **شروط النكاح خمسة**: تعيين الزوجين، رضى الزوجين المكلفين، الولي، شهادة ذكرين مكلفين ولو رقيقين، خلو الزوجين من الموانع نسباً أو سبباً.\n- **شروط الولي سبعة**: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، عدالة ولو ظاهرة، رشد.\n- **شروط الشاهدين**: متكلمين، سميعين، مسلمين، عدلين ولو ظاهراً، أن يكونا غير أصلي الزوجين وفرعيهما.\n- **الكفاءة معتبرة في خمسة**: الديانة، الصناعة، الميسرة، الحرية، النسب.\n- **لا يجوز نكاح الحر من الأمة إلا بشرطين**: عدم المال (الطول)، وخوف الزنا (العنت).\n- **الشروط في النكاح قسمان**: صحيح لازم للزوج (ألا يخرجها من بلادها، أو يزيد مهرها، أو لا يفرق بينها وبين أبويها). فاسد نوعان: نوع يبطل النكاح (نكاح الشغار: يزوجه موليته ويزوجه الآخر موليته بلا مهر، ونكاح المحلل)، ونوع لا يبطله (أن يشترط ألا مهر لها أو لا نفقة أو يقسم لها أكثر من ضرتها أو أقل).\n- **خيار العيب في النكاح ثلاثة أقسام**: قسم يختص بالرجل (كونه مقطوع الذكر أو أشل)، قسم يختص بالأنثى (كون فرجها مسدوداً أو به بخر أو قروح سيالة)، قسم مشترك (جنون، جذام، برص، بخر الفم).\n\n## كتاب العدة\n- **تعريفها**: تربص من فارقت زوجها بوفاة أو حياة.\n- **عدة المتوفى زوجها**: إن كانت حاملاً فبوضع الحمل طال أم قصر، وإن كانت غير حامل فأربعة أشهر وعشر ليالٍ بأيامها، وعدة الأمة نصفها.\n- **عدة المطلقة**: من تحيض: ثلاثة حيض للحرة وحيضتان للأمة. من لا تحيض (صغيرة وآيسة وهي من بلغت خمسين سنة): ثلاثة أشهر، وشهران للأمة. من كانت تحيض ثم ارتفع حيضها ولم تبلغ سن الإياس: إن لم تعلم سبب رفعه تتربص تسعة أشهر ثم تعتد عدة آيسة، وإن علمت ما رفعه (كمرض أو رضاع أو نفاس) فتتربص حتى يعود الحيض فتعتد به أو تصير آيسة.\n- **إحداد المرأة في أربعة أشياء**: تجتنب الزينة، الطيب، لبس الحلي، لبس الملون.\n- **استبراء الإماء** واجب في ثلاثة مواضع: إذا ملك أمة يوطأ مثلها، إذا ملك أمة ووطئها ثم أراد أن يزوجها أو يبيعها، إذا أعتق أمته أو مات عنها. **عدة الإماء واستبراؤهم**: الحامل بوضع الحمل، ومن تحيض بحيضة، والتي لا تحيض بشهر، والمرتفع حيضها ولا تعلم ما رفعه عشرة أشهر، والعالمة خمسون سنة وشهر.\n\n## كتاب الرضاع\n**تثبت المحرمية بالرضاع بشرطين** (سؤال سابق): أن تكون خمس رضعات، وفي العامين (السنة الأولى والثانية).\n\n## كتاب النفقات\n- **يجب على الزوج لزوجته**: الأكل، الشرب، الملبس، مسكن بالمعروف، مؤنة نظافتها، خادم إن كانت ممن يخدم مثلها، مؤنسة لحاجة.\n- **نفقة الأقارب** تجب بثلاثة شروط: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوت نفسه وزوجته ورقيقه يومه وليلته، أن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فيجب.\n- **الحضانة**: حفظ الطفل غالباً عما يضره والقيام بمصالحه. إذا بلغ الصبي سبع سنين عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً إلى أن تتزوج. المجنون ولو أنثى عند أمه مطلقاً.\n\n## كتاب الأطعمة\n- **يحرم أكله**: النجس كالميتة ولحم الخنزير. حيوان البر: الحمر الأهلية وما يفترس بنابه كالأسد والنمر. حيوان الطير: ما يصيد بمخلبه كالعقاب والصقر. ما يأكل الجيف كنسر وفأر. وتحرم الجلالة (التي أكثر علفها النجاسة) ولا تحل حتى تحبس ثلاثاً وتطعم الطاهر. ويحل كل ما في البحر غير ضفدع وحية وتمساح.\n- **الذكاة**: ذبح أو نحر الحيوان المقدور عليه. **شروطها أربعة**: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (يحل الذبح بكل محدد غير السن والظفر)، قطع الحلقوم والمريء، قول \"بسم الله\" عند الذكاة وتسقط سهواً لا جهلاً.\n\n## كتاب الصيد\n- **متى يباح الصيد ومتى يكره** (سؤال سابق): يباح لمن يقصد به الانتفاع، ويكره لمن يقصده لهواً ولعباً، ويحرم على المحرم وفي الحرم.\n- **شروط حل الصيد إذا مات قبل أن يُدركه أربعة**: كون الصائد أهلاً للذكاة. الآلة وهي نوعان: ما له حد يجرح به كسيف، وجارحة معلمة ككلب غير أسود وصقر. قصد الفعل وهو أن يرسل الآلة لقصد الصيد. قول \"بسم الله\" عند إرسال الجارحة أو رمي سلاحه ولا تسقط سهواً.\n- **شروط صيد الكلب والفهد ثلاثة**: يسترسل إذا أُرسل، ينزجر إذا زُجر، إذا أمسك لم يأكل.\n- **شروط صيد الطير ثلاثة**: أن يسترسل إذا أرسل، ويرجع إذا دُعي، أن يجرح الصيد لا بصدم ولا بخنق.\n\n## كتاب الأيمان\n- **لا تنعقد اليمين إلا**: بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته.\n- **شروط وجوب الكفارة خمسة**: كون الحالف مكلفاً، كونه مختاراً، كونه قاصداً لليمين، كونها على أمر مستقبل، الحنث في يمينه (يرجع عما حلف عنه).\n- **كفارة اليمين**: إطعام عشرة مساكين أو كسوتهم، أو تحرير رقبة مؤمنة، فإن لم يجد صام ثلاثة أيام متتابعة وجوباً. ولا يصح أن يكفر الرقيق بغير الصوم، وعكسه الكافر.\n\n### باب النذر\n- **لا يصح إلا**: بالقول، من مكلف، مختاراً.\n- **أنواع النذر المنعقد وأحكامه ستة**: النذر المطلق (\"لله علي نذر\") وكفارته كفارة يمين. نذر اللجاج والغضب (\"إن كلمتك فعلي صوم كذا\") فيخير بين الفعل أو كفارة يمين. النذر المباح (\"لله علي أن أركب دابتي\") فيخير بين الفعل أو كفارة يمين. النذر المكروه (كطلاق) فيسن أن يكفر ولا يفعله. نذر المعصية (كشرب الخمر) فيحرم الوفاء به ويكفر. نذر التبرر (كصلاة وصيام أو يعلقه بشرط: \"إن شفى الله مريضي فعلي كذا\") فيجب الوفاء به.\n- من نذر صوم شهر معين لزمه صومه متتابعاً، فإن أفطر لغير عذر حرم ولزمه ابتداؤه من جديد مع كفارة يمين، وإن أفطر لعذر أكمل صومه ويكفر لفوات التتابع. من نذر صوم شهر مطلق أو صوم متتابع غير مقيد بزمن لزمه التتابع، فإن أفطر لغير عذر لزمه ابتداؤه من جديد بلا كفارة، ولعذر خير بين ابتدائه ولا شيء عليه وبين أن يكمله ويكفر.\n\n\n# ملخص متن دليل الطالب لنيل المطالب (العبادات)\n\nمرجع مختصر منظّم لأبواب العبادات كما وردت في متن \"دليل الطالب\" بصيغة السؤال والجواب، مع الأرقام والقوائم كما هي في الكتاب.\n\n---\n\n## كتاب الطهارة\n\n**تعريف الطهارة:** رفع الحدث، وزوال الخبث.\n\n### أقسام المياه وأحكامها\n\nأقسام الماء **ثلاثة**:\n1. الطهور.\n2. الطاهر.\n3. النجس.\n\n**الطهور:** هو الباقي على خلقته، يرفع الحدث ويزيل الخبث. وهو **أربعة أنواع**:\n1. ماء يحرم استعماله ولا يرفع الحدث ويزيل الخبث، وهو ما ليس مباحًا.\n2. وماء يرفع حدث الأنثى لا الرجل البالغ والخنثى، وهو ما خلت به المرأة المكلفة لطهارة كاملة عن حدث.\n3. وماء يكره استعماله مع عدم الاحتياج إليه: ماء بئر بمقبرة، وماء اشتد حره أو برده، أو سخن بنجاسة أو بمغصوب، أو استعمل في طهارة لم تجب، أو في غسل كافر، أو تغير بملح مائي، أو بما لا يمازجه كتغيره بالعود القماري وقطع الكافور والدهن.\n4. وماء لا يكره استعماله: كماء البحر والآبار والعيون والأنهار والحمام والمسخن بالشمس، والمتغير بطول المكث أو بالريح من نحو ميتة، أو بما يشق صون الماء عنه كطحلب وورق شجر ما لم يوضعا.\n\n- **ماء زمزم:** لا يكره إلا في إزالة الخبث.\n- **الطاهر:** يجوز استعماله في غير رفع الحدث وزوال الخبث، وهو ما تغير كثير من لونه أو طعمه أو ريحه بشيء طاهر. وإن زال تغيره بنفسه عاد إلى طهوريته.\n- ومن الطاهر أيضًا: ما كان قليلًا واستعمل في رفع حدث، أو انغمست فيه كل يد المسلم المكلف النائم ليلًا نومًا ينقض الوضوء قبل غسلها ثلاثًا بنية وتسمية (وهذا الغسل **واجب**).\n- **النجس:** ما وقعت فيه نجاسة وهو قليل ولو لم تتغير أحد أوصافه، أو كان كثيرًا وتغير بها أحد أوصافه. يحرم استعماله إلا للضرورة، ولا يرفع الحدث ولا يزيل الخبث.\n- **تطهير الماء النجس:** إن زال تغيره: (1) بنفسه، (2) أو بإضافة طهور إليه، (3) أو بنزح منه ويبقى بعده كثير.\n- **حد الكثير:** قلتان تقريبًا (خمسمائة رطل بالعراقي، وثمانون رطلًا وسبعان ونصف سبع بالقدسي)، ومساحتهما ذراع وربع طولًا وعرضًا وعمقًا. واليسير ما دون القلتين.\n- الماء الكثير إذا لم يتغير بالنجاسة فهو طهور ولو مع بقائها فيه.\n- **إن شك في كثرته فهو نجس.**\n- إن اشتبه ما تجوز به الطهارة بما لا تجوز: **لم يتحرَّ، ويتيمم بلا إراقة**.\n- يلزم من علم بنجاسة شيء إعلام من أراد أن يستعمله.\n\n### الآنية\n\n- يباح اتخاذ واستعمال كل إناء طاهر ولو ثمينًا، **إلا آنية الذهب والفضة والمموه بهما**.\n- تصح الطهارة بآنية الذهب والفضة وبالإناء المغصوب (مع الإثم).\n- يباح إناء ضبب بضبة يسيرة من الفضة لغير زينة.\n- آنية الكفار وثيابهم **طاهرة**.\n- لا ينجس شيء بالشك ما لم تعلم نجاسته.\n- عظم الميتة وقرنها وظفرها وحافرها وعصبها وجلدها **نجس، ولا يطهر بالدباغ**.\n- الشعر والصوف والريش **طاهر** إذا كان من ميتة طاهرة في الحياة ولو غير مأكولة كالهر والفأر.\n- **يسن** تغطية الآنية وإيكاء الأسقية.\n\n### الاستنجاء وآداب قضاء الحاجة\n\n- **الاستنجاء:** إزالة ما خرج من السبيلين بماء طهور أو حجر طاهر مباح منقٍ.\n- الإنقاء بالحجر: أن يبقى أثر لا يزيله إلا الماء. والإنقاء بالماء: عود خشونة المحل كما كان، وظنه كافٍ.\n- **لا يجزئ أقل من ثلاث مسحات**، وأن تعم كل مسحة المحل.\n- يسن الاستنجاء بالحجر ثم بالماء، **فإن عكس كُره**، ويجزئ أحدهما، والماء أفضل.\n- **يكره** استقبال القبلة واستدبارها في الاستنجاء.\n- **يحرم** بروث وعظم وطعام ولو لبهيمة، فإن فعل لم يجز بعد ذلك إلا الماء.\n- حالتان لا يجزئ فيهما إلا الماء: (1) إذا استجمر بروث أو عظم أو طعام، (2) إذا تعدى الخارج من السبيلين موضع العادة.\n- يجب الاستنجاء لكل خارج، إلا الطاهر، والنجس الذي لم يلوث المحل.\n- يسن لداخل الخلاء تقديم اليسرى وقول: «بسم الله، أعوذ بالله من الخبث والخبائث»، وعند الخروج يقدم اليمنى ويقول: «غفرانك، الحمد لله الذي أذهب عني الأذى وعافاني».\n\n**مكروهات قضاء الحاجة:**\n1. استقبال الشمس والقمر ومهب الريح.\n2. الكلام.\n3. البول في إناء وشق ونار ورماد.\n\n- **لا يكره البول قائمًا.**\n\n**المحرمات عند قضاء الحاجة:**\n1. استقبال القبلة واستدبارها في الصحراء بلا حائل (ويكفي إرخاء ذيله).\n2. أن يبول أو يتغوط بطريق مسلوك، وظل نافع، وتحت شجرة عليها ثمر يقصد، وبين قبور المسلمين.\n3. أن يلبث فوق قدر حاجته.\n\n### السواك وسنن الفطرة\n\n- يسن بعود رطب لا يتفتت. ومن استاك بغير عود **لم يصب السنة**.\n- مسنون مطلقًا **إلا بعد الزوال للصائم فيكره**، ويسن له قبل الزوال بعود يابس ويباح برطب.\n- **يتأكد** عند: وضوء وصلاة وقراءة، وانتباه من نوم، وتغير رائحة، ودخول مسجد ومنزل، وإطالة سكوت، وصفرة أسنان.\n- لا بأس أن يتسوك بالعود الواحد اثنان فصاعدًا.\n\n**سنن الفطرة:** 1- حلق العانة. 2- نتف الإبط. 3- تقليم الأظفار. 4- النظر في المرآة. 5- التطيب بالطيب. 6- الاكتحال كل ليلة في كل عين ثلاثًا. 7- حف الشارب. 8- إعفاء اللحية — **ويحرم حلقها**، ولا بأس بأخذ ما زاد على القبضة. 9- الختان — **وهو واجب على الذكر والأنثى عند البلوغ، وقبله أفضل**.\n\n### الوضوء\n\n- **واجبه:** التسمية، وتسقط سهوًا، وإن ذكرها في أثنائه ابتدأ. (وهي الواجب الوحيد).\n\n**فروضه (أركانه) ستة:**\n1. غسل الوجه ومنه المضمضة والاستنشاق.\n2. غسل اليدين مع المرفقين.\n3. مسح الرأس كله ومنه الأذنان.\n4. غسل الرجلين مع الكعبين.\n5. الترتيب.\n6. الموالاة.\n\n**شروطه ثمانية:**\n1. انقطاع ما يوجبه. 2- النية. 3- الإسلام. 4- العقل. 5- التمييز. 6- الماء الطهور المباح. 7- إزالة ما يمنع وصوله. 8- الاستنجاء أو الاستجمار.\n\n- **النية:** قصد رفع الحدث، أو قصد ما تجب له الطهارة كصلاة وطواف ومس مصحف، أو ما تسن له كقراءة وذكر وأذان ونوم ورفع شك وغضب وكلام محرم وجلوس بمسجد وتدريس علم وأكل.\n- **الفرق بين الركن والشرط:** كلاهما لا بد منه للصحة ولا يسقطان عمدًا ولا جهلًا ولا سهوًا؛ لكن **الركن جزء من أفعال العبادة**، **والشرط ليس جزءًا من أفعالها**.\n- لا يضر سبق لسانه بغير ما نوى.\n- لا يضر شكه في النية أو في فرض **بعد فراغ العبادة**، وإن شك في الأثناء **استأنف**.\n\n**صفة الوضوء:** ينوي، ثم يسمي، ويغسل كفيه، ثم يتمضمض ويستنشق، ثم يغسل وجهه من منابت شعر الرأس المعتاد، ثم يغسل يديه مع مرفقيه، ثم يمسح جميع ظاهر رأسه من حد الوجه إلى ما يسمى قفًا والبياض فوق الأذنين منه، ويدخل سبابتيه في صماخي أذنيه ويمسح بإبهاميه ظاهرهما، ثم يغسل رجليه مع كعبيه **وهما العظمان الناتئان**.\n\n**سننه ثمانية عشر:** استقبال القبلة، والسواك، وغسل الكفين ثلاثًا، والبداءة قبل غسل الوجه بالمضمضة والاستنشاق، والمبالغة فيهما لغير الصائم والمبالغة في سائر الأعضاء مطلقًا، والزيادة في ماء الوجه، وتخليل اللحية الكثيفة، وتخليل الأصابع، وأخذ ماء جديد للأذنين، وتقديم اليمنى على اليسرى، ومجاوزة محل الفرض، والغسلة الثانية والثالثة، واستصحاب ذكر النية إلى آخر الوضوء، والإتيان بها عند غسل الكفين، والنطق بها سرًّا، وقول الشهادتين بعد فراغه مع رفع بصره إلى السماء، وأن يتولى وضوءه بنفسه من غير معاونة.\n\n### المسح على الخفين والعصائب والجبائر\n\n**شروط جواز المسح سبعة:**\n1. لبسهما بعد كمال الطهارة بالماء.\n2. سترهما لمحل الفرض ولو بربطهما.\n3. إمكان المشي بهما عرفًا.\n4. ثبوتهما بنفسهما.\n5. إباحتهما.\n6. طهارة عينهما.\n7. عدم وصفهما البشرة.\n\n- **المدة:** المقيم والعاصي بسفره: **يوم وليلة**، والمسافر: **ثلاثة أيام بلياليهن**، من الحدث بعد اللبس.\n- من مسح في السفر ثم أقام، أو في الحضر ثم سافر، أو شك في ابتداء المسح: **لم يزد على مسح المقيم**.\n- **يجب مسح أعلى الخف**، ولا يجزئ مسح أسفله وعقبه ولا يسن.\n- يبطل الوضوء بما يوجب الغسل، أو ظهور بعض محل الفرض، أو انقضاء مدة المسح.\n- **الجبيرة:** إن وضعها على طهارة ولم تتجاوز محل الحاجة: غسل الجزء الصحيح ومسح عليها بالماء وأجزأ. وإن لم توضع على طهارة أو تجاوزت المحل فلا مسح بل يجب غسلها، فإن خشي الضرر بنزعها غسل الموضع المكشوف ومسح على الجبيرة **ويتيمم**.\n\n### نواقض الوضوء (ثمانية)\n\n1. الخارج من السبيلين: قليلًا كان أو كثيرًا، طاهرًا أو نجسًا.\n2. خروج النجاسة من بقية البدن: فإن كان بولًا أو غائطًا نقض مطلقًا، وإن كان غيرهما كالدم والقيء **نقض إن فحش** في نفس كل أحد بحسبه.\n3. زوال العقل أو تغطيته بإغماء أو نوم، ما لم يكن النوم يسيرًا عرفًا من جالس وقائم.\n4. مسه بيده لا بظفره فرج الآدمي المتصل بلا حائل أو حلقة دبره — **لا** مس الخصيتين ولا مس محل الفرج البائن.\n5. لمس بشرة الذكر الأنثى أو الأنثى الذكر لشهوة من غير حائل ولو كان الملموس ميتًا أو عجوزًا أو محرمًا — لا لمس من دون سبع، ولا لمس سن وظفر وشعر، ولا ينقض وضوء الممسوس فرجه ولا الملموس بدنه ولو وجد شهوة.\n6. غسل الميت أو بعضه (والغاسل من يقلب الميت ويباشره لا من يصب الماء).\n7. أكل لحم الإبل ولو نيئًا، **فلا نقض ببقية أجزائها** ككبد وقلب وطحال وكرش وشحم وكلية ورأس ولسان وسنام وكوارع ومصران ومرق لحم.\n8. الردة، وكل ما أوجب الغسل غير الموت.\n\n- من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: **عمل بما تيقن**.\n- **يحرم على المحدث:** الصلاة والطواف ومس المصحف ببشرته بلا حائل. ويزيد **من عليه غسل**: قراءة القرآن واللبث في المسجد بلا وضوء.\n\n### الغسل\n\n**موجباته سبعة:**\n1. انتقال المني (فلو أحس بانتقاله فحبسه فلم يخرج وجب الغسل).\n2. خروجه من مخرجه ولو دمًا، ويشترط أن يكون بلذة ما لم يكن نائمًا.\n3. تغيب الحشفة كلها أو قدرها بلا حائل في فرج ولو دبرًا لميت أو بهيمة أو طير — **ولا يجب الغسل إلا على ابن عشر وبنت تسع**.\n4. إسلام الكافر ولو مرتدًا.\n5. خروج الحيض.\n6. خروج دم النفاس.\n7. الموت (تعبدًا).\n\n**شروطه سبعة:** انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.\n\n- **واجبه:** التسمية فقط، وتسقط سهوًا.\n- **فرضه:** أن يعم بالماء جميع بدنه وداخل فمه وأنفه، حتى ما يظهر من فرج المرأة عند القعود لحاجتها، وحتى باطن شعرها.\n- **نقض الشعر:** يجب في الحيض والنفاس، **ولا يجب في الجنابة**.\n- يكفي الظن في الإسباغ.\n\n**سننه:** الوضوء قبله، وإزالة ما لوثه من أذى، وإفراغ الماء على رأسه ثلاثًا وعلى بقية جسده ثلاثًا، والتيامن، والموالاة، وإمرار اليد على الجسد، وإعادة غسل رجليه بمكان آخر.\n\n- من نوى غسلًا مسنونًا أو واجبًا **أجزأ عن الآخر**. وإن نوى رفع الحدثين، أو الحدث وأطلق، أو أمرًا لا يباح إلا بوضوء وغسل أجزأ عنهما.\n- **المقدار:** يسن الوضوء **بمد** (رطل وثلث بالعراقي)، والاغتسال **بصاع** (خمسة أرطال وثلث بالعراقي). ويكره الإسراف لا الإسباغ بدون ما ذكر.\n- يباح الغسل في المسجد ما لم يؤذه، وفي الحمام إن أمن الوقوع في المحرم، فإن خيف كره وإن علم حرم.\n\n**الأغسال المستحبة ستة عشر:** آكدها لصلاة الجمعة في يومها لذكر حضرها، ثم لغسل ميت، ثم لعيد في يومه، وللكسوف، والاستسقاء، والجنون، والإغماء، والاستحاضة لكل صلاة، وللإحرام، ولدخول مكة، وحرمها، وللوقوف بعرفة، وطواف الزيارة، وطواف الوداع، والمبيت بمزدلفة، ورمي الجمار. ويتيمم للكل لحاجة، ويسن له الوضوء إن تعذر.\n\n### التيمم\n\n**شروطه ثمانية:**\n1. النية. 2- الإسلام. 3- العقل. 4- التمييز. 5- الاستنجاء أو الاستجمار.\n6. دخول وقت الصلاة: فلا يصح لصلاة قبل وقتها ولا لنافلة وقت نهي.\n7. تعذر استعمال الماء: إما لعدمه أو لخوف الضرر باستعماله. ويجب بذله لعطشان من آدمي أو بهيمة محترمين. ومن وجد ماء لا يكفي لطهارته استعمله فيما يكفي وجوبًا ثم تيمم. ومن وجد ماء لا يكفي وببدنه وثوبه نجاسة: وجب غسل ثوبه ثم بدنه ثم يتطهر به وإلا تيمم. ويصح التيمم لكل حدث وللنجاسة على البدن بعد تخفيفها ما أمكن.\n8. أن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد، فإن لم يجد صلى الفرض فقط على حسب حاله ولا إعادة.\n\n- **واجبه:** التسمية فقط، وتسقط سهوًا.\n\n**فروضه خمسة:**\n1. مسح الوجه.\n2. مسح اليدين **إلى الكوعين**.\n3. الترتيب في الطهارة الصغرى.\n4. الموالاة.\n5. تعيين النية لما يتيمم له من حدث أو نجاسة، فلا تكفي نية أحدهما عن الآخر، وإن نواهما أجزأ.\n\n**مبطلاته خمسة:** ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه.\n\n- إن وجد الماء وهو في الصلاة **بطلت**، وإن انقضت **لم تجب الإعادة**.\n- **صفته:** ينوي، ثم يسمي، ويضرب التراب بيديه مفرجتي الأصابع **ضربة واحدة والأحوط ثنتان** بعد نزع خاتم ونحوه، فيمسح وجهه بباطن أصابعه وكفيه براحتيه.\n- يسن لمن يرجو وجود الماء تأخير التيمم إلى آخر الوقت المختار.\n- له أن يصلي بتيمم واحد ما شاء من الفرض والنفل، **ولو تيمم للنفل لم يستبح الفرض**.\n\n### النجاسات وإزالتها\n\n- يشترط لكل متنجس **سبع غسلات**، وفي المتنجس بكلب أو خنزير: سبع غسلات **إحداها بتراب طاهر طهور أو صابون ونحوه**.\n- بول الغلام الذي لم يأكل طعامًا لشهوة: **يجزئ نضحه** وهو غمره بالماء.\n- **يضر بقاء طعم النجاسة، لا لونها أو ريحها أو هما عجزًا.**\n- يجزئ في تطهير صخر وأحواض وأرض تنجست بمائع ولو من كلب أو خنزير: مكاثرتها بالماء حتى يذهب لون النجاسة وريحها.\n- **لا تطهر الأرض بالشمس والريح والجفاف**، ولا تطهر النجاسة بالنار.\n- **تطهر الخمرة بإنائها إن انقلبت خلًّا بنفسها.**\n- إذا خفي موضع النجاسة غسل حتى يتيقن غسلها.\n\n**الأشياء النجسة:**\n1. المسكر المائع وكذا الحشيشة (والمسكر غير المائع طاهر).\n2. ما لا يؤكل من الطير والبهائم مما فوق الهر خلقة نجس، وما دونها في الخلقة كالحية والفأر طاهر.\n3. كل ميتة نجسة غير ميتة الآدمي والسمك والجراد وما لا نفس له سائلة كالعقرب والخنفساء والبق والقمل والبراغيث.\n4. بول وروث وقيء ومذي وودي ومني ولبن ما لا يؤكل لحمه نجس، **إلا مني الآدمي ولبنه فطاهر**. وما يؤكل لحمه ولم يكن أكثر علفه النجاسة فطاهر.\n5. القيح والدم والصديد نجس، **لكن يعفى في الصلاة عن يسيره** إذا كان من حيوان طاهر في الحياة ولو من دم حائض أو نفساء.\n\n- يضم يسير متفرق بثوب واحد، لا أكثر (أي: لا تضم الثياب بعضها إلى بعض).\n- طين الشارع الذي ظنت نجاسته، وعرق وريق الطاهر: **طاهر**.\n- لو أكل هر أو نحوه أو طفل نجاسة ثم شرب من مائع لم يضر.\n- **لا يكره سؤر حيوان طاهر**، وهو فضلة طعامه وشرابه.\n\n### الحيض والاستحاضة والنفاس\n\n- **لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة.** ولا حيض مع حمل.\n- **أقل الحيض يوم وليلة، وأكثره خمسة عشر يومًا، وغالبه ست أو سبع.**\n- **أقل الطهر بين الحيضتين ثلاثة عشر يومًا**، وغالبه بقية الشهر، ولا حد لأكثره.\n\n**يحرم بالحيض:** 1- الوطء في الفرج. 2- الطلاق. 3- الصلاة. 4- الصوم. 5- الطواف. 6- قراءة القرآن. 7- مس المصحف. 8- اللبث في المسجد. 9- المرور فيه إن خافت تلويثه.\n\n- الحيض **يوجب**: الغسل، والبلوغ، والكفارة بالوطء فيه ولو مكرهًا أو ناسيًا أو جاهلًا — وهي **دينار أو نصفه على التخيير**، وكذا هي إن طاوعت.\n- لا يباح الوطء بعد انقطاعه وقبل غسلها أو تيممها. والذي يباح بعد الانقطاع وقبل الغسل: **الصوم، والطلاق، واللبث بوضوء في المسجد**.\n- علامة الطهر: انقطاع الدم بألا تتغير قطنة احتشت بها.\n- **تقضي الحائض والنفساء الصوم لا الصلاة.**\n- من جاوز دمها خمسة عشر يومًا فهي **مستحاضة**، وغير المميزة **تجلس من كل شهر ستًّا أو سبعًا**، ثم تغتسل وتصوم وتصلي بعد غسل المحل وتعصيبه، **وتتوضأ لوقت كل صلاة وتنوي الاستباحة**. وكذا كل من حدثه دائم.\n- **يحرم وطء المستحاضة ولا كفارة.**\n- **النفاس:** لا حد لأقله، **وأكثره أربعون يومًا**، ويثبت حكمه بوضع ما تبين فيه خلق إنسان. وإن تخلل الأربعين نقاء فهو طهر لكن يكره وطؤها فيه. ومن وضعت ولدين فأكثر فأول مدة النفاس من الأول. وفي وطء النفساء ما في وطء الحائض.\n- يجوز للرجل شرب دواء مباح يمنع الجماع، وللأنثى شربه لحصول الحيض ولقطعه.\n\n---\n\n## كتاب الصلاة\n\n- تجب على كل **مسلم مكلف** غير الحائض والنفساء.\n- تصح من المميز وهو من بلغ سبعًا، والثواب له، ويلزم وليه أمره بها لسبع وضربه على تركها لعشر.\n- من تركها **جحودًا** فقد ارتد وجرت عليه أحكام المرتدين.\n\n### الأذان والإقامة\n\n- هما **فرض كفاية في الحضر على الرجال الأحرار**، ويسنان للمنفرد وفي السفر، **ويكرهان للنساء** ولو بلا رفع صوت.\n- **شروط صحتهما:** أن يكونا مرتبين متواليين عرفًا، من شخص واحد بنية، وشرط كون المؤذن مسلمًا ذكرًا عاقلًا مميزًا ناطقًا عدلًا ولو ظاهرًا، ولا يصحان قبل الوقت **إلا أذان الفجر فيصح بعد نصف الليل**.\n- **ركن الأذان: رفع الصوت**، ما لم يؤذن لحاضر.\n- يسن كون المؤذن: صيتًا، أمينًا، عالمًا بالوقت، متطهرًا، قائمًا.\n- **لا يكره أذان المحدث، بل تكره إقامته.**\n- يسن الأذان أول الوقت.\n- **مستحبات الأذان:** الترسل فيه، وأن يكون على علو، رافعًا وجهه، جاعلًا سبابتيه في أذنيه، مستقبل القبلة، يلتفت يمينًا لـ«حي على الصلاة» وشمالًا لـ«حي على الفلاح»، ولا يزيل قدميه ما لم يكن بمنارة.\n- **التثويب:** أن يقول بعد حيعلة أذان الفجر: «الصلاة خير من النوم» **مرتين**.\n- يسن أن يتولى الأذان والإقامة واحد ما لم يشق.\n- **من جمع أو قضى فوائت: أذن للأولى وأقام للكل.**\n- يسن لسامع المؤذن أن يقول مثله إلا: في الحيعلة فيقول «لا حول ولا قوة إلا بالله»، وفي التثويب «صدقت وبررت»، وفي لفظ الإقامة «أقامها الله وأدامها»، ثم يصلي على النبي ﷺ ويقول: «اللهم رب هذه الدعوة التامة...» ثم يدعو.\n- **يحرم بعد الأذان الخروج من المسجد بلا عذر أو نية رجوع.**\n\n### شروط الصلاة (تسعة)\n\n1. الإسلام. 2- العقل. 3- التمييز. 4- الطهارة مع القدرة. 5- دخول الوقت. 6- ستر العورة مع القدرة بشيء لا يصف البشرة. 7- اجتناب النجاسة ببدنه وثوبه وبقعته مع القدرة. 8- استقبال القبلة. 9- النية.\n\n**المواقيت:**\n- **الظهر:** من الزوال إلى أن يصير ظل كل شيء **مثله** سوى ظل الزوال.\n- **العصر (المختار):** حتى يصير ظل كل شيء **مثليه** سوى ظل الزوال، ثم هو وقت ضرورة إلى الغروب.\n- **المغرب:** حتى يغيب الشفق الأحمر.\n- **العشاء (المختار):** إلى **ثلث الليل**، ثم هو وقت ضرورة إلى طلوع الفجر.\n- **الفجر:** إلى شروق الشمس.\n\n- **يدرك الوقت بتكبيرة الإحرام.**\n- يحرم تأخير الصلاة عن وقت الجواز، ويجوز تأخير فعلها في الوقت مع العزم عليه، والصلاة أول الوقت أفضل، وتحصل الفضيلة بالتأهب أول الوقت.\n- **يجب قضاء الصلاة الفائتة مرتبة فورًا**، ولا يصح النفل المطلق لمن عليه فوائت. **ويسقط الترتيب: بالنسيان، وبضيق الوقت** ولو في وقت الاختيار.\n\n**العورة:**\n- **ما بين السرة والركبة:** عورة الذكر البالغ (من بلغ عشرًا)، والحرة المميزة، والأمة ولو مبعضة. **ويشترط في فرض الرجل البالغ ستر أحد عاتقيه بشيء من اللباس.**\n- **الفرجان:** عورة ابن سبع إلى عشر.\n- **الحرة البالغة: كلها عورة في الصلاة إلا وجهها.**\n\n- من صلى في مغصوب أو حرير **عالمًا ذاكرًا لم تصح** صلاته (وإن كان ناسيًا أو جاهلًا صحت).\n- من لم يجد إلا ثوبًا مغصوبًا **صلى عريانًا**؛ ومن عنده ثوب حرير يملكه صلى فيه **ولا يعيد**؛ ومن لم يجد إلا ثوبًا نجسًا صلى فيه **ويعيد**.\n- **يحرم على الذكور لا الإناث:** لبس المنسوج والمموه بذهب أو فضة، ولبس ما كله أو غالبه حرير. **ويباح:** ما سُدِّي بالحرير وأُلحم بغيره، أو كان الحرير وغيره في الظهور سيان.\n- من حبس ببقعة نجسة **صحت صلاته**، لكن يومئ بالنجاسة الرطبة غاية ما يمكنه ويجلس على قدميه.\n- تصح الصلاة إن مس ثوبه ثوبًا نجسًا أو حائطًا نجسًا **من غير استناد**، أو صلى على طاهر طرفه متنجس، أو سقطت عليه نجاسة فأزالها سريعًا. **وتبطل** إن عجز عن إزالتها في الحال أو نسيها ثم علم بعد صلاته.\n\n**لا تصح الصلاة في:** 1- الأرض المغصوبة. 2- المقبرة. 3- المجزرة. 4- المزبلة. 5- الحش. 6- أعطان الإبل. 7- قارعة الطريق. 8- الحمام. 9- أسطحة هذه الأشياء. 10- ولا يصح الفرض في الكعبة والحجر منها. 11- ولا على ظهرها إلا إذا لم يبق وراءه شيء منها. **ويصح فيها النفل بل يسن**، ويصح النذر فيها وعليها.\n\n- من لم يجد من يخبره عن القبلة بيقين صلى بالاجتهاد، **فإن أخطأ فلا إعادة**.\n- **النية:** لا تسقط بحال، ومحلها القلب، وحقيقتها العزم على فعل الشيء، وشرطها الإسلام والعقل والتمييز. وزمنها أول العبادة أو قبيلها بيسير، **والأفضل قرنها بالتكبير**.\n- يشترط تعيين ما يصليه من ظهر أو عصر أو وتر أو راتبة، ولا يشترط تعيين كونها حاضرة أو قضاءً أو فرضًا.\n- تشترط نية الإمامة للإمام ونية الائتمام للمأموم، وتصح نية المفارقة لعذر يبيح ترك الجماعة.\n- من أحرم بفرض ثم قلبه نفلًا **صح إن اتسع الوقت**، وإلا لم يصح النفل وبطل فرضه.\n\n### أركان الصلاة (أربعة عشر) — لا تسقط عمدًا ولا جهلًا ولا سهوًا\n\n1. القيام في الفرض على القادر منتصبًا.\n2. تكبيرة الإحرام، وهي: «الله أكبر».\n3. قراءة الفاتحة مرتبة.\n4. الركوع.\n5. الرفع منه.\n6. الاعتدال قائمًا.\n7. السجود.\n8. الرفع من السجود.\n9. الجلوس بين السجدتين (وكيف جلس كفى).\n10. الطمأنينة.\n11. التشهد الأخير، وهو: «اللهم صل على محمد» بعد الإتيان بما يجزئ من التشهد الأول.\n12. الجلوس للتشهد الأخير وللتسليمتين.\n13. التسليمتان: «السلام عليكم ورحمة الله» مرتين (والأولى ألا يزيد «وبركاته»)، ويكفي في النفل والجنازة تسليمة واحدة.\n14. ترتيب الأركان.\n\n**تفصيلات:**\n- إن وقف منحنيًا أو مائلًا بحيث لا يسمى قائمًا لغير عذر **لم تصح**. ولا يضر خفض رأسه. **ويكره** القيام على رجل واحدة لغير عذر.\n- **لا يجزئ في تكبيرة الإحرام غير «الله أكبر»**، ويقولها قائمًا، فإن ابتدأها أو أتمها غير قائم صحت نفلًا.\n- **تنعقد إن مد اللام**، ولا تنعقد إن مد همزة «الله» أو همزة «أكبر» أو قال «أكبار» أو «الأكبر».\n- الجهر بكل ركن وواجب **بقدر ما يسمع نفسه فرض**.\n- **في الفاتحة إحدى عشرة تشديدة**، فإن ترك تشديدة واحدة أو حرفًا ولم يأت بما ترك لم تصح. ومن لم يعرف إلا آية كررها بقدر سورة الفاتحة.\n- **أقل الركوع:** أن ينحني بحيث يمكنه مس ركبتيه بكفيه. **وأكمله:** أن يمد ظهره مستويًا ويجعل رأسه حياله.\n- لا تبطل إن طال الاعتدال.\n- **أكمل السجود:** تمكين جبهته وأنفه وكفيه وركبتيه وأطراف أصابع قدميه من محل سجوده. **وأقله:** وضع جزء من كل عضو. ويعتبر المقر لأعضاء السجود، فلو وضع جبهته على نحو قطن منفوش ولم ينكبس لم تصح. ويصح السجود على كمه وذيله ويكره بلا عذر. ومن عجز بالجبهة لم يلزمه بغيرها ويومئ ما يمكنه.\n- **السنة في الجلوس بين السجدتين:** الافتراش على رجله اليسرى ونصب اليمنى وتوجيهها إلى القبلة.\n- **الطمأنينة:** السكون وإن قل.\n- لو تشهد غير جالس، أو سلم الأولى جالسًا والثانية غير جالس، **لم تصح**.\n- لو سجد قبل ركوعه **عمدًا بطلت**، **وسهوًا لزمه الرجوع** ليركع ثم يسجد.\n\n### واجبات الصلاة (ثمانية) — تبطل بتركها عمدًا، وتسقط سهوًا وجهلًا\n\n1. التكبير لغير الإحرام (لكن تكبيرة المسبوق التي بعد تكبيرة الإحرام **سنة**).\n2. قول «سمع الله لمن حمده» **للإمام والمنفرد لا للمأموم**.\n3. قول «ربنا ولك الحمد» **للكل**.\n4. قول «سبحان ربي العظيم» مرة في الركوع.\n5. «سبحان ربي الأعلى» مرة في السجود.\n6. «رب اغفر لي» بين السجدتين.\n7. التشهد الأول، على غير من قام إمامه سهوًا.\n8. الجلوس للتشهد الأول.\n\n### سنن الصلاة — لا تبطل الصلاة بترك شيء منها ولو عمدًا، ويباح السجود لسهوه\n\n**سنن الأقوال (إحدى عشرة):**\n1. الاستفتاح: «سبحانك اللهم وبحمدك وتبارك اسمك وتعالى جدك ولا إله غيرك».\n2. التعوذ. 3- البسملة. 4- قول «آمين». 5- قراءة السورة بعد الفاتحة.\n6. الجهر بالقراءة للإمام، **ويكره للمأموم، ويخير المنفرد**.\n7. قول غير المأموم بعد التحميد: «ملء السموات وملء الأرض...».\n8. ما زاد على المرة في تسبيح الركوع والسجود. 9- «رب اغفر لي».\n10. الصلاة في التشهد الأخير على آله. 11- الدعاء بعده.\n\n**سنن الأفعال (الهيئات):** رفع اليدين مع تكبيرة الإحرام وعند الركوع وعند الرفع منه، وحطهما عقب ذلك، ووضع اليمين على الشمال، وجعلهما تحت سرته، والنظر إلى موضع سجوده، والتفرقة بين قدميه، وقبض ركبتيه بيديه مفرجتي الأصابع في ركوعه، ومد ظهره فيه، وجعل رأسه حياله، والبداءة في سجوده بوضع ركبتيه ثم يديه ثم جبهته وأنفه، وتمكين أعضاء السجود ومباشرتها (سوى الركبتين فيكره)، ومجافاة عضديه عن جنبيه وبطنه عن فخذيه وفخذيه عن ساقيه، وتفريق ركبتيه، وإقامة قدميه، ووضع يديه حذو منكبيه مبسوطة مضمومة الأصابع، ورفع يديه أولًا في قيامه إلى الركعة، وقيامه على صدور قدميه، واعتماده على ركبتيه بيديه، **والافتراش في الجلوس بين السجدتين وفي التشهد الأول، والتورك في التشهد الثاني**، ووضع اليدين على الفخذين مبسوطتين مضمومتي الأصابع بين السجدتين، وكذا في التشهد إلا أنه يقبض من اليمنى الخنصر والبنصر ويحلق إبهامها مع الوسطى ويشير بسبابتها عند ذكر الله، والالتفات يمينًا وشمالًا في تسليمه، ونيته به الخروج من الصلاة، وتفضيل الشمال على اليمين في الالتفات.\n\n### مكروهات الصلاة\n\nافتراش ذراعيه ساجدًا، والعبث، والتخصر، ومس الحصى، وتسوية التراب بلا عذر، والتروح بمروحة، وفرقعة الأصابع وتشبيكها، ومس لحيته، وكف ثوبه (**ومتى كثر ذلك عرفًا بطلت**)؛ واقتصاره على الفاتحة وتكرارها، وحمده إذا عطس أو وجد ما يسره، واسترجاعه إذا وجد ما يغمه، وفتح فمه، ووضعه فيه شيئًا؛ والتمطي، وأن يستند بلا حاجة (فإن استند بحيث يقع لو أزيل ما استند إليه **بطلت**)، وحمل مشغل له؛ وأن يخص جبهته بما يسجد عليه، وأن يمسح أثر سجوده؛ واستقبال صورة ووجه آدمي ومتحدث ونائم ونار وما يلهيه، والالتفات بلا حاجة، وتغميض عينيه.\n\n### مبطلات الصلاة\n\n- **متعلقة بالإمام:** تقديم المأموم على إمامه، وبطلان صلاة إمامه، وسلامه عمدًا قبل إمامه، أو سلامه سهوًا ولم يعده.\n- **متعلقة بالأقوال:** تعمد إحالة المعنى في القراءة، والدعاء بملاذ الدنيا، والإتيان بكاف الخطاب لغير الله ورسوله، والقهقهة، **والكلام ولو سهوًا**، والتنحنح بلا حاجة، والانتحاب لا خشية، والنفخ إن بان حرفان.\n- **ولا تبطل** إن نام فتكلم، أو سبق على لسانه حال قراءته، أو **غلبه سعال أو عطاس أو تثاؤب أو بكاء**.\n- **متعلقة بالنية:** فسخ النية، والتردد في الفسخ، والعزم عليه، والشك هل نوى فيعمل مع الشك عملًا.\n- **متعلقة بالأفعال:** ما أبطل الطهارة، وكشف العورة عمدًا، واستدبار القبلة، واتصال النجاسة به إن لم يزلها في الحال، والعمل الكثير عادة من غير جنسها لغير ضرورة، والاستناد قويًّا لغير عذر، ورجوعه عالمًا ذاكرًا للتشهد بعد الشروع في القراءة، وتعمد زيادة ركن فعلي، وتعمد تقديم بعض الأركان على بعض، وتعمد السلام قبل إتمامها، ووجود سترة بعيدة وهو عريان، **والأكل والشرب سوى اليسير عرفًا لناسٍ وجاهل**.\n\n### سجود السهو\n\n- **يسن:** إذا أتى بقول مشروع في غير محله سهوًا.\n- **يباح:** إذا ترك مسنونًا.\n- **يجب:** 1- إذا زاد ركوعًا أو سجودًا أو قيامًا أو قعودًا. 2- أو سلم قبل إتمامها. 3- أو لحن لحنًا يحيل المعنى. 4- أو ترك واجبًا. 5- أو شك في زيادة وقت فعلها.\n- **تبطل الصلاة بتعمد ترك سجود السهو الواجب**، لا إن ترك ما وجب بسلامه قبل إتمامها.\n- إن شاء سجد سجدتي السهو قبل السلام أو بعده، **لكن إن سجدهما بعده تشهد وجوبًا وسلم**.\n- إن نسي السجود حتى طال الفصل عرفًا، أو أحدث، أو خرج من المسجد: **سقط**.\n- **لا سجود على مأموم دخل أول الصلاة إذا سها**، وإن سها إمامه **لزمه متابعته**، وإن لم يسجد إمامه **وجب عليه هو**.\n- من قام لركعة زائدة **جلس متى ذكر**.\n- من نهض عن ترك التشهد ناسيًا: إن ذكره **قبل أن يستتم قائمًا لزمه الرجوع**، **ويكره** إن استتم قائمًا، **ولا يرجع إن شرع في القراءة**، ويلزم المأموم متابعته.\n- من شك في ركن أو عدد ركعات وهو في الصلاة **بنى على اليقين وهو الأقل وسجد للسهو**، وإن كان الشك بعد فراغها فلا أثر له.\n\n### صلاة التطوع\n\n- هي أفضل تطوع البدن بعد الجهاد والعلم.\n- **أفضلها ما سُن له الجماعة، وآكدها: الكسوف، فالاستسقاء، فالتراويح، فالوتر.**\n- **الوتر:** أقله ركعة، وأكثره إحدى عشرة، وأدنى الكمال ثلاث بسلامين، ويجوز بواحد سردًا. **ووقته ما بين صلاة العشاء وطلوع الفجر.**\n- **القنوت في الوتر بعد الركوع ندبًا**، ولو كبر ورفع يديه ثم قنت قبل الركوع جاز. ويدعو بما شاء ومما ورد: «اللهم اهدنا فيمن هديت...»، ثم يصلي على النبي ﷺ. ويؤمن المأموم، ويمسح وجهه بيديه هنا وفي الدعاء خارج الصلاة. **ويكره القنوت في غير الوتر.**\n- **أفضل الرواتب سنة الفجر ثم المغرب**، ثم باقيها في الفضل سواء.\n- **الرواتب المؤكدة عشر:** ركعتان قبل الظهر وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر.\n- يسن قضاء الرواتب والوتر إلا ما فات مع فرضه وكثر فالأولى تركه. وفعل الكل بالبيت أفضل. ويسن الفصل بين الفرض وسنته بقيام أو كلام.\n- **التراويح عشرون ركعة برمضان، ووقتها ما بين العشاء والوتر.**\n- صلاة الليل أفضل من صلاة النهار، والنصف الأخير أفضل من الأول. **والتهجد: ما كان بعد النوم.**\n- يسن قيام الليل وافتتاحه بركعتين خفيفتين ونيته عند النوم. **ويصح التطوع بركعة.**\n- **أجر القاعد غير المعذور نصف أجر القائم.**\n- **كثرة الركوع والسجود أفضل من طول القيام.**\n- **الضحى:** تسن غِبًّا، أقلها ركعتان وأكثرها ثمان، ووقتها من خروج وقت النهي إلى قبيل الزوال، وأفضله إذا اشتد الحر.\n- تسن تحية المسجد وسنة الوضوء، ويسن إحياء ما بين العشاءين وهو من قيام الليل.\n\n### سجود التلاوة والشكر\n\n- **يسن سجود التلاوة** مع قصر الفصل، للقارئ والمستمع، **وهو كالنافلة فيما يعتبر لها**.\n- **صفته:** يكبر إذا سجد بتكبيرة إحرام، وإذا رفع كبر، ويجلس **ويسلم بلا تشهد**.\n- إن سجد المأموم لقراءة نفسه أو لقراءة غير إمامه عمدًا **بطلت صلاته**. ويلزمه متابعة إمامه في صلاة الجهر، فلو ترك متابعته عمدًا بطلت.\n- يعتبر كون القارئ يصلح إمامًا للمستمع، فلا يسجد إن لم يسجد، ولا يسجد قدامه، ولا يسجد رجل لتلاوة امرأة وخنثى، ويصح أن يسجد لتلاوة أمي وزمن ومميز.\n- **سجود الشكر:** يسن عند تجدد النعم واندفاع النقم، **وإن سجد له في صلاة عالمًا ذاكرًا بطلت**، وصفته وأحكامه كسجود التلاوة.\n\n### أوقات النهي\n\n1. من طلوع الفجر إلى ارتفاع الشمس قيد رمح.\n2. ومن صلاة العصر إلى غروب الشمس.\n3. وعند قيامها حتى تزول.\n\n- **تحرم صلاة التطوع فيها ولا تنعقد** ولو كان جاهلًا للوقت والتحريم، **سوى:** سنة الفجر قبل صلاة الفجر، وركعتي الطواف، وسنة الظهر إذا جمع، وإعادة جماعة أقيمت وهو في المسجد.\n- **يجوز فيها قضاء الفرائض** وفعل المنذورة ولو نذرها فيها.\n- الاعتبار في التحريم بعد العصر **بفراغ صلاة نفسه لا بشروعه فيها**.\n\n### قراءة القرآن\n\n- تباح قراءة القرآن في الطريق ومع حدث أصغر ونجاسة ثوب وبدن وفم.\n- **حفظ القرآن فرض كفاية**، ويتعين حفظ ما يجب في الصلاة.\n\n### صلاة الجماعة والإمامة\n\n- **تجب على الرجال الأحرار القادرين حضرًا وسفرًا.**\n- **أقلها إمام ومأموم ولو أنثى**، ولا تنعقد في الفرض بالمميز.\n- تسن الجماعة في المسجد، وتسن للنساء ويصلين منفردات عن الرجال.\n- **يحرم أن يؤم بمسجد له إمام راتب**، فلا تصح إلا مع إذنه إن كره ذلك، ما لم يضق الوقت.\n- **من كبر قبل تسليمة الإمام الأولى أدرك الجماعة.**\n- **من أدرك الركوع غير شاك أدرك الركعة** واطمأن ثم تابع.\n- يسن دخول المأموم مع إمامه كيف أدركه.\n- إن قام المسبوق قبل تسليمة إمامه الثانية ولم يرجع **انقلبت نفلًا**.\n- إذا أقيمت الصلاة التي يريد أن يصلي مع إمامها **لم تنعقد نافلته**، وإن أقيمت وهو فيها أتمها خفيفة.\n- من صلى ثم أقيمت الجماعة سن أن يعيد، **والأولى هي الفرض**.\n\n**ما يتحمله الإمام عن المأموم:** 1- القراءة. 2- سجود السهو. 3- سجود التلاوة. 4- السترة. 5- دعاء القنوت. 6- التشهد الأول إذا سبق بركعة في رباعية.\n\n- يسن للمأموم أن يستفتح ويتعوذ في الجهرية ويقرأ الفاتحة وسورة في سكتات إمامه وهي: قبل الفاتحة، وبعدها، وبعد فراغ القراءة. ويقرأ فيما لا يجهر فيه متى شاء.\n- **من أحرم مع إمامه أو قبل إتمامه لتكبيرة الإحرام لم تنعقد صلاته.**\n- الأولى للمأموم أن يشرع بعد إمامه، **فإن وافقه كره، وإن سبقه حرم**؛ فمن ركع أو سجد أو رفع قبل إمامه عمدًا لزمه الرجوع، فإن أبى عالمًا عمدًا **بطلت**، ولا تبطل صلاة ناسٍ وجاهل.\n- يسن للإمام التخفيف مع الإتمام ما لم يؤثر المأموم التطويل، ويسن انتظار داخل إن لم يشق على المأموم.\n- من استأذنته امرأته إلى المسجد كره منعها، وبيتها خير لها.\n\n**الأولى بالإمامة:** 1- الأجود قراءة الأفقه (ويقدم قارئ لا يعلم فقه صلاته على فقيه أمي). 2- ثم الأسن. 3- ثم الأشرف. 4- ثم الأتقى والأورع. 5- ثم يقرع.\nوصاحب البيت وإمام المسجد ولو عبدًا **أحق**، والحر أولى من العبد، والحاضر والبصير والمتوضئ أولى من ضدهم. **وتكره إمامة غير الأولى بلا إذن.**\n\n- **لا تصح إمامة الفاسق إلا في جمعة وعيد تعذرًا خلف غيره.**\n- تصح إمامة الأعمى والأصم والأقلف وكثير اللحن الذي لم يحل المعنى والتمتام **مع الكراهة**.\n- لا تصح إمامة العاجز عن شرط أو ركن إلا بمأموم عاجز مثله، **إلا الإمام الراتب المرجو زوال علته** فيصلي جالسًا ويجلسون خلفه وتصح قيامًا.\n- إن ترك الإمام ركنًا أو شرطًا مختلفًا فيه مقلدًا **صحت**. ومن صلى خلف من يعتقد بطلان صلاته **أعاد**. ولا إنكار في مسائل الاجتهاد.\n- **لا تصح إمامة المرأة بالرجال، ولا المميز بالبالغ في الفرض**، وتصح إمامته في النفل وفي الفرض بمثله.\n- **لا تصح إمامة محدث ولا نجس يعلم ذلك**، فإن جهل هو والمأموم حتى انقضت **صحت صلاة المأموم وحده**.\n- **لا تصح إمامة الأمي** (وهو من لا يحسن الفاتحة) إلا بمثله.\n- **يصح النفل خلف الفرض ولا عكسه.** وتصح المقضية خلف الحاضرة وعكسه حيث تساوتا في الاسم.\n\n**المواقف:**\n- يصح وقوف الإمام وسط المأمومين، **والسنة تقدمه عليهم**.\n- **الرجل الواحد يقف عن يمينه محاذيًا له**، ولا تصح خلفه ولا عن يساره مع خلو يمينه. **وتقف المرأة خلفه.**\n- **من صلى ركعة خلف الصف منفردًا فصلاته باطلة.**\n- إن أمكن الاقتداء بالإمام ولو كان بينهما فوق ثلاثمائة ذراع صح، بشرط رؤية الإمام أو من وراءه؛ وإن كانا في المسجد لم تشترط الرؤية وكفى سماع التكبير. **وإن كان بينهما نهر تجري فيه السفن أو طريق لم تصح.**\n- **يكره علو الإمام عن المأموم ولا يكره عكسه.**\n- يكره لمن أكل بصلًا أو فجلًا ونحوه حضور المسجد.\n\n**الأعذار المبيحة لترك الجمعة والجماعة:** المريض، والخائف حدوث المرض، والمدافع أحد الأخبثين، ومن له ضائع يرجوه أو يخاف ضياع ماله أو فواته أو ضررًا فيه، أو يخاف على مال استؤجر لحفظه كنطارة بستان، والأذى بمطر ووحل وثلج وجليد وريح باردة بليلة مظلمة، وتطويل الإمام.\n\n### صلاة أهل الأعذار\n\n- يلزم المريض أن يصلي المكتوبة **قائمًا ولو مستندًا، فإن لم يستطع فقاعدًا، فإن لم يستطع فعلى جنبه والأيمن أفضل**.\n- يومئ بالركوع والسجود ويجعل سجوده أخفض من ركوعه.\n- إن عجز **أومأ بطرفه واستحضر الفعل بقلبه**، وكذا القول إن عجز بلسانه، **ولا تسقط ما دام عقله ثابتًا**.\n- من قدر على القيام أو القعود في أثناء الصلاة **انتقل إليه**.\n- من قدر أن يقوم منفردًا ويجلس في الجماعة **خُيِّر**.\n- تصح الصلاة على الراحلة لمن يتأذى بنحو مطر ووحل أو يخاف على نفسه من نزوله، وعليه استقبال القبلة وعمل ما يقدر عليه.\n- **يومئ من بالماء والطين.**\n\n### صلاة المسافر والجمع\n\n- **قصر الرباعية أفضل** لمن نوى سفرًا مباحًا.\n- **شروط السفر المبيح للقصر:** أن يكون مباحًا، لمحل معين، **يبلغ ستة عشر فرسخًا** وهي مسيرة يومين قاصدين بسير الأثقال ودبيب الأقدام.\n- **يبدأ القصر إذا فارق بيوت قريته العامرة.**\n- لا يعيد من قصر ثم رجع قبل استكماله المسافة. **ويلزم الإتمام إن دخل وقتها وهو في الحضر.**\n\n**يلزم المسافر الإتمام إذا:** صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة مطلقة، أو نوى الإقامة **أكثر من أربعة أيام**، أو أقام لحاجة وظن ألا تنقضي إلا بعد الأربعة، أو أخر الصلاة بلا عذر حتى ضاق وقتها.\n\n- **يقصر** إن أقام لحاجة بلا نية إقامة فوق أربعة ولا يدري متى تنقضي، أو حُبس ظلمًا أو بمطر **ولو أقام سنين**.\n\n**يباح الجمع:**\n- بسفر القصر: بين الظهر والعصر، والعشاءين، بوقت إحداهما.\n- ولمقيم مريض يلحقه بتركه مشقة.\n- ولمرضع لمشقة كثرة النجاسة.\n- ولعاجز عن الطهارة لكل صلاة.\n- ولعذر أو شغل يبيح ترك الجمعة والجماعة.\n\n**ويختص بجواز جمع العشاءين** ولو صلى ببيته: **ثلج، وجليد، ووحل، وريح شديدة باردة، ومطر يبل الثياب وتوجد معه مشقة**.\n\n- الأفضل فعل الأرفق من تقديم الجمع أو تأخيره.\n- **شروط جمع التقديم:** نيته عند إحرام الأولى، وألا يفرق بينهما بنحو نافلة بل بقدر إقامة ووضوء خفيف، ووجود العذر عند افتتاحهما، واستمراره إلى فراغ الثانية.\n- **شروط جمع التأخير:** نية الجمع بوقت الأولى قبل أن يضيق وقت الثانية عنها، وبقاء العذر إلى دخول وقت الثانية لا غير.\n- **لا يشترط للصحة اتحاد الإمام والمأموم**، ويصح لو صلى خلف إمام لم يجمع، أو إحداهما منفردًا والأخرى جماعة، أو صلى إمامًا بمن لم يجمع.\n\n### صلاة الخوف\n\n- تشرع إذا كان القتال مباحًا، **حضرًا وسفرًا**.\n- **لا تأثير للخوف في تغيير عدد الركعات، بل في صفتها وبعض شروطها.**\n- وإذا اشتد الخوف: صلوا رجالًا وركبانًا، للقبلة وغيرها، ولا يلزم عند الافتتاح التوجه إليها ولو أمكن، يومئون طاقتهم. وكذا في الهرب من عدو أو سيل أو سبع أو نار أو غريم ظالم، أو خوف فوات وقت الوقوف بعرفة.\n- من خاف عدوًّا فصلى صلاة خائف ثم بان أمن الطريق **لم يعد**. ومن خاف أو أمن في أثناء صلاته **انتقل وبنى**.\n- للمصلي الكر والفر لمصلحة ولا تبطل بطوله. **وجاز لحاجة حمل نجس ولا يعيد.**\n\n### صلاة الجمعة\n\n- **تجب على كل: ذكر، مسلم، مكلف، حر، لا عذر له.**\n- تجب على مسافر لا يباح له القصر، وعلى مقيم خارج البلد إذا كان بينه وبين الجمعة **فرسخ فأقل**. **ولا تجب على من يباح له القصر.**\n- لا تجب على عبد ومبعض وامرأة، **ومن حضرها منهم أجزأته**. ومن لا تجب عليه **لا يحسب من الأربعين**، ولا تصح إمامتهم فيها.\n\n**شروط صحتها أربعة:**\n1. **الوقت:** من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل.\n2. **أن تكون بقرية** ولو من قصب يستوطنها **أربعون** استيطان إقامة لا يظعنون صيفًا ولا شتاءً، وتصح فيما قارب البنيان من الصحراء.\n3. **حضور أربعين**، فإن نقصوا قبل إتمامها استأنفوا ظهرًا.\n4. **تقدم خطبتين.**\n\n**شروط صحة الخطبتين خمسة:** الوقت، والنية، ووقوعهما حضرًا، وحضور الأربعين، وأن يكونا ممن تصح إمامته فيها.\n\n**أركان الخطبتين ستة:** حمد الله، والصلاة على رسول الله ﷺ، وقراءة آية من كتاب الله، والوصية بتقوى الله، وموالاتهما مع الصلاة، والجهر بحيث يسمع العدد المعتبر.\n\n**سننهما:** الطهارة، وستر العورة، وإزالة النجاسة، والدعاء للمسلمين، وأن يتولى الخطبتين مع الصلاة واحد، ورفع الصوت بهما حسب الطاقة، وأن يخطب قائمًا على مرتفع معتمدًا على سيف أو عصا، وأن يجلس بينهما قليلًا (فإن أبى أو خطب جالسًا فصل بينهما بسكتة)، وقصرهما والثانية أقصر، ولا بأس أن يخطب من صحيفة.\n\n- **يحرم الكلام والإمام يخطب** وهو منه بحيث يسمعه، **ويباح إذا سكت بينهما أو شرع في دعاء**.\n- **تحرم إقامة الجمعة والعيد في أكثر من موضع من البلد إلا لحاجة** كضيق وبُعد وخوف فتنة، فإن تعددت لغير ذلك **فالسابقة بالإحرام هي الصحيحة**.\n- **من أدرك مع الإمام ركعة أتم جمعة، وإن أدرك أقل نوى ظهرًا.**\n- **أقل السنة بعدها ركعتان وأكثرها ست.**\n- يسن قراءة **سورة الكهف** في يومها، وأن يقرأ في فجرها **الم السجدة** وفي الثانية **هل أتى**، وتكره المداومة عليهما.\n\n### صلاة العيدين\n\n- هي **فرض كفاية**، **وشروطها كالجمعة ما عدا الخطبتين**.\n- **تسن بالصحراء**، ووقتها كصلاة الضحى.\n- **يكره النفل قبلها وبعدها قبل مفارقة المصلى.**\n- إن لم يعلم بالعيد إلا بعد الزوال **صلوا من الغد قضاءً**.\n- يسن تبكير المأموم وتأخر الإمام إلى وقت الصلاة، وإذا مضى في طريق رجع في أخرى، وكذا الجمعة.\n\n**صفتها:** ركعتان؛ يكبر في الأولى **ستًّا** بعد تكبيرة الإحرام وقبل التعوذ، وفي الثانية **خمسًا** قبل القراءة، يرفع يديه مع كل تكبيرة ويقول بينهما: «الله أكبر كبيرًا والحمد لله كثيرًا وسبحان الله بكرة وأصيلًا وصلى الله على محمد النبي وآله وسلم تسليمًا»، ثم يستعيذ، ثم يقرأ جهرًا الفاتحة، ثم **«سبح» في الأولى و«الغاشية» في الثانية**، فإذا سلم خطب خطبتين وأحكامهما كخطبتي الجمعة.\n\n- يسن استفتاح الخطبة **الأولى بتسع تكبيرات والثانية بسبع**.\n- إن صلى العيد كالنافلة **صح**، لأن التكبيرات الزوائد والذكر بينها والخطبتين **سنة**.\n- يسن لمن فاتته قضاؤها ولو بعد الزوال.\n- **التكبير المطلق:** يسن والجهر به في ليلتي العيدين إلى فراغ الخطبة، وفي كل عشر ذي الحجة.\n- **التكبير المقيد في الأضحى:** عقب كل فريضة صلاها في جماعة **من صلاة فجر يوم عرفة إلى عصر آخر أيام التشريق**، إلا المحرم فيكبر من صلاة ظهر يوم النحر.\n- **صفة التكبير شفعًا:** «الله أكبر الله أكبر، لا إله إلا الله، والله أكبر الله أكبر، ولله الحمد». ولا بأس بقوله لغيره: تقبل الله منا ومنك.\n\n### صلاة الكسوف\n\n- هي **سنة من غير خطبة**، ووقتها من ابتداء الكسوف إلى ذهابه، **ولا تقضى إن فاتت**.\n- **صفتها:** ركعتان؛ يقرأ في الأولى جهرًا الفاتحة وسورة طويلة، ثم يركع طويلًا، ثم يرفع فيسمِّع ويحمد، **ولا يسجد بل يقرأ الفاتحة وسورة طويلة، ثم يركع، ثم يرفع، ثم يسجد سجدتين طويلتين**، ثم يصلي الثانية كالأولى، ثم يتشهد ويسلم.\n- إن أتى في كل ركعة بثلاث ركوعات أو أربع أو خمس فلا بأس، وما بعد الأول **سنة لا تدرك به الركعة**، ويصح أن يصليها كالنافلة.\n\n### صلاة الاستسقاء\n\n- هي **سنة**، **ووقتها وصفتها وأحكامها كصلاة العيد**.\n- إذا أراد الإمام الخروج لها: وعظ الناس وأمرهم بالتوبة والخروج من المظالم، ويتنظف لها **ولا يتطيب**، ويخرج متواضعًا متخشعًا متذللًا متضرعًا ومعه أهل الدين والصلاح والشيوخ.\n- يباح خروج الأطفال والعجائز والبهائم، ويباح التوسل بالصالحين.\n- **يصلي ثم يخطب خطبة واحدة**، يفتتحها بالتكبير كخطبة العيد، ويكثر فيها الاستغفار وقراءة آيات فيها الأمر بالاستغفار، ويرفع يديه وظهورهما نحو السماء فيدعو ويؤمن المأموم، ثم **يستقبل القبلة** في أثناء الخطبة فيقول سرًّا: «اللهم إنك أمرتنا بدعائك ووعدتنا إجابتك...»، ثم **يحول رداءه** فيجعل الأيمن على الأيسر والأيسر على الأيمن وكذا الناس.\n- إن سُقوا وإلا **عادوا ثانيًا وثالثًا**.\n- عند نزول المطر: يسن الوقوف في أوله، والوضوء والاغتسال منه، وإخراج رحله وثيابه ليصيبها. وإن كثر حتى خيف سن: «اللهم حوالينا ولا علينا...». **ويسن قول: مطرنا بفضل الله ورحمته، ويحرم: مطرنا بنوء كذا، ويباح: في نوء كذا.**\n\n---\n\n## كتاب الجنائز\n\n- يسن الاستعداد للموت والإكثار من ذكره، **ويكره الأنين**، ويكره تمني الموت إلا عند الفتنة.\n- تسن عيادة المريض المسلم، **وتلقينه عند موته «لا إله إلا الله» مرة ولم يزد إلا أن يتكلم**، وقراءة الفاتحة ويس، وتوجيهه إلى القبلة على جنبه الأيمن مع سعة المكان وإلا فعلى ظهره.\n- إذا مات: سن تغميض عينيه، وقول «بسم الله وعلى وفاة رسول الله»، ولا بأس بتقبيله والنظر إليه ولو بعد تكفينه.\n\n### الغسل\n\n- **غسل الميت فرض كفاية.**\n- **شروطه:** في الماء: الطهورية والإباحة. وفي الغاسل: الإسلام والعقل والتمييز. والأفضل ثقة عارف بأحكام الغسل، والأولى به وصيه العدل.\n- يستر عورته **وجوبًا**، ثم يلف على يده خرقة فينجيه، ويجب غسل ما به من نجاسة، **ويحرم مس عورة من بلغ سبع سنين**، وسن ألا يمس سائر بدنه إلا بخرقة.\n- **للرجل أن يغسل:** زوجته، وأمته، وبنتًا دون سبع. **وللمرأة أن تغسل:** زوجها، وسيدها، وابنًا دون سبع.\n- حكم غسله كغسل الجنابة، لكن **لا يدخل الماء في فمه وأنفه** بل يأخذ خرقة مبلولة فيمسح بها أسنانه ومنخريه.\n- **يكره الاقتصار على مرة** إن لم يخرج منه شيء، وإن خرج وجبت الإعادة **إلى سبع مرات**، فإن خرج بعدها حُشي بقطن فإن لم يستمسك فبالطين، ثم يغسل المحل **ويوضأ وجوبًا**.\n- **شهيد المعركة والمقتول ظلمًا: لا يغسل ولا يكفن ولا يصلى عليه**، ويجب بقاء دمه عليه ودفنه في ثيابه. فإن حُمل فأكل أو شرب أو نام أو تكلم أو عطس أو طال بقاؤه عرفًا أو قتل وعليه ما يوجب الغسل **فهو كغيره**.\n- **السقط لأربعة أشهر كالمولود حيًّا.**\n- لا يغسل مسلم كافرًا ولو ذميًّا ولا يصلي عليه ولا يتبع جنازته، بل يوارى لعدم من يواريه.\n\n### التكفين\n\n- **تكفينه فرض كفاية.** والواجب **ستر جميعه** سوى رأس المحرم ووجه المحرمة.\n- يكون من ثوب لا يصف البشرة، ويجب أن يكون من ملبوس مثله ما لم يوصِ بدونه.\n- **السنة تكفين الرجل في ثلاث لفائف بيض من قطن** تبسط بعضها على بعض، ويوضع عليها مستلقيًا، ثم يرد طرف العليا من الجانب الأيسر على شقه الأيمن ثم الأيمن على الأيسر، ثم الثانية ثم الثالثة كذلك.\n- **الأنثى في خمسة أثواب بيض من قطن:** إزار، وخمار، وقميص، ولفافتين.\n- **الصبي في ثوب** ويباح في ثلاثة. **والصغيرة في قميص ولفافتين.**\n- **يكره** التكفين بشعر وصوف ومزعفر ومعصفر ومنقوش. **ويحرم** بجلد وحرير ومُذهَّب.\n\n### الصلاة على الميت\n\n- **فرض كفاية**، وتسقط بمكلف واحد ولو أنثى.\n\n**شروطها ثمانية:** النية، والتكليف، واستقبال القبلة، وستر العورة، واجتناب النجاسة، وحضور الميت إن كان بالبلد، وإسلام المصلي والمصلى عليه، وطهارتهما ولو بتراب لعذر.\n\n**أركانها سبعة:** القيام في فرضها، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على محمد ﷺ، والدعاء للميت، والسلام، والترتيب. **لكن لا يتعين كون الدعاء في الثالثة بل يجوز بعد الرابعة.**\n\n**صفتها:** ينوي، ثم يكبر ويقرأ الفاتحة، ثم يكبر ويصلي على محمد ﷺ ويكفي التشهد، ثم يكبر ويدعو للميت بنحو «اللهم ارحمه»، ثم يكبر ويقف بعدها قليلًا، ويسلم **وتجزئ واحدة**.\n\n- **يجوز أن يصلى على الميت من دفنه إلى شهر وشيء، ويحرم بعد ذلك.**\n\n### الحمل والدفن\n\n- **حمله ودفنه فرض كفاية**، ويسقط الحمل والدفن والتكفين بالكافر. **ويكره أخذ الأجرة على ذلك وعلى الغسل.**\n- **يسن كون الماشي أمام الجنازة والراكب خلفها، والقرب منها أفضل.**\n- **يكره القيام لها**، ويكره رفع الصوت معها ولو بالذكر والقرآن.\n- يسن أن يُعمَّق القبر ويوسَّع بلا حد، ويكفي ما يمنع السباع والرائحة.\n- **يكره** إدخال القبر خشبًا وما مسته نار، ووضع فراش تحته، وجعل مخدة تحت رأسه.\n- يسن أن يقول مدخله في القبر: «بسم الله وعلى ملة رسول الله»، **ويجب أن يستقبل به القبلة**، ويسن على جنبه الأيمن.\n- **يحرم دفن غيره عليه أو معه إلا لضرورة.**\n- يسن حثو التراب عليه ثلاثًا ثم يهال، واستحب الأكثر تلقينه، ويسن رش القبر بالماء **ورفعه قدر شبر**.\n- **يكره:** تزويقه، وتجصيصه، وتبخيره، وتقبيله، والطواف به، والاتكاء عليه، والمبيت والضحك عنده، والحديث في أمر الدنيا، والكتابة عليه، والجلوس والبناء، والمشي بالنعل إلا لخوف وشوك ونحوه. **ويحرم إسراج المقابر.**\n- **يحرم الدفن بالمساجد وفي ملك الغير، ويُنبش. والدفن بالصحراء أفضل.**\n- إن ماتت الحامل **حرم شق بطنها**، وأخرج النساء من ترجى حياته، فإن تعذر لم تدفن حتى يموت، وإن خرج بعضه حيًّا شق للباقي.\n\n### التعزية والزيارة\n\n- **تسن تعزية المسلم إلى ثلاثة أيام**، يقال له: «أعظم الله أجرك وأحسن عزاءك وغفر لميتك»، ويقول هو: «استجاب الله دعاءك ورحمنا وإياك».\n- **لا بأس بالبكاء على الميت**، **ويحرم الندب** وهو البكاء مع تعداد محاسن الميت، **والنياحة** وهي رفع الصوت بذلك برنة، **وشق الثوب ولطم الخد والصراخ ونتف الشعر ونشره وحلقه**.\n- **تسن زيارة القبور للرجال وتكره للنساء**، وإن اجتازت المرأة بقبر في طريقها فسلمت ودعت فحسن.\n- يسن لزائر القبور أن يقول: «السلام عليكم دار قوم مؤمنين وإنا إن شاء الله بكم لاحقون...».\n- **ابتداء السلام على الحي سنة، ورده فرض كفاية.** **وتشميت العاطس إذا حمد فرض كفاية، ورده فرض عين.**\n- يعرف الميت زائره يوم الجمعة قبل طلوع الشمس، ويتأذى بالمنكر عنده وينتفع بالخير.\n\n---\n\n## كتاب الزكاة\n\n### شروط وجوبها (خمسة)\n\n1. **الإسلام**، فلا تجب على الكافر ولو مرتدًا.\n2. **الحرية**، فلا تجب على الرقيق ولو مكاتبًا، لكن تجب على المبعض بقدر ملكه.\n3. **ملك النصاب** تقريبًا في الأثمان وتحديدًا في غيرها.\n4. **الملك التام**، فلا زكاة على السيد في دين الكتابة ولا في حصة المضارب قبل القسمة.\n5. **تمام الحول**، ولا يضر لو نقص نصف يوم.\n\n- **وتجب في مال الصغير والمجنون**، ويخرجها عنهما وليهما.\n- **يمنع وجوبها دين ينقص النصاب.**\n- من مات وعليه زكاة أخذت من تركته.\n\n### الأموال الزكوية (خمسة)\n\n1. سائمة بهيمة الأنعام. 2- الخارج من الأرض. 3- العسل. 4- الأثمان. 5- عروض التجارة.\n\n### زكاة السائمة\n\n**شروطها ثلاثة:** أن تتخذ للدر والنسل والتسمين لا للعمل، وأن تسوم (ترعى المباح) أكثر الحول، وأن تبلغ نصابًا.\n\n**الإبل:**\n| العدد | الواجب |\n|---|---|\n| 1–4 | لا شيء |\n| 5–9 | شاة |\n| 10–14 | شاتان |\n| 15–19 | ثلاث شياه |\n| 20–24 | أربع شياه |\n| 25–35 | **بنت مخاض** (أتمت سنة) |\n| 36–45 | **بنت لبون** (أتمت سنتين) |\n| 46–60 | **حقة** (أتمت ثلاث سنين) |\n| 61–75 | **جذعة** (أتمت أربع سنين) |\n| 76–90 | بنتا لبون |\n| 91–120 | حقتان |\n| 121–129 | ثلاث بنات لبون |\n| 130 فما فوق | في كل أربعين بنت لبون، وفي كل خمسين حقة |\n\n**البقر** (أهلية كانت أو وحشية):\n| العدد | الواجب |\n|---|---|\n| 1–29 | لا شيء |\n| 30–39 | **تبيع** (أتم سنة، ذكر أو أنثى) |\n| 40–59 | **مسنة** (أتمت سنتين) |\n| 60–69 | تبيعان |\n| 70 فما فوق | في كل ثلاثين تبيع، وفي كل أربعين مسنة |\n\n**الغنم:**\n| العدد | الواجب |\n|---|---|\n| 1–39 | لا شيء |\n| 40–120 | شاة |\n| 121–200 | شاتان |\n| 201–399 | ثلاث شياه |\n| 400–499 | أربع شياه |\n| ثم | في كل مائة شاة |\n\n**الخلطة:** إذا اختلط اثنان من أهل الزكاة في نصاب ماشية زكيا زكاة الواحد، بشرط: أن يكون الاختلاط جميع الحول، وأن يشتركا في: **المبيت، والمسرح، والمحلب، والفحل، والمرعى**. ولا تشترط نية الخلطة ولا اتحاد المشرب والراعي ولا اتحاد الفحل إن اختلف النوع كالبقر والجاموس والضأن والمعز.\n- قد تفيد الخلطة **تغليظًا** (اثنان اختلطا بأربعين شاة لكل عشرون فيلزمهما شاة)، وقد تفيد **تخفيفًا** (ثلاثة اختلطوا بمائة وعشرين لكل أربعون فيلزمهم شاة).\n- **لا أثر لتفرقة المال إلا في السائمة**، فإن كانت بمحلين بينهما مسافة قصر فلكل حكم.\n\n### زكاة الخارج من الأرض\n\n- **تجب في كل مكيل مدخر** من الحب (كالقمح والشعير والذرة والحمص والعدس والباقلاء والسمسم والدخن والكزبرة وبزر القطن والكتان)، ومن الثمر (كالتمر والزبيب واللوز والفستق والبندق والسماق).\n- **ولا زكاة في:** عناب وزيتون وجوز وتين ومشمش وتوت ونبق وزعرور ورمان.\n\n**شرطان:**\n1. أن يبلغ نصابًا: **خمسة أوسق = ثلاثمائة صاع** (بعد تصفية الحب وجفاف الثمر) = ألف وستمائة رطل عراقي.\n2. أن يكون مالكًا للنصاب وقت وجوبها: **في الحب إذا اشتد، وفي الثمر إذا بدا صلاحها**.\n\n- **الواجب: فيما يسقى بلا كلفة العشر، وفيما يسقى بكلفة نصف العشر.**\n- يجب إخراج زكاة الحب **مصفى** والثمر **يابسًا**، فلو أخرج رطبها لم يجزئه ووقع نفلًا.\n- **الخرص:** يبعث الإمام خارصًا إذا بدا الصلاح، ويكفي واحد، وشرطه أن يكون مسلمًا أمينًا خبيرًا، وأجرته على رب الثمرة.\n- يجب على الإمام بعث السعاة قرب الوجوب لقبض زكاة المال.\n- **تضمين أموال العشر والأرض الخراجية باطل.**\n\n### العسل والركاز والأثمان والعروض\n\n- **في العسل العشر، ونصابه مائة وستون رطلًا عراقية.**\n- **الركاز** (وهو الكنز) ولو كان قليلًا **ففيه الخمس**، ولا يمنع وجوبه الدين.\n- **الأثمان:** الذهب والفضة، وفيها **ربع العشر (2.5%)** إذا بلغت نصابًا.\n- **نصاب الذهب: عشرون مثقالًا.** **ونصاب الفضة: مائتا درهم.**\n- يضم الذهب والفضة في تكميل النصاب ويخرج من أيهما شاء.\n- **لا زكاة في حلي مباح معد للاستعمال أو الإعارة**، وتجب في **الحلي المحرم** وفي **المباح المعد للكراء والنفقة** إذا بلغ نصابًا وزنًا، ويخرج عن قيمته إن زادت.\n- **عروض التجارة:** ما يعد للبيع والشراء لأجل الربح. تقوَّم إذا حال الحول **بالأحظ للمساكين من ذهب أو فضة**، فإن بلغت القيمة نصابًا وجب **ربع العشر**، وكذا أموال الصيارف.\n- **لا عبرة بقيمة آنية الذهب والفضة بل بوزنها.**\n- من عنده عرض للتجارة أو ورثه فنواه للقنية ثم نواه للتجارة **لم يصر عرضًا بمجرد النية**، غير حلي اللبس.\n- ما استخرج من المعادن ففيه بمجرد إحرازه **ربع العشر** إن بلغت القيمة نصابًا بعد السبك والتصفية.\n\n### الإخراج والنية\n\n- **لا يجزئ إخراج القيمة في الزكاة مطلقًا.**\n- **يحرم على الشخص شراء زكاته وصدقته** ولو اشتراها من غير من أخذها.\n- **يجب إخراجها فورًا**، وله تأخيرها لزمن الحاجة ولقريب وجار.\n- من **جحد وجوبها عالمًا كفر** ولو أخرجها، ومن **منعها بخلًا وتهاونًا أُخذت منه وعُزِّر**.\n- من ادعى إخراجها أو بقاء الحول أو نقص النصاب أو زوال الملك **صُدِّق بلا يمين**.\n- **يسن:** إظهارها، وأن يفرقها ربها بنفسه، ويقول عند دفعها: «اللهم اجعلها مغنمًا ولا تجعلها مغرمًا»، ويقول الآخذ: «آجرك الله فيما أعطيت وبارك لك فيما أبقيت وجعله لك طهورًا».\n- **يشترط لإخراجها نية من مكلف**، وله تقديمها بيسير والأفضل قرنها بالدفع. **ولا يجزئ إن نوى صدقة مطلقة** ولو تصدق بجميع ماله. **ولا تجب نية الفرضية**، ولا يجب تعيين المال المزكى عنه.\n- **الأفضل جعل زكاة كل مال في فقراء بلده، ويحرم نقلها إلى مسافة قصر وتجزئ.**\n- **يصح تعجيل الزكاة لحولين فقط** إذا كمل النصاب، فإن تلف النصاب أو نقص وقع ذلك نفلًا.\n\n### أصناف المستحقين (ثمانية)\n\n1. **الفقير:** من لم يجد نصف كفايته.\n2. **المسكين:** من يجد نصفها أو أكثرها.\n3. **العامل عليها:** كجابٍ وحافظ وكاتب وقاسم.\n4. **المؤلف:** السيد المطاع في عشيرته ممن يرجى إسلامه أو يخشى شره أو يرجى بعطيته قوة إيمانه أو إسلام نظيره أو جبايتها ممن لا يعطيها.\n5. **المكاتب.**\n6. **الغارم:** من تدين للإصلاح بين الناس أو تدين لنفسه وأعسر.\n7. **الغازي في سبيل الله.**\n8. **ابن السبيل:** الغريب المنقطع بغير بلده.\n\n- يعطى الجميع بقدر الحاجة، **إلا العامل فيعطى بقدر أجرته ولو غنيًّا**.\n- **لا يجزئ دفعها:** للكافر، ولا للرقيق، ولا للغني بمال أو كسب، ولا لمن تلزمه نفقته، ولا للزوج، ولا لبني هاشم. **وتجزئ** إن دفعها لمن تبرع بنفقته بضمه إلى عياله.\n- إن دفعها لغير مستحقها وهو يجهل ثم علم **لم يجزئه ويستردها بنمائها**، **إلا** إن دفعها لمن يظنه فقيرًا فبان غنيًّا **فأجزأه**.\n- يسن تفريقها على أقاربه الذين لا تلزمه نفقتهم وعلى ذوي الأرحام.\n\n### صدقة التطوع\n\n- تسن في كل وقت، لا سيما **سرًّا**، وفي الزمان والمكان الفاضل، وعلى **الجار وذوي الرحم** فهي صدقة وصلة.\n- من تصدق بما ينقص مؤنة تلزمه أو أضر بنفسه أو غريمه **أثم**، ويكره لمن لا صبر له أن ينقص نفسه عن الكفاية التامة.\n- **المن بالصدقة كبيرة ويبطل به الثواب.**\n\n### الحلي والزينة\n\n- **تحرم تحلية المسجد بذهب أو فضة.**\n- **يباح للذكر من الفضة:** الخاتم ولو زاد على مثقال (وجعله بخنصر يساره أفضل)، وقبيعة السيف ولو من ذهب، وحلية المنطقة والجوشن والخوذة، **لا** الركاب واللجام والدواة.\n- **يباح للنساء** من الذهب ما جرت عادتهن بلبسه ولو زاد على ألف مثقال.\n- للرجل والمرأة **التحلي بالجوهر والياقوت والزبرجد**.\n- **يكره** التختم بالحديد والرصاص والنحاس، **ويستحب بالعقيق**.\n\n---\n\n## كتاب الصيام\n\n- يجب صوم رمضان **برؤية هلاله**. ومن حال دونه غيم أو قتر ليلة الثلاثين من شعبان **صام احتياطًا بنية رمضان** ويجزئ إن ظهر أنه منه، وتصلى التراويح؛ **ولا تثبت بقية الأحكام** كوقوع الطلاق والعتق وحلول الأجل.\n- **تثبت رؤية هلال رمضان بخبر مسلم مكلف عدل ولو عبدًا أو أنثى، ولا يقبل في بقية الشهور إلا رجلان عدلان.**\n\n**شروط الوجوب أربعة:** الإسلام، والبلوغ، والعقل، والقدرة عليه.\n\n**شروط الصحة ستة:** الإسلام، وانقطاع دم الحيض والنفاس، والتمييز، والعقل، **والنية من الليل لكل يوم واجب**.\n\n- من عجز لكبر أو مرض لا يرجى زواله: **أفطر وأطعم عن كل يوم مسكينًا مدَّ بُرٍّ أو نصف صاع من غيره**.\n- يجب على ولي المميز المطيق أمره بالصوم وضربه عليه ليعتاده.\n- من خطر بقلبه ليلًا أنه صائم فقد نوى، وكذا الأكل والشرب بنية الصوم.\n- **لا يضر:** أن يأتي بعد النية بمنافٍ للصوم، أو قال «إن شاء الله» غير متردد، أو قال ليلة الثلاثين من رمضان: «إن كان غدًا من رمضان ففرضي وإلا فأنا مفطر» — **ويضر إن قاله في أول ليلة من رمضان**.\n- **فرضه:** الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس.\n\n**سننه ستة:** تعجيل الفطر، وتأخير السحور، والزيادة في أعمال الخير، وقوله إذا شتم: «إني صائم» (جهرًا)، وقوله عند فطره: «اللهم لك صمت وعلى رزقك أفطرت...»، وفطره على رطب فإن عدم فتمر فإن عدم فماء.\n\n**أحكام الفطر:**\n- **يحرم** على من لا عذر له.\n- **يجب** على: الحائض والنفساء، ومن يحتاجه لإنقاذ معصوم من مهلكة.\n- **يسن** لـ: مسافر يباح له القصر، ومريض يخاف الضرر.\n- **يباح** لـ: حاضر سافر في أثناء النهار، وحامل ومرضع خافتا على أنفسهما أو على الولد. ولو أفطرتا للخوف على الولد فقط **لزم وليه إطعام مسكين لكل يوم**.\n- من أسلم الكافر أو طهرت الحائض أو برئ المريض أو قدم المسافر أو بلغ الصغير أو عقل المجنون في أثناء النهار وهم مفطرون **لزمهم الإمساك والقضاء**.\n- **ليس لمن جاز له الفطر برمضان أن يصوم غيره فيه.**\n\n**المفطرات اثنا عشر:**\n1. خروج دم الحيض والنفاس. 2- الموت. 3- الردة. 4- العزم على الفطر. 5- التردد فيه. 6- القيء عمدًا. 7- الاحتقان من الدبر. 8- بلع النخامة إذا وصلت إلى الفم. 9- **الحجامة** حاجمًا كان أو محجومًا. 10- إنزال المني بتكرار النظر، لا بنظرة ولا بالتفكر ولا بالاحتلام ولا بالمذي. 11- خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج. 12- كل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره.\n\n- يفطر إن قطر في أذنه ما وصل إلى دماغه، أو داوى الجائفة فوصل جوفه، أو اكتحل بما علم وصوله إلى حلقه، أو مضغ علكًا أو ذاق طعامًا ووجد الطعم بحلقه، أو بلع ريقه بعد وصوله بين شفتيه — **لا** إن جمع ريقه فابتلعه.\n- **لا يفطر** من فعل مفطرًا **ناسيًا أو مكرهًا**، ولا من دخل حلقه غبار أو ذباب بغير قصد.\n\n**الجماع:**\n- من جامع نهار رمضان في قبل أو دبر في حال يلزمه فيها الإمساك: **لزمه القضاء والكفارة** ولو مكرهًا أو ناسيًا. وكذا من جومع إن طاوع غير جاهل وناسٍ.\n- **الكفارة (مرتبة):** عتق رقبة مؤمنة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكينًا، **فإن لم يجد سقطت عنه** بخلاف غيرها من الكفارات.\n- **لا كفارة في رمضان بغير الجماع** والإنزال بالمساحقة.\n\n**القضاء والتطوع:**\n- من فاته رمضان قضى عدد أيامه، **ويسن القضاء على الفور**، ويجب إذا بقي من شعبان بقدر ما عليه.\n- **لا يصح ابتداء تطوع من عليه قضاء رمضان.**\n- إن نوى صومًا
