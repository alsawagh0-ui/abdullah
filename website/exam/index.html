<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- تحويل Markdown مبسّط ----------
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/★/g,'<mark>★</mark>');
}
function mdToHtml(src){
  const lines = src.split('\n'); let out=[], i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^---+$/.test(l.trim())){i++;continue;}
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue;}
    if(l.trim().startsWith('|')){
      let rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++;}
      rows=rows.filter(r=>!/^\|[\s:-|]+\|$/.test(r));
      let h='<div class="tbl"><table>';
      rows.forEach((r,ri)=>{const cells=r.slice(1,-1).split('|');const tag=ri===0?'th':'td';h+='<tr>'+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});
      out.push(h+'</table></div>');continue;
    }
    if(/^\s*[-•]\s+/.test(l)){
      let h='<ul>'; while(i<lines.length && /^\s*[-•]\s+/.test(lines[i])){
        let item=lines[i].replace(/^\s*[-•]\s+/,''); i++;
        let sub='';
        while(i<lines.length && /^\s{2,}[-•]\s+/.test(lines[i])){sub+=`<li>${inline(lines[i].replace(/^\s*[-•]\s+/,''))}</li>`;i++;}
        h+=`<li>${inline(item)}${sub?`<ul>${sub}</ul>`:''}</li>`;
      } out.push(h+'</ul>');continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      let h='<ol>'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`;i++;} out.push(h+'</ol>');continue;
    }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#|\||\s*[-•]\s|\s*\d+[.)]\s|---)/.test(lines[i])){p.push(lines[i]);i++;}
    if(p.length) out.push(`<p>${inline(p.join(' '))}</p>`); else i++;
  }
  return out.join('\n');
}

// ---------- تخزين محلي للتقدم (اختياري) ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

// ---------- الصفحات ----------
function daysLeft(iso){const d=new Date(iso+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}

function home(){
  crumbs.innerHTML='';
  app.innerHTML=`<section class="hero">
    <h1>اختر المسار الذي تتقدم له</h1>
    <p>ملخصات المقررات المعتمدة، وبنك أسئلة من نماذج الاختبارات السابقة، مرتبة حسب وزن الدرجات. الاختبار التحريري في ${fmtDate(DATA.tracks.imam.exam_date)}.</p>
    <div class="choices">
      ${Object.entries(DATA.tracks).map(([id,t])=>`<a class="choice" href="#/${id}"><span class="k">${esc(t.name)}</span><span class="d">${t.marks_pending?'توزيع الدرجات يُحدَّث عند وصول المقرر':Object.keys(t.marks).length+' مواد، مجموع '+Object.values(t.marks).reduce((a,b)=>a+(b||0),0)+' درجة'}</span><span class="go">ابدأ المذاكرة</span></a>`).join('')}
    </div></section>`;
}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'});}

function track(tid){
  const t=DATA.tracks[tid]; if(!t) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <span>${esc(t.name)}</span>`;
  const left=daysLeft(t.exam_date);
  const total=Object.values(t.marks).reduce((a,b)=>a+(b||0),0);
  const done=store.get('done',{});
  app.innerHTML=`<section class="hero"><h1>مسار ${esc(t.name)}</h1><p>${esc(t.oral)}.</p></section>
  <div class="stack">
    <div class="card count"><span class="n">${left>=0?left:0}</span><span class="l">${left>=0?'يوماً على الاختبار التحريري':'انتهى موعد الاختبار'} (${fmtDate(t.exam_date)})</span></div>
    ${t.marks_pending?`<div class="card"><span class="pill gold">تنبيه</span> توزيع درجات هذا المسار لم يصل بعد. المواد أدناه حسب نموذج اختبار المؤذنين السابق، والمحتوى مشترك مع مسار الإمام لأن المقرر واحد.</div>`:''}
    <a class="card exam-cta" href="#/${tid}/exam" style="text-decoration:none;color:inherit"><h2>الاختبار الفعلي</h2><span>${examCount(t)} سؤال اختيار من متعدد، تُسحب عشوائياً من بنك ${mcqTotal(t)} سؤال، بتوزيع الدرجات الحقيقي، والنتيجة من 100.${store.get('best:'+tid,null)!=null?' أفضل نتيجة لك: <b>'+store.get('best:'+tid)+'</b>':''}</span><span class="go" style="display:inline-block;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;justify-self:start">ابدأ الاختبار</span></a>
    <a class="card paper-cta" href="#/${tid}/paper" style="text-decoration:none;color:inherit"><h2>ورقة اختبار كاملة (نظام الوزارة)</h2><span>ورقة مطابقة لنماذج الاختبارات السابقة: مجالات مرتبة، واختيار من متعدد، وصح وخطأ، وأكمل، وأسئلة مقالية. تُصحح آلياً مع تقييم ذاتي للمقالي، والنتيجة من 100.${store.get('bestPaper:'+tid,null)!=null?' أفضل نتيجة: <b>'+store.get('bestPaper:'+tid)+'</b>':''}</span><span class="go" style="display:inline-block;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;justify-self:start">ابدأ الورقة</span></a>
    <h2>المواد حسب وزن الدرجات</h2>
    <div class="subjects">
      ${Object.entries(t.marks).map(([sid,m])=>{const s=DATA.subjects[sid];const d=done[sid]||{};const known=Object.values(d).filter(x=>x==='y').length;return `<a class="subj" href="#/${tid}/${sid}">
        <span class="nm">${esc(s.name)}</span>
        <span class="mk"><b>${m==null?'؟':m}</b><span>${m==null?'درجة':'درجة'}</span></span>
        <span class="src">${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''} · ${s.questions.length} سؤال${known?` · أتقنت ${known}`:''}</span>
        ${m!=null?`<span class="bar"><i style="width:${Math.round(100*m/total)}%"></i></span>`:''}
      </a>`;}).join('')}
    </div>
    <div class="card"><h2>الخطة وتحليل الاختبارات السابقة</h2><div class="notes">${mdToHtml(DATA.plan)}</div></div>
  </div>`;
}

function subject(tid,sid,mode){
  const t=DATA.tracks[tid], s=DATA.subjects[sid]; if(!t||!s) return home();
  mode = mode||store.get('mode:'+sid,'notes');
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>${esc(s.name)}</span>`;
  const m=t.marks[sid];
  app.innerHTML=`<section class="hero"><h1>${esc(s.name)} <span class="pill gold">${m==null?'الدرجة غير محددة':m+' درجة'}</span></h1><p>${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''}</p></section>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-selected="${mode==='notes'}" data-mode="notes">الملخص</button>
    <button role="tab" id="tab-quiz" aria-selected="${mode==='quiz'}" data-mode="quiz">اختبر نفسك (${s.questions.length})</button>
  </div>
  <div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{store.set('mode:'+sid,b.dataset.mode);subject(tid,sid,b.dataset.mode);});
  const pane=document.getElementById('pane');
  if(mode==='notes'){pane.innerHTML=`<div class="card notes">${mdToHtml(s.notes)}</div>`;}
  else quiz(pane,sid,s);
}

function quiz(pane,sid,s){
  const qs=s.questions; if(!qs.length){pane.innerHTML='<div class="empty">لا توجد أسئلة لهذه المادة بعد.</div>';return;}
  const done=store.get('done',{}); done[sid]=done[sid]||{};
  let order=qs.map((_,i)=>i); let idx=store.get('idx:'+sid,0)%qs.length; let shown=false;
  function render(){
    const q=qs[order[idx]]; const st=done[sid];
    const known=Object.values(st).filter(x=>x==='y').length, weak=Object.values(st).filter(x=>x==='n').length;
    pane.innerHTML=`<div class="quiz">
      <div class="prog"><span>السؤال <b>${idx+1}</b> من <b>${qs.length}</b></span><span>أتقنت <b>${known}</b></span><span>تحتاج مراجعة <b>${weak}</b></span></div>
      <div class="qcard"><div class="qn">${esc(s.name)} · ${st[order[idx]]==='y'?'<span class="pill">متقن</span>':st[order[idx]]==='n'?'<span class="pill gold">للمراجعة</span>':''}</div>
        <div class="qt">${esc(q.q)}</div>
        ${shown?`<div class="ans">${esc(q.a)}</div>`:''}
        <div class="row" style="margin-top:14px">
          ${shown?`<button class="btn ok" id="y">أعرفها</button><button class="btn no" id="n">أحتاج مراجعة</button>`:`<button class="btn primary" id="show">أظهر الإجابة</button>`}
          <button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button>
        </div></div>
      <div class="row"><button class="btn" id="weakOnly">مراجعة ما أحتاجه فقط</button><button class="btn" id="all">كل الأسئلة</button><button class="btn" id="reset">تصفير التقدم</button></div>
    </div>`;
    const go=d=>{idx=(idx+d+order.length)%order.length;shown=false;store.set('idx:'+sid,idx);render();};
    pane.querySelector('#next').onclick=()=>go(1); pane.querySelector('#prev').onclick=()=>go(-1);
    const sh=pane.querySelector('#show'); if(sh) sh.onclick=()=>{shown=true;render();};
    const y=pane.querySelector('#y'); if(y) y.onclick=()=>{st[order[idx]]='y';store.set('done',done);go(1);};
    const n=pane.querySelector('#n'); if(n) n.onclick=()=>{st[order[idx]]='n';store.set('done',done);go(1);};
    pane.querySelector('#weakOnly').onclick=()=>{const w=qs.map((_,i)=>i).filter(i=>st[i]!=='y');if(w.length){order=w;idx=0;shown=false;render();}};
    pane.querySelector('#all').onclick=()=>{order=qs.map((_,i)=>i);idx=0;shown=false;render();};
    pane.querySelector('#reset').onclick=()=>{done[sid]={};store.set('done',done);order=qs.map((_,i)=>i);idx=0;shown=false;render();};
  }
  render();
}


function examCount(t){return Object.values(t.exam||{}).reduce((a,b)=>a+b,0);}
function mcqTotal(t){return Object.keys(t.exam||{}).reduce((a,s)=>a+(DATA.subjects[s]?.mcq.length||0),0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildExam(t){
  const qs=[];
  for(const [sid,n] of Object.entries(t.exam||{})){
    const pool=shuffle([...(DATA.subjects[sid]?.mcq||[])]).slice(0,n);
    pool.forEach(q=>{const idx=shuffle(q.o.map((_,i)=>i));qs.push({s:sid,q:q.q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c),pick:-1});});
  }
  return shuffle(qs);
}
function exam(tid){
  const t=DATA.tracks[tid]; if(!t||!t.exam) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>الاختبار الفعلي</span>`;
  const qs=buildExam(t); let i=0; const start=Date.now(); const limit=examCount(t)*75*1000; let tick=null;
  function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`;}
  function render(){
    const q=qs[i]; const answered=qs.filter(x=>x.pick>=0).length;
    app.innerHTML=`<section class="hero" style="padding-block:20px 10px"><h1>الاختبار الفعلي</h1></section>
    <div class="stack">
      <div class="prog"><span>السؤال <b>${i+1}</b> من <b>${qs.length}</b></span><span>أجبت <b>${answered}</b></span><span class="timer" id="timer">المتبقي ${fmt(limit-(Date.now()-start))}</span></div>
      <div class="pbar"><i style="width:${Math.round(100*answered/qs.length)}%"></i></div>
      <div class="qcard"><div class="qn">${esc(DATA.subjects[q.s].name)}</div><div class="qt">${esc(q.q)}</div>
        <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${q.pick===k}">${esc(o)}</button>`).join('')}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="prev" ${i===0?'disabled':''}>السابق</button>
          ${i<qs.length-1?`<button class="btn primary" id="next">التالي</button>`:''}
          <button class="btn ${i===qs.length-1?'primary':''}" id="finish">${answered===qs.length?'إنهاء وعرض النتيجة':'إنهاء الاختبار'}</button>
        </div></div></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.pick=+b.dataset.k;if(i<qs.length-1){i++;render();}else render();});
    const n=app.querySelector('#next'); if(n) n.onclick=()=>{i++;render();};
    app.querySelector('#prev').onclick=()=>{if(i>0){i--;render();}};
    app.querySelector('#finish').onclick=()=>{const left=qs.length-qs.filter(x=>x.pick>=0).length; if(left&&!confirm(`بقي ${left} سؤالاً بلا إجابة، هل تريد الإنهاء؟`))return; finish();};
    clearInterval(tick); tick=setInterval(()=>{const el=document.getElementById('timer'); if(!el){clearInterval(tick);return;} const r=limit-(Date.now()-start); el.textContent='المتبقي '+fmt(r); if(r<=0){clearInterval(tick);finish();}},1000);
  }
  function finish(){
    clearInterval(tick);
    const per={}; qs.forEach(q=>{per[q.s]=per[q.s]||{n:0,ok:0};per[q.s].n++;if(q.pick===q.c)per[q.s].ok++;});
    let total=0, max=0; const rows=Object.entries(per).map(([s,r])=>{const w=t.marks_pending?100/Object.keys(per).length:(t.marks[s]||0);const got=w*r.ok/r.n;total+=got;max+=w;return {s,r,w,got};});
    const pct=Math.round(100*total/max); const best=store.get('best:'+tid,null); if(best==null||pct>best) store.set('best:'+tid,pct);
    const wrong=qs.filter(q=>q.pick!==q.c);
    app.innerHTML=`<section class="hero" style="padding-block:20px 10px"><h1>النتيجة</h1></section>
    <div class="stack">
      <div class="card"><div class="score">${pct}<small> من 100</small></div><div style="color:var(--muted)">${pct>=90?'ممتاز، هذا مستوى النجاح المطلوب.':pct>=75?'جيد، راجع الأخطاء أدناه وأعد الاختبار.':'تحتاج مراجعة مركزة، ابدأ بالمواد الأقل نتيجة.'} الوقت: ${fmt(Date.now()-start)}</div></div>
      <div class="card notes"><div class="tbl"><table><tr><th>المادة</th><th>صحيح</th><th>من</th><th>الدرجة</th></tr>${rows.sort((a,b)=>b.w-a.w).map(x=>`<tr><td>${esc(DATA.subjects[x.s].name)}</td><td>${x.r.ok}</td><td>${x.r.n}</td><td>${x.got.toFixed(1)} / ${x.w.toFixed(0)}</td></tr>`).join('')}</table></div></div>
      <div class="row"><button class="btn primary" id="again">اختبار جديد بأسئلة أخرى</button><a class="btn" href="#/${tid}">العودة للمواد</a></div>
      <h2>مراجعة الأخطاء (${wrong.length})</h2>
      ${wrong.length?wrong.map(q=>`<div class="qcard"><div class="qn">${esc(DATA.subjects[q.s].name)}</div><div class="qt" style="font-size:1.1rem">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.c?'right':(k===q.pick?'wrong':'')}">${esc(o)}${k===q.c?' ✓':(k===q.pick?' ✗':'')}</div>`).join('')}</div></div>`).join(''):'<div class="empty">لا أخطاء. أحسنت.</div>'}
    </div>`;
    app.querySelector('#again').onclick=()=>exam(tid);
    window.scrollTo(0,0);
  }
  render();
}


// ====== ورقة اختبار كاملة على نظام الاختبارات السابقة ======
const SECT_ORDER=['tafsir','tajweed','hadith','aqeedah','fiqh','nahw','mithaq'];
function pick(arr,n){return shuffle([...arr]).slice(0,n);}
function buildPaper(t){
  const secs=[];
  const order=SECT_ORDER.filter(s=>t.paper&&t.paper[s]&&Object.values(t.paper[s]).some(v=>v>0));
  order.forEach(sid=>{
    const conf=t.paper[sid], sub=DATA.subjects[sid], items=[];
    pick(sub.mcq||[],conf.mcq||0).forEach(q=>{const idx=shuffle(q.o.map((_,i)=>i));items.push({k:'mcq',q:q.q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c),pick:-1});});
    pick(sub.tf||[],conf.tf||0).forEach(q=>items.push({k:'tf',q:q.q,t:q.t,pick:null}));
    pick(sub.fill||[],conf.fill||0).forEach(q=>items.push({k:'fill',q:q.q,a:q.a,val:'',self:null}));
    pick(sub.questions||[],conf.written||0).forEach(q=>items.push({k:'written',q:q.q,a:q.a,val:'',self:null}));
    if(items.length) secs.push({sid,name:sub.name,items});
  });
  // توزيع الدرجات: درجة المادة تُقسم على عدد أسئلتها
  secs.forEach(sc=>{const w=t.marks_pending?(100/secs.length):(t.marks[sc.sid]||0);sc.w=w;sc.per=w/sc.items.length;});
  return secs;
}
function paper(tid){
  const t=DATA.tracks[tid]; if(!t||!t.paper) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>ورقة اختبار</span>`;
  const secs=buildPaper(tid&&t); const start=Date.now(); const total=secs.reduce((a,s)=>a+s.items.length,0);
  const limit=total*120*1000; let tick=null; let graded=false;
  const AR=['أ','ب','ج','د'];
  function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`;}
  function scoreNow(){
    let got=0,max=0;
    secs.forEach(sc=>{sc.items.forEach(it=>{max+=sc.per;
      if(it.k==='mcq'&&it.pick===it.c)got+=sc.per;
      else if(it.k==='tf'&&it.pick===it.t)got+=sc.per;
      else if((it.k==='fill'||it.k==='written')&&it.self===1)got+=sc.per;
      else if((it.k==='fill'||it.k==='written')&&it.self===0.5)got+=sc.per/2;
    });});
    return {got,max,pct:Math.round(100*got/max)};
  }
  function render(){
    let n=0;
    const html=secs.map((sc,si)=>{
      const kinds=[['mcq','اختر الإجابة الصحيحة'],['tf','ضع صح أو خطأ'],['fill','أكمل الفراغ'],['written','أجب عما يلي']];
      const inner=kinds.map(([k,label])=>{
        const its=sc.items.filter(x=>x.k===k); if(!its.length)return '';
        return `<div class="hint" style="margin-top:14px">${label}:</div>`+its.map(it=>{
          n++; const gi=secs.flatMap(s=>s.items).indexOf(it);
          const mk=`<span class="mk2">(${sc.per.toFixed(2)} درجة)</span>`;
          let body='';
          if(k==='mcq'){
            body=`<div class="opts">${it.o.map((o,j)=>`<button class="opt ${graded?(j===it.c?'right':(j===it.pick?'wrong':'')):''}" data-gi="${gi}" data-k="${j}" aria-pressed="${it.pick===j}" ${graded?'disabled':''}>${AR[j]}) ${esc(o)}${graded&&j===it.c?' ✓':''}</button>`).join('')}</div>`;
          } else if(k==='tf'){
            body=`<div class="tfrow"><button class="btn ${it.pick===true?'ok':''} ${graded&&it.t===true?'ok':''}" data-gi="${gi}" data-tf="1" ${graded?'disabled':''}>صح</button><button class="btn ${it.pick===false?'no':''} ${graded&&it.t===false?'ok':''}" data-gi="${gi}" data-tf="0" ${graded?'disabled':''}>خطأ</button>${graded?`<span class="badge ${it.pick===it.t?'ok':'no'}">${it.pick===it.t?'صحيحة':'الصواب: '+(it.t?'صح':'خطأ')}</span>`:''}</div>`;
          } else if(k==='fill'){
            body=`<input class="wline" id="in${gi}" value="${esc(it.val)}" placeholder="اكتب الإجابة" data-gi="${gi}" ${graded?'disabled':''}>`;
          } else {
            body=`<textarea class="warea" id="in${gi}" placeholder="اكتب إجابتك" data-gi="${gi}" ${graded?'disabled':''}>${esc(it.val)}</textarea>`;
          }
          const model=(graded&&(k==='fill'||k==='written'))?`<div class="model"><b>الإجابة النموذجية:</b> ${esc(it.a)}</div>
            <div class="selfmark"><span>قيّم إجابتك:</span>
              <button class="btn ok" data-self="1" data-gi="${gi}">صحيحة</button>
              <button class="btn" data-self="0.5" data-gi="${gi}">ناقصة</button>
              <button class="btn no" data-self="0" data-gi="${gi}">خاطئة</button>
              ${it.self!=null?`<span class="badge ${it.self?'ok':'no'}">${it.self===1?'أخذت الدرجة':it.self===0.5?'نصف درجة':'بلا درجة'}</span>`:''}</div>`:'';
          return `<div class="qbox"><div class="qh"><span class="qno">س${n}</span><span class="qtx">${esc(it.q)}</span>${mk}</div>${body}${model}</div>`;
        }).join('');
      }).join('');
      return `<section class="sect"><h2>المجال ${['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع'][si]}: ${esc(sc.name)} <span class="mk2">(${sc.w.toFixed(0)} درجة)</span></h2>${inner}</section>`;
    }).join('');
    const sc=graded?scoreNow():null;
    app.innerHTML=`<section class="hero" style="padding-block:18px 8px"><h1>ورقة اختبار ${esc(t.name)}</h1>
      <p>الزمن ${Math.round(limit/60000)} دقيقة. أجب عن جميع الأسئلة. الأسئلة المقالية تُقيَّم ذاتياً بعد ظهور الإجابة النموذجية.</p></section>
      ${graded?`<div class="card" style="text-align:center"><div class="score">${sc.pct}<small> من 100</small></div><div style="color:var(--muted)">${sc.got.toFixed(1)} من ${sc.max.toFixed(0)} · الزمن المستغرق ${fmt(Date.now()-start)}</div></div>`:`<div class="sticky-sub"><div class="prog"><span>عدد الأسئلة <b>${total}</b></span><span class="timer" id="timer">المتبقي ${fmt(limit-(Date.now()-start))}</span></div></div>`}
      ${html}
      <div class="row" style="margin-top:20px">${graded?`<button class="btn primary" id="again">ورقة جديدة بأسئلة أخرى</button><a class="btn" href="#/${tid}">العودة للمواد</a>`:`<button class="btn primary" id="submit">تسليم الورقة وعرض النتيجة</button>`}</div>`;
    const all=secs.flatMap(s=>s.items);
    app.querySelectorAll('.opt[data-gi]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].pick=+b.dataset.k;render();});
    app.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].pick=b.dataset.tf==='1';render();});
    app.querySelectorAll('[data-gi].wline,[data-gi].warea').forEach(el=>el.oninput=()=>{all[+el.dataset.gi].val=el.value;});
    app.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].self=parseFloat(b.dataset.self);render();});
    const sb=app.querySelector('#submit'); if(sb) sb.onclick=()=>grade();
    const ag=app.querySelector('#again'); if(ag) ag.onclick=()=>paper(tid);
    if(!graded){clearInterval(tick);tick=setInterval(()=>{const el=document.getElementById('timer');if(!el){clearInterval(tick);return;}const r=limit-(Date.now()-start);el.textContent='المتبقي '+fmt(r);if(r<=0){clearInterval(tick);grade();}},1000);}
  }
  function grade(){
    clearInterval(tick); graded=true;
    // احتساب المقالي مبدئياً: صحيح إذا تطابق جوهر الإجابة، وإلا يترك للتقييم الذاتي
    secs.forEach(sc=>sc.items.forEach(it=>{
      if((it.k==='fill'||it.k==='written')&&it.self==null){
        const v=(it.val||'').replace(/[ً-ْ\s.،,]/g,'');
        const a=(it.a||'').replace(/[ً-ْ\s.،,]/g,'');
        if(v&&a&&(a.includes(v)||v.includes(a))) it.self=1;
      }
    }));
    render(); window.scrollTo(0,0);
    const s=scoreNow(); const b=store.get('bestPaper:'+tid,null); if(b==null||s.pct>b) store.set('bestPaper:'+tid,s.pct);
  }
  render();
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length) return home();
  if(h.length===1) return track(h[0]);
  if(h[1]==='exam') return exam(h[0]);
  if(h[1]==='paper') return paper(h[0]);
  return subject(h[0],h[1]);
}
window.addEventListener('hashchange',route); route();
</script>
