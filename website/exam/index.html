ذِّنين)، ومسؤوليَّاتهم معرفيًّا ووظيفيًّا.\n2. توجيه العاملين في المسجد إلى منهج الوسطيَّة واختياراته الدَّعويَّة وترجيحاته العمليَّة.\n3. تعزيز القدرات الإبداعيَّة بتوظيف القدرات والمناهج الفعَّالة في وسائل الدَّعوة النَّافعة.\n4. تطوير الكفاءة العمليَّة في مجال الدَّعوة والتَّعليم والحوار.\n5. زيادة الوعي بالوضع التَّنظيميِّ القانونيِّ لوظائف العاملين في المسجد في دولة الكويت، وبيان حقوقهم وواجباتهم.\n\n**المحدِّدات التصوُّريَّة لصياغة الميثاق:**\n1. استحضار الواقع العمليِّ في مجال الدَّعوة في الكويت، ومراعاة خصوصيَّاته الفقهيَّة وترجيحاته العمليَّة.\n2. رصد الفراغات الدَّعويَّة والتَّنظيميَّة في الميثاق القديم، والعمل على سدِّها معرفيًّا وقانونيًّا.\n3. مراعاة المتلاحقات التِّقنيَّة والمستجدَّات الواقعيَّة وكيفيَّة التَّعاطي معها.\n4. تحرير الأدوار المعرفيَّة والواجبات الوظيفيَّة في ضوء التَّحدِّيات الفكريَّة.\n\n**الاعتبارات المراعاة في الصِّياغة:**\n1. المزاوجة بين الأسلوب المعرفيِّ الاستدلاليِّ والصِّياغة الوظيفيَّة القانونيَّة.\n2. الجمع بين الواجبات الشَّرعيَّة والقِيَميَّة والضَّرورات الوظيفيَّة العمليَّة بتوازن واعتدال.\n3. وضع محتوى الميثاق ومقرَّراته في صورة بنود منضبطة محكمة، أقرب ما تكون إلى المتون العلميَّة أو النُّصوص القانونيَّة.\n4. الإقلال من ذكر الأدلَّة والنُّصوص؛ لأنَّ المقصود بيان طبيعة العمل الدَّعويِّ على نحو مهنيٍّ عمليٍّ، وليس بحثًا معرفيًّا.\n5. الصِّياغة بأسلوب سهل، وعبارة واضحة، وجمل محكمة، بعيدة عن الإغراب والتَّكرار.\n\n## كلمة قطاع الإفتاء والبحوث الشَّرعيَّة\n\n- المسجد هو المؤسَّسة الأولى في المجتمع، يقوم بالوظائف الإيمانيَّة والثَّقافيَّة والاجتماعيَّة والتوجيهيَّة العامَّة.\n- الحاجة إلى لائحة موحَّدة وميثاق جامع يرجع إليه العاملون في المساجد والقائمون عليها على حدٍّ سواء.\n- التزام الجميع به يمكِّن المسجد من القيام برسالته، ويضمن السَّلامة للدَّعوة والدُّعاة، ويحسم كثيرًا من الاجتهادات المتضاربة والخاطئة.\n\n## المقدِّمة\n\nمباحثها: 1- فضل العمل في المساجد. 2- رسالة المسجد وأهمِّيَّتُها. 3- التَّعريفات.\n\n- **المواثيق:** ما يَتَعاهَدُ عليها ويتحالفُ رسميًّا شخصان أو أكثر، رابطةٌ تتألَّف من أجل عمل مشترَك، ومبادئُ وقواعدُ يُتَّفَقُ عليها من أجل احترامها في المُمَارَسَة.\n- **ميثاق المسجد:** تلك المبادئُ السَّامية والقواعدُ المَرْعيَّةُ التي يَنبغي أن يُراعيَها ويَلتزمَ بها مَن شرَّفَه الله تعالى بانتسابه إلى المسجد في عمله؛ إمامًا، أو خطيبًا، أو مؤذِّنًا.\n- مواد الميثاق مستوحاةٌ من رسالة المسجد الجامعة والشاملة في الدَّعوة إلى الله تعالى، على ما قرَّرته الشَّريعة المعروفة بالوسطيَّة والاعتدال.\n\n### 1- فضل المساجد والعملِ فيها\n\n**أولًا: فضل المساجد ومكانتُها في الإسلام**\n- المساجد بيوت الله تعالى في أرضه، وهي أحبُّ الأماكن إلى الله ورسوله والمؤمنين الصالحين: «أَحَبُّ الْبِلَادِ إِلَى اللهِ مَسَاجِدُهَا، وَأَبْغَضُ الْبِلَادِ إِلَى اللهِ أَسْوَاقُهَا»، و«المسجدُ بيتُ كلِّ تقيٍّ».\n- من فضلها أنَّ الله أضافها إلى اسمه الشَّريف: ﴿إِنَّمَا يَعْمُرُ مَسَاجِدَ اللَّهِ﴾.\n- الأجر في السَّعي إليها: «مَنْ غَدَا إِلَى الْمَسْجِدِ أَوْ رَاحَ، أَعَدَّ اللهُ لَهُ فِي الْجَنَّةِ نُزُلًا كُلَّمَا غَدَا أَوْ رَاحَ»، و«بَشِّرِ الْمَشَّائِينَ فِي الظُّلَمِ إِلَى الْمَسَاجِدِ بِالنُّورِ التَّامِّ يَوْمَ الْقِيَامَةِ»، وكثرة الخطا إلى المساجد وانتظار الصَّلاة من الرِّباط.\n- «وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ فِي الْمَسَاجِدِ» من السَّبعة الذين يظلُّهم الله في ظلِّه، ويجب الإخلاص على من أتى المسجد: «مَنْ أَتَى الْمَسْجِدَ لِشَيْءٍ فَهُوَ حَظُّهُ».\n- أوَّل ما قام به النَّبيُّ ﷺ عند قدومه المدينة: تخصيص أرض لبناء مسجده والبدء في بنائه، وكتب عمر بن الخطاب إلى ولاته أن يَبنوا مسجدًا جامعًا في مقرِّ الإمارة، ويأمروا القبائل والقرى ببناء مساجد جماعة.\n\n**من مظاهر اهتمام الإسلام بالمساجد:**\n1. **الحثُّ على بنائها وعمارتها:** «مَنْ بَنَى مَسْجِدًا لِلَّهِ، بَنَى اللهُ لَهُ فِي الْجَنَّةِ مِثْلَهُ». وليست عمارتها ببنائها وتشييدها فقط، بل تكون العمارة بالصَّلاة فيها، وجعلها واحةً للآمنين، ومَلْجأً للخائفين، ومدرسةً للمتعلِّمين.\n2. **الحثُّ على تنظيف المساجد والعناية بها:** حديث المرأة السَّوداء التي كانت تقمُّ المسجد فصلَّى النبيُّ ﷺ على قبرها، وحديث عائشة: «أَمَرَ رَسُولُ اللهِ ﷺ بِبِنَاءِ الْمَسَاجِدِ فِي الدُّورِ، وَأَنْ تُنَظَّفَ وَتُطَيَّبَ».\n\n**ثانيًا: فضل العمل في المساجد**\n- على رأس عُمَّار بيوت الله: الأئمَّة، والخطباء، والمؤذِّنون.\n- حصَر الله عمل العاملين في المساجد في أمرين: **رفعُها، والعبادةُ فيها** ﴿فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ﴾، وهذان مجموع أحكام المساجد.\n- **يدخل في رفعها:** بناؤها، وكنسها، وتنظيفها من النَّجاسات والأذى، وصَوْنُها من المجانين والصِّبيان الذين لا يتحرَّزون عن النَّجاسات، وعن الكافر (إلَّا لمصلحة واضحة بشرط ألَّا يكون في دخولهم ابتذالٌ للمسجد أو غضٌّ من مكانته وهيبته وحُرمته، ويكون بإذن المسلمين)، وأن تُصان عن اللَّغو فيها، ورفع الأصوات بغير ذكر الله.\n- **ويدخل في ذكر اسمه فيها:** الصَّلاة فرضُها ونفلُها، وقراءة القرآن، والتَّسبيح والتَّهليل، وتعلُّم العلم وتعليمه، والمذاكرة فيها، والاعتكاف.\n- عمارة المساجد قسمان: **عمارة بنيان وصيانة**، و**عمارة بذكر اسم الله** — وهذا أشرف القسمين.\n- عمل الأئمَّة والمؤذِّنين والخطباء يتعلَّق بالعمارة المعنويَّة أصالةً، ودورهم في العمارة الحسِّيَّة (النَّظافة) **متمِّمٌ ومهمٌّ**.\n\n### 2- رسالة المسجد وأهمِّيَّتُها\n\n- المسجد هو الموضع الذي يشعُّ منه نور الإيمان والعلم (آية النُّور ثمَّ ﴿فِي بُيُوتٍ أَذِنَ اللَّهُ﴾)، والمساجد محاضنُ الرُّجولة الحقَّة التي تجمع الغيرة والشَّجاعة والكرم والنُّبل والإيثار والتَّضحية والتَّوقير.\n- رسالة المسجد هي رسالة الأنبياء، ولا يقوم بها على الوجه المطلوب إلَّا مَن وفَّقه الله وفقَّهه من أهل العلم.\n- «اَلْمُؤَذِّنُ مُؤْتَمَنٌ، وَالْإِمَامُ ضَامِنٌ، اَللَّهُمَّ أَرْشِدِ الْأَئِمَّةَ، وَاغْفِرْ لِلْمُؤَذِّنِينَ».\n- **قوله «الْمُؤَذِّنُ مُؤْتَمَنٌ» يشمل:**\n  - أنَّ المؤذِّن لا بدَّ أن يكون أمينًا في نفسه، وهذا **أوَّل شرطٍ في اختيار المؤذِّن**.\n  - أنَّ النَّاس يأتمنونه على أمور عظيمة من دينهم، فيأتمنونه على صلاتهم وصيامهم.\n  - أنَّ المؤذِّن محمَّلٌ هذه الأمانة، وسيُسأل عنها بين يدي ربِّه.\n- والإمام مؤتَمنٌ ومُحمَّلُ الأمانة، وهو ضامنٌ أيضًا؛ ممَّا يدلُّ على ثقل أمانته وعِظَم مسؤوليَّته، وأنَّ تَبِعات أمانته أثقل ممَّا على المؤذِّن؛ ولذلك خصَّ النَّبيُّ ﷺ الأئمَّة بالدُّعاء بالرُّشد.\n- على الأئمَّة والخطباء والمؤذِّنين أن يستشعروا خطورة التَّفريط في الأمانة وخطورة الخيانة، وأن يكونوا قدوةً للآخرين، وأنَّ ما يبذلونه من الجهود لن تؤتي ثمارها المرجوَّة بغير القدوة الصَّالحة.\n\n### 3- التَّعريفات\n\n- **الإمام:** هو من تُعيِّنُه الوزارة، أو تُكلِّفُه؛ لإمامة المصلِّين، وإدارة شؤون المسجد، وغيرها من الاختصاصات.\n- **الخطيب:** هو من تُعيِّنُه الوزارة، أو تُكلِّفه، أو تُصَرِّحُ له بأداء خطبة الجمعة، والعيدين، ونحوهما.\n- **المؤذِّن:** هو الَّذي تُعيِّنُه الوزارة، أو تُكلِّفُه؛ لأداء الأذان، وإقامةِ الصَّلاة، في المواقيت المُحدَّدة.\n- **المسجد:** هو المكانُ الَّذي تُخصِّصُه الدَّولة، وتُرَخِّصُه الجهاتُ المعنيَّة؛ ليؤدِّي فيه المسلمون الصَّلاة، وهو إمَّا جامع، أو غير جامع:\n  - **المسجد الجامع:** المكانُ الَّذي تُخصِّصُه الوزارة لتُؤَدَّى فيه الصَّلوات الخمس، وصلاةُ الجمعة، وصلاةُ العيدين، وغيرُها.\n  - **المسجد غير الجامع:** المكانُ الَّذي تؤدَّى فيه الصَّلوات الخمس فقط، أو بعضها.\n- **المصلَّى:** هو المكان المرخَّص مؤقَّتًا لإقامةِ الصَّلوات الخمس.\n- **الأدوار:** يُعنى بها الجوانبُ المعرفيّة، المتعلِّقة بالعمل.\n- **الواجبات:** يُعنى بها الأعمالُ الَّتي يُكَلَّفُ بها الموظَّف.\n- **العاملون في المساجد:** هم من يباشرون العملَ في المسجد بصفة أساسيَّة، وبصورة يومية؛ كشاغلي وظائف الإمامة، والخطابة، التخصُّصيَّة المتدرِّجة فنِّيًّا، والأذان.\n- **العاملون على خدمة المساجد:** هم العاملون بقطاع المساجد، ممَّن يقدِّمون خدمات هندسيَّة وماليَّة وإداريَّة وقانونيَّة للمساجد؛ كجهاز الإشراف الهندسيِّ وغيرهم، بشرط أن يصدر بشأنهم قرار توظيف من السُّلطة المختصَّة بالتَّعيين، فيمنحهم صفة الموظَّف العامِّ، ويُخضِعهم لأحكام قانون الخدمة المدنيَّة ونظامه الصَّادرين عام (1979م) وتعديلاتهما.\n\n---\n\n# الباب الأوَّل: تنظيم دور العاملين في المساجد\n\n## أوَّلًا: تنظيم عمل الإمام\n\n### 1- الدَّور الشَّعائريُّ للإمام\n\n- الإمامة في الصَّلاة من أولى الوظائف الدِّينيَّة وأجلِّها قدرًا وأكثرها نفعًا؛ أقامها النَّبيُّ ﷺ وأناب لها أفضل أصحابه أبا بكر رضي الله عنه.\n- **الدَّور الشَّعائريُّ يتلخَّص في:** إمامة النَّاس في الصَّلوات المكتوبة، والجُمَع، والأعياد، وصلوات الكسوف والخسوف، والاستسقاء، والجنازة.\n- **ولا يَسمحُ لأحدٍ أن يتقدَّمَ لإمامة الصَّلاة في مسجده بغير إذنه، أو إذنٍ من الوزارة.**\n\n**وسائل تحقُّق الدَّور الشَّعائريِّ:**\n1. أن يقوم بهذه الوظيفة العظيمة مخلِصًا لله تعالى؛ فالإخلاص شرطٌ في كلِّ عبادة.\n2. الإمامة عبادة، والعبادة مبناها على الدَّليل؛ فيراعي ذلك في صلواته كلِّها، ومن ذلك طولُها وقصرُها، ومراعاةُ أحوال النَّاس وظروفهم، وأن يؤدِّي الصَّلاة بخشوعٍ وسكينةٍ وطُمَأنينة.\n3. إمامة المسجد مصدرُ وحدة واجتماع؛ فيحرص على كلِّ ما يُحقِّق هذا الهدف، ولا ينبغي أن تنقلبَ رسالتُه إلى ما يخلُّ بهذا المقصد.\n4. مراجعة الأحكام الفقهيَّة عمومًا، وما يتعلَّق بالصَّلاة والإمامة خصوصًا، وهذا **من فروض الأعيان على الأئمَّة**؛ فيجب عليهم أن يتدارسوا أحكامه ويراجعوها باستمرار.\n5. يُعَدُّ الإمام على رأس عُمَّار مساجد الله تعالى؛ فعليه أن يستشعر هذا المعنى دائمًا.\n6. استشعار الأمانة المُلْقاة على عاتقه: «يُصَلُّونَ لَكُمْ، فَإِنْ أَصَابُوا فَلَكُمْ وَلَهُمْ، وَإِنْ أَخْطَأُوا فَلَكُمْ وَعَلَيْهِمْ»، «الْإِمَامُ ضَامِنٌ».\n7. **القُدوة الحسنة:** أن يبدأ بنفسه قبل أن يُطالبَ الآخرين؛ فالفعل أبلغُ من القول.\n8. **المتابعة للنَّبيِّ ﷺ** في جميع الأقوال والأفعال: «صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي»، ويحذر كلَّ الحذر من فعل ما ليس عليه دليل.\n9. **الاهتمام بحسن المظهر:** حسن اللِّباس، ونظافته، والهيئة الجميلة، وكلِّ ما يحقِّق مظاهر الوقار ويليق بشرف الوظيفة؛ لأنَّهم قدوةٌ يرمقُهم المصلُّون بأبصارهم.\n10. **التزام الأخلاق الحسنة** (قصَّة الأعرابيِّ الذي بال في المسجد: «لَا تُزْرِمُوهُ، دَعُوهُ» و«فَإِنَّمَا بُعِثْتُمْ مُيَسِّرِينَ وَلَمْ تُبْعَثُوا مُعَسِّرِينَ»).\n11. ألَّا يتلبَّس الإمام -وكذلك جميع العاملين في المساجد- بشيءٍ يُنافي مكانتَهم وشرفَ وظيفتهم، فيجب الابتعاد عن مواطن الشَّكِّ والرِّيبة، وعن الشُّبهات.\n\n### 2- الدَّور التَّعليميُّ للإمام\n\n1. يجعل الإخلاصَ لله والمتابعةَ للنَّبيِّ ﷺ في تعليمه منطلقَه وغايتَه، ويكون همُّه الأكبر رفعَ الجهل عن نفسه وعن النَّاس.\n2. التَّعليم يكون على ضوء عقيدةِ أهل السُّنَّة والجماعة، وفي الفقه وَفْقَ مذاهبهم الفقهيَّة المشهورة.\n3. يراعي في التَّعليم المقاصدَ الشَّرعيَّة، والمصالحَ المعتبَرة؛ كالوحدة والاجتماع على الكتاب والسُّنَّة، ونبذ التَّفرُّق والتحزُّب.\n4. قاعدة المصالح والمفاسد معتبرة شرعًا، وتقدير المصالح والمفاسد عند تزاحمها **راجعٌ إلى أهل الحلِّ والعقد، وليس للإمام الخوض فيها**.\n5. يُركِّز في تعليمه على أركان الإيمان والإسلام، ولا يهمل الجوانب الشَّرعيَّة الأخرى في التَّفسير وعلوم القرآن، والحديث وعلومه، والفقه وأصوله، والسِّيرة النَّبويَّة، والأخلاق والآداب، واللُّغة وعلومها.\n6. يلتزم الأمانة والعدل، ولا يحمله الحبُّ والبغض على الجور، ولا الرَّغبة والرَّهبة على كتم الحقِّ.\n7. **يكتفي في تعليمه بما هو معروف من قواعد الدِّين وأحكامه، ويلتزم بعدم الإفتاء في النَّوازل التي تهمُّ الشَّأن العامَّ للبلاد، ويتعيَّن عليه توجيه المستفتين إلى إدارة الفتوى عند الاقتضاء.**\n8. **يمتنع عن الإفتاء في المسائل ذوات الطَّابع الخصوصيِّ؛ كالطَّلاق، والمنازعات، والمواريث، ويحيل السَّائل إلى جهات الاختصاص.**\n9. يكون ربَّانيًّا في تعليمه؛ فيبدأ بصغار العلم قبل كباره، ويتدرَّج تدرُّج النَّاصحين، ولا يخاطب النَّاس إلَّا بما يمكنهم فهمه.\n10. يبتعد عن التَّجريح والسَّبِّ والشَّتم؛ ويبيِّن الحقَّ بدليله، ويبيِّن ضعف حجَّة المخالف بكلِّ أدب.\n11. يبذل جهده في تعليم ما يوحِّد الصَّفَّ، ويجمع الكلمة على الكتاب والسُّنَّة وفقه سلف الأمَّة، ويبتعد عن العنصريَّة والطَّائفيَّة والقَبَليَّة والعائليَّة.\n12. يجتهد في نشر الدِّين الصَّافي من مصدرَيه: الكتاب والسُّنَّة، ويبتعد عن الغلوِّ والجفاء، وعن البدع والمحدثات.\n13. يَحُثُّ على امتثال الأعراف الموافقة للشَّرع في البلد.\n14. يستعدُّ للدَّرس استعدادًا تامًّا، ويهيِّئ لنفسه مكانًا مناسبًا وهيئةً مناسبة، ويجعل قول «لا أعلم» مطيَّتَه، ولا يكابر فيما يَشكُّ فيه.\n15. يعتمد في التَّعليم اللُّغة العربيَّة الفصحى، ولا بأس بتفسير الكلمات باللَّهجة العامِّيَّة عند الحاجة، **ويمكن إلقاء الدَّرس باللُّغات التي يكثر النَّاطقون بها من الجاليات في مسجده بموافقة الإدارة**.\n16. يتحلَّى في تعليمه بأخلاق النَّبيِّ ﷺ؛ صبورًا حليمًا بشوشًا.\n17. يتعامل مع المتعلِّمين كتعامل الأب الحاني، والأخ النَّاصح.\n18. **يُدَرِّبُ المصلِّين بالتَّعليم التَّطبيقيِّ للوضوء والصَّلاة** وغيرها من الأمور الشَّرعيَّة ذوات الطَّابع العمليِّ.\n19. يَبْذُلُ وُسعَه في أن يكون عامِلًا بما يُعَلِّم.\n20. يُعْنَى بشمول دعوته لِتَسَعَ المدعوِّين جميعًا: شبابًا وشِيبًا، رجالًا ونساءً وأطفالًا.\n21. **يَبْتَعِدُ عن القضايا السِّياسيَّة في التَّعليم**، إلَّا ما كان وَفْقَ السِّياسة الشَّرعيَّة، بعيدًا عن العواطف، ويتجنَّب كلَّ ما يؤدِّي إلى فتنة خاصَّة أو عامَّة.\n22. يَجمعُ في خُطَبِه بين الوعظِ والتَّعليم.\n23. يُعتبرُ الإمام معلِّمًا في جميع حالاته؛ فيُراعي ذلك في مظهَرِه وسلوكِه وجميع أقواله وأفعاله.\n24. **يَحثُّ النَّاس على اتِّباع الأوامر الصَّادرة من وليِّ الأمر**، ويجتهد في تعليمهم السَّمع والطَّاعة بالمعروف، واتِّباع الأنظمة العامَّة.\n25. يحرص على حضور الدَّورات التَّعليميَّة المقامة من الوزارة.\n26. يَحْرِصُ على تنويع الوسائل، مع الحكمة والموعظة الحسنة والمجادلة بالتي هي أحسن.\n27. يتجنَّب الأحاديث الواهية والضَّعيفة، والقصص المختلقة، والأذواق المخالفة للشَّريعة، إلَّا ما دعت الحاجة إلى ذكره لبيان وهنه.\n28. **تكون دروسُه من كتب الأئمَّة المعروفين بالسُّنَّة، واعتمادًا عليها، ويتجنَّب غيرَها.**\n29. يقيم الدُّروس العلميَّة التي تحلُّ مشاكل المصلِّين، وتجنِّبهم المزالق النَّفسيَّة والأسريَّة والاجتماعيَّة.\n30. **يلتزم إقامة ثلاثة دروس كحدٍّ أدنى في المسجد خلال الأسبوع، إضافةً إلى الخطبة إن كان مكلَّفًا بها.**\n31. **يلتزم بزيِّ أهل البلد؛ فلا يلقي الدُّروس بزيٍّ مخالفٍ إلَّا إن كان ضيفًا؛ فله أن يلتزم بزيِّ بلده.**\n32. **يحقُّ له أن يَستخدمَ الوسائلَ السَّمعيَّةَ والمرئيَّةَ في دروسِه دون خُطَبِه**، بما لا يُخالف ميثاق المسجد، أو يُخرجه عن سُمُوِّ رسالتِه.\n\n### 3- الدَّور الوَعْظيُّ والدَّعويُّ للإمام\n\n**أوَّلًا: الدَّور الوَعْظيُّ:**\n1. يلتزم الحكمة في الوعظ ترغيبًا وترهيبًا، ونصحًا وإرشادًا، وأمرًا بالمعروف ونهيًا عن المنكر.\n2. يقصد بوعظه الكمالَ الرُّوحيَّ والسموَّ الأخلاقيَّ، فيجمع بين التَّصفية والتَّربية.\n3. لا يكون في وعظه وإرشادِه مقنِّطًا، ولا متساهِلًا، ويحرص على التَّفاؤل، ولا يكون متشائمًا ولا مُؤَيِّسًا.\n4. يهدف في وعظه إلى التَّذكير والإرشاد والتَّوجيه، لا مجرَّد التَّوبيخ والتَّقريع.\n5. يكون في بشارته ونذارته ملتزمًا بما ثبت، **ولا يأتي بالأحاديث الضَّعيفة في التَّرغيب والتَّرهيب**.\n6. **الوعظُ يقوم به الإمامُ، أو من ينوب عنه، أو من عنده إذن من الوزارة من الضِّيوف ونحوهم.**\n7. **عند وجود موعظة أو درسٍ مقرَّر من الوزارة: يوقِفُ الإمام موعظتَه ودرسَه المحدَّد في وقته دون أيِّ غضاضة.**\n8. تكون المواعظُ مركَّزة على قضيَّة معيَّنة، حتَّى لا تتشتَّت أذهانُ المُستَمِعين.\n\n**ثانيًا: الدَّور الدَّعويُّ — أ) محتوى منهجه الدَّعويِّ:**\n1. يجعل مصدرَ دعوته: الكتابَ والسُّنَّة وفقه سلف الأمَّة، ويرجع إلى العلماء الرَّبَّانيِّين في زمانه.\n2. يعتمد منهج الوسطيَّة خطَّ سيرٍ لا يتعدَّاه ولا يقصُر عنه، وميزانه البعد عن الغلوِّ والجفاء؛ فلا إفراط ولا تفريط.\n3. يجعل الحقَّ هدفه، والحكمة وسيلته، والسُّنَّة العمليَّة سفينته.\n4. الاستشهاد بالنُّصوص الشَّرعيَّة على وجه صحيح، بعيدًا عن شطحات بعض المفسِّرين وشُرَّاح الحديث.\n5. لا يكون جَمَّاعًا كحاطب ليل، وإنَّما يذكر من الأحاديث ما صحَّ، ومن القصص ما لا يُنكر ولا يُستقبح.\n6. لا يَخرج عن المسائل الإجماعيَّة التي اتَّفق عليها أئمَّة السُّنَّة والمذاهب الفقهيَّة المعتبرة.\n7. اجتهادات العلماء معتبرةٌ ويُستفاد منها، وأمَّا الأقوال المخالفة لصريح الأدلَّة فلا يفتي بها، **ويَحذَرُ الإمام التَّعصُّبَ للمذاهب والأشخاص**.\n8. لا ينشر أيَّ فكرٍ أو عقيدةٍ مخالفةٍ لعقيدة أهل السُّنَّة والجماعة في أيِّ بابٍ من أبواب الاعتقاد.\n9. **يقول في المسائل الخلافيَّة بالرَّأي المشهور في البلد**، وإذا كان له رأيٌ فيبيِّن وجه الخلاف، لكن لا يُدخِلُ العوامَّ في الاختلافات التي تُضعِف مكانة الدِّين في قلوبهم.\n10. يجتهد في تعبيد النَّاس لربِّ العالمين، ويبيِّن أنَّ العبادة ليست مقصورة على العبادات العمليَّة.\n11. يُنْزِلُ النَّاس منازلهم؛ فيَعْرِفُ لأهل العلم والسِّنِّ قدرهم.\n12. يبتعد عن ذكر الطَّوائف في دعوته، والردُّ على المخالف يكون بالدَّليل الأقوم وبالتي هي أحسن، ولا تقابل البدعة ببدعة.\n13. يكون مدركًا للأصول الشَّرعيَّة، وأعظمها: التوحيد، واتِّباع السُّنَّة، والاعتصام بهما.\n14. يحذر من تقسيم الدِّين إلى حقيقةٍ تتميَّز بها الخاصَّة وشريعةٍ تلزم العامَّة، ومن قضيَّة فصل الدِّين عن الدُّنيا والدِّين عن الدَّولة.\n15. يلتزم في دعوته بالنُّصوص الشَّرعيَّة والألفاظ الواردة فيها، ويبتعد عن المتشابهات والألفاظ المحدثة والبدعيَّة والمجمَلة.\n16. يُدرِكُ أنَّ العقل تابع للنَّقل، وأنَّ العقل الصَّريح لا يمكن أن يخالف النَّقل الصَّحيح.\n17. يَسعَى لإحياء المصالح المشتركة بين النَّاس؛ مثل: إقامة العدل، ومكافحة الأمراض، والفقر، والرَّذيلة، وحسن الجوار، والمحافظة على البيئة.\n18. يستفيد من الوسائل المتجدِّدة في دعوته بما لا يخالف الشَّريعة.\n19. **يبتعد في دعوته عن الإرهاب الفكريِّ، ويُحَذِّرُ من الإرهاب والتَّطرُّف.**\n20. يُرَاعِي قاعدة المصالح والمفاسد، ويعلم أنَّ تقدير المصالح والمفاسد عند التَّزاحم راجعٌ إلى العلماء المعتبرين، والقضاة، والمفتين.\n21. **يبتعدُ عن الأمور المتعلِّقة بالقضايا العينيَّة ذوات الشَّأن الخصوصيِّ؛ مثل الدِّماء، والطلاق، والقضاء، ويحيلها إلى جهة الاختصاص.**\n\n**ب) الأداء الدَّعويُّ:**\n1. يَستَحضِرُ في دعوته تقوى الله والإخلاصَ له، وتحرِّي الصَّواب بمتابعة النَّبيِّ ﷺ.\n2. يراجع منهجَه الدَّعويَّ؛ فيتأكَّد من: المصدر، والتَّطبيق، والنَّتيجة، والثَّمرات.\n3. **الإمام مسؤولٌ مسؤوليَّة مباشرة عن كلِّ ما يصدرُ عنه في دعوته ودروسه ومواعظه.**\n4. يجتهد في دعوته؛ فيُحَبِّبُ النَّاس في المسجدِ خاصَّة، وفي الدِّين عامَّة.\n5. يسير في دعوته بمعاملة المسلمين بحسن الظَّنِّ، وبالظَّاهر، ولا مانع من الاحتراز والحذر عند مَظِنَّته.\n6. **يبتعد كلَّ البعد عن تكفير الأعيان، وليعلم أنَّ ذلك من وظائف الحكَّام والقضاة والمفتين.**\n7. يُرَسِّخ أنَّ الجهادَ في سبيل الله ذروةُ سنام الإسلام، وأنَّ له شروطًا وضوابط وأحكامًا، **وأنَّه مرتبطٌ بوليِّ الأمر**، وأنَّ الدَّعوات إلى الجهاد متى ما قام بها غيره؛ كانت سببًا للفساد.\n8. يردُّ الشُّبهات بالتي هي أحسن للَّتي هي أقوم، ولا يترك الشُّبهة تجول في خواطر النَّاس، ويبتعد عن إيرادها قدر المستطاع.\n9. يدرك أنَّ الاختلاف طبيعة بشريَّة؛ فلا يطمع في أن يكون النَّاس صورة واحدة.\n10. يبذل جهده في تضييق الخلاف وحصره ما استطاع، ويحذر من توسيعه.\n11. يشجِّع التَّفكير والإبداع لأهل الاختصاص، كلًّا في مجاله.\n12. يحرص على جمع الكلمة على الحقِّ، وتنمية روح التَّعاون على البرِّ والتَّقوى، ويعمل على توافق أهل البلد.\n13. **يُبَيِّنُ وجوبَ السَّمع والطَّاعة لوليِّ أمر البلاد وَفْقَ منهج أهل السُّنَّة، مع النُّصح له وَفْقَ الضَّوابط الشَّرعيَّة.**\n14. يبتعد عن الطَّعْنِ في الأئمَّة، ويُدرك أنَّ قاعدة رفع الإثم عن العلماء المجتهدين قاعدة معتبرة.\n15. **لا يَسمحُ لنفسه ولا لأيِّ أحدٍ أن يَتَنَقَّصَ صحابةَ الرَّسول ﷺ، وأمَّهات المؤمنين، وآل بيته الطَّاهرين.**\n16. يَحذَرُ من الحماس الزَّائد الذي يجعله يتسرَّعُ بألفاظٍ وكلماتٍ لا تليقُ بالمنبر.\n17. يُلاحِظُ في دعوته القواعدَ الكلِّيَّة، والمقاصدَ الشَّرعيَّة.\n18. ينظر إلى التَّاريخ الإسلاميِّ نظرة معتبِر.\n\n### 4- الدَّور التَّعريفيُّ بالإسلام (لأئمَّة مساجد الجاليات)\n\n1. أن يحرص ما استطاع على إيصال دعوة الإسلام إلى غير المسلمين بما أتيح له من وسائل مشروعة، ويكون هدفه الأوَّل زيادة عدد المهتدين إلى الإسلام في كلِّ يوم.\n2. أن يَسمح لمن يريد إشهار إسلامه من غير المسلمين بالدُّخول إلى مسجده، ويُلَقِّنَه شهادة التَّوحيد، ويعرِّفه بما يجب عليه بعد إعلان إسلامه.\n3. أن يَسمحَ لمن رجا فيه الهداية من غير المسلمين بالدُّخول إلى المسجد؛ لتأليفهم على الإسلام.\n4. أن يدلَّ مَن يريد الإسلامَ على الإجراءات اللَّازمة لذلك؛ حتَّى يُرَسَّم إسلامُه في الجهات المختصَّة.\n5. أن يقيم للمهتدين الجُدُد بعد إسلامهم دروسًا خاصَّة في مبادئ العقيدة والأحكام الفقهيَّة.\n6. أن يكون له إلمامٌ بالشُّبهات التي تثار عند غير المسلمين حول الإسلام وأهله.\n7. **أن تكون له دروسٌ دوريَّةٌ كلَّ أسبوع في التَّعريف برسالة الإسلام، ودعوته الوسطيَّة السَّمحة، والتَّعريف بالنَّبيِّ ﷺ وسيرته.**\n8. أن يتحلَّى بالرِّفق واللِّين والحكمة في التَّعامل مع المسلمين الجُدُد، ويراعي التدرُّج، ويحذر من التَّشديد فيما وسَّع فيه الشَّرع.\n9. أن يحمل همَّ احتواء المهتدين الجُدُد بالتَّنويع في النَّشاطات والتَّجديد في الوسائل الدَّعويَّة.\n10. أن يعمل على تهيئة الأجواء المناسبة في المسجد (مكتبة المسجد، والمجلَّة الحائطيَّة، واللَّوحات الإرشاديَّة).\n11. **أن يكون على صلة وثيقة بمراقبة الجاليات بوزارة الأوقاف**، ويستفيد من المراكز التي تعنى بالمهتدين الجُدُد.\n12. **أن تكون خطبةُ الجمعة في مساجد الجاليات -بعد الاتِّفاق مع الإدارة- باللُّغة التي يفهمها غالبُ من يَحضرها، عدا ما تجب قراءته بالعربيَّة -كآيات القرآن-.**\n13. يحرص الإمام -في المساجد عمومًا- على دعوة الجاليات وتعليمهم؛ **فيخصِّص لهم درسًا أو أكثر أسبوعيًّا**، أو يستعين بمَن يقوم بذلك بعد إذن الإدارة له.\n\n### 5- الدَّور الاجتماعيُّ للإمام\n\n1. يبذل نفسه لخدمة جمهور مسجده، والسَّعي في حاجاتهم، وتقديم كلِّ أنواع المعروف لهم.\n2. الدَّور الاجتماعيُّ منوطٌ بطبيعة عمله الدَّعويِّ، ويجب أن يتكامل مع ما تكفلُه الدَّولة، ويكون بتنسيق مع جماعة المسجد.\n3. **انعزال الإمام عن روَّاد مسجده واقتصار عمله على أداء الشَّعائر: قصورٌ مَعيبٌ في جانبٍ من أهمِّ جوانب دوره في المجتمع، وإخلالٌ بيِّنٌ بطبيعة عمله الدَّعويِّ.**\n4. الدَّور الاجتماعيُّ غيرُ متعلِّقٍ بجماعة مسجده فحسب؛ فينبغي توثيق الصِّلة بين المسجد ومحيطه من جيران وأسواق ومؤسَّسات حكوميَّة أو أهليَّة.\n5. **للإمام أن ينظِّم لقاءاتٍ دوريَّةً مع أهل مسجده**؛ لمناقشة ما يعانيه محيط المسجد من سلبيَّات، والتَّوصُّل معهم إلى اقتراحات تُرفَع إلى المعنيِّين.\n6. الأنشطةُ ذواتُ الطَّابع الاجتماعيِّ في المسجد مرحَّبٌ بها؛ كإفطار الصَّائمين في رمضان، أو تكريم حفظة القرآن، ومتفوِّقي طلَّاب المنطقة، أو تنظيم مسابقات ثقافيَّة، **بما لا يتنافى مع مكانة المسجد، وبعد التَّنسيق مع جماعة المسجد وإدارته المختصَّة**.\n7. للإمام أن يتَّخذ الوسائل الاجتماعيَّة التي تقوِّي روح الأخوَّة؛ كالمشاركة في مجموعات تواصلٍ إلكترونيٍّ.\n8. للإمام أن يَسعى مع ذوي الخبرة وأصحاب التخصُّص لاستعراض مشكلات محيط مسجده، بالتَّنسيق مع إدارته المختصَّة.\n9. للإمام أن يَستعين بجماعة المسجد في إصلاح ذات البين.\n10. **فالمخالطةُ تكون بقدر، والتَّواصل بحساب، والزِّيارات باعتدال، وليعلم الدَّاعية أنَّ مكانتَه مرهونةٌ بمدى استغنائه عن النَّاس.**\n\n## ثانيًا: تنظيم عمل الخطيب\n\n1. **يُعِدُّ خطبتَه إعدادًا جيِّدًا في صلاة الجمعة والعيدين والاستسقاء ونحوها، ويؤدِّيها في مسجده المكلَّف به، بعد التَّأكُّد من دخول وقت الجمعة، مع المواظبة على ذلك**، ما لم يأت صارف أو توجيه من الإدارة التَّابع لها الخطيب.\n2. يتثبَّت من سلامة نقل النَّصِّ، وفهمِه ووجه الاستدلال به، ومن صحَّة الحديث متنًا وسندًا، ومن الأحكام الشَّرعيَّة، ووقائع التَّاريخ.\n3. النَّاس يتفاوتون في الفهم والإدراك؛ فيُراعي قدرة النَّاس في الفهم.\n4. يوازنُ بين الأمور المتقابلة؛ بين البشارة والنِّذارة، وبين المصالح والمفاسد، وبين الجانب العاطفيِّ والجانب العقليِّ.\n5. **يَبتَعِدُ عمَّا يكون سببًا في التَّفريق، وشقِّ الصَّفِّ، وإثارة الخلافات؛ كتناول القضايا السِّياسيَّة، والانحياز الطَّائفيِّ أو الفئويِّ أو القَبَليِّ، وتجريح الهيئات والمؤسَّسات، وذكرِ الأشخاص.**\n6. تكون الخطبة واقعيَّة -ما أمكن-، منضبطةً بالشَّرع الحنيف.\n7. العلم بأحوال من يستمع إليه، والتَّفاعل مع قضاياهم، والحثُّ على تأليف القلوب واجتماع الكلمة ووحدة الصَّفِّ.\n8. يحرص على إحياء القيم العامَّة والفضائل العظيمة؛ كالأمانة، وبرِّ الوالدين، وصلة الأرحام، والإنفاق، والتَّكافل، والاستقامة، والوفاء بالعقود، **وطاعة ولاة الأمر**، والإخلاص، والصِّدق، والتَّعاون على البرِّ والتَّقوى.\n9. **يوزِّع مكتبُ الشُّؤون الفنيَّة بالوزارة خطبةً إرشاديَّة كلَّ جمعة، تُعين الخطيب وترشده**؛ فله أن يخطب بها، أو بما يراه مناسبًا لجمهوره، **ما لم يأت تعميمٌ إلزاميٌّ بخطبة الوزارة**.\n10. **يستفيد الخطيبُ من الملحوظات الواردة على خطبته من قسم التَّوجيه الفنيِّ التَّابع لإدارته؛ حيث يقوم القسم بسماع خطبته وتقييمها علميًّا من خلال نموذج التَّقييم**، وإفادته بالمستوى العامِّ لخطبته.\n11. للِّباس أثرٌ في النَّفس الإنسانيَّة، والمأمول من الخطيب أن يَخطُبَ بحاله قبل مقاله.\n\n## ثالثًا: تنظيم عمل المؤذِّن\n\n- «الْمؤذِّنونَ أَطْوَلُ النَّاسِ أَعْنَاقًا يَوْمَ الْقِيَامَةِ».\n\n**المهامُّ الواجبة عليه:**\n1. **رفعُ الأذان للصَّلوات الخمس المكتوبات وصلاة الجمعة في أوَّل المواعيد الشَّرعيَّة لدخول وقت الصَّلاة.**\n2. المشاركة في حفظ النِّظام بالمسجد، والتقيُّد بالآداب العامَّة، ومنع مصادر الإزعاج.\n3. **لا يُؤَذَّنُ ولا يُقامُ لشيءٍ من النَّوافل، ولا لصلاة العيدين، ولا لصلوات الاستسقاء والكسوف والجنازة، إلَّا أنَّه يقول في الكسوف: «الصَّلاة جامعة»**، وأمَّا العيدان والتَّراويح ونحوهما؛ فلم يَرِد فيها شيءٌ صحيح.\n4. **الأذان الأوَّل للفجر يكون قبل الأذان الثَّاني بنصف ساعة.**\n5. **الأذان الأوَّل للجمعة يكون قبل الأذان الثَّاني بمدَّةٍ أقلُّها نصفُ ساعة، ويكون الأذانُ الثَّاني بعد صعودِ الخطيب على المنبر، وسَلَامِه على المصلِّين.**\n6. **يُسَنُّ في الأذان التَّرسُّلُ والتَّمهُّلُ والتَّأنِّي، ويُسَنُّ في الإقامةِ الحَدْرُ والإسراع.**\n7. **الالتزام بألفاظ الأذان والإقامة:**\n   - **ألفاظ الأذان:** «الله أكبر» (أربع مرَّات) – «أشهد أن لَّا إله إلَّا الله» (مرَّتين) – «أشهد أنَّ محمَّدًا رَّسولُ الله» (مرَّتين) – «حيَّ على الصَّلاة» (مرَّتين) – «حيَّ على الفلاح» (مرَّتين) – «الله أكبر» (مرَّتين) – «لا إله إلَّا الله» (مرَّة واحدة). **فيكون عدد الكلمات خمسَ عشرة كلمة.** وتُزاد جملةُ «الصَّلاةُ خيرٌ مِّن النَّوْمِ» (مرَّتين) بعد الحَيْعَلَتَين في الأذان الثَّاني من صلاة الفجر؛ **فيكون عدد كلمات أذان الفجر سبعَ عشرة كلمة.**\n   - **ألفاظ الإقامة:** «الله أكبر» (مرَّتين) – «أشهد أن لَّا إله إلَّا الله» (مرَّة) – «أشهد أنَّ محمَّدًا رَّسول الله» (مرَّة) – «حيَّ على الصَّلاة» (مرَّة) – «حيَّ على الفلاح» (مرَّة) – «قد قامت الصَّلاة» (مرَّتين) – «الله أكبر» (مرَّتين) – «لا إله إلَّا الله» (مرَّة). **فالإقامةُ بتثنية التَّكبير الأوَّل والأخير، وكذلك جملة «قد قامت الصَّلاة»، وبإفراد سائر الكلمات، فيكون عدد الكلمات في الإقامةِ إحدى عشرة كلمة.**\n\n---\n\n# الباب الثَّاني: تنظيم العلاقات بين العاملين في المسجد\n\n## أوَّلًا: العلاقات المشتركة\n\nتشمل أربعَ جهاتٍ؛ هي: **المسجد، والعاملون فيه، والمصلُّون، والإدارة**.\n\n### 1- العلاقة بالمسجد\n- **أوَّلًا: علاقة إيمانيَّة:** العاملون منوطٌ بهم رعاية الجانب الإيمانيِّ في المسجد؛ لأنَّه ساحة العبادة والطَّاعة والطُّمَأنينة والخشوع.\n- **ثانيًا: علاقة علميَّة وثقافيَّة:** رعاية الجوانب العلميَّة والثَّقافيَّة، وترسيخ مبدأ الرُّجوع للقرآن والسُّنَّة والإجماع الذي يجمع المصلِّين ويبعدهم عن الخلاف والتَّنازع.\n- **ثالثًا: علاقة توجيهيَّة واجتماعيَّة:** رعاية الجوانب الاجتماعيَّة، وترسيخ العلاقات الطَّيِّبة والتَّوجيه النَّافع؛ فالمسجد قلب المجتمع الإسلاميِّ وروحُه ومركزُ توجيهه.\n\n### 2- العلاقة بالعاملين في المسجد\n1. أن يحرصوا جميعًا على عمارة المسجد: عمارة رعاية وصيانة، وعمارة إصلاح وهداية وعبادة، وأن يكون ذلك شغلَهم الشَّاغل.\n2. أن يتعاونوا على البرِّ والتَّقوى، ويتكاتفوا مع بعضٍ وبمشاركة المصلِّين.\n3. **أن يقدِّموا مصلحةَ المسجد وعمارته على مصالحهم الشَّخصيَّة، ويحذروا من اتِّخاذ المسجد مطيَّةً لتحقيق مآرب دنيويَّة.**\n4. **أن يتشاوروا ويتبادلوا الرَّأي في كلِّ ما يحتاج إلى مشاركة بينهم، ولا ينفرد أحدهم بالرَّأي والقرار دون صاحبه.**\n5. أن تكون العلاقة قائمة على أساس التَّآخي والتَّحابب والتَّراحم والتَّوادد، بعيدًا عن الحسد والبغضاء والشِّقاق والخصام.\n6. التَّحلِّي بالأخلاق الفاضلة؛ من التَّواضع، وخفض الجناح، والرِّفق واللِّين، والحلم والأناة.\n7. التَّحلِّي بسلامة الصَّدر وحسن الظَّنِّ فيما بينهم، والتَّأويل الحسن.\n8. ألَّا يذكر كلُّ واحد منهم صاحبَه إلَّا بخير، **ويَحْذَرُوا من الوقوع في الغيبة والنَّميمة، ولا يسمحوا لأحدٍ بغيبةِ أحدهم أو نقل الكلام بينهم**.\n9. **الحرص على أن تكون كلمتهم فيما يتعلَّق بشؤون المسجد واحدة، وموقفهم موحَّدًا، وألَّا يُشرِكوا عامَّة النَّاس أو جماعة المسجد فيما لم يَصلوا فيه إلى حلٍّ من مسائل الخلاف أو النِّزاع بينهم، بل ينبغي عليهم الرُّجوع إلى إدارة المساجد، أو إلى لجنة المناصَحة والتَّوجيه للفصل بينهم، إذا اضطُرُّوا إلى ذلك.**\n\n### 3- العلاقة بالمصلِّين\nقائمة على التَّعاون على البرِّ والتَّقوى، والتَّواصي بالحقِّ والصَّبر. ومِمَّا يُرَسِّخُ الصِّلة:\n- أ) تعزيز روابط التَّواصل بين روَّاد المسجد.\n- ب) الحرص على جمع القلوب في الوعظ والخطب والدُّروس وسائر الأنشطة.\n- ت) الحرص على حلِّ المشكلات -إن وجدت- بين المصلِّين في المسجد.\n\n### 4- العلاقة بالإدارة\n- أ) تكون العلاقة بالإدارة قائمة على الأخوَّة والتَّقدير، ومعرفة الحقوق والواجبات المنوطة بالعمل.\n- ب) **إمام المسجد -وينوب عنه المؤذِّن في حال غيابه- هو المسؤول من قِبَل إدارة المساجد، عن كلِّ ما يجري في المسجد من توجيه ونشاط، وعن الحفاظ على مكانة المسجد.**\n- ت) المشاركة في البرامج والأنشطة العلميَّة والثَّقافيَّة.\n- ث) يؤدِّي العاملون ما كلِّفوا به مِن أعمال من قِبَل الإدارة.\n\n## ثانيًا: العلاقات الخاصَّة بطبيعة العمل\n\nتقوم على مبدأ **التَّعاون والتَّكامل**.\n\n**أوَّلًا: علاقة الإمام بالمؤذِّن:**\n1. **الإمام هو المسؤول الأوَّل عن إدارة المسجد.**\n2. **يلتزم الإمام بالفترة المحدَّدة بين الأذان والإقامة من قبل الوزارة، أو ما جرى الاتِّفاق عليه مع روَّاد المسجد.**\n3. **يُخطِرُ الإدارة بتغيُّب المؤذِّن.**\n4. **يكون بديلًا عن المؤذِّن حال إجازته أو تغيُّبه.**\n5. **يُعلم المؤذِّن بإجازته ويوم استراحته الأسبوعيِّ، وحال تغيُّبه.**\n\n**ثانيًا: علاقة المؤذِّن بالإمام:**\n1. اتِّباع المؤذِّن توجيهاتِ الإمام.\n2. إعلام الإمام بتغيُّبه، ويوم استراحته، وإجازاته.\n3. **ينوب عن الإمام في مسؤوليَّته عن المسجد، وإمامته بالمصلِّين، في حال غيابه أو إجازته.**\n4. **يُقيم الصَّلاة بعد انتهاء الوقت المحدَّد للإقامة.**\n\n**ثالثًا: التَّنسيق بين الإمام والمؤذِّن:**\n- **يجب التَّنسيق بينهما في الاستئذانات، والإجازات، والرَّاحة الأسبوعيَّة، وعند الاختلاف يُرجع للإدارة.**\n\n---\n\n# الباب الثَّالث: حقوق العاملين في المساجد ومسؤوليَّاتهم\n\n## أوَّلًا: حقوق العاملين في المساجد\n\n### 1- الحقوق في ظلِّ قانون الخدمة المدنيَّة\n1. استحقاق المرتَّب المقرَّر للدَّرجة الوظيفيَّة عند بداية تعيينه، وعلاوة دوريَّة سنويَّة بالفئة المقرَّرة لدرجته، وبدلات ومكافآت المسمَّى الوظيفيِّ، وتُصرَف له اعتبارًا من تاريخ مباشرة العمل.\n2. يستحقُّ -بعد موافقة السُّلطة المختصَّة- الحصولَ على إجازة دراسيَّة، أو الإيفادَ في بعثة، أو منحة دراسيَّة.\n3. **الحصول على إجازة دوريَّة لمدَّة (35) يومًا في السَّنة، تزاد إلى (45) يومًا بعد قضائه خمس عشرة سنة في خدمة الدَّولة**، وله أن يحتفظ برصيده الذي لم ينتفع به، ويستحقُّ عنه بدلًا نقديًّا عند انتهاء خدمته.\n4. الحصول على إجازة طارئة، وإجازة خاصَّة، وإجازة مرضيَّة، وإجازة وفاة، وإجازة مرافقة مريضٍ قرَّرت وزارةُ الصِّحَّة العامَّة علاجَه في الخارج مع مرافق.\n5. **التَّرقية في أوَّل يناير أو أوَّل يوليو التَّالي إلى الدَّرجة الوظيفيَّة التَّالية لها بمضيِّ سنةٍ على بلوغ مرتَّبِه آخر مربوط درجته، على ألَّا يكون تقريرُه النِّهائيُّ بدرجة ضعيف**، ويجوز ترقيته بالاختيار.\n\n### 2- الحقوق في ظلِّ قرارات قطاع المساجد ولوائحه\n1. **تخصيص سكن وقفيٍّ في حدود المتاح لمن يباشر العمل بالمساجد، بمقابل انتفاع رمزيٍّ**، بعد استيفائه للشُّروط المنظِّمة لذلك.\n2. **المشاركة في رحلات العمرة والحجِّ للمتميِّزين، وفقًا لترشيحات الإدارة المختصَّة.**\n3. المشاركة في الرِّحلات التَّرفيهيَّة، والمسابقات الثَّقافيَّة، التي تجريها الإدارات المختصَّة.\n\n## ثانيًا: مسؤوليَّات العاملين في المساجد\n\n- كلُّ حقٍّ يُقابلُه التزام؛ فإذا أخلَّ شاغلُ الوظيفة بأيٍّ من واجباته الوظيفيَّة، أو ارتكب محظورًا: **يعاقب تأديبيًّا**، مع عدم الإخلال بالمسؤوليَّة الجزائيَّة أو المدنيَّة عند الاقتضاء.\n- **ويُعفى الموظَّف من العقوبة التَّأديبيَّة إذا ثبت أنَّ ارتكابه للمخالفة كان تنفيذًا لأمرٍ كتابيٍّ صدر إليه من رئيسه، بالرَّغم من تنبيهه إلى المخالفة.**\n- **من صور المسؤوليَّة التَّأديبيَّة:** ارتكابُه لمحظور من المحظورات الوظيفيَّة، أو الإخلال بكرامتها.\n- **من صور المسؤوليَّة الجنائيَّة:** التَّعدِّي على المال العامِّ، أو التَّعرُّض للغير بالسَّبِّ أو القذف، أو ارتكابه أثناء تأدية وظيفته إحدى الجرائم المنصوص عليها في قانون الجزاء.\n\n**أوَّلًا: الإجراءات التي تُتَّخذ عند ارتكاب أيٍّ من المخالفات:**\n1. **الإحالة إلى التَّحقيق بقرارٍ من السُّلطة المختصَّة**، ويُحال العاملون بالمساجد إلى لجانٍ متخصِّصةٍ يصدر بتشكيلها قرارٌ إداريّ إذا ارتكب أحدُهم عملًا من الأعمال التَّالية -وذلك بعد استنفادِ الإجراءات الإدارية المعهودة، مثل: التَّنبيه الشَّفويُّ، وكتابِ توجيه، وكتاب تنبيه، وغيرها-:\n   - أ) **عدم التَّقيُّد بالأوقات المحدَّدة لتشغيل مكبِّرات الصَّوت الخارجيَّة.**\n   - ب) **عدم الالتزام بأوقات الأذان والإقامة حسب مواقيت الصَّلاة في دولة الكويت.**\n   - ت) **عدم تسجيل خطبة الجمعة بشكل متكرِّر ومتعمَّد.**\n   - ث) **تجاوزُ الوقت المحدَّد لخطبة الجمعة في ضوء ما تصدره الوزارة من تعليمات.**\n   - ج) **التَّعرُّض في الخطبة للمسائل السِّياسيَّة، أو العصبيَّة، أو الحزبيَّة، أو للأشخاص، أو للدُّول، أو المؤسَّسات.**\n2. **الوقف عن العمل لمصلحة التَّحقيق، أو للمصلحة العامَّة، بقرار من السُّلطة المختصَّة**، إذا توفَّرت مبرِّرات تستوجب الإيقاف عن العمل.\n\n**ثانيًا: الجزاءات:**\n1. **لا يجوز توقيع عقوبة تأديبيَّةٍ إلَّا بعد التَّحقيق مع المخالف كتابةً، وسماع أقواله وتحقيق دفاعه، ويجب أن يكون القرار الصَّادر بتوقيع العقوبة معلَّلًا.**\n2. **تُوَقَّعُ على المخالف الجزاءاتُ الواردة في قانون الخدمة المدنيَّة وأنظمتها.**\n\n---\n\n# الباب الرَّابع: الواجبات المناطَة بالعاملين في المسجد\n\n## أوَّلًا: واجبات العاملين في المساجد في ظلِّ قانون الخدمة المدنيَّة\n\n**أ- الواجبات الوظيفيَّة:**\n1. أن يقوم بنفسه بالعمل المنوط به، وأن يؤدِّيه بأمانة وإتقان، وأن يعامل النَّاس معاملةً لائقة.\n2. أن يخصِّص وقتَ العمل الرَّسميِّ لأداء واجبات وظيفته.\n3. أن ينفِّذَ ما يصدر إليه من أوامر بدقَّةٍ وأمانة، وذلك في حدود القوانين واللَّوائح.\n4. أن يلتزم بأحكام القوانين واللَّوائح، وأن يحافظ على ممتلكات الدَّولة.\n5. أن يحافظ على كرامة الوظيفة، وأن يسلك في تصرُّفاته مسلكًا يَتَّفِقُ والاحترام الواجب.\n6. أن يلتزم بأداء الشَّهادة إذا ما استُدعي لسماع شهادته في تحقيق إداريٍّ، وعدم أداء الشَّهادة مخالفة تأديبيَّة تستوجب المساءلة.\n\n**ب- المحظورات الوظيفيَّة: يحظر على الموظَّف:**\n1. أن يشتري أو يستأجر بالذَّات أو بالواسطة عقاراتٍ أو منقولات من الجهة الحكوميَّة التي يؤدِّي فيها أعمال وظيفته، كما يحظر عليه أن يبيع أو يؤجِّر لها شيئًا من ذلك.\n2. أن تكون له مصلحة بالذَّات أو بالواسطة في أعمال أو مقاولات أو مناقصات أو عقود تتَّصل بأعمال أيَّةِ جهةٍ حكوميَّة.\n3. **أن يؤدِّي أعمالًا للغير بمرتَّبٍ أو مكافأةٍ أو دونهما، ولو في غير أوقات العمل الرَّسميَّة، إلَّا بإذنٍ كتابيٍّ من السُّلطة المختصَّة**، ويُعتبر عدم الحصول على هذا الإذن بمثابة مخالفة تأديبيَّة تستوجب المساءلة.\n4. **مع ما سبق: يجوز للموظَّف أن يتولَّى القوامة أو الوصاية أو الوكالة عن الغائبين؛ ممَّن تربطه بهم صلةُ قربى أو نسبٍ لغاية الدَّرجة الرَّابعة، على أن يخطر الموظَّف الجهة التَّابع لها بذلك.**\n5. أن يستغلَّ وظيفتَه لأيِّ غرض كان.\n6. أن يحتفظ لنفسه بأصول أيَّةِ وثائق رسميَّة، أو صور منها، سواء كانت أوراقًا أو شرائط تسجيل، أو غيرها.\n7. أن يدلي بأيَّة معلوماتٍ عن الأعمال التي ينبغي أن تظلَّ سرِّيَّةً بطبيعتها.\n\n## ثانيًا: واجبات العاملين في المساجد في ظلِّ قرارات قطاع المساجد ولوائحه\n\n### 1- الواجبات المشتركة بين الإمام والمؤذِّن\n1. **الحرص على مظاهر الوقار وكرامة الوظيفة.**\n2. **أن يبتعد عن مجالس الرِّيبة واللَّغو، وكلِّ ما ينال من هيبته أو يُفقده ثقةَ النَّاس.**\n3. **عدم السَّماح بإدخال أيَّة كتبٍ أو أشرطةٍ أو مصاحفَ إلى المسجد إلَّا عن طريق الإدارة المختصَّة، وعدم وضع أيَّة منشوراتٍ أو ملصقاتٍ بالمسجد إلَّا في اللَّوحة المعتمدة.**\n4. **التَّقيُّد بضوابط إقامة الأنشطة الثَّقافيَّة بالمساجد للجمعيَّات والمبرَّات الخيريَّة، وعدم السَّماح لغير المصرَّح لهم كتابيًّا من السُّلطة المختصَّة باعتلاء المنبر، أو بإلقاء محاضرةٍ، أو درسٍ، أو بالتَّحدُّث في المسجد، مهما كان موضوع الحديث.**\n5. **الإبلاغ بأوجه النَّقص والتَّقصير عن أعمال شركات النَّظافة والصِّيانة في المسجد إن وجدت.**\n6. **عدم إضافة أيَّة أجهزةٍ أو تركيباتٍ كهربائيَّةٍ بالمسجد إلَّا بعد أخذ الإذن بذلك.**\n7. التَّعهُّد بالالتزام بالتَّعليمات والأنظمة الصَّادرة من الوزارة، والتَّعاميم التي تنظِّم العمل.\n8. **في حال رغبة الإمام أو المؤذِّن أو الخطيب التَّرشُّح للمجالس النِّيابيَّة أو البلديَّة أو الجمعيَّات التَّعاونيَّة: فعليه التَّقدُّم بالاستقالة، وتُنهى خدماتُه. وله الحقُّ في الرُّجوع إلى العمل في حال عدم فوزه، أو تركِه للمجلس خلال الفترات المحدَّدة قانونيًّا.**\n\n### 2- الواجبات المناطَة بالإمام خاصَّةً\n1. **يتقيَّدُ الإمام بما حدَّدته وزارةُ الأوقاف من مواعيد إقامةِ الصَّلاة، ويمكن -بالتَّشاوُر مع أهل مسجده- تحديدُ ما يُناسِبُهم.**\n2. **يُلزِمُ الإمام نفسَه بالحضور إلى المسجدِ قبل موعد الإقامةِ بوقتٍ كافٍ، حتَّى لا يتسبَّبَ في التَّأخير والتَّشويش.**\n3. **يلتزِمُ برواية حفص بن سليمان الكوفيِّ في القراءة في الصَّلوات؛ منعًا للتَّشويش على المصلِّين، إلَّا باستثناءٍ من الوزارة.**\n4. **يلتزم في التَّعليم بالاستراتيجيَّة الصَّادرة من المراقبة الثَّقافيَّة، ومكتب الشُّؤون الفنيَّة.**\n5. يَبتَعِدُ عن القضايا السِّياسيَّة في التَّعليم، إلَّا ما كان وفق السِّياسة الشَّرعيَّة.\n6. يحثُّ النَّاس على اتِّباع الأوامر الصَّادرة مِن وليِّ الأمر.\n7. **يُسمح للإمام أن يقيم ندوة، أو دورة علميَّة، أو محاضرة مع المرخَّص لهم بإذنٍ من إدارة مساجد المحافظة.**\n8. **الإمامُ هو المسؤولُ الأوَّل عن المسجد من قبل إدارة المساجد التَّابع لها.**\n9. **الإمامُ مسؤولٌ عن تنفيذ التَّعاميم الصَّادرة من الإدارة، والالتزام بها، ومسؤولٌ عن التَّعاميم الموجَّهة إلى جمهور المصلِّين.**\n10. **يجب على الإمام إبلاغ الإدارة عن جميع أعمال الصِّيانة التي يحتاجها المسجد بأيِّ وسيلةٍ من وسائل التَّواصل المتاحة.**\n11. **ينبغي على الإمام أن يَنصَحَ المؤذِّنَ في حال عدم انضباطِه، وإلَّا يُبرئُ ذمَّتَه بإبلاغ الإدارةِ بذلك.**\n12. **على الإمام التَّأكُّدُ من أداء عملِ المؤذِّن، وعملِ عُمَّال النَّظافة، ومتابعتهم في نظافة المسجد ومرافقه وجميع شؤونه، حسب تعليمات الإدارة.**\n13. **يحدِّد الإمامُ الأوقاتِ التي يفتح ويغلق فيها مسجد النِّساء، حسب توجيهات الإدارة.**\n14. **في حال تعرُّضِ المسجد لأيِّ خطرٍ، أو خلَلٍ، أو ضَرَرٍ؛ يقوم الإمامُ بإبلاغ الجهات المختصَّة والإدارة فورًا.**\n15. **في حال تعرُّضِ الإمام لأيِّ تجاوز أو تعدٍّ من أحدِ المصلِّين في مقرِّ عملِه؛ يُحاوِلُ حَلَّ المشكلةِ بالطُّرق السِّلميَّةِ، وإلَّا فله أن يقومَ بإبلاغ المخفر والإدارة.**\n16. **يقوم الإمام بإثبات حضوره بالطَّريقة التي تحدِّدها الوزارة.**\n17. **يُدَوِّنُ في البطاقة الشَّهريَّة نشاطاته ودروسه بعد الانتهاء منها.**\n18. **لا يسمح لأحدٍ بإلقاء دروس أو خواطر في المسجد إلَّا بتصريح من الإدارة.**\n19. **يتعاملُ الإمام مع المؤسَّسات الخيريَّة والاجتماعيَّة الزَّائرة للمسجد بهدف جمع التَّبرُّعات في ضوء القرارات والتَّعميمات التي تصدرها الوزارة، ولا يَسمح لأحدٍ بجمع التَّبرُّعات في المسجد إلَّا بتصريحٍ من الوزارة.**\n20. **لا يسمح لأحدٍ بإدخال مصاحفَ، أو كتبٍ، أو منشورات أو بوسترات، أو موادَّ سمعية أو بصرية إلى المسجد إلَّا بتصريح من الإدارة، ويجب إخراج كلِّ ما لم يؤذَن به.**\n21. **يُتابعُ الإمامُ المنشوراتِ المعلنةَ في لوحة المسجد، ويَعتني بتحديثِها.**\n22. يتابعُ الإمامُ التَّعميماتِ والقرارات المتعلِّقة بالمساجدِ والعاملين فيها بمختلفِ وسائل التَّواصل الحديثة.\n23. **التَّقَيُّد بالوقت المحدَّدِ لخطبة الجمعةِ وصلاتِها. أمَّا الأعياد والاستسقاءُ والخسوف والكسوفُ؛ فيلتزِمُ بما يعمِّمُه قطاعُ المساجد في حينه.**\n\n### 3- الواجبات المناطة بالخطيب خاصَّةً\n\n**أوَّلًا: واجبات متعلِّقة بمحتوى خطبة الجمعة** (إن لم يلتزم بخطبة الوزارة):\n1. **يجب أن يكون محتوى الخطبة موافقًا لمنهج أهل السُّنَّة والجماعة في الاعتقاد، والعمل، والسُّلوك، وغيرها.**\n2. **يجب أن تكون الخطبة تامَّة الأركان؛ من المقدِّمة، وعرض الموضوع، والخاتمة.**\n3. ينبغي أن تكون الخطبة واضحة الأهداف، محدَّدة الموضوع، مترابطة الأفكار، جيِّدة العرض، حسنة السَّبك، بعيدة عن العشوائيَّة.\n4. ينبغي أن يكون المحتوى شاملًا لعناصر الموضوع الأساسيَّة، مع استيفاء الكلام عليها بما يتناسب مع الوقت المتاح للخطبة.\n5. **يجب تقديم الخطبة باللُّغة العربيَّة الفصيحة، مع الحرص على الأسلوب البليغ قدر الإمكان، ويُتجاوز عن استعمال بعض الألفاظ العامِّيَّة أحيانًا، إذا اقتضى البيانُ أو المقامُ ذلك.**\n6. ينبغي أن يحرص على التَّنوُّعِ في موضوعات خُطَبِه، مع التَّركيز على الموضوعات التي تمسُّ حاجة النَّاس إليها في العقيدة، والعبادات، والمعاملات، والأحوال الشَّخصيَّة.\n7. ينبغي أن يحرص على تطعيم خطبته بالشَّواهد من آثار السَّلف الصَّالحين، وقصص الماضين، وحكايات المعاصرين، مع مراعاة ثبوتها وواقعيَّتها.\n\n**ثانيًا: واجبات متعلِّقة بأداء خطبة الجمعة:**\n1. **يجب الالتزام بالوقت المحدَّد للشُّروع في الخطبة، والوقت المسموح به لإلقائها، في ضوء ما تنصُّ عليه اللَّوائح والتَّنظيمات الخاصَّة بذلك.**\n2. **يجب الالتزام بالتَّوجيهات العارضة للوزارة فيما يتعلَّق بالخطبة؛ سواء من حيث تعيين الخطبة، أو تحديد موضوعها، أو الحثُّ على دعاء معيَّن فيها.**\n3. **يجب الابتعاد عن التَّعرُّضِ في الخطبة للأشخاص أو المؤسَّسات أو الدُّول؛ تصريحًا أو تلميحًا.**\n4. **لا يمنع الخطيب من الكلام على ما تعيشه الأمَّة من أحداث، ويمرُّ بها من نوازل، بشرط أن يكون تناول ذلك بوسطيَّة واعتدال، بعيدًا عن الإثارة والتَّهييج.**\n5. **إذا كُلِّفَ بخطبةٍ مذاعة: فعليه الالتزامُ بخطبة الوزارة.**\n\n### 4- الواجبات المناطة بالمؤذِّن خاصَّةً\n1. **رفعُ الأذان عند دخول وقت الصَّلاة حسب مواقيتها بدولة الكويت، وعدمُ التَّأخير في ذلك، وعدمُ السَّماح لأيِّ شخصٍ بالقيام بذلك.**\n2. **الإقامة للصَّلوات الخمس في وقتها حسب ما حدَّدته الوزارة للفترة الزَّمنيَّة بين الأذان والإقامة، أو بما جرى عليه الاتِّفاقُ مع روَّاد المسجد الدَّائمين.**\n3. **القيام بمهامِّ الإمام أو الخطيب عند غيابه، إذا لم تكلِّف الجهات المختصَّة إمامًا أو خطيبًا آخر يقوم مقامه.**\n4. **الإشراف على خطبة الجمعة؛ بتهيئةِ المكبِّرات، والقيام بتسجيل الخطبة، وتسليم المادَّة المسجَّلة إلى مَن يقوم بتوصيلها إلى الإدارة.**\n5. تنظيمُ مكتبة المسجد السَّمعيَّة والبصريَّة، وفهرستها، وتيسير الاستفادة منها لروَّاد المسجد.\n6. التَّأكُّدُ من اكتمال مرافق المسجد، وتبليغ الإمام بأيَّة ملحوظات تتعلَّق بهذا الجانب.\n7. **المؤذِّن يخضع لإشراف إمام المسجد إداريًّا**، وينبغي أن ينسِّق مع الإمام في كلِّ ما يتعلَّق بشؤون العمل في المسجد، وخاصَّة مسائل الغياب، والاستئذان، والسَّفر، والإجازة، والرَّاحة الأسبوعيَّة.\n8. **يقوم المؤذِّن بإثبات حضوره بالطَّريقة التي تحدِّدها الوزارة.**\n9. **المؤذِّن نائبٌ عن الإمام عند غيابه، فيتقدَّم إلى الإمامة، ولا يتركُها لغيره.**\n10. **إذا كُلِّفَ المؤذِّن بخطبة الجمعة: فيَلزمُه أن يتقيَّدَ بخطبة الوزارة.**\n11. **يعتبر المؤذِّن المسؤولَ الثَّاني عن المسجد، وعليه التَّعاون مع الإمام في تنفيذ التَّعليمات، والمحافظة على المسجد.**\n12. **التَّأكُّدُ من فتح أبواب المسجد قبل دخول وقت الصَّلاة بزمنٍ كافٍ.**\n\n## ثالثًا: الواجبات المناطة بالإمام والخطيب والمؤذِّن في ظلِّ مفهوم الوسطيَّة الإسلاميَّة ووسائل الخطاب الدِّينيِّ\n\n- ميزانُ الوسطيَّة: كتاب الله تعالى، وسنَّة نبيِّنا محمَّدٍ ﷺ، بفهم الصَّحابة والأئمَّة المعتبرين، من غير إفراطٍ ولا تفريط، ومن غير غلوٍّ ولا جفاء.\n\n1. **يجب أن يكون منهجُهم في الدَّعوة إلى الله تعالى منهجَ النَّبيِّ ﷺ**، داعين إلى الله بعلم وهدى، متحرِّين الدَّليل الصَّحيح بفهم الصَّحابة والتَّابعين والأئمَّة المعتبرين، مبتعدين عن التَّعصُّب للأشخاص، وتسفيه الآراء، ملتزمين بالحكمة والموعظة الحسنة.\n2. أن يعلموا أنَّ هداية النَّاس -هداية التَّوفيق- بيد الله وحده، وإنَّما الواجب عليهم هداية الدِّلالة والبلاغ.\n3. معرفة أحوال النَّاس عند دعوتهم، ومخاطبتهم بما يناسب أحوالَهم، مع مراعاة الزَّمان والمكان، والمصالح والمفاسد، ومقاصد الشَّريعة.\n4. العناية بترسيخ مفاهيم الوسطيَّة الإسلاميَّة الصَّحيحة، وغرس قيم الوسطيَّة والاعتدال، مع معرفة مفهوم التَّعايش الصَّحيح.\n5. **السَّعيُ في معالجة ظواهر الغلوِّ والتَّطرُّف قبل ظهورها وبعده**، وذلك بالنَّظر في أسبابها ومؤثِّراتها وكيفيَّة إزالتها.\n6. **عدم الخوض في مسائل التَّكفير والتَّفسيق والتَّبديع والتَّجريح المتعلِّقة بالأعيان، والمسائل المتعلِّقة بدماء المسلمين، وإحالة ذلك إلى الجهات المختصَّة والعلماء الموثوقين.**\n7. **الحثُّ على الاجتماع، والوحدة على الخير، وعدم التفرُّق والاختلاف، والدَّعوة للسَّمع والطَّاعة لوليِّ الأمر المسلم في بلده بالمعروف.**\n8. **الدَّعوةُ إلى نبذِ العنف، والتَّعدِّي على الآخرين، وسلبِ حقوقهم، وظلمهم، وضبطِ العواطف بالنَّصِّ الصَّحيح، والعقل الصَّريح.**\n9. الحفاظ على الهُويَّة الإسلاميَّة للأمَّة، وهي هُويَّة الأمَّة الوسط.\n10. **احترام المذاهب الفقهيَّة الإسلاميَّة المعتبرة، والتَّعامل معها بمنهج وسطيٍّ من غير تعصُّبٍ ولا ازدراءٍ، وتوقير أهل العلم الموثوقين.**\n11. التَّعامل الصَّحيح مع المخالف؛ بأن يكون مبنيًّا على العدل والصِّدق والإنصاف، لا على ا <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- تحويل Markdown مبسّط ----------
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/★/g,'<mark>★</mark>');
}
function mdToHtml(src){
  const lines = src.split('\n'); let out=[], i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^---+$/.test(l.trim())){i++;continue;}
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue;}
    if(l.trim().startsWith('|')){
      let rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++;}
      rows=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
      let h='<div class="tbl"><table>';
      rows.forEach((r,ri)=>{const cells=r.slice(1,-1).split('|');const tag=ri===0?'th':'td';h+='<tr>'+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});
      out.push(h+'</table></div>');continue;
    }
    if(/^\s*[-•]\s+/.test(l)){
      let h='<ul>'; while(i<lines.length && /^\s*[-•]\s+/.test(lines[i])){
        let item=lines[i].replace(/^\s*[-•]\s+/,''); i++;
        let sub='';
        while(i<lines.length && /^\s{2,}[-•]\s+/.test(lines[i])){sub+=`<li>${inline(lines[i].replace(/^\s*[-•]\s+/,''))}</li>`;i++;}
        h+=`<li>${inline(item)}${sub?`<ul>${sub}</ul>`:''}</li>`;
      } out.push(h+'</ul>');continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      let h='<ol>'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`;i++;} out.push(h+'</ol>');continue;
    }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#|\||\s*[-•]\s|\s*\d+[.)]\s|---)/.test(lines[i])){p.push(lines[i]);i++;}
    if(p.length) out.push(`<p>${inline(p.join(' '))}</p>`); else i++;
  }
  return out.join('\n');
}

// ---------- تخزين محلي للتقدم (اختياري) ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

// ---------- الصفحات ----------
function daysLeft(iso){const d=new Date(iso+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}

function home(){
  crumbs.innerHTML='';
  app.innerHTML=`<section class="hero">
    <h1>اختر المسار الذي تتقدم له</h1>
    <p>ملخصات المقررات المعتمدة، وبنك أسئلة من نماذج الاختبارات السابقة، مرتبة حسب وزن الدرجات. الاختبار التحريري في ${fmtDate(DATA.tracks.imam.exam_date)}.</p>
    <div class="choices">
      ${Object.entries(DATA.tracks).map(([id,t])=>`<a class="choice" href="#/${id}"><span class="k">${esc(t.name)}</span><span class="d">${t.marks_pending?'توزيع الدرجات يُحدَّث عند وصول المقرر':Object.keys(t.marks).length+' مواد، مجموع '+Object.values(t.marks).reduce((a,b)=>a+(b||0),0)+' درجة'}</span><span class="go">ابدأ المذاكرة</span></a>`).join('')}
    </div></section>`;
}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'});}

function track(tid){
  const t=DATA.tracks[tid]; if(!t) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <span>${esc(t.name)}</span>`;
  const left=daysLeft(t.exam_date);
  const total=Object.values(t.marks).reduce((a,b)=>a+(b||0),0);
  const done=store.get('done',{});
  app.innerHTML=`<section class="hero"><h1>مسار ${esc(t.name)}</h1><p>${esc(t.oral)}.</p></section>
  <div class="stack">
    <div class="card count"><span class="n">${left>=0?left:0}</span><span class="l">${left>=0?'يوماً على الاختبار التحريري':'انتهى موعد الاختبار'} (${fmtDate(t.exam_date)}) · درجة النجاح <b>${t.pass||70}</b> من 100</span></div>
    ${t.marks_pending?`<div class="card"><span class="pill gold">تنبيه</span> توزيع درجات هذا المسار لم يصل بعد. المواد أدناه حسب نموذج اختبار المؤذنين السابق، والمحتوى مشترك مع مسار الإمام لأن المقرر واحد.</div>`:''}
    <a class="card exam-cta" href="#/${tid}/exam" style="text-decoration:none;color:inherit"><h2>الاختبار الفعلي</h2><span>${examCount(t)} سؤال اختيار من متعدد، تُسحب عشوائياً من بنك ${mcqTotal(t)} سؤال، بتوزيع الدرجات الحقيقي، والنتيجة من 100.${store.get('best:'+tid,null)!=null?' أفضل نتيجة لك: <b>'+store.get('best:'+tid)+'</b>':''}</span><span class="go" style="display:inline-block;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;justify-self:start">ابدأ الاختبار</span></a>
    <a class="card paper-cta" href="#/${tid}/paper" style="text-decoration:none;color:inherit"><h2>ورقة اختبار كاملة (نظام الوزارة)</h2><span>ورقة مطابقة لنماذج الاختبارات السابقة: مجالات مرتبة، واختيار من متعدد، وصح وخطأ، وأكمل، وأسئلة مقالية. تُصحح آلياً مع تقييم ذاتي للمقالي، والنتيجة من 100.${store.get('bestPaper:'+tid,null)!=null?' أفضل نتيجة: <b>'+store.get('bestPaper:'+tid)+'</b>':''}</span><span class="go" style="display:inline-block;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;justify-self:start">ابدأ الورقة</span></a>
    <h2>المواد حسب وزن الدرجات</h2>
    <div class="subjects">
      ${Object.entries(t.marks).map(([sid,m])=>{const s=DATA.subjects[sid];const d=done[sid]||{};const known=Object.values(d).filter(x=>x==='y').length;return `<a class="subj" href="#/${tid}/${sid}">
        <span class="nm">${esc(s.name)}</span>
        <span class="mk"><b>${m==null?'؟':m}</b><span>${m==null?'درجة':'درجة'}</span></span>
        <span class="src">${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''} · ${s.questions.length||poolMcq(t,sid).length} سؤال${known?` · أتقنت ${known}`:''}</span>
        ${m!=null?`<span class="bar"><i style="width:${Math.round(100*m/total)}%"></i></span>`:''}
      </a>`;}).join('')}
    </div>
    <div class="card"><h2>الخطة وتحليل الاختبارات السابقة</h2><div class="notes">${mdToHtml(DATA.plan)}</div></div>
  </div>`;
}

function subject(tid,sid,mode){
  const t=DATA.tracks[tid], s=DATA.subjects[sid]; if(!t||!s) return home();
  mode = mode||store.get('mode:'+sid,'notes');
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>${esc(s.name)}</span>`;
  const m=t.marks[sid];
  app.innerHTML=`<section class="hero"><h1>${esc(s.name)} <span class="pill gold">${m==null?'الدرجة غير محددة':m+' درجة'}</span></h1><p>${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''}</p></section>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-selected="${mode==='notes'}" data-mode="notes">الملخص</button>
    <button role="tab" id="tab-quiz" aria-selected="${mode==='quiz'}" data-mode="quiz">اختبر نفسك (${s.questions.length||(s.mcq||[]).length})</button>
  </div>
  <div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{store.set('mode:'+sid,b.dataset.mode);subject(tid,sid,b.dataset.mode);});
  const pane=document.getElementById('pane');
  if(mode==='notes'){pane.innerHTML=`<div class="card notes">${mdToHtml(s.notes)}</div>`;}
  else quiz(pane,sid,s,t);
}

function quiz(pane,sid,s,tr){
  // عند عدم وجود أسئلة مقالية لهذه المادة، تُستخدم أسئلة الاختيار كبطاقات مراجعة
  const qs=(s.questions&&s.questions.length)?s.questions:poolMcq(tr,sid).map(q=>({q:q.q,a:q.o[q.c]})); if(!qs.length){pane.innerHTML='<div class="empty">لا توجد أسئلة لهذه المادة بعد.</div>';return;}
  const done=store.get('done',{}); done[sid]=done[sid]||{};
  let order=qs.map((_,i)=>i); let idx=store.get('idx:'+sid,0)%qs.length; let shown=false;
  function render(){
    const q=qs[order[idx]]; const st=done[sid];
    const known=Object.values(st).filter(x=>x==='y').length, weak=Object.values(st).filter(x=>x==='n').length;
    pane.innerHTML=`<div class="quiz">
      <div class="prog"><span>السؤال <b>${idx+1}</b> من <b>${qs.length}</b></span><span>أتقنت <b>${known}</b></span><span>تحتاج مراجعة <b>${weak}</b></span></div>
      <div class="qcard"><div class="qn">${esc(s.name)} · ${st[order[idx]]==='y'?'<span class="pill">متقن</span>':st[order[idx]]==='n'?'<span class="pill gold">للمراجعة</span>':''}</div>
        <div class="qt">${esc(q.q)}</div>
        ${shown?`<div class="ans">${esc(q.a)}</div>`:''}
        <div class="row" style="margin-top:14px">
          ${shown?`<button class="btn ok" id="y">أعرفها</button><button class="btn no" id="n">أحتاج مراجعة</button>`:`<button class="btn primary" id="show">أظهر الإجابة</button>`}
          <button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button>
        </div></div>
      <div class="row"><button class="btn" id="weakOnly">مراجعة ما أحتاجه فقط</button><button class="btn" id="all">كل الأسئلة</button><button class="btn" id="reset">تصفير التقدم</button></div>
    </div>`;
    const go=d=>{idx=(idx+d+order.length)%order.length;shown=false;store.set('idx:'+sid,idx);render();};
    pane.querySelector('#next').onclick=()=>go(1); pane.querySelector('#prev').onclick=()=>go(-1);
    const sh=pane.querySelector('#show'); if(sh) sh.onclick=()=>{shown=true;render();};
    const y=pane.querySelector('#y'); if(y) y.onclick=()=>{st[order[idx]]='y';store.set('done',done);go(1);};
    const n=pane.querySelector('#n'); if(n) n.onclick=()=>{st[order[idx]]='n';store.set('done',done);go(1);};
    pane.querySelector('#weakOnly').onclick=()=>{const w=qs.map((_,i)=>i).filter(i=>st[i]!=='y');if(w.length){order=w;idx=0;shown=false;render();}};
    pane.querySelector('#all').onclick=()=>{order=qs.map((_,i)=>i);idx=0;shown=false;render();};
    pane.querySelector('#reset').onclick=()=>{done[sid]={};store.set('done',done);order=qs.map((_,i)=>i);idx=0;shown=false;render();};
  }
  render();
}


function examCount(t){return Object.values(t.exam||{}).reduce((a,b)=>a+b,0);}
function mcqTotal(t){return Object.keys(t.exam||{}).reduce((a,s)=>a+poolMcq(t,s).length,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildExam(t){
  const qs=[];
  for(const [sid,n] of Object.entries(t.exam||{})){
    const pool=shuffle(poolMcq(t,sid)).slice(0,n);
    pool.forEach(q=>{const idx=shuffle(q.o.map((_,i)=>i));qs.push({s:sid,q:q.q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c),pick:-1});});
  }
  return shuffle(qs);
}
function exam(tid){
  const t=DATA.tracks[tid]; if(!t||!t.exam) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>الاختبار الفعلي</span>`;
  const qs=buildExam(t); let i=0; const start=Date.now(); const limit=examCount(t)*75*1000; let tick=null;
  function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`;}
  function render(){
    const q=qs[i]; const answered=qs.filter(x=>x.pick>=0).length;
    app.innerHTML=`<section class="hero" style="padding-block:20px 10px"><h1>الاختبار الفعلي</h1></section>
    <div class="stack">
      <div class="prog"><span>السؤال <b>${i+1}</b> من <b>${qs.length}</b></span><span>أجبت <b>${answered}</b></span><span class="timer" id="timer">المتبقي ${fmt(limit-(Date.now()-start))}</span></div>
      <div class="pbar"><i style="width:${Math.round(100*answered/qs.length)}%"></i></div>
      <div class="qcard"><div class="qn">${esc(DATA.subjects[q.s].name)}</div><div class="qt">${esc(q.q)}</div>
        <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${q.pick===k}">${esc(o)}</button>`).join('')}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="prev" ${i===0?'disabled':''}>السابق</button>
          ${i<qs.length-1?`<button class="btn primary" id="next">التالي</button>`:''}
          <button class="btn ${i===qs.length-1?'primary':''}" id="finish">${answered===qs.length?'إنهاء وعرض النتيجة':`بقي ${qs.length-answered} بلا إجابة`}</button>
        </div></div></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.pick=+b.dataset.k;if(i<qs.length-1){i++;render();}else render();});
    const n=app.querySelector('#next'); if(n) n.onclick=()=>{i++;render();};
    app.querySelector('#prev').onclick=()=>{if(i>0){i--;render();}};
    app.querySelector('#finish').onclick=()=>{const un=qs.map((x,k)=>[x,k]).filter(([x])=>x.pick<0); if(un.length){ i=un[0][1]; shown=false; render(); const el=document.querySelector('.qcard'); if(el){el.style.borderColor='var(--danger)'; setTimeout(()=>{el.style.borderColor='';},1600);} return;} finish();};
    clearInterval(tick); tick=setInterval(()=>{const el=document.getElementById('timer'); if(!el){clearInterval(tick);return;} const r=limit-(Date.now()-start); el.textContent='المتبقي '+fmt(r); if(r<=0){clearInterval(tick);finish();}},1000);
  }
  function finish(){
    clearInterval(tick);
    const per={}; qs.forEach(q=>{per[q.s]=per[q.s]||{n:0,ok:0};per[q.s].n++;if(q.pick===q.c)per[q.s].ok++;});
    let total=0, max=0; const rows=Object.entries(per).map(([s,r])=>{const w=t.marks_pending?100/Object.keys(per).length:(t.marks[s]||0);const got=w*r.ok/r.n;total+=got;max+=w;return {s,r,w,got};});
    const pct=Math.round(100*total/max); const best=store.get('best:'+tid,null); if(best==null||pct>best) store.set('best:'+tid,pct);
    const wrong=qs.filter(q=>q.pick!==q.c);
    app.innerHTML=`<section class="hero" style="padding-block:20px 10px"><h1>النتيجة</h1></section>
    <div class="stack">
      <div class="card"><div class="score">${pct}<small> من 100</small></div><div style="margin:6px 0"><span class="badge ${pct>=(t.pass||70)?'ok':'no'}">${pct>=(t.pass||70)?'ناجح':'راسب'} · درجة النجاح ${t.pass||70}</span></div><div style="color:var(--muted)">${pct>=90?'ممتاز، هذا مستوى التفوق.':pct>=(t.pass||70)?'اجتزت النجاح، وراجع الأخطاء لترفع درجتك.':'تحتاج مراجعة مركزة، ابدأ بالمواد الأقل نتيجة.'} الوقت: ${fmt(Date.now()-start)}</div></div>
      <div class="card notes"><div class="tbl"><table><tr><th>المادة</th><th>صحيح</th><th>من</th><th>الدرجة</th></tr>${rows.sort((a,b)=>b.w-a.w).map(x=>`<tr><td>${esc(DATA.subjects[x.s].name)}</td><td>${x.r.ok}</td><td>${x.r.n}</td><td>${x.got.toFixed(1)} / ${x.w.toFixed(0)}</td></tr>`).join('')}</table></div></div>
      <div class="row"><button class="btn primary" id="again">اختبار جديد بأسئلة أخرى</button><a class="btn" href="#/${tid}">العودة للمواد</a></div>
      <h2>مراجعة الأخطاء (${wrong.length})</h2>
      ${wrong.length?wrong.map(q=>`<div class="qcard"><div class="qn">${esc(DATA.subjects[q.s].name)}</div><div class="qt" style="font-size:1.1rem">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.c?'right':(k===q.pick?'wrong':'')}">${esc(o)}${k===q.c?' ✓':(k===q.pick?' ✗':'')}</div>`).join('')}</div></div>`).join(''):'<div class="empty">لا أخطاء. أحسنت.</div>'}
    </div>`;
    app.querySelector('#again').onclick=()=>exam(tid);
    window.scrollTo(0,0);
  }
  render();
}


// ====== ورقة اختبار كاملة على نظام الاختبارات السابقة ======
const SECT_ORDER=['tafsir','tajweed','hadith','aqeedah','fiqh','nahw','mithaq'];
function pick(arr,n){return shuffle([...arr]).slice(0,n);}
// تصفية أسئلة المادة على نطاق المقرر لهذا المسار
function inScope(t,sid,q){
  if(!q||!q.sc||q.sc==='core') return true;
  const sc=t.scope||['ibadat','muamalat'];
  return sc.includes(q.sc);
}
function poolMcq(t,sid){return (DATA.subjects[sid]?.mcq||[]).filter(q=>inScope(t,sid,q));}
function buildPaper(t){
  const secs=[];
  const order=SECT_ORDER.filter(s=>t.paper&&t.paper[s]&&Object.values(t.paper[s]).some(v=>v>0));
  order.forEach(sid=>{
    const conf=t.paper[sid], sub=DATA.subjects[sid], items=[];
    pick(poolMcq(t,sid),conf.mcq||0).forEach(q=>{const idx=shuffle(q.o.map((_,i)=>i));items.push({k:'mcq',q:q.q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c),pick:-1});});
    pick(sub.tf||[],conf.tf||0).forEach(q=>items.push({k:'tf',q:q.q,t:q.t,pick:null}));
    pick(sub.fill||[],conf.fill||0).forEach(q=>items.push({k:'fill',q:q.q,a:q.a,val:'',self:null}));
    pick(sub.questions||[],conf.written||0).forEach(q=>items.push({k:'written',q:q.q,a:q.a,val:'',self:null}));
    if(items.length) secs.push({sid,name:sub.name,items});
  });
  // توزيع الدرجات: درجة المادة تُقسم على عدد أسئلتها
  secs.forEach(sc=>{const w=t.marks_pending?(100/secs.length):(t.marks[sc.sid]||0);sc.w=w;sc.per=w/sc.items.length;});
  return secs;
}
function isAnswered(it){
  if(it.k==='mcq') return it.pick>=0;
  if(it.k==='tf') return it.pick!==null && it.pick!==undefined;
  return (it.val||'').trim().length>0;
}
function paper(tid){
  const t=DATA.tracks[tid]; if(!t||!t.paper) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>ورقة اختبار</span>`;
  const secs=buildPaper(tid&&t); const start=Date.now(); const total=secs.reduce((a,s)=>a+s.items.length,0);
  const limit=total*120*1000; let tick=null; let graded=false;
  const AR=['أ','ب','ج','د'];
  function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,'0')}`;}
  function scoreNow(){
    let got=0,max=0;
    secs.forEach(sc=>{sc.items.forEach(it=>{max+=sc.per;
      if(it.k==='mcq'&&it.pick===it.c)got+=sc.per;
      else if(it.k==='tf'&&it.pick===it.t)got+=sc.per;
      else if((it.k==='fill'||it.k==='written')&&it.self===1)got+=sc.per;
      else if((it.k==='fill'||it.k==='written')&&it.self===0.5)got+=sc.per/2;
    });});
    return {got,max,pct:Math.round(100*got/max)};
  }
  function render(){
    let n=0;
    const html=secs.map((sc,si)=>{
      const kinds=[['mcq','اختر الإجابة الصحيحة'],['tf','ضع صح أو خطأ'],['fill','أكمل الفراغ'],['written','أجب عما يلي']];
      const inner=kinds.map(([k,label])=>{
        const its=sc.items.filter(x=>x.k===k); if(!its.length)return '';
        return `<div class="hint" style="margin-top:14px">${label}:</div>`+its.map(it=>{
          n++; const gi=secs.flatMap(s=>s.items).indexOf(it);
          const mk=`<span class="mk2">(${sc.per.toFixed(2)} درجة)</span>`;
          let body='';
          if(k==='mcq'){
            body=`<div class="opts">${it.o.map((o,j)=>`<button class="opt ${graded?(j===it.c?'right':(j===it.pick?'wrong':'')):''}" data-gi="${gi}" data-k="${j}" aria-pressed="${it.pick===j}" ${graded?'disabled':''}>${AR[j]}) ${esc(o)}${graded&&j===it.c?' ✓':''}</button>`).join('')}</div>`;
          } else if(k==='tf'){
            body=`<div class="tfrow"><button class="btn ${it.pick===true?'ok':''} ${graded&&it.t===true?'ok':''}" data-gi="${gi}" data-tf="1" ${graded?'disabled':''}>صح</button><button class="btn ${it.pick===false?'no':''} ${graded&&it.t===false?'ok':''}" data-gi="${gi}" data-tf="0" ${graded?'disabled':''}>خطأ</button>${graded?`<span class="badge ${it.pick===it.t?'ok':'no'}">${it.pick===it.t?'صحيحة':'الصواب: '+(it.t?'صح':'خطأ')}</span>`:''}</div>`;
          } else if(k==='fill'){
            body=`<input class="wline" id="in${gi}" value="${esc(it.val)}" placeholder="اكتب الإجابة" data-gi="${gi}" ${graded?'disabled':''}>`;
          } else {
            body=`<textarea class="warea" id="in${gi}" placeholder="اكتب إجابتك" data-gi="${gi}" ${graded?'disabled':''}>${esc(it.val)}</textarea>`;
          }
          const model=(graded&&(k==='fill'||k==='written'))?`<div class="model"><b>الإجابة النموذجية:</b> ${esc(it.a)}</div>
            <div class="selfmark"><span>قيّم إجابتك:</span>
              <button class="btn ok" data-self="1" data-gi="${gi}">صحيحة</button>
              <button class="btn" data-self="0.5" data-gi="${gi}">ناقصة</button>
              <button class="btn no" data-self="0" data-gi="${gi}">خاطئة</button>
              ${it.self!=null?`<span class="badge ${it.self?'ok':'no'}">${it.self===1?'أخذت الدرجة':it.self===0.5?'نصف درجة':'بلا درجة'}</span>`:''}</div>`:'';
          return `<div class="qbox" id="q${gi}"><div class="qh"><span class="qno">س${n}</span><span class="qtx">${esc(it.q)}</span>${mk}</div>${body}${model}</div>`;
        }).join('');
      }).join('');
      return `<section class="sect"><h2>المجال ${['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع'][si]}: ${esc(sc.name)} <span class="mk2">(${sc.w.toFixed(0)} درجة)</span></h2>${inner}</section>`;
    }).join('');
    const sc=graded?scoreNow():null;
    app.innerHTML=`<section class="hero" style="padding-block:18px 8px"><h1>ورقة اختبار ${esc(t.name)}</h1>
      <p>الزمن ${Math.round(limit/60000)} دقيقة. أجب عن جميع الأسئلة. الأسئلة المقالية تُقيَّم ذاتياً بعد ظهور الإجابة النموذجية.</p></section>
      ${graded?`<div class="card" style="text-align:center"><div class="score">${sc.pct}<small> من 100</small></div><div style="margin:6px 0"><span class="badge ${sc.pct>=(t.pass||70)?'ok':'no'}">${sc.pct>=(t.pass||70)?'ناجح':'راسب'} · درجة النجاح ${t.pass||70}</span></div><div style="color:var(--muted)">${sc.got.toFixed(1)} من ${sc.max.toFixed(0)} · الزمن المستغرق ${fmt(Date.now()-start)}</div></div>`:`<div class="sticky-sub"><div class="prog"><span>عدد الأسئلة <b>${total}</b></span><span>أجبت <b>${secs.flatMap(s=>s.items).filter(isAnswered).length}</b></span><span>بقي <b>${total-secs.flatMap(s=>s.items).filter(isAnswered).length}</b></span><span class="timer" id="timer">المتبقي ${fmt(limit-(Date.now()-start))}</span></div><div class="pbar" style="margin-top:6px"><i style="width:${Math.round(100*secs.flatMap(s=>s.items).filter(isAnswered).length/total)}%"></i></div></div>`}
      ${html}
      <div class="row" style="margin-top:20px">${graded?`<button class="btn primary" id="again">ورقة جديدة بأسئلة أخرى</button><a class="btn" href="#/${tid}">العودة للمواد</a>`:`<button class="btn primary" id="submit" ${secs.flatMap(s=>s.items).every(isAnswered)?'':'disabled style="opacity:.5;cursor:not-allowed"'}>تسليم الورقة وعرض النتيجة</button>${secs.flatMap(s=>s.items).every(isAnswered)?'':`<button class="btn" id="goNext">اذهب إلى أول سؤال بلا إجابة</button>`}`}</div>${graded?'':`<p class="hint" style="margin-top:8px">${secs.flatMap(s=>s.items).every(isAnswered)?'أجبت عن جميع الأسئلة، يمكنك التسليم.':'لا يمكن التسليم قبل الإجابة عن جميع الأسئلة. وإذا انتهى الوقت تُسلَّم الورقة تلقائياً بما أجبت.'}</p>`}`;
    const all=secs.flatMap(s=>s.items);
    app.querySelectorAll('.opt[data-gi]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].pick=+b.dataset.k;render();});
    app.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].pick=b.dataset.tf==='1';render();});
    app.querySelectorAll('[data-gi].wline,[data-gi].warea').forEach(el=>el.oninput=()=>{all[+el.dataset.gi].val=el.value;});
    app.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{all[+b.dataset.gi].self=parseFloat(b.dataset.self);render();});
    const sb=app.querySelector('#submit'); if(sb) sb.onclick=()=>{ if(all.every(isAnswered)) grade(); };
    const gn=app.querySelector('#goNext'); if(gn) gn.onclick=()=>{const k=all.findIndex(x=>!isAnswered(x)); const el=document.getElementById('q'+k); if(el){el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.borderColor='var(--danger)'; setTimeout(()=>{el.style.borderColor='';},1600);} };
    const ag=app.querySelector('#again'); if(ag) ag.onclick=()=>paper(tid);
    if(!graded){clearInterval(tick);tick=setInterval(()=>{const el=document.getElementById('timer');if(!el){clearInterval(tick);return;}const r=limit-(Date.now()-start);el.textContent='المتبقي '+fmt(r);if(r<=0){clearInterval(tick);grade();}},1000);}
  }
  function grade(){
    clearInterval(tick); graded=true;
    // احتساب المقالي مبدئياً: صحيح إذا تطابق جوهر الإجابة، وإلا يترك للتقييم الذاتي
    secs.forEach(sc=>sc.items.forEach(it=>{
      if((it.k==='fill'||it.k==='written')&&it.self==null){
        const v=(it.val||'').replace(/[ً-ْ\s.،,]/g,'');
        const a=(it.a||'').replace(/[ً-ْ\s.،,]/g,'');
        if(v&&a&&(a.includes(v)||v.includes(a))) it.self=1;
      }
    }));
    render(); window.scrollTo(0,0);
    const s=scoreNow(); const b=store.get('bestPaper:'+tid,null); if(b==null||s.pct>b) store.set('bestPaper:'+tid,s.pct);
  }
  render();
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length) return home();
  if(h.length===1) return track(h[0]);
  if(h[1]==='exam') return exam(h[0]);
  if(h[1]==='paper') return paper(h[0]);
  return subject(h[0],h[1]);
}
window.addEventListener('hashchange',route); route();
</script>
