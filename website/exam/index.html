مور، إن الله طيب، من أحدث في أمرنا، لا يؤمن أحدكم حتى يكون هواه، يا ابن آدم.\n- العقيدة: شروط لا إله إلا الله، أنواع التوحيد، طريقة أهل السنة في الصفات، خصائص النبي ﷺ، أقسام الكفر، شروط تكفير المعين وموانعه، الاستثناء في الإيمان، الروح والنفس، أشراط الساعة، الإيمان باليوم الآخر، عبادة الله بالحب/الرجاء/الخوف فقط.\n- التفسير: معاني كلمات (الرادفة، الراجفة، كنود، العهن، مبثوث، وقب، كبد، مرقوم، جيدها)، أسباب النزول (عبس، المطففين، الضحى، الكوثر، الإخلاص)، من المراد بـ(الأتقى).\n- التجويد: الإقلاب، الإدغام، الإظهار والإخفاء الشفوي، المد المتصل والمنفصل واللازم، القلقلة ومراتبها، حروف الصفير، تشديدات الفاتحة، آداب التلاوة.\n- النحو: المخفوضات، المبني للمجهول، أنواع الجمل.\n\n## جدول 14 يوماً (ساعتان إلى ثلاث يومياً)\n\n| اليوم | العمل |\n|---|---|\n| 1 | الفقه: الطهارة كاملة (ماء، استنجاء، وضوء، خفين، نواقض، غسل، تيمم، حيض) |\n| 2 | الفقه: الأذان، شروط الصلاة، أركانها، واجباتها، مبطلاتها، السهو، أوقات النهي |\n| 3 | الفقه: الجمع، الجمعة، الجنائز + مراجعة يومي 1-2 |\n| 4 | الفقه: الزكاة كاملة بالأرقام + الصيام + الاعتكاف |\n| 5 | الفقه: الحج كاملاً (شروط، أنساك، محظورات، فدية، أركان، واجبات، طواف، سعي) |\n| 6 | الفقه: المعاملات (بيع، شروط، خيار، ربا، نكاح، عدة، رضاع، نفقات، أطعمة، صيد، أيمان، نذر) |\n| 7 | اختبار ذاتي في الفقه كاملاً من بنك الأسئلة |\n| 8 | الحديث: الأربعون النووية 1-20 |\n| 9 | الحديث: 21-42 + معاني الألفاظ |\n| 10 | العقيدة: كل ملخص بريق الجمان |\n| 11 | النحو: مراجعة + التفسير جزء عم (النبأ – الفجر) |\n| 12 | التفسير (البلد – الناس) + التجويد كاملاً |\n| 13 | ميثاق المسجد + اختبار شامل من بنك الأسئلة |\n| 14 | مراجعة الأخطاء فقط + تلاوة للشفوي |\n\n**القرآن للشفوي**: كل يوم 20 دقيقة تلاوة مجوّدة بصوت مسموع لجزء عم وما تحفظه من السور الطوال، مع الوقف والابتداء الصحيح.\n", "tracks": {"imam": {"name": "إمام مسجد", "exam_date": "2026-10-06", "oral": "القرآن الكريم: مقابلة شفوية بعد الاختبار التحريري", "marks": {"fiqh": 60, "hadith": 10, "aqeedah": 10, "nahw": 10, "tafsir": 4, "tajweed": 4, "mithaq": 2}, "notes": {"fiqh": "40 درجة عبادات + 20 درجة معاملات"}}, "muadhin": {"name": "مؤذن", "exam_date": "2026-10-06", "oral": "القرآن الكريم: مقابلة شفوية بعد الاختبار التحريري", "marks": {"fiqh": null, "hadith": null, "aqeedah": null, "tafsir": null, "tajweed": null}, "marks_pending": true, "notes": {}}}, "subjects": {"fiqh": {"name": "الفقه", "source": "مفيد الصاحب في تلخيص دليل الطالب", "notes": "# الفقه الحنبلي (60 درجة) — مفيد الصاحب في تلخيص دليل الطالب\n\nالمتن: دليل الطالب لنيل المطالب، للشيخ مرعي بن يوسف الكرمي الحنبلي (ت 1033هـ). اختصره: فالح عبدالله ارتيبان. مقرر وزارة الأوقاف الكويتية للأئمة والمؤذنين.\n\n---\n\n## كتاب الطهارة\n\n**تعريف الطهارة**: رفع الحدث وزوال الخبث.\n\n**أقسام الماء ثلاثة**:\n1. الطهور، وهو أربعة أنواع: محرم، مكروه، غير مكروه، وما يرفع حدث الأنثى فقط.\n2. الطاهر.\n3. النجس.\n\n**الاستنجاء**: إزالة ما خرج من السبيلين بماء طهور، أو حجر طاهر مباح مُنقٍ.\n\n**الختان** واجب على الذكر والأنثى عند البلوغ.\n\n### باب الوضوء\n- **واجباته**: التسمية فقط.\n- **فروضه ستة**: غسل الوجه ومنه المضمضة والاستنشاق، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل الرجلين إلى الكعبين، الترتيب، الموالاة.\n- **شروطه ثمانية**: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار.\n\n### باب المسح على الخفين\n**شروطه سبعة**: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما.\n\n**الفرق بين مسح الخف والجبيرة** (سؤال سابق):\n| | الخف | الجبيرة |\n|---|---|---|\n| اشتراط لبسه على طهارة | يشترط | لا يشترط على الصحيح في المذهب |\n| المدة | مؤقت: يوم وليلة للمقيم، ثلاثة أيام للمسافر | غير مؤقت، حتى البرء |\n| محل المسح | أكثر أعلى الخف | جميع الجبيرة |\n| يمسح في | الحدث الأصغر فقط | الحدث الأصغر والأكبر |\n| لا تتجاوز | - | لا تتجاوز قدر الحاجة |\n\n### باب نواقض الوضوء\n**ثمانية**: الخارج من السبيلين، خروج النجاسة من بقية البدن (الدم، القيء)، زوال العقل (نوم، إغماء)، مس الفرج بلا حائل، مباشرة الذكر الأنثى أو العكس لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة عن الإسلام.\n\n### باب ما يوجب الغسل\n- **موجباته سبعة**: انتقال المني، خروجه من مخرجه ولو دماً بلذة ما لم يكن نائماً، تغييب الحشفة كلها بلا حائل في فرج، إسلام الكافر ولو كان مرتداً، خروج الحيض، خروج دم النفاس، الموت.\n- **شروط الغسل سبعة**: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله.\n- **واجبات الغسل**: التسمية فقط.\n- **فرض الغسل**: أن يعم بالماء جميع بدنه، وداخل فمه وأنفه.\n- **سنن الغسل ثمانية**: الوضوء قبله، إزالة ما لوثه من أذى، إفراغ الماء على رأسه ثلاثاً، وعلى بقية جسده ثلاثاً، التيامن، الموالاة، إمرار اليد على الجسد، إعادة غسل رجليه بمكان آخر.\n- **الأغسال المستحبة**: ستة عشر، منها يوم الجمعة.\n\n### باب التيمم\n- **شروطه ثمانية**: النية، الإسلام، العقل، التمييز، الاستنجاء أو الاستجمار، دخول الوقت، تعذر استعمال الماء، أن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد.\n- **واجبه**: التسمية فقط.\n- **فروضه خمسة**: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، الموالاة، تعيين النية.\n- **مبطلاته خمسة**: ما أبطل الوضوء، وجود الماء، خروج الوقت، زوال المبيح له، خلع ما مسح عليه.\n\n### باب الحيض\n- **ما يحرم بالحيض تسعة**: الوطء، الطلاق، الصلاة، الصوم، الطواف، قراءة القرآن، مس المصحف، اللبث في المسجد، وكذا المرور فيه إن خافت تلويثه.\n- **ما يوجبه الحيض ثلاثة**: الغسل، البلوغ، الكفارة بالوطء فيه ولو مكرهاً أو ناسياً أو جاهلاً: يتصدق بدينار أو بنصف دينار.\n\n---\n\n## باب الأذان والإقامة\n- **شروطه ستة**: الإسلام، الذكورية، العقل، التمييز، النطق، العدالة.\n- **أركانه**: رفع الصوت به.\n- **سننه خمسة**: أن يكون صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً.\n- **حكم الأذان والإقامة** (سؤال سابق): فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس المكتوبة والجمعة، وسنة للمنفرد والمسافر.\n\n## باب شروط الصلاة\n**شروطها تسعة**: الإسلام، العقل، التمييز، الطهارة مع القدرة، دخول الوقت، ستر العورة مع القدرة، اجتناب النجاسة في البدن والثوب والبقعة مع القدرة، استقبال القبلة مع القدرة، النية.\n- **محل النية**: القلب. **حقيقتها**: العزم على فعل الشيء. **شروطها**: الإسلام، العقل، التمييز. **زمنها**: أول العبادة أو قبلها بيسير.\n\n---\n\n## كتاب الصلاة\n- **أركانها أربعة عشر**: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة وفيها إحدى عشرة تشديدة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع من السجود، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس للتشهد الأخير، التسليمتان، ترتيب الأركان.\n- **واجباتها ثمانية**: التكبير لغير الإحرام، قول \"سمع الله لمن حمده\" للإمام والمنفرد، قول \"ربنا ولك الحمد\" للإمام والمنفرد والمأموم، قول \"سبحان ربي العظيم\"، قول \"سبحان ربي الأعلى\"، قول \"رب اغفر لي\"، التشهد الأول، الجلوس للتشهد الأول.\n- **الفرق بين الركن والواجب**: الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط سهواً وجهلاً ويجبر بسجود السهو.\n- **ماذا يتحمل الإمام عن المأموم** (سؤال سابق): قراءة الفاتحة، سجود السهو، سترة الصلاة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة في الجهرية، الجهر، وسجود التلاوة إذا لم يسجد الإمام.\n- **هل يجوز للقادر الجلوس في الفرض؟** لا يجوز، لأن القيام ركن في الفرض على القادر، ويجوز في النافلة مع نصف الأجر.\n- **يسن رفع اليدين في ثلاثة مواضع**: عند تكبيرة الإحرام، عند الركوع، عند الرفع منه (وزاد بعضهم عند القيام من التشهد الأول).\n\n### مبطلات الصلاة (أربعة وعشرون، أهمها):\n1. ما أبطل الطهارة. 2. كشف العورة عمداً. 3. استدبار القبلة. 4. اتصال النجاسة به إن لم يزلها في الحال. 5. العمل الكثير عادة من غير جنسها لغير ضرورة. 6. تعمد زيادة ركن فعلي. 7. تعمد تقديم بعض الأركان على بعض. 8. تعمد السلام قبل إتمامها. 9. تعمد إحالة المعنى في القراءة. 10. فسخ النية. 11. التردد في الفسخ وبالعزم عليه. 12. القهقهة والكلام ولو سهواً. 13. سلامه عمداً قبل إمامه، أو سهواً ولم يعده بعده. 14. الأكل والشرب سوى اليسير عرفاً لناس وجاهل، ولا تبطل إن بلع ما بين أسنانه بلا مضغ.\n\n### باب سجود السهو\n**أسبابه ثلاثة**: الزيادة (كزيادة ركن)، النقص (كنقص ركن أو واجب سهواً)، الشك (في زيادة ركن أو واجب أو نقصانه).\n\n### أوقات النهي ثلاثة\nمن طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى غروب الشمس، عند قيام الشمس من الظهيرة حتى تزول عن وسط السماء.\n\n### فصل في الجمع\n- **شروط جمع التقديم أربعة**: نية الجمع عند الإحرام بالأولى، ألا يفرق بينهما بنحو نافلة، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية.\n- **شروط جمع التأخير اثنان**: نية الجمع عند الإحرام بالأولى، بقاء العذر إلى دخول وقت الثانية.\n- **متى يتم المسافر الصلاة** (سؤال سابق): إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر.\n\n### باب صلاة الجمعة\n- **تجب على ستة**: الذكر، المسلم، المكلف، الحر (لا عذر له)، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبين البلد فرسخ (5 أو 6 كيلومتر).\n- **شروط صحة الجمعة أربعة**: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدمها خطبتين.\n- **شروط صحة الخطبتين خمسة**: الوقت، النية، أن تكون في الحضر، حضور الأربعين، أن يكون الخطيب ممن تصح إمامته فيها.\n- **أركان الخطبتين ستة**: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما حيث يُسمع المصلين ولا يوجد مانع من عذر.\n\n---\n\n## كتاب الجنائز\n- **حكم صلاة الجنازة**: فرض كفاية، وتسقط بمكلف واحد ولو امرأة (سؤال سابق: تجزئ إذا صلت عليه امرأة وحدها).\n- **شروطها ثمانية**: النية، التكليف، استقبال القبلة، ستر العورة، اجتناب النجاسة، حضور الميت إن كان بالبلد، إسلام المصلي والمصلى عليه، طهارتهما.\n- **أركانها سبعة**: القيام، التكبيرات الأربع، قراءة الفاتحة، الصلاة على محمد ﷺ، الدعاء للميت، السلام، الترتيب.\n\n---\n\n## كتاب الزكاة\n- **شروط وجوبها خمسة**: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول.\n- **الأموال الزكوية خمسة**: سائمة بهيمة الأنعام، الخارج من الأرض، العسل، الأثمان، عروض التجارة.\n- **ما لا يشترط فيه حولان الحول** (سؤال سابق): الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما).\n- **شروط زكاة السائمة ثلاثة**: أن تتخذ للدر والنسل والتسمين لا للعمل، أن ترعى أكثر الحول، أن تبلغ النصاب.\n- **زكاة الخارج من الأرض**: تجب في كل ما يُكال ويُدخر، بشرطين: أن يبلغ النصاب خمسة أوسق (610 كيلو غرام)، وأن يكون مالكاً للنصاب وقت وجوبها.\n- **مقدار الزكوات**: الخارج من الأرض: يسقى بكلفة نصف العشر، بلا كلفة العشر. العسل: العشر. الركاز: الخمس. الذهب والفضة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو). المعادن: ربع العشر. عروض التجارة: ربع العشر.\n- **شروط الخارص أربعة**: مسلم، أمين، خبير، أجرته على رب الثمرة.\n- **نصاب الذهب**: 85 غراماً. **نصاب الفضة**: 595 غراماً.\n- **نصاب الغنم**: 40 شاة فيها شاة، 121 فيها شاتان، 201 فيها ثلاث شياه، ثم في كل مائة شاة. (سؤال سابق: من يملك أربعين رأساً من الغنم السائمة وحال عليها الحول: يجب عليه شاة واحدة).\n- **نصاب الإبل**: 5 فيها شاة، 10 شاتان، 15 ثلاث شياه، 20 أربع شياه، 25 بنت مخاض، 36 بنت لبون، 46 حقة، 61 جذعة، 76 بنتا لبون، 91 حقتان، 121 ثلاث بنات لبون.\n- **نصاب البقر**: 30 فيها تبيع، 40 فيها مسنة.\n- **الحلي** (سؤال سابق): الحلي المعد للاستعمال المباح أو الإعارة لا زكاة فيه على المذهب، وإن كان معداً للكراء أو الادخار أو كان محرماً ففيه الزكاة إذا بلغ النصاب وحال الحول.\n- **أصناف أهل الزكاة ثمانية**: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله (المجاهدون)، ابن السبيل.\n\n---\n\n## كتاب الصيام\n- **شروط وجوبه أربعة**: الإسلام، البلوغ، العقل، القدرة عليه.\n- **شروط صحته ستة**: الإسلام، انقطاع دم الحيض، انقطاع دم النفاس، التمييز، العقل، النية من الليل لكل يوم واجب.\n- **تعريف فرض الصوم**: الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس.\n- **المفطرات اثنا عشر**: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت إلى الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره.\n- **كفارة الجماع في نهار رمضان**: عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت عنه.\n- **إذا زال العذر عن المفطر في النهار** (سؤال سابق): يلزمه الإمساك بقية اليوم والقضاء (كمن طهرت من حيض، أو قدم مسافر مفطراً، أو برئ مريض، أو أسلم كافر، أو بلغ صبي).\n\n## كتاب الاعتكاف\n- **شروط صحته ستة**: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد.\n- **ما يبطله ستة**: الخروج من المسجد لغير عذر، نية الخروج ولو لم يخرج، الوطء في الفرج، الإنزال بالمباشرة دون الفرج، الردة، السكر.\n- **من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة له** (سؤال سابق): لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة.\n\n---\n\n## كتاب الحج\n- **شروط وجوبه خمسة**: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة شرطاً: وجود المحرم.\n- **الاستطاعة** (سؤال سابق): أن يملك زاداً وراحلة تصلح لمثله، فاضلاً عن قضاء دينه ونفقته ونفقة عياله، وعن حوائجه الأصلية من مسكن وخادم، وأن يكون الطريق آمناً.\n- **أنواع الأنساك ثلاثة**: التمتع (يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج)، الإفراد (يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة)، القِران (يحرم بالحج والعمرة معاً).\n- **محظورات الإحرام سبعة**: لبس المخيط للرجال حتى الخفين، تعمد تغطية الرأس للرجال وتغطية الوجه للأنثى، استعمال الطيب، إزالة الشعر وتقليم الأظافر، قتل صيد البر الوحشي المأكول ومنه الدلالة عليه أو الإعانة، عقد النكاح، الوطء في الفرج ودواعيه.\n- **الفدية قسمان**: (1) على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر أو الظفر والإمناء بنظرة والمباشرة بغير إنزال منٍ، وجزاء الصيد (المثل من النعم أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين مداً أو نصف صاع، أو يصوم عن طعام كل مسكين يوماً). (2) على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء ونحوه، فمن لم يجده صام ثلاثة أيام في الحج وسبعة إذا رجع.\n- **من وطئ في الحج قبل التحلل الأول أو أنزل منياً بفعل متعمداً فعليه بدنة**، ومن وطئ في العمرة قبل تمام السعي فعليه شاة.\n- **أركان الحج أربعة**: الإحرام (وهو مجرد النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة.\n- **واجبات الحج سبعة**: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، المبيت في منى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع.\n- **أركان العمرة ثلاثة**: الإحرام، الطواف، السعي. **واجباتها**: الإحرام بها من الحل، الحلق أو التقصير.\n- **أنواع التحلل** (سؤال سابق): التحلل الأول يحصل بفعل اثنين من ثلاثة: رمي، أو حلق، أو طواف، ويحل به كل شيء إلا النساء. التحلل الثاني يحصل بفعل الثلاثة، ويحل به كل شيء حتى النساء.\n- **شروط صحة الطواف أحد عشر**: النية، الإسلام، العقل، دخول وقته، ستر العورة، اجتناب النجاسة، الطهارة من الحدث، تكميل السبع أشواط، جعل البيت عن يساره، المشي مع القدرة، الموالاة.\n- **شروط صحة السعي ثمانية**: النية، الإسلام، العقل، الموالاة، المشي مع القدرة، كونه بعد الطواف، تكميل السبع أشواط، استيعاب ما بين الصفا والمروة.\n\n---\n\n# المعاملات (20 درجة)\n\n## كتاب البيع\n- **شروط البيع سبعة**: الرضى، الرشد، كون المبيع مالاً، أن يكون المبيع ملكاً للبائع أو مأذوناً له فيه، القدرة على تسليم المبيع، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً.\n- **مثالان على عدم القدرة على التسليم** (سؤال سابق): بيع الآبق، والشارد، والطير في الهواء، والسمك في الماء، والمغصوب على غير غاصبه، فهذه لا يصح بيعها.\n- **الشروط في البيع قسمان**: صحيح لازم (كشرط تأجيل الثمن، أو سكنى الدار شهراً)، وفاسد مبطل للبيع (كشرط بيع آخر، أو سلف، أو قرض، أو \"تزوجني ابنتك\").\n- **أقسام الخيار سبعة**: خيار المجلس، خيار الشرط (اشتراط الخيار إلى مدة)، خيار الغبن (الغش)، خيار التدليس (تزيين العين المراد بيعها)، خيار العيب، خيار الخلف في الصفة، خيار الخلف في قدر الثمن.\n\n### باب الربا\n- **إذا بيع المكيل بجنسه** (كالحبوب والثمار: التمر بالتمر) أو **الموزون بجنسه** (كالذهب بالذهب، الخبز بالخبز) صح بشرطين: المماثلة في القدر، والقبض قبل التفرق. (سؤال سابق)\n- **إذا بيع بغير جنسه** (ذهب بفضة، بر بشعير) صح بشرط: القبض قبل التفرق، وجاز التفاضل.\n- **إذا بيع المكيل بالموزون** جاز التفاضل والتفرق قبل القبض.\n\n## كتاب النكاح\n- **تدخل فيه الأحكام التكليفية الأربعة**: يُسن لذي شهوة لا يخاف الزنا، **يجب على من يخاف الزنا** (سؤال سابق: متى يكون الزواج واجباً؟)، يباح لمن لا شهوة له، يحرم بدار الحرب لغير الضرورة.\n- **النظر ثمانية أقسام**: نظر الرجل البالغ للحرة البالغة الأجنبية لغير حاجة لا يجوز. نظره لمن لا تُشتهى كعجوز يجوز لوجهها خاصة. نظره للشهادة عليها أو لمعاملتها يجوز لوجهها وكذا كفيها لحاجة. نظره لحرة بالغة يخطبها يجوز للوجه والرقبة واليد والقدم. نظره لذوات محارمه يجوز للوجه والرقبة واليد والقدم والرأس والساق. نظره للمداواة يجوز للمواضع التي يحتاج إليها. نظر المرأة للمرأة وللرجل الأجنبي، ونظر الرجل للرجل ولو أمرد يجوز إلى ما عدا ما بين السرة والركبة. نظره لزوجته وأمته المباحة له ولو لشهوة يجوز لجميع البدن.\n- **أركان النكاح**: الإيجاب \"أنكحتك\"، والقبول مرتبين \"قبلت\".\n- **شروط النكاح خمسة**: تعيين الزوجين، رضى الزوجين المكلفين، الولي، شهادة ذكرين مكلفين ولو رقيقين، خلو الزوجين من الموانع نسباً أو سبباً.\n- **شروط الولي سبعة**: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، عدالة ولو ظاهرة، رشد.\n- **شروط الشاهدين**: متكلمين، سميعين، مسلمين، عدلين ولو ظاهراً، أن يكونا غير أصلي الزوجين وفرعيهما.\n- **الكفاءة معتبرة في خمسة**: الديانة، الصناعة، الميسرة، الحرية، النسب.\n- **لا يجوز نكاح الحر من الأمة إلا بشرطين**: عدم المال (الطول)، وخوف الزنا (العنت).\n- **الشروط في النكاح قسمان**: صحيح لازم للزوج (ألا يخرجها من بلادها، أو يزيد مهرها، أو لا يفرق بينها وبين أبويها). فاسد نوعان: نوع يبطل النكاح (نكاح الشغار: يزوجه موليته ويزوجه الآخر موليته بلا مهر، ونكاح المحلل)، ونوع لا يبطله (أن يشترط ألا مهر لها أو لا نفقة أو يقسم لها أكثر من ضرتها أو أقل).\n- **خيار العيب في النكاح ثلاثة أقسام**: قسم يختص بالرجل (كونه مقطوع الذكر أو أشل)، قسم يختص بالأنثى (كون فرجها مسدوداً أو به بخر أو قروح سيالة)، قسم مشترك (جنون، جذام، برص، بخر الفم).\n\n## كتاب العدة\n- **تعريفها**: تربص من فارقت زوجها بوفاة أو حياة.\n- **عدة المتوفى زوجها**: إن كانت حاملاً فبوضع الحمل طال أم قصر، وإن كانت غير حامل فأربعة أشهر وعشر ليالٍ بأيامها، وعدة الأمة نصفها.\n- **عدة المطلقة**: من تحيض: ثلاثة حيض للحرة وحيضتان للأمة. من لا تحيض (صغيرة وآيسة وهي من بلغت خمسين سنة): ثلاثة أشهر، وشهران للأمة. من كانت تحيض ثم ارتفع حيضها ولم تبلغ سن الإياس: إن لم تعلم سبب رفعه تتربص تسعة أشهر ثم تعتد عدة آيسة، وإن علمت ما رفعه (كمرض أو رضاع أو نفاس) فتتربص حتى يعود الحيض فتعتد به أو تصير آيسة.\n- **إحداد المرأة في أربعة أشياء**: تجتنب الزينة، الطيب، لبس الحلي، لبس الملون.\n- **استبراء الإماء** واجب في ثلاثة مواضع: إذا ملك أمة يوطأ مثلها، إذا ملك أمة ووطئها ثم أراد أن يزوجها أو يبيعها، إذا أعتق أمته أو مات عنها. **عدة الإماء واستبراؤهم**: الحامل بوضع الحمل، ومن تحيض بحيضة، والتي لا تحيض بشهر، والمرتفع حيضها ولا تعلم ما رفعه عشرة أشهر، والعالمة خمسون سنة وشهر.\n\n## كتاب الرضاع\n**تثبت المحرمية بالرضاع بشرطين** (سؤال سابق): أن تكون خمس رضعات، وفي العامين (السنة الأولى والثانية).\n\n## كتاب النفقات\n- **يجب على الزوج لزوجته**: الأكل، الشرب، الملبس، مسكن بالمعروف، مؤنة نظافتها، خادم إن كانت ممن يخدم مثلها، مؤنسة لحاجة.\n- **نفقة الأقارب** تجب بثلاثة شروط: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوت نفسه وزوجته ورقيقه يومه وليلته، أن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فيجب.\n- **الحضانة**: حفظ الطفل غالباً عما يضره والقيام بمصالحه. إذا بلغ الصبي سبع سنين عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً إلى أن تتزوج. المجنون ولو أنثى عند أمه مطلقاً.\n\n## كتاب الأطعمة\n- **يحرم أكله**: النجس كالميتة ولحم الخنزير. حيوان البر: الحمر الأهلية وما يفترس بنابه كالأسد والنمر. حيوان الطير: ما يصيد بمخلبه كالعقاب والصقر. ما يأكل الجيف كنسر وفأر. وتحرم الجلالة (التي أكثر علفها النجاسة) ولا تحل حتى تحبس ثلاثاً وتطعم الطاهر. ويحل كل ما في البحر غير ضفدع وحية وتمساح.\n- **الذكاة**: ذبح أو نحر الحيوان المقدور عليه. **شروطها أربعة**: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (يحل الذبح بكل محدد غير السن والظفر)، قطع الحلقوم والمريء، قول \"بسم الله\" عند الذكاة وتسقط سهواً لا جهلاً.\n\n## كتاب الصيد\n- **متى يباح الصيد ومتى يكره** (سؤال سابق): يباح لمن يقصد به الانتفاع، ويكره لمن يقصده لهواً ولعباً، ويحرم على المحرم وفي الحرم.\n- **شروط حل الصيد إذا مات قبل أن يُدركه أربعة**: كون الصائد أهلاً للذكاة. الآلة وهي نوعان: ما له حد يجرح به كسيف، وجارحة معلمة ككلب غير أسود وصقر. قصد الفعل وهو أن يرسل الآلة لقصد الصيد. قول \"بسم الله\" عند إرسال الجارحة أو رمي سلاحه ولا تسقط سهواً.\n- **شروط صيد الكلب والفهد ثلاثة**: يسترسل إذا أُرسل، ينزجر إذا زُجر، إذا أمسك لم يأكل.\n- **شروط صيد الطير ثلاثة**: أن يسترسل إذا أرسل، ويرجع إذا دُعي، أن يجرح الصيد لا بصدم ولا بخنق.\n\n## كتاب الأيمان\n- **لا تنعقد اليمين إلا**: بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته.\n- **شروط وجوب الكفارة خمسة**: كون الحالف مكلفاً، كونه مختاراً، كونه قاصداً لليمين، كونها على أمر مستقبل، الحنث في يمينه (يرجع عما حلف عنه).\n- **كفارة اليمين**: إطعام عشرة مساكين أو كسوتهم، أو تحرير رقبة مؤمنة، فإن لم يجد صام ثلاثة أيام متتابعة وجوباً. ولا يصح أن يكفر الرقيق بغير الصوم، وعكسه الكافر.\n\n### باب النذر\n- **لا يصح إلا**: بالقول، من مكلف، مختاراً.\n- **أنواع النذر المنعقد وأحكامه ستة**: النذر المطلق (\"لله علي نذر\") وكفارته كفارة يمين. نذر اللجاج والغضب (\"إن كلمتك فعلي صوم كذا\") فيخير بين الفعل أو كفارة يمين. النذر المباح (\"لله علي أن أركب دابتي\") فيخير بين الفعل أو كفارة يمين. النذر المكروه (كطلاق) فيسن أن يكفر ولا يفعله. نذر المعصية (كشرب الخمر) فيحرم الوفاء به ويكفر. نذر التبرر (كصلاة وصيام أو يعلقه بشرط: \"إن شفى الله مريضي فعلي كذا\") فيجب الوفاء به.\n- من نذر صوم شهر معين لزمه صومه متتابعاً، فإن أفطر لغير عذر حرم ولزمه ابتداؤه من جديد مع كفارة يمين، وإن أفطر لعذر أكمل صومه ويكفر لفوات التتابع. من نذر صوم شهر مطلق أو صوم متتابع غير مقيد بزمن لزمه التتابع، فإن أفطر لغير عذر لزمه ابتداؤه من جديد بلا كفارة، ولعذر خير بين ابتدائه ولا شيء عليه وبين أن يكمله ويكفر.\n", "questions": [{"s": "fiqh", "q": "ما الأموال التي لا يشترط فيها حولان الحول؟", "a": "الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما)."}, {"s": "fiqh", "q": "ما هي واجبات الحج؟", "a": "سبعة: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت بمزدلفة ليلة النحر إلى بعد نصف الليل، المبيت بمنى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع."}, {"s": "fiqh", "q": "ما هي أركان الحج؟", "a": "أربعة: الإحرام (وهو النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة."}, {"s": "fiqh", "q": "ما هي سنن الأذان؟", "a": "خمسة: أن يكون المؤذن صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً."}, {"s": "fiqh", "q": "ما شروط المؤذن؟", "a": "ستة: الإسلام، الذكورية، العقل، التمييز، النطق، العدالة."}, {"s": "fiqh", "q": "ما حكم الأذان والإقامة؟", "a": "فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس والجمعة، وسنة للمنفرد والمسافر."}, {"s": "fiqh", "q": "ما هي مفطرات الصائم؟", "a": "اثنا عشر: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ."}, {"s": "fiqh", "q": "اذكر أنواع التحلل في الحج وكيف يحصل.", "a": "التحلل الأول: بفعل اثنين من ثلاثة (رمي، حلق، طواف) ويحل به كل شيء إلا النساء. التحلل الثاني: بفعل الثلاثة، ويحل به كل شيء حتى النساء."}, {"s": "fiqh", "q": "اذكر الفروق بين المسح على الخفين والمسح على الجبيرة.", "a": "الخف: يشترط لبسه على طهارة، مؤقت (يوم وليلة للمقيم وثلاثة للمسافر)، يمسح أكثر أعلاه، في الحدث الأصغر فقط. الجبيرة: لا يشترط لبسها على طهارة، غير مؤقتة حتى البرء، يمسح جميعها، في الأصغر والأكبر، ولا تتجاوز قدر الحاجة."}, {"s": "fiqh", "q": "متى يتم المسافر الصلاة؟", "a": "إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر."}, {"s": "fiqh", "q": "ما الحكم إذا زال العذر عن المفطر وهو في النهار؟", "a": "يلزمه الإمساك بقية اليوم مع القضاء، كمن طهرت من حيضها، أو قدم المسافر مفطراً، أو برئ المريض، أو أسلم الكافر، أو بلغ الصبي."}, {"s": "fiqh", "q": "ماذا يتحمل الإمام عن المأموم؟", "a": "قراءة الفاتحة، سجود السهو، السترة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة والجهر في الجهرية، وسجود التلاوة إذا لم يسجد الإمام."}, {"s": "fiqh", "q": "بيّن حكم الصلاة على الميت، وهل يجزئ لو صلى على الميت امرأة وحدها دون أن يكون معها رجل؟", "a": "فرض كفاية، وتسقط بواحد مكلف ولو امرأة، فيجزئ ذلك."}, {"s": "fiqh", "q": "محمد يملك أربعين رأساً من الغنم السائمة وقد حال عليها الحول، بيّن مقدار الزكاة.", "a": "يجب عليه شاة واحدة، لأن نصاب الغنم أربعون، وفيها شاة إلى مائة وعشرين."}, {"s": "fiqh", "q": "عائشة تملك حلياً يبلغ نصاباً وقد حال عليه الحول، هل يجب عليها إخراج الزكاة؟", "a": "إن كان الحلي معداً للاستعمال المباح أو الإعارة فلا زكاة فيه على المذهب. وإن كان للكراء أو الادخار أو كان محرماً وجبت الزكاة (ربع العشر). نصاب الذهب 85 غراماً والفضة 595 غراماً."}, {"s": "fiqh", "q": "اذكر شروط الوجوب في الصيام.", "a": "أربعة: الإسلام، البلوغ، العقل، القدرة عليه."}, {"s": "fiqh", "q": "بيّن حكم من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة في حقه.", "a": "لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة."}, {"s": "fiqh", "q": "عرّف الاستطاعة في الحج مع بيان الشرط الذي يجب أن يتحقق فيها.", "a": "أن يملك زاداً وراحلة تصلح لمثله، بشرط أن يكون ذلك فاضلاً عن قضاء دينه ونفقته ونفقة عياله وحوائجه الأصلية (مسكن وخادم)، وأن يكون الطريق آمناً."}, {"s": "fiqh", "q": "أفعال العباد لها تعلقان، فما هما؟", "a": "تعلق بمشيئة العبد (الكسب والاختيار)، وتعلق بمشيئة الله تعالى (الخلق والتقدير)، فأفعال العباد خلق لله وكسب من العبد."}, {"s": "fiqh", "q": "يسن رفع اليدين في الصلاة، اذكر ثلاثة مواضع.", "a": "عند تكبيرة الإحرام، وعند الركوع، وعند الرفع منه (وزاد بعضهم: عند القيام من التشهد الأول)."}, {"s": "fiqh", "q": "اذكر ماءً يكره استخدامه في الطهارة.", "a": "الماء المشمس في الأواني، والماء المتغير بما لا يمازجه كالدهن، وماء بئر بمقبرة، والماء المسخن بنجاسة، وماء زمزم للاستنجاء."}, {"s": "fiqh", "q": "ما فروض الوضوء؟", "a": "ستة: غسل الوجه ومنه المضمضة والاستنشاق، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل الرجلين إلى الكعبين، الترتيب، الموالاة."}, {"s": "fiqh", "q": "ما شروط الوضوء؟", "a": "ثمانية: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار."}, {"s": "fiqh", "q": "ما شروط المسح على الخف؟", "a": "سبعة: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما."}, {"s": "fiqh", "q": "هل يجوز للقادر الجلوس في صلاة الفرض؟ ولماذا؟", "a": "لا يجوز، لأن القيام ركن في الفرض على القادر. ويجوز في النافلة وله نصف الأجر."}, {"s": "fiqh", "q": "اذكر أصناف الزكاة.", "a": "ثمانية: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله، ابن السبيل."}, {"s": "fiqh", "q": "اذكر مثالين على معنى أن يكون البائع قادراً على تسليم المبيع.", "a": "لا يصح بيع العبد الآبق، ولا البعير الشارد، ولا الطير في الهواء، ولا السمك في الماء، ولا المغصوب لغير غاصبه، لعدم القدرة على التسليم."}, {"s": "fiqh", "q": "متى يكون الزواج واجباً؟", "a": "يجب على من يخاف الزنا على نفسه. ويُسن لذي شهوة لا يخاف الزنا، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة."}, {"s": "fiqh", "q": "ما شروط تحريم الرضاع؟", "a": "شرطان: أن يكون خمس رضعات، وأن يكون في العامين (السنة الأولى والثانية)."}, {"s": "fiqh", "q": "متى يباح الصيد ومتى يكره؟", "a": "يباح لمن قصد به الانتفاع، ويكره لمن قصده لهواً ولعباً، ويحرم على المحرم وفي الحرم."}, {"s": "fiqh", "q": "ما شروط جواز بيع الربوي إن كان مثلين مكيلين أو موزونين بجنسه؟", "a": "شرطان: المماثلة في القدر، والقبض قبل التفرق. وإذا اختلف الجنس جاز التفاضل ووجب القبض قبل التفرق. وإذا بيع مكيل بموزون جاز التفاضل والتفرق."}, {"s": "fiqh", "q": "ما أركان الصلاة؟", "a": "أربعة عشر: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع منه، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس له، التسليمتان، الترتيب."}, {"s": "fiqh", "q": "ما واجبات الصلاة؟", "a": "ثمانية: التكبير لغير الإحرام، سمع الله لمن حمده للإمام والمنفرد، ربنا ولك الحمد للكل، سبحان ربي العظيم، سبحان ربي الأعلى، رب اغفر لي، التشهد الأول، الجلوس له."}, {"s": "fiqh", "q": "ما الفرق بين الركن والواجب في الصلاة؟", "a": "الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط بالسهو والجهل ويجبر بسجود السهو."}, {"s": "fiqh", "q": "ما أسباب سجود السهو؟", "a": "ثلاثة: الزيادة، النقص، الشك."}, {"s": "fiqh", "q": "ما أوقات النهي؟", "a": "ثلاثة: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى الغروب، عند قيام الشمس حتى تزول."}, {"s": "fiqh", "q": "ما شروط جمع التقديم وجمع التأخير؟", "a": "التقديم أربعة: نية الجمع عند الإحرام بالأولى، عدم التفريق بينهما، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية. التأخير اثنان: نية الجمع عند الإحرام بالأولى، وبقاء العذر إلى دخول وقت الثانية."}, {"s": "fiqh", "q": "على من تجب الجمعة؟ وما شروط صحتها؟", "a": "تجب على: الذكر، المسلم، المكلف، الحر، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبينه فرسخ. شروط صحتها أربعة: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدم خطبتين."}, {"s": "fiqh", "q": "ما أركان الخطبتين؟", "a": "ستة: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما."}, {"s": "fiqh", "q": "ما أركان صلاة الجنازة؟", "a": "سبعة: القيام، التكبيرات الأربع، الفاتحة، الصلاة على النبي ﷺ، الدعاء للميت، السلام، الترتيب."}, {"s": "fiqh", "q": "ما شروط وجوب الزكاة؟ وما الأموال الزكوية؟", "a": "الشروط خمسة: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول. الأموال خمسة: السائمة، الخارج من الأرض، العسل، الأثمان، عروض التجارة."}, {"s": "fiqh", "q": "ما مقدار الزكاة في الخارج من الأرض والعسل والركاز والذهب وعروض التجارة وزكاة الفطر؟", "a": "الخارج من الأرض: نصف العشر إن سقي بكلفة والعشر بلا كلفة. العسل: العشر. الركاز: الخمس. الذهب والفضة والمعادن وعروض التجارة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو)."}, {"s": "fiqh", "q": "ما كفارة الجماع في نهار رمضان؟", "a": "عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت."}, {"s": "fiqh", "q": "ما شروط صحة الاعتكاف وما يبطله؟", "a": "الشروط ستة: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد. المبطلات ستة: الخروج لغير عذر، نية الخروج، الوطء، الإنزال بالمباشرة، الردة، السكر."}, {"s": "fiqh", "q": "ما شروط وجوب الحج؟ وبم تزيد المرأة؟", "a": "خمسة: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة: وجود المحرم."}, {"s": "fiqh", "q": "ما أنواع الأنساك؟", "a": "التمتع: يحرم بالعمرة في أشهر الحج ثم بالحج. الإفراد: يحرم بالحج ثم بالعمرة بعده. القران: يحرم بهما معاً."}, {"s": "fiqh", "q": "ما محظورات الإحرام؟", "a": "سبعة: لبس المخيط للرجال، تغطية الرأس للرجل والوجه للمرأة، الطيب، إزالة الشعر وتقليم الأظفار، قتل صيد البر، عقد النكاح، الوطء ودواعيه."}, {"s": "fiqh", "q": "ما أقسام الفدية؟", "a": "على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر والظفر وجزاء الصيد (صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة). على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء، فمن لم يجد صام ثلاثة أيام في الحج وسبعة إذا رجع."}, {"s": "fiqh", "q": "ما شروط البيع؟", "a": "سبعة: الرضى، الرشد، كون المبيع مالاً، ملك البائع له أو الإذن، القدرة على التسليم، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً."}, {"s": "fiqh", "q": "ما أقسام الخيار؟", "a": "سبعة: المجلس، الشرط، الغبن، التدليس، العيب، الخلف في الصفة، الخلف في قدر الثمن."}, {"s": "fiqh", "q": "ما أركان النكاح وشروطه؟", "a": "الأركان: الإيجاب والقبول. الشروط خمسة: تعيين الزوجين، رضاهما، الولي، شهادة ذكرين مكلفين، خلوهما من الموانع."}, {"s": "fiqh", "q": "ما شروط الولي في النكاح؟", "a": "سبعة: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، العدالة ولو ظاهرة، الرشد."}, {"s": "fiqh", "q": "فيم تعتبر الكفاءة في النكاح؟", "a": "خمسة: الديانة، الصناعة، الميسرة، الحرية، النسب."}, {"s": "fiqh", "q": "ما عدة المتوفى عنها زوجها والمطلقة؟", "a": "المتوفى عنها: الحامل بوضع الحمل، وغير الحامل أربعة أشهر وعشراً. المطلقة: من تحيض ثلاث حيض، ومن لا تحيض ثلاثة أشهر، ومن ارتفع حيضها ولا تعلم سببه تسعة أشهر ثم ثلاثة."}, {"s": "fiqh", "q": "فيم تحد المرأة؟", "a": "أربعة: تجتنب الزينة، والطيب، ولبس الحلي، ولبس الملون."}, {"s": "fiqh", "q": "ما شروط نفقة الأقارب؟", "a": "ثلاثة: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوته وقوت زوجته يومه وليلته، أن يكون وارثاً لهم إلا الأصول والفروع فتجب مطلقاً."}, {"s": "fiqh", "q": "ما أحكام الحضانة؟", "a": "إذا بلغ الصبي سبعاً عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً حتى تتزوج. المجنون ولو أنثى عند أمه مطلقاً."}, {"s": "fiqh", "q": "ما شروط الذكاة؟", "a": "أربعة: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (كل محدد غير السن والظفر)، قطع الحلقوم والمريء، التسمية وتسقط سهواً لا جهلاً."}, {"s": "fiqh", "q": "ما شروط صيد الكلب والفهد وصيد الطير؟", "a": "الكلب والفهد: يسترسل إذا أرسل، ينزجر إذا زجر، إذا أمسك لم يأكل. الطير: يسترسل إذا أرسل، يرجع إذا دُعي، يجرح الصيد لا بصدم ولا خنق."}, {"s": "fiqh", "q": "بم تنعقد اليمين؟ وما كفارتها؟", "a": "بالله أو اسم من أسمائه أو صفة من صفاته. الكفارة: إطعام عشرة مساكين أو كسوتهم أو تحرير رقبة، فإن لم يجد صام ثلاثة أيام متتابعة."}, {"s": "fiqh", "q": "ما أنواع النذر وأحكامه؟", "a": "ستة: المطلق (كفارة يمين)، اللجاج والغضب (يخير بين الفعل والكفارة)، المباح (يخير)، المكروه (يسن ألا يفعله ويكفر)، المعصية (يحرم الوفاء ويكفر)، التبرر (يجب الوفاء)."}, {"s": "fiqh", "q": "ما نواقض الوضوء؟", "a": "ثمانية: الخارج من السبيلين، خروج النجاسة من بقية البدن، زوال العقل، مس الفرج بلا حائل، مباشرة الذكر الأنثى لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة."}, {"s": "fiqh", "q": "ما موجبات الغسل؟", "a": "سبعة: انتقال المني، خروجه بلذة، تغييب الحشفة في فرج، إسلام الكافر، الحيض، النفاس، الموت."}, {"s": "fiqh", "q": "ما شروط التيمم وفروضه ومبطلاته؟", "a": "الشروط ثمانية: النية، الإسلام، العقل، التمييز، الاستنجاء، دخول الوقت، تعذر الماء، تراب طهور له غبار. الفروض خمسة: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، الموالاة، تعيين النية. المبطلات خمسة: ما أبطل الوضوء، وجود الماء، خروج الوقت، زوال المبيح، خلع ما مسح عليه."}, {"s": "fiqh", "q": "ما الذي يحرم بالحيض؟", "a": "تسعة: الوطء، الطلاق، الصلاة، الصوم، الطواف، قراءة القرآن، مس المصحف، اللبث في المسجد، المرور فيه إن خافت التلويث."}, {"s": "fiqh", "q": "ما شروط الصلاة؟", "a": "تسعة: الإسلام، العقل، التمييز، الطهارة، دخول الوقت، ستر العورة، اجتناب النجاسة، استقبال القبلة، النية."}]}, "hadith": {"name": "الحديث", "source": "الأربعون النووية", "notes": "# الحديث (10 درجات) — الأربعون النووية\n\nكل أسئلة الاختبارات السابقة في الحديث جاءت من الأربعين النووية: الراوي، المخرّج، معاني الألفاظ، الفوائد المستنبطة، والأقسام والشروط الواردة في الشروح (ابن دقيق العيد، ابن رجب في جامع العلوم والحكم، ابن عثيمين).\n\n## ما يُسأل عنه في كل حديث\n1. من راويه من الصحابة؟ ومن أخرجه؟\n2. معاني الألفاظ الغريبة.\n3. الفوائد المستنبطة (ثلاث فوائد على الأقل).\n4. الأقسام والشروط المذكورة في الشرح.\n\n---\n\n## الأحاديث مع أهم ما يُسأل عنه\n\n**1. إنما الأعمال بالنيات** — عمر بن الخطاب، متفق عليه.\n- هذا الحديث ثلث الإسلام (قال الإمام أحمد: أصول الإسلام على ثلاثة أحاديث: هذا، والحلال بين، ومن أحدث).\n- \"إنما الأعمال بالنيات\": أي صحة الأعمال وقبولها بالنية، فهي شرط للعبادات. \"وإنما لكل امرئ ما نوى\": الجزاء بحسب النية. قال النووي: الأولى بيان أن العمل لا يكون إلا بنية، والثانية بيان أن الثواب على قدر النية.\n- **كيف تُميّز بالنية** (سؤال سابق): (أ) العادة من العبادة: الغسل للتبرد وغسل الجنابة، الإمساك عن الطعام حمية وصوماً. (ب) العبادة من العبادة الأخرى: صلاة الظهر عن العصر، صوم القضاء عن النذر. (ج) العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لتكون كلمة الله هي العليا أو للمغنم. يطلق عليه \"أم السنة\" (سؤال أكمل: يطلق اسم أم السنة على حديث \"إنما الأعمال بالنيات\"، وأم القرآن على سورة الفاتحة).\n\n**2. حديث جبريل (الإسلام والإيمان والإحسان)** — عمر، رواه مسلم.\n- أركان الإسلام خمسة، أركان الإيمان ستة، الإحسان مرتبتان: أن تعبد الله كأنك تراه (المشاهدة)، فإن لم تكن تراه فإنه يراك (المراقبة). أشراط الساعة: أن تلد الأمة ربتها، والتطاول في البنيان.\n\n**3. بني الإسلام على خمس** — ابن عمر، متفق عليه.\n- **لماذا لم يذكر الجهاد** (سؤال سابق): علل القرطبي بأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، وقيل لأنه لم يكن قد فُرض بعد، والصحيح أن هذه الخمسة يتعين على كل مسلم فعلها بنفسه بخلاف الجهاد.\n- **رواية \"خمسة\" بالهاء ورواية \"خمس\" بغير هاء** (سؤال سابق): كلاهما صحيح، \"خمس\" أي خمس دعائم أو قواعد، و\"خمسة\" أي خمسة أركان أو أشياء.\n- **هل يصح أن يقال بُني الإسلام على خمسة؟** نعم، ورد في رواية مسلم.\n- **كيف تعامل ابن عمر مع من قدّم الحج على الصوم** (سؤال سابق): رجل قال له: \"الحج وصيام رمضان\"، فقال ابن عمر: \"لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ\"، رواه مسلم. أنكر عليه ليتحفظ الترتيب النبوي لحرصه على اللفظ.\n\n**4. الصادق المصدوق** — ابن مسعود، متفق عليه.\n- **معنى الصادق المصدوق** (سؤال سابق): الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي، أي صدقه الله فيما أخبره.\n- مراحل الخلق: نطفة أربعين يوماً، ثم علقة، ثم مضغة، ثم يرسل الملك فينفخ الروح ويكتب أربع كلمات: رزقه وأجله وعمله وشقي أم سعيد.\n\n**5. من أحدث في أمرنا هذا ما ليس منه فهو رد** — عائشة، متفق عليه.\n- \"ليس عليه أمرنا\" (سؤال أكمل): أي ليس عليه حكمنا وديننا. \"فهو رد\": أي مردود باطل غير معتد به.\n- **فائدة عظيمة** (سؤال سابق): هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود على صاحبه، وهو أصل في إبطال البدع والعقود المحرمة.\n\n**6. الحلال بين والحرام بين** — النعمان بن بشير، متفق عليه.\n- **\"فمن وقع في الشبهات وقع في الحرام\"، فيه قولان** (سؤال سابق): الأول: أنه يقع في الحرام حقيقة وهو لا يشعر، لأن التساهل بالشبهات يجره إلى الحرام. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه، كالراعي حول الحمى.\n- الحديث أصل في الورع. \"مضغة\" هي القلب.\n\n**7. الدين النصيحة** — تميم بن أوس الداري، رواه مسلم.\n- **اكتب الحديث كاملاً وكم عدد ما رُوي عنه** (سؤال سابق): \"الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم\". تميم الداري لم يُروَ عنه في الكتب الستة إلا هذا الحديث (وقيل: له ثمانية عشر حديثاً في كتب الحديث عموماً، وفي الصحيح هذا فقط).\n- **النصيحة لأئمة المسلمين** (سؤال سابق): معاونتهم على الحق وطاعتهم فيه وأمرهم به وتذكيرهم برفق ولطف، وعدم الخروج عليهم، والدعاء لهم بالصلاح.\n- **النصيحة فرض كفاية** (سؤال أكمل). النصيحة لغة: خلاص العسل من الشمع، أو الخياطة بالإبرة (نصح الثوب).\n\n**8. أمرت أن أقاتل الناس** — ابن عمر، متفق عليه. \"إلا بحق الإسلام\": كالقصاص والزنا بعد الإحصان.\n\n**9. ما نهيتكم عنه فاجتنبوه** — أبو هريرة، متفق عليه.\n- **من الرجل السائل المبهم في \"فإنما أهلك الذين من قبلكم كثرة مسائلهم\"** (سؤال سابق): الأقرع بن حابس، سأل: \"أفي كل عام يا رسول الله؟\" لما فرض الحج.\n- من فوائده: النهي يجتنب كله، والأمر بقدر الاستطاعة.\n\n**10. إن الله طيب لا يقبل إلا طيباً** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): أن الله منزه عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الطيب الحلال. أن أكل الحرام من موانع إجابة الدعاء. الرسل والمؤمنون مكلفون بتكليف واحد في أكل الطيب. أسباب الإجابة الأربعة: إطالة السفر، رثاثة الهيئة، رفع اليدين، الإلحاح بيا رب. وموانعها الأربعة: المطعم والمشرب والملبس الحرام والغذاء بالحرام.\n\n**11. دع ما يريبك إلى ما لا يريبك** — الحسن بن علي، رواه الترمذي والنسائي.\n**12. من حسن إسلام المرء تركه ما لا يعنيه** — أبو هريرة، رواه الترمذي.\n**13. لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه** — أنس، متفق عليه. المنفي كمال الإيمان الواجب لا أصله.\n**14. لا يحل دم امرئ مسلم إلا بإحدى ثلاث** — ابن مسعود، متفق عليه: الثيب الزاني، النفس بالنفس، التارك لدينه المفارق للجماعة.\n**15. من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت** — أبو هريرة، متفق عليه.\n**16. لا تغضب** — أبو هريرة، رواه البخاري.\n**17. إن الله كتب الإحسان على كل شيء** — شداد بن أوس، رواه مسلم.\n**18. اتق الله حيثما كنت** — أبو ذر ومعاذ، رواه الترمذي.\n**19. احفظ الله يحفظك** — ابن عباس، رواه الترمذي.\n- **معنى \"احفظ الله يحفظك\"** (سؤال سابق): احفظ حدوده وأوامره ونواهيه بامتثالها واجتنابها، يحفظك في دينك ودنياك وأهلك ومالك. حفظ الله للعبد نوعان: حفظ في الدنيا (البدن والمال والولد)، وحفظ في الدين والإيمان.\n- \"رفعت الأقلام وجفت الصحف\": الفراغ من كتابة المقادير.\n\n**20. إذا لم تستح فاصنع ما شئت** — أبو مسعود البدري، رواه البخاري.\n**21. قل آمنت بالله ثم استقم** — سفيان بن عبدالله الثقفي، رواه مسلم.\n- **\"ثم استقم\"** (سؤال سابق): الاستقامة هي لزوم طاعة الله والثبات على الدين بلا ميل، وهي جامعة لخصال الدين كلها.\n\n**22. أرأيت إذا صليت المكتوبات** — جابر، رواه مسلم. \"لم أزد على ذلك شيئاً\": أي لا أزيد على الفرائض، وفيه دليل على أن تارك السنن لا يأثم.\n**23. الطهور شطر الإيمان** — أبو مالك الأشعري، رواه مسلم. \"شطر\": نصف. \"الصلاة نور، والصدقة برهان، والصبر ضياء\". **الصبر ثلاثة** (سؤال أكمل): صبر على طاعة الله، وصبر عن معصية الله، وصبر على أقدار الله المؤلمة.\n**24. يا عبادي إني حرمت الظلم على نفسي** — أبو ذر، رواه مسلم (حديث قدسي).\n**25. ذهب أهل الدثور بالأجور** — أبو ذر، رواه مسلم. \"الدثور\": الأموال الكثيرة.\n**26. كل سلامى من الناس عليه صدقة** — أبو هريرة، متفق عليه. \"سلامى\": المفصل.\n**27. البر حسن الخلق، والإثم ما حاك في صدرك** — النواس بن سمعان، رواه مسلم.\n**28. إياكم ومحدثات الأمور** — العرباض بن سارية، رواه أبو داود والترمذي.\n- **الراوي** (سؤال سابق): أبو نجيح العرباض بن سارية. **أخرجه**: أبو داود والترمذي. **المحدث قسمان**: محدث ليس له أصل في الشريعة فهو بدعة، ومحدث يحمل النظير على النظير (كجمع المصحف) فليس ببدعة.\n- \"موعظة بليغة\": مؤثرة. \"ذرفت منها العيون\": سالت دموعها. \"بالنواجذ\": أقصى الأضراس.\n\n**29. يا رسول الله أخبرني بعمل يدخلني الجنة** — معاذ، رواه الترمذي. \"ملاك ذلك كله\": كف اللسان. \"ثكلتك أمك\": دعاء لا يراد حقيقته.\n**30. إن الله فرض فرائض فلا تضيعوها** — أبو ثعلبة الخشني، رواه الدارقطني.\n**31. ازهد في الدنيا يحبك الله** — سهل بن سعد، رواه ابن ماجه.\n**32. لا ضرر ولا ضرار** — أبو سعيد الخدري، رواه ابن ماجه والدارقطني. الضرر: إلحاق المفسدة بالغير مطلقاً، والضرار: مقابلة الضرر بالضرر.\n**33. لو يعطى الناس بدعواهم** — ابن عباس، رواه البيهقي وأصله في الصحيحين. البينة على المدعي واليمين على من أنكر.\n**34. من رأى منكم منكراً فليغيره** — أبو سعيد الخدري، رواه مسلم.\n- **شروط الأمر بالمعروف والنهي عن المنكر** (سؤال سابق): أن يكون عالماً بأن هذا منكر وبحكمه. أن يكون المنكر ظاهراً بلا تجسس. أن يكون متفقاً على إنكاره لا مسألة خلافية. أن يغلب على ظنه أن الإنكار لا يؤدي إلى منكر أكبر. القدرة عليه. وله مراتب: اليد ثم اللسان ثم القلب، وتغيير القلب أضعف الإيمان.\n\n**35. لا تحاسدوا ولا تناجشوا** — أبو هريرة، رواه مسلم.\n- **معاني الكلمات** (سؤال سابق مكرر):\n  - **لا تحاسدوا**: لا يتمنى بعضكم زوال نعمة بعض.\n  - **لا تناجشوا**: النجش أن يزيد في السلعة من لا يريد شراءها ليغر المشتري، والمناجشة: الخداع.\n  - **لا تباغضوا**: لا تتعاطوا أسباب البغض.\n  - **لا تدابروا**: التدابر أن يعطي كل منهما الآخر دبره إعراضاً وهجراً.\n  - **يحقر** / **لا يحقره**: لا يستصغره ويزدريه ويستهين به.\n  - **التقوى ها هنا**: في القلب، وأشار إلى صدره ثلاثاً.\n\n**36. من نفّس عن مؤمن كربة** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على تلاوة القرآن ومدارسته في بيوت الله. فضل طلب العلم وأنه طريق إلى الجنة. أن العمل هو المعتبر لا النسب (\"من بطأ به عمله لم يسرع به نسبه\").\n- \"نفّس\": فرّج. \"كربة\": شدة عظيمة. \"السكينة\": الطمأنينة.\n\n**37. إن الله كتب الحسنات والسيئات** — ابن عباس، متفق عليه. الحسنة بعشر إلى سبعمائة ضعف، والهم بالسيئة إذا ترك لله كتبت حسنة.\n**38. من عادى لي ولياً** — أبو هريرة، رواه البخاري (قدسي). الولي: المؤمن التقي. أحب ما يتقرب به العبد: الفرائض، ثم النوافل.\n**39. إن الله تجاوز لي عن أمتي الخطأ والنسيان** — ابن عباس، رواه ابن ماجه والبيهقي.\n**40. كن في الدنيا كأنك غريب أو عابر سبيل** — ابن عمر، رواه البخاري.\n- **المقصود** (سؤال سابق): لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن فيها كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ. ومن وصايا ابن عمر: \"إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء، وخذ من صحتك لمرضك ومن حياتك لموتك\".\n\n**41. لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به** — عبدالله بن عمرو، حديث حسن صحيح رواه النووي في الحجة.\n- **المحبة ثلاثة أقسام** (سؤال سابق): محبة إجلال وعظمة (كمحبة الوالد)، محبة شفقة ورحمة (كمحبة الولد)، محبة استحسان ومشاكلة (كمحبة سائر الناس).\n\n**42. يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك** — أنس، رواه الترمذي (قدسي).\n- **شروط التوبة ثلاثة** (سؤال سابق): الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع إن كانت متعلقة بحق آدمي: رد المظالم إلى أهلها. \"عنان السماء\": السحاب أو ما عنّ لك منها. \"قراب الأرض\": ملؤها أو ما يقارب ملأها.\n\n## أسئلة مرجحة: معاني ألفاظ\n| اللفظ | المعنى |\n|---|---|\n| مضغة | قطعة لحم قدر ما يُمضغ (القلب) |\n| العَلَق | الدم الغليظ الجامد |\n| يخالطهم | يعاشرهم |\n| النواجذ | أقصى الأضراس |\n| الدثور | الأموال الكثيرة |\n| سلامى | المفصل |\n| ملاك الأمر | قوامه وأصله |\n| العنان | السحاب |\n| الكربة | الشدة العظيمة |\n| الخلاصة | زبدة الشيء |\n| حاك في صدرك | تردد فيه ولم ينشرح له |\n", "questions": [{"s": "hadith", "q": "كيف تتميز بالنية العادة من العبادة، أو العبادة من الأخرى، أو العبادة لله أو لغيره؟ اذكر مثالين لكل صورة.", "a": "العادة من العبادة: الغسل للتبرد وللجنابة، الإمساك حمية وصوماً. العبادة من الأخرى: الظهر من العصر، صوم القضاء من النذر. العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لإعلاء كلمة الله أو للمغنم."}, {"s": "hadith", "q": "ما معنى الصادق المصدوق؟", "a": "الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي (صدقه الله)."}, {"s": "hadith", "q": "\"فمن وقع في الشبهات وقع في الحرام\" هناك قولان، اذكرهما.", "a": "الأول: أنه يقع في الحرام حقيقة وهو لا يشعر. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه كالراعي حول الحمى."}, {"s": "hadith", "q": "ما شروط الأمر بالمعروف والنهي عن المنكر؟", "a": "أن يكون عالماً بأنه منكر، وأن يكون المنكر ظاهراً بلا تجسس، وأن يكون متفقاً على إنكاره لا مسألة خلافية، وألا يترتب عليه منكر أكبر، والقدرة. ومراتبه: اليد ثم اللسان ثم القلب."}, {"s": "hadith", "q": "ما معنى: لا تحاسدوا؟ لا تناجشوا؟ لا تدابروا؟ يحقر؟", "a": "لا تحاسدوا: لا يتمنى بعضكم زوال نعمة بعض. لا تناجشوا: النجش الزيادة في السلعة ممن لا يريد شراءها ليغر غيره. لا تدابروا: لا يعطي كل منكما الآخر دبره هجراً وإعراضاً. يحقر: يستصغره ويزدريه."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: إن الله طيب لا يقبل إلا طيباً.", "a": "تنزيه الله عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الحلال. أن أكل الحرام من موانع إجابة الدعاء. أسباب الإجابة: السفر، رثاثة الهيئة، رفع اليدين، الإلحاح."}, {"s": "hadith", "q": "من أحدث في أمرنا هذا ما ليس منه فهو رد: فائدة عظيمة وضحها.", "a": "هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود، وهو أصل في إبطال البدع والعقود المحرمة."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: من نفّس عن مؤمن كربة.", "a": "الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على القرآن في المساجد. فضل طلب العلم. العمل هو المعتبر لا النسب."}, {"s": "hadith", "q": "وضح المقصود: كن في الدنيا كأنك غريب أو عابر سبيل.", "a": "لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ."}, {"s": "hadith", "q": "بماذا علل الإمام أبو العباس القرطبي عدم ذكر النبي ﷺ الجهاد ضمن أركان الإسلام؟", "a": "لأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، بخلاف الخمسة فهي متعينة على كل مسلم."}, {"s": "hadith", "q": "هل يصح أن يقال: إن الإسلام بني على خمسة؟", "a": "نعم، وردت رواية \"خمسة\" بالهاء في مسلم، ورواية \"خمس\" بغير هاء، وكلاهما صحيح، فالأولى بتقدير أشياء أو أركان، والثانية بتقدير دعائم أو قواعد."}, {"s": "hadith", "q": "كيف تعامل ابن عمر راوي الحديث مع من قدم الحج على الصوم؟ ولماذا؟", "a": "أنكر عليه وقال: لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ. لحرصه على ضبط لفظ النبي ﷺ وترتيبه."}, {"s": "hadith", "q": "حديث \"إياكم ومحدثات الأمور\": من رواه؟ ومن خرجه؟ وما قسما المحدث؟", "a": "الراوي: أبو نجيح العرباض بن سارية. أخرجه: أبو داود والترمذي. القسم الأول: محدث ليس له أصل في الشريعة فهو بدعة. الثاني: محدث يحمل النظير على النظير فليس ببدعة."}, {"s": "hadith", "q": "حديث \"لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به\" تضمن الدلالة على المحبة، وهي ثلاثة أقسام، فما هي؟", "a": "محبة إجلال وعظمة، محبة شفقة ورحمة، محبة استحسان ومشاكلة."}, {"s": "hadith", "q": "حديث \"يا ابن آدم لو بلغت ذنوبك عنان السماء\" تضمن الدلالة على التوبة ولها ثلاثة شروط، فما هي؟", "a": "الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع في حقوق العباد: ردها لأصحابها."}, {"s": "hadith", "q": "اكتب حديث أبي رقية تميم بن أوس الداري كاملاً، وكم عدد الأحاديث التي رويت عنه؟", "a": "قال ﷺ: الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم. رواه مسلم. ولم يرو له في الصحيح غيره، وله في كتب السنة نحو ثمانية عشر حديثاً."}, {"s": "hadith", "q": "من هو الرجل السائل المبهم في حديث: فإنما أهلك الذين من قبلكم كثرة مسائلهم؟", "a": "الأقرع بن حابس، حين سأل: أفي كل عام يا رسول الله؟"}, {"s": "hadith", "q": "اذكر معنى (العلة) الوارد في حديث عمر بن الخطاب (الصادق المصدوق).", "a": "المراد في حديث الأربعين: \"مثل ذلك\" العلقة: الدم الغليظ الجامد، وهي مفرد وجمعها علق."}, {"s": "hadith", "q": "اشرح بسطر: النصيحة لأئمة المسلمين. الإيمان بالملائكة. بني الإسلام على خمس. احفظ الله يحفظك.", "a": "النصيحة للأئمة: معاونتهم على الحق وطاعتهم فيه وتذكيرهم برفق وعدم الخروج عليهم. الإيمان بالملائكة: التصديق بوجودهم وأنهم عباد مكرمون من نور. بني الإسلام على خمس: أركانه كالبناء على دعائم خمس لا يقوم بدونها. احفظ الله: احفظ حدوده يحفظك في دينك ودنياك."}, {"s": "hadith", "q": "أكمل: يطلق اسم أم القرآن على سورة ... ويطلق اسم أم السنة على حديث ... والنصيحة فرض ... والصبر ثلاثة ...", "a": "الفاتحة. إنما الأعمال بالنيات. كفاية. صبر على الطاعة، وعن المعصية، وعلى أقدار الله."}, {"s": "hadith", "q": "في الحديث (ليس عليه أمرنا) أي؟ (فهو رد) أي؟", "a": "ليس عليه أمرنا: ليس عليه حكمنا وديننا. فهو رد: مردود باطل غير معتد به."}]}, "aqeedah": {"name": "العقيدة", "source": "تلخيص بريق الجمان", "notes": "# العقيدة (10 درجات) — تلخيص بريق الجمان (موسى بركة الرشيدي)\n\n## تعريفات\n- **العقيدة لغة**: المعقودة التي عقد عليها القلب وعزم بالقصد البليغ، من العقد. **اصطلاحاً**: الإيمان الجازم بالله تعالى وبما يجب له من التوحيد، والإيمان بملائكته وكتبه ورسله واليوم الآخر والقدر خيره وشره، وما يتفرع عن هذه الأصول.\n- **السنة لغة**: السيرة حسنة أو سيئة. **اصطلاحاً**: عند المحدثين ما أضيف إلى النبي ﷺ من قول وفعل وتقرير، وعند السلف موافقة الكتاب والسنة في العبادات والاعتقادات.\n- **الجماعة**: ستة أقوال: السواد الأعظم، إجماع المجتهدين، الصحابة خاصة، جماعة أهل الإسلام إذا اجتمعوا على أمر، إذا اجتمعوا على أمير، جماعة الحق وأهله.\n- **أهل السنة والجماعة**: أخص الناس بالسنة والجماعة وأكثرهم تمسكاً بها قولاً وعملاً واعتقاداً.\n\n## مصادر العقيدة (سؤال سابق)\n1. القرآن الكريم. 2. السنة النبوية الصحيحة (ويجب قبول خبر الآحاد الصحيح واعتقاده). ما اختُلف فيه فمرده إلى الكتاب والسنة بفهم السلف. أصول الدين توقيفية. لا يجوز تأويل نصوص العقيدة بغير دليل.\n\n## الإيمان\n- **لغة**: الإقرار. **اصطلاحاً**: اعتقاد بالقلب ونطق باللسان وعمل بالأركان.\n- **يشتمل على خمسة**: قول القلب (التصديق)، قول اللسان (الشهادتان)، عمل القلب (النية والإخلاص والمحبة والتوكل)، عمل اللسان (كالتلاوة)، عمل الجوارح (كالركوع والحج).\n- **يزيد بالطاعة وينقص بالمعصية** بإجماع أئمة السنة. الدليل: ﴿فزادهم إيماناً﴾، وحديث \"الإيمان بضع وسبعون شعبة\".\n- **الاستثناء في الإيمان** (سؤال سابق): قول \"أنا مؤمن إن شاء الله\". سؤال \"أمؤمن أنت؟\" بدعة أحدثها المرجئة. إن أراد الشك في أصل إيمانه مُنع. **مسوغات جواز الاستثناء خمسة**: أن الإيمان المطلق شامل لكل ما أمر الله به، أن الإيمان النافع هو المتقبل عند الله، الابتعاد عن تزكية النفس، أن الاستثناء يصح حتى في الأمور المتيقنة، الاستثناء خوفاً من سوء الخاتمة.\n\n## أنواع التوحيد ثلاثة\n1. **توحيد الربوبية**: توحيد الله بأفعاله. دلالاته: الفطرة، الأنفس، الآفاق. لم ينكره إلا شواذ البشر من الملاحدة (الدهرية، الشيوعية).\n2. **توحيد الألوهية**: إفراد الله بجميع أنواع العبادة. ويسمى توحيد العبادة والقصد والإرادة والطلب. من أجله خلق الله الخلق وأرسل الرسل. جحده أكثر الخلق.\n3. **توحيد الأسماء والصفات**: إثبات ما أثبته الله لنفسه أو أثبته له رسوله من صفات الكمال، ونفي ما نفاه. جحده الجهمية والمعتزلة.\n- **علاقة التضمن والاستلزام**: توحيد الألوهية يتضمن توحيد الربوبية، وتوحيد الربوبية يستلزم توحيد الألوهية.\n\n## شهادة أن لا إله إلا الله\n- **معناها**: لا معبود بحق إلا الله. **ركناها**: النفي (نفي الألوهية عن كل ما سوى الله) والإثبات (إثباتها لله).\n- **شروطها سبعة** (سؤال سابق: اذكر أربعة): العلم المنافي للجهل، اليقين المنافي للشك، القبول المنافي للرد، الانقياد المنافي للترك، الصدق المنافي للكذب، الإخلاص المنافي للشرك، المحبة.\n- **نواقضها**: تجتمع في ثلاثة: الشرك الأكبر، الكفر الأكبر، النفاق الاعتقادي.\n\n## العبادة\n- **لغة**: الذل. **اصطلاحاً**: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة. (سؤال سابق: عرّف العبادة)\n- **تتضمن ثلاثة** (سؤال سابق مكرر):\n  - عبادة الله **بالحب فقط**: طريقة منحرفي الزهاد (الصوفية).\n  - عبادة الله **بالرجاء فقط**: طريقة المرجئة.\n  - عبادة الله **بالخوف فقط**: طريقة الخوارج.\n- **من أساليب القرآن في الدعوة إلى توحيد الألوهية**: الأمر بعبادته وترك ما سواه، الإخبار أنه خلق الخلق لعبادته، الإخبار أنه أرسل الرسل بذلك، الاستدلال بانفراده بالربوبية، الاستدلال بانفراده بصفات الكمال.\n\n## طريقة أهل السنة في الأسماء والصفات (سؤال سابق)\n- **في الإثبات**: إثبات ما أثبته الله لنفسه أو رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل.\n  - **التحريف**: تغيير النص لفظاً أو معنى. أقسامه: لفظي يتغير معه المعنى (نصب لفظ الجلالة في \"وكلم اللهَ موسى\")، لفظي لا يتغير معه المعنى (فتح الدال في \"الحمدَ لله\")، معنوي (صرف اللفظ عن ظاهره بلا دليل).\n  - **التعطيل**: إنكار ما يجب لله من الأسماء والصفات. كلي (الجهمية) وجزئي (المعتزلة ينكرون الصفات دون الأسماء).\n  - **التكييف**: حكاية كيفية الصفة. وهو أعم من التمثيل.\n  - **التمثيل**: إثبات مثيل للصفة.\n- **في النفي**: نفي ما نفاه الله عن نفسه مع اعتقاد كمال ضد الصفة المنفية.\n- **فيما لم يرد نفيه ولا إثباته**: التوقف في اللفظ والاستفصال في المعنى.\n- **أقسام الصفات**: ذاتية (العلم، القدرة، الحياة، السمع، البصر، الوجه)، فعلية متعلقة بالمشيئة (المجيء، النزول، الغضب، الفرح)، ذاتية فعلية (الكلام).\n- **القواعد العامة في الأسماء والصفات** (سؤال سابق): (1) القول في الصفات كالقول في الذات. (2) القول في بعض الصفات كالقول في بعضها الآخر. (3) الاتفاق في الأسماء لا يقتضي التساوي في المسميات، ودليله السمع ﴿ليس كمثله شيء﴾ والعقل والحس (الفيل والبعوضة).\n\n## الإيمان بالملائكة (سؤال سابق: اشرح الإيمان بالملائكة)\nالتصديق والإقرار بوجودهم، وأنهم عالم غيبي، عباد مكرمون، خُلقوا من نور. من دلائل شرفهم: إضافتهم إلى الله إضافة تشريف، قرن شهادتهم بشهادته، وصفهم بالكرم والقرب. أفضلهم من شهد بدراً. صفاتهم الخَلقية: عظم الخلق، الأجنحة، الجمال، لا يملون. قدراتهم: التشكل، السرعة، النظام. أعمالهم: تنفيذ أمر الله الكوني وتدبير أمره الديني.\n\n## الإيمان بالكتب\nتصديق جازم بأنها كلام الله. الناس ثلاثة أقسام: كذب بها كلها (الكفار والفلاسفة)، آمن بها كلها (المؤمنون)، آمن ببعض وكفر ببعض (اليهود والنصارى). الإيمان بالكتب السابقة مجمل، وبالقرآن مفصل، وهو كلام الله غير مخلوق منه بدأ وإليه يعود.\n\n## الإيمان بالرسل\n- **الفرق بين النبي والرسول**: النبي من أنبأه الله بخبر ولم يأمره بتبليغه، والرسول من أُمر بالتبليغ. وعند ابن تيمية: الرسول من بعث إلى قوم كافرين بما لا يعرفونه، والنبي إلى قوم مسلمين بما يعرفونه. كل رسول نبي ولا عكس.\n- **أولو العزم خمسة**: نوح وإبراهيم وموسى وعيسى ومحمد. وأفضلهم الخليلان إبراهيم ومحمد. النبوة اصطفاء لا اكتساب.\n- **المعجزة** (سؤال سابق: عرّف المعجزة): أمر خارق للعادة يجريه الله على يد من يختاره لنبوته ليدل على صدقه. أمثلة: ناقة صالح، عصا موسى، إبراء الأكمه والأبرص، القرآن.\n- **وجوه إعجاز القرآن سبعة**: اللفظ، النظم، البلاغة، المعاني التي أمر بها، الإخبار عن الغيب، الإخبار عن المعاد، الدلائل اليقينية.\n- **الفرق بين دلائل النبوة وخوارق السحرة**: أخبار الأنبياء لا تتخلف، السحر معتاد يناله من تعلمه، الأنبياء موحدون والسحرة مشركون، الفطر توافق الأنبياء، الأنبياء يكملون العقول، معجزات الأنبياء من فعل الله.\n- **كرامات الأولياء**: الطوائف ثلاث: أنكرتها الجهمية والمعتزلة، غلت فيها العوام وأهل الضلال، توسط أهل السنة.\n- **عصمة الأنبياء**: إجماع على عصمتهم في التبليغ، وفي المعاصي قولان، والجمهور: معصومون من الكبائر دون الصغائر ولا يُقرّون عليها.\n- **دين الأنبياء واحد**: الإسلام.\n- **خصائص النبي ﷺ عن بقية الرسل** (سؤال سابق مكرر): خاتم النبيين، الشفاعة العظمى (المقام المحمود)، بعثه إلى الإنس والجن، القرآن العظيم، المعراج، \"أعطيت خمساً لم يعطهن أحد قبلي: نصرت بالرعب مسيرة شهر، وجعلت لي الأرض مسجداً وطهوراً، وأحلت لي الغنائم، وأعطيت الشفاعة، وبعثت إلى الناس كافة\".\n- **خصائصه دون أمته**: وجوب قيام الليل، إذا عمل عملاً أثبته، تحريم الزكاة عليه وآله، الوصال في الصوم، الزيادة على أربع، القتال بمكة ساعة، لا يورث، بقاء زوجيته بعد الموت.\n\n## الإيمان باليوم الآخر (سؤال سابق: ما الأمور التي يتضمنها؟)\n- يبدأ من الموت إلى آخر ما يقع يوم القيامة.\n- **أدلة البعث في القرآن**: الإخبار عمن أماتهم ثم أحياهم، الاستدلال بالنشأة الأولى، خلق السماوات أعظم، تنزيهه عن العبث.\n- **أشراط الساعة**: صغرى (قبض العلم، ظهور الجهل، شرب الخمر) وكبرى (الدجال، نزول عيسى، يأجوج ومأجوج، الدابة، خسف بالمشرق، بالمغرب، بجزيرة العرب، طلوع الشمس من مغربها، النار التي تحشر الناس). **تقسيم آخر ثلاثة أقسام** (سؤال سابق): قسم ظهر وانقضى، قسم ظهر ولا يزال يتتابع ويكثر، قسم لم يظهر بعد.\n- **القيامة الصغرى**: (1) الموت. (2) **الروح والنفس** (سؤال سابق: يشتركان في المعنى إلا في شيئين): الروح عين قائمة بنفسها تفارق البدن وتنعم وتعذب. يتحد مدلولهما تارة ويختلف تارة: فالنفس تطلق على الروح، وتطلق على الدم، وعلى الذات كلها، بينما الروح لا تطلق على الدم ولا على ذات الإنسان بجملته، والروح تطلق على القرآن وجبريل بخلاف النفس. (3) فتنة القبر: سؤال الملكين منكر ونكير، والأنبياء لا يفتنون وكذا غير المكلفين على الراجح. السؤال عام للمسلم والكافر على الراجح. **تعلق الروح بالبدن خمسة أنواع**: في بطن الأم، بعد الخروج، في النوم، في البرزخ، يوم البعث. عذاب القبر ونعيمه للروح والبدن، والدليل ﴿يثبت الله الذين آمنوا﴾ وحديث \"إنهما ليعذبان\".\n- **القيامة الكبرى**: البعث والنشور (نفخ إسرافيل)، الحساب، إعطاء الصحائف، وزن الأعمال (ميزان حقيقي له لسان وكفتان)، الحوض (مسيرة شهر، قبل الصراط على الراجح)، الصراط (جسر على متن جهنم أدق من الشعر وأحد من السيف)، الشفاعة، الجنة والنار (مخلوقتان موجودتان الآن).\n- **الشفاعة**: لغة الوسيلة والطلب، عرفاً سؤال الخير للغير. **شرطاها**: إذن الله للشافع، ورضاه عن المشفوع له. **أنواعها للنبي ﷺ**: الشفاعة العظمى لأهل الموقف (خاصة به)، لأهل الجنة أن يدخلوها (خاصة به)، في تخفيف العذاب، فيمن استحق النار ألا يدخلها ومن دخلها أن يخرج. الرد على منكريها: أنها لا تنفع المشركين، والمقصود شفاعة أهل البدع بلا إذن.\n\n## القضاء والقدر\n- **اصطلاحاً**: تقدير الله الأشياء في القدم، وعلمه أنها ستقع في أوقات معلومة، وكتابته لها، ومشيئته لها، وخلقه لها.\n- **الفرق بين القضاء والقدر**: قولان، والأقرب: القدر هو العلم السابق، والقضاء وقوع الخلق على وزن المقدر.\n- **أركان الإيمان بالقدر أربعة**: العلم، الكتابة، المشيئة، الخلق. (علم كتابة مولانا مشيئته... وخلقه وهو إيجاد وتكوين).\n- **أقوال في أفعال العباد**: الجبرية (مجبورون كالورقة في الريح، أشهرهم الجهمية)، المعتزلة (العباد خالقون لأفعالهم)، بعض المتكلمين (الكسب بلا تأثير)، أهل السنة (الله خالق أفعال العباد، والعباد فاعلون لها حقيقة بقدرة وإرادة خاضعة لمشيئة الله).\n- **الاحتجاج بالقدر على المعاصي** لا يجوز، ويسوغ عند المصائب لا المعائب (قصة آدم وموسى).\n\n## نواقض الإيمان\n- **منهج أهل السنة وسط بين**: الخوارج (يغالون في التكفير) والمرجئة (الإيمان في القلب ولا يضر معه معصية).\n- **الشرك الأكبر**: أن يتخذ العبد لله نداً يسويه به في ربوبيته أو ألوهيته أو أسمائه وصفاته. أعظم الذنوب. آثاره: لا يغفر بلا توبة، خروج من الملة، لا يقبل معه عمل، تحرم الجنة.\n- **أقسام الشرك الأكبر**: في الربوبية (شرك النصارى، القدرية، عبّاد القبور، الاستسقاء بالنجوم)، في الألوهية (اعتقاد شريك أو صرف عبادة لغير الله)، في الحكم (اعتقاد أن غير حكم الله أفضل أو مثله، جواز الحكم بغيره، وضع تشريع مخالف)، في الأسماء والصفات.\n- **وسائل الشرك الأكبر**: الغلو في الصالحين، التبرك الممنوع (شركي وبدعي: التمسح بالصالحين، تقبيل القبور، التبرك بالأشجار والأحجار والأماكن بلا دليل)، رفع القبور وبناء المساجد عليها.\n- **الشرك الأصغر**: في العبادات القلبية (الرياء، العمل لمصلحة دنيوية، الاعتماد على الأسباب، التطير)، في الأفعال (الرقى الشركية، التمائم)، في الأقوال (الحلف بغير الله، التشريك بالواو \"ما شاء الله وشئت\").\n- **الرقى**: شرعية (من الكتاب والسنة) ومحرمة (إن اعتمد عليها كسبب فشرك أصغر، وإن اعتقد أنها تنفع بذاتها فأكبر).\n- **صح أو خطأ** (سؤال سابق): لبس الحلقة والخيط لرفع البلاء: شرك. أكل الربا والرشوة: كبيرة وليس شركاً. عقوق الوالدين: كبيرة. التبرك بالأشجار والأحجار: شرك. الاستسقاء بالأنواء: شرك (أصغر إن اعتقدها سبباً، أكبر إن اعتقدها فاعلة).\n- **الكفر**: لغة الستر، اصطلاحاً نقيض الإيمان. **الفرق بين الأكبر والأصغر**: الأكبر مخرج من الملة ويبيح الدم والمال ويخلد في النار ويوجب العداوة، والأصغر لا.\n- **أقسام الكفر باعتبار بواعثه خمسة** (سؤال سابق): كفر التكذيب، كفر الإباء والاستكبار (إبليس)، كفر الإعراض، كفر الشك، كفر النفاق. وباعتبار الأصل: أصلي وردة.\n- **تكفير المعين والمطلق**: المطلق إطلاق الكفر على الفعل أو القول، والمعين وصف شخص بعينه بالكفر ولا يجوز إلا بشروط وانتفاء موانع. الشيء قد يكون كفراً وفاعله لا يكفر.\n- **شروط تكفير المعين** (سؤال سابق مكرر): أن يظهر عليه قول أو فعل يدل على المعنى الكفري ويلتزمه، قيام الحجة ووضوحها. **الموانع**: الجهل، التأويل، الإكراه. (وفي بعض الشروح: الخطأ).\n- **النفاق**: لغة مخالفة الظاهر للباطن، اصطلاحاً إظهار الإيمان وإبطان الكفر. اعتقادي (أكبر، في الدرك الأسفل) وعملي (لا يخرج من الملة).\n- **البدعة**: لغة الإنشاء، اصطلاحاً ما خالف الكتاب والسنة والإجماع من الاعتقادات والعبادات. مكفّرة (كالرجعة) ومفسّقة (كبدع الخوارج). حقيقية (لا أصل لها) وإضافية.\n\n## عقيدة أهل السنة وسط في خمسة أصول (سؤال سابق)\n1. في العبادات (بين الغلاة والجفاة). 2. في الأسماء والصفات (بين المعطلة والممثلة). 3. في القضاء والقدر (بين الجبرية والقدرية). 4. في الوعد والوعيد وأسماء الإيمان (بين الخوارج والمرجئة). 5. في الصحابة (بين الروافض والنواصب).\n\n## \"ذو مرة فاستوى\" (سؤال سابق)\nالمقصود جبريل عليه السلام، وذو مرة: ذو قوة وخلق حسن وجمال.\n", "questions": [{"s": "aqeedah", "q": "عبدوا الله بالحب فقط؟ بالرجاء فقط؟ بالخوف فقط؟", "a": "بالحب فقط: منحرفو الزهاد (الصوفية). بالرجاء فقط: المرجئة. بالخوف فقط: الخوارج."}, {"s": "aqeedah", "q": "اذكر أربعة من شروط لا إله إلا الله.", "a": "العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، المحبة (سبعة)."}, {"s": "aqeedah", "q": "النفس والروح يشتركان في المعنى إلا في شيئين، اذكرهما.", "a": "النفس تطلق على الدم وعلى ذات الإنسان بجملته، ولا تطلق الروح على ذلك. والروح تطلق على جبريل والقرآن ولا تطلق النفس على ذلك."}, {"s": "aqeedah", "q": "اذكر القواعد العامة في الأسماء والصفات.", "a": "القول في الصفات كالقول في الذات. القول في بعض الصفات كالقول في بعضها الآخر. الاتفاق في الأسماء لا يقتضي التساوي في المسميات."}, {"s": "aqeedah", "q": "ما شروط تكفير المعين وما الموانع؟", "a": "الشروط: ظهور قول أو فعل كفري يلتزمه، وقيام الحجة ووضوحها. الموانع: الجهل، التأويل، الإكراه، الخطأ."}, {"s": "aqeedah", "q": "اذكر طريقة أهل السنة والجماعة في إثبات صفات الله.", "a": "إثبات ما أثبته الله لنفسه أو أثبته رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل، ونفي ما نفاه مع اعتقاد كمال الضد، والتوقف فيما لم يرد."}, {"s": "aqeedah", "q": "من المقصود بـ (ذو مرة فاستوى)؟", "a": "جبريل عليه السلام، وذو مرة: ذو قوة وخلق حسن."}, {"s": "aqeedah", "q": "ما هي مصادر العقيدة؟", "a": "القرآن الكريم والسنة النبوية الصحيحة، بفهم سلف الأمة، ويقبل خبر الآحاد الصحيح."}, {"s": "aqeedah", "q": "اذكر خصائص النبي ﷺ عن بقية الرسل.", "a": "خاتم النبيين، الشفاعة العظمى، بعثه إلى الإنس والجن، القرآن، المعراج، نصر بالرعب مسيرة شهر، جعلت له الأرض مسجداً وطهوراً، أحلت له الغنائم، بعث إلى الناس كافة."}, {"s": "aqeedah", "q": "عرّف المعجزة والعبادة.", "a": "المعجزة: أمر خارق للعادة يجريه الله على يد من يختاره لنبوته ليدل على صدقه. العبادة: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة."}, {"s": "aqeedah", "q": "مسوغات جواز الاستثناء في الإيمان خمسة، اذكرها.", "a": "أنه لا يدعي أحد الإيمان المطلق الكامل. أن الإيمان النافع هو المتقبل عند الله. البعد عن تزكية النفس. أن الاستثناء يصح في الأمور المتيقنة. الخوف من سوء الخاتمة."}, {"s": "aqeedah", "q": "ينقسم الكفر إلى خمسة أقسام باعتبار بواعثه، اذكرها.", "a": "كفر التكذيب، كفر الإباء والاستكبار، كفر الإعراض، كفر الشك، كفر النفاق."}, {"s": "aqeedah", "q": "عقيدة أهل السنة والجماعة وسط في خمسة أصول، اذكرها.", "a": "العبادات، الأسماء والصفات، القضاء والقدر، الوعد والوعيد (الإيمان)، الصحابة."}, {"s": "aqeedah", "q": "قسّم بعض العلماء أشراط الساعة من حيث ظهورها إلى ثلاثة أقسام، فما هي؟", "a": "قسم ظهر وانقضى، قسم ظهر ولا يزال يتتابع ويكثر، قسم لم يظهر بعد."}, {"s": "aqeedah", "q": "ما الأمور التي يتضمنها الإيمان باليوم الآخر؟ اشرح اثنين.", "a": "فتنة القبر وعذابه ونعيمه، البعث، الحشر، الحساب، الصحائف، الميزان، الحوض، الصراط، الشفاعة، الجنة والنار. الميزان: ميزان حقيقي له كفتان توزن به الأعمال. الصراط: جسر على متن جهنم يمر عليه الناس على قدر أعمالهم."}, {"s": "aqeedah", "q": "ضع صح أو خطأ: لبس الحلقة والخيط لرفع البلاء شرك. أكل الربا والرشوة شرك. عقوق الوالدين شرك. التبرك بالأشجار والأحجار شرك. الاستسقاء بالأنواء شرك.", "a": "صح. خطأ (كبيرة). خطأ (كبيرة). صح. صح."}, {"s": "aqeedah", "q": "ما أصول العقيدة الإسلامية؟ مدللاً بدليل.", "a": "الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر خيره وشره. الدليل حديث جبريل: أن تؤمن بالله وملائكته وكتبه ورسله واليوم الآخر وتؤمن بالقدر خيره وشره."}, {"s": "aqeedah", "q": "ما أنواع التوحيد؟ وما علاقة التضمن والاستلزام؟", "a": "الربوبية، الألوهية، الأسماء والصفات. توحيد الألوهية يتضمن الربوبية، والربوبية تستلزم الألوهية."}, {"s": "aqeedah", "q": "ما أركان الإيمان بالقدر؟", "a": "العلم، الكتابة، المشيئة، الخلق."}, {"s": "aqeedah", "q": "ما الفرق بين الكفر الأكبر والأصغر؟", "a": "الأكبر مخرج من الملة ويبيح الدم والمال ويخلد في النار ويوجب العداوة، والأصغر محبط للعمل الذي قارنه ولا يخرج من الملة."}, {"s": "aqeedah", "q": "ما أنواع الشفاعة التي أعطيها النبي ﷺ وما شروطها؟", "a": "الشروط: إذن الله للشافع ورضاه عن المشفوع له. الأنواع: العظمى لأهل الموقف، لأهل الجنة أن يدخلوها، في تخفيف العذاب، فيمن استحق النار ألا يدخلها ومن دخلها أن يخرج."}]}, "nahw": {"name": "النحو", "source": "مراجعة مركزة", "notes": "# النحو (10 درجات) — مراجعة سريعة لمعلم النحو\n\nالأسئلة السابقة: أنواع المخفوضات، المبني للمجهول، أنواع الجمل مع المثال. النمط: \"اذكر\" و\"مثّل\" و\"أعرب\".\n\n## أقسام الكلام\nاسم، فعل، حرف. **علامات الاسم**: الخفض، التنوين، دخول أل، حروف الخفض. **علامات الفعل**: قد، السين، سوف، تاء التأنيث الساكنة. **الحرف**: ما لا يصلح معه دليل الاسم ولا الفعل.\n\n## الإعراب والبناء\n- **الإعراب**: تغيير أواخر الكلم لاختلاف العوامل الداخلة عليها لفظاً أو تقديراً. أقسامه: رفع، نصب، خفض، جزم. للأسماء رفع ونصب وخفض ولا جزم، وللأفعال رفع ونصب وجزم ولا خفض.\n- **علامات الرفع أربع**: الضمة (الأصل)، الواو (جمع المذكر السالم والأسماء الخمسة)، الألف (المثنى)، النون (الأفعال الخمسة).\n- **علامات النصب خمس**: الفتحة، الألف (الأسماء الخمسة)، الكسرة (جمع المؤنث السالم)، الياء (المثنى وجمع المذكر)، حذف النون (الأفعال الخمسة).\n- **علامات الخفض ثلاث**: الكسرة، الياء (الأسماء الخمسة والمثنى وجمع المذكر)، الفتحة (الممنوع من الصرف).\n- **علامات الجزم**: السكون، الحذف (حذف حرف العلة، حذف النون).\n- **المبني**: الحروف كلها، الفعل الماضي، فعل الأمر، المضارع المتصل بنون النسوة أو نون التوكيد، الضمائر، أسماء الإشارة (إلا المثنى)، الأسماء الموصولة (إلا المثنى)، أسماء الاستفهام والشرط، بعض الظروف.\n\n## المرفوعات سبعة\n1. **الفاعل**: اسم مرفوع مذكور قبله فعله. ظاهر ومضمر.\n2. **نائب الفاعل (المفعول الذي لم يسم فاعله)** ★: اسم مرفوع لم يذكر معه فاعله. **المبني للمجهول** ★: إن كان الفعل ماضياً ضم أوله وكسر ما قبل آخره (ضُرِبَ، كُتِبَ)، وإن كان مضارعاً ضم أوله وفتح ما قبل آخره (يُضْرَبُ، يُكْتَبُ). الماضي الأجوف: قِيلَ، بِيعَ. الماضي المبدوء بتاء: تُعُلِّمَ. نائب الفاعل: المفعول به، أو الجار والمجرور، أو الظرف، أو المصدر.\n3. **المبتدأ**: اسم مرفوع عارٍ عن العوامل اللفظية. 4. **الخبر**: الاسم المرفوع المسند إليه. مفرد، وغير مفرد (جار ومجرور، ظرف، فعل مع فاعله، مبتدأ مع خبره).\n5. **اسم كان وأخواتها** (كان، أمسى، أصبح، أضحى، ظل، بات، صار، ليس، ما زال، ما انفك، ما فتئ، ما برح، ما دام): ترفع الاسم وتنصب الخبر.\n6. **خبر إن وأخواتها** (إن، أن، لكن، كأن، ليت، لعل): تنصب الاسم وترفع الخبر.\n7. **التابع للمرفوع**: النعت، العطف، التوكيد، البدل.\n- **ظن وأخواتها**: تنصب المبتدأ والخبر مفعولين (ظننت، حسبت، خلت، زعمت، رأيت، علمت، وجدت، اتخذت، جعلت، سمعت).\n\n## المنصوبات خمسة عشر\nالمفعول به، المصدر (المفعول المطلق)، ظرف الزمان، ظرف المكان، الحال، التمييز، المستثنى، اسم لا النافية للجنس، المنادى، المفعول من أجله، المفعول معه، خبر كان وأخواتها، اسم إن وأخواتها، مفعولا ظن، التابع للمنصوب.\n- **الحال**: اسم منصوب مفسر لما انبهم من الهيئات، نكرة، صاحبه معرفة. \"جاء زيد راكباً\".\n- **التمييز**: اسم منصوب مفسر لما انبهم من الذوات. \"طاب محمد نفساً\"، \"عشرون درهماً\".\n- **الاستثناء**: أدواته إلا، غير، سوى، خلا، عدا، حاشا. المستثنى بإلا ينصب إذا كان الكلام تاماً موجباً، وإن كان تاماً منفياً جاز البدل والنصب، وإن كان ناقصاً فعلى حسب العوامل.\n- **لا النافية للجنس**: تنصب النكرة بلا تنوين إذا باشرتها. \"لا رجلَ في الدار\".\n- **المنادى خمسة**: المفرد العلم والنكرة المقصودة يبنيان على الضم، والنكرة غير المقصودة والمضاف والشبيه بالمضاف تنصب.\n\n## المخفوضات ثلاثة ★ (سؤال سابق)\n1. **مخفوض بالحرف**: بحروف الجر (من، إلى، عن، على، في، رب، الباء، الكاف، اللام، حروف القسم الواو والباء والتاء، مذ ومنذ). \"مررت بزيدٍ\".\n2. **مخفوض بالإضافة**: ما يقدر باللام (\"غلام زيد\")، أو بمن (\"ثوب خز\")، أو بفي (\"مكر الليل\").\n3. **تابع للمخفوض**: النعت والعطف والتوكيد والبدل.\n\n## أنواع الجمل ★ (سؤال سابق)\n- **الجملة الاسمية**: تبدأ باسم: \"الصلاةُ نورٌ\".\n- **الجملة الفعلية**: تبدأ بفعل: \"قامَ زيدٌ\".\n- **الجملة التي لها محل من الإعراب سبع**: الواقعة خبراً، حالاً، مفعولاً به (مقول القول)، مضافاً إليه، جواباً لشرط جازم مقترناً بالفاء أو إذا، صفة، التابعة لجملة لها محل.\n- **الجملة التي لا محل لها من الإعراب سبع**: الابتدائية، الاستئنافية، الاعتراضية، التفسيرية، جواب القسم، جواب الشرط غير الجازم، صلة الموصول، التابعة لما لا محل له.\n- **شبه الجملة**: الجار والمجرور والظرف.\n\n## نواصب المضارع وجوازمه\n- **النواصب عشرة**: أن، لن، إذن، كي، لام كي، لام الجحود، حتى، الجواب بالفاء والواو، أو.\n- **الجوازم ثمانية عشر**: لم، لما، ألم، ألما، لام الأمر والدعاء، لا في النهي والدعاء، إن، ما، من، مهما، إذما، أي، متى، أيان، أين، أنى، حيثما، كيفما، إذا في الشعر.\n\n## نماذج إعراب متوقعة\n- \"إنما الأعمالُ بالنياتِ\": إنما: كافة ومكفوفة. الأعمال: مبتدأ مرفوع بالضمة. بالنيات: جار ومجرور متعلق بخبر محذوف.\n- \"بُني الإسلامُ على خمسٍ\": بني: فعل ماض مبني للمجهول. الإسلام: نائب فاعل مرفوع. على خمس: جار ومجرور.\n- \"الدينُ النصيحةُ\": مبتدأ وخبر.\n- \"لا تحاسدوا\": لا: ناهية جازمة. تحاسدوا: فعل مضارع مجزوم بحذف النون، والواو فاعل.\n- \"إن الله طيبٌ لا يقبل إلا طيباً\": إن: حرف توكيد ونصب. الله: اسم إن منصوب. طيب: خبر إن مرفوع. لا يقبل: جملة فعلية في محل رفع خبر ثان. إلا: أداة استثناء ملغاة. طيباً: مفعول به منصوب.\n- \"كن في الدنيا كأنك غريبٌ\": كن: فعل أمر ناقص، اسمه ضمير مستتر أنت. في الدنيا: جار ومجرور متعلق بخبر كن. كأنك: حرف تشبيه ونصب والكاف اسمها. غريب: خبر كأن.\n", "questions": [{"s": "nahw", "q": "اذكر أنواع المخفوضات.", "a": "ثلاثة: مخفوض بالحرف، مخفوض بالإضافة، تابع للمخفوض (نعت، عطف، توكيد، بدل)."}, {"s": "nahw", "q": "ما المبني للمجهول؟ وكيف يبنى الفعل له؟", "a": "فعل حذف فاعله وأنيب عنه المفعول به. الماضي: يضم أوله ويكسر ما قبل آخره (كُتِبَ). المضارع: يضم أوله ويفتح ما قبل آخره (يُكْتَبُ)."}, {"s": "nahw", "q": "اذكر الجمل في اللغة العربية مع المثال.", "a": "اسمية: الصلاة نور. فعلية: قام زيد. ولها محل من الإعراب: الخبر، الحال، المفعول به، المضاف إليه، جواب الشرط الجازم، الصفة. ولا محل لها: الابتدائية، الاستئنافية، الاعتراضية، التفسيرية، جواب القسم، صلة الموصول."}, {"s": "nahw", "q": "ما علامات الرفع والنصب والخفض والجزم؟", "a": "الرفع: الضمة، الواو، الألف، النون. النصب: الفتحة، الألف، الكسرة، الياء، حذف النون. الخفض: الكسرة، الياء، الفتحة. الجزم: السكون، الحذف."}, {"s": "nahw", "q": "ما المرفوعات من الأسماء؟", "a": "سبعة: الفاعل، نائب الفاعل، المبتدأ، الخبر، اسم كان، خبر إن، التابع للمرفوع."}, {"s": "nahw", "q": "ما الفرق بين الحال والتمييز؟", "a": "الحال يفسر ما انبهم من الهيئات (جاء زيد راكباً)، والتمييز يفسر ما انبهم من الذوات (طاب زيد نفساً). وكلاهما نكرة منصوب."}, {"s": "nahw", "q": "أعرب: إنما الأعمال بالنيات.", "a": "إنما: كافة ومكفوفة. الأعمال: مبتدأ مرفوع بالضمة. بالنيات: جار ومجرور متعلق بخبر محذوف."}, {"s": "nahw", "q": "أعرب: بُني الإسلام على خمس.", "a": "بني: فعل ماض مبني للمجهول. الإسلام: نائب فاعل مرفوع. على خمس: جار ومجرور."}, {"s": "nahw", "q": "ما أحكام المستثنى بإلا؟", "a": "إن كان الكلام تاماً موجباً وجب النصب. إن كان تاماً منفياً جاز البدل والنصب. إن كان ناقصاً فعلى حسب العوامل."}, {"s": "nahw", "q": "ما أقسام المنادى؟", "a": "خمسة: المفرد العلم والنكرة المقصودة (مبنيان على الضم)، والنكرة غير المقصودة والمضاف والشبيه بالمضاف (منصوبة)."}]}, "tafsir": {"name": "التفسير", "source": "مختصر زبدة التفسير، جزء عم", "notes": "# التفسير (4 درجات) — مختصر زبدة التفسير، جزء عم\n\nنمط الأسئلة: معنى كلمة، سبب نزول، من المراد بالآية، اختيار من متعدد. الكلمات المكررة في الاختبارات السابقة معلّمة بـ ★.\n\n## الكلمات التي وردت في الاختبارات السابقة ★\n| الكلمة | السورة | المعنى |\n|---|---|---|\n| مرقوم ★ | المطففين | مكتوب، مسطور |\n| وقب ★ | الفلق | دخل وأقبل (الليل إذا أظلم) |\n| العهن ★ | القارعة | الصوف الملون |\n| مبثوث ★ | القارعة | منتشر متفرق |\n| كبد ★ | البلد | مشقة وتعب |\n| جيدها ★ | المسد | عنقها |\n| الرادفة ★ | النازعات | النفخة الثانية التي يكون عندها البعث |\n| الراجفة ★ | النازعات | النفخة الأولى التي يموت بها الخلائق |\n| كنود ★ | العاديات | كفور للنعمة |\n| لحب الخير لشديد ★ | العاديات | لحب المال قوي |\n| عصف مأكول ★ | الفيل | ورق الزرع إذا أكلته الدواب |\n| نجاباً ★ | النبأ | منصباً بكثرة |\n| دحاها ★ | النازعات | بسطها |\n| رسول كريم ★ (التكوير) | التكوير | جبريل عليه السلام |\n| التطفيف ★ | المطففين | النقص من الكيل أو الوزن |\n| جواب القسم في \"والسماء والطارق\" ★ | الطارق | \"إن كل نفس لما عليها حافظ\" |\n| \"فقال لهم رسول الله\" ★ | الشمس | صالح عليه السلام |\n| على الأرائك ينظرون ★ | المطففين | الموضع الأول: الأبرار في الجنة على الأسرة ينظرون إلى النعيم. الموضع الثاني: المؤمنون ينظرون إلى الكفار في النار ويضحكون منهم |\n| فيها كتب قيمة ★ | البينة | آيات وأحكام مستقيمة لا عوج فيها |\n| ذو مرة ★ | النجم | جبريل، ذو قوة وجمال |\n\n## أسباب النزول\n- **عم**: لما بعث النبي ﷺ وأخبرهم بالتوحيد والبعث جعلوا يتساءلون: ماذا حصل لمحمد؟\n- **عبس**: كان النبي ﷺ مع قوم من قريش يطمع في إسلامهم، فأقبل عبدالله بن أم مكتوم الأعمى، فكره أن يقطع كلامه فأعرض عنه.\n- **المطففين**: لما قدم النبي ﷺ المدينة كانوا من أخبث الناس كيلاً.\n- **الليل** \"فسنيسره لليسرى\" و\"وسيجنبها الأتقى\" ★: أبو بكر الصديق لما اشترى ستة عبيد مؤمنين وأعتقهم. والآية حكمها عام (سؤال سابق).\n- **الضحى**: مرض النبي ﷺ فلم يقم لليل ليلتين أو ثلاثاً، فقالت امرأة: ما أرى شيطانك إلا قد تركك.\n- **العلق**: أول ما نزل. \"أرأيت الذي ينهى\": أبو جهل. \"عبداً إذا صلى\": محمد ﷺ. \"فليدع ناديه\": قال أبو جهل: أتهددني وأنا أكثر أهل الوادي نادياً.\n- **الكوثر**: لما مات ابن النبي ﷺ قال أحد المشركين: إنه أبتر.\n- **الكافرون**: سأل الكفار النبي ﷺ أن يعبد آلهتهم سنة ويعبدوا إلهه سنة. تكرار الآيات: للتأكيد وقطع أطماع الكفار.\n- **النصر**: تسمى سورة التوديع. قال النبي ﷺ لما نزلت: \"نُعيت إليّ نفسي\".\n- **الإخلاص**: قال المشركون: اذكر لنا نسب ربك. فضلها: تعدل ثلث القرآن (حديث أبي سعيد في البخاري) ★.\n- **المسد**: أبو لهب اسمه عبد العزى، امرأته أم جميل بنت حرب أخت أبي سفيان، حمالة الحطب: تحمل الشوك وتطرحه في طريق النبي ﷺ.\n- **قريش**: تسمى سورة الإيلاف. رحلة الشتاء إلى اليمن والصيف إلى الشام.\n\n## معاني الكلمات بترتيب السور\n**النبأ**: النبأ العظيم: الخبر الهائل. مهاداً: فراشاً. أوتاداً: لتسكن الأرض. سباتاً: انقطاعاً عن الحركة. سبعاً شداداً: سبع سماوات قوية. سراجاً وهاجاً: الشمس. المعصرات: السحاب. ثجاجاً: منصباً بكثرة. يوم الفصل: لأن الله يفصل بين خلقه. الصور: القرن. أفواجاً: زمراً. مآباً: مرجعاً. أحقاباً: الزمن الطويل. حميماً: الماء الحار. غساقاً: صديد أهل النار. أتراباً: متساويات في السن. كأساً دهاقاً: مملوءة. لغواً: الكلام الباطل. الروح: جبريل. صواباً: شهد بالتوحيد.\n\n**النازعات**: النازعات: الملائكة تنزع الروح. غرقاً: من أقصى الجسد. نشطاً: الجذب بقوة. السابحات: الملائكة تسبح في السماء. السابقات: تسبق لتنفيذ أمر الله. واجفة: قلقة. زجرة واحدة: النفخة الثانية. الساهرة: أرض بيضاء يحاسب الله عليها الخلائق. طوى: الوادي في جبل سيناء. تزكى: تطهر من الشرك. الآية الكبرى: العصا. رفع سمكها: جعلها كالبناء المرتفع. الطامة الكبرى: النفخة الثانية. طغى: جاوز الحد. أيان مرساها: متى وقوعها.\n\n**عبس**: عبس: كلح بوجهه. الذكرى: الموعظة. تلهى: تتشاغل. مر
