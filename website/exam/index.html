السنة على وجوب الأمر بالمعروف والنهي عن المنكر، وهو أيضاً من النصيحة التي هي الدين**.\n- وأما قوله تعالى (عليكم أنفسكم لا يضركم من ضل إذا اهتديتم) **فليس مخالفاً لما ذكرنا؛ لأن المذهب الصحيح عند المحققين في معنى الآية: أنكم إذا فعلتم ما كلفتم به لا يضركم تقصير غيركم**، مثل قوله (ولا تزر وازرة وزر أخرى)؛ فإذا كان كذلك **فمما كُلّف به المسلم الأمر بالمعروف والنهي عن المنكر، فإذا فعله ولم يمتثل المخاطب فلا عتب عليه بعد ذلك، فإنما عليه الأمر والنهي لا القبول**.\n- **الأمر بالمعروف والنهي عن المنكر فرض كفاية، إذا قام به من يكفي سقط عن الباقي، وإذا تركه الجميع أثم كل من تمكن منه بلا عذر. ثم قد يتعين: إذا كان في موضع لا يعلم به إلا هو، أو لا يتمكن من إزالته إلا هو**، وكمن يرى زوجته أو ولده أو غلامه على منكر ويقصر.\n- قال العلماء: **ولا يسقط الأمر بالمعروف والنهي عن المنكر لكونه لا يُقبل في ظنه، بل يجب عليه فعله**، قال الله تعالى (وذكّر فإن الذكرى تنفع المؤمنين)، وقال (ما على الرسول إلا البلاغ).\n- **ولا يُشترط في الآمر بالمعروف والناهي عن المنكر أن يكون كامل الحال ممتثلاً ما يأمر به مجتنباً ما ينهى عنه**، بل عليه الأمر وإن كان مرتكباً خلاف ذلك؛ لأنه **يجب عليه شيئان: أن يأمر نفسه وينهاها، وأن يأمر غيره وينهاه، فإذا أخل بأحدهما لا يسقط عنه الآخر**.\n- **ولا يختص الأمر بالمعروف والنهي عن المنكر بأصحاب الولاية، بل ذلك ثابت لآحاد المسلمين**. وإنما يأمر وينهى من كان عالماً بما يأمر به وينهى عنه: فإن كان من الأمور الظاهرة مثل الصلاة والصوم والزنا وشرب الخمر ونحو ذلك **فكل المسلمين علماء بها**، وإن كان من دقائق الأفعال والأقوال وما يتعلق بالاجتهاد **لم يكن للعوام فيه مدخل، بل ذلك للعلماء**.\n- **والعلماء إنما ينكرون ما أجمع عليه، أما المختلف فيه فلا إنكار فيه**؛ لأن على أحد المذهبين: أن **كل مجتهد مصيب** وهو المختار عند كثير من المحققين، وعلى المذهب الآخر: أن **المصيب واحد والمخطئ غير متعين لنا، والإثم موضوع عنه**؛ لكن على جهة النصيحة للخروج من الخلاف **فهو حسن مندوب إلى فعله برفق**.\n- قال النووي: **باب الأمر بالمعروف والنهي عن المنكر قد ضيّع أكثره من أزمان متطاولة، ولم يبق منه في هذه الأزمان إلا رسوم قليلة جداً، وهو باب عظيم به قوام الأمر وملاكه، وإذا كثر الخبث عمّ العقاب الصالح والطالح، وإذا لم يأخذوا على يد الظالم أوشك أن يعمهم الله بعذاب**.\n- **وينبغي للآمر بالمعروف والناهي عن المنكر أن يكون من ذلك برفق ليكون أقرب إلى تحصيل المقصود**، فقد قال الإمام **الشافعي**: «**من وعظ أخاه سراً فقد نصحه وزانه، ومن وعظه علانية فقد فضحه وشانه**».\n- **ومما يتساهل الناس فيه من هذا الباب**: ما إذا رأوا إنساناً يبيع متاعاً أو حيواناً فيه عيب ولا يبيّنه فلا ينكرون ذلك ولا يعرّفون المشتري بعيبه، **وهم مسئولون عن ذلك فإن الدين النصيحة، ومن لم ينصح فقد غشّ**.\n- (فإن لم يستطع فبقلبه) معناه: **فلينكر بقلبه، وليس ذلك بإزالة وتغيير، لكنه هو الذي في وسعه**. و(ذلك أضعف الإيمان) معناه: **أقلّه ثمرة**. وجاء في رواية أخرى: (وليس وراء ذلك من الإيمان حبة خردل) أي **لم يبق وراء ذلك مرتبة أخرى، والإيمان في هذا الحديث بمعنى الإسلام**.\n- **وليس للآمر بالمعروف والناهي عن المنكر البحث والتفتيش والتجسس واقتحام الدور بالظنون، بل إن عثر على منكر غيّره**. وقال **الماوردي**: ليس له أن يقتحم ويتجسس إلا أن يخبره من يثق بقوله أن رجلاً خلا برجل ليقتله أو امرأة ليزني بها، **فيجوز له في مثل هذه الحال أن يتجسس ويقدم على الكشف والبحث حذراً من فوات ما لا يستدركه**.\n- **وفي هذا الحديث دليل على أن من خاف القتل أو الضرب سقط عنه التغيير، وهو مذهب المحققين سلفاً وخلفاً. وذهبت طائفة من الغلاة إلى أنه لا يسقط وإن خاف ذلك**.\n\n## الحديث الخامس والثلاثون: لا تحاسدوا\n\n- **الراوي**: أبو هريرة رضي الله عنه. **التخريج**: **رواه مسلم**.\n- **المتن**: «لاَ تَحَاسَدُوا، وَلاَ تَنَاجَشُوا، وَلاَ تَبَاغَضُوا، وَلاَ تَدَابَرُوا، وَلاَ يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللهِ إِخْوَاناً. المُسْلِمُ أَخُو المُسْلِمِ: لاَ يَظْلِمُهُ وَلاَ يَخْذُلُهُ وَلاَ يَكْذِبُهُ وَلاَ يَحْقِرُهُ. التَّقْوَى هَهُنَا — ويشير إلى صدره ثلاث مرات — بِحَسْبِ امْرِئٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ المُسْلِمَ. كُلُّ المُسْلِمِ عَلَى المُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ».\n- (لا تحاسدوا): **الحسد: تمني زوال النعمة، وهو حرام**. وفي حديث آخر: «إياكم والحسد فإن الحسد يأكل الحسنات كما تأكل النار الحطب أو الخشب».\n- **وأما الغبطة فهي تمني حال المغبوط من غير أن يريد زوالها عنه**، وقد يوضع الحسد موضع الغبطة لتقاربهما، كما قال النبي صلى الله عليه وسلم: «لا حسد إلا في اثنتين» أي **لا غبطة** — وهو متفق عليه من حديث ابن مسعود.\n- (ولا تناجشوا): **أصل النجش: الختل، وهو الخداع؛ ومنه قيل للصائد «ناجش» لأنه يختل الصيد ويحتال له**.\n- (ولا تباغضوا): أي **لا تتعاطوا أسباب التباغض**، لأن الحب والبغض معان قلبية لا قدرة للإنسان على اكتسابها ولا يملك التصرف فيها، كما قال صلى الله عليه وسلم: «هذا قسمي فيما أملك فلا تؤاخذني فيما تملك ولا أملك» يعني: **الحب والبغضاء**.\n- (والتدابر): **المعاداة، وقيل المقاطعة**، لأن كل واحد منهما يولّي صاحبه دبره.\n- (ولا يبع بعضكم على بيع بعض): معناه **أن يقول لمن اشترى سلعة في مدة الخيار: افسخ هذا البيع وأنا أبيعك مثله أو أجود منه بثمنه**، أو يكون المتبايعان قد تقرر الثمن بينهما وتراضيا به ولم يبق إلا العقد، فيزيد عليه أو يعطيه بأنقص. **وهذا حرام بعد استقرار الثمن، وأما قبل الرضى فليس بحرام**.\n- (وكونوا عباد الله إخواناً): أي **تعاملوا وتعاشروا معاملة الإخوة ومعاشرتهم في المودة والرفق والشفقة والملاطفة والتعاون في الخير مع صفاء القلوب والنصيحة بكل حال**.\n- (المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره): **الخذلان: ترك الإعانة والنصرة**، ومعناه: **إذا استعان به في دفع ظالم أو نحوه لزمه إعانته إذا أمكنه ولم يكن له عذر شرعي**.\n- (ولا يحقره) هو **بالحاء المهملة والقاف**: أي **لا يتكبر عليه ويستصغره**، قاله القاضي عياض. ورواه بعضهم بضم الياء وبالخاء المعجمة وبالفاء: أي **لا يغدر بعهده ولا ينقض أيمانه**. **والصواب المعروف هو الأول**.\n- (التقوى ههنا) ويشير إلى صدره ثلاث مرات. وفي رواية: «**إن الله لا ينظر إلى أجسادكم ولا إلى صوركم ولكن ينظر إلى قلوبكم**» ومعناه: **أن الأعمال الظاهرة لا تحصل التقوى، وإنما تقع التقوى بما في القلب من عظمة الله تعالى وخشيته ومراقبته، ونظر الله تعالى أي رؤيته محيطة بكل شيء. ومعنى الحديث: مجازاته ومحاسبته، وأن الاعتبار في هذا كله بالقلب**.\n- (بحسب امرئ من الشر أن يحقر أخاه المسلم) **فيه تحذير عظيم من ذلك**؛ لأن الله تعالى لم يحقره إذ خلقه ورزقه ثم أحسن تقويم خلقه وسخّر ما في السموات وما في الأرض جميعاً لأجله، ثم إن الله سبحانه سماه مسلماً ومؤمناً وعبداً، ويبلغ من أمره إلى أن جعل الرسول منه إليه محمداً صلى الله عليه وسلم؛ **فمن حقر مسلماً من المسلمين فقد حقر ما عظم الله عز وجل**.\n- **ومن احتقار المسلم للمسلم**: أن لا يسلم عليه إذا مرّ، ولا يردّ عليه السلام إذا بدأه به، ومنها: أن يراه دون أن يدخله الله الجنة أو يبعده من النار. **وأما ما ينقمه العاقل على الجاهل والعدل على الفاسق فليس ذلك احتقاراً يعني المسلم، بل لما اتصف به الجاهل من الجهل والفاسق من الفسق؛ فمتى فارق ذلك راجعه إلى احتفاله به ورفع قدره**.\n\n## الحديث السادس والثلاثون: من نفّس عن مؤمن كربة\n\n- **الراوي**: أبو هريرة رضي الله عنه. **التخريج**: **رواه مسلم بهذا اللفظ**.\n- **المتن**: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ القِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللهُ عَلَيْهِ فِى الدُّنْيَا وَالآخِرَةِ، وَمَنْ سَتَرَ مُسْلِماً سَتَرَهُ اللهُ فِى الدُّنْيَا وَالآخِرَةِ، وَاللهُ فِى عَوْنِ العَبْدِ مَا كَانَ العَبْدُ فِى عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقاً يَلْتَمِسُ فِيهِ عِلْماً سَهَّلَ اللهُ لَهُ بِهِ طَرِيقاً إِلَى الجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِى بَيْتٍ مِنْ بُيُوتِ اللهِ يَتْلُونَ كِتَابَ اللهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ وَحَفَّتْهُمُ المَلاَئِكَةُ وَذَكَرَهُمُ اللهُ فِيمَنْ عِنْدَهُ، وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ».\n- هذا حديث عظيم **جامع لأنواع من العلوم والقواعد والآداب**. فيه **فضل قضاء حوائج المسلمين ونفعهم بما يتيسر من علم أو مال أو معاونة أو إشارة بمصلحة أو نصيحة**. ومعنى **تنفيس الكربة: إزالتها**.\n- (من ستر مسلماً): **الستر عليه أن يستر زلاته، والمراد به الستر على ذوي الهيئات ونحوهم ممن ليس معروفاً بالفساد. وهذا في ستر معصية وقعت وانقضت**، أما إذا علم معصيته وهو متلبس بها فيجب المبادرة بالإنكار عليه ومنعه منها، فإن عجز لزمه رفعها إلى وليّ الأمر إن لم يترتب على ذلك مفسدة.\n- **فالمعروف بذلك لا يُستر عليه**، لأن الستر على هذا يطمعه في الفساد والإيذاء وانتهاك المحرمات وجسارة غيره على مثل ذلك، **بل يستحب أن يرفعه إلى الإمام إن لم يخف من ذلك مفسدة**.\n- وكذلك **القول في جرح الرواة والشهود والأمناء على الصدقات والأوقاف والأيتام ونحوهم، فيجب تجريحهم عند الحاجة، ولا يحل الستر عليهم إذا رأى منهم ما يقدح في أهليتهم، وليس هذا من الغيبة المحرّمة، بل من النصيحة الواجبة**.\n- (والله في عون العبد ما دام العبد في عون أخيه) **هذا الإجمال لا يسع تفسيره إلا أن منه: أن العبد إذا عزم على معاونة أخيه ينبغي أن لا يجبن عن إنفاذ قول أو صدع بحق، إيماناً بأن الله تعالى في عونه**.\n- **وفي الحديث: فضل التيسير على المعسر، وفضل السعي في طلب العلم. ويلزم من ذلك فضل الاشتغال بالعلم، والمراد به العلم الشرعي. ويشترط أن يقصد به وجه الله تعالى، وإن كان شرطاً في كل عبادة**.\n- (وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم) **هذا دليل على فضل الاجتماع على تلاوة القرآن في المساجد**.\n- «السكينة» ها هنا قيل: **المراد بها الرحمة**، وهو ضعيف لعطف الرحمة عليها. وقال بعضهم: **السكينة الطمأنينة والوقار، وهذا أحسن**.\n- (وما اجتمع قوم) **هذا نكرة شائعة في جنسها**، كأنه يقول: أيّ قوم اجتمعوا على ذلك كان لهم ما ذكره من الفضل كله؛ فإنه لم يشترط صلى الله عليه وسلم هنا أن يكونوا علماء ولا زهاداً ولا ذوي مقامات.\n- (حفتهم الملائكة) أي **أحاطوا بهم محدقين مطيفين بجوانبه**، من قوله عز وجل (حافّين من حول العرش). و(وغشيتهم الرحمة): لا يستعمل «غشي» إلا في شيء شمل المغشي من جميع أجزائه. قال الشيخ **شهاب الدين بن فرج**: المعنى في هذا: **أن غشيان الرحمة يكون بحيث يستوعب كل ذنب تقدّم**.\n- (وذكرهم الله فيمن عنده) **يقتضي أن يكون ذكر الله تعالى لهم في الأنبياء وكرام الملائكة**.\n\n## الحديث السابع والثلاثون: كتابة الحسنات والسيئات\n\n- **الراوي**: ابن عباس رضي الله عنهما، عن رسول الله صلى الله عليه وسلم **فيما يرويه عن ربه تبارك وتعالى** (حديث قدسي).\n- **المتن**: «إِنَّ اللهَ كَتَبَ الحَسَنَاتِ وَالسَّيِّئَاتِ ثُمَّ بَيَّنَ ذَلِكَ: فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللهُ سَيِّئَةً وَاحِدَةً».\n- **التخريج**: **رواه البخاري ومسلم في صحيحيهما بهذه الحروف**.\n- **تأمل هذه الألفاظ**: قوله «عنده» **إشارة إلى الاعتناء بها**، وقوله «كاملة» **للتأكيد وشدة الاعتناء بها**. وقال في السيئة التي همّ بها ثم تركها «كتبها الله عنده حسنة كاملة» **فأكّدها بـ(كاملة)**، وإن عملها كتبها سيئة واحدة **فأكّد تقليلها بـ(واحدة) ولم يؤكدها بـ(كاملة)**.\n- قال الشراح: هذا حديث شريف عظيم بيّن فيه النبي صلى الله عليه وسلم مقدار تفضل الله عز وجل على خلقه: **بأن جعل همّ العبد بالحسنة وإن لم يعملها حسنة، وجعل همه بالسيئة وإن لم يعملها حسنة، وإن عملها سيئة واحدة، فإن عمل الحسنة كتبها الله عشراً. وهذا الفضل العظيم بأن ضاعف لهم الحسنات ولم يضاعف عليهم السيئات**. وإنما جعل الهمّ بالحسنات حسنة **لأن إرادة الخير هو فعل القلب لعقد القلب على ذلك**.\n- **فإن قيل**: فكان يلزم على هذا القول أن يُكتب لمن همّ بالسيئة ولم يعملها سيئة، لأن الهمّ بالشيء عمل من أعمال القلب أيضاً. **قيل**: ليس كما توهمت، فإن من كفّ عن الشر فقد فسخ اعتقاده للسيئة باعتقاد آخر نوى به الخير وعصى هواه المريد للشر، فجوزي على ذلك بحسنة. وقد جاء في حديث آخر: «**إنما تركها من جرائي**» أي **من أجلي**، وهذا كقوله صلى الله عليه وسلم: «على كل مسلم صدقة»، قالوا: فإن لم يفعل؟ قال: «فليمسك عن الشر فإنه صدقة» ذكره البخاري في كتاب الأدب. **فأما إذا ترك السيئة مكرهاً على تركها أو عاجزاً عنها فلا تُكتب له حسنة ولا يدخل في معنى هذا الحديث**.\n- قال **الطبري**: وفي هذا الحديث **تصحيح مقالة من قال: إن الحفظة تكتب ما يهمّ به العبد من حسنة أو سيئة، وتعلم اعتقاده لذلك، وردّ لمقالة من زعم أن الحفظة إنما تكتب ما ظهر من أعمال العبد أو سمع**. والمعنى: أن الملكين الموكلين بالعبد يعلمان ما يهمّ به بقلبه.\n- قال **صاحب الإفصاح** في كلام ابن بطال: وإن الله تعالى لما صرم هذه الأمة أخلفها على ما قصر من أعمارها بتضعيف أعمالها، فمن همّ بحسنة احتُسب له بتلك الهمّة حسنة كاملة، لأجل أنها همة مفردة، وجعلها كاملة لئلا يظن ظانّ أن كونها مجرد همة تنقص الحسنة أو تهضمها.\n- ومن فضل الله تعالى **أنه يتضاعف بالتحويل**: في مثل أن يتصدق الإنسان على فقير بدرهم، فيؤثر الفقير بذلك الدرهم فقيراً آخر هو أشدّ منه فقراً، فيؤثر به الثالث رابعاً، والرابع خامساً، وهكذا فيما طال — **فإن الله تعالى يحسب للمتصدق الأول بالدرهم عشرة، فإذا تحول إلى الثاني انتقل ذلك الذي كان للأول إلى الثاني، فصار للثاني عشرة دراهم وللأول عنه عشر مئات...** فيضاعف إلى ما لا يُعرف مقداره إلا الله تعالى.\n\n## الحديث الثامن والثلاثون: من عادى لي ولياً\n\n- **الراوي**: أبو هريرة رضي الله عنه، **قال الله تعالى** (حديث قدسي). **التخريج**: **رواه البخاري**.\n- **المتن**: «مَنْ عَادَى لِى وَلِيّاً فَقَدْ آذَنْتُهُ بِالحَرْبِ، وَمَا تَقَرَّبَ إِلَىَّ عَبْدِى بِشَىْءٍ أَحَبَّ إِلَىَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلاَ يَزَالُ عَبْدِى يَتَقَرَّبُ إِلَىَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْتُ سَمْعَهُ الَّذِى يَسْمَعُ بِهِ وَبَصَرَهُ الَّذِى يُبْصِرُ بِهِ وَيَدَهُ الَّتِى يَبْطِشُ بِهَا وَرِجْلَهُ الَّتِى يَمْشِى بِهَا، وَلَئِنْ سَأَلَنِى لأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِى لأُعِيذَنَّهُ».\n- قال **صاحب الإفصاح**: في هذا الحديث من الفقه: **أن الله سبحانه وتعالى قدّم الإعذار إلى كل من عادى ولياً: أنه قد آذنه بأنه محاربه بنفس المعاداة**. **ووليّ الله تعالى هو الذي يتبع ما شرعه الله تعالى**، فليحذر الإنسان من إيذاء قلوب أولياء الله عز وجل.\n- **ومعنى المعاداة: أن يتخذه عدواً، ولا أرى المعنى إلا من عاداه لأجل ولاية الله**. أما إذا كانت لأحوال تقتضي نزاعاً بين وليين لله محاكمة أو خصومة راجعة إلى استخراج حق غامض **فإن ذلك لا يدخل في هذا الحديث**، فإنه قد جرى بين **أبي بكر وعمر** خصومة، **وبين العباس وعليّ** رضي الله عنهم، وبين كثير من الصحابة، وكلهم كانوا أولياء الله عز وجل.\n- قوله (وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضته عليه) فيه **إشارة إلى أنه لا تقدّم نافلة على فريضة**، وإنما سميت النافلة نافلة إذا قضيت الفريضة وإلا فلا يتناولها اسم النافلة. ويدل على ذلك قوله (ولا يزال عبدي يتقرب إليّ بالنوافل حتى أحبه)، لأن **التقرب بالنوافل يكون بتلو أداء الفرائض**، ومتى أدام العبد التقرب بالنوافل أفضى ذلك به إلى أن **يحبه الله عز وجل**.\n- ثم قال (فإذا أحببته كنت سمعه الذي يسمع به وبصره الذي يبصر به...): **معنى ذلك أنه لمن يكون الله قد أحبه: فهذه علامة ولاية الله لمن لا يسمع مالم يأذن الشرع له بسماعه، ولا يبصر مالم يأذن الشرع له في إبصاره، ولا يمدّ يده إلى شيء مالم يأذن الشرع له في مدّها إليه، ولا يسعى إلا فيما أذن الشرع له في السعي إليه، فهذا هو الأصل**. إلا أنه قد يغلب على عبد ذكر الله تعالى حتى يُعرف بذلك: فإن خوطب بغيره لم يكد يسمع لمن يخاطبه، حتى يتقرب إليه بذكر الله غير أهل الذكر **توصلاً إلى أن يسمع لهم**، وكذلك في المبصرات والمتناولات والمسعى إليه، **تلك صفة عالية** نسأل الله أن يجعلنا من أهلها.\n- قوله (ولئن استعاذني لأعيذنه) **يدل على أن العبد إذا صار من أهل حب الله تعالى لم يمتنع أن يسأل ربه حوائجه ويستعيذ به ممن يخافه، والله تعالى قادر على أن يعطيه قبل أن يسأله وأن يعيذه قبل أن يستعيذه، ولكنه سبحانه متقرّب إلى عباده بإعطاء السائلين وإعاذة المستعيذين**.\n- (استعاذني) **ضبطوه بالنون والباء، وكلاهما صحيح**. وقوله في أول الحديث (فقد آذنته بالحرب) **بهمزة ممدودة: أي أعلمته أنه محارب لي**.\n\n## الحديث التاسع والثلاثون: رفع الخطأ والنسيان\n\n- **الراوي**: ابن عباس رضي الله عنهما.\n- **المتن**: «إِنَّ اللهَ تَجَاوَزَ لِى عَنْ أُمَّتِى الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ».\n- **التخريج**: **حديث حسن، رواه ابن ماجه والبيهقي وغيرهما**.\n- جاء في التفسير في قوله عز وجل (إن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله): أن هذه الآية لما نزلت شقّ ذلك على الصحابة رضي الله عنهم، **فجاء أبو بكر وعمر وعبد الرحمن بن عوف ومعاذ بن جبل في أناس** إلى رسول الله صلى الله عليه وسلم وقالوا: كلفنا من العمل ما لا نطيق، إن أحدنا ليحدّث نفسه بما لا يحب أن يثبت في قلبه وأن له الدنيا. فقال النبي صلى الله عليه وسلم: «**لعلكم تقولون كما قالت بنو إسرائيل: سمعنا وعصينا، قولوا: سمعنا وأطعنا**». واشتدّ ذلك عليهم ومكثوا حولاً، **فأنزل الله تعالى الفرج والرحمة بقوله: (لا يكلف الله نفساً إلا وسعها لها ما كسبت وعليها ما اكتسبت، ربنا لا تؤاخذنا إن نسينا أو أخطأنا...) قال الله تعالى: قد فعلت** — **فنزل التخفيف ونسخت الآية الأولى**.\n- قال **البيهقي**: قال **الشافعي** رحمه الله: قال الله جل ثناؤه (إلا من أُكره وقلبه مطمئن بالإيمان).\n- **وللكفر أحكام، فلما وضع الله عنه الكفر سقطت أحكام الإكراه عن القول كلها؛ لأن الأعظم إذا سقط سقط ما هو أصغر منه**.\n- ثم أسند عن ابن عباس رضي الله عنهما عن رسول الله صلى الله عليه وآله وسلم: (إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه). **وأسند عن عائشة رضي الله عنها عن النبي صلى الله عليه وسلم أنه قال: (لا طلاق ولا عتاق في إغلاق)، وهو مذهب عمر وابن عمر وابن الزبير**.\n- **وتزوّج ثابت بن الأحنف أمّ ولد لعبد الرحمن بن زيد بن الخطاب، فأكرهه بالسياط والتخويف على طلاقها في خلافة ابن الزبير**، فقال له ابن عمر: لم تطلق عليك، ارجع إلى أهلك. وكان ابن الزبير بمكة، وكتب به إلى عامله على المدينة: أن يردّ إليه زوجته وأن يعاقب عبد الرحمن بن زيد، **فجهزتها له صفية بنت أبي عبيد زوجة عبد الله بن عمر، وحضر عبد الله بن عمر عرسه**.\n\n## الحديث الأربعون: كن في الدنيا كأنك غريب\n\n- **الراوي**: ابن عمر رضي الله عنهما، قال: **أخذ رسول الله صلى الله عليه وسلم بمنكبي** فقال: **التخريج**: **رواه البخاري**.\n- **المتن**: «كُنْ فِى الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ». **وكان ابن عمر رضي الله عنهما يقول**: «إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ المَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ».\n- قال الإمام **أبو الحسن علي بن خلف في شرح البخاري**: قال **أبو الزناد**: معنى هذا الحديث **الحضّ على قلة المخالطة وقلة الاقتناء والزهد في الدنيا**.\n- قال **أبو الحسن**: بيان ذلك أن **الغريب قليل الانبساط إلى الناس، مستوحش منهم، إذ لا يكاد يمرّ بمن يعرفه ويأنس به، ويستكثر من مخالطته، فهو ذليل خائف. وكذلك عابر السبيل لا ينفذ في سفره إلا بقوته عليه، وخفته من الأثقال غير متشبث بما يمنعه من قطع سفره، ليس معه إلا زاد وراحلة يبلغانه إلى بغيته من قصده**. وهذا يدل على **إيثار الزهد في الدنيا ليأخذ البلغة منها والكفاف**، كما لا يحتاج المسافر إلى أكثر مما يبلغه إلى غية سفره، كذلك لا يحتاج المؤمن في الدنيا إلى أكثر مما يبلغه.\n- وقال **العزّ علاء الدين بن يحيى بن هبيرة**: في هذا الحديث ما يدل على أن رسول الله صلى الله عليه وسلم **حضّ على التشبه بالغريب؛ لأن الغريب إذا دخل بلدة لم ينافس أهلها في مجالسهم، ولا يجزع أن يرى أحداً على خلاف عادته في الملبوس، ولا يكون متدابراً معهم. وكذلك عابر السبيل لا يتخذ داراً ولا يلج في الخصومات مع الناس يشاحنهم، ناظراً إلى أن لبثه معهم أيام يسيرة. فكل أحوال الغريب وعابر السبيل مستحبة أن تكون للمؤمن في الدنيا، لأن الدنيا ليست وطناً له، لأنها تحبسه عن داره، وهي الحائلة بينه وبين قراره**.\n- وأما قول ابن عمر (إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء) **فهو حضّ منه على أن المؤمن يستعدّ أبداً للموت، والموت يستعدّ له بالعمل الصالح، وحضّ على تقصير الأمل**: أي لا تنتظر بأعمال الليل الصباح، بل بادر بالعمل، وكذلك إذا أصبحت فلا تحدّث نفسك بالمساء وتؤخر أعمال الصباح إلى الليل.\n- قوله (وخذ من صحتك لمرضك) **حضّ على اغتنام صحته، فيجتهد فيها خوفاً من حلول مرض يمنعه من العمل**. وكذلك قوله (ومن حياتك لموتك) **تنبيه على اغتنام أيام حياته؛ لأن من مات انقطع عمله وفات وندم وعظمت حسرته على تفريطه**.\n- **وقد ذم الله تعالى الأمل وطوله** وقال: (ذرهم يأكلوا ويتمتعوا ويلههم الأمل فسوف يعلمون). وقال **عليّ** رضي الله عنه: «**ارتحلت الدنيا مدبرة وارتحلت الآخرة مقبلة، ولكل واحدة منهما بنون، فكونوا من أبناء الآخرة ولا تكونوا من أبناء الدنيا، فإن اليوم عمل ولا حساب، وغداً حساب ولا عمل**».\n- وقال **أنس** رضي الله عنه: **خط النبي صلى الله عليه وسلم خطوطاً** فقال: «هذا الإنسان، وهذا الأمل، وهذا الأجل، فبينما هو كذلك إذ جاء الخط الأقرب» وهو **أجله المحيط به**.\n- قال **عبد الله بن عمر** رضي الله عنهما: رآني رسول الله صلى الله عليه وسلم وأنا أطيّن حائطاً لي أنا وأمي فقال: «ما هذا يا عبد الله؟» فقلت: يا رسول الله قد وهى فنحن نصلحه، فقال: «**الأمر أسرع من ذلك**».\n\n## الحديث الحادي والأربعون: تبعية الهوى لما جاء به النبي\n\n- **الراوي**: أبو محمد **عبد الله بن عمرو بن العاص** رضي الله عنهما.\n- **المتن**: «لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعاً لِمَا جِئْتُ بِهِ».\n- **التخريج**: **حديث حسن صحيح، رويناه في كتاب الحجة بإسناد صحيح**.\n- هذا الحديث كقوله سبحانه وتعالى: (فلا وربك لا يؤمنون حتى يحكّموك فيما شجر بينهم ثم لا يجدوا في أنفسهم حرجاً مما قضيت ويسلموا تسليماً).\n- **سبب نزولها**: أن **الزبير** رضي الله عنه كان بينه وبين رجل من الأنصار خصومة في ماء، فتحاكما إلى رسول الله صلى الله عليه وسلم فقال: «**اسقِ يا زبير وسرّح الماء إلى جارك**» يحضّه بذلك على المسامحة والتيسير. فقال الأنصاري: أن كان ابن عمتك؟ **فتلوّن وجه رسول الله صلى الله عليه وسلم** ثم قال: «**يا زبير احبس الماء حتى يبلغ الجدر ثم سرّحه**» — وذلك أن رسول الله صلى الله عليه وسلم كان أشار على الزبير بما فيه مصلحة الأنصاري، فلما أحفظه الأنصاري بما قال — أي أغضبه — **استوعب للزبير حقه الذي يجب له، فنزلت هذه الآية**.\n- وقد صحّ عن النبي صلى الله عليه وسلم في حديث آخر أنه قال: «**والذي نفسي بيده لا يؤمن أحدكم حتى أكون أحبّ إليه من والده وولده والناس أجمعين**».\n- قال **أبو الزناد**: **هذا من جوامع الكلم، لأنه قد جمعت هذه الألفاظ اليسيرة معاني كثيرة؛ لأن أقسام المحبة ثلاثة: محبة إجلال وعظمة كمحبة الوالد، ومحبة شفقة ورحمة كمحبة الولد، ومحبة استحسان ومشاكلة كمحبة سائر الناس، فحصر أصناف المحبة**.\n- قال **ابن بطال**: ومعنى الحديث — والله أعلم — أن **من استكمل الإيمان علم أن حق رسول الله صلى الله عليه وسلم وفضله آكد عليه من حق أبيه وابنه والناس أجمعين، لأن بالرسول صلى الله عليه وسلم استنقذه الله عز وجل من النار وهداه من الضلال**.\n- **والمراد بالحديث: بذل النفس دونه صلى الله عليه وسلم**، وقد كانت الصحابة رضي الله عنهم يقاتلون معه آباءهم وأبناءهم وإخوانهم، **وقد قتل أبو عبيدة أباه لإيذائه رسول الله صلى الله عليه وسلم، وتعرّض أبو بكر رضي الله عنه يوم بدر لولده عبد الرحمن لعله يتمكن منه فيقتله**؛ فمن وجد هذا منه فقد صح أن هواه تبع لما جاء به النبي صلى الله عليه وسلم.\n\n## الحديث الثاني والأربعون: سعة مغفرة الله\n\n- **الراوي**: أنس رضي الله عنه، **قال الله تعالى** (حديث قدسي).\n- **المتن**: «يَا ابْنَ آدَمَ إِنَّكَ مَا دَعَوْتَنِى وَرَجَوْتَنِى غَفَرْتُ لَكَ عَلَى مَا كَانَ مِنْكَ وَلاَ أُبَالِى، يَا ابْنَ آدَمَ لَوْ بَلَغَتْ ذُنُوبُكَ عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتَنِى غَفَرْتُ لَكَ، يَا ابْنَ آدَمَ لَوْ أَتَيْتَنِى بِقُرَابِ الأَرْضِ خَطَايَا ثُمَّ لَقِيتَنِى لاَ تُشْرِكُ بِى شَيْئاً لأَتَيْتُكَ بِقُرَابِهَا مَغْفِرَةً».\n- **التخريج**: **رواه الترمذي وقال: حديث حسن صحيح**.\n- في هذا الحديث **بشارة عظيمة، وحلم وكرم عظيم، وما لا يحصى من أنواع الفضل والإحسان والرأفة والرحمة والامتنان**. ومثل هذا قوله صلى الله عليه وسلم: «**لله أفرح بتوبة عبده من أحدكم بضالته لو وجدها**».\n- وعن **أبي أيوب** رضي الله عنه لما حضرته الوفاة قال: كنت قد كتمت عنكم شيئاً سمعته من رسول الله صلى الله عليه وسلم، سمعته يقول: «**لولا أنكم تذنبون لخلق الله خلقاً يذنبون فيغفر لهم**».\n- قوله (يا ابن آدم إنك ما دعوتني ورجوتني) هذا موافق لقوله: «**أنا عند ظن عبدي بي فليظن بي ما شاء**».\n- وقد جاء أن العبد إذا أذنب ثم ندم فقال: أي ربي أذنبت ذنباً فاغفر لي، ولا يغفر الذنوب إلا أنت. قال: **فيقول الله تعالى: علم عبدي أن له رباً يغفر الذنب ويأخذ به، أشهدكم أني قد غفرت له**. ثم يفعل ذلك ثانية وثالثة، فيقول الله عز وجل في كل مرة مثل ذلك، ثم يقول: «**اعمل ما شئت فقد غفرت لك**» يعني **لما أذنبت واستغفرت**.\n- **واعلم أن للتوبة ثلاثة شروط**: (1) **الإقلاع عن المعصية**، (2) **والندم على ما فات**، (3) **والعزم على أن لا يعود**. **وإن كانت تتعلق بحق آدمي فليبادر بأداء الحق إليه والتحلل منه**، وإن كانت بينه وبين الله تعالى وفيها كفارة **فلا بد من فعل الكفارة، وهذا شرط رابع**. فلو فعل الإنسان مثل هذا في اليوم مراراً وتاب التوبة بشروطها **فإن الله يغفر له**.\n- قوله (على ما كان منك) أي **من تكرار معصيتك**. و(ولا أبالي) أي ولا أبالي بذنوبك.\n- قوله (لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك) أي **لو كانت أشخاصاً تملأ ما بين السماء والأرض، وهذا نهاية الكثرة، ولكن كرمه وحلمه وعفوه أكثر وأعظم**، وليس بينهما مناسبة ولا التفضيل له هنا مدخل، **فتتلاشى ذنوب العالم عند حلمه وعفوه**.\n- قوله (لو أتيتني بقراب الأرض خطايا) أي **بما يقارب مثل الأرض**. وقوله (ثم لقيتني) أي **متّ على الإيمان لا تشرك بي شيئاً**، ولا راحة للمؤمن دون لقاء ربه. وقد قال الله تعالى: (إن الله لا يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء).\n- وقد قال صلى الله عليه وسلم: «**ما أصرّ من استغفر وإن عاد في اليوم سبعين مرة**». وقال أبو هريرة رضي الله عنه: قال رسول الله صلى الله عليه وسلم: «**حسن الظن بالله من حسن عبادة الله**».\n\n\n# الحديث (10 درجات) — الأربعون النووية\n\nكل أسئلة الاختبارات السابقة في الحديث جاءت من الأربعين النووية: الراوي، المخرّج، معاني الألفاظ، الفوائد المستنبطة، والأقسام والشروط الواردة في الشروح (ابن دقيق العيد، ابن رجب في جامع العلوم والحكم، ابن عثيمين).\n\n## ما يُسأل عنه في كل حديث\n1. من راويه من الصحابة؟ ومن أخرجه؟\n2. معاني الألفاظ الغريبة.\n3. الفوائد المستنبطة (ثلاث فوائد على الأقل).\n4. الأقسام والشروط المذكورة في الشرح.\n\n---\n\n## الأحاديث مع أهم ما يُسأل عنه\n\n**1. إنما الأعمال بالنيات** — عمر بن الخطاب، متفق عليه. سنده مشهور بالنسبة لآخره غريب بالنسبة لأوله (لم يروه عن عمر إلا علقمة). سببه: مهاجر أم قيس. المحذوف: \"صحة الأعمال\" عند من اشترط النية، و\"كمال الأعمال\" عند من لم يشترطها. إزالة النجاسة لا تحتاج نية لأنها من باب الترك.\n- هذا الحديث ثلث الإسلام (قال الإمام أحمد: أصول الإسلام على ثلاثة أحاديث: هذا، والحلال بين، ومن أحدث).\n- \"إنما الأعمال بالنيات\": أي صحة الأعمال وقبولها بالنية، فهي شرط للعبادات. \"وإنما لكل امرئ ما نوى\": الجزاء بحسب النية. قال النووي: الأولى بيان أن العمل لا يكون إلا بنية، والثانية بيان أن الثواب على قدر النية.\n- **كيف تُميّز بالنية** (سؤال سابق): (أ) العادة من العبادة: الغسل للتبرد وغسل الجنابة، الإمساك عن الطعام حمية وصوماً. (ب) العبادة من العبادة الأخرى: صلاة الظهر عن العصر، صوم القضاء عن النذر. (ج) العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لتكون كلمة الله هي العليا أو للمغنم. يطلق عليه \"أم السنة\" (سؤال أكمل: يطلق اسم أم السنة على حديث \"إنما الأعمال بالنيات\"، وأم القرآن على سورة الفاتحة).\n\n**2. حديث جبريل (الإسلام والإيمان والإحسان)** — عمر، رواه مسلم.\n- أركان الإسلام خمسة، أركان الإيمان ستة، الإحسان مرتبتان: أن تعبد الله كأنك تراه (المشاهدة)، فإن لم تكن تراه فإنه يراك (المراقبة). أشراط الساعة: أن تلد الأمة ربتها، والتطاول في البنيان.\n\n**3. بني الإسلام على خمس** — ابن عمر، متفق عليه.\n- **لماذا لم يذكر الجهاد** (سؤال سابق): علل القرطبي بأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، وقيل لأنه لم يكن قد فُرض بعد، والصحيح أن هذه الخمسة يتعين على كل مسلم فعلها بنفسه بخلاف الجهاد.\n- **رواية \"خمسة\" بالهاء ورواية \"خمس\" بغير هاء** (سؤال سابق): كلاهما صحيح، \"خمس\" أي خمس دعائم أو قواعد، و\"خمسة\" أي خمسة أركان أو أشياء.\n- **هل يصح أن يقال بُني الإسلام على خمسة؟** نعم، ورد في رواية مسلم.\n- **كيف تعامل ابن عمر مع من قدّم الحج على الصوم** (سؤال سابق): رجل قال له: \"الحج وصيام رمضان\"، فقال ابن عمر: \"لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ\"، رواه مسلم. أنكر عليه ليتحفظ الترتيب النبوي لحرصه على اللفظ.\n\n**4. الصادق المصدوق** — ابن مسعود، متفق عليه.\n- **معنى الصادق المصدوق** (سؤال سابق): الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي، أي صدقه الله فيما أخبره.\n- مراحل الخلق: نطفة أربعين يوماً، ثم علقة، ثم مضغة، ثم يرسل الملك فينفخ الروح ويكتب أربع كلمات: رزقه وأجله وعمله وشقي أم سعيد.\n\n**5. من أحدث في أمرنا هذا ما ليس منه فهو رد** — عائشة، متفق عليه.\n- \"ليس عليه أمرنا\" (سؤال أكمل): أي ليس عليه حكمنا وديننا. \"فهو رد\": أي مردود باطل غير معتد به.\n- **فائدة عظيمة** (سؤال سابق): هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود على صاحبه، وهو أصل في إبطال البدع والعقود المحرمة.\n\n**6. الحلال بين والحرام بين** — النعمان بن بشير، متفق عليه.\n- **\"فمن وقع في الشبهات وقع في الحرام\"، فيه قولان** (سؤال سابق): الأول: أنه يقع في الحرام حقيقة وهو لا يشعر، لأن التساهل بالشبهات يجره إلى الحرام. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه، كالراعي حول الحمى.\n- الحديث أصل في الورع. \"مضغة\" هي القلب.\n\n**7. الدين النصيحة** — تميم بن أوس الداري، رواه مسلم.\n- **اكتب الحديث كاملاً وكم عدد ما رُوي عنه** (سؤال سابق): \"الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم\". تميم الداري لم يُروَ عنه في الكتب الستة إلا هذا الحديث (وقيل: له ثمانية عشر حديثاً في كتب الحديث عموماً، وفي الصحيح هذا فقط).\n- **النصيحة لأئمة المسلمين** (سؤال سابق): معاونتهم على الحق وطاعتهم فيه وأمرهم به وتذكيرهم برفق ولطف، وعدم الخروج عليهم، والدعاء لهم بالصلاح.\n- **النصيحة فرض كفاية** (سؤال أكمل). النصيحة لغة: خلاص العسل من الشمع، أو الخياطة بالإبرة (نصح الثوب).\n\n**8. أمرت أن أقاتل الناس** — ابن عمر، متفق عليه. \"إلا بحق الإسلام\": كالقصاص والزنا بعد الإحصان.\n\n**9. ما نهيتكم عنه فاجتنبوه** — أبو هريرة، متفق عليه.\n- **من الرجل السائل المبهم في \"فإنما أهلك الذين من قبلكم كثرة مسائلهم\"** (سؤال سابق): الأقرع بن حابس، سأل: \"أفي كل عام يا رسول الله؟\" لما فرض الحج.\n- من فوائده: النهي يجتنب كله، والأمر بقدر الاستطاعة.\n\n**10. إن الله طيب لا يقبل إلا طيباً** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): أن الله منزه عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الطيب الحلال. أن أكل الحرام من موانع إجابة الدعاء. الرسل والمؤمنون مكلفون بتكليف واحد في أكل الطيب. أسباب الإجابة الأربعة: إطالة السفر، رثاثة الهيئة، رفع اليدين، الإلحاح بيا رب. وموانعها الأربعة: المطعم والمشرب والملبس الحرام والغذاء بالحرام.\n\n**11. دع ما يريبك إلى ما لا يريبك** — الحسن بن علي، رواه الترمذي والنسائي.\n**12. من حسن إسلام المرء تركه ما لا يعنيه** — أبو هريرة، رواه الترمذي.\n**13. لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه** — أنس، متفق عليه. المنفي كمال الإيمان الواجب لا أصله.\n**14. لا يحل دم امرئ مسلم إلا بإحدى ثلاث** — ابن مسعود، متفق عليه: الثيب الزاني، النفس بالنفس، التارك لدينه المفارق للجماعة.\n**15. من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت** — أبو هريرة، متفق عليه.\n**16. لا تغضب** — أبو هريرة، رواه البخاري.\n**17. إن الله كتب الإحسان على كل شيء** — شداد بن أوس، رواه مسلم.\n**18. اتق الله حيثما كنت** — أبو ذر ومعاذ، رواه الترمذي.\n**19. احفظ الله يحفظك** — ابن عباس، رواه الترمذي.\n- **معنى \"احفظ الله يحفظك\"** (سؤال سابق): احفظ حدوده وأوامره ونواهيه بامتثالها واجتنابها، يحفظك في دينك ودنياك وأهلك ومالك. حفظ الله للعبد نوعان: حفظ في الدنيا (البدن والمال والولد)، وحفظ في الدين والإيمان.\n- \"رفعت الأقلام وجفت الصحف\": الفراغ من كتابة المقادير.\n\n**20. إذا لم تستح فاصنع ما شئت** — أبو مسعود البدري، رواه البخاري.\n**21. قل آمنت بالله ثم استقم** — سفيان بن عبدالله الثقفي، رواه مسلم.\n- **\"ثم استقم\"** (سؤال سابق): الاستقامة هي لزوم طاعة الله والثبات على الدين بلا ميل، وهي جامعة لخصال الدين كلها.\n\n**22. أرأيت إذا صليت المكتوبات** — جابر، رواه مسلم. \"لم أزد على ذلك شيئاً\": أي لا أزيد على الفرائض، وفيه دليل على أن تارك السنن لا يأثم.\n**23. الطهور شطر الإيمان** — أبو مالك الأشعري، رواه مسلم. \"شطر\": نصف. \"الصلاة نور، والصدقة برهان، والصبر ضياء\". **الصبر ثلاثة** (سؤال أكمل): صبر على طاعة الله، وصبر عن معصية الله، وصبر على أقدار الله المؤلمة.\n**24. يا عبادي إني حرمت الظلم على نفسي** — أبو ذر، رواه مسلم (حديث قدسي).\n**25. ذهب أهل الدثور بالأجور** — أبو ذر، رواه مسلم. \"الدثور\": الأموال الكثيرة.\n**26. كل سلامى من الناس عليه صدقة** — أبو هريرة، متفق عليه. \"سلامى\": المفصل.\n**27. البر حسن الخلق، والإثم ما حاك في صدرك** — النواس بن سمعان، رواه مسلم.\n**28. إياكم ومحدثات الأمور** — العرباض بن سارية، رواه أبو داود والترمذي.\n- **الراوي** (سؤال سابق): أبو نجيح العرباض بن سارية. **أخرجه**: أبو داود والترمذي. **المحدث قسمان**: محدث ليس له أصل في الشريعة فهو بدعة، ومحدث يحمل النظير على النظير (كجمع المصحف) فليس ببدعة.\n- \"موعظة بليغة\": مؤثرة. \"ذرفت منها العيون\": سالت دموعها. \"بالنواجذ\": أقصى الأضراس.\n\n**29. يا رسول الله أخبرني بعمل يدخلني الجنة** — معاذ، رواه الترمذي. \"ملاك ذلك كله\": كف اللسان. \"ثكلتك أمك\": دعاء لا يراد حقيقته.\n**30. إن الله فرض فرائض فلا تضيعوها** — أبو ثعلبة الخشني، رواه الدارقطني.\n**31. ازهد في الدنيا يحبك الله** — سهل بن سعد، رواه ابن ماجه.\n**32. لا ضرر ولا ضرار** — أبو سعيد الخدري، رواه ابن ماجه والدارقطني. الضرر: إلحاق المفسدة بالغير مطلقاً، والضرار: مقابلة الضرر بالضرر.\n**33. لو يعطى الناس بدعواهم** — ابن عباس، رواه البيهقي وأصله في الصحيحين. البينة على المدعي واليمين على من أنكر.\n**34. من رأى منكم منكراً فليغيره** — أبو سعيد الخدري، رواه مسلم.\n- **شروط الأمر بالمعروف والنهي عن المنكر** (سؤال سابق): أن يكون عالماً بأن هذا منكر وبحكمه. أن يكون المنكر ظاهراً بلا تجسس. أن يكون متفقاً على إنكاره لا مسألة خلافية. أن يغلب على ظنه أن الإنكار لا يؤدي إلى منكر أكبر. القدرة عليه. وله مراتب: اليد ثم اللسان ثم القلب، وتغيير القلب أضعف الإيمان.\n\n**35. لا تحاسدوا ولا تناجشوا** — أبو هريرة، رواه مسلم.\n- **معاني الكلمات** (سؤال سابق مكرر):\n  - **لا تحاسدوا**: لا يتمنى بعضكم زوال نعمة بعض.\n  - **لا تناجشوا**: النجش أن يزيد في السلعة من لا يريد شراءها ليغر المشتري، والمناجشة: الخداع.\n  - **لا تباغضوا**: لا تتعاطوا أسباب البغض.\n  - **لا تدابروا**: التدابر أن يعطي كل منهما الآخر دبره إعراضاً وهجراً.\n  - **يحقر** / **لا يحقره**: لا يستصغره ويزدريه ويستهين به.\n  - **التقوى ها هنا**: في القلب، وأشار إلى صدره ثلاثاً.\n\n**36. من نفّس عن مؤمن كربة** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على تلاوة القرآن ومدارسته في بيوت الله. فضل طلب العلم وأنه طريق إلى الجنة. أن العمل هو المعتبر لا النسب (\"من بطأ به عمله لم يسرع به نسبه\").\n- \"نفّس\": فرّج. \"كربة\": شدة عظيمة. \"السكينة\": الطمأنينة.\n\n**37. إن الله كتب الحسنات والسيئات** — ابن عباس، متفق عليه. الحسنة بعشر إلى سبعمائة ضعف، والهم بالسيئة إذا ترك لله كتبت حسنة.\n**38. من عادى لي ولياً** — أبو هريرة، رواه البخاري (قدسي). الولي: المؤمن التقي. أحب ما يتقرب به العبد: الفرائض، ثم النوافل.\n**39. إن الله تجاوز لي عن أمتي الخطأ والنسيان** — ابن عباس، رواه ابن ماجه والبيهقي.\n**40. كن في الدنيا كأنك غريب أو عابر سبيل** — ابن عمر، رواه البخاري.\n- **المقصود** (سؤال سابق): لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن فيها كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ. ومن وصايا ابن عمر: \"إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء، وخذ من صحتك لمرضك ومن حياتك لموتك\".\n\n**41. لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به** — عبدالله بن عمرو، حديث حسن صحيح رواه النووي في الحجة.\n- **المحبة ثلاثة أقسام** (سؤال سابق): محبة إجلال وعظمة (كمحبة الوالد)، محبة شفقة ورحمة (كمحبة الولد)، محبة استحسان ومشاكلة (كمحبة سائر الناس).\n\n**42. يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك** — أنس، رواه الترمذي (قدسي).\n- **شروط التوبة ثلاثة** (سؤال سابق): الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع إن كانت متعلقة بحق آدمي: رد المظالم إلى أهلها. \"عنان السماء\": السحاب أو ما عنّ لك منها. \"قراب الأرض\": ملؤها أو ما يقارب ملأها.\n\n## أسئلة مرجحة: معاني ألفاظ\n| اللفظ | المعنى |\n|---|---|\n| مضغة | قطعة لحم قدر ما يُمضغ (القلب) |\n| العَلَق | الدم الغليظ الجامد |\n| يخالطهم | يعاشرهم |\n| النواجذ | أقصى الأضراس |\n| الدثور | الأموال الكثيرة |\n| سلامى | المفصل |\n| ملاك الأمر | قوامه وأصله |\n| العنان | السحاب |\n| الكربة | الشدة العظيمة |\n| الخلاصة | زبدة الشيء |\n| حاك في صدرك | تردد فيه ولم ينشرح له |\n", "questions": [{"s": "hadith", "q": "كيف تتميز بالنية العادة من العبادة، أو العبادة من الأخرى، أو العبادة لله أو لغيره؟ اذكر مثالين لكل صورة.", "a": "العادة من العبادة: الغسل للتبرد وللجنابة، الإمساك حمية وصوماً. العبادة من الأخرى: الظهر من العصر، صوم القضاء من النذر. العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لإعلاء كلمة الله أو للمغنم."}, {"s": "hadith", "q": "ما معنى الصادق المصدوق؟", "a": "الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي (صدقه الله)."}, {"s": "hadith", "q": "\"فمن وقع في الشبهات وقع في الحرام\" هناك قولان، اذكرهما.", "a": "الأول: أنه يقع في الحرام حقيقة وهو لا يشعر. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه كالراعي حول الحمى."}, {"s": "hadith", "q": "ما شروط الأمر بالمعروف والنهي عن المنكر؟", "a": "أن يكون عالماً بأنه منكر، وأن يكون المنكر ظاهراً بلا تجسس، وأن يكون متفقاً على إنكاره لا مسألة خلافية، وألا يترتب عليه منكر أكبر، والقدرة. ومراتبه: اليد ثم اللسان ثم القلب."}, {"s": "hadith", "q": "ما معنى: لا تحاسدوا؟ لا تناجشوا؟ لا تدابروا؟ يحقر؟", "a": "لا تحاسدوا: لا يتمنى بعضكم زوال نعمة بعض. لا تناجشوا: النجش الزيادة في السلعة ممن لا يريد شراءها ليغر غيره. لا تدابروا: لا يعطي كل منكما الآخر دبره هجراً وإعراضاً. يحقر: يستصغره ويزدريه."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: إن الله طيب لا يقبل إلا طيباً.", "a": "تنزيه الله عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الحلال. أن أكل الحرام من موانع إجابة الدعاء. أسباب الإجابة: السفر، رثاثة الهيئة، رفع اليدين، الإلحاح."}, {"s": "hadith", "q": "من أحدث في أمرنا هذا ما ليس منه فهو رد: فائدة عظيمة وضحها.", "a": "هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود، وهو أصل في إبطال البدع والعقود المحرمة."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: من نفّس عن مؤمن كربة.", "a": "الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على القرآن في المساجد. فضل طلب العلم. العمل هو المعتبر لا النسب."}, {"s": "hadith", "q": "وضح المقصود: كن في الدنيا كأنك غريب أو عابر سبيل.", "a": "لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ."}, {"s": "hadith", "q": "بماذا علل الإمام أبو العباس القرطبي عدم ذكر النبي ﷺ الجهاد ضمن أركان الإسلام؟", "a": "لأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، بخلاف الخمسة فهي متعينة على كل مسلم."}, {"s": "hadith", "q": "هل يصح أن يقال: إن الإسلام بني على خمسة؟", "a": "نعم، وردت رواية \"خمسة\" بالهاء في مسلم، ورواية \"خمس\" بغير هاء، وكلاهما صحيح، فالأولى بتقدير أشياء أو أركان، والثانية بتقدير دعائم أو قواعد."}, {"s": "hadith", "q": "كيف تعامل ابن عمر راوي الحديث مع من قدم الحج على الصوم؟ ولماذا؟", "a": "أنكر عليه وقال: لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ. لحرصه على ضبط لفظ النبي ﷺ وترتيبه."}, {"s": "hadith", "q": "حديث \"إياكم ومحدثات الأمور\": من رواه؟ ومن خرجه؟ وما قسما المحدث؟", "a": "الراوي: أبو نجيح العرباض بن سارية. أخرجه: أبو داود والترمذي. القسم الأول: محدث ليس له أصل في الشريعة فهو بدعة. الثاني: محدث يحمل النظير على النظير فليس ببدعة."}, {"s": "hadith", "q": "حديث \"لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به\" تضمن الدلالة على المحبة، وهي ثلاثة أقسام، فما هي؟", "a": "محبة إجلال وعظمة، محبة شفقة ورحمة، محبة استحسان ومشاكلة."}, {"s": "hadith", "q": "حديث \"يا ابن آدم لو بلغت ذنوبك عنان السماء\" تضمن الدلالة على التوبة ولها ثلاثة شروط، فما هي؟", "a": "الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع في حقوق العباد: ردها لأصحابها."}, {"s": "hadith", "q": "اكتب حديث أبي رقية تميم بن أوس الداري كاملاً، وكم عدد الأحاديث التي رويت عنه؟", "a": "قال ﷺ: الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم. رواه مسلم. ولم يرو له في الصحيح غيره، وله في كتب السنة نحو ثمانية عشر حديثاً."}, {"s": "hadith", "q": "من هو الرجل السائل المبهم في حديث: فإنما أهلك الذين من قبلكم كثرة مسائلهم؟", "a": "الأقرع بن حابس، حين سأل: أفي كل عام يا رسول الله؟"}, {"s": "hadith", "q": "اذكر معنى (العلة) الوارد في حديث عمر بن الخطاب (الصادق المصدوق).", "a": "المراد في حديث الأربعين: \"مثل ذلك\" العلقة: الدم الغليظ الجامد، وهي مفرد وجمعها علق."}, {"s": "hadith", "q": "اشرح بسطر: النصيحة لأئمة المسلمين. الإيمان بالملائكة. بني الإسلام على خمس. احفظ الله يحفظك.", "a": "النصيحة للأئمة: معاونتهم على الحق وطاعتهم فيه وتذكيرهم برفق وعدم الخروج عليهم. الإيمان بالملائكة: التصديق بوجودهم وأنهم عباد مكرمون من نور. بني الإسلام على خمس: أركانه كالبناء على دعائم خمس لا يقوم بدونها. احفظ الله: احفظ حدوده يحفظك في دينك ودنياك."}, {"s": "hadith", "q": "أكمل: يطلق اسم أم القرآن على سورة ... ويطلق اسم أم السنة على حديث ... والنصيحة فرض ... والصبر ثلاثة ...", "a": "الفاتحة. إنما الأعمال بالنيات. كفاية. صبر على الطاعة، وعن المعصية، وعلى أقدار الله."}, {"s": "hadith", "q": "في الحديث (ليس عليه أمرنا) أي؟ (فهو رد) أي؟", "a": "ليس عليه أمرنا: ليس عليه حكمنا وديننا. فهو رد: مردود باطل غير معتد به."}, {"s": "hadith", "q": "ماذا قال الإمام أحمد والشافعي عن حديث إنما الأعمال بالنيات؟ وما سبب ذلك؟", "a": "يدخل في حديث الأعمال بالنيات ثلث العلم، لأن كسب العبد يكون بقلبه ولسانه وجوارحه، والنية أحد الأقسام الثلاثة."}, {"s": "hadith", "q": "لماذا استحب العلماء أن تُستفتح المصنفات بحديث إنما الأعمال بالنيات؟", "a": "تنبيهاً للطالب على تصحيح النية."}, {"s": "hadith", "q": "ما نوع سند حديث إنما الأعمال بالنيات؟", "a": "مشهور بالنسبة إلى آخره، غريب بالنسبة إلى أوله، لأنه لم يروه عن النبي ﷺ إلا عمر، ولم يروه عن عمر إلا علقمة، ثم اشتهر."}, {"s": "hadith", "q": "ما المراد بالأعمال في قوله: إنما الأعمال بالنيات؟ وما الذي لا يحتاج إلى نية؟", "a": "المراد الأعمال الشرعية كالوضوء والصلاة فلا يُعتد بها بدون نية. أما إزالة النجاسة فلا تحتاج نية لأنها من باب الترك."}, {"s": "hadith", "q": "ما المحذوف المقدّر في: إنما الأعمال بالنيات؟", "a": "من اشترط النية قدّر: صحة الأعمال بالنيات. ومن لم يشترطها قدّر: كمال الأعمال بالنيات."}, {"s": "hadith", "q": "ماذا يفيد قوله: وإنما لكل امرئ ما نوى؟", "a": "تعيين العمل بالنية، فمن عليه صلاة فائتة لا يكفيه أن ينوي الفائتة بل ينوي كونها ظهراً أو عصراً."}, {"s": "hadith", "q": "ما سبب ورود حديث إنما الأعمال بالنيات؟", "a": "رجل هاجر من مكة إلى المدينة ليتزوج امرأة يقال لها أم قيس، فكان يقال له: مهاجر أم قيس."}, {"s": "hadith", "q": "هل الإسلام والإيمان بمعنى واحد؟", "a": "حقيقتان متباينتان لغة وشرعاً، وقد يتوسع الشرع فيطلق أحدهما على الآخر على سبيل التجوز."}, {"s": "hadith", "q": "لماذا تعجب الصحابة من سائل النبي ﷺ في حديث جبريل؟", "a": "لأن ما جاء به النبي ﷺ لا يُعرف إلا من جهته، وهذا السائل غير معروف بلقائه، ثم سأل سؤال عارف مصدّق."}, {"s": "hadith", "q": "ما معنى: أن تلد الأمة ربتها؟", "a": "قولان: أن يستولي المسلمون على بلاد الكفر فيكثر التسري فيكون ولد الأمة من سيدها بمنزلة سيدها. أو تفسد الأحوال حتى يبيع السادة أمهات أولادهم فربما اشتراها ولدها."}, {"s": "hadith", "q": "لماذا خُص رعاء الشاء بالذكر في حديث جبريل؟ وما معنى ملياً والعالة؟", "a": "لأنهم أضعف أهل البادية. ملياً: زماناً كثيراً قيل ثلاث. العالة: جمع عائل وهو الفقير."}, {"s": "hadith", "q": "ما سبب ورود حديث بني الإسلام على خمس؟", "a": "أن رجلاً قال لابن عمر: ألا نغزو؟ فقال: سمعت رسول الله ﷺ يقول: إن الإسلام بني على خمس."}, {"s": "hadith", "q": "ما معنى: إن أحدكم يُجمع خلقه في بطن أمه؟ ومن الملك المرسل؟", "a": "أن المني يقع في الرحم متفرقاً فيجمعه الله في محل الولادة. والملك: الموكل بالرحم."}, {"s": "hadith", "q": "ما توجيه قوله: إن أحدكم ليعمل بعمل أهل الجنة حتى ما يكون بينه وبينها إلا ذراع؟", "a": "أن عمله كان صحيحاً وقرب من الجنة، ومنعه سابق القدر الذي يظهر عند الخاتمة، فالأعمال بالخواتيم بالنسبة إلى اطلاعنا. وهذا نادر لا غالب، وانقلاب الناس من الشر إلى الخير أكثر."}, {"s": "hadith", "q": "ما القاعدة الأصولية المأخوذة من حديث: من أحدث في أمرنا؟", "a": "أن النهي يقتضي الفساد."}, {"s": "hadith", "q": "ما فائدة رواية: من عمل عملاً ليس عليه أمرنا فهو رد؟", "a": "أنها صريحة في ترك كل محدثة سواء أحدثها فاعلها أو سُبق إليها، فيُحتج بها على من يقول: ما أحدثت شيئاً."}, {"s": "hadith", "q": "دل حديث الحلال بيّن على أن الأشياء ثلاثة أقسام، اذكرها.", "a": "ما نص الله على تحليله فهو الحلال البيّن. ما نص على تحريمه فهو الحرام البيّن. الشبهات: ما تتنازعه الأدلة وتتجاذبه المعاني، والإمساك عنه ورع."}, {"s": "hadith", "q": "ما حكم المشتبهات؟", "a": "ثلاثة أقوال: حرام لقوله استبرأ لدينه وعرضه. حلال وتركها ورع لقوله كالراعي يرعى حول الحمى. التوقف فيها ورعاً."}, {"s": "hadith", "q": "المشتبهات ثلاثة أقسام عند بعض العلماء، اذكرها.", "a": "ما يعلم أنه حرام ثم يشك في زوال تحريمه (كالذبيحة يشك في ذكاتها) فيبقى التحريم. ما كان حلالاً فيشك في تحريمه (كزوجة يشك في طلاقها) فيبقى الحل. ما يشك فيه ولا دلالة على أحد الأمرين فالأحسن التنزه."}, {"s": "hadith", "q": "ما معنى النصيحة لغة واصطلاحاً؟ وما حكمها؟", "a": "لغة: الإخلاص. اصطلاحاً: كلمة جامعة معناها إرادة جملة الخير حيازة لحظ المنصوح له. حكمها: فرض كفاية."}, {"s": "hadith", "q": "ما معنى: الدين النصيحة؟", "a": "أي عماد الدين وقوامه النصيحة، كقوله: الحج عرفة."}, {"s": "hadith", "q": "ما النصيحة لله ولكتابه ولرسوله؟", "a": "لله: الإيمان به ونفي الشرك وترك الإلحاد في صفاته وطاعته. لكتابه: الإيمان بأنه كلام الله وتعظيمه وتلاوته حق تلاوته والوقوف على أحكامه. لرسوله: تصديقه وطاعته ونصرته حياً وميتاً ومعاداة من عاداه."}, {"s": "hadith", "q": "ما سبب ورود حديث: أمرت أن أقاتل الناس؟", "a": "لما توفي النبي ﷺ وارتد من ارتد ومنع بعضهم الزكاة، عزم أبو بكر على قتالهم، فقال عمر: كيف تقاتلهم وقد قالوا لا إله إلا الله؟ فقال أبو بكر: الزكاة حق المال، والله لو منعوني عناقاً كانوا يؤدونها لرسول الله لقاتلتهم عليها."}, {"s": "hadith", "q": "من المراد بالناس في: أمرت أن أقاتل الناس؟ وما معنى: وحسابهم على الله؟", "a": "أهل الأوثان ومشركو العرب دون أهل الكتاب. وحسابهم على الله: فيما يسرونه، ويستفاد منه أن من أظهر الإسلام وأسر الكفر يقبل إسلامه في الظاهر."}, {"s": "hadith", "q": "ما قصة حديث: ما نهيتكم عنه فاجتنبوه؟", "a": "قال ﷺ: يا أيها الناس قد فرض الله عليكم الحج فحجوا، فقال الأقرع بن حابس: أكل عام؟ فسكت حتى قالها ثلاثاً، فقال: لو قلت نعم لوجبت ولما استطعتم."}, {"s": "hadith", "q": "ما الذي يدل عليه: ذروني ما تركتكم؟ وما الذي يؤخذ من: لو قلت نعم لوجبت؟", "a": "الأول: أن الأصل عدم الوجوب ولا حكم قبل ورود الشرع. الثاني: أنه كان له أن يجتهد في الأحكام ولا يشترط أن يكون حكمه بوحي."}, {"s": "hadith", "q": "هل قوله تعالى: اتقوا الله حق تقاته منسوخ بقوله: فاتقوا الله ما استطعتم؟", "a": "ليست منسوخة، بل الثانية مفسرة للأولى."}, {"s": "hadith", "q": "في حديث إن الله طيب: يطيل السفر في ماذا؟ وما معنى فأنى يستجاب له؟", "a": "في وجوه الطاعات كالحج والجهاد. فأنى يستجاب له: من أين يستجاب لمن هذه صفته، فليس أهلاً للإجابة."}, {"s": "hadith", "q": "ما ضبط (يريبك) ومعناه؟ وإلى أي حديث يرجع؟", "a": "بالضم والفتح، والفتح أفصح. معناه: اترك ما شككت فيه إلى ما لا تشك فيه. ويرجع إلى الحديث السادس: الحلال بين."}, {"s": "hadith", "q": "ماذا قال أبو داود عن حديث: من حسن إسلام المرء تركه ما لا يعنيه؟", "a": "أصول السنن في كل فن أربعة أحاديث، وذكر منها هذا الحديث."}, {"s": "hadith", "q": "هل معنى (لا يؤمن أحدكم حتى يحب لأخيه) نفي الإيمان بالكلية؟", "a": "لا، المراد نفي الإيمان التام، وأصل الإيمان حاصل. وقال أبو الزناد: ظاهره التساوي وحقيقته التفضيل لأن الإنسان يحب أن يكون أفضل الناس."}, {"s": "hadith", "q": "من الثيب الزاني؟ وهل الحرية شرط في المكافأة في: النفس بالنفس؟", "a": "المحصن ذكراً أو أنثى. الحرية والإسلام شرط عند مالك والشافعي وأحمد لحديث: لا يقتل مسلم بكافر، وذهب أصحاب الرأي إلى قتل المسلم بالذمي والحر بالعبد."}, {"s": "hadith", "q": "هل الصائل داخل في: المفارق للجماعة؟", "a": "الظاهر أنه عام يُخص منه الصائل، فيباح قتله دفعاً لأذاه، أو يقال: المراد لا يحل تعمد قتله قصداً إلا في الثلاثة."}, {"s": "hadith", "q": "كيف فسر أهل العلم: فليقل خيراً أو ليصمت؟ وكيف يكون إكرام الجار والضيف؟", "a": "إذا أراد الكلام فإن كان خيراً محققاً فليتكلم وإلا فليمسك سواء ظهر أنه حرام أو مكروه أو مباح. الإكرام: البشاشة وطيب الحديث، وعماد الضيافة إطعام الطعام."}, {"s": "hadith", "q": "لماذا خص النبي ﷺ الرجل بوصية: لا تغضب؟", "a": "لأنه علم منه كثرة الغضب. والغضب من الشيطان، يُخرج الإنسان عن اعتداله فيتكلم بالباطل."}, {"s": "hadith", "q": "ما ضبط القِتلة والذِبحة؟ وما معنى إحسان الذبح؟", "a": "بكسر القاف والذال: الهيئة والحالة. إحسان الذبح: الرفق بالبهيمة وتوجيهها للقبلة والتسمية وقطع الحلقوم والودجين، وهو عام في القتل قصاصاً أو حداً."}, {"s": "hadith", "q": "ما قصة حديث: اتق الله حيثما كنت؟", "a": "أسلم أبو ذر بمكة وأمره النبي ﷺ أن يلحق بقومه، فلما رأى حرصه على المقام معه قال له: اتق الله حيثما كنت وأتبع السيئة الحسنة تمحها."}, {"s": "hadith", "q": "اذكر بعض مناقب ابن عباس.", "a": "دعا له النبي ﷺ: اللهم فقهه في الدين وعلمه التأويل، ودعا له بالحكمة مرتين، ورأى جبريل مرتين، وهو حبر هذه الأمة وحبرها."}, {"s": "hadith", "q": "ما معنى: احفظ الله تجده تجاهك؟ وما الذي يفيده: إذا سألت فاسأل الله؟", "a": "اعمل له بالطاعة ولا يراك في مخالفته فإنك تجده تجاهك في الشدائد. والثاني: الإرشاد إلى التوكل على الله وعدم التعلق بغيره."}, {"s": "hadith", "q": "ما معنى: من كلام النبوة الأولى؟ وما وجها: فاصنع ما شئت؟", "a": "أن الحياء لم يزل ممدوحاً لم ينسخ في شرائع الأنبياء. الوجهان: أمر بمعنى الوعيد والتهديد، أو: ائت كل ما لا يُستحيا منه."}, {"s": "hadith", "q": "من الرجل السائل في حديث: أرأيت إذا صليت المكتوبات؟ وماذا أراد بتحريم الحرام؟", "a": "النعمان بن قوقل. أراد أمرين: أن يعتقد كونه حراماً وألا يفعله، بخلاف تحليل الحلال فيكفي اعتقاد حله."}, {"s": "hadith", "q": "على ماذا يدل عدم ذكر التطوعات في حديث النعمان بن قوقل؟ ولماذا ترك النبي ﷺ التنبيه عليها؟", "a": "على جواز ترك التطوعات على الجملة، ومن داوم على تركها كان نقصاً في دينه، ولو تواطأ أهل بلد على ترك سنة لقوتلوا. وترك التنبيه تسهيلاً للسائل لقرب عهده بالإسلام. وحكمة مشروعية السنن: تتميم الفرائض."}, {"s": "hadith", "q": "ما معنى: الطهور شطر الإيمان؟", "a": "قيل: الأجر فيه ينتهي إلى نصف أجر الإيمان. وقيل: المراد بالإيمان الصلاة."}, {"s": "hadith", "q": "ما معنى: الصلاة نور؟ والصدقة برهان؟", "a": "الصلاة نور: تمنع المعاصي، أو تكون نوراً لصاحبها يوم القيامة، أو نوراً على وجهه. الصدقة برهان: يفزع إليها كالبراهين إذا سئل عن مصرف ماله، أو حجة على إيمان فاعلها."}, {"s": "hadith", "q": "اذكر بعض تعريفات السلف للصبر، وهل الشكوى تنافيه؟", "a": "الصبر: الثبات على الكتاب والسنة، أو الوقوف مع البلاء بحسن الأدب. وإظهار البلاء على وجه الشكوى لا ينافيه، فقد قال أيوب: مسني الضر، ووصفه الله بالصبر."}, {"s": "hadith", "q": "ما معنى: كل الناس يغدو فبائع نفسه فمعتقها أو موبقها؟", "a": "كل إنسان يسعى لنفسه، فمنهم من يبيعها لله بطاعته فيعتقها من العذاب، ومنهم من يبيعها للشيطان فيوبقها."}, {"s": "hadith", "q": "ما معنى: إني حرمت الظلم على نفسي؟ وما أصل: فلا تظالموا؟", "a": "لا ينبغي لي ولا يجوز علي، فالظلم محال في حق الله. وأصلها: فلا تتظالموا، حذفت إحدى التاءين."}, {"s": "hadith", "q": "ما الذي يفيده: كلكم ضال إلا من هديته؟ و: إنكم تخطئون بالليل والنهار؟ و: أغفر الذنوب جميعاً؟", "a": "الأول: التنبيه على فقرنا وعجزنا، ويرجع إلى معنى لا حول ولا قوة إلا بالله. الثاني: التوبيخ. الثالث: لئلا يقنط أحد من رحمة الله لعظم ذنبه."}, {"s": "hadith", "q": "ما معنى الدثور؟ وما الحكم الفقهي المأخوذ من حديث: ذهب أهل الدثور بالأجور؟", "a": "الدثور: المال الكثير. يؤخذ منه جواز سؤال المستفتي عن الدليل إذا لم يكن فيه سوء أدب، وجواز القياس (قياس العكس) في قوله: أرأيتم لو وضعها في حرام."}, {"s": "hadith", "q": "ما معنى سلامى؟ وكم عددها؟ وما الذي يجزئ عن جميع هذه الصدقات؟", "a": "المفاصل والأعضاء، وهي ثلاثمائة وستون. ويجزئ عنها ركعتا الضحى. والصدقة هنا ترغيب لا إيجاب."}, {"s": "hadith", "q": "ما المراد بحسن الخلق في حديث: البر حسن الخلق؟", "a": "الإنصاف في المعاملة والرفق والعدل في الأحكام والبذل في الإحسان واحتمال الأذى."}, {"s": "hadith", "q": "كيف يُجمع بين: وإن تأمّر عليكم عبد، وقول العلماء إن العبد لا يكون والياً؟", "a": "ضرب المثل على التقدير وإن لم يكن، كقوله: من بنى لله مسجداً كمفحص قطاة. أو أخبر بفساد الأمر حتى توضع الولاية في العبيد فيُسمع ويطاع تغليباً لأهون الضررين."}, {"s": "hadith", "q": "من الخلفاء الراشدون؟ ولماذا أُمر بالثبات على سنتهم؟", "a": "أبو بكر وعمر وعثمان وعلي بالإجماع. لأمرين: التقليد لمن عجز عن النظر، والترجيح لما ذهبوا إليه عند اختلاف الصحابة."}, {"s": "hadith", "q": "ما المراد بالصوم في: الصوم جنة؟ وما معنى جنة؟ وما المراد بالصدقة في: الصدقة تطفئ الخطيئة؟", "a": "الصوم هنا غير رمضان والمراد الإكثار منه، والجُنة: الوقاية والسترة من النار. والصدقة هنا غير الزكاة."}, {"s": "hadith", "q": "لماذا ذكر النبي ﷺ الجهاد ثم أخذ بلسانه وقال: كف عليك هذا؟", "a": "ليحضه أولاً على جهاد الكفار، ثم نقله إلى الجهاد الأكبر وهو جهاد النفس."}, {"s": "hadith", "q": "اذكر حديثاً موافقاً لقوله: وسكت عن أشياء رحمة لكم.", "a": "ذروني ما تركتكم فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم."}, {"s": "hadith", "q": "ما معنى الضرر والضرار؟", "a": "أقوال: لفظان بمعنى واحد للتأكيد. الضرر الاسم والضرار الفعل. رأي ابن دقيق العيد: الضرر ما لك فيه منفعة وعلى جارك مضرة. أو الضرر أن تضر من لا يضرك، والضرار أن تضر من أضر بك على غير وجه الانتصار بالحق."}, {"s": "hadith", "q": "ما حكم من جحد حقاً عليه ثم ظفر المجحود بمال الجاحد؟", "a": "قيل: ليس له أخذ حقه لحديث: أد الأمانة إلى من ائتمنك ولا تخن من خانك. وقيل: له أن ينتصر ويأخذ حقه لحديث هند مع أبي سفيان."}, {"s": "hadith", "q": "هل اليمين على المدعى عليه في كل مسألة؟", "a": "أجمعوا على استحلافه في الأموال، واختلفوا في غيرها كالطلاق والنكاح والعتق، فذهب بعضهم إلى العموم."}, {"s": "hadith", "q": "ما سبب ورود حديث: من رأى منكم منكراً؟", "a": "أول من بدأ بالخطبة يوم العيد قبل الصلاة مروان، فقام رجل فقال: الصلاة قبل الخطبة، فقال أبو سعيد: أما هذا فقد قضى ما عليه، سمعت رسول الله ﷺ يقول: من رأى منكم منكراً..."}, {"s": "hadith", "q": "ما حكم الأمر بالمعروف والنهي عن المنكر؟ ومتى يتعين؟ ومتى يسقط التغيير؟", "a": "فرض كفاية. ويتعين إذا كان في موضع لا يعلم به إلا هو أو لا يتمكن من إزالته إلا هو، وكمن يرى زوجته أو ولده على منكر. ويسقط إذا خاف القتل أو الضرب."}, {"s": "hadith", "q": "هل يشترط في الآمر بالمعروف أن يكون كامل الحال؟ وهل يختص بأصحاب الولاية؟ وهل ينكر في مسائل الخلاف؟", "a": "لا يشترط كمال الحال لأنه يجب عليه أمر نفسه وأمر غيره. ولا يختص بالولاة في الأمور الظاهرة كالصلاة والزنا وشرب الخمر، أما دقائق الأمور والاجتهاد فللعلماء. والإنكار في المجمع عليه لا المختلف فيه. ولا يجوز التجسس ولا اقتحام الدور بالظنون."}, {"s": "hadith", "q": "ما معنى: وذلك أضعف الإيمان؟", "a": "أقله ثمرة."}, {"s": "hadith", "q": "ما الفرق بين الحسد والغبطة؟ ومتى يوضع الحسد موضع الغبطة؟", "a": "الحسد تمني زوال النعمة وهو حرام، والغبطة تمني مثل حال المغبوط دون زوالها عنه. ويوضع الحسد موضع الغبطة لتقاربهما كحديث: لا حسد إلا في اثنتين."}, {"s": "hadith", "q": "ما معنى: لا يبع بعضكم على بيع بعض؟", "a": "أن يقول لمن اشترى سلعة في مدة الخيار: افسخ وأنا أبيعك مثله أو أجود بثمنه، أو يزيد بعد استقرار الثمن، وهذا حرام بعد الرضى لا قبله."}, {"s": "hadith", "q": "ما معنى الخذلان؟ وما الرواية الأخرى في (لا يحقره)؟ وما معنى: التقوى ها هنا؟", "a": "الخذلان: ترك الإعانة والنصرة، فإذا استعان به في دفع ظالم لزمه إعانته. الرواية الأخرى: لا يُخفره أي لا يغدر بعهده، والصواب: لا يحقره. التقوى ها هنا: أن الأعمال الظاهرة لا تحصّل التقوى وإنما تقع بما في القلب من عظمة الله وخشيته. ومن الاحتقار: ألا يسلم عليه ولا يرد سلامه."}, {"s": "hadith", "q": "ما معنى تنفيس الكربة؟ ومتى يكون الستر ومتى يكون الإنكار؟", "a": "تنفيس الكربة: إزالتها. الستر على ذوي الهيئات غير المعروفين بالفساد في معصية وقعت وانقضت، أما المتلبس بها فيجب الإنكار عليه، ويجب تجريح الرواة والشهود عند الحاجة وليس من الغيبة."}, {"s": "hadith", "q": "ما معنى السكينة؟ وحفتهم الملائكة؟ وذكرهم الله فيمن عنده؟", "a": "السكينة: الطمأنينة والوقار (وقيل الرحمة وهو ضعيف لعطف الرحمة عليها). حفتهم: أحدقوا بهم حتى لم يدعوا فرجة لشيطان. فيمن عنده: الأنبياء وكرام الملائكة."}, {"s": "hadith", "q": "لماذا جعل الله الهم بالحسنة حسنة ولم يجعل الهم بالسيئة سيئة؟ وهل تكتب حسنة لمن ترك السيئة مكرهاً أو عاجزاً؟", "a": "لأن إرادة الخير فعل القلب، ومن كف عن الشر فقد فسخ اعتقاده بنية خير وعصى هواه فجوزي بحسنة. ومن تركها مكرهاً أو عاجزاً لا تكتب له حسنة."}, {"s": "hadith", "q": "ما الحكمة من مضاعفة الأجور لهذه الأمة؟ وكيف تكون الأضعاف الكثيرة؟", "a": "لما قصرت أعمارهم أخلفهم الله بتضعيف أعمالهم. والكثرة كحبة بر يتصدق بها فتزرع وتحصد إلى يوم القيامة، أو درهم يتصدق به على فقير فيؤثر به فقيراً آخر وهكذا."}, {"s": "hadith", "q": "من ولي الله؟ وهل المعاداة في الحديث عامة؟ وما معنى: كنت سمعه الذي يسمع به؟", "a": "ولي الله: من يتبع ما شرعه الله. المعاداة التي لأجل ولاية الله لا الخصومة في حق. ومعنى كنت سمعه: أنه لا يسمع ولا يبصر ولا يمشي إلا فيما أذن له الشرع به."}, {"s": "hadith", "q": "ما سبب نزول: لا يكلف الله نفساً إلا وسعها؟", "a": "لما نزلت: وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله، شق ذلك على الصحابة فقالوا: كُلفنا ما لا نطيق، فقال ﷺ: قولوا سمعنا وأطعنا، فمكثوا حولاً فأنزل الله: لا يكلف الله نفساً إلا وسعها... فنسخت الأولى."}, {"s": "hadith", "q": "لماذا حض النبي ﷺ على التشبه بالغريب وابن السبيل؟", "a": "الغريب إذا دخل بلدة لم ينافس أهلها في مجالسهم ولا يجزع أن يُرى على خلاف عادته في الملبوس، وعابر السبيل لا يتخذ داراً ولا يلج في الخصومات نظراً لقصر لبثه."}, {"s": "hadith", "q": "اذكر آية تدل على معنى حديث: لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به، وسبب نزولها.", "a": "فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم. نزلت في خصومة الزبير مع رجل من الأنصار في الماء، فقال ﷺ: اسق يا زبير ثم سرح الماء إلى جارك، فقال الأنصاري: أن كان ابن عمتك، فقال: يا زبير احبس الماء حتى يبلغ الجدر."}, {"s": "hadith", "q": "ما شروط التوبة كاملة كما في شرح الحديث الثاني والأربعين؟", "a": "الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود، وإن كانت في حق آدمي فليبادر بأداء الحق إليه، وإن كانت فيها كفارة فلا بد من الكفارة."}], "mcq": [{"s": "hadith", "q": "حديث (إنما الأعمال بالنيات) رواه:", "o": ["عمر بن الخطاب", "ابن عمر", "أبو هريرة", "علي بن أبي طالب"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "سند حديث النية:", "o": ["مشهور بالنسبة لآخره غريب بالنسبة لأوله", "متواتر", "غريب مطلقاً", "مشهور مطلقاً"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "الذي لم يرو حديث النية عن عمر إلا هو:", "o": ["علقمة", "محمد بن إبراهيم التيمي", "يحيى بن سعيد", "مالك"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "سبب ورود حديث النية:", "o": ["مهاجر أم قيس", "سؤال الأقرع بن حابس", "خطبة مروان", "قصة الزبير"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "أصول الإسلام على ثلاثة أحاديث عند الإمام أحمد، ليس منها:", "o": ["الدين النصيحة", "إنما الأعمال بالنيات", "الحلال بين", "من أحدث في أمرنا"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "القاعدة الأصولية المأخوذة من حديث (من أحدث في أمرنا):", "o": ["النهي يقتضي الفساد", "الأمر يقتضي الوجوب", "الأصل في الأشياء الإباحة", "اليقين لا يزول بالشك"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "حديث (الدين النصيحة) رواه:", "o": ["تميم الداري", "أبو هريرة", "أبو سعيد الخدري", "النعمان بن بشير"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "النصيحة لغة:", "o": ["الإخلاص", "الموعظة", "الصدق", "الأمر بالمعروف"], "c": 0, "sc": "core"}, {"s": "hadith", "q": "الرجل السائل في (أكل عام يا رسول الله؟):", "o": ["الأقرع بن حابس", "النعمان بن قوقل", "عكاشة بن محصن", "سراقة بن مالك q": "الصبر ثلاثة: صبر على ........ وصبر عن ........ وصبر على ........", "a": "طاعة الله، معصية الله، أقدار الله المؤلمة"}, {"s": "hadith", "q": "في الحديث (ليس عليه أمرنا) أي ليس عليه ........", "a": "حكمنا وديننا"}, {"s": "hadith", "q": "(فهو رد) أي ........", "a": "مردود باطل غير معتد به"}, {"s": "hadith", "q": "حديث (إياكم ومحدثات الأمور) رواه الصحابي ........ وأخرجه ........", "a": "العرباض بن سارية، أبو داود والترمذي"}, {"s": "hadith", "q": "الرجل الذي سأل: أكل عام يا رسول الله؟ هو ........", "a": "الأقرع بن حابس"}, {"s": "hadith", "q": "الدثور معناها ........", "a": "الأموال الكثيرة"}, {"s": "hadith", "q": "سلامى معناها ........ وعددها ........", "a": "المفصل، ثلاثمائة وستون"}]}, "aqeedah": {"name": "العقيدة", "source": "بريق الجمان بشرح أركان الإيمان", "notes": "# بَريق الجُمان بشرح أركان الإيمان — ملخص مرجعي\n\n> المصدر: كتاب «بَريق الجُمان بشرح أركان الإيمان»، مكتبة الشؤون الفنية — وزارة الأوقاف والشؤون الإسلامية بدولة الكويت.\n> هذا الملخص مستخرج من نص الكتاب، بتعريفاته وأقسامه وأدلته كما وردت فيه.\n\n---\n\n## التمهيد: مدخل لدراسة العقيدة الإسلامية\n\n### أولاً: تعريف العقيدة\n\n**لغةً:** مأخوذة من العَقْد، وهو: الشدُّ والربط والإيثاق والثبوت والإحكام. وعَقْدُ الحبل: شَدُّ بعضه ببعض، نقيض حلِّه. وفي القرآن: ﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ﴾ [المائدة: ٨٩]، وتعقيدُ الأيمان إنما يكون بقصد القلب وعَزْمِه، بخلاف لغو اليمين التي تجري على اللسان بدون قصد.\n\n**اصطلاحاً (في الاصطلاح العام):** الإيمان الجازم والحكم القاطع الذي لا يتطرق إليه الشكُّ لدى المعتقِد، بصرف النظر عن نوع الاعتقاد: حقٍّ أو باطل. وسُمِّيَت (عقيدة) لأن الإنسان يعقِدُ عليها قلبَه.\n\nوقد شاع مصطلح (العقيدة) في دراسات علماء المسلمين على المباحث المتعلِّقة بالله تعالى: من حيث وجودُه، وربوبيتُه، وألوهيتُه، وأسماؤه، وصفاته، والإيمان بملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره، وبكل ما جاءت به النصوص الصحيحة من أصول الدين، وأمور الغيب، وأخباره، وما أجمع عليه السلف الصالح، والتسليم لله تعالى في الحكم والأمر، والقدر والشرع، ولرسوله بالطاعة والتحكيم والاتباع.\n\n### ثانياً: التعريف بأهل السنة والجماعة\n\n**١ – السنة:**\n- **لغة:** السيرة، حسنةً كانت أم قبيحة، والأصل فيها: الطريقة والسيرة.\n- **عند المحدثين:** ما أُضيف إلى النبي ﷺ من قوله وفعله وتقريره، فهي مرادفة للحديث.\n- **عند أكثر السلف قديماً:** موافقة كتاب الله تعالى وسنة الرسول ﷺ وأصحابه رضي الله عنهم، سواءً في أمور الاعتقادات أو العبادات. ويقابل (السنة) على هذا الإطلاق: **البدعة**.\n- **عند كثير من السلف قديماً وحديثاً:** تتناول موافقة الكتاب والسنة في العبادات والاعتقادات، إلا أنه يغلبُ استعمالُها في موافقة الكتاب والسنة في الاعتقادات، والإطلاق الأول أشمل.\n\n**٢ – الجماعة:**\n- **لغة:** من (جمع)، يقال: جَمْعُ المتفرق، والجماعةُ ضد الفرقة.\n- **اصطلاحاً:** اختلفت عبارات أهل العلم، وذكر بعض العلماء فيها **ستة أقوال** مع ذكر أدلتها:\n  1. السواد الأعظم من أهل الإسلام.\n  2. إجماع العلماء المجتهدين.\n  3. الصحابة على الخصوص.\n  4. جماعة أهل الإسلام إذا اجتمعوا على أمر.\n  5. جماعة المسلمين إذا اجتمعوا على أمير.\n  6. جماعة الحق وأهله.\n\nولا تعارض بين هذه الأقوال من حيث المعنى؛ فتفسير (الجماعة) بالصحابة باعتبار كونهم على الحق وهم أهله، وكانوا السواد الأعظم، وباعتبار أنهم مأخوذ عنهم: فهم سلفٌ لمن بعدهم.\n\n**٣ – أهل السنة والجماعة:** أهلُ الشيء: أخصُّ الناس به. فأهل السنة والجماعة هم: **أخصُّ الناس بالسنة والجماعة، وأكثرهم تمسكاً بها واتباعاً لها قولاً وعملاً واعتقاداً**. وهم الصحابة والتابعون ومن تبعهم بإحسان من العلماء المجتهدين، السائرين على منهج الكتاب والسنة، ومن تبعهم في ذلك، إلى أن يرث الله تعالى الأرضَ ومن عليها.\n\n### ثالثاً: قواعد عامة في اعتقاد أهل السنة والجماعة\n\n**١ – مصادر عقيدة أهل السنة والجماعة:** عقيدتُهم توقيفيَّة، تقوم على التسليم بما جاء عن الله تعالى وعن رسوله ﷺ، **دون تحريف ولا تأويل، ولا تعطيل ولا تمثيل**.\n\nولها **مصدران أساسيان**:\n- أ – القرآن الكريم.\n- ب – السنة النبوية الصحيحة.\n\nوالإجماعُ المعتبَر في تقرير العقيدة مبنيٌّ على الكتاب والسنة أو أحدهما.\nوالفطرةُ والعقلُ السليم: **رافدان مؤيدان لا يستقلان بتقرير تفصيلات العقيدة وأصول الدين**، فهما يوافقان الكتاب والسنة ولا يعارضانهما.\n\nوإذا ورد ما يوهِم التعارضَ بين النقل والعقل: **اتُّهمت العقول**؛ فإن النقل الثابت مقدَّمٌ ومحكَّمٌ في الدين، وتقديمُ عقول الناس وآرائهم الناقصة المتضاربة على كلام الله ورسوله ضلالٌ وتعسُّف، وهو سبب ضلال كثير من الفرق الكلامية.\n\n**٢** – ما صحَّ عن رسول الله ﷺ وإن كان من أخبار الآحاد: **وجَبَ قبولُه واعتقادُه**.\n\n**٣** – ما اختُلِف فيه من أصول الدين: فمردُّه إلى الله تعالى ورسوله ﷺ (الكتاب والسنة) كما فهمهما الصحابة والتابعون ولهم من أئمة الدين.\n\n**٤** – أصول الدين والعقيدة توقيفية قد بيَّنها رسول الله ﷺ بالقرآن والسنة؛ فكلُّ محدثةٍ في الدين بدعة، وكل بدعة ضلالة. ودليلُه: ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي﴾ [المائدة: ٣]، وقوله ﷺ: «من أحدثَ في أمرنا هذا ما ليس منه فهو ردٌّ» (متفق عليه: البخاري ٢٦٩٧، ومسلم ١٧١٨، عن عائشة رضي الله عنها). وهذا الحديث قاعدةٌ من قواعد الدين، وأصلٌ من أصول العقيدة.\n\n**٥** – لا يجوز تأويلُ نصوص العقيدة، ولا صرفُها عن ظاهرها بغير دليل شرعيٍّ ثابتٍ عن المعصوم ﷺ.\n\n---\n\n## الباب الأول: الإيمان بالله تعالى\n\n### الفصل الأول: في بيان معنى الإيمان وما يتعلق به\n\n#### المبحث الأول: تعريف الإيمان لغةً واصطلاحاً\n\n**لغةً:** الإيمان مصدرُ آمَنَ يؤمنُ إيماناً فهو مؤمن، وأصلُ آمَنَ (أَأْمَنَ) بهمزتين، لُيِّنَت الثانية، **وهو من الأمن ضد الخوف**.\n\nوقد عُرِّف في اللغة بعدة تعريفات: فأكثرُ المتكلمين على أنه التصديق، وقيل: الثقة، وقيل: الطمأنينة، وقيل: الإقرار.\n\n**والصحيح أن الإيمان في اللغة ليس مرادفاً للتصديق؛** لأن هناك فروقاً بين الإيمان والتصديق في اللفظ والمعنى تمنع دعوى الترادف:\n\n* **فروق في اللفظ:** التصديق يتعدَّى بنفسه، والإيمان لا يتعدَّى بنفسه؛ فنقول: صدَّقته، ولا نقول: آمنته، بل نقول: آمنتُ به، أو: آمنتُ له.\n* **فروق في المعنى:**\n  1. كلُّ خبرٍ – عن مشاهدةٍ أو غيب – يُقال للمخبرين عنه: صدقت، أما لفظ الإيمان فلا يُستعمل إلا في الخبر عن غائب؛ فلو قال: طلعت الشمس، لا يُقال: آمنَّاه، بل: صدَّقناه؛ لأن الإيمان مشتقٌّ من (الأمن)، فيُستعمل في خبرٍ يؤتمَن عليه المُخبِر. فاللفظ متضمِّنٌ مع التصديق معنى الائتمان والأمانة.\n  2. لفظُ (الإيمان) يضمُّ معاني الحب والموالاة، وضدُّه (الكفر) الذي يضمُّ معاني البغض والمعاداة، والتصديقُ والتكذيب يخلُوان من هذه المعاني.\n  3. لفظ الإيمان في اللغة لا يُقابَل بالتكذيب كلفظ التصديق.\n\n**اصطلاحاً (عند أهل السنة والجماعة):** الإيمان **قولٌ وعمل**، ويشمل خمسة أمور:\n\n1. **قول القلب:** وهو تصديقُه وإيقانُه. الدليل: ﴿وَالَّذِي جَاءَ بِالصِّدْقِ وَصَدَّقَ بِهِ أُولَٰئِكَ هُمُ الْمُتَّقُونَ﴾ [الزمر: ٣٣–٣٤]، ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [الحجرات: ١٥]، وحديث الشفاعة: «يخرج من النار من قال (لا إله إلا الله) وفي قلبه وزنُ شعيرةٍ من خير» (البخاري ٤٤، ومسلم ١٩٣).\n2. **قول اللسان:** وهو النطقُ بالشهادتَين والإقرار بلوازمهما. الدليل: ﴿قُولُوا آمَنَّا بِاللَّهِ﴾ [البقرة: ١٣٦]، وقوله ﷺ: «أُمِرتُ أن أقاتلَ الناسَ حتى يشهدوا أن لا إلهَ إلا الله وأن محمداً رسول الله» (البخاري ٢٥، ومسلم ٢٢).\n3. **عمل القلب:** وهو النية والإخلاص والمحبة والانقياد والإقبال على الله عز وجل والتوكل عليه ولوازم ذلك وتوابعه. ومن أدلته: ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ﴾ [الأنفال: ٢].\n4. **عمل اللسان:** وهو العمل الذي لا يؤدَّى إلا به، كتلاوة القرآن، وسائر الأذكار من التسبيح والتحميد والتكبير والدعاء والاستغفار. ومن أدلته: ﴿إِنَّ الَّذِينَ يَتْلُونَ كِتَابَ اللَّهِ﴾ [فاطر: ٢٩].\n5. **عمل الجوارح:** وهو العمل الذي لا يؤدَّى إلا بها، مثل القيام والركوع والسجود والمشي في مرضاة الله، كنقل الخطا إلى المساجد وإلى الحج والجهاد في سبيل الله. ومن أدلته: ﴿وَقُومُوا لِلَّهِ قَانِتِينَ﴾ [البقرة: ٢٣٨]، ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا﴾ [الحج: ٧٧–٧٨].\n\nوهذا الإيمان يشمل: الإيمانَ بكل ما أخبر الله به في كتابه أو أخبر عنه رسولُه ﷺ من أمور الغيب والشهادة جملةً وتفصيلاً، ومن ذلك الإيمانُ بالله تعالى وتوحيدُه بالربوبية والألوهية والأسماء والصفات، وكذلك بقيةُ أركان الإيمان الستة.\n\n#### المبحث الثاني: زيادة الإيمان ونقصانه\n\n**الإيمانُ يزيدُ بالطاعة، وينقُصُ بالمعصية، وعليه إجماعُ أئمة السنة**، نقل الإجماعَ عددٌ من الأئمة.\n\nوالأدلةُ على ذلك كثيرة جداً، وهي في القرآن فقط أكثر من **عشرة أنواع**. وقد ورد **التصريحُ بزيادة الإيمان في ستة مواضع** من القرآن الكريم، منها:\n1. ﴿الَّذِينَ قَالَ لَهُمُ النَّاسُ إِنَّ النَّاسَ قَدْ جَمَعُوا لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمْ إِيمَانًا﴾ [آل عمران: ١٧٣].\n2. ﴿وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا﴾ [الأنفال: ٢].\n3. ﴿وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنْهُم مَّن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا﴾ [التوبة: ١٢٤].\n4. ﴿وَمَا زَادَهُمْ إِلَّا إِيمَانًا وَتَسْلِيمًا﴾ [الأحزاب: ٢٢].\n\n**ومن أدلة السنة:**\n1. حديث أبي هريرة: «الإيمانُ بضعٌ وسبعون – أو بضعٌ وستون – شعبة، **فأفضلُها: قول (لا إله إلا الله)، وأدناها: إماطةُ الأذى عن الطريق، والحياءُ شعبةٌ من الإيمان**» (البخاري ٩، ومسلم ٣٥). فقد جعل الحديثُ القولَ من الإيمان والعملَ من الإيمان، وهذا يدل على أن الإيمان **قولٌ وعمل خلافاً للمرجئة**، كما أن قولَه «أفضلُها» و«أدناها» يدل على زيادة الإيمان ونقصانه صراحةً.\n2. حديث أنس: «يخرجُ من النار من قال (لا إله إلا الله) وفي قلبه وزنُ شعيرةٍ من خير، ويخرجُ من النار من قال (لا إله إلا الله) وفي قلبه وزنُ بُرَّةٍ من خير، ويخرجُ من النار من قال (لا إله إلا الله) وفي قلبه مثقالُ ذرةٍ من خير» (البخاري ٤٤، ومسلم ١٩٣). وفي رواية حديث الشفاعة: «أدنى أدنى أدنى» وهو دليلٌ صريح على النقصان.\n\n**من نقول الأئمة:**\n- **أبو عبيد القاسم بن سلَّام (ت ٢٢٤هـ):** سمَّى **أكثر من مائةٍ وثلاثين رجلاً** من أهل العلم من الصحابة وغيرهم يقولون: الإيمانُ قولٌ وعمل، يزيد وينقص، ثم قال: «هؤلاء كلُّهم يقولون: الإيمانُ قولٌ وعمل، يزيد وينقص، وهو قولُ أهل السنة، والمعمولُ به عندنا».\n- **الإمام البخاري (ت ٢٥٦هـ):** «كتبتُ عن **ألفٍ وثمانين رجلاً**، ليس فيهم إلا صاحبُ حديث، كانوا يقولون: الإيمانُ قولٌ وعمل، يزيد وينقص».\n- **أبو حاتم وأبو زرعة الرازيان:** «أدركنا العلماءَ في جميع الأمصار: حجازاً وعراقاً ومصراً وشاماً ويَمَناً، فكان من مذهبهم أنّ الإيمانَ قولٌ وعمل، يزيد وينقص».\n\n#### المبحث الثالث: الاستثناء في الإيمان\n\n**الاستثناءُ في الإيمان** هو قولُ الإنسان: **أنا مؤمنٌ إن شاء الله تعالى**.\n\nوكان السلفُ يكرهون سؤالَ الرجل لغيره: أمؤمنٌ أنت؟ ويكرهون الجوابَ عن ذلك؛ **لأن هذه بدعةٌ أحدثها المرجئة ليحتجوا بها لقولهم**.\n\nومع أن هذا السؤال بدعة، إلا أن الجواب عنه يكون بالتفصيل، وهو أنه **يجوز الاستثناء باعتبار، وتركُه باعتبار**:\n\n* **أما تركُ الاستثناء:** فإن المستثني إن أراد الشكَّ في أصل إيمانه: **مُنِع من الاستثناء**، وهذا مما لا خلافَ فيه.\n* **وأما جوازُ الاستثناء:** فلاعتبارات أخرى، **ومآخذُ السلف في الاستثناء في الإيمان خمسة**:\n  1. أنّ الإيمانَ المطلقَ شاملٌ لكل ما أمرَ الله به، والبُعد عن كل ما نهى عنه، ولا يدَّعي أحدٌ أنه جاء بذلك كلِّه على التمام والكمال.\n  2. أنّ الإيمانَ النافعَ هو المتقبَّل عند الله تعالى.\n  3. الابتعادُ عن تزكية النفس، وليس هناك تزكيةٌ لها أعظمُ من التزكية بالإيمان.\n  4. أنّ الاستثناء يصحُّ أن يكون في الأمور المتيقَّنة غيرِ المشكوكِ فيها أصلاً، كما جاءت به نصوص الكتاب والسنة.\n  5. أنّ المرءَ المسلم لا يدري بمَ يُختم له، وكيف تكون خاتمتُه، فيستثني خوفاً من سوء الخاتمة، ويسأل الله حسنَ الختام والثباتَ على الإيمان إلى الممات.\n\nفالاستثناءُ في الإيمان **جائزٌ مشروع**؛ لأن الإيمان عند أهل السنة والجماعة شاملٌ للاعتقادات والأقوال والأعمال، **وليس هذا لأجل الشك في أصل الإيمان، وإنما هو تركاً لتزكية النفس**.\n\n### الفصل الثاني: في الإيمان بالله تعالى\n\nالإيمانُ بالله تعالى **أساسُ قواعد وأركان الإيمان وأصلُها**، وهو يعني: الاعتقادَ الجازم بأن الله تعالى ربُّ كل شيء ومليكه، وأنه الخالق المدبِّر للكون كله، وأنه هو الذي يستحق العبادةَ وحده لا شريك له، وأن كلَّ معبودٍ سواه فهو باطل وعبادتُه باطلة، وأنه سبحانه متَّصفٌ بصفات الكمال ونعوتِ الجلال، منزَّهٌ عن كل نقصٍ وعيب.\n\n**وهذا هو التوحيدُ بأنواعه الثلاثة: توحيد الربوبية، وتوحيد الألوهية، وتوحيد الأسماء والصفات.**\n\n#### المبحث الأول: الإيمان بربوبية الله تعالى\n\n**من الدلالات على ربوبية الله تعالى على خلقه:**\n1. **دلالة الفطرة:** فطرَ الله خلقَه على الإقرار بربوبيته، وأنه الخالق الرازق المدبر المحيي المميت؛ فالإيمان بالربوبية أمرٌ جليٌّ مركوزٌ في فطرة كل إنسان، لا يستطيع أحدٌ دفعَه ولا رفعَه. **ولهذا كان المشركون في الجاهلية مقرِّين بربوبية الله تعالى مع شركهم بالألوهية**، ومن ذلك قول عنترة وزهير بن أبي سلمى في أشعارهم.\n2. **دلالة الأنفس:** ﴿وَفِي أَنفُسِكُمْ أَفَلَا تُبْصِرُونَ﴾ [الذاريات: ٢١].\n3. **دلالة الآفاق:** ﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ﴾ [فصلت: ٥٣].\n\n**ثالثاً: إنكار الربوبية:** لم يُنكر ربوبيةَ الله تعالى إلا **شواذٌّ من البشر**، تظاهروا بإنكار الربِّ مع اعترافهم به في باطن أنفسهم وقرارة قلوبهم، وإنكارُهم إنما هو من باب **المكابرة**، كما في قول فرعون: ﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي﴾ [القصص: ٣٨]، مع قول موسى له: ﴿لَقَدْ عَلِمْتَ مَا أَنزَلَ هَٰؤُلَاءِ إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ﴾ [الإسراء: ١٠٢]، وقوله تعالى: ﴿وَجَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ ظُلْمًا وَعُلُوًّا﴾ [النمل: ١٤].\n\n**والردُّ على القائلين بأن العالَم نتيجةٌ للطبيعة:** أن هذا باطلٌ على الاعتبارَين؛ لأن الطبيعة بالاعتبار الأول تكون **خالقةً ومخلوقةً** على حدِّ قولهم، وهذا مستحيل. وأيضاً الطبيعةُ لا شعورَ لها، فهي آلةٌ محضة، فكيف تصدرُ عنها الأفعالُ العظيمة التي في غاية الإبداع والإتقان؟ ومن الملاحدة من يقول بـ**المصادفة**، وهو قولٌ باطلٌ تردُّه العقولُ والفِطَر.\n\n#### المبحث الثاني: الإيمان بألوهية الله تعالى\n\n##### المطلب الأول: تعريفه ومكانته\n\nهو إفرادُ الله تعالى بالعبادة، وهو أولُ ما دعا إليه النبي ﷺ: «أُمِرتُ أن أقاتلَ الناسَ حتى يشهدوا أن لا إلهَ إلا الله»، وقال لمعاذ: «إنك تأتي قوماً أهلَ كتاب، فليكن أولَ ما تدعوهم إليه: شهادةُ أن لا إله إلا الله وأن محمداً رسول الله».\n\nوكما أنه أولُ ما دعا إليه، فقد ذكر فضلَ ختم العمل به: «من ماتَ وهو يعلمُ أن لا إله إلا الله دخلَ الجنة» (مسلم ٢٦)، «لقِّنوا موتاكم لا إله إلا الله» (مسلم ٩١٧)، «من كان آخرُ كلامه لا إله إلا الله دخلَ الجنة».\n\nومن أجل هذا التوحيد قامت الخصومةُ بين الأنبياء وأممهم، ومن أجله جُرِّدت سيوفُ الجهاد في سبيل الله، وهو أولُ الدين وآخرُه، بل هو حقيقةُ دين الإسلام.\n\n##### المطلب الثاني: شهادة أن لا إله إلا الله\n\n**أولاً: معناها وفضلها**\n\n**معناها إجمالاً:** لا معبودَ بحقٍّ إلا الله تعالى؛ أي: لا أحدَ يستحق أن يُعبَد إلا الله تعالى، فلا يجوز أن يُدعى إلا الله، ولا يجوز أن يُصلَّى أو يُنذَر أو يُذبَح إلا لله، وهكذا بقية أنواع العبادة.\n\n**تركيبها:** (لا) نافيةٌ للجنس، و(إله) اسمُها، وخبرُها محذوفٌ تقديرُه: **«حق»**، و(إله) من أَلَهَ – بالفتح – يألَهُ إلاهةً: أي عبدَ يعبدُ عبادة. والإلهُ هو المعبودُ المطاع الذي تألَهُه القلوبُ بالمحبة والتعظيم والخضوع والخوف وتوابع ذلك من بقية أنواع العبادة.\n\n**ركناها:**\n- **الأول: النفي** – وهو نفيُ الإلهية عن كل ما سوى الله تعالى، ويدل عليه: «لا إله».\n- **الثاني: الإثبات** – وهو إثباتُ الإلهية لله تعالى، ويدل عليه: «إلا الله».\n\n**وهي:** كلمةُ التوحيد، والعروةُ الوثقى، وكلمةُ التقوى، وهي حقُّ الله على جميع العباد، وهي **أولُ واجبٍ وآخرُ واجب**، فهي أولُ ما يدخل به العبدُ في الإسلام، وآخرُ ما يخرج به من الدنيا. وهي سببٌ لعصمة دم المسلم وماله وعِرضه إلا بحقها، وبها انقسمت الخليقةُ إلى مؤمنين وكفار، وأبرارٍ وفجار.\n\n**ثانياً: شروطُها ونواقضُها**\n\nفضائلُ هذه الكلمة – من الحكم بإسلام صاحبها، وعصمةِ دمه وماله وعِرضه، ودخولِ الجنة، وعدمِ الخلود في النار – **لا تحصل لكل من نطق بها، بل لا بد من توافر جميع شروطها وانتفاء جميع نواقضها**. قال وهب بن منبِّه لما قيل له: أليس مفتاحُ الجنة لا إله إلا الله؟ قال: «بلى، ولكن ليس مفتاحٌ إلا له أسنان، فإن جئتَ بمفتاحٍ له أسنانٌ فُتِح لك، وإلا لم يُفتح لك». وقال الحسن البصري: «من قال (لا إله إلا الله) فأدَّى حقَّها وفرضَها دخلَ الجنة».\n\n**وشروطُها سبعة:**\n1. **العلم** بمعناها الذي تدل عليه، المنافي للجهل؛ فيعلم أنه لا أحدَ يستحق العبادة إلا الله. الدليل: ﴿فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ﴾ [محمد: ١٩].\n2. **اليقين** المنافي للشك؛ فلا بد أن يؤمن إيماناً جازماً، فإن الإيمان لا يكفي فيه إلا علمُ اليقين، لا الظن ولا التردد. الدليل: ﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾ [الحجرات: ١٥].\n3. **القبول** المنافي للرد؛ فيَقبل بقلبه ولسانه جميعَ ما دلَّت عليه. الدليل: ﴿إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ﴾ [الصافات: ٣٥–٣٦].\n4. **الانقياد** المنافي للترك؛ فينقاد بجوارحه بفعل ما دلَّت عليه من عبادة الله وحده. الدليل: ﴿وَمَن يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ﴾ [لقمان: ٢٢].\n5. **الصدق** المنافي للكذب؛ وهو أن يقول هذه الكلمة صدقاً من قلبه، يوافق قلبُه لسانَه. الدليل: ﴿الم ٭ أَحَسِبَ النَّاسُ أَن يُتْرَكُوا أَن يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ﴾ [العنكبوت: ١–٣]. **ولذلك لم ينتفع المنافقون من نطقهم بهذه الكلمة؛ لأن قلوبهم مكذِّبةٌ بمدلولها.**\n6. **الإخلاص** المنافي للشرك؛ فلا بد من تصفية العمل بصالح النية عن جميع شوائب الشرك. الدليل: ﴿إِنَّا أَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ فَاعْبُدِ اللَّهَ مُخْلِصًا لَّهُ الدِّينَ﴾ [الزمر: ٢].\n7. **المحبة**؛ فلا بد أن يحبَّ المسلمُ هذه الكلمة ويحبَّ ما دلَّت عليه، ويحبَّ أهلَها العاملين بها الملتزمين بشروطها، ويُبغِضَ ما ناقضَ ذلك. الدليل: ﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِّلَّهِ﴾ [البقرة: ١٦٥].\n\n**نواقضُ لا إله إلا الله** – وتسمى نواقضَ الإيمان ونواقضَ التوحيد – وهي الخصالُ التي تحصلُ بها الردَّةُ عن دين الإسلام، فهي كثيرة، وتجتمعُ في **ثلاثة نواقضَ رئيسة** هي:\n1. **الشرك الأكبر.**\n2. **الكفر الأكبر.**\n3. **النفاق الاعتقادي.**\n\nوهي كلُّها تناقضُ **أصلَ الإيمان**. وهناك **وسائلُ إلى الشرك الأكبر**، وهي وإن لم تكن تناقض أصل الإيمان إلا أنها من منقِصاته.\n\n##### المطلب الثالث: العبادة\n\n**لغةً:** الذل؛ يقال: طريقٌ مُعبَّد؛ إذا كان مذلَّلاً قد وطأته الأقدام.\n\n**شرعاً:** اختلفت عبارات العلماء في المبنى مع اتفاقهم في المعنى:\n- تعريفُ طائفة: ما أُمِرَ به شرعاً من غير اطِّرادٍ عرفيٍّ ولا اقتضاءٍ عقلي.\n- تعريفُ بعضهم: كمالُ الحبِّ مع كمال الخضوع.\n- **تعريفُ شيخ الإسلام ابن تيمية (وهو الأدقُّ والأشمل):** اسمٌ جامعٌ لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة. فالدينُ كلُّه داخلٌ في العبادة.\n\n**أركان العبادة ثلاثة – ولا بد من اجتماعها –:**\n1. **المحبة.**\n2. **الرجاء.**\n3. **الخوف.**\n\nلأن من تعلَّق بواحدٍ منها فقط لم يكن عابداً لله تمامَ العبادة:\n* فعبادةُ الله تعالى **بالحب فقط**: هي طريقةُ **منحرفي الزهاد**.\n* وعبادتُه **بالرجاء وحده**: طريقةُ **المرجئة**.\n* وعبادتُه **بالخوف فقط**: طريقةُ **الخوارج**.\n* ومن عبدَ الله بالخوف والرجاء والحب والرغبة: **فهو موحِّدٌ سنِّي**.\n\nوالمحبةُ المنفردة عن الخضوع لا تكون عبادة، كما أن الخضوعَ المنفرد عن المحبة لا يكون عبادة.\n\nوالعبادةُ هي الغايةُ المحبوبة لله المرضيةُ له، وهي التي خلقَ الخلقَ من أجلها: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ [الذاريات: ٥٦]، وبها أرسلَ جميعَ الرسل: ﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾ [النحل: ٣٦].\n\n**وللعبادة أنواعٌ كثيرة:** الصلاة، والزكاة، والصيام، والحج، وصدق الحديث، وأداء الأمانة، وبر الوالدين، وصلة الأرحام، والوفاء بالعهود، والأمر بالمعروف والنهي عن المنكر، والجهاد، والإحسان إلى الأيتام والمساكين وابن السبيل، والدعاء، والذكر، والقرآن... وكذلك حبُّ الله وحبُّ رسوله ﷺ، وخشيةُ الله والإنابة إليه، وكذلك الذبح والنذر والاستعاذة والاستعانة والاستغاثة.\n\n**فيجب صرفُ العبادة بجميع أنواعها لله تعالى وحده لا شريك له؛ فمن صرف منها شيئاً لغير الله تعالى فقد أشرك الشركَ الأكبر، وأذنبَ الذنبَ الذي لا يُغفر إلا بالتوبة.**\n\n##### المطلب الرابع: أساليب القرآن الكريم في الدعوة إلى الإيمان بألوهية الله تعالى\n\nلمَّا كانت ربوبيةُ الله قد أقرَّت بها الناسُ بموجب فطرهم ونظرهم في الكون، وكان الإقرارُ به وحده لا يكفي للإيمان بالله تعالى ولا يُنجي صاحبَه من العذاب: ركَّزت دعواتُ الرسل على الإيمان بألوهية الله تعالى. ومن أساليب القرآن في ذلك:\n1. أمرُه سبحانه بعبادته وتركِ عبادةِ ما سواه.\n2. إخبارُه أنه خلقَ الخلقَ لعبادته.\n3. إخبارُه أنه أرسلَ جميعَ الرسل بالدعوة إلى عبادته والنهي عن عبادة ما سواه.\n4. الاستدلالُ على توحيد الألوهية بانفرادِه بالربوبية والخلق والتدبير.\n5. الاستدلالُ على وجوب عبادته بانفرادِه بصفات الكمال وانتفاءِ ذلك عن آلهة المشركين.\n6. تعجيزُه لآلهة المشركين.\n7. تسفيهُ المشركين الذين يعبدون غيرَ الله.\n8. بيانُ عاقبة المشركين، وتبرُّؤِ المعبودات منهم في أحرج المواقف.\n9. ردُّه سبحانه على المشركين في اتخاذهم الوسائطَ بينهم وبين الله: بأن **الشفاعةَ ملكٌ له سبحانه، لا تُطلَبُ إلا منه، ولا يشفعُ أحدٌ عنده إلا بإذنه بعد رضاه عن المشفوع له**.\n\n#### المبحث الثالث: الإيمان بأسماء الله تعالى وصفاته\n\nأسماءُ الله تعالى وصفاتُه **من الغيب** الذي لا يعرفه الإنسانُ على وجه التفصيل إلا بطريق السمع؛ لأن البشر لا يحيطون بالله علماً: ﴿وَلَا يُحِيطُونَ بِهِ عِلْمًا﴾ [طه: ١١٠]. **والكلامُ في الصفات فرعٌ عن الكلام في الذات.**\n\n##### المطلب الأول: طريقة أهل السنة والجماعة في أسماء الله تعالى وصفاته\n\nتتلخصُ في **ثلاثة أمور رئيسة**:\n\n**الأمر الأول: طريقتُهم في الإثبات:**\nإثباتُ ما أثبته الله تعالى لنفسه في كتابه، أو على لسان رسوله ﷺ، **من غير تحريف، ولا تعطيل، ومن غير تكييف، ولا تمثيل**. فيؤمنون بأن جميعَ ما ثبتَ في النصوص الشرعية من صفات الله تعالى: أنها صفاتٌ حقيقيةٌ تليق بجلال الله تعالى، وأنها لا تماثلُ صفاتِ المخلوقين.\n\nويؤمنون كذلك بجميع أسماء الله الثابتة في النصوص، **وبأن كل اسمٍ يتضمن صفةً لله تعالى**؛ فالاسم «العزيز» يتضمن صفة العزة، والاسم «القوي» يتضمن صفة القوة.\n\n**تعريفات مهمة:**\n- **التحريف:** تغييرُ النص لفظاً أو معنى. وهو ثلاثةُ أقسام:\n  1. تحريفٌ لفظيٌّ يتغير معه المعنى (كتحريف: ﴿وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا﴾ بنصب لفظ الجلالة).\n  2. تحريفٌ لفظيٌّ لا يتغير معه المعنى (كفتح الدال من ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾).\n  3. **تحريفٌ معنوي:** وهو صرفُ اللفظ عن ظاهره بلا دليل، **وهذا كثيرٌ عند المعطِّلة من الجهمية والمعتزلة وغيرهم**.\n- **التعطيل:** إنكارُ ما يجب لله تعالى من الأسماء والصفات، أو إنكارُ بعضها، وهو نوعان:\n  1. **تعطيلٌ كلي:** كتعطيل **الجهمية** الذين ينكرون الأسماء والصفات.\n  2. **تعطيلٌ جزئي:** كتعطيل **المعتزلة** الذين ينكرون الصفات دون الأسماء، وكتعطيل بعضِ الفرق الكلامية الذين ينكرون بعضَ الصفات ويؤولونها ويثبتون بعضَها.\n- **التكييف:** حكايةُ كيفية الصفة، كقول القائل: كيفيةُ يد الله تعالى كذا وكذا، وكيفيةُ نزوله تعالى إلى السماء الدنيا كذا وكذا.\n- **التمثيل:** إثباتُ مثيلٍ للشيء، كأن يقول: يدُ الله تعالى مثلُ يد الإنسان، تعالى الله عن ذلك.\n\n**الأمر الثاني: طريقتُهم في النفي:**\nنفيُ ما نفاه الله تعالى عن نفسه في كتابه، أو على لسان رسوله ﷺ من صفات النقص، **مع اعتقادهم ثبوتَ كمال ضد الصفة المنفيَّة عن الله جلَّ وعلا**؛ فالنفي لا يدل على الكمال إلا إذا كان متضمِّناً لصفةٍ ثبوتيةٍ يُحمد عليها. فمما نفى الله عن نفسه: (الظلم) والمرادُ انتفاؤه مع ثبوت كمال ضدِّه وهو (العدل)، ونفى عن نفسه (اللغوب) وهو التعبُ والإعياء، والمرادُ نفيُه مع ثبوت كمال ضدِّه وهو (القوة).\n\n**الأمر الثالث: طريقتُهم فيما لم يرِد نفيُه ولا إثباتُه في الكتاب والسنة:**\nكالجسم، والحيِّز، والجهة ونحو ذلك: **التوقفُ في اللفظ والاستفصالُ في المعنى**؛ فأما اللفظ: فيتوقفون فيه فلا يُثبتونه ولا ينفونه؛ لعدم وروده. وأما معناه: فيستفصلون عنه؛ فإن أُريد به باطلٌ يُنزَّه الله تعالى عنه: ردُّوه، وإن أُريد به حقٌّ لا يمتنع على الله تعالى: قبِلوه.\n\n**وهذه الطريقةُ هي الطريقةُ الواجبة، وهي القولُ الوسط بين أهل التعطيل وأهل التمثيل**، وقد دلَّ على وجوبها وصحتها العقلُ والسمع:\n- **من السمع:** ﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ [الأعراف: ١٨٠] → دلَّت على **وجوب الإثبات من غير تحريف ولا تعطيل ولا تمثيل؛ لأن هذه الأمور الثلاثة من الإلحاد**.\n- ﴿لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾ [الشورى: ١١] → دلَّت على **وجوب نفي التمثيل مع وجوب الإثبات**.\n- ﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾ [الإسراء: ٣٦] → دلَّت على **وجوب نفي التكييف، وعلى وجوب التوقف فيما لم يرِد إثباتُه أو نفيُه**.\n\n##### المطلب الثاني: أقسام الصفات\n\nتنقسمُ صفاتُ الله تعالى من جهة تعلُّقها بذاته وأفعاله إلى **ثلاثة أقسام**:\n\n1. **صفاتٌ ذاتية:** وهي التي لم يزل ولا يزال الله تعالى متصفاً بها، كالعلم، والقدرة، والحياة، والسمع، والبصر، والوجه، واليدين... ونحو ذلك من الصفات العُلى التي هي من لوازم ذاته تعالى.\n2. **صفاتٌ فعلية:** وهي الصفاتُ المتعلقة بمشيئة الله تعالى وقدرته، إن شاء فعلَها وإن شاء لم يفعلها، كالمجيء، والنزول، والغضب، والفرح، ونحو ذلك. **وتسمى: الصفات الاختيارية، أو الأفعال الاختيارية.**\n3. **ذاتيةٌ باعتبار، وفعليةٌ باعتبار آخر:** كصفة **كلامه تعالى**؛ فإن الكلام باعتبار أصله ونوعه **صفةٌ ذاتية**؛ لأن الله تعالى لم يزل ولا يزال متكلماً، وباعتبار آحاد الكلام وأفراده **صفةٌ فعلية**؛ لأن الكلام يتعلق بمشيئته تعالى، فالله سبحانه يكلِّم مَنْ شاء متى شاء كيف شاء: ﴿إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ﴾ [يس: ٨٢].\n\n##### المطلب الثالث: قواعد مهمة في توحيد الأسماء والصفات\n\n**القاعدة الأولى: القول في بعض الصفات كالقول في بعضها الآخر.**\nيُردُّ بها على الذين يُثبتون بعضَ الصفات وينفون بعضَها، كالذين يثبتون لله تعالى الحياة والعلم والقدرة والسمع والبصر والكلام والإرادة ويجعلونها صفاتٍ حقيقية، ثم ينازعون في محبة الله تعالى ورضاه وغضبه وكراهيته، ويجعلون ذلك مجازاً
