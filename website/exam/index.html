م تمسكاً بها قولاً وعملاً واعتقاداً.\n\n## مصادر العقيدة (سؤال سابق)\n1. القرآن الكريم. 2. السنة النبوية الصحيحة (ويجب قبول خبر الآحاد الصحيح واعتقاده). ما اختُلف فيه فمرده إلى الكتاب والسنة بفهم السلف. أصول الدين توقيفية. لا يجوز تأويل نصوص العقيدة بغير دليل.\n\n## الإيمان\n- **لغة**: الإقرار. **اصطلاحاً**: اعتقاد بالقلب ونطق باللسان وعمل بالأركان.\n- **يشتمل على خمسة**: قول القلب (التصديق)، قول اللسان (الشهادتان)، عمل القلب (النية والإخلاص والمحبة والتوكل)، عمل اللسان (كالتلاوة)، عمل الجوارح (كالركوع والحج).\n- **يزيد بالطاعة وينقص بالمعصية** بإجماع أئمة السنة. الدليل: ﴿فزادهم إيماناً﴾، وحديث \"الإيمان بضع وسبعون شعبة\".\n- **الاستثناء في الإيمان** (سؤال سابق): قول \"أنا مؤمن إن شاء الله\". سؤال \"أمؤمن أنت؟\" بدعة أحدثها المرجئة. إن أراد الشك في أصل إيمانه مُنع. **مسوغات جواز الاستثناء خمسة**: أن الإيمان المطلق شامل لكل ما أمر الله به، أن الإيمان النافع هو المتقبل عند الله، الابتعاد عن تزكية النفس، أن الاستثناء يصح حتى في الأمور المتيقنة، الاستثناء خوفاً من سوء الخاتمة.\n\n## أنواع التوحيد ثلاثة\n1. **توحيد الربوبية**: توحيد الله بأفعاله. دلالاته: الفطرة، الأنفس، الآفاق. لم ينكره إلا شواذ البشر من الملاحدة (الدهرية، الشيوعية).\n2. **توحيد الألوهية**: إفراد الله بجميع أنواع العبادة. ويسمى توحيد العبادة والقصد والإرادة والطلب. من أجله خلق الله الخلق وأرسل الرسل. جحده أكثر الخلق.\n3. **توحيد الأسماء والصفات**: إثبات ما أثبته الله لنفسه أو أثبته له رسوله من صفات الكمال، ونفي ما نفاه. جحده الجهمية والمعتزلة.\n- **علاقة التضمن والاستلزام**: توحيد الألوهية يتضمن توحيد الربوبية، وتوحيد الربوبية يستلزم توحيد الألوهية.\n\n## شهادة أن لا إله إلا الله\n- **معناها**: لا معبود بحق إلا الله. **ركناها**: النفي (نفي الألوهية عن كل ما سوى الله) والإثبات (إثباتها لله).\n- **شروطها سبعة** (سؤال سابق: اذكر أربعة): العلم المنافي للجهل، اليقين المنافي للشك، القبول المنافي للرد، الانقياد المنافي للترك، الصدق المنافي للكذب، الإخلاص المنافي للشرك، المحبة.\n- **نواقضها**: تجتمع في ثلاثة: الشرك الأكبر، الكفر الأكبر، النفاق الاعتقادي.\n\n## العبادة\n- **لغة**: الذل. **اصطلاحاً**: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة. (سؤال سابق: عرّف العبادة)\n- **تتضمن ثلاثة** (سؤال سابق مكرر):\n  - عبادة الله **بالحب فقط**: طريقة منحرفي الزهاد (الصوفية).\n  - عبادة الله **بالرجاء فقط**: طريقة المرجئة.\n  - عبادة الله **بالخوف فقط**: طريقة الخوارج.\n- **من أساليب القرآن في الدعوة إلى توحيد الألوهية**: الأمر بعبادته وترك ما سواه، الإخبار أنه خلق الخلق لعبادته، الإخبار أنه أرسل الرسل بذلك، الاستدلال بانفراده بالربوبية، الاستدلال بانفراده بصفات الكمال.\n\n## طريقة أهل السنة في الأسماء والصفات (سؤال سابق)\n- **في الإثبات**: إثبات ما أثبته الله لنفسه أو رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل.\n  - **التحريف**: تغيير النص لفظاً أو معنى. أقسامه: لفظي يتغير معه المعنى (نصب لفظ الجلالة في \"وكلم اللهَ موسى\")، لفظي لا يتغير معه المعنى (فتح الدال في \"الحمدَ لله\")، معنوي (صرف اللفظ عن ظاهره بلا دليل).\n  - **التعطيل**: إنكار ما يجب لله من الأسماء والصفات. كلي (الجهمية) وجزئي (المعتزلة ينكرون الصفات دون الأسماء).\n  - **التكييف**: حكاية كيفية الصفة. وهو أعم من التمثيل.\n  - **التمثيل**: إثبات مثيل للصفة.\n- **في النفي**: نفي ما نفاه الله عن نفسه مع اعتقاد كمال ضد الصفة المنفية.\n- **فيما لم يرد نفيه ولا إثباته**: التوقف في اللفظ والاستفصال في المعنى.\n- **أقسام الصفات**: ذاتية (العلم، القدرة، الحياة، السمع، البصر، الوجه)، فعلية متعلقة بالمشيئة (المجيء، النزول، الغضب، الفرح)، ذاتية فعلية (الكلام).\n- **القواعد العامة في الأسماء والصفات** (سؤال سابق): (1) القول في الصفات كالقول في الذات. (2) القول في بعض الصفات كالقول في بعضها الآخر. (3) الاتفاق في الأسماء لا يقتضي التساوي في المسميات، ودليله السمع ﴿ليس كمثله شيء﴾ والعقل والحس (الفيل والبعوضة).\n\n## الإيمان بالملائكة (سؤال سابق: اشرح الإيمان بالملائكة)\nالتصديق والإقرار بوجودهم، وأنهم عالم غيبي، عباد مكرمون، خُلقوا من نور. من دلائل شرفهم: إضافتهم إلى الله إضافة تشريف، قرن شهادتهم بشهادته، وصفهم بالكرم والقرب. أفضلهم من شهد بدراً. صفاتهم الخَلقية: عظم الخلق، الأجنحة، الجمال، لا يملون. قدراتهم: التشكل، السرعة، النظام. أعمالهم: تنفيذ أمر الله الكوني وتدبير أمره الديني.\n\n## الإيمان بالكتب\nتصديق جازم بأنها كلام الله. الناس ثلاثة أقسام: كذب بها كلها (الكفار والفلاسفة)، آمن بها كلها (المؤمنون)، آمن ببعض وكفر ببعض (اليهود والنصارى). الإيمان بالكتب السابقة مجمل، وبالقرآن مفصل، وهو كلام الله غير مخلوق منه بدأ وإليه يعود.\n\n## الإيمان بالرسل\n- **الفرق بين النبي والرسول**: النبي من أنبأه الله بخبر ولم يأمره بتبليغه، والرسول من أُمر بالتبليغ. وعند ابن تيمية: الرسول من بعث إلى قوم كافرين بما لا يعرفونه، والنبي إلى قوم مسلمين بما يعرفونه. كل رسول نبي ولا عكس.\n- **أولو العزم خمسة**: نوح وإبراهيم وموسى وعيسى ومحمد. وأفضلهم الخليلان إبراهيم ومحمد. النبوة اصطفاء لا اكتساب.\n- **المعجزة** (سؤال سابق: عرّف المعجزة): أمر خارق للعادة يجريه الله على يد من يختاره لنبوته ليدل على صدقه. أمثلة: ناقة صالح، عصا موسى، إبراء الأكمه والأبرص، القرآن.\n- **وجوه إعجاز القرآن سبعة**: اللفظ، النظم، البلاغة، المعاني التي أمر بها، الإخبار عن الغيب، الإخبار عن المعاد، الدلائل اليقينية.\n- **الفرق بين دلائل النبوة وخوارق السحرة**: أخبار الأنبياء لا تتخلف، السحر معتاد يناله من تعلمه، الأنبياء موحدون والسحرة مشركون، الفطر توافق الأنبياء، الأنبياء يكملون العقول، معجزات الأنبياء من فعل الله.\n- **كرامات الأولياء**: الطوائف ثلاث: أنكرتها الجهمية والمعتزلة، غلت فيها العوام وأهل الضلال، توسط أهل السنة.\n- **عصمة الأنبياء**: إجماع على عصمتهم في التبليغ، وفي المعاصي قولان، والجمهور: معصومون من الكبائر دون الصغائر ولا يُقرّون عليها.\n- **دين الأنبياء واحد**: الإسلام.\n- **خصائص النبي ﷺ عن بقية الرسل** (سؤال سابق مكرر): خاتم النبيين، الشفاعة العظمى (المقام المحمود)، بعثه إلى الإنس والجن، القرآن العظيم، المعراج، \"أعطيت خمساً لم يعطهن أحد قبلي: نصرت بالرعب مسيرة شهر، وجعلت لي الأرض مسجداً وطهوراً، وأحلت لي الغنائم، وأعطيت الشفاعة، وبعثت إلى الناس كافة\".\n- **خصائصه دون أمته**: وجوب قيام الليل، إذا عمل عملاً أثبته، تحريم الزكاة عليه وآله، الوصال في الصوم، الزيادة على أربع، القتال بمكة ساعة، لا يورث، بقاء زوجيته بعد الموت.\n\n## الإيمان باليوم الآخر (سؤال سابق: ما الأمور التي يتضمنها؟)\n- يبدأ من الموت إلى آخر ما يقع يوم القيامة.\n- **أدلة البعث في القرآن**: الإخبار عمن أماتهم ثم أحياهم، الاستدلال بالنشأة الأولى، خلق السماوات أعظم، تنزيهه عن العبث.\n- **أشراط الساعة**: صغرى (قبض العلم، ظهور الجهل، شرب الخمر) وكبرى (الدجال، نزول عيسى، يأجوج ومأجوج، الدابة، خسف بالمشرق، بالمغرب، بجزيرة العرب، طلوع الشمس من مغربها، النار التي تحشر الناس). **تقسيم آخر ثلاثة أقسام** (سؤال سابق): قسم ظهر وانقضى، قسم ظهر ولا يزال يتتابع ويكثر، قسم لم يظهر بعد.\n- **القيامة الصغرى**: (1) الموت. (2) **الروح والنفس** (سؤال سابق: يشتركان في المعنى إلا في شيئين): الروح عين قائمة بنفسها تفارق البدن وتنعم وتعذب. يتحد مدلولهما تارة ويختلف تارة: فالنفس تطلق على الروح، وتطلق على الدم، وعلى الذات كلها، بينما الروح لا تطلق على الدم ولا على ذات الإنسان بجملته، والروح تطلق على القرآن وجبريل بخلاف النفس. (3) فتنة القبر: سؤال الملكين منكر ونكير، والأنبياء لا يفتنون وكذا غير المكلفين على الراجح. السؤال عام للمسلم والكافر على الراجح. **تعلق الروح بالبدن خمسة أنواع**: في بطن الأم، بعد الخروج، في النوم، في البرزخ، يوم البعث. عذاب القبر ونعيمه للروح والبدن، والدليل ﴿يثبت الله الذين آمنوا﴾ وحديث \"إنهما ليعذبان\".\n- **القيامة الكبرى**: البعث والنشور (نفخ إسرافيل)، الحساب، إعطاء الصحائف، وزن الأعمال (ميزان حقيقي له لسان وكفتان)، الحوض (مسيرة شهر، قبل الصراط على الراجح)، الصراط (جسر على متن جهنم أدق من الشعر وأحد من السيف)، الشفاعة، الجنة والنار (مخلوقتان موجودتان الآن).\n- **الشفاعة**: لغة الوسيلة والطلب، عرفاً سؤال الخير للغير. **شرطاها**: إذن الله للشافع، ورضاه عن المشفوع له. **أنواعها للنبي ﷺ**: الشفاعة العظمى لأهل الموقف (خاصة به)، لأهل الجنة أن يدخلوها (خاصة به)، في تخفيف العذاب، فيمن استحق النار ألا يدخلها ومن دخلها أن يخرج. الرد على منكريها: أنها لا تنفع المشركين، والمقصود شفاعة أهل البدع بلا إذن.\n\n## القضاء والقدر\n- **اصطلاحاً**: تقدير الله الأشياء في القدم، وعلمه أنها ستقع في أوقات معلومة، وكتابته لها، ومشيئته لها، وخلقه لها.\n- **الفرق بين القضاء والقدر**: قولان، والأقرب: القدر هو العلم السابق، والقضاء وقوع الخلق على وزن المقدر.\n- **أركان الإيمان بالقدر أربعة**: العلم، الكتابة، المشيئة، الخلق. (علم كتابة مولانا مشيئته... وخلقه وهو إيجاد وتكوين).\n- **أقوال في أفعال العباد**: الجبرية (مجبورون كالورقة في الريح، أشهرهم الجهمية)، المعتزلة (العباد خالقون لأفعالهم)، بعض المتكلمين (الكسب بلا تأثير)، أهل السنة (الله خالق أفعال العباد، والعباد فاعلون لها حقيقة بقدرة وإرادة خاضعة لمشيئة الله).\n- **الاحتجاج بالقدر على المعاصي** لا يجوز، ويسوغ عند المصائب لا المعائب (قصة آدم وموسى).\n\n## نواقض الإيمان\n- **منهج أهل السنة وسط بين**: الخوارج (يغالون في التكفير) والمرجئة (الإيمان في القلب ولا يضر معه معصية).\n- **الشرك الأكبر**: أن يتخذ العبد لله نداً يسويه به في ربوبيته أو ألوهيته أو أسمائه وصفاته. أعظم الذنوب. آثاره: لا يغفر بلا توبة، خروج من الملة، لا يقبل معه عمل، تحرم الجنة.\n- **أقسام الشرك الأكبر**: في الربوبية (شرك النصارى، القدرية، عبّاد القبور، الاستسقاء بالنجوم)، في الألوهية (اعتقاد شريك أو صرف عبادة لغير الله)، في الحكم (اعتقاد أن غير حكم الله أفضل أو مثله، جواز الحكم بغيره، وضع تشريع مخالف)، في الأسماء والصفات.\n- **وسائل الشرك الأكبر**: الغلو في الصالحين، التبرك الممنوع (شركي وبدعي: التمسح بالصالحين، تقبيل القبور، التبرك بالأشجار والأحجار والأماكن بلا دليل)، رفع القبور وبناء المساجد عليها.\n- **الشرك الأصغر**: في العبادات القلبية (الرياء، العمل لمصلحة دنيوية، الاعتماد على الأسباب، التطير)، في الأفعال (الرقى الشركية، التمائم)، في الأقوال (الحلف بغير الله، التشريك بالواو \"ما شاء الله وشئت\").\n- **الرقى**: شرعية (من الكتاب والسنة) ومحرمة (إن اعتمد عليها كسبب فشرك أصغر، وإن اعتقد أنها تنفع بذاتها فأكبر).\n- **صح أو خطأ** (سؤال سابق): لبس الحلقة والخيط لرفع البلاء: شرك. أكل الربا والرشوة: كبيرة وليس شركاً. عقوق الوالدين: كبيرة. التبرك بالأشجار والأحجار: شرك. الاستسقاء بالأنواء: شرك (أصغر إن اعتقدها سبباً، أكبر إن اعتقدها فاعلة).\n- **الكفر**: لغة الستر، اصطلاحاً نقيض الإيمان. **الفرق بين الأكبر والأصغر**: الأكبر مخرج من الملة ويبيح الدم والمال ويخلد في النار ويوجب العداوة، والأصغر لا.\n- **أقسام الكفر باعتبار بواعثه خمسة** (سؤال سابق): كفر التكذيب، كفر الإباء والاستكبار (إبليس)، كفر الإعراض، كفر الشك، كفر النفاق. وباعتبار الأصل: أصلي وردة.\n- **تكفير المعين والمطلق**: المطلق إطلاق الكفر على الفعل أو القول، والمعين وصف شخص بعينه بالكفر ولا يجوز إلا بشروط وانتفاء موانع. الشيء قد يكون كفراً وفاعله لا يكفر.\n- **شروط تكفير المعين** (سؤال سابق مكرر): أن يظهر عليه قول أو فعل يدل على المعنى الكفري ويلتزمه، قيام الحجة ووضوحها. **الموانع**: الجهل، التأويل، الإكراه. (وفي بعض الشروح: الخطأ).\n- **النفاق**: لغة مخالفة الظاهر للباطن، اصطلاحاً إظهار الإيمان وإبطان الكفر. اعتقادي (أكبر، في الدرك الأسفل) وعملي (لا يخرج من الملة).\n- **البدعة**: لغة الإنشاء، اصطلاحاً ما خالف الكتاب والسنة والإجماع من الاعتقادات والعبادات. مكفّرة (كالرجعة) ومفسّقة (كبدع الخوارج). حقيقية (لا أصل لها) وإضافية.\n\n## عقيدة أهل السنة وسط في خمسة أصول (سؤال سابق)\n1. في العبادات (بين الغلاة والجفاة). 2. في الأسماء والصفات (بين المعطلة والممثلة). 3. في القضاء والقدر (بين الجبرية والقدرية). 4. في الوعد والوعيد وأسماء الإيمان (بين الخوارج والمرجئة). 5. في الصحابة (بين الروافض والنواصب).\n\n## \"ذو مرة فاستوى\" (سؤال سابق)\nالمقصود جبريل عليه السلام، وذو مرة: ذو قوة وخلق حسن وجمال.\n", "questions": [{"s": "aqeedah", "q": "عبدوا الله بالحب فقط؟ بالرجاء فقط؟ بالخوف فقط؟", "a": "بالحب فقط: منحرفو الزهاد (الصوفية). بالرجاء فقط: المرجئة. بالخوف فقط: الخوارج."}, {"s": "aqeedah", "q": "اذكر أربعة من شروط لا إله إلا الله.", "a": "العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، المحبة (سبعة)."}, {"s": "aqeedah", "q": "النفس والروح يشتركان في المعنى إلا في شيئين، اذكرهما.", "a": "النفس تطلق على الدم وعلى ذات الإنسان بجملته، ولا تطلق الروح على ذلك. والروح تطلق على جبريل والقرآن ولا تطلق النفس على ذلك."}, {"s": "aqeedah", "q": "اذكر القواعد العامة في الأسماء والصفات.", "a": "القول في الصفات كالقول في الذات. القول في بعض الصفات كالقول في بعضها الآخر. الاتفاق في الأسماء لا يقتضي التساوي في المسميات."}, {"s": "aqeedah", "q": "ما شروط تكفير المعين وما الموانع؟", "a": "الشروط: ظهور قول أو فعل كفري يلتزمه، وقيام الحجة ووضوحها. الموانع: الجهل، التأويل، الإكراه، الخطأ."}, {"s": "aqeedah", "q": "اذكر طريقة أهل السنة والجماعة في إثبات صفات الله.", "a": "إثبات ما أثبته الله لنفسه أو أثبته رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل، ونفي ما نفاه مع اعتقاد كمال الضد، والت **: تغيير أواخر الكلم لاختلاف العوامل الداخلة عليها لفظاً أو تقديراً. أقسامه: رفع، نصب، خفض، جزم. للأسماء رفع ونصب وخفض ولا جزم، وللأفعال رفع ونصب وجزم ولا خفض.\n- **علامات الرفع أربع**: الضمة (الأصل)، الواو (جمع المذكر السالم والأسماء الخمسة)، الألف (المثنى)، النون (الأفعال الخمسة).\n- **علامات النصب خمس**: الفتحة، الألف (الأسماء الخمسة)، الكسرة (جمع المؤنث السالم)، الياء (المثنى وجمع المذكر)، حذف النون (الأفعال الخمسة).\n- **علامات الخفض ثلاث**: الكسرة، الياء (الأسماء الخمسة والمثنى وجمع المذكر)، الفتحة (الممنوع من الصرف).\n- **علامات الجزم**: السكون، الحذف (حذف حرف العلة، حذف النون).\n- **المبني**: الحروف كلها، الفعل الماضي، فعل الأمر، المضارع المتصل بنون النسوة أو نون التوكيد، الضمائر، أسماء الإشارة (إلا المثنى)، الأسماء الموصولة (إلا المثنى)، أسماء الاستفهام والشرط، بعض الظروف.\n\n## المرفوعات سبعة\n1. **الفاعل**: اسم مرفوع مذكور قبله فعله. ظاهر ومضمر.\n2. **نائب الفاعل (المفعول الذي لم يسم فاعله)** ★: اسم مرفوع لم يذكر معه فاعله. **المبني للمجهول** ★: إن كان الفعل ماضياً ضم أوله وكسر ما قبل آخره (ضُرِبَ، كُتِبَ)، وإن كان مضارعاً ضم أوله وفتح ما قبل آخره (يُضْرَبُ، يُكْتَبُ). الماضي الأجوف: قِيلَ، بِيعَ. الماضي المبدوء بتاء: تُعُلِّمَ. نائب الفاعل: المفعول به، أو الجار والمجرور، أو الظرف، أو المصدر.\n3. **المبتدأ**: اسم مرفوع عارٍ عن العوامل اللفظية. 4. **الخبر**: الاسم المرفوع المسند إليه. مفرد، وغير مفرد (جار ومجرور، ظرف، فعل مع فاعله، مبتدأ مع خبره).\n5. **اسم كان وأخواتها** (كان، أمسى، أصبح، أضحى، ظل، بات، صار، ليس، ما زال، ما انفك، ما فتئ، ما برح، ما دام): ترفع الاسم وتنصب الخبر.\n6. **خبر إن وأخواتها** (إن، أن، لكن، كأن، ليت، لعل): تنصب الاسم وترفع الخبر.\n7. **التابع للمرفوع**: النعت، العطف، التوكيد، البدل.\n- **ظن وأخواتها**: تنصب المبتدأ والخبر مفعولين (ظننت، حسبت، خلت، زعمت، رأيت، علمت، وجدت، اتخذت، جعلت، سمعت).\n\n## المنصوبات خمسة عشر\nالمفعول به، المصدر (المفعول المطلق)، ظرف الزمان، ظرف المكان، الحال، التمييز، المستثنى، اسم لا النافية للجنس، المنادى، المفعول من أجله، المفعول معه، خبر كان وأخواتها، اسم إن وأخواتها، مفعولا ظن، التابع للمنصوب.\n- **الحال**: اسم منصوب مفسر لما انبهم من الهيئات، نكرة، صاحبه معرفة. \"جاء زيد راكباً\".\n- **التمييز**: اسم منصوب مفسر لما انبهم من الذوات. \"طاب محمد نفساً\"، \"عشرون درهماً\".\n- **الاستثناء**: أدواته إلا، غير، سوى، خلا، عدا، حاشا. المستثنى بإلا ينصب إذا كان الكلام تاماً موجباً، وإن كان تاماً منفياً جاز البدل والنصب، وإن كان ناقصاً فعلى حسب العوامل.\n- **لا النافية للجنس**: تنصب النكرة بلا تنوين إذا باشرتها. \"لا رجلَ في الدار\".\n- **المنادى خمسة**: المفرد العلم والنكرة المقصودة يبنيان على الضم، والنكرة غير المقصودة والمضاف والشبيه بالمضاف تنصب.\n\n## المخفوضات ثلاثة ★ (سؤال سابق)\n1. **مخفوض بالحرف**: بحروف الجر (من، إلى، عن، على، في، رب، الباء، الكاف، اللام، حروف القسم الواو والباء والتاء، مذ ومنذ). \"مررت بزيدٍ\".\n2. **مخفوض بالإضافة**: ما يقدر باللام (\"غلام زيد\")، أو بمن (\"ثوب خز\")، أو بفي (\"مكر الليل\").\n3. **تابع للمخفوض**: النعت والعطف والتوكيد والبدل.\n\n## أنواع الجمل ★ (سؤال سابق)\n- **الجملة الاسمية**: تبدأ باسم: \"الصلاةُ نورٌ\".\n- **الجملة الفعلية**: تبدأ بفعل: \"قامَ زيدٌ\".\n- **الجملة التي لها محل من الإعراب سبع**: الواقعة خبراً، حالاً، مفعولاً به (مقول القول)، مضافاً إليه، جواباً لشرط جازم مقترناً بالفاء أو إذا، صفة، التابعة لجملة لها محل.\n- **الجملة التي لا محل لها من الإعراب سبع**: الابتدائية، الاستئنافية، الاعتراضية، التفسيرية، جواب القسم، جواب الشرط غير الجازم، صلة الموصول، التابعة لما لا محل له.\n- **شبه الجملة**: الجار والمجرور والظرف.\n\n## نواصب المضارع وجوازمه\n- **النواصب عشرة**: أن، لن، إذن، كي، لام كي، لام الجحود، حتى، الجواب بالفاء والواو، أو.\n- **الجوازم ثمانية عشر**: لم، لما، ألم، ألما، لام الأمر والدعاء، لا في النهي والدعاء، إن، ما، من، مهما، إذما، أي، متى، أيان، أين، أنى، حيثما، كيفما، إذا في الشعر.\n\n## نماذج إعراب متوقعة\n- \"إنما الأعمالُ بالنياتِ\": إنما: كافة ومكفوفة. الأعمال: مبتدأ مرفوع بالضمة. بالنيات: جار ومجرور متعلق بخبر محذوف.\n- \"بُني الإسلامُ على خمسٍ\": بني: فعل ماض مبني للمجهول. الإسلام: نائب فاعل مرفوع. على خمس: جار ومجرور.\n- \"الدينُ النصيحةُ\": مبتدأ وخبر.\n- \"لا تحاسدوا\": لا: ناهية جازمة. تحاسدوا: فعل مضارع مجزوم بحذف النون، والواو فاعل.\n- \"إن الله طيبٌ لا يقبل إلا طيباً\": إن: حرف توكيد ونصب. الله: اسم إن منصوب. طيب: خبر إن مرفوع. لا يقبل: جملة فعلية في محل رفع خبر ثان. إلا: أداة استثناء ملغاة. طيباً: مفعول به منصوب.\n- \"كن في الدنيا كأنك غريبٌ\": كن: فعل أمر ناقص، اسمه ضمير مستتر أنت. في الدنيا: جار ومجرور متعلق بخبر كن. كأنك: حرف تشبيه ونصب والكاف اسمها. غريب: خبر كأن.\n", "questions": [{"s": "nahw", "q": "اذكر أنواع المخفوضات.", "a": "ثلاثة: مخفوض بالحرف، مخفوض بالإضافة، تابع للمخفوض (نعت، عطف، توكيد، بدل)."}, {"s": "nahw", "q": "ما المبني للمجهول؟ وكيف يبنى الفعل له؟", "a": "فعل حذف فاعله وأنيب عنه المفعول به. الماضي: يضم أوله ويكسر ما قبل آخره (كُتِبَ). المضارع: يضم أوله ويفتح ما قبل آخره (يُكْتَبُ)."}, {"s": "nahw", "q": "اذكر الجمل في اللغة العربية مع المثال.", "a": "اسمية: الصلاة نور. فعلية: قام زيد. ولها محل من الإعراب: الخبر، الحال، المفعول به، المضاف إليه، جواب الشرط الجازم، الصفة. ولا محل لها: الابتدائية، الاستئنافية، الاعتراضية، التفسيرية، جواب القسم، صلة الموصول."}, {"s": "nahw", "q": "ما علامات الرفع والنصب والخفض والجزم؟", "a": "الرفع: الضمة، الواو، الألف، النون. النصب: الفتحة، الألف، الكسرة، الياء، حذف النون. الخفض: الكسرة، الياء، الفتحة. الجزم: السكون، الحذف."}, {"s": "nahw", "q": "ما المرفوعات من الأسماء؟", "a": "سبعة: الفاعل، نائب الفاعل، المبتدأ، الخبر، اسم كان، خبر إن، التابع للمرفوع."}, {"s": "nahw", "q": "ما الفرق بين الحال والتمييز؟", "a": "الحال يفسر ما انبهم من الهيئات (جاء زيد راكباً)، والتمييز يفسر ما انبهم من الذوات (طاب زيد نفساً). وكلاهما نكرة منصوب."}, {"s": "nahw", "q": "أعرب: إنما الأعمال بالنيات.", "a": "إنما: كافة ومكفوفة. الأعمال: مبتدأ مرفوع بالضمة. بالنيات: جار ومجرور متعلق بخبر محذوف."}, {"s": "nahw", "q": "أعرب: بُني الإسلام على خمس.", "a": "بني: فعل ماض مبني للمجهول. الإسلام: نائب فاعل مرفوع. على خمس: جار ومجرور."}, {"s": "nahw", "q": "ما أحكام المستثنى بإلا؟", "a": "إن كان الكلام تاماً موجباً وجب النصب. إن كان تاماً منفياً جاز البدل والنصب. إن كان ناقصاً فعلى حسب العوامل."}, {"s": "nahw", "q": "ما أقسام المنادى؟",  وتعب |\n| جيدها ★ | المسد | عنقها |\n| الرادفة ★ | النازعات | النفخة الثانية التي يكون عندها البعث |\n| الراجفة ★ | النازعات | النفخة الأولى التي يموت بها الخلائق |\n| كنود ★ | العاديات | كفور للنعمة |\n| لحب الخير لشديد ★ | العاديات | لحب المال قوي |\n| عصف مأكول ★ | الفيل | ورق الزرع إذا أكلته الدواب |\n| نجاباً ★ | النبأ | منصباً بكثرة |\n| دحاها ★ | النازعات | بسطها |\n| رسول كريم ★ (التكوير) | التكوير | جبريل عليه السلام |\n| التطفيف ★ | المطففين | النقص من الكيل أو الوزن |\n| جواب القسم في \"والسماء والطارق\" ★ | الطارق | \"إن كل نفس لما عليها حافظ\" |\n| \"فقال لهم رسول الله\" ★ | الشمس | صالح عليه السلام |\n| على الأرائك ينظرون ★ | المطففين | الموضع الأول: الأبرار في الجنة على الأسرة ينظرون إلى النعيم. الموضع الثاني: المؤمنون ينظرون إلى الكفار في النار ويضحكون منهم |\n| فيها كتب قيمة ★ | البينة | آيات وأحكام مستقيمة لا عوج فيها |\n| ذو مرة ★ | النجم | جبريل، ذو قوة وجمال |\n\n## أسباب النزول\n- **عم**: لما بعث النبي ﷺ وأخبرهم بالتوحيد والبعث جعلوا يتساءلون: ماذا حصل لمحمد؟\n- **عبس**: كان النبي ﷺ مع قوم من قريش يطمع في إسلامهم، فأقبل عبدالله بن أم مكتوم الأعمى، فكره أن يقطع كلامه فأعرض عنه.\n- **المطففين**: لما قدم النبي ﷺ المدينة كانوا من أخبث الناس كيلاً.\n- **الليل** \"فسنيسره لليسرى\" و\"وسيجنبها الأتقى\" ★: أبو بكر الصديق لما اشترى ستة عبيد مؤمنين وأعتقهم. والآية حكمها عام (سؤال سابق).\n- **الضحى**: مرض النبي ﷺ فلم يقم لليل ليلتين أو ثلاثاً، فقالت امرأة: ما أرى شيطانك إلا قد تركك.\n- **العلق**: أول ما نزل. \"أرأيت الذي ينهى\": أبو جهل. \"عبداً إذا صلى\": محمد ﷺ. \"فليدع ناديه\": قال أبو جهل: أتهددني وأنا أكثر أهل الوادي نادياً.\n- **الكوثر**: لما مات ابن النبي ﷺ قال أحد المشركين: إنه أبتر.\n- **الكافرون**: سأل الكفار النبي ﷺ أن يعبد آلهتهم سنة ويعبدوا إلهه سنة. تكرار الآيات: للتأكيد وقطع أطماع الكفار.\n- **النصر**: تسمى سورة التوديع. قال النبي ﷺ لما نزلت: \"نُعيت إليّ نفسي\".\n- **الإخلاص**: قال المشركون: اذكر لنا نسب ربك. فضلها: تعدل ثلث القرآن (حديث أبي سعيد في البخاري) ★.\n- **المسد**: أبو لهب اسمه عبد العزى، امرأته أم جميل بنت حرب أخت أبي سفيان، حمالة الحطب: تحمل الشوك وتطرحه في طريق النبي ﷺ.\n- **قريش**: تسمى سورة الإيلاف. رحلة الشتاء إلى اليمن والصيف إلى الشام.\n\n## معاني الكلمات بترتيب السور\n**النبأ**: النبأ العظيم: الخبر الهائل. مهاداً: فراشاً. أوتاداً: لتسكن الأرض. سباتاً: انقطاعاً عن الحركة. سبعاً شداداً: سبع سماوات قوية. سراجاً وهاجاً: الشمس. المعصرات: السحاب. ثجاجاً: منصباً بكثرة. يوم الفصل: لأن الله يفصل بين خلقه. الصور: القرن. أفواجاً: زمراً. مآباً: مرجعاً. أحقاباً: الزمن الطويل. حميماً: الماء الحار. غساقاً: صديد أهل النار. أتراباً: متساويات في السن. كأساً دهاقاً: مملوءة. لغواً: الكلام الباطل. الروح: جبريل. صواباً: شهد بالتوحيد.\n\n**النازعات**: النازعات: الملائكة تنزع الروح. غرقاً: من أقصى الجسد. نشطاً: الجذب بقوة. السابحات: الملائكة تسبح في السماء. السابقات: تسبق لتنفيذ أمر الله. واجفة: قلقة. زجرة واحدة: النفخة الثانية. الساهرة: أرض بيضاء يحاسب الله عليها الخلائق. طوى: الوادي في جبل سيناء. تزكى: تطهر من الشرك. الآية الكبرى: العصا. رفع سمكها: جعلها كالبناء المرتفع. الطامة الكبرى: النفخة الثانية. طغى: جاوز الحد. أيان مرساها: متى وقوعها.\n\n**عبس**: عبس: كلح بوجهه. الذكرى: الموعظة. تلهى: تتشاغل. مرفوعة: رفيعة القدر. سفرة: الملائكة يسفرون بالوحي. قضباً: القت الرطب. حدائق غلباً: النخل الغليظة الجذوع. أبّاً: ما لا يأكله الإنسان من النبات. الصاخة: صيحة القيامة. مسفرة: مشرقة. غبرة: غبار. قترة: سواد.\n\n**التكوير**: انكدرت: تناثرت. العشار: النوق الحوامل. عطلت: تركت. سجرت: صارت ناراً. زوجت: قرنت بالحور. الموءودة: البنت المدفونة حية. كشطت: تشققت. أزلفت: قربت. الخنس: الكواكب تختفي بالنهار. الكنس: تختفي وقت الغروب. عسعس: أدبر. مكين: ذو مكانة. بضنين: لا يبخل بالوحي.\n\n**الانفطار**: انفطرت: تشققت. انتثرت: تساقطت. فجرت: صارت بحراً واحداً. بعثرت: أخرج الموتى. فعدلك: جعلك معتدلاً. الدين: الجزاء. تكرار \"ما أدراك\": للتعظيم والتهويل.\n\n**المطففين**: سجين: سجل أهل النار أو حبس وضيق. معتد أثيم: فاجر جائر. ران: غطى. الأبرار: المطيعون. عليين: أعالي الجنة. المقربون: الملائكة. الأرائك: الأسرة في الحجال. رحيق: خمر. مختوم: ممنوع من أن تمسه يد. تسنيم: أشرف شراب الجنة. يتغامزون: يشيرون بالجفون. فكهين: معجبين.\n\n**الانشقا سمى سورة ........ وسورة قريش تسمى سورة ........", "a": "التوديع، الإيلاف"}, {"s": "tafsir", "q": "امرأة أبي لهب اسمها ........", "a": "أم جميل بنت حرب"}]}, "tajweed": {"name": "التجويد", "source": "غاية المريد في علم التجويد، عطية قابل نصر", "notes": "# التجويد (4 درجات)\n\nنمط الأسئلة: عرّف الحكم مع مثال، مثّل لما يأتي، عدد التشديدات، أحكام في سورة معينة، الفرق بين المدود.\n\n## أحكام النون الساكنة والتنوين (أربعة)\n1. **الإظهار**: إخراج النون الساكنة أو التنوين بلا غنة عند حروف الحلق الستة (ء هـ ع ح غ خ). مثال: \"من آمن\"، \"عليمٌ حكيم\".\n2. **الإدغام**: إدخال النون في الحرف التالي من حروف (يرملون).\n   - **بغنة** (ينمو): \"من وال\" ★، \"من يعمل\"، \"خيرٌ مما\".\n   - **بغير غنة** (ل ر): \"من ربهم\"، \"من لدنه\".\n3. **الإقلاب** ★ (سؤال مكرر): قلب النون الساكنة أو التنوين ميماً مخفاة مع الغنة عند الباء. مثال: \"عليمٌ بذات الصدور\" ★، \"أنبئهم\"، \"من بعد\".\n4. **الإخفاء**: النطق بالنون بين الإظهار والإدغام مع الغنة عند الحروف الخمسة عشر الباقية. مثال: \"من قبل\"، \"إنسان\"، \"أنداداً\".\n\n## أحكام الميم الساكنة (ثلاثة) ★ (سؤال سابق)\n1. **الإخفاء الشفوي**: عند الباء. مثال: \"كنتم بالله\" ★، \"من دون\" (وردت في نموذج)، \"ترميهم بحجارة\".\n2. **الإدغام الشفوي** (مثلين صغير): عند الميم. مثال: \"لهم ما\"، \"كم من\".\n3. **الإظهار الشفوي**: عند بقية الحروف. مثال: \"أم حسبتم\" ★، \"عليهم نار\".\n- **حكم النون في \"ومَنْ هاجر\"** ★ (سؤال سابق): إظهار حلقي، لأن النون الساكنة جاء بعدها حرف الهاء وهو من حروف الحلق.\n\n## المدود\n- **المد الطبيعي**: لا يتوقف على سبب، مقداره حركتان. \"قال\"، \"يقول\"، \"قيل\".\n- **المد المتصل** ★: أن يأتي بعد حرف المد همز في كلمة واحدة، واجب، 4 أو 5 حركات. \"السماء\" ★، \"السوء\" ★، \"سيئت\" ★، \"جاء\".\n- **المد المنفصل** ★: حرف المد في آخر كلمة والهمز في أول الكلمة التالية، جائز، 2 أو 4 أو 5 حركات. \"يا أيها\"، \"بما أنزل\"، \"إنا أعطيناك\".\n- **الفرق بينهما** ★: المتصل الهمز في نفس الكلمة وهو واجب، والمنفصل الهمز في كلمة أخرى وهو جائز.\n- **المد اللازم** ★ (سؤال: أقسامه مع مثال): أن يأتي بعد حرف المد سكون أصلي، مقداره 6 حركات. أربعة أقسام:\n  - كلمي مثقل (سكون مدغم في كلمة): \"الضالين\"، \"الحاقة\".\n  - كلمي مخفف (سكون غير مدغم في كلمة): \"آلآن\".\n  - حرفي مثقل (في فواتح السور مدغم): \"الم\" (اللام في الميم).\n  - حرفي مخفف (غير مدغم): \"ق\"، \"ن\"، \"ص\".\n- **المد العارض للسكون**: حرف مد بعده حرف سُكّن للوقف، 2 أو 4 أو 6. \"الرحيمْ\"، \"نستعينْ\".\n- **مد البدل**: همز قبل حرف المد، حركتان. \"آمنوا\"، \"إيماناً\".\n- **مد اللين**: واو أو ياء ساكنة قبلها فتحة بعدها سكون عارض: \"خوف\"، \"البيت\".\n\n## القلقلة ★ (سؤال مكرر)\n- **تعريفها**: اضطراب الصوت عند النطق بالحرف الساكن حتى يسمع له نبرة قوية.\n- **حروفها خمسة**: قطب جد (ق ط ب ج د).\n- **مراتبها**: كبرى (الحرف المشدد الموقوف عليه: \"الحقّ\")، وسطى (الساكن الموقوف عليه في آخر الكلمة: \"أحدْ\"، \"محيطْ\")، صغرى (الساكن في وسط الكلمة: \"يجعلون\"، \"يطمعون\"). وبعضهم يجعلها مرتبتين: كبرى في الوقف وصغرى في الوصل.\n\n## حروف الصفير ★ (سؤال سابق)\nثلاثة: **الصاد، الزاي، السين**. الصفير صوت يشبه صوت الطائر يخرج من بين الثنايا وطرف اللسان.\n\n## تشديدات سورة الفاتحة ★ (سؤال سابق)\n**أربع عشرة تشديدة** (وفي البسملة ثلاث: اللّه، الرّحمن، الرّحيم، وفي السورة إحدى عشرة كما نص عليه دليل الطالب في أركان الصلاة):\n1. اللّه (بسم اللّه) 2. الرّحمن 3. الرّحيم 4. للّه (الحمد للّه) 5. ربّ 6. الرّحمن 7. الرّحيم 8. الدّين 9. إيّاك 10. إيّاك 11. الصّراط 12. الّذين 13. الضّالّين (الضاد) 14. الضّالّين (اللام).\n\n## أحكام تجويدية في سورة الزلزلة ★ (سؤال سابق: اذكر خمسة)\n1. \"بأن ربك\": إدغام بغير غنة (النون الساكنة في الراء).\n2. \"يومئذٍ يصدر\"، \"خيراً يره\"، \"شراً يره\": إدغام بغنة (التنوين في الياء).\n3. \"أشتاتاً ليروا\": إدغام بغير غنة (التنوين في اللام).\n4. \"يومئذٍ تحدث\": إخفاء حقيقي (التنوين قبل التاء).\n5. \"الإنسان\": إخفاء حقيقي (النون الساكنة قبل السين).\n6. \"الأرض\"، \"الإنسان\": لام قمرية (إظهار).\n7. \"زلزالها\"، \"أثقالها\"، \"أخبارها\": مد طبيعي حركتان.\n8. \"يره\" في الوقف: مد عارض للسكون، والهاء هاء ضمير لا صلة لها عند الوقف.\n\n## آداب تلاوة القرآن ★ (سؤال سابق)\n1. الإخلاص. 2. الطهارة من الحدث واستقبال القبلة. 3. السواك وتنظيف الفم. 4. الاستعاذة عند البدء والبسملة أول السورة (غير براءة). 5. الترتيل وعدم العجلة. 6. الخشوع والتدبر والبكاء. 7. تحسين الصوت. 8. الجهر إن لم يؤذ أحداً. 9. الوقف على رؤوس الآيات. 10. اختيار المكان الطاهر. 11. السجود عند آيات السجدة. 12. عدم قطع القراءة لكلام الدنيا.\n\n## اللام الشمسية والقمرية\n- **القمرية**: تظهر اللام مع حروف \"ابغ حجك وخف عقيمه\". \"القمر\"، \"الأرض\".\n- **الشمسية**: تدغم اللام في الحرف التالي مع بقية الحروف. \"الشمس\"، \"الرحمن\".\n\n## أحكام الراء\nتفخم إذا كانت مفتوحة أو مضمومة أو ساكنة بعد فتح أو ضم، وترقق إذا كانت مكسورة أو ساكنة بعد كسر أصلي.\n\n## الاستعاذة والبسملة\nالاستعاذة مستحبة عند بدء القراءة، والبسملة سنة عند بدء كل سورة إلا براءة، وبين السورتين ثلاثة أوجه جائزة: قطع الجميع، وصل الجميع، قطع الأول ووصل الثاني، ويمتنع وصل البسملة بآخر السورة الأولى والقطع عن الثانية.\n\n\n# ملخص مرجعي في علم التجويد\n### مستخرج من كتاب \"غاية المريد في علم التجويد\" للشيخ عطية قابل نصر (برواية حفص عن عاصم من طريق الشاطبية)\n\n---\n\n## أركان القراءة الصحيحة ومراتب القراءة\n\n**أركان القراءة الصحيحة ثلاثة:**\n1. موافقتها لوجه من وجوه اللغة العربية ولو ضعيفاً.\n2. موافقتها للرسم العثماني ولو احتمالاً.\n3. صحة سندها بتواترها عن النبي ﷺ.\n\n**مراتب القراءة ثلاث:**\n1. **الترتيل** (أفضل مرتبة): قراءة القرآن بتؤدة وطمأنينة.\n2. **التدوير**: قراءته بحالة متوسطة بين الاطمئنان والسرعة.\n3. **الحَدْر**: قراءته بسرعة مع المحافظة على أحكام التجويد.\n\n**الحكمة من نزول القرآن بالأحرف السبعة:** أن العرب الذين نزل القرآن بلغتهم ألسنتهم مختلفة، ولهجاتهم متباينة، ويتعذر على الواحد منهم أن ينتقل من لهجته التي نشأ عليها وتعوّد لسانه التخاطب بها، فنزل بالأحرف السبعة حتى لا يكلَّف الناس ما لا يطيقون.\n\n---\n\n## أقسام التجويد وحكمه\n\n1. **التجويد العملي (التطبيقي):** تلاوة القرآن تلاوة مجودة كما أُنزلت على النبي ﷺ.\n   - حكمه: **واجب**. والدليل: ﴿ورتل القرآن ترتيلاً﴾.\n2. **التجويد العلمي (النظري):** معرفة قواعده وأحكامه العلمية.\n   - حكم تعلمه: **مندوب** لعامة الناس، **واجب** على القراء والعلماء.\n   - الدليل: عموم قوله تعالى ﴿فلولا نفر من كل فرقة منهم طائفة ليتفقهوا في الدين﴾.\n\n**التجويد لغة:** التحسين والإتقان.\n**واصطلاحاً:** علم يبحث في الكلمات القرآنية من حيث إعطاء الحروف حقها ومستحقها.\n- **حق الحرف:** الصفات اللازمة التي لا تفارقه كالاستعلاء والاستفال.\n- **مستحق الحرف:** الأحكام الناشئة عن تلك الصفات كالتفخيم والترقيق والإدغام والإظهار.\n\n- **غايته:** عصمة اللسان من اللحن عند تلاوة القرآن الكريم.\n- **موضوعه:** الكلمات القرآنية من حيث إعطاء الحروف حقها ومستحقها.\n- **فضله:** من أجلّ العلوم وأشرفها؛ لتعلقه بكلام الله سبحانه وتعالى.\n- **استمداده:** من كيفية قراءة النبي ﷺ وصحابته والتابعين.\n\n---\n\n## اللحن وأقسامه\n\n**اللحن:** هو الخطأ والميل عن الصواب.\n\n1. **اللحن الجلي:** خطأ يطرأ على اللفظ فيخل بمبنى الكلمة، سواء أخلّ بمعناها أم لا، وسمي جلياً لأنه يظهر للعلماء وعامة الناس.\n   - مثال المخلّ بالمعنى: كسر التاء في ﴿أنعمتَ عليهم﴾ وكذلك ضمها.\n   - مثال غير المخلّ بالمعنى: ضم الهاء في ﴿الحمد لله﴾.\n   - **حكمه: حرام بالإجماع**، لا سيما إن تعمده القارئ أو تساهل فيه.\n2. **اللحن الخفي:** خطأ يطرأ على اللفظ فيخل بعُرف القراءة ولا يخل بالمبنى، وسمي خفياً لأنه يظهر للعالم ويخفى على عامة الناس.\n   - مثاله: ترك الإظهار أو الإدغام أو الإخفاء.\n   - **حكمه: التحريم على الراجح** إن تعمده أو تساهل فيه، وقيل بالكراهة.\n\n---\n\n## الاستعاذة\n\n- **لغة:** الالتجاء والاعتصام.\n- **اصطلاحاً:** لفظ يحصل به الالتجاء إلى الله تعالى والاعتصام به من الشيطان الرجيم.\n- **حكمها:** اتفق العلماء على أنها مطلوبة عند القراءة، واختلفوا في وجوبها: **فالجمهور أنها مستحبة**، وقال بعضهم بالوجوب.\n- **صيغتها المختارة:** \"أعوذ بالله من الشيطان الرجيم\"، ومن صيغها: \"أعوذ بالله من الشيطان\"، و\"أعوذ بالله السميع العليم من الشيطان الرجيم\".\n\n**أحوالها:**\n- **الجهر بها**، ويستحب في **موضعين**:\n  1. إذا كان يقرأ جهراً وهناك من يستمع لقراءته.\n  2. إذا كان مع جماعة يقرؤون القرآن وهو المبتدئ بالقراءة.\n- **الإخفاء بها**، ويستحب في **أربعة مواضع**:\n  1. إذا كان يقرأ سراً.\n  2. إذا كان يقرأ جهراً وليس معه أحد يستمع.\n  3. إذا كان يقرأ في الصلاة إماماً أو مأموماً أو منفرداً.\n  4. إذا كان يقرأ وسط جماعة وليس هو المبتدئ بالقراءة.\n\n**فائدة:** لو قطع القارئ القراءة لعذر كالعطاس أو كلام يتعلق بمصلحة القراءة **لا يعيد** الاستعاذة، أما لو قطعها إعراضاً عن القراءة أو لكلام لا تعلق له بها ولو لردّ السلام **فإنه يستأنف** الاستعاذة.\n\n---\n\n## البسملة وأوجه الابتداء\n\n- **البسملة** مصدر بَسْمَلَ: أي إذا قال بسم الله الرحمن الرحيم، نحو حَسْبَلَ وحَوْقَلَ.\n- اتفق العلماء أنها **بعض آية من سورة النمل**، واتفقوا على إثباتها في أول الفاتحة، وعلى الإتيان بها عند ابتداء القراءة بأول أي سورة سوى **سورة براءة**. وأما في أجزاء السور فالقارئ مخيّر.\n\n**أوجه الابتداء:**\n1. في بداية السور (سوى براءة) **أربعة أوجه**:\n   - قطع الجميع (أفضلها).\n   - قطع الأول ووصل الثاني بالثالث.\n   - وصل الأول بالثاني وقطع الثالث.\n   - وصل الجميع.\n2. الابتداء بأول براءة: **وجهان** (الوقف على الاستعاذة وفصلها عن أول السورة بدون بسملة، أو وصل الاستعاذة بأول السورة بدون بسملة).\n3. الابتداء بآية من وسط سورة غير براءة: إن أتى بالبسملة جازت الأوجه الأربعة، وإن تركها جاز وجهان فقط.\n\n**أوجه ما بين السورتين:**\n- إذا وصل آخر سورة بالتي بعدها (سوى براءة) فله **ثلاثة أوجه**: قطع الجميع، قطع الأول ووصل الثاني بالثالث، وصل الجميع.\n- **فائدة:** وصل آخر السورة بالبسملة والوقف عليها **ممتنع اتفاقاً**؛ لأن البسملة جعلت لأوائل السور لا لأواخرها.\n- بين الأنفال وبراءة **ثلاثة أوجه**: القطع (الوقف مع التنفس)، السكت (قطع الصوت زمناً يسيراً بدون تنفس)، الوصل — كل ذلك من غير بسملة.\n\n---\n\n## أحكام النون الساكنة والتنوين\n\n**النون الساكنة:** هي النون الخالية من الحركة، وتثبت لفظاً وخطاً ووصلاً ووقفاً، وتكون في الاسم والفعل والحرف، وتكون متوسطة ومتطرفة.\n\n**التنوين:** نون ساكنة زائدة تلحق آخر الاسم لفظاً ووصلاً وتفارقه خطاً ووقفاً.\n\n**الفرق بينهما في خمسة أمور:** النون أصلية والتنوين زائد؛ النون ثابتة في اللفظ والخط والتنوين في اللفظ دون الخط؛ النون ثابتة وصلاً ووقفاً والتنوين وصلاً دون الوقف؛ النون في الأسماء والأفعال والحروف والتنوين في الأسماء فقط؛ النون متوسطة ومتطرفة والتنوين متطرف دائماً.\n\n**أحكامها أربعة:**\n\n### 1) الإظهار الحلقي\n- **لغة:** البيان والإيضاح. **اصطلاحاً:** إخراج الحرف المظهر من مخرجه من غير غنة كاملة.\n- **حروفه ستة:** الهمزة ﴿من ءامن﴾، الهاء ﴿من هاد﴾، العين ﴿حكيمٌ عليم﴾، الحاء ﴿عليماً حكيما﴾، الغين ﴿من غلّ﴾، الخاء ﴿من خوف﴾.\n- **سبب الإظهار:** بُعد المخرجين؛ لأن النون والتنوين من طرف اللسان والحروف الستة من الحلق.\n- **مراتبه ثلاث:** عليا عند الهمزة والهاء، وسطى عند العين والحاء، دنيا عند الغين والخاء.\n\n### 2) الإدغام\n- **لغة:** إدخال الشيء في الشيء. **اصطلاحاً:** إدخال حرف ساكن في حرف متحرك بحيث يصيران حرفاً واحداً مشدداً.\n- **حروفه ستة** مجموعة في: **\"يرملون\"**.\n  - **إدغام بغنة (ناقص)** في: **\"ينمو\"** (الياء، النون، الميم، الواو).\n  - **إدغام بغير غنة (كامل)** في: **\"رل\"** (اللام والراء).\n- **الإدغام الكامل:** ذهاب ذات الحرف وصفته معاً (عند اللام والراء).\n- **الإدغام الناقص:** ذهاب ذات الحرف وبقاء صفته وهي الغنة (عند حروف \"ينمو\").\n- **أسبابه:** التماثل (مع النون)، التجانس (مع الميم)، التقارب (مع البقية). **وفائدته:** التخفيف.\n- **شرطه:** أن يكون من كلمتين. فإن وقع حرف الإدغام بعد النون الساكنة في **كلمة واحدة** وجب الإظهار ويسمى **الإظهار المطلق**، ولا يكون إلا عند الياء والواو.\n- **استثناء:** النون مع الواو في ﴿يس والقرآن﴾ و﴿ن والقلم﴾ الرواية فيهما بالإظهار؛ ومع الراء في ﴿من راق﴾ لوجوب السكت، والسكت يمنع الإدغام.\n\n### 3) الإقلاب\n- **لغة:** تحويل الشيء عن وجهه. **اصطلاحاً:** قلب النون الساكنة أو التنوين ميماً مخفاة بغنة.\n- **حرفه واحد: الباء** ﴿لنسفعاً بالناصية﴾.\n- **يتحقق بثلاثة أمور:** قلب النون أو التنوين ميماً خالصة لفظاً لا خطاً، إخفاء هذه الميم عند الباء، إظهار الغنة مع الإخفاء.\n\n### 4) الإخفاء الحقيقي\n- **لغة:** الستر. **اصطلاحاً:** النطق بالحرف بصفة بين الإظهار والإدغام عارياً عن التشديد مع بقاء الغنة.\n- **حروفه خمسة عشر**، جمعها الجمزوري في أوائل: \"**صِفْ ذا ثنا كم جاد شخصٌ قد سما ... دم طيباً زد في تُقى ضع ظالما**\".\n- **مراتب حروفه ومراتبه:**\n  - **أعلاها** عند الطاء والدال والتاء (لقرب المخرج).\n  - **أدناها** عند القاف والكاف (لبعد المخرج).\n  - **أوسطها** عند الأحرف العشرة الباقية.\n- **الفرق بين الإخفاء والإدغام:** الإخفاء لا تشديد معه، ويكون عند الحرف لا فيه، ويأتي من كلمة ومن كلمتين؛ بخلاف الإدغام.\n\n---\n\n## حكم النون والميم المشددتين والغنة\n\n- إذا وقعت الميم والنون مشددتين **وجب إظهار الغنة** فيهما، ويسمى كل منهما **حرف غنة مشدداً**.\n\n**الغنة:**\n- **لغة:** صوت له رنين في الخيشوم.\n- **اصطلاحاً:** صوت لذيذ مركب في جسم النون والميم لا عمل للسان فيه.\n- **مخرجها: الخيشوم** (أعلى الأنف وأقصاه من الداخل).\n- **مقدارها: حركتان** بحركة الإصبع قبضاً أو بسطاً.\n- **كيفيتها:** تابعة لما بعدها تفخيماً وترقيقاً (وعكسها الألف فهي تابعة لما قبلها).\n\n**مراتب الغنة خمس:**\n1. أكملها في المشدد والمدغم كامل التشديد.\n2. ثم المدغم ناقص التشديد.\n3. ثم المُخفى ويدخل فيه الإقلاب.\n4. ثم الساكن المظهر.\n5. ثم المتحرك.\n> ولا تظهر إلا في المراتب الثلاث الأُوَل حيث تبلغ الكمال، أما الساكن المظهر والمتحرك فالثابت فيهما أصلها لا كمالها.\n\n---\n\n## أحكام الميم الساكنة\n\nالميم الساكنة تقع قبل جميع أحرف الهجاء ما عدا حروف المد الثلاثة (خشية التقاء الساكنين).\n\n1. **الإخفاء الشفوي:** حرفه **الباء**، ولا يكون إلا من كلمتين، مثال: ﴿لهم به﴾، ﴿ترميهم بحجارة﴾. وهو قول الجمهور من أهل الأداء، وقيل بإظهارها.\n2. **إدغام المتماثلين الصغير:** حرفه **الميم**، مثال: ﴿لهم ما يشاءون﴾، ولا بد معه من الغنة.\n3. **الإظهار الشفوي:** في **الستة والعشرين** حرفاً الباقية، مثال: ﴿لهم فيها﴾.\n   - ويجب المبالغة في إظهار الميم عند **الواو والفاء** حتى لا يُتوهم إخفاؤها؛ لاتحاد مخرجها مع الواو وقرب مخرجها من الفاء.\n\n---\n\n## أحكام اللامات السواكن (خمسة أنواع)\n\n### 1) لام التعريف \"أل\"\n- نوع لازم لا تفارق الكلمة: ﴿الذين﴾ — ونوع يمكن استقامة الكلمة بدونه: ﴿الأرض﴾.\n- **اللام القمرية (الإظهار):** حروفها **أربعة عشر** مجموعة في: \"**ابغ حجك وخف عقيمه**\"، وعلامتها السكون على اللام.\n- **اللام الشمسية (الإدغام):** حروفها **أربعة عشر** الباقية، ومنها البيت: \"طِبْ ثم صِلْ رحماً تفز ضف ذا نعم ... دع سوء ظن زر شريفاً للكرم\"، وعلامتها خلو اللام من السكون.\n- **سبب الإدغام:** التماثل مع اللام، والتقارب مع باقي الحروف.\n- **فائدة في لفظ الجلالة:** أصله \"إله\" دخلت عليه \"أل\" فصار \"الإله\"، ثم حذفت الهمزة تخفيفاً، ثم أدغمت لام \"أل\" في اللام الثانية للتماثل، ثم فُخّمت اللام للتعظيم بعد الفتح والضم دون الكسر.\n\n### 2) لام الفعل\n- **الإدغام** إذا وقع بعدها لام أو راء: ﴿قل لا أسألكم﴾ (تماثل)، ﴿قل رب﴾ (تقارب).\n- **الإظهار** فيما عدا ذلك: ﴿قل نعم﴾.\n\n### 3) لام الحرف\n- لا توجد إلا في **\"هل\"** و**\"بل\"**.\n- **بل:** وجوب الإظهار ﴿بل هم﴾، إلا إذا وقع بعدها لام أو راء فتدغم ﴿بل لما يذوقوا﴾، ويستثنى ﴿بل ران﴾ لوجوب السكت.\n- **هل:** وجوب الإظهار دائماً إلا إذا وقع بعدها لام فتدغم، وأما الراء بعدها فلم توجد في القرآن.\n\n### 4) لام الاسم\n- حكمها **وجوب الإظهار مطلقاً**، نحو: ﴿سلطانا﴾.\n\n### 5) لام الأمر\n- يشترط أن تكون مسبوقة بـ \"ثم\" أو الواو أو الفاء: ﴿ثم ليقضوا﴾، ﴿وليوفوا نذورهم﴾، ﴿فليمدد﴾.\n- حكمها **وجوب الإظهار مطلقاً** كلام الاسم.\n\n---\n\n## المد والقصر\n\n- **المد لغة:** الزيادة. **اصطلاحاً:** إطالة الصوت بحرف المد أو اللين عند وجود السبب.\n- **القصر لغة:** الحبس والمنع. **اصطلاحاً:** إثبات حرف المد أو اللين من غير زيادة فيه لعدم وجود السبب.\n\n**حروف المد ثلاثة بشروطها:**\n1. **الألف** ولا تكون إلا ساكنة ولا يكون ما قبلها إلا مفتوحاً.\n2. **الواو** الساكنة المضموم ما قبلها.\n3. **الياء** الساكنة المكسور ما قبلها.\n- **حرفا اللين:** الواو والياء الساكنتان المفتوح ما قبلهما: ﴿خوف﴾، ﴿بيت﴾.\n\n### أولاً: المد الأصلي (الطبيعي)\nهو الذي لا تقوم ذات حرف المد إلا به، ولا تستقيم الكلمة إلا بوجوده، ويكفي فيه وجود أحد حروف المد وليس قبلها همز ولا بعدها همز أو سكون.\n- **مقداره: حركتان** (والحركة بمقدار قبض الأصبع أو بسطه بحالة متوسطة).\n- **سبب التسمية:** أصلي لأصالته وثبوته على حالة واحدة، وطبيعي لأن صاحب الطبيعة السليمة لا يزيده ولا ينقصه عن حركتين.\n\n**أنواعه ثلاثة:**\n1. ثابت وصلاً ووقفاً: ﴿مالك﴾، ﴿يوصيكم﴾، ﴿وضحاها﴾، ﴿قالوا﴾. ومنه الحروف الخمسة في فواتح السور المجموعة في \"**حيّ طهر**\".\n2. ثابت وقفاً لا وصلاً: الألفات المبدلة من التنوين المنصوب ﴿عليماً حكيما﴾، والألفات التي عليها سكون مستطيل ﴿أنا نذير﴾، ﴿الظنونا﴾، ﴿الرسولا﴾، ﴿السبيلا﴾، ﴿قواريرا﴾، والمدود التي تحذف وصلاً خشية التقاء الساكنين ﴿وما في الأرض﴾، ﴿قل ادعوا الله﴾، ﴿وقالا الحمد لله﴾.\n3. ثابت وصلاً لا وقفاً: ﴿إنه هو﴾، ﴿به بصيرا﴾ — ويسمى **مد الصلة**، وعلامته واو صغيرة بعد الهاء المضمومة وياء صغيرة بعد المكسورة.\n\n### ثانياً: المد الفرعي\nهو المد الزائد على المد الأصلي لسبب من الأسباب.\n- **سببه اثنان:** **الهمز** و**السكون**، ويسمى كل منهما سبباً لفظياً.\n- **أنواعه خمسة:** المتصل، المنفصل، البدل (سببها الهمز)، العارض للسكون، اللازم (سببهما السكون).\n- **أحكامه ثلاثة:**\n  - **الوجوب:** خاص بالمتصل فقط.\n  - **الجواز:** خاص بالمنفصل والعارض للسكون والبدل.\n  - **اللزوم:** خاص بالمد اللازم فقط.\n\n#### 1) المد المتصل (الواجب)\n- **تعريفه:** أن يقع بعد حرف المد همز متصل به في **كلمة واحدة**.\n- **أمثلته:** ﴿جاء﴾ (ألف)، ﴿قروء﴾ (واو)، ﴿هنيئا﴾ (ياء).\n- **حكمه:** وجوب مده زيادة على الطبيعي اتفاقاً.\n- **مقداره:** **أربع أو خمس** حركات وصلاً ووقفاً، ويزاد **ست** في الوقف إذا كانت همزته متطرفة.\n- **المتصل المتطرف الهمز الموقوف عليه ثلاثة أنواع:**\n  - **المفتوح** ﴿والسماءَ﴾، ﴿جاءَ﴾: **ثلاثة أوجه** (4 أو 5 أو 6 مع السكون المحض).\n  - **المكسور** ﴿والسماءِ﴾، ﴿هؤلاءِ﴾: **خمسة أوجه** (4 أو 5 مع السكون المحض، ومثلها مع الروم، ثم 6 مع السكون فقط).\n  - **المضموم** ﴿السفهاءُ﴾، ﴿ويا سماءُ﴾: **ثمانية أوجه** (4 أو 5 أو 6 مع السكون المجرد، ومثلها مع الإشمام، ثم 4 أو 5 مع الروم).\n\n#### 2) المد المنفصل (الجائز)\n- **تعريفه:** أن يقع بعد حرف المد همز منفصل عنه في **كلمة أخرى**.\n- **أمثلته:** ﴿إنا أعطيناك الكوثر﴾، ﴿قوا أنفسكم﴾، ﴿وفي أنفسكم﴾.\n- **حكمه:** جواز مده وقصره، إلا أن **القصر ليس من طريق الشاطبية** بل من طريق طيبة النشر.\n- **مقداره:** **أربع أو خمس** حركات.\n- **تنبيه:** المد أربع حركات هو المقدم في الأداء، والمد خمس من زيادات القصيد.\n\n#### 3) مد البدل (الجائز)\n- **تعريفه:** أن يتقدم الهمز على حرف المد في كلمة وليس بعد حرف المد همز أو سكون.\n- **أمثلته:** ﴿ءامنوا﴾، ﴿إيمانا﴾، ﴿أوتوا﴾.\n- **حكمه:** جواز مده وقصره، **إلا أن حفصاً ليس له فيه إلا القصر**.\n- **مقداره: حركتان** فقط كالمد الطبيعي.\n- **سبب التسمية:** أن حرف المد فيه مبدل من الهمز غالباً؛ فإن كانت الهمزة الأولى مفتوحة أبدلت الثانية ألفاً ﴿ءامنوا﴾ (أصلها أَأْمنوا)، ومكسورة أبدلت ياء ﴿إيمانا﴾، ومضمومة أبدلت واواً ﴿أوتوا﴾.\n- **الشبيه بالبدل:** ما كان حرف المد فيه أصلياً: ﴿قرءان﴾، ﴿إسراءيل﴾، ﴿مسئولا﴾.\n\n#### 4) المد العارض للسكون (الجائز)\n- **تعريفه:** أن يقع بعد حرف المد أو حرف اللين ساكن عارض لأجل الوقف.\n- **أمثلته:** ﴿الرحمن﴾، ﴿العالمين﴾، ﴿المفلحون﴾، ﴿البيت﴾، ﴿خوف﴾.\n- **مقداره ثلاثة أوجه:** القصر (حركتان) ويستحب مع الحَدْر، التوسط (أربع) ويستحب مع التدوير، الإشباع (ست) ويستحب مع الترتيل — وأي وجه جائز مع أي مرتبة.\n- **أنواعه ثلاثة:**\n  - **المنصوب** ﴿المستقيم﴾، ﴿العالمين﴾: **ثلاثة أوجه** مع السكون المحض.\n  - **المجرور** ﴿الرحيم﴾: **أربعة أوجه** (الثلاثة مع السكون + الروم مع القصر).\n  - **المرفوع** ﴿نستعين﴾: **سبعة أوجه** (الثلاثة مع السكون + مثلها مع الإشمام + الروم مع القصر).\n\n#### 5) المد اللازم\n- **تعريفه:** أن يأتي بعد حرف المد أو اللين ساكن لازم وصلاً ووقفاً، سواء في كلمة أو حرف.\n- **أمثلته:** ﴿الحاقة﴾، ﴿ءآلآن﴾، ﴿الم﴾، ﴿كهيعص﴾.\n- **حكمه:** لزوم مده مداً متساوياً اتفاقاً وصلاً ووقفاً.\n- **مقداره: ست حركات دائماً**، إلا:\n  - لفظ **\"عين\"** أول مريم والشورى ففيه وجهان: الإشباع والتوسط، **والإشباع هو المقدم**.\n  - حرف **\"ميم\"** من ﴿الم﴾ أول آل عمران حالة الوصل: وجهان (المد ست استصحاباً للأصل، أو القصر حركتين اعتداداً بالحركة العارضة)، وأما الوقف فيتعين ست حركات.\n\n**أقسامه أربعة:**\n1. **لازم كلمي مخفف:** سكون أصلي بعد حرف المد في كلمة خالياً من التشديد. مثاله: ﴿آلآن وقد كنتم به تستعجلون﴾، ﴿آلآن وقد عصيت قبل﴾ بموضعي يونس، وليس في القرآن غيرهما.\n2. **لازم كلمي مثقل:** سكون مشدد في كلمة. مثاله: ﴿الحاقة﴾ (ألف)، ﴿أتحاجوني﴾ (واو)، ولم يأت للياء مثال في القرآن.\n3. **لازم حرفي مخفف:** سكون أصلي في حرف من أحرف الهجاء خالياً من التشديد. مثاله: ﴿ن والقلم﴾، ﴿ق والقرآن﴾، والميم من ﴿الم﴾.\n4. **لازم حرفي مثقل:** سكون أصلي في حرف بشرط التشديد. مثاله: اللام من ﴿الم﴾، ﴿المص﴾، ﴿المر﴾، والسين من ﴿طسم﴾.\n\n**ضابط المد اللازم الحرفي:** أن يوجد في حرف من فواتح السور هجاؤه على ثلاثة أحرف وسطها حرف مد والثالث ساكن، وهذا في **ثمانية أحرف** مجموعة في: \"**كم عسل نقص**\".\n\n**أحرف فواتح السور أربعة عشر** مجموعة في: \"**صِلْه سُحَيراً من قطعك ذا اشتهر**\"، وهي على **أربعة أقسام**:\n1. ما هجاؤه ثلاثة أحرف وسطها حرف مد: سبعة أحرف في \"كم عسل نقص\" (باستثناء العين) — تمد **ست حركات**.\n2. ما وسطه حرف لين: \"**عين**\" من مريم والشورى — يجوز فيه **الإشباع والتوسط**.\n3. ما هجاؤه حرفان ثانيهما حرف مد: خمسة في \"**حيّ طهر**\" — يمد **مداً طبيعياً**.\n4. ما هجاؤه ثلاثة أحرف ليس وسطها حرف مد: \"**ألف**\" — **لا مد فيه أصلاً**.\n\n**فائدة:** الحروف الهجائية وقعت في فواتح **تسع وعشرين** سورة على خمسة أنواع: آحادية (ص، ق، ن)، ثنائية (طه، طس، يس، حم)، ثلاثية (الم، الر، طسم)، رباعية (المص، المر)، خماسية (كهيعص، حم عسق).\n\n### مراتب المدود (من الأقوى إلى الأضعف)\n1. **المد اللازم** — 2. **المتصل** — 3. **العارض للسكون** — 4. **المنفصل** — 5. **البدل**.\n> \"أقوى المدود لازمٌ فما اتصل ... فعارضٌ فذو انفصالٍ فبدل\"\n\n**تنبيهات:**\n- **اجتماع سببين:** إذا اجتمع سببان أحدهما قوي والآخر ضعيف عُمل بالقوي وأُلغي الضعيف، مثل ﴿وجاءوا أباهم﴾ فيعتبر منفصلاً ويلغى البدل.\n- **اجتماع مدين من نوع واحد:** تجب التسوية بينهما.\n- **اجتماع المتصل والمنفصل:** إن مُدّ الأول أربعاً مُدّ الثاني أربعاً، وإن خمساً فخمساً.\n- **اجتماع المتصل مع العارض للسكون:** مجموع الأوجه **ستة**.\n- **اجتماع العارض للسكون واللين:** مجموع الأوجه **ستة** سواء تقدم اللين أو تأخر.\n\n### ألقاب المدود\n1. **مد الصلة:** صلة هاء الضمير بواو إن كانت مضمومة وبياء إن كانت مكسورة — من المد الأصلي.\n2. **مد التمكين:** مدة لطيفة مقدارها حركتان للفصل بين الواوين ﴿آمنوا وعملوا﴾ أو الياءين ﴿في يومين﴾ حذراً من الإدغام أو الإسقاط — من المد الطبيعي. وقيل: كل ياءين أولاهما مشددة مكسورة والثانية ساكنة ﴿حُيّيتم﴾، ﴿النبيّين﴾.\n3. **مد العوض:** عند الوقف على التنوين المنصوب ﴿أفواجا﴾ فيقرأ ألفاً عوضاً عن التنوين.\n4. **مد التعظيم (المبالغة):** ﴿لا إله إلا أنت سبحانك﴾ عند من يقصر المنفصل — ولا يجوز لحفص إلا من طريق الطيبة.\n5. **مد الفرق:** الألف التي يؤتى بها بدلاً من همزة الوصل في ﴿آلذكرين﴾، ﴿آلله﴾، ﴿آلآن﴾ — وسمي بذلك للفرق بين الاستفهام والخبر، وهو من أقسام المد اللازم الكلمي المثقل أو المخفف.\n\n---\n\n## مخارج الحروف\n\n- **المخرج لغة:** محل الخروج. **اصطلاحاً:** اسم لموضع خروج الحرف وتمييزه عن غيره.\n- **الحرف لغة:** الطرف. **اصطلاحاً:** صوت اعتمد على مخرج محقق أو مقدر.\n- **فائدة المخارج:** هي للحروف بمثابة الموازين تُعرف بها مقاديرها فتتميز عن بعضها.\n- **طريقة معرفة المخرج:** أن تنطق بالحرف ساكناً أو مشدداً ثم تدخل عليه همزة وصل محركة، فحيث انقطع الصوت فهو مخرجه.\n\n**المخارج العامة خمسة، والخاصة سبعة عشر** (على المشهور):\n\n### 1) الجوف (مخرج واحد)\nالخلاء الواقع داخل الحلق والفم، وتخرج منه **حروف المد الثلاثة**: الألف ﴿قال﴾، الواو المدية ﴿يقول﴾، الياء المدية ﴿قيل﴾. وتسمى جوفية ومدية وهوائية وحروف علة.\n\n### 2) الحلق (ثلاثة مخارج، ستة أحرف)\n1. **أقصى الحلق** (مما يلي الصدر): **الهمزة والهاء**.\n2. **وسط الحلق**: **العين والحاء**.\n3. **أدنى الحلق** (مما يلي الفم): **الغين والخاء**.\n\n### 3) اللسان (عشرة مخارج، ثمانية عشر حرفاً)\n1. أقصى اللسان مع ما يحاذيه من الحنك الأعلى: **القاف**.\n2. أقصى اللسان أسفل قليلاً من مخرج القاف: **الكاف**.\n3. وسط اللسان مع ما يحاذيه من الحنك الأعلى: **الجيم والشين والياء غير المدية**.\n4. إحدى حافتي اللسان مما يلي الأضراس العليا (واليسرى أسهل): **الضاد**.\n5. أدنى حافة اللسان إلى منتهاها مع ما يحاذيها من اللثة العليا: **اللام**.\n6. طرف اللسان تحت مخرج اللام قليلاً مع لثة الأسنان العليا: **النون المظهرة**.\n7. طرف اللسان قريباً إلى ظهره بعد مخرج النون: **الراء**.\n8. طرف اللسان مع ما بين الثنايا العليا والسفلى قريباً إلى أطراف الثنايا السفلى: **الصاد والزاي والسين**.\n9. ظهر طرف اللسان مع أصول الثنايا العليا: **الطاء والدال والتاء**.\n10. ظهر طرف اللسان مع أطراف الثنايا العليا: **الظاء والذال والثاء**.\n\n### 4) الشفتان (مخرجان، أربعة أحرف)\n1. بطن الشفة السفلى مع أطراف الثنايا العليا: **الفاء**.\n2. ما بين الشفتين معاً: **الباء والميم** (بانطباق) و**الواو غير المدية** (بانفراج قليل).\n\n### 5) الخيشوم (مخرج واحد)\nأقصى الأنف من الداخل، ويخرج منه: **الغنة**.\n\n### ألقاب الحروف\n- **الحلقية:** ء هـ ع ح غ خ | **اللهوية:** ق ك | **الشجرية:** ج ش ي | **الأسَلية:** ص ز س\n- **النِّطعية:** ط د ت | **اللثوية:** ظ ذ ث | **الذَّلقية:** ل ر ن | **الشفهية:** ف و ب م\n- **الجوفية / الهوائية:** حروف المد الثلاثة.\n\n**الحروف الفرعية ثمانية:** الهمزة المسهلة بين بين، الألف الممالة، الصاد المشمّة صوت الزاي، الياء المشمّة صوت الواو، الألف المفخمة، اللام المفخمة، النون المخفاة، الميم المخفاة.\n\n---\n\n## صفات الحروف\n\n- **الصفة لغة:** ما قام بالشيء من المعاني. **اصطلاحاً:** كيفية ثابتة للحرف عند النطق به، من جهر واستعلاء وقلقلة ونحو ذلك.\n\n**فوائد الصفات ثلاث:**\n1. تمييز الحروف المشتركة في المخرج.\n2. معرفة القوي من الضعيف؛ ليُعلم ما يجوز إدغامه وما لا يجوز.\n3. تحسين لفظ الحروف مختلفة المخارج.\n\n**تقسيم الصفات:**\n- **ذاتية:** ملازمة للحرف لا تفارقه أبداً كالقلقلة والشدة.\n- **عرضية:** تلحقه أحياناً وتفارقه أحياناً كالتفخيم والترقيق والإظهار والإدغام والقلب والإخفاء والمد والقصر والسكون والسكت.\n\n### أولاً: الصفات التي لها ضد (إحدى عشرة صفة)\n\n| الصفة | التعريف الاصطلاحي | الحروف |\n|---|---|---|\n| **الهمس** | جريان النفس عند النطق بالحرف لضعف الاعتماد على مخرجه | عشرة: **فحثه شخص سكت** |\n| **الجهر** | انحباس جري النفس لقوة الاعتماد على المخرج | الباقية (واحد وعشرون) |\n| **الشدة** | انحباس جري الصوت لكمال قوة الاعتماد على المخرج | ثمانية: **أجد قط بكت** |\n| **التوسط (البينية)** | اعتدال الصوت عند النطق بالحرف | خمسة: **لن عمر** |\n| **الرخاوة** | جريان الصوت لضعف الاعتماد على المخرج | ثمانية عشر (الباقية) |\n| **الاستعلاء** | ارتفاع جزء كبير من اللسان إلى الحنك الأعلى | سبعة: **خص ضغط قظ** |\n| **الاستفال** | انخفاض اللسان إلى قاع الفم | أربعة وعشرون (الباقية) |\n| **الإطباق** | إطباق اللسان على الحنك الأعلى بحيث ينحصر الصوت بينهما | أربعة: **ص ض ط ظ** |\n| **الانفتاح** | تجافي اللسان عن الحنك الأعلى ليخرج الريح | سبعة وعشرون (الباقية) |\n| **الإذلاق** | خفة الحرف وسرعة النطق به لخروجه من ذلق اللسان أو الشفة | ستة: **فر من لب** |\n| **الإصمات** | ثقل الحرف وعدم سرعة النطق به | خمسة وعشرون (الباقية) |\n\n- **تفاوت الهمس:** أعلاها الصاد (لما فيها من استعلاء وإطباق وصفير)، ثم الخاء، ثم الكاف والتاء، وأضعفها الهاء والفاء والحاء والثاء.\n- **تفاوت الإطباق:** الطاء أقواها، ثم الضاد، ثم الصاد، وأضعفها إطباقاً الظاء.\n- كل حرف من حروف الهجاء لا بد أن يأخذ من هذه الصفات **خمس صفات**.\n\n### ثانياً: الصفات التي لا ضد لها (تسع صفات)\n\n1. **الصفير:** صوت زائد يخرج من بين الثنايا وطرف اللسان. حروفه ثلاثة: **الصاد** (تشبه صوت الأوز)، **الزاي** (صوت النحل)، **السين** (صوت الجراد). وأقواها الصاد ثم الزاي ثم السين.\n2. **القلقلة:** اضطراب الصوت عند النطق بالحرف حتى يسمع له نبرة قوية. حروفها خمسة: **قطب جد**.\n   - **أقسامها:** أعلى في **الطاء**، أوسط في **الجيم**، أدنى في الثلاثة الباقية (ق ب د).\n   - **مراتبها أربع:** أقواها **الساكن الموقوف عليه المشدد** مثل \"الحقّ\"، ثم **الساكن الموقوف عليه غير المشدد** مثل \"خلاق\"، ثم **الساكن الموصول** مثل \"خلقنا\"، وفي هذه الثلاث تبلغ الكمال؛ أما **المتحرك** مثل \"المتقين\" فلا يوجد فيه إلا أصلها.\n   - **كيفيتها:** الراجح أنها أقرب إلى الفتح مطلقاً.\n3. **اللين:** إخراج الحرف من مخرجه بسهولة. حرفاه: **الواو والياء الساكنتان المفتوح ما قبلهما** ﴿خوف﴾، ﴿بيت﴾.\n4. **الانحراف:** الميل بالحرف بعد خروجه من مخرجه حتى يتصل بمخرج آخر. حرفاه: **اللام والراء**.\n5. **التكرير:** ارتعاد رأس اللسان عند النطق بالحرف. حرفه: **الراء**. والغرض من معرفتها **تركها** أي عدم المبالغة فيها، وأكثر ما يظهر إذا كانت الراء مشددة \"كرّة، مرّة\". قال ابن الجزري: \"وأخفِ تكريراً إذا تُشدّد\".\n6. **التفشي:** انتشار خروج الريح بين اللسان والحنك الأعلى. حرفه: **الشين**.\n7. **الاستطالة:** امتداد الصوت من أول إحدى حافتي اللسان إلى آخرها. حرفه: **الضاد**.\n8. **الخفاء:** خفاء صوت الحرف عند النطق به. حروفه أربعة: حروف المد الثلاثة والهاء، ويجمعها: \"**هاوي**\".\n9. **الغنة:** صوت لذيذ مركب في جسم النون والميم. حرفاها: **الميم والنون**.\n\n**قاعدة عدد الصفات:** أي حرف لا تقل صفاته عن **خمس** ولا تزيد عن **سبع**.\n- الحروف ذات **الست** صفات تسعة عشر حرفاً.\n- **الحرف الوحيد ذو السبع صفات: الراء**.\n\n**الحروف المتحدة في الصفات:** (التاء والكاف) — (الثاء والحاء) — (الجيم والدال) — (الذال والواو والياء المتحركتان) — (الميم والنون) — (الواو والياء اللينتان) — (حروف المد الثلاثة).\n\n### تقسيم الصفات إلى قوية وضعيفة\n- **القوية (إحدى عشرة):** الجهر، الشدة، الاستعلاء، الإطباق، الصفير، القلقلة، الانحراف، التكرير، التفشي، الاستطالة، الغنة.\n- **الضعيفة (ست):** الهمس، الرخاوة، الاستفال، الانفتاح، اللين، الخفاء.\n- **ما لا يوصف بقوة ولا ضعف (ثلاث):** الإذلاق، الإصمات، التوسط (البينية).\n\n### تقسيم الحروف إلى قوية وضعيفة (خمسة أقسام)\n- **القوية (ثمانية):** الباء، الجيم، الدال، الراء، الصاد، الضاد، الظاء، القاف.\n- **الأقوى (حرف واحد):** **الطاء** (جميع صفاته قوية).\n- **الضعيفة (عشرة):** التاء، الخاء، الذال، الزاي، السين، الشين، العين، الكاف، الواو والياء المتحركتان أو اللينتان.\n- **الأضعف (سبعة):** الثاء والحاء والفاء والهاء (جميع صفاتها ضعيفة)، وحروف المد الثلاثة (أربع صفات ضعف وصفة قوة ومخرجها مقدر).\n- **المتوسطة (خمسة):** الهمزة، الغين، اللام، الميم، النون.\n\n---\n\n## التفخيم والترقيق\n\n- **التفخيم لغة:** التسمين. **اصطلاحاً:** سِمَنٌ يدخل على صوت الحرف عند النطق به فيمتلئ الفم بصداه. (والتفخيم والتسمين والتغليظ مترادفة).\n- **الترقيق لغة:** التنحيف. **اصطلاحاً:** نحولٌ يدخل على صوت الحرف فلا يمتلئ الفم بصداه.\n\n**الحروف ثلاثة أقسام:**\n\n### 1) ما يُفخّم دائماً\nحروف الاستعلاء السبعة: **خص ضغط قظ**، وحروف الإطباق الأربعة أقواها تفخيماً.\n**ترتيبها قوة:** الطاء أقواها، ثم الضاد، فالصاد، فالظاء، فالقاف، فالغين، فالخاء.\n\n**مراتب التفخيم خمس** (على ما اختاره ابن الجزري في \"التمهيد\"):\n1. المفتوح الذي بعده ألف: ﴿قال﴾.\n2. المفتوح الذي ليس بعده ألف: ﴿خلقكم﴾.\n3. المضموم: ﴿يقول﴾.\n4. الساكن: ﴿فيقتلون ويقتلون﴾، ﴿اقرأ﴾.\n5. المكسور: ﴿قيل﴾.\n\n### 2) ما يُرقّق دائماً\nحروف الاستفال ما عدا: **الألف واللام والراء**.\n\n### 3) ما يدور بين التفخيم والترقيق: الألف واللام والراء\n\n**حكم الألف:** تابعة لما قبلها تفخيماً وترقيقاً (عكس الغنة فإنها تابعة لما بعدها). فتفخم بعد مستعلٍ ﴿قال﴾، ﴿التراقي﴾، وترقق بعد مستفل ﴿الكتاب﴾.\n\n**حكم اللام:** الأصل فيها الترقيق لأنها من حروف الاستفال ﴿لكم﴾، ﴿ذلك﴾، ﴿قلوبهم﴾، **ولا تفخّم إلا في لفظ الجلالة** في حالتين:\n1. إذا وقعت بعد **فتح**: ﴿قال الله﴾، ﴿رسول الله﴾.\n2. إذا وقعت بعد **ضم**: ﴿عبد الله﴾، ﴿قالوا اللهم﴾.\n- أما بعد **كسر** فحكمها **الترقيق مطلقاً** سواء كانت الكسرة متصلة أم منفصلة، أصلية أم عارضة: ﴿لله﴾، ﴿بسم الله﴾، ﴿قل اللهم﴾، ﴿أحدٌ، الله الصمد﴾.\n\n### حكم الراء: أربع حالات\n\n**الحالة الأولى: الراء المرققة قولاً واحداً (ثماني صور)**\n1. الراء المكسورة أول الكلمة ﴿رجال﴾ أو وسطها ﴿مريئا﴾ أو آخرها وصلاً ﴿ليلة القدر خير﴾.\n2. الراء المُمالة، ولم ترد لحفص إلا في ﴿مجراها﴾ بهود.\n3. الراء المكسورة وصلاً والموقوف عليها بالروم ﴿والعصر﴾، ﴿الصور﴾.\n4. الساكنة سكوناً أصلياً وسط الكلمة بعد كسر أصلي ولم يقع بعدها حرف استعلاء في كلمتها ﴿فرعون﴾.\n5. الساكنة سكوناً أصلياً آخر الكلمة وقبلها كسر ﴿رب اغفر لي﴾، ﴿فاصبر صبرا﴾، ﴿ولا تصعّر خدك﴾، ﴿أن أنذر قومك﴾ (ولا رابع لهن).\n6. الساكنة سكوناً عارضاً للوقف بعد كسر ﴿لينذر﴾، ﴿منتشر﴾، ﴿منهمر﴾، ﴿فإذا نُقر﴾.\n7. الساكنة سكوناً عارضاً للوقف بعد ساكن صحيح مستفل قبله كسر ﴿الذكر﴾، ﴿السحر﴾.\n8. الساكنة سكوناً عارضاً للوقف بعد ياء مدية أو لينة ﴿الحمير﴾، ﴿لا ضير﴾، ﴿قدير﴾، ﴿خير﴾، ﴿بشير﴾، ﴿الطير﴾.\n\n**الحالة الثانية: الترقيق أولى (أربعة أنواع)**\n1. الموقوف عليها بالسكون وبعدها ياء محذوفة للتخفيف: **\"نُذُر\"** المسبوقة بالواو (ستة مواضع بالقمر)، و**\"يَسْر\"** بالفجر.\n2. الموقوف عليها وبعدها ياء محذوفة للبناء: **\"أَسْرِ\"** (هود، الحجر، الدخان) و**\"أن أسرِ\"** (طه، الشعراء).\n3. الموقوف عليها بالسكون وقبلها ساكن مستعل وقبل الساكن كسر وهي في الوصل مكسورة: **﴿القِطْر﴾** بسبأ (موضع واحد).\n4. الساكنة وسط الكلمة بعد كسر أصلي وبعدها حرف استعلاء **مكسور** في كلمتها: **﴿فِرْقٍ﴾** بالشعراء (موضع واحد).\n\n**الحالة الثالثة: التفخيم أولى (نوعان)**\n1. الموقوف عليها وقبلها ساكن مستعل وقبل الساكن كسر وهي في الوصل **مفتوحة**: **﴿مِصْر﴾** غير المنون في أربعة مواضع (يونس، يوسف موضعان، الزخرف).\n2. الموقوف عليها وقبلها فتح أو ضم أو ساكن مسبوق بفتح أو ضم وهي في الوصل مكسورة: ﴿البشر﴾، ﴿بالنذر﴾، ﴿والعصر﴾، ﴿الفجر﴾، ﴿العسر﴾.\n\n**الحالة الرابعة: الراء المفخمة قولاً واحداً** (ما سوى ذلك)، ومنها:\n- المفتوحة ﴿ربي﴾، ﴿بربكم﴾، ﴿ليس البرَّ﴾ وصلاً.\n- المضمومة ﴿رزقوا﴾، ﴿يبصرون﴾، ﴿الكذاب الأشر﴾.\n- الساكنة سكوناً أصلياً بعد فتح ﴿مريم﴾، ﴿لا يسخر قوم﴾.\n- الساكنة سكوناً أصلياً بعد ضم ﴿وقرآنا﴾، ﴿فمن يكفر بالطاغوت﴾.\n- الساكنة بعد كسر أصلي متصل وبعدها حرف استعلاء **مفتوح** في كلمتها، وهي **خمس كلمات**: ﴿قرطاس﴾ بالأنعام، ﴿فِرقة﴾ و﴿إرصادا﴾ بالتوبة، ﴿مرصادا﴾ بالنبأ، ﴿لبالمرصاد﴾ بالفجر.\n- الساكنة بعد كسر أصلي **منفصل** ﴿الذي ارتضى﴾، ﴿وقل رب ارحمهما﴾، أو بعد كسر عارض متصل ﴿ارجعي﴾ أو منفصل ﴿إن ارتبتم﴾، ﴿أم ارتابوا﴾.\n\n> **تنبيه:** الأصل في الراء التفخيم عند الجمهور، والترقيق خلاف الأصل.\n\n---\n\n## المتماثلان والمتقاربان والمتجانسان والمتباعدان\n\n**الأنواع الأربعة تشتمل على ثمانية عشر قسماً** (المتماثلان نوع، المتقاربان ثلاثة أنواع، المتجانسان نوع، المتباعدان نوع = ستة أنواع × ثلاثة أقسام).\n\n**وكل نوع ينقسم إلى:**\n- **صغير:** أن يكون الأول ساكناً والثاني متحركاً.\n- **كبير:** أن يكون الحرفان متحركين.\n- **مطلق:** أن يكون الأول متحركاً والثاني ساكناً.\n\n### 1) المتماثلان\n**تعريفهما:** الحرفان اللذان اتفقا **اسماً ومخرجاً وصفة**، كالدالين في ﴿وقد دخلوا﴾.\n- **الصغير:** ﴿اذهب بكتابي هذا﴾ — **حكمه وجوب الإدغام** إلا في مسألتين:\n  1. أن يكون الأول حرف مد ﴿يا ليت قومي يعلمون﴾، ﴿آمنوا وعملوا﴾ فيجب **الإظهار** لئلا يذهب المد. فإن انفتح ما قبل الواو ﴿عصوا وكانوا﴾ أو الياء ﴿لا تختصموا لدي﴾ وجب الإدغام.\n  2. أن يكون الأول **هاء سكت** في ﴿ماليه هلك﴾ ففيها وجهان: الإظهار (مع السكت وهو الأرجح) والإدغام.\n- **الكبير:** ﴿مناسككم﴾، ﴿الرحيم مالك﴾ — **حكمه وجوب الإظهار** عند حفص إلا في كلمتين: ﴿تأمنّا﴾ بيوسف (الإشمام أو الروم)، و﴿مكّنّي﴾ بالكهف (أصلها مكنني فأدغمت).\n- **المطلق:** ﴿ما ننسخ﴾ — **حكمه وجوب الإظهار** عند جميع القراء.\n\n### 2) المتقاربان (ثلاثة أنواع)\n- **النوع الأول:** تقاربا مخرجاً وصفة — الصغير: التاء مع الثاء ﴿كذبت ثمود﴾؛ الكبير: القاف مع الكاف ﴿من فوقكم﴾؛ المطلق: ﴿ولا يستثنون﴾.\n- **النوع الثاني:** تقاربا مخرجاً لا صفة — الصغير: الدال مع السين ﴿قد سمع﴾؛ الكبير: ﴿عدد سنين﴾؛ المطلق: السين مع النون ﴿سندس﴾.\n- **النوع الثالث:** تقاربا صفة لا مخرجاً — الصغير: الذال مع الجيم ﴿إذ جاءوكم﴾؛ الكبير: القاف مع الدال ﴿قدرٍ معلوم﴾؛ المطلق: القاف مع الطاء ﴿يلتقطه﴾.\n\n**حكم المتقاربين الصغير:** الإظهار لحفص **إلا في اثنتين وثلاثين مسألة** متفق على عدم إظهارها، ومسألة واحدة مختلف في إدغامها:\n- **المتفق على إدغامها:** النون الساكنة مع (ي، و، ل، ر) — واللام الشمسية مع حروفها الثلاثة عشر (بعد إسقاط اللام لأنها معها متماثلان) — ولام \"قل\" و\"بل\" التي بعدها راء (باستثناء ﴿بل ران﴾ لوجوب السكت).\n- **المختلف فيها:** القاف مع الكاف في ﴿نخلقكم﴾ بالمرسلات: إدغام كامل (وهو الأولى والمشهور) أو ناقص (ببقاء الاستعلاء وزوال القلقلة).\n- **المتفق على قلبه:** مسألة واحدة، النون الساكنة قبل الباء.\n- **المتفق على إخفائه:** ثلاثة عشر موضعاً عند النون الساكنة قبل أحرف الإخفاء ما عدا القاف والكاف (لأنهما مع النون متباعدان).\n- **حكم المتقاربين الكبير والمطلق:** الإظهار دائماً.\n\n### 3) المتجانسان\n**تعريفهما:** الحرفان اللذان اتفقا **مخرجاً واختلفا صفة**.\n- الصغير: التاء مع الدال ﴿أُجيبت دعوتكما﴾؛ الكبير: ﴿الصالحات طوبى﴾؛ المطلق: ﴿أفتطمعون﴾.\n- **حكم الصغير: وجوب الإظهار مطلقاً إلا في ثمان مسائل**:\n  - **ست متفق على إدغامها إدغاماً كاملاً:**\n    1. الباء التي بعدها ميم: ﴿اركب معنا﴾.\n    2. التاء التي بعدها دال: ﴿أثقلت دعوا﴾.\n    3. التاء التي بعدها طاء: ﴿إذ همت طائفتان﴾.\n    4. الثاء التي بعدها ذال: ﴿يلهث ذلك﴾.\n    5. الدال التي بعدها تاء: ﴿ومهدت﴾.\n    6. الذال التي بعدها ظاء: ﴿إذ ظلمتم﴾.\n  - **واحدة متفق على إدغامها إدغاماً ناقصاً:** الطاء التي بعدها تاء ﴿أحطتُ﴾ (ببقاء صفة الإطباق).\n  - **واحدة مختلف فيها بين الإظهار والإخفاء:** الميم الساكنة التي بعدها باء ﴿ترميهم بحجارة﴾.\n- **حكم الكبير والمطلق:** الإظهار دائماً.\n\n### 4) المتباعدان\n**تعريفهما:** الحرفان اللذان تباعدا مخرجاً واختلفا صفة ﴿تخرجون﴾، أو تباعدا مخرجاً واتفقا صفة ﴿فاكتبوه﴾.\n- الصغير: النون مع الخاء ﴿المنخنقة﴾؛ الكبير: الدال مع الهاء ﴿دهاقا﴾؛ المطلق: الهاء مع الميم ﴿أنفسهم﴾.\n- **حكم الصغير:** الإظهار مطلقاً إلا في مسألتين متفق على الإخفاء فيهما: النون الساكنة قبل **القاف** ﴿انقلبوا﴾، والنون الساكنة قبل **الكاف** ﴿أنكالا﴾.\n- **حكم الكبير والمطلق:** الإظهار دائماً.\n\n---\n\n## الوقف على أواخر الكلم\n\n**أنواعه ثلاثة: السكون المحض، الروم، الإشمام.**\n\n### 1) السكون المحض\nهو السكون الخالص الذي لا حركة فيه، وهو **الأصل في الوقف**. \"والأصل في الوقف السكون\". وإذا كان الموقوف عليه مشدداً يراعى معه التشديد ﴿ويحيى من حي﴾. والعرب لا يبتدئون بساكن كما لا يقفون على متحرك.\n\n### 2) الروم\n- **تعريفه:** تضعيف الصوت بالحركة حتى يذهب معظم صوتها فتُسمع لها صوت خفي يسمعه القريب المصغي دون البعيد. وقيل: الإتيان بثلث الحركة.\n- لا يكون إلا **مع القصر** في حالة الوقف فقط، ويدخل في **المجرور والمرفوع** من المعربات ﴿الرحيم﴾، ﴿نستعين﴾ وكذا المكسور والمضموم من المبنيات ﴿هؤلاء﴾، ﴿ومن حيث﴾.\n- ولا بد معه من حذف التنوين.\n- **لم يقع في وسط الكلمة إلا في موضع واحد:** ﴿ما لك لا تأمنّا﴾ بيوسف.\n\n### 3) الإشمام\n- **تعريفه:** ضم الشفتين بُعيد إسكان الحرف دون تراخٍ مع ترك فرجة لخروج النفس، بحيث يراه المبصر دون الأعمى.\n- ولا يكون في الوقف إلا في **المضموم والمرفوع** فقط.\n\n**فائدة الروم والإشمام:** بيان الحركة الأصلية التي تثبت في الوصل للحرف الموقوف عليه؛ ليظهر للسامع في الروم وللناظر في الإشمام.\n\n**الفرق بين الروم والاختلاس:** يشتركان في تبعيض الحركة، إلا أن الروم لا يكون في المفتوح والمنصوب على الأصح، أما الاختلاس فيكون في الحركات الثلاث. والثابت في الروم من الحركة أقل من المحذوف (قُدِّر بالثلث)، وفي الاختلاس أكثر من المحذوف (قُدِّر بالثلثين).\n\n**الإشمام يطلق على أربعة أنواع:**\n1. ضم الشفتين بُعيد إسكان الحرف حالة الوقف.\n2. ضم الشفتين مقارناً لسكون الحرف المدغم في ﴿تأمنّا﴾.\n3. إشمام حرف بحرف: كخلط الصاد بالزاي في ﴿الصراط﴾ في قراءة حمزة.\n4. إشمام حركة بحركة: كخلط الكسرة بالضمة في ﴿قيل﴾ في قراءة الكسائي وهشام.\n\n### أقسام الموقوف عليه ثلاثة\n**القسم الأول: ما يوقف عليه بالسكون المحض فقط** (لا روم ولا إشمام):\n1. ما كان ساكناً في الوصل ﴿فلا تنهر﴾.\n2. ما كان متحركاً بحركة عارضة لالتقاء الساكنين ﴿قم الليل﴾، وكذا ميم الجمع ﴿وأنتم الأعلون﴾، ومنه ﴿حينئذٍ﴾ (بخلاف ﴿غواشٍ﴾ و﴿كلٍّ﴾ فالحركة فيهما أصلية).\n3. ما كان آخره هاء التأنيث الموقوف عليها بالهاء ﴿الجنة﴾ — بخلاف ما يوقف عليه بالتاء موافقة للرسم ﴿رحمت الله وبركاته﴾ فيدخلها الروم والإشمام.\n4. ما كان في الوصل متحركاً بالفتح غير منون ﴿المستقيم﴾، ﴿الذين﴾.\n\n**القسم الثاني: ما يوقف عليه بالسكون والروم فقط** — وهو ما كان في الوصل متحركاً **بالكسرة** ﴿الرحيم﴾، ﴿هؤلاء﴾.\n\n**القسم الثالث: ما يوقف عليه بالسكون والروم والإشمام** — وهو ما كان في الوصل متحركاً **بالضمة** ﴿نستعين﴾، ﴿يا صالح﴾.\n\n### حكم الوقف على هاء الضمير\nتأتي هاء الضمير في **سبع صور**: بعد ضم ﴿يرفعه﴾، بعد واو ساكنة مدية ﴿عقلوه﴾ أو لينة ﴿وليرضوه﴾، بعد كسر ﴿به﴾، بعد ياء ساكنة مدية ﴿فألقيه﴾ أو لينة ﴿بوالديه﴾، بعد فتح ﴿زوجه﴾، بعد ألف ﴿اجتباه وهداه﴾، بعد ساكن صحيح ﴿فليصمه﴾.\n\n**مذاهب أهل الأداء ثلاثة:**\n1. جواز الروم والإشمام فيها مطلقاً (التيسير والتجريد والتلخيص).\n2. منع الروم والإشمام فيها مطلقاً.\n3. **المختار عند ابن الجزري:** المنع إذا كان قبلها ضم أو كسر أو واو أو ياء، والجواز إذا كان قبلها فتح أو ألف أو ساكن صحيح.\n\n---\n\n## حكم التقاء الساكنين\n\n### أ) في كلمة واحدة\n1. **في حالة الوقف فقط** (على حدهما) وهذا **جائز**، سواء كان الأول حرف مد ﴿إن الأبرار﴾، ﴿المفلحون﴾، ﴿رب العالمين﴾، أو حرف لين ﴿رب هذا البيت﴾، ﴿من خوف﴾، أو ساكناً صحيحاً ﴿في الأمر﴾، ﴿ورضوا﴾، ﴿والأرض﴾.\n2. **في حالتي الوصل والوقف** (على غير حدهما): ﴿الصاخة﴾، ﴿أتحاجوني﴾، ﴿آلآن﴾، ﴿الم﴾ — والتخلص منهما **بالمد الطويل ست حركات** وهو المد اللازم.\n\n### ب) في كلمتين (يلتقيان في الوصل فقط)\n**إما بالحذف أو بالتحريك:**\n- **الحذف:** في حرف المد الذي يحذف وصلاً ويثبت وقفاً ﴿إذا الشمس كورت﴾، ﴿وإذ قالوا اللهم﴾، ﴿وفي السماء رزقكم﴾.\n- **التحريك:** **حفص يحرك الساكن الأول بالكسر** على الأصل، والساكن الأول هو أحد حروف \"**لتنود**\" والتنوين:\n  - اللام: ﴿قل ادعوا الله﴾.\n  - التاء: ﴿وقالتِ اخرج عليهن﴾ بيوسف (وليس غيره في القرآن).\n  - النون: ﴿أنِ اقتلوا أنفسكم﴾.\n  - الواو: ثلاثة مواضع لا رابع لها: ﴿أوِ اخرجوا﴾، ﴿أوِ ادعوا الرحمن﴾، ﴿أوِ انقص منه قليلا﴾.\n  - الدال: ﴿ولقدِ استهزئ﴾.\n  - التنوين: ﴿فتيلاً، انظر﴾، ﴿برحمةٍ ادخلوا الجنة﴾.\n\n**ويخرج عن هذا الأصل:**\n- **التحريك بالفتح في ثلاث صور:**\n  1. \"مِن\" الجارة: ﴿من الشاهدين﴾ (لثقل الانتقال من الكسر إلى الفتح).\n  2. تاء التأنيث إذا أضيفت إلى التثنية: ﴿كانتا تحت عبدين﴾.\n  3. ﴿الم، اللهُ لا إله إلا هو الحي القيوم﴾ أول آل عمران — حركت الميم بالفتح **محافظة على تفخيم لفظ الجلالة**.\n- **التحريك بالضم في صورتين:**\n  1. **واو اللين** التي للجمع: ﴿فتمنوا الموت﴾، ﴿وعصوا الرسول﴾.\n  2. **ميم الجمع:** ﴿وسخر لكم الليل والنهار﴾، ﴿ثم رددنا لكم الكرة﴾ — لأنه أصل حركتها.\n\n---\n\n## هاء الكناية (هاء الضمير)\n\n- **تعريفها:** هي هاء الضمير **الزائدة عن بنية الكلمة** التي **يكنى بها عن الواحد المذكر الغائب**.\n  - خرج بـ \"الزائدة\" الهاء الأصلية: ﴿نفقه﴾، ﴿وجه﴾، ﴿ينته﴾.\n  - وخرج بـ \"الواحد المذكر الغائب\" هاء ﴿عليها﴾ و﴿عليهما﴾ و﴿عليهم﴾ و﴿عليهن﴾.\n- **فائدتها:** الإيجاز والاختصار.\n- **الأصل فيها البناء على الضم** ﴿له﴾، ﴿منه﴾، إلا أن يقع قبلها كسر ﴿به﴾ أو ياء ساكنة ﴿عليه﴾ فتُكسر. وقرأها حفص بالضم مراعاة للأصل في ﴿وما أنسانيهُ﴾ بالكهف و﴿عليهُ الله﴾ بالفتح.\n- وتتصل بالأسماء والأفعال والحروف، ويجمعها ﴿قال له صاحبه وهو يحاوره﴾.\n\n**أحوالها أربع:**\n1. **بين متحركين** ﴿إنه كان توابا﴾، ﴿وعنده أجر عظيم﴾ — **حكمها: الصلة** بواو ممدودة مقدار حركتين إن كانت مضمومة، وبياء إن كانت مكسورة. فإن وقع بعدها همز كان المد من باب **المد المنفصل**.\n   - **يستثنى ثلاث كلمات:** ﴿أرجه﴾ بالأعراف والشعراء و﴿فألقه﴾ بالنمل (تقرآن بإسكان الهاء)، و﴿يرضه لكم﴾ بالزمر (بضم الهاء من غير صلة).\n2. **بين ساكنين** ﴿فيه القرآن﴾، ﴿عاهد عليه الله﴾ — **لا صلة فيها مطلقاً** لجميع القراء.\n3. **قبلها متحرك وبعدها ساكن** ﴿بيده الملك﴾ — **عدم الصلة**؛ لئلا يجتمع ساكنان على غير حدهما.\n4. **قبلها وبعدها متحرك** ﴿فيه هدى للمتقين﴾، ﴿خذوه فغلوه﴾ — **عدم الصلة لحفص** إلا في موضع واحد: ﴿ويخلد فيه مهانا﴾ بالفرقان فتقرأ بالصلة تشنيعاً بحال العاصي.\n\n**ملحوظة:** كل هاء ضمير تقرأ بالصلة يكون بعدها واو صغيرة أو ياء صغيرة حسب حركتها.\n\n---\n\n## الوقف والابتداء\n\n**الأصل في الباب** حديث أم سلمة رضي الله عنها في وصف قراءة النبي ﷺ: \"كان يقطع قراءته... يقرأ ﴿الحمد لله رب العالمين﴾ ثم يقف، ﴿الرحمن الرحيم﴾ ثم يقف...\" (أخرجه الترمذي وقال: حسن صحيح).\nوقول علي رضي الله عنه في تفسير الترتيل: \"**الترتيل هو تجويد الحروف ومعرفة الوقوف**\".\n\n### تعريف الوقف\n- **لغة:** الحبس والكف.\n- **اصطلاحاً:** قطع الصوت على الكلمة القرآنية زمناً يتنفس فيه القارئ عادة بنية استئناف القراءة، لا بنية الإعراض عنها.\n- يأتي في رؤوس الآي وأواسطها، **ولا بد معه من التنفس**، ولا يأتي في وسط الكلمة ولا فيما اتصل رسماً.\n\n### حكم الوقف\n**الوقف جائز ما لم يوجد ما يوجبه أو يمنعه**؛ فلا يوجد في القرآن وقف واجب يأثم بتركه ولا وقف حرام يأثم بفعله.\n> \"وليس في القرآن من وقفٍ وجب ... ولا حرامٍ غير ما له سبب\"\n\n### أقسام الوقف في ذاته (أربعة)\n1. **الوقف الاختباري** (بالباء الموحدة): أن يقف على كلمة ليست محلاً للوقف عادة، في مقام الاختبار أو التعليم، لبيان حكمها حذفاً وإثباتاً ﴿أولي الأيدي﴾ / ﴿ذا الأيد﴾، أو من حيث التاءات ﴿امرأت نوح﴾ / ﴿وإن امرأةٌ خافت﴾.\n2. **الوقف الاضطراري:** ما يعرض للقارئ بسبب ضرورة كالعطاس أو ضيق النفس أو النسيان أو غلبة البكاء. وحكمه: جواز الوقف على أي كلمة حتى تنتهي الضرورة، ثم يعود فيصلها بما بعدها إن صلح الابتداء بها وإلا فبما قبلها.\n3. **الوقف الانتظاري:** الوقف على الكلمة بقصد استيفاء ما في الآية من أوجه الخلاف حين القراءة بجمع الروايات.\n4. **الوقف الاختياري** (بالياء التحتية): أن يقف باختياره دون عذر أو إجابة سؤال — **وهو المقصود في هذا الباب**.\n\n### أقسام الوقف الاختياري (أربعة: تام، كافٍ، حسن، قبيح)\n\n#### 1) الوقف التام\n**تعريفه:** الوقف على كلام تام في ذاته لم يتعلق بما بعده مطلقاً لا لفظاً ولا معنى.\n- **النوع الأول (اللازم/الواجب أو التام المقيد):** يلزم الوقف عليه والابتداء بما بعده؛ لأن وصله يوهم معنى غير المراد.\n  - ﴿فلا يحزنك قولهم﴾ ثم ﴿إنا نعلم ما يسرون وما يعلنون﴾.\n  - ﴿إنما يستجيب الذين يسمعون﴾ ثم ﴿والموتى يبعثهم الله﴾.\n  - **وعلامته:** وضع ميم أفقية \"**مـ**\" على الكلمة.\n  - ويسميه بعضهم **وقف البيان** كالوقف على ﴿وتعزروه وتوقروه﴾.\n- **النوع الثاني (التام المطلق):** يحسن الوقف عليه ويحسن الابتداء بما بعده، ويكون غالباً في أواخر السور والآيات وانقضاء القصص.\n- **مثال التعلق المعنوي:** الإخبار عن حال المؤمنين أول البقرة لا يتم إلا عند ﴿المفلحون﴾، وعن الكافرين عند ﴿ولهم عذاب عظيم﴾، وعن المنافقين عند ﴿إن الله على كل شيء قدير﴾.\n\n#### 2) الوقف الكافي\n**تعريفه:** الوقف على كلام تام في ذاته **متعلق بما بعده في المعنى دون اللفظ**.\n- أمثلته: الوقف على ﴿أم لم تنذرهم لا يؤمنون﴾ والابتداء بـ ﴿ختم الله على قلوبهم﴾؛ والوقف على ﴿وما هم بمؤمنين﴾ والابتداء بـ ﴿يخادعون الله﴾؛ ويكون في وسط الآية ﴿لا تقتلوا الصيد وأنتم حرم﴾.\n- **حكمه:** يحسن الوقف عليه والابتداء بما بعده كالتام، غير أن الوقف على التام أكثر حسناً.\n- **سمي كافياً** للاكتفاء به واستغنائه عما بعده لعدم تعلقه به لفظاً.\n\n#### 3) الوقف الحسن\nهو الوقف على ما تم في ذاته ولكنه متعلق بما بعده **لفظاً ومعنى**.\n- **حكمه:** يحسن الوقف عليه ولا يحسن الابتداء بما بعده اتفاقاً؛ لشدة تعلقه بما بعده لفظاً ومعنى.\n- وإذا كان **رأس آية** ففيه تفصيل ومذاهب ثلاثة؛ وأكثر أهل الأداء ومعهم ابن الجزري على أنه يحسن الوقف والابتداء مطلقاً؛ لأن الوقف على رؤوس الآي **سنة**.\n- وإن كان رأس آية يوهم معنى غير المراد كالوقف على ﴿فويل للمصلين﴾ فالمختار (ابن الجزري ومن تبعه) **أنه لا يجوز الوقف عليه بل يجب وصله**، ويعتبرونه من الوقف القبيح.\n- **تتمة:** قد يكون الوقف حسناً والابتداء بما بعده قبيحاً: ﴿يخرجون الرسول﴾ ثم ﴿وإياكم أن تؤمنوا بالله ربكم﴾.\n\n#### 4) الوقف القبيح\n**تعريفه:** الوقف على كلام لم يتم في ذاته ولم يؤدِّ معنى صحيحاً؛ لشدة تعلقه بما بعده لفظاً ومعنى.\n- **النوع الأول:** ما لم يُفهم منه معنى: الوقف على \"بسم\" من ﴿بسم الله﴾، وعلى \"الحمد\" من ﴿الحمد لله﴾.\n- **النوع الثاني (الأقبح والأشنع):** ما يوهم معنى غير مراد الله تعالى: ﴿إن الله لا يستحيي﴾، ﴿وما من إله﴾، ﴿وما أرسلناك﴾، ﴿لا تقربوا الصلاة﴾، ﴿يدخل من يشاء في رحمته والظالمين﴾ — ومن قصده يأثم، بل ربما أفضى إلى الكفر.\n- **حكمه:** لا يجوز إلا للضرورة، وإذا وقف عليه مضطراً لزمه أن يرجع فيصله بما بعده.\n> \"وغير ما تمّ قبيحٌ وله ... يوقف مضطراً ويبدا قبله\"\n\n### الابتداء\n- **تعريفه:** الشروع في القراءة، سواء بعد قطع وانصراف أو بعد وقف.\n- **قال ابن الجزري:** الابتداء **لا يكون إلا اختيارياً**؛ لأنه ليس كالوقف تدعو إليه ضرورة، فلا يجوز إلا بكلام مستقل في المعنى موفٍ بالمقصود.\n- **نوعاه:**\n  1. **ابتداء حسن:** بكلام مستقل في المعنى لا يغير ما أراده الله — يجوز.\n  2. **ابتداء قبيح:** بكلام يفسد المعنى أو يحيله — لا يجوز، وهو متفاوت: كالابتداء بـ ﴿أبي لهب وتب﴾ (مبتور)، وأشد قبحاً الابتداء بـ ﴿يد الله مغلولة﴾، ﴿عزير ابن الله﴾، ﴿وإياكم أن تؤمنوا بالله ربكم﴾، ﴿لا أعبد الذي فطرني﴾.\n\n### السكت\n- **لغة:** المنع. **اصطلاحاً:** قطع الصوت على الكلمة القرآنية زمناً يسيراً **من غير تنفس مقداره حركتان**، وهو مقيد بالسماع والنقل فلا يجوز إلا فيما صحت الرواية به.\n- **السكت الواجب لحفص أربعة مواضع:**\n  1. ألف \"عوجا\" ﴿ولم يجعل له عوجا، قيما﴾ بالكهف — وحكمته: لئلا يوهم أن \"قيماً\" صفة لـ\"عوجا\".\n  2. ألف \"مرقدنا\" ﴿من بعثنا من مرقدنا هذا﴾ بيس — لئلا يوهم أن ﴿هذا﴾ من مقول المشركين.\n  3. نون \"من\" ﴿وقيل من راق﴾ بالقيامة.\n  4. لام \"بل\" ﴿كلا بل ران على قلوبهم﴾ بالمطففين — وحكمته: لئلا يوهم أن كلاً منهما كلمة واحدة.\n  - **وعلامته:** وضع \"**س**\" على الكلمة.\n- **السكت الجائز موضعان:**\n  1. بين سورتي الأنفال وبراءة.\n  2. على الهاء في ﴿ماليه هلك﴾ بالحاقة — **والسكت هو المقدم في الأداء**.\n\n### القطع\n- **لغة:** الإبانة والإزالة. **اصطلاحاً:** قطع القراءة رأساً والانصراف عنها إلى أمر خارجي لا علاقة له بها، فإذا عاد إليها استُحبّ أن يستعيذ.\n- **ولا يكون إلا في أواخر السور أو على رؤوس الآي على الأقل**؛ لأن رؤوس الآي في نفسها مقاطع.\n\n---\n\n## الحذف والإثبات (الوقف تابع للرسم)\n\nالمقصود ما يكون في حروف المد الثلاثة (الألف والياء والواو)، وإثباتها وحذفها من خصائص الرسم العثماني الواجب اتباعه.\n\n**الصور الأربع:**\n1. الثابت في الرسم وفي الوصل ﴿قالا ربنا﴾، ﴿إني معكم﴾ — **الوقف بالإثبات**.\n2. المحذوف في الرسم وفي الوصل ﴿ولم يخشَ إلا الله﴾، ﴿الجوارِ﴾، ﴿ادعُ إلى سبيل ربك﴾ — **الوقف بالحذف**.\n3. الثابت في الرسم المحذوف في الوصل ﴿الظنونا﴾، ﴿ننجِي المؤمنين﴾، ﴿مرسلو الناقة﴾ — **الوقف بالإثبات**.\n4. المحذوف في الرسم الثابت في الوصل ﴿إنه هو﴾، ﴿به بصيرا﴾ — **الوقف بالحذف**.\n\n**ويستثنى:** ﴿سلاسلا﴾ بالدهر و﴿آتانِ﴾ بالنمل، ففي كل منهما لحفص عند الوقف **وجهان: الإثبات والحذف**. وكذلك ﴿ثمودا﴾ في المواضع الأربعة (هود الثاني، الفرقان، العنكبوت، النجم) و\"قوارير\" الموضع الثاني بالإنسان، فهي ثابتة رسماً ومحذوفة وقفاً ووصلاً.\n\n---\n\n## همزة الوصل وهمزة القطع\n\n### همزة الوصل\n- **تعريفها:** هي التي **تثبت في الابتداء وتسقط في الدرج** (أي تحذف حالة الوصل).\n- **سبب التسمية:** لأنه يُتوصل بها إلى النطق بالحرف الساكن الواقع في ابتداء الكلمة.\n- وتكون في الأفعال والأسماء والحروف، ولا تكون إلا متحركة في أول الكلمة المبتدأ بها.\n\n**أولاً: في الأفعال** — لا توجد إلا في **الماضي وفعل الأمر**:\n- الماضي: الخماسي ﴿اصطفى﴾، ﴿ابتُلي﴾ والسداسي ﴿استسقى﴾، ﴿استُحفظوا﴾.\n- الأمر: الثلاثي ﴿ادع﴾، ﴿اضرب﴾، ﴿اذهب﴾؛ والخماسي ﴿انتظروا﴾، ﴿انطلقوا﴾؛ والسداسي ﴿استغفروا﴾، ﴿استأجره﴾.\n- **حكم البدء:**\n  - **بالضم** إذا كان ثالث الفعل مضموماً **ضماً لازماً** ﴿ادْعُ﴾، أو كان خماسياً أو سداسياً مبنياً للمجهول ﴿ابتُلي﴾، ﴿استُحفظوا﴾.\n    > \"وابدأ بهمز الوصل من فعلٍ بضم ... إن كان ثالثٌ من الفعل يُضم\"\n  - **بالكسر** إذا كان ثالث الفعل مفتوحاً ﴿اذْهَب﴾ أو مكسوراً ﴿اضْرِب﴾ أو مضموماً **ضماً عارضاً** ﴿اقضوا﴾، ﴿امضوا﴾، ﴿ابنوا﴾، ﴿ائتوا﴾، ﴿امشوا﴾.\n  - **تنبيه:** لم تُفتح إذا كان ثالثه مفتوحاً؛ لئلا يلتبس الأمر بالمضارع.\n  - المضارع لا توجد فيه همزة وصل مطلقاً؛ لأن همزته همزة قطع.\n\n**ثانياً: في الأسماء** — قياسية وسماعية:\n- **القياسية:** مصدر الفعل الخماسي ﴿افتراء﴾، ﴿انتقام﴾ والسداسي ﴿استكبارا﴾، ﴿استغفار﴾ — **وحكم البدء بهما: الكسر وجوباً**.\n- **السماعية:** سبعة أسماء في القرآن، جمعها ابن الجزري: **ابن، ابنة، امرؤ، امرأة، اثنين، اثنتين، اسم** — **وحكم البدء بها: الكسر وجوباً**.\n  - وفي غير القرآن سماعاً ثلاثة: \"است\"، \"ابنم\"، \"ايم\".\n\n**ثالثاً: في الحروف** — لا توجد في القرآن إلا في **\"أل\"**، سواء كانت لازمة ﴿الذي، التي﴾ أو للتعريف ﴿الأرض، الشمس﴾ أو موصولة ﴿إن المسلمين﴾ — **وحكم البدء بها: فتح الهمزة**.\n\n> **الخلاصة:** فتح همزة الوصل يكون في \"أل\" فقط، وضمها في الفعل المضموم ثالثه ضماً لازماً، وكسرها فيما عدا ذلك.\n\n**تنبيه — همزة الوصل مع همزة الاستفهام:**\n- إذا دخلت همزة الاستفهام على همزة وصل **مكسورة** حُذفت همزة الوصل وبقيت همزة الاستفهام مفتوحة، وذلك في **سبعة مواضع**: ﴿أتخذتم﴾ بالبقرة، ﴿أطّلع﴾ بمريم، ﴿أفترى﴾ بسبأ، ﴿أصطفى﴾ بالصافات، ﴿أتخذناهم﴾ بص، ﴿أستكبرت﴾ بص، ﴿أستغفرت﴾ بالمنافقون.\n- أما إذا وقعت بين **همزة الاستفهام ولام التعريف** فلم تُحذف لئلا يلتبس الاستفهام بالخبر، بل **تُبدل ألفاً وتمد مداً مشبعاً** (وهو الوجه القوي المفضل) **أو تُسهّل بين الهمزة والألف من غير مد**، وذلك في: ﴿آلذكرين﴾ موضعي الأنعام، ﴿آلآن﴾ موضعي يونس، ﴿آلله﴾ بيونس والنمل.\n- **\"الاسم\"** في ﴿بئس الاسم الفسوق﴾ بالحجرات: عند الابتداء **وجهان**: البدء بهمزة مفتوحة فلام مكسورة فسين ساكنة، أو حذف همزة الوصل والبدء بلام مكسورة فسين ساكنة.\n\n### همزة القطع\n- **تعريفها:** هي التي **تثبت في الابتداء والوصل والخط**.\n- **سبب التسمية:** لأنها تقطع بعض الحروف عن بعض عند النطق بها.\n- وتكون في أول الكلمة ﴿أعطيناك﴾، ﴿إنا﴾، ﴿أوتوا﴾، وفي وسطها ﴿وقرآن﴾، ﴿سئلت﴾، ﴿الموءودة﴾، ﴿وبئر﴾، وفي آخرها ﴿جاء﴾، ﴿قروء﴾، ﴿يستهزئ﴾، ﴿إن نشأ﴾، وتقع في الأسماء والأفعال والحروف.\n- **حكمها: التحقيق دائماً** حيثما وقعت — **إلا الهمزة الثانية من ﴿أأعجمي﴾ بفصلت فإنها تُسهّل بين الهمزة والألف وجوباً**.\n\n---\n\n## أهم ما يُراعى لحفص (من طريق الشاطبية)\n\n1. ﴿ءأعجمي﴾ بفصلت: تسهيل الهمزة الثانية وجهاً واحداً.\n2. ﴿مجراها﴾ بهود: بالإمالة.\n3. ﴿ضعف﴾ بالروم (ثلاثة مواضع): بفتح الضاد وضمها، **والفتح هو المقدم**.\n4. ﴿ويبصط﴾ بالبقرة و﴿بصطة﴾ بالأعراف: بالسين الخالصة.\n5. ﴿المصيطرون﴾ بالطور: بالصاد أو السين، **والصاد أشهر**. و﴿بمصيطر﴾ بالغاشية: بالصاد الخالصة.\n6. إثبات الألف وقفاً وحذفها وصلاً في: ﴿أنا﴾، ﴿لكنا﴾، ﴿الظنونا﴾، ﴿الرسولا﴾، ﴿السبيلا﴾، ﴿قواريرا﴾ (الموضع الأول).\n7. ﴿سلاسلا﴾ بالإنسان: وصلاً بفتح اللام من غير تنوين، ووقفاً بالألف أو بإسكان اللام.\n8. القراءة بالنون وصلاً وبالألف وقفاً في: ﴿وليكونا﴾، ﴿لنسفعا﴾، ﴿وإذا﴾.\n9. ﴿آتانِ﴾ بالنمل: بفتح الياء وصلاً، وفي الوقف وجهان: الإثبات والحذف.\n10. حرف \"عين\" في ﴿كهيعص﴾ و﴿حم عسق﴾: التوسط أربع أو المد ست، **والست أفضل**.\n11. ﴿لا تأمنّا﴾ بيوسف: بالإشمام أو الروم (الاختلاس).\n12. السكتات الواجبة الأربع، والجائزة الموضعان.\n13. إسكان هاء الكناية في ﴿أرجه﴾ و﴿فألقه﴾، وضم الهاء بلا صلة في ﴿يرضه﴾، وبالصلة في ﴿فيه مهانا﴾.\n14. إظهار النون عند الواو في ﴿يس والقرآن﴾ و﴿ن والقلم﴾.\n15. إدغام الثاء في الذال ﴿يلهث ذلك﴾، والباء في الميم ﴿اركب معنا﴾ إدغاماً **كاملاً** للتجانس.\n16. إدغام الطاء في التاء ﴿بسطت﴾، ﴿أحطت﴾ إدغاماً **ناقصاً** مع بقاء صفة الإطباق للتقارب.\n17. ﴿نخلقكم﴾ بالمرسلات: خلاف في الإدغام الكامل أو الناقص، **والكامل أولى**.\n", "questions": [{"s": "tajweed", "q": "عرّف الإقلاب مع ذكر مثال.", "a": "قلب النون الساكنة أو التنوين ميماً مخفاة مع الغنة عند الباء. مثال: عليمٌ بذات الصدور، أنبئهم."}, {"s": "tajweed", "q": "ما الفرق بين المد المتصل والمنفصل مع مثال؟", "a": "المتصل: الهمز بعد حرف المد في كلمة واحدة، واجب 4 أو 5. مثل: السماء. المنفصل: الهمز في الكلمة التالية، جائز 2 أو 4 أو 5. مثل: بما أنزل."}, {"s": "tajweed", "q": "عرّف القلقلة وحروفها ومراتبها.", "a": "اضطراب الصوت عند النطق بالحرف ساكناً. حروفها: قطب جد. مراتبها: كبرى (المشدد المو
