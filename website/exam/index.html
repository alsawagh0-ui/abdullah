واجبًا أو قضاءً ثم قلبه نفلًا **صح**.\n- **يسن التطوع وأفضله يوم ويوم**: أيام البيض (13 و14 و15)، والخميس والاثنين، وستة من شوال، وصوم المحرم **وآكده عاشوراء وهو كفارة سنة**، وعشر ذي الحجة **وآكده يوم عرفة وهو كفارة سنتين**.\n- **يكره** إفراد رجب والجمعة والسبت بالصوم، ويكره صوم يوم الشك وهو الثلاثون من شعبان إذا لم يكن غيم أو قتر.\n- **يحرم** صوم العيدين وأيام التشريق.\n- من دخل في تطوع **لم يجب إتمامه**، وفي فرض **يجب** ما لم يقلبه نفلًا.\n\n---\n\n## الاعتكاف\n\n- هو **سنة ويجب بالنذر**.\n\n**شروط صحته ستة:** 1- النية. 2- الإسلام. 3- العقل. 4- التمييز. 5- عدم ما يوجب الغسل. 6- كونه بمسجد. **ويزاد** في حق من تلزمه الجماعة: أن يكون المسجد مما تقام فيه.\n\n- من المسجد: ما زيد فيه، وسطحه، ورحبته المحوطة، ومنارته التي هي أو بابها فيه.\n- من عيَّن الاعتكاف بمسجد غير الثلاثة **لم يتعين**.\n\n**مبطلاته:** 1- الخروج من المسجد لغير عذر. 2- نية الخروج ولو لم يخرج. 3- الوطء في الفرج. 4- الإنزال بالمباشرة دون الفرج. 5- الردة. 6- السكر.\n\n- **لا يبطل** إن خرج لبول أو غائط أو طهارة واجبة أو لإزالة نجاسة أو لجمعة تلزمه، ولا إن خرج لإتيان مأكل ومشرب لعدم خادم، وله المشي على عادته.\n- وجب استئناف النذر المتتابع غير المقيد بزمن ولا كفارة، وإن كان مقيدًا بزمن معين استأنفه **وعليه كفارة يمين**.\n- ينبغي لمن قصد المسجد أن ينوي الاعتكاف مدة لبثه فيه لا سيما إن كان صائمًا.\n\n---\n\n## زكاة الفطر\n\n- **تجب على كل مسلم يجد ما يفضل عن قوته وقوت عياله في يوم العيد وليلته**، بعد ما يحتاجه من مسكن وخادم ودابة وثياب بذلة وكتب علم.\n- إن لم يجد ما يخرجه عن الجميع بدأ: **بنفسه، ثم زوجته، ثم رقيقه، ثم أمه، ثم أبيه، ثم أولاده، ثم الأقرب من أهل الميراث**.\n- يخرجها عن نفسه وعمن يمونه من المسلمين، وتجب على من تبرع بمؤنة شخص في رمضان. **ولا تجب على من استأجر أجيرًا بطعامه.**\n- **يسن** إخراجها عن الجنين.\n- **تجزئ قبل العيد بيومين**، **وتجب بأول ليلة العيد** فمن مات أو أعسر قبل الغروب فلا زكاة عليه.\n- **الأفضل إخراجها يوم العيد قبل الصلاة، وتكره بعدها، ويحرم تأخيرها عن يوم العيد مع القدرة ويقضيها.**\n- **الواجب عن كل شخص صاع** من تمر أو زبيب أو بر أو شعير أو أقط، ويجزئ دقيق البر والشعير إذا كان وزن الحب، ومع عدم ذلك ما يقوم مقامه من حب يقتات كذرة ودخن وباقلاء.\n- **يجوز أن تعطي الجماعة فطرتهم لواحد، وأن يعطي الواحد فطرته لجماعة.**\n- **لا يجزئ إخراج القيمة مطلقًا**، **ويحرم شراء زكاته وصدقته** ولو من غير من أخذها.\n\n---\n\n## كتاب الحج والعمرة\n\n- **الحج واجب مع العمرة في العمر مرة.**\n\n**شروط الوجوب خمسة:** الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. **وتزيد المرأة سادسًا:** أن تجد زوجًا أو محرمًا مكلفًا تقدر على أجرته وعلى الزاد والراحلة لها وله.\n- إن حجت بلا محرم **حرم وأجزأها**.\n- يصح الحج والعمرة من الصغير والرقيق **ولا يجزئان عن حجة الإسلام وعمرته**. فإن بلغ أو عتق قبل الوقوف أو بعده إن عاد فوقف في وقته **أجزأه**.\n- **الاستطاعة:** ملك زاد وراحلة تصلح لمثله أو ملك ما يقدر به على تحصيل ذلك، بشرط كونه فاضلًا عما يحتاجه من كتب ومسكن وخادم، وفاضلًا عن مؤنته ومؤنة عياله **على الدوام**.\n- من كملت له الشروط **لزمه السعي فورًا** إن كان في الطريق أمن.\n- من عجز لعذر ككبر أو مرض لا يرجى برؤه **لزمه أن يقيم نائبًا حرًّا ولو امرأة** يحج ويعتمر عنه **من بلده**، ما لم يزل العذر قبل إحرام نائبه.\n- **لا يصح ممن لم يحج عن نفسه أن يحج عن غيره.**\n- لو مات قبل أن يستنيب **وجب أن يدفع من تركته لمن يحج ويعتمر عنه**.\n\n### الإحرام والمواقيت\n\n- **الإحرام واجب من الميقات**، ومن كان منزله دون الميقات فميقاته منزله.\n- لا ينعقد الإحرام مع الجنون أو الإغماء أو السكر.\n- إذا انعقد **لم يبطل إلا بالردة**، لكن **يفسد بالوطء في الفرج في التحلل الأول** ولا يبطل بل يلزمه إتمامه والقضاء.\n\n### أنواع النسك\n\n- **التمتع** (وهو أفضل): أن يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج.\n- **الإفراد:** أن يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة.\n- **القران:** أن يحرم بالعمرة ثم يدخل الحج عليها **قبل الشروع في طوافها**، فإن أحرم بالحج ثم بها لم يصح.\n- من أحرم وأطلق صح وصرفه لما شاء وما عمل قبل فلغو.\n- **السنة لمن أراد نسكًا أن يعينه وأن يشترط** فيقول: «اللهم إني أريد النسك الفلاني فيسره لي وتقبله مني، وإن حبسني حابس فمحلي حيث حبستني».\n\n### محظورات الإحرام (سبعة)\n\n1. تعمد لبس المخيط على الرجل حتى الخفين.\n2. تعمد تغطية الرأس من الرجل ولو بطين أو استظلال بمحمل.\n3. قصد شم الطيب ومس ما يعلق واستعماله في أكل أو شرب بحيث يظهر طعمه أو ريحه.\n4. إزالة الشعر من البدن ولو من الأنف، وتقليم الأظافر.\n5. قتل صيد البر الوحشي المأكول والدلالة عليه والإعانة على قتله وإفساد بيضه، وقتل الجراد والقمل.\n6. عقد النكاح **ولا يصح**.\n7. الوطء في الفرج ودواعيه والمباشرة دون الفرج والاستمناء.\n\n- ومن المحظورات **تغطية الوجه من الأنثى**، لكن يجوز أن تسدل على وجهها لحاجة.\n- من لبس أو تطيب أو غطى رأسه **ناسيًا أو جاهلًا أو مكرهًا فلا شيء عليه**، ومتى زال عذره أزاله في الحال وإلا فدى.\n- لا بأس بقتل البراغيث، بل يسن قتل كل مؤذٍ مطلقًا.\n\n### الفدية\n\n- في جميع المحظورات الفدية **إلا قتل القمل وعقد النكاح**. وفي البيض والجراد **قيمته مكانه**. وفي **الشعرة أو الظفر: إطعام مسكين**، وفي اثنتين: إطعام اثنين.\n- **الضرورات تبيح المحظورات ويفدي.**\n\n**قسم التخيير:** فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين، والإمناء بنظرة، والمباشرة بغير إنزال — **يخير بين: ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين لكل مسكين مد بر أو نصف صاع من غيره**. ومن التخيير **جزاء الصيد**.\n\n**قسم الترتيب:** دم المتعة والقران، وترك الواجب، والإحصار، والوطء ونحوه: **دم، فإن عدمه أو ثمنه صام ثلاثة أيام في الحج** (والأفضل كون آخرها يوم عرفة) **وسبعة إذا رجع إلى أهله**.\n\n- **على المحصر دم**، فإن لم يجد **صام عشرة أيام ثم حل**.\n- على من وطئ في الحج قبل التحلل الأول أو أنزل منيًّا بمباشرة أو استمناء أو تقبيل أو لمس لشهوة أو تكرار نظر: **بدنة**، فإن لم يجدها صام عشرة أيام: ثلاثة في الحج وسبعة إذا رجع.\n- **في العمرة إذا أفسدها قبل تمام السعي: شاة.**\n\n### التحلل\n\n- **التحلل الأول:** يحصل **باثنين من: الرمي والحلق والطواف**، ويحل له كل شيء **إلا النساء**.\n- **التحلل الثاني:** يحصل بما بقي مع السعي إن لم يكن سعى قبل.\n\n### جزاء الصيد\n\n- النعامة: **بدنة**. حمار الوحش وبقره: **بقرة**. الضبع: **كبش**. الغزال: **شاة**. الوبر والضب: **جدي له نصف سنة**. اليربوع: **جفرة لها أربعة أشهر**. الأرنب: **عناق دون الجفرة**. الحمام (وهو كل ما عبَّ الماء وهدر كالقطا): **شاة**.\n- ما لا مثل له كالأوز والحبارى والحجل والكركي: **ففيه قيمته مكانه**.\n- **يحرم صيد حرم مكة** وحكمه حكم صيد الإحرام.\n- **يحرم قطع شجره وحشيشه** والمحل والمحرم سواء، فتضمن الشجرة الصغيرة عرفًا **بشاة** وما فوقها **ببقرة**، ويضمن الحشيش والورق بقيمته.\n- تجزئ عن البدنة بقرة وعكسه، ويجزئ عن سبع شياه بدنة أو بقرة.\n- **الدم الواجب:** ما يجزئ في الأضحية: جذع ضأن أو ثني معز أو سبع بدنة أو بقرة.\n\n### أركان الحج وواجباته\n\n**الأركان أربعة:**\n1. **الإحرام** وهو مجرد النية، فمن تركه لم ينعقد حجه.\n2. **الوقوف بعرفة.**\n3. **طواف الإفاضة.**\n4. **السعي بين الصفا والمروة.**\n\n**الواجبات سبعة:**\n1. الإحرام من الميقات.\n2. الوقوف إلى الغروب لمن وقف نهارًا.\n3. المبيت ليلة النحر بمزدلفة إلى بعد نصف الليل.\n4. المبيت بمنى في ليالي التشريق.\n5. رمي الجمار مرتبًا.\n6. الحلق أو التقصير.\n7. طواف الوداع.\n\n**المستحبات:** المبيت بمنى ليلة عرفة، وطواف القدوم، والرمل في الثلاثة الأشواط الأول منه، والاضطباع فيه، وتجرد الرجل من المخيط عند الإحرام ولبس إزار ورداء أبيضين نظيفين، والتلبية من حين الإحرام إلى أول الرمي.\n\n- **من ترك ركنًا لم يتم حجه إلا به، ومن ترك واجبًا فعليه دم وحجه صحيح، ومن ترك مسنونًا فلا شيء عليه.**\n\n**أركان العمرة ثلاثة:** الإحرام، والطواف، والسعي.\n**واجباتها شيئان:** الإحرام بها من الحل، والحلق أو التقصير.\n\n### الوقوف بعرفة وطواف الإفاضة\n\n- **وقته: من طلوع فجر يوم عرفة إلى طلوع فجر يوم النحر**، فمن حصل فيه بعرفة لحظة واحدة وهو أهل ولو مارًّا أجزأه.\n- من مر بعرفة **نائمًا أو حائضًا أو جاهلًا أنها عرفة صح حجه**، **لا** إن كان سكرانًا أو مجنونًا أو مغمى عليه.\n- لو وقف الناس كلهم أو كلهم إلا قليلًا في اليوم الثامن أو العاشر خطأً **أجزأهم**.\n- **وقت طواف الإفاضة: من نصف ليلة النحر لمن وقف بعرفة، ولا حد لآخره.**\n\n### الطواف والسعي\n\n**شروط صحة الطواف أحد عشر:** النية، والإسلام، والعقل، ودخول وقته، وستر العورة، واجتناب النجاسة، والطهارة من الحدث، وتكميل السبع، وجعل البيت عن يساره، وكونه ماشيًا مع القدرة، والموالاة.\n\n- يستأنف الطواف **لحدث فيه** وكذا لقطع طويل، وإن كان يسيرًا أو أقيمت الصلاة أو حضرت جنازة **صلى وبنى من الحجر الأسود**.\n- **سنن الطواف:** استلام الركن اليماني بيده اليمنى، وكذا الحجر الأسود وتقبيله، والدعاء والذكر، والدنو من البيت، والركعتان بعده.\n\n**شروط صحة السعي ثمانية:** النية، والإسلام، والعقل، والموالاة، والمشي مع القدرة، وكونه بعد طواف ولو مسنونًا كطواف القدوم، وتكميل السبع، واستيعاب ما بين الصفا والمروة.\n- **إن بدأ بالمروة لم يعتد بذلك الشوط.**\n- **سنن السعي:** الطهارة، وستر العورة، والموالاة بينه وبين الطواف.\n\n### متفرقات\n\n- يسن الشرب من ماء زمزم لما أحب ورشه على بدنه وثوبه، وقول: «بسم الله، اللهم اجعله لنا علمًا نافعًا ورزقًا واسعًا وريًّا وشبعًا وشفاء من كل داء...».\n- تسن زيارة قبر النبي ﷺ وقبري صاحبيه.\n- **الصلاة في مسجده ﷺ بألف صلاة، وفي المسجد الحرام بمائة ألف، وفي المسجد الأقصى بخمسمائة.**\n- من طلع عليه فجر يوم النحر ولم يقف بعرفة: **فاته الحج، وانقلب إحرامه إلى عمرة** ولا تجزئ عن عمرة الإسلام فيتحلل بها، **وعليه دم والقضاء في العام القابل**؛ لكن لو صُد عن الوقوف فتحلل قبل فواته فلا قضاء.\n- من حُصر عن البيت ولو بعد الوقوف ذبح هديًا بنية التحلل، فإن لم يجد **صام عشرة أيام** وقد حل. ومن حصر عن طواف الإفاضة وقد رمى وحلق **لم يتحلل حتى يطوف**.\n- **من اشترط** في ابتداء إحرامه كان له أن يتحلل متى شاء **من غير شيء ولا قضاء عليه**.\n\n---\n\n## الأضحية\n\n- هي **سنة مؤكدة**، وتجب بالنذر وبقوله: «هذه أضحية» أو «لله».\n- **الأفضل: الإبل، فالبقر، فالغنم**، ولا تجزئ من غير هذه الثلاثة.\n- **تجزئ الشاة عن الواحد وعن أهل بيته وعياله، وتجزئ البدنة والبقرة عن سبعة.**\n- **أقل السن:** من الضأن ما له **نصف سنة**، ومن المعز ما له **سنة**، ومن البقر والجاموس ما له **سنتان**، ومن الإبل ما له **خمس سنين**.\n- **لا تجزئ:** بيِّنة المرض، ولا بيِّنة العور (بأن انخسفت عينها)، ولا قائمة العينين مع ذهاب أبصارهما، ولا العجفاء (الهزيلة التي لا مخ فيها)، ولا العرجاء التي لا تطيق مشيًا مع صحيحة، ولا الهتماء (التي ذهبت ثناياها من أصلها)، ولا العصماء (ما انكسر غلاف قرنها).\n- **وتجزئ:** الجماء، والبتراء، والخصي، والحامل، وما خلق بلا أذن، أو ذهب نصف أليته أو أذنه.\n- يسن **نحر الإبل قائمة معقولة يدها اليسرى**، و**ذبح البقر والغنم على جنبها الأيسر موجهة إلى القبلة**، ويسمي حين يحرك يده ويكبر ويقول: «اللهم هذا منك ولك».\n- **وقت الذبح:** من بعد أسبق صلاة عيد بالبلد أو قدرها لمن لم يصلِّ، **ويستمر نهارًا وليلًا إلى آخر ثاني أيام التشريق**. وإن فات الوقت سقط التطوع وقُضي الواجب.\n- يسن الأكل من هدي التطوع وأضحيته ولو واجبة، ويجوز الأكل من دم المتعة والقران.\n- **الواجب:** التصدق بأقل ما يقع عليه اسم اللحم، ويعتبر **تمليك الفقير** فلا يكفي إطعامه. **والسنة:** أن يأكل الثلث ويهدي الثلث ويتصدق بالثلث. **ويحرم بيع شيء منها حتى من شعرها وجلدها**، ولا يعطى الجازر بأجرته منها شيئًا وله إعطاؤه صدقة أو هدية.\n- إذا دخل العشر **حرم على من يضحي أو يضحى عنه أخذ شيء من شعره أو ظفره إلى الذبح**، ويسن لهما الحلق بعده.\n\n---\n\n## العقيقة\n\n- هي **سنة في حق الأب ولو معسرًا**.\n- **عن الغلام شاتان، وعن الجارية شاة**، ولا تجزئ بدنة وبقرة إلا كاملة.\n- **السنة ذبحها في سابع يوم الولادة**، فإن فات ففي أربع عشرة، فإن فات ففي إحدى وعشرين، ولا تعتبر الأسابيع بعد ذلك.\n- **يكره لطخ المولود من دمها.**\n- يسن **الأذان في أذن المولود اليمنى حين يولد والإقامة في اليسرى**.\n- يسن أن **يحلق رأس الغلام في اليوم السابع ويتصدق بوزنه فضة ويسمى فيه**.\n- **أحب الأسماء عبد الله وعبد الرحمن**، **وتحرم** التسمية بعبد غير الله كعبد النبي وعبد المسيح، **وتكره** بحرب ويسار ومبارك ومفلح وخير وسرور. **ولا بأس بأسماء الملائكة والأنبياء.**\n- إن اتفق وقت عقيقة وأضحية **أجزأت إحداهما عن الأخرى**.\n\n\n# إضافات من أصل \"دليل الطالب لنيل المطالب\" (ما أهمله المختصر ويُسأل عنه الإمام)\n\nهذه المسائل من متن الشيخ مرعي الكرمي نفسه، وليست في \"مفيد الصاحب\". تُراجع على نسختك من الكتاب عند وصولها.\n\n## باب الاستنجاء وآداب قضاء الحاجة\n- **يسن**: عند الدخول تقديم رجله اليسرى، وعند الخروج اليمنى، وقول \"بسم الله أعوذ بالله من الخبث والخبائث\" عند الدخول، و\"غفرانك\" عند الخروج، والاعتماد على رجله اليسرى، والبعد والاستتار في الفضاء.\n- **يكره**: دخوله بشيء فيه ذكر الله، ورفع ثوبه قبل دنوه من الأرض، والكلام، والبول في شق وفي إناء لغير حاجة، واستقبال الشمس والقمر، واستقبال القبلة واستدبارها في البنيان.\n- **يحرم**: استقبال القبلة واستدبارها في الفضاء، والبول في طريق وظل نافع وتحت شجرة مثمرة.\n- **الاستجمار**: يشترط ثلاث مسحات منقية بحجر ونحوه، ولا يجزئ بروث وعظم وطعام ومحترم. ويجزئ الاستجمار مع وجود الماء، والجمع بينهما أفضل.\n\n## سنن الوضوء\nالسواك، وغسل الكفين ثلاثاً، والبداءة بالمضمضة والاستنشاق قبل الوجه، والمبالغة فيهما لغير الصائم، وتخليل اللحية الكثيفة والأصابع، والتيامن، وأخذ ماء جديد للأذنين، والغسلة الثانية والثالثة، والدعاء بعده: \"أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمداً عبده ورسوله\".\n- **يكره**: الإسراف في الماء، والزيادة على الثلاث.\n\n## باب صفة الصلاة (من الدليل)\n- يقول \"الله أكبر\" رافعاً يديه حذو منكبيه، ثم يقبض كوعه اليسرى بيمينه ويجعلهما تحت سرته، وينظر إلى موضع سجوده، ثم يستفتح: \"سبحانك اللهم وبحمدك وتبارك اسمك وتعالى جدك ولا إله غيرك\"، ثم يستعيذ ثم يبسمل سراً، ثم يقرأ الفاتحة ثم سورة، تكون في الفجر من طوال المفصل، وفي المغرب من قصاره، وفي الباقي من أوساطه.\n- **المفصل**: أوله \"ق\"، طواله إلى \"عم\"، أوساطه إلى \"الضحى\"، قصاره إلى آخر القرآن.\n- يجهر الإمام في الفجر والأوليين من المغرب والعشاء وفي الجمعة والعيدين والكسوف والاستسقاء، ويسر في الباقي.\n- ثم يركع مكبراً واضعاً يديه على ركبتيه مفرجتي الأصابع، ويمد ظهره مستوياً، ويقول \"سبحان ربي العظيم\" ثلاثاً (وهو أدنى الكمال، والواجب مرة)، ثم يرفع قائلاً \"سمع الله لمن حمده\" فإذا استوى قال \"ربنا ولك الحمد ملء السماء وملء الأرض وملء ما شئت من شيء بعد\"، ثم يخر ساجداً مكبراً على سبعة أعضاء: الجبهة مع الأنف، واليدين، والركبتين، وأطراف القدمين، ويجافي عضديه عن جنبيه وبطنه عن فخذيه، ويقول \"سبحان ربي الأعلى\" ثلاثاً، ثم يجلس مفترشاً قائلاً \"رب اغفر لي\" ثلاثاً.\n- **الافتراش**: أن يفرش رجله اليسرى ويجلس عليها وينصب اليمنى. **التورك**: أن يفرش رجله اليسرى ويخرجها من تحت اليمنى ويجعل إليتيه على الأرض، ويكون في التشهد الأخير من كل صلاة فيها تشهدان.\n- **جلسة الاستراحة**: مستحبة عند القيام من السجود إلى الركعة الثانية والرابعة (على رواية).\n- **التشهد الأول**: \"التحيات لله والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله وأشهد أن محمداً عبده ورسوله\". ثم في الأخير يصلي على النبي ﷺ بالصلاة الإبراهيمية ويتعوذ من أربع: عذاب جهنم، وعذاب القبر، وفتنة المحيا والممات، وفتنة المسيح الدجال، ثم يسلم عن يمينه \"السلام عليكم ورحمة الله\" ثم عن يساره.\n- **يستحب بعد السلام**: الاستغفار ثلاثاً، و\"اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام\"، والتسبيح والتحميد والتكبير ثلاثاً وثلاثين.\n- **ما يكره في الصلاة**: الالتفات بلا حاجة، ورفع بصره إلى السماء، وتغميض عينيه، والإقعاء (أن يفرش قدميه ويجلس على عقبيه)، وافتراش ذراعيه في السجود، والعبث، والتخصر (وضع يده على خاصرته)، وفرقعة الأصابع وتشبيكها، ومدافعة الأخبثين، والصلاة بحضرة طعام تتوق نفسه إليه، واستقبال صورة أو وجه آدمي.\n- **يباح**: قتل الحية والعقرب والقمل، والإشارة باليد، وحمل الصغير، والتنحنح لحاجة، وقراءة أواخر السور وأوساطها.\n- **صلاة التطوع**: آكدها الكسوف، ثم الاستسقاء، ثم التراويح (عشرون ركعة)، ثم الوتر (أقله ركعة وأكثره إحدى عشرة، ووقته بين صلاة العشاء وطلوع الفجر)، ثم الرواتب: عشر: ركعتان قبل الظهر وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر وهما آكدها. ثم صلاة الضحى (أقلها ركعتان وأكثرها ثمان)، وتحية المسجد، وسنة الوضوء.\n- **القنوت**: يسن في الوتر بعد الركوع، ويقنت الإمام في الفرائض عند النازلة.\n- **سجود التلاوة**: سنة للقارئ والمستمع دون السامع، وهو أربع عشرة سجدة، منها سجدتان في الحج، وليس في \"ص\" سجدة تلاوة بل سجدة شكر.\n- **سجود الشكر**: يسن عند تجدد النعم واندفاع النقم.\n\n## باب سجود السهو تفصيلاً\n- **يشرع**: لزيادة، أو نقص، أو شك. **لا يشرع**: للعمد، ولا لترك سنة.\n- من زاد ركعة أو ركوعاً أو سجوداً سهواً سجد للسهو، ومتى ذكر رجع بلا تكبير.\n- من ترك ركناً فذكره قبل الشروع في قراءة الركعة التالية رجع فأتى به وبما بعده، وإن ذكره بعد الشروع في قراءة التي بعدها بطلت الركعة التي تركه منها وقامت التي بعدها مقامها.\n- من ترك التشهد الأول ناسياً وذكره قبل أن يستتم قائماً رجع، وإن استتم قائماً كره رجوعه، وإن شرع في القراءة حرم الرجوع، ويسجد للسهو في الجميع.\n- من ترك واجباً سهواً فذكره قبل مفارقة محله أتى به، وبعد مفارقة محله سقط ويسجد.\n- **الشك**: من شك في عدد الركعات بنى على اليقين (الأقل) وأتى بالباقي وسجد للسهو قبل السلام. والإمام يبنى على غالب ظنه عند الشيخ ابن قدامة، والمذهب اليقين.\n- **محل سجود السهو**: قبل السلام كله، إلا إذا سلم عن نقص ركعة فأكثر فيكون بعد السلام، وإذا بنى الإمام على غالب ظنه فبعد السلام، والباقي قبله. وإذا نسيه فبعد السلام قريباً.\n- سجود السهو **واجب** لما يبطل عمده، ولا يجب على المأموم بل يتحمله الإمام عنه.\n\n## باب صلاة الجماعة (الأهم للإمام)\n- **حكمها**: واجبة على الرجال الأحرار القادرين للصلوات الخمس حضراً وسفراً، وليست شرطاً لصحة الصلاة. وتنعقد باثنين، وتصح في البيت، والمسجد أفضل.\n- **الأفضل**: المسجد العتيق، ثم الأبعد، ثم الأكثر جماعة، والأقرب أفضل من الأبعد إن كان الجمع في الأقرب أكثر أو مساوياً... (على تفصيل).\n- **حرمة الصلاة قبل الإمام**: يحرم على المأموم أن يسبق إمامه، ومن ركع أو سجد قبله عمداً وعلماً بطلت صلاته إن لم يرجع، ولا يجوز أن يتقدم على الإمام في الموقف إلا في الكعبة.\n- **إدراك الجماعة**: تُدرك بإدراك ركعة (أي الركوع) على المذهب، وإذا أدرك الإمام راكعاً فكبر تكبيرة الإحرام قائماً ثم ركع أجزأته الركعة ولو لم يقرأ. ومن أدركه في غير الركوع لا تحسب له تلك الركعة، ويكون ما أدركه آخر صلاته وما يقضيه أولها (يجهر ويقنت ويستفتح فيما يقضيه). ولا يستفتح إذا أدرك الإمام في غير القيام.\n- **ما يتحمله الإمام عن المأموم**: قراءة الفاتحة، وسجود السهو، والسترة، ودعاء القنوت، والتشهد الأول إذا سُبق بركعة، والسورة، والجهر، وسجود التلاوة إذا لم يسجد الإمام.\n- **قراءة المأموم**: يستحب له قراءة الفاتحة في سكتات الإمام وفيما لا يجهر فيه، ولا يقرأ في الجهرية إذا سمع الإمام.\n- **مسائل القدوة**: تصح قدوة المتنفل بالمفترض وعكسه، والمؤدي بالقاضي وعكسه، ولا تصح قدوة من يصلي الظهر بمن يصلي العصر ولا العكس (اختلاف الفرضين لا يصح على المذهب).\n- **المسبوق**: إذا سلم الإمام لا يقوم المسبوق قبل تسليمة الإمام الثانية. وإذا سها الإمام فيما لم يدركه المسبوق سجد معه.\n- **من تصح إمامته ومن لا تصح**:\n  - **الأولى بالإمامة**: الأقرأ العالم فقه صلاته، ثم الأفقه، ثم الأسن، ثم الأشرف (القرشي)، ثم الأقدم هجرة، ثم الأتقى، ثم من قرع. وصاحب البيت وإمام المسجد أحق من غيرهما ولو كان غيرهما أفضل، إلا من ذي سلطان.\n  - **لا تصح إمامة**: الفاسق (إلا في جمعة وعيد تعذرت خلف غيره)، والمرأة والخنثى بالرجال، والأمي (من لا يحسن الفاتحة أو يخل بحرف أو ترتيب) إلا بمثله، والعاجز عن ركن أو شرط إلا بمثله (إلا إمام الحي المرجو زوال علته يصلي جالساً ويصلون خلفه جلوساً)، والألثغ (يبدل حرفاً بحرف) إلا بمثله، والأخرس، والكافر، والمجنون، ومن لا يقرأ الفاتحة.\n  - **تصح إمامة**: الصبي المميز بمثله في الفرض وبالبالغ في النفل، والأعمى، والعبد، وولد الزنا، والأقلف، والأقطع، ومن به سلس البول بمثله، والمتيمم بالمتوضئ.\n  - **تكره إمامة**: اللحان الذي لا يحيل المعنى، والفأفاء (يكرر الفاء) والتمتام، ومن يكرهه أكثر الجماعة بحق، والأقلف، ومن يصلي بقوم أكثرهم يكرهه.\n- **موقف المأموم**: يقف المأموم الواحد عن يمين الإمام، والاثنان فأكثر خلفه، والمرأة خلف الرجل، ولو وقف المأموم الواحد عن يسار الإمام مع خلو يمينه لم تصح، ومن صلى وحده خلف الصف ركعة كاملة لم تصح صلاته. وتصح إذا وقف عن يمينه أو عن جانبيه.\n- **الفصل بين الإمام والمأموم**: تصح القدوة إذا رأى الإمام أو من وراءه ولو في غير المسجد إذا سمع التكبير، وفي المسجد تصح ولو لم يره إذا سمع التكبير.\n- **أعذار ترك الجماعة والجمعة**: المرض، ومدافعة الأخبثين، وحضور طعام يشتهيه، والخوف على نفسه أو ماله أو أهله، والمطر والوحل والريح الباردة الشديدة في الليلة المظلمة، وأكل البصل والثوم حتى يذهب ريحه، وملازمة غريم معسر، وتمريض قريب.\n- **إذا أحدث الإمام أو ذكر أنه محدث**: استخلف من يتم بهم، ويجوز أن يتموا فرادى.\n- **يسن للإمام**: التخفيف مع الإتمام، وأن يطيل الركعة الأولى أكثر من الثانية، وأن ينتظر الداخل في الركوع ما لم يشق على المأمومين، وأن يستقبل المأمومين بوجهه بعد السلام، ولا يطيل الجلوس في مكانه مستقبلاً القبلة.\n- **يحرم على الإمام**: أن يصلي في موضع أعلى من المأمومين (أعلى من ذراع) إلا لحاجة كتعليم، ويكره أن يصلي في طاق المحراب بحيث يخفى على المأمومين.\n\n## باب صلاة أهل الأعذار\n- **المريض**: يصلي الفرض قائماً، فإن لم يستطع فقاعداً متربعاً، فإن لم يستطع فعلى جنبه الأيمن، فإن لم يستطع فمستلقياً ورجلاه إلى القبلة، ويومئ بالركوع والسجود ويجعل السجود أخفض، فإن عجز أومأ بعينه وينوي، ولا تسقط الصلاة ما دام العقل ثابتاً.\n- **القصر**: من سافر سفراً مباحاً يبلغ ستة عشر فرسخاً (أربعة برد، نحو ثمانين كيلو متراً) فله قصر الرباعية إلى ركعتين، إذا فارق بيوت قريته. والقصر أفضل من الإتمام، ولا يقصر إلا في السفر المباح (لا سفر المعصية).\n- **الجمع**: يباح للمسافر، والمريض الذي يلحقه مشقة، وللمرضع لمشقة كثرة النجاسة، وللمستحاضة، ولمن له عذر يبيح ترك الجمعة والجماعة، ولمطر يبل الثياب ووحل وريح شديدة باردة (والجمع بين المغرب والعشاء لأجل المطر خاصة). والأفضل فعل الأرفق به من التقديم والتأخير، والتأخير أفضل عند عدم الفرق.\n- **صلاة الخوف**: تصح على كل صفة صحت عن النبي ﷺ، وأشهرها صفة ذات الرقاع: يقسمهم طائفتين، يصلي بالأولى ركعة ثم تتم لنفسها وتنصرف، وتأتي الثانية فيصلي بها الركعة الثانية وينتظرها حتى تتم وتسلم بسلامه. وإذا اشتد الخوف صلوا رجالاً وركباناً إلى القبلة وغيرها.\n\n## باب صلاة الجمعة (إضافات)\n- **من شروط وجوبها**: الاستيطان، فلا تجب على المسافر ولا من كان خارج البلد بأكثر من فرسخ.\n- **يشترط للخطبة**: الوقت، والنية، وحضور العدد، وأن تكون في الحضر، وأن يتولاهما من يتولى الصلاة (على الأصح لا يشترط)، ورفع الصوت بحيث يسمع العدد المعتبر.\n- **سنن الخطبة**: أن يخطب على منبر أو موضع عال، وأن يسلم على المأمومين إذا أقبل عليهم، وأن يجلس حتى يفرغ المؤذن، وأن يجلس بين الخطبتين، وأن يخطب قائماً، ويعتمد على سيف أو عصا، ويقصد تلقاء وجهه، ويقصر الخطبة والثانية أقصر، ويرفع صوته، ويدعو للمسلمين.\n- **يقرأ في فجر الجمعة**: السجدة و\"هل أتى\"، وفي الجمعة: الجمعة والمنافقون، أو سبح والغاشية.\n- **الكلام والإمام يخطب**: يحرم على من يسمعه، ويجوز للإمام والمخاطب له.\n- **تحية المسجد والإمام يخطب**: يصليها ركعتين خفيفتين.\n- **من أدرك مع الإمام ركعة**: أتمها جمعة، ومن أدرك أقل من ركعة أتمها ظهراً.\n- **السنة بعد الجمعة**: أقلها ركعتان وأكثرها ست، ولا سنة راتبة قبلها.\n- **الساعة التي يستجاب فيها الدعاء**: أرجاها آخر ساعة بعد العصر.\n- **يستحب يوم الجمعة**: الغسل، والتطيب، والتبكير، والمشي، وقراءة الكهف، وكثرة الصلاة على النبي ﷺ، والدعاء.\n\n## باب صلاة العيدين\n- **حكمها**: فرض كفاية، وشروطها كالجمعة إلا الخطبتين فهما سنة بعدها.\n- **وقتها**: من ارتفاع الشمس قيد رمح إلى الزوال، فإن لم يعلموا بالعيد إلا بعد الزوال صلوا من الغد قضاء.\n- **صفتها**: ركعتان قبل الخطبة، يكبر في الأولى بعد الاستفتاح ست تكبيرات زوائد (غير تكبيرة الإحرام)، وفي الثانية خمساً غير تكبيرة القيام، ويرفع يديه مع كل تكبيرة ويقول بينها: \"الله أكبر كبيراً والحمد لله كثيراً وسبحان الله بكرة وأصيلاً وصلى الله على محمد النبي وآله وسلم تسليماً\"، ويقرأ في الأولى بسبح وفي الثانية بالغاشية، أو ق واقتربت.\n- **يسن**: تقديم الأضحى وتأخير الفطر، والأكل قبل الخروج في الفطر (تمرات وتراً) وتأخيره في الأضحى حتى يصلي، والغسل والتطيب ولبس أحسن الثياب، والخروج ماشياً، والرجوع من طريق آخر، وأن تكون في الصحراء إلا بمكة ففي المسجد الحرام.\n- **التكبير المطلق**: من غروب الشمس ليلة العيد إلى فراغ الخطبة في الفطر، وفي الأضحى من أول ذي الحجة إلى آخر أيام التشريق. **التكبير المقيد**: عقب المكتوبات في جماعة، من فجر يوم عرفة إلى عصر آخر أيام التشريق للمحل، وللمحرم من ظهر يوم النحر. صيغته: \"الله أكبر الله أكبر لا إله إلا الله والله أكبر الله أكبر ولله الحمد\".\n- يكره التنفل قبلها وبعدها في موضعها قبل مفارقته.\n\n## باب صلاة الكسوف\n- **حكمها**: سنة مؤكدة حضراً وسفراً. **وقتها**: من ابتداء الكسوف إلى التجلي.\n- **صفتها**: ركعتان، في كل ركعة قيامان وقراءتان وركوعان وسجودان، يقرأ في الأول الفاتحة وسورة طويلة كالبقرة، ثم يركع فيطيل، ثم يرفع فيقرأ الفاتحة وسورة دون الأولى، ثم يركع دون الأول، ثم يسجد سجدتين طويلتين. ويجهر بالقراءة. ولا خطبة لها.\n- إذا تجلى الكسوف وهو في الصلاة أتمها خفيفة، وإن غابت الشمس كاسفة أو طلعت وهو كاسف لم يصل.\n\n## باب صلاة الاستسقاء\n- **حكمها**: سنة مؤكدة عند القحط. **صفتها**: كصلاة العيد في التكبيرات والقراءة، ثم يخطب خطبة واحدة يكثر فيها الاستغفار وقراءة الآيات التي فيها الأمر به، ويرفع يديه وظهورهما نحو السماء، ثم يحول رداءه فيجعل يمينه على يساره ويقلبه، ويحول الناس أرديتهم.\n- **يسن قبلها**: أن يعظ الإمام الناس ويأمرهم بالتوبة والخروج من المظالم وترك التشاحن والصيام ثلاثة أيام والصدقة، ويخرجون متبذلين متواضعين متخشعين، ويخرج معهم الشيوخ والصبيان.\n- إذا كثر المطر وتضرروا سألوا الله رفعه: \"اللهم حوالينا ولا علينا، اللهم على الظراب والآكام وبطون الأودية ومنابت الشجر\".\n\n## كتاب الجنائز (تفاصيل)\n- **يسن**: الاستعداد للموت، وعيادة المريض، وتذكيره التوبة والوصية، وتلقين المحتضر \"لا إله إلا الله\" مرة، ولا يزيد على ثلاث إلا أن يتكلم بعدها، وقراءة يس عنده، وتوجيهه إلى القبلة على جنبه الأيمن.\n- **إذا مات**: يسن تغميض عينيه، وشد لحييه، وتليين مفاصله، وخلع ثيابه، وستره بثوب، ووضع حديدة على بطنه، ووضعه على سرير غسله متوجهاً إلى القبلة، والإسراع في تجهيزه، وإنفاذ وصيته، وقضاء دينه.\n- **الغسل**: فرض كفاية. أولى الناس بغسل الرجل وصيه، ثم أبوه، ثم جده، ثم الأقرب فالأقرب من عصباته. وبالمرأة وصيتها ثم أمها ثم جدتها ثم الأقرب. ولكل من الزوجين غسل صاحبه. ويغسل الرجل والمرأة من له دون سبع سنين.\n- **صفة الغسل**: يستر عورته ويجرده، ويرفع رأسه إلى قرب الجلوس ويعصر بطنه برفق، ثم يلف على يده خرقة فينجيه، ثم يوضئه، ثم يغسله بماء وسدر: رأسه ولحيته ثم شقه الأيمن ثم الأيسر، ثلاثاً، ويجعل في الأخيرة كافوراً، وإن لم ينق زاد حتى ينقى وتراً. ويسرح شعره، ولا يجز، وتضفر شعر المرأة ثلاثة قرون ويسدل من ورائها. ويقلم أظفاره ويأخذ شاربه ولا يحلق رأسه ولا يختن.\n- **من يغسل ومن لا يغسل**: الشهيد في المعركة لا يغسل ولا يصلى عليه ويدفن في ثيابه بدمه، والسقط إذا بلغ أربعة أشهر غسل وصلي عليه. والمحرم يغسل بماء وسدر ولا يقرب طيباً ولا يغطى رأسه ولا يلبس مخيطاً. وإذا تعذر الغسل يمم.\n- **الكفن**: يجب من ماله مقدماً على الدين. يسن للرجل ثلاث لفائف بيض، وللمرأة خمسة أثواب: إزار وخمار وقميص ولفافتان. ويجزئ ثوب يستر جميعه. ويجمر الكفن ثلاثاً ويجعل الحنوط بين اللفائف وعلى مساجده.\n- **الصلاة عليه**: يقف الإمام عند صدر الرجل ووسط المرأة، ويكبر أربعاً، يقرأ بعد الأولى الفاتحة سراً (والتعوذ والبسملة، ولا يستفتح)، وبعد الثانية يصلي على النبي ﷺ كالتشهد، وبعد الثالثة يدعو للميت: \"اللهم اغفر لحينا وميتنا وشاهدنا وغائبنا وصغيرنا وكبيرنا وذكرنا وأنثانا... اللهم اغفر له وارحمه وعافه واعف عنه، وأكرم نزله ووسع مدخله...\"، ثم يكبر الرابعة ويقف قليلاً ثم يسلم تسليمة واحدة عن يمينه. والزيادة على أربع إلى سبع جائزة. ولا تجوز الصلاة عليه في المقبرة إلا على القبر، ويصلى على القبر إلى شهر، وعلى الغائب بالنية إلى شهر. ومن فاتته الصلاة عليه صلى على القبر.\n- **يقول في الصلاة على الطفل**: \"اللهم اجعله ذخراً لوالديه وفرطاً وأجراً وشفيعاً مجاباً، اللهم ثقل به موازينهما وأعظم به أجورهما وألحقه بصالح سلف المؤمنين واجعله في كفالة إبراهيم وقه برحمتك عذاب الجحيم\".\n- **الدفن**: يسن تعميق القبر وتوسيعه، واللحد أفضل من الشق، ويدخل من عند رجل القبر، ويقول الذي يدخله: \"بسم الله وعلى ملة رسول الله\"، ويوضع على جنبه الأيمن مستقبل القبلة، ويحل عقد الكفن، ويرفع القبر عن الأرض قدر شبر مسنماً، ويحثو عليه ثلاث حثيات من تراب، ويرش عليه الماء، ويوضع عليه حصى، ويحرم البناء عليه والكتابة والجلوس عليه والوطء والمشي بالنعال والإسراج.\n- **بعد الدفن**: يستحب الوقوف عنده والدعاء له بالتثبيت، ويكره الجلوس قبل أن توضع الجنازة، ويسن للمشيع القيام حتى توضع.\n- **التعزية**: تسن ثلاثة أيام، ويقول: \"أعظم الله أجرك وأحسن عزاءك وغفر لميتك\"، ويجيب: \"استجاب الله دعاءك ورحمنا وإياك\". ويكره الجلوس لها، وصنع أهل الميت طعاماً للناس، ويسن أن يصنع لأهل الميت طعام.\n- **يحرم**: النياحة، وشق الثوب، ولطم الخد. ويجوز البكاء بلا ندب ولا نياحة.\n- **زيارة القبور**: تسن للرجال، وتكره للنساء (على المذهب)، ويقول: \"السلام عليكم دار قوم مؤمنين وإنا إن شاء الله بكم لاحقون، يرحم الله المستقدمين منا ومنكم والمستأخرين، نسأل الله لنا ولكم العافية\".\n- **ما ينفع الميت**: كل قربة فعلها المسلم وجعل ثوابها للميت نفعته: الدعاء والاستغفار والصدقة والحج والصوم والقراءة.\n\n## كتاب الزكاة (تفاصيل)\n- **الخلطة** في السائمة: خلطة أعيان وخلطة أوصاف تجعل المالين كمال واحد بشروط: اتحاد المراح والمسرح والمحلب والفحل والمرعى.\n- **زكاة الأثمان**: يضم الذهب إلى الفضة في تكميل النصاب، وتضم عروض التجارة إلى كل منهما.\n- **عروض التجارة**: تقوّم عند تمام الحول بالأحظ للفقراء من ذهب أو فضة، ويخرج ربع عشر قيمتها. وشرطها: أن يملكها بفعله بنية التجارة.\n- **الدين**: على مليء تجب زكاته إذا قبضه لما مضى، والدين على معسر أو مماطل يزكيه إذا قبضه لعام واحد على رواية.\n- **زكاة الفطر**: تجب على كل مسلم فضل عنده يوم العيد وليلته صاع عن قوته وقوت عياله وحوائجه الأصلية، عن نفسه وعمن يمونه من المسلمين. تجب بغروب الشمس ليلة الفطر، ويجوز إخراجها قبل العيد بيومين، وتخرج قبل صلاة العيد، ويحرم تأخيرها عن يوم العيد. وهي صاع من بر أو شعير أو تمر أو زبيب أو أقط، والأفضل التمر ثم الزبيب ثم البر ثم الأنفع.\n- **إخراج الزكاة**: يجب فور تمام الحول، ويجوز تعجيلها لحولين، ولا تسقط بموت المالك. ولا يجزئ إخراج القيمة على المذهب.\n- **من لا تدفع إليه الزكاة**: بنو هاشم ومواليهم، والكافر، والغني، ومن تلزمه نفقته (الأصول والفروع والزوجة)، والعبد، ولا يدفعها لزوجها على رواية. ويجزئ دفعها لصنف واحد.\n- **صدقة التطوع**: مستحبة كل وقت، وفي رمضان وأوقات الحاجة أفضل، والسر أفضل، وعلى القريب أفضل.\n\n## كتاب الصيام (تفاصيل)\n- **يجب صوم رمضان**: برؤية الهلال، أو إكمال شعبان ثلاثين، ويصام بشهادة عدل واحد، ولا يفطر إلا بشهادة عدلين. وإن حال دون منظره غيم أو قتر فالمذهب وجوب صيامه احتياطاً (ليلة الشك)، والصحيح عند المحققين عدمه.\n- **النية**: تجب من الليل لكل يوم من رمضان، ويصح النفل بنية من النهار قبل الزوال أو بعده.\n- **من يباح له الفطر**: المريض الذي يضره الصوم، والمسافر سفر قصر، والحائض والنفساء (يحرم عليهما الصوم)، والحامل والمرضع إذا خافتا على أنفسهما (تقضيان فقط) أو على ولديهما (تقضيان وتطعمان عن كل يوم مسكيناً)، والشيخ الكبير والمريض مرضاً لا يرجى برؤه (يطعم عن كل يوم مسكيناً ولا قضاء).\n- **لا يفطر**: من أكل أو شرب ناسياً أو مكرهاً، ومن ذرعه القيء، والاحتلام، والاكتحال، والقطرة في العين على رواية (والمذهب أنها تفطر إن وجد طعمها في حلقه)، وبلع الريق، والمضمضة والاستنشاق بلا مبالغة، والسواك، وذوق الطعام بلا بلع.\n- **الفطر عمداً في رمضان** بأكل أو شرب: يوجب القضاء والإمساك، ولا كفارة إلا في الجماع.\n- **يسن**: تعجيل الفطر، وتأخير السحور، والفطر على رطب فتمر فماء، والدعاء عند الفطر، وكثرة القراءة والذكر والصدقة، وقول \"إني صائم\" لمن شاتمه.\n- **يكره**: جمع ريقه فيبلعه، وذوق الطعام بلا حاجة، ومضغ العلك، والقبلة لمن تحرك شهوته، والمبالغة في المضمضة.\n- **القضاء**: يستحب فوراً ومتتابعاً، ويجب قبل رمضان الآخر، فإن أخره لغير عذر حتى أدركه رمضان آخر لزمه مع القضاء إطعام مسكين عن كل يوم. ومن مات وعليه صوم نذر صام عنه وليه، وإن كان صوم رمضان أطعم عنه.\n- **صوم التطوع**: أفضله يوم ويوم (صوم داود)، ثم صيام ثلاثة أيام من كل شهر والأفضل أيام البيض (13، 14، 15)، والاثنين والخميس، وست من شوال، وشهر المحرم وآكده عاشوراء ثم تاسوعاء، وتسع ذي الحجة وآكدها يوم عرفة لغير الحاج.\n- **يحرم صوم**: يومي العيدين، وأيام التشريق إلا للمتمتع والقارن إذا لم يجدا الهدي.\n- **يكره**: إفراد رجب، وإفراد الجمعة، وإفراد السبت، ويوم الشك، وصوم الدهر.\n- **ليلة القدر**: في العشر الأواخر، وأرجاها ليلة سبع وعشرين، ويدعو فيها: \"اللهم إنك عفو تحب العفو فاعف عني\".\n\n## كتاب الحج (تفاصيل)\n- **المواقيت**: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام ومصر والمغرب، ويلملم لأهل اليمن، وقرن المنازل لأهل نجد، وذات عرق لأهل العراق. وأهل مكة يحرمون بالحج منها وبالعمرة من الحل. ومن مر بميقات فهو ميقاته، ومن لم يمر بميقات أحرم إذا حاذاه.\n- **أشهر الحج**: شوال وذو القعدة وعشر من ذي الحجة.\n- **يسن عند الإحرام**: الغسل، والتنظف، والتطيب في البدن لا الثوب، والتجرد من المخيط ولبس إزار ورداء أبيضين، والإحرام عقب صلاة، وتعيين النسك، والاشتراط: \"وإن حبسني حابس فمحلي حيث حبستني\"، والتلبية: \"لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك، لا شريك لك\".\n- **التلبية**: يسن الإكثار منها ورفع الصوت بها للرجل، وتتأكد إذا علا نشزاً أو هبط وادياً وأدبار الصلوات وإقبال الليل والنهار والتقاء الرفاق، ويقطعها المعتمر إذا شرع في الطواف، والحاج إذا شرع في رمي جمرة العقبة يوم النحر.\n- **دخول مكة**: يسن من أعلاها (ثنية كداء)، ودخول المسجد من باب بني شيبة، والغسل لدخول مكة، وأن يقول عند رؤية البيت: \"اللهم أنت السلام ومنك السلام حينا ربنا بالسلام...\"، ثم يبدأ بطواف القدوم مضطبعاً (يجعل وسط ردائه تحت إبطه الأيمن وطرفيه على كتفه الأيسر)، ويرمل في الثلاثة الأول ويمشي في الأربعة، ويستلم الحجر ويقبله أو يشير إليه ويكبر، ويستلم الركن اليماني ولا يقبله، ويقول بينهما: \"ربنا آتنا في الدنيا حسنة...\".\n- **بعد الطواف**: يصلي ركعتين خلف المقام يقرأ فيهما الكافرون والإخلاص، ثم يستلم الحجر، ثم يسعى: يرقى على الصفا ويقرأ \"إن الصفا والمروة من شعائر الله\" ويكبر ثلاثاً ويدعو، ثم يمشي حتى يصل العلم الأخضر فيسعى سعياً شديداً حتى العلم الآخر ثم يمشي، والذهاب شوط والرجوع شوط، والمرأة لا ترمل ولا تسعى شديداً.\n- **يوم التروية (8)**: يحرم المتمتع بالحج من مكة ضحى، ويخرج إلى منى فيصلي بها الظهر إلى الفجر.\n- **يوم عرفة (9)**: يسير إلى نمرة، ويصلي الظهر والعصر جمع تقديم وقصراً، ثم يقف بعرفة (وكلها موقف إلا بطن عرنة)، ويستحب أن يقف عند الصخرات وجبل الرحمة مستقبل القبلة راكباً، ويكثر من الدعاء والتلبية، وأفضل الدعاء: \"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير\". ووقت الوقوف: من فجر يوم عرفة (وقيل من الزوال) إلى فجر يوم النحر، ومن وقف نهاراً وجب عليه البقاء إلى الغروب، ومن لم يقف حتى طلع فجر النحر فاته الحج ويتحلل بعمرة وعليه القضاء والهدي.\n- **مزدلفة**: يدفع بعد الغروب بسكينة، ويصلي بمزدلفة المغرب والعشاء جمع تأخير، ويبيت بها، ويجوز للضعفة الدفع بعد نصف الليل، ويصلي الفجر في أول وقتها ثم يقف عند المشعر الحرام ويدعو حتى يسفر جداً، ويدفع قبل طلوع الشمس.\n- **يوم النحر (10)**: يرمي جمرة العقبة بسبع حصيات كحصى الخذف، يكبر مع كل حصاة، ويقطع التلبية عند أول حصاة، ووقت الرمي من نصف الليل إلى غروب الشمس، ثم ينحر الهدي، ثم يحلق أو يقصر (والحلق أفضل للرجل، والمرأة تقصر قدر أنملة)، ثم يفيض إلى مكة فيطوف طواف الإفاضة (الزيارة) وهو ركن، ثم يسعى إن كان متمتعاً أو لم يكن سعى بعد طواف القدوم. والترتيب بين هذه الأربعة سنة، فإن قدم بعضها على بعض فلا حرج.\n- **أيام التشريق (11، 12، 13)**: يبيت بمنى، ويرمي الجمرات الثلاث كل يوم بعد الزوال: الأولى (الصغرى) ثم الوسطى ثم العقبة، سبع حصيات لكل جمرة، ويدعو بعد الأولى والوسطى مستقبل القبلة رافعاً يديه، ولا يقف بعد العقبة. ومن تعجل في يومين خرج قبل الغروب، فإن غربت عليه الشمس بمنى لزمه المبيت والرمي من الغد.\n- **طواف الوداع**: واجب على كل من أراد الخروج من مكة، ويسقط عن الحائض والنفساء. ومن خرج قبله رجع إن كان قريباً وإلا فعليه دم.\n- **حكم من ترك واجباً**: عليه دم، ومن ترك ركناً لم يتم حجه حتى يأتي به، ومن ترك سنة فلا شيء عليه.\n- **الإحصار**: من منعه عدو من إتمام نسكه نحر هدياً ثم حلق وحل، ومن منعه مرض أو ذهاب نفقة لم يحل إلا أن يكون اشترط.\n- **الهدي**: أفضله الإبل ثم البقر ثم الغنم، ولا يجزئ إلا الجذع من الضأن (ستة أشهر) والثني من غيره (المعز سنة، والبقر سنتان، والإبل خمس سنين)، والبدنة والبقرة عن سبعة. ولا يجزئ العوراء البين عورها، والعرجاء البين عرجها، والمريضة البين مرضها، والعجفاء التي لا تنقي، ولا العضباء (ما ذهب أكثر أذنها أو قرنها).\n- **الأضحية**: سنة مؤكدة، ووقتها من بعد صلاة العيد إلى آخر يومين من أيام التشريق (ثلاثة أيام)، ويسن أن يأكل ثلثاً ويهدي ثلثاً ويتصدق بثلث، ولا يعطي الجزار أجرته منها، ولا يبيع جلدها. ومن أراد أن يضحي فلا يأخذ من شعره وأظفاره وبشرته شيئاً في العشر حتى يضحي.\n- **العقيقة**: سنة، عن الغلام شاتان متقاربتان، وعن الجارية شاة، تذبح يوم السابع، فإن فات ففي أربعة عشر، فإن فات ففي إحدى وعشرين، ويحلق رأس الغلام ويتصدق بوزنه فضة، ويسمى فيه، ولا تكسر عظامها.\n", "questions": [{"s": "fiqh", "q": "ما الأموال التي لا يشترط فيها حولان الحول؟", "a": "الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما)."}, {"s": "fiqh", "q": "ما هي واجبات الحج؟", "a": "سبعة: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت بمزدلفة ليلة النحر إلى بعد نصف الليل، المبيت بمنى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع."}, {"s": "fiqh", "q": "ما هي أركان الحج؟", "a": "أربعة: الإحرام (وهو النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة."}, {"s": "fiqh", "q": "ما هي سنن الأذان؟", "a": "خمسة: أن يكون المؤذن صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً."}, {"s": "fiqh", "q": "ما شروط المؤذن؟", "a": "ستة: الإسلام، الذكورية، العقل، التمييز، النطق، العدالة."}, {"s": "fiqh", "q": "ما حكم الأذان والإقامة؟", "a": "فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس والجمعة، وسنة للمنفرد والمسافر."}, {"s": "fiqh", "q": "ما هي مفطرات الصائم؟", "a": "اثنا عشر: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ."}, {"s": "fiqh", "q": "اذكر أنواع التحلل في الحج وكيف يحصل.", "a": "التحلل الأول: بفعل اثنين من ثلاثة (رمي، حلق، طواف) ويحل به كل شيء إلا النساء. التحلل الثاني: بفعل الثلاثة، ويحل به كل شيء حتى النساء."}, {"s": "fiqh", "q": "اذكر الفروق بين المسح على الخفين والمسح على الجبيرة.", "a": "الخف: يشترط لبسه على طهارة، مؤقت (يوم وليلة للمقيم وثلاثة للمسافر)، يمسح أكثر أعلاه، في الحدث الأصغر فقط. الجبيرة: لا يشترط لبسها على طهارة، غير مؤقتة حتى البرء، يمسح جميعها، في الأصغر والأكبر، ولا تتجاوز قدر الحاجة."}, {"s": "fiqh", "q": "متى يتم المسافر الصلاة؟", "a": "إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر."}, {"s": "fiqh", "q": "ما الحكم إذا زال العذر عن المفطر وهو في النهار؟", "a": "يلزمه الإمساك بقية اليوم مع القضاء، كمن طهرت من حيضها، أو قدم المسافر مفطراً، أو برئ المريض، أو أسلم الكافر، أو بلغ الصبي."}, {"s": "fiqh", "q": "ماذا يتحمل الإمام عن المأموم؟", "a": "قراءة الفاتحة، سجود السهو، السترة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة والجهر في الجهرية، وسجود التلاوة إذا لم يسجد الإمام."}, {"s": "fiqh", "q": "بيّن حكم الصلاة على الميت، وهل يجزئ لو صلى على الميت امرأة وحدها دون أن يكون معها رجل؟", "a": "فرض كفاية، وتسقط بواحد مكلف ولو امرأة، فيجزئ ذلك."}, {"s": "fiqh", "q": "محمد يملك أربعين رأساً من الغنم السائمة وقد حال عليها الحول، بيّن مقدار الزكاة.", "a": "يجب عليه شاة واحدة، لأن نصاب الغنم أربعون، وفيها شاة إلى مائة وعشرين."}, {"s": "fiqh", "q": "عائشة تملك حلياً يبلغ نصاباً وقد حال عليه الحول، هل يجب عليها إخراج الزكاة؟", "a": "إن كان الحلي معداً للاستعمال المباح أو الإعارة فلا زكاة فيه على المذهب. وإن كان للكراء أو الادخار أو كان محرماً وجبت الزكاة (ربع العشر). نصاب الذهب 85 غراماً والفضة 595 غراماً."}, {"s": "fiqh", "q": "اذكر شروط الوجوب في الصيام.", "a": "أربعة: الإسلام، البلوغ، العقل، القدرة عليه."}, {"s": "fiqh", "q": "بيّن حكم من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة في حقه.", "a": "لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة."}, {"s": "fiqh", "q": "عرّف الاستطاعة في الحج مع بيان الشرط الذي يجب أن يتحقق فيها.", "a": "أن يملك زاداً وراحلة تصلح لمثله، بشرط أن يكون ذلك فاضلاً عن قضاء دينه ونفقته ونفقة عياله وحوائجه الأصلية (مسكن وخادم)، وأن يكون الطريق آمناً."}, {"s": "fiqh", "q": "أفعال العباد لها تعلقان، فما هما؟", "a": "تعلق بمشيئة العبد (الكسب والاختيار)، وتعلق بمشيئة الله تعالى (الخلق والتقدير)، فأفعال العباد خلق لله وكسب من العبد."}, {"s": "fiqh", "q": "يسن رفع اليدين في الصلاة، اذكر ثلاثة مواضع.", "a": "عند تكبيرة الإحرام، وعند الركوع، وعند الرفع منه (وزاد بعضهم: عند القيام من التشهد الأول)."}, {"s": "fiqh", "q": "اذكر ماءً يكره استخدامه في الطهارة.", "a": "الماء المشمس في الأواني، والماء المتغير بما لا يمازجه كالدهن، وماء بئر بمقبرة، والماء المسخن بنجاسة، وماء زمزم للاستنجاء."}, {"s": "fiqh", "q": "ما فروض الوضوء؟", "a": "ستة: غسل الوجه ومنه المضمضة والاستنشاق، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل الرجلين إلى الكعبين، الترتيب، الموالاة."}, {"s": "fiqh", "q": "ما شروط الوضوء؟", "a": "ثمانية: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار."}, {"s": "fiqh", "q": "ما شروط المسح على الخف؟", "a": "سبعة: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما."}, {"s": "fiqh", "q": "هل يجوز للقادر الجلوس في صلاة الفرض؟ ولماذا؟", "a": "لا يجوز، لأن القيام ركن في الفرض على القادر. ويجوز في النافلة وله نصف الأجر."}, {"s": "fiqh", "q": "اذكر أصناف الزكاة.", "a": "ثمانية: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله، ابن السبيل."}, {"s": "fiqh", "q": "اذكر مثالين على معنى أن يكون البائع قادراً على تسليم المبيع.", "a": "لا يصح بيع العبد الآبق، ولا البعير الشارد، ولا الطير في الهواء، ولا السمك في الماء، ولا المغصوب لغير غاصبه، لعدم القدرة على التسليم."}, {"s": "fiqh", "q": "متى يكون الزواج واجباً؟", "a": "يجب على من يخاف الزنا على نفسه. ويُسن لذي شهوة لا يخاف الزنا، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة."}, {"s": "fiqh", "q": "ما شروط تحريم الرضاع؟", "a": "شرطان: أن يكون خمس رضعات، وأن يكون في العامين (السنة الأولى والثانية)."}, {"s": "fiqh", "q": "متى يباح الصيد ومتى يكره؟", "a": "يباح لمن قصد به الانتفاع، ويكره لمن قصده لهواً ولعباً، ويحرم على المحرم وفي الحرم."}, {"s": "fiqh", "q": "ما شروط جواز بيع الربوي إن كان مثلين مكيلين أو موزونين بجنسه؟", "a": "شرطان: المماثلة في القدر، والقبض قبل التفرق. وإذا اختلف الجنس جاز التفاضل ووجب القبض قبل التفرق. وإذا بيع مكيل بموزون جاز التفاضل والتفرق."}, {"s": "fiqh", "q": "ما أركان الصلاة؟", "a": "أربعة عشر: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع منه، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس له، التسليمتان، الترتيب."}, {"s": "fiqh", "q": "ما واجبات الصلاة؟", "a": "ثمانية: التكبير لغير الإحرام، سمع الله لمن حمده للإمام والمنفرد، ربنا ولك الحمد للكل، سبحان ربي العظيم، سبحان ربي الأعلى، رب اغفر لي، التشهد الأول، الجلوس له."}, {"s": "fiqh", "q": "ما الفرق بين الركن والواجب في الصلاة؟", "a": "الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط بالسهو والجهل ويجبر بسجود السهو."}, {"s": "fiqh", "q": "ما أسباب سجود السهو؟", "a": "ثلاثة: الزيادة، النقص، الشك."}, {"s": "fiqh", "q": "ما أوقات النهي؟", "a": "ثلاثة: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى الغروب، عند قيام الشمس حتى تزول."}, {"s": "fiqh", "q": "ما شروط جمع التقديم وجمع التأخير؟", "a": "التقديم أربعة: نية الجمع عند الإحرام بالأولى، عدم التفريق بينهما، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية. التأخير اثنان: نية الجمع عند الإحرام بالأولى، وبقاء العذر إلى دخول وقت الثانية."}, {"s": "fiqh", "q": "على من تجب الجمعة؟ وما شروط صحتها؟", "a": "تجب على: الذكر، المسلم، المكلف، الحر، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبينه فرسخ. شروط صحتها أربعة: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدم خطبتين."}, {"s": "fiqh", "q": "ما أركان الخطبتين؟", "a": "ستة: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما."}, {"s": "fiqh", "q": "ما أركان صلاة الجنازة؟", "a": "سبعة: القيام، التكبيرات الأربع، الفاتحة، الصلاة على النبي ﷺ، الدعاء للميت، السلام، الترتيب."}, {"s": "fiqh", "q": "ما شروط وجوب الزكاة؟ وما الأموال الزكوية؟", "a": "الشروط خمسة: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول. الأموال خمسة: السائمة، الخارج من الأرض، العسل، الأثمان، عروض التجارة."}, {"s": "fiqh", "q": "ما مقدار الزكاة في الخارج من الأرض والعسل والركاز والذهب وعروض التجارة وزكاة الفطر؟", "a": "الخارج من الأرض: نصف العشر إن سقي بكلفة والعشر بلا كلفة. العسل: العشر. الركاز: الخمس. الذهب والفضة والمعادن وعروض التجارة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو)."}, {"s": "fiqh", "q": "ما كفارة الجماع في نهار رمضان؟", "a": "عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت."}, {"s": "fiqh", "q": "ما شروط صحة الاعتكاف وما يبطله؟", "a": "الشروط ستة: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد. المبطلات ستة: الخروج لغير عذر، نية الخروج، الوطء، الإنزال بالمباشرة، الردة، السكر."}, {"s": "fiqh", "q": "ما شروط وجوب الحج؟ وبم تزيد المرأة؟", "a": "خمسة: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة: وجود المحرم."}, {"s": "fiqh", "q": "ما أنواع الأنساك؟", "a": "التمتع: يحرم بالعمرة في أشهر الحج ثم بالحج. الإفراد: يحرم بالحج ثم بالعمرة بعده. القران: يحرم بهما معاً."}, {"s": "fiqh", "q": "ما محظورات الإحرام؟", "a": "سبعة: لبس المخيط للرجال، تغطية الرأس للرجل والوجه للمرأة، الطيب، إزالة الشعر وتقليم الأظفار، قتل صيد البر، عقد النكاح، الوطء ودواعيه."}, {"s": "fiqh", "q": "ما أقسام الفدية؟", "a": "على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر والظفر وجزاء الصيد (صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة). على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء، فمن لم يجد صام ثلاثة أيام في الحج وسبعة إذا رجع."}, {"s": "fiqh", "q": "ما شروط البيع؟", "a": "سبعة: الرضى، الرشد، كون المبيع مالاً، ملك البائع له أو الإذن، القدرة على التسليم، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً."}, {"s": "fiqh", "q": "ما أقسام الخيار؟", "a": "سبعة: المجلس، الشرط، الغبن، التدليس، العيب، الخلف في الصفة، الخلف في قدر الثمن."}, {"s": "fiqh", "q": "ما أركان النكاح وشروطه؟", "a": "الأركان: الإيجاب والقبول. الشروط خمسة: تعيين الزوجين، رضاهما، الولي، شهادة ذكرين مكلفين، خلوهما من الموانع."}, {"s": "fiqh", "q": "ما شروط الولي في النكاح؟", "a": "سبعة: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، العدالة ولو ظاهرة، الرشد."}, {"s": "fiqh", "q": "فيم تعتبر الكفاءة في النكاح؟", "a": "خمسة: الديانة، الصناعة، الميسرة، الحرية، النسب."}, {"s": "fiqh", "q": "ما عدة المتوفى عنها زوجها والمطلقة؟", "a": "المتوفى عنها: الحامل بوضع الحمل، وغير الحامل أربعة أشهر وعشراً. المطلقة: من تحيض ثلاث حيض، ومن لا تحيض ثلاثة أشهر، ومن ارتفع حيضها ولا تعلم سببه تسعة أشهر ثم ثلاثة."}, {"s": "fiqh", "q": "فيم تحد المرأة؟", "a": "أربعة: تجتنب الزينة، والطيب، ولبس الحلي، ولبس الملون."}, {"s": "fiqh", "q": "ما شروط نفقة الأقارب؟", "a": "ثلاثة: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوته وقوت زوجته يومه وليلته، أن يكون وارثاً لهم إلا الأصول والفروع فتجب مطلقاً."}, {"s": "fiqh", "q": "ما أحكام الحضانة؟", "a": "إذا بلغ الصبي سبعاً عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً حتى تتزوج. المجنون ولو أنثى عند أمه مطلقاً."}, {"s": "fiqh", "q": "ما شروط الذكاة؟", "a": "أربعة: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (كل محدد غير السن والظفر)، قطع الحلقوم والمريء، التسمية وتسقط سهواً لا جهلاً."}, {"s": "fiqh", "q": "ما شروط صيد الكلب والفهد وصيد الطير؟", "a": "الكلب والفهد: يسترسل إذا أرسل، ينزجر إذا زجر، إذا أمسك لم يأكل. الطير: يسترسل إذا أرسل، يرجع إذا دُعي، يجرح الصيد لا بصدم ولا خنق."}, {"s": "fiqh", "q": "بم تنعقد اليمين؟ وما كفارتها؟", "a": "بالله أو اسم من أسمائه أو صفة من صفاته. الكفارة: إطعام عشرة مساكين أو كسوتهم أو تحرير رقبة، فإن لم يجد صام ثلاثة أيام متتابعة."}, {"s": "fiqh", "q": "ما أنواع النذر وأحكامه؟", "a": "ستة: المطلق (كفارة يمين)، اللجاج والغضب (يخير بين الفعل والكفارة)، المباح (يخير)، المكروه (يسن ألا يفعله ويكفر)، المعصية (يحرم الوفاء ويكفر)، التبرر (يجب الوفاء)."}, {"s": "fiqh", "q": "ما نواقض الوضوء؟", "a": "ثمانية: الخارج من السبيلين، خروج النجاسة من بقية البدن، زوال العقل، مس الفرج بلا حائل، مباشرة الذكر الأنثى لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة."}, {"s": "fiqh", "q": "ما موجبات الغسل؟", "a": "سبعة: انتقال المني، خروجه بلذة، تغييب الحشفة في فرج، إسلام الكافر، الحيض، النفاس، الموت."}, {"s": "fiqh", "q": "ما شروط التيمم وفروضه ومبطلاته؟", "a": "الشروط ثمانية: النية، الإسلام، العقل، التمييز، الاستنجاء، دخول الوقت، تعذر الماء، تراب طهور له غبار. الفروض خمسة: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، المو لحامل ........", "a": "أربعة أشهر وعشر"}, {"s": "fiqh", "q": "زكاة الركاز ........ وزكاة العسل ........ وزكاة الذهب ........", "a": "الخمس، العشر، ربع العشر"}, {"s": "fiqh", "q": "أنواع الأنساك ثلاثة: ........ و ........ و ........", "a": "التمتع، الإفراد، القران"}, {"s": "fiqh", "q": "شروط المؤذن ........ وسنن الأذان ........", "a": "ستة، خمسة"}]}, "hadith": {"name": "الحديث", "source": "الأربعون النووية", "notes": "# الحديث (10 درجات) — الأربعون النووية\n\nكل أسئلة الاختبارات السابقة في الحديث جاءت من الأربعين النووية: الراوي، المخرّج، معاني الألفاظ، الفوائد المستنبطة، والأقسام والشروط الواردة في الشروح (ابن دقيق العيد، ابن رجب في جامع العلوم والحكم، ابن عثيمين).\n\n## ما يُسأل عنه في كل حديث\n1. من راويه من الصحابة؟ ومن أخرجه؟\n2. معاني الألفاظ الغريبة.\n3. الفوائد المستنبطة (ثلاث فوائد على الأقل).\n4. الأقسام والشروط المذكورة في الشرح.\n\n---\n\n## الأحاديث مع أهم ما يُسأل عنه\n\n**1. إنما الأعمال بالنيات** — عمر بن الخطاب، متفق عليه. سنده مشهور بالنسبة لآخره غريب بالنسبة لأوله (لم يروه عن عمر إلا علقمة). سببه: مهاجر أم قيس. المحذوف: \"صحة الأعمال\" عند من اشترط النية، و\"كمال الأعمال\" عند من لم يشترطها. إزالة النجاسة لا تحتاج نية لأنها من باب الترك.\n- هذا الحديث ثلث الإسلام (قال الإمام أحمد: أصول الإسلام على ثلاثة أحاديث: هذا، والحلال بين، ومن أحدث).\n- \"إنما الأعمال بالنيات\": أي صحة الأعمال وقبولها بالنية، فهي شرط للعبادات. \"وإنما لكل امرئ ما نوى\": الجزاء بحسب النية. قال النووي: الأولى بيان أن العمل لا يكون إلا بنية، والثانية بيان أن الثواب على قدر النية.\n- **كيف تُميّز بالنية** (سؤال سابق): (أ) العادة من العبادة: الغسل للتبرد وغسل الجنابة، الإمساك عن الطعام حمية وصوماً. (ب) العبادة من العبادة الأخرى: صلاة الظهر عن العصر، صوم القضاء عن النذر. (ج) العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لتكون كلمة الله هي العليا أو للمغنم. يطلق عليه \"أم السنة\" (سؤال أكمل: يطلق اسم أم السنة على حديث \"إنما الأعمال بالنيات\"، وأم القرآن على سورة الفاتحة).\n\n**2. حديث جبريل (الإسلام والإيمان والإحسان)** — عمر، رواه مسلم.\n- أركان الإسلام خمسة، أركان الإيمان ستة، الإحسان مرتبتان: أن تعبد الله كأنك تراه (المشاهدة)، فإن لم تكن تراه فإنه يراك (المراقبة). أشراط الساعة: أن تلد الأمة ربتها، والتطاول في البنيان.\n\n**3. بني الإسلام على خمس** — ابن عمر، متفق عليه.\n- **لماذا لم يذكر الجهاد** (سؤال سابق): علل القرطبي بأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، وقيل لأنه لم يكن قد فُرض بعد، والصحيح أن هذه الخمسة يتعين على كل مسلم فعلها بنفسه بخلاف الجهاد.\n- **رواية \"خمسة\" بالهاء ورواية \"خمس\" بغير هاء** (سؤال سابق): كلاهما صحيح، \"خمس\" أي خمس دعائم أو قواعد، و\"خمسة\" أي خمسة أركان أو أشياء.\n- **هل يصح أن يقال بُني الإسلام على خمسة؟** نعم، ورد في رواية مسلم.\n- **كيف تعامل ابن عمر مع من قدّم الحج على الصوم** (سؤال سابق): رجل قال له: \"الحج وصيام رمضان\"، فقال ابن عمر: \"لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ\"، رواه مسلم. أنكر عليه ليتحفظ الترتيب النبوي لحرصه على اللفظ.\n\n**4. الصادق المصدوق** — ابن مسعود، متفق عليه.\n- **معنى الصادق المصدوق** (سؤال سابق): الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي، أي صدقه الله فيما أخبره.\n- مراحل الخلق: نطفة أربعين يوماً، ثم علقة، ثم مضغة، ثم يرسل الملك فينفخ الروح ويكتب أربع كلمات: رزقه وأجله وعمله وشقي أم سعيد.\n\n**5. من أحدث في أمرنا هذا ما ليس منه فهو رد** — عائشة، متفق عليه.\n- \"ليس عليه أمرنا\" (سؤال أكمل): أي ليس عليه حكمنا وديننا. \"فهو رد\": أي مردود باطل غير معتد به.\n- **فائدة عظيمة** (سؤال سابق): هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود على صاحبه، وهو أصل في إبطال البدع والعقود المحرمة.\n\n**6. الحلال بين والحرام بين** — النعمان بن بشير، متفق عليه.\n- **\"فمن وقع في الشبهات وقع في الحرام\"، فيه قولان** (سؤال سابق): الأول: أنه يقع في الحرام حقيقة وهو لا يشعر، لأن التساهل بالشبهات يجره إلى الحرام. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه، كالراعي حول الحمى.\n- الحديث أصل في الورع. \"مضغة\" هي القلب.\n\n**7. الدين النصيحة** — تميم بن أوس الداري، رواه مسلم.\n- **اكتب الحديث كاملاً وكم عدد ما رُوي عنه** (سؤال سابق): \"الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم\". تميم الداري لم يُروَ عنه في الكتب الستة إلا هذا الحديث (وقيل: له ثمانية عشر حديثاً في كتب الحديث عموماً، وفي الصحيح هذا فقط).\n- **النصيحة لأئمة المسلمين** (سؤال سابق): معاونتهم على الحق وطاعتهم فيه وأمرهم به وتذكيرهم برفق ولطف، وعدم الخروج عليهم، والدعاء لهم بالصلاح.\n- **النصيحة فرض كفاية** (سؤال أكمل). النصيحة لغة: خلاص العسل من الشمع، أو الخياطة بالإبرة (نصح الثوب).\n\n**8. أمرت أن أقاتل الناس** — ابن عمر، متفق عليه. \"إلا بحق الإسلام\": كالقصاص والزنا بعد الإحصان.\n\n**9. ما نهيتكم عنه فاجتنبوه** — أبو هريرة، متفق عليه.\n- **من الرجل السائل المبهم في \"فإنما أهلك الذين من قبلكم كثرة مسائلهم\"** (سؤال سابق): الأقرع بن حابس، سأل: \"أفي كل عام يا رسول الله؟\" لما فرض الحج.\n- من فوائده: النهي يجتنب كله، والأمر بقدر الاستطاعة.\n\n**10. إن الله طيب لا يقبل إلا طيباً** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): أن الله منزه عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الطيب الحلال. أن أكل الحرام من موانع إجابة الدعاء. الرسل والمؤمنون مكلفون بتكليف واحد في أكل الطيب. أسباب الإجابة الأربعة: إطالة السفر، رثاثة الهيئة، رفع اليدين، الإلحاح بيا رب. وموانعها الأربعة: المطعم والمشرب والملبس الحرام والغذاء بالحرام.\n\n**11. دع ما يريبك إلى ما لا يريبك** — الحسن بن علي، رواه الترمذي والنسائي.\n**12. من حسن إسلام المرء تركه ما لا يعنيه** — أبو هريرة، رواه الترمذي.\n**13. لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه** — أنس، متفق عليه. المنفي كمال الإيمان الواجب لا أصله.\n**14. لا يحل دم امرئ مسلم إلا بإحدى ثلاث** — ابن مسعود، متفق عليه: الثيب الزاني، النفس بالنفس، التارك لدينه المفارق للجماعة.\n**15. من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت** — أبو هريرة، متفق عليه.\n**16. لا تغضب** — أبو هريرة، رواه البخاري.\n**17. إن الله كتب الإحسان على كل شيء** — شداد بن أوس، رواه مسلم.\n**18. اتق الله حيثما كنت** — أبو ذر ومعاذ، رواه الترمذي.\n**19. احفظ الله يحفظك** — ابن عباس، رواه الترمذي.\n- **معنى \"احفظ الله يحفظك\"** (سؤال سابق): احفظ حدوده وأوامره ونواهيه بامتثالها واجتنابها، يحفظك في دينك ودنياك وأهلك ومالك. حفظ الله للعبد نوعان: حفظ في الدنيا (البدن والمال والولد)، وحفظ في الدين والإيمان.\n- \"رفعت الأقلام وجفت الصحف\": الفراغ من كتابة المقادير.\n\n**20. إذا لم تستح فاصنع ما شئت** — أبو مسعود البدري، رواه البخاري.\n**21. قل آمنت بالله ثم استقم** — سفيان بن عبدالله الثقفي، رواه مسلم.\n- **\"ثم استقم\"** (سؤال سابق): الاستقامة هي لزوم طاعة الله والثبات على الدين بلا ميل، وهي جامعة لخصال الدين كلها.\n\n**22. أرأيت إذا صليت المكتوبات** — جابر، رواه مسلم. \"لم أزد على ذلك شيئاً\": أي لا أزيد على الفرائض، وفيه دليل على أن تارك السنن لا يأثم.\n**23. الطهور شطر الإيمان** — أبو مالك الأشعري، رواه مسلم. \"شطر\": نصف. \"الصلاة نور، والصدقة برهان، والصبر ضياء\". **الصبر ثلاثة** (سؤال أكمل): صبر على طاعة الله، وصبر عن معصية الله، وصبر على أقدار الله المؤلمة.\n**24. يا عبادي إني حرمت الظلم على نفسي** — أبو ذر، رواه مسلم (حديث قدسي).\n**25. ذهب أهل الدثور بالأجور** — أبو ذر، رواه مسلم. \"الدثور\": الأموال الكثيرة.\n**26. كل سلامى من الناس عليه صدقة** — أبو هريرة، متفق عليه. \"سلامى\": المفصل.\n**27. البر حسن الخلق، والإثم ما حاك في صدرك** — النواس بن سمعان، رواه مسلم.\n**28. إياكم ومحدثات الأمور** — العرباض بن سارية، رواه أبو داود والترمذي.\n- **الراوي** (سؤال سابق): أبو نجيح العرباض بن سارية. **أخرجه**: أبو داود والترمذي. **المحدث قسمان**: محدث ليس له أصل في الشريعة فهو بدعة، ومحدث يحمل النظير على النظير (كجمع المصحف) فليس ببدعة.\n- \"موعظة بليغة\": مؤثرة. \"ذرفت منها العيون\": سالت دموعها. \"بالنواجذ\": أقصى الأضراس.\n\n**29. يا رسول الله أخبرني بعمل يدخلني الجنة** — معاذ، رواه الترمذي. \"ملاك ذلك كله\": كف اللسان. \"ثكلتك أمك\": دعاء لا يراد حقيقته.\n**30. إن الله فرض فرائض فلا تضيعوها** — أبو ثعلبة الخشني، رواه الدارقطني.\n**31. ازهد في الدنيا يحبك الله** — سهل بن سعد، رواه ابن ماجه.\n**32. لا ضرر ولا ضرار** — أبو سعيد الخدري، رواه ابن ماجه والدارقطني. الضرر: إلحاق المفسدة بالغير مطلقاً، والضرار: مقابلة الضرر بالضرر.\n**33. لو يعطى الناس بدعواهم** — ابن عباس، رواه البيهقي وأصله في الصحيحين. البينة على المدعي واليمين على من أنكر.\n**34. من رأى منكم منكراً فليغيره** — أبو سعيد الخدري، رواه مسلم.\n- **شروط الأمر بالمعروف والنهي عن المنكر** (سؤال سابق): أن يكون عالماً بأن هذا منكر وبحكمه. أن يكون المنكر ظاهراً بلا تجسس. أن يكون متفقاً على إنكاره لا مسألة خلافية. أن يغلب على ظنه أن الإنكار لا يؤدي إلى منكر أكبر. القدرة عليه. وله مراتب: اليد ثم اللسان ثم القلب، وتغيير القلب أضعف الإيمان.\n\n**35. لا تحاسدوا ولا تناجشوا** — أبو هريرة، رواه مسلم.\n- **معاني الكلمات** (سؤال سابق مكرر):\n  - **لا تحاسدوا**: لا يتمنى بعضكم زوال نعمة بعض.\n  - **لا تناجشوا**: النجش أن يزيد في السلعة من لا يريد شراءها ليغر المشتري، والمناجشة: الخداع.\n  - **لا تباغضوا**: لا تتعاطوا أسباب البغض.\n  - **لا تدابروا**: التدابر أن يعطي كل منهما الآخر دبره إعراضاً وهجراً.\n  - **يحقر** / **لا يحقره**: لا يستصغره ويزدريه ويستهين به.\n  - **التقوى ها هنا**: في القلب، وأشار إلى صدره ثلاثاً.\n\n**36. من نفّس عن مؤمن كربة** — أبو هريرة، رواه مسلم.\n- **ثلاث فوائد** (سؤال سابق): الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على تلاوة القرآن ومدارسته في بيوت الله. فضل طلب العلم وأنه طريق إلى الجنة. أن العمل هو المعتبر لا النسب (\"من بطأ به عمله لم يسرع به نسبه\").\n- \"نفّس\": فرّج. \"كربة\": شدة عظيمة. \"السكينة\": الطمأنينة.\n\n**37. إن الله كتب الحسنات والسيئات** — ابن عباس، متفق عليه. الحسنة بعشر إلى سبعمائة ضعف، والهم بالسيئة إذا ترك لله كتبت حسنة.\n**38. من عادى لي ولياً** — أبو هريرة، رواه البخاري (قدسي). الولي: المؤمن التقي. أحب ما يتقرب به العبد: الفرائض، ثم النوافل.\n**39. إن الله تجاوز لي عن أمتي الخطأ والنسيان** — ابن عباس، رواه ابن ماجه والبيهقي.\n**40. كن في الدنيا كأنك غريب أو عابر سبيل** — ابن عمر، رواه البخاري.\n- **المقصود** (سؤال سابق): لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن فيها كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ. ومن وصايا ابن عمر: \"إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء، وخذ من صحتك لمرضك ومن حياتك لموتك\".\n\n**41. لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به** — عبدالله بن عمرو، حديث حسن صحيح رواه النووي في الحجة.\n- **المحبة ثلاثة أقسام** (سؤال سابق): محبة إجلال وعظمة (كمحبة الوالد)، محبة شفقة ورحمة (كمحبة الولد)، محبة استحسان ومشاكلة (كمحبة سائر الناس).\n\n**42. يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك** — أنس، رواه الترمذي (قدسي).\n- **شروط التوبة ثلاثة** (سؤال سابق): الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع إن كانت متعلقة بحق آدمي: رد المظالم إلى أهلها. \"عنان السماء\": السحاب أو ما عنّ لك منها. \"قراب الأرض\": ملؤها أو ما يقارب ملأها.\n\n## أسئلة مرجحة: معاني ألفاظ\n| اللفظ | المعنى |\n|---|---|\n| مضغة | قطعة لحم قدر ما يُمضغ (القلب) |\n| العَلَق | الدم الغليظ الجامد |\n| يخالطهم | يعاشرهم |\n| النواجذ | أقصى الأضراس |\n| الدثور | الأموال الكثيرة |\n| سلامى | المفصل |\n| ملاك الأمر | قوامه وأصله |\n| العنان | السحاب |\n| الكربة | الشدة العظيمة |\n| الخلاصة | زبدة الشيء |\n| حاك في صدرك | تردد فيه ولم ينشرح له |\n", "questions": [{"s": "hadith", "q": "كيف تتميز بالنية العادة من العبادة، أو العبادة من الأخرى، أو العبادة لله أو لغيره؟ اذكر مثالين لكل صورة.", "a": "العادة من العبادة: الغسل للتبرد وللجنابة، الإمساك حمية وصوماً. العبادة من الأخرى: الظهر من العصر، صوم القضاء من النذر. العبادة لله أو لغيره: الصدقة لله أو رياء، الجهاد لإعلاء كلمة الله أو للمغنم."}, {"s": "hadith", "q": "ما معنى الصادق المصدوق؟", "a": "الصادق في نفسه فيما يخبر به، المصدوق فيما جاءه من الوحي (صدقه الله)."}, {"s": "hadith", "q": "\"فمن وقع في الشبهات وقع في الحرام\" هناك قولان، اذكرهما.", "a": "الأول: أنه يقع في الحرام حقيقة وهو لا يشعر. الثاني: أنه يقرب من الحرام ويوشك أن يقع فيه كالراعي حول الحمى."}, {"s": "hadith", "q": "ما شروط الأمر بالمعروف والنهي عن المنكر؟", "a": "أن يكون عالماً بأنه منكر، وأن يكون المنكر ظاهراً بلا تجسس، وأن يكون متفقاً على إنكاره لا مسألة خلافية، وألا يترتب عليه منكر أكبر، والقدرة. ومراتبه: اليد ثم اللسان ثم القلب."}, {"s": "hadith", "q": "ما معنى: لا تحاسدوا؟ لا تناجشوا؟ لا تدابروا؟ يحقر؟", "a": "لا تحاسدوا: لا يتمنى بعضكم زوال نعمة بعض. لا تناجشوا: النجش الزيادة في السلعة ممن لا يريد شراءها ليغر غيره. لا تدابروا: لا يعطي كل منكما الآخر دبره هجراً وإعراضاً. يحقر: يستصغره ويزدريه."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: إن الله طيب لا يقبل إلا طيباً.", "a": "تنزيه الله عن النقائص. أن الله لا يقبل من الأعمال والأموال إلا الحلال. أن أكل الحرام من موانع إجابة الدعاء. أسباب الإجابة: السفر، رثاثة الهيئة، رفع اليدين، الإلحاح."}, {"s": "hadith", "q": "من أحدث في أمرنا هذا ما ليس منه فهو رد: فائدة عظيمة وضحها.", "a": "هذا الحديث ميزان للأعمال في ظاهرها كما أن حديث النية ميزان في باطنها، فكل عمل لا يوافق الشرع مردود، وهو أصل في إبطال البدع والعقود المحرمة."}, {"s": "hadith", "q": "استنبط ثلاث فوائد من حديث: من نفّس عن مؤمن كربة.", "a": "الجزاء من جنس العمل. فضل التيسير على المعسر والستر على المسلم. فضل الاجتماع على القرآن في المساجد. فضل طلب العلم. العمل هو المعتبر لا النسب."}, {"s": "hadith", "q": "وضح المقصود: كن في الدنيا كأنك غريب أو عابر سبيل.", "a": "لا تركن إلى الدنيا ولا تتخذها وطناً، بل كن كالغريب الذي لا يتعلق بها، أو كعابر السبيل الذي لا يقيم فيها أصلاً، والثاني أبلغ."}, {"s": "hadith", "q": "بماذا علل الإمام أبو العباس القرطبي عدم ذكر النبي ﷺ الجهاد ضمن أركان الإسلام؟", "a": "لأن الجهاد فرض كفاية لا يتعين إلا في بعض الأحوال، بخلاف الخمسة فهي متعينة على كل مسلم."}, {"s": "hadith", "q": "هل يصح أن يقال: إن الإسلام بني على خمسة؟", "a": "نعم، وردت رواية \"خمسة\" بالهاء في مسلم، ورواية \"خمس\" بغير هاء، وكلاهما صحيح، فالأولى بتقدير أشياء أو أركان، والثانية بتقدير دعائم أو قواعد."}, {"s": "hadith", "q": "كيف تعامل ابن عمر راوي الحديث مع من قدم الحج على الصوم؟ ولماذا؟", "a": "أنكر عليه وقال: لا، صيام رمضان والحج، هكذا سمعته من رسول الله ﷺ. لحرصه على ضبط لفظ النبي ﷺ وترتيبه."}, {"s": "hadith", "q": "حديث \"إياكم ومحدثات الأمور\": من رواه؟ ومن خرجه؟ وما قسما المحدث؟", "a": "الراوي: أبو نجيح العرباض بن سارية. أخرجه: أبو داود والترمذي. القسم الأول: محدث ليس له أصل في الشريعة فهو بدعة. الثاني: محدث يحمل النظير على النظير فليس ببدعة."}, {"s": "hadith", "q": "حديث \"لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به\" تضمن الدلالة على المحبة، وهي ثلاثة أقسام، فما هي؟", "a": "محبة إجلال وعظمة، محبة شفقة ورحمة، محبة استحسان ومشاكلة."}, {"s": "hadith", "q": "حديث \"يا ابن آدم لو بلغت ذنوبك عنان السماء\" تضمن الدلالة على التوبة ولها ثلاثة شروط، فما هي؟", "a": "الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود. ويزاد رابع في حقوق العباد: ردها لأصحابها."}, {"s": "hadith", "q": "اكتب حديث أبي رقية تميم بن أوس الداري كاملاً، وكم عدد الأحاديث التي رويت عنه؟", "a": "قال ﷺ: الدين النصيحة، قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم. رواه مسلم. ولم يرو له في الصحيح غيره، وله في كتب السنة نحو ثمانية عشر حديثاً."}, {"s": "hadith", "q": "من هو الرجل السائل المبهم في حديث: فإنما أهلك الذين من قبلكم كثرة مسائلهم؟", "a": "الأقرع بن حابس، حين سأل: أفي كل عام يا رسول الله؟"}, {"s": "hadith", "q": "اذكر معنى (العلة) الوارد في حديث عمر بن الخطاب (الصادق المصدوق).", "a": "المراد في حديث الأربعين: \"مثل ذلك\" العلقة: الدم الغليظ الجامد، وهي مفرد وجمعها علق."}, {"s": "hadith", "q": "اشرح بسطر: النصيحة لأئمة المسلمين. الإيمان بالملائكة. بني الإسلام على خمس. احفظ الله يحفظك.", "a": "النصيحة للأئمة: معاونتهم على الحق وطاعتهم فيه وتذكيرهم برفق وعدم الخروج عليهم. الإيمان بالملائكة: التصديق بوجودهم وأنهم عباد مكرمون من نور. بني الإسلام على خمس: أركانه كالبناء على دعائم خمس لا يقوم بدونها. احفظ الله: احفظ حدوده يحفظك في دينك ودنياك."}, {"s": "hadith", "q": "أكمل: يطلق اسم أم القرآن على سورة ... ويطلق اسم أم السنة على حديث ... والنصيحة فرض ... والصبر ثلاثة ...", "a": "الفاتحة. إنما الأعمال بالنيات. كفاية. صبر على الطاعة، وعن المعصية، وعلى أقدار الله."}, {"s": "hadith", "q": "في الحديث (ليس عليه أمرنا) أي؟ (فهو رد) أي؟", "a": "ليس عليه أمرنا: ليس عليه حكمنا وديننا. فهو رد: مردود باطل غير معتد به."}, {"s": "hadith", "q": "ماذا قال الإمام أحمد والشافعي عن حديث إنما الأعمال بالنيات؟ وما سبب ذلك؟", "a": "يدخل في حديث الأعمال بالنيات ثلث العلم، لأن كسب العبد يكون بقلبه ولسانه وجوارحه، والنية أحد الأقسام الثلاثة."}, {"s": "hadith", "q": "لماذا استحب العلماء أن تُستفتح المصنفات بحديث إنما الأعمال بالنيات؟", "a": "تنبيهاً للطالب على تصحيح النية."}, {"s": "hadith", "q": "ما نوع سند حديث إنما الأعمال بالنيات؟", "a": "مشهور بالنسبة إلى آخره، غريب بالنسبة إلى أوله، لأنه لم يروه عن النبي ﷺ إلا عمر، ولم يروه عن عمر إلا علقمة، ثم اشتهر."}, {"s": "hadith", "q": "ما المراد بالأعمال في قوله: إنما الأعمال بالنيات؟ وما الذي لا يحتاج إلى نية؟", "a": "المراد الأعمال الشرعية كالوضوء والصلاة فلا يُعتد بها بدون نية. أما إزالة النجاسة فلا تحتاج نية لأنها من باب الترك."}, {"s": "hadith", "q": "ما المحذوف المقدّر في: إنما الأعمال بالنيات؟", "a": "من اشترط النية قدّر: صحة الأعمال بالنيات. ومن لم يشترطها قدّر: كمال الأعمال بالنيات."}, {"s": "hadith", "q": "ماذا يفيد قوله: وإنما لكل امرئ ما نوى؟", "a": "تعيين العمل بالنية، فمن عليه صلاة فائتة لا يكفيه أن ينوي الفائتة بل ينوي كونها ظهراً أو عصراً."}, {"s": "hadith", "q": "ما سبب ورود حديث إنما الأعمال بالنيات؟", "a": "رجل هاجر من مكة إلى المدينة ليتزوج امرأة يقال لها أم قيس، فكان يقال له: مهاجر أم قيس."}, {"s": "hadith", "q": "هل الإسلام والإيمان بمعنى واحد؟", "a": "حقيقتان متباينتان لغة وشرعاً، وقد يتوسع الشرع فيطلق أحدهما على الآخر على سبيل التجوز."}, {"s": "hadith", "q": "لماذا تعجب الصحابة من سائل النبي ﷺ في حديث جبريل؟", "a": "لأن ما جاء به النبي ﷺ لا يُعرف إلا من جهته، وهذا السائل غير معروف بلقائه، ثم سأل سؤال عارف مصدّق."}, {"s": "hadith", "q": "ما معنى: أن تلد الأمة ربتها؟", "a": "قولان: أن يستولي المسلمون على بلاد الكفر فيكثر التسري فيكون ولد الأمة من سيدها بمنزلة سيدها. أو تفسد الأحوال حتى يبيع السادة أمهات أولادهم فربما اشتراها ولدها."}, {"s": "hadith", "q": "لماذا خُص رعاء الشاء بالذكر في حديث جبريل؟ وما معنى ملياً والعالة؟", "a": "لأنهم أضعف أهل البادية. ملياً: زماناً كثيراً قيل ثلاث. العالة: جمع عائل وهو الفقير."}, {"s": "hadith", "q": "ما سبب ورود حديث بني الإسلام على خمس؟", "a": "أن رجلاً قال لابن عمر: ألا نغزو؟ فقال: سمعت رسول الله ﷺ يقول: إن الإسلام بني على خمس."}, {"s": "hadith", "q": "ما معنى: إن أحدكم يُجمع خلقه في بطن أمه؟ ومن الملك المرسل؟", "a": "أن المني يقع في الرحم متفرقاً فيجمعه الله في محل الولادة. والملك: الموكل بالرحم."}, {"s": "hadith", "q": "ما توجيه قوله: إن أحدكم ليعمل بعمل أهل الجنة حتى ما يكون بينه وبينها إلا ذراع؟", "a": "أن عمله كان صحيحاً وقرب من الجنة، ومنعه سابق القدر الذي يظهر عند الخاتمة، فالأعمال بالخواتيم بالنسبة إلى اطلاعنا. وهذا نادر لا غالب، وانقلاب الناس من الشر إلى الخير أكثر."}, {"s": "hadith", "q": "ما القاعدة الأصولية المأخوذة من حديث: من أحدث في أمرنا؟", "a": "أن النهي يقتضي الفساد."}, {"s": "hadith", "q": "ما فائدة رواية: من عمل عملاً ليس عليه أمرنا فهو رد؟", "a": "أنها صريحة في ترك كل محدثة سواء أحدثها فاعلها أو سُبق إليها، فيُحتج بها على من يقول: ما أحدثت شيئاً."}, {"s": "hadith", "q": "دل حديث الحلال بيّن على أن الأشياء ثلاثة أقسام، اذكرها.", "a": "ما نص الله على تحليله فهو الحلال البيّن. ما نص على تحريمه فهو الحرام البيّن. الشبهات: ما تتنازعه الأدلة وتتجاذبه المعاني، والإمساك عنه ورع."}, {"s": "hadith", "q": "ما حكم المشتبهات؟", "a": "ثلاثة أقوال: حرام لقوله استبرأ لدينه وعرضه. حلال وتركها ورع لقوله كالراعي يرعى حول الحمى. التوقف فيها ورعاً."}, {"s": "hadith", "q": "المشتبهات ثلاثة أقسام عند بعض العلماء، اذكرها.", "a": "ما يعلم أنه حرام ثم يشك في زوال تحريمه (كالذبيحة يشك في ذكاتها) فيبقى التحريم. ما كان حلالاً فيشك في تحريمه (كزوجة يشك في طلاقها) فيبقى الحل. ما يشك فيه ولا دلالة على أحد الأمرين فالأحسن التنزه."}, {"s": "hadith", "q": "ما معنى النصيحة لغة واصطلاحاً؟ وما حكمها؟", "a": "لغة: الإخلاص. اصطلاحاً: كلمة جامعة معناها إرادة جملة الخير حيازة لحظ المنصوح له. حكمها: فرض كفاية."}, {"s": "hadith", "q": "ما معنى: الدين النصيحة؟", "a": "أي عماد الدين وقوامه النصيحة، كقوله: الحج عرفة."}, {"s": "hadith", "q": "ما النصيحة لله ولكتابه ولرسوله؟", "a": "لله: الإيمان به ونفي الشرك وترك الإلحاد في صفاته وطاعته. لكتابه: الإيمان بأنه كلام الله وتعظيمه وتلاوته حق تلاوته والوقوف على أحكامه. لرسوله: تصديقه وطاعته ونصرته حياً وميتاً ومعاداة من عاداه."}, {"s": "hadith", "q": "ما سبب ورود حديث: أمرت أن أقاتل الناس؟", "a": "لما توفي النبي ﷺ وارتد من ارتد ومنع بعضهم الزكاة، عزم أبو بكر على قتالهم، فقال عمر: كيف تقاتلهم وقد قالوا لا إله إلا الله؟ فقال أبو بكر: الزكاة حق المال، والله لو منعوني عناقاً كانوا يؤدونها لرسول الله لقاتلتهم عليها."}, {"s": "hadith", "q": "من المراد بالناس في: أمرت أن أقاتل الناس؟ وما معنى: وحسابهم على الله؟", "a": "أهل الأوثان ومشركو العرب دون أهل الكتاب. وحسابهم على الله: فيما يسرونه، ويستفاد منه أن من أظهر الإسلام وأسر الكفر يقبل إسلامه في الظاهر."}, {"s": "hadith", "q": "ما قصة حديث: ما نهيتكم عنه فاجتنبوه؟", "a": "قال ﷺ: يا أيها الناس قد فرض الله عليكم الحج فحجوا، فقال الأقرع بن حابس: أكل عام؟ فسكت حتى قالها ثلاثاً، فقال: لو قلت نعم لوجبت ولما استطعتم."}, {"s": "hadith", "q": "ما الذي يدل عليه: ذروني ما تركتكم؟ وما الذي يؤخذ من: لو قلت نعم لوجبت؟", "a": "الأول: أن الأصل عدم الوجوب ولا حكم قبل ورود الشرع. الثاني: أنه كان له أن يجتهد في الأحكام ولا يشترط أن يكون حكمه بوحي."}, {"s": "hadith", "q": "هل قوله تعالى: اتقوا الله حق تقاته منسوخ بقوله: فاتقوا الله ما استطعتم؟", "a": "ليست منسوخة، بل الثانية مفسرة للأولى."}, {"s": "hadith", "q": "في حديث إن الله طيب: يطيل السفر في ماذا؟ وما معنى فأنى يستجاب له؟", "a": "في وجوه الطاعات كالحج والجهاد. فأنى يستجاب له: من أين يستجاب لمن هذه صفته، فليس أهلاً للإجابة."}, {"s": "hadith", "q": "ما ضبط (يريبك) ومعناه؟ وإلى أي حديث يرجع؟", "a": "بالضم والفتح، والفتح أفصح. معناه: اترك ما شككت فيه إلى ما لا تشك فيه. ويرجع إلى الحديث السادس: الحلال بين."}, {"s": "hadith", "q": "ماذا قال أبو داود عن حديث: من حسن إسلام المرء تركه ما لا يعنيه؟", "a": "أصول السنن في كل فن أربعة أحاديث، وذكر منها هذا الحديث."}, {"s": "hadith", "q": "هل معنى (لا يؤمن أحدكم حتى يحب لأخيه) نفي الإيمان بالكلية؟", "a": "لا، المراد نفي الإيمان التام، وأصل الإيمان حاصل. وقال أبو الزناد: ظاهره التساوي وحقيقته التفضيل لأن الإنسان يحب أن يكون أفضل الناس."}, {"s": "hadith", "q": "من الثيب الزاني؟ وهل الحرية شرط في المكافأة في: النفس بالنفس؟", "a": "المحصن ذكراً أو أنثى. الحرية والإسلام شرط عند مالك والشافعي وأحمد لحديث: لا يقتل مسلم بكافر، وذهب أصحاب الرأي إلى قتل المسلم بالذمي والحر بالعبد."}, {"s": "hadith", "q": "هل الصائل داخل في: المفارق للجماعة؟", "a": "الظاهر أنه عام يُخص منه الصائل، فيباح قتله دفعاً لأذاه، أو يقال: المراد لا يحل تعمد قتله قصداً إلا في الثلاثة."}, {"s": "hadith", "q": "كيف فسر أهل العلم: فليقل خيراً أو ليصمت؟ وكيف يكون إكرام الجار والضيف؟", "a": "إذا أراد الكلام فإن كان خيراً محققاً فليتكلم وإلا فليمسك سواء ظهر أنه حرام أو مكروه أو مباح. الإكرام: البشاشة وطيب الحديث، وعماد الضيافة إطعام الطعام."}, {"s": "hadith", "q": "لماذا خص النبي ﷺ الرجل بوصية: لا تغضب؟", "a": "لأنه علم منه كثرة الغضب. والغضب من الشيطان، يُخرج الإنسان عن اعتداله فيتكلم بالباطل."}, {"s": "hadith", "q": "ما ضبط القِتلة والذِبحة؟ وما معنى إحسان الذبح؟", "a": "بكسر القاف والذال: الهيئة والحالة. إحسان الذبح: الرفق بالبهيمة وتوجيهها للقبلة والتسمية وقطع الحلقوم والودجين، وهو عام في القتل قصاصاً أو حداً."}, {"s": "hadith", "q": "ما قصة حديث: اتق الله حيثما كنت؟", "a": "أسلم أبو ذر بمكة وأمره النبي ﷺ أن يلحق بقومه، فلما رأى حرصه على المقام معه قال له: اتق الله حيثما كنت وأتبع السيئة الحسنة تمحها."}, {"s": "hadith", "q": "اذكر بعض مناقب ابن عباس.", "a": "دعا له النبي ﷺ: اللهم فقهه في الدين وعلمه التأويل، ودعا له بالحكمة مرتين، ورأى جبريل مرتين، وهو حبر هذه الأمة وحبرها."}, {"s": "hadith", "q": "ما معنى: احفظ الله تجده تجاهك؟ وما الذي يفيده: إذا سألت فاسأل الله؟", "a": "اعمل له بالطاعة ولا يراك في مخالفته فإنك تجده تجاهك في الشدائد. والثاني: الإرشاد إلى التوكل على الله وعدم التعلق بغيره."}, {"s": "hadith", "q": "ما معنى: من كلام النبوة الأولى؟ وما وجها: فاصنع ما شئت؟", "a": "أن الحياء لم يزل ممدوحاً لم ينسخ في شرائع الأنبياء. الوجهان: أمر بمعنى الوعيد والتهديد، أو: ائت كل ما لا يُستحيا منه."}, {"s": "hadith", "q": "من الرجل السائل في حديث: أرأيت إذا صليت المكتوبات؟ وماذا أراد بتحريم الحرام؟", "a": "النعمان بن قوقل. أراد أمرين: أن يعتقد كونه حراماً وألا يفعله، بخلاف تحليل الحلال فيكفي اعتقاد حله."}, {"s": "hadith", "q": "على ماذا يدل عدم ذكر التطوعات في حديث النعمان بن قوقل؟ ولماذا ترك النبي ﷺ التنبيه عليها؟", "a": "على جواز ترك التطوعات على الجملة، ومن داوم على تركها كان نقصاً في دينه، ولو تواطأ أهل بلد على ترك سنة لقوتلوا. وترك التنبيه تسهيلاً للسائل لقرب عهده بالإسلام. وحكمة مشروعية السنن: تتميم الفرائض."}, {"s": "hadith", "q": "ما معنى: الطهور شطر الإيمان؟", "a": "قيل: الأجر فيه ينتهي إلى نصف أجر الإيمان. وقيل: المراد بالإيمان الصلاة."}, {"s": "hadith", "q": "ما معنى: الصلاة نور؟ والصدقة برهان؟", "a": "الصلاة نور: تمنع المعاصي، أو تكون نوراً لصاحبها يوم القيامة، أو نوراً على وجهه. الصدقة برهان: يفزع إليها كالبراهين إذا سئل عن مصرف ماله، أو حجة على إيمان فاعلها."}, {"s": "hadith", "q": "اذكر بعض تعريفات السلف للصبر، وهل الشكوى تنافيه؟", "a": "الصبر: الثبات على الكتاب والسنة، أو الوقوف مع البلاء بحسن الأدب. وإظهار البلاء على وجه الشكوى لا ينافيه، فقد قال أيوب: مسني الضر، ووصفه الله بالصبر."}, {"s": "hadith", "q": "ما معنى: كل الناس يغدو فبائع نفسه فمعتقها أو موبقها؟", "a": "كل إنسان يسعى لنفسه، فمنهم من يبيعها لله بطاعته فيعتقها من العذاب، ومنهم من يبيعها للشيطان فيوبقها."}, {"s": "hadith", "q": "ما معنى: إني حرمت الظلم على نفسي؟ وما أصل: فلا تظالموا؟", "a": "لا ينبغي لي ولا يجوز علي، فالظلم محال في حق الله. وأصلها: فلا تتظالموا، حذفت إحدى التاءين."}, {"s": "hadith", "q": "ما الذي يفيده: كلكم ضال إلا من هديته؟ و: إنكم تخطئون بالليل والنهار؟ و: أغفر الذنوب جميعاً؟", "a": "الأول: التنبيه على فقرنا وعجزنا، ويرجع إلى معنى لا حول ولا قوة إلا بالله. الثاني: التوبيخ. الثالث: لئلا يقنط أحد من رحمة الله لعظم ذنبه."}, {"s": "hadith", "q": "ما معنى الدثور؟ وما الحكم الفقهي المأخوذ من حديث: ذهب أهل الدثور بالأجور؟", "a": "الدثور: المال الكثير. يؤخذ منه جواز سؤال المستفتي عن الدليل إذا لم يكن فيه سوء أدب، وجواز القياس (قياس العكس) في قوله: أرأيتم لو وضعها في حرام."}, {"s": "hadith", "q": "ما معنى سلامى؟ وكم عددها؟ وما الذي يجزئ عن جميع هذه الصدقات؟", "a": "المفاصل والأعضاء، وهي ثلاثمائة وستون. ويجزئ عنها ركعتا الضحى. والصدقة هنا ترغيب لا إيجاب."}, {"s": "hadith", "q": "ما المراد بحسن الخلق في حديث: البر حسن الخلق؟", "a": "الإنصاف في المعاملة والرفق والعدل في الأحكام والبذل في الإحسان واحتمال الأذى."}, {"s": "hadith", "q": "كيف يُجمع بين: وإن تأمّر عليكم عبد، وقول العلماء إن العبد لا يكون والياً؟", "a": "ضرب المثل على التقدير وإن لم يكن، كقوله: من بنى لله مسجداً كمفحص قطاة. أو أخبر بفساد الأمر حتى توضع الولاية في العبيد فيُسمع ويطاع تغليباً لأهون الضررين."}, {"s": "hadith", "q": "من الخلفاء الراشدون؟ ولماذا أُمر بالثبات على سنتهم؟", "a": "أبو بكر وعمر وعثمان وعلي بالإجماع. لأمرين: التقليد لمن عجز عن النظر، والترجيح لما ذهبوا إليه عند اختلاف الصحابة."}, {"s": "hadith", "q": "ما المراد بالصوم في: الصوم جنة؟ وما معنى جنة؟ وما المراد بالصدقة في: الصدقة تطفئ الخطيئة؟", "a": "الصوم هنا غير رمضان والمراد الإكثار منه، والجُنة: الوقاية والسترة من النار. والصدقة هنا غير الزكاة."}, {"s": "hadith", "q": "لماذا ذكر النبي ﷺ الجهاد ثم أخذ بلسانه وقال: كف عليك هذا؟", "a": "ليحضه أولاً على جهاد الكفار، ثم نقله إلى الجهاد الأكبر وهو جهاد النفس."}, {"s": "hadith", "q": "اذكر حديثاً موافقاً لقوله: وسكت عن أشياء رحمة لكم.", "a": "ذروني ما تركتكم فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم."}, {"s": "hadith", "q": "ما معنى الضرر والضرار؟", "a": "أقوال: لفظان بمعنى واحد للتأكيد. الضرر الاسم والضرار الفعل. رأي ابن دقيق العيد: الضرر ما لك فيه منفعة وعلى جارك مضرة. أو الضرر أن تضر من لا يضرك، والضرار أن تضر من أضر بك على غير وجه الانتصار بالحق."}, {"s": "hadith", "q": "ما حكم من جحد حقاً عليه ثم ظفر المجحود بمال الجاحد؟", "a": "قيل: ليس له أخذ حقه لحديث: أد الأمانة إلى من ائتمنك ولا تخن من خانك. وقيل: له أن ينتصر ويأخذ حقه لحديث هند مع أبي سفيان."}, {"s": "hadith", "q": "هل اليمين على المدعى عليه في كل مسألة؟", "a": "أجمعوا على استحلافه في الأموال، واختلفوا في غيرها كالطلاق والنكاح والعتق، فذهب بعضهم إلى العموم."}, {"s": "hadith", "q": "ما سبب ورود حديث: من رأى منكم منكراً؟", "a": "أول من بدأ بالخطبة يوم العيد قبل الصلاة مروان، فقام رجل فقال: الصلاة قبل الخطبة، فقال أبو سعيد: أما هذا فقد قضى ما عليه، سمعت رسول الله ﷺ يقول: من رأى منكم منكراً..."}, {"s": "hadith", "q": "ما حكم الأمر بالمعروف والنهي عن المنكر؟ ومتى يتعين؟ ومتى يسقط التغيير؟", "a": "فرض كفاية. ويتعين إذا كان في موضع لا يعلم به إلا هو أو لا يتمكن من إزالته إلا هو، وكمن يرى زوجته أو ولده على منكر. ويسقط إذا خاف القتل أو الضرب."}, {"s": "hadith", "q": "هل يشترط في الآمر بالمعروف أن يكون كامل الحال؟ وهل يختص بأصحاب الولاية؟ وهل ينكر في مسائل الخلاف؟", "a": "لا يشترط كمال الحال لأنه يجب عليه أمر نفسه وأمر غيره. ولا يختص بالولاة في الأمور الظاهرة كالصلاة والزنا وشرب الخمر، أما دقائق الأمور والاجتهاد فللعلماء. والإنكار في المجمع عليه لا المختلف فيه. ولا يجوز التجسس ولا اقتحام الدور بالظنون."}, {"s": "hadith", "q": "ما معنى: وذلك أضعف الإيمان؟", "a": "أقله ثمرة."}, {"s": "hadith", "q": "ما الفرق بين الحسد والغبطة؟ ومتى يوضع الحسد موضع الغبطة؟", "a": "الحسد تمني زوال النعمة وهو حرام، والغبطة تمني مثل حال المغبوط دون زوالها عنه. ويوضع الحسد موضع الغبطة لتقاربهما كحديث: لا حسد إلا في اثنتين."}, {"s": "hadith", "q": "ما معنى: لا يبع بعضكم على بيع بعض؟", "a": "أن يقول لمن اشترى سلعة في مدة الخيار: افسخ وأنا أبيعك مثله أو أجود بثمنه، أو يزيد بعد استقرار الثمن، وهذا حرام بعد الرضى لا قبله."}, {"s": "hadith", "q": "ما معنى الخذلان؟ وما الرواية الأخرى في (لا يحقره)؟ وما معنى: التقوى ها هنا؟", "a": "الخذلان: ترك الإعانة والنصرة، فإذا استعان به في دفع ظالم لزمه إعانته. الرواية الأخرى: لا يُخفره أي لا يغدر بعهده، والصواب: لا يحقره. التقوى ها هنا: أن الأعمال الظاهرة لا تحصّل التقوى وإنما تقع بما في القلب من عظمة الله وخشيته. ومن الاحتقار: ألا يسلم عليه ولا يرد سلامه."}, {"s": "hadith", "q": "ما معنى تنفيس الكربة؟ ومتى يكون الستر ومتى يكون الإنكار؟", "a": "تنفيس الكربة: إزالتها. الستر على ذوي الهيئات غير المعروفين بالفساد في معصية وقعت وانقضت، أما المتلبس بها فيجب الإنكار عليه، ويجب تجريح الرواة والشهود عند الحاجة وليس من الغيبة."}, {"s": "hadith", "q": "ما معنى السكينة؟ وحفتهم الملائكة؟ وذكرهم الله فيمن عنده؟", "a": "السكينة: الطمأنينة والوقار (وقيل الرحمة وهو ضعيف لعطف الرحمة عليها). حفتهم: أحدقوا بهم حتى لم يدعوا فرجة لشيطان. فيمن عنده: الأنبياء وكرام الملائكة."}, {"s": "hadith", "q": "لماذا جعل الله الهم بالحسنة حسنة ولم يجعل الهم بالسيئة سيئة؟ وهل تكتب حسنة لمن ترك السيئة مكرهاً أو عاجزاً؟", "a": "لأن إرادة الخير فعل القلب، ومن كف عن الشر فقد فسخ اعتقاده بنية خير وعصى هواه فجوزي بحسنة. ومن تركها مكرهاً أو عاجزاً لا تكتب له حسنة."}, {"s": "hadith", "q": "ما الحكمة من مضاعفة الأجور لهذه الأمة؟ وكيف تكون الأضعاف الكثيرة؟", "a": "لما قصرت أعمارهم أخلفهم الله بتضعيف أعمالهم. والكثرة كحبة بر يتصدق بها فتزرع وتحصد إلى يوم القيامة، أو درهم يتصدق به على فقير فيؤثر به فقيراً آخر وهكذا."}, {"s": "hadith", "q": "من ولي الله؟ وهل المعاداة في الحديث عامة؟ وما معنى: كنت سمعه الذي يسمع به؟", "a": "ولي الله: من يتبع ما شرعه الله. المعاداة التي لأجل ولاية الله لا الخصومة في حق. ومعنى كنت سمعه: أنه لا يسمع ولا يبصر ولا يمشي إلا فيما أذن له الشرع به."}, {"s": "hadith", "q": "ما سبب نزول: لا يكلف الله نفساً إلا وسعها؟", "a": "لما نزلت: وإن تبدوا ما في أنفسكم أو تخفوه يحاسبكم به الله، شق ذلك على الصحابة فقالوا: كُلفنا ما لا نطيق، فقال ﷺ: قولوا سمعنا وأطعنا، فمكثوا حولاً فأنزل الله: لا يكلف الله نفساً إلا وسعها... فنسخت الأولى."}, {"s": "hadith", "q": "لماذا حض النبي ﷺ على التشبه بالغريب وابن السبيل؟", "a": "الغريب إذا دخل بلدة لم ينافس أهلها في مجالسهم ولا يجزع أن يُرى على خلاف عادته في الملبوس، وعابر السبيل لا يتخذ داراً ولا يلج في الخصومات نظراً لقصر لبثه."}, {"s": "hadith", "q": "اذكر آية تدل على معنى حديث: لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به، وسبب نزولها.", "a": "فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم. نزلت في خصومة الزبير مع رجل من الأنصار في الماء، فقال ﷺ: اسق يا زبير ثم سرح الماء إلى جارك، فقال الأنصاري: أن كان ابن عمتك، فقال: يا زبير احبس الماء حتى يبلغ الجدر."}, {"s": "hadith", "q": "ما شروط التوبة كاملة كما في شرح الحديث الثاني والأربعين؟", "a": "الإقلاع عن المعصية، الندم على ما فات، العزم على ألا يعود، وإن كانت في حق آدمي فليبادر بأداء الحق إليه، وإن كانت فيها كفارة فلا بد من الكفارة."}], "mcq": [{"s": "hadith", "q": "حديث (إنما الأعمال بالنيات) رواه:", "o": ["عمر بن الخطاب", "ابن عمر", "أبو هريرة", "علي بن أبي طالب"], "c": 0}, {"s": "hadith", "q": "سند حديث النية:", "o": ["مشهور بالنسبة لآخره غريب بالنسبة لأوله", "متواتر", "غريب مطلقاً", "مشهور مطلقاً"], "c": 0}, {"s": "hadith", "q": "الذي لم يرو حديث النية عن عمر إلا هو:", "o": ["علقمة", "محمد بن إبراهيم التيمي", "يحيى بن سعيد", "مالك"], "c": 0}, {"s": "hadith", "q": "سبب ورود حديث النية:", "o": ["مهاجر أم قيس", "سؤال الأقرع بن حابس", "خطبة مروان", "قصة الزبير"], "c": 0}, {"s": "hadith", "q": "أصول الإسلام على
