أو يفسرونه بالإرادة أو بالنعم والعقوبات. فيقال لهؤلاء: **لا فرقَ بين ما أثبتموه وما نفيتموه، بل القولُ في أحدهما كالقول في الآخر.**\n\n**القاعدة الثانية: القول في الصفات كالقول في الذات.**\nفالله سبحانه ليس كمثله شيء، لا في ذاته، ولا في صفاته، ولا في أفعاله؛ فإذا كان له ذاتٌ حقيقةٌ لا تماثلُ الذوات، فالذاتُ متصفةٌ بصفاتٍ حقيقةٍ لا تماثلُ صفاتِ سائر الذوات.\nفإذا قال القائل: كيف استوى على العرش؟ قيل له – كما قال **ربيعة ومالك** رحمهما الله –: **«الاستواءُ معلوم، والكيفُ مجهول، والإيمانُ به واجب، والسؤالُ عنه بدعة»**. وكذلك إذا قال: كيف ينزل ربُّنا إلى سماء الدنيا؟ قيل له: كيف هو؟ فإذا قال: أنا لا أعلم كيفيتَه، قيل له: ونحن لا نعلم كيفية نزوله؛ إذ العلمُ بكيفية الصفة يستلزمُ العلمَ بكيفية الموصوف.\n\n**القاعدة الثالثة: الاتفاق في الأسماء لا يقتضي التساوي في المسمَّيات.**\nإن الاشتراكَ في الأسماء والصفات لا يستلزمُ تماثلَ المسمَّيات والموصوفات، كما دلَّ على ذلك: السمعُ، والعقل، والحسّ.\n- **من السمع:** سمَّى الله تعالى نفسه: حيّاً، حليماً، رؤوفاً، رحيماً، مَلِكاً، مؤمناً، عزيزاً، جباراً، متكبراً، وسمَّى بعضَ عباده بتلك الأسماء نفسِها، **ولكن ليس الحيُّ الخالقُ كالحيِّ المخلوق، ولا العليمُ كالعليم، ولا الحليمُ كالحليم**، وكذلك في بقية الأسماء.\n\n---\n\n## الباب الثاني: الإيمان بالملائكة\n\n### الصفات الخَلْقية للملائكة\n\n**عِظَمُ خلقهم:** ﴿عَلَيْهَا مَلَائِكَةٌ غِلَاظٌ شِدَادٌ لَّا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾ [التحريم: ٦]. ومما يدل على عِظَم خلقهم:\n* أن النبي ﷺ **رأى جبريلَ عليه السلام على صورته الحقيقية التي خلقه الله عليها مرتين**، وهما المذكورتان في قوله: ﴿وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ﴾ [التكوير: ٢٣]، وقوله: ﴿وَلَقَدْ رَآهُ نَزْلَةً أُخْرَىٰ ٭ عِندَ سِدْرَةِ الْمُنتَهَىٰ﴾ [النجم: ١٣–١٥]. وقالت عائشة رضي الله عنها عن النبي ﷺ: «رأيتُه منهبطاً من السماء، سادّاً عِظَمُ خلقه ما بين السماء إلى الأرض» (مسلم ١٧٧).\n* في صحيح البخاري عن ابن مسعود: **«رأى محمدٌ ﷺ جبريلَ له ستمائة جناح»** (البخاري ٤٨٥٦، ٤٨٥٧).\n* في حديث جابر: «أُذِنَ لي أن أحدِّثَ عن مَلَكٍ من ملائكة الله من حَمَلَة العرش: **إن ما بين شحمة أذنه إلى عاتقه مسيرةُ سبعمائة عام**» (أبو داود ٤٧٢٧، وهو صحيح).\n\n**١ – أجنحة الملائكة:** منهم من له **جناحان**، ومنهم من له **ثلاثة**، أو **أربعة**، ومنهم من له أكثرُ من ذلك: ﴿جَاعِلِ الْمَلَائِكَةِ رُسُلًا أُولِي أَجْنِحَةٍ مَّثْنَىٰ وَثُلَاثَ وَرُبَاعَ يَزِيدُ فِي الْخَلْقِ مَا يَشَاءُ﴾ [فاطر: ١].\n\n**٢ – جمال الملائكة:** خلقهم الله على صورٍ جميلةٍ كريمة: ﴿عَلَّمَهُ شَدِيدُ الْقُوَىٰ ٭ ذُو مِرَّةٍ فَاسْتَوَىٰ﴾ [النجم: ٥–٦]. قال ابن عباس: ﴿ذُو مِرَّةٍ﴾: ذو منظرٍ حسن، وقال قتادة: ذو خَلْقٍ حسن، وقيل: ذو قوة.\n\n**٣ – تفاوتُهم في الخَلق والمنزلة:** ﴿وَمَا مِنَّا إِلَّا لَهُ مَقَامٌ مَّعْلُومٌ﴾ [الصافات: ١٦٤]. **ومن أفضل الملائكة: الذين شهدوا معركةَ بدر** – كما في حديث رفاعة بن رافع: «وكذلك مَن شهد بدراً من الملائكة» (البخاري ٣٩٩٢).\n\n**٤ – لا يملُّون ولا يتعبون:** ﴿يُسَبِّحُونَ اللَّيْلَ وَالنَّهَارَ لَا يَفْتُرُونَ﴾ [الأنبياء: ٢٠]، ومعنى ﴿لَا يَفْتُرُونَ﴾: **لا يَضعُفون**. وقوله: ﴿وَهُمْ لَا يَسْأَمُونَ﴾ [فصلت: ٣٨]، ومعناه: **لا يملُّون**.\n\n**٥ – أعداد الملائكة:** خلقٌ كثيرٌ لا يعلم عددَهم إلا الذي خلقهم: ﴿وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ﴾ [المدثر: ٣١]. ومما يدل على كثرتهم: **البيتُ المعمور** – «يصلي فيه في كل يوم **سبعون ألفَ مَلَك** لا يعودون إليه آخرَ ما عليهم» (البخاري ٢٢٠٧، ومسلم ١٦٢).\n\n### الصفات الخُلُقية للملائكة\n1. **كرامٌ بَرَرة:** ﴿بِأَيْدِي سَفَرَةٍ ٭ كِرَامٍ بَرَرَةٍ﴾ [عبس: ١٥–١٦].\n2. **استحياء الملائكة:** كما في قوله ﷺ لعائشة في قصة استئذان عثمان: «ألا أستحيي من رجلٍ تستحيي منه الملائكة؟» (مسلم ٢٤٠١).\n\n### من قدراتهم\n1. **قدرتُهم على التشكل:** أعطى الله تعالى الملائكةَ القدرةَ على أن يتشكلوا بغير أشكالهم؛ فقد أرسل جبريلَ إلى مريم في صورة بشر، وجاءت الملائكةُ إبراهيمَ في صورة بشر. وكان جبريلُ يأتي الرسولَ ﷺ في صفاتٍ متعددة: **تارةً في صورة دحية بن خليفة الكلبي** رضي الله عنه، وتارةً في صورة أعرابي، كما في حديث جبريل المعروف.\n2. **عِظَمُ سرعتهم:** فهي فوق سرعة الضوء، وهي سرعةٌ لا تُقاس بمقاييس البشر.\n3. **مُنَظَّمون في كل شؤونهم:** «ألا تصُفُّون كما تصُفُّ الملائكةُ عند ربها؟ ... يتمُّون الصفوف، ويتراصُّون في الصف» (مسلم ٤٣٠). ويوم القيامة يأتون صفوفاً منتظمة: ﴿وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا﴾ [الفجر: ٢٢]، ﴿يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا﴾ [النبأ: ٣٨]، **والروحُ هو جبريل عليه السلام**.\n\n### مما يدل على شرفهم\nأن الله يضيفهم إليه إضافةَ تشريف: ﴿كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ﴾ [البقرة: ٢٨٥]، ويقرنُ سبحانه شهادتَهم مع شهادته، وصلاتَهم مع صلاته: ﴿شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ﴾ [آل عمران: ١٨]، ﴿إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ﴾ [الأحزاب: ٥٦]، ويصفهم بالكرم والإكرام والعلو والقُرب.\n\n---\n\n## الباب الثالث: الإيمان بالكتب\n\n* **الإيمانُ بالكتب السابقة:** إيمانٌ **مجمل**، يكون بالإقرار به بالقلب واللسان.\n* **الإيمانُ بالقرآن:** إيمانٌ **مفصَّل**، يكون بالإقرار به بالقلب واللسان، واتباعِ ما جاء فيه، وتحكيمِه في كل كبيرةٍ وصغيرة، **والإيمانِ بأنه كلامُ الله تعالى منزَّلٌ غيرُ مخلوق، منه بدا وإليه يعود**.\n* **من آمن ببعض الكتاب أو ببعض الكتب وكفر بالبعض الآخر: فهو كافرٌ بالجميع**؛ لأنه لا بد من الإيمان بجميع الكتب السماوية وبجميع الرسل: ﴿أَفَتُؤْمِنُونَ بِبَعْضِ الْكِتَابِ وَتَكْفُرُونَ بِبَعْضٍ﴾ [البقرة: ٨٥].\n* **سببُ كفر من كفر بالكتب:** اتباعُ الهوى والظنون الكاذبة، وزعمُهم أن لهم العقلَ والرأي والقياس العقلي، وتسميتُهم أنفسَهم بالحكماء والفلاسفة، وسخريتُهم من الرسل وأتباعهم.\n* **حفظُ الكتب:** اقتضت حكمةُ الله أن تكون **الكتبُ السابقة لآجالٍ معينةٍ ولأوقاتٍ محددة، ووكَلَ حفظَها إلى الذين استُحفِظوا عليها من البشر**: ﴿بِمَا اسْتُحْفِظُوا مِن كِتَابِ اللَّهِ﴾ [المائدة: ٤٤]. **أما القرآنُ الكريم: فقد أنزله الله لكل الأجيال من الأمم في كل الأوطان إلى يوم القيامة، وتولَّى حفظَه بنفسه**: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ [الحجر: ٩].\n\n---\n\n## الباب الرابع: الإيمان بالرسل\n\n### الفرق بين النبي والرسول\nذكر بعضُ أهل العلم **ثلاثة فروق**:\n1. **الرسولُ** من بُعث إلى قومٍ كافرين، **والنبيُّ** من بُعث إلى قومٍ مسلمين.\n2. **الرسولُ** من جاء بشريعةٍ جديدة، **والنبيُّ** من جاء بشريعة مَن قبله من الرسل، كأنبياء بني إسرائيل.\n3. **الرسولُ** من أُنزِلَ عليه كتاب، **والنبيُّ** من حَكَمَ بكتاب من قبله من الرسل.\n\n### تفاضل الرسل\nالرسلُ يتفاضلون: ﴿تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ﴾ [البقرة: ٢٥٣].\n**وأفضلُ الرسل: أولو العزم، وهم خمسة: نوح، وإبراهيم، وموسى، وعيسى، ومحمد** عليهم السلام، وهم المذكورون في قوله تعالى: ﴿وَإِذْ أَخَذْنَا مِنَ النَّبِيِّينَ مِيثَاقَهُمْ وَمِنكَ وَمِن نُّوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَى ابْنِ مَرْيَمَ﴾.\n\n### دين الأنبياء واحد\nإنّ دينَ الأنبياء عليهم السلام **دينٌ واحد** وإن تنوعت شرائعُهم: ﴿شَرَعَ لَكُم مِّنَ الدِّينِ مَا وَصَّىٰ بِهِ نُوحًا وَالَّذِي أَوْحَيْنَا إِلَيْكَ...﴾ [الشورى: ١٣]، وقال ﷺ: **«الأنبياءُ إخوةٌ لِعلَّات، أمهاتُهم شتى ودينُهم واحد»** (البخاري ٣٤٤٣، ومسلم ٢٣٦٥ عن أبي هريرة).\n\n**ودينُ الأنبياء هو دينُ الإسلام** الذي لا يقبل الله غيرَه، وهو: **الاستسلامُ لله تعالى بالتوحيد، والانقيادُ له بالطاعة، والخلوصُ من الشرك وأهله**. فمن استسلمَ له ولغيره كان مشركاً، ومن لم يستسلم له كان مستكبراً، وكلٌّ من المشرك والمستكبر عن عبادة الله تعالى: **كافر**.\n\nوالعملُ المنسوخُ قبل نسخه طاعةٌ لله تعالى، وبعد النسخ يجب العملُ بالناسخ؛ **فمن تمسَّك بالمنسوخ وترك الناسخ فليس هو على دين الإسلام، ولهذا كفر اليهودُ والنصارى؛ لأنهم تمسكوا بشرعٍ مبدَّلٍ منسوخ**.\n\n### دلائل النبوة والمعجزات\n**دلائلُ النبوة:** الأدلةُ التي تُعرف بها نبوةُ النبي الصادق، ويُعرف بها كذبُ المدَّعي للنبوة من المتنبئين الكَذَبة، وهي كثيرةٌ ومتنوعةٌ وغيرُ محصورة، ومنها **المعجزة**.\n\n**المعجزة:** اسمُ فاعلٍ من العَجْز المقابل للقدرة. ومعجزةُ النبي: ما أعجزَ به الخصمَ عند التحدي، والهاءُ فيها للمبالغة. وهي: **أمرٌ خارقٌ للعادة، يُجريه الله تعالى على يد من يختاره لنبوته؛ ليدل على صدقه وصحة رسالته**.\n\n**ومن معجزات الرسل:**\n- **الناقة** التي أُوتيها **صالح** عليه السلام حجةً على قومه.\n- **قلبُ العصا حيةً** آيةً لـ**موسى** عليه السلام.\n- **إبراءُ الأكمه والأبرص وإحياءُ الموتى** آيةً لـ**عيسى** عليه السلام.\n\n### خصائص الرسول ﷺ (ما اختصَّ به عن غيره من الأنبياء)\n1. **أنه خاتَمُ النبيين:** ﴿مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾ [الأحزاب: ٤٠]، وقال ﷺ: «أنا خاتَمُ النبيين»، وقال: «وإنه لا نبيَّ بعدي». وهذا مجمَعٌ عليه؛ **فمن ادَّعى النبوة بعده ﷺ فهو كذَّابٌ ليس من الإسلام في شيء**. وكونُه خاتَمَ النبيين يعني **أن الوحي قد انقطع من السماء**.\n2. **المقامُ المحمود، وهو الشفاعةُ العظمى:** ﴿عَسَىٰ أَن يَبْعَثَكَ رَبُّكَ مَقَامًا مَّحْمُودًا﴾ [الإسراء: ٧٩]، وفي حديث الشفاعة الطويل المتفق عليه: يأتي الناسُ آدمَ، ثم نوحاً، ثم إبراهيم، ثم موسى، ثم عيسى، ثم محمداً ﷺ، فكلُّهم يقول: اذهبوا إلى غيري، **إلا محمداً ﷺ فإنه يقول: أنا لها**، فيَخِرُّ ساجداً إلى أن يؤذن له بالشفاعة.\n3. **عمومُ بعثته إلى الثقلين: الجن والإنس:** ﴿قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللَّهِ إِلَيْكُمْ جَمِيعًا﴾ [الأعراف: ١٥٨]، ﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ﴾ [سبأ: ٢٨]، وهذا مجمَعٌ عليه.\n4. **القرآنُ العظيم**، الذي أذعنَ لإعجازه الثقلان، وأحجمَ عن معارضته بلغاءُ الإنس والجان.\n5. **المعراجُ إلى السماوات العُلى**، إلى سدرة المنتهى، إلى مستوى سمعَ فيه صريفَ الأقلام، فكان قابَ قوسين أو أدنى.\n\n---\n\n## الباب الخامس: الإيمان باليوم الآخر\n\nوفيه ثلاثة فصول: الإيمانُ باليوم الآخر، والإيمانُ بأشراط الساعة، والقيامةُ الكبرى والقيامةُ الصغرى.\n\n### الفصل الأول: الإيمان باليوم الآخر\nاستدلَّ القرآنُ على البعث بطرق، منها:\n* الاستدلالُ بالنشأة الأولى؛ **فإن الإعادة أهونُ من الابتداء**: ﴿يَا أَيُّهَا النَّاسُ إِن كُنتُمْ فِي رَيْبٍ مِّنَ الْبَعْثِ فَإِنَّا خَلَقْنَاكُم مِّن تُرَابٍ...﴾ [الحج: ٥]، ﴿قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾ [يس: ٧٩]، ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾ [الروم: ٢٧].\n* الاستدلالُ بخلق السماوات والأرض؛ **فإن خلقهما أعظمُ من إعادة الإنسان**: ﴿أَوَلَمْ يَرَوْا أَنَّ اللَّهَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَلَمْ يَعْيَ بِخَلْقِهِنَّ بِقَادِرٍ عَلَىٰ أَن يُحْيِيَ الْمَوْتَىٰ﴾ [الأحقاف: ٣٣].\n* الاستدلالُ بتنزيه الله نفسَه عن العبث: ﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا﴾ [المؤمنون: ١١٥]، ﴿أَيَحْسَبُ الْإِنسَانُ أَن يُتْرَكَ سُدًى﴾ [القيامة: ٣٦].\n\nفالناسُ في هذه الدنيا منهم المحسن ومنهم المسيء، وقد يموتون ولا ينال أحدُهم جزاءَ عمله؛ **فلا بد من دارٍ أخرى يُقام فيها العدلُ بين الناس، وينال كلٌّ منهم جزاءَ عمله**.\n\n### الفصل الثاني: الإيمان بأشراط الساعة\n\n**أشراط الساعة:** هي علاماتُها التي تدل على اقترابها ومجيئها.\n\n**وهي تنقسم إلى قسمين:**\n1. **أشراطٌ صغرى:** وهي التي تتقدَّم الساعةَ بأزمانٍ متطاولة، وتكون من نوع المعتاد، كقبض العلم، وظهور الجهل، وشرب الخمر ونحوها. وقد يظهر بعضُها مصاحباً للأشراط الكبرى أو بعدها.\n2. **أشراطٌ كبرى:** وهي الأمورُ العظام التي تظهر قربَ قيام الساعة، وتكون غيرَ معتادة الوقوع؛ كظهور الدجال، ونزول عيسى عليه السلام، وخروج يأجوج ومأجوج، وطلوع الشمس من مغربها.\n\n**وقسَّم بعض العلماء أشراطَ الساعة من حيث ظهورُها إلى ثلاثة أقسام:**\n1. **قسمٌ ظهرَ وانقضى** – وهي من الأشراط الصغرى. ومن هذه الأمارات: **بعثةُ النبي ﷺ، وموتُه ﷺ، وفتحُ بيت المقدس، وقتلُ أمير المؤمنين عثمان بن عفان رضي الله عنه، والحروبُ التي وقعت بين المسلمين بعد مقتله**.\n2. **قسمٌ ظهرَ ولا يزال يتتابعُ ويكثر** (الأمارات المتوسطة) – وهي من الأشراط الصغرى، وهي كثيرة جداً، منها:\n   - «لا تقوم الساعةُ حتى يكون أسعدَ الناس بالدنيا لُكَعُ ابنُ لُكَع» (أحمد ٥/٣٨٩، صحيح)، **واللُّكَع: العبدُ والأحمق واللئيم**.\n   - «يأتي على الناس زمانٌ الصابرُ فيهم على دينه كالقابض على الجمر» (الترمذي ٢١٨٦، صحيح).\n   - «إن من أشراط الساعة أن يُرفَعَ العلم، ويكثرَ الجهل، ويكثرَ الزنى، ويكثرَ شربُ الخمر، ويقلَّ الرجال، ويكثرَ النساء حتى يكون لخمسين امرأةً القيِّمُ الواحد» (البخاري ٥٢٣١، ومسلم ٢٦٧١).\n   - «إذا ضُيِّعت الأمانةُ فانتظر الساعة»، قال: كيف إضاعتُها؟ قال: «إذا وُسِّدَ الأمرُ إلى غير أهله فانتظر الساعة» (البخاري ٥٩، ٦٤٩٦).\n3. **قسمٌ لم يظهر حتى الآن** – وهي **العلاماتُ العظام والأشراطُ الجسام التي تعقبها الساعة**، وأولُها: **ظهورُ المهدي، ثم خروجُ الدجال، ثم نزولُ المسيح عليه السلام**، ثم تتتابع.\n\n**حديث حذيفة بن أسيد الغفاري:** «إنها لن تقوم حتى ترون قبلَها **عشرَ آيات**»، فذكر: **الدخان، والدجال، والدابة، وطلوع الشمس من مغربها، ونزول عيسى ابن مريم، ويأجوج ومأجوج، وثلاثة خسوف: خسفٌ بالمشرق، وخسفٌ بالمغرب، وخسفٌ بجزيرة العرب، وآخرُ ذلك نارٌ تخرج من اليمن تطرد الناسَ إلى محشرهم** (مسلم ٢٩٠١).\n\n#### ١ – ظهور المهدي\nعن ابن مسعود مرفوعاً: «لا تنقضي الأيامُ ولا يذهبُ الدهرُ حتى يملك العربَ **رجلٌ من أهل بيتي، يواطئ اسمُه اسمي**» (أحمد ٣٥٧٣، والترمذي ٢٣٤٥ وقال: حسن صحيح).\n\nوقد تواترت الأحاديثُ واستفاضت بكثرة رواتها عن المصطفى ﷺ بمجيء المهدي، وأنه **من أهل بيته ﷺ**، وأنه **يملك سبعَ سنين**، وأنه **يملأ الأرضَ عدلاً كما مُلِئت ظلماً وجوراً**، ويكون ظهورُه من بلاد المشرق، ويُبايَع له عند الكعبة، وينزل عيسى ابنُ مريم وأميرُ المسلمين هو المهدي.\n\n**وقد انقسم الناسُ في أمر المهدي إلى طرفين ووسط:**\n- **الطرف الأول:** من ينكر خروجَ المهدي، مثل بعض الكتَّاب المعاصرين الذين ليس لهم خبرةٌ بالنصوص وأقوال أهل العلم، وأحاديثُ المهدي قد بلغت حدَّ **التواتر المعنوي** بشهادة كثيرٍ من أهل العلم.\n- **الطرف الثاني:** من يُغالي في أمر المهدي من الطوائف الضالة، حتى ادَّعت كلُّ طائفةٍ لزعيمها أنه المهدي المنتظر.\n- **الوسط:** **أهل السنة والجماعة، الذين يُثبتون خروجَ المهدي على ما وردت به النصوصُ الصحيحة في اسمه، واسم أبيه، وصفاته، ووقت خروجه.**\n\n#### ٢ – خروج الدجال\nتواترت الأحاديثُ من وجوهٍ متعددة في إثبات خروج الدجال وبيان فتنته والاستعاذة منه، وأجمع أهلُ السنة على خروجه في آخر الزمان. **وفتنةُ الدجال أعظمُ الفتن منذ خلق الله آدمَ عليه السلام إلى قيام الساعة**.\n\n- يخرج من **جهة المشرق من خراسان**، **من يهودية أصبهان**، يظهر أولاً في صورة مَلِكٍ من الملوك الجبابرة، ثم يدَّعي النبوة، ثم يدَّعي الربوبية.\n- **ولا يبقى من البلدان إلا وطئه بخيله ورجله غيرَ مكة والمدينة.**\n- حديث أنس بن مالك: «ما بعثَ الله من نبيٍّ إلا أنذرَ قومَه **الأعورَ الكذَّاب**، إنه أعور – وإن ربَّكم ليس بأعور – **مكتوبٌ بين عينيه: كافر**» (البخاري ٧١٣١، ومسلم ٢٩٣٣). وزاد في رواية حذيفة: «**يقرؤه كلُّ مؤمن، كاتبٍ وغير كاتب**» (مسلم ٢٩٣٤).\n- حديث النوَّاس بن سمعان: «... إنه شابٌّ قَطَطٌ، عينُه طافئة... **فمن أدركه منكم فليقرأ عليه فواتحَ سورة الكهف**».\n- **ويكون نزولُ عيسى ابن مريم عليه السلام – مسيحِ الهدى – في أيام مسيح الضلالة**، فيجتمع عليه المؤمنون، فيسير بهم قاصداً نحو الدجال، **فيلحقه عند باب مدينة (لُدّ) فيقتله بحربته**، ويقول له: «إن لي فيك ضربةً لن تفوتَني»، وإذا واجهه الدجالُ فإنه **يذوبُ كما ينحلُّ الملحُ في الماء**.\n- **وسيكون أكثرُ أتباعه الأعرابَ لغلبة الجهل عليهم، وأما النساء فحالُهن أشدُّ من الأعراب.**\n\n### الفصل الثالث: القيامة الصغرى والقيامة الكبرى\n\n#### الروح والنفس\n**حقيقة الروح:** مذهبُ أهل السنة أن الروحَ **عينٌ قائمةٌ بنفسها**، تفارقُ البدنَ، وتنعَّم وتعذَّب، ليست هي البدن، ولا جزءاً من أجزائه، وليست من جنس الأجسام المتميزات المشهودة المعهودة. ولا اختصاصَ للروح بشيءٍ من الجسد، بل هي **ساريةٌ في الجسد** كما تسري الحياةُ التي هي عَرَضٌ في جميع الجسد. **وروحُ الآدمي مخلوقةٌ مُبدَعةٌ باتفاق سلف الأمة وأئمتها وسائر أهل السنة**، ولم يخالف في ذلك إلا الفلاسفة ومن تبعهم.\n\n**هل الروح والنفس شيءٌ واحد أو شيئان متغايران؟** اختلف الناس؛ فمنهم من قال: إنهما شيءٌ واحد، **وهم الجمهور**، ومنهم من قال: إنهما متغايران. **والتحقيق:** أن لفظَ الروح والنفس يُعبَّر بهما عن عدة معانٍ، فيتحد مدلولُهما تارةً، ويختلف تارة؛ فالنفسُ تُطلق على: الروح، والذات، والدم. والروحُ تُطلق على: القرآن، وجبريل عليه السلام، والوحي، والهواء الخارج من البدن والداخل فيه، وعلى ما يحصل بفراقه الموت.\n\n**أنواع تعلُّق الروح بالبدن خمسة، متغايرة الأحكام:**\n1. تعلقُها به في بطن الأم جنيناً.\n2. تعلقُها به بعد خروجه إلى وجه الأرض.\n3. تعلقُها به حالَ النوم؛ فلها به تعلقٌ من وجه، ومفارقةٌ من وجه.\n4. تعلقُها به في البرزخ؛ فإنها وإن فارقته وتجردت عنه فإنها لم تفارقه فراقاً كلياً، فقد دلَّت الأحاديث على ردِّها إليه عند سؤال الملَكَين وعند سلام المسلِّم، وهذا الردُّ **إعادةٌ خاصةٌ لا توجب حياةَ البدن قبل يوم القيامة**.\n5. تعلقُها به **يوم يُبعث الأجساد، وهو أكملُ تعلقاتها بالبدن؛ إذ هو تعلقٌ لا يقبل البدنُ معه موتاً ولا نوماً ولا فساداً**.\n\n#### فتنة القبر وعذابه ونعيمه\n**البرزخ لغةً:** الحاجزُ بين الشيئين. وفي البرزخ نموذجٌ من العذاب أو النعيم الأخروي؛ **فهو أولُ منزلٍ من منازل الآخرة**، ففيه سؤالُ الملَكين، ثم العذابُ أو النعيم. ودليلُه: ﴿وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾ [المؤمنون: ٩٩–١٠٠].\n\n**أولاً: سؤال الملَكين** – ويُسمَّى **فتنةَ القبر**، وهي الامتحانُ والاختبار للميت حين يسأله الملَكان.\n- وقد **تواترت الأحاديثُ** عن النبي ﷺ في هذه الفتنة من حديث **البراء بن عازب، وأنس بن مالك، وأبي هريرة** وغيرهم.\n- **وهي عامةٌ للمكلفين إلا النبيين**، فقد اختُلِف فيهم.\n- وكذلك اختُلِف في غير المكلفين كالصبيان والمجانين، فقيل: لا يُفتنون، وقيل: يُفتنون، **ولعل الراجح أنهم لا يُفتنون؛ لأن المحنةَ إنما تكون للمكلفين**.\n- **وهل السؤال عامٌّ في حق المسلمين والمنافقين والكفار أو يختص بالمسلم والمنافق؟** قيل: يختص بالمسلم والمنافق دون الكافر الجاحد المعطِّل. **وقيل: السؤالُ في القبر عامٌّ للكافر والمسلم، وهذا هو الذي يدل عليه الكتابُ والسنة، واستثناءُ الكافر من هذا لا وجهَ له.**\n- **اسما الملَكين: منكر ونكير** – «أتاه ملَكان أسودان أزرقان، يُقال لأحدهما: المنكر، والآخر: النكير» (الترمذي ١٠٨٣، وابن حبان ٣١١٧، حسن).\n\n**مسائلُ تدل عليها أحاديثُ فتنة القبر:**\n1. أن السؤال يحصل **حين يوضع الميت في قبره**، وفيه **ردٌّ على من زعم من أهل البدع من المعتزلة أن السؤال يقع بين النفختين**.\n2. **تسميةُ الملَكين منكراً ونكيراً**، وفيه **ردٌّ على من زعم من المعتزلة أنه لا يجوز تسميتُهما بذلك**.\n3. أن روحَ الميت **تُرَدُّ إليه في قبره حين السؤال**، وأنه يُجلَس ويُستنطَق. وفيه ردٌّ على من نفى ذلك، إلا إن كان يريد نفيَ الحياة المعهودة في الدنيا فهذا صحيح؛ فإن عودَ الروح إلى بدن الميت ليس مثلَ عودها إليه في هذه الحياة الدنيا.\n\n**ثانياً: عذاب القبر ونعيمه**\n**مذهبُ أهل السنة والجماعة:** أن الميت إذا مات **يكون في نعيمٍ أو عذاب**، وأن ذلك **يحصل لروحه وبدنه**، وأن الروح تبقى بعد مفارقة البدن **مُنعَّمةً أو معذَّبة**، وأنها **تتصل بالبدن أحياناً** فيحصل له معها النعيمُ أو العذاب. **فأهل السنة والجماعة يتفقون على أن النفس تنعَّم وتعذَّب منفردةً عن البدن، وتنعَّم وتعذَّب متصلةً بالبدن، والبدن متصلٌ بها.**\n\n**من أدلة عذاب القبر ونعيمه من القرآن:**\n1. ﴿وَلَوْ تَرَىٰ إِذِ الظَّالِمُونَ فِي غَمَرَاتِ الْمَوْتِ وَالْمَلَائِكَةُ بَاسِطُو أَيْدِيهِمْ أَخْرِجُوا أَنفُسَكُمُ **الْيَوْمَ تُجْزَوْنَ** عَذَابَ الْهُونِ﴾ [الأنعام: ٩٣]؛ ولو تأخر ذلك عنهم إلى انقضاء الدنيا لَما صحَّ أن يُقال لهم: ﴿الْيَوْمَ تُجْزَوْنَ﴾، فدلَّ على أن المراد به **عذاب القبر**.\n2. ﴿وَإِنَّ لِلَّذِينَ ظَلَمُوا عَذَابًا دُونَ ذَٰلِكَ﴾ [الطور: ٤٥–٤٧].\n\n**ومن أدلة السنة: حديث البراء بن عازب الطويل**، وفيه استعاذةُ النبي ﷺ من عذاب القبر ثلاثَ مرات، ووصفُ نزول ملائكة الرحمة للمؤمن ومعهم كفنٌ وحَنوطٌ من الجنة، وأن روحه الطيبة تخرج كما تسيل القطرةُ من فِي السقاء، ويُصعَد بها حتى ينتهي بها إلى السماء التي فيها الله، فيقول الله عز وجل: **اكتبوا كتابَ عبدي في عِلِّيين**، ثم تُعاد روحُه في جسده، فيأتيه ملَكان فيقولان: **مَن ربُّك؟ وما دينُك؟ وما هذا الرجلُ الذي بُعث فيكم؟** فيجيب المؤمنُ ويثبِّته الله، وينادي منادٍ من السماء: **أن صدقَ عبدي، فأفرِشوه من الجنة، وافتحوا له باباً إلى الجنة**. وأما الكافر: فتنزل إليه ملائكةٌ سودُ الوجوه ومعهم المسوح، وتخرج روحُه كما ينتزع السَّفُّودُ من الصوف المبلول، ويقول الله: **اكتبوا كتابَه في سجِّين في الأرض السفلى**، ثم تُعاد روحُه في جسده، فيقول عند السؤال: **هاه هاه لا أدري**، فينادي منادٍ من السماء: **أن كذبَ عبدي، فأفرِشوه من النار، وافتحوا له باباً إلى النار**، ويُضيَّق عليه قبرُه حتى تختلف أضلاعُه. (أحمد، وأبو داود ٤٧٥٣، وهو صحيح). وقد **ذهب إلى موجَب هذا الحديث جميعُ أهل السنة والحديث**.\n\n---\n\n## الباب السادس: الإيمان بالقضاء والقدر\n\n### الفصل الأول: تعريف القضاء والقدر\n\n**أولاً: القضاء**\n- **لغةً:** يأتي لمعانٍ منها: **الفصل، والحكم**، **وأصلُه: القطع والفصل**؛ يقال: قضى يقضي قضاءً فهو قاضٍ: إذا حكم وفصل. وقضاءُ الشيء: إحكامُه وإمضاؤه والفراغُ منه، فيكون **بمعنى الخلق**. ومرجعُ وجوه القضاء في اللغة إلى انقضاء الشيء وتمامه؛ وكلُّ ما أُحكِم عملُه، أو أُتِمَّ، أو أُدِّي، أو أُوجِب، أو أُعلِم، أو نُفِّذ، أو أُمضي: فقد قُضي.\n\n**ثانياً: القدَر**\n- **لغةً:** القضاءُ والحكم، ومبلغُ الشيء. والتقدير: الترويةُ والتفكُّر في تسوية الأمر.\n- **اصطلاحاً:** **ما سبق به العلمُ وجرى به القلمُ مما هو كائنٌ إلى الأبد**، وأنه عز وجل قدَّر في الأزل مقاديرَ الخلائق، وما يكون من الأشياء قبل أن تكون، وعَلِمَ سبحانه أنها ستقع في أوقاتٍ معلومةٍ عنده تعالى، وعلى صفاتٍ مخصوصة، فهي تقع على حسب ما قدَّرها.\n\n**وللعلماء في التفرقة بين (القضاء) و(القدَر) قولان:**\n1. **الأول:** القضاءُ هو العلمُ السابق الذي حكمَ الله تعالى به في الأزل، والقدَرُ: وقوعُ الخلق على وزن المقضيِّ السابق.\n2. **الثاني (عكسُ الأول):** فالقدَرُ هو الحكمُ السابق، **والقضاءُ هو الخلق**.\n\nوبناءً على القول الثاني **يكون القضاءُ من الله تعالى أخصَّ من القدَر**؛ لأنه الفصلُ بين التقديرَين؛ فالقدَر هو التقدير، والقضاءُ هو الفصلُ والقطع. **فالقضاءُ والقدَر أمران متلازمان، لا ينفكُّ أحدُهما عن الآخر؛ لأن أحدهما بمنزلة الأساس وهو القدَر، والآخر بمنزلة البناء وهو القضاء.**\n\n### الفصل الثاني: أركان الإيمان بالقضاء والقدَر\n\nالإيمانُ بالقضاء والقدَر يقوم على **أربعة أركان**، من أقرَّ بها جميعاً فإن إيمانه يكون مكتملاً، ومن انتقصَ واحداً منها أو أكثر فقد اختلَّ إيمانُه بالقضاء والقدَر:\n\n1. **الركن الأول: الإيمانُ بعلم الله تعالى الشامل المحيط.**\n   فعلمُ الله تعالى محيطٌ بكل شيء، يعلم ما كان وما سيكون، وما لم يكن لو كان كيف يكون، ويعلم الموجودَ والمعدوم، والممكنَ والمستحيل. وهو عالِمٌ بالعباد وآجالهم وأرزاقهم وأحوالهم وحركاتهم وسكناتهم وشقاوتهم وسعادتهم، ومَن منهم من أهل الجنة ومَن منهم من أهل النار، **عالِمٌ بكل ذلك قبل أن يخلقهم ويخلق السماوات والأرض**. ومن أدلته: ﴿عَالِمُ الْغَيْبِ وَالشَّهَادَةِ﴾ [الحشر: ٢٢]، ﴿وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا﴾ [الطلاق: ١٢]، ﴿وَلَوْ رُدُّوا لَعَادُوا لِمَا نُهُوا عَنْهُ﴾ [الأنعام: ٢٨]. وسُئل النبي ﷺ عن أولاد المشركين فقال: **«اللهُ أعلمُ بما كانوا عاملين»** (مسلم ٢٦٥٦).\n\n2. **الركن الثاني: الإيمانُ بأن الله تعالى كتبَ في اللوح المحفوظ كلَّ شيء.**\n   - حديث عبد الله بن عمرو بن العاص: «**كتبَ الله مقاديرَ الخلائق قبل أن يخلق السماوات والأرض بخمسين ألف سنة، وعرشُه على الماء**». وفي رواية الترمذي: «**قدَّرَ الله المقاديرَ قبل أن يخلق السماوات والأرض بخمسين ألف سنة**» (الترمذي ٢٠٥٥).\n   - حديث عبادة بن الصامت: «**إن أولَ ما خلق الله القلمَ فقال: اكتب، قال: ما أكتب؟ قال: اكتب القدَرَ ما كان وما هو كائنٌ إلى الأبد**» (البخاري ٤٩٤٩، ومسلم ٢٦٤٧).\n   - **وأسماءُ اللوح المحفوظ في القرآن:** الكتاب، والكتاب المبين، والإمام المبين، وأمُّ الكتاب، والكتاب المسطور. ﴿بَلْ هُوَ قُرْآنٌ مَّجِيدٌ ٭ فِي لَوْحٍ مَّحْفُوظٍ﴾ [البروج: ٢١–٢٢]، ﴿وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ فِي إِمَامٍ مُّبِينٍ﴾ [يس: ١٢]، ﴿وَإِنَّهُ فِي أُمِّ الْكِتَابِ لَدَيْنَا لَعَلِيٌّ حَكِيمٌ﴾ [الزخرف: ٤].\n\n3. **الركن الثالث: الإيمانُ بمشيئة الله تعالى الشاملة وقدرته النافذة.**\n   فما شاء الله تعالى كان، وما لم يشأ لم يكن، وأنه **لا حركةَ ولا سكونَ في السماوات ولا في الأرض إلا بمشيئته**، فلا يكون في مُلكه إلا ما يريد. ومن أدلته: ﴿وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ﴾ [التكوير: ٢٩]، ﴿وَلَوْ شَاءَ رَبُّكَ مَا فَعَلُوهُ﴾ [الأنعام: ١١٢]، ﴿مَن يَشَإِ اللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾ [الأنعام: ٣٩].\n\n4. **الركن الرابع: الإيمانُ بأن الله تعالى خلقَ كلَّ شيء.**\n   فهو الذي خلقَ الخلقَ وكوَّنَهم وأوجدَهم، فهو الخالق، وما سواه مخلوقٌ مربوب: ﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ﴾ [الزمر: ٦٢].\n\n### الفصل الثالث: أفعال العباد\n\n**مراتب القضاء والقدر أربع:**\n1. **العلم:** وهو علمُه تعالى بكل شيء مما كان وما سيكون.\n2. **الكتابة:** وهي كتابتُه تبارك وتعالى لكل شيءٍ في الأزل.\n3. **المشيئة والإرادة:** وهي أن كل شيءٍ خاضعٌ لمشيئته وإرادته.\n4. **الخلق:** وهو خلقُه تعالى لكل شيءٍ ومنها أفعالُ العباد.\n\n* **أما المرتبتان الأوليان – العلم والكتابة –** فلم ينكرهما إلا **غلاةُ القدرية**، الذين يقولون: **إنّ الأمر أنُف** (أي: لم يسبق لله تعالى فيه علم)، وقد نشأوا في أواخر عهد الصحابة رضي الله عنهم، **وتبرَّأ منهم من أدركهم من الصحابة**، كما هو معروفٌ في قصة ابن عمر في أول حديثٍ في صحيح مسلم. أما بقيةُ الطوائف فهم مُقِرُّون بهاتين المرتبتين.\n* **وأما المرتبتان الأخريان – المشيئة والخلق –** فقد وقع فيهما الخلافُ على قولين:\n  1. **إنكارُ هاتين المرتبتين، وهو مذهب المعتزلة ومن وافقهم**، الذين ينكرون أن تكون مشيئةُ الله تعالى لها تعلقٌ بأفعال العباد وطاعاتهم ومعاصيهم، **ويزعمون أنه تعالى لا يخلق أفعالَ العباد، وإنما العبادُ هم الخالقون لأفعالهم**.\n  2. **الإقرارُ بهاتين المرتبتين** بإثبات الإرادة والمشيئة الشاملة، والقولِ بأن الله تعالى خالقُ كلِّ شيء، ومن ذلك أفعالُ العباد، **وهذا قولُ جمهور الأمة، من أهل السنة وغيرهم حتى الجهمية**.\n\n**ولكن أفعال العباد لها تعلُّقان:**\n- **أحدهما:** تعلقٌ بالخالق تعالى، وأنه تعالى خالقٌ لأفعالهم، وهذا قد حصل فيه الاتفاقُ بين أهل السنة وبين المتكلمين من أتباع المذاهب الفقهية السُّنِّيَّة.\n- **والثاني:** تعلقٌ بالعبد، **وهل له قدرة، وهل له إرادة، وهل قدرتُه مؤثرةٌ أو غير مؤثرة؟** وهذا الشقُّ وقع فيه الخلافُ الكبير بين المقرِّين بهاتين المرتبتين:\n  1. **فمن قائل:** إن العباد **مجبورون** على أعمالهم، لا قدرةَ لهم ولا إرادةَ ولا اختيار، والله تعالى وحده هو خالق أفعال العباد، وأعمالُهم إنما تنسب إليهم مجازاً، وحركتُهم واختيارُهم كورق الشجر تحركه الرياح، وكحركة الشمس والقمر والأفلاك، **وهذا مذهب الجبرية وأشهر فرقهم: الجهمية**.\n  2. **ومن قائل:** إن أفعال العباد ليست مخلوقةً لله تعالى، وإنما **العبادُ هم الخالقون لها**، ولهم إرادةٌ وقدرةٌ مستقلةٌ عن إرادة الله تعالى وقدرته، **وهذا قول المعتزلة**.\n\n---\n\n## الباب السابع: نواقض الإيمان\n\n### مدخل: منهج أهل السنة والجماعة في باب نواقض الإيمان\n\nهناك ما يقدَحُ في الإيمان وينقُصُه ولا ينافيه بالكلية؛ فإذا وُجِدت عند المسلم **قَدَحَت في إيمانه ونقَصَته، ولم يخرج من دين الإسلام**، وهي المعاصي التي لا تصل إلى درجة الشرك الأكبر أو الكفر الأكبر أو النفاق الأكبر، وعلى رأسها: **وسائلُ الشرك الأكبر، والشركُ الأصغر، والكفرُ الأصغر، والنفاقُ الأصغر، والبدعة**.\n\n**الناسُ في باب نواقض الإيمان ثلاثةُ أقسام: طرفان ووسط:**\n\n* **الطرف الأول: الخوارج** – الذين **يغالون في التكفير** والحكم على الناس بالكفر، ويكفِّرون الناسَ من غير رويَّةٍ أو فقهٍ أو معرفةٍ جيدةٍ للإسلام. وهذا مبدأُ الخوارج الذين خرجوا في عهد الخلفاء الراشدين وفي العهود المتأخرة، وهؤلاء يكفِّرون المسلمين ويغالون في الكفر، **فكلُّ من خالفهم كفَّروه واستحلُّوا دمَه**.\n  **وسببُ هذا الانحراف عندهم:** أنهم يأخذون النصوصَ التي تدل بظاهرها على الكفر أو على الشرك على ظاهرها **دون أن يجمعوا بينها وبين النصوص الأخرى التي تفسرها وتوضحها**؛ فإن الكفرَ ينقسم إلى قسمين: أكبرَ وأصغر، وكذلك الشرك. **والخوارج لا يفرقون بين هذا وذاك**، فليس عندهم كفرٌ أصغر ولا شركٌ أصغر، بل الكفرُ والشركُ عندهم شيءٌ واحد، وهو الخروجُ من الدين؛ **وذلك لعدم فقههم وعدم تمكنهم من العلم**.\n\n* **الطرف الثاني: المرجئة** – الذين يقولون: **الإيمانُ بالقلب، ولم يُدخِلوا فيه العمل**، فلو عمِلَ ما عمِلَ فإنه لا يكفر. ويقولون: **لا يضرُّ مع الإيمان معصية، ولا ينفع مع الكفر طاعة**، وأخذوا بنصوص الوعد التي فيها وعدُ الله بالمغفرة والرحمة، ولم يجمعوا بينها وبين نصوص الوعيد التي فيها التحذيرُ من الكفر والشرك والذنوب والمعاصي. **وهؤلاء على النقيض من الخوارج؛ أخذوا بنصوص الوعد واعتمدوا على الرجاء فقط، كما أن الخوارج أخذوا بنصوص الوعيد وتركوا نصوصَ الوعد والرحمة والرجاء.**\n\n* **الطرف الثالث (الوسط): أهلُ السنة والجماعة** – وهم وسطٌ بين المذهبين، **يجمعون بين النصوص**، ويقولون: إن الكفرَ في القرآن والسنة ينقسمان إلى قسمين: أكبرَ وأصغر، والذنوبُ التي دون الشرك لا يكفر صاحبُها.\n  **فالكفرُ والشركُ الأكبر يُخرجان من الملة، والشركُ الأصغر والكفرُ الأصغر لا يُخرجان من الملةِ خلافاً للخوارج، ولكنهما ينقصان الإيمانَ خلافاً للمرجئة**، فهم في طرفي نقيض، وأهلُ السنة والجماعة وسط، جمعوا بين نصوص الوعد والوعيد، وجمعوا بين الخوف والرجاء.\n\n### الفصل الأول: في الشرك\n\n#### المبحث الأول: في الشرك الأكبر\n\nإنّ أعظمَ ما جاء به الرسول ﷺ من عند الله تعالى، وأولَ ما أمرَ الله تعالى به: **عبادةُ الله وحده لا شريك له، وإخلاصُ الدين له وحده**: ﴿يَا أَيُّهَا الْمُدَّثِّرُ ٭ قُمْ فَأَنذِرْ ٭ وَرَبَّكَ فَكَبِّرْ﴾ [المدثر: ١–٣]. ومعنى ﴿وَرَبَّكَ فَكَبِّرْ﴾: عظِّم ربَّك بالتوحيد وإخلاص العبادة له وحده لا شريك له، وهذا **قبل الأمر بالصلاة والزكاة والصوم والحج**. ومعنى ﴿قُمْ فَأَنذِرْ﴾: أنذِر عن الشرك في عبادة الله تعالى وحده، وهذا **قبل الإنذار عن الزنا والسرقة والربا وظلم الناس**.\n\n**وهذا الأصل هو أعظمُ أصول الدين وأفرضُها، ولأجله خلقَ الله الخلق، ولأجله أرسلَ الرسل، وأنزلَ الكتب، ولأجله تفرَّقَ الناسُ بين مسلمٍ وكافر.**\n\n**تعريف الشرك:**\n- **لغةً:** يدل على **المقارنة** التي هي **ضد الانفراد**، وهو أن يكون الشيءُ بين اثنين لا ينفرد به أحدُهما؛ يقال: لا تُشرك بالله تعالى، أي: لا تعدِل به غيرَه فتجعله شريكاً له.\n- **اصطلاحاً:** **أن يتخذ العبدُ لله تعالى نِدّاً يسوِّيه به في ربوبيته، أو ألوهيته، أو أسمائه وصفاته.**\n\n**حكم الشرك:** الشركُ **أعظمُ ذنبٍ عُصي الله تعالى به**، فهو **أكبرُ الكبائر، وأعظمُ الظلم**؛ لأن الشرك صرفُ خالصِ حقِّ الله تعالى – وهو العبادة – لغيره، أو وصفُ أحدٍ من خلقه بشيءٍ من صفاته التي اختصَّ بها: ﴿إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾ [لقمان: ١٣].\n\n**ولذلك رتَّب الشرعُ عليه آثاراً وعقوباتٍ عظيمة، أهمُّها:**\n1. **أن الله تعالى لا يغفره** إذا مات صاحبُه ولم يتب منه: ﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾ [النساء: ٤٨].\n2. **أن صاحبَه خارجٌ من ملة الإسلام.**\n3. **أن الله تعالى لا يقبل من المشرك عملاً**، وما عمله من أعمالٍ سابقة تكون هباءً منثوراً: ﴿وَقَدِمْنَا إِلَىٰ مَا عَمِلُوا مِنْ عَمَلٍ فَجَعَلْنَاهُ هَبَاءً مَّنثُورًا﴾ [الفرقان: ٢٣]، ﴿لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ﴾ [الزمر: ٦٥].\n4. **أن دخول الجنة عليه حرام، وهو مخلَّدٌ في نار الجحيم**: ﴿إِنَّهُ مَن يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ﴾ [المائدة: ٧٢].\n\n**أقسام الشرك:** الشركُ على قسمين: **شركٌ أكبر، وشركٌ أصغر**.\n- **ضابط الأول (الأكبر):** أن يتخذ العبدُ لله تعالى نِدّاً يحبه كمحبته، أو يرجوه أو يخافه أو يدعوه أو يصرف له نوعاً من العبادة الظاهرة أو الباطنة، **وهذا شركٌ مخرجٌ من دائرة الإسلام ومِلَّته**، وصاحبُه متوعَّدٌ أشدَّ الوعيد إن أصرَّ عليه ولقي الله به.\n- **ضابط الثاني (الأصغر):** أنه **كلُّ وسيلةٍ يُتوسَّل بها ويُتوصَّل من طريقها إلى الشرك** بشرط أن لا يبلغ ذلك مرتبةَ العبادة، **وهو غيرُ مخرجٍ من الملة**، ويُخاف على صاحبه؛ إذ هو تحت مشيئة الله تعالى كسائر الذنوب والمعاصي والكبائر. **ومن أمثلته: الحلف بغير الله تعالى، والرياء**، ونحو ذلك من الأقوال والأفعال المؤدية إلى الشرك.\n\n**أقسام الشرك الأكبر ثلاثة أقسام رئيسة:**\n\n**القسم الأول: الشرك في الربوبية** – وهو أن يجعل لغير الله تعالى معه نصيباً من المُلك، أو التدبير، أو الخلق، أو الرزق الاستقلالي. ومن صوره:\n1. **شركُ النصارى** الذين يقولون: الله ثالثُ ثلاثة، **وشركُ المجوس** القائلين بإسناد حوادث الخير إلى النور – وهو عندهم الإلهُ المحمود – وحوادثِ الشر إلى الظلمة – وهو عندهم الإلهُ المذموم.\n2. **شركُ القدرية** الذين يزعمون أن الإنسان يخلق أفعالَه.\n3. **شركُ كثيرٍ ممن يعبدون القبور**، الذين يعتقدون أن أرواح الأموات تتصرف بعد الموت، فتقضي الحاجات وتفرِّج الكربات.\n4. **الاستسقاء بالنجوم:** باعتقاد أنها مصدر السقيا، وأنها تنزل الغيث بدون مشيئة الله تعالى، وأعظمُ من ذلك أن يعتقد أنها تتصرف في الكون بالخلق أو الرزق أو الإحياء أو الإماتة أو بالشفاء أو المرض أو الربح أو الخسارة.\n\n**القسم الثاني: الشرك في الألوهية** – وهو اعتقادُ أن غير الله تعالى يستحق أن يُعبَد، أو صرفُ شيءٍ من العبادة لغيره. **وأنواعُه ثلاثة:**\n1. **النوع الأول: اعتقادُ شريكٍ لله تعالى في الألوهية**؛ فمن اعتقد أن غير الله يستحق العبادةَ مع الله، أو يستحق أن يُصرف له أيُّ نوعٍ من أنواع العبادة: فهو مشركٌ في الألوهية.\n2. **النوع الثاني: صرفُ شيءٍ من العبادات المحضة لغير الله تعالى** – فالعبادات المحضة بأنواعها: القلبية، والقولية، والعملية، والمالية: حقٌّ لله تعالى لا يجوز أن تُصرف لغيره. **وله صورٌ كثيرة يمكن حصرُها في أمرين:**\n   - **الأمر الأول: الشرك في دعاء المسألة** – وهو أن يطلب العبدُ من ربه جلبَ مرغوب، أو دفعَ مرهوب. **ويدخل في دعاء المسألة: الاستعانة، والاستعاذة، والاستغاثة، والاستجارة.**\n   - **الأمر الثاني: الشرك في دعاء العبادة** – ودعاءُ العبادة هو: عبادةُ الله تعالى بأنواع العبادات القلبية والقولية والفعلية، كالمحبة، والرجاء، والصلاة، والصيام، والذبح، وقراءة القرآن، وذكر الله تعالى. ويدخل في هذا النوع: شركُ النية والإرادة والقصد، والشركُ في الخوف، والمحبة، والرجاء، والصلاة والسجود والركوع، والذبح، والنذر والزكاة والصدقة، والصيام والحج، والطواف.\n3. **النوع الثالث: الشرك في الحكم والطاعة**\n   - **أما الطاعة:** فأن يطيع المرءُ غيرَ الله تعالى فيما لا يجوز أن يُطاع فيه سوى الله عز وجل.\n   - **وأما الشرك في الحكم فله صورٌ كثيرة، منها:**\n     1. أن يعتقد أحدٌ أن **حكم غير الله تعالى أفضلُ من حكم الله أو مثلُه**، وهذا **شركٌ أكبرُ مخرجٌ من الملة**؛ لأن صاحبَه مكذِّبٌ للقرآن الكريم.\n     2. أن يعتقد أحدٌ **جوازَ الحكم بغير ما أنزل الله تعالى**، وهذا **شركٌ أكبرُ أيضاً**.\n     3. أن **يضع تشريعاً أو قانوناً مخالفاً لما جاء في كتاب الله وسنة رسوله ﷺ ويحكم به معتقداً جوازَ الحكم بهذا القانون**.\n\n#### المبحث الثالث: من وسائل الشرك — التبرُّك\n\n**التبرك البدعي:** هو التبركُ بما لم يرِد دليلٌ شرعيٌّ على جواز التبرك به، معتقداً أن الله تعالى جعل فيه بركة، أو التبركُ بالشيء الذي وردَ التبركُ به على غير الوجه الذي وردَ في الشرع التبركُ به.\n\n**وهذا محرَّم؛ لأن فيه إحداثَ عبادةٍ لا دليل عليها من كتابٍ أو سنة، ولأنه جعلَ ما ليس بسببٍ سبباً، فهو من الشرك الأصغر، ولأنه يؤدي إلى الوقوع في الشرك الأكبر.**\n\n**وينقسم التبرك البدعي إلى ثلاثة أنواع:**\n1. **التبرك الممنوع بالأولياء والصالحين:** وردَت أدلةٌ كثيرة تدل على مشروعية التبرك بجسد وآثار النبي ﷺ، كشَعره وعَرَقه وثيابه. **أما غيرُ النبي ﷺ من الأولياء والصالحين: فلم يرِد دليلٌ صحيحٌ صريحٌ يدل على مشروعية التبرك بأجسادهم ولا بآثارهم**؛ ولذلك لم يرِد عن أحدٍ من أصحاب النبي ﷺ ولا أحدٍ من التابعين أنهم تبركوا بجسد أو آثار أحدٍ من الصالحين، فلم يتبركوا بأفضل هذه الأمة بعد نبيها وهو أبو بكر الصديق رضي الله عنه، ولا بغيره من العشرة المبشرين بالجنة، ولا بأحدٍ من أهل البيت ولا غيرهم، **فإجماعُهم على ترك التبرك دليلٌ على عدم مشروعيته**.\n   **ومن مظاهر التبرك بالصالحين:** التمسُّح بهم، ولبسُ ثيابهم أو الشرب بعد شربهم طلباً للبركة؛ وتقبيلُ قبورهم والتمسحُ بها وأخذُ ترابها؛ وعبادةُ الله تعالى عند قبورهم تبركاً بها.\n2. **التبرك بالأزمان والأماكن والأشياء التي لم يرِد في الشرع ما يدل على مشروعية التبرك بها:** ومن أمثلتها:\n   - الأماكنُ التي مرَّ بها النبي ﷺ أو تعبَّدَ لله فيها اتفاقاً من غير قصدٍ لها لذاتها. **ولذلك لم يثبت عن أحدٍ من الصحابة أنه قصدَ شيئاً من هذه الأماكن للتبرك بها بتقبيلٍ أو لمسٍ أو غيرها.** وقد ثبت عنه ﷺ: «**لا تُشَدُّ الرِّحالُ إلا إلى ثلاثة مساجد: مسجدي هذا، والمسجد الحرام، والمسجد الأقصى**» (البخاري ١١٨٩، ومسلم ١٣٩٧). وثبت عن عمر بن الخطاب رضي الله عنه لما رأى الناس ينزلون في مسجدٍ صلى فيه النبي ﷺ: «**إنما هلكَ مَن كان قبلَكم أنهم اتخذوا آثارَ أنبيائهم بِيَعاً، من مرَّ بشيءٍ من هذه المساجد فحضرت الصلاة: فليصلِّ، وإلا فليمضِ**».\n   - التبركُ ببعض الأشجار وبعض الأحجار وبعض الأعمدة وبعض الآبار والعيون التي يظن بعضُ العامة أن لها فضلاً.\n\n### الفصل الثاني: في الكفر\n\n#### أقسام الكفر\n**أبرزُ اعتبارات تقسيم الكفر ثلاثة:**\n- **الأول:** أقسامه باعتبار حكمه.\n- **الثاني:** أقسامه باعتبار بواعثه وأسبابه.\n- **الثالث:** أقسامه باعتبار كونه طارئاً أم أصلياً.\n\n**التقسيم الأول: أقسامه باعتبار حكمه** — ينقسم إلى قسمين:\n1. **القسم الأول: كفرٌ أكبر**، مخرجٌ من الملة، وهو **مضادٌّ لأصل الإيمان**، و**موجبٌ للخلود في النار**، ويشمل أنواعاً كثيرة.\n2. **القسم الثاني: كفرٌ أصغر**، وهو **يضادُّ كمال الإيمان الواجب**، ويضادُّ الشكرَ الذي هو العمل بالطاعة، وهو **موجبٌ لاستحقاق الوعيد، ولا يُخرِجُ من الدين**، والمعاصي كلها من هذا النوع، كما سمَّى الله تعالى ورسوله ﷺ بعضَها كفراً.\n   **ويُسمَّى هذا النوع: بالكفر الأصغر، و(كفرٍ دون كفر)، و(كفر النعمة)**، وكلا القسمين يُطلق عليهما مسمَّى الكفر.\n\nوقد بوَّب الإمام البخاري في صحيحه ثلاثةَ أبوابٍ متتالية توضح هذا التقسيم:\n- «باب كفران العشير، وكفرٍ دون كفر».\n- «باب: المعاصي من أمر الجاهلية، ولا يكفر صاحبُها بارتكابها إلا الشرك».\n- «باب: ﴿وَإِن طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا﴾ [الحجرات: ٩]، فسمَّاهم المؤمنين».\n\n**ومن النصوص التي ورد فيها إطلاقُ الكفر على المعاصي:**\n1. «أُريتُ النارَ فإذا أكثرُ أهلها النساء؛ يكفرن، قيل: أيكفرن بالله؟ قال: **يكفرن العشير، ويكفرن الإحسان**» (البخاري ٢٩، ومسلم ٩٠٧).\n2. «لا تَرغَبوا عن آبائكم، فمَن رغِبَ عن أبيه فهو كفر» (البخاري ٦٧٦٨، ومسلم ٦٢).\n3. «**سبابُ المسلم فسوق، وقتالُه كفر**» (البخاري ٤٨، ومسلم ٦٤).\n4. «اثنتان في أمتي هما بهم كفر: **الطعنُ في النسب، والنياحة**» (مسلم ٦٧).\n5. «من أتى كاهناً أو عرَّافاً فصدَّقه بما يقول: فقد كفرَ بما أُنزل على محمد» (أحمد ٢/٤٠٨، والحاكم).\n6. «لا ترجعوا بعدي كفاراً يضرب بعضُكم رقابَ بعض» (البخاري ١٧٤١، ومسلم ٦٦).\n\n**وقال ابن عباس رضي الله عنهما** في قوله تعالى: ﴿وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْكَافِرُونَ﴾ [المائدة: ٤٤]: «**ليس بكفرٍ ينقل عن الملة، بل إذا فعله فهو به كفر، وليس كمن كفر بالله واليوم الآخر**».\n\n**الفروق بين الكفر الأكبر والكفر الأصغر، وأهمُّها:**\n1. أن **الكفر الأكبر يُخرِجُ من الملة ويُحبِطُ الأعمال**، والكفر الأصغر **لا يُخرِج من الملة ولا يُحبِط الأعمال، لكن يُنقِصها بحسبه، ويُعرِّض صاحبَه للوعيد**.\n2. أن **الكفر الأكبر يخلِّد صاحبَه في النار**، والكفر الأصغر إذا دخلَ صاحبُه النارَ فإنه **لا يخلد فيها**، وقد يتوب الله على صاحبه فلا يُدخِلَه النارَ أصلاً.\n3. أن **الكفر الأكبر يبيح الدمَ والمال**، بخلاف الكفر الأصغر.\n4. أن **الكفر الأكبر يوجب العداوةَ الخالصة بين صاحبه وبين المؤمنين**، فلا يجوز للمؤمنين محبتُه وموالاتُه ولو كان أقربَ قريب؛ **وأما الكفر الأصغر فإنه لا يمنع الموالاةَ مطلقاً، بل صاحبُه يُحَبُّ ويُوالى بقدر ما فيه من الإيمان، ويُبغَض ويُعادى بقدر ما فيه من العصيان**.\n\n**التقسيم الثاني: أقسامه باعتبار بواعثه وأسبابه** — ذكر العلماءُ أن الكفر من هذه الحيثية ينقسم إلى **خمسة أنواع**:\n1. **كفرُ تكذيب:** وهو اعتقادُ كذب الرسل عليهم السلام، **وهذا القسم قليلٌ في الكفار**؛ فإن الله تعالى أيَّدَ رسلَه وأعطاهم من البراهين والآيات الدالة على صدقهم ما أقام به الحجةَ وأزال به المعذرة. ومنه قولُه تعالى عن فرعون وقومه: ﴿وَجَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ ظُلْمًا وَعُلُوًّا﴾ [النمل: ١٤].\n2. **كفرُ الإباء والاستكبار مع التصديق:** فنحو **كفر إبليس**؛ فإنه لم يجحد أمرَ الله، ولا قابله بالإنكار، وإنما تلقَّاه بالإباء والاستكبار. **ومنه كفرُ من عرفَ صدقَ الرسل ولم ينقد لهم إباءً واستكباراً، وهو الغالبُ على كفر أعداء الرسل. وهو كفرُ اليهود، وهو كفرُ أبي طالب أيضاً**؛ فإنه صدَّق الرسولَ ﷺ ولم يشك في صدقه، ولكن أخذته الحميةُ وتعظيمُ آبائه أن يرغب عن ملَّتهم.\n3. **كفرُ الإعراض:** فأن يُعرِضَ بسمعه وقلبه عن الرسول ﷺ؛ **لا يصدِّقه ولا يكذِّبه، ولا يواليه ولا يعاديه، ولا يُصغي إلى ما جاء به البتة**.\n4. **كفرُ الشك:** فإنه **لا يجزم بصدقه ولا بكذبه، بل يشكُّ في أمره**، وهذا لا يستمر شكُّه إلا إذا ألزمَ نفسَه الإعراضَ عن النظر في آيات صدق الرسول ﷺ جملة.\n5. **كفرُ النفاق.**\n\n**مذهبُ أهل السنة والجماعة: أن الكفرَ يحصل بالاعتقاد، والقول، والفعل.** وحصرُ الكفر في الجهل والتكذيب القلبي وإنكارُ أن تكون الأقوالُ والأفعالُ مكفِّرة: **خطأ من وجوهٍ عديدة**، وهو مبنيٌّ على تعريف الإيمان بأنه مجردُ المعرفة والتصديق.\n\n### الفصل الثالث: النفاق\n\n**النفاق نوعان:**\n1. **النفاق الاعتقادي (النفاق الأكبر):** وهو ما **بايَنَ الإيمانَ ونافى أصلَه**، **وصاحبُه يكون في الدرك الأسفل من النار**.\n2. **النفاق العملي:** وهو ما **يتصل بالأعمال الظاهرة دون الاعتقاد**، وهو **غيرُ مخرجٍ من الملة، ولكنه منافٍ لكمال الإيمان**، وصاحبُه ناقصُ الإيمان، ومعرِّضٌ نفسَه للعقوبة والإثم.\n\nوقد ذكر العلماءُ أن ما وردَ في **حديث أبي هريرة**: «**آيةُ المنافق ثلاث: إذا حدَّث كذب، وإذا وعد أخلف، وإذا اؤتمن خان**» (البخاري ٣٣، ومسلم ٥٩): **هو من قبيل نفاق العمل**.\n\nوكذلك ما وردَ في **حديث عبد الله بن عمرو**: «**أربعٌ من كنَّ فيه كان منافقاً خالصاً، ومن كانت فيه خصلةٌ منهن كانت فيه خصلةٌ من النفاق حتى يَدَعَها: إذا اؤتُمن خان، وإذا حدَّث كذب، وإذا عاهدَ غدر، وإذا خاصمَ فجر**» (البخاري ٣٤، ومسلم ٥٨).\n\n**ومعنى قوله ﷺ: «كان منافقاً خالصاً»: شديدُ الشبه بالمنافقين بسبب هذه الخصال.** قال بعض العلماء: **هذا فيمن كانت هذه الخصالُ غالبةً عليه، فأما من يندرُ ذلك منه فليس داخلاً فيه**، وهذا هو المختار في معنى الحديث (ذكره النووي ورجَّحه ابن حجر).\n\n### الفصل الرابع: البدعة\n\n#### المبحث الأول: تعريف البدعة\n- **لغةً:** اسمٌ من (بدَعَ الشيءَ يبدَعُه بَدْعاً وابتدَعَه)، أي: **أنشأه وبدأه**. وبَدَعتُ الشيء: إذا أنشأتَه، وكلُّ من أحدثَ شيئاً فقد ابتدَعَه، والاسم: البدعة، والجمع: البِدَع؛ **فمادة (بدع) تدل على ابتداء الشيء وصنعه لا عن مثال**.\n- **اصطلاحاً:** المعنى الاصطلاحي مشتقٌّ من معناه اللغوي. قال الأزهري: «وكلُّ من أنشأ ما لم يُسبق إليه قيل له: أبدعت، ولهذا قيل لِمَن خالفَ السنة: مبتدع؛ لأنه أحدثَ في الإسلام ما لم يسبقه إليه السلف».\n\n**ومن تعريفاتها:**\n- «ما خالفت الكتابَ والسنةَ وإجماعَ سلف الأمة من الاعتقادات والعبادات» (شيخ الإسلام ابن تيمية).\n- «ما أُحدِث مما لا أصلَ له في الشريعة يدل عليه» (ابن رجب).\n- «هي التي أُحدِثت بعد الرسول ﷺ على سبيل التقرُّب إلى الله، ولم يكن قد فعلَها الرسول ﷺ، ولا أمرَ بها، ولا أقرَّها، ولا فعلتها الصحابة».\n- **ومن أحسن تعريفاتها وأجمعها (تعريف الشاطبي):** «**عبارةٌ عن طريقةٍ في الدين مخترَعة، تُضاهي الشرعية، يُقصد بالسلوك عليها المبالغةُ في التعبد لله سبحانه**».\n\n**شرح قيود التعريف:**\n- قولُه: «**في الدين**»: قُيِّدت بالدين لأنها فيه تُخترَع وإليه يُضيفها صاحبُها، **ولإخراج ما كان مخترَعاً في أمور الدنيا على الخصوص، كإحداث الصنائع والبلدان التي لا عهدَ بها فيما تقدم**.\n- قولُه: «**مخترَعة**»: أي طريقةٌ ابتُدعت على غير مثالٍ تقدمها من الشارع؛ إذ البدعةُ إنما خاصَّتُها أنها خارجةٌ عما رسَمَه الشارع. **وبهذا القيد انفصلت عن كل ما ظهر لبادئ الرأي أنه مخترَعٌ مما هو متعلقٌ بالدين، كعلم النحو، والتصريف، ومفردات اللغة، وأصول الفقه، وسائر العلوم الخادمة للشريعة؛ فإنها وإن لم توجد في الزمان الأول فأصولُها موجودةٌ في الشرع.**\n- قولُه: «**تضاهي الشرعية**»: يعني أنها تشابه الطريقةَ الشرعيةَ من غير أن تكون في الحقيقة كذلك، بل هي مضادَّةٌ لها من أوجهٍ متعددة، منها:\n  1. **وضعُ الحدود**، كالناذر للصيام قائماً لا يقعد، ضاحياً لا يستظل، والاختصاصُ في الانقطاع للعبادة، والاقتصارُ من المأكل والملبس على صنفٍ دون صنفٍ من غير علة.\n  2. **التزامُ الكيفيات والهيئات المعينة**، كالذكر بهيئة الاجتماع على صوتٍ واحد، واتخاذُ بعض الأيام الفاضلة أعياداً دينية.\n  3. **التزامُ العبادات المعينة في أوقاتٍ معينة لم يوجد لها ذلك التعيين في الشريعة**، كالتزام صيام يوم النصف من شعبان وقيام ليلته.\n- قولُه: «**يُقصد بالسلوك عليها المبالغةُ في التعبد لله تعالى**»: هو تمامُ معنى البدعة؛ إذ هو المقصودُ بتشريعها.\n\n**فالبدعةُ:** ما أُحدِث في الدين باسم الانضباط في التعبد أو المبالغة فيه، وأنها تكون قد اختُرِعَت بقصد التقرب إلى الله تعالى، وأنها **لا يكون لها أصلٌ من الكتاب والسنة أو عمل الصحابة رضي الله عنهم ومن سلك سبيلَهم من السلف الصالح**.\n\n#### المبحث الثاني: بيان أنواع البدعة\nتنقسم البدعةُ باعتباراتٍ مختلفة إلى أقسامٍ عديدة، منها:\n- **الأول:** تقسيمُ البدعة بحسب ما يترتب عليها من أحكام.\n- **الثاني:** تقسيمُ البدعة من حيث كونها إضافيةً أو حقيقية.\n- **الثالث:** تقسيمُ البدعة باعتبار كونها اعتقاديةً أو عملية.\n\n**التقسيم الأول: تقسيمُ البدعة بحسب ما يترتب عليها من أحكام** — تنقسم بهذا الاعتبار إلى **نوعَين**:\n1. **النوع الأول: البدعةُ المكفِّرة** — وهي **التي تُخرِجُ الإنسانَ من الإسلام، وهي الفسادُ في العقيدة في أصلٍ من أصول الدين**.\n   **والبدعةُ المكفَّرُ بها لا بد أن يكون ذلك التكفيرُ متفقاً عليه من قواعد جميع الأئمة**، كما في غلاة بعض أهل البدع الذين يدَّعون حلولَ الإلهية في عليٍّ رضي الله عنه أو غيره، أو الإيمان برجوعه إلى الدنيا قبل يوم القيامة، أو غير ذلك.\n2. **النوع الثاني: البدعةُ المفسِّقة** — وهي **التي لا تُخرِجُ عن الإسلام، بل يُفسَّقُ بها**.\n\n#### تكفير المعيَّن: ضوابطه وشروطه\n**القاعدة المهمة التي غفل عنها بعضُهم فوقعوا في مأزقٍ خطير:** أن **الشيء قد يكون كفراً ولكنَّ صاحبَه لا يكفر**. فقد حكموا على فاعل كلِّ ما يُعتبَر كفراً بأنه كافر، أو حكموا على ما هو كفرٌ صريحٌ بأنه ليس كفراً؛ فراراً من الحكم على فاعله بالكفر. وهذا ناشئٌ من اعتقاد أن الحكم على شيءٍ ما بأنه كفرٌ يستلزمُ أن يكون فاعلُه المعيَّن كافراً، **وكلا الأمرين خطأ**.\n**والصواب: أن لا يُحكم على كلِّ من صدرَ عنه المكفَّرُ بأنه كافر، كما أنه لا يُحجَمُ عن وصف الفعل الذي تدل النصوصُ على أنه كفرٌ بوصفه الذي يستحقُّه.**\n\n**الشرط الأول: أن يظهر من قوله أو فعله ما يدل على المعنى الكفري، ويلتزمَه.**\nلا بد من اعتبار **النية** في المكفِّرات، وكذلك بمطابقة القصد للَّفظ؛ لأن الإسلام إذا ثبتَ لأحدٍ لا يجوز إخراجُه منه **بالظن والتهمة**، أو تحميل كلامه فوق ما يحتمل.\n**كما أن لازمَ المذهب ليس بمذهب؛** فإذا قال مسلمٌ قولاً ولزم منه الكفر – كمن أنكر أن الله تعالى فوق السماء، أو نفى الصفات عن الله تعالى، فإن لازم ذلك تكذيبُ الله تعالى ورسوله ﷺ، بل لازمُ ذلك نفيُ وجوده، وهذا كفرٌ بيِّن – **ولكن لا يُحكم على الشخص بالكفر ما لم يبيَّن له ذلك ويلتزمَه**؛ لأن الإنسان قد يقول المقالة وهو ذاهلٌ عن لازمها، بل لا يقصده، بل ربما يكون يقصد نقيضَه.\n\n**الشرط الثاني: قيامُ الحجة ووضوحُها.**\n**لا يثبتُ الكفرُ على المعيَّن ما لم تقم عليه الحجةُ التي إن خالفها كفر.** قال شيخ الإسلام: «فتكفيرُ الشخص المعيَّن وجوازُ قتله موقوفٌ على أن تبلغه الحجةُ التي يكفر من خالفها، وإلا فليس كلُّ من جهلَ شيئاً من الدين يكفر».\n- **ولهذا لما استحلَّ طائفةٌ من الصحابة والتابعين – كقدامة بن مظعون رضي الله عنه وأصحابه – شربَ الخمر**، وظنوا أنها تباح لمن عمل صالحاً على ما فهموه من آية المائدة: **اتفق علماءُ الصحابة كعمر وعليٍّ وغيرهما على أنهم يُستتابون، فإن أصرُّوا على الاستحلال كفروا، وإن أقرُّوا جُلِدوا، فلم يكفِّروهم بالاستحلال ابتداءً؛ لأجل الشبهة التي عرضت لهم حتى يتبين لهم الحق، فإذا أصرُّوا على الجحود كفروا.**\n- **وحديثُ الرجل الذي قال لأهله:** «إذا أنا متُّ فاسحقوني ثم ذُرُّوني في اليمِّ، فو الله لئن قدرَ اللهُ عليَّ ليعذبني عذاباً ما عذبه أحداً من العالمين»، فأمر الله البرَّ فردَّ ما أخذ منه، وأمر البحرَ فردَّ ما أخذ منه، وقال: ما حملكَ على ما فعلت؟ قال: خشيتُك يا رب، **فغفر له** (البخاري ٦٤٨٠، ومسلم ٢٧٥٦). فهذا اعتقدَ أنه إن فعلَ ذلك لا يقدرُ الله تعالى على إعادته وأنه لا يعيده، وجوَّز ذلك، **وكلاهما كفر، لكنه كان جاهلاً لم يتبين له الحقُّ بياناً يكفر بمخالفته، فغفر الله له**.\n\n**ومن الأدلة الدالة على ضرورة اشتراط قيام الحجة للتكفير:**\n- ﴿وَمَن يُشَاقِقِ الرَّسُولَ **مِنْ بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ** وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ﴾ [النساء: ١١٥].\n- ﴿وَمَا كَانَ اللَّهُ لِيُضِلَّ قَوْمًا بَعْدَ إِذْ هَدَاهُمْ **حَتَّىٰ يُبَيِّنَ لَهُم مَّا يَتَّقُونَ**﴾ [التوبة: ١١٥].\n- ﴿**وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا**﴾ [الإسراء: ١٥].\n\n**فهذه الآيات بعمومها تدل على أنه لا يكفر من المسلمين إلا من بلغته الحجة، ووضحت له بحيث خالفها عناداً وتكبراً أو رفضاً للحق ورداً له.**\n\n**الحكمُ على الشخص المعيَّن بنصوص الوعيد:**\nنصوصُ الوعيد حق، **لكن الشخص المعيَّن لا يُشهد عليه بالوعيد، فلا يُشهد على معيَّنٍ من أهل القبلة بالنار؛ لجواز أن لا يلحقه الوعيدُ لفوات شرطٍ أو ثبوت مانع**؛ فقد:\n- لا يكون التحريمُ بلغَه.\n- وقد يتوب من فعل المحرَّم.\n- وقد تكون له حسناتٌ عظيمةٌ تمحو عقوبةَ ذلك المحرَّم.\n- وقد يُبتلى بمصائبَ تكفِّر عنه.\n- وقد يشفع فيه شفيعٌ مطاع.\n\n---\n\n*(تم بحمد الله؛ وهذا الملخص مقتصرٌ على ما ورد في كتاب «بريق الجمان بشرح أركان الإيمان» من التعريفات والأقسام والقوائم والأدلة.)*\n\n\n# العقيدة (10 درجات) — تلخيص بريق الجمان (موسى بركة الرشيدي)\n\n## تعريفات\n- **العقيدة لغة**: المعقودة التي عقد عليها القلب وعزم بالقصد البليغ، من العقد. **اصطلاحاً**: الإيمان الجازم بالله تعالى وبما يجب له من التوحيد، والإيمان بملائكته وكتبه ورسله واليوم الآخر والقدر خيره وشره، وما يتفرع عن هذه الأصول.\n- **السنة لغة**: السيرة حسنة أو سيئة. **اصطلاحاً**: عند المحدثين ما أضيف إلى النبي ﷺ من قول وفعل وتقرير، وعند السلف موافقة الكتاب والسنة في العبادات والاعتقادات.\n- **الجماعة**: ستة أقوال: السواد الأعظم، إجماع المجتهدين، الصحابة خاصة، جماعة أهل الإسلام إذا اجتمعوا على أمر، إذا اجتمعوا على أمير، جماعة الحق وأهله.\n- **أهل السنة والجماعة**: أخص الناس بالسنة والجماعة وأكثرهم تمسكاً بها قولاً وعملاً واعتقاداً.\n\n## مصادر العقيدة (سؤال سابق)\n1. القرآن الكريم. 2. السنة النبوية الصحيحة (ويجب قبول خبر الآحاد الصحيح واعتقاده). ما اختُلف فيه فمرده إلى الكتاب والسنة بفهم السلف. أصول الدين توقيفية. لا يجوز تأويل نصوص العقيدة بغير دليل.\n\n## الإيمان\n- **لغة**: الإقرار. **اصطلاحاً**: اعتقاد بالقلب ونطق باللسان وعمل بالأركان.\n- **يشتمل على خمسة**: قول القلب (التصديق)، قول اللسان (الشهادتان)، عمل القلب (النية والإخلاص والمحبة والتوكل)، عمل اللسان (كالتلاوة)، عمل الجوارح (كالركوع والحج).\n- **يزيد بالطاعة وينقص بالمعصية** بإجماع أئمة السنة. الدليل: ﴿فزادهم إيماناً﴾، وحديث \"الإيمان بضع وسبعون شعبة\".\n- **الاستثناء في الإيمان** (سؤال سابق): قول \"أنا مؤمن إن شاء الله\". سؤال \"أمؤمن أنت؟\" بدعة أحدثها المرجئة. إن أراد الشك في أصل إيمانه مُنع. **مسوغات جواز الاستثناء خمسة**: أن الإيمان المطلق شامل لكل ما أمر الله به، أن الإيمان النافع هو المتقبل عند الله، الابتعاد عن تزكية النفس، أن الاستثناء يصح حتى في الأمور المتيقنة، الاستثناء خوفاً من سوء الخاتمة.\n\n## أنواع التوحيد ثلاثة\n1. **توحيد الربوبية**: توحيد الله بأفعاله. دلالاته: الفطرة، الأنفس، الآفاق. لم ينكره إلا شواذ البشر من الملاحدة (الدهرية، الشيوعية).\n2. **توحيد الألوهية**: إفراد الله بجميع أنواع العبادة. ويسمى توحيد العبادة والقصد والإرادة والطلب. من أجله خلق الله الخلق وأرسل الرسل. جحده أكثر الخلق.\n3. **توحيد الأسماء والصفات**: إثبات ما أثبته الله لنفسه أو أثبته له رسوله من صفات الكمال، ونفي ما نفاه. جحده الجهمية والمعتزلة.\n- **علاقة التضمن والاستلزام**: توحيد الألوهية يتضمن توحيد الربوبية، وتوحيد الربوبية يستلزم توحيد الألوهية.\n\n## شهادة أن لا إله إلا الله\n- **معناها**: لا معبود بحق إلا الله. **ركناها**: النفي (نفي الألوهية عن كل ما سوى الله) والإثبات (إثباتها لله).\n- **شروطها سبعة** (سؤال سابق: اذكر أربعة): العلم المنافي للجهل، اليقين المنافي للشك، القبول المنافي للرد، الانقياد المنافي للترك، الصدق المنافي للكذب، الإخلاص المنافي للشرك، المحبة.\n- **نواقضها**: تجتمع في ثلاثة: الشرك الأكبر، الكفر الأكبر، النفاق الاعتقادي.\n\n## العبادة\n- **لغة**: الذل. **اصطلاحاً**: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة. (سؤال سابق: عرّف العبادة)\n- **تتضمن ثلاثة** (سؤال سابق مكرر):\n  - عبادة الله **بالحب فقط**: طريقة منحرفي الزهاد (الصوفية).\n  - عبادة الله **بالرجاء فقط**: طريقة المرجئة.\n  - عبادة الله **بالخوف فقط**: طريقة الخوارج.\n- **من أساليب القرآن في الدعوة إلى توحيد الألوهية**: الأمر بعبادته وترك ما سواه، الإخبار أنه خلق الخلق لعبادته، الإخبار أنه أرسل الرسل بذلك، الاستدلال بانفراده بالربوبية، الاستدلال بانفراده بصفات الكمال.\n\n## طريقة أهل السنة في الأسماء والصفات (سؤال سابق)\n- **في الإثبات**: إثبات ما أثبته الله لنفسه أو رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل.\n  - **التحريف**: تغيير النص لفظاً أو معنى. أقسامه: لفظي يتغير معه المعنى (نصب لفظ الجلالة في \"وكلم اللهَ موسى\")، لفظي لا يتغير معه المعنى (فتح الدال في \"الحمدَ لله\")، معنوي (صرف اللفظ عن ظاهره بلا دليل).\n  - **التعطيل**: إنكار ما يجب لله من الأسماء والصفات. كلي (الجهمية) وجزئي (المعتزلة ينكرون الصفات دون الأسماء).\n  - **التكييف**: حكاية كيفية الصفة. وهو أعم من التمثيل.\n  - **التمثيل**: إثبات مثيل للصفة.\n- **في النفي**: نفي ما نفاه الله عن نفسه مع اعتقاد كمال ضد الصفة المنفية.\n- **فيما لم يرد نفيه ولا إثباته**: التوقف في اللفظ والاستفصال في المعنى.\n- **أقسام الصفات**: ذاتية (العلم، القدرة، الحياة، السمع، البصر، الوجه)، فعلية متعلقة بالمشيئة (المجيء، النزول، الغضب، الفرح)، ذاتية فعلية (الكلام).\n- **القواعد العامة في الأسماء والصفات** (سؤال سابق): (1) القول في الصفات كالقول في الذات. (2) القول في بعض الصفات كالقول في بعضها الآخر. (3) الاتفاق في الأسماء لا يقتضي التساوي في المسميات، ودليله السمع ﴿ليس كمثله شيء﴾ والعقل والحس (الفيل والبعوضة).\n\n## الإيمان بالملائكة (سؤال سابق: اشرح الإيمان بالملائكة)\nالتصديق والإقرار بوجودهم، وأنهم عالم غيبي، عباد مكرمون، خُلقوا من نور. من دلائل شرفهم: إضافتهم إلى الله إضافة تشريف، قرن شهادتهم بشهادته، وصفهم بالكرم والقرب. أفضلهم من شهد بدراً. صفاتهم الخَلقية: عظم الخلق، الأجنحة، الجمال، لا يملون. قدراتهم: التشكل، السرعة، النظام. أعمالهم: تنفيذ أمر الله الكوني وتدبير أمره الديني.\n\n## الإيمان بالكتب\nتصديق جازم بأنها كلام الله. الناس ثلاثة أقسام: كذب بها كلها (الكفار والفلاسفة)، آمن بها كلها (المؤمنون)، آمن ببعض وكفر ببعض (اليهود والنصارى). الإيمان بالكتب السابقة مجمل، وبالقرآن مفصل، وهو كلام الله غير مخلوق منه بدأ وإليه يعود.\n\n## الإيمان بالرسل\n- **الفرق بين النبي والرسول**: النبي من أنبأه الله بخبر ولم يأمره بتبليغه، والرسول من أُمر بالتبليغ. وعند ابن تيمية: الرسول من بعث إلى قوم كافرين بما لا يعرفونه، والنبي إلى قوم مسلمين بما يعرفونه. كل رسول نبي ولا عكس.\n- **أولو العزم خمسة**: نوح وإبراهيم وموسى وعيسى ومحمد. وأفضلهم الخليلان إبراهيم ومحمد. النبوة اصطفاء لا اكتساب.\n- **المعجزة** (سؤال سابق: عرّف المعجزة): أمر خارق للعادة يجريه الله على يد من يختاره لنبوته ليدل على صدقه. أمثلة: ناقة صالح، عصا موسى، إبراء الأكمه والأبرص، القرآن.\n- **وجوه إعجاز القرآن سبعة**: اللفظ، النظم، البلاغة، المعاني التي أمر بها، الإخبار عن الغيب، الإخبار عن المعاد، الدلائل اليقينية.\n- **الفرق بين دلائل النبوة وخوارق السحرة**: أخبار الأنبياء لا تتخلف، السحر معتاد يناله من تعلمه، الأنبياء موحدون والسحرة مشركون، الفطر توافق الأنبياء، الأنبياء يكملون العقول، معجزات الأنبياء من فعل الله.\n- **كرامات الأولياء**: الطوائف ثلاث: أنكرتها الجهمية والمعتزلة، غلت فيها العوام وأهل الضلال، توسط أهل السنة.\n- **عصمة الأنبياء**: إجماع على عصمتهم في التبليغ، وفي المعاصي قولان، والجمهور: معصومون من الكبائر دون الصغائر ولا يُقرّون عليها.\n- **دين الأنبياء واحد**: الإسلام.\n- **خصائص النبي ﷺ عن بقية الرسل** (سؤال سابق مكرر): خاتم النبيين، الشفاعة العظمى (المقام المحمود)، بعثه إلى الإنس والجن، القرآن العظيم، المعراج، \"أعطيت خمساً لم يعطهن أحد قبلي: نصرت بالرعب مسيرة شهر، وجعلت لي الأرض مسجداً وطهوراً، وأحلت لي الغنائم، وأعطيت الشفاعة، وبعثت إلى الناس كافة\".\n- **خصائصه دون أمته**: وجوب قيام الليل، إذا عمل عملاً أثبته، تحريم الزكاة عليه وآله، الوصال في الصوم، الزيادة على أربع، القتال بمكة ساعة، لا يورث، بقاء زوجيته بعد الموت.\n\n## الإيمان باليوم الآخر (سؤال سابق: ما الأمور التي يتضمنها؟)\n- يبدأ من الموت إلى آخر ما يقع يوم القيامة.\n- **أدلة البعث في القرآن**: الإخبار عمن أماتهم ثم أحياهم، الاستدلال بالنشأة الأولى، خلق السماوات أعظم، تنزيهه عن العبث.\n- **أشراط الساعة**: صغرى (قبض العلم، ظهور الجهل، شرب الخمر) وكبرى (الدجال، نزول عيسى، يأجوج ومأجوج، الدابة، خسف بالمشرق، بالمغرب، بجزيرة العرب، طلوع الشمس من مغربها، النار التي تحشر الناس). **تقسيم آخر ثلاثة أقسام** (سؤال سابق): قسم ظهر وانقضى، قسم ظهر ولا يزال يتتابع ويكثر، قسم لم يظهر بعد.\n- **القيامة الصغرى**: (1) الموت. (2) **الروح والنفس** (سؤال سابق: يشتركان في المعنى إلا في شيئين): الروح عين قائمة بنفسها تفارق البدن وتنعم وتعذب. يتحد مدلولهما تارة ويختلف تارة: فالنفس تطلق على الروح، وتطلق على الدم، وعلى الذات كلها، بينما الروح لا تطلق على الدم ولا على ذات الإنسان بجملته، والروح تطلق على القرآن وجبريل بخلاف النفس. (3) فتنة القبر: سؤال الملكين منكر ونكير، والأنبياء لا يفتنون وكذا غير المكلفين على الراجح. السؤال عام للمسلم والكافر على الراجح. **تعلق الروح بالبدن خمسة أنواع**: في بطن الأم، بعد الخروج، في النوم، في البرزخ، يوم البعث. عذاب القبر ونعيمه للروح والبدن، والدليل ﴿يثبت الله الذين آمنوا﴾ وحديث \"إنهما ليعذبان\".\n- **القيامة الكبرى**: البعث والنشور (نفخ إسرافيل)، الحساب، إعطاء الصحائف، وزن الأعمال (ميزان حقيقي له لسان وكفتان)، الحوض (مسيرة شهر، قبل الصراط على الراجح)، الصراط (جسر على متن جهنم أدق من الشعر وأحد من السيف)، الشفاعة، الجنة والنار (مخلوقتان موجودتان الآن).\n- **الشفاعة**: لغة الوسيلة والطلب، عرفاً سؤال الخير للغير. **شرطاها**: إذن الله للشافع، ورضاه عن المشفوع له. **أنواعها للنبي ﷺ**: الشفاعة العظمى لأهل الموقف (خاصة به)، لأهل الجنة أن يدخلوها (خاصة به)، في تخفيف العذاب، فيمن استحق النار ألا يدخلها ومن دخلها أن يخرج. الرد على منكريها: أنها لا تنفع المشركين، والمقصود شفاعة أهل البدع بلا إذن.\n\n## القضاء والقدر\n- **اصطلاحاً**: تقدير الله الأشياء في القدم، وعلمه أنها ستقع في أوقات معلومة، وكتابته لها، ومشيئته لها، وخلقه لها.\n- **الفرق بين القضاء والقدر**: قولان، والأقرب: القدر هو العلم السابق، والقضاء وقوع الخلق على وزن المقدر.\n- **أركان الإيمان بالقدر أربعة**: العلم، الكتابة، المشيئة، الخلق. (علم كتابة مولانا مشيئته... وخلقه وهو إيجاد وتكوين).\n- **أقوال في أفعال العباد**: الجبرية (مجبورون كالورقة في الريح، أشهرهم الجهمية)، المعتزلة (العباد خالقون لأفعالهم)، بعض المتكلمين (الكسب بلا تأثير)، أهل السنة (الله خالق أفعال العباد، والعباد فاعلون لها حقيقة بقدرة وإرادة خاضعة لمشيئة الله).\n- **الاحتجاج بالقدر على المعاصي** لا يجوز، ويسوغ عند المصائب لا المعائب (قصة آدم وموسى).\n\n## نواقض الإيمان\n- **منهج أهل السنة وسط بين**: الخوارج (يغالون في التكفير) والمرجئة (الإيمان في القلب ولا يضر معه معصية).\n- **الشرك الأكبر**: أن يتخذ العبد لله نداً يسويه به في ربوبيته أو ألوهيته أو أسمائه وصفاته. أعظم الذنوب. آثاره: لا يغفر بلا توبة، خروج من الملة، لا يقبل معه عمل، تحرم الجنة.\n- **أقسام الشرك الأكبر**: في الربوبية (شرك النصارى، القدرية، عبّاد القبور، الاستسقاء بالنجوم)، في الألوهية (اعتقاد شريك أو صرف عبادة لغير الله)، في الحكم (اعتقاد أن غير حكم الله أفضل أو مثله، جواز الحكم بغيره، وضع تشريع مخالف)، في الأسماء والصفات.\n- **وسائل الشرك الأكبر**: الغلو في الصالحين، التبرك الممنوع (شركي وبدعي: التمسح بالصالحين، تقبيل القبور، التبرك بالأشجار والأحجار والأماكن بلا دليل)، رفع القبور وبناء المساجد عليها.\n- **الشرك الأصغر**: في العبادات القلبية (الرياء، العمل لمصلحة دنيوية، الاعتماد على الأسباب، التطير)، في الأفعال (الرقى الشركية، التمائم)، في الأقوال (الحلف بغير الله، التشريك بالواو \"ما شاء الله وشئت\").\n- **الرقى**: شرعية (من الكتاب والسنة) ومحرمة (إن اعتمد عليها كسبب فشرك أصغر، وإن اعتقد أنها تنفع بذاتها فأكبر).\n- **صح أو خطأ** (سؤال سابق): لبس الحلقة والخيط لرفع البلاء: شرك. أكل الربا والرشوة: كبيرة وليس شركاً. عقوق الوالدين: كبيرة. التبرك بالأشجار والأحجار: شرك. الاستسقاء بالأنواء: شرك (أصغر إن اعتقدها سبباً، أكبر إن اعتقدها فاعلة).\n- **الكفر**: لغة الستر، اصطلاحاً نقيض الإيمان. **الفرق بين الأكبر والأصغر**: الأكبر مخرج من الملة ويبيح الدم والمال ويخلد في النار ويوجب العداوة، والأصغر لا.\n- **أقسام الكفر باعتبار بواعثه خمسة** (سؤال سابق): كفر التكذيب، كفر الإباء والاستكبار (إبليس)، كفر الإعراض، كفر الشك، كفر النفاق. وباعتبار الأصل: أصلي وردة.\n- **تكفير المعين والمطلق**: المطلق إطلاق الكفر على الفعل أو القول، والمعين وصف شخص بعينه بالكفر ولا يجوز إلا بشروط وانتفاء موانع. الشيء قد يكون كفراً وفاعله لا يكفر.\n- **شروط تكفير المعين** (سؤال سابق مكرر): أن يظهر عليه قول أو فعل يدل على المعنى الكفري ويلتزمه، قيام الحجة ووضوحها. **الموانع**: الجهل، التأويل، الإكراه. (وفي بعض الشروح: الخطأ).\n- **النفاق**: لغة مخالفة الظاهر للباطن، اصطلاحاً إظهار الإيمان وإبطان الكفر. اعتقادي (أكبر، في الدرك الأسفل) وعملي (لا يخرج من الملة).\n- **البدعة**: لغة الإنشاء، اصطلاحاً ما خالف الكتاب والسنة والإجماع من الاعتقادات والعبادات. مكفّرة (كالرجعة) ومفسّقة (كبدع الخوارج). حقيقية (لا أصل لها) وإضافية.\n\n## عقيدة أهل السنة وسط في خمسة أصول (سؤال سابق)\n1. في العبادات (بين الغلاة والجفاة). 2. في الأسماء والصفات (بين المعطلة والممثلة). 3. في القضاء والقدر (بين الجبرية والقدرية). 4. في الوعد والوعيد وأسماء الإيمان (بين الخوارج والمرجئة). 5. في الصحابة (بين الروافض والنواصب).\n\n## \"ذو مرة فاستوى\" (سؤال سابق)\nالمقصود جبريل عليه السلام، وذو مرة: ذو قوة وخلق حسن وجمال.\n", "questions": [{"s": "aqeedah", "q": "عبدوا الله بالحب فقط؟ بالرجاء فقط؟ بالخوف فقط؟", "a": "بالحب فقط: منحرفو الزهاد (الصوفية). بالرجاء فقط: المرجئة. بالخوف فقط: الخوارج."}, {"s": "aqeedah", "q": "اذكر أربعة من شروط لا إله إلا الله.", "a": "العلم، اليقين، القبول، الانقياد، الصدق، الإخلاص، المحبة (سبعة)."}, {"s": "aqeedah", "q": "النفس والروح يشتركان في المعنى إلا في شيئين، اذكرهما.", "a": "النفس تطلق على الدم وعلى ذات الإنسان بجملته، ولا تطلق الروح على ذلك. والروح تطلق على جبريل والقرآن ولا تطلق النفس على ذلك."}, {"s": "aqeedah", "q": "اذكر القواعد العامة في الأسماء والصفات.", "a": "القول في الصفات كالقول في الذات. القول في بعض الصفات كالقول في بعضها الآخر. الاتفاق في الأسماء لا يقتضي التساوي في المسميات."}, {"s": "aqeedah", "q": "ما شروط تكفير المعين وما الموانع؟", "a": "الشروط: ظهور قول أو فعل كفري يلتزمه، وقيام الحجة ووضوحها. الموانع: الجهل، التأويل، الإكراه، الخطأ."}, {"s": "aqeedah", "q": "اذكر طريقة أهل السنة والجماعة في إثبات صفات الله.", "a": "إثبات ما أثبته الله لنفسه أو أثبته رسوله من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل، ونفي ما نفاه مع اعتقاد كمال الضد، والتوقف فيما لم يرد."}, {"s": "aqeedah", "q": "من المقصود بـ (ذو مرة فاستوى)؟", "a": "جبريل عليه السلام، وذو مرة: ذو قوة وخلق حسن."}, {"s": "aqeedah", "q": "ما هي مصادر العقيدة؟", "a": "القرآن الكريم والسنة النبوية الصحيحة، بفهم سلف الأمة، ويقبل خبر الآحاد الصحيح."}, {"s": "aqeedah", "q": "اذكر خصائص النبي ﷺ عن بقية الرسل.", "a": "خاتم النبيين، الشفاعة العظمى، بعثه إلى الإنس والجن، القرآن، المعراج، نصر بالرعب مسيرة شهر، جعلت له الأرض مسجداً وطهوراً، أحلت له الغنائم، بعث إلى الناس كافة."}, {"s": "aqeedah", "q": "عرّف المعجزة والعبادة.", "a": "المعجزة: أمر خارق للعادة يجريه الله على يد من يختاره لنبوته ليدل على صدقه. العبادة: اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الباطنة والظاهرة."}, {"s": "aqeedah", "q": "مسوغات جواز الاستثناء في الإيمان خمسة، اذكرها.", "a": "أنه لا يدعي أحد الإيمان المطلق الكامل. أن الإيمان النافع هو المتقبل عند الله. البعد عن تزكية النفس. أن الاستثناء يصح في الأمور المتيقنة. الخوف من سوء الخاتمة."}, {"s": "aqeedah", "q": "ينقسم الكفر إلى خمسة أقسام باعتبار بواعثه، اذكرها.", "a": "كفر التكذيب، كفر الإباء والاستكبار، كفر الإعراض، كفر الشك، كفر النفاق."}, {"s": "aqeedah", "q": "عقيدة أهل السنة والجماعة وسط في خمسة أصول، اذكرها.", "a": "العبادات، الأسماء والصفات، القضاء والقدر، الوعد والوعيد (الإيمان)، الصحابة."}, {"s": "aqeedah", "q": "قسّم بعض العلماء أشراط الساعة من حيث ظهورها إلى ثلاثة أقسام، فما هي؟", "a": "قسم ظهر وانقضى، قسم ظهر ولا يزال يتتابع ويكثر، قسم لم يظهر بعد."}, {"s": "aqeedah", "q": "ما الأمور التي يتضمنها الإيمان باليوم الآخر؟ اشرح اثنين.", "a": "فتنة القبر وعذابه ونعيمه، البعث، الحشر، الحساب، الصحائف، الميزان، الحوض، الصراط، الشفاعة، الجنة والنار. الميزان: ميزان حقيقي له كفتان توزن به الأعمال. الصراط: جسر على متن جهنم يمر عليه الناس على قدر أعمالهم."}, {"s": "aqeedah", "q": "ضع صح أو خطأ: لبس الحلقة والخيط لرفع البلاء شرك. أكل الربا والرشوة شرك. عقوق الوالدين شرك. التبرك بالأشجار والأحجار شرك. الاستسقاء بالأنواء شرك.", "a": "صح. خطأ (كبيرة). خطأ (كبيرة). صح. صح."}, {"s": "aqeedah", "q": "ما أصول العقيدة الإسلامية؟ مدللاً بدليل.", "a": "الإيمان بالله وملائك
