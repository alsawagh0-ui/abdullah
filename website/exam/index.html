\n**شروطها خمسة:**\n1. اتفاق الدَّيْنَيْن في الجنس والصفة والحلول والأجل.\n2. علم قدر كل من الدينين.\n3. استقرار المال المحال عليه لا المحال به.\n4. كونه يصح السلم فيه.\n5. رضى المحيل لا المحتال إن كان المحال عليه مليئًا.\n\n**فمتى توفرت الشروط، برئ المحيل من الدين بمجرد الحوالة.**\n\n## باب الصلح\n\n- يصح ممن يصح تبرعه **مع الإقرار والإنكار**.\n- فإذا **أقر** للمدعي بدين أو عين ثم صالحه، فهو **هبة** يصح بلفظها لا بلفظ الصلح.\n- وإن صالحه على غير المدعاة، فهو **بيع** يصح بلفظ الصلح، وتثبت فيه أحكام البيع.\n- وإن صالح عن عيب في المبيع، صح.\n- ويصح الصلح عما تعذر علمه من دَيْن أو عَيْن.\n- وإذا **أنكر** دعوى المدعي، أو سكت وهو يجهله، ثم صالحه، صح الصلح، وكان **إبراءً في حقه، وبيعًا في حق المدعي**.\n- **ومن علم بكذب نفسه؛ فالصلح باطل في حقه، وما أخذ فحرام.**\n\n**فصل (ص ٥٩):**\n- يحرم على الشخص أن يجري ماء في أرض غيره أو سطحه بلا إذنه، ويصح الصلح على ذلك بعوض.\n- وحرم على الجار أن يُحْدِث بملكه ما يضرُّ بجاره، وله منعه.\n- ويحرم التصرف في جدار جار مشترك إلا بإذنه.\n- وحرم أن يتصرف في طريق نافذ بما يضر المار.\n- ويحرم التصرف في ملك غيره أو هوائه أو درب غير نافذ إلا بإذن أهله.\n\n## كتاب الحجر (ص ٦٠)\n\n**وهو: منع المالك من التصرف في ماله.**\n\n**وهو نوعان:**\n- **الأول:** لحق الغير؛ كالحجر على مفلس وراهن.\n- **الثاني:** لحظ نفسه؛ كعلى صغير ومجنون وسفيه.\n\n**وفائدة الحجر أحكام أربعة:**\n1. تعلق حق الغرماء بالمال.\n2. أنَّ من وجد عَيْن ما باعه أو أقرضه، فهو أحق بها.\n3. يلزم الحاكم قسم ماله على الغرماء بقدر ديونهم.\n4. انقطاع الطلب عنه.\n\n**فصل:** من دفع ماله إلى صغير أو مجنون أو سفيه فأتلفه لم يضمنه، ومن أخذ من أحدهم مالًا ضمنه حتى يأخذه وليه. ومن بلغ سفيهًا أو بلغ مجنونًا ثم عقل ورشد، انفك الحجر عنه ودفع إليه ماله.\n\n**وبلوغ الذكر:**\n1. بالإمناء.\n2. وبتمام **خمس عشرة سنة**.\n3. أو بنبات شعر خشن حول قبله.\n\nوبلوغ الأنثى بذلك، **وبالحيض**.\n**والرشد:** إصلاح المال وصونه عمَّا لا فائدة فيه.\n\n## باب الوكالة (ص ٦١)\n\n- **وهي: استنابة جائز التصرف مثله فيما تدخله النيابة**؛ كعقد وفسخ، وفعل حج وعمرة، لا فيما لا تدخله النيابة؛ كصلاة وصوم.\n- وتصح الوكالة **منجزة ومعلَّقة ومؤقَّتة**.\n- وتنعقد بكل ما دلَّ عليها من قول وفعل.\n\n**فصل:** والوكالة والشركة والمضاربة والمساقاة والمزارعة والوديعة والجعالة **عقود جائزة من الطرفين**، لكلٍّ من المتعاقدَيْن فسخها، وتبطل كلها بموت أحدهما أو جنونه، وينعزل الوكيل بموت موكله وبعزله.\n\n## كتاب الشركة (ص ٦٢)\n\n**وهي خمسة أنواع، كلها جائزة ممَّن يجوز تصرُّفه:**\n1. **شركة العِنان:** أن يشترك اثنان فأكثر في مال يتجران فيه، ويكون الربح بينهما بحسب ما يتفقان.\n2. **المضاربة:** أن يدفع من ماله إلى إنسان ليتجر فيه، ويكون الربح بينهما بحسب ما يتفقان.\n3. **شركة الوجوه:** أن يشترك اثنان لا مال لهما في ربح ما يشتريان من الناس في ذممهما، ويكون الملك والربح كما شرطا، **والخسارة على قدر الملك**.\n4. **شركة الأبدان:** أن يشتركا فيما يتملكان بأبدانهما من المباح؛ كالاحتشاش والاحتطاب.\n5. **شركة المفاوضة:** أن يفوِّض كلٌّ إلى صاحبه شراءً وبيعًا في الذمة، ومضاربة وتوكيلًا.\n\n## باب المساقاة\n\n**وهي: دفع شجر لمن يقوم بمصالحه بجزء من ثمره، بشرط:**\n1. كون الشجر معلومًا.\n2. وأن يكون له ثمر يؤكل.\n3. وأن يشترط للعامل جزء مشاع معلوم من ثمره.\n\n**والمزارعة (ص ٦٣):** دفع الأرض والحب لمن يزرعه، ويقوم بمصالحه، **بشرط**:\n1. كون البذر معلومًا جنسه وقدره.\n2. وكونه من رب الأرض.\n3. وأن يشترط للعامل جزء معلوم مشاع منه.\n\n**فإن فقد شرط، فالمساقاة والمزارعة فاسدة، والثمر والزرع لربه، وللعامل أجرة مثله.**\n\n## باب الإجارة\n\n**شروطها ثلاثة:**\n1. معرفة المنفعة.\n2. ومعرفة الأجرة.\n3. وكون النفع مباحًا مع بقاء عينه.\n\n**والإجارة ضربان:**\n1. على عَيْن.\n2. على منفعة في الذمة.\n\n- **فلا تصح الإجارة لأذان، وإقامة، وإمامة، وتعليم قرآن، وفقه، وحديث، ونيابة في حج وقضاء**، ولا يقع إلا قربة لفاعله، **ويحرم أخذ الأجرة عليه، وتجوز الجعالة**.\n- والإجارة **عقد لازم** لا تنفسخ بموت المتعاقدين، **وتنفسخ بتلف العين المؤجرة المعيَّنة**.\n\n**فصل (ص ٦٤): والأجير قسمان:**\n1. **خاص:** وهو من قُدِّر نفعه بالزمن.\n2. **مشترك:** وهو من قُدِّر نفعه بالعمل.\n\n- وتستقر الأجرة بفراغ العمل، وبانتهاء المدة.\n- ويصح شرط تعجيل الأجرة وتأخيرها، وإن اختلفا في قدرها تحالفا وتفاسخا.\n- **والمستأجر أمين لا يضمن إلا بالتفريط.**\n- ومتى انقضت الإجارة، رفع المستأجر يده، ولم يلزمه الرد ولا مؤنته، كالمودَع.\n\n## باب المسابقة\n\n**وهي جائزة، ولكن لا يجوز أخذ العوض إلا في مسابقة الخيل والإبل والسهام، بشروط:**\n1. تعيين المركوبين أو الراميين بالرؤية.\n2. اتحاد المركوبين أو القوسين بالنوع.\n3. تحديد المسافة بما جرت به العادة.\n4. علم العوض وإباحته.\n5. الخروج عن شبه القمار.\n\n**والمسابقة جعالة** لا يؤخذ بعوضها رهن، ولا كفيل، ولكلٍّ فسخها ما لم يظهر الفضل لصاحبه.\n\n## كتاب العارية (ص ٦٥)\n\n**وهي مستحبة**، منعقدة بكل قول أو فعل يدل عليها **بشروط**:\n1. كون العين منتفَعًا بها مع بقائها.\n2. وكون النفع مباحًا.\n3. وكون المعير أهلًا للتبرع.\n\n- وللمعير الرجوع في عاريته أيَّ وقت شاء ما لم يضر بالمستعير.\n- والمستعير في استيفاء النفع كالمستأجر، إلا أنه لا يعير ولا يؤجر إلا بإذن المالك.\n- **وإذا قبض المستعير العارية فهي مضمونة عليه، فرَّط أو لا.**\n\n## كتاب الغصب (ص ٦٦)\n\n**وهو: الاستيلاء عرفًا على حق الغير عدوانًا.**\n\n- ويلزم الغاصب رد ما غصب بنمائه، **ولو غرم على رده أضعاف قيمته**.\n- وعلى الغاصب أرش نقص المغصوب، وأجرته مدة مقامه بيده.\n- ومن أتلف — ولو سهوًا — مالًا لغيره ضمنه، وإن أُكره على الإتلاف ضمن من أكرهه.\n\n## باب الشفعة\n\n**لا شفعة لكافر على مسلم**، وتثبت للشريك فيما انتقل عنه ملك شريكه **بشروط خمسة**:\n1. كونه مبيعًا.\n2. كونه مشاعًا.\n3. طلب الشفعة ساعة يعلم.\n4. أخذ جميع المبيع.\n5. سبق ملك الشفيع.\n\n- ويلزم الشفيع أن يدفع للمشتري الثمن الذي وقع عليه العقد.\n- **فإن جهل الثمن ولا حيلة؛ سقطت الشفعة.**\n- وكذا إن عجز الشفيع ولو عن بعض الثمن، وانتُظر ثلاثة أيام ولم يأت به.\n\n## باب الوديعة (ص ٦٧)\n\n- يشترط لصحتها كونها من جائز التصرف لمثله.\n- ويلزم المودَع حفظ الوديعة في حرز مثلها.\n- وإن تعدَّى المودَع في الوديعة حرم عليه، وصار ضامنًا، ووجب عليه ردها فورًا.\n- **والمودَع أمين لا يضمن، إلا إن تعدى أو فرَّط أو خان**، ويقبل قوله بيمينه في عدم ذلك، وفي أنها تلفت.\n\n## باب إحياء الموات\n\n**وهي: الأرض الخراب الدارسة التي لم يجر عليها ملك لأحد**، ولم يوجد فيها أثر عمارة.\n\n- فمن أحيا شيئًا من ذلك — ولو كان ذميًّا أو بلا إذن الإمام — ملكه بما فيه، ولا خراج عليه إلا إن كان ذميًّا.\n- **ويحصل إحياء الأرض الموات:** إما بحائط منيع، أو إجراء ماء، أو غرس شجر، أو حفر بئر فيها.\n\n## باب الجعالة\n\n**وهي: جعل مال معلوم لمن يعمل عملًا مباحًا.**\n\n- فمن فعل العمل بعد أن بلغه الجعل، استحقه كله.\n- وإن بلغه في أثناء العمل، استحق حصة تمامه.\n- وبعد فراغ العمل لم يستحق شيئًا.\n- **وإن فسخ الجاعل قبل تمام العمل؛ لزمه أجرة المثل.**\n- **وإن فسخ العامل فلا شيء له.**\n\n## باب اللقطة (ص ٦٨)\n\n**وهي أقسام ثلاثة:**\n1. **ما لا تتبعه همة أوساط الناس**؛ كسوط ورغيف ونحوهما: فهذا **يملك بالالتقاط ولا يلزمه تعريفه**.\n2. **الضوال التي تمتنع من صغار السباع**؛ كالإبل والبقر والخيل والبغال والحمير والظباء: **فيحرم التقاطها**.\n3. **كالذهب والفضة والمتاع، وما لا يمتنع من صغار السباع**: فهذه **يجوز التقاطها لمن وثق من نفسه الأمانة والقدرة على تعريفها**.\n\n**فصل: وهذا القسم الأخير ثلاثة أنواع:**\n1. **ما التقطه من حيوان:** فيلزمه خير ثلاثة أمور: أكله بقيمته، أو بيعه وحفظ ثمنه، أو حفظه.\n2. **ما يخشى فساده:** فيلزمه فعل الأصلح من: بيعه، أو أكله بقيمته، أو تجفيف ما يجفف.\n3. **باقي الأموال.**\n\n**ويلزمه التعريف في الجميع فورًا نهارًا، أول كل يوم مدة أسبوع، ثم عادةً مدة حول**، وتعريفها: بأن ينادي عليها في الأسواق وأبواب المساجد.\n\nفإذا عرَّفها حولًا ولم تُعرَف، **دخلت في ملكه قهرًا عليه**، فيتصرف فيها بما شاء **بشرط ضمانها**.\n\n**(ص ٦٩)** ويحرم تصرفه فيها حتى يعرف وعاءها ووكاءها وعفاصها، ويعرف قدرها وجنسها وصفتها. **ومتى وصفها طالبها يومًا من الدهر، لزم دفعها إليه.**\n\n## باب اللقيط\n\n**وهو: طفل يوجد لا يعرف نسبه، ولا رقه.**\n\n- **والتقاطه والإنفاق عليه فرض كفاية**، ويحكم بإسلامه وحريته.\n- وينفق عليه مما معه إن كان، **فإن لم يكن، فمن بيت المال، فإن تعذر فعلى من علم بحاله**.\n- والأحق بحضانته واجده إن كان حرًّا مكلفًا رشيدًا أمينًا عدلًا ولو ظاهرًا.\n- **وميراث اللقيط وديته إن قُتل لبيت المال.**\n\n## كتاب الوقف (ص ٧٠)\n\n**يحصل بأحد أمرين:**\n1. **بالفعل مع دليل يدل عليه**، كأن يبني بنيانًا.\n2. **وبالقول**، وله صريح وكناية:\n   - **صريحه:** وقفت، وحبست.\n   - **وكنايته:** تصدَّقت، وحرَّمت، **فلا بد فيها من نية**.\n\n**وشروط الوقف ستة:**\n1. كونه من مالك جائز التصرف.\n2. كون الموقوف عينًا يصح بيعها، وينتفع بها نفعًا مباحًا مع بقائها.\n3. كونه على جهة برّ وقربة.\n4. كونه على معيَّن يصح أن يملك.\n5. كون الوقف منجَّزًا.\n6. أن يقفه على التأبيد.\n\n**فصل:** ويرجع في مصرف الوقف إلى شرط الواقف، فإن جهل عمل بالعادة الجارية، فإن لم يكن فبالعرف، **ونص الواقف كنص الشارع** يجب العمل بجميع ما شرطه ما لم يفض إلى الإخلال بالمقصود.\n\n**فصل (ص ٧١): ويرجع في شرطه إلى الناظر. ويشترط في الناظر خمس:**\n1. الإسلام.\n2. والتكليف.\n3. والكفاية للتصرف.\n4. والخبرة به.\n5. والقوة عليه.\n\nفإن لم يشترط الواقف ناظرًا؛ فالنظر للموقوف عليه مطلقًا حيث كان محصورًا، وإلا فللحاكم.\n\n**ووظيفة الناظر:** حفظ الوقف، وعمارته، وإيجاره، وزرعه، والمخاصمة فيه، وتحصيل ريعه، والاجتهاد في تنميته، وصرف الريع في جهاته من عمارة، وإصلاح، وإعطاء المستحقين.\n\n**والوقف عقد لا يفسخ بإقالة ولا غيرها، ولا يوهب، ولا يرهن، ولا يورث، ولا يباع، إلا أن تتعطل منافعه.**\n\n## باب الهبة\n\n**وهي: التبرع بالمال في حال الحياة**، وهي مستحبة، منعقدة بكل قول أو فعل يدل عليها.\n\n**وشروطها أربعة:**\n1. كونها من جائز التصرف.\n2. وكونه مختارًا غير هازل.\n3. وكون الموهوب يصح بيعه.\n4. وكون الموهوب له يصح تملكه.\n\n- **وتُملك الهبة بالعقد، وتلزم بالقبض.**\n- ويصح أن يهب شيئًا ويستثني نفعه مدة معلومة.\n\n**فصل (ص ٧٢):** ولكل واهب أن يرجع في هبته **قبل إقباضها مع الكراهة**، **وبعد إقباضها يحرم**، ولا يصح ما لم يكن أبًا، فله أن يرجع.\n\n**وللأب الحر أن يتملك من مال ولده ما شاء بشروط ثلاثة:**\n1. أن لا يضره.\n2. وأن لا يكون في مرض موت أحدهما.\n3. وأن لا يعطيه لولد آخر.\n\n## كتاب الوصية (ص ٧٣)\n\n**تصح الوصية من كل عاقل لم يعاين الموت.**\n\n**وتبطل الوصية بخمسة:**\n1. برجوع الموصي بقول أو فعل يدل عليه.\n2. وبموت الموصى له قبل الموصي.\n3. وبقتله للموصي.\n4. وبردِّه للوصية.\n5. وبتلف العين المعينة الموصى بها.\n\n### باب الموصى له\n- تصح الوصية لكل من يصح تمليكه ولو مرتدًّا أو حربيًّا أو لا يملك.\n- **ولا تصح لكنيسة أو بيت نار، أو كتب التوراة والإنجيل، أو مَلَك أو ميت أو جنّي، ولا لمبهم.**\n\n### باب الموصى به\n- **تصح الوصية حتى بما لا يصح بيعه؛ كالآبق، والطير بالهواء، وبالمعدوم**؛ كبما تحمل أمته أو شجرته.\n- وتصح بغير مال ككلب مباح النفع.\n- وتصح بالمنفعة المفردة كخدمة عبد، وتصح بالمبهم كثوب.\n\n### باب الموصى إليه (ص ٧٤)\n- **تصح وصية المسلم إلى كل مسلم مكلف رشيد عدل ولو ظاهرًا**، وتصح من كافر إلى عدل في دينه.\n- وللموصى إليه أن يقبل، وأن يعزل نفسه متى شاء.\n- وتصح الوصية معلَّقة: كإذا بلغ أو حضر، وتصح مؤقتة: كزيد وصيي سنة.\n- وليس للوصي أن يوصي إلا إن جُعل له ذلك.\n- ولا تصح الوصية إلا في شيء معلوم يملك الموصي فعله.\n\n---\n\n## كتاب الفرائض (ص ٧٥)\n\n**وهي: العلم بقسمة المواريث.**\n\n**وإذا مات الإنسان بُدئ من تركته بـ:**\n1. تكفينه وتجهيزه **من رأس ماله**.\n2. ثم ما بقي بعد ذلك يُقضى منه **ديون الله وديون الآدميين**.\n3. وما بقي **تنفَّذ وصاياه من ثلثه**.\n4. ثم يقسم ما بقي **على ورثته**.\n\n**فصل: وأسباب الإرث ثلاثة:**\n1. النسب.\n2. والنكاح الصحيح.\n3. والولاء.\n\n**وموانعه ثلاثة:**\n1. القتل.\n2. والرق.\n3. واختلاف الدين.\n\n**والمجمع على توريثهم من الذكور عشرة:**\n1. الابن. ٢. وابنه وإن نزل. ٣. والأب. ٤. وأبوه وإن علا. ٥. والأخ مطلقًا. ٦. وابن الأخ لا من الأم. ٧. والعم. ٨. وابنه. ٩. والزوج. ١٠. والمعتِق.\n\n**ومن الإناث سبع (ص ٧٦):**\n1. البنت. ٢. وبنت الابن وإن نزل أبوها. ٣. والأم. ٤. والجدة مطلقًا. ٥. والأخت مطلقًا. ٦. والزوجة. ٧. والمعتِقة.\n\n**فصل: والوارث ثلاثة:**\n1. ذو فرض. ٢. وعصبة. ٣. ورحم.\n\n**والفروض المقدَّرة ستة:**\n1. النصف. ٢. والربع. ٣. والثمن. ٤. والثلثان. ٥. والثلث. ٦. والسدس.\n\n**وأصحاب هذه الفروض عشرة:**\n١ـ٢: الزوجان. ٣ـ٤: الأبوان. ٥: الجد. ٦: الجدة مطلقًا. ٧: الأخت مطلقًا. ٨: البنت. ٩: بنت الابن. ١٠: الأخ من الأم.\n\n### فروض الورثة\n\n**فالنصف فرض خمسة:**\n1. الزوج حيث لا فرع وارث للزوجة.\n2. البنت.\n3. وبنت الابن مع عدم أولاد الصلب.\n4. والأخت الشقيقة مع عدم الفرع الوارث.\n5. والأخت للأب مع عدم الأشقاء.\n\n**والربع فرض اثنين (ص ٧٧):**\n1. الزوج مع الفرع الوارث.\n2. والزوجة فأكثر مع عدمه.\n\n**والثمن فرض واحد:** الزوجة فأكثر مع الفرع الوارث.\n\n**والثلثان فرض أربعة:**\n1. البنتين فأكثر.\n2. وبنتَيْ الابن فأكثر.\n3. والأختين الشقيقتين فأكثر.\n4. والأختين للأب فأكثر.\n\n**والثلث فرض اثنين:**\n1. ولَدَيْ الأم فأكثر، يستوي فيه ذكرهم وأنثاهم.\n2. والأم حيث لا فرع وارث للميت، ولا جمع من الإخوة والأخوات.\n\n**والسدس فرض سبعة:**\n1. الأم مع: الفرع الوارث، أو جمع من الإخوة والأخوات.\n2. والجدة فأكثر إلى ثلاث إن تساوَيْن مع عدم الأم.\n3. وولد الأم الواحد.\n4. وبنت الابن فأكثر مع بنت الصلب.\n5. والأخت للأب مع الأخت الشقيقة.\n6. والأب مع الفرع الوارث.\n7. والجد كذلك.\n\n### باب الحجب\n1. **الحجب بالوصف.**\n2. **والحجب بالشخص:** نقصانًا وحرمانًا.\n\n- والجد يسقط بالأب، والجدة تسقط بالأم، وابن أبعد يسقط بابن أقرب.\n- **(ص ٧٨)** وتسقط الإخوة الأشقاء باثنين: بالابن وإن نزل، وبالأب الأقرب.\n- والإخوة للأب يسقطون بالأخ الشقيق، وبنو الإخوة يسقطون بالجد.\n- والأعمام يسقطون ببني الإخوة.\n- **والأخ للأم يسقط باثنين:** بفروع الميت مطلقًا وإن نزلوا، وبأصوله الذكور وإن علوا.\n- وتسقط بنات الابن ببنتَيْ الصلب فأكثر، ما لم يكن معهن من يعصبهن من ولد الابن.\n- وتسقط الأخوات للأب بالأختين الشقيقتين فأكثر، ما لم يكن معهن أخوهن فيعصبهن.\n- **ومن لا يرث لا يحجب أحدًا مطلقًا.**\n\n### باب العصبات\n- النساء كلهن صاحبات فرض، **وليس فيهن عصبة بنفسه إلا المعتِقة**.\n- **والرجال كلهم عصبات بأنفسهم إلا الزوج وولد الأم.**\n- والأخوات مع البنات عصبات.\n- والبنات، وبنات الابن، والأخوات الشقيقات، والأخوات للأب، كل واحدة منهن مع أخيها عصبة به، له مثلا ما لها.\n- **وحكم العاصب: أن يأخذ ما أبقت الفروض، وإن لم يبق شيء سقط، وإذا انفرد أخذ جميع المال.**\n\n**فصل (ص ٧٩):**\n- **إذا اجتمع كل الرجال، ورث منهم ثلاثة:** الابن، والأب، والزوج.\n- **وإذا اجتمع كل النساء، ورث منهن خمسة:** البنت، وبنت الابن، والأم، والزوجة، والأخت الشقيقة.\n- **وإذا اجتمع ممكن الجمع من الصنفين، ورث خمسة:** الأبوان، والولدان، وأحد الزوجين.\n\n### باب أصول المسائل\n**وهي سبعة:** ١ـ اثنان. ٢ـ وثلاثة. ٣ـ وأربعة. ٤ـ وستة. ٥ـ وثمانية. ٦ـ وإثنا عشر. ٧ـ وأربعة وعشرون.\n\n**ولا يعول منها إلا الستة:**\n- **فالستة تعول متوالية** إلى سبعة، وإلى ثمانية، وإلى تسعة، وإلى **عشرة**.\n- **والاثنا عشر تعول أفرادًا** إلى ثلاثة عشر، وإلى خمسة عشر، وإلى **سبعة عشر**.\n- **والأربعة والعشرون تعول إلى سبعة وعشرين.**\n\n---\n\n## كتاب العتق (ص ٨٠)\n\n- وهو من أعظم القُرَب، فيسن عتق رقيق له كَسْب، وهكذا الكتابة.\n- يحصل العتق بالقول، **وصريحه: لفظ العتق**، **وكنايته: خلَّيْتُك**.\n- ويحصل بالفعل: فمن مثَّل برقيقه فجدَّع أنفه أو أذنه أو نحوهما، عتق في الجميع.\n- ويحصل بالملك: فمن ملك ذا رحم محرم من النسب، عتق عليه.\n- ويصح تعليق العتق بالصفة.\n\n### باب التدبير\n**وهو: تعليق العتق بالموت**؛ كقوله لرقيقه: إن مُتُّ فأنت حر بعد موتي.\n- ويعتبر كونه ممن تصح وصيته، **وكونه من الثلث**.\n- ويصح مطلقًا، ومقيدًا، ومعلَّقًا، ومؤقَّتًا.\n- ويصح بيع المدبر وهبته، **ويبطل بثلاثة أشياء:** بوقفه، وبقتله لسيده، وبإيلاد الأمة.\n\n### باب الكتابة (ص ٨١)\n**وهي: بيع السيد رقيقه نفسه:**\n1. بمال في ذمته. ٢. مباح. ٣. معلوم. ٤. منجَّم بنجمَيْن فصاعدًا. ٥. يعلم قدر كل نجم ومدته.\n\n- والكتابة في الصحة والمرض من رأس المال.\n- ومتى أدى المكاتب ما عليه لسيده، أو أبرأه منه؛ **عتق**.\n- ويملك المكاتب كسبه ونفعه والنفقة على نفسه، **لكن ملكه غير تام**.\n\n### باب أحكام أم الولد\n**وهي: من ولدت من المالك ما فيه صورة ولو خفية**، وتعتق بموته وإن لم يملك غيرها.\n\n---\n\n## كتاب النكاح (ص ٨٢)\n\n**حكمه:**\n1. **يُسن** لذي شهوة لا يخاف الزنا.\n2. **ويجب** على من يخافه.\n3. **ويباح** لمن لا شهوة له.\n4. **ويحرم** بدار الحرب لغير ضرورة.\n\nويُسن نكاح ذات الدِّين الولود البكر الحسيبة.\n\n**والنظر أقسام ثمانية (خلاصتها):**\n1. نظر الرجل البالغ للحرة البالغة الأجنبية لغير حاجة: **لا يجوز**.\n2. نظره لمن لا تشتهى؛ كعجوز: يجوز لوجهها خاصة.\n3. نظره للشهادة: يجوز لوجهها، وكفَّيها لحاجة.\n4. نظره لحرة بالغة يخطبها: يجوز للوجه والرقبة واليد والقدم.\n5. نظره إلى ذوات محارمه، أو لبنت تسع: يجوز للوجه والرقبة واليد والقدم والرأس والساق.\n6. نظره للمداواة: يجوز للمواضع التي يحتاج إليها.\n7. نظره لأمته المحرمة، ولحرة مميزة دون تسع، ونظر المرأة للمرأة وللرجل الأجنبي: يجوز إلى ما عدا ما بين السرة والركبة.\n8. نظره لزوجته وأمته المباحة له ولو لشهوة: يجوز لكلٍّ نظر جميع بدن الآخر.\n\n## باب ركنَيْ النكاح وشروطه (ص ٨٣)\n\n**ركناه:**\n1. الإيجاب.\n2. والقبول مرتبين.\n\n**وشروطه خمسة:**\n- **الأول:** تعيين الزوجين.\n- **الثاني:** رضى زوج مكلف.\n- **الثالث:** الولي.\n- **الرابع (ص ٨٤): الشهادة**، فلا ينعقد إلا بشهادة ذكرين مكلَّفين مسلمين عدلين ولو ظاهرًا، من غير أصلي الزوجين وفرعيهما.\n- **الخامس:** خلوّ الزوجَيْن من الموانع من نسب أو سبب.\n\n**وشرط في الولي سبعة:**\n1. ذكورية. ٢. وعقل. ٣. وبلوغ. ٤. وحرية. ٥. واتفاق دين. ٦. وعدالة. ٧. ورشد.\n\n**والأحق بتزويج الحرة:**\n1. أبوها وإن علا. ٢. فابنها وإن نزل. ٣. فالأخ الشقيق. ٤. فالأخ للأب. ٥. ثم الأقرب فالأقرب كالإرث. ٦. ثم السلطان أو نائبه.\n\n## باب المحرَّمات في النكاح (ص ٨٤)\n\n**تحرم أبدًا عشر:**\n1. الأم. ٢. والجدة من كل جهة. ٣. والبنت ولو من زنى. ٤. وبنت الولد. ٥. والأخت من كل جهة. ٦. وبنت ولدها. ٧. وبنت كل أخ. ٨. وبنت ولدها. ٩. والعمة. ١٠. والخالة.\n\n**ويحرم بالرضاع ما يحرم بالنسب.**\n\n**ويحرم بالمصاهرة أربع: ثلاث بمجرد العقد:**\n1. زوجة أبيه وإن علا.\n2. وزوجة ابنه وإن سفل.\n3. وأم زوجته.\n4. فإن وطئها حرمت عليه بنتها، وبنت ابنها.\n\n**ويحرم الجمع** بين الأختين، وبين المرأة وعمَّتها أو خالتها.\n**وليس لحرٍّ جمع أكثر من أربع، ولا لعبد جمع أكثر من ثنتين، ولمن نصفه حر فأكثر جمع ثلاث.**\n\n## كتاب الصداق (ص ٨٥)\n\n- تسن تسميته في العقد، **ويصح بأقل متموَّل**.\n- فإن لم يسمَّ أو سمَّى فاسدًا **صح العقد، ووجب مهر المثل**.\n- ويشترط علم الصداق، ولا يضر جهل اليسير.\n- وتملك الزوجة بالعقد جميع المسمى، ولها التصرف فيه، **وإن أقبضها الصداق ثم طلق قبل الدخول، رجع عليها بنصفه**.\n- **والذي بيده عقدة النكاح الزوج.**\n\n**فصل: يسقط كله قبل الدخول حتى المتعة في ثلاث:**\n1. بفرقة اللعان.\n2. وبفسخه لعيبها.\n3. وبفرقة من قِبَلها.\n\n**ويتنصَّف:** بالفرقة من قِبَل الزوج؛ كطلاقه، وخلعه، وإسلامه، وردته.\n\n**ويقرِّره كاملًا خمسة:**\n1. موت أحدهما.\n2. ووطؤه، ولمسه لها.\n3. ونظره إلى فرجها لشهوة.\n4. وتقبيلها ولو بحضرة الناس.\n5. وبطلاقها في مرض موت ترث فيه.\n\n## باب الوليمة وآداب الأكل (ص ٨٦)\n\n- **وليمة العرس سنَّة مؤكَّدة.**\n- **والإجابة إليها في المرة الأولى واجبة** إن كان لا عذر ولا منكر، **وفي الثانية سنَّة، وفي الثالثة مكروهة**، وإنما تجب إذا كان الداعي مسلمًا يحرم هجره، وكسبه طيب.\n- وإن دعاه اثنان فأكثر، وجبت عليه إجابة الكل إن أمكنه الجمع، وإلا أجاب الأسبق قولًا، فالأدْيَن، فالأقرب رحمًا، فجوارًا، ثم يقرع.\n\n**فصل: من آداب الأكل:** يستحب غسل اليدين قبل الطعام وبعده، وتُسنُّ التسمية جهرًا، والجلوس على رجله اليسرى ونصب اليمنى أو التربُّع، والأكل باليمين بثلاث أصابع مما يليه، وتصغير اللقمة، وإطالة المضغ، ومسح الصحفة، وغض الطرف عن جليسه، وإيثار المحتاج، ولعق الأصابع، وتخليل الأسنان.\n**ويكره:** نفخ الطعام، وكونه حارًّا، والأكل بأقل أو أكثر من ثلاث أصابع، أو بشماله، أو من أعلى الصحفة أو وسطها، ونفض يده في القصعة، والأكل متكئًا أو مضطجعًا، وأكله كثيرًا بحيث يؤذيه أو قليلًا بحيث يضره.\n\n## باب عشرة النساء (ص ٨٧)\n\n- يلزم كلًّا من الزوجَيْن معاشرة الآخر بالمعروف من الصحبة الجميلة، وكفِّ الأذى، وألا يمطله بحقه.\n- **وحق الزوج عليها أعظم من حقها عليه.**\n- وإذا تم العقد، وجب على المرأة أن تسلِّم نفسها لبيت زوجها إذا طلبها إذا كانت حرة يمكن الاستمتاع بها.\n\n**فصل:** وللزوج أن يستمتع بزوجته كل وقت ما لم يضرها، أو يشغلها عن الفرائض، **ولا يجوز لها أن تتطوع بصلاة أو صوم وهو حاضر إلا بإذنه**، ويحرم وطؤها في الدبر، ونحو الحيض.\n\n---\n\n## كتاب الخلع (ص ٨٨)\n\n**شروطه خمسة:**\n1. أن يقع من زوجٍ يصح طلاقه.\n2. أن يكون على عوض.\n3. أن يقع منجَّزًا.\n4. أن لا يقع بلفظ الطلاق بل بصيغته الموضوعة له.\n5. أن لا ينوي به الطلاق.\n\n**فمتى توفرت الشروط كان فسخًا بائنًا لا ينقص به عدد الطلاق.**\n\n- **وصيغته الصريحة** التي لا تحتاج إلى نية: **خلعت، وفسخت**.\n- **والكناية:** باريتك، وأبرأتك، وأبنتك.\n\n## كتاب الطلاق (ص ٨٩)\n\n- **يباح** لسوء عشرة الزوجة.\n- **ويُسن** إن تركت الصلاة ونحوها.\n- **ويكره** من غير حاجة.\n- **ويحرم** في الحيض ونحوه.\n- **ويجب** على المؤلي بعد التربص.\n\n### باب سنَّة الطلاق وبدعته\n- **السنَّة** لمن أراد طلاق زوجته: أن يطلِّقها **واحدة في طهر لم يطأها فيه**.\n- فإن طلقها ثلاثًا — ولو بكلمات — **فحرام**.\n- **وفي الحيض، أو في طهر وطئ فيه ولو بواحدة، فبِدْعيٌّ حرام ويقع.**\n- **ولا سنَّة ولا بدعة** لمن لم يدخل بها، ولا الصغيرة، ولا الآيسة، ولا الحامل.\n\n### باب صريح الطلاق وكنايته\n- **صريحه لا يحتاج إلى نية، وهو لفظ الطلاق وما تصرف منه.**\n- فإذا قال لزوجته: أنت طالق، طُلِّقت هازلًا كان أو لاعبًا، أو لم ينو.\n- ومن طلَّق في قلبه لم يقع، فإن تلفَّظ به، أو حرَّك لسانه وقع ولو لم يسمعه.\n- **وكنايته** لا بد فيها من نية الطلاق، وهي قسمان:\n  - **ظاهرة:** أنت خلية، وبرية، وبائن، وبتة، وبتلة، وأنت حرة. **يقع بها الثلاث.**\n  - **خفية (ص ٩٠):** اخرجي، واذهبي، وذوقي، وتجرَّعي، وخلَّيْتك. **يقع بها واحدة ما لم ينو أكثر.**\n\n### باب ما يختلف به عدد الطلاق\n**يملك الحر والمبعَّض ثلاث طلقات، والعبد طلقتين.**\n\n**ويقع الطلاق بائنًا في أربع مسائل:**\n1. إذا كان على عوض.\n2. أو قبل الدخول.\n3. أو في نكاح فاسد.\n4. أو بالثلاث.\n\n**ويقع ثلاثًا إذا قال:**\n1. أنت طالق بلا رجعة. ٢. أو البتة. ٣. أو بائنًا.\n\n### باب الرجعة\n**وهي: إعادة زوجته المطلَّقة إلى ما كانت عليه بغير عقد، من شرطها:**\n1. أن يكون الطلاق غير بائن.\n2. وأن تكون في العدة.\n\n**وتصح الرجعة:**\n1. بعد انقطاع دم الحيضة الثالثة حيث لم تغتسل.\n2. وتصح قبل وضع ولد متأخر.\n\n**وألفاظها:** راجعتها، وأمسكتها، ورددتها، ونحوه.\n\n**(ص ٩١)** ومتى اغتسلت من الحيضة الثالثة ولم يرتجعها، **بانت**، ولم تحل له إلا بعقد جديد، وتعود على ما بقي من طلاقها.\n**وإذا طلَّق الحر ثلاثًا، أو طلَّق العبد ثنتين، لم تحلَّ له حتى تنكح زوجًا غيره نكاحًا صحيحًا.**\n\n## كتاب الإيلاء (ص ٩٢)\n\n**وهو حرام؛ كالظهار، ويصح من زوج يصح طلاقه.**\n\n- فإذا حلف الزوج بالله تعالى، أو بصفة من صفاته أنه لا يطأ زوجته أبدًا، **أو مدة تزيد على أربعة أشهر، صار مؤليًا**.\n- **ويؤجِّل له الحاكم إن سألت ذلك زوجته أربعة أشهر** من حين يمينه.\n- ثم يخيَّر بعدها بين أن يكفِّر ويطأ، أو يطلِّق.\n- **فإن امتنع من ذلك طلَّق عليه الحاكم.**\n\n## كتاب الظهار (ص ٩٣)\n\n**وهو: أن يشبِّه امرأته بمن يحرم عليه**، فمن قال لزوجته: أنت عليَّ كظهر أمي، أو أنت عليَّ حرام؛ صار مظاهِرًا.\n\n- ويصح الظهار من كل من يصح طلاقه **منجَّزًا، أو معلَّقًا، أو محلوفًا به**.\n- وإذا صح الظهار، **حرم على المظاهر الوطء ودواعيه قبل التكفير**، فإن وطئ ثبتت الكفارة في ذمته، ثم لا يطأ حتى يكفِّر، وإن مات أحدهما قبل الوطء فلا كفارة.\n\n**فصل: والكفارة فيه على الترتيب:**\n1. **عتق رقبة مؤمنة سالمة من العيوب.**\n2. فإن لم يجد **فصيام شهرين متتابعين**، ويلزمه تبييت النية من الليل.\n3. فإن لم يستطع **أطعم ستين مسكينًا**، لكل مسكين مُدّ بُرّ أو نصف صاع من غيره.\n\n## كتاب اللعان (ص ٩٤)\n\nإذا رمى الزوج زوجته بالزنا فعليه حدُّ القذف أو التعزير، **إلا أن يقيم البينة أو يلاعن**.\n\n**صفة اللعان:** أن يقول الزوج أربع مرات: «أشهد بالله إني لمن الصادقين فيما رميتها به من الزنا» ويشير إليها، ثم يزيد في الخامسة: «وأنَّ لعنة الله عليه إن كان من الكاذبين». ثم تقول الزوجة أربعًا: «أشهد بالله إنه لمن الكاذبين فيما رماني به من الزنا»، ثم تزيد في الخامسة: «وأنَّ غضب الله عليها إن كان من الصادقين».\n\n**فصل: وشروط اللعان ثلاثة:**\n1. كونه بين زوجين مكلَّفَيْن.\n2. أن يتقدمه قذفها بالزنا.\n3. أن تكذِّبه، ويستمر تكذيبها إلى انقضاء اللعان.\n\n**ويثبت بتمام تلاعنهما أربعة أحكام:**\n1. سقوط الحد أو التعزير.\n2. الفرقة ولو بلا فعل الحاكم.\n3. التحريم المؤبَّد.\n4. انتفاء الولد.\n\n## كتاب العِدَّة (ص ٩٥)\n\n**وهي: تربُّص من فارقت زوجها بوفاة، أو حياة.**\n\n**فالمفارقة بالوفاة تعتد مطلقًا:**\n1. فإن كانت حاملًا من الميت، **فعدتها حتى تضع كل الحمل**.\n2. وإن لم تكن حاملًا، فإن كانت حرة، **فعدتها أربعة أشهر وعشر ليال**، وعدَّة الأمة نصفها.\n\n**والمفارقة في الحياة لا تعتدُّ إلا إن خلا بها أو وطئها:**\n- وعدتها إن كانت حاملًا: **بوضع الحمل**.\n- وإن لم تكن حاملًا:\n  - إن كانت تحيض: **ثلاث حيض** إن كانت حرة، **وحيضتان** إن كانت أمة.\n  - وإن لم تكن تحيض (صغيرة، أو بالغة لم تر حيضًا ولا نفاسًا، أو آيسة — وهي من بلغت خمسين سنة): **ثلاثة أشهر** إن كانت حرة، **وشهران** إن كانت أمة.\n\n**فصل:**\n- **ويجب الإحداد على المتوفى عنها زوجها بنكاح صحيح ما دامت في العدة.**\n- **والإحداد:** ترك الزينة والطيب، ولها لبس الأبيض ولو حريرًا.\n- **وتجب عدة الوفاة في المنزل الذي مات زوجها فيه، ما لم يتعذر.**\n\n## كتاب الرَّضاع (ص ٩٦)\n\n- **يكره** استرضاع الفاجرة، والكافرة، وسيئة الخُلق.\n- وإذا أرضعت المرأة طفلًا بلبن حمل لاحق بالوطء، صار ذلك الطفل ولدهما.\n- **وتحريم الرَّضاع في النكاح، وثبوت المحرميَّة؛ كالنسب، بشرط أن يرتضع خمس رضعات في العامين.**\n\n## كتاب النَّفَقات (ص ٩٧)\n\n- **يجب على الزوج ما لا غنى لزوجته عنه من مأكل، ومشرب، وملبس، ومسكن بالمعروف.**\n- والواجب عليه دفع الطعام في أول كل يوم، ويجوز دفع عوضه إن تراضيا، **وتجب لها الكسوة في أول كل عام**.\n- **والرجعية مطلقًا، والبائن والناشز الحامل، والمتوفى عنها زوجها حاملًا؛ كالزوجة في النفقة والكسوة والمسكن، ولا شيء لغير الحامل منهن.**\n\n### باب نفقة الأقارب والمماليك\nيجب على القريب نفقة أقاربه، وكسوتهم، وسكناهم بالمعروف **بثلاثة شروط**:\n- **الأول:** أن يكونوا فقراء لا مال لهم ولا كسب.\n- **الثاني:** أن يكون المنفق غنيًّا، إما بماله أو كسبه، وأن يفضل عن قوت نفسه وزوجته ورقيقه يومه وليلته.\n- **الثالث:** أن يكون وارثًا لهم بفرض أو تعصيب، **إلا الأصول والفروع فتجب لهم وعليهم مطلقًا**.\n\n**فصل (ص ٩٨):** وعلى السيد نفقة مملوكه، وكسوته، ومسكنه، وتزويجه إن طلب. **ويحرم** أن يضربه على وجهه، أو يشتم أبوَيْه ولو كافرَيْن، أو يكلِّفه من العمل ما لا يطيق، **ويجب** أن يريحه وقت القيلولة، ووقت النوم، والصلاة المفروضة.\n\n**فصل:** وعلى مالك البهيمة إطعامها وسقيها، فإن امتنع أُجبر، فإن أبى أو عجز أُجبر على بيعها، أو إجارتها، أو ذبحها إن كانت تؤكل. **ويحرم** لعنها، وتحميلها مشقًّا، وحلبها ما يضر ولدها، وضربها في وجهها، ووسمها فيه، وذبحها إن كانت لا تؤكل، ويجوز استعمالها في غير ما خُلقت له.\n\n### باب الحضانة\n**وهي: حفظ الطفل غالبًا عمَّا يضره، والقيام بمصالحه**؛ كغسل رأسه، وثيابه، ودهنه، وتكحيله، وربطه في المهد ونحوه، وتحريكه لينام.\n\n**والأحق بها:**\n1. الأم. ٢. ثم أمهاتها القربى. ٣. ثم الأب. ٤. ثم أمهاته.\n\n- **وإذا بلغ الصبي سبع سنين عاقلًا خُيِّر بين أبويه، وإذا بلغت الأنثى سبعًا كانت عند أبيها وجوبًا إلى أن تتزوج.**\n- ولا يترك المحضون بيد من لا يصونه ويصلحه.\n\n---\n\n## كتاب الأطعمة (ص ١٠٨)\n\n- **يباح** كل طعام طاهر لا مضرة فيه، **ويحرم النجس**؛ كالميتة والدم ولحم الخنزير.\n- **ويحرم من حيوان البر:** ما يفترس بنابه؛ كأسد ونمر وذئب.\n- **ويحرم من الطير:** ما يصيد بمخلبه؛ كعقاب وباز وصقر، وما يأكل الجيف: كنسر وغراب.\n- **ويباح ما عدا هذا**؛ كبهيمة الأنعام وباقي الوحش؛ كضبع، وباقي الطير؛ كنعام ودجاج.\n- **ويحلُّ كل ما في البحر غير ضفدع وحية وتمساح.**\n- **وتحرم الجلَّالة:** وهي التي أكثر علفها النجاسة، ولبنها وبيضها، **حتى تُحبس ثلاثًا وتُطعم الطاهر**.\n\n**فصل:** ومن اضطُر جاز له أن يأكل من المحرَّم ما يسدُّ رمقه فقط. ومن مرَّ بثمرة بستان لا حائط عليه ولا ناظر، فله من غير أن يصعد على شجرة، أو يرميه بحجر أن يأكل ولا يحمل. **وتجب ضيافة المسلم على المسلم في القرى دون الأمصار يومًا وليلة، ويستحب ثلاثًا.**\n\n## باب الذَّكاة (ص ١٠٩)\n\n**وهي: ذبح أو نحر الحيوان المقدور عليه.**\n\n**وشروطها أربعة:**\n1. كون الفاعل عاقلًا مميِّزًا قاصدًا للذكاة.\n2. **الآلة**؛ فيحلُّ بكل محدَّد **غير السن والظفر**.\n3. قطع الحلقوم والمريء.\n4. قول: «بسم الله».\n\n- ويُسن التكبير، **وتسقط التسمية سهوًا لا جهلًا**، ومَن ذكر مع اسم الله تعالى اسمَ غيره لم تحلَّ.\n- ويُسن توجيهه للقبلة على جنبه الأيسر، والإسراع في الذبح.\n\n## كتاب الصيد (ص ١١٠)\n\n- **يباح** لقاصده، **ويكره** لهوًا، وهو أفضل مأكول.\n- فمن أدرك صيدًا مجروحًا متحركًا فوق حركة مذبوح فاتسع الوقت لتذكيته؛ لم يبح إلا بها.\n\n**وإن لم يتسع بل مات في الحال حلَّ بأربعة شروط:**\n- **أحدها:** كون الصائد أهلًا للذكاة.\n- **الثاني: الآلة**؛ وهي نوعان:\n  1. ما له حدٌّ يجرح به؛ كسيف وسكين وسهم.\n  2. جارحة معلَّمة؛ ككلب وفهد وباز وصقر.\n  - **فتعليم الكلب والفهد بثلاثة أمور:** ١ـ بأن يسترسل إذا أُرسل. ٢ـ وينزجر إذا زُجر. ٣ـ وإذا أمسك لم يأكل.\n  - **وتعليم الطَّيْر بأمرين:** ١ـ بأن يسترسل إذا أُرسل. ٢ـ ويرجع إذا دُعي.\n  - ويشترط أن يجرح الصيد، فلو قتله بصدم أو خنق لم يبح.\n- **الثالث:** قصد الفعل.\n- **الرابع:** قول: «بسم الله» عند إرسال جارحه، أو رمي سلاحه، **ولا تسقط هنا سهوًا**.\n\n## كتاب الأَيْمان (ص ١١١)\n\n**لا تنعقد اليمين إلا بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته.**\n**ومن حلف بمخلوق:** كالأولياء والأنبياء، أو بالكعبة ونحوها: **حرم ولا كفارة**.\n\n**فصل: وشروط وجوب الكفارة خمسة:**\n1. كون الحالف مكلَّفًا.\n2. كونه مختارًا.\n3. كونه قاصدًا لليمين.\n4. كونها على أمر مستقل.\n5. **الحنث** بفعل ما حلف على تركه، أو ترك ما حلف على فعله.\n\n**فصل: وكفارة اليمين على التخيير:**\n1. إطعام عشرة مساكين.\n2. أو كسوتهم.\n3. أو تحرير رقبة مؤمنة.\n- **فإن لم يجد؛ صام ثلاثة أيام متتابعة وجوبًا إن لم يكن عذر.**\n\n### باب جامع الأَيْمان (ص ١١٢)\nيرجع في الأَيْمان إلى **نية الحالف**، فإن لم ينو شيئًا رجع إلى **سبب اليمين** وما هيَّجها، فإن عدم النية والسبب رجع إلى **التعيين**، فإن عدم الثلاثة رجع إلى **ما تناوله الاسم** وهو ثلاثة: شرعي، فعرفي، فلغوي.\n\n## باب النَّذْر (ص ١١٢)\n\n**وهو مكروه، لا يأتي بخير، ولا يرد قضاءً، ولا يصح إلا بالقول من مكلَّف مختار.**\n\n**وأنواعه المنعقدة ستة؛ أحكامها مختلفة:**\n1. **النذر المطلق:** فيلزمه كفارة يمين.\n2. **نذر لجاج وغضب:** فيخيَّر بين الفعل أو كفارة يمين.\n3. **نذر مباح:** فيخيَّر أيضًا.\n4. **نذر مكروه:** فيُسن أن يكفِّر ولا يفعله.\n5. **نذر معصية:** فيحرم الوفاء به، ويكفِّر ويقضي الصوم.\n6. **نذر تبرُّر:** فهذا يجب الوفاء به.\n\n---\n\n## ملحق: أبواب القضاء والشهادات والإقرار (متصلة بالمعاملات)\n\n### كتاب القضاء (ص ١١٣)\nوهو **فرض كفاية**، فيجب على الإمام أن ينصب بكل إقليم قاضيًا، ويختار لذلك أفضل من يجد علمًا وورعًا.\n**ويشترط في القاضي عشر خصال؛ كونه:** ١ـ بالغًا. ٢ـ عاقلًا. ٣ـ ذكرًا. ٤ـ حرًّا. ٥ـ مسلمًا. ٦ـ عدلًا. ٧ـ سميعًا. ٨ـ بصيرًا. ٩ـ متكلمًا. ١٠ـ مجتهدًا ولو في مذهب إمامه للضرورة.\n\n### باب القسمة\n**وهي نوعان:**\n1. **قسمة تراضٍ:** فلا قسمة في مشترك إلا برضاء الشركاء كلهم حيث كان في القسمة ضرر ينقص القيمة؛ كحمَّام، ودور صغار، وشجر مفرد، وحيوان. **وحيث تراضيا صحَّت وكانت بيعًا.**\n2. **قسمة إجبار (ص ١١٤):** وهي ما لا ضرر فيها ولا ردَّ عوض، وتتأتى في كل مكيل وموزون، ودار كبيرة، وأرض واسعة. **وهذا النوع ليس بيعًا**، فيجبر الحاكم أحد الشريكين إذا امتنع.\n\n### باب الدعاوى والبيِّنات\nلا تصح الدعوى إلا من جائز التصرف. وإذا تداعيا عينًا لم تخلُ من أربعة أحوال: ألا تكون بيد أحد ولا ثَمَّ ظاهر ولا بينة فيتحالفان ويتناصفانها؛ أو تكون بيد أحدهما فهي له بيمينه؛ أو بيدَيْهما فيتحالفان ويتناصفانه؛ أو بيد ثالث.\n\n### كتاب الشهادات (ص ١١٥)\n- **تحمُّل الشهادة في حقوق الآدميين فرض كفاية، وأداؤها فرض عين.**\n- ويحرم أخذ أجرة وجُعل عليها، ويحرم كتم الشهادة.\n- **ويجب الإشهاد في عقد النكاح خاصة، ويُسن في كل عقد سواه.**\n\n**باب شروط من تقبل شهادته، وهي ستة:** ١ـ البلوغ. ٢ـ العقل. ٣ـ النطق. ٤ـ الحفظ. ٥ـ الإسلام. ٦ـ العدالة.\n**ويعتبر لها شيئان:** ١ـ الصلاح في الدِّين. ٢ـ استعمال المروءة.\n\n**باب موانع الشهادة (ص ١١٦)، وهي ستة:**\n1. كون الشاهد أو بعضه ملكًا لمن شهد له، أو من فروعه أو أصوله.\n2. كونه يجرُّ بها نفعًا لنفسه.\n3. أن يدفع بها ضررًا عن نفسه.\n4. العداوة لغير الله تعالى.\n5. العصبية.\n6. أن تُردَّ شهادته لفسقه.\n\n**باب أقسام المشهود به:**\n1. **الزنا:** لا بد من أربعة رجال.\n2. **دعوى الفقر ممن عُرف بغنى:** لا بد من ثلاثة رجال.\n3. **القَوَد والإعسار وما يوجب الحد والتعزير، ومثله النكاح والرجعة والخلع والطلاق والنسب:** لا بد من رجلَيْن.\n4. **المال وما يقصد به المال؛ كالقرض والرهن والوقف والبيع:** يكفي رجلان، أو رجل وامرأتان، أو رجل ويمين.\n5. **داء دابة وموضحة ونحوهما:** يقبل قول طبيب وبيطار واحد.\n6. **ما لا يطَّلع عليه الرجال غالبًا:** يكفي امرأة عدل، والأحوط اثنتان.\n\n**باب اليمين في الدعاوى (ص ١١٧):** **البيِّنة على المدَّعي، واليمين على من أنكر**، ولا يمين على منكر ادُّعي عليه بحق الله؛ كالحد ولو قذفًا، والتعزير، والعبادة، وإخراج الصدقة، والكفارة، والنذر. ويحلف المنكر في كل حق آدمي يقصد منه المال؛ كالديون والجنايات والإتلافات، **فإن نكل عن اليمين قُضي عليه بالحق**.\n\n### كتاب الإقرار (ص ١١٨)\n**لا يصح الإقرار إلا من مكلَّف مختار، ولو هازلًا، بلفظ أو كتابة، لا بإشارة إلا من أخرس**، لكن لو أقرَّ صغير أو قِنٌّ أُذن لهما في تجارة في قدر ما أُذن لهما فيه؛ صحَّ.\n\n*(وهو آخر الكتاب.)*\n\n\n# الجنايات والديات والحدود\nمن كتاب **الكوكب الغارب في اختصار دليل الطالب** (فقه حنبلي) — الصفحات المطبوعة **99 – 107**.\n\n---\n\n## كتاب الجنايات (ص 99 – 100)\n\n**تعريفها:** التعدي على البدن بما يوجب قصاصًا أو مالًا.\n\n### أقسام القتل (ص 99)\nالقتل ثلاثة أقسام:\n1. **العمد العدوان:** أن يقصد الجاني من يعلمه آدميًا معصومًا، فيقتله بما يغلب على الظن موته به. ويختص به القصاص أو الدية، فالولي مخيَّر، وعفوه مجانًا أفضل.\n2. **شبه العمد:** أن يقصده بجناية لا تقتل غالبًا، ولم يجرحه بها؛ فإن جرحه ولو جرحًا صغيرًا قُتل به.\n3. **الخطأ:** أن يفعل ما يجوز له فعله من رمي صيد ونحوه.\n\nوفي القسمين الأخيرين (شبه العمد والخطأ): **الكفارة على القاتل، والدية على عاقلته**.\n\n### باب شروط القصاص في النفس (ص 99)\nوهي **أربعة**:\n1. تكليف القاتل.\n2. عصمة المقتول.\n3. المكافأة.\n4. أن يكون المقتول ليس بولد للقاتل.\n\n### باب شروط استيفاء القصاص (ص 99 – 100)\nوهي **ثلاثة**:\n1. تكليف المستحق.\n2. اتفاق المستحقين على استيفائه.\n3. أن يؤمن في استيفائه تعدِّيه إلى الغير.\n\nويحرم استيفاء القصاص بلا حضرة السلطان أو نائبه.\n\n### باب شروط القصاص فيما دون النفس (ص 100)\nالقاعدة: من أُخذ بغيره في النفس أُخذ به فيما دونها، ومن لا فلا.\n\nوشروطه:\n1. العمد العدوان، فلا قصاص في غيره.\n2. إمكان الاستيفاء بلا حيف، بأن يكون القطع من مفصل.\n3. المساواة في الاسم، فلا تقطع اليد بالرجل وعكسه.\n4. مراعاة الصحة والكمال، فلا تؤخذ كاملة الأصابع والأظفار بناقصتها.\n\n---\n\n## كتاب الدِّيات (ص 101 – 103)\n\nمن أتلف إنسانًا أو جزءًا منه بمباشرة أو سبب: **إن كان عمدًا فالدية في ماله، وإن كان غير عمد فعلى عاقلته**.\n\n### فصل في مقادير ديات النفس (ص 101)\n1. **دية الحر المسلم** طفلًا كان أو كبيرًا:\n   - أ ـ مائة بعير.\n   - ب ـ أو مائتا بقرة.\n   - ج ـ أو ألفا شاة.\n   - د ـ أو ألف مثقال ذهب.\n   - هـ ـ أو اثنا عشر ألف درهم فضة.\n2. دية الحرة المسلمة: **على النصف** من ذلك.\n3. دية الكتابي الحر: **كدية الحرة المسلمة**.\n4. دية الكتابية: على النصف من ذلك.\n5. دية المجوسي الحر: **ثمانمائة درهم**.\n6. والمجوسية على النصف.\n\nويستوي الذكر والأنثى **فيما يوجب دون ثلث الدية**.\n\n### فصل في دية الجنين (ص 101 – 102)\n- من جنى على حامل فألقت جنينًا حرًا مسلمًا، ذكرًا كان أو أنثى، فديته **غُرَّة قيمتها عُشر دية أمه**.\n- وإن ألقت الجنين حيًا لوقت يعيش لمثله — وهو **نصف سنة فصاعدًا** — ففيه ما في الحي.\n\n### فصل في دية الأعضاء (ص 102)\n- ما في الإنسان **منه واحد** (كالأنف واللسان والذكر): فيه **دية كاملة**.\n- ما في الإنسان **منه شيئان** (كاليدين، والرجلين، والعينين، والأذنين، والحاجبين، والشديين، والخصيتين): فيه **الدية**، وفي أحدهما **نصفها**.\n- في الأجفان الأربعة: **الدية**، وفي أحدها **ربعها**.\n- في أصابع اليدين: **الدية**، وفي أحدها **عُشرها**.\n- في الأنملة: إن كانت من إبهام فـ**نصف عُشر الدية**، وإن كانت من غيره فـ**ثلث عُشرها**. وكذا أصابع الرجلين.\n- في السنّ: **خمس من الإبل**.\n- في إذهاب نفع عضو: **ديته كاملة**.\n\n### فصل في دية المنافع (ص 102)\nتجب **الدية كاملة** في إذهاب كل من:\nسمعٍ، وبصرٍ، وشمٍّ، وذوقٍ، وكلامٍ، وعقلٍ، ومنفعةِ مشيٍ، ونكاحٍ، وأكلٍ، وصوتٍ.\n\n### باب العاقلة (ص 102)\n- **هم:** ذكور عصبة الجاني نسبًا وولاءً.\n- **لا تحمل** العاقلة: عمدًا، ولا عبدًا، ولا إقرارًا.\n- **وتحمل** الخطأ وشبه العمد، مؤجلًا في **ثلاث سنين**.\n- ابتداء حَوْلِ القتل من **الزُّهوق**، والجرح من **البُرء**.\n- ويُبدأ بالأقرب فالأقرب كالإرث.\n\n### باب كفارة القتل (ص 103)\n- **لا كفارة في العمد**، وتجب فيما دونه في **مال القاتل**، لنفسٍ محرَّمة ولو جنينًا.\n- يكفِّر **الرقيق** بالصوم، و**الكافر** بالعتق.\n- وغيرهما يكفِّر بـ**عتق رقبة مؤمنة**، فإن لم يجد فـ**صيام شهرين متتابعين**، **ولا إطعام هنا**.\n\n---\n\n## كتاب الحدود (ص 104 – 107)\n\n**القاعدة العامة (ص 104):**\n- لا حدَّ إلا على **مكلَّف ملتزم عالم بالتحريم**.\n- تحرم الشفاعة وقبولها في حدٍّ لله تعالى بعد أن يبلغ الإمام.\n- تجب إقامة الحد، ولا يقيمه إلا **الإمام أو نائبه**.\n- وتحرم إقامته في المسجد.\n\n### باب حدّ الزنا (ص 104)\n**الزنا:** فعل الفاحشة في قُبُل أو دبر.\n- **المحصن:** يجب رجمه حتى يموت.\n- **الحر غير المحصن:** جلد **مائة جلدة**، وتغريب **عامًا** إلى **مسافة قصر**.\n\n**وشرط وجوب الحد:**\n1. تغييب الحشفة أو قدرها في فرج أو دبر لآدميٍّ حيٍّ.\n2. انتفاء الشبهة.\n3. ثبوته إما بإقرار، أو بشهادة **أربعة رجال عدول**.\n\n### باب حدّ القذف (ص 104 – 105)\n- من قذف غيره بالزنا حُدَّ **ثمانين** إن كان حرًا، و**أربعين** إن كان رقيقًا.\n- **ويثبت الحد هنا وفي الشرب والتعزير بأحد أمرين:**\n  1. إما بإقراره **مرة**.\n  2. أو شهادة **عدلَين**.\n- **ويسقط حدّ القذف بأربعة:**\n  1. بعفو المقذوف.\n  2. أو بتصديقه.\n  3. أو بإقامة البينة.\n  4. أو باللعان.\n- **صريح القذف:** يا زاني، يا عاهر، يا لوطي.\n- **وكنايته:** زنت يداك، أو رجلاك، أو يدك، أو رجلك، يا فاجرة، يا خبيثة؛ فإن أراد بهذه الألفاظ حقيقة الزنا حُدَّ، وإلا عُزِّر.\n\n### باب حدّ المسكر (ص 105)\n- من شرب مسكرًا **ولو لم يسكر** حُدَّ **ثمانين** إن كان حرًا، و**أربعين** إن كان رقيقًا.\n- **بشرط كونه:**\n  1. مسلمًا.\n  2. مكلَّفًا.\n  3. مختارًا.\n  4. عالمًا أنَّ كثيره يسكر.\n\n### باب التعزير (ص 105)\n- يجب في **كل معصية لا حدَّ فيها ولا كفارة**، وهو من حقوق الله تعالى.\n- **ولا يزاد في جلد التعزير على عشرة أسواط**.\n\n### باب القطع في السرقة (ص 106)\n**يجب بثمانية شروط:**\n1. السرقة، وهي أخذ مال الغير من مالكه على وجه الاختفاء.\n2. كون السارق مكلَّفًا مختارًا.\n3. كون المسروق مالًا.\n4. كون المسروق نصابًا.\n5. إخراجه من حِرز.\n6. انتفاء الشبهة.\n7. ثبوتها إما: أ ـ بشهادة عدلين، ب ـ أو بإقرار **مرتين**.\n8. مطالبة المسروق منه بماله.\n\n**الحكم:**\n- متى توفَّرت الشروط قُطعت يده **اليمنى** من **مِفصل كفِّه**.\n- فإن عاد قُطعت رجله **اليسرى** من **مِفصل كعبه** بترك عقبه.\n- فإن عاد لم يُقطع، وحُبس حتى يموت أو يتوب.\n\n### باب حدّ قطّاع الطريق (ص 106 – 107)\n**هم:** الذين يخرجون على الناس فيأخذون أموالهم مجاهرة.\n\n**ولهم أربعة أحكام:**\n1. إن قَتَلوا ولم يأخذوا مالًا: تحتَّم قتلهم جميعًا.\n2. وإن قَتَلوا وأخذوا مالًا: تحتَّم قتلهم وصَلْبُهم.\n3. وإن أخذوا مالًا ولم يَقْتلوا: قُطِعت أيديهم وأرجلهم **من خلاف**.\n4. وإن أخافوا الناس ولم يأخذوا مالًا: نُفوا من الأرض.\n\nومن تاب منهم **قبل القدرة عليه** سقطت عنه **حقوق الله**، وأُخذ بـ**حقوق الآدميين**.\n\n### باب قتال البغاة (ص 107)\n- **هم:** الخارجون على الإمام بتأويل سائغ ولهم شوكة؛ فإن اختلَّ شرط من ذلك فـ**قُطَّاع طريق**.\n- نصب الإمام **فرض كفاية**.\n- تلزمه مراسلة البغاة، وإزالة شبههم، وما يدعونه من المظالم؛ فإن رجعوا وإلا لزمه قتالهم.\n- وإذا ترك البغاة القتال حرم قتلهم.\n\n### باب حكم المرتد (ص 107)\n**هو:** من كفر بعد إسلامه. ويحصل الكفر بأحد **أربعة أمور**:\n1. **بالقول**؛ كسبِّ الله تعالى ورسوله.\n2. **وبالفعل**؛ كالسجود للصنم ونحوه.\n3. **وبالاعتقاد**؛ كاعتقاد الشريك له تعالى.\n4. **وبالشك** في شيء من ذلك.\n\n**الحكم:** فمن ارتد وهو مكلَّف مختار **استُتيب ثلاثة أيام وجوبًا**؛ فإن تاب فلا شيء عليه، ولا يُحبَط عمله، وإن أصرَّ **قُتِل بالسيف**، ولا يقتله إلا الإمام أو نائبه.\n\n**وتوبة المرتد وكلِّ كافر:** إتيانه بالشهادتين، مع رجوعه عما كفر به.\n\n\n# الفقه الحنبلي (60 درجة) — مفيد الصاحب في تلخيص دليل الطالب\n\nالمتن: دليل الطالب لنيل المطالب، للشيخ مرعي بن يوسف الكرمي الحنبلي (ت 1033هـ). اختصره: فالح عبدالله ارتيبان. مقرر وزارة الأوقاف الكويتية للأئمة والمؤذنين.\n\n---\n\n## كتاب الطهارة\n\n**تعريف الطهارة**: رفع الحدث وزوال الخبث.\n\n**أقسام الماء ثلاثة**:\n1. الطهور، وهو أربعة أنواع: محرم، مكروه، غير مكروه، وما يرفع حدث الأنثى فقط.\n2. الطاهر.\n3. النجس.\n\n**الاستنجاء**: إزالة ما خرج من السبيلين بماء طهور، أو حجر طاهر مباح مُنقٍ.\n\n**الختان** واجب على الذكر والأنثى عند البلوغ.\n\n### باب الوضوء\n- **واجباته**: التسمية فقط.\n- **فروضه ستة**: غسل الوجه ومنه المضمضة والاستنشاق، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل الرجلين إلى الكعبين، الترتيب، الموالاة.\n- **شروطه ثمانية**: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار.\n\n### باب المسح على الخفين\n**شروطه سبعة**: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما.\n\n**الفرق بين مسح الخف والجبيرة** (سؤال سابق):\n| | الخف | الجبيرة |\n|---|---|---|\n| اشتراط لبسه على طهارة | يشترط | لا يشترط على الصحيح في المذهب |\n| المدة | مؤقت: يوم وليلة للمقيم، ثلاثة أيام للمسافر | غير مؤقت، حتى البرء |\n| محل المسح | أكثر أعلى الخف | جميع الجبيرة |\n| يمسح في | الحدث الأصغر فقط | الحدث الأصغر والأكبر |\n| لا تتجاوز | - | لا تتجاوز قدر الحاجة |\n\n### باب نواقض الوضوء\n**ثمانية**: الخارج من السبيلين، خروج النجاسة من بقية البدن (الدم، القيء)، زوال العقل (نوم، إغماء)، مس الفرج بلا حائل، مباشرة الذكر الأنثى أو العكس لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة عن الإسلام.\n\n### باب ما يوجب الغسل\n- **موجباته سبعة**: انتقال المني، خروجه من مخرجه ولو دماً بلذة ما لم يكن نائماً، تغييب الحشفة كلها بلا حائل في فرج، إسلام الكافر ولو كان مرتداً، خروج الحيض، خروج دم النفاس، الموت.\n- **شروط الغسل سبعة**: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله.\n- **واجبات الغسل**: التسمية فقط.\n- **فرض الغسل**: أن يعم بالماء جميع بدنه، وداخل فمه وأنفه.\n- **سنن الغسل ثمانية**: الوضوء قبله، إزالة ما لوثه من أذى، إفراغ الماء على رأسه ثلاثاً، وعلى بقية جسده ثلاثاً، التيامن، الموالاة، إمرار اليد على الجسد، إعادة غسل رجليه بمكان آخر.\n- **الأغسال المستحبة**: ستة عشر، منها يوم الجمعة.\n\n### باب التيمم\n- **شروطه ثمانية**: النية، الإسلام، العقل، التمييز، الاستنجاء أو الاستجمار، دخول الوقت، تعذر استعمال الماء، أن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد.\n- **واجبه**: التسمية فقط.\n- **فروضه خمسة**: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، الموالاة، تعيين النية.\n- **مبطلاته خمسة**: ما أبطل الوضوء، وجود الماء، خروج الوقت، زوال المبيح له، خلع ما مسح عليه.\n\n### باب الحيض\n- **ما يحرم بالحيض تسعة**: الوطء، الطلاق، الصلاة، الصوم، الطواف، قراءة القرآن، مس المصحف، اللبث في المسجد، وكذا المرور فيه إن خافت تلويثه.\n- **ما يوجبه الحيض ثلاثة**: الغسل، البلوغ، الكفارة بالوطء فيه ولو مكرهاً أو ناسياً أو جاهلاً: يتصدق بدينار أو بنصف دينار.\n\n---\n\n## باب الأذان والإقامة\n- **شروطه ستة**: الإسلام، الذكورية، العقل، التمييز، النطق، العدالة.\n- **أركانه**: رفع الصوت به.\n- **سننه خمسة**: أن يكون صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً.\n- **حكم الأذان والإقامة** (سؤال سابق): فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس المكتوبة والجمعة، وسنة للمنفرد والمسافر.\n\n## باب شروط الصلاة\n**شروطها تسعة**: الإسلام، العقل، التمييز، الطهارة مع القدرة، دخول الوقت، ستر العورة مع القدرة، اجتناب النجاسة في البدن والثوب والبقعة مع القدرة، استقبال القبلة مع القدرة، النية.\n- **محل النية**: القلب. **حقيقتها**: العزم على فعل الشيء. **شروطها**: الإسلام، العقل، التمييز. **زمنها**: أول العبادة أو قبلها بيسير.\n\n---\n\n## كتاب الصلاة\n- **أركانها أربعة عشر**: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة وفيها إحدى عشرة تشديدة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع من السجود، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس للتشهد الأخير، التسليمتان، ترتيب الأركان.\n- **واجباتها ثمانية**: التكبير لغير الإحرام، قول \"سمع الله لمن حمده\" للإمام والمنفرد، قول \"ربنا ولك الحمد\" للإمام والمنفرد والمأموم، قول \"سبحان ربي العظيم\"، قول \"سبحان ربي الأعلى\"، قول \"رب اغفر لي\"، التشهد الأول، الجلوس للتشهد الأول.\n- **الفرق بين الركن والواجب**: الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط سهواً وجهلاً ويجبر بسجود السهو.\n- **ماذا يتحمل الإمام عن المأموم** (سؤال سابق): قراءة الفاتحة، سجود السهو، سترة الصلاة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة في الجهرية، الجهر، وسجود التلاوة إذا لم يسجد الإمام.\n- **هل يجوز للقادر الجلوس في الفرض؟** لا يجوز، لأن القيام ركن في الفرض على القادر، ويجوز في النافلة مع نصف الأجر.\n- **يسن رفع اليدين في ثلاثة مواضع**: عند تكبيرة الإحرام، عند الركوع، عند الرفع منه (وزاد بعضهم عند القيام من التشهد الأول).\n\n### مبطلات الصلاة (أربعة وعشرون، أهمها):\n1. ما أبطل الطهارة. 2. كشف العورة عمداً. 3. استدبار القبلة. 4. اتصال النجاسة به إن لم يزلها في الحال. 5. العمل الكثير عادة من غير جنسها لغير ضرورة. 6. تعمد زيادة ركن فعلي. 7. تعمد تقديم بعض الأركان على بعض. 8. تعمد السلام قبل إتمامها. 9. تعمد إحالة المعنى في القراءة. 10. فسخ النية. 11. التردد في الفسخ وبالعزم عليه. 12. القهقهة والكلام ولو سهواً. 13. سلامه عمداً قبل إمامه، أو سهواً ولم يعده بعده. 14. الأكل والشرب سوى اليسير عرفاً لناس وجاهل، ولا تبطل إن بلع ما بين أسنانه بلا مضغ.\n\n### باب سجود السهو\n**أسبابه ثلاثة**: الزيادة (كزيادة ركن)، النقص (كنقص ركن أو واجب سهواً)، الشك (في زيادة ركن أو واجب أو نقصانه).\n\n### أوقات النهي ثلاثة\nمن طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى غروب الشمس، عند قيام الشمس من الظهيرة حتى تزول عن وسط السماء.\n\n### فصل في الجمع\n- **شروط جمع التقديم أربعة**: نية الجمع عند الإحرام بالأولى، ألا يفرق بينهما بنحو نافلة، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية.\n- **شروط جمع التأخير اثنان**: نية الجمع عند الإحرام بالأولى، بقاء العذر إلى دخول وقت الثانية.\n- **متى يتم المسافر الصلاة** (سؤال سابق): إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر.\n\n### باب صلاة الجمعة\n- **تجب على ستة**: الذكر، المسلم، المكلف، الحر (لا عذر له)، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبين البلد فرسخ (5 أو 6 كيلومتر).\n- **شروط صحة الجمعة أربعة**: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدمها خطبتين.\n- **شروط صحة الخطبتين خمسة**: الوقت، النية، أن تكون في الحضر، حضور الأربعين، أن يكون الخطيب ممن تصح إمامته فيها.\n- **أركان الخطبتين ستة**: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما حيث يُسمع المصلين ولا يوجد مانع من عذر.\n\n---\n\n## كتاب الجنائز\n- **حكم صلاة الجنازة**: فرض كفاية، وتسقط بمكلف واحد ولو امرأة (سؤال سابق: تجزئ إذا صلت عليه امرأة وحدها).\n- **شروطها ثمانية**: النية، التكليف، استقبال القبلة، ستر العورة، اجتناب النجاسة، حضور الميت إن كان بالبلد، إسلام المصلي والمصلى عليه، طهارتهما.\n- **أركانها سبعة**: القيام، التكبيرات الأربع، قراءة الفاتحة، الصلاة على محمد ﷺ، الدعاء للميت، السلام، الترتيب.\n\n---\n\n## كتاب الزكاة\n- **شروط وجوبها خمسة**: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول.\n- **الأموال الزكوية خمسة**: سائمة بهيمة الأنعام، الخارج من الأرض، العسل، الأثمان، عروض التجارة.\n- **ما لا يشترط فيه حولان الحول** (سؤال سابق): الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما).\n- **شروط زكاة السائمة ثلاثة**: أن تتخذ للدر والنسل والتسمين لا للعمل، أن ترعى أكثر الحول، أن تبلغ النصاب.\n- **زكاة الخارج من الأرض**: تجب في كل ما يُكال ويُدخر، بشرطين: أن يبلغ النصاب خمسة أوسق (610 كيلو غرام)، وأن يكون مالكاً للنصاب وقت وجوبها.\n- **مقدار الزكوات**: الخارج من الأرض: يسقى بكلفة نصف العشر، بلا كلفة العشر. العسل: العشر. الركاز: الخمس. الذهب والفضة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو). المعادن: ربع العشر. عروض التجارة: ربع العشر.\n- **شروط الخارص أربعة**: مسلم، أمين، خبير، أجرته على رب الثمرة.\n- **نصاب الذهب**: 85 غراماً. **نصاب الفضة**: 595 غراماً.\n- **نصاب الغنم**: 40 شاة فيها شاة، 121 فيها شاتان، 201 فيها ثلاث شياه، ثم في كل مائة شاة. (سؤال سابق: من يملك أربعين رأساً من الغنم السائمة وحال عليها الحول: يجب عليه شاة واحدة).\n- **نصاب الإبل**: 5 فيها شاة، 10 شاتان، 15 ثلاث شياه، 20 أربع شياه، 25 بنت مخاض، 36 بنت لبون، 46 حقة، 61 جذعة، 76 بنتا لبون، 91 حقتان، 121 ثلاث بنات لبون.\n- **نصاب البقر**: 30 فيها تبيع، 40 فيها مسنة.\n- **الحلي** (سؤال سابق): الحلي المعد للاستعمال المباح أو الإعارة لا زكاة فيه على المذهب، وإن كان معداً للكراء أو الادخار أو كان محرماً ففيه الزكاة إذا بلغ النصاب وحال الحول.\n- **أصناف أهل الزكاة ثمانية**: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله (المجاهدون)، ابن السبيل.\n\n---\n\n## كتاب الصيام\n- **شروط وجوبه أربعة**: الإسلام، البلوغ، العقل، القدرة عليه.\n- **شروط صحته ستة**: الإسلام، انقطاع دم الحيض، انقطاع دم النفاس، التمييز، العقل، النية من الليل لكل يوم واجب.\n- **تعريف فرض الصوم**: الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس.\n- **المفطرات اثنا عشر**: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت إلى الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره.\n- **كفارة الجماع في نهار رمضان**: عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت عنه.\n- **إذا زال العذر عن المفطر في النهار** (سؤال سابق): يلزمه الإمساك بقية اليوم والقضاء (كمن طهرت من حيض، أو قدم مسافر مفطراً، أو برئ مريض، أو أسلم كافر، أو بلغ صبي).\n\n## كتاب الاعتكاف\n- **شروط صحته ستة**: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد.\n- **ما يبطله ستة**: الخروج من المسجد لغير عذر، نية الخروج ولو لم يخرج، الوطء في الفرج، الإنزال بالمباشرة دون الفرج، الردة، السكر.\n- **من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة له** (سؤال سابق): لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة.\n\n---\n\n## كتاب الحج\n- **شروط وجوبه خمسة**: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة شرطاً: وجود المحرم.\n- **الاستطاعة** (سؤال سابق): أن يملك زاداً وراحلة تصلح لمثله، فاضلاً عن قضاء دينه ونفقته ونفقة عياله، وعن حوائجه الأصلية من مسكن وخادم، وأن يكون الطريق آمناً.\n- **أنواع الأنساك ثلاثة**: التمتع (يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج)، الإفراد (يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة)، القِران (يحرم بالحج والعمرة معاً).\n- **محظورات الإحرام سبعة**: لبس المخيط للرجال حتى الخفين، تعمد تغطية الرأس للرجال وتغطية الوجه للأنثى، استعمال الطيب، إزالة الشعر وتقليم الأظافر، قتل صيد البر الوحشي المأكول ومنه الدلالة عليه أو الإعانة، عقد النكاح، الوطء في الفرج ودواعيه.\n- **الفدية قسمان**: (1) على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر أو الظفر والإمناء بنظرة والمباشرة بغير إنزال منٍ، وجزاء الصيد (المثل من النعم أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين مداً أو نصف صاع، أو يصوم عن طعام كل مسكين يوماً). (2) على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء ونحوه، فمن لم يجده صام ثلاثة أيام في الحج وسبعة إذا رجع.\n- **من وطئ في الحج قبل التحلل الأول أو أنزل منياً بفعل متعمداً فعليه بدنة**، ومن وطئ في العمرة قبل تمام السعي فعليه شاة.\n- **أركان الحج أربعة**: الإحرام (وهو مجرد النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة.\n- **واجبات الحج سبعة**: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، المبيت في منى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع.\n- **أركان العمرة ثلاثة**: الإحرام، الطواف، السعي. **واجباتها**: الإحرام بها من الحل، الحلق أو التقصير.\n- **أنواع التحلل** (سؤال سابق): التحلل الأول يحصل بفعل اثنين من ثلاثة: رمي، أو حلق، أو طواف، ويحل به كل شيء إلا النساء. التحلل الثاني يحصل بفعل الثلاثة، ويحل به كل شيء حتى النساء.\n- **شروط صحة الطواف أحد عشر**: النية، الإسلام، العقل، دخول وقته، ستر العورة، اجتناب النجاسة، الطهارة من الحدث، تكميل السبع أشواط، جعل البيت عن يساره، المشي مع القدرة، الموالاة.\n- **شروط صحة السعي ثمانية**: النية، الإسلام، العقل، الموالاة، المشي مع القدرة، كونه بعد الطواف، تكميل السبع أشواط، استيعاب ما بين الصفا والمروة.\n\n---\n\n# المعاملات (20 درجة)\n\n## كتاب البيع\n- **شروط البيع سبعة**: الرضى، الرشد، كون المبيع مالاً، أن يكون المبيع ملكاً للبائع أو مأذوناً له فيه، القدرة على تسليم المبيع، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً.\n- **مثالان على عدم القدرة على التسليم** (سؤال سابق): بيع الآبق، والشارد، والطير في الهواء، والسمك في الماء، والمغصوب على غير غاصبه، فهذه لا يصح بيعها.\n- **الشروط في البيع قسمان**: صحيح لازم (كشرط تأجيل الثمن، أو سكنى الدار شهراً)، وفاسد مبطل للبيع (كشرط بيع آخر، أو سلف، أو قرض، أو \"تزوجني ابنتك\").\n- **أقسام الخيار سبعة**: خيار المجلس، خيار الشرط (اشتراط الخيار إلى مدة)، خيار الغبن (الغش)، خيار التدليس (تزيين العين المراد بيعها)، خيار العيب، خيار الخلف في الصفة، خيار الخلف في قدر الثمن.\n\n### باب الربا\n- **إذا بيع المكيل بجنسه** (كالحبوب والثمار: التمر بالتمر) أو **الموزون بجنسه** (كالذهب بالذهب، الخبز بالخبز) صح بشرطين: المماثلة في القدر، والقبض قبل التفرق. (سؤال سابق)\n- **إذا بيع بغير جنسه** (ذهب بفضة، بر بشعير) صح بشرط: القبض قبل التفرق، وجاز التفاضل.\n- **إذا بيع المكيل بالموزون** جاز التفاضل والتفرق قبل القبض.\n\n## كتاب النكاح\n- **تدخل فيه الأحكام التكليفية الأربعة**: يُسن لذي شهوة لا يخاف الزنا، **يجب على من يخاف الزنا** (سؤال سابق: متى يكون الزواج واجباً؟)، يباح لمن لا شهوة له، يحرم بدار الحرب لغير الضرورة.\n- **النظر ثمانية أقسام**: نظر الرجل البالغ للحرة البالغة الأجنبية لغير حاجة لا يجوز. نظره لمن لا تُشتهى كعجوز يجوز لوجهها خاصة. نظره للشهادة عليها أو لمعاملتها يجوز لوجهها وكذا كفيها لحاجة. نظره لحرة بالغة يخطبها يجوز للوجه والرقبة واليد والقدم. نظره لذوات محارمه يجوز للوجه والرقبة واليد والقدم والرأس والساق. نظره للمداواة يجوز للمواضع التي يحتاج إليها. نظر المرأة للمرأة وللرجل الأجنبي، ونظر الرجل للرجل ولو أمرد يجوز إلى ما عدا ما بين السرة والركبة. نظره لزوجته وأمته المباحة له ولو لشهوة يجوز لجميع البدن.\n- **أركان النكاح**: الإيجاب \"أنكحتك\"، والقبول مرتبين \"قبلت\".\n- **شروط النكاح خمسة**: تعيين الزوجين، رضى الزوجين المكلفين، الولي، شهادة ذكرين مكلفين ولو رقيقين، خلو الزوجين من الموانع نسباً أو سبباً.\n- **شروط الولي سبعة**: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، عدالة ولو ظاهرة، رشد.\n- **شروط الشاهدين**: متكلمين، سميعين، مسلمين، عدلين ولو ظاهراً، أن يكونا غير أصلي الزوجين وفرعيهما.\n- **الكفاءة معتبرة في خمسة**: الديانة، الصناعة، الميسرة، الحرية، النسب.\n- **لا يجوز نكاح الحر من الأمة إلا بشرطين**: عدم المال (الطول)، وخوف الزنا (العنت).\n- **الشروط في النكاح قسمان**: صحيح لازم للزوج (ألا يخرجها من بلادها، أو يزيد مهرها، أو لا يفرق بينها وبين أبويها). فاسد نوعان: نوع يبطل النكاح (نكاح الشغار: يزوجه موليته ويزوجه الآخر موليته بلا مهر، ونكاح المحلل)، ونوع لا يبطله (أن يشترط ألا مهر لها أو لا نفقة أو يقسم لها أكثر من ضرتها أو أقل).\n- **خيار العيب في النكاح ثلاثة أقسام**: قسم يختص بالرجل (كونه مقطوع الذكر أو أشل)، قسم يختص بالأنثى (كون فرجها مسدوداً أو به بخر أو قروح سيالة)، قسم مشترك (جنون، جذام، برص، بخر الفم).\n\n## كتاب العدة\n- **تعريفها**: تربص من فارقت زوجها بوفاة أو حياة.\n- **عدة المتوفى زوجها**: إن كانت حاملاً فبوضع الحمل طال أم قصر، وإن كانت غير حامل فأربعة أشهر وعشر ليالٍ بأيامها، وعدة الأمة نصفها.\n- **عدة المطلقة**: من تحيض: ثلاثة حيض للحرة وحيضتان للأمة. من لا تحيض (صغيرة وآيسة وهي من بلغت خمسين سنة): ثلاثة أشهر، وشهران للأمة. من كانت تحيض ثم ارتفع حيضها ولم تبلغ سن الإياس: إن لم تعلم سبب رفعه تتربص تسعة أشهر ثم تعتد عدة آيسة، وإن علمت ما رفعه (كمرض أو رضاع أو نفاس) فتتربص حتى يعود الحيض فتعتد به أو تصير آيسة.\n- **إحداد المرأة في أربعة أشياء**: تجتنب الزينة، الطيب، لبس الحلي، لبس الملون.\n- **استبراء الإماء** واجب في ثلاثة مواضع: إذا ملك أمة يوطأ مثلها، إذا ملك أمة ووطئها ثم أراد أن يزوجها أو يبيعها، إذا أعتق أمته أو مات عنها. **عدة الإماء واستبراؤهم**: الحامل بوضع الحمل، ومن تحيض بحيضة، والتي لا تحيض بشهر، والمرتفع حيضها ولا تعلم ما رفعه عشرة أشهر، والعالمة خمسون سنة وشهر.\n\n## كتاب الرضاع\n**تثبت المحرمية بالرضاع بشرطين** (سؤال سابق): أن تكون خمس رضعات، وفي العامين (السنة الأولى والثانية).\n\n## كتاب النفقات\n- **يجب على الزوج لزوجته**: الأكل، الشرب، الملبس، مسكن بالمعروف، مؤنة نظافتها، خادم إن كانت ممن يخدم مثلها، مؤنسة لحاجة.\n- **نفقة الأقارب** تجب بثلاثة شروط: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوت نفسه وزوجته ورقيقه يومه وليلته، أن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فيجب.\n- **الحضانة**: حفظ الطفل غالباً عما يضره والقيام بمصالحه. إذا بلغ الصبي سبع سنين عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً إلى أن تتزوج. المجنون ولو أنثى عند أمه مطلقاً.\n\n## كتاب الأطعمة\n- **يحرم أكله**: النجس كالميتة ولحم الخنزير. حيوان البر: الحمر الأهلية وما يفترس بنابه كالأسد والنمر. حيوان الطير: ما يصيد بمخلبه كالعقاب والصقر. ما يأكل الجيف كنسر وفأر. وتحرم الجلالة (التي أكثر علفها النجاسة) ولا تحل حتى تحبس ثلاثاً وتطعم الطاهر. ويحل كل ما في البحر غير ضفدع وحية وتمساح.\n- **الذكاة**: ذبح أو نحر الحيوان المقدور عليه. **شروطها أربعة**: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (يحل الذبح بكل محدد غير السن والظفر)، قطع الحلقوم والمريء، قول \"بسم الله\" عند الذكاة وتسقط سهواً لا جهلاً.\n\n## كتاب الصيد\n- **متى يباح الصيد ومتى يكره** (سؤال سابق): يباح لمن يقصد به الانتفاع، ويكره لمن يقصده لهواً ولعباً، ويحرم على المحرم وفي الحرم.\n- **شروط حل الصيد إذا مات قبل أن يُدركه أربعة**: كون الصائد أهلاً للذكاة. الآلة وهي نوعان: ما له حد يجرح به كسيف، وجارحة معلمة ككلب غير أسود وصقر. قصد الفعل وهو أن يرسل الآلة لقصد الصيد. قول \"بسم الله\" عند إرسال الجارحة أو رمي سلاحه ولا تسقط سهواً.\n- **شروط صيد الكلب والفهد ثلاثة**: يسترسل إذا أُرسل، ينزجر إذا زُجر، إذا أمسك لم يأكل.\n- **شروط صيد الطير ثلاثة**: أن يسترسل إذا أرسل، ويرجع إذا دُعي، أن يجرح الصيد لا بصدم ولا بخنق.\n\n## كتاب الأيمان\n- **لا تنعقد اليمين إلا**: بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته.\n- **شروط وجوب الكفارة خمسة**: كون الحالف مكلفاً، كونه مختاراً، كونه قاصداً لليمين، كونها على أمر مستقبل، الحنث في يمينه (يرجع عما حلف عنه).\n- **كفارة اليمين**: إطعام عشرة مساكين أو كسوتهم، أو تحرير رقبة مؤمنة، فإن لم يجد صام ثلاثة أيام متتابعة وجوباً. ولا يصح أن يكفر الرقيق بغير الصوم، وعكسه الكافر.\n\n### باب النذر\n- **لا يصح إلا**: بالقول، من مكلف، مختاراً.\n- **أنواع النذر المنعقد وأحكامه ستة**: النذر المطلق (\"لله علي نذر\") وكفارته كفارة يمين. نذر اللجاج والغضب (\"إن كلمتك فعلي صوم كذا\") فيخير بين الفعل أو كفارة يمين. النذر المباح (\"لله علي أن أركب دابتي\") فيخير بين الفعل أو كفارة يمين. النذر المكروه (كطلاق) فيسن أن يكفر ولا يفعله. نذر المعصية (كشرب الخمر) فيحرم الوفاء به ويكفر. نذر التبرر (كصلاة وصيام أو يعلقه بشرط: \"إن شفى الله مريضي فعلي كذا\") فيجب الوفاء به.\n- من نذر صوم شهر معين لزمه صومه متتابعاً، فإن أفطر لغير عذر حرم ولزمه ابتداؤه من جديد مع كفارة يمين، وإن أفطر لعذر أكمل صومه ويكفر لفوات التتابع. من نذر صوم شهر مطلق أو صوم متتابع غير مقيد بزمن لزمه التتابع، فإن أفطر لغير عذر لزمه ابتداؤه من جديد بلا كفارة، ولعذر خير بين ابتدائه ولا شيء عليه وبين أن يكمله ويكفر.\n\n\n# إضافات من أصل \"دليل الطالب لنيل المطالب\" (ما أهمله المختصر ويُسأل عنه الإمام)\n\nهذه المسائل من متن الشيخ مرعي الكرمي نفسه، وليست في \"مفيد الصاحب\". تُراجع على نسختك من الكتاب عند وصولها.\n\n## باب الاستنجاء وآداب قضاء الحاجة\n- **يسن**: عند الدخول تقديم رجله اليسرى، وعند الخروج اليمنى، وقول \"بسم الله أعوذ بالله من الخبث والخبائث\" عند الدخول، و\"غفرانك\" عند الخروج، والاعتماد على رجله اليسرى، والبعد والاستتار في الفضاء.\n- **يكره**: دخوله بشيء فيه ذكر الله، ورفع ثوبه قبل دنوه من الأرض، والكلام، والبول في شق وفي إناء لغير حاجة، واستقبال الشمس والقمر، واستقبال القبلة واستدبارها في البنيان.\n- **يحرم**: استقبال القبلة واستدبارها في الفضاء، والبول في طريق وظل نافع وتحت شجرة مثمرة.\n- **الاستجمار**: يشترط ثلاث مسحات منقية بحجر ونحوه، ولا يجزئ بروث وعظم وطعام ومحترم. ويجزئ الاستجمار مع وجود الماء، والجمع بينهما أفضل.\n\n## سنن الوضوء\nالسواك، وغسل الكفين ثلاثاً، والبداءة بالمضمضة والاستنشاق قبل الوجه، والمبالغة فيهما لغير الصائم، وتخليل اللحية الكثيفة والأصابع، والتيامن، وأخذ ماء جديد للأذنين، والغسلة الثانية والثالثة، والدعاء بعده: \"أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمداً عبده ورسوله\".\n- **يكره**: الإسراف في الماء، والزيادة على الثلاث.\n\n## باب صفة الصلاة (من الدليل)\n- يقول \"الله أكبر\" رافعاً يديه حذو منكبيه، ثم يقبض كوعه اليسرى بيمينه ويجعلهما تحت سرته، وينظر إلى موضع سجوده، ثم يستفتح: \"سبحانك اللهم وبحمدك وتبارك اسمك وتعالى جدك ولا إله غيرك\"، ثم يستعيذ ثم يبسمل سراً، ثم يقرأ الفاتحة ثم سورة، تكون في الفجر من طوال المفصل، وفي المغرب من قصاره، وفي الباقي من أوساطه.\n- **المفصل**: أوله \"ق\"، طواله إلى \"عم\"، أوساطه إلى \"الضحى\"، قصاره إلى آخر القرآن.\n- يجهر الإمام في الفجر والأوليين من المغرب والعشاء وفي الجمعة والعيدين والكسوف والاستسقاء، ويسر في الباقي.\n- ثم يركع مكبراً واضعاً يديه على ركبتيه مفرجتي الأصابع، ويمد ظهره مستوياً، ويقول \"سبحان ربي العظيم\" ثلاثاً (وهو أدنى الكمال، والواجب مرة)، ثم يرفع قائلاً \"سمع الله لمن حمده\" فإذا استوى قال \"ربنا ولك الحمد ملء السماء وملء الأرض وملء ما شئت من شيء بعد\"، ثم يخر ساجداً مكبراً على سبعة أعضاء: الجبهة مع الأنف، واليدين، والركبتين، وأطراف القدمين، ويجافي عضديه عن جنبيه وبطنه عن فخذيه، ويقول \"سبحان ربي الأعلى\" ثلاثاً، ثم يجلس مفترشاً قائلاً \"رب اغفر لي\" ثلاثاً.\n- **الافتراش**: أن يفرش رجله اليسرى ويجلس عليها وينصب اليمنى. **التورك**: أن يفرش رجله اليسرى ويخرجها من تحت اليمنى ويجعل إليتيه على الأرض، ويكون في التشهد الأخير من كل صلاة فيها تشهدان.\n- **جلسة الاستراحة**: مستحبة عند القيام من السجود إلى الركعة الثانية والرابعة (على رواية).\n- **التشهد الأول**: \"التحيات لله والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله وأشهد أن محمداً عبده ورسوله\". ثم في الأخير يصلي على النبي ﷺ بالصلاة الإبراهيمية ويتعوذ من أربع: عذاب جهنم، وعذاب القبر، وفتنة المحيا والممات، وفتنة المسيح الدجال، ثم يسلم عن يمينه \"السلام عليكم ورحمة الله\" ثم عن يساره.\n- **يستحب بعد السلام**: الاستغفار ثلاثاً، و\"اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام\"، والتسبيح والتحميد والتكبير ثلاثاً وثلاثين.\n- **ما يكره في الصلاة**: الالتفات بلا حاجة، ورفع بصره إلى السماء، وتغميض عينيه، والإقعاء (أن يفرش قدميه ويجلس على عقبيه)، وافتراش ذراعيه في السجود، والعبث، والتخصر (وضع يده على خاصرته)، وفرقعة الأصابع وتشبيكها، ومدافعة الأخبثين، والصلاة بحضرة طعام تتوق نفسه إليه، واستقبال صورة أو وجه آدمي.\n- **يباح**: قتل الحية والعقرب والقمل، والإشارة باليد، وحمل الصغير، والتنحنح لحاجة، وقراءة أواخر السور وأوساطها.\n- **صلاة التطوع**: آكدها الكسوف، ثم الاستسقاء، ثم التراويح (عشرون ركعة)، ثم الوتر (أقله ركعة وأكثره إحدى عشرة، ووقته بين صلاة العشاء وطلوع الفجر)، ثم الرواتب: عشر: ركعتان قبل الظهر وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر وهما آكدها. ثم صلاة الضحى (أقلها ركعتان وأكثرها ثمان)، وتحية المسجد، وسنة الوضوء.\n- **القنوت**: يسن في الوتر بعد الركوع، ويقنت الإمام في الفرائض عند النازلة.\n- **سجود التلاوة**: سنة للقارئ والمستمع دون السامع، وهو أربع عشرة سجدة، منها سجدتان في الحج، وليس في \"ص\" سجدة تلاوة بل سجدة شكر.\n- **سجود الشكر**: يسن عند تجدد النعم واندفاع النقم.\n\n## باب سجود السهو تفصيلاً\n- **يشرع**: لزيادة، أو نقص، أو شك. **لا يشرع**: للعمد، ولا لترك سنة.\n- من زاد ركعة أو ركوعاً أو سجوداً سهواً سجد للسهو، ومتى ذكر رجع بلا تكبير.\n- من ترك ركناً فذكره قبل الشروع في قراءة الركعة التالية رجع فأتى به وبما بعده، وإن ذكره بعد الشروع في قراءة التي بعدها بطلت الركعة التي تركه منها وقامت التي بعدها مقامها.\n- من ترك التشهد الأول ناسياً وذكره قبل أن يستتم قائماً رجع، وإن استتم قائماً كره رجوعه، وإن شرع في القراءة حرم الرجوع، ويسجد للسهو في الجميع.\n- من ترك واجباً سهواً فذكره قبل مفارقة محله أتى به، وبعد مفارقة محله سقط ويسجد.\n- **الشك**: من شك في عدد الركعات بنى على اليقين (الأقل) وأتى بالباقي وسجد للسهو قبل السلام. والإمام يبنى على غالب ظنه عند الشيخ ابن قدامة، والمذهب اليقين.\n- **محل سجود السهو**: قبل السلام كله، إلا إذا سلم عن نقص ركعة فأكثر فيكون بعد السلام، وإذا بنى الإمام على غالب ظنه فبعد السلام، والباقي قبله. وإذا نسيه فبعد السلام قريباً.\n- سجود السهو **واجب** لما يبطل عمده، ولا يجب على المأموم بل يتحمله الإمام عنه.\n\n## باب صلاة الجماعة (الأهم للإمام)\n- **حكمها**: واجبة على الرجال الأحرار القادرين للصلوات الخمس حضراً وسفراً، وليست شرطاً لصحة الصلاة. وتنعقد باثنين، وتصح في البيت، والمسجد أفضل.\n- **الأفضل**: المسجد العتيق، ثم الأبعد، ثم الأكثر جماعة، والأقرب أفضل من الأبعد إن كان الجمع في الأقرب أكثر أو مساوياً... (على تفصيل).\n- **حرمة الصلاة قبل الإمام**: يحرم على المأموم أن يسبق إمامه، ومن ركع أو سجد قبله عمداً وعلماً بطلت صلاته إن لم يرجع، ولا يجوز أن يتقدم على الإمام في الموقف إلا في الكعبة.\n- **إدراك الجماعة**: تُدرك بإدراك ركعة (أي الركوع) على المذهب، وإذا أدرك الإمام راكعاً فكبر تكبيرة الإحرام قائماً ثم ركع أجزأته الركعة ولو لم يقرأ. ومن أدركه في غير الركوع لا تحسب له تلك الركعة، ويكون ما أدركه آخر صلاته وما يقضيه أولها (يجهر ويقنت ويستفتح فيما يقضيه). ولا يستفتح إذا أدرك الإمام في غير القيام.\n- **ما يتحمله الإمام عن المأموم**: قراءة الفاتحة، وسجود السهو، والسترة، ودعاء القنوت، والتشهد الأول إذا سُبق بركعة، والسورة، والجهر، وسجود التلاوة إذا لم يسجد الإمام.\n- **قراءة المأموم**: يستحب له قراءة الفاتحة في سكتات الإمام وفيما لا يجهر فيه، ولا يقرأ في الجهرية إذا سمع الإمام.\n- **مسائل القدوة**: تصح قدوة المتنفل بالمفترض وعكسه، والمؤدي بالقاضي وعكسه، ولا تصح قدوة من يصلي الظهر بمن يصلي العصر ولا العكس (اختلاف الفرضين لا يصح على المذهب).\n- **المسبوق**: إذا سلم الإمام لا يقوم المسبوق قبل تسليمة الإمام الثانية. وإذا سها الإمام فيما لم يدركه المسبوق سجد معه.\n- **من تصح إمامته ومن لا تصح**:\n  - **الأولى بالإمامة**: الأقرأ العالم فقه صلاته، ثم الأفقه، ثم الأسن، ثم الأشرف (القرشي)، ثم الأقدم هجرة، ثم الأتقى، ثم من قرع. وصاحب البيت وإمام المسجد أحق من غيرهما ولو كان غيرهما أفضل، إلا من ذي سلطان.\n  - **لا تصح إمامة**: الفاسق (إلا في جمعة وعيد تعذرت خلف غيره)، والمرأة والخنثى بالرجال، والأمي (من لا يحسن الفاتحة أو يخل بحرف أو ترتيب) إلا بمثله، والعاجز عن ركن أو شرط إلا بمثله (إلا إمام الحي المرجو زوال علته يصلي جالساً ويصلون خلفه جلوساً)، والألثغ (يبدل حرفاً بحرف) إلا بمثله، والأخرس، والكافر، والمجنون، ومن لا يقرأ الفاتحة.\n  - **تصح إمامة**: الصبي المميز بمثله في الفرض وبالبالغ في النفل، والأعمى، والعبد، وولد الزنا، والأقلف، والأقطع، ومن به سلس البول بمثله، والمتيمم بالمتوضئ.\n  - **تكره إمامة**: اللحان الذي لا يحيل المعنى، والفأفاء (يكرر الفاء) والتمتام، ومن يكرهه أكثر الجماعة بحق، والأقلف، ومن يصلي بقوم أكثرهم يكرهه.\n- **موقف المأموم**: يقف المأموم الواحد عن يمين الإمام، والاثنان فأكثر خلفه، والمرأة خلف الرجل، ولو وقف المأموم الواحد عن يسار الإمام مع خلو يمينه لم تصح، ومن صلى وحده خلف الصف ركعة كاملة لم تصح صلاته. وتصح إذا وقف عن يمينه أو عن جانبيه.\n- **الفصل بين الإمام والمأموم**: تصح القدوة إذا رأى الإمام أو من وراءه ولو في غير المسجد إذا سمع التكبير، وفي المسجد تصح ولو لم يره إذا سمع التكبير.\n- **أعذار ترك الجماعة والجمعة**: المرض، ومدافعة الأخبثين، وحضور طعام يشتهيه، والخوف على نفسه أو ماله أو أهله، والمطر والوحل والريح الباردة الشديدة في الليلة المظلمة، وأكل البصل والثوم حتى يذهب ريحه، وملازمة غريم معسر، وتمريض قريب.\n- **إذا أحدث الإمام أو ذكر أنه محدث**: استخلف من يتم بهم، ويجوز أن يتموا فرادى.\n- **يسن للإمام**: التخفيف مع الإتمام، وأن يطيل الركعة الأولى أكثر من الثانية، وأن ينتظر الداخل في الركوع ما لم يشق على المأمومين، وأن يستقبل المأمومين بوجهه بعد السلام، ولا يطيل الجلوس في مكانه مستقبلاً القبلة.\n- **يحرم على الإمام**: أن يصلي في موضع أعلى من المأمومين (أعلى من ذراع) إلا لحاجة كتعليم، ويكره أن يصلي في طاق المحراب بحيث يخفى على المأمومين.\n\n## باب صلاة أهل الأعذار\n- **المريض**: يصلي الفرض قائماً، فإن لم يستطع فقاعداً متربعاً، فإن لم يستطع فعلى جنبه الأيمن، فإن لم يستطع فمستلقياً ورجلاه إلى القبلة، ويومئ بالركوع والسجود ويجعل السجود أخفض، فإن عجز أومأ بعينه وينوي، ولا تسقط الصلاة ما دام العقل ثابتاً.\n- **القصر**: من سافر سفراً مباحاً يبلغ ستة عشر فرسخاً (أربعة برد، نحو ثمانين كيلو متراً) فله قصر الرباعية إلى ركعتين، إذا فارق بيوت قريته. والقصر أفضل من الإتمام، ولا يقصر إلا في السفر المباح (لا سفر المعصية).\n- **الجمع**: يباح للمسافر، والمريض الذي يلحقه مشقة، وللمرضع لمشقة كثرة النجاسة، وللمستحاضة، ولمن له عذر يبيح ترك الجمعة والجماعة، ولمطر يبل الثياب ووحل وريح شديدة باردة (والجمع بين المغرب والعشاء لأجل المطر خاصة). والأفضل فعل الأرفق به من التقديم والتأخير، والتأخير أفضل عند عدم الفرق.\n- **صلاة الخوف**: تصح على كل صفة صحت عن النبي ﷺ، وأشهرها صفة ذات الرقاع: يقسمهم طائفتين، يصلي بالأولى ركعة ثم تتم لنفسها وتنصرف، وتأتي الثانية فيصلي بها الركعة الثانية وينتظرها حتى تتم وتسلم بسلامه. وإذا اشتد الخوف صلوا رجالاً وركباناً إلى القبلة وغيرها.\n\n## باب صلاة الجمعة (إضافات)\n- **من شروط وجوبها**: الاستيطان، فلا تجب على المسافر ولا من كان خارج البلد بأكثر من فرسخ.\n- **يشترط للخطبة**: الوقت، والنية، وحضور العدد، وأن تكون في الحضر، وأن يتولاهما من يتولى الصلاة (على الأصح لا يشترط)، ورفع الصوت بحيث يسمع العدد المعتبر.\n- **سنن الخطبة**: أن يخطب على منبر أو موضع عال، وأن يسلم على المأمومين إذا أقبل عليهم، وأن يجلس حتى يفرغ المؤذن، وأن يجلس بين الخطبتين، وأن يخطب قائماً، ويعتمد على سيف أو عصا، ويقصد تلقاء وجهه، ويقصر الخطبة والثانية أقصر، ويرفع صوته، ويدعو للمسلمين.\n- **يقرأ في فجر الجمعة**: السجدة و\"هل أتى\"، وفي الجمعة: الجمعة والمنافقون، أو سبح والغاشية.\n- **الكلام والإمام يخطب**: يحرم على من يسمعه، ويجوز للإمام والمخاطب له.\n- **تحية المسجد والإمام يخطب**: يصليها ركعتين خفيفتين.\n- **من أدرك مع الإمام ركعة**: أتمها جمعة، ومن أدرك أقل من ركعة أتمها ظهراً.\n- **السنة بعد الجمعة**: أقلها ركعتان وأكثرها ست، ولا سنة راتبة قبلها.\n- **الساعة التي يستجاب فيها الدعاء**: أرجاها آخر ساعة بعد العصر.\n- **يستحب يوم الجمعة**: الغسل، والتطيب، والتبكير، والمشي، وقراءة الكهف، وكثرة الصلاة على النبي ﷺ، والدعاء.\n\n## باب صلاة العيدين\n- **حكمها**: فرض كفاية، وشروطها كالجمعة إلا الخطبتين فهما سنة بعدها.\n- **وقتها**: من ارتفاع الشمس قيد رمح إلى الزوال، فإن لم يعلموا بالعيد إلا بعد الزوال صلوا من الغد قضاء.\n- **صفتها**: ركعتان قبل الخطبة، يكبر في الأولى بعد الاستفتاح ست تكبيرات زوائد (غير تكبيرة الإحرام)، وفي الثانية خمساً غير تكبيرة القيام، ويرفع يديه مع كل تكبيرة ويقول بينها: \"الله أكبر كبيراً والحمد لله كثيراً وسبحان الله بكرة وأصيلاً وصلى الله على محمد النبي وآله وسلم تسليماً\"، ويقرأ في الأولى بسبح وفي الثانية بالغاشية، أو ق واقتربت.\n- **يسن**: تقديم الأضحى وتأخير الفطر، والأكل قبل الخروج في الفطر (تمرات وتراً) وتأخيره في الأضحى حتى يصلي، والغسل والتطيب ولبس أحسن الثياب، والخروج ماشياً، والرجوع من طريق آخر، وأن تكون في الصحراء إلا بمكة ففي المسجد الحرام.\n- **التكبير المطلق**: من غروب الشمس ليلة العيد إلى فراغ الخطبة في الفطر، وفي الأضحى من أول ذي الحجة إلى آخر أيام التشريق. **التكبير المقيد**: عقب المكتوبات في جماعة، من فجر يوم عرفة إلى عصر آخر أيام التشريق للمحل، وللمحرم من ظهر يوم النحر. صيغته: \"الله أكبر الله أكبر لا إله إلا الله والله أكبر الله أكبر ولله الحمد\".\n- يكره التنفل قبلها وبعدها في موضعها قبل مفارقته.\n\n## باب صلاة الكسوف\n- **حكمها**: سنة مؤكدة حضراً وسفراً. **وقتها**: من ابتداء الكسوف إلى التجلي.\n- **صفتها**: ركعتان، في كل ركعة قيامان وقراءتان وركوعان وسجودان، يقرأ في الأول الفاتحة وسورة طويلة كالبقرة، ثم يركع فيطيل، ثم يرفع فيقرأ الفاتحة وسورة دون الأولى، ثم يركع دون الأول، ثم يسجد سجدتين طويلتين. ويجهر بالقراءة. ولا خطبة لها.\n- إذا تجلى الكسوف وهو في الصلاة أتمها خفيفة، وإن غابت الشمس كاسفة أو طلعت وهو كاسف لم يصل.\n\n## باب صلاة الاستسقاء\n- **حكمها**: سنة مؤكدة عند القحط. **صفتها**: كصلاة العيد في التكبيرات والقراءة، ثم يخطب خطبة واحدة يكثر فيها الاستغفار وقراءة الآيات التي فيها الأمر به، ويرفع يديه وظهورهما نحو السماء، ثم يحول رداءه فيجعل يمينه على يساره ويقلبه، ويحول الناس أرديتهم.\n- **يسن قبلها**: أن يعظ الإمام الناس ويأمرهم بالتوبة والخروج من المظالم وترك التشاحن والصيام ثلاثة أيام والصدقة، ويخرجون متبذلين متواضعين متخشعين، ويخرج معهم الشيوخ والصبيان.\n- إذا كثر المطر وتضرروا سألوا الله رفعه: \"اللهم حوالينا ولا علينا، اللهم على الظراب والآكام وبطون الأودية ومنابت الشجر\".\n\n## كتاب الجنائز (تفاصيل)\n- **يسن**: الاستعداد للموت، وعيادة المريض، وتذكيره التوبة والوصية، وتلقين المحتضر \"لا إله إلا الله\" مرة، ولا يزيد على ثلاث إلا أن يتكلم بعدها، وقراءة يس عنده، وتوجيهه إلى القبلة على جنبه الأيمن.\n- **إذا مات**: يسن تغميض عينيه، وشد لحييه، وتليين مفاصله، وخلع ثيابه، وستره بثوب، ووضع حديدة على بطنه، ووضعه على سرير غسله متوجهاً إلى القبلة، والإسراع في تجهيزه، وإنفاذ وصيته، وقضاء دينه.\n- **الغسل**: فرض كفاية. أولى الناس بغسل الرجل وصيه، ثم أبوه، ثم جده، ثم الأقرب فالأقرب من عصباته. وبالمرأة وصيتها ثم أمها ثم جدتها ثم الأقرب. ولكل من الزوجين غسل صاحبه. ويغسل الرجل والمرأة من له دون سبع سنين.\n- **صفة الغسل**: يستر عورته ويجرده، ويرفع رأسه إلى قرب الجلوس ويعصر بطنه برفق، ثم يلف على يده خرقة فينجيه، ثم يوضئه، ثم يغسله بماء وسدر: رأسه ولحيته ثم شقه الأيمن ثم الأيسر، ثلاثاً، ويجعل في الأخيرة كافوراً، وإن لم ينق زاد حتى ينقى وتراً. ويسرح شعره، ولا يجز، وتضفر شعر المرأة ثلاثة قرون ويسدل من ورائها. ويقلم أظفاره ويأخذ شاربه ولا يحلق رأسه ولا يختن.\n- **من يغسل ومن لا يغسل**: الشهيد في المعركة لا يغسل ولا يصلى عليه ويدفن في ثيابه بدمه، والسقط إذا بلغ أربعة أشهر غسل وصلي عليه. والمحرم يغسل بماء وسدر ولا يقرب طيباً ولا يغطى رأسه ولا يلبس مخيطاً. وإذا تعذر الغسل يمم.\n- **الكفن**: يجب من ماله مقدماً على الدين. يسن للرجل ثلاث لفائف بيض، وللمرأة خمسة أثواب: إزار وخمار وقميص ولفافتان. ويجزئ ثوب يستر جميعه. ويجمر الكفن ثلاثاً ويجعل الحنوط بين اللفائف وعلى مساجده.\n- **الصلاة عليه**: يقف الإمام عند صدر الرجل ووسط المرأة، ويكبر أربعاً، يقرأ بعد الأولى الفاتحة سراً (والتعوذ والبسملة، ولا يستفتح)، وبعد الثانية يصلي على النبي ﷺ كالتشهد، وبعد الثالثة يدعو للميت: \"اللهم اغفر لحينا وميتنا وشاهدنا وغائبنا وصغيرنا وكبيرنا وذكرنا وأنثانا... اللهم اغفر له وارحمه وعافه واعف عنه، وأكرم نزله ووسع مدخله...\"، ثم يكبر الرابعة ويقف قليلاً ثم يسلم تسليمة واحدة عن يمينه. والزيادة على أربع إلى سبع جائزة. ولا تجوز الصلاة عليه في المقبرة إلا على القبر، ويصلى على القبر إلى شهر، وعلى الغائب بالنية إلى شهر. ومن فاتته الصلاة عليه صلى على القبر.\n- **يقول في الصلاة على الطفل**: \"اللهم اجعله ذخراً لوالديه وفرطاً وأجراً وشفيعاً مجاباً، اللهم ثقل به موازينهما وأعظم به أجورهما وألحقه بصالح سلف المؤمنين واجعله في كفالة إبراهيم وقه برحمتك عذاب الجحيم\".\n- **الدفن**: يسن تعميق القبر وتوسيعه، واللحد أفضل من الشق، ويدخل من عند رجل القبر، ويقول الذي يدخله: \"بسم الله وعلى ملة رسول الله\"، ويوضع على جنبه الأيمن مستقبل القبلة، ويحل عقد الكفن، ويرفع القبر عن الأرض قدر شبر مسنماً، ويحثو عليه ثلاث حثيات من تراب، ويرش عليه الماء، ويوضع عليه حصى، ويحرم البناء عليه والكتابة والجلوس عليه والوطء والمشي بالنعال والإسراج.\n- **بعد الدفن**: يستحب الوقوف عنده والدعاء له بالتثبيت، ويكره الجلوس قبل أن توضع الجنازة، ويسن للمشيع القيام حتى توضع.\n- **التعزية**: تسن ثلاثة أيام، ويقول: \"أعظم الله أجرك وأحسن عزاءك وغفر لميتك\"، ويجيب: \"استجاب الله دعاءك ورحمنا وإياك\". ويكره الجلوس لها، وصنع أهل الميت طعاماً للناس، ويسن أن يصنع لأهل الميت طعام.\n- **يحرم**: النياحة، وشق الثوب، ولطم الخد. ويجوز البكاء بلا ندب ولا نياحة.\n- **زيارة القبور**: تسن للرجال، وتكره للنساء (على المذهب)، ويقول: \"السلام عليكم دار قوم مؤمنين وإنا إن شاء الله بكم لاحقون، يرحم الله المستقدمين منا ومنكم والمستأخرين، نسأل الله لنا ولكم العافية\".\n- **ما ينفع الميت**: كل قربة فعلها المسلم وجعل ثوابها للميت نفعته: الدعاء والاستغفار والصدقة والحج والصوم والقراءة.\n\n## كتاب الزكاة (تفاصيل)\n- **الخلطة** في السائمة: خلطة أعيان وخلطة أوصاف تجعل المالين كمال واحد بشروط: اتحاد المراح والمسرح والمحلب والفحل والمرعى.\n- **زكاة الأثمان**: يضم الذهب إلى الفضة في تكميل النصاب، وتضم عروض التجارة إلى كل منهما.\n- **عروض التجارة**: تقوّم عند تمام الحول بالأحظ للفقراء من ذهب أو فضة، ويخرج ربع عشر قيمتها. وشرطها: أن يملكها بفعله بنية التجارة.\n- **الدين**: على مليء تجب زكاته إذا قبضه لما مضى، والدين على معسر أو مماطل يزكيه إذا قبضه لعام واحد على رواية.\n- **زكاة الفطر**: تجب على كل مسلم فضل عنده يوم العيد وليلته صاع عن قوته وقوت عياله وحوائجه الأصلية، عن نفسه وعمن يمونه من المسلمين. تجب بغروب الشمس ليلة الفطر، ويجوز إخراجها قبل العيد بيومين، وتخرج قبل صلاة العيد، ويحرم تأخيرها عن يوم العيد. وهي صاع من بر أو شعير أو تمر أو زبيب أو أقط، والأفضل التمر ثم الزبيب ثم البر ثم الأنفع.\n- **إخراج الزكاة**: يجب فور تمام الحول، ويجوز تعجيلها لحولين، ولا تسقط بموت المالك. ولا يجزئ إخراج القيمة على المذهب.\n- **من لا تدفع إليه الزكاة**: بنو هاشم ومواليهم، والكافر، والغني، ومن تلزمه نفقته (الأصول والفروع والزوجة)، والعبد، ولا يدفعها لزوجها على رواية. ويجزئ دفعها لصنف واحد.\n- **صدقة التطوع**: مستحبة كل وقت، وفي رمضان وأوقات الحاجة أفضل، والسر أفضل، وعلى القريب أفضل.\n\n## كتاب الصيام (تفاصيل)\n- **يجب صوم رمضان**: برؤية الهلال، أو إكمال شعبان ثلاثين، ويصام بشهادة عدل واحد، ولا يفطر إلا بشهادة عدلين. وإن حال دون منظره غيم أو قتر فالمذهب وجوب صيامه احتياطاً (ليلة الشك)، والصحيح عند المحققين عدمه.\n- **النية**: تجب من الليل لكل يوم من رمضان، ويصح النفل بنية من النهار قبل الزوال أو بعده.\n- **من يباح له الفطر**: المريض الذي يضره الصوم، والمسافر سفر قصر، والحائض والنفساء (يحرم عليهما الصوم)، والحامل والمرضع إذا خافتا على أنفسهما (تقضيان فقط) أو على ولديهما (تقضيان وتطعمان عن كل يوم مسكيناً)، والشيخ الكبير والمريض مرضاً لا يرجى برؤه (يطعم عن كل يوم مسكيناً ولا قضاء).\n- **لا يفطر**: من أكل أو شرب ناسياً أو مكرهاً، ومن ذرعه القيء، والاحتلام، والاكتحال، والقطرة في العين على رواية (والمذهب أنها تفطر إن وجد طعمها في حلقه)، وبلع الريق، والمضمضة والاستنشاق بلا مبالغة، والسواك، وذوق الطعام بلا بلع.\n- **الفطر عمداً في رمضان** بأكل أو شرب: يوجب القضاء والإمساك، ولا كفارة إلا في الجماع.\n- **يسن**: تعجيل الفطر، وتأخير السحور، والفطر على رطب فتمر فماء، والدعاء عند الفطر، وكثرة القراءة والذكر والصدقة، وقول \"إني صائم\" لمن شاتمه.\n- **يكره**: جمع ريقه فيبلعه، وذوق الطعام بلا حاجة، ومضغ العلك، والقبلة لمن تحرك شهوته، والمبالغة في المضمضة.\n- **القضاء**: يستحب فوراً ومتتابعاً، ويجب قبل رمضان الآخر، فإن أخره لغير عذر حتى أدركه رمضان آخر لزمه مع القضاء إطعام مسكين عن كل يوم. ومن مات وعليه صوم نذر صام عنه وليه، وإن كان صوم رمضان أطعم عنه.\n- **صوم التطوع**: أفضله يوم ويوم (صوم داود)، ثم صيام ثلاثة أيام من كل شهر والأفضل أيام البيض (13، 14، 15)، والاثنين والخميس، وست من شوال، وشهر المحرم وآكده عاشوراء ثم تاسوعاء، وتسع ذي الحجة وآكدها يوم عرفة لغير الحاج.\n- **يحرم صوم**: يومي العيدين، وأيام التشريق إلا للمتمتع والقارن إذا لم يجدا الهدي.\n- **يكره**: إفراد رجب، وإفراد الجمعة، وإفراد السبت، ويوم الشك، وصوم الدهر.\n- **ليلة القدر**: في العشر الأواخر، وأرجاها ليلة سبع وعشرين، ويدعو فيها: \"اللهم إنك عفو تحب العفو فاعف عني\".\n\n## كتاب الحج (تفاصيل)\n- **المواقيت**: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام ومصر والمغرب، ويلملم لأهل اليمن، وقرن المنازل لأهل نجد، وذات عرق لأهل العراق. وأهل مكة يحرمون بالحج منها وبالعمرة من الحل. ومن مر بميقات فهو ميقاته، ومن لم يمر بميقات أحرم إذا حاذاه.\n- **أشهر الحج**: شوال وذو القعدة وعشر من ذي الحجة.\n- **يسن عند الإحرام**: الغسل، والتنظف، والتطيب في البدن لا الثوب، والتجرد من المخيط ولبس إزار ورداء أبيضين، والإحرام عقب صلاة، وتعيين النسك، والاشتراط: \"وإن حبسني حابس فمحلي حيث حبستني\"، والتلبية: \"لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك، لا شريك لك\".\n- **التلبية**: يسن الإكثار منها ورفع الصوت بها للرجل، وتتأكد إذا علا نشزاً أو هبط وادياً وأدبار الصلوات وإقبال الليل والنهار والتقاء الرفاق، ويقطعها المعتمر إذا شرع في الطواف، والحاج إذا شرع في رمي جمرة العقبة يوم النحر.\n- **دخول مكة**: يسن من أعلاها (ثنية كداء)، ودخول المسجد من باب بني شيبة، والغسل لدخول مكة، وأن يقول عند رؤية البيت: \"اللهم أنت السلام ومنك السلام حينا ربنا بالسلام...\"، ثم يبدأ بطواف القدوم مضطبعاً (يجعل وسط ردائه تحت إبطه الأيمن وطرفيه على كتفه الأيسر)، ويرمل في الثلاثة الأول ويمشي في الأربعة، ويستلم الحجر ويقبله أو يشير إليه ويكبر، ويستلم الركن اليماني ولا يقبله، ويقول بينهما: \"ربنا آتنا في الدنيا حسنة...\".\n- **بعد الطواف**: يصلي ركعتين خلف المقام يقرأ فيهما الكافرون والإخلاص، ثم يستلم الحجر، ثم يسعى: يرقى على الصفا ويقرأ \"إن الصفا والمروة من شعائر الله\" ويكبر ثلاثاً ويدعو، ثم يمشي حتى يصل العلم الأخضر فيسعى سعياً شديداً حتى العلم الآخر ثم يمشي، والذهاب شوط والرجوع شوط، والمرأة لا ترمل ولا تسعى شديداً.\n- **يوم التروية (8)**: يحرم المتمتع بالحج من مكة ضحى، ويخرج إلى منى فيصلي بها الظهر إلى الفجر.\n- **يوم عرفة (9)**: يسير إلى نمرة، ويصلي الظهر والعصر جمع تقديم وقصراً، ثم يقف بعرفة (وكلها موقف إلا بطن عرنة)، ويستحب أن يقف عند الصخرات وجبل الرحمة مستقبل القبلة راكباً، ويكثر من الدعاء والتلبية، وأفضل الدعاء: \"لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير\". ووقت الوقوف: من فجر يوم عرفة (وقيل من الزوال) إلى فجر يوم النحر، ومن وقف نهاراً وجب عليه البقاء إلى الغروب، ومن لم يقف حتى طلع فجر النحر فاته الحج ويتحلل بعمرة وعليه القضاء والهدي.\n- **مزدلفة**: يدفع بعد الغروب بسكينة، ويصلي بمزدلفة المغرب والعشاء جمع تأخير، ويبيت بها، ويجوز للضعفة الدفع بعد نصف الليل، ويصلي الفجر في أول وقتها ثم يقف عند المشعر الحرام ويدعو حتى يسفر جداً، ويدفع قبل طلوع الشمس.\n- **يوم النحر (10)**: يرمي جمرة العقبة بسبع حصيات كحصى الخذف، يكبر مع كل حصاة، ويقطع التلبية عند أول حصاة، ووقت الرمي من نصف الليل إلى غروب الشمس، ثم ينحر الهدي، ثم يحلق أو يقصر (والحلق أفضل للرجل، والمرأة تقصر قدر أنملة)، ثم يفيض إلى مكة فيطوف طواف الإفاضة (الزيارة) وهو ركن، ثم يسعى إن كان متمتعاً أو لم يكن سعى بعد طواف القدوم. والترتيب بين هذه الأربعة سنة، فإن قدم بعضها على بعض فلا حرج.\n- **أيام التشريق (11، 12، 13)**: يبيت بمنى، ويرمي الجمرات الثلاث كل يوم بعد الزوال: الأولى (الصغرى) ثم الوسطى ثم العقبة، سبع حصيات لكل جمرة، ويدعو بعد الأولى والوسطى مستقبل القبلة رافعاً يديه، ولا يقف بعد العقبة. ومن تعجل في يومين خرج قبل الغروب، فإن غربت عليه الشمس بمنى لزمه المبيت والرمي من الغد.\n- **طواف الوداع**: واجب على كل من أراد الخروج من مكة، ويسقط عن الحائض والنفساء. ومن خرج قبله رجع إن كان قريباً وإلا فعليه دم.\n- **حكم من ترك واجباً**: عليه دم، ومن ترك ركناً لم يتم حجه حتى يأتي به، ومن ترك سنة فلا شيء عليه.\n- **الإحصار**: من منعه عدو من إتمام نسكه نحر هدياً ثم حلق وحل، ومن منعه مرض أو ذهاب نفقة لم يحل إلا أن يكون اشترط.\n- **الهدي**: أفضله الإبل ثم البقر ثم الغنم، ولا يجزئ إلا الجذع من الضأن (ستة أشهر) والثني من غيره (المعز سنة، والبقر سنتان، والإبل خمس سنين)، والبدنة والبقرة عن سبعة. ولا يجزئ العوراء البين عورها، والعرجاء البين عرجها، والمريضة البين مرضها، والعجفاء التي لا تنقي، ولا العضباء (ما ذهب أكثر أذنها أو قرنها).\n- **الأضحية**: سنة مؤكدة، ووقتها من بعد صلاة العيد إلى آخر يومين من أيام التشريق (ثلاثة أيام)، ويسن أن يأكل ثلثاً ويهدي ثلثاً ويتصدق بثلث، ولا يعطي الجزار أجرته منها، ولا يبيع جلدها. ومن أراد أن يضحي فلا يأخذ من شعره وأظفاره وبشرته شيئاً في العشر حتى يضحي.\n- **العقيقة**: سنة، عن الغلام شاتان متقاربتان، وعن الجارية شاة، تذبح يوم السابع، فإن فات ففي أربعة عشر، فإن فات ففي إحدى وعشرين، ويحلق رأس الغلام ويتصدق بوزنه فضة، ويسمى فيه، ولا تكسر عظامها.\n", "questions": [{"s": "fiqh", "q": "ما الأموال التي لا يشترط فيها حولان الحول؟", "a": "الخارج من الأرض (الزروع والثمار)، والعسل، والركاز، ونتاج السائمة وربح التجارة (حولهما حول أصلهما)."}, {"s": "fiqh", "q": "ما هي واجبات الحج؟", "a": "سبعة: الإحرام من الميقات، الوقوف بعرفة إلى الغروب لمن وقف نهاراً، المبيت بمزدلفة ليلة النحر إلى بعد نصف الليل، المبيت بمنى ليالي التشريق، رمي الجمار مرتباً، الحلق أو التقصير، طواف الوداع."}, {"s": "fiqh", "q": "ما هي أركان الحج؟", "a": "أربعة: الإحرام (وهو النية)، الوقوف بعرفة، طواف الإفاضة، السعي بين الصفا والمروة."}, {"s": "fiqh", "q": "ما هي سنن الأذان؟", "a": "خمسة: أن يكون المؤذن صيّتاً، أميناً، عالماً بالوقت، متطهراً، قائماً."}, {"s": "fiqh", "q": "ما شروط المؤذن؟", "a": "ستة: الإسلام، الذكورية، العقل
