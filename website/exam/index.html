، التمييز، النطق، العدالة."}, {"s": "fiqh", "q": "ما حكم الأذان والإقامة؟", "a": "فرض كفاية على الرجال الأحرار المقيمين للصلوات الخمس والجمعة، وسنة للمنفرد والمسافر."}, {"s": "fiqh", "q": "ما هي مفطرات الصائم؟", "a": "اثنا عشر: خروج دم الحيض والنفاس، الموت، الردة، العزم على الفطر، التردد في الفطر، القيء عمداً، الاحتقان من الدبر، بلع النخامة إذا وصلت الفم، الحجامة للحاجم والمحجوم، إنزال المني بتكرار النظر، خروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، كل ما وصل إلى الجوف أو الحلق أو الدماغ."}, {"s": "fiqh", "q": "اذكر أنواع التحلل في الحج وكيف يحصل.", "a": "التحلل الأول: بفعل اثنين من ثلاثة (رمي، حلق، طواف) ويحل به كل شيء إلا النساء. التحلل الثاني: بفعل الثلاثة، ويحل به كل شيء حتى النساء."}, {"s": "fiqh", "q": "اذكر الفروق بين المسح على الخفين والمسح على الجبيرة.", "a": "الخف: يشترط لبسه على طهارة، مؤقت (يوم وليلة للمقيم وثلاثة للمسافر)، يمسح أكثر أعلاه، في الحدث الأصغر فقط. الجبيرة: لا يشترط لبسها على طهارة، غير مؤقتة حتى البرء، يمسح جميعها، في الأصغر والأكبر، ولا تتجاوز قدر الحاجة."}, {"s": "fiqh", "q": "متى يتم المسافر الصلاة؟", "a": "إذا ائتم بمقيم، أو نوى الإقامة أكثر من أربعة أيام، أو نسي صلاة حضر فذكرها في السفر أو العكس، أو لم ينو القصر عند الإحرام، أو ائتم بمن يشك في إقامته، أو أحرم بها في الحضر ثم سافر."}, {"s": "fiqh", "q": "ما الحكم إذا زال العذر عن المفطر وهو في النهار؟", "a": "يلزمه الإمساك بقية اليوم مع القضاء، كمن طهرت من حيضها، أو قدم المسافر مفطراً، أو برئ المريض، أو أسلم الكافر، أو بلغ الصبي."}, {"s": "fiqh", "q": "ماذا يتحمل الإمام عن المأموم؟", "a": "قراءة الفاتحة، سجود السهو، السترة، دعاء القنوت، التشهد الأول إذا سُبق بركعة، السورة بعد الفاتحة والجهر في الجهرية، وسجود التلاوة إذا لم يسجد الإمام."}, {"s": "fiqh", "q": "بيّن حكم الصلاة على الميت، وهل يجزئ لو صلى على الميت امرأة وحدها دون أن يكون معها رجل؟", "a": "فرض كفاية، وتسقط بواحد مكلف ولو امرأة، فيجزئ ذلك."}, {"s": "fiqh", "q": "محمد يملك أربعين رأساً من الغنم السائمة وقد حال عليها الحول، بيّن مقدار الزكاة.", "a": "يجب عليه شاة واحدة، لأن نصاب الغنم أربعون، وفيها شاة إلى مائة وعشرين."}, {"s": "fiqh", "q": "عائشة تملك حلياً يبلغ نصاباً وقد حال عليه الحول، هل يجب عليها إخراج الزكاة؟", "a": "إن كان الحلي معداً للاستعمال المباح أو الإعارة فلا زكاة فيه على المذهب. وإن كان للكراء أو الادخار أو كان محرماً وجبت الزكاة (ربع العشر). نصاب الذهب 85 غراماً والفضة 595 غراماً."}, {"s": "fiqh", "q": "اذكر شروط الوجوب في الصيام.", "a": "أربعة: الإسلام، البلوغ، العقل، القدرة عليه."}, {"s": "fiqh", "q": "بيّن حكم من اعتكف في مسجد لا تقام فيه الجماعة وهي لازمة في حقه.", "a": "لا يصح اعتكافه، لأنه يلزمه الخروج لكل صلاة، إلا أن ينذر الاعتكاف في مدة لا تتخللها صلاة."}, {"s": "fiqh", "q": "عرّف الاستطاعة في الحج مع بيان الشرط الذي يجب أن يتحقق فيها.", "a": "أن يملك زاداً وراحلة تصلح لمثله، بشرط أن يكون ذلك فاضلاً عن قضاء دينه ونفقته ونفقة عياله وحوائجه الأصلية (مسكن وخادم)، وأن يكون الطريق آمناً."}, {"s": "fiqh", "q": "أفعال العباد لها تعلقان، فما هما؟", "a": "تعلق بمشيئة العبد (الكسب والاختيار)، وتعلق بمشيئة الله تعالى (الخلق والتقدير)، فأفعال العباد خلق لله وكسب من العبد."}, {"s": "fiqh", "q": "يسن رفع اليدين في الصلاة، اذكر ثلاثة مواضع.", "a": "عند تكبيرة الإحرام، وعند الركوع، وعند الرفع منه (وزاد بعضهم: عند القيام من التشهد الأول)."}, {"s": "fiqh", "q": "اذكر ماءً يكره استخدامه في الطهارة.", "a": "الماء المشمس في الأواني، والماء المتغير بما لا يمازجه كالدهن، وماء بئر بمقبرة، والماء المسخن بنجاسة، وماء زمزم للاستنجاء."}, {"s": "fiqh", "q": "ما فروض الوضوء؟", "a": "ستة: غسل الوجه ومنه المضمضة والاستنشاق، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل الرجلين إلى الكعبين، الترتيب، الموالاة."}, {"s": "fiqh", "q": "ما شروط الوضوء؟", "a": "ثمانية: انقطاع ما يوجبه، النية، الإسلام، العقل، التمييز، الماء الطهور المباح، إزالة ما يمنع وصوله، الاستنجاء أو الاستجمار."}, {"s": "fiqh", "q": "ما شروط المسح على الخف؟", "a": "سبعة: لبسهما على طهارة، سترهما محل الفرض، إمكان المشي بهما، ثبوتهما بنفسهما، إباحتهما، طهارتهما، سمكهما."}, {"s": "fiqh", "q": "هل يجوز للقادر الجلوس في صلاة الفرض؟ ولماذا؟", "a": "لا يجوز، لأن القيام ركن في الفرض على القادر. ويجوز في النافلة وله نصف الأجر."}, {"s": "fiqh", "q": "اذكر أصناف الزكاة.", "a": "ثمانية: الفقير، المسكين، العامل عليها، المؤلفة قلوبهم، الرقاب (المكاتب)، الغارم، في سبيل الله، ابن السبيل."}, {"s": "fiqh", "q": "اذكر مثالين على معنى أن يكون البائع قادراً على تسليم المبيع.", "a": "لا يصح بيع العبد الآبق، ولا البعير الشارد، ولا الطير في الهواء، ولا السمك في الماء، ولا المغصوب لغير غاصبه، لعدم القدرة على التسليم."}, {"s": "fiqh", "q": "متى يكون الزواج واجباً؟", "a": "يجب على من يخاف الزنا على نفسه. ويُسن لذي شهوة لا يخاف الزنا، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة."}, {"s": "fiqh", "q": "ما شروط تحريم الرضاع؟", "a": "شرطان: أن يكون خمس رضعات، وأن يكون في العامين (السنة الأولى والثانية)."}, {"s": "fiqh", "q": "متى يباح الصيد ومتى يكره؟", "a": "يباح لمن قصد به الانتفاع، ويكره لمن قصده لهواً ولعباً، ويحرم على المحرم وفي الحرم."}, {"s": "fiqh", "q": "ما شروط جواز بيع الربوي إن كان مثلين مكيلين أو موزونين بجنسه؟", "a": "شرطان: المماثلة في القدر، والقبض قبل التفرق. وإذا اختلف الجنس جاز التفاضل ووجب القبض قبل التفرق. وإذا بيع مكيل بموزون جاز التفاضل والتفرق."}, {"s": "fiqh", "q": "ما أركان الصلاة؟", "a": "أربعة عشر: القيام في الفرض على القادر، تكبيرة الإحرام، الفاتحة، الركوع، الرفع منه، الاعتدال قائماً، السجود، الرفع منه، الجلوس بين السجدتين، الطمأنينة، التشهد الأخير، الجلوس له، التسليمتان، الترتيب."}, {"s": "fiqh", "q": "ما واجبات الصلاة؟", "a": "ثمانية: التكبير لغير الإحرام، سمع الله لمن حمده للإمام والمنفرد، ربنا ولك الحمد للكل، سبحان ربي العظيم، سبحان ربي الأعلى، رب اغفر لي، التشهد الأول، الجلوس له."}, {"s": "fiqh", "q": "ما الفرق بين الركن والواجب في الصلاة؟", "a": "الركن لا يسقط عمداً ولا سهواً ولا جهلاً، والواجب يسقط بالسهو والجهل ويجبر بسجود السهو."}, {"s": "fiqh", "q": "ما أسباب سجود السهو؟", "a": "ثلاثة: الزيادة، النقص، الشك."}, {"s": "fiqh", "q": "ما أوقات النهي؟", "a": "ثلاثة: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، من صلاة العصر إلى الغروب، عند قيام الشمس حتى تزول."}, {"s": "fiqh", "q": "ما شروط جمع التقديم وجمع التأخير؟", "a": "التقديم أربعة: نية الجمع عند الإحرام بالأولى، عدم التفريق بينهما، وجود العذر عند افتتاحهما، استمراره إلى فراغ الثانية. التأخير اثنان: نية الجمع عند الإحرام بالأولى، وبقاء العذر إلى دخول وقت الثانية."}, {"s": "fiqh", "q": "على من تجب الجمعة؟ وما شروط صحتها؟", "a": "تجب على: الذكر، المسلم، المكلف، الحر، مسافر لا يباح له القصر، مقيم خارج البلد بينه وبينه فرسخ. شروط صحتها أربعة: الوقت، أن تكون في قرية يستوطنها أربعون، حضور الأربعين، تقدم خطبتين."}, {"s": "fiqh", "q": "ما أركان الخطبتين؟", "a": "ستة: حمد الله، الصلاة على الرسول ﷺ، قراءة آية، الوصية بتقوى الله، موالاتهما مع الصلاة، الجهر بهما."}, {"s": "fiqh", "q": "ما أركان صلاة الجنازة؟", "a": "سبعة: القيام، التكبيرات الأربع، الفاتحة، الصلاة على النبي ﷺ، الدعاء للميت، السلام، الترتيب."}, {"s": "fiqh", "q": "ما شروط وجوب الزكاة؟ وما الأموال الزكوية؟", "a": "الشروط خمسة: الإسلام، الحرية، ملك النصاب، الملك التام، تمام الحول. الأموال خمسة: السائمة، الخارج من الأرض، العسل، الأثمان، عروض التجارة."}, {"s": "fiqh", "q": "ما مقدار الزكاة في الخارج من الأرض والعسل والركاز والذهب وعروض التجارة وزكاة الفطر؟", "a": "الخارج من الأرض: نصف العشر إن سقي بكلفة والعشر بلا كلفة. العسل: العشر. الركاز: الخمس. الذهب والفضة والمعادن وعروض التجارة: ربع العشر. زكاة الفطر: صاع (2.5 كيلو)."}, {"s": "fiqh", "q": "ما كفارة الجماع في نهار رمضان؟", "a": "عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت."}, {"s": "fiqh", "q": "ما شروط صحة الاعتكاف وما يبطله؟", "a": "الشروط ستة: النية، الإسلام، العقل، التمييز، عدم ما يوجب الغسل، كونه في المسجد. المبطلات ستة: الخروج لغير عذر، نية الخروج، الوطء، الإنزال بالمباشرة، الردة، السكر."}, {"s": "fiqh", "q": "ما شروط وجوب الحج؟ وبم تزيد المرأة؟", "a": "خمسة: الإسلام، العقل، البلوغ، كمال الحرية، الاستطاعة. وتزيد المرأة: وجود المحرم."}, {"s": "fiqh", "q": "ما أنواع الأنساك؟", "a": "التمتع: يحرم بالعمرة في أشهر الحج ثم بالحج. الإفراد: يحرم بالحج ثم بالعمرة بعده. القران: يحرم بهما معاً."}, {"s": "fiqh", "q": "ما محظورات الإحرام؟", "a": "سبعة: لبس المخيط للرجال، تغطية الرأس للرجل والوجه للمرأة، الطيب، إزالة الشعر وتقليم الأظفار، قتل صيد البر، عقد النكاح، الوطء ودواعيه."}, {"s": "fiqh", "q": "ما أقسام الفدية؟", "a": "على التخيير: فدية اللبس والطيب وتغطية الرأس وإزالة الشعر والظفر وجزاء الصيد (صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة). على الترتيب: دم المتعة والقران وترك الواجب والإحصار والوطء، فمن لم يجد صام ثلاثة أيام في الحج وسبعة إذا رجع."}, {"s": "fiqh", "q": "ما شروط البيع؟", "a": "سبعة: الرضى، الرشد، كون المبيع مالاً، ملك البائع له أو الإذن، القدرة على التسليم، معرفة الثمن والمثمن، أن يكون منجزاً لا معلقاً."}, {"s": "fiqh", "q": "ما أقسام الخيار؟", "a": "سبعة: المجلس، الشرط، الغبن، التدليس، العيب، الخلف في الصفة، الخلف في قدر الثمن."}, {"s": "fiqh", "q": "ما أركان النكاح وشروطه؟", "a": "الأركان: الإيجاب والقبول. الشروط خمسة: تعيين الزوجين، رضاهما، الولي، شهادة ذكرين مكلفين، خلوهما من الموانع."}, {"s": "fiqh", "q": "ما شروط الولي في النكاح؟", "a": "سبعة: الذكورية، العقل، البلوغ، الحرية، اتفاق الدين، العدالة ولو ظاهرة، الرشد."}, {"s": "fiqh", "q": "فيم تعتبر الكفاءة في النكاح؟", "a": "خمسة: الديانة، الصناعة، الميسرة، الحرية، النسب."}, {"s": "fiqh", "q": "ما عدة المتوفى عنها زوجها والمطلقة؟", "a": "المتوفى عنها: الحامل بوضع الحمل، وغير الحامل أربعة أشهر وعشراً. المطلقة: من تحيض ثلاث حيض، ومن لا تحيض ثلاثة أشهر، ومن ارتفع حيضها ولا تعلم سببه تسعة أشهر ثم ثلاثة."}, {"s": "fiqh", "q": "فيم تحد المرأة؟", "a": "أربعة: تجتنب الزينة، والطيب، ولبس الحلي، ولبس الملون."}, {"s": "fiqh", "q": "ما شروط نفقة الأقارب؟", "a": "ثلاثة: أن يكونوا فقراء، أن يكون المنفق غنياً يفضل عن قوته وقوت زوجته يومه وليلته، أن يكون وارثاً لهم إلا الأصول والفروع فتجب مطلقاً."}, {"s": "fiqh", "q": "ما أحكام الحضانة؟", "a": "إذا بلغ الصبي سبعاً عاقلاً خُيّر بين أبويه. إذا بلغت الأنثى سبعاً كانت عند أبيها وجوباً حتى تتزوج. المجنون ولو أنثى عند أمه مطلقاً."}, {"s": "fiqh", "q": "ما شروط الذكاة؟", "a": "أربعة: كون الفاعل عاقلاً مميزاً قاصداً للذكاة، الآلة (كل محدد غير السن والظفر)، قطع الحلقوم والمريء، التسمية وتسقط سهواً لا جهلاً."}, {"s": "fiqh", "q": "ما شروط صيد الكلب والفهد وصيد الطير؟", "a": "الكلب والفهد: يسترسل إذا أرسل، ينزجر إذا زجر، إذا أمسك لم يأكل. الطير: يسترسل إذا أرسل، يرجع إذا دُعي، يجرح الصيد لا بصدم ولا خنق."}, {"s": "fiqh", "q": "بم تنعقد اليمين؟ وما كفارتها؟", "a": "بالله أو اسم من أسمائه أو صفة من صفاته. الكفارة: إطعام عشرة مساكين أو كسوتهم أو تحرير رقبة، فإن لم يجد صام ثلاثة أيام متتابعة."}, {"s": "fiqh", "q": "ما أنواع النذر وأحكامه؟", "a": "ستة: المطلق (كفارة يمين)، اللجاج والغضب (يخير بين الفعل والكفارة)، المباح (يخير)، المكروه (يسن ألا يفعله ويكفر)، المعصية (يحرم الوفاء ويكفر)، التبرر (يجب الوفاء)."}, {"s": "fiqh", "q": "ما نواقض الوضوء؟", "a": "ثمانية: الخارج من السبيلين، خروج النجاسة من بقية البدن، زوال العقل، مس الفرج بلا حائل، مباشرة الذكر الأنثى لشهوة بلا حائل، غسل الميت، أكل لحم الإبل، الردة."}, {"s": "fiqh", "q": "ما موجبات الغسل؟", "a": "سبعة: انتقال المني، خروجه بلذة، تغييب الحشفة في فرج، إسلام الكافر، الحيض، النفاس، الموت."}, {"s": "fiqh", "q": "ما شروط التيمم وفروضه ومبطلاته؟", "a": "الشروط ثمانية: النية، الإسلام، العقل، التمييز، الاستنجاء، دخول الوقت، تعذر الماء، تراب طهور له غبار. الفروض خمسة: مسح الوجه، مسح اليدين إلى الكوعين، الترتيب، الموالاة، تعيين النية. المبطلات خمسة: ما أبطل الوضوء، وجود الماء، خروج الوقت، زوال المبيح، خلع ما مسح عليه."}, {"s": "fiqh", "q": "ما الذي يحرم بالحيض؟", "a": "تسعة: الوطء، الطلاق، الصلاة، الصوم، الطواف، قراءة القرآن، مس المصحف، اللبث في المسجد، المرور فيه إن خافت التلويث."}, {"s": "fiqh", "q": "ما شروط الصلاة؟", "a": "تسعة: الإسلام، العقل، التمييز، الطهارة، دخول الوقت، ستر العورة، اجتناب النجاسة، استقبال القبلة، النية."}], "mcq": [{"s": "fiqh", "q": "عدد فروض الوضوء في المذهب الحنبلي:", "o": ["ستة", "سبعة", "خمسة", "ثمانية"], "c": 0, "sc": "ibadat"}, {"s": "fiqh", "q": "عدد شروط الوضوء:", "o": ["ثمانية", "سبعة", "ستة", "تسعة"], "c": 0, "sc": "ibadat"}, {"s": "fiqh", "q": "واجب الوضوء والغسل والتيمم على المذهب هو:", "o": ["التسمية فقط", "النية فقط", "الترتيب", "الموالاة"], "c": 0, "sc": "ibadat"}, {"s": "fiqh", "q": "أي مما يلي ليس من فروض الوضوء؟", "o": ["التسمية", "مسح الأذنين", "المضمضة", "الم ُمْرَةِ العُلَمَاءِ وَحُشِرَ فِى زُمْرَةِ الشُّهَدَاءِ».\n- «الزمرة»: الجماعة والرفقة.\n- **واتفق الحفاظ على أنه حديث ضعيف وإن كثرت طرقه.**\n- أول من عُلِم أنه صنّف في الأربعين: **عبد الله بن المبارك**، ثم محمد بن أسلم الطوسي العالم الرباني، ثم الحسن بن سفيان النسائي، وأبو بكر الآجري، وأبو بكر بن إبراهيم الأصفهاني، والدارقطني، والحاكم، وأبو نعيم، وأبو عبد الرحمن السلمي، وأبو سعيد الماليني، وأبو عثمان الصابوني، وعبد الله بن محمد الأنصاري، وأبو بكر البيهقي، وخلائق.\n- اتفق العلماء على جواز العمل بالحديث الضعيف في فضائل الأعمال، ومع هذا فليس اعتماد النووي على هذا الحديث، بل على قوله صلى الله عليه وسلم: «لِيُبَلِّغِ الشَّاهِدُ مِنْكُمُ الغَائِبَ»، وقوله: «نَضَّرَ اللهُ امْرَءاً سَمِعَ مَقَالَتِى فَوَعَاهَا فَأَدَّاهَا كَمَا سَمِعَهَا» — ونضّر الله امرأً: أي نعّمه.\n- من العلماء من جمع الأربعين في أصول الدين، وبعضهم في الفروع، وبعضهم في الجهاد، وبعضهم في الزهد، وبعضهم في الآداب، وبعضهم في الخطب.\n- التزم النووي أن تكون الأحاديث صحيحة، ومعظمها في صحيحي البخاري ومسلم، وأن يذكرها محذوفة الأسانيد ليسهل حفظها.\n- كل حديث منها قاعدة عظيمة من قواعد الدين، وصفه العلماء بأن مدار الإسلام عليه، أو أنه نصف الإسلام أو ثلثه.\n\n## الحديث الأول: الأعمال بالنيات\n\n- **الراوي**: أمير المؤمنين أبو حفص عمر بن الخطاب رضي الله عنه.\n- **المتن**: «إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ».\n- **التخريج**: رواه إماما المحدثين: أبو عبد الله محمد بن إسماعيل بن إبراهيم بن المغيرة بن بَرْدِزْبَه البخاري، وأبو الحسين مسلم بن الحجاج بن مسلم القشيري النيسابوري، في صحيحيهما اللذين هما أصح الكتب المصنفة. ورواه البخاري في غير موضع من كتابه، ورواه مسلم في آخر كتاب الجهاد.\n- هو أحد الأحاديث التي عليها مدار الإسلام. قال الإمام أحمد والشافعي: يدخل في حديث الأعمال بالنيات ثلث العلم (قاله البيهقي وغيره)، وسبب ذلك أن كسب العبد يكون بقلبه ولسانه وجوارحه، والنية أحد الأقسام الثلاثة.\n- وروي عن الشافعي: **يدخل هذا الحديث في سبعين باباً من الفقه**. وقال جماعة من العلماء: هذا الحديث ثلث الإسلام.\n- يُستحب أن تُستفتح المصنفات بهذا الحديث، وممن ابتدأ به في أول كتابه: الإمام البخاري. وقال عبد الرحمن بن مهدي: ينبغي لكل من صنّف كتاباً أن يبتدئ فيه بهذا الحديث تنبيهاً للطالب على تصحيح النية.\n- **مشهور بالنسبة إلى آخره، غريب بالنسبة إلى أوله**؛ لأنه لم يروه عن النبي صلى الله عليه وسلم إلا عمر، ولم يروه عن عمر إلا **علقمة بن أبي وقاص**، ولم يروه عن علقمة إلا **محمد بن إبراهيم التيمي**، ولم يروه عن محمد إلا **يحيى بن سعيد الأنصاري**، ثم اشتهر بعد ذلك فرواه عنه أكثر من مائتي إنسان أكثرهم أئمة.\n- لفظة (إنما) **للحصر**: تثبت المذكور وتنفي ما عداه، وهي تارة تقتضي الحصر المطلق وتارة الحصر المخصوص، ويفهم ذلك بالقرائن، كقوله تعالى (إنما أنت منذر) فظاهره الحصر في النذارة والرسول لا ينحصر في ذلك بل له أوصاف كثيرة.\n- المراد بـ«الأعمال»: **الأعمال الشرعية**، ومعناه: لا يُعتدّ بالأعمال بدون النية، مثل الوضوء والغسل والتيمم والصلاة والزكاة والصوم والحج والاعتكاف وسائر العبادات.\n- **إزالة النجاسة لا تحتاج إلى نية؛ لأنها من باب الترك، والترك لا يحتاج إلى نية**. وذهب جماعة إلى صحة الوضوء والغسل بغير نية.\n- في قوله «إنما الأعمال بالنيات» محذوف، واختلف العلماء في تقديره: فالذين اشترطوا النية قدّروا: **صحة** الأعمال بالنيات، والذين لم يشترطوها قدّروا: **كمال** الأعمال بالنيات.\n- قال الخطابي: قوله «وإنما لكل امرئ ما نوى» يفيد معنى خاصاً غير الأول، وهو **تعيين العمل بالنية**. وقال النووي: فائدة ذكره أن **تعيين المنوي شرط**؛ فلو كان على إنسان صلاة مقضية لا يكفيه أن ينوي الصلاة الفائتة، بل يشترط أن ينوي كونها ظهراً أو عصراً أو غيرهما.\n- المتقرر عند أهل العربية: أن الشرط والجزاء والمبتدأ والخبر لا بد أن يتغايرا، وههنا قد وقع الاتحاد، وجوابه: (فمن كانت هجرته إلى الله ورسوله) نية وقصداً (فهجرته إلى الله ورسوله) حكماً وشرعاً.\n- **سبب ورود الحديث**: أن رجلاً هاجر من مكة إلى المدينة ليتزوج امرأة يقال لها **«أم قيس»** لا يريد بذلك فضيلة الهجرة، فكان يقال له **«مهاجر أم قيس»**.\n\n## الحديث الثاني: حديث جبريل (الإسلام والإيمان والإحسان)\n\n- **الراوي**: عمر بن الخطاب رضي الله عنه. **التخريج**: رواه مسلم.\n- حديث عظيم اشتمل على جميع وظائف الأعمال الظاهرة والباطنة، وعلوم الشريعة كلها راجعة إليه، فهو كالأمّ للسنة، كما سميت الفاتحة **أمّ القرآن**.\n- فيه دليل على تحسين الثياب والهيئة والنظافة عند الدخول على العلماء والفضلاء والملوك.\n- «لا يُرى عليه أثر السفر»: المشهور ضم الياء مبنياً لما لم يسم فاعله، ورواه بعضهم بالنون المفتوحة، وكلاهما صحيح.\n- «وضع كفيه على فخذيه» هو المشهور الصحيح، ورواه النسائي: «فوضع يديه على ركبتي النبي صلى الله عليه وسلم».\n- **استُفيد من الحديث**: أن الإسلام والإيمان حقيقتان متباينتان لغة وشرعاً، وقد يتوسع فيهما الشرع فيُطلق أحدهما على الآخر على سبيل التجوّز.\n- «فعجبنا له يسأله ويصدقه»: إنما تعجبوا لأن ما جاء به النبي لا يعرف إلا من جهته، وليس هذا السائل ممن عرف بلقاء النبي ولا بالسماع منه، ثم هو قد سأل سؤال عارف محقق مصدّق.\n- **الإيمان بالله**: التصديق بأنه سبحانه موجود موصوف بصفات الجلال والكمال، منزه عن صفات النقص، واحد صمد فرد خالق جميع المخلوقات.\n- **الإيمان بالملائكة**: التصديق بأنهم عباد مكرمون لا يسبقونه بالقول وهم بأمره يعملون.\n- **الإيمان بالرسل**: أنهم صادقون فيما أخبروا به عن الله، أيدهم بالمعجزات، وبلغوا رسالاته، وبيّنوا للمكلفين ما أُمروا به، وتجب محبتهم واحترامهم، ولا يفرق بين أحد منهم.\n- **الإيمان باليوم الآخر**: التصديق بيوم القيامة وما اشتمل عليه من الإعادة بعد الموت والحشر والنشر والحساب والميزان والصراط والجنة والنار.\n- **الإيمان بالقدر**: التصديق بما تقدّم، وحاصل ما دل عليه (والله خلقكم وما تعملون) و(إنا كل شيء خلقناه بقدر)، وحديث ابن عباس (واعلم أن الأمة لو اجتمعوا...).\n- **الإحسان**: حاصله راجع إلى إتقان العبادات ومراعاة حقوق الله ومراقبته واستحضار عظمته وجلالته حال العبادات.\n- «أماراتها» بفتح الهمزة، والأمارة: العلامة. و«الأمة» هنا: الجارية المستولدة. و«ربتها»: سيدها، وجاء في رواية «بعلها»؛ ويسمى الزوج: بعلاً، وفي الحديث (ربتها) بالتأنيث.\n- **في معنى (أن تلد الأمة ربتها) أقوال**: (1) أن يستولي المسلمون على بلاد الكفر فيكثر السبي فيكون ولد الأمة من سيدها بمنزلة سيدها لشرفه بأبيه، فيكون من أشراط الساعة استيلاء المسلمين على المشركين وكثرة الفتوح والتسري. (2) أن تفسد أحوال الناس حتى يبيع السادة أمهات أولادهم، فيكون من أشراط الساعة **غلبة الجهل بتحريم بيعهن**. (3) أن يكثر العقوق في الأولاد فيعامل الولد أمه معاملة السيد أمته من الإهانة والسب.\n- «العالة» بتخفيف اللام: جمع عائل، وهو الفقير. وفي الحديث **كراهة ما لا تدعو الحاجة إليه من تطويل البناء وتشييده**، ومات رسول الله صلى الله عليه وسلم ولم يضع حجراً على حجر ولا لبنة على لبنة.\n- «رعاء الشاء»: خصّهم بالذكر لأنهم أضعف أهل البادية، بخلاف أهل الإبل فإنهم في الغالب ليسوا عالة ولا فقراء.\n- «فلبثت ملياً» قد رُوي بالتاء (يعني لبث عمر)، ورُوي (فلبث) بغير تاء يعني: أقام النبي صلى الله عليه وسلم بعد انصرافه، وكلاهما صحيح المعنى. و«ملياً» بتشديد الياء: أي زماناً كثيراً، وكان ذلك **ثلاثاً** كما جاء مبيناً في رواية أبي داود وغيره.\n- «أتاكم يعلمكم دينكم»: أي قواعد دينكم أو كليات دينكم، قاله النووي في شرحه لهذا الحديث في صحيح مسلم.\n- نقل عن ابن بطال المالكي عن أبي الحسين: **مذهب أهل السنة أن الإيمان قول وعمل يزيد وينقص**، بدليل (ليزدادوا إيماناً مع إيمانهم). وقال بعض العلماء: نفس التصديق لا يزيد ولا ينقص، والإيمان الشرعي يزيد وينقص بزيادة ثمراته وهي الأعمال ونقصانها.\n- قال البخاري في صحيحه، عن ابن أبي مليكة: أدركت ثلاثين رجلاً من أصحاب رسول الله صلى الله عليه وسلم كلهم يخاف النفاق على نفسه، ما منهم أحد يقول إن إيمانه كإيمان جبريل وميكائيل.\n- الخلاصة: **الإيمان والإسلام يجتمعان ويفترقان، وكل مؤمن مسلم وليس كل مسلم مؤمناً**.\n\n## الحديث الثالث: بني الإسلام على خمس\n\n- **الراوي**: أبو عبد الرحمن عبد الله بن عمر بن الخطاب رضي الله عنهما. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «بُنِىَ الإِسْلاَمُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لاَ إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّداً رَسُولُ اللهِ، وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ البَيْتِ، وَصَوْمِ رَمَضَانَ».\n- قال **أبو العباس القرطبي**: يعني أن هذه الخمس أساس دين الإسلام وقواعده التي عليها بُني وبها يقوم، وإنما خُصّت هذه بالذكر ولم يُذكر معها الجهاد — مع أنه يظهر الدين ويقمع عناد الكافرين — لأن هذه الخمس فرض دائم، والجهاد من فروض الكفايات وقد يسقط في بعض الأوقات.\n- وقع في بعض الروايات تقديم الحج على الصوم **وهو وهم**؛ لأن ابن عمر لما سمع المستعيد يقدم الحج على الصوم زجره ونهاه عن ذلك، وقدّم الصوم على الحج وقال: «هكذا سمعته من رسول الله صلى الله عليه وسلم».\n- قال النووي في شرحه: هكذا جاء في هذه الرواية بتقديم الحج على الصوم، وهذا من باب الترتيب في الذكر دون الحكم، لأن صوم رمضان وجب قبل الحج.\n- في رواية لابن عمر: «بُني الإسلام على أن تعبد الله وتكفر بما سواه...»، وفي رواية أخرى: أن رجلاً قال لعبد الله بن عمر: ألا نغزو؟ فقال: إني سمعت رسول الله يقول (إن الإسلام بني على خمس).\n- ووقع في بعض الطرق (على خمسة) بالهاء، وفي بعضها بلا هاء، وكلاهما صحيح.\n\n## الحديث الرابع: خلق الإنسان وكتابة القدر\n\n- **الراوي**: أبو عبد الرحمن عبد الله بن مسعود رضي الله عنه. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِى بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْماً نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إِلَيْهِ المَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ وَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ: بِكَتْبِ رِزْقِهِ، وَأَجَلِهِ، وَعَمَلِهِ، وَشَقِىٌّ أَوْ سَعِيدٌ...».\n- «وهو الصادق المصدوق»: أي **الصادق في قوله، المصدوق فيما يأتيه من الوحي الكريم**.\n- قال بعض العلماء في معنى (يُجمع خلقه في بطن أمه): أن المني يقع في الرحم متفرقاً فيجمعه الله تعالى في محل الولادة من الرحم في هذه المدة.\n- جاء عن ابن مسعود في تفسير ذلك: إن النطفة إذا وقعت في الرحم فأراد الله أن يخلق منها بشراً طارت في بشر المرأة تحت كل ظفر وشعر، ثم تمكث أربعين ليلة ثم تصير دماً في الرحم فذلك جمعها، وهو وقت كونها علقة.\n- «ثم يرسل إليها الملك» يعني **الملك الموكل بالرحم**.\n- ظاهر الحديث أن هذا العامل كان عمله صحيحاً وأنه قرب من الجنة بسبب عمله، وإنما منعه من ذلك سابق القدر الذي يظهر عند الخاتمة، **فإذاً الأعمال بالسوابق لكن لما كانت السوابق مستورة عنا والخاتمة ظاهرة جاء (إنما الأعمال بالخواتيم)**.\n- أما حديث مسلم في كتاب الإيمان: (إن الرجل ليعمل بعمل أهل الجنة فيما يبدو للناس وهو من أهل النار) فإنه لم يكن عمله صحيحاً في نفسه، وإنما كان رياءً وسمعة، فيُستفاد منه **ترك الالتفات إلى الأعمال والركون إليها، والتعويل على كرم الله ورحمته**.\n- «وأجله» بالباء الموحدة في أوله على البدل من (أربع كلمات)، وقوله (شقي أو سعيد) مرفوع لأنه خبر مبتدأ محذوف تقديره: وهو شقي أو سعيد.\n- المراد بانقلاب العامل: أن هذا قد يقع في نادر من الناس لا أنه غالب فيهم، وذلك من لطف الله وسعة رحمته؛ فإن انقلاب الناس من الشر إلى الخير كثير، وأما انقلابهم من الخير إلى الشر ففي غاية الندور.\n- في رواية: (إن رحمتي سبقت غضبي) وفي رواية (تغلب غضبي)، وفي هذا الحديث **إثبات القدر كما هو مذهب أهل السنة**.\n- قال الإمام السمعاني: سبيل معرفة هذا الباب: **التوقيف** من الكتاب والسنة دون محض القياس ومجرد العقول، فمن عدل عن التوقيف منه ضلّ وتاه.\n- قال العلماء: وكتاب الله تعالى ولوحه وقلمه: كل ذلك مما يجب الإيمان به، وأما كيفية ذلك وصفته فعلمه إلى الله تعالى.\n\n## الحديث الخامس: رد المحدثات\n\n- **الراوي**: أم المؤمنين أم عبد الله عائشة رضي الله عنها. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «مَنْ أَحْدَثَ فِى أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ». وفي رواية لمسلم: «مَنْ عَمِلَ عَمَلاً لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ».\n- قال أهل اللغة: **الرد هنا بمعنى المردود، أي فهو باطل غير معتدّ به**. وقوله (ليس عليه أمرنا) يعني **حكمنا**.\n- هذا الحديث **قاعدة عظيمة من قواعد الدين، وهو من جوامع الكلم** التي أوتيها المصطفى صلى الله عليه وسلم، فإنه صريح في رد كل بدعة وكل مخترع.\n- **يُستدل به على إبطال جميع العقود المنهية وعدم وجود ثمراتها**، ويستدل به بعض الأصوليين على أن **النهي يقتضي الفساد**.\n- والرواية الأخرى (من عمل عملاً ليس عليه أمرنا فهو رد) **صريحة في ترك كل محدثة سواء أحدثها فاعلها أو سبق إليها**، فإنه قد يحتج به بعض المعاندين إذا فعل البدعة فيقول: ما أحدثت شيئاً، فيُحتج عليه بهذه الرواية.\n- **ما لا يدخل في الحديث**: تفريع الأصول التي لا تخرج عن السنة، ككتابة القرآن العزيز في المصاحف، والمذاهب التي يردّ فيها الفقهاء المجتهدون الفروع إلى الأصول، والكتب الموضوعة في النحو والحساب والفرائض وغيرها مما مرجعه ومبناه على أقوال رسول الله صلى الله عليه وسلم وأوامره.\n\n## الحديث السادس: الحلال بيّن والحرام بيّن\n\n- **الراوي**: أبو عبد الله النعمان بن بشير رضي الله عنهما. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «إِنَّ الحَلاَلَ بَيِّنٌ وَإِنَّ الحَرَامَ بَيِّنٌ وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لاَ يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهَاتِ فَقَدِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِى الشُّبُهَاتِ وَقَعَ فِى الحَرَامِ كَالرَّاعِى يَرْعَى حَوْلَ الحِمَى يُوشِكُ أَنْ يَرْتَعَ فِيهِ... أَلاَ وَإِنَّ فِى الجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الجَسَدُ كُلُّهُ وَإِذَا فَسَدَتْ فَسَدَ الجَسَدُ كُلُّهُ أَلاَ وَهِىَ القَلْبُ».\n- هذا الحديث **أصل عظيم من أصول الشريعة**. قال **أبو داود السجستاني**: الإسلام يدور على أربعة أحاديث، ذكر منها هذا الحديث. وأجمع العلماء على عظم موقعه وكثرة فوائده.\n- **الأشياء ثلاثة أقسام**: (1) ما نصّ الله على تحليله فهو الحلال البيّن، كقوله (أحل لكم الطيبات وطعام الذين أوتوا الكتاب حل لكم). (2) ما نص الله على تحريمه فهو الحرام البيّن، مثل (حرمت عليكم أمهاتكم وبناتكم) و(وحُرّم عليكم صيد البر ما دمتم حرماً)، وكل ما جعل الله فيه حدّاً أو عقوبة أو وعيداً فهو حرام. (3) **الشبهات**: وهي كل ما تنازعته الأدلة من الكتاب والسنة وتجاذبته المعاني، فالإمساك عنه ورع.\n- **اختلف العلماء في المشتبهات**: فقالت طائفة: هي حرام، لقوله (استبرأ لدينه وعرضه). وقال آخرون: هي حلال، بدليل (كالراعي يرعى حول الحمى) فدل على أن ذلك حلال وأن تركه ورع. وقالت طائفة أخرى: **لا نقول إنها حلال ولا حرام؛ لأنه جعلها بين الحلال البيّن والحرام البيّن، فينبغي أن نتوقف عنها، وهذا من باب الورع أيضاً**.\n- **شاهد ذلك**: حديث عائشة في اختصام **سعد بن أبي وقاص وعبد بن زمعة** في الغلام، فقال النبي صلى الله عليه وسلم: «هو لك يا عبد بن زمعة، **الولد للفراش وللعاهر الحجر**»، واحتجب منه من **سودة** — فحكم بالولد للفراش وأنه لزمعة على الظاهر وأنه أخو سودة، ثم أمر سودة بالاحتجاب للشبهة الداخلة عليه، فاحتاط لنفسه.\n- وكذلك **حديث عدي بن حاتم**: (إني أرسل كلبي وأسمي عليه فأجد معه على الصيد كلباً آخر) قال: «لا تأكل إنما سميت على كلبك ولم تسم على غيره» — فأفتاه بالشبهة خوفاً من أن يكون الكلب الذي قتله غير مسمى عليه.\n- ففي فتياه صلى الله عليه وسلم **دلالة على الاحتياط في الحوادث والنوازل المحتملة للتحليل والتحريم لاشتباه أسبابها**، وهذا معنى قوله «دع ما يريبك إلى ما لا يريبك».\n- قال بعض العلماء: **المشتبهات ثلاثة أقسام**: (1) ما يعلم الإنسان أنه حرام ثم يشك فيه هل زال تحريمه أم لا؟ كالذي يحرم على المرء أكله قبل الذكاة إذا شك في ذكاته — **لم يزل التحريم إلا بيقين الذكاة**، والأصل فيه حديث عديّ. (2) عكس ذلك: أن يكون الشيء حلالاً فيشك في تحريمه، كرجل له زوجة فشك في طلاقها أو أمة فيشك في عتقها — **فهو على الإباحة حتى يعلم تحريمه**، والأصل فيه حديث عبد الله بن زيد: فمن شك في الحدث بعد أن تيقن الطهارة. (3) أن يشك في شيء فلا يدري أحلال أم حرام؟ ويحتمل الأمرين جميعاً ولا دلالة على أحدهما — **فالأحسن التنزه**، كما فعل النبي صلى الله عليه وسلم في التمرة الساقطة: (لولا أني أخشى أن تكون من الصدقة لأكلتها).\n- أما إن جوّز نقيض ما ترجح عنده بأمر موهوم لا أصل له — كترك استعمال ماء باق على أوصافه مخافة تقدير نجاسة وقعت فيه، أو ترك الصلاة في موضع لا أثر فيه مخافة أن يكون فيه بول قد جف، أو غسل ثوب مخافة إصابة نجاسة لم يشاهدها — **فهذا يجب أن لا يلتفت إليه، فإن التوقف لأجل ذلك التجويز هوس، والورع منه وسوسة شيطان، إذ ليس فيه من معنى الشبهة شيء**.\n- «لا يعلمهن كثير من الناس»: أي لا يعلم حكمهن من التحليل والتحريم، وإلا فالذي يعلم الشبهة يعلمها من حيث إنها مشكلة لتردّدها بين أمور محتملة.\n- **(من وقع في الشبهات وقع في الحرام) يكون بوجهين**: أحدهما: أن من لم يتق الله وتجرأ على الشبهات أفضت به إلى المحرمات، كما قيل: **الصغيرة تجرّ الكبيرة والكبيرة تجرّ الكفر**، وروي (المعاصي بريد الكفر). الوجه الثاني: أن من أكثر من مواقعة الشبهات **أظلم عليه قلبه لفقدان نور العلم ونور الورع**، فيقع في الحرام وهو لا يشعر به.\n- «كالراعي يرعى حول الحمى يوشك أن يقع فيه»: مثل ضربه لمحارم الله عز وجل. وأصله أن **العرب كانت تحمي مراعي لمواشيها وتخرج بالتوعد بالعقوبة لمن قربها**، فالخائف من عقوبة السلطان يبعد بماشيته عن ذلك الحمى. وهكذا محارم الله من القتل والربا والسرقة وشرب الخمر والقذف والغيبة والنميمة ونحو ذلك.\n- «يوشك» بكسر الشين، مضارع «أوشك» بفتحها، وهي من أفعال المقاربة. و«يرتع» بفتح التاء معناها: **أكل الماشية من المرعى**، وأصله إقامتها فيه وبسطها في الأكل.\n- «المضغة»: **القطعة من اللحم، وهي قدر ما يمضغه الماضغ**، يعني بذلك صغر جرمها وعِظَم قدرها. و«صلحت» رويناه بفتح اللام. و«القلب» في الأصل مصدر، وسمي به العضو **لسرعة الخواطر فيه وترددها عليه**، وهو أشرف الأعضاء.\n\n## الحديث السابع: الدين النصيحة\n\n- **الراوي**: أبو رقية تميم بن أوس الداري رضي الله عنه. **التخريج**: رواه مسلم.\n- **المتن**: «الدِّينُ النَّصِيحَةُ». قلنا: لمن؟ قال: «للهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلأَئِمَّةِ المُسْلِمِينَ وَعَامَّتِهِمْ».\n- **ليس لتميم الداري رضي الله عنه غير هذا الحديث** (أي في الأربعين).\n- «النصيحة»: **كلمة جامعة معناها إرادة جملة الخير، وحيازة لحظ المنصوح له**. وهي من وجيز الأسماء ومختصر الكلام، وليس في كلام العرب كلمة مفردة يُستوفى بها العبارة عن معنى هذه الكلمة، كما قالوا في «الفلاح»: ليس في كلام العرب كلمة أجمع لخيري الدنيا والآخرة منها.\n- معنى (الدين النصيحة): أي **عماد الدين وقوامه النصيحة**، كقوله (الحج عرفة) أي عماده ومعظمه.\n- **تفسير أنواع النصيحة (قاله الخطابي وغيره)**:\n  - **النصيحة لله**: الإيمان به ونفي الشرك عنه، وترك الإلحاد في صفاته، ووصفه بصفات الكمال والجلال، وتنزيهه عن النقائص، والقيام بطاعته واجتناب معصيته، والحب فيه والبغض فيه، وجهاد من كفر به، والاعتراف بنعمته والشكر عليها، والإخلاص في جميع الأمور، والدعاء إلى جميع الأوصاف المذكورة والحث عليها، والتلطف بالناس. قال الخطابي: **وحقيقة هذه الأوصاف راجعة إلى العبد في نصحه نفسه، فإن الله سبحانه غني عن نصح الناصح**.\n  - **النصيحة لكتابه**: الإيمان بأن كلام الله وتنزيله لا يشبهه شيء من كلام الناس ولا يقدر على مثله أحد من الخلق، ثم تعظيمه وتلاوته حق تلاوته وتحسينها والخشوع عندها وإقامة حروفه في التلاوة، والذبّ عنه لتأويل المحرفين، والتصديق بما فيه، والوقوف مع أحكامه، وتفهّم علومه وأمثاله، والاعتبار بمواعظه، والتفكر في عجائبه، والعمل بمحكمه، والتسليم لمتشابهه، والبحث عن عمومه، والدعاء إليه.\n  - **النصيحة لرسوله**: تصديقه على الرسالة، والإيمان بجميع ما جاء به، وطاعته في أمره ونهيه، ونصرته حياً وميتاً، ومعاداة من عاداه وموالاة من والاه، وإعظام حقه وتوقيره، وإحياء طريقته وسنته، وإجابة دعوته، ونشر سنته ونفي التهمة عنها، واستثارة علومها والتفقه في معانيها، والدعاء إليها والتلطف في تعليمها، وإعظامها وإجلالها والتأدب عند قراءتها، والإمساك عن الكلام فيها بغير علم، وإجلال أهلها لانتسابهم إليها، والتخلق بأخلاقه والتأدب بآدابه، ومحبة أهل بيته وأصحابه، ومجانبة من ابتدع في سنته أو تعرّض لأحد من أصحابه.\n  - **النصيحة لأئمة المسلمين**: معاونتهم على الحق، وطاعتهم فيه، وأمرهم به وتنبيههم وتذكيرهم برفق ولطف، وإعلامهم بما غفلوا عنه، وتبليغهم حقوق المسلمين، **وترك الخروج عليهم بالسيف**، وتأليف قلوب الناس لطاعتهم، والصلاة خلفهم، والجهاد معهم، وأن يدعو لهم بالصلاح.\n  - **النصيحة لعامة المسلمين** — وهم من عدا ولاة الأمر —: إرشادهم لمصالحهم في آخرتهم ودنياهم، وإعانتهم عليها، وستر عوراتهم وسد خلاتهم، ودفع المضار عنهم، وجلب المنافع لهم، وأمرهم بالمعروف ونهيهم عن المنكر برفق وإخلاص، والشفقة عليهم، وتوقير كبيرهم ورحمة صغيرهم، وتخوّلهم بالموعظة الحسنة، وترك غشهم وحسدهم، وأن يحب لهم ما يحب لنفسه من الخير ويكره لهم ما يكره لنفسه من المكروه، والذبّ عن أموالهم وأعراضهم.\n- **النصيحة فرض كفاية، إذا قام بها من يكفي سقط عن غيره، وهي لازمة على قدر الطاقة**.\n- **النصيحة في اللغة: الإخلاص**، يقال: نصحت العسل إذا صفيته، وقيل غير ذلك.\n\n## الحديث الثامن: أُمرت أن أقاتل الناس\n\n- **الراوي**: ابن عمر رضي الله عنهما. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لاَ إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّداً رَسُولُ اللهِ، وَيُقِيمُوا الصَّلاَةَ، وَيُؤْتُوا الزَّكَاةَ؛ فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّى دِمَاءَهُمْ وَأَمْوَالَهُمْ إِلَّا بِحَقِّ الإِسْلاَمِ وَحِسَابُهُمْ عَلَى اللهِ تَعَالَى».\n- حديث عظيم وقاعدة من قواعد الدين. وقد رواه **أنس** أيضاً بلفظ: (حتى يشهدوا أن لا إله إلا الله وأن محمداً عبده ورسوله، وأن يستقبلوا قبلتنا، وأن يأكلوا ذبيحتنا، وأن يصلوا صلاتنا...). وجاء في صحيح مسلم من رواية **أبي هريرة**: (حتى يشهدوا أن لا إله إلا الله ويؤمنوا بما جئت به) وذلك موافق لرواية عمر في المعنى.\n- **سبب ورود معانيه (قال العلماء بالسير)**: لما توفي رسول الله صلى الله عليه وسلم واستُخلف أبو بكر الصديق وكفر من كفر من العرب، عزم أبو بكر على قتالهم، وكان منهم من منع الزكاة ولم يكفر وتأوّل في ذلك، فقال له عمر: كيف تقاتل الناس وقد قالوا لا إله إلا الله، وقد قال رسول الله (أمرت أن أقاتل الناس حتى يقولوا لا إله إلا الله)؟ فقال الصديق: **إن الزكاة حق المال**، وقال: «والله لو منعوني **عناقاً**» — وفي رواية «**عقالاً**» — «كانوا يؤدّونه إلى رسول الله صلى الله عليه وسلم لقاتلتهم على منعه»، فتابعه عمر على قتال القوم.\n- قال الخطابي وغيره: **المراد بهذا أهل الأوثان ومشركو العرب ومن لا يؤمن، دون أهل الكتاب ومن يقرّ بالتوحيد**؛ فلا يكتفي في عصمته بقوله لا إله إلا الله إذ كان يقولها في كفره وهي من اعتقاده.\n- قال النووي: ولا بد مع هذا من الإيمان بجميع ما جاء به رسول الله صلى الله عليه وسلم، كما جاء في رواية أبي هريرة.\n- معنى (وحسابهم على الله): أي فيما يسترونه ويخفونه دون ما يخلون به في الظاهر من الأحكام الواجبة، ذكره الخطابي.\n- **وفيه أن من أظهر الإسلام وأسرّ الكفر يُقبل إسلامه في الظاهر**، وهذا قول أكثر أهل العلم. وذهب مالك إلى أن **توبة الزنديق لا تُقبل**، وهي رواية عن الإمام أحمد.\n- وفي قوله (حتى يشهدوا أن لا إله إلا الله ويؤمنوا بي وبما جئت به) دلالة ظاهرة لمذهب المحققين والجماهير من السلف والخلف: أن **الإنسان إذا اعتقد دين الإسلام اعتقاداً جازماً لا تردّد فيه كفاه ذلك، ولا يجب عليه تعلم أدلة المتكلمين ومعرفة الله بها**، خلافاً لمن أوجب ذلك وجعله شرطاً في نحو أهل القبلة — وهذا خطأ ظاهر.\n\n## الحديث التاسع: ما نهيتكم عنه فاجتنبوه\n\n- **الراوي**: أبو هريرة عبد الرحمن بن صخر رضي الله عنه. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلاَفُهُمْ عَلَى أَنْبِيَائِهِمْ».\n- لفظ الحديث في كتاب مسلم عن أبي هريرة: خطبنا رسول الله صلى الله عليه وسلم فقال: «يا أيها الناس، قد فرض الله عليكم الحج فحجوا»، فقال رجل: أكل عام يا رسول الله؟ فسكت حتى قالها ثلاثاً، ثم قال: «**لو قلت نعم لوجبت ولما استطعتم**»...\n- **الرجل الذي سأله هو الأقرع بن حابس**، كذا جاء مبيناً في غير هذه الرواية.\n- **مسألة أصولية**: اختلف الأصوليون في الأمر: هل يقتضي التكرار؟ **فاختار أكثر الفقهاء والمتكلمين أنه لا يقتضي التكرار**. وقال آخرون: لا يُحكم بانقضائه ولا منعه، بل يتوقف فيما زاد على مرة على البيان. وهذا الحديث قد يُستدل به لمن يقول بالتوقف، فإنه سأل: أكل عام؟ ولو كان مطلقه يقتضي التكرار أو عدمه لم يقل له النبي (لو قلت نعم لوجبت ولما استطعتم) بل ولم يكن حاجة إلى السؤال. **وأجمعت الأمة على أن الحج لا يجب في العمر إلا مرة واحدة بأصل الشرع**، وقوله (ذروني ما تركتكم) ظاهر في أن الأمر لا يقتضي التكرار.\n- ويدل هذا اللفظ أيضاً على أن **الأصل عدم الوجوب وأنه لا حكم قبل ورود الشرع**، وهو الصحيح عند كثير من الأصوليين.\n- وقوله (لو قلت نعم لوجبت) دليل للمذهب الصحيح في أن **النبي صلى الله عليه وسلم كان له أن يجتهد في الأحكام وأنه لا يشترط في حكمه أن يكون بوحي**.\n- قوله (وما أمرتكم به فأتوا منه ما استطعتم) **من قواعد الإسلام المهمة ومما أوتيه صلى الله عليه وسلم من جوامع الكلم**، ويدخل فيه ما لا يحصى من الأحكام: كالصلاة إذا عجز عن بعض أركانها أو بعض شروطها أتى بالباقي، وإذا عجز عن غسل بعض أعضاء الوضوء غسل الممكن، وكذلك الفطرة إذا وجبت جماعة ممن يلزمه نفقتهم، وكذلك في إزالة المنكرات إذا لم يمكنه إزالة جميعها فعل الممكن. وهذا الحديث كقوله تعالى (فاتقوا الله ما استطعتم).\n- وأما قوله تعالى (يا أيها الذين آمنوا اتقوا الله حق تقاته) فقيل: **منسوخة** بقوله (فاتقوا الله ما استطعتم). قال بعضهم: **والصحيح أنها ليست منسوخة بل هي مفسرة ومبينة لها**، والمراد منها: حق تقاته وهو امتثال أمره واجتناب نواهيه، والله لم يأمر إلا بالمستطاع.\n- قوله (ما نهيتكم عنه فاجتنبوه) على إطلاقه، لكن إن وُجد عذر يبيحه كأكل الميتة عند الضرورة فلا يكون منهياً عنه في هذه الحال. **والأصل: أن مطلق الأمر هل يُحمل على الفور أو على التراخي، وعلى المرة الواحدة أو التكرار؟ ففي هذا الحديث أبواب من الفقه**.\n- قوله (فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم) أراد: **لا تكثروا السؤال فربما يكثر الجواب عليه**، فيضاهي ذلك قصة بني إسرائيل لما قيل لهم (اذبحوا بقرة) فإنهم لو اقتصروا على ما يصدق عليه اللفظ وبادروا إلى ذبح أي بقرة كانت أجزأت عنهم، لكن لما أكثروا السؤال وشددوا شُدّد عليهم وذُمّوا على ذلك.\n\n## الحديث العاشر: إن الله طيب لا يقبل إلا طيباً\n\n- **الراوي**: أبو هريرة رضي الله عنه. **التخريج**: رواه مسلم.\n- **المتن**: «إِنَّ اللهَ تَعَالَى طَيِّبٌ لاَ يَقْبَلُ إِلَّا طَيِّباً، وَإِنَّ اللهَ أَمَرَ المُؤْمِنِينَ بِمَا أَمَرَ بِهِ المُرْسَلِينَ فَقَالَ تَعَالَى (يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحاً) وَقَالَ تَعَالَى (يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ) ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إِلَى السَّمَاءِ: يَا رَبِّ يَا رَبِّ، وَمَطْعَمُهُ حَرَامٌ وَمَشْرَبُهُ حَرَامٌ وَمَلْبَسُهُ حَرَامٌ وَغُذِىَ بِالحَرَامِ فَأَنَّى يُسْتَجَابُ لَهُ».\n- قيل: **(الطيب) في صفات الله بمعنى المنزّه عن النقائص**.\n- هذا الحديث أحد الأحاديث التي عليها قواعد الإسلام ومباني الأحكام. **وفيه**: الحث على الإنفاق من الحلال، والنهي عن الإنفاق من غيره، وأن المأكول والمشروب والملبوس ونحوها ينبغي أن يكون حلالاً خالصاً لا شبهة فيه، وأن **من أراد الدعاء كان أولى بالاعتناء بذلك من غيره**، وأن العبد إذا أنفق نفقة طيبة فهي التي تزكو وتنمو، وأن الطعام اللذيذ غير المباح يكون وبالاً على آكله ولا يقبل الله عمله.\n- معنى (ثم ذكر الرجل يطيل السفر أشعث أغبر): يطيل السفر في وجوه الطاعات لحج وجهاد وغير ذلك من وجوه البر، ومع هذا فلا يُستجاب له لكون مطعمه ومشربه وملبسه حراماً، **فكيف بمن هو منهمك في الدنيا أو في مظالم العباد أو من الغافلين عن أنواع العبادات؟!**\n- (يمد يديه): أي يرفعهما مع مخالفته لله ومعصيته.\n- «وغُذي بالحرام» بضم الغين المعجمة وتخفيف الذال المكسورة. و«فأنى يستجاب له» وفي رواية «فأنى يستجاب لذلك»: يعني من أين يستجاب لمن هذه صفته، فإنه ليس أهلاً للإجابة، لكن **يجوز أن يستجيب الله تعالى له تفضلاً ولطفاً وكرماً**.\n\n## الحديث الحادي عشر: دع ما يريبك\n\n- **الراوي**: أبو محمد الحسن بن علي بن أبي طالب، **سبط رسول الله صلى الله عليه وسلم وريحانته** رضي الله عنهما.\n- **المتن**: «دَعْ مَا يَرِيبُكَ إِلَى مَا لاَ يَرِيبُكَ».\n- **التخريج**: **رواه الترمذي والنسائي، وقال الترمذي: حديث حسن صحيح**.\n- «يريبك» يروى **بفتح الياء وضمها، والفتح أفصح وأشهر**، ويجوز الضم؛ يقال: رابني الشيء وأرابني. ومعناه: **اترك ما شككت فيه واعدل إلى ما لا تشك فيه**.\n- هذا راجع إلى معنى الحديث السادس (إن الحلال بيّن وإن الحرام بيّن وبينهما أمور مشتبهات).\n- وقد جاء في حديث آخر أن النبي صلى الله عليه وسلم قال: «لا يبلغ العبد أن يكون من المتقين حتى يترك ما لا بأس به مخافة ما به بأس» — **وهذه درجة أعلى من ذلك**.\n\n## الحديث الثاني عشر: من حسن إسلام المرء\n\n- **الراوي**: أبو هريرة رضي الله عنه.\n- **المتن**: «مِنْ حُسْنِ إِسْلاَمِ المَرْءِ تَرْكُهُ مَا لاَ يَعْنِيهِ».\n- **التخريج**: **حديث حسن، رواه الترمذي وغيره هكذا**. وقد رواه قرة بن عبد الرحمن عن الزهري عن أبي سلمة عن أبي هريرة، وصحّح الترمذي طرقه.\n- هذا من **الكلام الجامع للمعاني الكثيرة الجليلة في الألفاظ القليلة**. ونحو ذلك قول أبي ذر في بعض حديثه: «ومن حسب كلامه من عمله قلّ كلامه فيما لا يعنيه».\n- ذكر مالك أنه بلغه أنه قيل للقمان: ما بلغ بك ما نرى — يريدون الفضل —؟ فقال: **صدق الحديث، وأداء الأمانة، وترك ما لا يعنيني**.\n- وروى عن الحسن قال: **من علامة إعراض الله تعالى عن العبد أن يجعل شغله فيما لا يعنيه**.\n- قال أبو داود: **أصول السنن في كل فنّ أربعة أحاديث**، وذكر منها هذا الحديث.\n\n## الحديث الثالث عشر: لا يؤمن أحدكم حتى يحب لأخيه\n\n- **الراوي**: أبو حمزة أنس بن مالك رضي الله عنه، **خادم رسول الله صلى الله عليه وسلم**. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».\n- هكذا جاء في صحيح البخاري (لأخيه) من غير شك، وجاء في صحيح مسلم (حتى يحب لأخيه — أو لجاره) على الشك.\n- قال العلماء: معنى (لا يؤمن) أي **لا يؤمن الإيمان التام، وإلا فأصل الإيمان يحصل لمن لم يكن بهذه الصفة**.\n- والمراد: **يحب لأخيه من الطاعات والأشياء المباحات**، ويدل عليه ما جاء في رواية النسائي: (حتى يحب لأخيه من الخير ما يحب لنفسه).\n- قال الشيخ أبو عمرو بن الصلاح: **وهذا قد يُعدّ من الصعب الممتنع، وليس كذلك؛ إذ معناه: لا يكمل إيمان أحدكم حتى يحب لأخيه في الإسلام ما يحب لنفسه**، والقيام بذلك يحصل بأن يحب له حصول مثل ذلك من جهة لا يزاحمه فيها بحيث لا ينقص عليه شيء من النعمة. وذلك سهل قريب على القلب السليم، وإنما يعسر على القلب الدَّغِل.\n- قال أبو الزناد: ظاهر هذا الحديث **التساوي، وحقيقته التفضيل**؛ لأن الإنسان يحب أن يكون أفضل الناس، فإذا أحب لأخيه مثله فقد دخل هو في جملة المفضولين. ألا ترى أن الإنسان يحب أن يتصف من حقه ومظلمته؟ فإن أكمل إيمانه وكان لأخيه عنده مظلمة أو حق بادر إلى إنصافه من نفسه وإن كان عليه فيه مشقة.\n- ويُحكى أن **الفضيل بن عياض** قال لسفيان بن عيينة: إن كنت تريد أن يكون الناس مثلك فما أدّيت لله الكريم النصيحة، فكيف وأنت تودّ أنهم دونك؟\n- قال بعض العلماء: في هذا الحديث من الفقه أن **المؤمن مع المؤمن كالنفس الواحدة**، كما جاء في الحديث الآخر (المؤمنون كالجسد الواحد إذا اشتكى منه عضواً تداعى له سائر الجسد بالحمى والسهر).\n\n## الحديث الرابع عشر: لا يحل دم امرئ مسلم\n\n- **الراوي**: ابن مسعود رضي الله عنه. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «لاَ يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلَّا بِإِحْدَى ثَلاَثٍ: الثَّيِّبُ الزَّانِى، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ المُفَارِقُ لِلْجَمَاعَةِ».\n- وفي بعض الروايات المتفق عليها: (لا يحل دم امرئ مسلم يشهد أن لا إله إلا الله وأني رسول الله إلا بإحدى ثلاث) — فقوله (يشهد أن لا إله إلا الله وأني رسول الله) **كالتفسير لقوله (مسلم)**، وكذا قوله (المفارق للجماعة) **كالتفسير لقوله (التارك لدينه)**. وهؤلاء الثلاثة مباحو الدم بالنص، والمراد بالجماعة: المسلمون، وإنما فراقهم بالردّة عن الدين، وهي سبب لإباحة دمه.\n- قوله (التارك لدينه المفارق للجماعة) **عامّ في كل مرتدّ عن الإسلام بأي ردّة كانت، فيجب قتله إن لم يرجع إلى الإسلام**. قال العلماء: **ويتناول أيضاً كل خارج عن الجماعة ببدعة أو بغي أو غيرهما**.\n- والظاهر أن هذا العام يخص منه الصائل ونحوه، فيباح قتله في دفع أذاه. وقد يُجاب عن هذا بأنه داخل في المفارق للجماعة، ويكون المراد: **لا يحل تعمد قتله قصداً إلا في هؤلاء الثلاثة**.\n- **استدل بعضهم على أن تارك الصلاة يُقتل** لأن تركها يسمى من هذه الثلاثة. وفي هذه المسألة خلاف بين العلماء: منهم من **يكفّر** تارك الصلاة، ومنهم من **لا يكفّره**، واستدل بعض من يكفّره بحديث (أمرت أن أقاتل الناس حتى يشهدوا... ويقيموا الصلاة ويؤتوا الزكاة)، ووجه الدليل: أنه وقف العصمة على مجموع الشهادتين وإقام الصلاة وإيتاء الزكاة. ويُعترض: بأن الأمر يقتضي **المقاتلة** لا القتل، والمقاتلة مفاعلة تقتضي الحصول من الجانبين، ولا يلزم من وجوب المقاتلة على الصلاة وجوب القتل عليها إذا تركها من غير أن يقاتلنا.\n- «الثيب الزاني» هو **المحصن**، ويدخل فيه الذكر والأنثى، وهو حجة على ما اتفق عليه المسلمون من أن **حكم الزاني المحصن الرجم** بشروطه المذكورة في أبواب الفقه.\n- «النفس بالنفس» موافق لقوله تعالى (وكتبنا عليهم فيها أن النفس بالنفس)، **ويعني به النفوس المتكافئة في الإسلام والحرية**، بدليل قوله صلى الله عليه وسلم (لا يقتل مسلم بكافر)، وكذلك **الحرية شرط في المكافأة عند مالك والشافعي وأحمد**. وذهب أصحاب الرأي إلى أن **المسلم يُقتل بالذمي، وأن الحرّ يُقتل بالعبد**، وقد يستدلون بهذا الحديث، **والجمهور على خلاف ذلك**.\n\n## الحديث الخامس عشر: فليقل خيراً أو ليصمت\n\n- **الراوي**: أبو هريرة رضي الله عنه. **التخريج**: رواه البخاري ومسلم.\n- **المتن**: «مَنْ كَانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيَقُلْ خَيْراً أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ».\n- (من كان يؤمن بالله واليوم الآخر): يعني **من كان يؤمن الإيمان الكامل المنجي من عذاب الله الموصل إلى رضوان الله**.\n- (فليقل خيراً أو ليصمت) لأن من آمن بالله حق إيمانه خاف وعيده ورجا ثوابه واجتهد في فعل مأمور به وترك ما نهي عنه، **وأهم ما عليه من ذلك: ضبط جوارحه التي هي رعاياه وهو مسئول عنها**، كما قال تعالى (إن السمع والبصر والفؤاد كل أولئك كان عنه مسئولاً) و(ما يلفظ من قول إلا لديه رقيب عتيد)، **وآفات اللسان كثيرة**.\n- قال النبي صلى الله عليه وسلم: «هل يكب الناس في النار على مناخرهم إلا حصائد ألسنتهم».\n- وقال: «كل كلام ابن آدم عليه لا له إلا ذكر الله تعالى وأمر بمعروف ونهي عن منكر».\n- قال بعض العلماء: **جماع آداب الخير يتفرع من أربعة أحاديث**، ذكر منها هذا الحديث.\n- قال أهل اللغة: صمت يصمت — بضم الميم — صمتاً وصموتاً وصماتاً.\n- معنى الحديث: **إذا أراد الإنسان أن يتكلم، فإن كان ما يتكلم به خيراً محققاً يثاب عليه فليتكلم، وإلا فليمسك عن الكلام سواء ظهر أنه حرام أو مكروه أو مباح**. فعلى هذا يكون **الكلام المباح مأموراً بتركه مندوباً إلى الإمساك عنه** مخافة أن ينجرّ إلى المحرّم أو المكروه، وقد يقع ذلك كثيراً.\n- **اختلف العلماء**: هل يُكتب على الإنسان جميع ما يلفظ به وإن كان مباحاً، أو لا يُكتب عليه إلا ما فيه الجزاء من ثواب أو عقاب؟ **وإلى القول الثاني ذهب ابن عباس وغيره**، فعلى هذا تكون الآية الكريمة مخصوصة، أي: ما يلفظ من قول يترتب عليه جزاء.\n- (فليكرم جاره... فليكرم ضيفه): فيه **تعريف لحق الجار والضيف وبرّهما وحث على حفظ الجوارح**. وقد أوصى الله تعالى في كتابه بالإحسان إلى الجار. وقال صلى الله عليه وسلم: «ما زال جبريل عليه السلام يوصيني بالجار حتى ظننت أنه سيورثه». **والضيافة من الإسلام وخلق النبيين والصالحين، وقد أوجبها بعض العلماء، وأكثرهم على أنها من مكارم الأخلاق**.\n- قال صاحب الإفصاح: في هذا الحديث من الفقه أن يعتقد الإنسان أن **إكرام الضيف عبادة لا تنقصها** — فلا يضيف غنياً ولا يغيرها أن يقدّم إلى ضيفه اليسير مما عنده — فإكرامه: أن يسارع إلى البشاشة في وجهه ويطيب الحديث له، **وعماد أمر الضيافة إطعام الطعام** مما فتح الله من غير كلفة.\n- (فليقل خيراً أو ليصمت) يدل على أن **قول الخير خير من الصمت، والصمت خير من قول الشر**؛ وذلك أنه أمره بلام الأمر لقول الخير وبدأ به على الصمت. **ومن قول الخير**: الإبلاغ عن الله وعن رسوله وتعليم المسلمين، والأمر بالمعروف عن علم، وإنكار المنكر عن علم، والإصلاح بين الناس، وأن يقول للناس حسناً. **ومن أفضل الكلمات: كلمة حق عند من يُخاف ويُرجى**.\n\n## الحديث السادس عشر: لا تغضب\n\n- **الراوي**: أبو هريرة رضي الله عنه، أن **رجلاً** قال للنبي صلى الله عليه وسلم: أوصني. **التخريج**: **رواه البخاري**.\n- **المتن**: قال: «لاَ تَغْضَبْ» فردّد مراراً، قال: «لاَ تَغْضَبْ».\n- قال **صاحب الإفصاح**: من الجائز أن النبي صلى الله عليه وسلم **علم من هذا الرجل كثرة الغضب فخصّه بهذه الوصية**.\n- وقد مدح النبي صلى الله عليه وسلم من يملك نفسه عند الغضب فقال: «**ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب**».\n- ومدح الله تعالى الكاظمين الغيظ والعافين عن الناس. وروي عنه صلى الله عليه وسلم: «**من كظم غيظه وهو يستطيع أن ينفذه دعاه الله عز وجل على رؤوس الخلائق يوم القيامة حتى يخيّره من الحور ما شاء**».\n- وجاء في الحديث: «**إن الغضب من الشيطان**»؛ ولهذا يخرج به الإنسان من اعتدال حاله، ويتكلم بالباطل، ويرتكب المذموم، وينوي الحقد والبغضاء وغير ذلك من القبائح المحرّمة.\n- وجاء في حديث **سليمان بن صرد**: «إن الاستعاذة بالله من الشيطان الرجيم تذهب الغضب»؛ وذلك أن **الشيطان هو الذي يزين الغضب**، وكل من حرص على ما لا تحمد عاقبته فإن الشيطان يغويه ويبعده من رضى الله عز وجل، **فالاستعاذة بالله منه من أقوى السلاح على دفع كيده**.\n\n## الحديث السابع عشر: إن الله كتب الإحسان على كل شيء\n\n- **الراوي**: أبو يعلى شداد بن أوس رضي الله عنه. **التخريج**: رواه مسلم.\n- **المتن**: «إِنَّ اللهَ كَتَبَ الإِحْسَانَ عَلَى كُلِّ شَىْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا القِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَةَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ وَلْيُرِحْ ذَبِيحَتَهُ».\n- «القِتلة» بكسر القاف، و«الذِبحة» بكسر الذال، **وهي الهيئة والحالة**، ويضم. وقد جاء في بعض روايات هذا الحديث (فأحسنوا الذبح) بغير هاء وهو بالفتح: **مصدر**، وبالهاء والكسر: **الهيئة والحالة**.\n- «وليحدّ أحدكم شفرته» بضم الياء من أحدّ؛ يقال: أحدّ السكين وحدّها واستحدّها.\n- قوله (فأحسنوا القِتلة) **عامّ في القتل من الذبائح، والقتل قصاصاً أو وفاء حدّ ونحو ذلك**.\n- هذا الحديث **من الأحاديث الجامعة لقواعد كثيرة**.\n- **معنى إحسان القتل**: أن يجتهد في ذلك ولا يقصد التعذيب. **وإحسان الذبح في البهائم**: أن يرفق بالبهيمة ولا يصرعها بغتة ولا يجرها من موضع إلى موضع، وأن يوجهها إلى القبلة ويسمي ويحمد، ويقطع الحلقوم والودجين، ويتركها إلى أن تبرد.\n- وفي ذلك **الاعتراف لله تعالى بالمنة والشكر على نعمه**، فإنه سبحانه سخّر لنا ما لو شاء لسلّطه علينا، وأباح لنا ما لو شاء لحرّمه علينا.\n\n## الحديث الثامن عشر: اتق الله حيثما كنت\n\n- **الراوي**: أبو ذر جندب بن جنادة، وأبو عبد الرحمن معاذ بن جبل رضي الله عنهما.\n- **المتن**: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ».\n- **التخريج**: **رواه الترمذي وقال: حديث حسن، وفي بعض النسخ: حسن صحيح**.\n- **مناقب أبي ذر كثيرة**؛ أسلم ورسول الله صلى الله عليه وسلم بمكة وأمره أن يلحق بقومه، فلما رأى حرصه على المقام معه بمكة وعلم أنه لا يقدر على ذلك قال له: «اتق الله حيثما كنت وأتبع السيئة الحسنة تمحها».\n- وهذا موافق لقوله تعالى: (إن الحسنات يذهبن السيئات).\n- (وخالق الناس بخلق حسن) معناه: **عامل الناس بما تحب أن يعاملوك به**.\n- واعلم أن **أثقل ما يوضع في الميزان الخلق الحسن**. وقال رسول الله صلى الله عليه وسلم: «**إن أحبكم إليّ وأقربكم مني مجلساً يوم القيامة أحاسنكم أخلاقاً**».\n- **وحسن الخلق من صفات النبيين والمرسلين وخيار المؤمنين: لا يجزون بالسيئة السيئة، بل يعفون ويصفحون ويحسنون مع الإساءة إليهم**.\n\n## الحديث التاسع عشر: احفظ الله يحفظك\n\n- **الراوي**: أبو العباس عبد الله بن عباس رضي الله عنهما، قال: كنت خلف النبي صلى الله عليه وسلم يوماً فقال: «يَا غُلاَمُ إِنِّى أُعَلِّمُكَ كَلِمَاتٍ...».\n- **المتن**: «احْفَظِ اللهَ يَحْفَظْكَ، احْفَظِ اللهَ تَجِدْهُ تُجَاهَكَ، إِذَا سَأَلْتَ فَاسْأَلِ اللهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ، وَاعْلَمْ أَنَّ الأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَىْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللهُ لَكَ، وَإِنِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَىْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَىْءٍ قَدْ كَتَبَهُ اللهُ عَلَيْكَ، رُفِعَتِ الأَقْلاَمُ وَجَفَّتِ الصُّحُفُ».\n- **التخريج**: **رواه الترمذي وقال: حديث حسن صحيح**.\n- **وفي رواية غير الترمذي**: «احْفَظِ اللهَ تَجِدْهُ أَمَامَكَ، تَعَرَّفْ إِلَى اللهِ فِى الرَّخَاءِ يَعْرِفْكَ فِى الشِّدَّةِ، وَاعْلَمْ أَنَّ مَا أَخْطَأَكَ لَمْ يَكُنْ لِيُصِيبَكَ وَمَا أَصَابَكَ لَمْ يَكُنْ لِيُخْطِئَكَ، وَاعْلَمْ أَنَّ النَّصْرَ مَعَ الصَّبْرِ، وَأَنَّ الفَرَجَ مَعَ الكَرْبِ، وَأَنَّ مَعَ العُسْرِ يُسْراً».\n- مناقب ابن عباس أكثر من أن تحصر؛ **دعا له النبي صلى الله عليه وسلم فقال: «اللهم فقهه في الدين وعلمه التأويل»، ودعا له بأن يؤتى الحكمة مرتين، وثبت عنه أنه رأى جبريل مرتين، وهو بحر هذه الأمة وحبرها**.\n- (احفظ الله يحفظك) معناه: **كن مطيعاً لربك، مؤتمراً بأوامره، منتهياً عن نواهيه**.\n- (احفظ الله تجده تجاهك) أي **اعمل له بالطاعة ولا يراك في مخالفته، فإنك تجده تجاهك في الشدائد**، كما جرى **للثلاثة الذين أصابهم المطر فأووا إلى غار فانحدرت صخرة فانطبقت عليهم**، فقالوا: انظروا أعمالاً صالحة عملتم فاسألوا الله تعالى بها فإنه ينجيكم، فذكر كل واحد منهم سابقة سبقت له مع ربه، فانحدرت عنهم الصخرة فخرجوا يمشون، **وقصتهم مشهورة في الصحيح**.\n- (إذا سألت فاسأل الله وإذا استعنت فاستعن بالله) **أرشده إلى التوكل على مولاه، وألا يتخذ إلهاً سواه، وألا يتعلق بغيره في جميع أموره**.\n- (واعلم أن الأمة لو اجتمعوا...) **وهذا هو الإيمان بالقدر، والإيمان به واجب خيره وشره**.\n- (رفعت الأقلام وجفت الصحف) هذا **تأكيد لما تقدّم: أي لا يكون خلاف ما ذكرت لك بنسخ ولا تبديل**.\n- (واعلم أن النصر مع الصبر وأن الفرج مع الكرب وأن مع العسر يسراً) فنبّهه على أن **الإنسان في الدنيا — ولا سيما الصالحون — معرّضون للمصائب**، لقوله عز وجل (ولنبلونكم بشيء من الخوف والجوع...) وقوله (إنما يوفى الصابرون أجرهم بغير حساب).\n\n## الحديث العشرون: إذا لم تستح فاصنع ما شئت\n\n- **الراوي**: أبو مسعود عقبة بن عمرو الأنصاري البدري رضي الله عنه. **التخريج**: **رواه البخاري**.\n- **المتن**: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلاَمِ النُّبُوَّةِ الأُولَى: إِذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْتَ».\n- معنى (من كلام النبوة الأولى): أن **الحياء لم يزل ممدوحاً مستحسناً مأموراً به، لم ينسخ في شرائع الأنبياء الأولين**.\n- **وقوله (فاصنع ما شئت) فيه وجهان**:\n  1. أن يكون خرج بلفظ الأمر على معنى **الوعيد والتهديد**، ولم يرد به الأمر، كقوله (اعملوا ما شئتم) فإنه وعيد، لأنه قد بيّن لهم ما يأتونه وما يتركون. وكقوله صلى الله عليه وسلم: (من باع الخمر فليشقص الخنازير) لم يكن في هذا إباحة تشقيص الخنازير.\n  2. أن يكون معناه: **ائت كل ما لم يستحيَ منه إذا ظهر فاعله**.\n- ونحو هذا قوله صلى الله عليه وسلم: «**الحياء من الإيمان**» معناه: أنه **لما كان يمنع صاحبه من الفواحش ويحمل على البر والخير، كما يمنع الإيمان صاحبه من ذلك ويحمله على الطاعات، صار بمنزلة الإيمان لمساواته له في ذلك**.\n\n## الحديث الحادي والعشرون: قل آمنت بالله ثم استقم\n\n- **الراوي**: أبو عمرو — وقيل أبو عمرة — **سفيان بن عبد الله** رضي الله عنه، قال: قلت يا رسول الله قل لي في الإسلام قولاً لا أسأل عنه أحداً غيرك.\n- **المتن**: قال: «قُلْ آمَنْتُ بِاللهِ ثُمَّ اسْتَقِمْ». **التخريج**: **رواه مسلم**.\n- معنى (قل لي في الإسلام قولاً لا أسأل عنه أحداً غيرك): **علّمني قولاً جامعاً لمعاني الإسلام واضحاً في نفسه بحيث لا أحتاج إلى تفسير غيرك، أعمل عليه وأتقي به**.\n- (قل آمنت بالله ثم استقم) **هذا من جوامع الكلم التي أوتيها صلى الله عليه وسلم، فإنه جمع لهذا السائل في هاتين الكلمتين معاني الإسلام والإيمان كلها**؛ فإنه أمره أن يجدّد إيمانه بلسانه متذكراً بقلبه، وأمره أن يستقيم على أعمال الطاعات والانتهاء عن جميع المخالفات، **إذ لا تأتي الاستقامة مع شيء من الاعوجاج فإنها ضده**.\n- وهذا كقوله تعالى: (إن الذين قالوا ربنا الله ثم استقاموا) الآية: أي **آمنوا بالله وحده ثم استقاموا على الطاعة وعلى توفيهم إلى أن توفاهم الله عليها**.\n- قال **عمر بن الخطاب** رضي الله عنه: استقاموا والله على طاعته ولم يروغوا روغان الثعلب. ومعناه: **اعتدلوا على أكثر طاعة الله عقداً وقولاً وفعلاً، وداموا على ذلك**، وهذا معنى قول أكثر المفسرين، وهي معنى الحديث، وكذلك قوله سبحانه (فاستقم كما أمرت).\n- قال **ابن عباس**: ما نزل على رسول الله صلى الله عليه وسلم في جميع القرآن آية كانت أشق عليه من هذه الآية، **لذلك قال صلى الله عليه وسلم: (شيبتني هود وأخواتها)**.\n- قال الأستاذ **أبو القاسم القشيري**: **الاستقامة درجة بها كمال الأمور وتمامها، وبوجودها حصول الخيرات ونظامها؛ ومن لم يكن مستقيماً في حال سعيه ضاع سعيه وخاب جدّه**. وقيل: الاستقامة لا يطيقها إلا الأكابر، لأنها الخروج عن المعهودات ومفارقة الرسوم والعادات، والقيام بين يدي الله تعالى على حقيقة الصدق؛ **ولذلك قال صلى الله عليه وسلم: (استقيموا ولن تحصوا)**.\n- وقال **الواسطي**: الاستقامة خصلة بها كملت المحاسن وبفقدها قبحت المحاسن.\n\n## الحديث الثاني والعشرون: أرأيت إذا صليت المكتوبات\n\n- **الراوي**: أبو عبد الله جابر بن عبد الله الأنصاري رضي الله عنهما، أن **رجلاً** سأل رسول الله صلى الله عليه وسلم. **التخريج**: **رواه مسلم**.\n- **المتن**: «أَرَأَيْتَ إِذَا صَلَّيْتُ المَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الحَلاَلَ، وَحَرَّمْتُ الحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئاً، أَدْخُلُ الجَنَّةَ؟» قال: «نَعَمْ».\n- معنى «حرمت الحرام»: **اجتنبته**، ومعنى «أحللت الحلال»: **فعلته معتقداً حِلّه**.\n- **السائل هو النعمان بن قوقل** — بقافين مفتوحتين — رضي الله عنه.\n- قال الشيخ **أبو عمرو بن الصلاح**: الظاهر أنه أراد بقوله (وحرمت الحرام) أمرين: أحدهما: **أن يعتقد كونه حراماً**، والثاني: **أن لا يفعله بخلاف تحليل الحلال فإنه يكفي فيه مجرد اعتقاده حلالاً**.\n- قال **صاحب المفهم**: لم يذكر النبي صلى الله عليه وسلم للسائل في هذا الحديث شيئاً من التطوعات على الجملة، وهذا يدل على **جواز ترك التطوعات على الجملة، لكن من تركها ولم يفعل شيئاً فقد فوّت على نفسه ربحاً عظيماً وثواباً جسيماً**، ومن داوم على ترك شيء من السنن كان ذلك نقصاً في دينه وقدحاً في عدالته، فإن كان تركه تهاوناً ورغبة عنها كان ذلك فسقاً يستحق به ذماً.\n- قال علماؤنا: **لو أن أهل بلدة تواطئوا على ترك سنة لقوتلوا عليها حتى يرجعوا**.\n- ولقد كان **صدر الصحابة ومن بعدهم يثابرون على فعل السنن والفضائل مثابرتهم على الفرائض ولم يكونوا يفرقون بينهما في اغتنام ثوابها**، وإنما احتاج أئمة الفقهاء إلى ذكر الفرق لما يترتب عليه من وجوب الإعادة وترك العقاب على الترك ونفيه.\n- وإنما ترك النبي صلى الله عليه وسلم تنبيهه على السنن والفضائل **تسهيلاً وتيسيراً لقرب عهده بالإسلام لئلا يكون الإكثار من ذلك تنفيراً له**، أو **لئلا يعتقد أن السنن والتطوعات واجبة فتركه لذلك**.\n- وكذلك في الحديث الآخر: أن رجلاً سأل النبي صلى الله عليه وسلم عن الصلاة فأخبره أنها خمس، فقال: هل عليّ غيرها؟ قال: «لا، إلا أن تطوّع»، ثم سأله عن الصوم والحج والشرائع فأجابه ثم قال في آخر ذلك: والله لا أزيد على هذا ولا أنقص، فقال: «**أفلح إن صدق**» — وفي رواية: «إن تمسك بما أُمر به دخل الجنة».\n- **وهذا يسمى — بمحافظته على فرائضه وإقامها والإتيان بها في أوقاتها من غير إخلال بها — فلاحاً كثير الفلاح والنجاح. ومن أتى بالفرائض وأتبعها النوافل كان أكثر فلاحاً، وإنما شرعت النوافل لتتمم الفرائض**.\n\n## الحديث الثالث والعشرون: الطهور شطر الإيمان\n\n- **الراوي**: أبو مالك الحارث بن عاصم الأشعري رضي الله عنه. **التخريج**: **رواه مسلم**.\n- **المتن**: «الطُّهُورُ شَطْرُ الإِيمَانِ، وَالحَمْدُ للهِ تَمْلأُ المِيزَانَ، وَسُبْحَانَ اللهِ وَالحَمْدُ للهِ تَمْلآَنِ — أَوْ تَمْلأُ — مَا بَيْنَ السَّمَاءِ وَالأَرْضِ، وَالصَّلاَةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو: فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا».\n- هذا الحديث **أصل من أصول الإسلام، اشتمل على مهمات من قواعد الإسلام والدين**.\n- «الطهور» هنا المراد به **الفعل، وهو بضم الطاء على المختار**.\n- **اختلف في معناه**: فقيل: إن الأجر فيه ينتهي إلى **نصف أجر الإيمان**. وقيل: المراد بالإيمان هنا **الصلاة**، قال تعالى (وما كان الله ليضيع إيمانكم) **والطهارة شرط في صحة الصلاة فصارت كالشطر**. ولا يلزم في الشطر أن يكون نصفاً حقيقياً. وقيل غير ذلك.\n- «والحمد لله تملأ الميزان» فمعناه: **أنها لعظم أجرها تملأ ميزان الحامد**، وقد تظاهرت نصوص القرآن والسنة على وزن الأعمال وثقل الموازين وخفتها.\n- «تملآن — أو تملأ — ما بين السماء والأرض» وسبب عظم فضلها ما اشتملت عليه من التنزيه لله تعالى والافتقار إليه. وضبطها بعضهم بالتاء المثناة فوق، والأول ضمير مثنى والثاني ضمير هذه الجملة من الكلام. وقال بعضهم: يجوز (تملآن) بالتذكير والتأنيث.\n- «والصلاة نور» فمعناه: **أنها تمنع من المعاصي وتنهى عن الفحشاء والمنكر وتهدي إلى الصواب**، كما أن النور يُستضاء به. وقيل: **معناه أن يكون آخرها نوراً لصاحبها يوم القيامة**. وقيل: إنها تكون نوراً ظاهراً على وجهه يوم القيامة، ويكون في الدنيا أيضاً على وجهه البهاء بخلاف من لم يصلّ.\n- «والصدقة برهان» قال **صاحب التجريد**: معناه **أنه يفزع إليها كما يفزع للبراهين** إذا سئل العبد يوم القيامة عن مصرف ماله. وقال غيره: **معناه أن الصدقة حجة على إيمان فاعلها، لأن المنافق يمتنع منها لكونه لا يعتقدها؛ فمن تصدق استدل بصدقته على قوة إيمانه**.\n- «والصبر ضياء» فمعناه: **الصبر المحبوب في الشرع، وهو الصبر على طاعة الله والصبر عن معصيته، والصبر أيضاً على النائبات وأنواع المكاره في الدنيا**، والمراد أن الصبر محمود لا يزال صاحبه مستضيئاً به مهتدياً مستمراً على الصواب.\n- قال **إبراهيم الخوّاص**: **الصبر هو الثبات على الكتاب والسنة**. وقيل: **الصبر هو الوقوف مع البلاء بحسن الأدب**. وقال **أبو علي الدقاق**: الصبر: **أن لا يعترض على المقدور**، فأما إظهار البلاء على وجه الشكوى فلا ينافي الصبر — قال الله تعالى في حق أيوب عليه السلام (إنا وجدناه صابراً نعم العبد إنه أواب) مع أنه قال (أني مسني الضر وأنت أرحم الراحمين).\n- «والقرآن حجة لك أو عليك» معناه ظاهر: **أي تنتفع به إن تلوته وعملت به، وإلا فهو حجة عليك**.\n- «كل الناس يغدو فبائع نفسه فمعتقها أو موبقها» معناه: **أن كل إنسان يسعى لنفسه، فمنهم من يبيعها لله بطاعته له فيعتقها من العذاب، ومنهم من يبيعها للشيطان والهوى باتباعها فيوبقها أي يهلكها**.\n\n## الحديث الرابع والعشرون: يا عبادي إني حرمت الظلم على نفسي\n\n- **الراوي**: أبو ذر الغفاري رضي الله عنه، **عن النبي صلى الله عليه وسلم فيما يرويه عن ربه عز وجل** (حديث قدسي). **التخريج**: **رواه مسلم**.\n- **المتن**: «يَا عِبَادِى إِنِّى حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِى وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّماً فَلاَ تَظَالَمُوا... يَا عِبَادِى كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ فَاسْتَهْدُونِى أَهْدِكُمْ، يَا عِبَادِى كُلُّكُمْ جَائِعٌ إِلَّا مَنْ أَطْعَمْتُهُ فَاسْتَطْعِمُونِى أُطْعِمْكُمْ، يَا عِبَادِى كُلُّكُمْ عَارٍ إِلَّا مَنْ كَسَوْتُهُ فَاسْتَكْسُونِى أَكْسُكُمْ... يَا عِبَادِى إِنَّكُمْ لَنْ تَبْلُغُوا ضُرِّى فَتَضُرُّونِى وَلَنْ تَبْلُغُوا نَفْعِى فَتَنْفَعُونِى... وَلَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِى صَعِيدٍ وَاحِدٍ فَسَأَلُونِى فَأَعْطَيْتُ كُلَّ وَاحِدٍ مَسْأَلَتَهُ مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِى إِلَّا كَمَا يُنْقِصُ المِخْيَطُ إِذَا أُدْخِلَ البَحْرَ، يَا عِبَادِى إِنَّمَا هِىَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ ثُمَّ أُوَفِّيكُمْ إِيَّاهَا، فَمَنْ وَجَدَ خَيْراً فَلْيَحْمَدِ اللهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلاَ يَلُومَنَّ إِلَّا نَفْسَهُ».\n- قال بعض العلماء في (إني حرمت الظلم على نفسي): **معناه لا ينبغي لي ولا يجوز عليّ**، كما قال تعالى (وما ينبغي للرحمن أن يتخذ ولداً)، **فالظلم محال في حق الله تعالى**.\n- وقال بعضهم في هذا الحديث: **لا يسوغ لأحد أن يسأل الله تعالى أن يحكم له على خصمه إلا بالحق**، لقوله (إني حرمت الظلم على نفسي) فهو سبحانه لا يظلم عباده، فكيف يظن ظانّ أنه يظلم عباده لغيره؟\n- (فلا تظالموا) المعنى: **المظلوم يقتصّ له من الظالم**، وحُذفت إحدى التاءين تخفيفاً، وأصله: فلا تتظالموا.\n- (كلكم ضال إلا من هديته... وكلكم عار إلا من كسوته... وكلكم جائع إلا من أطعمته): **تنبيه على فقرنا وعجزنا عن جلب منافعنا ودفع مضارّنا إلا أن يعيننا الله سبحانه على ذلك، وهو يرجع إلى معنى (لا حول ولا قوة إلا بالله)**.\n- (فاستهدوني أهدكم): أي **اطلبوا مني الهداية أهدكم**؛ والجملة في ذلك أن يعلم العبد أنه طلب الهداية من مولاه فهداه، ولو هداه قبل أن يسأله لم يبعد أن يقول: إنما أوتيته على علم عندي.\n- (وكذلك كلكم جائع): يعني أنه خلق الخلق كلهم ذوي فقر إلى الطعام، فكل طاعم كان جائعاً حتى يطعمه الله بسوق الرزق إليه وتصحيح الآلات التي هيأها له، **فلا يظن ذو الثروة أن الرزق الذي في يده وقد رفعه إلى فيه أطعمه إياه أحد غير الله تعالى**. وفيه أيضاً **أدب للفقراء**، كأنه قال: لا تطلبوا الطعام من غيري.\n- (إنكم تخطئون بالليل والنهار وأنا أغفر الذنوب جميعاً): في هذا الكلام من التوبيخ ما يستحي منه كل مؤمن؛ وكذلك أن **الله خلق الليل ليُطاع فيه ويُعبد بالإخلاص حيث تسلم الأعمال فيه غالباً من الرياء والنفاق**. وذكر الذنوب بالألف واللام للتعريف وأكّدها بقوله (جميعاً)، وإنما قال ذلك قبل أمره إيانا بالاستغفار **لئلا يقنط أحد من رحمة الله لعظم ذنب ارتكبه**.\n- (لو أن أولكم وآخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئاً): فيه **ما يدل على أن تقوى المتقين رحمة لهم وأنها لا تزيد في ملكه شيئاً**.\n- (قاموا في صعيد واحد فسألوني...): فيه **تنبيه للخلق على أن يعظموا المسألة ويوسعوا الطلب ولا يقتصر سائل ولا يختصر طالب، فإن ما عند الله لا ينقص وخزائنه لا تنفد**. وقوله (إلا كما ينقص المخيط إذا أدخل البحر) **مثال قُصد به التقريب إلى الأفهام بما نشاهده**. **والمخيط — بكسر الميم وإسكان الخاء وفتح الياء — هو الإبرة**.\n- (إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها، فمن وجد خيراً فليحمد الله): يعني **لا يسند طاعته وعبادته من عمله لنفسه، بل يسندها إلى التوفيق ويحمد الله على ذلك**. (ومن وجد غير ذلك فلا يلومن إلا نفسه): **أكّد ذلك بالنون تحذيراً أن يخطر في قلب عامل أن اللوم تستحقه غير نفسه**.\n\n## الحديث الخامس والعشرون: ذهب أهل الدثور بالأجور\n\n- **الراوي**: أبو ذر رضي الله عنه. **التخريج**: **رواه مسلم**.\n- **المتن**: أن ناساً من أصحاب رسول الله صلى الله عليه وسلم قالوا: يا رسول الله ذهب أهل الدثور بالأجور، يصلون كما نصلي ويصومون كما نصوم ويتصدقون بفضول أموالهم. قال: «أَوَلَيْسَ قَدْ جَعَلَ اللهُ لَكُمْ مَا تَصَّدَّقُونَ: إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٍ بِمَعْرُوفٍ صَدَقَةٌ، وَنَهْىٍ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِى بُضْعِ أَحَدِكُمْ صَدَقَةٌ». قالوا: يا رسول الله أيأتي أحدنا شهوته ويكون له فيها أجر؟ قال: «أَرَأَيْتُمْ لَوْ وَضَعَهَا فِى حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إِذَا وَضَعَهَا فِى الحَلاَلِ كَانَ لَهُ أَجْرٌ».\n- «الدثور» — بضم الدال — **جمع دَثْر بفتحها، وهو المال الكثير**.\n- (أوليس قد جعل الله لكم ما تصّدقون): الرواية فيه **بتشديد الصاد والدال جميعاً، ويجوز في اللغة تخفيف الصاد**.\n- **وفي هذا الحديث**: فضيلة التسبيح وسائر الأذكار، والأمر بالمعروف والنهي عن المنكر، **وإحضار النية في المباحات، وإنما تصير طاعات بالنيات الصادقات**.\n- **وفيه دليل على جواز سؤال المستفتي عن بعض ما يخفي علمه من الدليل** إذا علم من حال المسئول أنه لا يكره ذلك ولم يكن فيه سوء أدب، **وذكر العالم الدليل على بعض ما يخفى على السائل**.\n- (وأمر بمعروف صدقة ونهي عن منكر صدقة) **إشارة إلى ثبوت حكم الصدقة في كل فرد من أفراد الأمر بالمعروف والنهي عن المنكر، آكد منه في التسبيح وما ذُكر بعده؛ لأن الأمر بالمعروف والنهي عن المنكر فرض كفاية وقد يتعين، بخلاف الأذكار التي تقع نوافل، وأجر الفرائض أكثر من أجر النفل**، كما دلّ عليه قوله عز وجل (وما تقرّب إليّ عبدي بشيء أحب إليّ مما افترضته عليه) رواه البخاري.\n- قال بعض العلماء: **يزيد ثواب الفرض على ثواب النفل سبعين درجة**، واستأنس له بحديث.\n- (وفي بضع أحدكم صدقة) هو **بضم الباء، ويطلق على الجماع وعلى الفرج نفسه، وكلاهما يصح إرادته هنا**.\n- وقد تقدّم أن **المباحات تصير طاعات بالنيات**، فالجماع يكون عبادة إذا نوى به الإنسان قضاء حق الزوجة ومعاشرتها بالمعروف، أو طلب ولد صالح، أو إعفاف نفسه أو زوجته، أو غير ذلك من المقاصد الصالحة.\n- قوله (أرأيتم لو وضعها في الحرام أكان عليه وزر؟) **فيه جواز القياس، وهو مذهب العلماء، ولم يخالف فيه إلا أهل الظاهر**. وأما المنقول عن التابعين ونحوهم من ذمّ القياس فليس المراد به القياس الذي يعهده الفقهاء المجتهدون، **وهذا القياس هو قياس العكس، واختلف الأصوليون في العمل به، والحديث دليل لمن عمل به**.\n\n## الحديث السادس والعشرون: كل سلامى من الناس عليه صدقة\n\n- **الراوي**: أبو هريرة رضي الله عنه. **التخريج**: **رواه البخاري ومسلم**.\n- **المتن**: «كُلُّ سُلاَمَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِى دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خَطْوَةٍ تَمْشِيهَا إِلَى الصَّلاَةِ صَدَقَةٌ، وَتُمِيطُ الأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ».\n- «سلامى» بضم السين المهملة وتخفيف اللام: **وهي المفاصل والأعضاء**، وقد **ثبت في صحيح مسلم أنها ثلاثمائة وستون**.\n- قال **القاضي عياض**: وأصله: **عظام الكف والأصابع والأرجل**، ثم استعمل في سائر عظام الجسد ومفاصله.\n- قال بعض العلماء: **المراد صدقة ترهيب وترغيب لا إيجاب وإلزام**.\n- (يعدل بين الاثنين صدقة) أي **يصلح بينهما بالعدل**.\n- وفي حديث آخر من رواية مسلم: «**يصبح على كل سلامى من أحدكم صدقة، فكل تسبيحة صدقة، وكل تحميدة صدقة، وكل تهليلة صدقة، وكل تكبيرة صدقة، وأمر بالمعروف صدقة، ونهي عن المنكر صدقة، ويجزئ من ذلك ركعتان يركعهما من الضحى**» أي **يكفي من هذه الصدقات عن هذه الأعضاء ركعتان، فإن الصلاة عمل لجميع أعضاء الجسد، فإذا صلى فقد قام كل عضو بوظيفته**.\n\n## الحديث السابع والعشرون: البر حسن الخلق\n\n- **الراوي الأول**: النواس بن سمعان رضي الله عنه. **التخريج**: **رواه مسلم**.\n- **المتن**: «البِرُّ حُسْنُ الخُلُقِ، وَالإِثْمُ مَا حَاكَ فِى نَفْسِكَ وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ».\n- **الراوي الثاني**: وابصة بن معبد رضي الله عنه قال: أتيت رسول الله صلى الله عليه وسلم فقال: «جِئْتَ تَسْأَلُ عَنِ البِرِّ؟» قلت: نعم، قال: «**اسْتَفْتِ قَلْبَكَ، البِرُّ مَا اطْمَأَنَّتْ إِلَيْهِ النَّفْسُ وَاطْمَأَنَّ إِلَيْهِ القَلْبُ، وَالإِثْمُ مَا حَاكَ فِى النَّفْسِ وَتَرَدَّدَ فِى الصَّدْرِ وَإِنْ أَفْتَاكَ النَّاسُ وَأَفْتَوْكَ**». **حديث حسن، رويناه في مسندي الإمامين أحمد بن حنبل والدارمي بإسناد حسن**.\n- (البر حسن الخلق) يعني: **أن حسن الخلق أعظم خصال البر**، كما قال (الحج عرفة). **أما البر فهو الذي يبرّ فاعله ويلحقه بالأبرار وهم المطيعون لله عز وجل**.\n- **المراد بحسن الخلق**: الإنصاف في المعاملة، والرفق في المحاولة، والعدل في الأحكام، والبذل في الإحسان، وغير ذلك من صفات المؤمنين الذين وصفهم الله تعالى في سورة الأنفال (إنما المؤمنون الذين إذا ذكر الله وجلت قلوبهم...) وقال (التائبون العابدون الحامدون) وقال (قد أفلح المؤمنون) إلى (أولئك هم الوارثون) و(وعباد الرحمن الذين يمشون على الأرض هوناً).\n- **فمن أشكل عليه حاله فليعرض نفسه على هذه الآيات: فوجود جميعها علامة حسن الخلق، وفقد جميعها علامة سوء الخلق، ووجود بعضها دون بعض يدل على البعض دون البعض**.\n- **ولا يظن ظانّ أن حسن الخلق عبارة عن لين الجانب وترك الفواحش والمعاصي فقط**، وأن من فعل ذلك فقد هذّب خلقه، بل **حسن الخلق ما ذكرناه من صفات المؤمنين والتخلق بأخلاقهم**.\n- **ومن حسن الخلق: احتمال الأذى**؛ فقد ورد في الصحيحين أن **أعرابياً جذب برد النبي صلى الله عليه وسلم حتى أثّرت حاشيته في عاتقه** وقال: يا محمد، مر لي من مال الله الذي عندك، **فالتفت إليه رسول الله صلى الله عليه وسلم ثم ضحك وأمر له بعطاء**.\n- (والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس) يعني: **هو الشيء الذي يورث نفرة في القلب**. وهذا أصل يُتمسك به لمعرفة الإثم من البرّ: أن **الإثم ما يحوك في الصدر ويكره صاحبه أن يطلع عليه الناس، والمراد بالناس أماثلهم ووجوههم لا غوغاؤهم**.\n\n## الحديث الثامن والعشرون: وصية العرباض بن سارية\n\n- **الراوي**: أبو نجيح العرباض بن سارية رضي الله عنه، قال: وعظنا رسول الله صلى الله عليه وسلم موعظة **وجِلَت منها القلوب وذرفت منها العيون**، فقلنا: يا رسول الله كأنها موعظة مودّع فأوصنا.\n- **المتن**: «أُوصِيكُمْ بِتَقْوَى اللهِ عَزَّ وَجَلَّ وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلاَفاً كَثِيراً، فَعَلَيْكُمْ بِسُنَّتِى وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ المَهْدِيِّينَ عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الأُمُورِ فَإِنَّ كُلَّ بِدْعَةٍ ضَلاَلَةٌ».\n- **التخريج**: **رواه أبو داود والترمذي، وقال: حديث حسن صحيح**.\n- وفي بعض طرق الحديث: إن هذه موعظة مودّع، فماذا تعهد إلينا؟ قال: «**لقد تركتكم على البيضاء، ليلها كنهارها لا يزيغ عنها إلا هالك**».\n- (موعظة بليغة) يعني: **بلغت إلينا وأثّرت في قلوبنا**. و(وجلت منها القلوب): **أي خافت**. و(ذرفت منها العيون): كأنه قام مقام تخويف ووعيد.\n- (أوصيكم بتقوى الله والسمع والطاعة) يعني **لولاة الأمور**. (وإن تأمّر عليكم عبد)، وفي بعض الروايات (عبد حبشي).\n- قال بعض العلماء: **العبد لا يكون والياً، ولكن ضرب به المثل على التقدير وإن لم يكن**، كقوله صلى الله عليه وسلم (من بنى مسجداً كمفحص قطاة بنى الله له بيتاً في الجنة) ومفحص قطاة لا يكون مسجداً، ولكن الأمثال يؤتى فيها بمثل ذلك.\n- **ويحتمل أن النبي صلى الله عليه وسلم أخبر بفساد الأمر ووضعه في غير أهله، حتى توضع الولاية في العبيد، فإذا كانت فاسمعوا وأطيعوا تغليباً لأهون الضررين، وهو الصبر على ولاية من لا تجوز ولايته، لئلا يفضي إلى فتنة عظيمة**.\n- (وإنه من يعش منكم بعدي فسيرى اختلافاً كثيراً) **هذا من بعض معجزاته صلى الله عليه وسلم: أخبر أصحابه بما يكون بعده من الاختلاف وغلبة المنكر**، وقد كان عالماً به على التفصيل ولم يكن يبينه لكل أحد، إنما حذر منه على العموم. وقد بيّن ذلك لبعض الآحاد **كحذيفة وأبي هريرة**، وهو دليل على عظم محلهما ومنزلتهما.\n- (فعليكم بسنتي) **السنة: الطريقة القويمة التي تجري على السنن، وهو السبيل الواضح**. (وسنة الخلفاء الراشدين المهديين) يعني **الذين شملهم الهدى، وهم الأربعة بالإجماع: أبو بكر وعمر وعثمان وعليّ رضي الله عنهم أجمعين**.\n- وأمر صلى الله عليه وسلم **بالثبات على سنة الخلفاء الراشدين لأمرين**: أحدهما: **التقليد لمن عجز عن النظر**، والثاني: **الترجيح لما ذهبوا إليه عند اختلاف الصحابة**.\n- (وإياكم ومحدثات الأمور): **اعلم أن المحدث على قسمين**: (1) **محدث ليس له أصل في الشريعة، فهذا باطل مذموم**. (2) **محدث يُحمل النظير على النظير، فهذا ليس بمذموم**؛ لأن لفظ «المحدث» ولفظ «البدعة» **لا يذمّان لمجرد الاسم، بل لمعنى المخالفة للسنة والداعي إلى الضلالة، ولا يُذم ذلك مطلقاً**. فقد قال الله تعالى (ما يأتيهم من ذكر من الرحمن محدث)، وقال **عمر رضي الله عنه: «نعمت البدعة هذه» يعني التراويح**.\n- «النواجذ»: **هي آخر الأضراس**.\n\n## الحديث التاسع والعشرون: أبواب الخير\n\n- **الراوي**: معاذ بن جبل رضي الله عنه، قال: قلت يا رسول الله أخبرني بعمل يدخلني الجنة ويباعدني عن النار.\n- **المتن**: «لَقَدْ سَأَلْتَ عَنْ عَظِيمٍ وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللهُ تَعَالَى عَلَيْهِ: تَعْبُدُ اللهَ لاَ تُشْرِكُ بِهِ شَيْئاً، وَتُقِيمُ الصَّلاَةَ، وَتُؤْتِى الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ البَيْتَ». ثم قال: «أَلاَ أَدُلُّكَ عَلَى أَبْوَابِ الخَيْرِ؟ **الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ المَاءُ النَّارَ، وَصَلاَةُ الرَّجُلِ فِى جَوْفِ اللَّيْلِ**» ثم تلا: (تتجافى جنوبهم عن المضاجع... يعملون). ثم قال: «أَلاَ أُخْبِرُكَ بِرَأْسِ الأَمْرِ وَعَمُودِهِ وَذِرْوَةِ سَنَامِهِ؟» قلت: بلى يا رسول الله، قال: «**رَأْسُ الأَمْرِ الإِسْلاَمُ، وَعَمُودُهُ الصَّلاَةُ، وَذِرْوَةُ سَنَامِهِ الجِهَادُ**». ثم قال: «أَلاَ أُخْبِرُكَ بِمِلاَكِ ذَلِكَ كُلِّهِ؟» قلت: بلى يا رسول الله، فأخذ بلسانه وقال: «**كُفَّ عَلَيْكَ هَذَا**». قلت: يا نبي الله وإنا لمؤاخذون بما نتكلم به؟ فقال: «**ثَكِلَتْكَ أُمُّكَ، وَهَلْ يَكُبُّ النَّاسَ فِى النَّارِ عَلَى وُجُوهِهِمْ — أَوْ قَالَ: عَلَى مَنَاخِرِهِمْ — إِلَّا حَصَائِدُ أَلْسِنَتِهِمْ**».\n- **التخريج**: **رواه الترمذي وقال: حديث حسن صحيح**.\n- (وإنه ليسير على من يسّره الله عليه) يعني **على من وفقه الله له**، ثم أرشده لعبادته مخلصاً له الدين.\n- (وتقيم الصلاة) **إقامتها: الإتيان بها على أكمل أحوالها**، ثم ذكر شرائع الإسلام من الزكاة والصوم والحج.\n- «الصوم جنة» **المراد بالصوم هنا: غير رمضان لأنه قد تقدّم، ومراده الإكثار من الصوم**. و«الجنة»: **المجنّ، أي الصوم سترة لك ووقاية من النار**.\n- «والصدقة تطفئ الخطيئة» **أراد بالصدقة هنا غير الزكاة** لأنها تقدّمت.\n- «وصلاة الرجل في جوف الليل» ثم تلا (تتجافى جنوبهم عن المضاجع...): معناه: **أن من قام في جوف الليل وترك نومه ولذته وآثر على ذلك ما يرجوه من ربه فجزاؤه ما في الآية**. وجاء في بعض الأخبار: أن الله تعالى **يباهي بقوّام الليل في الظلام** فيقول: «انظروا إلى عبادي وقد قاموا في ظلم الليل حيث لا يراهم أحد غيري، أشهدكم أني قد أبحتهم دار كرامتي».\n- (رأس الأمر الإسلام): **جعل الأمر كالفحل من الإبل، وجعل الإسلام رأس هذا الأمر، ولا يعيش الحيوان بغير رأس**.\n- (وعموده الصلاة): **عمود الشيء هو الذي يقيمه مما لا ثبات له في العادة بغير عمود**.\n- (وذروة سنامه الجهاد): **ذروة كل شيء أعلاه، وذروة سنام البعير: طرف سنامه؛ والجهاد لا يقاومه شيء من الأعمال**، كما روى أبو هريرة: جاء رجل إلى رسول الله صلى الله عليه وسلم فقال: دلّني على عمل يعدل الجهاد، قال: «لا أجده»، ثم قال: «هل تستطيع إذا خرج المجاهد أن تدخل مسجدك فتقوم ولا تفتر وتصوم ولا تفطر؟» فقال: ومن يستطيع ذلك؟\n- (ألا أخبرك بملاك ذلك كله؟) فأخذ بلسانه ثم قال: (كف عليك هذا): **حضّه أولاً على جهاد الكفر، ثم نقله إلى الجهاد الأكبر، وهو جهاد النفس وقمعها عن الكلام فيما يؤذيها ويردّيها**، فإنه جعل **أكثر دخول الناس النار بسبب ألسنتهم**.\n- (ثكلتك أمك يا معاذ) — كلمة تقولها العرب ولا تريد بها الدعاء.\n\n## الحديث الثلاثون: حدود الله وفرائضه\n\n- **الراوي**: أبو ثعلبة الخشني **جرثوم بن ناشر** رضي الله عنه.\n- **المتن**: «إِنَّ اللهَ تَعَالَى فَرَضَ فَرَائِضَ فَلاَ تُضَيِّعُوهَا، وَحَدَّ حُدُوداً فَلاَ تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلاَ تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلاَ تَبْحَثُوا عَنْهَا».\n- **التخريج**: **حديث حسن، رواه الدارقطني وغيره**.\n- (فرض) أي **أوجب وألزم**. (فلا تنتهكوها) أي **فلا تدخلوا فيها**.\n- **والنهي عن البحث عما سكت الله عنه موافق لقوله صلى الله عليه وسلم (ذروني ما تركتكم فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم)**.\n- قال بعض العلماء: **كانت بنو إسرائيل يسألون فيجابون ويعطون ما طلبوا حتى كان ذلك فتنة لهم، وأدّى ذلك إلى هلاكهم**. وكان الصحابة رضي الله عنهم قد فهموا ذلك **وكفّوا عن السؤال إلا فيما لا بدّ منه**، وكان يعجبهم أن يجيء الأعراب فيسألون رسول الله صلى الله عليه وسلم فيسمعون ويعون.\n- وقد بالغ قوم فقالوا: **لا يجوز السؤال في النوازل للعلماء حتى تقع**، وقد كان السلف يقولون في مثلها: دعوها حتى تنزل؛ **إلا أن العلماء لما خافوا ذهاب العلم أصّلوا وفرّعوا ومهّدوا وسطّروا**.\n- **واختلف العلماء في الأشياء قبل ورود الشرع بحكمها: أهي على الحظر، أو على الإباحة، أو على الوقف؟ على ثلاثة مذاهب، وذلك مذكور في كتب الأصول**.\n\n## الحديث الحادي والثلاثون: ازهد في الدنيا\n\n- **الراوي**: أبو العباس سهل بن سعد الساعدي رضي الله عنه، قال: جاء رجل إلى النبي صلى الله عليه وسلم فقال: يا رسول الله دلّني على عمل إذا عملته أحبني الله وأحبني الناس.\n- **المتن**: «ازْهَدْ فِى الدُّنْيَا يُحِبَّكَ اللهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ».\n- **التخريج**: **حديث حسن، رواه ابن ماجه وغيره بأسانيد حسنة**.\n- اعلم أن رسول الله صلى الله عليه وسلم قد **حثّ على التقلل من الدنيا والزهد فيها** وقال: «كن في الدنيا كأنك غريب أو عابر سبيل»، وقال: «**حب الدنيا رأس كل خطيئة**». وفي حديث آخر: «**إن الزاهد في الدنيا يريح قلبه في الدنيا والآخرة، والراغب في الدنيا يتعب قلبه في الدنيا والآخرة**».\n- **واعلم أن من في الدنيا ضيف وما في يده عارية، وأن الضيف مرتحل والعارية مردودة**. والدنيا عرض حاضر يأكل منها البرّ والفاجر، **وهي مبغضة لأولياء الله محبة لأهلها، فمن شاركهم في محبوبهم أبغضوه**.\n- وقد أرشد رسول الله صلى الله عليه وسلم السائل إلى تركها بالزهد فيها، **ووعده على ذلك حب الله تعالى وهو رضاه عنه**، فإن حب الله تعالى لعباده رضاه عنهم. **وأرشده إلى الزهد فيما في أيدي الناس إن أراد محبة الناس له، وترك حب الدنيا، فإنه ليس في أيدي الناس شيء يتباغضون عليه ويتنافسون فيه إلا الدنيا**.\n- وقال صلى الله عليه وسلم: «**من كانت الآخرة همه جمع الله شمله وجعل غناه في قلبه وأتته الدنيا وهي راغمة، ومن كانت الدنيا همه شتت الله شمله وجعل فقره بين عينيه ولم يأته من الدنيا إلا ما قدّر له**». **السعيد من اختار باقية يدوم نعيمها على بالية لا ينفد عذابها**.\n\n## الحديث الثاني والثلاثون: لا ضرر ولا ضرار\n\n- **الراوي**: أبو سعيد **سعد بن مالك بن سنان** الخدري رضي الله عنه.\n- **المتن**: «لاَ ضَرَرَ وَلاَ ضِرَارَ».\n- **التخريج**: **حديث حسن، رواه ابن ماجه والدارقطني وغيرهما مسنداً. ورواه مالك في الموطأ مرسلاً عن عمرو بن يحيى عن أبيه عن النبي صلى الله عليه وسلم فأسقط أبا سعيد، وله طرق يقوّي بعضها بعضاً**.\n- **الضرر والظلم حرام**، كما تقدّم في حديث أبي ذر (يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرماً فلا تظالموا)، وقال صلى الله عليه وسلم: «إن دماءكم وأموالكم وأعراضكم عليكم حرام».\n- **في معنى (لا ضرر ولا ضرار) أقوال**:\n  - قال بعضهم: **هما لفظان بمعنى واحد، تُكلّم بهما جميعاً على وجه التأكيد**.\n  - قال **ابن حبيب**: الضرر عند أهل العربية الاسم، والضرار الفعل؛ فمعنى (لا ضرر): **أي لا يدخل أحد على أحد ضرراً لم يدخله على نفسه**، ومعنى (لا ضرار): **لا يضارّ أحد بأحد**.\n  - قال **المحاسبي**: الضرر هو الذي لك فيه منفعة وعلى جارك فيه مضرة. **وهذا وجه حسن**.\n  - وقال بعضهم: **الضرر والضرار مثل القتل والقتال؛ فالضرر أن تضر من لا يضرك، والضرار أن تضر من أضرّ بك من غير جهة الاعتداء بالمثل والانتصار بالحق**. وهذا نحو قوله صلى الله عليه وسلم: «**أدّ الأمانة إلى من ائتمنك ولا تخن من خانك**». ومعنى هذا عند بعض العلماء: لا تخن من خانك بعد أن انتصرت منه في خيانته لك، كأن النهي إنما وقع على الابتداء، وأما من عاقب بمثل ما عوقب به وأخذ حقه فليس بخائن.\n- **واختلف الفقهاء فيمن يجحد حقاً عليه ثم يظفر المجحود بمال للجاحد قد ائتمنه عليه**: فقال بعضهم: **ليس له أن يأخذ حقه من ذلك** لظاهر قوله (أدّ الأمانة ولا تخن من خانك). وقال آخرون: **له أن ينتصر منه ويأخذ حقه من تحت يده**، واحتجوا بحديث عائشة في قصة **هند مع أبي سفيان**. والذي يصح في النظر: أنه **ليس لأحد أن يضرّ بأخيه، سواء ضرّه أم لا، إلا أن ينتصر ويعاقب إن قدر بما أبيح له بالحق، وليس ذلك ظلماً ولا ضراراً إذا كان على الوجه الذي أباحته السنة**.\n- قال الشيخ **أبو عمرو بن الصلاح**: أسند الدارقطني هذا الحديث من وجوه مجموعها يقوّي الحديث ويحسّنه، وقد نقله جماهير أهل العلم واحتجوا به. فعن **أبي داود** قال: **الفقه يدور على خمسة أحاديث، وعدّ هذا الحديث منها**. وقال الشيخ: فعدّ أبي داود هذا الحديث من الخمسة وقوله فيه: يشعر بكونه عنده غير ضعيف.\n- **وهو على ألسنة كثير من الفقهاء والمحدثين: (لا ضرر ولا إضرار) بهمزة مكسورة قبل الضاد، ولا صحة لذلك**.\n\n## الحديث الثالث والثلاثون: البينة على المدعي واليمين على من أنكر\n\n- **الراوي**: ابن عباس رضي الله عنهما.\n- **المتن**: «لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لاَدَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، لَكِنِ البَيِّنَةُ عَلَى المُدَّعِى وَاليَمِينُ عَلَى مَنْ أَنْكَرَ».\n- **التخريج**: **حديث حسن، رواه البيهقي وغيره هكذا، وبعضه في الصحيحين**.\n- الذي في الصحيحين من هذا الحديث: قال **ابن أبي مليكة**: كتب ابن عباس رضي الله عنهما: **أن النبي صلى الله عليه وسلم قضى باليمين على المدعى عليه**. وفي رواية: أن النبي صلى الله عليه وسلم قال: «لو يعطى الناس بدعواهم لادعى رجال دماء رجال وأموالهم، ولكن اليمين على المدعى عليه».\n- قال **صاحب الأربعين** (النووي): روى هذا الحديث البخاري ومسلم في صحيحيهما مرفوعاً من رواية ابن عباس، وهكذا رواه أصحاب كتب السنن وغيرهم. **وقال الأصيلي: لا يصح رفعه، إنما هو من قول ابن عباس**.\n- قال المصنف: **إذا صحّ رفعه بشهادة الإمامين فلا يضر من وقفه، ولا يكون ذلك تعارضاً ولا اضطراباً**.\n- **وهذا الحديث أصل من أصول الأحكام وأعظم مرجع عند التنازع والخصام، ويقتضي أن لا يُحكم لأحد بدعواه**.\n- (لادعى رجال دماء رجال وأموالهم) **استدل به بعض الناس على إبطال قول مالك في سماع قول القتيل «فلان قتلني» أو «دمي عند فلان»**؛ لأنه إذا لم يُسمع قول المريض: له عند فلان دينار أو درهم، فلأن لا يُسمع «دمي عند فلان» بطريق الأولى. **ولا حجة لهم على مالك في ذلك**؛ لأنه لم يسند القصاص أو الدية إلى قول المدعي، بل إلى **القسامة** على القتل، ولكنه يجعل قول القتيل (دمي عند فلان) **لوثاً** ينوي بتقوية بينة المدعين حتى يبرأوا بالأيمان، كسائر أنواع اللوث.\n- (ولكن اليمين على المدعى عليه) **أجمع العلماء على استحلاف المدعى عليه في الأموال، واختلفوا في غير ذلك**: فذهب بعضهم إلى **وجوبها على كل مدعى عليه في حق أو طلاق أو نكاح أو عتق**، أخذاً بظاهر عموم الحديث؛ فإن نكل حلف المدعي وثبتت دعواه. وقال **أبو حنيفة**: يُحلف على الطلاق والنكاح والعتق، وإن نكل لزمه ذلك كله. وقال: **ولا يُستحلف في الحدود**.\n\n## الحديث الرابع والثلاثون: من رأى منكم منكراً\n\n- **الراوي**: أبو سعيد الخدري رضي الله عنه. **التخريج**: **رواه مسلم**.\n- **المتن**: «مَنْ رَأَى مِنْكُمْ مُنْكَراً فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الإِيمَانِ».\n- **أورد مسلم هذا الحديث عن طارق بن شهاب**، قال: **أول من بدأ بالخطبة يوم العيد قبل الصلاة مروان**، فقام إليه رجل فقال: الصلاة قبل الخطبة، فقال: قد ترك ما هناك، فقال **أبو سعيد**: أما هذا فقد قضى ما عليه، سمعت رسول الله صلى الله عليه وسلم يقول: (من رأى منكم منكراً فليغيره...). **وفي هذا الحديث دليل على أنه لم يعمل بذلك أحد قبل مروان**.\n- **فإن قيل**: كيف تأخر أبو سعيد عن تغيير هذا المنكر حتى أنكره هذا الرجل؟ **قيل**: يحتمل أن أبا سعيد لم يكن حاضراً أول ما شرع مروان في تقديم الخطبة، وأن الرجل أنكره عليه ثم دخل أبو سعيد وهما في الكلام. ويحتمل أنه كان حاضراً لكنه خاف على نفسه إن غيّر حصول فتنة بسبب إنكاره فسقط عنه الإنكار. ويحتمل أن أبا سعيد همّ بالإنكار فبدره الرجل فعضده أبو سعيد.\n- وقد جاء في الحديث الآخر الذي اتفق عليه البخاري ومسلم وأخرجاه في **باب صلاة العيدين**: **أن أبا سعيد هو الذي جذب بيد مروان حين أراد أن يصعد المنبر**، وكانا جميعاً ردّا عليه مروان بمثل ما ذكر هنا على الرجل، فيحتمل أنهما قضيتان.\n- قوله (فليغيره) **أمر إيجاب بإجماع الأمة، وقد تطابق الكتاب و
