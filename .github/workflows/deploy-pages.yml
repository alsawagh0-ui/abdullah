name: Deploy Website + Web Preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web support
        run: flutter config --enable-web

      - name: Add web platform files
        working-directory: app
        run: flutter create . --platforms web

      - run: flutter pub get
        working-directory: app

      - name: Build Flutter web app
        working-directory: app
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/app/

      - name: Assemble Pages site (marketing site + web app under /app)
        run: |
          mkdir -p _site
          cp -r website/. _site/
          mkdir -p _site/app
          cp -r app/build/web/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
