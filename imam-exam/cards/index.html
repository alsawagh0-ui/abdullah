 أن يؤمّ في الجمعة.","mn":"«وقت نية حضر أربعين إمام»: وقتٌ، ونيةٌ، في الحضر، بأربعين، من إمامٍ صالح.","w":["خمسة: الوقت، والطهارة، وستر العورة، والقيام، وحضور الأربعين","خمسة: الوقت، والنية، والطهارة، والقيام، والجلوس بينهما","ستة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والموالاة، والجهر"]},{"id":"v6170","b":"الصلاة","q":"هل يصح أن يخطب رجل ويصلي بالناس الجمعة رجل آخر؟","a":"يصح، والسنة أن يتولى الخطبتين والصلاة واحد.","m":0,"ex":"من سنن الخطبتين أن يكون الخطيب هو نفسه إمام الصلاة، فإن خطب واحد وصلى غيره صحت الجمعة مع ترك السنة.","w":["لا يصح، ويلزم أن يكون الخطيب هو الإمام","يصح، وهو الأفضل","لا يصح إلا لعذر كمرض الخطيب"]},{"id":"v6194","b":"الصلاة","q":"ما سنن خطبتي الجمعة؟","a":"الطهارة، وستر العورة، وإزالة النجاسة، والدعاء للمسلمين، وأن يتولاهما مع الصلاة واحد، ورفع الصوت بهما حسب الطاقة، وأن يخطب قائماً، على مرتفع، معتمداً على سيف أو عصا، وأن يجلس بينهما قليلاً.","m":0,"ex":"هذه الأمور مستحبة في الخطبتين وليست شروطاً ولا أركاناً، فلو تركها صحت الخطبة. ويُسنّ كذلك قصرهما، وأن تكون الثانية أقصر، ولا بأس أن يخطب من صحيفة.","ca":"الطهارة، وستر العورة، وإزالة النجاسة، والدعاء للمسلمين، وتولّيهما مع الصلاة واحد، ورفع الصوت، والقيام على مرتفع معتمداً على عصا، والجلوس بينهما","mn":"«طهارة، ستر، نجاسة، دعاء، واحد، صوت، قيام، مرتفع، عصا، جلسة» — أربعة للبدن والثوب والدعاء، وستة لهيئة الخطيب.","w":["حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، وموالاتهما مع الصلاة، والجهر","الوقت، والنية، ووقوعهما حضراً، وحضور الأربعين، وأن يكون الخطيب ممن تصح إمامته","الطهارة وستر العورة شرطان، ويسن الخطبة جالساً وعدم الجلوس بينهما"]},{"id":"v6226","b":"الصلاة","q":"هل الطهارة وستر العورة شرط لصحة خطبتي الجمعة؟","a":"لا، بل هما من سنن الخطبتين، فتصح الخطبة بدونهما.","m":0,"ex":"الطهارة وستر العورة وإزالة النجاسة من سنن الخطبتين، فلو خطب محدثاً أو مكشوف العورة صحت خطبته. أما الصلاة فلا تصح إلا بالطهارة وستر العورة لأنهما من شروطها.","w":["نعم، هما شرطان لا تصح الخطبة إلا بهما","الطهارة شرط، وستر العورة سنة","ستر العورة شرط، والطهارة سنة"]},{"id":"v6316","b":"الصلاة","q":"ما حكم الكلام والإمام يخطب يوم الجمعة؟","a":"يحرم الكلام والإمام يخطب وهو منه بحيث يسمعه، ويباح إذا سكت بينهما أو شرع في دعاء.","m":0,"ex":"من كان قريباً يسمع الخطيب حرم عليه الكلام أثناء الخطبة. ويباح الكلام إذا سكت الخطيب بين الخطبتين، أو إذا شرع في الدعاء.","w":["يكره ولا يحرم","يحرم مطلقاً، حتى إذا سكت الخطيب بين الخطبتين","يحرم على من لا يسمع الخطيب فقط"]},{"id":"v6316b","b":"الصلاة","q":"ما حكم إقامة الجمعة في أكثر من موضع من البلد؟","a":"تحرم إقامة الجمعة والعيد في أكثر من موضع من البلد إلا لحاجة، كضيق وبُعد وخوف فتنة؛ فإن تعددت لغير ذلك فالسابقة بالإحرام هي الصحيحة.","m":0,"ex":"الأصل أن تُقام الجمعة في موضع واحد من البلد، وكذلك العيد. فإن احتاجوا إلى أكثر من موضع لضيق المكان أو بُعده أو خوف فتنة جاز. وإن تعددت بلا حاجة صحت التي سبقت بتكبيرة الإحرام فقط.","ca":"تحرم إلا لحاجة كضيق وبعد وخوف فتنة","w":["تجوز مطلقاً","تكره ولا تحرم ولو لغير حاجة","تحرم مطلقاً ولو لحاجة، وتبطل الجمعتان"]},{"id":"v6342","b":"الصلاة","q":"بماذا تُدرك صلاة الجمعة؟","a":"من أحرم بالجمعة في وقتها وأدرك مع الإمام ركعة أتمّ جمعة، وإن أدرك أقل من ركعة نوى ظهراً.","m":0,"ex":"إدراك الجمعة يكون بإدراك ركعة كاملة مع الإمام، فيضيف إليها ركعة. فإن فاتته الركعة الثانية بأن رفع الإمام من ركوعها قبل دخوله، دخل معه بنية الظهر وأتمها أربعاً.","ca":"بإدراك ركعة مع الإمام، فإن أدرك أقل نوى ظهراً","w":["بإدراك التشهد الأخير مع الإمام","بتكبيرة الإحرام قبل سلام الإمام","بإدراك الخطبة ولو فاتته الركعتان"]},{"id":"v6483","b":"الصلاة","q":"هل تصح صلاة العيد إذا صُلّيت كالنافلة (بلا تكبيرات زوائد ولا خطبة)؟","a":"نعم، إن صلى العيد كالنافلة صح؛ لأن التكبيرات الزوائد، والذكر بينها، والخطبتين: سنة.","m":0,"ex":"التكبيرات الزوائد في العيد والذكر بينها والخطبتان كلها سنن، فلو صلى العيد ركعتين كسائر النوافل دون شيء منها صحت صلاته.","w":["لا تصح، ويلزمه إعادتها بالتكبيرات","تصح إن ترك الخطبتين فقط، لا إن ترك التكبيرات الزوائد","تصح إن ترك التكبيرات سهواً، وتبطل إن تركها عمداً"]},{"id":"v6549","b":"الصلاة","q":"ما صفة صلاة الكسوف؟","a":"ركعتان: يقرأ في الأولى جهراً الفاتحة وسورة طويلة، ثم يركع طويلاً، ثم يرفع فيُسمّع ويحمد، ولا يسجد، بل يقرأ الفاتحة وسورة طويلة، ثم يركع، ثم يرفع، ثم يسجد سجدتين طويلتين، ثم يصلي الثانية كالأولى، ثم يتشهد ويسلّم. وإن أتى في كل ركعة بثلاث ركوعات أو أربع أو خمس فلا بأس.","m":0,"ex":"صلاة الكسوف ركعتان، في كل ركعة قيامان وقراءتان وركوعان ثم سجدتان، ويُطيل القراءة والركوع والسجود ويجهر بالقراءة. ويجوز أن يزيد الركوعات إلى ثلاثة أو أربعة أو خمسة في الركعة، ويصح أن يصليها كالنافلة.","ca":"ركعتان، في كل ركعة قراءتان طويلتان جهراً وركوعان، ثم سجدتان طويلتان","w":["ركعتان كصلاة الفجر، بركوع واحد في كل ركعة، مع قراءة سرية","ركعتان، في كل ركعة قيامان وركوعان، ويسجد بعد كل ركوع","أربع ركعات بتسليمتين، في كل ركعة ركوع واحد طويل"]},{"id":"s93","b":"الجنائز","q":"ما حكم غسل الميت وحمله والصلاة عليه ودفنه؟","a":"غسله وتكفينه والصلاة عليه وحمله ودفنه: فرض كفاية","m":0,"ex":"هذه خمسة حقوق للميت على المسلمين: غسله، وتكفينه، والصلاة عليه، وحمله، ودفنه. كلها فرض كفاية: إذا قام بها من يكفي سقط الإثم عن الباقين، وإن تركها الجميع أثموا.","w":["غسله وتكفينه: فرض كفاية، والصلاة عليه وحمله ودفنه: سنة","غسله وتكفينه والصلاة عليه وحمله ودفنه: فرض عين على أقاربه","الصلاة عليه ودفنه: فرض كفاية، وغسله وتكفينه وحمله: سنة مؤكدة"]},{"id":"s94","b":"الجنائز","q":"ما شروط ماء غسل الميت؟ وشروط الغاسل؟","a":"في الماء: الطهورية، والإباحة. وفي الغاسل: الإسلام، والعقل، والتمييز","m":0,"ex":"قسّمها قسمين: الماء له شرطان: أن يكون طهوراً، ومباحاً غير مغصوب. والغاسل له ثلاثة: مسلم، عاقل، مميز؛ لأن الغسل عبادة تحتاج إلى نية. المجموع خمسة: اثنان للماء وثلاثة للغاسل.","w":["في الماء: الطهورية، والحرارة. وفي الغاسل: الإسلام، والبلوغ، والذكورة","في الماء: الطهارة ولو مستعملاً. وفي الغاسل: الإسلام، والعقل، والبلوغ","في الماء: الطهورية، والإباحة. وفي الغاسل: الإسلام، والبلوغ، والقرابة"]},{"id":"s95","b":"الجنائز","q":"ما حكم شهيد المعركة والمقتول ظلماً؟","a":"لا يغسل، ولا يكفن، ولا يصلى عليه، ويجب بقاء دمه عليه، ودفنه في ثيابه","m":0,"ex":"الشهيد يبقى على الهيئة التي قُتل عليها: فلا يُغسل، ولا يُكفن، ولا يُصلى عليه، ويبقى دمه عليه، ويُدفن في ثيابه. احفظها: ثلاث «لا» ثم أمران واجبان. والمقتول ظلماً مثله في الحكم.","w":["يغسل، ويكفن، ولا يصلى عليه، ويدفن في غير ثيابه","لا يغسل، ولا يكفن، ويصلى عليه، ويجب بقاء دمه عليه","لا يغسل، ويكفن، ويصلى عليه، ويستحب إزالة دمه"]},{"id":"s96","b":"الجنائز","q":"ما حكم السقط؟","a":"سقط لأربعة أشهر: كالمولود حياً","m":0,"ex":"السقط هو الجنين الذي ينزل ميتاً قبل تمامه. إذا بلغ أربعة أشهر صار حكمه كحكم المولود حياً في الغسل والصلاة عليه. العلامة الفارقة: أربعة أشهر.","w":["سقط لستة أشهر: كالمولود حياً","سقط لأربعين يوماً: كالمولود حياً","سقط لأربعة أشهر: لا يغسل ولا يصلى عليه"]},{"id":"s97","b":"الجنائز","q":"اذكر أركان صلاة الجنازة؟","a":"سبعة: القيام في فرضها، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على محمد ﷺ، والدعاء للميت، والسلام، والترتيب (لكن لا يتعين كون الدعاء في الثالثة، بل يجوز بعد الرابعة)","m":0,"mn":"قِ تَ فَ صَ دَ سَ تَ: قيام، تكبيرات، فاتحة، صلاة على النبي، دعاء، سلام، ترتيب","ex":"رتّبها على التكبيرات: بعد الأولى الفاتحة، وبعد الثانية الصلاة على النبي ﷺ، وبعد الثالثة الدعاء للميت، ثم السلام. أضف القيام والتكبيرات والترتيب تصير سبعة. والدعاء يجوز أيضاً بعد الرابعة.","w":["سبعة: القيام، والتكبيرات الأربع، والفاتحة، والصلاة على النبي ﷺ، والدعاء للميت، والتشهد، والسلام","ستة: القيام، والتكبيرات الأربع، والفاتحة، والدعاء للميت، والسلام، والترتيب","سبعة: النية، والتكبيرات الأربع، والفاتحة، والسورة بعدها، والدعاء للميت، والسلام، والترتيب"],"ca":"سبعة: القيام، والتكبيرات الأربع، والفاتحة، والصلاة على النبي ﷺ، والدعاء للميت، والسلام، والترتيب"},{"id":"s100","b":"الجنائز","q":"ما السنة فيمن يتبع الجنازة (الماشي والراكب)؟","a":"الماشي: أمام الجنازة، والراكب: خلفها، والقرب منها أفضل","m":0,"ex":"الماشي يمشي أمام الجنازة، والراكب يكون خلفها. احفظ: ماشٍ أمام، راكب خلف.","w":["الماشي: خلف الجنازة، والراكب: أمامها، والقرب منها أفضل","الماشي والراكب: خلف الجنازة، والبعد عنها أفضل","الماشي: أمام الجنازة، والراكب: خلفها، والبعد عنها أفضل"]},{"id":"s101","b":"الجنائز","q":"ماذا يقول من يدخل الميت القبر؟","a":"بسم الله، وعلى ملة رسول الله","m":0,"ex":"يُدخَل الميت قبره باسم الله، وعلى الدين الذي جاء به رسول الله ﷺ. لا تخلط بينه وبين ما يقال عند تغميض الميت: «بسم الله وعلى وفاة رسول الله»؛ هنا عند القبر «ملة».","w":["بسم الله، وعلى وفاة رسول الله","بسم الله، وعلى سنة رسول الله","بسم الله، وإنا لله وإنا إليه راجعون"]},{"id":"s102","b":"الجنائز","q":"ما حكم النياحة على الميت؟","a":"تحرم (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويحرم الندب، وشق الثوب، ولطم الخد، والصراخ، ونتف الشعر ونشره وحلقه","m":0,"ex":"البكاء على الميت لا بأس به، والمحرّم هو الجزع: بالصوت (النياحة، والندب، والصراخ)، وبالثوب (شقّه)، وبالبدن (لطم الخد، ونتف الشعر ونشره وحلقه). النياحة: رفع الصوت بتعداد محاسن الميت برنّة، والندب: البكاء مع تعدادها.","w":["تكره (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويكره الندب، وشق الثوب، ولطم الخد، والصراخ، ونتف الشعر ونشره وحلقه","تحرم (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويكره الندب وشق الثوب، ويباح الصراخ ونتف الشعر ونشره","تباح إن كانت بلا صراخ (وهي تعداد محاسن الميت)، ويحرم شق الثوب، ولطم الخد، ونتف الشعر"]},{"id":"v6753","b":"الجنائز","q":"ما صفة غسل الميت؟ وما الذي يجب فيه؟","a":"يستر عورته وجوباً، ويجب غسل ما به من نجاسة، وحكم غسله فيما يجب ويسن كغسل الجنابة، لكن لا يُدخل الماء في فمه وأنفه، بل يأخذ خرقة مبلولة فيمسح بها أسنانه ومنخريه.","m":0,"ex":"إذا شُرع في غسل الميت وجب ستر عورته، ثم يُزال ما عليه من نجاسة. ويُغسَّل كما يغتسل الجنب، إلا أن الماء لا يُدخل فمه ولا أنفه، وإنما تُمسح أسنانه ومنخراه بخرقة مبلولة.","ca":"ستر العورة وجوباً، وغسل النجاسة، ثم كغسل الجنابة، لكن لا يُدخل الماء فمه وأنفه بل تُمسح أسنانه ومنخراه بخرقة مبلولة.","w":["يُغسَّل كغسل الجنابة تماماً، ويُدخل الماء في فمه وأنفه للمضمضة والاستنشاق.","يُكتفى بصب الماء على جسده مرة واحدة، ولا يجب ستر عورته عند الغسل.","يُوضَّأ فقط ولا يُغسل، ويُمسح رأسه بخرقة مبلولة."]},{"id":"v6833","b":"الجنائز","q":"ما الواجب في تكفين الميت؟ وكيف يُكفَّن المُحرِم والمُحرِمة؟","a":"الواجب ستر جميعه بثوب لا يصف البشرة، سوى رأس المُحرِم ووجه المُحرِمة فلا يُغطَّيان.","m":0,"ex":"أقل الكفن الواجب ثوب يستر جميع بدن الميت ولا يصف بشرته. ويُستثنى من مات مُحرِماً: فالرجل المحرم لا يُغطى رأسه، والمرأة المحرمة لا يُغطى وجهها.","w":["الواجب ستر جميعه، ولا يُستثنى المحرم ولا المحرمة.","الواجب ستر جميعه سوى وجه المُحرِم ورأس المُحرِمة.","الواجب ستر العورة فقط، ويُغطى رأس المحرم ووجه المحرمة."]},{"id":"v6849","b":"الجنائز","q":"ما السنة في تكفين الرجل والمرأة والصبي والصغيرة؟","a":"الرجل: في ثلاث لفائف بيض من قطن. والأنثى: في خمسة أثواب بيض من قطن: إزار، وخمار، وقميص، ولفافتين. والصبي: في ثوب، ويباح في ثلاثة. والصغيرة: في قميص ولفافتين.","m":0,"ex":"السنة أن يكون الكفن أبيض من قطن. فالرجل ثلاث لفائف يُلف بها، والمرأة خمسة أثواب لأنها أحوج إلى الستر، والصبي ثوب واحد ويجوز ثلاثة، والبنت الصغيرة قميص ولفافتان.","ca":"الرجل ثلاث لفائف، والأنثى خمسة أثواب (إزار، خمار، قميص، لفافتان)، والصبي ثوب ويباح ثلاثة، والصغيرة قميص ولفافتان.","mn":"3 للرجل، 5 للمرأة، 1 للصبي، 3 للصغيرة (قميص + لفافتان).","w":["الرجل: خمسة أثواب، والأنثى: ثلاث لفائف، والصبي: ثوبان، والصغيرة: قميص فقط.","الرجل: ثوب واحد، والأنثى: ثلاثة أثواب، والصبي: ثلاثة، والصغيرة: خمسة.","الرجل: لفافتان وقميص، والأنثى: سبعة أثواب، والصبي: لفافتان، والصغيرة: ثلاث لفائف."]},{"id":"v6874","b":"الجنائز","q":"ما شروط صلاة الجنازة؟","a":"ثمانية: النية، والتكليف، واستقبال القبلة، وستر العورة، واجتناب النجاسة، وحضور الميت إن كان بالبلد، وإسلام المصلي والمصلى عليه، وطهارتهما ولو بتراب لعذر.","m":0,"ex":"صلاة الجنازة يُشترط لها ما يُشترط لسائر الصلوات من نية وقبلة وستر وطهارة، ويُزاد عليها أن يكون الميت حاضراً إن كان في البلد، وأن يكون المصلي والميت مسلمَين، وأن يكونا طاهرين ولو بالتيمم عند العذر.","ca":"ثمانية: النية، التكليف، القبلة، ستر العورة، اجتناب النجاسة، حضور الميت بالبلد، إسلام المصلي والميت، طهارتهما.","mn":"أربعة كشروط كل صلاة (نية، قبلة، ستر، اجتناب نجاسة) + تكليف + حضور الميت + إسلامهما + طهارتهما.","w":["ستة: النية، والتكليف، واستقبال القبلة، وستر العورة، ودخول الوقت، والجماعة.","ثمانية: النية، والبلوغ، والذكورة، واستقبال القبلة، وستر العورة، ودخول الوقت، وحضور الميت، وإسلام المصلي.","سبعة: القيام، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على النبي ﷺ، والدعاء للميت، والسلام، والترتيب."]},{"id":"v6991","b":"الجنائز","q":"ما صفة صلاة الجنازة؟","a":"أن ينوي، ثم يكبر ويقرأ الفاتحة، ثم يكبر ويصلي على محمد ﷺ كما في التشهد، ثم يكبر ويدعو للميت بنحو: اللهم ارحمه، ثم يكبر ويقف قليلاً، ويسلم، وتجزئ تسليمة واحدة.","m":0,"ex":"صلاة الجنازة أربع تكبيرات بلا ركوع ولا سجود: بعد الأولى الفاتحة، وبعد الثانية الصلاة على النبي ﷺ بصيغة التشهد، وبعد الثالثة الدعاء للميت، وبعد الرابعة يقف قليلاً ثم يسلم، وتكفي تسليمة واحدة.","ca":"أربع تكبيرات: بعد الأولى الفاتحة، والثانية الصلاة على النبي ﷺ، والثالثة الدعاء للميت، والرابعة يقف قليلاً ثم يسلم.","mn":"ف - ص - د - س: فاتحة، صلاة على النبي، دعاء، سلام.","w":["ينوي، ثم يكبر ويدعو للميت، ثم يكبر ويقرأ الفاتحة، ثم يكبر ويصلي على النبي ﷺ، ثم يكبر ويسلم تسليمتين وجوباً.","ينوي، ثم يكبر ويقرأ الفاتحة وسورة، ثم يكبر ويركع، ثم يكبر ويدعو للميت، ثم يسلم.","ينوي، ثم يكبر ويقرأ الفاتحة، ثم يكبر ويدعو للميت، ثم يكبر ويصلي على النبي ﷺ، ثم يسلم بعد الثالثة."]},{"id":"v7098","b":"الجنائز","q":"ما حكم التعزية؟ وإلى متى؟ وماذا يقال للمصاب؟","a":"تسن تعزية المسلم إلى ثلاثة أيام، فيقال له: أعظم الله أجرك، وأحسن عزاءك، وغفر لميتك. ويقول هو: استجاب الله دعاءك، ورحمنا وإياك.","m":0,"ex":"التعزية مواساة أهل الميت، وهي سنة، ومدتها ثلاثة أيام من الموت. ويُدعى فيها للمصاب بعِظم الأجر وحسن الصبر وللميت بالمغفرة، ويرد المصاب بالدعاء لمن عزّاه.","ca":"سنة إلى ثلاثة أيام، ويقال: أعظم الله أجرك، وأحسن عزاءك، وغفر لميتك.","w":["تجب تعزية المسلم إلى سبعة أيام، ويقال: البقاء لله.","تسن إلى يوم واحد فقط، ويقال: أعظم الله أجرك.","تكره التعزية بعد الدفن، ويقال: رحمه الله وأسكنه فسيح جناته."]},{"id":"v7149","b":"الجنائز","q":"ما حكم زيارة القبور للرجال والنساء؟","a":"تسن زيارة القبور للرجال، وتكره للنساء، وإن اجتازت المرأة بقبر في طريقها فسلمت عليه ودعت له فحسن.","m":0,"ex":"يُستحب للرجال زيارة القبور للعظة والدعاء للأموات. وأما النساء فتكره لهن الزيارة المقصودة، لكن إن مرت المرأة بقبر في طريقها فسلّمت ودعت فذلك حسن.","ca":"تسن للرجال، وتكره للنساء.","w":["تسن للرجال والنساء على السواء.","تباح للرجال، وتحرم على النساء مطلقاً.","تكره للرجال، وتسن للنساء."]},{"id":"s103","b":"الزكاة","q":"ما هي شروط وجوب الزكاة؟","a":"خمسة: الإسلام، والحرية، وملك النصاب، والملك التام، وتمام الحول","m":0,"mn":"إسلام، حرية، نصاب، ملك تام، حول","ex":"خمسة: اثنان في الشخص (الإسلام، والحرية)، وثلاثة في المال (ملك النصاب، والملك التام، وتمام الحول). فلا تجب على كافر ولا رقيق، ولا في مال لم يبلغ النصاب أو لم يتم ملكه أو لم يمض عليه حول. وتجب في مال الصغير والمجنون.","w":["خمسة: الإسلام، والبلوغ، والعقل، وملك النصاب، وتمام الحول","أربعة: الإسلام، والحرية، وملك النصاب، وتمام الحول","خمسة: الإسلام، والحرية، والبلوغ، والملك التام، وتمام الحول"]},{"id":"s104","b":"الزكاة","q":"متى تجب الزكاة في السائمة من بهيمة الأنعام؟","a":"بثلاثة شروط: أن تتخذ للدر والنسل والتسمين لا للعمل، وأن تسوم (ترعى) المباح أكثر الحول، وأن تبلغ نصاباً","m":0,"ex":"السائمة هي التي ترعى بنفسها. تجب فيها بثلاثة شروط: الغرض (للحليب والنسل والتسمين، لا للعمل)، والرعي (ترعى المباح أكثر الحول، فالمعلوفة أكثره لا زكاة فيها)، والعدد (أن تبلغ النصاب).","w":["بثلاثة شروط: أن تتخذ للعمل لا للدر والنسل، وأن تسوم المباح أكثر الحول، وأن تبلغ نصاباً","بثلاثة شروط: أن تتخذ للدر والنسل والتسمين، وأن تعلف أكثر الحول، وأن تبلغ نصاباً","بشرطين: أن تسوم المباح الحول كله، وأن تبلغ نصاباً"]},{"id":"s105","b":"الزكاة","q":"ما هو نصاب الإبل، البقر، الغنم؟","a":"الإبل: خمس وفيها شاة، والبقر: ثلاثون وفيها تبيع (له سنة)، والغنم: أربعون وفيها شاة","m":0,"ex":"أقل نصاب لكل نوع: الإبل خمس وفيها شاة، والبقر ثلاثون وفيها تبيع له سنة، والغنم أربعون وفيها شاة. لاحظ: الإبل والغنم أول زكاتهما شاة، والبقر زكاتها من جنسها. تسلسل الأعداد: ٥ ثم ٣٠ ثم ٤٠.","w":["الإبل: خمس وفيها شاة، والبقر: أربعون وفيها مسنة، والغنم: ثلاثون وفيها شاة","الإبل: عشر وفيها شاتان، والبقر: ثلاثون وفيها تبيع، والغنم: عشرون وفيها شاة","الإبل: خمس وعشرون وفيها بنت مخاض، والبقر: ثلاثون وفيها مسنة، والغنم: أربعون وفيها شاة"]},{"id":"s106","b":"الزكاة","q":"كم نصاب العسل في المذهب ومقدار الزكاة فيه؟","a":"فيه العشر، ونصابه مائة وستون رطلاً عراقية","m":0,"ex":"العسل فيه العشر (١٠٪) مثل الزرع الذي يسقى بلا كلفة، لا ربع العشر كالذهب والفضة. ونصابه مائة وستون رطلاً عراقياً. احفظ: «العشر» للواجب، و«١٦٠» للنصاب.","w":["فيه ربع العشر، ونصابه مائة وستون رطلاً عراقية","فيه العشر، ونصابه خمسة أوسق","فيه نصف العشر، ونصابه ثلاثمائة رطل عراقية"]},{"id":"s107","b":"الزكاة","q":"ما نصاب الذهب والفضة؟","a":"الذهب: عشرون مثقالاً، والفضة: مائتا درهم، وفيهما ربع العشر","m":0,"ex":"الذهب عشرون مثقالاً، والفضة مائتا درهم: نفس الرقم ٢٠ مع زيادة صفر للفضة (٢٠٠). والواجب فيهما ربع العشر (٢٫٥٪) إذا بلغا النصاب.","w":["الذهب: عشرون مثقالاً، والفضة: مائتا درهم، وفيهما العشر","الذهب: مائتا مثقال، والفضة: عشرون درهماً، وفيهما ربع العشر","الذهب: أربعون مثقالاً، والفضة: مائتا درهم، وفيهما ربع العشر"]},{"id":"s108","b":"الزكاة","q":"متى تجب زكاة الحلي؟","a":"تجب في الحلي المحرم، وكذا في المباح المعد للكراء أو النفقة إذا بلغ نصاباً وزناً؛ ولا زكاة في حلي مباح معد لاستعمال أو إعارة","m":0,"ex":"القاعدة: الحلي المباح المعدّ للبس أو الإعارة لا زكاة فيه؛ لأنه للاستعمال كالثياب. وتجب في الحلي المحرّم، وفي المباح إذا أُعدّ للكراء أو للنفقة، بشرط أن يبلغ النصاب وزناً.","w":["تجب في كل حلي بلغ نصاباً، ولو كان مباحاً معداً لاستعمال أو إعارة","تجب في المباح المعد لاستعمال أو إعارة، لا في المعد للكراء أو النفقة","لا تجب في الحلي مطلقاً، ولو كان محرماً أو معداً للكراء"],"ca":"تجب في الحلي المحرم، وفي المباح المعد للكراء أو النفقة إذا بلغ نصاباً، لا في المعد لاستعمال أو إعارة"},{"id":"s109","b":"الزكاة","q":"متى تجب زكاة الفطر؟ وأفضل وقتها؟ ومتى تكره وتحرم؟","a":"تجب: بأول ليلة العيد (بغروب شمس آخر رمضان). الأفضل: يوم العيد قبل الصلاة. تكره: بعدها. يحرم تأخيرها عن يوم العيد مع القدرة، ويقضيها. وتجزئ قبل العيد بيومين","m":0,"ex":"رتّبها زمنياً: قبل العيد بيومين تجزئ، وبغروب شمس آخر يوم من رمضان تجب، والأفضل صباح العيد قبل الصلاة، وبعد الصلاة تكره، وتأخيرها عن يوم العيد يحرم ويقضيها. فمن مات قبل الغروب فلا فطرة عليه.","w":["تجب بطلوع فجر يوم العيد، الأفضل قبل الصلاة، تكره بعدها، ويحرم تأخيرها عن يوم العيد، وتجزئ قبله بيومين","تجب بغروب شمس آخر رمضان، الأفضل ليلة العيد، تكره يوم العيد، ويحرم تأخيرها عن الصلاة، وتجزئ قبله بأسبوع","تجب بغروب شمس آخر رمضان، الأفضل يوم العيد قبل الصلاة، وتباح بعدها إلى آخر أيام التشريق، وتجزئ من أول رمضان"],"ca":"تجب بغروب شمس آخر رمضان، الأفضل يوم العيد قبل الصلاة، تكره بعدها، ويحرم تأخيرها عن يوم العيد، وتجزئ قبله بيومين"},{"id":"s111","b":"الزكاة","q":"هل يصح إعطاء فطرة الجماعة لشخص واحد، وفطرة الواحد لجماعة؟","a":"يجوز أن يعطي الجماعة فطرتهم لواحد، وأن يعطي الواحد فطرته لجماعة","m":0,"ex":"زكاة الفطر مرنة في التوزيع: يجوز جمع فطرة عدة أشخاص وإعطاؤها لفقير واحد، ويجوز تفريق فطرة شخص واحد على عدة فقراء. الاتجاهان كلاهما جائز.","w":["يجوز أن يعطي الجماعة فطرتهم لواحد، ولا يجوز أن يعطي الواحد فطرته لجماعة","لا يجوز أن يعطي الجماعة فطرتهم لواحد، ويجوز أن يعطي الواحد فطرته لجماعة","لا يجوز أن تعطى فطرة الجماعة لواحد، ولا فطرة الواحد لجماعة"]},{"id":"s112","b":"الزكاة","q":"ما حكم إخراج القيمة النقدية بزكاة الفطر؟","a":"لا يجزئ إخراج القيمة في الزكاة مطلقاً","m":0,"ex":"الواجب في الفطرة صاع من الأصناف المذكورة: تمر، أو زبيب، أو بُر، أو شعير، أو أقط. ولا يجزئ إخراج القيمة بدلها، وهذا الحكم عام في الزكاة كلها «مطلقاً»، لا في الفطرة وحدها.","w":["يجزئ إخراج القيمة في زكاة الفطر للحاجة","يكره إخراج القيمة في الزكاة ويجزئ","لا يجزئ إخراج القيمة في الفطر خاصة، ويجزئ في زكاة المال"]},{"id":"s113","b":"الزكاة","q":"ما حكم تأخير الزكاة عن وقتها؟","a":"يجب إخراجها فوراً، وله تأخيرها: لزمن حاجة، ولقريب، وجار، ولتعذر إخراجها من النصاب","m":0,"ex":"الأصل أن الزكاة حق للفقراء فيجب إخراجها فوراً. ويجوز تأخيرها لمصلحة: لزمن حاجة، أو ليعطيها قريباً أو جاراً، أو لتعذّر إخراجها من النصاب نفسه.","w":["يجوز تأخيرها إلى آخر الحول الثاني مطلقاً، ولا يجب إخراجها فوراً","يجب إخراجها فوراً، ولا يجوز تأخيرها بحال ولو لقريب أو جار","يسن إخراجها فوراً، ويكره تأخيرها إلا لقريب"]},{"id":"s115","b":"الزكاة","q":"ما حكم نقل الزكاة مسافة قصر عن بلده؟","a":"يحرم نقلها إلى مسافة قصر، وتجزئ","m":0,"ex":"الأفضل تفريق زكاة المال في فقراء بلده. ونقلها إلى مسافة قصر فأكثر حرام، لكن لو نقلها أجزأت مع الإثم. احفظ: «يحرم ويجزئ»، مثل حج المرأة بلا محرم.","w":["يحرم نقلها إلى مسافة قصر، ولا تجزئ","يكره نقلها إلى مسافة قصر، وتجزئ","يسن نقلها إلى مسافة قصر، وتجزئ"]},{"id":"s116","b":"الزكاة","q":"ما حكم تعجيل الزكاة؟","a":"يصح تعجيلها لحولين فقط إذا كمل النصاب","m":0,"ex":"يجوز إخراج الزكاة قبل وقتها بشرطين: ألا يزيد التعجيل على حولين (سنتين)، وأن يكون النصاب قد كمل. فإن تلف النصاب أو نقص وقع ما أخرجه نفلاً.","w":["يصح تعجيلها لحول واحد فقط إذا كمل النصاب","يصح تعجيلها لثلاثة أحوال ولو لم يكمل النصاب","لا يصح تعجيلها قبل تمام الحول"]},{"id":"s117","b":"الزكاة","q":"اذكر من لا يجوز إخراج الزكاة لهم؟","a":"الكافر، والرقيق، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، وبنو هاشم","m":0,"mn":"كافر، رقيق، غني، منفَق عليه، زوج، هاشمي","ex":"ستة، يجمعها ثلاث أفكار: ليسوا من أهلها (الكافر، والرقيق). وغير محتاجين أو يعود نفعها إلى المزكي (الغني بمال أو كسب، ومن تلزمه نفقته، والزوج). ومُكرَّمون عنها (بنو هاشم).","w":["الكافر، والرقيق، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، والمكاتب","الكافر، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، وبنو هاشم، والغارم","الكافر، والرقيق، والغني بمال أو كسب، والقريب مطلقاً، والجار، وبنو هاشم"]},{"id":"v7171","b":"الزكاة","q":"في كم شيء تجب الزكاة؟ (ما الأموال الزكوية؟)","a":"في خمسة أشياء: سائمة بهيمة الأنعام، والخارج من الأرض، والعسل، والأثمان، وعروض التجارة.","m":0,"ex":"لا تجب الزكاة في كل مال، بل في خمسة أصناف: الإبل والبقر والغنم السائمة (التي ترعى أكثر الحول)، والحبوب والثمار، والعسل، والذهب والفضة، وما أُعد للتجارة.","mn":"سَ خَ عَ أَ عُ: سائمة، خارج من الأرض، عسل، أثمان، عروض.","w":["في أربعة أشياء: بهيمة الأنعام، والخارج من الأرض، والأثمان، وعروض التجارة.","في خمسة أشياء: بهيمة الأنعام ولو معلوفة، والخارج من الأرض، والعسل، والأثمان، والبيوت المسكونة.","في ستة أشياء: السائمة، والخارج من الأرض، والعسل، والأثمان، وعروض التجارة، والخيل."]},{"id":"v7398","b":"الزكاة","q":"لو كان له أربعون شاة في بلد وأربعون في بلد آخر بينهما مسافة قصر، فكم يزكي؟","a":"يزكي شاتين؛ لأن السائمة إذا كانت بمحلين بينهما مسافة قصر فلكلٍّ حكم نفسه، ولو كانت في محل واحد لزمته شاة واحدة.","m":0,"ex":"تفريق المال لا يؤثر في الزكاة إلا في السائمة. فإن كانت في موضعين بينهما مسافة قصر عومل كل موضع وحده، فكل أربعين فيها شاة. ولو اجتمعت الثمانون في مكان واحد ففيها شاة واحدة، لأن الأربعين إلى مائة وعشرين فيها شاة.","ca":"شاتين؛ لكل موضع حكمه لأن بينهما مسافة قصر.","w":["شاة واحدة؛ لأن المالك واحد فيُضم ماله بعضه إلى بعض.","لا شيء عليه؛ لأن كل موضع مستقل ولم يبلغ النصاب.","ثلاث شياه؛ لأن تفريق المال يغلّظ الزكاة."]},{"id":"v7469","b":"الزكاة","q":"فيم تجب زكاة الخارج من الأرض؟ وما شرطاها؟ ومتى وقت الوجوب؟","a":"تجب في كل مكيل مدخر من الحب كالقمح والشعير، ومن الثمر كالتمر والزبيب، بشرطين: الأول: أن يبلغ نصاباً، وقدره بعد تصفية الحب وجفاف الثمر خمسة أوسق، وهي ثلاثمائة صاع. الثاني: أن يكون مالكاً للنصاب وقت وجوبها؛ ووقت الوجوب في الحب إذا اشتد، وفي الثمر إذا بدا صلاحها.","m":0,"ex":"زكاة الزروع والثمار في كل ما يُكال ويُدّخر. ويُحسب النصاب بعد التصفية والتجفيف، وهو خمسة أوسق أي ثلاثمائة صاع. ولا بد أن يكون مالكاً له حين يشتد الحب أو يبدو صلاح الثمر.","ca":"في كل مكيل مدخر؛ بشرطين: بلوغ خمسة أوسق (300 صاع) بعد التصفية والجفاف، وملكه وقت الوجوب: اشتداد الحب وبدوّ صلاح الثمر.","w":["تجب في كل ما يخرج من الأرض من خضار وفواكه، بشرط بلوغ مائتي صاع وحولان الحول.","تجب في كل مكيل مدخر، بشرط بلوغ عشرة أوسق، ووقت الوجوب عند الحصاد.","تجب في الحب والثمر، بشرط بلوغ خمسة أوسق قبل التصفية والتجفيف، ووقت الوجوب عند البيع."]},{"id":"v7504","b":"الزكاة","q":"هل تجب الزكاة في تمر نخل البيت؟","a":"نعم، إذا بلغ ثمره نصاباً وهو خمسة أوسق (ثلاثمائة صاع) بعد جفافه.","m":0,"ex":"التمر مكيل مدخر فتجب فيه الزكاة، ولا فرق بين نخل المزرعة ونخل البيت. فإذا بلغ مجموع ثمر النخل نصاباً وجبت زكاته، فينبغي لصاحبه أن يحسبه.","w":["لا؛ لأن نخل البيت للأكل لا للتجارة.","لا زكاة فيه إلا إذا بيع ثمره.","نعم، تجب فيه الزكاة مهما كانت كميته ولو لم يبلغ نصاباً."]},{"id":"v7562","b":"الزكاة","q":"كم الواجب في زكاة الخارج من الأرض فيما يُسقى بلا كلفة وفيما يُسقى بكلفة؟","a":"فيما يُسقى بلا كلفة: العشر، وفيما يُسقى بكلفة: نصف العشر.","m":0,"ex":"يختلف مقدار زكاة الزروع والثمار بحسب مؤونة السقي: فما يشرب بالمطر أو العيون بلا تعب ففيه العشر، وما يُسقى بالآلات والنواضح ونحوها بكلفة ففيه نصف العشر.","w":["فيما يُسقى بلا كلفة: نصف العشر، وفيما يُسقى بكلفة: العشر.","فيهما جميعاً: ربع العشر.","فيما يُسقى بلا كلفة: الخمس، وفيما يُسقى بكلفة: العشر."]},{"id":"v7570","b":"الزكاة","q":"على أي صفة يجب إخراج زكاة الحب والثمر؟","a":"يجب إخراج زكاة الحب مصفّى، والثمر يابساً.","m":0,"ex":"لا يُخرج الحب بقشره وتبنه بل بعد تصفيته، ولا يُخرج الثمر رطباً بل بعد جفافه، فلو أخرج الرطب لم يجزئه ووقع نفلاً.","w":["يجوز إخراج الحب بقشره، والثمر رطباً.","يجب إخراج الحب مصفّى، والثمر رطباً.","يُخرج قيمة الحب والثمر نقداً."]},{"id":"v7708","b":"الزكاة","q":"هل يُضم الذهب إلى الفضة في تكميل النصاب؟","a":"نعم، يُضم الذهب والفضة في تكميل النصاب، ويُخرج من أيهما شاء.","m":0,"ex":"إذا لم يبلغ الذهب وحده نصاباً ولا الفضة وحدها، ضُم أحدهما إلى الآخر، فإن بلغا معاً نصاباً وجبت الزكاة، وله أن يخرجها من الذهب أو من الفضة.","w":["لا يُضم أحدهما إلى الآخر، بل يُعتبر كل واحد وحده.","يُضم الذهب إلى الفضة، ويجب الإخراج من الذهب خاصة.","يُضم إن كانا للتجارة فقط، ولا يُضم في غيرها."]},{"id":"v7803","b":"الزكاة","q":"ما عروض التجارة؟ وكيف تُزكى؟","a":"ما يُعد للبيع والشراء لأجل الربح، فتُقوَّم إذا حال الحول بالأحظ للمساكين من ذهب أو فضة، فإن بلغت القيمة نصاباً وجب ربع العشر.","m":0,"ex":"كل سلعة يُقصد بها البيع للربح، كبضائع المحلات، تُحسب قيمتها عند تمام الحول. ويُقوِّمها بالأنفع للفقراء من نصاب الذهب أو الفضة، وهو غالباً الفضة لأن نصابها أقل قيمة، فإذا بلغت نصاباً أخرج ربع عشر القيمة.","ca":"ما يُعد للبيع والشراء لأجل الربح؛ تُقوَّم عند الحول بالأحظ للمساكين من ذهب أو فضة، وفيها ربع العشر.","w":["ما يُعد للاستعمال الشخصي، ويُزكى بإخراج العشر من السلع نفسها.","ما يُعد للبيع لأجل الربح، ويُقوَّم بالذهب دائماً، ويجب فيه العشر.","ما يُعد للبيع لأجل الربح، ولا زكاة فيه حتى يُباع ويقبض ثمنه."]},{"id":"v7896","b":"الزكاة","q":"على من تجب زكاة الفطر؟ وعمّن يخرجها؟","a":"تجب على كل مسلم يجد ما يفضل عن قوته وقوت عياله يوم العيد وليلته، ويخرجها عن نفسه وعمّن يمونه من المسلمين.","m":0,"ex":"زكاة الفطر لا يشترط لها نصاب، بل تجب على المسلم إذا زاد عنده شيء عن طعامه وطعام عياله ليلة العيد ويومه. ويخرجها عن نفسه وعن كل مسلم ينفق عليه ممن يعيش معه ويأكل من طعامه.","ca":"على كل مسلم يفضل عنده عن قوته وقوت عياله يوم العيد وليلته؛ عن نفسه وعمّن يمونه من المسلمين.","w":["تجب على من ملك نصاب الزكاة فقط، ويخرجها عن نفسه دون عياله.","تجب على كل مسلم بالغ عن نفسه فقط، ولا يخرجها عن غيره.","تجب على الغني الذي حال عليه الحول، ويخرجها عن كل أقاربه ولو لم ينفق عليهم."]},{"id":"v7974","b":"الزكاة","q":"كم الواجب في زكاة الفطر؟ ومن أي الأصناف تُخرج؟","a":"صاع عن كل شخص، من تمر أو زبيب أو بر أو شعير أو أقط.","m":0,"ex":"مقدار زكاة الفطر صاع عن كل فرد، وتُخرج من الأصناف الخمسة المنصوصة: التمر، والزبيب، والبُر (القمح)، والشعير، والأقط (لبن مجفف). فإن عُدمت أخرج ما يقوم مقامها من حب يُقتات.","mn":"ت ز ب ش أ: تمر، زبيب، بُر، شعير، أقط.","w":["نصف صاع من بر أو صاع من غيره، من التمر والشعير فقط.","صاعان عن كل شخص، من تمر أو زبيب أو بر أو شعير أو أقط.","صاع عن كل شخص، أو قيمته نقداً."]},{"id":"v8083","b":"الزكاة","q":"ما حكم من جحد وجوب الزكاة؟ ومن منعها بخلاً أو تهاوناً؟","a":"من جحد وجوبها عالماً كفر ولو أخرجها، ومن منعها بخلاً أو تهاوناً أُخذت منه وعُزِّر.","m":0,"ex":"الزكاة ركن من أركان الإسلام، فمن أنكر وجوبها وهو يعلم كفر حتى لو دفعها. أما من أقر بوجوبها ومنعها بخلاً أو تكاسلاً فلا يكفر، لكن تُؤخذ منه قهراً ويُعاقب بالتعزير.","w":["من جحدها عالماً عُزِّر ولا يكفر، ومن منعها بخلاً كفر.","كلاهما يكفر، ولا تؤخذ منهما.","من جحدها عالماً كفر إن لم يخرجها، ومن منعها بخلاً تُترك له ويأثم فقط."]},{"id":"v8124","b":"الزكاة","q":"ما الذي يُشترط لإخراج الزكاة؟ ومتى ينوي؟","a":"يشترط لإخراجها نية من مكلف، وله تقديمها بيسير، والأفضل قرنها بالدفع، فينوي الزكاة أو الصدقة المفروضة، ولا يجزئ إن نوى صدقة مطلقة.","m":0,"ex":"الزكاة عبادة فلا بد لها من نية ممن يخرجها. والأفضل أن تكون النية عند دفعها، ويجوز أن تسبقه بزمن يسير. ويكفي أن ينوي أنها زكاة أو صدقة واجبة، أما نية صدقة عامة فلا تجزئ ولو تصدق بكل ماله.","ca":"نية من مكلف؛ ويجوز تقديمها بيسير، والأفضل قرنها بالدفع.","w":["لا تشترط لها نية، فتجزئ ولو دفعها بنية صدقة مطلقة.","تشترط النية، ويجب أن تكون قبل الدفع بيوم كامل.","تشترط نية الفرضية وتعيين المال المزكى عنه، ولا يجوز تقديمها على الدفع."]},{"id":"v8195","b":"الزكاة","q":"من هم أهل الزكاة؟","a":"ثمانية: الفقير، والمسكين، والعامل عليها، والمؤلَّف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل.","m":0,"ex":"هؤلاء الأصناف الثمانية المذكورون في آية التوبة. والفقير من لم يجد نصف كفايته، والمسكين من يجد نصفها أو أكثرها، والغارم المدين، وابن السبيل الغريب المنقطع في غير بلده.","mn":"فَ مَ عَ مُ مُ غَ غَ اِ: فقير، مسكين، عامل، مؤلَّف، مكاتب، غارم، غازٍ، ابن سبيل.","w":["سبعة: الفقير، والمسكين، والعامل عليها، والمؤلف، والغارم، والغازي في سبيل الله، وابن السبيل.","ثمانية: الفقير، والمسكين، والعامل عليها، والمؤلف، والمكاتب، والغارم، وبناء المساجد، وابن السبيل.","ثمانية: الفقير، والمسكين، والوالدان، والأولاد، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل."]},{"id":"v8229","b":"الزكاة","q":"إن دفع الزكاة لمن يظنه فقيراً فبان غنياً، فهل تجزئه؟","a":"نعم، تجزئه.","m":0,"ex":"الأصل أن من دفع الزكاة لغير مستحقها جاهلاً ثم علم لم تجزئه ويستردها بنمائها، كمن أعطاها كافراً. ويُستثنى من ظنه فقيراً فبان غنياً، فإنها تجزئه.","w":["لا تجزئه، ويجب عليه إخراجها مرة أخرى.","لا تجزئه، إلا إن ردها الغني إليه.","تجزئه إن كان الغني من أقاربه فقط."]},{"id":"v8281","b":"الزكاة","q":"ما حكم صدقة التطوع؟ ومتى وأين تكون أفضل؟","a":"تسن في كل وقت، لا سيما سراً، وفي الزمان والمكان الفاضل، وعلى الجار وذوي الرحم.","m":0,"ex":"صدقة التطوع مستحبة في جميع الأوقات، ويتأكد فضلها إذا كانت سراً، وفي الأزمنة الفاضلة كرمضان، والأماكن الفاضلة كمكة، وعلى الجيران والأقارب لأنها عليهم صدقة وصلة.","w":["تجب في رمضان، وتسن في غيره، والأفضل جهراً.","تسن في رمضان خاصة، والأفضل على البعيد دون القريب.","تباح في كل وقت، ولا فضل لزمان أو مكان فيها."]},{"id":"s118","b":"الصيام والاعتكاف","q":"بمن تثبت رؤية هلال رمضان؟","a":"بخبر مسلم، مكلف، عدل، ولو عبداً وأنثى","m":0,"ex":"هلال رمضان يكفي فيه خبر واحد، بشرط أن يكون مسلماً، مكلفاً، عدلاً؛ ولو كان عبداً أو امرأة. بخلاف بقية الشهور فلا يُقبل فيها إلا رجلان عدلان.","w":["بخبر رجلين مسلمين، مكلفين، عدلين، لا عبد فيهما ولا أنثى","بخبر مسلم، مكلف، عدل، بشرط أن يكون ذكراً حراً","بخبر مسلم مميز، ولو لم تعرف عدالته"]},{"id":"s119","b":"الصيام والاعتكاف","q":"ما هي شروط وجوب الصوم؟","a":"أربعة: الإسلام، والبلوغ، والعقل، والقدرة عليه","m":0,"ex":"أربعة: الإسلام، والبلوغ، والعقل، والقدرة. فلا يجب على كافر، ولا صغير، ولا مجنون، ولا عاجز. قارنها بشروط الصحة الستة: فيها التمييز بدل البلوغ، وتزيد النية وانقطاع الحيض والنفاس.","w":["أربعة: الإسلام، والتمييز، والعقل، والنية","خمسة: الإسلام، والبلوغ، والعقل، والحرية، والقدرة عليه","أربعة: الإسلام، والبلوغ، والعقل، والإقامة"]},{"id":"s120","b":"الصيام والاعتكاف","q":"ما هي شروط صحة الصوم؟","a":"ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والتمييز، والعقل، والنية من الليل لكل يوم واجب","m":0,"ex":"ستة تبيّن متى يصح الصوم: الإسلام، والعقل، والتمييز (فيصح من الصغير المميز)، وانقطاع دم الحيض، والنفاس، والنية من الليل لكل يوم واجب. الفرق عن شروط الوجوب: هنا التمييز لا البلوغ، ومعه النية والطهارة من الدم.","w":["ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والبلوغ، والعقل، والنية من الليل لكل يوم واجب","ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والتمييز، والعقل، والنية مرة واحدة للشهر كله","أربعة: الإسلام، والبلوغ، والعقل، والقدرة عليه"]},{"id":"s121","b":"الصيام والاعتكاف","q":"ما هو فرض الصوم الأوحد المذكور بالكتاب؟","a":"الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس","m":0,"ex":"للصوم فرض واحد هو الإمساك عن المفطرات. يبدأ من طلوع الفجر الثاني (الصادق المنتشر في الأفق)، لا الفجر الأول، وينتهي بغروب الشمس.","w":["الإمساك عن المفطرات من طلوع الفجر الأول إلى غروب الشمس","الإمساك عن المفطرات من طلوع الشمس إلى غروبها","الإمساك عن المفطرات من طلوع الفجر الثاني إلى صلاة العشاء"]},{"id":"s122","b":"الصيام والاعتكاف","q":"اذكر من سنن الصوم؟","a":"ستة: تعجيل الفطر، وتأخير السحور، والزيادة في أعمال الخير، وقوله جهراً إذا شتم: إني صائم، وقوله عند فطره: اللهم لك صمت وعلى رزقك أفطرت…، وفطره على رطب فإن عدم فتمر فإن عدم فماء","m":0,"mn":"تعجيل، تأخير، خير، «إني صائم»، دعاء الفطر، رطب","ex":"ستة، رتّبها على اليوم: في السحر تأخير السحور. وفي النهار الزيادة في أعمال الخير، وقول «إني صائم» جهراً إذا شُتم. وعند المغرب تعجيل الفطر، ودعاء الفطر، والفطر على رطب ثم تمر ثم ماء.","w":["ستة: تأخير الفطر، وتعجيل السحور، والزيادة في الخير، وقول: إني صائم إذا شتم، ودعاء الفطر، والفطر على رطب فتمر فماء","ستة: تعجيل الفطر، وتأخير السحور، والزيادة في الخير، والسكوت إذا شتم، ودعاء الفطر، والفطر على ماء فتمر فرطب","خمسة: تعجيل الفطر، وتأخير السحور، والاعتكاف، ودعاء الفطر، والفطر على تمر فماء"],"ca":"ستة: تعجيل الفطر، وتأخير السحور، والزيادة في الخير، وقول: إني صائم إذا شتم، ودعاء الفطر، والفطر على رطب فتمر فماء"},{"id":"s123","b":"الصيام والاعتكاف","q":"ما حكم فطر المسافر؟","a":"يسن لمسافر يباح له القصر","m":0,"ex":"الفطر للمسافر سنة بشرط أن يكون سفره مما يباح فيه قصر الصلاة. فالسفر الذي يجيز القصر يجعل الفطر أفضل. قارن: المريض الذي يخاف الضرر يسن له الفطر أيضاً، والحائض يجب عليها.","w":["يجب لمسافر يباح له القصر","يكره لمسافر يباح له القصر","يباح لكل مسافر ولو لم يبح له القصر"]},{"id":"s124","b":"الصيام والاعتكاف","q":"ما حكم إفطار الحامل أو المرضع إن خافت على نفسها أو ولدها؟","a":"يباح، لكن لو أفطرتا خوفاً على الولد فقط لزم وليه إطعام مسكين لكل يوم","m":0,"ex":"الحامل والمرضع إن خافتا على نفسيهما أو على الولد جاز لهما الفطر. ثم يُفرّق: إن كان الخوف على الولد وحده، لزم وليَّ الولد إطعام مسكين عن كل يوم؛ لأن الفطر كان لمصلحة الولد.","w":["يحرم، لكن لو أفطرتا خوفاً على أنفسهما لزمهما إطعام مسكين لكل يوم","يباح، ولا يلزم أحداً إطعام ولو أفطرتا خوفاً على الولد فقط","يجب، ويلزمهما إطعام مسكين لكل يوم مطلقاً"]},{"id":"s125","b":"الصيام والاعتكاف","q":"اذكر أمثلة من مفطرات الصوم؟","a":"اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، والحجامة حاجماً أو محجوماً، وإنزال المني بتكرار النظر، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ","m":0,"ex":"قسّمها مجموعات: أمور تطرأ على الصائم (الحيض والنفاس، والموت، والردة). ونية (العزم على الفطر، والتردد فيه). وخروج أو دخول (القيء عمداً، والحجامة، والاحتقان، وإنزال المني أو المذي بشهوة، وكل ما وصل إلى الجوف أو الحلق أو الدماغ).","w":["اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والاحتلام، والقيء غلبة، والحجامة، وإنزال المني بتكرار النظر","اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والعزم على الفطر، والقيء عمداً، والتفكر إذا أنزل، والفصد","اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والأكل ناسياً، والقيء عمداً، والحجامة، وإنزال المني بنظرة واحدة"],"ca":"اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والعزم على الفطر، والقيء عمداً، والحجامة، وإنزال المني بتكرار النظر"},{"id":"s126","b":"الصيام والاعتكاف","q":"ما حكم من استخدم شيئاً من المفطرات ناسياً؟","a":"لا يفطر إن فعل شيئاً من جميع المفطرات ناسياً أو مكرهاً","m":0,"ex":"من فعل شيئاً من المفطرات وهو ناسٍ أو مكره فصومه صحيح؛ لأنه لم يقصد الفطر. والقاعدة عامة في كل المفطرات المعدودة. أما الجماع فليس منها، وله حكم خاص في بابه.","w":["يفطر إن فعل شيئاً من المفطرات ناسياً أو مكرهاً، وعليه القضاء","لا يفطر بالأكل والشرب ناسياً فقط، ويفطر بباقي المفطرات ولو ناسياً","لا يفطر إن فعل ناسياً، ويفطر إن كان مكرهاً"]},{"id":"s127","b":"الصيام والاعتكاف","q":"ماذا على من جامع في نهار رمضان وما هي كفارته؟","a":"القضاء والكفارة: عتق رقبة مؤمنة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت","m":0,"ex":"على المجامع أمران: قضاء اليوم، والكفارة. والكفارة مرتبة لا تخيير فيها: عتق رقبة، ثم صيام شهرين متتابعين، ثم إطعام ستين مسكيناً. وتميّزت بأنها تسقط إن عجز عن الجميع، بخلاف غيرها من الكفارات.","w":["القضاء والكفارة على التخيير: عتق رقبة، أو صيام شهرين متتابعين، أو إطعام ستين مسكيناً، ولا تسقط بالعجز","القضاء فقط، وتستحب الكفارة: إطعام ستين مسكيناً","القضاء والكفارة: عتق رقبة مؤمنة، فإن لم يجد فصيام ثلاثة أيام، فإن لم يستطع فإطعام عشرة مساكين"]},{"id":"s128","b":"الصيام والاعتكاف","q":"متى يجب على من فاته أيام من رمضان قضاؤها فوراً؟","a":"يسن القضاء على الفور، إلا إذا بقي من شعبان بقدر ما عليه فيجب","m":0,"ex":"الأصل أن قضاء رمضان يسن على الفور وله أن يؤخره. لكن إذا ضاق الوقت ولم يبق من شعبان إلا بقدر الأيام التي عليه، وجب عليه القضاء حينئذ؛ حتى لا يدخل رمضان التالي وعليه قضاء.","w":["يجب القضاء على الفور مطلقاً من ثاني أيام شوال","يسن القضاء على الفور، ولا يجب ولو دخل رمضان الثاني","يسن تأخير القضاء إلى شعبان، ويجب إذا دخل شعبان"]},{"id":"s129","b":"الصيام والاعتكاف","q":"اذكر أياماً يحرم صومها؟","a":"العيدين، وأيام التشريق","m":0,"ex":"خمسة أيام يحرم صومها: يوما العيد (الفطر والأضحى)، وأيام التشريق الثلاثة (١١ و١٢ و١٣ ذي الحجة). قارن: يوم الشك وإفراد الجمعة والسبت صومها مكروه، لا محرّم.","w":["العيدين، ويوم عرفة","يوم الشك، وأيام التشريق","العيدين، ويوم الجمعة منفرداً"]},{"id":"s130","b":"الصيام والاعتكاف","q":"ما حكم الاعتكاف؟ وما شروط صحته؟","a":"سنة، ويجب بالنذر. شروط صحته ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد (ومن تلزمه الجماعة: بمسجد تقام فيه الجماعة)","m":0,"ex":"الاعتكاف سنة، ويصير واجباً بالنذر. شروطه ستة: النية، والإسلام، والعقل، والتمييز (فيصح من الصبي المميز)، وعدم ما يوجب الغسل، والمكان: المسجد. ومن تلزمه الجماعة يشترط له مسجد تقام فيه الجماعة.","w":["واجب مرة في العمر. شروطه ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد","سنة، ويجب بالنذر. شروطه ستة: النية، والإسلام، والعقل، والبلوغ، والصوم، وكونه بمسجد","سنة، ويجب بالنذر. شروطه أربعة: النية، والإسلام، والعقل، وكونه بمسجد جامع"],"ca":"سنة، ويجب بالنذر. شروطه ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد"},{"id":"s131","b":"الصيام والاعتكاف","q":"اذكر مبطلات الاعتكاف؟ وما الذي لا يبطله؟","a":"يبطل: بالخروج من المسجد لغير عذر، وبنية الخروج ولو لم يخرج، وبالوطء في الفرج، وبالإنزال بالمباشرة دون الفرج، وبالردة، وبالسكر. ولا يبطل إن خرج: لبول أو غائط، أو طهارة واجبة، أو لإزالة نجاسة، أو لجمعة تلزمه، أو للإتيان بمأكل ومشرب لعدم خادم","m":0,"ex":"القاعدة: يبطل بما ينافي لزوم المسجد أو العبادة، وهي ستة: الخروج بلا عذر، ونية الخروج، والوطء، والإنزال بمباشرة، والردة، والسكر. ولا يبطل بالخروج لما لا بد منه: قضاء الحاجة، وطهارة واجبة، وإزالة نجاسة، وجمعة تلزمه، وإحضار طعام إذا لم يجد خادماً.","w":["يبطل: بالخروج لغير عذر، والوطء، والردة. لا يبطل: بنية الخروج، ولا بالإنزال بمباشرة، ولا بالسكر","يبطل: بالخروج ولو لعذر كبول وطهارة وجمعة. لا يبطل: بنية الخروج، ولا بالمباشرة، ولا بالسكر","يبطل: بالخروج لغير عذر، ونية الخروج، والوطء، والردة، والخروج للجمعة. لا يبطل: بالسكر، ولا بالخروج لبول"],"ca":"يبطل: بالخروج لغير عذر، ونية الخروج، والوطء، والإنزال بمباشرة، والردة، والسكر. لا يبطل: بالخروج لبول وطهارة وجمعة ومأكل"},{"id":"v8325","b":"الصيام والاعتكاف","q":"متى يجب صوم رمضان؟","a":"يجب برؤية هلاله على جميع الناس، وإن حال دون مطلعه غيم أو قتر ليلة الثلاثين من شعبان وجب صومه احتياطاً بنية رمضان.","m":0,"ex":"يدخل رمضان برؤية الهلال، فإذا رآه من يُقبل خبره لزم الصوم الجميع. وإن لم يُر مع صفاء الجو أُكمل شعبان ثلاثين يوماً. وإن منع رؤيته غيم أو غبار ليلة الثلاثين صام الناس احتياطاً بنية رمضان.","ca":"برؤية هلاله، فإن حال دونه غيم أو قتر ليلة الثلاثين من شعبان صيم احتياطاً بنية رمضان.","w":["بإكمال شعبان ثلاثين يوماً فقط، ولا عبرة بالرؤية.","برؤية هلاله، وإن حال دونه غيم ليلة الثلاثين حرم صومه.","بالحساب الفلكي وحده، ولا عبرة بالرؤية."]},{"id":"v8378","b":"الصيام والاعتكاف","q":"بكم يثبت هلال شوال وبقية الشهور غير رمضان؟","a":"لا يُقبل في بقية الشهور إلا رجلان عدلان.","m":0,"ex":"هلال رمضان يثبت بخبر مسلم مكلف عدل واحد ولو عبداً أو أنثى، احتياطاً للعبادة. أما هلال شوال وغيره من الشهور فلا يثبت إلا بشهادة رجلين عدلين.","w":["يُقبل فيها خبر مسلم عدل واحد ولو أنثى.","يُقبل فيها رجل وامرأتان.","لا يُقبل فيها إلا ثلاثة رجال عدول."]},{"id":"v8732","b":"الصيام والاعتكاف","q":"ما أحكام الفطر في رمضان؟ (متى يحرم، ومتى يجب، ومتى يسن، ومتى يباح؟)","a":"يحرم على من لا عذر له. ويجب على الحائض والنفساء، وعلى من يحتاجه لإنقاذ معصوم من مهلكة. ويسن لمسافر يباح له القصر، ولمريض يخاف الضرر. ويباح لحاضر سافر في أثناء النهار، ولحامل ومرضع خافتا على أنفسهما أو على الولد.","m":0,"ex":"الفطر في رمضان تجري فيه أربعة أحكام: فالمعذور قد يلزمه الفطر كالحائض ومنقذ الغريق، وقد يُستحب له كالمسافر سفر قصر والمريض المتضرر، وقد يباح له كالحامل والمرضع، ومن لا عذر له يحرم عليه.","ca":"يحرم بلا عذر؛ يجب على الحائض والنفساء ومنقذ معصوم؛ يسن للمسافر والمريض المتضرر؛ يباح للحامل والمرضع ومن سافر أثناء النهار.","mn":"ح ج س ب: يحرم، يجب، يسن، يباح.","w":["يحرم على المسافر، ويجب على المريض، ويسن للحائض، ويباح لمن لا عذر له.","يحرم على الحامل والمرضع، ويجب على المسافر، ويسن للحائض، ويباح للمريض.","يحرم على من لا عذر له، ويجب على المسافر، ويسن للحائض والنفساء، ويباح للمريض فقط."]},{"id":"v8760","b":"الصيام والاعتكاف","q":"إذا زال العذر في أثناء نهار رمضان وهم مفطرون، فما الذي يلزمهم؟","a":"إن أسلم الكافر، أو طهرت الحائض، أو برئ المريض، أو قدم المسافر، أو بلغ الصغير، أو عقل المجنون في أثناء النهار وهم مفطرون: لزمهم الإمساك والقضاء.","m":0,"ex":"من كان مفطراً لعذر ثم زال عذره في النهار، أو صار أهلاً للوجوب في أثنائه، لزمه أن يمسك بقية يومه احتراماً للشهر، ويقضي ذلك اليوم بعد رمضان.","ca":"يلزمهم الإمساك والقضاء.","w":["يلزمهم الإمساك فقط دون القضاء.","يلزمهم القضاء فقط، ولهم الأكل بقية اليوم.","لا يلزمهم شيء لأنهم أفطروا بعذر."]},{"id":"v8904","b":"الصيام والاعتكاف","q":"اذكر الأيام التي يُسنّ صومها تطوعاً.","a":"يُسنّ صوم التطوع، وأفضله صوم يوم وفطر يوم. ويُسنّ صوم: أيام البيض (الثالث عشر والرابع عشر والخامس عشر)، والخميس والاثنين، وستة من شوال، والمحرّم وآكده عاشوراء، وعشر ذي الحجة وآكده يوم عرفة.","m":0,"ex":"أفضل صيام التطوع أن يصوم يوماً ويفطر يوماً. وصوم عاشوراء كفارة سنة، وصوم يوم عرفة كفارة سنتين. وأيام البيض هي الثالث عشر والرابع عشر والخامس عشر من كل شهر.","ca":"أيام البيض، والخميس والاثنين، وست من شوال، والمحرم (وآكده عاشوراء)، وعشر ذي الحجة (وآكده يوم عرفة)","mn":"بيض + خميس واثنين + ست شوال + محرّم (عاشوراء) + عشر ذي الحجة (عرفة)","w":["أيام البيض، والاثنين والأربعاء، وست من شعبان، ورجب (وآكده أوله)، وعشر ذي الحجة (وآكده يوم النحر)","أول كل شهر، والخميس والجمعة، وست من شوال، والمحرم (وآكده أوله)، وعشر ذي الحجة (وآكده يوم التروية)","أيام البيض، والجمعة والسبت، وست من رمضان، وشعبان كله، وأيام التشريق"]},{"id":"v8919","b":"الصيام والاعتكاف","q":"ما الأيام التي يُكره إفرادها بالصوم؟ وما يوم الشك؟","a":"يُكره إفراد رجب، والجمعة، والسبت بالصوم. ويُكره صوم يوم الشك، وهو الثلاثون من شعبان إذا لم يكن غيمٌ أو قَتَر.","m":0,"ex":"المكروه إفراد هذه الأيام بالصوم وحدها، لا صومها مع غيرها. ويوم الشك هو يوم الثلاثين من شعبان إذا كانت السماء صحواً ليلته بلا غيم ولا قتر ولم يُرَ الهلال.","w":["يُكره إفراد شعبان والخميس والاثنين، ويوم الشك هو التاسع والعشرون من شعبان","يُكره إفراد المحرم والأربعاء والأحد، ويوم الشك هو الثلاثون من رمضان","يُكره إفراد ذي الحجة والجمعة والاثنين، ويوم الشك هو الثلاثون من شعبان إذا كان غيم"]},{"id":"s132","b":"الحج والأضحية","q":"ما حكم الحج والعمرة؟","a":"واجب مع العمرة، في العمر مرة","m":0,"ex":"الحج والعمرة كلاهما واجب، مرة واحدة في العمر. احفظهما مقترنين: «واجبان في العمر مرة»، فالعمرة في المذهب واجبة كالحج لا سنة.","w":["الحج واجب في العمر مرة، والعمرة سنة","واجب مع العمرة، كل عام على المستطيع","الحج واجب في العمر مرتين، والعمرة مرة"]},{"id":"s133","b":"الحج والأضحية","q":"ما هي شروط وجوب الحج؟ وهل للمرأة شرط زائد؟","a":"خمسة: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد الأنثى سادساً: أن تجد لها زوجاً أو محرماً مكلفاً، وتقدر على أجرته وعلى الزاد والراحلة لها وله","m":0,"ex":"خمسة: ثلاثة للتكليف (الإسلام، والعقل، والبلوغ)، ثم كمال الحرية، والاستطاعة. والمرأة يزيد عليها سادس: أن تجد زوجاً أو محرماً مكلفاً، وتقدر على أجرته وعلى الزاد والراحلة لها وله. فإن حجت بلا محرم حرم وأجزأها.","w":["خمسة: الإسلام، والعقل، والبلوغ، والحرية، والاستطاعة. ولا تزيد المرأة شيئاً، فتحج مع رفقة مأمونة","أربعة: الإسلام، والعقل، والبلوغ، والاستطاعة. وتزيد المرأة: إذن زوجها","خمسة: الإسلام، والعقل، والتمييز، والحرية، والاستطاعة. وتزيد المرأة: وجود محرم ولو صغيراً"],"ca":"خمسة: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد المرأة: وجود زوج أو محرم مكلف، والقدرة على نفقته"},{"id":"s134","b":"الحج والأضحية","q":"ما حكم الإحرام من الميقات لمن كان منزله دون الميقات؟","a":"واجب؛ ومن منزله دون الميقات فميقاته منزله (والعمرة يحرم بها من الحل)","m":0,"ex":"الإحرام من الميقات من واجبات الحج. ومن كان بيته أقرب إلى مكة من الميقات فلا يرجع إليه، بل يحرم من منزله. أما العمرة فيُحرم بها من الحل (خارج الحرم).","w":["سنة؛ ومن منزله دون الميقات رجع إلى الميقات فأحرم منه","واجب؛ ومن منزله دون الميقات أحرم من مكة للحج والعمرة","ركن؛ ومن منزله دون الميقات فميقاته منزله"]},{"id":"s135","b":"الحج والأضحية","q":"ما هي أنواع النسك الثلاثة؟","a":"التمتع (وهو أفضل)، والإفراد، والقران","m":0,"ex":"ثلاثة أنساك: التمتع: عمرة في أشهر الحج ثم حج بعدها، وهو الأفضل. الإفراد: حج ثم عمرة بعده. القران: يحرم بالعمرة ثم يُدخل عليها الحج قبل طوافها. احفظ الترتيب: تمتع، إفراد، قران.","w":["التمتع، والإفراد، والقران (وهو أفضل)","الإفراد (وهو أفضل)، والتمتع، والقران","التمتع (وهو أفضل)، والإفراد، والإحصار"]},{"id":"s136","b":"الحج والأضحية","q":"ما أثر اشتراط الحاج (اللهم محلي حيث حبستني)؟","a":"له أن يتحلل متى شاء من غير شيء، ولا قضاء عليه","m":0,"ex":"من اشترط عند إحرامه «فإن حبسني حابس فمحلّي حيث حبستني» استفاد: إذا منعه مانع تحلّل متى شاء بلا دم ولا قضاء. فالاشتراط يحميه من لزوم الفدية والقضاء.","w":["له أن يتحلل متى شاء، وعليه دم، ولا قضاء عليه","لا أثر له، فعليه دم وقضاء إن أحصر","له أن يتحلل، ولا دم عليه، وعليه القضاء"]},{"id":"s137","b":"الحج والأضحية","q":"اذكر محظورات الإحرام السبعة؟","a":"لبس المخيط على الرجل، وتغطية الرأس من الرجل والوجه من الأنثى، والطيب، وإزالة الشعر وتقليم الأظفار، وقتل صيد البر الوحشي المأكول، وعقد النكاح، والوطء في الفرج ودواعيه والمباشرة","m":0,"mn":"لِ غَ طِ شَ صَ عَ وَ: لبس، غطاء، طيب، شعر وظفر، صيد، عقد، وطء","ex":"سبعة، قسّمها: في البدن واللباس أربعة (المخيط، وتغطية الرأس للرجل والوجه للمرأة، والطيب، وإزالة الشعر والأظفار). وفي الصيد واحد (قتل صيد البر الوحشي المأكول). وفي النساء اثنان (عقد النكاح، والوطء ودواعيه). ٤ + ١ + ٢ = ٧.","w":["لبس المخيط للرجل، وتغطية الوجه للرجل والرأس للأنثى، والطيب، وإزالة الشعر، وقتل الصيد، وعقد النكاح، والوطء","لبس المخيط للرجل، وتغطية الرأس للرجل، والطيب، وإزالة الشعر، وقتل صيد البحر، والاغتسال، والوطء","لبس المخيط للرجل والمرأة، وتغطية الرأس، والطيب، وإزالة الشعر، وقتل الحشرات، والبيع والشراء، والوطء"],"ca":"لبس المخيط للرجل، وتغطية الرأس للرجل والوجه للأنثى، والطيب، وإزالة الشعر والأظفار، وقتل الصيد، وعقد النكاح، والوطء ودواعيه"},{"id":"s138","b":"الحج والأضحية","q":"ما هو المحظور من محظورات الإحرام الذي لا فدية فيه؟","a":"قتل القمل، وعقد النكاح","m":0,"ex":"كل محظورات الإحرام فيها فدية إلا اثنين: قتل القمل، وعقد النكاح. وعقد النكاح وإن لم تكن فيه فدية فهو لا يصح أصلاً. احفظ: «القمل والنكاح» بلا فدية.","w":["قتل الصيد، وعقد النكاح","قتل القمل، والطيب","تغطية الرأس، وعقد النكاح"]},{"id":"s139","b":"الحج والأضحية","q":"الفدية نوعان: تخيير وترتيب. اذكر أمثلة التخيير؟","a":"كفدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين، والإمناء بنظرة، والمباشرة بغير إنزال: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. ومنه: جزاء الصيد","m":0,"ex":"فدية التخيير في محظورات الترفّه كاللبس والطيب وتغطية الرأس وإزالة الشعر والأظفار: يختار واحداً من ثلاثة: ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. لاحظ الأرقام: ١ شاة، ٣ أيام، ٦ مساكين. وجزاء الصيد تخيير أيضاً.","w":["فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح بدنة، أو صيام عشرة أيام، أو إطعام عشرة مساكين","فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح شاة، أو صيام ستة أيام، أو إطعام ثلاثة مساكين","دم المتعة، والقران، وترك الواجب: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين"],"ca":"فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين"},{"id":"s140","b":"الحج والأضحية","q":"بم يحصل التحلل الأول في الحج ومم يحل به؟","a":"باثنين من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء إلا النساء","m":0,"ex":"يوم النحر فيه ثلاثة أعمال: الرمي، والحلق، والطواف. إذا فعل أي اثنين منها حصل التحلل الأول، فيحل له كل ما حرم بالإحرام إلا النساء. والثالث مع السعي يحصل به التحلل الثاني.","w":["بواحد من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء إلا النساء","باثنين من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء حتى النساء","باثنين من ثلاثة: رمي، وذبح، وحلق. ويحل له كل شيء إلا النساء"]},{"id":"s141","b":"الحج والأضحية","q":"ما الفرق بين التحلل الأول والتحلل الأكبر (الثاني) في الحج؟","a":"بالأول يحل له كل شيء إلا النساء، والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل، فيحل له كل شيء","m":0,"ex":"التحلل الأول: باثنين من (رمي، وحلق، وطواف)، فيحل له كل شيء إلا النساء. والتحلل الثاني: بفعل الباقي منها مع السعي إن لم يكن سعى قبل، فيحل له كل شيء حتى النساء. فالفرق بينهما: النساء.","w":["بالأول يحل له كل شيء إلا الطيب والنساء، والثاني يحصل بطواف الوداع فيحل له كل شيء","بالأول يحل له كل شيء، والثاني يحصل بالسعي فقط فيحل له الصيد","بالأول يحل له اللبس والحلق فقط، والثاني يحصل بما بقي مع السعي فيحل له كل شيء إلا النساء"]},{"id":"s142","b":"الحج والأضحية","q":"اذكر أركان الحج وأركان العمرة؟","a":"الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي. العمرة ثلاثة: الإحرام، والطواف، والسعي","m":0,"ex":"الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي. والعمرة ثلاثة: هي أركان الحج نفسها بحذف الوقوف بعرفة: الإحرام، والطواف، والسعي. احفظ: العمرة = الحج ناقص عرفة.","w":["الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والحلق. العمرة ثلاثة: الإحرام، والطواف، والحلق","الحج خمسة: الإحرام، والوقوف بعرفة، والمبيت بمزدلفة، وطواف الإفاضة، والسعي. العمرة ثلاثة: الإحرام، والطواف، والسعي","الحج ثلاثة: الوقوف بعرفة، وطواف الإفاضة، والسعي. العمرة اثنان: الطواف، والسعي"]},{"id":"s143","b":"الحج والأضحية","q":"من ترك ركناً، من ترك واجباً، من ترك مسنوناً.. ماذا عليه؟","a":"الركن: لم يتم حجه إلا به. الواجب: عليه دم وحجه صحيح. المسنون: لا شيء عليه","m":0,"ex":"ثلاث درجات: الركن لا يتم الحج إلا بفعله ولا يُجبر بدم. والواجب يُجبر بدم والحج صحيح. والسنة لا شيء في تركها. احفظ: ركن = لا بد منه، واجب = دم، سنة = لا شيء.","w":["الركن: عليه دم وحجه صحيح. الواجب: لم يتم حجه إلا به. المسنون: لا شيء عليه","الركن: لم يتم حجه إلا به. الواجب: لا شيء عليه. المسنون: عليه صدقة","الركن: عليه بدنة وحجه صحيح. الواجب: عليه شاة. المسنون: لا شيء عليه"]},{"id":"s144","b":"الحج والأضحية","q":"ما حكم الأضحية ومتى تجب؟","a":"سنة مؤكدة، وتجب بالنذر، وبقوله: هذه أضحية، أو: لله","m":0,"ex":"الأضحية في الأصل سنة مؤكدة، وتصير واجبة بأحد أمرين: النذر، أو تعيينها بالقول كأن يقول: «هذه أضحية» أو «هذه لله». فالتعيين باللفظ يوجبها.","w":["واجبة على القادر، وتتأكد بالنذر","سنة مؤكدة، ولا تجب ولو بالنذر أو التعيين","سنة مؤكدة، وتجب بمجرد شرائها بنية الأضحية"]},{"id":"s145","b":"الحج والأضحية","q":"كم تجزئ البدنة والبقرة في الأضحية؟","a":"عن سبعة","m":0,"ex":"البدنة (من الإبل) والبقرة تجزئ كل واحدة منهما عن سبعة أشخاص لكبرها. أما الشاة فتجزئ عن الواحد وعن أهل بيته وعياله.","w":["عن عشرة","عن ثلاثة","البدنة عن عشرة، والبقرة عن سبعة"]},{"id":"s146","b":"الحج والأضحية","q":"كيف تُنحر البقر؟","a":"يسن نحر الإبل قائمة، وذبح البقر والغنم على جنبها الأيسر موجهة إلى القبلة","m":0,"ex":"الإبل تُنحر وهي قائمة، أما البقر والغنم فتُذبح مضجعة على جنبها الأيسر متجهة إلى القبلة. احفظ: الإبل قياماً ونحراً، والبقر والغنم على الجنب ذبحاً.","w":["يسن نحر الإبل والبقر قائمة، وذبح الغنم على جنبها الأيسر موجهة إلى القبلة","يسن نحر الإبل باركة، وذبح البقر والغنم على جنبها الأيمن موجهة إلى القبلة","يسن ذبح الإبل والبقر والغنم قائمة، موجهة إلى القبلة"]},{"id":"s147","b":"الحج والأضحية","q":"متى أول وقت ذبح الأضحية يوم العيد؟","a":"من بعد أسبق صلاة العيد بالبلد، أو قدرها لمن لم يصل","m":0,"ex":"يبدأ وقت الذبح بعد أول صلاة عيد تُقام في البلد، ولو لم يصلّ هو بعد. ومن كان في مكان لا تُصلى فيه العيد انتظر قدر زمن الصلاة. ويستمر الوقت إلى آخر ثاني أيام التشريق.","w":["من بعد آخر صلاة عيد بالبلد، أو قدرها لمن لم يصل","من طلوع فجر يوم العيد، لمن صلى ولمن لم يصل","من طلوع الشمس يوم العيد، أو بعد الخطبة لمن صلى"]},{"id":"s148","b":"الحج والأضحية","q":"ما هي السنة في تقسيم لحم الأضحية؟ وهل يجوز إعطاء الجزار منها أجرة؟","a":"يأكل ثلثها، ويهدي ثلثها، ويتصدق بثلثها. ولا يعطي الجزار بأجرته منها شيئاً، وله إعطاؤه صدقة وهدية","m":0,"ex":"السنة قسمة الأضحية أثلاثاً: ثلث يأكله، وثلث يهديه، وثلث يتصدق به. والجزار لا يُعطى منها شيئاً على أنه أجرة، لكن يجوز أن يُعطى منها صدقة أو هدية.","w":["يأكل نصفها، ويتصدق بنصفها. ويجوز أن يعطي الجزار أجرته منها","يتصدق بها كلها، ولا يأكل منها. ولا يعطي الجزار منها شيئاً ولو صدقة","يأكل ثلثها، ويهدي ثلثها، ويتصدق بثلثها. ويجوز أن يعطي الجزار أجرته منها"]},{"id":"s149","b":"الحج والأضحية","q":"ما حكم العقيقة وكم تذبح للغلام والجارية؟ وما السنة في السابع؟","a":"سنة في حق الأب ولو معسراً؛ عن الغلام شاتان، وعن الجارية شاة. والسنة ذبحها في سابع يوم ولادته، ويحلق رأس الغلام فيه ويتصدق بوزنه فضة، ويسمى فيه","m":0,"ex":"العقيقة سنة على الأب ولو كان فقيراً. للذكر شاتان وللأنثى شاة. وفي اليوم السابع ثلاثة أعمال: الذبح، وحلق رأس الغلام والتصدق بوزن شعره فضة، والتسمية.","w":["واجبة على الأب؛ للغلام شاة وللجارية شاة، تذبح في السابع، ويحلق رأسه ويتصدق بوزنه ذهباً","سنة في حق الأم؛ للغلام شاتان وللجارية شاة، تذبح يوم الولادة، ويسمى في الأربعين","سنة في حق الأب؛ للغلام شاة وللجارية شاتان، تذبح في السابع، ويحلق رأسه ويتصدق بوزنه فضة"],"ca":"سنة في حق الأب؛ للغلام شاتان وللجارية شاة، تذبح في السابع، ويحلق رأس الغلام ويتصدق بوزنه فضة، ويسمى"},{"id":"v9215","b":"الحج والأضحية","q":"ما التمتع؟ وما الإفراد؟ وما القران؟","a":"التمتع: أن يحرم بالعمرة في أشهر الحج، ثم بعد فراغه منها يحرم بالحج. والإفراد: أن يحرم بالحج، ثم بعد فراغه منه يحرم بالعمرة. والقران: أن يحرم بالحج والعمرة معاً، أو يحرم بالعمرة ثم يُدخل الحج عليها قبل الشروع في طوافها.","m":0,"ex":"يُخيَّر مريد الإحرام بين الأنساك الثلاثة، والتمتع أفضلها. فالمتمتع يتحلل بين عمرته وحجه، والقارن يجمع الحج والعمرة في إحرام واحد، والمفرد يحرم بالحج وحده.","ca":"التمتع: عمرة في أشهر الحج ثم حج بعد الفراغ منها؛ الإفراد: حج ثم عمرة بعده؛ القران: الإحرام بهما معاً","w":["التمتع: الإحرام بالحج والعمرة معاً؛ الإفراد: عمرة ثم حج؛ القران: حج ثم عمرة بعده","التمتع: حج ثم عمرة بعده؛ الإفراد: عمرة وحدها؛ القران: عمرة في أشهر الحج ثم حج","التمتع: عمرة في غير أشهر الحج ثم حج؛ الإفراد: حج وحده بلا نية؛ القران: عمرتان في سفر واحد"]},{"id":"v9296","b":"الحج والأضحية","q":"ماذا يجب على المُحصَر (الممنوع من إتمام نسكه) ليتحلّل؟","a":"يجب عليه دم، فإن لم يجد صام عشرة أيام ثم حلّ.","m":0,"ex":"دم الإحصار من فدية الترتيب: يذبح أولاً، فإن عجز عن الدم انتقل إلى صيام عشرة أيام ثم يتحلل.","w":["لا شيء عليه، ويتحلل في مكانه","يجب عليه دم، فإن لم يجد أطعم ستة مساكين ثم حلّ","يصوم ثلاثة أيام ثم يحلّ، ولا دم عليه"]},{"id":"v9584","b":"الحج والأضحية","q":"بمَ يُخيَّر في جزاء الصيد؟ وما في الحمامة؟","a":"يُخيَّر فيه بين: المثل من النعم، أو تقويم المثل بمحل التلف ويشتري بقيمته طعاماً يجزئ في الفطرة فيطعم كل مسكين مُدَّ بُرّ أو نصف صاع من غيره، أو يصوم عن طعام كل مسكين يوماً. وفي الحمام شاة.","m":0,"ex":"جزاء الصيد من فدية التخيير. فالصيد الذي له مثل من النعم يُفدى بمثله، كالنعامة ففيها بدنة، والغزال ففيه شاة، والحمام ففيه شاة؛ وما لا مثل له ففيه قيمته مكانه.","ca":"المثل من النعم، أو طعام بقيمته لكل مسكين مد بر أو نصف صاع من غيره، أو صيام يوم عن كل مسكين؛ وفي الحمامة شاة","w":["ذبح شاة أو صيام ثلاثة أيام أو إطعام ستة مساكين؛ وفي الحمامة إطعام مسكين","المثل من النعم فقط، فإن عجز صام عشرة أيام؛ وفي الحمامة بدنة","دفع قيمته دراهم للفقراء أو صيام شهرين؛ وفي الحمامة قيمتها"]},{"id":"v9628","b":"الحج والأضحية","q":"ما أمثلة قسم الترتيب في الفدية؟ وماذا يجب على المتمتع والقارن وتارك الواجب؟","a":"قسم الترتيب: كدم المتعة والقران، وترك الواجب، والإحصار، والوطء ونحوه. فيجب على المتمتع والقارن وتارك الواجب دم، فإن عدمه أو عدم ثمنه صام ثلاثة أيام في الحج وسبعة إذا رجع إلى أهله.","m":0,"ex":"معنى الترتيب ألا ينتقل إلى الصيام إلا عند العجز عن الدم. والأفضل أن يكون آخر الأيام الثلاثة يوم عرفة، ويصح صومها أيام التشريق.","ca":"دم المتعة والقران وترك الواجب والإحصار والوطء؛ فعليهم دم، فإن عدمه صام ثلاثة في الحج وسبعة إذا رجع","w":["اللبس والطيب وتغطية الرأس؛ فعليهم دم أو صيام ثلاثة أيام أو إطعام ستة مساكين","دم المتعة والقران وترك الواجب؛ فعليهم دم، فإن عدمه أطعم عشرة مساكين","قتل الصيد وقطع شجر الحرم؛ فعليهم دم، فإن عدمه صام شهرين متتابعين"]},{"id":"v9679","b":"الحج والأضحية","q":"ما حكم من وطئ في الحج قبل التحلل الأول؟ وماذا يجب عليه؟","a":"يفسد حجه ولا يبطل، بل يلزمه إتمامه والقضاء، ويجب عليه بدنة، فإن لم يجدها صام عشرة أيام: ثلاثة في الحج وسبعة إذا رجع.","m":0,"ex":"الإحرام لا يبطل إلا بالردة، لكنه يفسد بالوطء قبل التحلل الأول، فيمضي في حجه الفاسد ويقضيه. ومثله في وجوب البدنة من أنزل منياً بمباشرة أو تقبيل أو لمس بشهوة. وفي العمرة إذا أفسدها قبل تمام السعي شاة.","ca":"يفسد حجه، ويلزمه إتمامه والقضاء، وعليه بدنة، فإن لم يجد صام عشرة أيام","w":["يبطل حجه فيخرج منه فوراً، وعليه شاة","حجه صحيح، وعليه شاة فقط","يفسد حجه، ويلزمه القضاء دون إتمام، وعليه صيام ثلاثة أيام"]},{"id":"v9821","b":"الحج والأضحية","q":"ما حكم صيد حرم مكة وقطع شجره وحشيشه؟","a":"يحرم صيد حرم مكة، وحكمه حكم صيد الإحرام. ويحرم قطع شجره وحشيشه، والمُحِلّ والمُحرِم في ذلك سواء.","m":0,"ex":"التحريم هنا بسبب المكان لا بسبب الإحرام، فيشمل غير المحرم أيضاً. وتُضمن الشجرة الصغيرة عرفاً بشاة، وما فوقها ببقرة، ويُضمن الحشيش والورق بقيمته.","w":["يحرم على المحرم فقط، ويجوز للمحلّ صيده وقطع شجره","يكره صيده وقطع شجره، ولا ضمان فيه","يحرم صيده فقط، ويجوز قطع شجره وحشيشه للجميع"]},{"id":"v9844","b":"الحج والأضحية","q":"ما المراد بالدم الواجب في الحج؟","a":"ما يُجزئ في الأضحية: جَذَع ضأن، أو ثَنِيّ معز، أو سُبع بدنة أو بقرة.","m":0,"ex":"إذا أُطلق الدم في الفدية فالمقصود ما يصلح أضحية. وتجزئ البدنة عن البقرة وعكسه، وتجزئ البدنة أو البقرة عن سبع شياه.","w":["أيّ ذبيحة ولو دجاجة، ما دامت تُذبح في الحرم","بدنة كاملة لا تجزئ غيرها","شاة من أي سن، ولا يجزئ سُبع البدنة"]},{"id":"v9872","b":"الحج والأضحية","q":"ما واجبات الحج؟","a":"سبعة: الإحرام من الميقات، والوقوف بعرفة إلى الغروب لمن وقف نهاراً، والمبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، والمبيت بمنى ليالي التشريق، ورمي الجمار مرتباً، والحلق أو التقصير، وطواف الوداع.","m":0,"ex":"الواجبات غير الأركان: من ترك واجباً فعليه دم وحجه صحيح. وأما الأركان الأربعة فلا يتم الحج إلا بها.","ca":"الإحرام من الميقات، والوقوف إلى الغروب، ومبيت مزدلفة، ومبيت منى، والرمي، والحلق أو التقصير، وطواف الوداع","mn":"ميقات ← عرفة للغروب ← مزدلفة ← منى ← رمي ← حلق ← وداع (بترتيب أعمال الحج)","w":["الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي، والرمي، والحلق، وطواف الوداع","الإحرام من الميقات، ومبيت مزدلفة، ومبيت منى، والرمي، والحلق، وطواف القدوم، والرمل","الإحرام من الميقات، والوقوف إلى الغروب، والمبيت بمنى ليلة عرفة، والرمي، والاضطباع، والتلبية، وطواف الوداع"]},{"id":"v9925","b":"الحج والأضحية","q":"ما واجبات العمرة؟","a":"شيئان: الإحرام بها من الحِلّ، والحلق أو التقصير.","m":0,"ex":"أركان العمرة ثلاثة: الإحرام والطواف والسعي، وواجباتها اثنان فقط. فمن كان بمكة وأراد العمرة خرج إلى الحلّ فأحرم منه.","w":["ثلاثة: الإحرام والطواف والسعي","شيئان: الإحرام من الحرم، وطواف الوداع","شيئان: الرمل في الطواف، والحلق أو التقصير"]},{"id":"v9939","b":"الحج والأضحية","q":"اذكر بعض مسنونات الحج.","a":"كالمبيت بمنى ليلة عرفة، وطواف القدوم، والرمل في الأشواط الثلاثة الأول منه، والاضطباع فيه، وتجرد الرجل من المخيط عند الإحرام، ولبس إزار ورداء أبيضين نظيفين، والتلبية من حين الإحرام إلى أول الرمي.","m":0,"ex":"من ترك مسنوناً من هذه فلا شيء عليه وحجه صحيح. والرمل والاضطباع يكونان في طواف القدوم.","ca":"المبيت بمنى ليلة عرفة، وطواف القدوم، والرمل والاضطباع فيه، والتلبية","mn":"منى ليلة عرفة + قدوم (رمل واضطباع) + تجرد وإزار ورداء أبيضان + تلبية","w":["الوقوف بعرفة، وطواف الإفاضة، والسعي، والإحرام","المبيت بمزدلفة، والمبيت بمنى ليالي التشريق، ورمي الجمار، وطواف الوداع","طواف الوداع، والحلق، والوقوف إلى الغروب، والإحرام من الميقات"]},{"id":"v10004","b":"الحج والأضحية","q":"ما أفضل الأضحية؟ وما أقل سنّ يُجزئ فيها؟","a":"الأفضل: الإبل، فالبقر، فالغنم، ولا تجزئ من غير هذه الثلاثة. وأقل ما يجزئ: من الضأن ما له نصف سنة، ومن المعز ما له سنة، ومن البقر والجاموس ما له سنتان، ومن الإبل ما له خمس سنين.","m":0,"ex":"لا تجزئ الأضحية إلا من بهيمة الأنعام. وتجزئ الشاة عن الواحد وعن أهل بيته وعياله، وتجزئ البدنة والبقرة عن سبعة.","ca":"الأفضل الإبل ثم البقر ثم الغنم؛ السن: ضأن نصف سنة، معز سنة، بقر سنتان، إبل خمس سنين","mn":"السن يتضاعف: ضأن ½ ← معز 1 ← بقر 2 ← إبل 5","w":["الأفضل الغنم ثم البقر ثم الإبل؛ السن: ضأن سنة، معز نصف سنة، بقر سنتان، إبل خمس سنين","الأفضل الإبل ثم الغنم ثم البقر؛ السن: ضأن نصف سنة، معز سنة، بقر سنة، إبل ثلاث سنين","الأفضل البقر ثم الإبل ثم الغنم؛ السن: ضأن سنة، معز سنتان، بقر ثلاث سنين، إبل أربع سنين"]},{"id":"v10306","b":"الحج والأضحية","q":"ما حكم أخذ المضحّي من شعره وظفره إذا دخلت عشر ذي الحجة؟","a":"يحرم على من يضحّي أو يُضحّى عنه أخذ شيء من شعره أو ظفره إلى الذبح، ويُسنّ الحلق بعده.","m":0,"ex":"يبدأ التحريم بدخول العشر الأولى من ذي الحجة وينتهي بذبح الأضحية. ويشمل ذلك المضحّي نفسه ومن يُضحّى عنه.","w":["يكره أخذ شيء من شعره أو ظفره إلى يوم عرفة","يحرم على المضحّي وحده إلى آخر أيام التشريق","يُسنّ له الأخذ من شعره وظفره قبل الذبح"]},{"id":"s150","b":"البيوع","q":"كيف ينعقد البيع؟","a":"بالقول الدال على البيع والشراء، وبالمعاطاة","m":1,"ex":"البيع ينعقد بطريقين: بالقول الدال عليه كـ«بعتك» و«اشتريت»، أو بالفعل وهو المعاطاة: أن يعطيه ويأخذ دون صيغة، كقوله: أعطني بهذا خبزاً فيعطيه. ولا ينعقد هزلاً.","w":["بالقول الدال على البيع والشراء فقط، ولا ينعقد بالمعاطاة","بالكتابة والإشهاد، ولا ينعقد بالقول وحده","بالمعاطاة فقط فيما قل ثمنه، وبالقول فيما كثر"]},{"id":"s151","b":"البيوع","q":"اذكر شروط البيع؟","a":"سبعة: الرضى، والرشد، وكون المبيع مالاً، وأن يكون ملكاً للبائع أو مأذوناً له فيه، والقدرة على تسليمه، ومعرفة الثمن والمثمن، وأن يكون منجزاً لا معلقاً","m":1,"mn":"رضى، رشد، مال، ملك، تسليم، معرفة، تنجيز","ex":"سبعة، تجمعها ثلاث جهات: العاقدان (الرضى، والرشد). والمبيع (أن يكون مالاً، مملوكاً للبائع أو مأذوناً له فيه، مقدوراً على تسليمه). والعقد (معرفة الثمن والمثمن، وأن يكون منجزاً غير معلق).","w":["سبعة: الرضى، والبلوغ، وكون المبيع مالاً، وملكه أو الإذن فيه، ورؤية المبيع، ومعرفة الثمن، والإشهاد","ستة: الرضى، والرشد، وكون المبيع مالاً، وملكه، ومعرفة الثمن والمثمن، والقبض في المجلس","سبعة: الإيجاب، والقبول، والرضى، وكون المبيع مالاً، وملكه، والقدرة على تسليمه، وتعليقه على شرط"],"ca":"سبعة: الرضى، والرشد، وكون المبيع مالاً، وملكه أو الإذن فيه، والقدرة على تسليمه، ومعرفة الثمن والمثمن، والتنجيز"},{"id":"s152","b":"البيوع","q":"اذكر أمثلة لبيوع لا تصح وشروط بيع فاسدة؟","a":"الشرط الفاسد المبطل: كشرط بيع آخر، أو سلف، أو قرض، أو إجارة، أو شركة، أو صرف للثمن (بيعتان في بيعة). ومما لا يصح: البيع والشراء في المسجد، وممن تلزمه الجمعة بعد ندائها الذي عند المنبر","m":1,"ex":"الشرط الفاسد المبطل: أن يُشترط مع البيع عقد آخر، كبيع أو سلف أو قرض أو إجارة أو شركة أو صرف، فتصير «بيعتين في بيعة». ومما لا يصح: البيع في المسجد، والبيع بعد نداء الجمعة الذي عند المنبر ممن تلزمه.","w":["الشرط المبطل: كشرط تأجيل الثمن أو رهن أو ضمين. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه","الشرط المبطل: كشرط بيع آخر أو قرض. ويصح البيع في المسجد مع الكراهة، وبعد نداء الجمعة","الشرط المبطل: كشرط صفة في المبيع. ولا يصح البيع في السوق وقت الصلاة، ولا بعد الأذان الأول للجمعة"],"ca":"الشرط المبطل: كشرط بيع آخر أو سلف أو قرض أو إجارة أو شركة. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه"},{"id":"s153","b":"البيوع","q":"ما هي شروط بيع المكيل بالمكيل من جنسه لكي لا يقع في الربا؟","a":"شرطان: المماثلة في القدر، والقبض قبل التفرق","m":1,"ex":"إذا بيع ربوي بجنسه (تمر بتمر، ذهب بذهب) فلا بد من أمرين: التساوي في المقدار، والتقابض قبل التفرق. فإن اختلف الجنس (ذهب بفضة) كفى القبض وجاز التفاضل.","w":["شرطان: المماثلة في القدر، وجواز التأجيل","شرط واحد: القبض قبل التفرق، ويجوز التفاضل","شرطان: المماثلة في القيمة، والقبض قبل التفرق"]},{"id":"v10563","b":"البيوع","q":"ما أقسام الشروط في البيع؟ مع مثال لكل قسم.","a":"قسمان: صحيح لازم، كشرط تأجيل الثمن أو بعضه، أو رهن أو ضمين معيّنين، أو شرط صفة في المبيع. وفاسد مبطل للبيع، كشرط بيع آخر، أو سلف، أو قرض، أو إجارة، أو شركة، أو صرف للثمن، وهو بيعتان في بيعة.","m":1,"ex":"الشرط الصحيح يلزم الوفاء به، فإن لم يوجد الوصف المشروط فللمشتري الفسخ. والشرط الفاسد المبطل يُفسد العقد كله، كأن يقول: لا أبيعك سيارتي إلا أن تقرضني ألف دينار.","ca":"صحيح لازم (كتأجيل الثمن أو صفة في المبيع)، وفاسد مبطل للبيع (كشرط بيع آخر أو قرض أو إجارة)","w":["قسمان: صحيح لازم كشرط القرض، وفاسد لا يؤثر كشرط تأجيل الثمن","ثلاثة: صحيح، ومكروه، وباطل؛ وكلها لا تؤثر في صحة البيع","قسمان: صحيح كشرط بيع آخر، وفاسد يبطل الشرط وحده ويصح البيع كشرط صفة في المبيع"]},{"id":"v10647","b":"البيوع","q":"ما أقسام الخيار في البيع؟","a":"سبعة: خيار المجلس، وخيار الشرط، وخيار الغَبن، وخيار التدليس، وخيار العيب، وخيار الخُلف في الصفة، وخيار الخُلف في قدر الثمن.","m":1,"ex":"الخيار أن يكون للمتعاقد حق إمضاء البيع أو فسخه. فخيار المجلس يثبت للمتعاقدين من حين العقد إلى أن يتفرقا، وخيار الشرط أن يشترطا أو أحدهما الخيار إلى مدة معلومة.","mn":"مجلس، شرط، غبن، تدليس، عيب، خُلف في الصفة، خُلف في قدر الثمن","w":["ثلاثة: خيار المجلس، وخيار الشرط، وخيار العيب فقط","سبعة: خيار المجلس، والشرط، والرؤية، والتعيين، والعيب، والنقد، والقبول","خمسة: خيار المجلس، والشرط، والغبن، والعيب، والإقالة"]},{"id":"v10719","b":"البيوع","q":"فيمَ يجري الربا؟ وما الذي لا يجري فيه؟","a":"يجري الربا في كل مكيل وموزون ولو لم يؤكل؛ فالمكيل كسائر الحبوب، ومن الثمار كالتمر والزبيب، والموزون كالذهب والفضة والنحاس والحديد. وما عدا ذلك فمعدود لا يجري فيه الربا ولو مطعوماً، كالبطيخ والخيار والبيض والرمان.","m":1,"ex":"العبرة بالكيل والوزن لا بكون الشيء طعاماً. فالحديد يجري فيه الربا لأنه موزون، والبيض لا يجري فيه لأنه معدود.","ca":"في كل مكيل وموزون ولو لم يؤكل، لا في المعدود ولو مطعوماً كالبطيخ والبيض","w":["في كل مطعوم فقط، كالبيض والبطيخ، لا في الحديد والنحاس","في الذهب والفضة فقط، دون الحبوب والثمار","في كل مكيل وموزون ومعدود، بشرط أن يكون مأكولاً"]},{"id":"v10840","b":"البيوع","q":"ما حكم بيع الربوي بغير جنسه كذهب بفضة؟ وما حكم بيع المكيل بالموزون كبُرّ بذهب؟","a":"إذا بيع بغير جنسه كذهب بفضة، وبُرّ بشعير، صحّ بشرط القبض قبل التفرق، وجاز التفاضل. وإن بيع المكيل بالموزون كبُرّ بذهب جاز التفاضل والتفرق قبل القبض.","m":1,"ex":"المماثلة تُشترط في الجنس الواحد فقط، فإذا اختلف الجنس جازت الزيادة، كبيع كيلو ذهب بمئة كيلو فضة، لكن لا بد من التقابض في المجلس. وإذا كان أحدهما مكيلاً والآخر موزوناً سقط الشرطان.","ca":"بغير جنسه: يجوز التفاضل ويُشترط القبض قبل التفرق؛ المكيل بالموزون: يجوز التفاضل والتفرق قبل القبض","w":["بغير جنسه: تُشترط المماثلة والقبض؛ المكيل بالموزون: يُشترط القبض فقط","بغير جنسه: يجوز التفاضل والتفرق قبل القبض؛ المكيل بالموزون: تُشترط المماثلة","بغير جنسه: لا يصح البيع أصلاً؛ المكيل بالموزون: يجوز التفاضل ويُشترط القبض"]},{"id":"s154","b":"النكاح وما يتبعه","q":"متى يسن ويجب ويحرم النكاح؟","a":"يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","m":1,"ex":"حكم النكاح يدور مع حال الشخص: من يخاف الزنا يجب عليه، وذو الشهوة الذي لا يخافه يسن له، ومن لا شهوة له يباح له، ويحرم في دار الحرب لغير ضرورة. احفظ التدرج: يخاف ← يجب، يشتهي ← يسن، لا يشتهي ← يباح.","w":["يجب لذي شهوة لا يخاف الزنا، ويسن لمن يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويكره لمن لا شهوة له، ويباح بدار الحرب","يسن لكل أحد، ويجب على من يخاف الزنا، ويحرم على من لا شهوة له"]},{"id":"s155","b":"النكاح وما يتبعه","q":"ما حكم نظر الرجل للمرأة لخطبة، شهادة، أو مداواة؟","a":"المخطوبة: يجوز للوجه والرقبة واليد والقدم. الشهادة أو المعاملة: يجوز لوجهها، وكذا كفيها لحاجة. المداواة: يجوز إلى المواضع التي يحتاج إليها","m":1,"ex":"النظر يُقدّر بقدر الحاجة: للمخطوبة أوسع (الوجه، والرقبة، واليد، والقدم) لأنه يريد الزواج بها. وللشهادة أو المعاملة الوجه، والكفان عند الحاجة. وللمداواة ما تدعو إليه الحاجة فقط.","w":["المخطوبة: الوجه والكفان فقط. الشهادة والمعاملة: الوجه والرقبة واليد والقدم. المداواة: مواضع الحاجة","المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: لا يجوز النظر. المداواة: الوجه فقط","المخطوبة: جميع ما يظهر غالباً والشعر. الشهادة والمعاملة: الوجه. المداواة: لا يجوز إلا للمحارم"],"ca":"المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: الوجه والكفان لحاجة. المداواة: مواضع الحاجة"},{"id":"s156","b":"النكاح وما يتبعه","q":"ما هما ركنا النكاح؟","a":"الإيجاب، والقبول، مرتبين","m":1,"ex":"للنكاح ركنان: الإيجاب، وهو لفظ الولي أو من يقوم مقامه (زوّجتك)، ثم القبول، وهو لفظ الزوج أو من يقوم مقامه (قبلت). ويجب أن يكونا مرتبين: الإيجاب أولاً ثم القبول.","w":["الولي، والشهادة","الإيجاب، والقبول، والمهر","الإيجاب، والقبول، ولو تقدم القبول"]},{"id":"s157","b":"النكاح وما يتبعه","q":"اذكر شروط النكاح الخمسة؟","a":"تعيين الزوجين، ورضى الزوج المكلف والزوجة الحرة العاقلة الثيب التي تم لها تسع، والولي، والشهادة، وخلو الزوجين من الموانع","m":1,"ex":"خمسة شروط كأنها أسئلة: من هما؟ (تعيين الزوجين). هل رضيا؟ (الرضى). من يعقد؟ (الولي). من يشهد؟ (الشهادة). هل يحل أحدهما للآخر؟ (خلوّهما من الموانع).","w":["تعيين الزوجين، ورضاهما، والولي، والشهادة، والمهر","الإيجاب، والقبول، والولي، والشهادة، والكفاءة","تعيين الزوجين، والولي، والشهادة، والإعلان، وخلو الزوجين من الموانع"],"ca":"تعيين الزوجين، ورضاهما، والولي، والشهادة، وخلو الزوجين من الموانع"},{"id":"s158","b":"النكاح وما يتبعه","q":"متى يسقط المهر (الصداق) كاملاً قبل الدخول؟","a":"بفرقة اللعان، وبفسخه لعيبها، وبفرقة من قبلها (كفسخها لعيبه، وإسلامها تحت كافر، وردتها تحت مسلم، ورضاعها من ينفسخ به نكاحها)","m":1,"ex":"القاعدة: إذا وقعت الفرقة قبل الدخول بسبب من جهتها سقط المهر كله: كفسخه لعيب فيها، أو فسخها لعيبه، أو إسلامها تحت كافر، أو ردتها تحت مسلم، أو إرضاعها من ينفسخ به نكاحها. ويسقط كذلك بفرقة اللعان.","w":["بطلاقه لها، وبخلعه، وبموت أحدهما قبل الدخول","بفرقة اللعان، وبكل فرقة من قبله كطلاقه وردته وإسلامه","بالخلوة بها، وبتقبيلها، وبفسخها لعيبه"],"ca":"بفرقة اللعان، وبفسخه لعيبها، وبكل فرقة من قبلها كفسخها لعيبه وإسلامها أو ردتها وإرضاعها"},{"id":"s159","b":"النكاح وما يتبعه","q":"متى يجب المهر كاملاً؟","a":"موت أحدهما، ووطؤه ولمسه لها، ونظره إلى فرجها لشهوة، وتقبيلها ولو بحضرة الناس، وطلاقها في مرض موت ترث فيه، وخلوته بها عن مميز إن كان يطأ مثله ويوطأ مثلها","m":1,"mn":"موت، وطء ولمس، نظر، تقبيل، طلاق مرض، خلوة","ex":"يتقرر المهر كاملاً بأمور ترجع إلى ثلاثة: انتهاء النكاح بالموت. والاستمتاع ولو بلا وطء: الوطء، واللمس، والنظر إلى فرجها لشهوة، والتقبيل. والخلوة بها بعيداً عن مميز، أو طلاقها في مرض موت ترث فيه.","w":["موت أحدهما، والوطء، والعقد وحده، والطلاق قبل الدخول، وفرقة اللعان","الوطء فقط، دون الخلوة أو التقبيل أو الموت قبل الدخول","موت أحدهما، والوطء، والخلوة، وفسخها لعيبه، وإسلامها تحت كافر"],"ca":"موت أحدهما، والوطء، واللمس والنظر إلى فرجها لشهوة، والتقبيل، وطلاقها في مرض موت ترث فيه، والخلوة بها"},{"id":"s160","b":"النكاح وما يتبعه","q":"ما حكم وليمة العرس والإجابة إليها؟","a":"الوليمة سنة مؤكدة. الإجابة: في المرة الأولى واجبة (إن كان لا عذر ولا منكر)، وفي الثانية سنة، وفي الثالثة مكروهة","m":1,"ex":"الوليمة نفسها سنة مؤكدة. أما إجابة الدعوة فيتدرج حكمها مع التكرار: المرة الأولى واجبة (إن لم يكن عذر ولا منكر)، والثانية سنة، والثالثة مكروهة. احفظ: واجب ← سنة ← مكروه.","w":["الوليمة واجبة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة مكروهة","الوليمة سنة مؤكدة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة محرمة","الوليمة سنة مؤكدة. الإجابة: واجبة في المرات الثلاث إن لم يكن عذر ولا منكر"]},{"id":"s161","b":"النكاح وما يتبعه","q":"إن دُعي لاثنتين في نفس الوقت، لمن يجيب؟","a":"يجيب الكل إن أمكنه، وإلا أجاب: الأسبق قولاً، فالأدين، فالأقرب رحماً فجواراً، ثم يقرع","m":1,"ex":"إن أمكنه حضور الجميع حضر. وإلا قدّم بالترتيب: الأسبق دعوةً، ثم الأكثر ديناً، ثم الأقرب رحماً، ثم الأقرب جواراً، ثم القرعة. احفظ: سَبْق ← دين ← رحم ← جوار ← قرعة.","w":["يجيب الأقرب جواراً، فالأسبق قولاً، فالأدين، ثم يقرع","يجيب الأدين، فالأقرب رحماً، فالأسبق قولاً، ثم يقرع","يجيب الأغنى، فالأسبق قولاً، فالأقرب رحماً، ثم يقرع"]},{"id":"s162","b":"النكاح وما يتبعه","q":"ما حكم استرضاع المرأة الفاجرة أو الكافرة؟","a":"يكره (وكذا سيئة الخلق والجذماء والبرصاء)","m":1,"ex":"يُكره أن يُسترضع للطفل من فيها صفة سيئة أو مرض منفّر، وهي خمس: الفاجرة، والكافرة، وسيئة الخلق، والجذماء، والبرصاء. والحكم كراهة لا تحريم.","w":["يحرم (وكذا سيئة الخلق والجذماء والبرصاء)","يباح (ويكره استرضاع الجذماء والبرصاء فقط)","يكره للفاجرة فقط، ويباح للكافرة"]},{"id":"s163","b":"النكاح وما يتبعه","q":"ما حكم من أوقع الخلع بلفظ \"الطلاق\" دون لفظ الخلع؟","a":"لا يكون خلعاً؛ لأن من شروطه: أن لا يقع بلفظ الطلاق بل بصيغته الموضوعة له، وأن لا ينوي به الطلاق (فيقع طلاقاً)","m":1,"ex":"للخلع صيغة خاصة به مثل: خلعتُ، وفاديتُ. فإن استعمل لفظ الطلاق، أو نوى بالخلع الطلاق، وقع طلاقاً لا خلعاً. احفظ: لفظ الطلاق أو نيته ← طلاق، لفظ الخلع بلا نية طلاق ← خلع.","w":["يكون خلعاً؛ لأن العبرة بالعوض لا باللفظ، فيقع خلعاً ولو بلفظ الطلاق","لا يقع شيء؛ لأن الخلع لا يصح إلا بلفظه فيبطل العقد","يكون خلعاً إن نوى به الخلع، ولا يقع طلاقاً إلا إذا نوى الطلاق"]},{"id":"s164","b":"النكاح وما يتبعه","q":"ماذا يجب على الزوج من النفقة؟ ولمن تجب غير الزوجة المستقرة؟","a":"ما لا غنى لزوجته عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز الحامل، والمتوفى عنها زوجها حاملاً","m":1,"ex":"على الزوج كفاية زوجته بالمعروف: طعام، وشراب، ولباس، وسكن. وتستمر النفقة للرجعية مطلقاً لأنها ما زالت في حكم الزوجة. أما البائن والناشز والمتوفى عنها زوجها فلا نفقة لهن إلا إذا كنّ حوامل.","w":["ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للبائن والناشز مطلقاً، وللرجعية الحامل فقط","المأكل والمشرب فقط دون المسكن. وتجب للرجعية مطلقاً، وللبائن الحامل، ولا تجب للمتوفى عنها ولو حاملاً","ما لا غنى لها عنه بالمعروف. وتجب للرجعية والبائن والناشز والمتوفى عنها مطلقاً ولو غير حوامل"],"ca":"ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز والمتوفى عنها إن كن حوامل"},{"id":"s165","b":"النكاح وما يتبعه","q":"متى تجب النفقة على الأقارب؟","a":"بثلاثة شروط: أن يكونوا فقراء لا مال لهم ولا كسب، وأن يكون المنفق غنياً بماله أو كسبه فاضلاً عن قوته وقوت زوجته ورقيقه، وأن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فتجب مطلقاً","m":1,"ex":"ثلاثة شروط تربط الطرفين: المنفَق عليه محتاج (لا مال له ولا كسب). والمنفِق قادر (غني بماله أو كسبه، فاضلاً عن قوته وقوت زوجته ورقيقه). وصلة الإرث (يرثه بفرض أو تعصيب)، إلا الأصول والفروع فتجب لهم مطلقاً.","w":["ثلاثة: فقرهم ولو كان لهم كسب، وغنى المنفق، وكونه وارثاً لهم بفرض فقط، ولا يستثنى أحد","شرطان: فقرهم بلا مال ولا كسب، وغنى المنفق؛ وتجب لكل قريب ولو لم يكن وارثاً","ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق، واتحاد الدين؛ ولا تجب للأصول والفروع إلا بالإرث"],"ca":"ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق فاضلاً عن قوته وقوت عياله، وكونه وارثاً لهم، إلا الأصول والفروع فمطلقاً"},{"id":"s166","b":"النكاح وما يتبعه","q":"ما الأشياء التي يحرم فعلها مع البهيمة؟","a":"لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، ووسمها فيه، وذبحها إن كانت لا تؤكل","m":1,"mn":"لعن، حمل، حلب، ضرب، وسم، ذبح","ex":"ستة يجمعها الرفق بالحيوان: بالقول (لعنها). وبالعمل (تحميلها ما يشق عليها، وحلبها بما يضر ولدها). وبالوجه (ضربها فيه، ووسمها فيه). وبالروح (ذبحها إن كانت لا تؤكل).","w":["لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وركوبها، ووسمها في غير الوجه، وذبحها للأكل","ضربها في وجهها، ووسمها فيه، وحلبها مطلقاً، وبيعها، وذبحها إن كانت تؤكل","لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، وخصاؤها، وإطعامها ما لا تشتهي"]},{"id":"v10977","b":"النكاح وما يتبعه","q":"ما الصفات التي يُسنّ أن تكون في المرأة التي يريد نكاحها؟","a":"يُسنّ نكاح: ذات الدين، الولود، البكر، الحسيبة، الأجنبية.","m":1,"ex":"هذه صفات مستحبة عند اختيار الزوجة. والحسيبة: ذات الأصل الطيب، والأجنبية: غير القريبة.","mn":"دين + ولود + بكر + حسيبة + أجنبية","w":["ذات المال، الجميلة، الثيب، القريبة، العاملة","ذات الدين، العقيم، الثيب، الحسيبة، القريبة","ذات النسب، البكر، الغنية، ذات القرابة، الكبيرة سناً"]},{"id":"v11228","b":"النكاح وما يتبعه","q":"ما الشروط التي تُشترط في وليّ النكاح؟","a":"سبعة: الذكورية، والعقل، والبلوغ، والحرية، واتفاق الدين، والعدالة ولو ظاهرة، والرشد وهو معرفة الكفء ومصالح النكاح","m":1,"ex":"الولي هو الشرط الثالث من شروط النكاح، ولا يصح أن يكون وليّاً إلا من اجتمعت فيه هذه الصفات السبع. والرشد هنا معناه أن يعرف الكفء ويعرف مصالح النكاح، والعدالة تكفي فيها العدالة الظاهرة.","ca":"ذكورية، عقل، بلوغ، حرية، اتفاق دين، عدالة، رشد","mn":"«ذَعْبٌ حِدْعَر»: ذكورية، عقل، بلوغ، حرية، دين، عدالة، رشد","w":["خمسة: الإسلام، والبلوغ، والعقل، والحرية، والغنى","ستة: الذكورية، والبلوغ، والعقل، والعدالة، والاجتهاد، والغنى","ثلاثة: البلوغ، والعقل، والإسلام، ويصح من الأنثى"]},{"id":"v11228b","b":"النكاح وما يتبعه","q":"مَن أحقّ الناس بتزويج المرأة الحرة؟ رتّبهم.","a":"أبوها وإن علا، فابنها وإن نزل، فالأخ الشقيق، فالأخ للأب، ثم الأقرب فالأقرب كالإرث، ثم السلطان أو نائبه","m":1,"ex":"الولاية مرتبة: يُقدَّم الأب ثم الجد وإن علا، ثم الابن وابنه وإن نزل، ثم الإخوة، ثم بقية العصبة على ترتيب الإرث. فإن لم يوجد أحد منهم زوّجها السلطان أو نائبه.","ca":"الأب وإن علا، فالابن وإن نزل، فالأخ الشقيق، فالأخ لأب، ثم الأقرب كالإرث، ثم السلطان","w":["ابنها، ثم أبوها، ثم الأخ الشقيق، ثم السلطان","أبوها، ثم الأخ الشقيق، ثم ابنها، ثم العم، ثم السلطان","أمها، ثم أبوها، ثم أخوها، ثم القاضي"]},{"id":"v11305","b":"النكاح وما يتبعه","q":"اذكر المحرّمات في النكاح أبداً بالنسب. وما الذي يحرم بالرضاع؟","a":"تحرم أبداً: الأم، والجدة من كل جهة، والبنت ولو من زنا، وبنت الولد، والأخت من كل جهة، وبنتها وبنت ولدها، وبنت كل أخ وبنت ولده، والعمة، والخالة. ويحرم بالرضاع ما يحرم بالنسب","m":1,"ex":"هؤلاء محرمات على التأبيد بسبب النسب: الأصول، والفروع، وفروع الأبوين، والعمات والخالات. والرضاع يُحرِّم مثل ما يحرّمه النسب، فالأم من الرضاع والأخت من الرضاع كالأم والأخت من النسب.","ca":"الأم والجدة، والبنت وبنت الولد، والأخت وبنتها، وبنت الأخ، والعمة والخالة؛ ويحرم بالرضاع ما يحرم بالنسب","mn":"أصوله، وفروعه، وفروع أبويه، والعمة والخالة","w":["الأم، والبنت، والأخت فقط؛ ولا يحرم بالرضاع إلا الأم المرضعة","الأم، والجدة، والبنت، والأخت، والعمة، والخالة، وبنت العم، وبنت الخال","الأم، والبنت، والأخت الشقيقة فقط؛ ويحرم بالرضاع نصف ما يحرم بالنسب"]},{"id":"v11333","b":"النكاح وما يتبعه","q":"كم المحرّمات أبداً بالمصاهرة؟ وأيّها يحرم بمجرد العقد؟","a":"أربع، ثلاث بمجرد العقد: زوجة أبيه وإن علا، وزوجة ابنه وإن سفل، وأم زوجته. والرابعة: بنت زوجته وبنت ابنها، لا تحرم إلا إن وطئ الزوجة","m":1,"ex":"المصاهرة قرابة سببها الزواج. فبمجرد عقده على امرأة تحرم عليه أمها أبداً، وتحرم عليه زوجة أبيه وزوجة ابنه. أما بنت الزوجة (الربيبة) فلا تحرم إلا إذا دخل بأمها ووطئها.","ca":"أربع؛ ثلاث بمجرد العقد: زوجة الأب، وزوجة الابن، وأم الزوجة؛ وبنت الزوجة بالوطء","w":["ثلاث، كلها لا تحرم إلا بالوطء: أم الزوجة، وبنتها، وأختها","أربع، كلها بمجرد العقد: زوجة الأب، وزوجة الابن، وأم الزوجة، وبنت الزوجة","اثنتان: أم الزوجة وبنتها، وتحرمان بمجرد العقد"]},{"id":"v11356","b":"النكاح وما يتبعه","q":"ما حكم الجمع بين الأختين، وبين المرأة وعمتها أو خالتها؟ وكم يجوز للحر والعبد أن يجمع من الزوجات؟","a":"يحرم الجمع بين الأختين، وبين المرأة وعمتها أو خالتها. وليس للحر جمع أكثر من أربع، ولا للعبد أكثر من ثنتين، ولمن نصفه حر فأكثر جمع ثلاث","m":1,"ex":"هؤلاء لا يحرمن على التأبيد بل إلى أمد: فإذا فارق إحداهن وانقضت عدتها جاز له نكاح الأخرى. وعدد الزوجات محدود: أربع للحر، واثنتان للعبد، وثلاث لمن نصفه حر فأكثر.","ca":"يحرم؛ وللحر أربع، وللعبد اثنتان، ولمن نصفه حر ثلاث","w":["يجوز الجمع بينهن؛ وللحر أربع وللعبد أربع","يكره الجمع ولا يحرم؛ وللحر أربع وللعبد ثلاث","يحرم الجمع بين الأختين فقط؛ وللحر ثلاث وللعبد اثنتان"]},{"id":"v11376","b":"النكاح وما يتبعه","q":"ما حكم تسمية الصداق في العقد؟ وما أقلّه؟ وما الحكم إن لم يُسمَّ أو سُمّي شيء فاسد كالخمر؟","a":"تُسنّ تسميته في العقد، ويصح بأقلّ متموَّل. فإن لم يُسمَّ أو سُمّي فاسداً صحّ العقد ووجب مهر المثل","m":1,"ex":"الصداق هو المهر. يُستحب أن يُذكر في العقد، ويصح بأي شيء له قيمة مالية ولو قليلاً. وإذا لم يُذكر أو ذُكر شيء لا يصح كالخمر والخنزير فالعقد صحيح، ولها مهر مثلها.","ca":"تُسنّ، ويصح بأقل متموّل؛ فإن لم يُسمَّ أو سُمّي فاسداً صح العقد ووجب مهر المثل","w":["تجب تسميته، فإن لم يُسمَّ بطل العقد","تُسنّ تسميته، وأقله ربع دينار، فإن سُمّي فاسداً بطل العقد","تُكره تسميته، وإن سُمّي فاسداً فلا مهر لها"]},{"id":"v11441","b":"النكاح وما يتبعه","q":"مَن الذي بيده عقدة النكاح؟","a":"الزوج","m":1,"ex":"إذا طلّق الزوج قبل الدخول فللمرأة نصف المهر، فإن كان أقبضها الصداق رجع عليها بنصفه. وأيّ الزوجين عفا لصاحبه عمّا وجب له من المهر وهو جائز التصرف بَرِئ منه صاحبه.","w":["وليّ المرأة","الزوجة","القاضي"]},{"id":"v11524","b":"النكاح وما يتبعه","q":"متى يتنصّف الصداق؟","a":"يتنصّف قبل الدخول بالفرقة من قِبَل الزوج كطلاقه وخلعه وإسلامه وردّته، وبملك أحدهما الآخر، أو بالفرقة من قِبَل أجنبي كرضاع ونحوه","m":1,"ex":"إذا حصلت الفرقة قبل الدخول وكان سببها الزوج أو شخص أجنبي، فللزوجة نصف المهر. أما إن كانت الفرقة من قِبَلها فيسقط كله، وبالموت أو الدخول يستقر كاملاً.","ca":"قبل الدخول بالفرقة من قِبَل الزوج (طلاق، خلع، إسلام، ردة)، أو بملك أحدهما الآخر، أو من قِبَل أجنبي","w":["بالفرقة من قِبَل الزوجة كفسخها لعيبه وردّتها","بفرقة اللعان وبفسخه لعيبها","بموت أحدهما قبل الدخول"]},{"id":"v11606","b":"النكاح وما يتبعه","q":"متى تجب إجابة الدعوة إلى وليمة العرس؟ (صفة الداعي)","a":"إنما تجب إذا كان الداعي مسلماً، يحرم هجره، وكسبه طيب","m":1,"ex":"إجابة وليمة العرس في المرة الأولى واجبة، لكن بشرط أن يكون الداعي مسلماً لا يجوز هجره، ومكسبه حلال. فإن كان في ماله حرام كُرهت إجابته ومعاملته وقبول هديته.","w":["إذا كان الداعي قريباً أو جاراً","إذا كان الداعي غنياً ودعاه ثلاث مرات","تجب لكل داعٍ ولو كان كافراً أو كسبه حراماً"]},{"id":"v11670","b":"النكاح وما يتبعه","q":"ما هي آداب الأكل المستحبة؟","a":"يستحب غسل اليدين قبل الطعام وبعده. ويُسنّ: التسمية جهراً على الطعام والشراب، وأن يجلس على رجله اليسرى وينصب اليمنى أو يتربّع، ويأكل بيمينه بثلاث أصابع مما يليه، ويُصغّر اللقمة، ويُطيل المضغ، ويمسح الصحفة، ويأكل ما تناثر، ويغضّ طرفه عن جليسه، ويؤثر المحتاج،
