<title>بطاقات الفقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5A6660; --line:#DDE1DC;
  --accent:#145C49; --accent-ink:#FFFFFF; --soft:#E5EEEA; --bad:#A13A2C; --bad-soft:#F6E6E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
    --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
  --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{flex:1;display:grid;align-content:center;gap:14px}
.pick h1{margin:0 0 6px;font-size:1.5rem}
.pick button{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;text-align:right}
.pick button:hover{border-color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--ink)}
.bar .sw{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tag{align-self:flex-start;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}
.tag.again{background:var(--bad-soft);color:var(--bad)}
.q{font-size:1.28rem;font-weight:700;line-height:1.7;margin:0;text-wrap:pretty}
.a{border-top:1px solid var(--line);padding-top:14px;font-family:"Noto Naskh Arabic",serif;font-size:1.18rem;line-height:2;white-space:pre-line}
.x{font-size:.95rem;color:var(--muted);line-height:1.9;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.acts button{padding:16px;border-radius:10px;font-size:1.1rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.acts .show{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts .no{color:var(--bad);border-color:var(--bad)}
.acts .yes{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.done{flex:1;display:grid;align-content:center;gap:10px;text-align:center}
.done h2{margin:0;font-size:1.4rem}
.done p{margin:0;color:var(--muted);line-height:1.8}
.done button{justify-self:center;padding:12px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const CARDS=[{"id":"q8","q":"ما شروط المسح على الجبيرة؟","a":"إن وضعها على طهارة، ولم تتجاوز المحل: غسل الصحيح، ومسح عليها بالماء: وأجزأ. وإلا: وجب مع الغسل أن يتيمم لها. ولا مسح ما لم توضع على طهارة وتتجاوز المحل: فيغسل، ويمسح، ويتيمم","x":"","m":0,"d":0,"p":0},{"id":"q219","q":"متى يُمسح على الجبيرة؟ وماذا يجب إن وُضعت على غير طهارة أو تجاوزت محل الحاجة؟","a":"إن وضعها على طهارة، ولم تتجاوز المحل: غسل الصحيح، ومسح عليها بالماء: وأجزأ. وإلا: وجب مع الغسل أن يتيمم لها. ولا مسح ما لم توضع على طهارة وتتجاوز المحل: فيغسل، ويمسح، ويتيمم","x":"","m":0,"d":0,"p":0},{"id":"q222","q":"ما الفرق بين الفرض والواجب والسنة في الصلاة؟ مثّل لكل واحد.","a":"أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان واجباتها ثمانية، تبطل الصلاة بتركها عمداً، وتسقط سهواً وجهلاً","x":"","m":0,"d":0,"p":0},{"id":"q224","q":"متى يجب سجود السهو؟ وهل يكون قبل السلام أو بعده؟","a":"ويجب: إذا زاد ركوعاً أو سجوداً أو قياماً أو قعوداً ولو قدر جلسة الاستراحة، أو سلم قبل إتمامها، أو لحن لحناً يحيل المعنى، أو ترك واجباً، أو شك في زيادة وقت فعلها إن شاء سجد سجدتي السهو قبل السلام أو بعده، لكن إن سجدهما بعده تشهد وجوباً وسلم","x":"","m":0,"d":0,"p":0},{"id":"q225","q":"بيّن حكم من ترك التشهد الأول ناسياً في ثلاث حالات.","a":"إن نهض عن ترك التشهد الأول ناسياً: فإن ذكره قبل أن يستتم قائماً لزمه الرجوع، وكره إن استتم قائماً، ولا يرجع إن شرع في القراءة، ويلزم المأموم متابعته","x":"","m":0,"d":0,"p":0},{"id":"q230","q":"ما حكم الشهيد في المعركة من جهة الغسل والتكفين والصلاة؟","a":"شهيد المعركة والمقتول ظلما لا يغسل ولا يكفن ولا يصلى عليه ويجب بقاء دمه عليه ودفنه في ثيابه","x":"","m":0,"d":0,"p":0},{"id":"q238","q":"بم يثبت دخول شهر رمضان؟","a":"تثبت رؤية هلاله بخبر مسلم مكلف عدل ولو عبداً أو أنثى، ولا يقبل في بقية الشهور إلا رجلان عدلان","x":"","m":0,"d":0,"p":0},{"id":"q239","q":"اذكر أركان الحج الأربعة، وما حكم من ترك ركناً أو واجباً أو سنة؟","a":"أركان الحج أربعة: الإحرام، وهو مجرد النية، فمن تركه لم ينعقد حجه. والوقوف بعرفة. وطواف الإفاضة. والسعي بين الصفا والمروة من ترك ركنا لم يتم حجه إلا به ومن ترك واجبا فعليه دم وحجه صحيح ومن ترك مسنونا فلا شيء عليه","x":"","m":0,"d":0,"p":0},{"id":"q244","q":"ما وقت الأضحية؟ وعن كم تجزئ الشاة والبدنة؟","a":"أول وقت الذبح من بعد أسبق صلاة عيد بالبلد، أو قدرها لمن لم يصل، ويستمر وقت الذبح نهاراً وليلاً إلى آخر ثاني أيام التشريق تجزئ الشاة عن الواحد وعن أهل بيته وعياله، وتجزئ البدنة والبقرة عن سبعة","x":"","m":0,"d":0,"p":0},{"id":"f37","q":"عدد سنن الوضوء ........ (بالعدد)","a":"ثمانية عشر","x":"","m":0,"d":0,"p":0},{"id":"f41","q":"أقل الحيض ........ وأكثره ........ وغالبه ........ (بالزمن)","a":"يوم وليلة، خمسة عشر يوماً، ست أو سبع","x":"","m":0,"d":0,"p":0},{"id":"f42","q":"أقل الطهر بين الحيضتين ........ يوماً","a":"ثلاثة عشر","x":"","m":0,"d":0,"p":0},{"id":"f43","q":"يُغسل المتنجس بالكلب ........ غسلات إحداهن بـ ........","a":"سبع، التراب","x":"","m":0,"d":0,"p":0},{"id":"f47","q":"من شكّ في عدد الركعات بنى على ........ ويسجد للسهو","a":"اليقين وهو الأقل","x":"","m":0,"d":0,"p":0},{"id":"f50","q":"مسافة القصر ........ فرسخاً","a":"ستة عشر","x":"","m":0,"d":0,"p":0},{"id":"f53","q":"تكبيرات العيد الزوائد ........ في الأولى و ........ في الثانية","a":"ست، خمس","x":"","m":0,"d":0,"p":0},{"id":"f55","q":"عدد ركعات التراويح في المذهب ........ وأكثر الوتر ........","a":"عشرون، إحدى عشرة","x":"","m":0,"d":0,"p":0},{"id":"f57","q":"كفن الرجل ........ لفائف وكفن المرأة ........ أثواب","a":"ثلاث، خمسة","x":"","m":0,"d":0,"p":0},{"id":"f60","q":"يُصلّى على السقط إذا بلغ ........ أشهر","a":"أربعة","x":"","m":0,"d":0,"p":0},{"id":"f76","q":"من ترك ركناً من الحج ........ ومن ترك واجباً ........ ومن ترك سنة ........","a":"لم يتم حجه، فعليه دم، فلا شيء عليه","x":"","m":0,"d":0,"p":0},{"id":"f78","q":"وقت الأضحية من ........ إلى ........","a":"بعد أسبق صلاة عيد بالبلد، d":"t120","q":"الماء الطاهر يرفع الحدث ولا يزيل الخبث.  (صح أم خطأ؟)","a":"خطأ","x":"«الطاهر يجوز استعماله في غير رفع الحدث وزوال الخبث، وهو ما تغير كثير من لونه أو طعمه أو ريحه بشيء طاهر»","m":0,"d":0,"p":0},{"id":"t121","q":"ماء زمزم يُكره استعماله في إزالة النجاسة.  (صح أم خطأ؟)","a":"صح","x":"«لا يكره ماء زمزم إلا في إزالة الخبث»","m":0,"d":0,"p":0},{"id":"t122","q":"الماء الكثير قلتان تقريباً.  (صح أم خطأ؟)","a":"صح","x":"«والكثير: قلتان تقريباً، واليسير: ما دونهما»","m":0,"d":0,"p":0},{"id":"t123","q":"يجزئ في الاستجمار مسحتان منقيتان.  (صح أم خطأ؟)","a":"خطأ","x":"«لا يجزئ أقل من ثلاث مسحات»","m":0,"d":0,"p":0},{"id":"t124","q":"يُغسل المتنجس بنجاسة الكلب سبع غسلات إحداهن بالتراب.  (صح أم خطأ؟)","a":"صح","x":"«سبع غسلات وأن تكون إحداها بتراب طاهر طهور أو صابون ونحوه في متنجس بكلب أو خنزير»","m":0,"d":0,"p":0},{"id":"t125","q":"بول الغلام الذي لم يأكل الطعام يُجزئ فيه النضح.  (صح أم خطأ؟)","a":"صح","x":"«يجزئ في بول غلام لم يأكل طعاما لشهوة نضحه، وهو غمره بالماء»","m":0,"d":0,"p":0},{"id":"t126","q":"يضرّ بقاء لون النجاسة بعد غسلها إذا عجز عن إزالته.  (صح أم خطأ؟)","a":"خطأ","x":"«يضر بقاء طعم النجاسة، لا لونها أو ريحها أو هما عجزا»","m":0,"d":0,"p":0},{"id":"t127","q":"لا حيض قبل تمام تسع سنين ولا بعد خمسين.  (صح أم خطأ؟)","a":"صح","x":"«لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة»","m":0,"d":0,"p":0},{"id":"t128","q":"أكثر الحيض خمسة عشر يوماً.  (صح أم خطأ؟)","a":"صح","x":"«أقل الحيض يوم وليلة، وأكثره خمسة عشر يوما، وغالبه ست أو سبع»","m":0,"d":0,"p":0},{"id":"t129","q":"يباح للحائض بعد انقطاع الدم وقبل الغسل الصوم والطلاق.  (صح أم خطأ؟)","a":"صح","x":"«ويباح بعد انقطاعه وقبل غسلها: الصوم، والطلاق، واللبث بوضوء في المسجد»","m":0,"d":0,"p":0},{"id":"t133","q":"يصح أذان الفجر بعد نصف الليل.  (صح أم خطأ؟)","a":"صح","x":"«لا يصحان إلا مرتبين، متواليين عرفاً... وشرط كون المؤذن: مسلماً، ذكراً، عاقلاً، مميزاً، ناطقاً، عدلاً ولو ظاهراً. ولا يصحان قبل الوقت، إلا أذان الفجر فيصح بعد نصف الليل»","m":0,"d":0,"p":0},{"id":"t135","q":"يُشترط لصحة الفرض ستر أحد العاتقين للرجل.  (صح أم خطأ؟)","a":"صح","x":"«فعورة: الذكر البالغ عشراً، والحرة المميزة، والأمة - ولو مبعضة -: ما بين السرة والركبة. وعورة ابن سبع إلى عشر: الفرجان. والحرة البالغة: كلها عورة - في الصلاة - إلا وجهها. وشرط في فرض الرجل البالغ: ستر أحد عاتقيه بشيء من اللباس»","m":0,"d":0,"p":0},{"id":"t136","q":"عورة الحرة البالغة في الصلاة كلها إلا وجهها.  (صح أم خطأ؟)","a":"صح","x":"«فعورة: الذكر البالغ عشراً، والحرة المميزة، والأمة - ولو مبعضة -: ما بين السرة والركبة. وعورة ابن سبع إلى عشر: الفرجان. والحرة البالغة: كلها عورة - في الصلاة - إلا وجهها. وشرط في فرض الرجل البالغ: ستر أحد عاتقيه بشيء من اللباس»","m":0,"d":0,"p":0},{"id":"t137","q":"من صلى في ثوب حرير عالماً ذاكراً صحّت صلاته مع الإثم.  (صح أم خطأ؟)","a":"خطأ","x":"«ومن صلى: في مغصوب، أو حرير. عالماً، ذاكراً: لم تصح»","m":0,"d":0,"p":0},{"id":"t138","q":"من لم يجد إلا ثوباً مغصوباً صلى فيه.  (صح أم خطأ؟)","a":"خطأ","x":"«ويصلي: عرياناً: مع غصب. وفي حرير؛ لعدم: ولا يعيد. وفي نجس؛ لعدم: ويعيد»","m":0,"d":0,"p":0},{"id":"t139","q":"يُدرك المصلي الوقت بتكبيرة الإحرام.  (صح أم خطأ؟)","a":"صح","x":"«يدرك الوقت بتكبيرة الإحرام في الوقت، فالضابط هو تكبيرة الإحرام»","m":0,"d":0,"p":0},{"id":"t140","q":"يسقط وجوب الترتيب في قضاء الفوائت بالنسيان وضيق الوقت.  (صح أم خطأ؟)","a":"صح","x":"«يسقط الترتيب بالنسيان، وبضيق الوقت ولو في وقت الاختيار»","m":0,"d":0,"p":0},{"id":"t142","q":"من ترك التشهد الأول ناسياً وشرع في القراءة حرم عليه الرجوع.  (صح أم خطأ؟)","a":"صح","x":"«إن نهض عن ترك التشهد الأول ناسياً: فإن ذكره قبل أن يستتم قائماً لزمه الرجوع، وكره إن استتم قائماً، ولا يرجع إن شرع في القراءة، ويلزم المأموم متابعته»","m":0,"d":0,"p":0},{"id":"t144","q":"يُشرع القنوت في الفرائض كلها.  (صح أم خطأ؟)","a":"خطأ","x":"«كره القنوت في غير الوتر»","m":0,"d":0,"p":0},{"id":"t145","q":"التراويح في المذهب عشرون ركعة.  (صح أم خطأ؟)","a":"صح","x":"«التراويح عشرون ركعة برمضان، ووقتها ما بين العشاء والوتر»","m":0,"d":0,"p":0},{"id":"t147","q":"سجود التلاوة سنة للقارئ والمستمع دون السامع.  (صح أم خطأ؟)","a":"صح","x":"«يسن سجود التلاوة مع قصر الفصل للقارئ والمستمع»","m":0,"d":0,"p":0},{"id":"t148","q":"تصح إمامة الصبي المميز بالبالغ في الفرض.  (صح أم خطأ؟)","a":"خطأ","x":"«لا تصح إمامة المرأة بالرجال ولا إمامة المميز بالبالغ في الفرض، وتصح إمامته في النفل وفي الفرض بمثله»","m":0,"d":0,"p":0},{"id":"t150","q":"يكره علو الإمام عن المأموم، ولا يكره عكسه.  (صح أم خطأ؟)","a":"صح","x":"«يكره علو الإمام عن المأموم، ولا يكره عكسه»","m":0,"d":0,"p":0},{"id":"t151","q":"تصح قدوة مصلي الظهر بمصلي العصر.  (صح أم خطأ؟)","a":"خطأ","x":"«تصح المقضية خلف الحاضرة وعكسه حيث تساوتا في الاسم»","m":0,"d":0,"p":0},{"id":"t153","q":"يقصر المسافر إذا فارق بيوت قريته العامرة.  (صح أم خطأ؟)","a":"صح","x":"«إذا فارق بيوت قريته العامرة»","m":0,"d":0,"p":0},{"id":"t154","q":"يجوز الجمع بين الظهر والعصر لأجل المطر.  (صح أم خطأ؟)","a":"خطأ","x":"«يباح الجمع بين الظهر والعصر والعشاءين بوقت إحداهما: بسفر القصر، ولمقيم مريض يلحقه بتركه مشقة، ولمرضع لمشقة كثرة النجاسة، ولعاجز عن الطهارة لكل صلاة، ولعذر أو شغل يبيح ترك الجمعة والجماعة» «ويختص بجواز جمع العشاءين، ولو صلى ببيته: ثلج. وجليد. ووحل. وريح: شديدة، باردة. ومطر: يبل الثياب، وتوجد معه مشقة»","m":0,"d":0,"p":0},{"id":"t155","q":"للخوف تأثير في عدد ركعات الصلاة.  (صح أم خطأ؟)","a":"خطأ","x":"«لا تأثير للخوف في تغيير عدد ركعات الصلاة، بل في صفتها وبعض شروطها»","m":0,"d":0,"p":0},{"id":"t157","q":"وقت الجمعة يبدأ من أول وقت العيد.  (صح أم خطأ؟)","a":"صح","x":"«يشترط لصحة الجمعة أربعة شروط: الوقت، وهو من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل. وأن تكون بقرية ولو من قصب يستوطنها أربعون استيطان إقامة. وحضور أربعين، فإن نقصوا قبل إتمامها استأنفوا ظهراً. وتقدم خطبتين»","m":0,"d":0,"p":0},{"id":"t158","q":"يحرم الكلام على من لا يسمع خطبة الجمعة.  (صح أم خطأ؟)","a":"خطأ","x":"«يحرم الكلام والإمام يخطب وهو منه بحيث يسمعه ويباح إذا سكت بينهما أو شرع في دعاء»","m":0,"d":0,"p":0},{"id":"t159","q":"صلاة العيد فرض كفاية.  (صح أم خطأ؟)","a":"صح","x":"«هي فرض كفاية»","m":0,"d":0,"p":0},{"id":"t160","q":"يُقرأ في صلاة العيد بـ(سبح) و(الغاشية).  (صح أم خطأ؟)","a":"صح","x":"«صلاة العيد ركعتان: يكبر في الأولى بعد تكبيرة الإحرام وقبل التعوذ ستاً، وفي الثانية قبل القراءة خمساً، يرفع يديه مع كل تكبيرة... ثم يقرأ جهراً الفاتحة، ثم سبح في الأولى، والغاشية في الثانية، فإذا سلم خطب خطبتين»","m":0,"d":0,"p":0},{"id":"t161","q":"صلاة الكسوف لها خطبة كالجمعة.  (صح أم خطأ؟)","a":"خطأ","x":"«هي سنة من غير خطبة»","m":0,"d":0,"p":0},{"id":"t162","q":"تُقضى صلاة الكسوف إذا فاتت.  (صح أم خطأ؟)","a":"خطأ","x":"«لا تقضى إن فاتت»","m":0,"d":0,"p":0},{"id":"t163","q":"في الاستسقاء يخطب الإمام قبل الصلاة.  (صح أم خطأ؟)","a":"خطأ","x":"«يصلي ثم يخطب خطبة واحدة»","m":0,"d":0,"p":0},{"id":"t164","q":"الشهيد في المعركة يُكفَّن ولا يُغسَّل.  (صح أم خطأ؟)","a":"خطأ","x":"«شهيد المعركة والمقتول ظلما لا يغسل ولا يكفن ولا يصلى عليه ويجب بقاء دمه عليه ودفنه في ثيابه»","m":0,"d":0,"p":0},{"id":"t165","q":"السقط إذا بلغ أربعة أشهر غُسِّل وصُلّي عليه.  (صح أم خطأ؟)","a":"صح","x":"«سقط لأربعة أشهر كالمولود حيا»","m":0,"d":0,"p":0},{"id":"t166","q":"يُكفَّن الرجل في خمسة أثواب.  (صح أم خطأ؟)","a":"خطأ","x":"«السنة تكفين الرجل في ثلاث لفائف بيض من قطن» «الأنثى في: خمسة أثواب بيض من قطن: إزار، وخمار، وقميص، ولفافتين»","m":0,"d":0,"p":0},{"id":"t168","q":"يحرم التكفين بالحرير والمذهّب.  (صح أم خطأ؟)","a":"صح","x":"«يحرم بجلد، وحرير، ومذهب»","m":0,"d":0,"p":0},{"id":"t170","q":"تجوز الصلاة على الميت بعد دفنه إلى شهر وشيء.  (صح أم خطأ؟)","a":"صح","x":"«يجوز أن يصلي على الميت من دفنه إلى شهر وشيء، ويحرم بعد ذلك»","m":0,"d":0,"p":0},{"id":"t171","q":"التعزية تُسنّ ثلاثة أيام.  (صح أم خطأ؟)","a":"صح","x":"«تسن تعزية المسلم إلى ثلاثة أيام»","m":0,"d":0,"p":0},{"id":"t172","q":"تجب الزكاة في مال الصبي والمجنون.  (صح أم خطأ؟)","a":"صح","x":"«نعم تجب في مال الصغير والمجنون»","m":0,"d":0,"p":0},{"id":"t176","q":"في الركاز الخمس ولو كان قليلاً.  (صح أم خطأ؟)","a":"صح","x":"«الركاز: وهو الكنز ولو كان قليلا ففيه الخمس»","m":0,"d":0,"p":0},{"id":"t178","q":"تجب زكاة الثمر إذا بدا صلاحه.  (صح أم خطأ؟)","a":"صح","x":"«شرطان: الأول: أن يبلغ نصاباً، وقدره بعد تصفية الحب وجفاف الثمر خمسة أوسق، وهي ثلاثمائة صاع. الثاني: أن يكون مالكاً للنصاب وقت وجوبها، فوقت الوجوب في الحب إذا اشتد، وفي الثمر إذا بدا صلاحها»","m":0,"d":0,"p":0},{"id":"t179","q":"يجوز تعجيل الزكاة لثلاثة أحوال.  (صح أم خطأ؟)","a":"خطأ","x":"«يصح تعجيل الزكاة لحولين فقط إذا كمل النصاب»","m":0,"d":0,"p":0},{"id":"t180","q":"تجزئ القيمة في الزكاة على المذهب.  (صح أم خطأ؟)","a":"خطأ","x":"«لا يجزئ إخراج القيمة في الزكاة مطلقا»","m":0,"d":0,"p":0},{"id":"t181","q":"تجب زكاة الفطر بغروب شمس ليلة العيد.  (صح أم خطأ؟)","a":"صح","x":"«تجب بأول ليلة العيد، فمن مات أو أعسر قبل الغروب فلا زكاة عليه»","m":0,"d":0,"p":0},{"id":"t183","q":"من لم يجد ما يُخرجه عن الجميع بدأ بوالديه قبل نفسه.  (صح أم خطأ؟)","a":"خطأ","x":"«فإن لم يجد ما يخرجه عن الجميع بدأ بنفسه، فزوجته، فرقيقه، فأمه، فأبيه، فولده، فالأقرب فالأقرب في ميراث»","m":0,"d":0,"p":0},{"id":"t184","q":"يثبت دخول رمضان بشهادة عدل واحد.  (صح أم خطأ؟)","a":"صح","x":"«تثبت رؤية هلاله بخبر مسلم مكلف عدل ولو عبداً أو أنثى، ولا يقبل في بقية الشهور إلا رجلان عدلان»","m":0,"d":0,"p":0},{"id":"t188","q":"من عجز عن الصوم لكبر أفطر وأطعم عن كل يوم مسكيناً.  (صح أم خطأ؟)","a":"صح","x":"«من عجز عنه لكبر أو مرض لا يرجى زواله أفطر وأطعم عن كل يوم مسكيناً مد بر أو نصف صاع من غيره»","m":0,"d":0,"p":0},{"id":"t191","q":"أفضل صوم التطوع صوم يوم وإفطار يوم.  (صح أم خطأ؟)","a":"صح","x":"«يسن صوم التطوع، وأفضله يوم ويوم. وصوم أيام البيض، والخميس والاثنين، وستة من شوال، وصوم المحرم وآكده عاشوراء، وعشر ذي الحجة وآكده يوم عرفة»","m":0,"d":0,"p":0},{"id":"t193","q":"المحرم شرط وجوب في حق المرأة لا شرط صحة.  (صح أم خطأ؟)","a":"صح","x":"«شرط الوجوب خمسة أشياء: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد المرأة شرطاً سادساً: أن تجد لها زوجاً أو محرماً مكلفاً» «إن حجت بلا محرم حرم وأجزأها»","m":0,"d":0,"p":0},{"id":"t194","q":"يصح حج الصبي ويجزئ عن حجة الإسلام.  (صح أم خطأ؟)","a":"خطأ","x":"«يصحان من الصغير والرقيق ولا يجزئان عن حجة الإسلام وعمرته»","m":0,"d":0,"p":0},{"id":"t195","q":"من حج عن غيره ولم يحج عن نفسه صحّ حجه.  (صح أم خطأ؟)","a":"خطأ","x":"«لا يصح ممن لم يحج عن نفسه أن يحج عن غيره»","m":0,"d":0,"p":0},{"id":"t196","q":"التمتع أفضل أنواع النسك على المذهب.  (صح أم خطأ؟)","a":"صح","x":"«يخير من أراد الإحرام بين: أن ينوي التمتع وهو أفضل أو ينوي الإفراد أو القران»","m":0,"d":0,"p":0},{"id":"t198","q":"لا فدية في قتل القمل ولا في عقد النكاح.  (صح أم خطأ؟)","a":"صح","x":"«وفي جميع المحظورات الفدية، إلا قتل القمل وعقد النكاح. وفي الشعرة أو الظفر إطعام مسكين، وفي الاثنين إطعام اثنين»","m":0,"d":0,"p":0},{"id":"t199","q":"في الشعرة الواحدة إطعام مسكين.  (صح أم خطأ؟)","a":"صح","x":"«وفي جميع المحظورات الفدية، إلا قتل القمل وعقد النكاح. وفي الشعرة أو الظفر إطعام مسكين، وفي الاثنين إطعام اثنين»","m":0,"d":0,"p":0},{"id":"t202","q":"الركن اليماني يُستلم ويُقبّل.  (صح أم خطأ؟)","a":"خطأ","x":"«وسننه: استلام الركن اليماني بيده اليمنى، وكذا الحجر الأسود وتقبيله، والدعاء، والذكر، والدنو من البيت، والركعتان بعده»","m":0,"d":0,"p":0},{"id":"t203","q":"الرمل يكون في الأشواط الثلاثة الأولى من طواف القدوم.  (صح أم خطأ؟)","a":"صح","x":"«وسننه: المبيت بمنى ليلة عرفة، وطواف القدوم، والرمل في الثلاثة أشواط الأول منه، والاضطباع فيه، وتجرد الرجل من المخيط عند الإحرام، ولبس إزار ورداء أبيضين نظيفين، والتلبية من حين الإحرام إلى أول الرمي»","m":0,"d":0,"p":0},{"id":"t207","q":"من فاته الوقوف بعرفة تحلل بعمرة وعليه القضاء والهدي.  (صح أم خطأ؟)","a":"صح","x":"«من طلع عليه فجر يوم النحر ولم يقف بعرفة لعذر حصر أو غيره فاته الحج، وانقلب إحرامه عمرة... فيتحلل بها، وعليه دم، والقضاء»","m":0,"d":0,"p":0},{"id":"t208","q":"الأضحية واجبة على كل مسلم.  (صح أم خطأ؟)","a":"خطأ","x":"«الأضحية سنة مؤكدة، وتجب بالنذر، وبقوله: هذه أضحية»","m":0,"d":0,"p":0},{"id":"t209","q":"الجذع من الضأن ما تمّ له ستة أشهر.  (صح أم خطأ؟)","a":"صح","x":"«أقل ما يجزئ من الضأن ما له نصف سنة، ومن المعز ما له سنة، ومن البقر ما له سنتان، ومن الإبل ما له خمس سنين»","m":0,"d":0,"p":0},{"id":"t210","q":"الخصي لا يجزئ في الأضحية.  (صح أم خطأ؟)","a":"خطأ","x":"«لا تجزئ: بينة المرض، ولا بينة العور، ولا قائمة العينين مع ذهاب أبصارهما، ولا عجفاء، ولا عرجاء لا تطيق مشياً مع صحيحة، ولا هتماء، ولا عصماء. وتجزئ: الجماء، والبتراء، والخصي، والحامل، وما خلق بلا أذن»","m":0,"d":0,"p":0},{"id":"t211","q":"عن الغلام في العقيقة شاة واحدة.  (صح أم خطأ؟)","a":"خطأ","x":"«عن الغلام شاتان وعن الجارية شاة»","m":0,"d":0,"p":0},{"id":"t236","q":"وقت الأضحية ينتهي بغروب شمس يوم النحر.  (صح أم خطأ؟)","a":"خطأ","x":"«أول وقت الذبح من بعد أسبق صلاة عيد بالبلد، أو قدرها لمن لم يصل، ويستمر وقت الذبح نهاراً وليلاً إلى آخر ثاني أيام التشريق»","m":1,"d":0,"p":0},{"id":"t391","q":"سنن الوضوء ثمانية.  (صح أم خطأ؟)","a":"خطأ","x":"«سننه ثمانية عشر: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والبداءة قبل غسل الوجه بالمضمضة والاستنشاق، والمبالغة فيهما لغير الصائم، والمبالغة في سائر الأعضاء مطلقاً، والزيادة في ماء الوجه، وتخليل اللحية الكثيفة، وتخليل الأصابع، وأخذ ماء جديد للأذنين، وتقديم اليمنى على اليسرى، ومجاوزة محل الفرض، والغسلة الثانية والثالثة، واستصحاب ذكر النية إلى آخر الوضوء، والإتيان بها عند غسل الكفين، والنطق بها سراً، وقول: أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمداً عبده ورسوله، مع رفع بصره إلى السماء بعد فراغه، وأن يتولى وضوءه بنفسه من غير معاونة»","m":0,"d":0,"p":0},{"id":"t424","q":"البدنة تجزئ عن عشرة في الأضحية.  (صح أم خطأ؟)","a":"خطأ","x":"«تجزئ الشاة عن الواحد وعن أهل بيته وعياله، وتجزئ البدنة والبقرة عن سبعة»","m":0,"d":0,"p":0},{"id":"t425","q":"يُحلق رأس المولود ويُتصدق بوزنه ذهباً.  (صح أم خطأ؟)","a":"خطأ","x":"«يسن أن يحلق رأس الغلام في اليوم السابع، ويتصدق بوزنه فضة»","m":0,"d":0,"p":0},{"id":"q20","q":"اذكر ماءً يكره استخدامه في الطهارة.","a":"وماء: يكره استعماله مع عدم الاحتياج إليه، وهو: ماء بئر بمقبرة. وماء اشتد: حره، أو برده. أو سخن: بنجاسة أو بمغصوب. أو استعمل: في طهارة لم تجب، أو في غسل كافر. أو تغير: بملح مائي، أو بما لا يمازجه كتغيره: بالعود القماري، وقطع الكافور، والدهن. ولا يكره ماء زمزم إلا في: إزالة الخبث","x":"","m":0,"d":0,"p":62},{"id":"m395","q":"المبالغة في المضمضة والاستنشاق سنة لِـ:","a":"غير الصائم","x":"","m":0,"d":0,"p":73},{"id":"m329","q":"أين يكون التورك في الصلاة؟","a":"في التشهد الثاني","x":"","m":0,"d":0,"p":114},{"id":"m389","q":"الأولى بالإمامة في المسجد:","a":"إمامه الراتب ولو كان غيره أفضل","x":"","m":0,"d":0,"p":132},{"id":"t149","q":"الإمام الراتب أولى بالإمامة ولو حضر من هو أفضل منه.  (صح أم خطأ؟)","a":"صح","x":"«وصاحب البيت، وإمام المسجد - ولو عبداً -: أحق»","m":0,"d":0,"p":132},{"id":"m303","q":"لا تصح إمامة الأمي - وهو من لا يحسن الفاتحة - إلا:","a":"بمثله","x":"","m":0,"d":0,"p":134},{"id":"f54","q":"التكبير المقيد في الأضحى يبدأ للمُحِلّ من ........ وينتهي ........","a":"فجر يوم عرفة، عصر آخر أيام التشريق","x":"","m":0,"d":0,"p":150},{"id":"m378","q":"من الأولى بغسل الميت؟","a":"وصيه العدل","x":"","m":0,"d":0,"p":156},{"id":"m373","q":"كم يجزئ من التسليم في صلاة الجنازة؟","a":"تسليمة واحدة","x":"","m":0,"d":0,"p":162},{"id":"m386","q":"ما السنة في حفر القبر؟","a":"أن يُعمَّق ويوسَّع بلا حد","x":"","m":0,"d":0,"p":164},{"id":"m375","q":"كم يُرفع القبر عن الأرض؟","a":"قدر شبر","x":"","m":0,"d":0,"p":165},{"id":"m384","q":"دفع الزكاة إلى بني هاشم:","a":"لا يجزئ","x":"","m":0,"d":0,"p":187},{"id":"f67","q":"يثبت دخول رمضان بشهادة ........ ويثبت خروجه بشهادة ........","a":"عدل واحد، عدلين","x":"","m":0,"d":0,"p":190},{"id":"m340","q":"يثبت خروج رمضان بشهادة:","a":"عدلين","x":"","m":0,"d":0,"p":190},{"id":"q237","q":"حامل أفطرت خوفاً على ولدها فقط، ماذا يلزم؟","a":"ويباح: لحاضر سافر في أثناء النهار. ولحامل، ومرضع خافتا على: أنفسهما، أو على الولد. لكن لو أفطرتا خوفاً على الولد - فقط -: لزم وليَّه إطعام مسكين لكل يوم","x":"","m":0,"d":0,"p":194},{"id":"f70","q":"الحامل والمرضع إذا أفطرتا خوفاً على الولد فقط لزم ........ إطعام مسكين لكل يوم","a":"وليَّه","x":"","m":0,"d":0,"p":194},{"id":"m334","q":"الحامل والمرضع إذا أفطرتا خوفاً على الولد فقط:","a":"لزم وليَّه إطعام مسكين لكل يوم","x":"","m":0,"d":0,"p":194},{"id":"m342","q":"من عدم الدم من المتمتع والقارن وتارك الواجب فصام الثلاثة أيام في الحج، هل تصح في أيام التشريق؟","a":"تصح","x":"","m":0,"d":0,"p":200},{"id":"t190","q":"من عدم الهدي من المتمتع والقارن صحّ صومه الأيام الثلاثة في أيام التشريق.  (صح أم خطأ؟)","a":"صح","x":"«ويحرم صوم: العيدين. وأيام التشريق» «فيجب على: متمتع، وقارن، وتارك واجب: دم. فإن عدمه أو ثمنه، صام: ثلاثة أيام في الحج، والأفضل: كون آخرها يوم عرفة. وتصح: أيام التشريق. وسبعة إذا رجع إلى أهله»","m":0,"d":0,"p":200},{"id":"m347","q":"إلى متى تُسنّ التلبية؟","a":"من حين الإحرام إلى أول الرمي","x":"","m":0,"d":0,"p":219},{"id":"m712","q":"بم ينعقد البيع؟","a":"بالقول وبالمعاطاة","x":"","m":1,"d":0,"p":243},{"id":"t213","q":"ينعقد البيع بالمعاطاة من غير لفظ.  (صح أم خطأ؟)","a":"صح","x":"«وينعقد، لا هزلاً: بالقول: الدال على البيع والشراء. وبالمعاطاة»","m":1,"d":0,"p":243},{"id":"m717","q":"حكم البيع والشراء في المسجد:","a":"يحرم ولا يصح","x":"","m":1,"d":0,"p":244},{"id":"m718","q":"حكم البيع بعد نداء الجمعة الذي عند المنبر في حق من تلزمه الجمعة:","a":"يحرم ولا يصح","x":"","m":1,"d":0,"p":244},{"id":"t215","q":"يحرم البيع في المسجد ولا يصح.  (صح أم خطأ؟)","a":"صح","x":"«ويحرم، ولا يصح: بيع، ولا شراء: في المسجد»","m":1,"d":0,"p":244},{"id":"m720","q":"فيم يجري الربا؟","a":"في كل مكيل وموزون ولو لم يؤكل","x":"","m":1,"d":0,"p":252},{"id":"t216","q":"الربا عند الحنابلة يجري في المأكولات فقط.  (صح أم خطأ؟)","a":"خطأ","x":"«يجري الربا في كل: مكيل، وموزون، ولو لم يؤكل»","m":1,"d":0,"p":252},{"id":"q249","q":"اذكر ترتيب الأولياء في النكاح.","a":"والأحق بتزويج الحرة: أبوها، وإن علا. فابنها، وإن نزل. فالأخ الشقيق. فالأخ للأب. ثم الأقرب فالأقرب: كالإرث. ثم السلطان أو نائبه","x":"","m":1,"d":0,"p":391},{"id":"m796","q":"الأحق بتزويج الحرة على الترتيب:","a":"أبوها وإن علا، ثم ابنها وإن نزل، ثم الأخ الشقيق","x":"","m":1,"d":0,"p":391},{"id":"t219","q":"الأحق بتزويج المرأة بعد الأب ابنُها.  (صح أم خطأ؟)","a":"صح","x":"«والأحق بتزويج الحرة: أبوها، وإن علا. فابنها، وإن نزل»","m":1,"d":0,"p":391},{"id":"m798","q":"يحرم بالمصاهرة أربع، منهن ثلاث بمجرد العقد، وهن:","a":"زوجة أبيه وإن علا، وزوجة ابنه وإن سفل، وأم زوجته","x":"","m":1,"d":0,"p":396},{"id":"t224","q":"أم الزوجة تحرم بمجرد العقد على ابنتها.  (صح أم خطأ؟)","a":"صح","x":"«ويحرم أبداً بالمصاهرة أربع، ثلاث بمجرد العقد: زوجة أبيه... وزوجة ابنه... وأم زوجته»","m":1,"d":0,"p":396},{"id":"m799","q":"لا يجوز للحر أن يجمع أكثر من:","a":"أربع","x":"","m":1,"d":0,"p":398},{"id":"t221","q":"يجمع العبد أربع زوجات كالحر.  (صح أم خطأ؟)","a":"خطأ","x":"«ولا لعبد جمع أكثر من ثنتين»","m":1,"d":0,"p":398},{"id":"m800","q":"إذا لم يسمَّ الصداق أو سُمي فاسدًا:","a":"صح العقد ووجب مهر المثل","x":"","m":1,"d":0,"p":408},{"id":"t222","q":"إذا لم يُسمَّ الصداق بطل النكاح.  (صح أم خطأ؟)","a":"خطأ","x":"«فإن لم يسم، أو سمي فاسداً: صح العقد. ووجب مهر المثل»","m":1,"d":0,"p":408},{"id":"f84","q":"إذا طُلقت قبل الدخول فلها ........ من الصداق","a":"نصفه","x":"","m":1,"d":0,"p":411},{"id":"m801","q":"إذا طلقها قبل الدخول بعد أن أقبضها الصداق:","a":"رجع عليها بنصفه","x":"","m":1,"d":0,"p":411},{"id":"m802","q":"يتقرر الصداق كاملًا بأمور، منها:","a":"موت أحدهما، ووطؤه ولمسه لها","x":"","m":1,"d":0,"p":413},{"id":"t223","q":"يتقرر الصداق كاملاً بالخلوة.  (صح أم خطأ؟)","a":"صح","x":"«ويقرره كاملاً: ... وبخلوته بها عن مميز»","m":1,"d":0,"p":413},{"id":"m137","q":"ماذا تترك المحدّة في الإحداد؟","a":"الزينة، والطيب، ولبس الحلي، ولبس الملون من الثياب، والتحسين بالحناء، والاكتحال بالأسود","x":"","m":1,"d":0,"p":461},{"id":"m823","q":"الأحق بحضانة الطفل على الترتيب:","a":"الأم، ثم أمهاتها القربى، ثم الأب، ثم أمهاته","x":"","m":1,"d":0,"p":475},{"id":"q256","q":"ما حكم النذر في أصله؟ وما حكم نذر المعصية والنذر المطلق؟","a":"باب النذر: وهو: مكروه، لا يأتي بخير، ولا يرد قضاء... وأنواعه المنعقدة ستة... أحدها: النذر المطلق: كقوله: لله تعالى علي نذر: فيلزمه كفارة يمين... الخامس: نذر معصية، كشرب الخمر، وصوم يوم العيد ونحوه: فيحرم الوفاء به. ويكفر... السادس: نذر تبرر، كصلاة، وصيام... فهذا يجب الوفاء به","x":"","m":1,"d":0,"p":540},{"id":"m830","q":"حكم النذر:","a":"مكروه، لا يأتي بخير، ولا يرد قضاءً","x":"","m":1,"d":0,"p":540},{"id":"t235","q":"حكم النذر في أصله مكروه.  (صح أم خطأ؟)","a":"صح","x":"«باب النذر: وهو: مكروه، لا يأتي بخير، ولا يرد قضاء... وأنواعه المنعقدة ستة... أحدها: النذر المطلق: كقوله: لله تعالى علي نذر: فيلزمه كفارة يمين... الخامس: نذر معصية، كشرب الخمر، وصوم يوم العيد ونحوه: فيحرم الوفاء به. ويكفر... السادس: نذر تبرر، كصلاة، وصيام... فهذا يجب الوفاء به»","m":1,"d":0,"p":540},{"id":"q1","q":"ما هي واجبات الحج؟","a":"واجباته سبعة: الإحرام من الميقات، والوقوف إلى الغروب لمن وقف نهاراً، والمبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، والمبيت بمنى ليالي التشريق، ورمي الجمار مرتباً، والحلق أو التقصير، وطواف الوداع","x":"","m":0,"d":1,"p":0},{"id":"q2","q":"ما هي أركان الحج؟","a":"أركان الحج أربعة: الإحرام، وهو مجرد النية، فمن تركه لم ينعقد حجه. والوقوف بعرفة. وطواف الإفاضة. والسعي بين الصفا والمروة","x":"","m":0,"d":1,"p":0},{"id":"q3","q":"ما هي سنن الأذان؟","a":"يسن كونه: صيتاً، أميناً، عالماً بالوقت، متطهراً، قائماً فيهما","x":"","m":0,"d":1,"p":0},{"id":"q4","q":"ما شروط المؤذن؟","a":"لا يصحان إلا مرتبين، متواليين عرفاً... وشرط كون المؤذن: مسلماً، ذكراً، عاقلاً، مميزاً، ناطقاً، عدلاً ولو ظاهراً. ولا يصحان قبل الوقت، إلا أذان الفجر فيصح بعد نصف الليل","x":"","m":0,"d":1,"p":0},{"id":"q5","q":"ما حكم الأذان والإقامة؟","a":"هما فرض كفاية في الحضر على الرجال الأحرار، ويسنان للمنفرد وفي السفر، ويكرهان للنساء ولو بلا رفع صوت","x":"","m":0,"d":1,"p":0},{"id":"q6","q":"ما هي مفطرات الصائم؟","a":"المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره","x":"","m":0,"d":1,"p":0},{"id":"q7","q":"اذكر أنواع التحلل في الحج وكيف يحصل.","a":"التحلل الأول يحصل باثنين من: رمي، وحلق، وطواف، ويحل له كل شيء إلا النساء. والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل","x":"","m":0,"d":1,"p":0},{"id":"q9","q":"متى يتم المسافر الصلاة؟","a":"ويلزم إتمام الصلاة إن: دخل وقتها وهو في الحضر. أو صلى خلف من يتم. أو لم ينو القصر عند الإحرام. أو نوى إقامة: مطلقة، أو أكثر من أربعة أيام. أو أقام: لحاجة، وظن أن لا تنقضي إلا بعد الأربعة. أو أخر الصلاة: بلا عذر حتى ضاق وقتها عنها","x":"","m":0,"d":1,"p":0},{"id":"q10","q":"ما الحكم إذا زال العذر عن المفطر وهو في النهار؟","a":"إن أسلم الكافر أو طهرت الحائض أو برئ المريض أو قدم المسافر أو بلغ الصغير أو عقل المجنون في أثناء النهار وهم مفطرون لزمهم الإمساك والقضاء","x":"","m":0,"d":1,"p":0},{"id":"q11","q":"ماذا يتحمل الإمام عن المأموم؟","a":"يتحمل الإمام عن المأموم: القراءة، وسجود السهو، وسجود التلاوة، والسترة، ودعاء القنوت، والتشهد الأول إذا سبق بركعة في رباعية","x":"","m":0,"d":1,"p":0},{"id":"q12","q":"بيّن حكم الصلاة على الميت، وهل يجزئ لو صلى على الميت امرأة وحدها دون أن يكون معها رجل؟","a":"الصلاة عليه فرض كفاية، وتسقط بمكلف واحد، ولو أنثى","x":"","m":0,"d":1,"p":0},{"id":"q13","q":"محمد يملك أربعين رأساً من الغنم السائمة وقد حال عليها الحول، بيّن مقدار الزكاة.","a":"وأقل نصاب الغنم أهلية كانت أو وحشية: أربعون، وفيها: شاة لها سنة، أو جذعة ضأن لها ستة أشهر. وفي مائة وإحدى وعشرين: شاتان. وفي مائتين وواحدة: ثلاث شياه. وفي أربعمائة: أربع شياه. ثم في كل مائة: شاة","x":"","m":0,"d":1,"p":0},{"id":"q14","q":"عائشة تملك حلياً يبلغ نصاباً وقد حال عليه الحول، هل يجب عليها إخراج الزكاة؟","a":"لا زكاة في حلي مباح معد لاستعمال أو إعارة، وتجب في الحلي المحرم، وكذا في المباح المعد للكراء أو النفقة إذا بلغ نصاباً وزناً","x":"","m":0,"d":1,"p":0},{"id":"q15","q":"اذكر شروط الوجوب في الصيام.","a":"شرط وجوب الصوم أربعة أشياء: الإسلام، والبلوغ، والعقل، والقدرة عليه","x":"","m":0,"d":1,"p":0},{"id":"q17","q":"عرّف الاستطاعة في الحج مع بيان الشرط الذي يجب أن يتحقق فيها.","a":"هي ملك زاد وراحلة تصلح لمثله أو ملك ما يقدر به على تحصيل ذلك بشرط كونه فاضلا عما يحتاجه من كتب ومسكن وخادم وأن يكون فاضلا عن مؤنته ومؤنة عياله على الدوام","x":"","m":0,"d":1,"p":0},{"id":"q21","q":"ما فروض الوضوء؟","a":"فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة","x":"","m":0,"d":1,"p":0},{"id":"q22","q":"ما شروط الوضوء؟","a":"شروطه ثمانية: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار","x":"","m":0,"d":1,"p":0},{"id":"q23","q":"ما شروط المسح على الخف؟","a":"يجوز بشروط سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما لمحل الفرض ولو بربطهما، وإمكان المشي بهما عرفا، وثبوتهما بنفسهما، وإباحتهما، وطهارة عينهما، وعدم وصفهما البشرة","x":"","m":0,"d":1,"p":0},{"id":"q24","q":"هل يجوز للقادر الجلوس في صلاة الفرض؟ ولماذا؟","a":"أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان من قدر على القيام أو القعود في أثناء الصلاة انتقل إليه","x":"","m":0,"d":1,"p":0},{"id":"q25","q":"اذكر أهل الزكاة.","a":"أهل الزكاة ثمانية: الفقير وهو من لم يجد نصف كفايته، والمسكين وهو من يجد نصفها أو أكثرها، والعامل عليها، والمؤلف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل وهو الغريب المنقطع بغير بلده","x":"","m":0,"d":1,"p":0},{"id":"q31","q":"ما أركان الصلاة؟","a":"أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان","x":"","m":0,"d":1,"p":0},{"id":"q32","q":"ما واجبات الصلاة؟","a":"واجباتها ثمانية: التكبير لغير الإحرام، لكن تكبيرة المسبوق التي بعد تكبيرة الإحرام سنة. وقول: سمع الله لمن حمده، للإمام والمنفرد، لا للمأموم. وقول: ربنا ولك الحمد، للكل. وقول: سبحان ربي العظيم، مرة في الركوع. وسبحان ربي الأعلى، مرة في السجود. ورب اغفر لي، بين السجدتين. والتشهد الأول، على غير من قام إمامه سهواً. والجلوس له","x":"","m":0,"d":1,"p":0},{"id":"q33","q":"ما الفرق بين الركن والواجب في الصلاة؟","a":"أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان واجباتها ثمانية، تبطل الصلاة بتركها عمداً، وتسقط سهواً وجهلاً","x":"","m":0,"d":1,"p":0},{"id":"q35","q":"ما أوقات النهي؟","a":"أوقات النهي هي: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول","x":"","m":0,"d":1,"p":0},{"id":"q36","q":"ما شروط جمع التقديم وجمع التأخير؟","a":"فإن جمع تقديماً، اشترط لصحة الجمع: نيته عند إحرام الأولى. وأن لا يفرق بينهما بنحو نافلة: بل بقدر إقامة، ووضوء خفيف. وأن يوجد العذر عند افتتاحهما. وأن يستمر إلى فراغ الثانية وإن جمع تأخيراً، اشترط: نية الجمع بوقت الأولى: قبل أن يضيق وقتها عنها. وبقاء العذر إلى دخول وقت الثانية","x":"","m":0,"d":1,"p":0},{"id":"q37","q":"على من تجب الجمعة؟ وما شروط صحتها؟","a":"تجب على كل ذكر، مسلم، مكلف، حر، لا عذر له تجب الجمعة على مسافر لا يباح له القصر، وعلى مقيم خارج البلد إذا كان بينهما وبين الجمعة وقت فعلها فرسخ فأقل، ولا تجب على من يباح له القصر يشترط لصحة الجمعة أربعة شروط: الوقت، وهو من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل. وأن تكون بقرية ولو من قصب يستوطنها أربعون استيطان إقامة. وحضور أربعين، فإن نقصوا قبل إتمامها استأنفوا ظهراً. وتقدم خطبتين","x":"","m":0,"d":1,"p":0},{"id":"q38","q":"ما أركان الخطبتين؟","a":"أركانهما ستة: حمد الله، والصلاة على رسول الله صلى الله عليه وسلم، وقراءة آية من كتاب الله، والوصية بتقوى الله، وموالاتهما مع الصلاة، والجهر بحيث يسمع العدد المعتبر حيث لا مانع","x":"","m":0,"d":1,"p":0},{"id":"q39","q":"ما أركان صلاة الجنازة؟","a":"أركانها سبعة: القيام في فرضها، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على محمد، والدعاء للميت، والسلام، والترتيب","x":"","m":0,"d":1,"p":0},{"id":"q40","q":"ما شروط وجوب الزكاة؟ وما الأموال الزكوية؟","a":"شرط وجوبها خمسة أشياء: الإسلام، فلا تجب على الكافر ولو مرتداً. والحرية، فلا تجب على الرقيق ولو مكاتباً. وملك النصاب. والملك التام. وتمام الحول، ولا يضر لو نقص نصف يوم. وتجب في مال الصغير والمجنون تجب في خمسة أشياء: في سائمة بهيمة الأنعام، وفي الخارج من الأرض، وفي العسل، وفي الأثمان، وفي عروض التجارة","x":"","m":0,"d":1,"p":0},{"id":"q41","q":"ما مقدار الزكاة في الخارج من الأرض والعسل والركاز والذهب وعروض التجارة وزكاة الفطر؟","a":"يجب فيما يسقى بلا كلفة العشر، وفيما يسقى بكلفة نصف العشر في العسل العشر، ونصابه مائة وستون رطلا عراقية الركاز: وهو الكنز ولو كان قليلا ففيه الخمس فيها ربع العشر إذا بلغت نصاباً الواجب عن كل شخص صاع: تمر، أو زبيب، أو بر، أو شعير، أو أقط","x":"","m":0,"d":1,"p":0},{"id":"q42","q":"ما كفارة الجماع في نهار رمضان؟","a":"الكفارة هي: عتق رقبة مؤمنة فإن لم يجد فصيام شهرين متتابعين فإن لم يستطع فإطعام ستين مسكينا، فإن لم يجد: سقطت عنه بخلاف غيرها من الكفارات","x":"","m":0,"d":1,"p":0},{"id":"q43","q":"ما شروط صحة الاعتكاف وما يبطله؟","a":"شرط صحته ستة أشياء: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد. ويزاد في حق من تلزمه الجماعة: أن يكون المسجد مما تقام فيه يبطل الاعتكاف: بالخروج من المسجد لغير عذر، وبنية الخروج ولو لم يخرج، وبالوطء في الفرج، وبالإنزال بالمباشرة دون الفرج، وبالردة، وبالسكر","x":"","m":0,"d":1,"p":0},{"id":"q44","q":"ما شروط وجوب الحج؟ وبم تزيد المرأة؟","a":"شرط الوجوب خمسة أشياء: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد المرأة شرطاً سادساً: أن تجد لها زوجاً أو محرماً مكلفاً","x":"","m":0,"d":1,"p":0},{"id":"q45","q":"ما أنواع الأنساك؟","a":"التمتع: هو أن يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج الإفراد: هو أن يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة القران: أن يحرم بالعمرة ثم يدخل الحج عليها قبل الشروع في طوافها","x":"","m":0,"d":1,"p":0},{"id":"q46","q":"ما محظورات الإحرام؟","a":"محظورات الإحرام سبعة: تعمد لبس المخيط على الرجل حتى الخفين، وتعمد تغطية الرأس من الرجل، وقصد شم الطيب ومسه واستعماله، وإزالة الشعر من البدن وتقليم الأظفار، وقتل صيد البر الوحشي المأكول، وعقد النكاح ولا يصح، والوطء في الفرج ودواعيه","x":"","m":0,"d":1,"p":0},{"id":"q47","q":"ما أقسام الفدية؟","a":"قسم التخيير: كفدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين... يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. ومن التخيير جزاء الصيد: يخير فيه بين المثل من النعم، أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين، أو يصوم عن إطعام كل مسكين يوماً قسم الترتيب: كدم المتعة والقران وترك الواجب والإحصار والوطء: فيجب على متمتع وقارن وتارك واجب دم، فإن عدمه أو ثمنه صام ثلاثة أيام في الحج، والأفضل كون آخرها يوم عرفة، ويصح أيام التشريق، وسبعة إذا رجع إلى أهله","x":"","m":0,"d":1,"p":0},{"id":"q61","q":"ما نواقض الوضوء؟","a":"نواقض الوضوء ثمانية: الخارج من السبيلين قليلاً كان أو كثيراً، طاهراً أو نجساً. وخروج النجاسة من بقية البدن: فإن كان بولاً أو غائطاً نقض مطلقاً، وإن كان غيرهما كالدم والقيء نقض إن فحش في نفس كل أحد بحسبه. وزوال العقل أو تغطيته بإغماء أو نوم، ما لم يكن النوم يسيراً عرفاً من جالس وقائم. ومسه بيده - لا ظفره - فرج الآدمي المتصل بلا حائل، أو حلقة دبره. ولمس بشرة الذكر الأنثى، أو الأنثى الذكر، لشهوة من غير حائل. وغسل الميت أو بعضه. وأكل لحم الإبل ولو نيئاً، فلا نقض ببقية أجزائها. والردة، وكل ما أوجب الغسل غير الموت","x":"","m":0,"d":1,"p":0},{"id":"q62","q":"ما موجبات الغسل؟","a":"موجبات الغسل سبعة: انتقال المني... وخروجه من مخرجه ولو دماً، ويشترط أن يكون بلذة ما لم يكن نائماً ونحوه. وتغييب الحشفة كلها أو قدرها بلا حائل في فرج ولو دبراً... ولكن لا يجب الغسل إلا على ابن عشر وبنت تسع. وإسلام الكافر ولو مرتداً. وخروج الحيض. وخروج دم النفاس. والموت تعبداً","x":"","m":0,"d":1,"p":0},{"id":"q63","q":"ما شروط التيمم وفروضه ومبطلاته؟","a":"يصح بشروط ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء أو الاستجمار، ودخول وقت الصلاة، وتعذر استعمال الماء إما لعدمه أو لخوفه باستعماله الضرر، وأن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة مبطلاته خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه","x":"","m":0,"d":1,"p":0},{"id":"q64","q":"ما الذي يحرم بالحيض؟","a":"ويحرم بالحيض أشياء، منها: الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف، وقراءة القرآن، ومس المصحف، واللبث في المسجد، والمرور فيه إن خافت تلويثه","x":"","m":0,"d":1,"p":0},{"id":"q65","q":"ما شروط الصلاة؟","a":"شروط الصلاة تسعة: الإسلام، والعقل، والتمييز، والطهارة مع القدرة، ودخول الوقت، وستر العورة مع القدرة بشيء لا يصف البشرة، واجتناب النجاسة ببدنه وثوبه وبقعته مع القدرة، واستقبال القبلة، والنية","x":"","m":0,"d":1,"p":0},{"id":"q217","q":"اذكر فروض الوضوء الستة.","a":"فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة","x":"","m":0,"d":1,"p":0},{"id":"q218","q":"اذكر نواقض الوضوء الثمانية.","a":"نواقض الوضوء ثمانية: الخارج من السبيلين قليلاً كان أو كثيراً، طاهراً أو نجساً. وخروج النجاسة من بقية البدن: فإن كان بولاً أو غائطاً نقض مطلقاً، وإن كان غيرهما كالدم والقيء نقض إن فحش في نفس كل أحد بحسبه. وزوال العقل أو تغطيته بإغماء أو نوم، ما لم يكن النوم يسيراً عرفاً من جالس وقائم. ومسه بيده - لا ظفره - فرج الآدمي المتصل بلا حائل، أو حلقة دبره. ولمس بشرة الذكر الأنثى، أو الأنثى الذكر، لشهوة من غير حائل. وغسل الميت أو بعضه. وأكل لحم الإبل ولو نيئاً، فلا نقض ببقية أجزائها. والردة، وكل ما أوجب الغسل غير الموت","x":"","m":0,"d":1,"p":0},{"id":"q220","q":"اذكر موجبات الغسل السبعة.","a":"موجبات الغسل سبعة: انتقال المني... وخروجه من مخرجه ولو دماً، ويشترط أن يكون بلذة ما لم يكن نائماً ونحوه. وتغييب الحشفة كلها أو قدرها بلا حائل في فرج ولو دبراً... ولكن لا يجب الغسل إلا على ابن عشر وبنت تسع. وإسلام الكافر ولو مرتداً. وخروج الحيض. وخروج دم النفاس. والموت تعبداً","x":"","m":0,"d":1,"p":0},{"id":"q221","q":"اذكر فروض التيمم، وإلى أين يُمسح فيه؟","a":"فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة","x":"","m":0,"d":1,"p":0},{"id":"q223","q":"اذكر واجبات الصلاة الثمانية.","a":"واجباتها ثمانية: التكبير لغير الإحرام، لكن تكبيرة المسبوق التي بعد تكبيرة الإحرام سنة. وقول: سمع الله لمن حمده، للإمام والمنفرد، لا للمأموم. وقول: ربنا ولك الحمد، للكل. وقول: سبحان ربي العظيم، مرة في الركوع. وسبحان ربي الأعلى، مرة في السجود. ورب اغفر لي، بين السجدتين. والتشهد الأول، على غير من قام إمامه سهواً. والجلوس له","x":"","m":0,"d":1,"p":0},{"id":"q226","q":"اذكر شروط جمع التقديم، وشروط جمع التأخير.","a":"فإن جمع تقديماً، اشترط لصحة الجمع: نيته عند إحرام الأولى. وأن لا يفرق بينهما بنحو نافلة: بل بقدر إقامة، ووضوء خفيف. وأن يوجد العذر عند افتتاحهما. وأن يستمر إلى فراغ الثانية وإن جمع تأخيراً، اشترط: نية الجمع بوقت الأولى: قبل أن يضيق وقتها عنها. وبقاء العذر إلى دخول وقت الثانية","x":"","m":0,"d":1,"p":0},{"id":"q227","q":"متى يلزم المسافر الإتمام؟","a":"ويلزم إتمام الصلاة إن: دخل وقتها وهو في الحضر. أو صلى خلف من يتم. أو لم ينو القصر عند الإحرام. أو نوى إقامة: مطلقة، أو أكثر من أربعة أيام. أو أقام: لحاجة، وظن أن لا تنقضي إلا بعد الأربعة. أو أخر الصلاة: بلا عذر حتى ضاق وقتها عنها","x":"","m":0,"d":1,"p":0},{"id":"q228","q":"اذكر شروط صحة الجمعة.","a":"يشترط لصحة الجمعة أربعة شروط: الوقت، وهو من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل. وأن تكون بقرية ولو من قصب يستوطنها أربعون استيطان إقامة. وحضور أربعين، فإن نقصوا قبل إتمامها استأنفوا ظهراً. وتقدم خطبتين","x":"","m":0,"d":1,"p":0},{"id":"q229","q":"رجل صلى على الميت امرأة واحدة، هل يسقط الفرض؟ ولماذا؟","a":"الصلاة عليه فرض كفاية، وتسقط بمكلف واحد، ولو أنثى","x":"","m":0,"d":1,"p":0},{"id":"q231","q":"اذكر الأموال الزكوية الخمسة.","a":"تجب في خمسة أشياء: في سائمة بهيمة الأنعام، وفي الخارج من الأرض، وفي العسل، وفي الأثمان، وفي عروض التجارة","x":"","m":0,"d":1,"p":0},{"id":"q232","q":"بيّن المقدار الواجب في: الركاز، والمعادن، والعسل، وما سُقي بكلفة.","a":"الركاز: وهو الكنز ولو كان قليلا ففيه الخمس ما استخرج من المعادن ففيه بمجرد إخراجه ربع العشر إن بلغت القيمة نصابا بعد السبك والتصفية في العسل العشر، ونصابه مائة وستون رطلا عراقية يجب فيما يسقى بلا كلفة العشر، وفيما يسقى بكلفة نصف العشر","x":"","m":0,"d":1,"p":0},{"id":"q233","q":"من ملك أربعين شاة سائمة حال عليها الحول، ماذا عليه؟ وماذا لو ملك مائة وإحدى وعشرين؟","a":"وأقل نصاب الغنم أهلية كانت أو وحشية: أربعون، وفيها: شاة لها سنة، أو جذعة ضأن لها ستة أشهر. وفي مائة وإحدى وعشرين: شاتان. وفي مائتين وواحدة: ثلاث شياه. وفي أربعمائة: أربع شياه. ثم في كل مائة: شاة","x":"","m":0,"d":1,"p":0},{"id":"q234","q":"ما شروط زكاة السائمة الثلاثة؟","a":"تجب فيها بثلاثة شروط: أحدها: أن تتخذ للدر والنسل والتسمين، لا: للعمل. الثاني: أن تسوم - أي: ترعى -: المباح أكثر الحول. الثالث: أن تبلغ نصاباً","x":"","m":0,"d":1,"p":0},{"id":"q235","q":"اذكر أهل الزكاة، وما المراد بـ«الرقاب»؟","a":"أهل الزكاة ثمانية: الفقير وهو من لم يجد نصف كفايته، والمسكين وهو من يجد نصفها أو أكثرها، والعامل عليها، والمؤلف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل وهو الغريب المنقطع بغير بلده","x":"","m":0,"d":1,"p":0},{"id":"q236","q":"رجل جامع في نهار رمضان وعجز عن خصال الكفارة كلها، ماذا عليه؟","a":"الكفارة هي: عتق رقبة مؤمنة فإن لم يجد فصيام شهرين متتابعين فإن لم يستطع فإطعام ستين مسكينا، فإن لم يجد: سقطت عنه بخلاف غيرها من الكفارات","x":"","m":0,"d":1,"p":0},{"id":"q240","q":"ما الفرق بين التمتع والقران والإفراد؟","a":"التمتع: هو أن يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج الإفراد: هو أن يحرم بالحج ثم بعد فراغه منه يحرم بالعمرة القران: أن يحرم بالعمرة ثم يدخل الحج عليها قبل الشروع في طوافها","x":"","m":0,"d":1,"p":0},{"id":"q241","q":"بم يحصل التحلل الأول والثاني في الحج؟","a":"التحلل الأول يحصل باثنين من: رمي، وحلق، وطواف، ويحل له كل شيء إلا النساء. والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل","x":"","m":0,"d":1,"p":0},{"id":"q243","q":"ما الفرق بين فدية جزاء الصيد ودم المتعة والقران؟","a":"قسم التخيير: كفدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين... يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. ومن التخيير جزاء الصيد: يخير فيه بين المثل من النعم، أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين، أو يصوم عن إطعام كل مسكين يوماً قسم الترتيب: كدم المتعة والقران وترك الواجب والإحصار والوطء: فيجب على متمتع وقارن وتارك واجب دم، فإن عدمه أو ثمنه صام ثلاثة أيام في الحج، والأفضل كون آخرها يوم عرفة، ويصح أيام التشريق، وسبعة إذا رجع إلى أهله","x":"","m":0,"d":1,"p":0},{"id":"f10","q":"عدد فروض الوضوء ........ وعدد شروطه ........ وعدد نواقضه ........","a":"ستة، ثمانية، ثمانية","x":"","m":0,"d":1,"p":0},{"id":"f11","q":"عدد أركان الصلاة ........ وعدد واجباتها ........","a":"أربعة عشر، ثمانية","x":"","m":0,"d":1,"p":0},{"id":"f12","q":"نصاب الذهب ........ مثقالاً ونصاب الفضة ........ درهماً","a":"عشرون، مائتا","x":"","m":0,"d":1,"p":0},{"id":"f13","q":"عدد أركان الحج ........ وعدد واجباته ........","a":"أربعة، سبعة","x":"","m":0,"d":1,"p":0},{"id":"f14","q":"مدة المسح على الخفين للمقيم ........ وللمسافر ........ (بالزمن)","a":"يوم وليلة، ثلاثة أيام بلياليها","x":"","m":0,"d":1,"p":0},{"id":"f17","q":"المقدار الواجب في الركاز ........ وفي العسل ........ وفي الذهب ........","a":"الخمس، العشر، ربع العشر","x":"","m":0,"d":1,"p":0},{"id":"f18","q":"أنواع الأنساك ثلاثة: ........ و ........ و ........","a":"التمتع، الإفراد، القران","x":"","m":0,"d":1,"p":0},{"id":"f19","q":"عدد شروط المؤذن ........","a":"ستة: مسلماً ذكراً عاقلاً مميزاً ناطقاً عدلاً","x":"","m":0,"d":1,"p":0},{"id":"f36","q":"أقسام المياه ثلاثة: ........ و ........ و ........","a":"طهور، طاهر، نجس","x":"","m":0,"d":1,"p":0},{"id":"f38","q":"الواجب في الوضوء والغسل والتيمم هو ........ وتسقط ........","a":"التسمية، سهواً","x":"","m":0,"d":1,"p":0},{"id":"f39","q":"في التيمم يُمسح الوجه واليدان إلى ........","a":"الكوعين","x":"","m":0,"d":1,"p":0},{"id":"f40","q":"عدد موجبات الغسل ........","a":"سبعة","x":"","m":0,"d":1,"p":0},{"id":"f44","q":"ركن الأذان ........ وحكمه ........","a":"رفع الصوت، فرض كفاية","x":"","m":0,"d":1,"p":0},{"id":"f45","q":"عدد شروط الصلاة ........","a":"تسعة","x":"","m":0,"d":1,"p":0},{"id":"f46","q":"يقول (سمع الله لمن حمده) ........ ويقول (ربنا ولك الحمد) ........","a":"الإمام والمنفرد، الجميع","x":"","m":0,"d":1,"p":0},{"id":"f51","q":"يتمّ المسافر إذا نوى إقامة أكثر من ........ أيام","a":"أربعة","x":"","m":0,"d":1,"p":0},{"id":"f52","q":"عدد شروط صحة الجمعة ........ وعدد أركان الخطبتين ........","a":"أربعة، ستة","x":"","m":0,"d" ؟","a":"اثنا عشر","x":"","m":0,"d":1,"p":0},{"id":"m549","q":"ما حكم الحجامة للصائم؟","a":"تفطر الحاجم والمحجوم","x":"","m":0,"d":1,"p":0},{"id":"m551","q":"كم عدد شروط صحة الاعتكاف؟","a":"ستة","x":"","m":0,"d":1,"p":0},{"id":"m556","q":"كم عدد شروط وجوب الحج، وما الذي تزيده المرأة؟","a":"خمسة، وتزيد المرأة سادسا: أن تجد زوجا أو محرما مكلفا","x":"","m":0,"d":1,"p":0},{"id":"m559","q":"ما الاستطاعة في الحج؟","a":"ملك زاد وراحلة تصلح لمثله فاضلا عما يحتاجه من كتب ومسكن وخادم وعن مؤنته ومؤنة عياله على الدوام","x":"","m":0,"d":1,"p":0},{"id":"m561","q":"كم عدد محظورات الإحرام؟","a":"سبعة","x":"","m":0,"d":1,"p":0},{"id":"m564","q":"ما تعريف التمتع؟","a":"أن يحرم بالعمرة في أشهر الحج ثم بعد فراغه منها يحرم بالحج","x":"","m":0,"d":1,"p":0},{"id":"m567","q":"كم عدد أركان الحج؟","a":"أربعة: الإحرام والوقوف بعرفة وطواف الإفاضة والسعي","x":"","m":0,"d":1,"p":0},{"id":"m568","q":"كم عدد واجبات الحج؟","a":"سبعة","x":"","m":0,"d":1,"p":0},{"id":"m569","q":"كم عدد أركان العمرة وواجباتها؟","a":"أركانها ثلاثة وواجباتها شيئان","x":"","m":0,"d":1,"p":0},{"id":"t50","q":"أكل لحم الإبل ينقض الوضوء.  (صح أم خطأ؟)","a":"صح","x":"«نواقض الوضوء ثمانية: الخارج من السبيلين قليلاً كان أو كثيراً، طاهراً أو نجساً. وخروج النجاسة من بقية البدن: فإن كان بولاً أو غائطاً نقض مطلقاً، وإن كان غيرهما كالدم والقيء نقض إن فحش في نفس كل أحد بحسبه. وزوال العقل أو تغطيته بإغماء أو نوم، ما لم يكن النوم يسيراً عرفاً من جالس وقائم. ومسه بيده - لا ظفره - فرج الآدمي المتصل بلا حائل، أو حلقة دبره. ولمس بشرة الذكر الأنثى، أو الأنثى الذكر، لشهوة من غير حائل. وغسل الميت أو بعضه. وأكل لحم الإبل ولو نيئاً، فلا نقض ببقية أجزائها. والردة، وكل ما أوجب الغسل غير الموت»","m":0,"d":1,"p":0},{"id":"t51","q":"واجب الوضوء التسمية فقط.  (صح أم خطأ؟)","a":"صح","x":"«تجب فيه التسمية، وتسقط سهواً، وإن ذكرها في أثنائه ابتدأ»","m":0,"d":1,"p":0},{"id":"t53","q":"مدة المسح على الخفين للمقيم يوم وليلة.  (صح أم خطأ؟)","a":"صح","x":"«يمسح المقيم، والعاصي بسفره، من الحدث بعد اللبس: يوماً وليلة. والمسافر: ثلاثة أيام بلياليهن»","m":0,"d":1,"p":0},{"id":"t54","q":"في التيمم تُمسح اليدان إلى المرفقين.  (صح أم خطأ؟)","a":"خطأ","x":"«فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة»","m":0,"d":1,"p":0},{"id":"t55","q":"خروج الوقت من مبطلات التيمم.  (صح أم خطأ؟)","a":"صح","x":"«مبطلاته خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه»","m":0,"d":1,"p":0},{"id":"t56","q":"الأذان فرض كفاية على الرجال الأحرار المقيمين.  (صح أم خطأ؟)","a":"صح","x":"«هما فرض كفاية في الحضر على الرجال الأحرار، ويسنان للمنفرد وفي السفر، ويكرهان للنساء ولو بلا رفع صوت»","m":0,"d":1,"p":0},{"id":"t57","q":"التشهد الأول ركن من أركان الصلاة.  (صح أم خطأ؟)","a":"خطأ","x":"«أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان» «واجباتها ثمانية: التكبير لغير الإحرام، لكن تكبيرة المسبوق التي بعد تكبيرة الإحرام سنة. وقول: سمع الله لمن حمده، للإمام والمنفرد، لا للمأموم. وقول: ربنا ولك الحمد، للكل. وقول: سبحان ربي العظيم، مرة في الركوع. وسبحان ربي الأعلى، مرة في السجود. ورب اغفر لي، بين السجدتين. والتشهد الأول، على غير من قام إمامه سهواً. والجلوس له»","m":0,"d":1,"p":0},{"id":"t59","q":"يجب سجود السهو إذا ترك مسنوناً.  (صح أم خطأ؟)","a":"خطأ","x":"«يباح إذا ترك مسنونا»","m":0,"d":1,"p":0},{"id":"t60","q":"جمع التقديم يشترط له أربعة شروط.  (صح أم خطأ؟)","a":"صح","x":"«فإن جمع تقديماً، اشترط لصحة الجمع: نيته عند إحرام الأولى. وأن لا يفرق بينهما بنحو نافلة: بل بقدر إقامة، ووضوء خفيف. وأن يوجد العذر عند افتتاحهما. وأن يستمر إلى فراغ الثانية»","m":0,"d":1,"p":0},{"id":"t61","q":"إذا ائتم المسافر بمقيم لزمه الإتمام.  (صح أم خطأ؟)","a":"صح","x":"«ويلزم إتمام الصلاة إن: دخل وقتها وهو في الحضر. أو صلى خلف من يتم. أو لم ينو القصر عند الإحرام. أو نوى إقامة: مطلقة، أو أكثر من أربعة أيام. أو أقام: لحاجة، وظن أن لا تنقضي إلا بعد الأربعة. أو أخر الصلاة: بلا عذر حتى ضاق وقتها عنها»","m":0,"d":1,"p":0},{"id":"t62","q":"تجب الجمعة على المسافر الذي يباح له القصر.  (صح أم خطأ؟)","a":"خطأ","x":"«تجب الجمعة على مسافر لا يباح له القصر، وعلى مقيم خارج البلد إذا كان بينهما وبين الجمعة وقت فعلها فرسخ فأقل، ولا تجب على من يباح له القصر»","m":0,"d":1,"p":0},{"id":"t63","q":"صلاة الجنازة تسقط بامرأة مكلفة واحدة.  (صح أم خطأ؟)","a":"صح","x":"«الصلاة عليه فرض كفاية، وتسقط بمكلف واحد، ولو أنثى»","m":0,"d":1,"p":0},{"id":"t65","q":"نصاب الذهب عشرون مثقالاً.  (صح أم خطأ؟)","a":"صح","x":"«نصاب الذهب عشرون مثقالاً، ونصاب الفضة مائتا درهم»","m":0,"d":1,"p":0},{"id":"t66","q":"زكاة الركاز ربع العشر.  (صح أم خطأ؟)","a":"خطأ","x":"«الركاز: وهو الكنز ولو كان قليلا ففيه الخمس»","m":0,"d":1,"p":0},{"id":"t67","q":"زكاة الفطر صاع عن كل مسلم.  (صح أم خطأ؟)","a":"صح","x":"«الواجب عن كل شخص صاع: تمر، أو زبيب، أو بر، أو شعير، أو أقط»","m":0,"d":1,"p":0},{"id":"t68","q":"الحجامة تفطر الحاجم والمحجوم.  (صح أم خطأ؟)","a":"صح","x":"«المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره»","m":0,"d":1,"p":0},{"id":"t69","q":"القيء بغير عمد يفطر الصائم.  (صح أم خطأ؟)","a":"خطأ","x":"«المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره»","m":0,"d":1,"p":0},{"id":"t70","q":"من عجز عن جميع خصال كفارة الجماع في رمضان سقطت عنه.  (صح أم خطأ؟)","a":"صح","x":"«الكفارة هي: عتق رقبة مؤمنة فإن لم يجد فصيام شهرين متتابعين فإن لم يستطع فإطعام ستين مسكينا، فإن لم يجد: سقطت عنه بخلاف غيرها من الكفارات»","m":0,"d":1,"p":0},{"id":"t71","q":"نية الخروج من الاعتكاف تبطله ولو لم يخرج.  (صح أم خطأ؟)","a":"صح","x":"«يبطل الاعتكاف: بالخروج من المسجد لغير عذر، وبنية الخروج ولو لم يخرج، وبالوطء في الفرج، وبالإنزال بالمباشرة دون الفرج، وبالردة، وبالسكر»","m":0,"d":1,"p":0},{"id":"t72","q":"السعي من أركان الحج.  (صح أم خطأ؟)","a":"صح","x":"«أركان الحج أربعة: الإحرام، وهو مجرد النية، فمن تركه لم ينعقد حجه. والوقوف بعرفة. وطواف الإفاضة. والسعي بين الصفا والمروة»","m":0,"d":1,"p":0},{"id":"t73","q":"طواف الوداع من أركان الحج.  (صح أم خطأ؟)","a":"خطأ","x":"«واجباته سبعة: الإحرام من الميقات، والوقوف إلى الغروب لمن وقف نهاراً، والمبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، والمبيت بمنى ليالي التشريق، ورمي الجمار مرتباً، والحلق أو التقصير، وطواف الوداع»","m":0,"d":1,"p":0},{"id":"t74","q":"التحلل الأول يحصل بفعل اثنين من ثلاثة.  (صح أم خطأ؟)","a":"صح","x":"«التحلل الأول يحصل باثنين من: رمي، وحلق، وطواف، ويحل له كل شيء إلا النساء. والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل»","m":0,"d":1,"p":0},{"id":"t75","q":"جزاء الصيد من الفدية على الترتيب.  (صح أم خطأ؟)","a":"خطأ","x":"«قسم التخيير: كفدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين... يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. ومن التخيير جزاء الصيد: يخير فيه بين المثل من النعم، أو تقويم المثل ويشتري بقيمته طعاماً فيطعم كل مسكين، أو يصوم عن إطعام كل مسكين يوماً»","m":0,"d":1,"p":0},{"id":"t116","q":"المضمضة والاستنشاق فرضان من غسل الوجه على المذهب.  (صح أم خطأ؟)","a":"صح","x":"«فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة»","m":0,"d":1,"p":0},{"id":"t117","q":"يجزئ مسح بعض الرأس في الوضوء.  (صح أم خطأ؟)","a":"خطأ","x":"«فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة»","m":0,"d":1,"p":0},{"id":"t118","q":"تبدأ مدة المسح على الخفين من وقت لبسهما.  (صح أم خطأ؟)","a":"خطأ","x":"«يمسح المقيم، والعاصي بسفره، من الحدث بعد اللبس: يوماً وليلة. والمسافر: ثلاثة أيام بلياليهن»","m":0,"d":1,"p":0},{"id":"t119","q":"يُشترط للمسح على الخفين لبسهما على طهارة كاملة.  (صح أم خطأ؟)","a":"صح","x":"«يجوز بشروط سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما لمحل الفرض ولو بربطهما، وإمكان المشي بهما عرفا، وثبوتهما بنفسهما، وإباحتهما، وطهارة عينهما، وعدم وصفهما البشرة»","m":0,"d":1,"p":0},{"id":"t130","q":"في التيمم يُمسح الوجه واليدان إلى المرفقين.  (صح أم خطأ؟)","a":"خطأ","x":"«فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة»","m":0,"d":1,"p":0},{"id":"t131","q":"الأذان والإقامة فرض كفاية على الرجال الأحرار المقيمين.  (صح أم خطأ؟)","a":"صح","x":"«هما فرض كفاية في الحضر على الرجال الأحرار، ويسنان للمنفرد وفي السفر، ويكرهان للنساء ولو بلا رفع صوت»","m":0,"d":1,"p":0},{"id":"t132","q":"الطهارة شرط لصحة الأذان.  (صح أم خطأ؟)","a":"خطأ","x":"«لا يكره أذان المحدث، بل تكره إقامته»","m":0,"d":1,"p":0},{"id":"t152","q":"يتم المسافر إذا نوى إقامة أكثر من أربعة أيام.  (صح أم خطأ؟)","a":"صح","x":"«ويلزم إتمام الصلاة إن: دخل وقتها وهو في الحضر. أو صلى خلف من يتم. أو لم ينو القصر عند الإحرام. أو نوى إقامة: مطلقة، أو أكثر من أربعة أيام. أو أقام: لحاجة، وظن أن لا تنقضي إلا بعد الأربعة. أو أخر الصلاة: بلا عذر حتى ضاق وقتها عنها»","m":0,"d":1,"p":0},{"id":"t156","q":"يجب حضور أربعين لصحة الجمعة.  (صح أم خطأ؟)","a":"صح","x":"«يشترط لصحة الجمعة أربعة شروط: الوقت، وهو من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل. وأن تكون بقرية ولو من قصب يستوطنها أربعون استيطان إقامة. وحضور أربعين، فإن نقصوا قبل إتمامها استأنفوا ظهراً. وتقدم خطبتين»","m":0,"d":1,"p":0},{"id":"t173","q":"في خمس وعشرين من الإبل بنت مخاض.  (صح أم خطأ؟)","a":"صح","x":"«فأقل نصاب الإبل: خمس، وفيها: شاة. ثم في كل خمس: شاة. إلى خمس وعشرين، فتجب: بنت مخاض، وهي: ما تم لها سنة. وفي ست وثلاثين: بنت لبون، لها: سنتان. وفي ست وأربعين: حقة، لها: ثلاث سنين. وفي إحدى وستين: جذعة، لها: أربع سنين. وفي ست وسبعين: بنتا لبون. وفي إحدى وتسعين: حقتان. وفي مائة وإحدى وعشرين: ثلاث بنات لبون»","m":0,"d":1,"p":0},{"id":"t174","q":"في أربعين من البقر مسنة.  (صح أم خطأ؟)","a":"صح","x":"«وأقل نصاب البقر أهلية كانت أو وحشية: ثلاثون، وفيها: تبيع، وهو: ما له سنة. وفي أربعين: مسنة، لها: سنتان. وفي ستين: تبيعان. ثم في كل ثلاثين: تبيع، وفي كل أربعين: مسنة»","m":0,"d":1,"p":0},{"id":"t175","q":"المعادن فيها الخمس كالركاز.  (صح أم خطأ؟)","a":"خطأ","x":"«ما استخرج من المعادن ففيه بمجرد إخراجه ربع العشر إن بلغت القيمة نصابا بعد السبك والتصفية»","m":0,"d":1,"p":0},{"id":"t177","q":"نصاب الحبوب خمسة أوسق وهي ثلاثمائة صاع.  (صح أم خطأ؟)","a":"صح","x":"«شرطان: الأول: أن يبلغ نصاباً، وقدره بعد تصفية الحب وجفاف الثمر خمسة أوسق، وهي ثلاثمائة صاع. الثاني: أن يكون مالكاً للنصاب وقت وجوبها، فوقت الوجوب في الحب إذا اشتد، وفي الثمر إذا بدا صلاحها»","m":0,"d":1,"p":0},{"id":"t186","q":"من غلبه القيء أفطر ووجب عليه القضاء.  (صح أم خطأ؟)","a":"خطأ","x":"«المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره»","m":0,"d":1,"p":0},{"id":"t187","q":"إنزال المني بنظرة واحدة يفطر.  (صح أم خطأ؟)","a":"خطأ","x":"«المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره»","m":0,"d":1,"p":0},{"id":"t192","q":"يصح الاعتكاف في غير مسجد.  (صح أم خطأ؟)","a":"خطأ","x":"«شرط صحته ستة أشياء: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد. ويزاد في حق من تلزمه الجماعة: أن يكون المسجد مما تقام فيه»","m":0,"d":1,"p":0},{"id":"t197","q":"الاغتسال من محظورات الإحرام.  (صح أم خطأ؟)","a":"خطأ","x":"«محظورات الإحرام سبعة: تعمد لبس المخيط على الرجل حتى الخفين، وتعمد تغطية الرأس من الرجل، وقصد شم الطيب ومسه واستعماله، وإزالة الشعر من البدن وتقليم الأظفار، وقتل صيد البر الوحشي المأكول، وعقد النكاح ولا يصح، والوطء في الفرج ودواعيه»","m":0,"d":1,"p":0},{"id":"t204","q":"الطهارة من الحدث شرط في السعي كالطواف.  (صح أم خطأ؟)","a":"خطأ","x":"«شروط صحة السعي ثمانية: النية، والإسلام، والعقل، والموالاة، والمشي مع القدرة، وكونه بعد طواف ولو مسنوناً كطواف القدوم، وتكميل السبع، واستيعاب ما بين الصفا والمروة»","m":0,"d":1,"p":0},{"id":"t390","q":"فروض الوضوء ثمانية وشروطه ستة.  (صح أم خطأ؟)","a":"خطأ","x":"«فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة» «شروطه ثمانية: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار»","m":0,"d":1,"p":0},{"id":"t392","q":"موجبات الغسل خمسة.  (صح أم خطأ؟)","a":"خطأ","x":"«موجبات الغسل سبعة: انتقال المني... وخروجه من مخرجه ولو دماً، ويشترط أن يكون بلذة ما لم يكن نائماً ونحوه. وتغييب الحشفة كلها أو قدرها بلا حائل في فرج ولو دبراً... ولكن لا يجب الغسل إلا على ابن عشر وبنت تسع. وإسلام الكافر ولو مرتداً. وخروج الحيض. وخروج دم النفاس. والموت تعبداً»","m":0,"d":1,"p":0},{"id":"t393","q":"الأغسال المستحبة عشرة.  (صح أم خطأ؟)","a":"خطأ","x":"«الأغسال المستحبة ستة عشر: آكدها لصلاة جمعة في يومها لذكر حضرها، ثم لغسل ميت، ثم لعيد في يومه، ولكسوف، واستسقاء، وجنون، وإغماء، والاستحاضة لكل صلاة، وللإحرام، ولدخول مكة، وحرمها، ولوقوف بعرفة، وطواف زيارة، وطواف وداع، ومبيت بمزدلفة، ورمي جمار»","m":0,"d":1,"p":0},{"id":"t394","q":"فروض التيمم ثلاثة.  (صح أم خطأ؟)","a":"خطأ","x":"«فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة»","m":0,"d":1,"p":0},{"id":"t395","q":"شروط المسح على الخفين خمسة.  (صح أم خطأ؟)","a":"خطأ","x":"«يجوز بشروط سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما لمحل الفرض ولو بربطهما، وإمكان المشي بهما عرفا، وثبوتهما بنفسهما، وإباحتهما، وطهارة عينهما، وعدم وصفهما البشرة»","m":0,"d":1,"p":0},{"id":"t396","q":"أركان الصلاة اثنا عشر.  (صح أم خطأ؟)","a":"خطأ","x":"«أركان الصلاة أربعة عشر، ولا تسقط عمداً ولا جهلاً ولا سهواً: القيام في الفرض على القادر منتصباً، وتكبيرة الإحرام وهي: الله أكبر، وقراءة الفاتحة مرتبة، والركوع، والرفع منه، والاعتدال قائماً، والسجود، والرفع من السجود، والجلوس بين السجدتين، والطمأنينة، والتشهد الأخير، والجلوس للتشهد الأخير وللتسليمتين، والتسليمتان، وترتيب الأركان»","m":0,"d":1,"p":0},{"id":"t398","q":"شروط الصلاة سبعة.  (صح أم خطأ؟)","a":"خطأ","x":"«شروط الصلاة تسعة: الإسلام، والعقل، والتمييز، والطهارة مع القدرة، ودخول الوقت، وستر العورة مع القدرة بشيء لا يصف البشرة، واجتناب النجاسة ببدنه وثوبه وبقعته مع القدرة، واستقبال القبلة، والنية»","m":0,"d":1,"p":0},{"id":"t399","q":"تشديدات الفاتحة أربع عشرة بدون البسملة.  (صح أم خطأ؟)","a":"خطأ","x":"«الفاتحة فيها إحدى عشرة تشديدة، فإن ترك تشديدة واحدة أو حرفاً ولم يأت بما ترك لم تصح»","m":0,"d":1,"p":0},{"id":"t400","q":"شروط جمع التقديم اثنان وشروط جمع التأخير أربعة.  (صح أم خطأ؟)","a":"خطأ","x":"«فإن جمع تقديماً، اشترط لصحة الجمع: نيته عند إحرام الأولى. وأن لا يفرق بينهما بنحو نافلة: بل بقدر إقامة، ووضوء خفيف. وأن يوجد العذر عند افتتاحهما. وأن يستمر إلى فراغ الثانية» «وإن جمع تأخيراً، اشترط: نية الجمع بوقت الأولى: قبل أن يضيق وقتها عنها. وبقاء العذر إلى دخول وقت الثانية»","m":0,"d":1,"p":0},{"id":"t401","q":"أوقات النهي خمسة إجمالاً.  (صح أم خطأ؟)","a":"خطأ","x":"«أوقات النهي هي: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول»","m":0,"d":1,"p":0},{"id":"t402","q":"شروط صحة الجمعة ستة.  (صح أم خطأ؟)","a":"خطأ","x":"«يشترط لصحة الجمعة أربعة شروط: الوقت، وهو من أول وقت العيد إلى آخر وقت الظهر، وتجب بالزوال وبعده أفضل. وأن تكون بقرية ولو من قصب يستوطنها أربعون استيطان إقامة. وحضور أربعين، فإن نقصوا قبل إتمامها استأنفوا ظهراً. وتقدم خطبتين»","m":0,"d":1,"p":0},{"id":"t403","q":"أركان الخطبتين أربعة.  (صح أم خطأ؟)","a":"خطأ","x":"«أركانهما ستة: حمد الله، والصلاة على رسول الله صلى الله عليه وسلم، وقراءة آية من كتاب الله، والوصية بتقوى الله، وموالاتهما مع الصلاة، والجهر بحيث يسمع العدد المعتبر حيث لا مانع»","m":0,"d":1,"p":0},{"id":"t404","q":"أركان صلاة الجنازة ثمانية وشروطها سبعة.  (صح أم خطأ؟)","a":"خطأ","x":"«شروطها ثمانية: النية، والتكليف، واستقبال القبلة، وستر العورة، واجتناب النجاسة، وحضور الميت إن كان بالبلد، وإسلام المصلي والمصلى عليه، وطهارتهما ولو بتراب لعذر» «أركانها سبعة: القيام في فرضها، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على محمد، والدعاء للميت، والسلام، والترتيب»","m":0,"d":1,"p":0},{"id":"t405","q":"شروط وجوب الزكاة أربعة.  (صح أم خطأ؟)","a":"خطأ","x":"«شرط وجوبها خمسة أشياء: الإسلام، فلا تجب على الكافر ولو مرتداً. والحرية، فلا تجب على الرقيق ولو مكاتباً. وملك النصاب. والملك التام. وتمام الحول، ولا يضر لو نقص نصف يوم. وتجب في مال الصغير والمجنون»","m":0,"d":1,"p":0},{"id":"t407","q":"أول نصاب الإبل عشر وفيها شاتان.  (صح أم خطأ؟)","a":"خطأ","x":"«فأقل نصاب الإبل: خمس، وفيها: شاة. ثم في كل خمس: شاة. إلى خمس وعشرين، فتجب: بنت مخاض، وهي: ما تم لها سنة. وفي ست وثلاثين: بنت لبون، لها: سنتان. وفي ست وأربعين: حقة، لها: ثلاث سنين. وفي إحدى وستين: جذعة، لها: أربع سنين. وفي ست وسبعين: بنتا لبون. وفي إحدى وتسعين: حقتان. وفي مائة وإحدى وعشرين: ثلاث بنات لبون»","m":0,"d":1,"p":0},{"id":"t408","q":"أول نصاب البقر أربعون وفيه تبيع.  (صح أم خطأ؟)","a":"خطأ","x":"«وأقل نصاب البقر أهلية كانت أو وحشية: ثلاثون، وفيها: تبيع، وهو: ما له سنة. وفي أربعين: مسنة، لها: سنتان. وفي ستين: تبيعان. ثم في كل ثلاثين: تبيع، وفي كل أربعين: مسنة»","m":0,"d":1,"p":0},{"id":"t409","q":"في العسل ربع العشر.  (صح أم خطأ؟)","a":"خطأ","x":"«في العسل العشر، ونصابه مائة وستون رطلا عراقية»","m":0,"d":1,"p":0},{"id":"t410","q":"أهل الزكاة ستة.  (صح أم خطأ؟)","a":"خطأ","x":"«أهل الزكاة ثمانية: الفقير وهو من لم يجد نصف كفايته، والمسكين وهو من يجد نصفها أو أكثرها، والعامل عليها، والمؤلف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل وهو الغريب المنقطع بغير بلده»","m":0,"d":1,"p":0},{"id":"t411","q":"المراد بالرقاب في مصارف الزكاة الفقراء المدينون.  (صح أم خطأ؟)","a":"خطأ","x":"«أهل الزكاة ثمانية: الفقير وهو من لم يجد نصف كفايته، والمسكين وهو من يجد نصفها أو أكثرها، والعامل عليها، والمؤلف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل وهو الغريب المنقطع بغير بلده»","m":0,"d":1,"p":0},{"id":"t412","q":"شروط صحة الصوم أربعة وشروط وجوبه ستة.  (صح أم خطأ؟)","a":"خطأ","x":"«شرط وجوب الصوم أربعة أشياء: الإسلام، والبلوغ، والعقل، والقدرة عليه» «شروط صحته ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والتمييز، والعقل، والنية من الليل لكل يوم واجب»","m":0,"d":1,"p":0},{"id":"t413","q":"المفطرات عشرة.  (صح أم خطأ؟)","a":"خطأ","x":"«المفطرات اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، وبلع النخامة إذا وصلت إلى الفم، والحجامة خاصة حاجماً كان أو محجوماً، وإنزال المني بتكرار النظر لا بنظرة ولا بالتفكر والاحتلام، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ من مائع وغيره»","m":0,"d":1,"p":0},{"id":"t414","q":"شروط صحة الاعتكاف أربعة.  (صح أم خطأ؟)","a":"خطأ","x":"«شرط صحته ستة أشياء: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد. ويزاد في حق من تلزمه الجماعة: أن يكون المسجد مما تقام فيه»","m":0,"d":1,"p":0},{"id":"t415","q":"محظورات الإحرام تسعة.  (صح أم خطأ؟)","a":"خطأ","x":"«محظورات الإحرام سبعة: تعمد لبس المخيط على الرجل حتى الخفين، وتعمد تغطية الرأس من الرجل، وقصد شم الطيب ومسه واستعماله، وإزالة الشعر من البدن وتقليم الأظفار، وقتل صيد البر الوحشي المأكول، وعقد النكاح ولا يصح، والوطء في الفرج ودواعيه»","m":0,"d":1,"p":0},{"id":"t416","q":"واجبات الحج أربعة وأركانه سبعة.  (صح أم خطأ؟)","a":"خطأ","x":"«أركان الحج أربعة: الإحرام، وهو مجرد النية، فمن تركه لم ينعقد حجه. والوقوف بعرفة. وطواف الإفاضة. والسعي بين الصفا والمروة» «واجباته سبعة: الإحرام من الميقات، والوقوف إلى الغروب لمن وقف نهاراً، والمبيت ليلة النحر بمزدلفة إلى بعد نصف الليل، والمبيت بمنى ليالي التشريق، ورمي الجمار مرتباً، والحلق أو التقصير، وطواف الوداع»","m":0,"d":1,"p":0},{"id":"t417","q":"شروط صحة الطواف ثمانية وشروط السعي أحد عشر.  (صح أم خطأ؟)","a":"خطأ","x":"«شروط صحة الطواف أحد عشر: النية، والإسلام، والعقل، ودخول وقته، وستر العورة، واجتناب النجاسة، والطهارة من الحدث، وتكميل السبع، وجعل البيت عن يساره، وكونه ماشياً مع القدرة، والموالاة» «شروط صحة السعي ثمانية: النية، والإسلام، والعقل، والموالاة، والمشي مع القدرة، وكونه بعد طواف ولو مسنوناً كطواف القدوم، وتكميل السبع، واستيعاب ما بين الصفا والمروة»","m":0,"d":1,"p":0},{"id":"t418","q":"واجبات العمرة ثلاثة وأركانها اثنان.  (صح أم خطأ؟)","a":"خطأ","x":"«أركان العمرة ثلاثة: الإحرام والطواف والسعي» «واجباتها شيئان: الإحرام بها من الحل، والحلق أو التقصير»","m":0,"d":1,"p":0},{"id":"t419","q":"يحصل التحلل الأول بواحد من ثلاثة.  (صح أم خطأ؟)","a":"خطأ","x":"«التحلل الأول يحصل باثنين من: رمي، وحلق، وطواف، ويحل له كل شيء إلا النساء. والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل»","m":0,"d":1,"p":0},{"id":"t420","q":"دم المتعة والقران على التخيير.  (صح أم خطأ؟)","a":"خطأ","x":"«قسم الترتيب: كدم المتعة والقران وترك الواجب والإحصار والوطء: فيجب على متمتع وقارن وتارك واجب دم، فإن عدمه أو ثمنه صام ثلاثة أيام في الحج، والأفضل كون آخرها يوم عرفة، ويصح أيام التشريق، وسبعة إذا رجع إلى أهله»","m":0,"d":1,"p":0},{"id":"q19","q":"يسن رفع اليدين في الصلاة، اذكر ثلاثة مواضع.","a":"وسنن الأفعال، وتسمى: الهيئات: رفع اليدين: مع تكبيرة الإحرام، وعند الركوع، وعند الرفع منه","x":"","m":0,"d":1,"p":113},{"id":"t58","q":"القهقهة في الصلاة تبطلها.  (صح أم خطأ؟)","a":"صح","x":"«وبالقهقهة. وبالكلام، ولو سهواً»","m":0,"d":1,"p":118},{"id":"t64","q":"يشترط في زكاة الخارج من الأرض حولان الحول.  (صح أم خطأ؟)","a":"خطأ","x":"«وإنما تجب - فيما تجب - بشرطين: الأول: أن يبلغ نصاباً... الثاني: أن يكون مالكاً للنصاب وقت وجوبها»","m":0,"d":1,"p":176},{"id":"t185","q":"تجب نية صوم رمضان من الليل لكل يوم.  (صح أم خطأ؟)","a":"صح","x":"«السادس: النية من الليل: لكل يوم واجب»","m":0,"d":1,"p":192},{"id":"t421","q":"من وطئ قبل التحلل الأول فعليه شاة.  (صح أم خطأ؟)","a":"خطأ","x":"«ويجب على من: وطئ في الحج: قبل التحلل الأول ... بدنة»","m":0,"d":1,"p":213},{"id":"t422","q":"المبيت بمزدلفة يجب إلى طلوع الفجر.  (صح أم خطأ؟)","a":"خطأ","x":"«والمبيت ليلة النحر بمزدلفة: إلى بعد نصف الليل»","m":0,"d":1,"p":217},{"id":"q26","q":"اذكر مثالين لما لا يصح بيعه لعدم القدرة على تسليمه.","a":"وشروطه سبعة: أحدها: الرضى... الثاني: الرشد... الثالث: كون المبيع مالاً... الرابع: أن يكون المبيع ملكاً للبائع، أو مأذوناً له فيه وقت العقد... الخامس: القدرة على تسليمه، فلا يصح بيع: الآبق، والشارد، ولو لقادر على تحصيلهما. السادس: معرفة الثمن، والمثمن... السابع: أن يكون منجزاً، لا معلقاً","x":"","m":1,"d":1,"p":243},{"id":"q48","q":"ما شروط البيع؟","a":"وشروطه سبعة: أحدها: الرضى... الثاني: الرشد... الثالث: كون المبيع مالاً... الرابع: أن يكون المبيع ملكاً للبائع، أو مأذوناً له فيه وقت العقد... الخامس: القدرة على تسليمه، فلا يصح بيع: الآبق، والشارد، ولو لقادر على تحصيلهما. السادس: معرفة الثمن، والمثمن... السابع: أن يكون منجزاً، لا معلقاً","x":"","m":1,"d":1,"p":243},{"id":"f80","q":"عدد شروط البيع ........ وعدد أقسام الخيار ........","a":"سبعة، سبعة","x":"","m":1,"d":1,"p":243},{"id":"m109","q":"عدد شروط البيع:","a":"سبعة","x":"","m":1,"d":1,"p":243},{"id":"m110","q":"لا يصح بيع الآبق والشارد لفقد شرط:","a":"القدرة على تسليم المبيع","x":"","m":1,"d":1,"p":243},{"id":"m713","q":"كم عدد شروط البيع؟","a":"سبعة","x":"","m":1,"d":1,"p":243},{"id":"t212","q":"يصح بيع السمك في الماء.  (صح أم خطأ؟)","a":"خطأ","x":"«وشروطه سبعة: أحدها: الرضى... الثاني: الرشد... الثالث: كون المبيع مالاً... الرابع: أن يكون المبيع ملكاً للبائع، أو مأذوناً له فيه وقت العقد... الخامس: القدرة على تسليمه، فلا يصح بيع: الآبق، والشارد، ولو لقادر على تحصيلهما. السادس: معرفة الثمن، والمثمن... السابع: أن يكون منجزاً، لا معلقاً»","m":1,"d":1,"p":243},{"id":"t426","q":"شروط البيع خمسة.  (صح أم خطأ؟)","a":"خطأ","x":"«وشروطه سبعة: أحدها: الرضى... الثاني: الرشد... الثالث: كون المبيع مالاً... الرابع: أن يكون المبيع ملكاً للبائع، أو مأذوناً له فيه وقت العقد... الخامس: القدرة على تسليمه، فلا يصح بيع: الآبق، والشارد، ولو لقادر على تحصيلهما. السادس: معرفة الثمن، والمثمن... السابع: أن يكون منجزاً، لا معلقاً»","m":1,"d":1,"p":243},{"id":"q246","q":"اذكر أقسام الشروط في البيع مع التمثيل.","a":"وهي قسمان: صحيح: لازم. وفاسد: مبطل للبيع. فالصحيح: كشرط تأجيل الثمن، أو بعضه. أو رهن، أو ضمين: معينين. أو شرط صفة في المبيع والفاسد المبطل: كشرط: بيع آخر. أو سلف. أو قرض. أو إجارة. أو شركة. أو صرف للثمن... وكذا كل ما كان في معنى ذلك، مثل: أن تزوجني ابنتك، أو أزوجك ابنتي","x":"","m":1,"d":1,"p":246},{"id":"m111","q":"شرط تأجيل الثمن في البيع:","a":"صحيح لازم","x":"","m":1,"d":1,"p":246},{"id":"m714","q":"الشروط في البيع قسمان، وهما:","a":"صحيح لازم، وفاسد مبطل للبيع","x":"","m":1,"d":1,"p":246},{"id":"m715","q":"اشتراط تأجيل الثمن أو اشتراط صفة في المبيع هو:","a":"شرط صحيح لازم","x":"","m":1,"d":1,"p":246},{"id":"t77","q":"شرط تأجيل الثمن في البيع فاسد مبطل.  (صح أم خطأ؟)","a":"خطأ","x":"«وهي قسمان: صحيح: لازم. وفاسد: مبطل للبيع. فالصحيح: كشرط تأجيل الثمن، أو بعضه. أو رهن، أو ضمين: معينين. أو شرط صفة في المبيع»","m":1,"d":1,"p":246},{"id":"q49","q":"ما أقسام الخيار؟","a":"وأقسامه سبعة: أحدها: خيار المجلس. الثاني: خيار الشرط. الثالث: خيار الغبن. الرابع: خيار التدليس. الخامس: خيار العيب. السادس: خيار الخلف في الصفة. السابع: خيار الخلف في قدر الثمن","x":"","m":1,"d":1,"p":247},{"id":"m112","q":"شرط (بعني دارك على أن تزوجني ابنتك):","a":"فاسد مبطل للبيع","x":"","m":1,"d":1,"p":247},{"id":"m113","q":"عدد أقسام الخيار:","a":"سبعة","x":"","m":1,"d":1,"p":247},{"id":"m716","q":"اشتراط بيع آخر أو سلف أو قرض أو إجارة في عقد البيع هو:","a":"شرط فاسد مبطل للبيع","x":"","m":1,"d":1,"p":247},{"id":"m719","q":"كم أقسام الخيار؟","a":"سبعة","x":"","m":1,"d":1,"p":247},{"id":"t214","q":"اشتراط بيع آخر في عقد البيع شرط فاسد مبطل.  (صح أم خطأ؟)","a":"صح","x":"«والفاسد المبطل: كشرط: بيع آخر. أو سلف. أو قرض. أو إجارة. أو شركة. أو صرف للثمن... وكذا كل ما كان في معنى ذلك، مثل: أن تزوجني ابنتك، أو أزوجك p":403},{"id":"q53","q":"ما عدة المتوفى عنها زوجها والمطلقة؟","a":"فالمفارقة بالوفاة: تعتد مطلقاً: فإن كانت حاملاً من الميت، فعدتها: حتى تضع كل الحمل. وإن لم تكن حاملاً: فإن كانت حرة، فعدتها: أربعة أشهر وعشر ليال بأيامها. وعدة الأمة: نصفها والمفارقة في الحياة... وعدتها: إن كانت حاملاً: بوضع الحمل. وإن لم تكن حاملاً: فإن كانت تحيض، فعدتها: ثلاث حيض: إن كانت حرة... وإن لم تكن تحيض بأن كانت: صغيرة. أو بالغة ولم تر حيضاً ولا نفاساً. أو كانت آيسة، وهي: من بلغت خمسين سنة، فعدتها: ثلاثة أشهر: إن كانت حرة ومن كانت تحيض، ثم ارتفع حيضها قبل أن تبلغ سن الإياس: ولم تعلم ما رفعه: فتتربص تسعة أشهر. ثم تعتد عدة آيسة","x":"","m":1,"d":1,"p":458},{"id":"q251","q":"اذكر عدد المتوفى عنها زوجها في حالتيها، وعدة المطلقة في حالتيها.","a":"فالمفارقة بالوفاة: تعتد مطلقاً: فإن كانت حاملاً من الميت، فعدتها: حتى تضع كل الحمل. وإن لم تكن حاملاً: فإن كانت حرة، فعدتها: أربعة أشهر وعشر ليال بأيامها. وعدة الأمة: نصفها والمفارقة في الحياة... وعدتها: إن كانت حاملاً: بوضع الحمل. وإن لم تكن حاملاً: فإن كانت تحيض، فعدتها: ثلاث حيض: إن كانت حرة... وإن لم تكن تحيض بأن كانت: صغيرة. أو بالغة ولم تر حيضاً ولا نفاساً. أو كانت آيسة، وهي: من بلغت خمسين سنة، فعدتها: ثلاثة أشهر: إن كانت حرة","x":"","m":1,"d":1,"p":458},{"id":"f16","q":"عدة المتوفى عنها زوجها غير الحامل ........ (بالزمن)","a":"أربعة أشهر وعشر","x":"","m":1,"d":1,"p":458},{"id":"f85","q":"عدة الحامل ........ وعدة المطلقة التي تحيض ........","a":"وضع الحمل، ثلاث حيض","x":"","m":1,"d":1,"p":458},{"id":"m132","q":"عدة المتوفى عنها غير الحامل:","a":"أربعة أشهر وعشر","x":"","m":1,"d":1,"p":458},{"id":"m133","q":"عدة الأمة المتوفى عنها:","a":"شهران وخمس ليال","x":"","m":1,"d":1,"p":458},{"id":"m134","q":"عدة المطلقة التي لا تحيض:","a":"ثلاثة أشهر","x":"","m":1,"d":1,"p":458},{"id":"m135","q":"سن الإياس في المذهب:","a":"خمسون سنة","x":"","m":1,"d":1,"p":458},{"id":"m818","q":"عدة المتوفى عنها زوجها الحامل:","a":"حتى تضع كل الحمل","x":"","m":1,"d":1,"p":458},{"id":"m819","q":"عدة الحرة المتوفى عنها زوجها غير الحامل:","a":"أربعة أشهر وعشر ليال","x":"","m": لأخضر. والتحسين: بالحناء. والإسفيداج. والاكتحال بالأسود. والادهان بالمطيب. وتحمير الوجه. وحفه","x":"","m":1,"d":1,"p":461},{"id":"f86","q":"الإحداد ترك: الزينة، و........، ولبس الحلي، ولبس الملون من الثياب","a":"الطيب","x":"","m":1,"d":1,"p":461},{"id":"t227","q":"من الإحداد: ترك الزينة والطيب ولبس الحلي والملون من الثياب والاكتحال بالأسود.  (صح أم خطأ؟)","a":"صح","x":"«والإحداد: ترك: الزينة. والطيب: كالزعفران. ولبس الحلي - ولو خاتماً -. ولبس الملون من الثياب: كالأحمر، والأصفر، والأخضر. والتحسين: بالحناء. والإسفيداج. والاكتحال بالأسود. والادهان بالمطيب. وتحمير الوجه. وحفه»","m":1,"d":1,"p":461},{"id":"q28","q":"ما شروط تحريم الرضاع؟","a":"وتحريم الرضاع في النكاح، وثبوت المحرمية: كالنسب، بشرط: أن يرتضع خمس رضعات. في العامين، فلو ارتضع بقية الخمس بعد العامين بلحظة: لم تثبت الحرمة","x":"","m":1,"d":1,"p":465},{"id":"q252","q":"بم تثبت المحرمية بالرضاع؟ وما حكم من رضع ثلاث رضعات؟","a":"وتحريم الرضاع في النكاح، وثبوت المحرمية: كالنسب، بشرط: أن يرتضع خمس رضعات. في العامين، فلو ارتضع بقية الخمس بعد العامين بلحظة: لم تثبت الحرمة","x":"","m":1,"d":1,"p":465},{"id":"f15","q":"تثبت المحرمية بالرضاع بشرطين: ........ و ........","a":"خمس رضعات، في العامين","x":"","m":1,"d":1,"p":465},{"id":"m138","q":"تثبت المحرمية بالرضاع بـ:","a":"خمس رضعات في العامين","x":"","m":1,"d":1,"p":465},{"id":"m821","q":"يثبت تحريم الرضاع في النكاح وثبوت المحرمية بشرط:","a":"أن يرتضع خمس رضعات في العامين","x":"","m":1,"d":1,"p":465},{"id":"t81","q":"تثبت المحرمية بالرضاع بثلاث رضعات.  (صح أم خطأ؟)","a":"خطأ","x":"«وتحريم الرضاع في النكاح، وثبوت المحرمية: كالنسب، بشرط: أن يرتضع خمس رضعات. في العامين، فلو ارتضع بقية الخمس بعد العامين بلحظة: لم تثبت الحرمة»","m":1,"d":1,"p":465},{"id":"t228","q":"تثبت المحرمية بالرضاع بأربع رضعات.  (صح أم خطأ؟)","a":"خطأ","x":"«وتحريم الرضاع في النكاح، وثبوت المحرمية: كالنسب، بشرط: أن يرتضع خمس رضعات. في العامين، فلو ارتضع بقية الخمس بعد العامين بلحظة: لم تثبت الحرمة»","m":1,"d":1,"p":465},{"id":"m822","q":"الواجب على الزوج لزوجته من النفقة:","a":"ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف","x":"","m":1,"d":1,"p":467},{"id":"q55","q":"ما شروط نفقة الأقارب؟","a":"باب نفقة الأقارب والمماليك: يجب على القريب: نفقة أقاربه، وكسوتهم، وسكناهم، بالمعروف، بثلاثة شروط: الأول: أن يكونوا فقراء: لا مال لهم، ولا كسب. الثاني: أن يكون المنفق: غنياً إما بماله، أو كسبه. وأن يفضل عن قوت نفسه وزوجته ورقيقه: يومه وليلته. الثالث: أن يكون وارثاً لهم بفرض أو تعصيب، إلا الأصول والفروع: فتجب لهم وعليهم مطلقاً","x":"","m":1,"d":1,"p":470},{"id":"f87","q":"تجب نفقة القريب بثلاثة شروط: ........","a":"فقر المنفَق عليه وعجزه، ويسار المنفِق، وكونه وارثاً له","x":"","m":1,"d":1,"p":470},{"id":"m139","q":"نفقة الأقارب تجب بشروط عددها:","a":"ثلاثة","x":"","m":1,"d":1,"p":470},{"id":"m140","q":"إذا بلغ الصبي سبعاً عاقلاً:","a":"خُيّر بين أبويه","x":"","m":1,"d":1,"p":477},{"id":"m141","q":"إذا بلغت الأنثى سبعاً:","a":"كانت عند أبيها وجوباً حتى تتزوج","x":"","m":1,"d":1,"p":477},{"id":"t229","q":"الغلام إذا بلغ سبعاً خُيّر بين أبويه.  (صح أم خطأ؟)","a":"صح","x":"«وإذا بلغ الصبي سبع سنين عاقلاً: خير بين أبويه... وإذا بلغت الأنثى سبعاً: كانت عند أبيها - وجوباً - إلى أن تتزوج... والمجنون - ولو أنثى -: عند أمه مطلقاً»","m":1,"d":1,"p":477},{"id":"m824","q":"من المحرمات من الأطعمة:","a":"النجس كالميتة والدم ولحم الخنزير","x":"","m":1,"d":1,"p":519},{"id":"m142","q":"الجلالة لا تحل حتى:","a":"تحبس ثلاثاً وتطعم الطاهر","x":"","m":1,"d":1,"p":521},{"id":"m143","q":"يحل من حيوان البحر:","a":"كل ما فيه غير ضفدع وحية وتمساح","x":"","m":1,"d":1,"p":521},{"id":"m825","q":"الجلَّالة هي:","a":"التي أكثر علفها النجاسة، فتحرم هي ولبنها وبيضها حتى تحبس ثلاثًا وتُطعم الطاهر","x":"","m":1,"d":1,"p":521},{"id":"t86","q":"يحل كل ما في البحر إلا الضفدع والحية والتمساح.  (صح أم خطأ؟)","a":"صح","x":"«ويحل كل ما في البحر غير: ضفدع. وحية. وتمساح»","m":1,"d":1,"p":521},{"id":"q57","q":"ما شروط الذكاة؟","a":"باب الذكاة... وشروطها أربعة: أحدها: كون الفاعل: عاقلاً، مميزاً، قاصداً للذكاة... الثاني: الآلة: فيحل الذبح بكل محدد... غير: السن، والظفر. الثالث: قطع الحلقوم والمريء... الرابع: قول:
