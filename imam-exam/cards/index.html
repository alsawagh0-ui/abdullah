ناً. وتميّزت بأنها تسقط إن عجز عن الجميع، بخلاف غيرها من الكفارات.","w":["القضاء والكفارة على التخيير: عتق رقبة، أو صيام شهرين متتابعين، أو إطعام ستين مسكيناً، ولا تسقط بالعجز","القضاء فقط، وتستحب الكفارة: إطعام ستين مسكيناً","القضاء والكفارة: عتق رقبة مؤمنة، فإن لم يجد فصيام ثلاثة أيام، فإن لم يستطع فإطعام عشرة مساكين"]},{"id":"s128","b":"الصيام والاعتكاف","q":"متى يجب على من فاته أيام من رمضان قضاؤها فوراً؟","a":"يسن القضاء على الفور، إلا إذا بقي من شعبان بقدر ما عليه فيجب","m":0,"ex":"الأصل أن قضاء رمضان يسن على الفور وله أن يؤخره. لكن إذا ضاق الوقت ولم يبق من شعبان إلا بقدر الأيام التي عليه، وجب عليه القضاء حينئذ؛ حتى لا يدخل رمضان التالي وعليه قضاء.","w":["يجب القضاء على الفور مطلقاً من ثاني أيام شوال","يسن القضاء على الفور، ولا يجب ولو دخل رمضان الثاني","يسن تأخير القضاء إلى شعبان، ويجب إذا دخل شعبان"]},{"id":"s129","b":"الصيام والاعتكاف","q":"اذكر أياماً يحرم صومها؟","a":"العيدين، وأيام التشريق","m":0,"ex":"خمسة أيام يحرم صومها: يوما العيد (الفطر والأضحى)، وأيام التشريق الثلاثة (١١ و١٢ و١٣ ذي الحجة). قارن: يوم الشك وإفراد الجمعة والسبت صومها مكروه، لا محرّم.","w":["العيدين، ويوم عرفة","يوم الشك، وأيام التشريق","العيدين، ويوم الجمعة منفرداً"]},{"id":"s130","b":"الصيام والاعتكاف","q":"ما حكم الاعتكاف؟ وما شروط صحته؟","a":"سنة، ويجب بالنذر. شروط صحته ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد (ومن تلزمه الجماعة: بمسجد تقام فيه الجماعة)","m":0,"ex":"الاعتكاف سنة، ويصير واجباً بالنذر. شروطه ستة: النية، والإسلام، والعقل، والتمييز (فيصح من الصبي المميز)، وعدم ما يوجب الغسل، والمكان: المسجد. ومن تلزمه الجماعة يشترط له مسجد تقام فيه الجماعة.","w":["واجب مرة في العمر. شروطه ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد","سنة، ويجب بالنذر. شروطه ستة: النية، والإسلام، والعقل، والبلوغ، والصوم، وكونه بمسجد","سنة، ويجب بالنذر. شروطه أربعة: النية، والإسلام، والعقل، وكونه بمسجد جامع"],"ca":"سنة، ويجب بالنذر. شروطه ستة: النية، والإسلام، والعقل، والتمييز، وعدم ما يوجب الغسل، وكونه بمسجد"},{"id":"s131","b":"الصيام والاعتكاف","q":"اذكر مبطلات الاعتكاف؟ وما الذي لا يبطله؟","a":"يبطل: بالخروج من المسجد لغير عذر، وبنية الخروج ولو لم يخرج، وبالوطء في الفرج، وبالإنزال بالمباشرة دون الفرج، وبالردة، وبالسكر. ولا يبطل إن خرج: لبول أو غائط، أو طهارة واجبة، أو لإزالة نجاسة، أو لجمعة تلزمه، أو للإتيان بمأكل ومشرب لعدم خادم","m":0,"ex":"القاعدة: يبطل بما ينافي لزوم المسجد أو العبادة، وهي ستة: الخروج بلا عذر، ونية الخروج، والوطء، والإنزال بمباشرة، والردة، والسكر. ولا يبطل بالخروج لما لا بد منه: قضاء الحاجة، وطهارة واجبة، وإزالة نجاسة، وجمعة تلزمه، وإحضار طعام إذا لم يجد خادماً.","w":["يبطل: بالخروج لغير عذر، والوطء، والردة. لا يبطل: بنية الخروج، ولا بالإنزال بمباشرة، ولا بالسكر","يبطل: بالخروج ولو لعذر كبول وطهارة وجمعة. لا يبطل: بنية الخروج، ولا بالمباشرة، ولا بالسكر","يبطل: بالخروج لغير عذر، ونية الخروج، والوطء، والردة، والخروج للجمعة. لا يبطل: بالسكر، ولا بالخروج لبول"],"ca":"يبطل: بالخروج لغير عذر، ونية الخروج، والوطء، والإنزال بمباشرة، والردة، والسكر. لا يبطل: بالخروج لبول وطهارة وجمعة ومأكل"},{"id":"s132","b":"الحج والأضحية","q":"ما حكم الحج والعمرة؟","a":"واجب مع العمرة، في العمر مرة","m":0,"ex":"الحج والعمرة كلاهما واجب، مرة واحدة في العمر. احفظهما مقترنين: «واجبان في العمر مرة»، فالعمرة في المذهب واجبة كالحج لا سنة.","w":["الحج واجب في العمر مرة، والعمرة سنة","واجب مع العمرة، كل عام على المستطيع","الحج واجب في العمر مرتين، والعمرة مرة"]},{"id":"s133","b":"الحج والأضحية","q":"ما هي شروط وجوب الحج؟ وهل للمرأة شرط زائد؟","a":"خمسة: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد الأنثى سادساً: أن تجد لها زوجاً أو محرماً مكلفاً، وتقدر على أجرته وعلى الزاد والراحلة لها وله","m":0,"ex":"خمسة: ثلاثة للتكليف (الإسلام، والعقل، والبلوغ)، ثم كمال الحرية، والاستطاعة. والمرأة يزيد عليها سادس: أن تجد زوجاً أو محرماً مكلفاً، وتقدر على أجرته وعلى الزاد والراحلة لها وله. فإن حجت بلا محرم حرم وأجزأها.","w":["خمسة: الإسلام، والعقل، والبلوغ، والحرية، والاستطاعة. ولا تزيد المرأة شيئاً، فتحج مع رفقة مأمونة","أربعة: الإسلام، والعقل، والبلوغ، والاستطاعة. وتزيد المرأة: إذن زوجها","خمسة: الإسلام، والعقل، والتمييز، والحرية، والاستطاعة. وتزيد المرأة: وجود محرم ولو صغيراً"],"ca":"خمسة: الإسلام، والعقل، والبلوغ، وكمال الحرية، والاستطاعة. وتزيد المرأة: وجود زوج أو محرم مكلف، والقدرة على نفقته"},{"id":"s134","b":"الحج والأضحية","q":"ما حكم الإحرام من الميقات لمن كان منزله دون الميقات؟","a":"واجب؛ ومن منزله دون الميقات فميقاته منزله (والعمرة يحرم بها من الحل)","m":0,"ex":"الإحرام من الميقات من واجبات الحج. ومن كان بيته أقرب إلى مكة من الميقات فلا يرجع إليه، بل يحرم من منزله. أما العمرة فيُحرم بها من الحل (خارج الحرم).","w":["سنة؛ ومن منزله دون الميقات رجع إلى الميقات فأحرم منه","واجب؛ ومن منزله دون الميقات أحرم من مكة للحج والعمرة","ركن؛ ومن منزله دون الميقات فميقاته منزله"]},{"id":"s135","b":"الحج والأضحية","q":"ما هي أنواع النسك الثلاثة؟","a":"التمتع (وهو أفضل)، والإفراد، والقران","m":0,"ex":"ثلاثة أنساك: التمتع: عمرة في أشهر الحج ثم حج بعدها، وهو الأفضل. الإفراد: حج ثم عمرة بعده. القران: يحرم بالعمرة ثم يُدخل عليها الحج قبل طوافها. احفظ الترتيب: تمتع، إفراد، قران.","w":["التمتع، والإفراد، والقران (وهو أفضل)","الإفراد (وهو أفضل)، والتمتع، والقران","التمتع (وهو أفضل)، والإفراد، والإحصار"]},{"id":"s136","b":"الحج والأضحية","q":"ما أثر اشتراط الحاج (اللهم محلي حيث حبستني)؟","a":"له أن يتحلل متى شاء من غير شيء، ولا قضاء عليه","m":0,"ex":"من اشترط عند إحرامه «فإن حبسني حابس فمحلّي حيث حبستني» استفاد: إذا منعه مانع تحلّل متى شاء بلا دم ولا قضاء. فالاشتراط يحميه من لزوم الفدية والقضاء.","w":["له أن يتحلل متى شاء، وعليه دم، ولا قضاء عليه","لا أثر له، فعليه دم وقضاء إن أحصر","له أن يتحلل، ولا دم عليه، وعليه القضاء"]},{"id":"s137","b":"الحج والأضحية","q":"اذكر محظورات الإحرام السبعة؟","a":"لبس المخيط على الرجل، وتغطية الرأس من الرجل والوجه من الأنثى، والطيب، وإزالة الشعر وتقليم الأظفار، وقتل صيد البر الوحشي المأكول، وعقد النكاح، والوطء في الفرج ودواعيه والمباشرة","m":0,"mn":"لِ غَ طِ شَ صَ عَ وَ: لبس، غطاء، طيب، شعر وظفر، صيد، عقد، وطء","ex":"سبعة، قسّمها: في البدن واللباس أربعة (المخيط، وتغطية الرأس للرجل والوجه للمرأة، والطيب، وإزالة الشعر والأظفار). وفي الصيد واحد (قتل صيد البر الوحشي المأكول). وفي النساء اثنان (عقد النكاح، والوطء ودواعيه). ٤ + ١ + ٢ = ٧.","w":["لبس المخيط للرجل، وتغطية الوجه للرجل والرأس للأنثى، والطيب، وإزالة الشعر، وقتل الصيد، وعقد النكاح، والوطء","لبس المخيط للرجل، وتغطية الرأس للرجل، والطيب، وإزالة الشعر، وقتل صيد البحر، والاغتسال، والوطء","لبس المخيط للرجل والمرأة، وتغطية الرأس، والطيب، وإزالة الشعر، وقتل الحشرات، والبيع والشراء، والوطء"],"ca":"لبس المخيط للرجل، وتغطية الرأس للرجل والوجه للأنثى، والطيب، وإزالة الشعر والأظفار، وقتل الصيد، وعقد النكاح، والوطء ودواعيه"},{"id":"s138","b":"الحج والأضحية","q":"ما هو المحظور من محظورات الإحرام الذي لا فدية فيه؟","a":"قتل القمل، وعقد النكاح","m":0,"ex":"كل محظورات الإحرام فيها فدية إلا اثنين: قتل القمل، وعقد النكاح. وعقد النكاح وإن لم تكن فيه فدية فهو لا يصح أصلاً. احفظ: «القمل والنكاح» بلا فدية.","w":["قتل الصيد، وعقد النكاح","قتل القمل، والطيب","تغطية الرأس، وعقد النكاح"]},{"id":"s139","b":"الحج والأضحية","q":"الفدية نوعان: تخيير وترتيب. اذكر أمثلة التخيير؟","a":"كفدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين أو ظفرين، والإمناء بنظرة، والمباشرة بغير إنزال: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. ومنه: جزاء الصيد","m":0,"ex":"فدية التخيير في محظورات الترفّه كاللبس والطيب وتغطية الرأس وإزالة الشعر والأظفار: يختار واحداً من ثلاثة: ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين. لاحظ الأرقام: ١ شاة، ٣ أيام، ٦ مساكين. وجزاء الصيد تخيير أيضاً.","w":["فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح بدنة، أو صيام عشرة أيام، أو إطعام عشرة مساكين","فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح شاة، أو صيام ستة أيام، أو إطعام ثلاثة مساكين","دم المتعة، والقران، وترك الواجب: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين"],"ca":"فدية اللبس، والطيب، وتغطية الرأس، وإزالة أكثر من شعرتين: يخير بين ذبح شاة، أو صيام ثلاثة أيام، أو إطعام ستة مساكين"},{"id":"s140","b":"الحج والأضحية","q":"بم يحصل التحلل الأول في الحج ومم يحل به؟","a":"باثنين من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء إلا النساء","m":0,"ex":"يوم النحر فيه ثلاثة أعمال: الرمي، والحلق، والطواف. إذا فعل أي اثنين منها حصل التحلل الأول، فيحل له كل ما حرم بالإحرام إلا النساء. والثالث مع السعي يحصل به التحلل الثاني.","w":["بواحد من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء إلا النساء","باثنين من ثلاثة: رمي، وحلق، وطواف. ويحل له كل شيء حتى النساء","باثنين من ثلاثة: رمي، وذبح، وحلق. ويحل له كل شيء إلا النساء"]},{"id":"s141","b":"الحج والأضحية","q":"ما الفرق بين التحلل الأول والتحلل الأكبر (الثاني) في الحج؟","a":"بالأول يحل له كل شيء إلا النساء، والثاني يحصل بما بقي مع السعي إن لم يكن سعى قبل، فيحل له كل شيء","m":0,"ex":"التحلل الأول: باثنين من (رمي، وحلق، وطواف)، فيحل له كل شيء إلا النساء. والتحلل الثاني: بفعل الباقي منها مع السعي إن لم يكن سعى قبل، فيحل له كل شيء حتى النساء. فالفرق بينهما: النساء.","w":["بالأول يحل له كل شيء إلا الطيب والنساء، والثاني يحصل بطواف الوداع فيحل له كل شيء","بالأول يحل له كل شيء، والثاني يحصل بالسعي فقط فيحل له الصيد","بالأول يحل له اللبس والحلق فقط، والثاني يحصل بما بقي مع السعي فيحل له كل شيء إلا النساء"]},{"id":"s142","b":"الحج والأضحية","q":"اذكر أركان الحج وأركان العمرة؟","a":"الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي. العمرة ثلاثة: الإحرام، والطواف، والسعي","m":0,"ex":"الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي. والعمرة ثلاثة: هي أركان الحج نفسها بحذف الوقوف بعرفة: الإحرام، والطواف، والسعي. احفظ: العمرة = الحج ناقص عرفة.","w":["الحج أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والحلق. العمرة ثلاثة: الإحرام، والطواف، والحلق","الحج خمسة: الإحرام، والوقوف بعرفة، والمبيت بمزدلفة، وطواف الإفاضة، والسعي. العمرة ثلاثة: الإحرام، والطواف، والسعي","الحج ثلاثة: الوقوف بعرفة، وطواف الإفاضة، والسعي. العمرة اثنان: الطواف، والسعي"]},{"id":"s143","b":"الحج والأضحية","q":"من ترك ركناً، من ترك واجباً، من ترك مسنوناً.. ماذا عليه؟","a":"الركن: لم يتم حجه إلا به. الواجب: عليه دم وحجه صحيح. المسنون: لا شيء عليه","m":0,"ex":"ثلاث درجات: الركن لا يتم الحج إلا بفعله ولا يُجبر بدم. والواجب يُجبر بدم والحج صحيح. والسنة لا شيء في تركها. احفظ: ركن = لا بد منه، واجب = دم، سنة = لا شيء.","w":["الركن: عليه دم وحجه صحيح. الواجب: لم يتم حجه إلا به. المسنون: لا شيء عليه","الركن: لم يتم حجه إلا به. الواجب: لا شيء عليه. المسنون: عليه صدقة","الركن: عليه بدنة وحجه صحيح. الواجب: عليه شاة. المسنون: لا شيء عليه"]},{"id":"s144","b":"الحج والأضحية","q":"ما حكم الأضحية ومتى تجب؟","a":"سنة مؤكدة، وتجب بالنذر، وبقوله: هذه أضحية، أو: لله","m":0,"ex":"الأضحية في الأصل سنة مؤكدة، وتصير واجبة بأحد أمرين: النذر، أو تعيينها بالقول كأن يقول: «هذه أضحية» أو «هذه لله». فالتعيين باللفظ يوجبها.","w":["واجبة على القادر، وتتأكد بالنذر","سنة مؤكدة، ولا تجب ولو بالنذر أو التعيين","سنة مؤكدة، وتجب بمجرد شرائها بنية الأضحية"]},{"id":"s145","b":"الحج والأضحية","q":"كم تجزئ البدنة والبقرة في الأضحية؟","a":"عن سبعة","m":0,"ex":"البدنة (من الإبل) والبقرة تجزئ كل واحدة منهما عن سبعة أشخاص لكبرها. أما الشاة فتجزئ عن الواحد وعن أهل بيته وعياله.","w":["عن عشرة","عن ثلاثة","البدنة عن عشرة، والبقرة عن سبعة"]},{"id":"s146","b":"الحج والأضحية","q":"كيف تُنحر البقر؟","a":"يسن نحر الإبل قائمة، وذبح البقر والغنم على جنبها الأيسر موجهة إلى القبلة","m":0,"ex":"الإبل تُنحر وهي قائمة، أما البقر والغنم فتُذبح مضجعة على جنبها الأيسر متجهة إلى القبلة. احفظ: الإبل قياماً ونحراً، والبقر والغنم على الجنب ذبحاً.","w":["يسن نحر الإبل والبقر قائمة، وذبح الغنم على جنبها الأيسر موجهة إلى القبلة","يسن نحر الإبل باركة، وذبح البقر والغنم على جنبها الأيمن موجهة إلى القبلة","يسن ذبح الإبل والبقر والغنم قائمة، موجهة إلى القبلة"]},{"id":"s147","b":"الحج والأضحية","q":"متى أول وقت ذبح الأضحية يوم العيد؟","a":"من بعد أسبق صلاة العيد بالبلد، أو قدرها لمن لم يصل","m":0,"ex":"يبدأ وقت الذبح بعد أول صلاة عيد تُقام في البلد، ولو لم يصلّ هو بعد. ومن كان في مكان لا تُصلى فيه العيد انتظر قدر زمن الصلاة. ويستمر الوقت إلى آخر ثاني أيام التشريق.","w":["من بعد آخر صلاة عيد بالبلد، أو قدرها لمن لم يصل","من طلوع فجر يوم العيد، لمن صلى ولمن لم يصل","من طلوع الشمس يوم العيد، أو بعد الخطبة لمن صلى"]},{"id":"s148","b":"الحج والأضحية","q":"ما هي السنة في تقسيم لحم الأضحية؟ وهل يجوز إعطاء الجزار منها أجرة؟","a":"يأكل ثلثها، ويهدي ثلثها، ويتصدق بثلثها. ولا يعطي الجزار بأجرته منها شيئاً، وله إعطاؤه صدقة وهدية","m":0,"ex":"السنة قسمة الأضحية أثلاثاً: ثلث يأكله، وثلث يهديه، وثلث يتصدق به. والجزار لا يُعطى منها شيئاً على أنه أجرة، لكن يجوز أن يُعطى منها صدقة أو هدية.","w":["يأكل نصفها، ويتصدق بنصفها. ويجوز أن يعطي الجزار أجرته منها","يتصدق بها كلها، ولا يأكل منها. ولا يعطي الجزار منها شيئاً ولو صدقة","يأكل ثلثها، ويهدي ثلثها، ويتصدق بثلثها. ويجوز أن يعطي الجزار أجرته منها"]},{"id":"s149","b":"الحج والأضحية","q":"ما حكم العقيقة وكم تذبح للغلام والجارية؟ وما السنة في السابع؟","a":"سنة في حق الأب ولو معسراً؛ عن الغلام شاتان، وعن الجارية شاة. والسنة ذبحها في سابع يوم ولادته، ويحلق رأس الغلام فيه ويتصدق بوزنه فضة، ويسمى فيه","m":0,"ex":"العقيقة سنة على الأب ولو كان فقيراً. للذكر شاتان وللأنثى شاة. وفي اليوم السابع ثلاثة أعمال: الذبح، وحلق رأس الغلام والتصدق بوزن شعره فضة، والتسمية.","w":["واجبة على الأب؛ للغلام شاة وللجارية شاة، تذبح في السابع، ويحلق رأسه ويتصدق بوزنه ذهباً","سنة في حق الأم؛ للغلام شاتان وللجارية شاة، تذبح يوم الولادة، ويسمى في الأربعين","سنة في حق الأب؛ للغلام شاة وللجارية شاتان، تذبح في السابع، ويحلق رأسه ويتصدق بوزنه فضة"],"ca":"سنة في حق الأب؛ للغلام شاتان وللجارية شاة، تذبح في السابع، ويحلق رأس الغلام ويتصدق بوزنه فضة، ويسمى"},{"id":"s150","b":"البيوع","q":"كيف ينعقد البيع؟","a":"بالقول الدال على البيع والشراء، وبالمعاطاة","m":1,"ex":"البيع ينعقد بطريقين: بالقول الدال عليه كـ«بعتك» و«اشتريت»، أو بالفعل وهو المعاطاة: أن يعطيه ويأخذ دون صيغة، كقوله: أعطني بهذا خبزاً فيعطيه. ولا ينعقد هزلاً.","w":["بالقول الدال على البيع والشراء فقط، ولا ينعقد بالمعاطاة","بالكتابة والإشهاد، ولا ينعقد بالقول وحده","بالمعاطاة فقط فيما قل ثمنه، وبالقول فيما كثر"]},{"id":"s151","b":"البيوع","q":"اذكر شروط البيع؟","a":"سبعة: الرضى، والرشد، وكون المبيع مالاً، وأن يكون ملكاً للبائع أو مأذوناً له فيه، والقدرة على تسليمه، ومعرفة الثمن والمثمن، وأن يكون منجزاً لا معلقاً","m":1,"mn":"رضى، رشد، مال، ملك، تسليم، معرفة، تنجيز","ex":"سبعة، تجمعها ثلاث جهات: العاقدان (الرضى، والرشد). والمبيع (أن يكون مالاً، مملوكاً للبائع أو مأذوناً له فيه، مقدوراً على تسليمه). والعقد (معرفة الثمن والمثمن، وأن يكون منجزاً غير معلق).","w":["سبعة: الرضى، والبلوغ، وكون المبيع مالاً، وملكه أو الإذن فيه، ورؤية المبيع، ومعرفة الثمن، والإشهاد","ستة: الرضى، والرشد، وكون المبيع مالاً، وملكه، ومعرفة الثمن والمثمن، والقبض في المجلس","سبعة: الإيجاب، والقبول، والرضى، وكون المبيع مالاً، وملكه، والقدرة على تسليمه، وتعليقه على شرط"],"ca":"سبعة: الرضى، والرشد، وكون المبيع مالاً، وملكه أو الإذن فيه، والقدرة على تسليمه، ومعرفة الثمن والمثمن، والتنجيز"},{"id":"s152","b":"البيوع","q":"اذكر أمثلة لبيوع لا تصح وشروط بيع فاسدة؟","a":"الشرط الفاسد المبطل: كشرط بيع آخر، أو سلف، أو قرض، أو إجارة، أو شركة، أو صرف للثمن (بيعتان في بيعة). ومما لا يصح: البيع والشراء في المسجد، وممن تلزمه الجمعة بعد ندائها الذي عند المنبر","m":1,"ex":"الشرط الفاسد المبطل: أن يُشترط مع البيع عقد آخر، كبيع أو سلف أو قرض أو إجارة أو شركة أو صرف، فتصير «بيعتين في بيعة». ومما لا يصح: البيع في المسجد، والبيع بعد نداء الجمعة الذي عند المنبر ممن تلزمه.","w":["الشرط المبطل: كشرط تأجيل الثمن أو رهن أو ضمين. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه","الشرط المبطل: كشرط بيع آخر أو قرض. ويصح البيع في المسجد مع الكراهة، وبعد نداء الجمعة","الشرط المبطل: كشرط صفة في المبيع. ولا يصح البيع في السوق وقت الصلاة، ولا بعد الأذان الأول للجمعة"],"ca":"الشرط المبطل: كشرط بيع آخر أو سلف أو قرض أو إجارة أو شركة. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه"},{"id":"s153","b":"البيوع","q":"ما هي شروط بيع المكيل بالمكيل من جنسه لكي لا يقع في الربا؟","a":"شرطان: المماثلة في القدر، والقبض قبل التفرق","m":1,"ex":"إذا بيع ربوي بجنسه (تمر بتمر، ذهب بذهب) فلا بد من أمرين: التساوي في المقدار، والتقابض قبل التفرق. فإن اختلف الجنس (ذهب بفضة) كفى القبض وجاز التفاضل.","w":["شرطان: المماثلة في القدر، وجواز التأجيل","شرط واحد: القبض قبل التفرق، ويجوز التفاضل","شرطان: المماثلة في القيمة، والقبض قبل التفرق"]},{"id":"s154","b":"النكاح وما يتبعه","q":"متى يسن ويجب ويحرم النكاح؟","a":"يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","m":1,"ex":"حكم النكاح يدور مع حال الشخص: من يخاف الزنا يجب عليه، وذو الشهوة الذي لا يخافه يسن له، ومن لا شهوة له يباح له، ويحرم في دار الحرب لغير ضرورة. احفظ التدرج: يخاف ← يجب، يشتهي ← يسن، لا يشتهي ← يباح.","w":["يجب لذي شهوة لا يخاف الزنا، ويسن لمن يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويكره لمن لا شهوة له، ويباح بدار الحرب","يسن لكل أحد، ويجب على من يخاف الزنا، ويحرم على من لا شهوة له"]},{"id":"s155","b":"النكاح وما يتبعه","q":"ما حكم نظر الرجل للمرأة لخطبة، شهادة، أو مداواة؟","a":"المخطوبة: يجوز للوجه والرقبة واليد والقدم. الشهادة أو المعاملة: يجوز لوجهها، وكذا كفيها لحاجة. المداواة: يجوز إلى المواضع التي يحتاج إليها","m":1,"ex":"النظر يُقدّر بقدر الحاجة: للمخطوبة أوسع (الوجه، والرقبة، واليد، والقدم) لأنه يريد الزواج بها. وللشهادة أو المعاملة الوجه، والكفان عند الحاجة. وللمداواة ما تدعو إليه الحاجة فقط.","w":["المخطوبة: الوجه والكفان فقط. الشهادة والمعاملة: الوجه والرقبة واليد والقدم. المداواة: مواضع الحاجة","المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: لا يجوز النظر. المداواة: الوجه فقط","المخطوبة: جميع ما يظهر غالباً والشعر. الشهادة والمعاملة: الوجه. المداواة: لا يجوز إلا للمحارم"],"ca":"المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: الوجه والكفان لحاجة. المداواة: مواضع الحاجة"},{"id":"s156","b":"النكاح وما يتبعه","q":"ما هما ركنا النكاح؟","a":"الإيجاب، والقبول، مرتبين","m":1,"ex":"للنكاح ركنان: الإيجاب، وهو لفظ الولي أو من يقوم مقامه (زوّجتك)، ثم القبول، وهو لفظ الزوج أو من يقوم مقامه (قبلت). ويجب أن يكونا مرتبين: الإيجاب أولاً ثم القبول.","w":["الولي، والشهادة","الإيجاب، والقبول، والمهر","الإيجاب، والقبول، ولو تقدم القبول"]},{"id":"s157","b":"النكاح وما يتبعه","q":"اذكر شروط النكاح الخمسة؟","a":"تعيين الزوجين، ورضى الزوج المكلف والزوجة الحرة العاقلة الثيب التي تم لها تسع، والولي، والشهادة، وخلو الزوجين من الموانع","m":1,"ex":"خمسة شروط كأنها أسئلة: من هما؟ (تعيين الزوجين). هل رضيا؟ (الرضى). من يعقد؟ (الولي). من يشهد؟ (الشهادة). هل يحل أحدهما للآخر؟ (خلوّهما من الموانع).","w":["تعيين الزوجين، ورضاهما، والولي، والشهادة، والمهر","الإيجاب، والقبول، والولي، والشهادة، والكفاءة","تعيين الزوجين، والولي، والشهادة، والإعلان، وخلو الزوجين من الموانع"],"ca":"تعيين الزوجين، ورضاهما، والولي، والشهادة، وخلو الزوجين من الموانع"},{"id":"s158","b":"النكاح وما يتبعه","q":"متى يسقط المهر (الصداق) كاملاً قبل الدخول؟","a":"بفرقة اللعان، وبفسخه لعيبها، وبفرقة من قبلها (كفسخها لعيبه، وإسلامها تحت كافر، وردتها تحت مسلم، ورضاعها من ينفسخ به نكاحها)","m":1,"ex":"القاعدة: إذا وقعت الفرقة قبل الدخول بسبب من جهتها سقط المهر كله: كفسخه لعيب فيها، أو فسخها لعيبه، أو إسلامها تحت كافر، أو ردتها تحت مسلم، أو إرضاعها من ينفسخ به نكاحها. ويسقط كذلك بفرقة اللعان.","w":["بطلاقه لها، وبخلعه، وبموت أحدهما قبل الدخول","بفرقة اللعان، وبكل فرقة من قبله كطلاقه وردته وإسلامه","بالخلوة بها، وبتقبيلها، وبفسخها لعيبه"],"ca":"بفرقة اللعان، وبفسخه لعيبها، وبكل فرقة من قبلها كفسخها لعيبه وإسلامها أو ردتها وإرضاعها"},{"id":"s159","b":"النكاح وما يتبعه","q":"متى يجب المهر كاملاً؟","a":"موت أحدهما، ووطؤه ولمسه لها، ونظره إلى فرجها لشهوة، وتقبيلها ولو بحضرة الناس، وطلاقها في مرض موت ترث فيه، وخلوته بها عن مميز إن كان يطأ مثله ويوطأ مثلها","m":1,"mn":"موت، وطء ولمس، نظر، تقبيل، طلاق مرض، خلوة","ex":"يتقرر المهر كاملاً بأمور ترجع إلى ثلاثة: انتهاء النكاح بالموت. والاستمتاع ولو بلا وطء: الوطء، واللمس، والنظر إلى فرجها لشهوة، والتقبيل. والخلوة بها بعيداً عن مميز، أو طلاقها في مرض موت ترث فيه.","w":["موت أحدهما، والوطء، والعقد وحده، والطلاق قبل الدخول، وفرقة اللعان","الوطء فقط، دون الخلوة أو التقبيل أو الموت قبل الدخول","موت أحدهما، والوطء، والخلوة، وفسخها لعيبه، وإسلامها تحت كافر"],"ca":"موت أحدهما، والوطء، واللمس والنظر إلى فرجها لشهوة، والتقبيل، وطلاقها في مرض موت ترث فيه، والخلوة بها"},{"id":"s160","b":"النكاح وما يتبعه","q":"ما حكم وليمة العرس والإجابة إليها؟","a":"الوليمة سنة مؤكدة. الإجابة: في المرة الأولى واجبة (إن كان لا عذر ولا منكر)، وفي الثانية سنة، وفي الثالثة مكروهة","m":1,"ex":"الوليمة نفسها سنة مؤكدة. أما إجابة الدعوة فيتدرج حكمها مع التكرار: المرة الأولى واجبة (إن لم يكن عذر ولا منكر)، والثانية سنة، والثالثة مكروهة. احفظ: واجب ← سنة ← مكروه.","w":["الوليمة واجبة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة مكروهة","الوليمة سنة مؤكدة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة محرمة","الوليمة سنة مؤكدة. الإجابة: واجبة في المرات الثلاث إن لم يكن عذر ولا منكر"]},{"id":"s161","b":"النكاح وما يتبعه","q":"إن دُعي لاثنتين في نفس الوقت، لمن يجيب؟","a":"يجيب الكل إن أمكنه، وإلا أجاب: الأسبق قولاً، فالأدين، فالأقرب رحماً فجواراً، ثم يقرع","m":1,"ex":"إن أمكنه حضور الجميع حضر. وإلا قدّم بالترتيب: الأسبق دعوةً، ثم الأكثر ديناً، ثم الأقرب رحماً، ثم الأقرب جواراً، ثم القرعة. احفظ: سَبْق ← دين ← رحم ← جوار ← قرعة.","w":["يجيب الأقرب جواراً، فالأسبق قولاً، فالأدين، ثم يقرع","يجيب الأدين، فالأقرب رحماً، فالأسبق قولاً، ثم يقرع","يجيب الأغنى، فالأسبق قولاً، فالأقرب رحماً، ثم يقرع"]},{"id":"s162","b":"النكاح وما يتبعه","q":"ما حكم استرضاع المرأة الفاجرة أو الكافرة؟","a":"يكره (وكذا سيئة الخلق والجذماء والبرصاء)","m":1,"ex":"يُكره أن يُسترضع للطفل من فيها صفة سيئة أو مرض منفّر، وهي خمس: الفاجرة، والكافرة، وسيئة الخلق، والجذماء، والبرصاء. والحكم كراهة لا تحريم.","w":["يحرم (وكذا سيئة الخلق والجذماء والبرصاء)","يباح (ويكره استرضاع الجذماء والبرصاء فقط)","يكره للفاجرة فقط، ويباح للكافرة"]},{"id":"s163","b":"النكاح وما يتبعه","q":"ما حكم من أوقع الخلع بلفظ \"الطلاق\" دون لفظ الخلع؟","a":"لا يكون خلعاً؛ لأن من شروطه: أن لا يقع بلفظ الطلاق بل بصيغته الموضوعة له، وأن لا ينوي به الطلاق (فيقع طلاقاً)","m":1,"ex":"للخلع صيغة خاصة به مثل: خلعتُ، وفاديتُ. فإن استعمل لفظ الطلاق، أو نوى بالخلع الطلاق، وقع طلاقاً لا خلعاً. احفظ: لفظ الطلاق أو نيته ← طلاق، لفظ الخلع بلا نية طلاق ← خلع.","w":["يكون خلعاً؛ لأن العبرة بالعوض لا باللفظ، فيقع خلعاً ولو بلفظ الطلاق","لا يقع شيء؛ لأن الخلع لا يصح إلا بلفظه فيبطل العقد","يكون خلعاً إن نوى به الخلع، ولا يقع طلاقاً إلا إذا نوى الطلاق"]},{"id":"s164","b":"النكاح وما يتبعه","q":"ماذا يجب على الزوج من النفقة؟ ولمن تجب غير الزوجة المستقرة؟","a":"ما لا غنى لزوجته عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز الحامل، والمتوفى عنها زوجها حاملاً","m":1,"ex":"على الزوج كفاية زوجته بالمعروف: طعام، وشراب، ولباس، وسكن. وتستمر النفقة للرجعية مطلقاً لأنها ما زالت في حكم الزوجة. أما البائن والناشز والمتوفى عنها زوجها فلا نفقة لهن إلا إذا كنّ حوامل.","w":["ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للبائن والناشز مطلقاً، وللرجعية الحامل فقط","المأكل والمشرب فقط دون المسكن. وتجب للرجعية مطلقاً، وللبائن الحامل، ولا تجب للمتوفى عنها ولو حاملاً","ما لا غنى لها عنه بالمعروف. وتجب للرجعية والبائن والناشز والمتوفى عنها مطلقاً ولو غير حوامل"],"ca":"ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز والمتوفى عنها إن كن حوامل"},{"id":"s165","b":"النكاح وما يتبعه","q":"متى تجب النفقة على الأقارب؟","a":"بثلاثة شروط: أن يكونوا فقراء لا مال لهم ولا كسب، وأن يكون المنفق غنياً بماله أو كسبه فاضلاً عن قوته وقوت زوجته ورقيقه، وأن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فتجب مطلقاً","m":1,"ex":"ثلاثة شروط تربط الطرفين: المنفَق عليه محتاج (لا مال له ولا كسب). والمنفِق قادر (غني بماله أو كسبه، فاضلاً عن قوته وقوت زوجته ورقيقه). وصلة الإرث (يرثه بفرض أو تعصيب)، إلا الأصول والفروع فتجب لهم مطلقاً.","w":["ثلاثة: فقرهم ولو كان لهم كسب، وغنى المنفق، وكونه وارثاً لهم بفرض فقط، ولا يستثنى أحد","شرطان: فقرهم بلا مال ولا كسب، وغنى المنفق؛ وتجب لكل قريب ولو لم يكن وارثاً","ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق، واتحاد الدين؛ ولا تجب للأصول والفروع إلا بالإرث"],"ca":"ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق فاضلاً عن قوته وقوت عياله، وكونه وارثاً لهم، إلا الأصول والفروع فمطلقاً"},{"id":"s166","b":"النكاح وما يتبعه","q":"ما الأشياء التي يحرم فعلها مع البهيمة؟","a":"لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، ووسمها فيه، وذبحها إن كانت لا تؤكل","m":1,"mn":"لعن، حمل، حلب، ضرب، وسم، ذبح","ex":"ستة يجمعها الرفق بالحيوان: بالقول (لعنها). وبالعمل (تحميلها ما يشق عليها، وحلبها بما يضر ولدها). وبالوجه (ضربها فيه، ووسمها فيه). وبالروح (ذبحها إن كانت لا تؤكل).","w":["لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وركوبها، ووسمها في غير الوجه، وذبحها للأكل","ضربها في وجهها، ووسمها فيه، وحلبها مطلقاً، وبيعها، وذبحها إن كانت تؤكل","لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، وخصاؤها، وإطعامها ما لا تشتهي"]},{"id":"s167","b":"الصيد","q":"ما هي شروط حل الصيد؟","a":"أربعة: كون الصائد أهلاً للذكاة، والآلة (محدد يجرح أو جارحة معلمة)، وقصد الفعل، وقول بسم الله عند الإرسال أو الرمي (ولا تسقط هنا سهواً)","m":1,"ex":"أربعة: الصائد (أهل للذكاة)، والآلة (محدد يجرح أو جارحة معلّمة)، والقصد، والتسمية عند الإرسال أو الرمي. والفرق المهم: التسمية في الذبح تسقط سهواً، أما في الصيد فلا تسقط ولو نسياناً.","w":["أربعة: كون الصائد أهلاً للذكاة، والآلة، وقصد الفعل، وقول بسم الله عند الإرسال (وتسقط هنا سهواً)","ثلاثة: كون الصائد مسلماً، والآلة، وقول بسم الله عند الأكل","أربعة: كون الصائد بالغاً، والآلة ولو قتلت بالصدم، وقصد الفعل، وقول بسم الله عند الإرسال"]},{"id":"s168","b":"الصيد","q":"كيف يكون تعليم الجارحة (الكلب أو الطير) لكي يحل صيده؟","a":"الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل. والطير بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي","m":1,"ex":"الكلب والفهد يُعلَّمان بثلاثة: ينطلق إذا أُرسل، ويكفّ إذا زُجر، ولا يأكل مما أمسك. والطير بأمرين فقط: ينطلق إذا أُرسل، ويرجع إذا دُعي؛ فلا يشترط فيه ترك الأكل ولا الانزجار.","w":["الكلب والفهد بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي. والطير بثلاثة: يسترسل، وينزجر، ولا يأكل","الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، ويرجع إذا دعي. والطير بأمرين: يسترسل، ولا يأكل","الكلب والفهد والطير بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل"]},{"id":"s169","b":"الأيمان والنذور","q":"بم تنعقد اليمين؟","a":"بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته","m":1,"ex":"اليمين لا تنعقد إلا بالله: إما بلفظ الجلالة «والله»، أو باسم من أسمائه كالرحمن، أو بصفة من صفاته كعزة الله. ثلاثة: الذات، والاسم، والصفة. أما الحلف بمخلوق فحرام.","w":["بالله تعالى، أو بأحد أنبيائه، أو بكتبه","بالله تعالى فقط، دون أسمائه وصفاته","بكل معظم كالله تعالى، أو الكعبة، أو النبي"]},{"id":"s170","b":"الأيمان والنذور","q":"ما حكم الحلف بغير الله (كالكعبة والنبي)؟","a":"حرم، ولا كفارة","m":1,"ex":"الحلف بمخلوق كالأنبياء والأولياء والكعبة حرام، ولا كفارة فيه؛ فالكفارة إنما تكون في اليمين المنعقدة بالله أو أسمائه أو صفاته.","w":["يكره، ولا كفارة","حرم، وفيه كفارة يمين","مباح، وفيه كفارة إن حنث"]},{"id":"s171","b":"الأيمان والنذور","q":"ما هي شروط وجوب كفارة اليمين؟","a":"خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث","m":1,"ex":"خمسة: ثلاثة في الحالف (مكلف، مختار، قاصد لليمين)، فلا كفارة على مكره ولا على من جرت على لسانه بلا قصد. وواحد في المحلوف عليه: أن يكون أمراً مستقبلاً. والخامس: الحنث، أي مخالفة ما حلف عليه.","w":["خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر ماضٍ، والحنث","أربعة: كون الحالف مكلفاً، مختاراً، ولو غير قاصد لليمين، والحنث","خمسة: كون الحالف مكلفاً، ولو مكرهاً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث"]},{"id":"s172","b":"الأيمان والنذور","q":"ما هي كفارة اليمين؟","a":"على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو تحرير رقبة مؤمنة؛ فإن لم يجد صام ثلاثة أيام متتابعة","m":1,"ex":"الكفارة على مرحلتين: أولاً يختار واحداً من ثلاثة: إطعام عشرة مساكين، أو كسوتهم، أو عتق رقبة مؤمنة. فإن عجز عنها كلها انتقل إلى صيام ثلاثة أيام متتابعة. قارن: كفارة الجماع في رمضان مرتبة لا تخيير فيها.","w":["على الترتيب: عتق رقبة، فإن لم يجد فإطعام عشرة مساكين، فإن لم يجد فكسوتهم، ولا صيام فيها","على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو صيام ثلاثة أيام، أو تحرير رقبة","على التخيير: إطعام ستين مسكيناً، أو كسوتهم، أو تحرير رقبة؛ فإن لم يجد صام شهرين متتابعين"]},{"id":"s173","b":"الأيمان والنذور","q":"ما حكم النذر، وما شروطه ليصح؟","a":"مكروه، لا يأتي بخير ولا يرد قضاء. ولا يصح إلا بالقول، من مكلف مختار","m":1,"ex":"النذر مكروه؛ لأنه لا يجلب خيراً ولا يرد ما قُدّر. ولا ينعقد إلا باللفظ، من شخص مكلف مختار؛ فلا يصح بالنية وحدها، ولا من صبي أو مكره.","w":["مستحب، يتقرب به إلى الله. ولا يصح إلا بالقول، من مكلف مختار","مكروه، لا يأتي بخير ولا يرد قضاء. ويصح بالنية وحدها، ولو من صبي مميز","مباح، ويرد القضاء. ولا يصح إلا بالقول، من مسلم بالغ"]},{"id":"s174","b":"الأيمان والنذور","q":"اذكر أمثلة لأنواع النذر المنعقدة؟","a":"ستة: المطلق (كفارة يمين)، ونذر اللجاج والغضب (يخير بين الفعل وكفارة يمين)، والمباح (يخير أيضاً)، والمكروه (يسن أن يكفر ولا يفعله)، والمعصية (يحرم الوفاء ويكفر)، والتبرر (يجب الوفاء به)","m":1,"mn":"مُ لَ بَ كَ عَ تَ: مطلق، لجاج، مباح، مكروه، معصية، تبرر","ex":"ستة، وحكم كل واحد: المطلق فيه كفارة يمين. واللجاج والغضب والمباح يُخيّر فيهما بين الفعل والكفارة. والمكروه يسن أن يكفّر ولا يفعله. والمعصية يحرم الوفاء بها ويكفّر. والتبرر (الطاعة) يجب الوفاء به.","w":["ستة: المطلق، واللجاج والغضب، والمباح، والواجب، والمعصية، والتبرر","خمسة: المطلق، والمباح، والمكروه، والمعصية، والتبرر","ستة: المطلق، واللجاج والغضب، والمستحيل، والمكروه، والمعصية، والتبرر"],"ca":"ستة: المطلق، واللجاج والغضب، والمباح، والمكروه، والمعصية، والتبرر"}];
const EXAM=new Date('2026-10-06T00:00:00+03:00').getTime(), MIN=6e4, DAY=864e5;
const STEPS=['اشرح','اختر','من حفظك','اكتبها'];
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=ms=>ms<DAY?(ms<60*MIN?'بعد قليل':'اليوم'):(()=>{const d=Math.round(ms/DAY);return d===1?'يوم':d===2?'يومين':d+' أيام';})();

let tr=S.get('track',null), st={}, deck=[], sessionStart=0;
const key=()=> 'anki:'+tr;
const save=()=>S.set(key(),st);

function pick(){
  app.innerHTML=`<div class="pick"><h1>بطاقات الفقه</h1><p class="sub">أسئلة دورة الشيخ عبدالسلام الفيلكاوي</p>
    <button id="t-imam">إمام</button><button id="t-muadhin">مؤذن</button></div>`;
  app.querySelector('#t-imam').onclick=()=>{tr='imam';S.set('track',tr);load();};
  app.querySelector('#t-muadhin').onclick=()=>{tr='muadhin';S.set('track',tr);load();};
}
function load(){ if(!tr) return pick(); deck=CARDS.filter(c=>tr==='imam'||!c.m); st=S.get(key(),{}); home(); }

// حالة البطاقة: t = l (تتعلمها: step 0..3) | r (مراجعة: iv بالأيام، ease) — غير موجودة = جديدة
function counts(){
  const now=Date.now(); let n=0,l=0,r=0,d=0;
  for(const c of deck){const s=st[c.id]; if(!s) n++; else if(s.t==='l') l++; else if(s.due<=now) r++; else d++;}
  return {n,l,r,d};
}
function home(){
  const k=counts(), left=Math.max(0,Math.ceil((EXAM-Date.now())/DAY));
  app.innerHTML=`<div class="home"><h1>بطاقات الفقه · ${tr==='imam'?'إمام':'مؤذن'}</h1>
    <div class="stats"><div class="c-new"><b>${k.n}</b><span>جديدة</span></div><div class="c-learn"><b>${k.l}</b><span>تتعلمها</span></div>
      <div class="c-rev"><b>${k.r}</b><span>مراجعة اليوم</span></div><div class="c-done"><b>${k.d}</b><span>مؤجلة</span></div></div>
    <button class="big" id="go">${k.l+k.r+k.n?'ابدأ':'لا شيء الآن'}</button>
    <p class="note">باقي ${left} يوم على الاختبار. اختبر نفسك قدر ما تبي: اللي ما تعرفه يمر بالشرح ثم الاختيار ثم الحفظ ثم الكتابة، واللي تعرفه يتأجل.</p>
    <button class="link" id="sw">تغيير المسار</button></div>`;
  app.querySelector('#go').onclick=()=>{sessionStart=Date.now();next();};
  app.querySelector('#sw').onclick=()=>{tr=null;S.set('track',null);pick();};
}
// الترتيب: ما يتعلمه (حان وقته) ← المراجعة المستحقة ← الجديد
function queue(){
  const now=Date.now();
  const L=deck.filter(c=>st[c.id]?.t==='l'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const R=deck.filter(c=>st[c.id]?.t==='r'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const N=deck.filter(c=>!st[c.id]);
  return [...L,...R,...N];
}
function bar(){
  const k=counts(), m=Math.floor((Date.now()-sessionStart)/MIN);
  return `<div class="bar"><span class="cnt"><b style="color:var(--blue)">${k.n}</b><b style="color:var(--bad)">${k.l}</b><b style="color:var(--accent)">${k.r}</b></span><span>${m} دقيقة</span><button class="link" id="home">إنهاء</button></div>`;
}
function frame(c,tag,body){
  app.innerHTML=bar()+`<article class="card"><div class="tags"><span class="tag plain">${esc(c.b)}</span>${tag}</div>${body}</article>`;
  app.querySelector('#home').onclick=home;
}
function next(){
  const q=queue();
  if(!q.length){
    // لا شيء مستحق الآن؛ إن بقيت بطاقات تتعلمها بعد دقائق نعرض أقربها
    const soon=deck.filter(c=>st[c.id]?.t==='l').sort((a,b)=>st[a.id].due-st[b.id].due)[0];
    if(soon) return show(soon);
    return home();
  }
  show(q[0]);
}
function show(c){
  const s=st[c.id];
  if(!s) return flip(c,'<span class="tag new">جديدة</span>');
  if(s.t==='r') return flip(c,'<span class="tag">مراجعة</span>');
  [explain,mcq,recall,write][s.step](c);
}
// ضع البطاقة في مرحلة تعلّم، وتعود بعد دقائق (بعد بطاقات أخرى)
function learn(c,step,delay){ st[c.id]={t:'l',step,due:Date.now()+(delay??2*MIN),lapses:(st[c.id]?.lapses||0)}; save(); }
function graduate(c,iv){ const s=st[c.id]||{}; st[c.id]={t:'r',iv,ease:s.ease||2.5,due:Math.min(Date.now()+iv*DAY,EXAM-DAY/2),reps:(s.reps||0)+1}; save(); }

// بطاقة جديدة أو مراجعة: السؤال ← الجواب ← أزرار Anki
function flip(c,tag){
  frame(c,tag,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${c.n?`<div class="x">${esc(c.n)}</div>`:''}</div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div>`);
  app.querySelector('#show').onclick=()=>{
    app.querySelector('#ans').hidden=false;
    const s=st[c.id], iv=s?.iv||0, ease=s?.ease||2.5;
    const hard=s?Math.max(1,Math.round(iv*1.2)):1, good=s?Math.max(iv+1,Math.round(iv*ease)):1, easy=s?Math.max(good+1,Math.round(iv*ease*1.3)):3;
    app.querySelector('#acts').className='acts four';
    app.querySelector('#acts').innerHTML=`<button class="again" id="b0">ما عرفتها<small>أتعلّمها</small></button>
      <button class="hard" id="b1">صعبة<small>${fmt(hard*DAY)}</small></button>
      <button class="good" id="b2">عرفتها<small>${fmt(good*DAY)}</small></button>
      <button class="easy" id="b3">سهلة<small>${fmt(easy*DAY)}</small></button>`;
    app.querySelector('#b0').onclick=()=>{learn(c,0,0);next();};
    app.querySelector('#b1').onclick=()=>{graduate(c,hard);st[c.id].ease=Math.max(1.3,ease-.15);save();next();};
    app.querySelector('#b2').onclick=()=>{graduate(c,good);next();};
    app.querySelector('#b3').onclick=()=>{graduate(c,easy);st[c.id].ease=ease+.15;save();next();};
  };
}
const stepTag=i=>`<span class="tag s${i}">${i+1}/4 · ${STEPS[i]}</span>`;
// ١) الشرح
function explain(c){
  frame(c,stepTag(0),`<p class="q">${esc(c.q)}</p><div class="a">${esc(c.a)}</div>
    ${c.ex?`<div class="ex"><b>الشرح: </b>${esc(c.ex)}</div>`:''}${c.mn?`<div class="mn">للحفظ: ${esc(c.mn)}</div>`:''}${c.n?`<div class="x">${esc(c.n)}</div>`:''}
    <div class="acts"><button class="main" id="ok">فهمتها</button></div>`);
  app.querySelector('#ok').onclick=()=>{learn(c,1);next();};
}
// ٢) اختيار من متعدد
function mcq(c){
  if(!c.w||c.w.length<3){learn(c,2,0);return next();}
  const right=c.ca||c.a, opts=shuffle([right,...c.w]);
  frame(c,stepTag(1),`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===right;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    app.querySelector('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'راجع الشرح مرة ثانية'}</button>`;
    app.querySelector('#nx').onclick=()=>{ ok?learn(c,2):learn(c,0,MIN); next(); };
  });
}
// ٣) من حفظك
function recall(c){
  frame(c,stepTag(2),`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div></div>
    <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
  app.querySelector('#show').onclick=()=>{
    app.querySelector('#ans').hidden=false;
    const a=app.querySelector('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`;
    a.querySelector('#no').onclick=()=>{learn(c,1,MIN);next();};
    a.querySelector('#yes').onclick=()=>{learn(c,3);next();};
  };
}
// ٤) اكتبها
const words=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').split(/[^ء-ي0-9]+/).filter(w=>w.length>2);
function write(c){
  frame(c,stepTag(3),`<p class="q">${esc(c.q)}</p><label for="w-${c.id}" class="x">اكتب الجواب من حفظك:</label><textarea id="w-${c.id}"></textarea>
    <div id="ans" hidden></div><div class="acts" id="acts"><button class="main" id="cmp">قارن بالجواب</button></div>`);
  app.querySelector('#cmp').onclick=()=>{
    const mine=new Set(words(app.querySelector('textarea').value)), need=[...new Set(words(c.a))];
    const hit=need.filter(w=>mine.has(w)).length, pct=need.length?Math.round(100*hit/need.length):0;
    const box=app.querySelector('#ans'); box.hidden=false;
    box.innerHTML=`<div class="a">${esc(c.a)}</div><p class="score">كلماتك طابقت ${pct}% من كلمات الجواب</p>`;
    const a=app.querySelector('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما كتبتها صح</button><button class="good" id="yes">كتبتها صح</button>`;
    a.querySelector('#no').onclick=()=>{learn(c,2,MIN);next();};
    a.querySelector('#yes').onclick=()=>{graduate(c,1);next();};
  };
}
load();
</script>
