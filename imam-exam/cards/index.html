<title>بطاقات الفقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5A6660; --line:#DDE1DC;
  --accent:#145C49; --accent-ink:#FFFFFF; --soft:#E5EEEA; --bad:#A13A2C; --bad-soft:#F6E6E3;
  --warn:#8A5A12; --warn-soft:#F5EDDD; --blue:#2A5B8C; --blue-soft:#E4ECF4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
    --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
    --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
  --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
  --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{flex:1;display:grid;align-content:center;gap:14px}
.pick h1{margin:0;font-size:1.5rem}
.pick .sub{margin:0 0 8px;color:var(--muted)}
.pick button{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;text-align:right}
.pick button:hover{border-color:var(--accent)}
.home{flex:1;display:grid;align-content:center;gap:18px}
.home h1{margin:0;font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats div{display:grid;gap:2px;padding:14px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.c-new b{color:var(--blue)} .c-learn b{color:var(--bad)} .c-rev b{color:var(--accent)} .c-done b{color:var(--muted)}
.big{padding:18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.25rem;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.note{margin:0;color:var(--muted);font-size:.9rem;line-height:1.8;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .cnt{display:flex;gap:10px}
.bar .cnt b{font-weight:700}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.s0{background:var(--warn-soft);color:var(--warn)} .tag.s1,.tag.s2,.tag.s3{background:var(--bad-soft);color:var(--bad)}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.q{font-size:1.28rem;font-weight:700;line-height:1.7;margin:0;text-wrap:pretty}
.a{border-top:1px solid var(--line);padding-top:14px;font-family:"Noto Naskh Arabic",serif;font-size:1.18rem;line-height:2;white-space:pre-line}
.ex{padding:12px 14px;border-radius:10px;background:var(--warn-soft);line-height:1.9}
.ex b{color:var(--warn)}
.mn{padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600;font-size:.95rem}
.x{font-size:.9rem;color:var(--muted);line-height:1.8}
.opts{display:grid;gap:8px}
.opt{text-align:right;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.8}
.opt.right{border-color:var(--accent);background:var(--soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:120px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.8;resize:vertical}
.score{font-weight:700}
.acts{display:grid;gap:8px;margin-top:auto}
.acts.two{grid-template-columns:1fr 1fr}
.acts.four{grid-template-columns:repeat(4,1fr)}
.acts button{padding:12px 6px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;gap:2px}
.acts button small{font-weight:400;font-size:.72rem;color:var(--muted)}
.acts .main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem;padding:15px}
.acts .again{color:var(--bad);border-color:var(--bad)}
.acts .hard{color:var(--warn);border-color:var(--warn)}
.acts .good{color:var(--accent);border-color:var(--accent)}
.acts .easy{color:var(--blue);border-color:var(--blue)}
@media (max-width:380px){.acts.four{grid-template-columns:1fr 1fr}}
</style>

<script>
const CARDS=[{"id":"s1","b":"الطهارة","q":"إلى كم قسم تنقسم المياه؟","a":"ثلاثة: طهور، وطاهر، ونجس.","m":0,"ex":"الماء ثلاث درجات من الأعلى إلى الأدنى: طهور يطهِّر غيره، ثم طاهر نظيف في نفسه لا يطهِّر غيره، ثم نجس لا يُستعمل. احفظها كسلّم نازل: طهور ← طاهر ← نجس.","w":["قسمان: طهور، ونجس.","أربعة: طهور، وطاهر، ومكروه، ونجس.","ثلاثة: طهور، ومستعمل، ونجس."]},{"id":"s2","b":"الطهارة","q":"ما الفرق بين الطاهر والطهور؟ (ما هو الطهور)؟","a":"الطهور: الباقي على خلقته، يرفع الحدث ويزيل الخبث. والطاهر: ما تغير كثير من لونه أو طعمه أو ريحه بشيء طاهر، يجوز استعماله في غير رفع الحدث وزوال الخبث.","m":0,"ex":"الفرق في كلمة واحدة: الطهور «مطهِّر» لأنه باقٍ على خلقته، فيرفع الحدث ويزيل النجاسة. أما الطاهر فتغيّر كثيراً بشيء طاهر، فصار نظيفاً فقط: يُشرب ويُستعمل، لكن لا يرفع حدثاً ولا يزيل خبثاً.","w":["الطهور: ما تغير كثيراً بطاهر يرفع الحدث. والطاهر: الباقي على خلقته لا يرفع الحدث ولا يزيل الخبث.","الطهور: الباقي على خلقته يزيل الخبث فقط. والطاهر: ما تغير كثيراً بطاهر يرفع الحدث ولا يزيل الخبث.","الطهور: الباقي على خلقته يرفع الحدث ويزيل الخبث. والطاهر: ما تغير يسيراً بنجس، يرفع الحدث دون الخبث."],"ca":"الطهور: الباقي على خلقته يرفع الحدث ويزيل الخبث. والطاهر: ما تغير كثيراً بطاهر، لا يرفع حدثاً ولا يزيل خبثاً."},{"id":"s3","b":"الطهارة","q":"ما حكم استعمال آنية الذهب والفضة؟","a":"يحرم اتخاذ واستعمال آنية الذهب والفضة والمموه بهما (يباح كل إناء طاهر إلا هذه).","m":0,"ex":"الأصل أن كل إناء طاهر مباح ولو كان ثميناً، ويُستثنى الذهب والفضة فقط. والتحريم يشمل الاستعمال والاتخاذ (مجرد اقتنائه)، ويشمل حتى المموّه أي المطليّ بهما.","w":["يكره اتخاذ واستعمال آنية الذهب والفضة والمموه بهما (يباح كل إناء طاهر إلا هذه).","يحرم استعمال آنية الذهب والفضة دون اتخاذها، ويباح المموه بهما.","يحرم الأكل والشرب في آنية الذهب والفضة فقط، ويباح اتخاذها واستعمالها في غير ذلك."]},{"id":"s4","b":"الطهارة","q":"هل تصح الطهارة بإناء الذهب والفضة؟","a":"نعم، تصح الطهارة بهما، وبالإناء المغصوب.","m":0,"ex":"فرّق بين الإثم والصحة: استعمال إناء الذهب والفضة حرام يأثم به، لكن الطهارة نفسها صحيحة، لأن التحريم في الإناء لا في الماء. ومثله الإناء المغصوب: حرام والطهارة صحيحة.","w":["لا، لا تصح الطهارة بهما، ولا بالإناء المغصوب.","لا تصح بإناء الذهب والفضة، وتصح بالإناء المغصوب.","تصح بإناء الفضة دون الذهب، ولا تصح بالإناء المغصوب."]},{"id":"s5","b":"الطهارة","q":"ما هو أقل عدد يجزئ المسح به (في الاستجمار)؟","a":"ثلاث مسحات، تعم كل مسحة المحل؛ ولا يجزئ أقل منها.","m":0,"ex":"الاستجمار له شرطان في العدد والصفة: لا أقل من ثلاث مسحات، وكل مسحة تستوعب المحل كله. فلو نظف المحل بمسحتين لم يكفِ حتى يكمل الثلاث.","w":["مسحتان تعم كل مسحة المحل؛ ولا يجزئ أقل منهما.","مسحة واحدة إن أنقت المحل.","سبع مسحات، تعم كل مسحة المحل؛ ولا يجزئ أقل منها."]},{"id":"s6","b":"الطهارة","q":"ما حكم استقبال القبلة واستدبارها عند الاستنجاء وقضاء الحاجة؟","a":"يكره استقبال القبلة واستدبارها في الاستنجاء، ويحرمان عند قضاء الحاجة في الصحراء بلا حائل (ويكفي إرخاء ذيله).","m":0,"ex":"الحكم يشتد بحسب الحال: عند الاستنجاء (التنظيف) يُكره فقط، وعند قضاء الحاجة يحرم إذا كان في الصحراء بلا حائل. فإن وُجد حائل ولو إرخاء ذيله زال التحريم. تذكّر: استنجاء = كراهة، قضاء حاجة في فضاء = تحريم.","w":["يحرم استقبال القبلة واستدبارها في الاستنجاء، ويكرهان عند قضاء الحاجة في الصحراء بلا حائل.","يباح استقبال القبلة واستدبارها في الاستنجاء، ويكرهان عند قضاء الحاجة في الصحراء بلا حائل.","يكره استقبال القبلة واستدبارها في الاستنجاء، ويحرمان عند قضاء الحاجة في البنيان ولو بحائل."]},{"id":"s7","b":"الطهارة","q":"ما حكم من استنجى بروث؟","a":"يحرم (بروث وعظم وطعام ولو لبهيمة)، فإن فعل لم يجزئ بعد ذلك إلا الماء.","m":0,"ex":"الروث والعظم والطعام محترمة أو نجسة فيحرم الاستجمار بها. ومن فعل عوقب بسقوط رخصة الحجارة: لا يجزئه بعدها إلا الماء.","w":["يكره، ويجزئ بعده الاستجمار بالحجارة.","يحرم، لكنه يجزئ إن أنقى المحل.","يحرم، ويجزئ بعده الاستجمار بثلاثة أحجار طاهرة."]},{"id":"s8","b":"الطهارة","q":"اذكر ثلاث أو خمس أوقات يتأكد فيها استخدام السواك؟","a":"عند: وضوء، وصلاة، وقراءة، وانتباه من نوم، وتغير رائحة فم، ودخول مسجد ومنزل، وإطالة سكوت، وصفرة أسنان.","m":0,"mn":"و ص ق ن ر م س ص: وضوء صلاة قراءة نوم رائحة مسجد/منزل سكوت صفرة","ex":"اربطها بفكرة واحدة: السواك يتأكد عند كل تغيّر في الفم أو عند مناجاة الله. للعبادة: وضوء، صلاة، قراءة. لتغيّر الفم: نوم، رائحة، سكوت طويل، صفرة أسنان. وللدخول: مسجد ومنزل.","w":["عند: وضوء، وصلاة، وأكل، وشرب، وخروج من المنزل.","عند: صلاة، وقراءة، وبعد الزوال للصائم، وخروج من المسجد، ونوم.","عند: غسل، وتيمم، وأذان، وأكل، وسفر."],"ca":"عند: وضوء، وصلاة، وقراءة، وانتباه من نوم، وتغير رائحة فم."},{"id":"s9","b":"الطهارة","q":"ما حكم السواك بعد الزوال؟","a":"مسنون مطلقاً إلا بعد الزوال للصائم فيكره.","m":0,"ex":"السواك سنة في كل وقت، ويُستثنى الصائم بعد الزوال فيكره له. وقبل الزوال يبقى في حقه سنة كغيره.","w":["مسنون مطلقاً حتى بعد الزوال للصائم.","يحرم بعد الزوال للصائم.","يكره بعد الزوال لكل أحد صائماً أو مفطراً."]},{"id":"s10","b":"الطهارة","q":"ما حكم الختان للذكور والإناث؟","a":"واجب على الذكر والأنثى عند البلوغ، وقبله أفضل.","m":0,"ex":"الختان في المذهب واجب، ونصّ الكتاب: «والختان واجب».","w":["واجب على الذكر، سنة للأنثى، عند البلوغ.","سنة للذكر والأنثى، وقبل البلوغ أفضل.","واجب على الذكر والأنثى في اليوم السابع من الولادة."]},{"id":"s11","b":"الطهارة","q":"ما حكم التسمية في الوضوء؟","a":"تجب، وتسقط سهواً، وإن ذكرها في أثنائه ابتدأ.","m":0,"ex":"التسمية واجب خفيف: تجب مع الذكر وتسقط بالنسيان. فإن تذكرها في أثناء الوضوء لم يكمل، بل يبدأ من جديد ليكون الوضوء كله بعد التسمية.","w":["تسن، ولا شيء على من تركها عمداً أو سهواً.","تجب، ولا تسقط سهواً، فإن تركها أعاد الوضوء.","تجب، وتسقط سهواً، وإن ذكرها في أثنائه سمّى وأكمل."]},{"id":"s12","b":"الطهارة","q":"اذكر فروض الوضوء؟","a":"ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة.","m":0,"ex":"ستة: أربعة أعضاء بترتيب الآية (وجه، يدان، رأس، رجلان)، ومعها صفتان: الترتيب والموالاة. والفم والأنف تابعان للوجه، والأذنان تابعتان للرأس.","w":["ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب، والنية.","خمسة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب.","ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والموالاة، والتسمية."],"ca":"ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب، والموالاة."},{"id":"s13","b":"الطهارة","q":"كم عدد شروط الوضوء؟","a":"ثمانية: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار.","m":0,"ex":"ثمانية: ثلاثة في الشخص (إسلام، عقل، تمييز)، وثلاثة قبله (انقطاع الموجب، الاستنجاء، إزالة المانع)، ثم النية، والماء الطهور المباح. وشروط الغسل هي نفسها بلا الاستنجاء فتصير سبعة.","w":["سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.","ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والبلوغ، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء.","ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور، ودخول الوقت، والاستنجاء أو الاستجمار."],"ca":"ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار."},{"id":"s14","b":"الطهارة","q":"اذكر خمسة أمثلة من سنن الوضوء؟","a":"(سننه ثمان عشرة) منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والبداءة بالمضمضة والاستنشاق، والمبالغة فيهما لغير صائم، وتخليل اللحية الكثيفة والأصابع، وأخذ ماء جديد للأذنين، وتقديم اليمنى على اليسرى، والغسلة الثانية والثالثة.","m":0,"ex":"السنن أشياء تكمّل الوضوء: قبله (قبلة، سواك، غسل الكفين)، وفي صفته (بدء بالمضمضة، مبالغة لغير صائم، تخليل، ماء جديد للأذنين، تيامن)، وفي عدده (الغسلة الثانية والثالثة). وعددها ثماني عشرة.","w":["منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والترتيب، والموالاة.","منها: التسمية، والسواك، وغسل الكفين ثلاثاً، والمبالغة في المضمضة للصائم، ومسح الرأس كله.","منها: النية، والسواك، وغسل الكفين ثلاثاً، وتخليل الأصابع، وتقديم اليسرى على اليمنى."],"ca":"منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، وتخليل الأصابع، وتقديم اليمنى على اليسرى."},{"id":"s15","b":"الطهارة","q":"ما هي شروط المسح الخفين والجوارب؟","a":"سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما لمحل الفرض ولو بربطهما، وإمكان المشي بهما عرفاً، وثبوتهما بنفسهما، وإباحتهما، وطهارة عينهما، وعدم وصفهما البشرة.","m":0,"ex":"سبعة شروط تدور على ثلاثة أمور: متى لبسه (بعد كمال الطهارة بالماء)، وصفة الخف نفسه (ساتر، يمكن المشي به، ثابت بنفسه، لا يصف البشرة)، وحكمه (مباح وطاهر العين).","w":["سبعة: لبسهما بعد كمال الطهارة ولو بالتيمم، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة.","ستة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة.","سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وأن يكونا من جلد."],"ca":"سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة."},{"id":"s16","b":"الطهارة","q":"رجل توضأ فغسل رجله اليمنى ثم لبس الجورب، ثم غسل اليسرى فلبس الجورب، ما حكم وضوئه أو مسحه؟","a":"وضوؤه صحيح، لكن لا يصح المسح عليهما؛ لأنه لم يلبسهما بعد كمال الطهارة بالماء.","m":0,"n":"الذي لا يصح هو المسح لا الوضوء","ex":"الوضوء صحيح لأنه غسل كل الأعضاء بترتيب. لكن الشرط الأول للمسح «لبسهما بعد كمال الطهارة»، وهو لبس اليمنى قبل أن يغسل اليسرى، أي قبل أن تكتمل طهارته، فلا يمسح.","w":["وضوؤه صحيح، ويصح المسح عليهما؛ لأنه لبس كل رجل بعد غسلها.","وضوؤه باطل؛ لأنه فصل بين غسل الرجلين باللبس.","وضوؤه صحيح، ويصح المسح على اليسرى دون اليمنى."]},{"id":"s17","b":"الطهارة","q":"كم مدة المسح؟","a":"المقيم والعاصي بسفره: يوم وليلة، والمسافر: ثلاثة أيام بلياليهن، من الحدث بعد اللبس.","m":0,"ex":"المسافر يُخفَّف عليه فمدته ثلاثة أيام، والمقيم يوم وليلة. ومن سافر سفر معصية لا يأخذ رخصة المسافر فيعامل كالمقيم. وتبدأ المدة من أول حدث بعد اللبس، لا من اللبس ولا من أول مسح.","w":["المقيم: يوم وليلة، والمسافر والعاصي بسفره: ثلاثة أيام بلياليهن، من الحدث بعد اللبس.","المقيم والعاصي بسفره: يوم وليلة، والمسافر: ثلاثة أيام بلياليهن، من وقت اللبس.","المقيم: ثلاثة أيام، والمسافر: يوم وليلة، من أول مسح بعد اللبس."]},{"id":"s18","b":"الطهارة","q":"متى يبطل المسح؟","a":"إذا حصل ما يوجب الغسل، أو ظهر بعض محل الفرض، أو انقضت المدة: بطل الوضوء.","m":0,"ex":"ثلاثة أسباب: حدث أكبر يوجب الغسل فيلزم نزع الخف، أو ظهور شيء من القدم فزال الستر، أو انتهاء المدة. وإذا حصل أحدها بطل الوضوء كله لا المسح فقط.","w":["إذا حصل ما يوجب الوضوء، أو ظهر بعض محل الفرض، أو انقضت المدة: بطل المسح وبقي الوضوء.","إذا حصل ما يوجب الغسل، أو ظهر بعض محل الفرض، أو انقضت المدة: يغسل رجليه فقط.","إذا حصل ما يوجب الغسل، أو خلع أحد الخفين، أو سافر: بطل الوضوء."]},{"id":"s19","b":"الطهارة","q":"متى يجب التيمم على صاحب الجبيرة؟","a":"إذا لم يضعها على طهارة (فيغسل الصحيح ويتيمم لها)، أو وضعها على طهارة وتجاوزت المحل (فيغسل ويمسح ويتيمم). فإن وضعها على طهارة ولم تتجاوز المحل: غسل الصحيح ومسح عليها وأجزأ.","m":0,"ex":"التيمم يأتي لتعويض ما فات: إن لم يضعها على طهارة فالمسح لا يكفي فيتيمم. وإن وضعها على طهارة لكنها زادت عن موضع الحاجة فيمسح ويتيمم للزائد. وإن وضعها على طهارة ولم تتجاوز: يكفي المسح.","w":["إذا وضعها على طهارة ولم تتجاوز المحل. فإن لم يضعها على طهارة: مسح عليها وأجزأ.","يجب التيمم لها في كل حال، ولا يمسح عليها.","إذا تجاوزت المحل فقط، ولا يضر وضعها على غير طهارة."],"ca":"إذا لم يضعها على طهارة، أو وضعها على طهارة وتجاوزت المحل. فإن وضعها على طهارة ولم تتجاوز: مسح عليها وأجزأ."},{"id":"s20","b":"الطهارة","q":"اذكر نواقض الوضوء (أو خمسة منها)؟","a":"ثمانية: الخارج من السبيلين، وخروج النجاسة من بقية البدن (البول والغائط مطلقاً، وغيرهما إن فحش)، وزوال العقل أو تغطيته، ومس الفرج بيده بلا حائل، ولمس الذكر الأنثى أو العكس لشهوة بلا حائل، وغسل الميت، وأكل لحم الإبل، والردة.","m":0,"mn":"سَبيلان، نجاسة، عقل، مس، لمس، ميت، إبل، ردة","ex":"ثمانية: اثنان في الخارج (من السبيلين، ومن بقية البدن)، وواحد في العقل، واثنان في اللمس (مس الفرج، ولمس الجنس الآخر لشهوة)، ثم غسل الميت، ولحم الإبل، والردة.","w":["ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وحمل الميت، وأكل لحم الإبل، والردة.","ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الغنم، والردة.","ثمانية: الخارج من السبيلين، والقهقهة، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الإبل، والردة."],"ca":"ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الإبل، والردة."},{"id":"s21","b":"الطهارة","q":"متى ينتقض الوضوء بلمس المرأة؟","a":"إذا لمس بشرتها لشهوة، من غير حائل.","m":0,"ex":"قيدان يجب اجتماعهما: شهوة، وبلا حائل (بشرة ببشرة). فاللمس بلا شهوة لا ينقض، واللمس من وراء ثوب لا ينقض ولو بشهوة.","w":["إذا لمس بشرتها مطلقاً، بشهوة أو بغير شهوة.","إذا لمسها لشهوة ولو من وراء حائل.","إذا لمس بشرتها بغير شهوة من غير حائل."]},{"id":"s22","b":"الطهارة","q":"متى ينتقض الوضوء بلمس ذكره؟","a":"إذا مسه بيده (لا ظفره) بلا حائل.","m":0,"ex":"الناقض مسّ باليد نفسها مباشرة بلا حائل. فالظفر لا يُعد يداً في هذا، والمسّ من وراء ثوب لا ينقض. ولا يُشترط هنا الشهوة بخلاف لمس المرأة.","w":["إذا مسه بيده لشهوة، ولو من وراء حائل.","إذا مسه بيده أو ظفره ولو بحائل.","إذا مسه بيده لشهوة فقط، بلا حائل."]},{"id":"s23","b":"الطهارة","q":"إذا شك في الطهارة ماذا يفعل الشاك؟","a":"من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: عمل بما تيقن.","m":0,"ex":"القاعدة: اليقين لا يزول بالشك. فمن كان متيقناً من شيء (طهارة أو حدث) بقي عليه ولا يلتفت إلى الشك الطارئ.","w":["من تيقن الطهارة وشك في الحدث: توضأ احتياطاً، ومن تيقن الحدث وشك في الطهارة: عمل بما تيقن.","يعمل بغلبة ظنه في الحالين.","من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: عمل بالشك."]},{"id":"s24","b":"الطهارة","q":"ماذا يحرم على المحدث؟","a":"الصلاة، والطواف، ومس المصحف ببشرته بلا حائل. ويزيد من عليه غسل: قراءة القرآن، واللبث في المسجد بلا وضوء.","m":0,"ex":"المحدث حدثاً أصغر ممنوع من ثلاثة: الصلاة، والطواف، ومس المصحف. والجنب أشد حدثاً فيزيد عليه اثنان: قراءة القرآن، والمكث في المسجد إلا إن توضأ.","w":["الصلاة، والطواف، وقراءة القرآن. ويزيد من عليه غسل: مس المصحف، واللبث في المسجد.","الصلاة، ومس المصحف فقط. ويزيد من عليه غسل: الطواف، وقراءة القرآن.","الصلاة، والطواف، ومس المصحف، واللبث في المسجد. ويزيد من عليه غسل: الصوم."],"ca":"الصلاة، والطواف، ومس المصحف. ويزيد من عليه غسل: قراءة القرآن، واللبث في المسجد بلا وضوء."},{"id":"s25","b":"الطهارة","q":"ما هي موجبات (أسباب) الغسل؟","a":"سبعة: انتقال المني، وخروجه، وتغييب الحشفة في فرج، وإسلام الكافر، وخروج الحيض، وخروج دم النفاس، والموت.","m":0,"ex":"سبعة: ثلاثة للجنابة (انتقال المني، خروجه، تغييب الحشفة)، واثنان للنساء (حيض ونفاس)، ثم إسلام الكافر، والموت. تذكّر: جنابة ٣ + نساء ٢ + إسلام + موت.","w":["سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والاستحاضة.","سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والإغماء.","ستة: خروج المني، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والموت."],"ca":"سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والموت."},{"id":"s26","b":"الطهارة","q":"كم عدد شروط الغسل؟","a":"سبعة: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.","m":0,"ex":"هي شروط الوضوء نفسها ناقصة شرطاً واحداً: الاستنجاء أو الاستجمار. فالوضوء ثمانية والغسل سبعة.","w":["ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء.","سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والبلوغ، والماء الطهور المباح، وإزالة ما يمنع وصوله.","ستة: النية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله."],"ca":"سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله."},{"id":"s27","b":"الطهارة","q":"ينقسم الغسل لقسمين: فرض وكمال، وضح ذلك؟","a":"فرضه: أن يعم بالماء جميع بدنه وداخل فمه وأنفه، حتى ما يظهر من فرج المرأة عند القعود لحاجتها، وحتى باطن شعرها. وسننه (الكمال): الوضوء قبله، وإزالة ما لوثه من أذى، وإفراغ الماء على رأسه ثلاثاً وعلى بقية جسده ثلاثاً، والتيامن، والموالاة، وإمرار اليد على الجسد، وإعادة غسل رجليه بمكان آخر.","m":0,"ex":"الفرض شيء واحد: تعميم البدن كله بالماء، حتى الفم والأنف وباطن الشعر. وما زاد فهو كمال: وضوء قبله، وإزالة الأذى، والتثليث، والتيامن، والموالاة، ودلك الجسد، وغسل الرجلين في مكان آخر.","w":["فرضه: الوضوء، ثم تعميم البدن بالماء. وكماله: المضمضة والاستنشاق، والتثليث، والتيامن، والدلك.","فرضه: تعميم البدن بالماء ثلاثاً. وكماله: الوضوء قبله، والمضمضة والاستنشاق، والتيامن، والدلك.","فرضه: تعميم البدن بالماء مع الفم والأنف ودلكه. وكماله: الوضوء قبله، وإزالة الأذى، والتثليث، والتيامن."],"ca":"فرضه: تعميم البدن بالماء مع الفم والأنف. وكماله: الوضوء قبله، وإزالة الأذى، والتثليث، والتيامن، والدلك."},{"id":"s28","b":"الطهارة","q":"اذكر خمسة أمثلة من الأغسال المستحبة؟","a":"(ستة عشر) منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولكسوف، واستسقاء، وجنون، وإغماء، واستحاضة لكل صلاة، وإحرام، ودخول مكة، وحرمها، ووقوف بعرفة، وطواف زيارة، وطواف وداع، ومبيت بمزدلفة، ورمي جمار.","m":0,"n":"«غسل ميت» في الكتاب: الاغتسال لمن غسّل ميتاً","ex":"ستة عشر غسلاً، اجمعها في ثلاث مجموعات: صلوات (جمعة، عيد، كسوف، استسقاء)، وأحوال (غسل ميت، جنون، إغماء، استحاضة)، وحج (إحرام، دخول مكة وحرمها، عرفة، طوافان، مزدلفة، رمي).","w":["منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولخروج المني، ولإحرام.","منها: لصلاة جمعة، ولعيد، ولإسلام الكافر، وللحيض، ولإحرام.","منها: لكل صلاة فريضة، ولعيد، ولكسوف، ولأكل لحم الإبل، ولإحرام."],"ca":"منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولكسوف، ولإحرام."},{"id":"s29","b":"الطهارة","q":"كم عدد شروط صحة التيمم؟","a":"ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء أو الاستجمار، ودخول وقت الصلاة، وتعذر استعمال الماء، وأن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد.","m":0,"ex":"ثمانية: أربعة مشتركة مع الوضوء (نية، إسلام، عقل، تمييز) والاستنجاء، ثم ثلاثة خاصة بالتيمم: دخول الوقت، وتعذر الماء، والتراب الطهور المباح الذي له غبار.","w":["ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب أو الحجر ولو بلا غبار.","سبعة: النية، والإسلام، والعقل، والتمييز، والاستنجاء، وتعذر الماء، والتراب الطهور المباح.","ثمانية: النية، والإسلام، والعقل، والبلوغ، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب الطهور المباح."],"ca":"ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب الطهور المباح له غبار."},{"id":"s30","b":"الطهارة","q":"في أي الأعمال تجب التسمية في الطهارة؟","a":"في الوضوء، والغسل، والتيمم (وتسقط سهواً).","m":0,"ex":"التسمية واجبة في الطهارات الثلاث الحدثية كلها: وضوء، وغسل، وتيمم. وحكمها واحد فيها: تسقط بالسهو.","w":["في الوضوء فقط (وتسقط سهواً).","في الوضوء والغسل دون التيمم (وتسقط سهواً).","في الوضوء، والغسل، والتيمم (ولا تسقط سهواً)."]},{"id":"s31","b":"الطهارة","q":"اذكر فروض التيمم؟","a":"خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة.","m":0,"ex":"خمسة: عضوان فقط (الوجه، واليدان إلى الكوعين أي الرسغين لا المرفقين)، ثم الترتيب والموالاة كالوضوء، ويزيد التيمم فرضاً خاصاً: تعيين النية لما يتيمم له. والترتيب في الحدث الأصغر فقط.","w":["خمسة: مسح الوجه، ومسح اليدين إلى المرفقين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية.","أربعة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب، والموالاة.","خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الكبرى والصغرى، والموالاة، والتسمية."]},{"id":"s32","b":"الطهارة","q":"اذكر ثلاثة من مبطلات التيمم؟","a":"خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه.","m":0,"ex":"التيمم بدل عن الماء، فيبطل بما يبطل الأصل (نواقض الوضوء)، ويبطل إذا زال سبب البدل: وجود الماء، أو زوال العذر المبيح. ولأنه مؤقت يبطل بخروج الوقت، وبخلع ما مسح عليه.","w":["خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، والكلام، وخلع ما مسح عليه.","ثلاثة: ما أبطل الوضوء، ووجود الماء، والكلام.","خمسة: ما أبطل الوضوء، ووجود التراب، وخروج الوقت، وزوال المبيح له، والسفر."]},{"id":"s33","b":"الطهارة","q":"ما هي صفة التيمم الصحيحة؟ وإذا مسح يديه قبل وجهه هل يصح؟","a":"ينوي ثم يسمي، ويضرب التراب بيديه مفرجتي الأصابع ضربة واحدة (والأحوط اثنتان) بعد نزع خاتم ونحوه، فيمسح وجهه بباطن أصابعه، وكفيه براحتيه. وإن مسح يديه قبل وجهه لم يصح؛ لأن الترتيب فرض في الطهارة الصغرى.","m":0,"ex":"الترتيب: نية، تسمية، ضربة، ثم الوجه أولاً ثم الكفان. والوجه قبل اليدين لأن الترتيب فرض في التيمم عن الحدث الأصغر كالوضوء، فمن عكس لم يصح تيممه.","w":["ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح وجهه ثم كفيه. وإن قدّم يديه صح؛ لأن الترتيب سنة في التيمم.","ينوي ويسمي، ويضرب التراب ثلاث ضربات، فيمسح وجهه ثم ذراعيه إلى المرفقين. وإن قدّم يديه لم يصح.","ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح كفيه ثم وجهه. وإن قدّم وجهه لم يصح."],"ca":"ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح وجهه ثم كفيه. وإن قدّم يديه لم يصح؛ لأن الترتيب فرض في الطهارة الصغرى."},{"id":"s34","b":"الطهارة","q":"(لغز) رجل في الصلاة نهق حماره فبطلت صلاته، ليش؟","a":"لأنه صلى بالتيمم، فعلم بنهيق حماره وصول الماء؛ «وإن وجد الماء وهو في الصلاة بطلت».","m":0,"ex":"السرّ في التيمم: من وجد الماء وهو في الصلاة بطلت صلاته لأن عذره زال. فنهيق الحمار دلّه على وصول الماء، فبطل تيممه وصلاته.","w":["لأن نهيق الحمار يقطع الصلاة إذا مرّ بين يديه.","لأنه التفت إلى حماره بلا حاجة فبطلت صلاته.","لأنه ضحك من نهيق حماره فقهقه في صلاته."]},{"id":"s35","b":"الطهارة","q":"كلب ولغ في إناء كيف يطهر؟","a":"سبع غسلات، إحداها بتراب طاهر أو صابون ونحوه.","m":0,"ex":"نجاسة الكلب مغلّظة: سبع غسلات، وواحدة منها لا بد أن تكون بالتراب، ويقوم مقامه الصابون ونحوه. تذكّر: سبع + تراب.","w":["ثلاث غسلات، إحداها بتراب طاهر.","سبع غسلات، بلا تراب.","ثمان غسلات، الثامنة بتراب طاهر."]},{"id":"s36","b":"الطهارة","q":"ما الفرق بين غسل نجاسة الجارية (الأنثى) وغسل بول الغلام (الذي لم يأكل الطعام لشهوة)؟","a":"بول الجارية كسائر النجاسات: يغسل سبع غسلات. وبول الغلام الذي لم يأكل الطعام لشهوة: يجزئ نضحه، وهو غمره بالماء.","m":0,"ex":"رُخِّص في بول الغلام الصغير الذي لم يأكل الطعام بشهوة، فيكفي نضحه أي غمره بالماء بلا عصر ولا غسل. أما الجارية فلا رخصة لها: بولها كسائر النجاسات يُغسل سبعاً.","w":["بول الغلام كسائر النجاسات يغسل سبعاً، وبول الجارية التي لم تأكل الطعام يجزئ نضحه.","بولهما سواء: يجزئ نضحهما ما لم يأكلا الطعام لشهوة.","بول الجارية يغسل ثلاثاً، وبول الغلام الذي لم يأكل الطعام لشهوة يغسل مرة واحدة."]},{"id":"s37","b":"الطهارة","q":"ما أقل وأكثر سن الحيض؟ وما أقل وأكثر مدته؟","a":"لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة. أقله يوم وليلة، وأكثره خمسة عشر يوماً (وغالبه ست أو سبع).","m":0,"ex":"احفظ الأرقام أزواجاً: السن من ٩ إلى ٥٠ سنة، والمدة من يوم وليلة إلى ١٥ يوماً، والغالب ٦ أو ٧. فما قبل التسع وبعد الخمسين ليس حيضاً، وما زاد على ١٥ استحاضة.","w":["لا حيض قبل تمام تسع سنين ولا بعد ستين سنة. أقله ثلاثة أيام، وأكثره عشرة أيام.","لا حيض قبل تمام اثنتي عشرة سنة ولا بعد خمسين. أقله يوم وليلة، وأكثره خمسة عشر يوماً.","لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة. أقله يوم وليلة، وأكثره سبعة عشر يوماً."]},{"id":"s38","b":"الطهارة","q":"اذكر خمسة أشياء تحرم بالحيض؟","a":"الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف، وقراءة القرآن، ومس المصحف، واللبث في المسجد، والمرور فيه إن خافت تلويثه.","m":0,"ex":"اجمعها في ثلاث: عبادات (صلاة، صوم، طواف، قراءة، مس المصحف)، والمسجد (لبث، ومرور إن خافت التلويث)، والزوجية (الوطء في الفرج، والطلاق).","w":["الوطء في الفرج، والصلاة، والصوم، والذكر، والدعاء.","الاستمتاع بما دون الفرج، والصلاة، والصوم، والطواف، والإحرام.","الصلاة، والصوم، والطواف، والوضوء، والخروج من البيت."],"ca":"الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف."},{"id":"s39","b":"الطهارة","q":"امرأة مضى عليها أكثر من 15 يوماً وينزل عليها الدم، ماذا تفعل؟","a":"هي مستحاضة: تجلس من كل شهر ستاً أو سبعاً (حيث لا تمييز)، ثم تغتسل، وتصوم وتصلي بعد غسل المحل وتعصيبه، وتتوضأ لوقت كل صلاة.","m":0,"ex":"ما زاد على أكثر الحيض (١٥ يوماً) ليس حيضاً بل استحاضة. فإن لم تميّز دمها جلست عادة غالب النساء ستاً أو سبعاً، ثم تغتسل وتعيش كالطاهرة، مع غسل المحل وعصبه والوضوء لوقت كل صلاة.","w":["هي حائض: تترك الصلاة والصوم حتى ينقطع الدم.","هي مستحاضة: تجلس خمسة عشر يوماً من كل شهر ثم تغتسل، وتصلي بوضوء واحد لكل يوم.","هي مستحاضة: لا تجلس شيئاً، وتغتسل لكل صلاة."],"ca":"هي مستحاضة: تجلس ستاً أو سبعاً ثم تغتسل، وتصوم وتصلي بعد غسل المحل وتعصيبه، وتتوضأ لوقت كل صلاة."},{"id":"s40","b":"الطهارة","q":"من كان حدثه دائم (كسلس البول أو استطلاق الريح) كيف يتطهر؟","a":"يفعل كالمستحاضة: يغسل المحل ويعصبه، ويتوضأ لوقت كل صلاة («وكذا يفعل كل من حدثه دائم»).","m":0,"ex":"كل من حدثه مستمر يُقاس على المستحاضة: يغسل المحل، ويشده حتى يخف الخارج، ثم يتوضأ بعد دخول الوقت لكل صلاة، ولا يضره ما خرج بعد ذلك.","w":["يتوضأ مرة واحدة لكل يوم، ولا يلزمه غسل المحل.","يغتسل لكل صلاة كالمستحاضة.","يسقط عنه الوضوء لأنه معذور، ويصلي بحاله."]},{"id":"s41","b":"الطهارة","q":"ما أقل النفاس وما أكثره؟","a":"لا حد لأقله، وأكثره أربعون يوماً.","m":0,"ex":"النفاس لا حدّ لأقله: متى طهرت ولو بعد يوم اغتسلت وصلّت. أما أكثره فأربعون يوماً. قارن بالحيض: أقله يوم وليلة وأكثره ١٥.","w":["أقله يوم وليلة، وأكثره أربعون يوماً.","لا حد لأقله، وأكثره ستون يوماً.","أقله عشرة أيام، وأكثره أربعون يوماً."]},{"id":"s42","b":"الصلاة","q":"ما حكم الأذان والإقامة؟ (متى فرض كفاية، متى سنة، متى يكره)؟","a":"فرض كفاية في الحضر على الرجال الأحرار، ويسنان للمنفرد وفي السفر، ويكرهان للنساء ولو بلا رفع صوت.","m":0,"ex":"ثلاث درجات بحسب الحال: رجال أحرار في الحضر = فرض كفاية، ومنفرد أو مسافر = سنة، ونساء = مكروه ولو بصوت خافت.","w":["سنة مؤكدة في الحضر على الرجال، ويباحان للمنفرد وفي السفر، ويسنان للنساء بلا رفع صوت.","فرض عين على كل رجل، ويسنان في السفر، ويكرهان للنساء.","فرض كفاية في الحضر والسفر على الرجال والنساء."]},{"id":"s43","b":"الصلاة","q":"ما شروط صحة الأذان؟","a":"أن يكونا مرتبين، متواليين عرفاً، من واحد، بنية منه؛ وكون المؤذن مسلماً، ذكراً، عاقلاً، مميزاً، ناطقاً، عدلاً ولو ظاهراً؛ وألا يكونا قبل الوقت.","m":0,"ex":"اقسمها ثلاثة: في الأذان نفسه (مرتب، متوالٍ، من واحد، بنية)، وفي المؤذن (مسلم، ذكر، عاقل، مميز، ناطق، عدل)، وفي الوقت (لا قبله).","w":["أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم ذكر بالغ متطهر، وألا يكون قبل الوقت.","أن يكون مرتباً ولو من اثنين، والمؤذن مسلم ذكر عاقل مميز عدل، وألا يكون قبل الوقت.","أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم عاقل مميز ولو أنثى، ويصح قبل الوقت."],"ca":"أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم ذكر عاقل مميز ناطق عدل، وألا يكون قبل الوقت."},{"id":"s44","b":"الصلاة","q":"هل يصح الأذان قبل الوقت؟","a":"لا يصحان قبل الوقت إلا أذان الفجر، فيصح بعد نصف الليل.","m":0,"ex":"الأصل أن الأذان لا يصح قبل دخول الوقت. ويُستثنى الفجر وحده، فيصح أذانه بعد نصف الليل.","w":["لا يصحان قبل الوقت مطلقاً، حتى الفجر.","يصحان قبل الوقت في كل الصلوات بقليل.","لا يصحان قبل الوقت إلا أذان الجمعة، فيصح قبل الزوال."]},{"id":"s45","b":"الصلاة","q":"ما هي سنن الأذان والمؤذن؟","a":"يسن كون المؤذن: صيتاً، أميناً، عالماً بالوقت، متطهراً، قائماً. ويسن: الأذان أول الوقت، والترسل فيه، وأن يكون على علو، رافعاً وجهه، جاعلاً سبابتيه في أذنيه، مستقبل القبلة، يلتفت يميناً لحي على الصلاة وشمالاً لحي على الفلاح، والتثويب في الفجر.","m":0,"ex":"قسمان: صفات المؤذن (صيّت، أمين، عالم بالوقت، متطهر، قائم) وكلها تعين على الإبلاغ والثقة. وصفة الأذان: أول الوقت، بترسل، على مرتفع، إصبعاه في أذنيه، مستقبل القبلة، يلتفت في الحيعلتين، ويثوّب في الفجر.","w":["كون المؤذن صيتاً أميناً عالماً بالوقت متطهراً جالساً، والأذان أول الوقت مستدبر القبلة، والتثويب في العشاء.","كون المؤذن صيتاً أميناً بالغاً، والأذان آخر الوقت على علو مستقبل القبلة، والتثويب في الفجر.","كون المؤذن مسلماً ذكراً عاقلاً، والأذان أول الوقت على علو مستقبل القبلة، والتثويب في المغرب."],"ca":"كون المؤذن صيتاً أميناً عالماً بالوقت متطهراً قائماً، والأذان أول الوقت على علو مستقبل القبلة، والتثويب في الفجر."},{"id":"s46","b":"الصلاة","q":"ما حكم الخروج من المسجد بعد الأذان؟","a":"يحرم بلا عذر أو نية رجوع.","m":0,"ex":"الأذان دعوة للصلاة، فمن كان في المسجد وخرج بعده كأنه أعرض عنها، فيحرم. ويُستثنى أمران: وجود عذر، أو نيته الرجوع.","w":["يكره بلا عذر أو نية رجوع.","يباح مطلقاً إن نوى الصلاة في مسجد آخر.","يحرم مطلقاً ولو لعذر أو نية رجوع."]},{"id":"s47","b":"الصلاة","q":"كم عدد شروط الصلاة، واذكر خمسة منها؟","a":"تسعة: الإسلام، والعقل، والتمييز، والطهارة مع القدرة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية.","m":0,"ex":"تسعة: ثلاثة في الشخص (إسلام، عقل، تمييز) كالوضوء، ثم ستة للصلاة: طهارة، وقت، ستر عورة، اجتناب نجاسة، قبلة، نية. والطهارة مقيدة بالقدرة.","w":["تسعة: الإسلام، والعقل، والبلوغ، والطهارة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية.","ثمانية: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، واستقبال القبلة، والنية.","تسعة: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، وتكبيرة الإحرام، واستقبال القبلة، والنية."],"ca":"تسعة: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية."},{"id":"s48","b":"الصلاة","q":"على من تجب الصلاة؟ ومن هو المميز؟","a":"تجب على كل مسلم مكلف غير الحائض والنفساء. والمميز: من بلغ سبعاً.","m":0,"n":"في نسخة دليل الطالب المطبوعة (ص107): «وهو: من بلغ عشراً».","ex":"تجب على المسلم المكلف (البالغ العاقل)، ويُستثنى الحائض والنفساء فلا تجب عليهما ولا تقضيانها. والمميز من أتم سبع سنين، وهو سن الأمر بالصلاة.","w":["تجب على كل مسلم مكلف حتى الحائض والنفساء. والمميز: من بلغ عشراً.","تجب على كل مسلم مميز غير الحائض والنفساء. والمميز: من بلغ سبعاً.","تجب على كل مسلم مكلف غير الحائض والنفساء. والمميز: من بلغ خمساً."]},{"id":"s49","b":"الصلاة","q":"كم عدد أركان الصلاة؟ وما تعريف الركن؟","a":"أربعة عشر. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً.","m":0,"ex":"الركن هو عمود الصلاة، فلا يسقط أبداً: لا بالعمد ولا بالسهو ولا بالجهل. فرّق بينه وبين الواجب الذي يسقط بالسهو والجهل.","w":["أربعة عشر. والركن: ما تبطل الصلاة بتركه عمداً ويسقط سهواً وجهلاً.","ثلاثة عشر. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً.","ثمانية. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً."]},{"id":"s50","b":"الصلاة","q":"إمام سجد سجدة واحدة ثم سلم، ما حكم صلاته وماذا يفعل؟","a":"لا تصح إلا بالإتيان بالركن؛ لأن الأركان لا تسقط عمداً ولا سهواً ولا جهلاً، فيأتي به (بركعة كاملة إن ذكر بعد السلام ولم يطل الفصل) ويسجد للسهو وجوباً؛ لأنه سلم قبل إتمامها.","m":0,"ex":"السجدة الثانية ركن، والركن لا يسقط بالنسيان، فلا بد من الإتيان به. وإن تذكّر بعد السلام قريباً أتى بركعة كاملة، ثم يسجد للسهو وجوباً لأنه سلّم قبل الإتمام.","w":["صلاته صحيحة، ويسجد للسهو فقط؛ لأن الركن يسقط سهواً.","لا تصح، ويلزمه إعادة الصلاة كلها ولو ذكر قريباً.","لا تصح إلا بالإتيان بالسجدة وحدها، ويسجد للسهو استحباباً."],"ca":"لا تصح إلا بالإتيان بالركن (بركعة كاملة إن ذكر بعد السلام ولم يطل الفصل)، ويسجد للسهو وجوباً."},{"id":"s51","b":"الصلاة","q":"كم عدد واجبات الصلاة وما تعريفها؟","a":"ثمانية، تبطل الصلاة بتركها عمداً وتسقط سهواً وجهلاً: التكبير لغير الإحرام، والتسميع للإمام والمنفرد، والتحميد للكل، وسبحان ربي العظيم مرة، وسبحان ربي الأعلى مرة، ورب اغفر لي بين السجدتين، والتشهد الأول، والجلوس له.","m":0,"ex":"الواجب وسط بين الركن والسنة: يبطل تعمد تركه، ويسقط بالسهو والجهل ويجبر بسجود السهو. وثمانية: ثلاثة أذكار انتقال (تكبير، تسميع، تحميد)، ثلاثة أذكار ثبات (تسبيح ركوع وسجود، ورب اغفر لي)، والتشهد الأول وجلوسه.","w":["ثمانية، لا تسقط عمداً ولا سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأول وجلوسه.","ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبيرة الإحرام، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأخير وجلوسه.","ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، والاستفتاح، والتعوذ."],"ca":"ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأول وجلوسه."},{"id":"s52","b":"الصلاة","q":"اذكر خمسة من سنن الأقوال، وخمسة من سنن الأفعال؟","a":"سنن الأقوال (إحدى عشرة): الاستفتاح، والتعوذ، والبسملة، وآمين، وقراءة السورة بعد الفاتحة، والجهر بالقراءة للإمام، وقول «ملء السماء...» لغير المأموم، وما زاد على المرة في التسبيح وفي رب اغفر لي، والصلاة على آله في التشهد الأخير، والدعاء بعده. سنن الأفعال (الهيئات) منها: رفع اليدين مع تكبيرة الإحرام وعند الركوع والرفع منه، ووضع اليمين على الشمال تحت سرته، والنظر إلى موضع سجوده، ومد ظهره في الركوع، والبداءة بالركبتين ثم اليدين في السجود، ومجافاة عضديه عن جنبيه، والافتراش في التشهد الأول والتورك في الثاني.","m":0,"ex":"سنن الأقوال: أذكار زائدة (استفتاح، تعوذ، بسملة، آمين، سورة، جهر، زيادة التسبيح، دعاء بعد التشهد). وسنن الأفعال هيئات الجسد: رفع اليدين، وضع اليمين على الشمال، النظر لموضع السجود، مد الظهر، المجافاة، الافتراش والتورك.","w":["أقوال: الاستفتاح، والتعوذ، والتسميع، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والجلوس للتشهد الأول، والمجافاة، والتورك.","أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والفاتحة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر لموضع السجود، والمجافاة، والطمأنينة.","أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر إلى السماء، والتورك في التشهد الأول، والافتراش في الثاني."],"ca":"أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر لموضع السجود، والمجافاة، والتورك."},{"id":"s53","b":"الصلاة","q":"اذكر خمسة من مكروهات الصلاة؟","a":"منها: الالتفات بلا حاجة، وتغميض عينيه، وافتراش ذراعيه ساجداً، والعبث، والتخصر، والتمطي، وفرقعة أصابعه وتشبيكها، ومس الحصى، وكف ثوبه، واقتصاره على الفاتحة، وأن يمسح أثر سجوده.","m":0,"ex":"المكروهات كلها تنافي الخشوع والهيئة الحسنة: حركات عابثة (عبث، فرقعة، تشبيك، مس حصى، كف ثوب، مسح أثر السجود)، وهيئات سيئة (تخصر، تمطٍّ، افتراش الذراعين، التفات، تغميض)، وتقصير (الاقتصار على الفاتحة).","w":["منها: الالتفات بلا حاجة، وتغميض عينيه، والعبث، والتخصر، والقهقهة.","منها: الالتفات بلا حاجة، والنظر إلى موضع السجود، والعبث، والتخصر، ووضع اليمين على الشمال.","منها: استدبار القبلة، وتغميض عينيه، والعبث، والتخصر، والكلام سهواً."],"ca":"منها: الالتفات بلا حاجة، وتغميض عينيه، والعبث، والتخصر، وفرقعة أصابعه."},{"id":"s54","b":"الصلاة","q":"ما هي مبطلات الصلاة؟","a":"ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، واتصال النجاسة به إن لم يزلها في الحال، والعمل الكثير من غير جنسها لغير ضرورة، والاستناد قوياً لغير عذر، ورجوعه للتشهد الأول بعد الشروع في القراءة عالماً ذاكراً، وتعمد زيادة ركن فعلي أو تقديم بعض الأركان أو السلام قبل إتمامها، وتعمد إحالة المعنى في القراءة، وفسخ النية والتردد فيه، والدعاء بملاذ الدنيا، والقهقهة، والكلام ولو سهواً، وتقدم المأموم على إمامه، وبطلان صلاة إمامه، والأكل والشرب (سوى اليسير لناس وجاهل).","m":0,"ex":"المبطلات ترجع إلى إخلال بشرط (طهارة، عورة، قبلة، نجاسة، نية)، أو بركن وترتيب (زيادة ركن عمداً، تقديم ركن، سلام قبل الإتمام)، أو بما ينافي الصلاة (عمل كثير، كلام، قهقهة، أكل وشرب)، أو من جهة الإمام (التقدم عليه، بطلان صلاته).","w":["منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل اليسير، والالتفات بلا حاجة، والتبسم.","منها: ما أبطل الطهارة، وكشف العورة سهواً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام عمداً فقط، والتخصر.","منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام ولو سهواً، وتغميض العينين."],"ca":"منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام ولو سهواً، والقهقهة."},{"id":"s55","b":"الصلاة","q":"ما أحوال سجود السهو (متى يباح، يسن، يجب)؟","a":"يسن: إذا أتى بقول مشروع في غير محله سهواً. يباح: إذا ترك مسنوناً. يجب: إذا زاد ركوعاً أو سجوداً أو قياماً أو قعوداً، أو سلم قبل إتمامها، أو لحن لحناً يحيل المعنى، أو ترك واجباً، أو شك في زيادة وقت فعلها.","m":0,"ex":"ثلاث مراتب بحسب نوع الخطأ: قول مشروع في غير محله = سنة، وترك سنة = مباح، وخلل كبير = واجب: زيادة فعل من جنس الصلاة، أو سلام قبل تمامها، أو لحن يحيل المعنى، أو ترك واجب، أو شك في زيادة.","w":["يسن: لترك مسنون. يباح: لقول مشروع في غير محله. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك واجب.","يسن: لقول مشروع في غير محله. يباح: لترك واجب. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك مسنون.","يسن: لترك واجب. يباح: لقول مشروع في غير محله. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك مسنون."],"ca":"يسن: لقول مشروع في غير محله. يباح: لترك مسنون. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك واجب."},{"id":"s56","b":"الصلاة","q":"متى تبطل الصلاة في سجود السهو؟","a":"بتعمد ترك سجود السهو الواجب، لا إن ترك ما وجب بسلامه قبل إتمامها.","m":0,"ex":"من تعمد ترك سجود سهو واجب بطلت صلاته. ويُستثنى السجود الذي وجب لأنه سلم قبل تمام الصلاة، لأن محله بعد السلام فلا يُبطل تركه الصلاة.","w":["بتعمد ترك سجود السهو المسنون، لا إن ترك الواجب منه.","بتعمد ترك سجود السهو الواجب، ولو كان ما وجب بسلامه قبل إتمامها.","بترك سجود السهو الواجب سهواً أو عمداً."]},{"id":"s57","b":"الصلاة","q":"متى يسقط سجود السهو؟","a":"إن نسيه حتى طال الفصل عرفاً، أو أحدث، أو خرج من المسجد.","m":0,"ex":"ثلاثة أسباب تقطع صلته بالصلاة: طول الفصل عرفاً، أو الحدث، أو الخروج من المسجد. فإن حصل واحد منها سقط السجود.","w":["إن نسيه حتى قام من مجلسه، أو تكلم، أو التفت.","لا يسقط أبداً، ويسجد متى ذكره.","إن نسيه حتى خرج وقت الصلاة فقط."]},{"id":"s58","b":"الصلاة","q":"من نسي التشهد الأول وقام ما حكمه؟","a":"إن ذكره قبل أن يستتم قائماً لزمه الرجوع، وإن استتم قائماً كره الرجوع، وإن شرع في القراءة لم يرجع (فإن رجع عالماً ذاكراً بطلت).","m":0,"ex":"ثلاث مراحل كلما تقدم فيها قوي المنع: قبل الاستتمام قائماً = يلزمه الرجوع، بعد الاستتمام = يكره الرجوع، بعد الشروع في القراءة = يحرم الرجوع، ومن رجع عالماً ذاكراً بطلت صلاته.","w":["إن ذكره قبل أن يستتم قائماً كره الرجوع، وإن استتم قائماً لزمه الرجوع، وإن شرع في القراءة لم يرجع.","إن ذكره قبل أن يستتم قائماً لزمه الرجوع، وإن استتم قائماً حرم الرجوع، وإن شرع في القراءة وجب الرجوع.","يلزمه الرجوع ما لم يركع، فإن ركع لم يرجع."]},{"id":"s59","b":"الصلاة","q":"ما هي أفضل صلاة تطوع؟","a":"أفضلها ما سن جماعة، وآكدها: الكسوف، فالاستسقاء، فالتراويح، فالوتر.","m":0,"ex":"القاعدة: ما شُرعت له الجماعة أفضل. ثم الترتيب تنازلياً: كسوف ← استسقاء ← تراويح ← وتر. تذكّر أن آخرها الوتر وأولها الكسوف.","w":["أفضلها ما سن جماعة، وآكدها: الوتر، فالتراويح، فالاستسقاء، فالكسوف.","أفضلها الرواتب، وآكدها: سنة الفجر، فالوتر، فالتراويح.","أفضلها ما سن جماعة، وآكدها: التراويح، فالكسوف، فالوتر، فالاستسقاء."]},{"id":"s60","b":"الصلاة","q":"اذكر سنن الرواتب؟","a":"عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر.","m":0,"ex":"عشر ركعات: الظهر وحده له ركعتان قبل وركعتان بعد، والمغرب والعشاء ركعتان بعد كل منهما، والفجر ركعتان قبله. والعصر ليس له راتبة.","w":["عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان بعد العصر، وركعتان بعد المغرب، وركعتان قبل الفجر.","اثنتا عشرة: أربع قبل الظهر، وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر.","عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان قبل المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر."]},{"id":"s61","b":"الصلاة","q":"ما هي السنن التي يشرع قضاؤها إن فاتت؟","a":"الرواتب والوتر، إلا ما فات مع فرضه وكثر فالأولى تركه.","m":0,"ex":"ما كان مؤكداً يُقضى: الرواتب والوتر. لكن إن فاتت مع فرائضها وكثرت، فالأولى تركها والاشتغال بقضاء الفرائض، لأن الفرض أهم.","w":["الرواتب والوتر، ويقضيها دائماً ولو فاتت مع فرضها وكثرت.","الوتر وحده، ولا تقضى الرواتب.","كل النوافل تقضى، حتى تحية المسجد وصلاة الضحى."]},{"id":"s62","b":"الصلاة","q":"ما حكم تحية المسجد؟","a":"سنة.","m":0,"ex":"تحية المسجد سنة، أي يُثاب فاعلها ولا يأثم تاركها. ولا توصف بالوجوب، فلا تلتبس عليك بالفروض.","w":["واجبة.","مكروهة.","مباحة."]},{"id":"s63","b":"الصلاة","q":"اذكر صفة سجود التلاوة؟","a":"يكبر إذا سجد بلا تكبيرة إحرام، وإذا رفع، ويجلس، ويسلم بلا تشهد. (وهو كالنافلة فيما يعتبر لها).","m":0,"ex":"سجود التلاوة سجدة واحدة لها طرفان: تكبير عند النزول وتكبير عند الرفع، بلا تكبيرة إحرام، ثم جلوس وسلام بلا تشهد. ويشترط لها ما يشترط للنافلة كالطهارة والقبلة.","w":["يكبر للإحرام ثم يكبر إذا سجد وإذا رفع، ويتشهد ويسلم.","يسجد بلا تكبير ولا سلام، ولا يشترط له الطهارة.","يكبر إذا سجد وإذا رفع، ويجلس ويتشهد، ولا يسلم."]},{"id":"s64","b":"الصلاة","q":"رجل وهو يصلي الفريضة أُخبر بنجاحه فسجد للشكر في الصلاة، ما حكم صلاته؟","a":"تبطل صلاته إن سجد للشكر فيها عالماً ذاكراً.","m":0,"ex":"سجود الشكر يكون خارج الصلاة، فإذا فعله فيها كان زيادة ليست منها فتبطل. والبطلان مقيد بأن يكون عالماً بالحكم ذاكراً أنه في صلاة.","w":["صلاته صحيحة؛ لأن سجود الشكر مشروع في الصلاة كسجود التلاوة.","صلاته صحيحة، ويسجد للسهو.","تبطل صلاته ولو كان جاهلاً أو ناسياً."]},{"id":"s65","b":"الصلاة","q":"ما هي أوقات النهي عن الصلاة؟","a":"من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول.","m":0,"ex":"ثلاثة أوقات: بعد الفجر حتى ترتفع الشمس قيد رمح، وبعد العصر حتى تغرب، وعند منتصف النهار حين تكون الشمس في كبد السماء حتى تزول. تذكّر: طلوع، وزوال، وغروب.","w":["من طلوع الشمس إلى ارتفاعها قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول.","من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة المغرب إلى العشاء، وعند قيامها حتى تزول.","من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، ومن نصف الليل إلى الفجر."]},{"id":"s66","b":"الصلاة","q":"ما هي الصلوات المستثناة التي يجوز صلاتها في أوقات النهي؟","a":"سنة الفجر قبلها، وركعتا الطواف، وسنة الظهر إذا جمع، وإعادة جماعة أقيمت وهو بالمسجد. ويجوز فيها قضاء الفرائض، وفعل المنذورة.","m":0,"ex":"المستثنيات صلوات لها سبب أو متعلقة بفرض: سنة الفجر قبله، ركعتا الطواف، سنة الظهر عند الجمع، إعادة الجماعة. ويضاف إليها ما هو واجب: قضاء الفرائض والنذر.","w":["سنة الفجر قبلها، وركعتا الطواف، وتحية المسجد، وصلاة الضحى، وقضاء الفرائض.","سنة الفجر قبلها، وسنة المغرب، وصلاة الوتر، وقضاء الرواتب، والمنذورة.","لا يجوز فيها شيء إلا قضاء الفرائض."],"ca":"سنة الفجر قبلها، وركعتا الطواف، وسنة الظهر إذا جمع، وإعادة الجماعة، وقضاء الفرائض، والمنذورة."},{"id":"s67","b":"الصلاة","q":"على من تجب صلاة الجماعة؟","a":"على الرجال الأحرار القادرين، حضراً وسفراً.","m":0,"ex":"شروط وجوب الجماعة ثلاثة: رجال، أحرار، قادرون. ولا تسقط بالسفر، فهي واجبة حضراً وسفراً. فلا تجب على النساء ولا العبيد ولا العاجز.","w":["على الرجال الأحرار القادرين، في الحضر دون السفر.","على كل مكلف من الرجال والنساء، حضراً وسفراً.","هي سنة مؤكدة على الرجال، حضراً وسفراً."]},{"id":"s68","b":"الصلاة","q":"بماذا تدرك أجر الجماعة؟ وبماذا تدرك الركعة؟","a":"من كبر قبل تسليمة الإمام الأولى أدرك الجماعة. ومن أدرك الركوع غير شاك أدرك الركعة.","m":0,"ex":"فرّق بين إدراكين: الجماعة تُدرك بتكبيرة الإحرام قبل السلام الأول للإمام ولو في التشهد. والركعة تُدرك بإدراك الركوع مع الإمام دون شك.","w":["من أدرك ركعة كاملة أدرك الجماعة. ومن أدرك الركوع غير شاك أدرك الركعة.","من كبر قبل تسليمة الإمام الأولى أدرك الجماعة. ومن أدرك القيام قبل الركوع أدرك الركعة.","من كبر قبل التشهد الأخير أدرك الجماعة. ومن أدرك السجود أدرك الركعة."]},{"id":"s69","b":"الصلاة","q":"ماذا يتحمل الإمام عن المأموم؟","a":"القراءة، وسجود السهو، وسجود التلاوة، والسترة، ودعاء القنوت، والتشهد الأول إذا سبق بركعة في رباعية.","m":0,"ex":"ستة أشياء يكفي فيها فعل الإمام عن المأموم: القراءة، والسجودان (سهو وتلاوة)، والسترة، والقنوت، والتشهد الأول للمسبوق بركعة في الرباعية. تذكّر: قراءة، سجودان، سترة، قنوت، تشهد.","w":["القراءة، وسجود السهو، وتكبيرة الإحرام، والسترة، ودعاء القنوت، والتشهد الأخير.","الفاتحة، والتسبيح، والتحميد، والسترة، ودعاء القنوت، والتشهد الأول.","القراءة، وسجود السهو، وسجود التلاوة، والنية، والسلام، والتشهد الأول."],"ca":"القراءة، وسجود السهو، وسجود التلاوة، والسترة، ودعاء القنوت، والتشهد الأول للمسبوق."},{"id":"s70","b":"الصلاة","q":"متى لا تنعقد صلاة المأموم؟","a":"إذا أحرم مع إمامه، أو قبل إتمامه لتكبيرة الإحرام.","m":0,"ex":"المأموم يتبع إمامه، فلا يدخل في الصلاة قبله ولا معه. فإن كبّر للإحرام مع الإمام أو قبل أن يُتم الإمام تكبيرته لم تنعقد صلاته أصلاً.","w":["إذا أحرم بعد إمامه وقبل قراءته الفاتحة.","إذا ركع قبل إمامه سهواً.","إذا أحرم مع إمامه فقط، وتنعقد إن أحرم قبل إتمامه التكبيرة."]},{"id":"s71","b":"الصلاة","q":"إذا انتقض وضوء الإمام في الصلاة فهل تبطل صلاة من وراءه أم يستنيب غيره؟","a":"تبطل صلاة من وراءه؛ لأن من مبطلات الصلاة «بطلان صلاة إمامه».","m":0,"ex":"صلاة المأموم مرتبطة بصلاة إمامه، فإذا بطلت صلاة الإمام بالحدث بطلت صلاة من خلفه، لأن من المبطلات «بطلان صلاة إمامه».","w":["لا تبطل صلاة من وراءه، ويستنيب الإمام من يكمل بهم.","لا تبطل، ويكمل كل مأموم صلاته منفرداً.","تبطل صلاة الإمام وحده، وينتظرونه حتى يتوضأ ثم يكمل بهم."]},{"id":"s72","b":"الصلاة","q":"ما حكم انتظار الإمام للداخل للمسجد؟","a":"يسن انتظار داخل إن لم يشق على المأموم.","m":0,"ex":"يسن للإمام أن ينتظر الداخل ليدرك الركعة، بشرط ألا يشق ذلك على من خلفه. فحق المأمومين الحاضرين مقدَّم على الداخل.","w":["يجب انتظار داخل ولو شق على المأموم.","يكره انتظار الداخل مطلقاً.","يسن انتظار داخل ولو شق على المأموم."]},{"id":"s73","b":"الصلاة","q":"اذكر ترتيب الأحق بالإمامة؟","a":"الأجود قراءة الأفقه، ثم الأسن، ثم الأشرف، ثم الأتقى والأورع، ثم يقرع.","m":0,"ex":"الترتيب يبدأ بالعلم: الأجود قراءة مع الفقه، ثم الأكبر سناً، ثم الأشرف نسباً، ثم الأتقى والأورع، فإن تساووا فالقرعة.","w":["الأفقه، ثم الأجود قراءة، ثم الأسن، ثم الأشرف، ثم يقرع.","الأجود قراءة الأفقه، ثم الأشرف، ثم الأسن، ثم الأتقى، ثم يقرع.","الأسن، ثم الأجود قراءة، ثم الأفقه، ثم الأتقى، ثم يقرع."]},{"id":"s74","b":"الصلاة","q":"هل يصح للمميز (٧ سنين) أن يكون إماماً؟","a":"لا تصح إمامة المميز بالبالغ في الفرض، وتصح في النفل، وفي الفرض بمثله.","m":0,"ex":"المميز صلاته نافلة لأنه غير مكلف، فلا يؤم البالغ في الفرض. أما في النفل فيصح، ويصح أن يؤم مميزاً مثله في الفرض لتساويهما.","w":["تصح إمامة المميز بالبالغ في الفرض والنفل.","لا تصح إمامة المميز مطلقاً، لا في فرض ولا نفل.","تصح إمامة المميز بالبالغ في الفرض، ولا تصح في النفل."]},{"id":"s75","b":"الصلاة","q":"ما حكم وقوف الإمام بين المأمومين بالصف (يمينه ويساره مأمومين)؟","a":"يصح، والسنة وقوفه متقدماً عليهم.","m":0,"ex":"وقوف الإمام وسط الصف صحيح لا يبطل الصلاة، لكنه خلاف السنة. فالسنة أن يتقدم الإمام عليهم.","w":["لا يصح، ويلزمه التقدم عليهم.","يصح، والسنة وقوفه وسطهم.","يصح مع الكراهة للمأمومين، ويعيدون الصلاة."]},{"id":"s76","b":"الصلاة","q":"ما هي الأسباب التي يُعذر فيها بترك الجمعة والجماعة؟","a":"المريض، والخائف حدوث المرض، والمدافع أحد الأخبثين، ومن له ضائع يرجوه، أو يخاف ضياع ماله أو فواته أو ضرراً فيه، أو يخاف على مال استؤجر لحفظه، أو أذى بمطر ووحل وثلج وجليد وريح باردة بليلة مظلمة، أو تطويل إمام.","m":0,"ex":"كل الأعذار ترجع إلى الخوف من ضرر: على البدن (مرض، أو خوف مرض، أو مدافعة الأخبثين)، أو على المال (ضائع، أو خوف ضياع أو ضرر، أو مال مستأجر لحفظه)، أو من الأذى (مطر ووحل وريح باردة)، أو تطويل الإمام.","w":["المرض، وخوف حدوثه، ومدافعة الأخبثين، والسفر القصير، والحر المعتاد، وتطويل الإمام.","المرض، ومدافعة الأخبثين، وخوف ضياع المال، والأذى بالمطر، والانشغال بالتجارة.","المرض فقط، أو خوف ضياع المال."],"ca":"المرض، وخوف حدوثه، ومدافعة الأخبثين، وخوف ضياع المال، والأذى بالمطر والوحل، وتطويل الإمام."},{"id":"s77","b":"الصلاة","q":"كيف يصلي المريض المكتوبة؟","a":"قائماً ولو مستنداً، فإن لم يستطع فقاعداً، فإن لم يستطع فعلى جنبه والأيمن أفضل، يومئ بالركوع والسجود ويجعل السجود أخفض.","m":0,"ex":"المريض ينتقل درجة درجة حسب قدرته: قائماً ولو معتمداً على شيء، ثم قاعداً، ثم على جنبه والأيمن أفضل. ويومئ بالركوع والسجود ويجعل السجود أخفض ليتميز عن الركوع.","w":["قاعداً، فإن لم يستطع فعلى جنبه والأيسر أفضل، ويجعل الركوع أخفض.","قائماً ولو مستنداً، فإن لم يستطع فعلى جنبه، فإن لم يستطع فقاعداً.","قائماً بلا استناد، فإن لم يستطع سقطت عنه الصلاة."]},{"id":"s78","b":"الصلاة","q":"ما هي شروط قصر الصلاة الرباعية للمسافر؟","a":"لمن نوى سفراً مباحاً، لمحل معين، يبلغ ستة عشر فرسخاً (يومان قاصدان)، إذا فارق بيوت قريته العامرة.","m":0,"ex":"أربعة شروط: نية سفر مباح (لا معصية)، إلى مكان معين، مسافته ستة عشر فرسخاً وهي يومان قاصدان، ويبدأ القصر إذا خرج من بيوت قريته العامرة.","w":["لمن نوى سفراً ولو محرماً، لمحل معين، يبلغ ستة عشر فرسخاً، إذا فارق بيوت قريته.","لمن نوى سفراً مباحاً، لمحل معين، يبلغ أربعة فراسخ، إذا فارق بيوت قريته.","لمن نوى سفراً مباحاً، ولو لغير محل معين، يبلغ ستة عشر فرسخاً، إذا نوى السفر ولو لم يخرج."]},{"id":"s79","b":"الصلاة","q":"متى يلزم المسافر أن يتم صلاته (ولا يقصر)؟","a":"إن دخل وقتها وهو في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة مطلقة أو أكثر من أربعة أيام، أو أقام لحاجة وظن ألا تنقضي إلا بعد الأربعة، أو أخر الصلاة بلا عذر حتى ضاق وقتها عنها.","m":0,"ex":"يرجع إلى الإتمام إذا اختل سبب القصر: دخل الوقت وهو مقيم، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام أو إقامة مطلقة، أو أخر الصلاة بلا عذر حتى ضاق وقتها.","w":["إن دخل وقتها في السفر، أو صلى خلف من يقصر، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام.","إن دخل وقتها في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة يومين.","إن صلى منفرداً، أو صلى خلف من يتم، أو نوى القصر عند الإحرام، أو نوى إقامة أكثر من عشرة أيام."],"ca":"إن دخل وقتها في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام."},{"id":"s80","b":"الصلاة","q":"ما هي الصلوات التي يجوز الجمع بينها؟ ومن له حق الجمع؟","a":"الظهر مع العصر، والمغرب مع العشاء، بوقت إحداهما. ويباح: للمسافر سفر قصر، وللمقيم المريض يلحقه بتركه مشقة، وللمرضع لمشقة كثرة النجاسة، وللعاجز عن الطهارة لكل صلاة، ولعذر أو شغل يبيح ترك الجمعة والجماعة. ويختص بالعشاءين: الثلج والجليد والوحل والريح الشديدة الباردة والمطر الذي يبل الثياب.","m":0,"ex":"يُجمع بين الظهر والعصر، والمغرب والعشاء، في وقت إحداهما. وأسبابه مشقة: سفر قصر، أو مرض، أو إرضاع، أو عجز عن الطهارة، أو عذر الجماعة. وتختص العشاءان بأعذار الجو: مطر يبل الثياب، ثلج، جليد، وحل، ريح شديدة باردة.","w":["الظهر مع العصر، والعصر مع المغرب، والمغرب مع العشاء. يباح للمسافر، والمريض، ويختص الظهران بالمطر.","الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر فقط، ويختص الظهران بالمطر ونحوه.","الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر، والمريض، والمرضع، ويختص الظهران والعشاءان بالمطر."],"ca":"الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر، والمريض، والمرضع، والعاجز عن الطهارة، ويختص العشاءان بالمطر ونحوه."},{"id":"s81","b":"الصلاة","q":"متى تصح صلاة الخوف ومن يحق له صلاتها؟","a":"تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً، للقبلة وغيرها، يومئون طاقتهم؛ وكذا في الهرب من عدو أو سيل أو سبع أو نار أو غريم ظالم، أو خوف فوت الوقوف بعرفة، أو خاف على نفسه أو أهله أو ماله.","m":0,"ex":"شرطها أن يكون القتال مباحاً، في الحضر أو السفر. فإن اشتد الخوف صلّوا ماشين وراكبين بالإيماء ولو لغير القبلة. ويلحق بذلك كل هارب من خطر: عدو، سيل، سبع، نار، غريم ظالم، أو خائف على نفسه أو أهله أو ماله.","w":["تصح إذا كان القتال مباحاً، في السفر دون الحضر. وإذا اشتد الخوف أخّروا الصلاة حتى يأمنوا.","تصح في كل قتال ولو محرماً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً للقبلة فقط.","تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً، ولا يلحق بهم الهارب من سيل أو سبع."],"ca":"تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً يومئون، وكذا الهارب من عدو أو سيل أو سبع."},{"id":"s82","b":"الصلاة","q":"على من تجب صلاة الجمعة؟ ومن الذين تسقط عنهم؟","a":"تجب على كل ذكر، مسلم، مكلف، حر، لا عذر له. ولا تجب على من يباح له القصر، ولا على عبد، ومبعض، وامرأة.","m":0,"ex":"خمسة شروط وجوب: ذكر، مسلم، مكلف، حر، بلا عذر. ومن اختل فيه شرط سقطت عنه: المسافر سفر قصر، والعبد، والمبعّض، والمرأة.","w":["تجب على كل مسلم مكلف ذكراً كان أو أنثى، حر أو عبد. ولا تجب على المسافر.","تجب على كل ذكر، مسلم، مكلف، حر، لا عذر له. ولا تجب على من يباح له القصر فقط.","تجب على كل ذكر، مسلم، مميز، حر. ولا تجب على المريض والمرأة فقط."]},{"id":"s83","b":"الصلاة","q":"ما معنى (المبعّض) المذكور فيمن لا تجب عليهم الجمعة؟","a":"من بعضه حر وبعضه رقيق.","m":0,"ex":"المبعّض من كان جزء منه حراً وجزء منه رقيقاً، فهو ليس حراً كاملاً ولا عبداً كاملاً. ولأن الحرية الكاملة شرط لوجوب الجمعة لم تجب عليه.","w":["من كان مقيماً بعض السنة ومسافراً بعضها.","من بلغ بعض سنه ولم يبلغ الحلم.","العبد الذي كاتبه سيده على مال."]},{"id":"s84","b":"الصلاة","q":"ما هي شروط صحة صلاة الجمعة؟","a":"أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور أربعين، وتقدم خطبتين.","m":0,"ex":"أربعة شروط: الوقت، ومكان مستوطن (قرية يستوطنها أربعون)، وعدد (حضور أربعين)، وخطبتان قبلها. تذكّر: وقت، وطن، عدد، خطبة.","w":["أربعة: الوقت، وأن تكون في مسجد جامع، وحضور أربعين، وتقدم خطبتين.","أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور اثني عشر، وتقدم خطبتين.","أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور أربعين، وتقدم خطبة واحدة."]},{"id":"s85","b":"الصلاة","q":"ما أركان خطبة الجمعة؟","a":"ستة: حمد الله، والصلاة على رسول الله ﷺ، وقراءة آية من كتاب الله، والوصية بتقوى الله، وموالاتهما مع الصلاة، والجهر بحيث يسمع العدد المعتبر.","m":0,"mn":"حمد، صلاة، آية، وصية، موالاة، جهر","ex":"ستة: أربعة أقوال (حمد الله، الصلاة على النبي ﷺ، آية، الوصية بالتقوى)، واثنان في الصفة (الموالاة بين الخطبتين والصلاة، والجهر بحيث يسمع الأربعون).","w":["ستة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والموالاة، والدعاء للمسلمين.","خمسة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والجلوس بين الخطبتين.","ستة: حمد الله، والشهادتان، وقراءة سورة، والوصية بالتقوى، والموالاة، والجهر."],"ca":"ستة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والموالاة، والجهر بحيث يسمع العدد المعتبر."},{"id":"s86","b":"الصلاة","q":"كم أقل السنة بعد الجمعة وأكثرها؟","a":"أقلها ركعتان، وأكثرها ست.","m":0,"ex":"السنة بعد الجمعة لها حدّان: أقلها ركعتان وأكثرها ست. رقمان زوجيان: ٢ و ٦.","w":["أقلها ركعتان، وأكثرها أربع.","أقلها أربع، وأكثرها ست.","أقلها ركعتان، وأكثرها ثمان."]},{"id":"s87","b":"الصلاة","q":"ما حكم صلاة العيدين ووقتها؟ وهل يجوز قضاؤها؟","a":"فرض كفاية، ووقتها كصلاة الضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوا من الغد قضاء، ويسن لمن فاتته قضاؤها ولو بعد الزوال.","m":0,"ex":"صلاة العيد فرض كفاية، ووقتها وقت الضحى من ارتفاع الشمس إلى الزوال. فإن لم يعلموا بالعيد إلا بعد الزوال صلّوها من الغد قضاء. ومن فاتته وحده يسن له قضاؤها ولو بعد الزوال.","w":["سنة مؤكدة، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال فلا تقضى.","فرض عين، ووقتها بعد الزوال كالظهر. وإن فاتت لم تقض.","فرض كفاية، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوها بعد العصر أداء."],"ca":"فرض كفاية، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوا من الغد قضاء."},{"id":"s88","b":"الصلاة","q":"كم يكبر زوائد في الركعة الأولى والثانية بصلاة العيد؟","a":"في الأولى بعد تكبيرة الإحرام وقبل التعوذ: ستاً، وفي الثانية قبل القراءة: خمساً، يرفع يديه مع كل تكبيرة","m":0,"ex":"في صلاة العيد تكبيرات زائدة قبل القراءة في كل ركعة. في الأولى ستّ بعد تكبيرة الإحرام وقبل الاستعاذة، وفي الثانية خمس قبل القراءة. احفظ: ستّ ثم خمس (تنقص واحدة)، ويرفع يديه مع كل تكبيرة.","w":["في الأولى بعد التعوذ وقبل القراءة: خمساً، وفي الثانية قبل القراءة: ستاً، يرفع يديه مع كل تكبيرة","في الأولى بعد تكبيرة الإحرام وقبل التعوذ: سبعاً، وفي الثانية بعد القراءة: خمساً، ولا يرفع يديه","في الأولى بعد تكبيرة الإحرام وقبل التعوذ: ستاً، وفي الثانية بعد القراءة: ستاً، يرفع يديه في الأولى فقط"]},{"id":"s89","b":"الصلاة","q":"ما هو التكبير المطلق والمقيد؟","a":"المطلق (ويجهر به): في ليلتي العيدين إلى فراغ الخطبة، وفي كل عشر ذي الحجة. المقيد: في الأضحى عقب كل فريضة صلاها في جماعة، من صلاة فجر يوم عرفة إلى عصر آخر أيام التشريق، إلا المحرم فمن صلاة ظهر يوم النحر","m":0,"ex":"التكبير نوعان: مطلق في كل وقت، ومقيد بأدبار الصلوات. المطلق يُجهر به ليلتي العيدين حتى تنتهي الخطبة، وطوال عشر ذي الحجة. والمقيد خاص بالأضحى عقب الفرائض في جماعة: من فجر يوم عرفة إلى عصر آخر أيام التشريق، والمحرم يبدأ من ظهر يوم النحر.","w":["المطلق: ليلة الفطر فقط إلى خروج الإمام. المقيد: عقب كل صلاة ولو نافلة، من ظهر يوم النحر إلى عصر آخر التشريق","المطلق: ليلتي العيدين إلى فراغ الخطبة وكل عشر ذي الحجة. المقيد: عقب الفرائض جماعة، من فجر يوم النحر إلى مغرب آخر التشريق","المطلق: عقب الفرائض جماعة في عشر ذي الحجة. المقيد: ليلتي العيدين إلى فراغ الخطبة، ومن فجر عرفة إلى عصر يوم النحر"],"ca":"المطلق: ليلتي العيدين إلى فراغ الخطبة وكل عشر ذي الحجة. المقيد: عقب الفرائض جماعة، من فجر عرفة إلى عصر آخر التشريق"},{"id":"s90","b":"الصلاة","q":"ما حكم صلاة الكسوف ووقتها؟ وإذا انتهى الكسوف هل تقضى؟","a":"سنة، من غير خطبة، ولا تقضى إن فاتت","m":0,"ex":"صلاة الكسوف سنة، ووقتها من ابتداء الكسوف إلى ذهابه، وليس لها خطبة بخلاف العيد والاستسقاء. وهي مربوطة بسببها، فإذا انجلى الكسوف فات وقتها فلا تُقضى. احفظ: سنة، بلا خطبة، بلا قضاء.","w":["فرض كفاية، بخطبتين، وتقضى إن فاتت","سنة، بخطبة واحدة، وتقضى إن فاتت","واجبة، من غير خطبة، ولا تقضى إن فاتت"]},{"id":"s91","b":"الصلاة","q":"في صلاة الكسوف، من فاته الركوع فبأي الركوعين تدرك الركعة؟","a":"بالركوع الأول؛ وما بعد الأول سنة لا تدرك به الركعة","m":0,"ex":"في كل ركعة من الكسوف ركوعان أو أكثر. الركوع الأول هو الأصل الذي تُدرك به الركعة، وما بعده زيادة مسنونة. فمن لحق الإمام في الركوع الثاني فاتته تلك الركعة.","w":["بالركوع الثاني؛ وما قبله سنة لا تدرك به الركعة","بأيهما أدرك؛ فكلاهما ركن تدرك به الركعة","بالركوع الأخير؛ لأنه الذي يعقبه السجود"]},{"id":"s92","b":"الصلاة","q":"ما حكم صلاة الاستسقاء؟","a":"سنة، ووقتها وصفتها وأحكامها كصلاة العيد","m":0,"ex":"الاستسقاء صلاة لطلب المطر عند الجدب، وحكمها سنة. أسهل طريق لحفظها أنها «كالعيد» في وقتها وصفتها وأحكامها: ركعتان بالتكبيرات الزوائد. ومن فروقها أنه يخطب لها خطبة واحدة بعد الصلاة.","w":["فرض كفاية، ووقتها وصفتها وأحكامها كصلاة العيد","سنة، ووقتها وصفتها وأحكامها كصلاة الكسوف","سنة، وصفتها كصلاة الجمعة بخطبتين قبلها"]},{"id":"s93","b":"الجنائز","q":"ما حكم غسل الميت وحمله والصلاة عليه ودفنه؟","a":"غسله وتكفينه والصلاة عليه وحمله ودفنه: فرض كفاية","m":0,"ex":"هذه خمسة حقوق للميت على المسلمين: غسله، وتكفينه، والصلاة عليه، وحمله، ودفنه. كلها فرض كفاية: إذا قام بها من يكفي سقط الإثم عن الباقين، وإن تركها الجميع أثموا.","w":["غسله وتكفينه: فرض كفاية، والصلاة عليه وحمله ودفنه: سنة","غسله وتكفينه والصلاة عليه وحمله ودفنه: فرض عين على أقاربه","الصلاة عليه ودفنه: فرض كفاية، وغسله وتكفينه وحمله: سنة مؤكدة"]},{"id":"s94","b":"الجنائز","q":"ما شروط ماء غسل الميت؟ وشروط الغاسل؟","a":"في الماء: الطهورية، والإباحة. وفي الغاسل: الإسلام، والعقل، والتمييز","m":0,"ex":"قسّمها قسمين: الماء له شرطان: أن يكون طهوراً، ومباحاً غير مغصوب. والغاسل له ثلاثة: مسلم، عاقل، مميز؛ لأن الغسل عبادة تحتاج إلى نية. المجموع خمسة: اثنان للماء وثلاثة للغاسل.","w":["في الماء: الطهورية، والحرارة. وفي الغاسل: الإسلام، والبلوغ، والذكورة","في الماء: الطهارة ولو مستعملاً. وفي الغاسل: الإسلام، والعقل، والبلوغ","في الماء: الطهورية، والإباحة. وفي الغاسل: الإسلام، والبلوغ، والقرابة"]},{"id":"s95","b":"الجنائز","q":"ما حكم شهيد المعركة والمقتول ظلماً؟","a":"لا يغسل، ولا يكفن، ولا يصلى عليه، ويجب بقاء دمه عليه، ودفنه في ثيابه","m":0,"ex":"الشهيد يبقى على الهيئة التي قُتل عليها: فلا يُغسل، ولا يُكفن، ولا يُصلى عليه، ويبقى دمه عليه، ويُدفن في ثيابه. احفظها: ثلاث «لا» ثم أمران واجبان. والمقتول ظلماً مثله في الحكم.","w":["يغسل، ويكفن، ولا يصلى عليه، ويدفن في غير ثيابه","لا يغسل، ولا يكفن، ويصلى عليه، ويجب بقاء دمه عليه","لا يغسل، ويكفن، ويصلى عليه، ويستحب إزالة دمه"]},{"id":"s96","b":"الجنائز","q":"ما حكم السقط؟","a":"سقط لأربعة أشهر: كالمولود حياً","m":0,"ex":"السقط هو الجنين الذي ينزل ميتاً قبل تمامه. إذا بلغ أربعة أشهر صار حكمه كحكم المولود حياً في الغسل والصلاة عليه. العلامة الفارقة: أربعة أشهر.","w":["سقط لستة أشهر: كالمولود حياً","سقط لأربعين يوماً: كالمولود حياً","سقط لأربعة أشهر: لا يغسل ولا يصلى عليه"]},{"id":"s97","b":"الجنائز","q":"اذكر أركان صلاة الجنازة؟","a":"سبعة: القيام في فرضها، والتكبيرات الأربع، وقراءة الفاتحة، والصلاة على محمد ﷺ، والدعاء للميت، والسلام، والترتيب (لكن لا يتعين كون الدعاء في الثالثة، بل يجوز بعد الرابعة)","m":0,"mn":"قِ تَ فَ صَ دَ سَ تَ: قيام، تكبيرات، فاتحة، صلاة على النبي، دعاء، سلام، ترتيب","ex":"رتّبها على التكبيرات: بعد الأولى الفاتحة، وبعد الثانية الصلاة على النبي ﷺ، وبعد الثالثة الدعاء للميت، ثم السلام. أضف القيام والتكبيرات والترتيب تصير سبعة. والدعاء يجوز أيضاً بعد الرابعة.","w":["سبعة: القيام، والتكبيرات الأربع، والفاتحة، والصلاة على النبي ﷺ، والدعاء للميت، والتشهد، والسلام","ستة: القيام، والتكبيرات الأربع، والفاتحة، والدعاء للميت، والسلام، والترتيب","سبعة: النية، والتكبيرات الأربع، والفاتحة، والسورة بعدها، والدعاء للميت، والسلام، والترتيب"],"ca":"سبعة: القيام، والتكبيرات الأربع، والفاتحة، والصلاة على النبي ﷺ، والدعاء للميت، والسلام، والترتيب"},{"id":"s98","b":"الجنائز","q":"لو سها في صلاة الجنازة، هل يسجد للسهو؟","a":"لا سجود سهو فيها","m":0,"ex":"صلاة الجنازة ليس فيها ركوع ولا سجود أصلاً، فلا يُشرع فيها سجود السهو. فلو سها فيها أتمّها ولا يسجد.","w":["يسجد للسهو بعد السلام","يسجد للسهو قبل السلام كسائر الصلوات","يسن سجود السهو فيها ولا يجب"]},{"id":"s99","b":"الجنائز","q":"من فاتته تكبيرات الجنازة، كيف يقضيها؟","a":"يقضي المسبوق ما فاته على صفته، فإن خشي رفعها تابع التكبير بلا دعاء، وإن سلم مع الإمام ولم يقضِ صحت","m":0,"ex":"المسبوق يأتي بما فاته على صفته: التكبير مع ما بعده من قراءة أو صلاة أو دعاء. فإن خاف أن تُرفع الجنازة تابع التكبيرات بلا دعاء. وإن سلّم مع الإمام دون قضاء صحّت صلاته. ثلاث حالات: يقضي كاملاً، أو يختصر، أو يترك.","w":["يقضي المسبوق ما فاته بالتكبير فقط دائماً، وإن سلم مع الإمام ولم يقضِ بطلت","لا يقضي المسبوق شيئاً، بل يدخل مع الإمام ويسلم معه وجوباً","يقضي ما فاته على صفته، فإن خشي رفعها قطع الصلاة، وإن سلم مع الإمام ولم يقضِ أعادها"]},{"id":"s100","b":"الجنائز","q":"ما السنة فيمن يتبع الجنازة (الماشي والراكب)؟","a":"الماشي: أمام الجنازة، والراكب: خلفها، والقرب منها أفضل","m":0,"ex":"الماشي يمشي أمام الجنازة، والراكب يكون خلفها. احفظ: ماشٍ أمام، راكب خلف.","w":["الماشي: خلف الجنازة، والراكب: أمامها، والقرب منها أفضل","الماشي والراكب: خلف الجنازة، والبعد عنها أفضل","الماشي: أمام الجنازة، والراكب: خلفها، والبعد عنها أفضل"]},{"id":"s101","b":"الجنائز","q":"ماذا يقول من يدخل الميت القبر؟","a":"بسم الله، وعلى ملة رسول الله","m":0,"ex":"يُدخَل الميت قبره باسم الله، وعلى الدين الذي جاء به رسول الله ﷺ. لا تخلط بينه وبين ما يقال عند تغميض الميت: «بسم الله وعلى وفاة رسول الله»؛ هنا عند القبر «ملة».","w":["بسم الله، وعلى وفاة رسول الله","بسم الله، وعلى سنة رسول الله","بسم الله، وإنا لله وإنا إليه راجعون"]},{"id":"s102","b":"الجنائز","q":"ما حكم النياحة على الميت؟","a":"تحرم (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويحرم الندب، وشق الثوب، ولطم الخد، والصراخ، ونتف الشعر ونشره وحلقه","m":0,"ex":"البكاء على الميت لا بأس به، والمحرّم هو الجزع: بالصوت (النياحة، والندب، والصراخ)، وبالثوب (شقّه)، وبالبدن (لطم الخد، ونتف الشعر ونشره وحلقه). النياحة: رفع الصوت بتعداد محاسن الميت برنّة، والندب: البكاء مع تعدادها.","w":["تكره (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويكره الندب، وشق الثوب، ولطم الخد، والصراخ، ونتف الشعر ونشره وحلقه","تحرم (وهي رفع الصوت بتعداد محاسن الميت برنة)، ويكره الندب وشق الثوب، ويباح الصراخ ونتف الشعر ونشره","تباح إن كانت بلا صراخ (وهي تعداد محاسن الميت)، ويحرم شق الثوب، ولطم الخد، ونتف الشعر"]},{"id":"s103","b":"الزكاة","q":"ما هي شروط وجوب الزكاة؟","a":"خمسة: الإسلام، والحرية، وملك النصاب، والملك التام، وتمام الحول","m":0,"mn":"إسلام، حرية، نصاب، ملك تام، حول","ex":"خمسة: اثنان في الشخص (الإسلام، والحرية)، وثلاثة في المال (ملك النصاب، والملك التام، وتمام الحول). فلا تجب على كافر ولا رقيق، ولا في مال لم يبلغ النصاب أو لم يتم ملكه أو لم يمض عليه حول. وتجب في مال الصغير والمجنون.","w":["خمسة: الإسلام، والبلوغ، والعقل، وملك النصاب، وتمام الحول","أربعة: الإسلام، والحرية، وملك النصاب، وتمام الحول","خمسة: الإسلام، والحرية، والبلوغ، والملك التام، وتمام الحول"]},{"id":"s104","b":"الزكاة","q":"متى تجب الزكاة في السائمة من بهيمة الأنعام؟","a":"بثلاثة شروط: أن تتخذ للدر والنسل والتسمين لا للعمل، وأن تسوم (ترعى) المباح أكثر الحول، وأن تبلغ نصاباً","m":0,"ex":"السائمة هي التي ترعى بنفسها. تجب فيها بثلاثة شروط: الغرض (للحليب والنسل والتسمين، لا للعمل)، والرعي (ترعى المباح أكثر الحول، فالمعلوفة أكثره لا زكاة فيها)، والعدد (أن تبلغ النصاب).","w":["بثلاثة شروط: أن تتخذ للعمل لا للدر والنسل، وأن تسوم المباح أكثر الحول، وأن تبلغ نصاباً","بثلاثة شروط: أن تتخذ للدر والنسل والتسمين، وأن تعلف أكثر الحول، وأن تبلغ نصاباً","بشرطين: أن تسوم المباح الحول كله، وأن تبلغ نصاباً"]},{"id":"s105","b":"الزكاة","q":"ما هو نصاب الإبل، البقر، الغنم؟","a":"الإبل: خمس وفيها شاة، والبقر: ثلاثون وفيها تبيع (له سنة)، والغنم: أربعون وفيها شاة","m":0,"ex":"أقل نصاب لكل نوع: الإبل خمس وفيها شاة، والبقر ثلاثون وفيها تبيع له سنة، والغنم أربعون وفيها شاة. لاحظ: الإبل والغنم أول زكاتهما شاة، والبقر زكاتها من جنسها. تسلسل الأعداد: ٥ ثم ٣٠ ثم ٤٠.","w":["الإبل: خمس وفيها شاة، والبقر: أربعون وفيها مسنة، والغنم: ثلاثون وفيها شاة","الإبل: عشر وفيها شاتان، والبقر: ثلاثون وفيها تبيع، والغنم: عشرون وفيها شاة","الإبل: خمس وعشرون وفيها بنت مخاض، والبقر: ثلاثون وفيها مسنة، والغنم: أربعون وفيها شاة"]},{"id":"s106","b":"الزكاة","q":"كم نصاب العسل في المذهب ومقدار الزكاة فيه؟","a":"فيه العشر، ونصابه مائة وستون رطلاً عراقية","m":0,"ex":"العسل فيه العشر (١٠٪) مثل الزرع الذي يسقى بلا كلفة، لا ربع العشر كالنقود. ونصابه مائة وستون رطلاً عراقياً. احفظ: «العشر» للواجب، و«١٦٠» للنصاب.","w":["فيه ربع العشر، ونصابه مائة وستون رطلاً عراقية","فيه العشر، ونصابه خمسة أوسق","فيه نصف العشر، ونصابه ثلاثمائة رطل عراقية"]},{"id":"s107","b":"الزكاة","q":"ما نصاب الذهب والفضة؟","a":"الذهب: عشرون مثقالاً، والفضة: مائتا درهم، وفيهما ربع العشر","m":0,"n":"يعادل تقريباً 85 غ ذهب و595 غ فضة","ex":"الذهب عشرون مثقالاً، والفضة مائتا درهم: نفس الرقم ٢٠ مع زيادة صفر للفضة (٢٠٠). والواجب فيهما ربع العشر (٢٫٥٪) إذا بلغا النصاب.","w":["الذهب: عشرون مثقالاً، والفضة: مائتا درهم، وفيهما العشر","الذهب: مائتا مثقال، والفضة: عشرون درهماً، وفيهما ربع العشر","الذهب: أربعون مثقالاً، والفضة: مائتا درهم، وفيهما ربع العشر"]},{"id":"s108","b":"الزكاة","q":"متى تجب زكاة الحلي؟","a":"تجب في الحلي المحرم، وكذا في المباح المعد للكراء أو النفقة إذا بلغ نصاباً وزناً؛ ولا زكاة في حلي مباح معد لاستعمال أو إعارة","m":0,"ex":"القاعدة: الحلي المباح المعدّ للبس أو الإعارة لا زكاة فيه؛ لأنه للاستعمال كالثياب. وتجب في الحلي المحرّم، وفي المباح إذا أُعدّ للكراء أو للنفقة، بشرط أن يبلغ النصاب وزناً.","w":["تجب في كل حلي بلغ نصاباً، ولو كان مباحاً معداً لاستعمال أو إعارة","تجب في المباح المعد لاستعمال أو إعارة، لا في المعد للكراء أو النفقة","لا تجب في الحلي مطلقاً، ولو كان محرماً أو معداً للكراء"],"ca":"تجب في الحلي المحرم، وفي المباح المعد للكراء أو النفقة إذا بلغ نصاباً، لا في المعد لاستعمال أو إعارة"},{"id":"s109","b":"الزكاة","q":"متى تجب زكاة الفطر؟ وأفضل وقتها؟ ومتى تكره وتحرم؟","a":"تجب: بأول ليلة العيد (بغروب شمس آخر رمضان). الأفضل: يوم العيد قبل الصلاة. تكره: بعدها. يحرم تأخيرها عن يوم العيد مع القدرة، ويقضيها. وتجزئ قبل العيد بيومين","m":0,"ex":"رتّبها زمنياً: قبل العيد بيومين تجزئ، وبغروب شمس آخر يوم من رمضان تجب، والأفضل صباح العيد قبل الصلاة، وبعد الصلاة تكره، وتأخيرها عن يوم العيد يحرم ويقضيها. فمن مات قبل الغروب فلا فطرة عليه.","w":["تجب بطلوع فجر يوم العيد، الأفضل قبل الصلاة، تكره بعدها، ويحرم تأخيرها عن يوم العيد، وتجزئ قبله بيومين","تجب بغروب شمس آخر رمضان، الأفضل ليلة العيد، تكره يوم العيد، ويحرم تأخيرها عن الصلاة، وتجزئ قبله بأسبوع","تجب بغروب شمس آخر رمضان، الأفضل يوم العيد قبل الصلاة، وتباح بعدها إلى آخر أيام التشريق، وتجزئ من أول رمضان"],"ca":"تجب بغروب شمس آخر رمضان، الأفضل يوم العيد قبل الصلاة، تكره بعدها، ويحرم تأخيرها عن يوم العيد، وتجزئ قبله بيومين"},{"id":"s110","b":"الزكاة","q":"ما حكم إخراج زكاة الفطر عن الجنين؟","a":"تسن عن الجنين","m":0,"ex":"زكاة الفطر تجب عمّن وُجد ليلة العيد، والجنين لم يولد بعد فلا تجب عنه، لكن يُسن إخراجها عنه. احفظ: المولود تجب، والجنين تسن.","w":["تجب عن الجنين","تكره عن الجنين","لا تشرع عن الجنين"]},{"id":"s111","b":"الزكاة","q":"هل يصح إعطاء فطرة الجماعة لشخص واحد، وفطرة الواحد لجماعة؟","a":"يجوز أن يعطي الجماعة فطرتهم لواحد، وأن يعطي الواحد فطرته لجماعة","m":0,"ex":"زكاة الفطر مرنة في التوزيع: يجوز جمع فطرة عدة أشخاص وإعطاؤها لفقير واحد، ويجوز تفريق فطرة شخص واحد على عدة فقراء. الاتجاهان كلاهما جائز.","w":["يجوز أن يعطي الجماعة فطرتهم لواحد، ولا يجوز أن يعطي الواحد فطرته لجماعة","لا يجوز أن يعطي الجماعة فطرتهم لواحد، ويجوز أن يعطي الواحد فطرته لجماعة","لا يجوز أن تعطى فطرة الجماعة لواحد، ولا فطرة الواحد لجماعة"]},{"id":"s112","b":"الزكاة","q":"ما حكم إخراج القيمة النقدية بزكاة الفطر؟","a":"لا يجزئ إخراج القيمة في الزكاة مطلقاً","m":0,"ex":"الواجب في الفطرة صاع من الأصناف المذكورة: تمر، أو زبيب، أو بُر، أو شعير، أو أقط. ولا يجزئ إخراج القيمة بدلها، وهذا الحكم عام في الزكاة كلها «مطلقاً»، لا في الفطرة وحدها.","w":["يجزئ إخراج القيمة في زكاة الفطر للحاجة","يكره إخراج القيمة في الزكاة ويجزئ","لا يجزئ إخراج القيمة في الفطر خاصة، ويجزئ في زكاة المال"]},{"id":"s113","b":"الزكاة","q":"ما حكم تأخير الزكاة عن وقتها؟","a":"يجب إخراجها فوراً، وله تأخيرها: لزمن حاجة، ولقريب، وجار، ولتعذر إخراجها من النصاب","m":0,"ex":"الأصل أن الزكاة حق للفقراء فيجب إخراجها فوراً. ويجوز تأخيرها لمصلحة: لزمن حاجة، أو ليعطيها قريباً أو جاراً، أو لتعذّر إخراجها من النصاب نفسه.","w":["يجوز تأخيرها إلى آخر الحول الثاني مطلقاً، ولا يجب إخراجها فوراً","يجب إخراجها فوراً، ولا يجوز تأخيرها بحال ولو لقريب أو جار","يسن إخراجها فوراً، ويكره تأخيرها إلا لقريب"]},{"id":"s114","b":"الزكاة","q":"من يخرج الزكاة عن الصغير والمجنون؟","a":"وليهما","m":0,"ex":"الزكاة تجب في مال الصغير والمجنون لأنها حق في المال نفسه، لكنهما لا يستطيعان إخراجها، فيخرجها عنهما وليّهما من مالهما.","w":["لا زكاة في مالهما حتى يبلغ الصغير ويفيق المجنون","الحاكم دون الولي","يخرجانها بأنفسهما عن الأعوام الماضية بعد البلوغ والإفاقة"]},{"id":"s115","b":"الزكاة","q":"ما حكم نقل الزكاة مسافة قصر عن بلده؟","a":"يحرم نقلها إلى مسافة قصر، وتجزئ","m":0,"ex":"الأفضل تفريق زكاة المال في فقراء بلده. ونقلها إلى مسافة قصر فأكثر حرام، لكن لو نقلها أجزأت مع الإثم. احفظ: «يحرم ويجزئ»، مثل حج المرأة بلا محرم.","w":["يحرم نقلها إلى مسافة قصر، ولا تجزئ","يكره نقلها إلى مسافة قصر، وتجزئ","يسن نقلها إلى مسافة قصر، وتجزئ"]},{"id":"s116","b":"الزكاة","q":"ما حكم تعجيل الزكاة؟","a":"يصح تعجيلها لحولين فقط إذا كمل النصاب","m":0,"ex":"يجوز إخراج الزكاة قبل وقتها بشرطين: ألا يزيد التعجيل على حولين (سنتين)، وأن يكون النصاب قد كمل. فإن تلف النصاب أو نقص وقع ما أخرجه نفلاً.","w":["يصح تعجيلها لحول واحد فقط إذا كمل النصاب","يصح تعجيلها لثلاثة أحوال ولو لم يكمل النصاب","لا يصح تعجيلها قبل تمام الحول"]},{"id":"s117","b":"الزكاة","q":"اذكر من لا يجوز إخراج الزكاة لهم؟","a":"الكافر، والرقيق، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، وبنو هاشم","m":0,"mn":"كافر، رقيق، غني، منفَق عليه، زوج، هاشمي","ex":"ستة، يجمعها ثلاث أفكار: ليسوا من أهلها (الكافر، والرقيق). وغير محتاجين أو يعود نفعها إلى المزكي (الغني بمال أو كسب، ومن تلزمه نفقته، والزوج). ومُكرَّمون عنها (بنو هاشم).","w":["الكافر، والرقيق، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، والمكاتب","الكافر، والغني بمال أو كسب، ومن تلزمه نفقته، والزوج، وبنو هاشم، والغارم","الكافر، والرقيق، والغني بمال أو كسب، والقريب مطلقاً، والجار، وبنو هاشم"]},{"id":"s118","b":"الصيام والاعتكاف","q":"بمن تثبت رؤية هلال رمضان؟","a":"بخبر مسلم، مكلف، عدل، ولو عبداً وأنثى","m":0,"ex":"هلال رمضان يكفي فيه خبر واحد، بشرط أن يكون مسلماً، مكلفاً، عدلاً؛ ولو كان عبداً أو امرأة. بخلاف بقية الشهور فلا يُقبل فيها إلا رجلان عدلان.","w":["بخبر رجلين مسلمين، مكلفين، عدلين، لا عبد فيهما ولا أنثى","بخبر مسلم، مكلف، عدل، بشرط أن يكون ذكراً حراً","بخبر مسلم مميز، ولو لم تعرف عدالته"]},{"id":"s119","b":"الصيام والاعتكاف","q":"ما هي شروط وجوب الصوم؟","a":"أربعة: الإسلام، والبلوغ، والعقل، والقدرة عليه","m":0,"ex":"أربعة: الإسلام، والبلوغ، والعقل، والقدرة. فلا يجب على كافر، ولا صغير، ولا مجنون، ولا عاجز. قارنها بشروط الصحة الستة: فيها التمييز بدل البلوغ، وتزيد النية وانقطاع الحيض والنفاس.","w":["أربعة: الإسلام، والتمييز، والعقل، والنية","خمسة: الإسلام، والبلوغ، والعقل، والحرية، والقدرة عليه","أربعة: الإسلام، والبلوغ، والعقل، والإقامة"]},{"id":"s120","b":"الصيام والاعتكاف","q":"ما هي شروط صحة الصوم؟","a":"ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والتمييز، والعقل، والنية من الليل لكل يوم واجب","m":0,"ex":"ستة تبيّن متى يصح الصوم: الإسلام، والعقل، والتمييز (فيصح من الصغير المميز)، وانقطاع دم الحيض، والنفاس، والنية من الليل لكل يوم واجب. الفرق عن شروط الوجوب: هنا التمييز لا البلوغ، ومعه النية والطهارة من الدم.","w":["ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والبلوغ، والعقل، والنية من الليل لكل يوم واجب","ستة: الإسلام، وانقطاع دم الحيض، والنفاس، والتمييز، والعقل، والنية مرة واحدة للشهر كله","أربعة: الإسلام، والبلوغ، والعقل، والقدرة عليه"]},{"id":"s121","b":"الصيام والاعتكاف","q":"ما هو فرض الصوم الأوحد المذكور بالكتاب؟","a":"الإمساك عن المفطرات من طلوع الفجر الثاني إلى غروب الشمس","m":0,"ex":"للصوم فرض واحد هو الإمساك عن المفطرات. يبدأ من طلوع الفجر الثاني (الصادق المنتشر في الأفق)، لا الفجر الأول، وينتهي بغروب الشمس.","w":["الإمساك عن المفطرات من طلوع الفجر الأول إلى غروب الشمس","الإمساك عن المفطرات من طلوع الشمس إلى غروبها","الإمساك عن المفطرات من طلوع الفجر الثاني إلى صلاة العشاء"]},{"id":"s122","b":"الصيام والاعتكاف","q":"اذكر من سنن الصوم؟","a":"ستة: تعجيل الفطر، وتأخير السحور، والزيادة في أعمال الخير، وقوله جهراً إذا شتم: إني صائم، وقوله عند فطره: اللهم لك صمت وعلى رزقك أفطرت…، وفطره على رطب فإن عدم فتمر فإن عدم فماء","m":0,"mn":"تعجيل، تأخير، خير، «إني صائم»، دعاء الفطر، رطب","ex":"ستة، رتّبها على اليوم: في السحر تأخير السحور. وفي النهار الزيادة في أعمال الخير، وقول «إني صائم» جهراً إذا شُتم. وعند المغرب تعجيل الفطر، ودعاء الفطر، والفطر على رطب ثم تمر ثم ماء.","w":["ستة: تأخير الفطر، وتعجيل السحور، والزيادة في الخير، وقول: إني صائم إذا شتم، ودعاء الفطر، والفطر على رطب فتمر فماء","ستة: تعجيل الفطر، وتأخير السحور، والزيادة في الخير، والسكوت إذا شتم، ودعاء الفطر، والفطر على ماء فتمر فرطب","خمسة: تعجيل الفطر، وتأخير السحور، والاعتكاف، ودعاء الفطر، والفطر على تمر فماء"],"ca":"ستة: تعجيل الفطر، وتأخير السحور، والزيادة في الخير، وقول: إني صائم إذا شتم، ودعاء الفطر، والفطر على رطب فتمر فماء"},{"id":"s123","b":"الصيام والاعتكاف","q":"ما حكم فطر المسافر؟","a":"يسن لمسافر يباح له القصر","m":0,"ex":"الفطر للمسافر سنة بشرط أن يكون سفره مما يباح فيه قصر الصلاة. فالسفر الذي يجيز القصر يجعل الفطر أفضل. قارن: المريض الذي يخاف الضرر يسن له الفطر أيضاً، والحائض يجب عليها.","w":["يجب لمسافر يباح له القصر","يكره لمسافر يباح له القصر","يباح لكل مسافر ولو لم يبح له القصر"]},{"id":"s124","b":"الصيام والاعتكاف","q":"ما حكم إفطار الحامل أو المرضع إن خافت على نفسها أو ولدها؟","a":"يباح، لكن لو أفطرتا خوفاً على الولد فقط لزم وليه إطعام مسكين لكل يوم","m":0,"ex":"الحامل والمرضع إن خافتا على نفسيهما أو على الولد جاز لهما الفطر. ثم يُفرّق: إن كان الخوف على الولد وحده، لزم وليَّ الولد إطعام مسكين عن كل يوم؛ لأن الفطر كان لمصلحة الولد.","w":["يحرم، لكن لو أفطرتا خوفاً على أنفسهما لزمهما إطعام مسكين لكل يوم","يباح، ولا يلزم أحداً إطعام ولو أفطرتا خوفاً على الولد فقط","يجب، ويلزمهما إطعام مسكين لكل يوم مطلقاً"]},{"id":"s125","b":"الصيام والاعتكاف","q":"اذكر أمثلة من مفطرات الصوم؟","a":"اثنا عشر: خروج دم الحيض والنفاس، والموت، والردة، والعزم على الفطر، والتردد فيه، والقيء عمداً، والاحتقان من الدبر، والحجامة حاجماً أو محجوماً، وإنزال المني بتكرار النظر، وخروج المني أو المذي بتقبيل أو لمس أو استمناء أو مباشرة دون الفرج، وكل ما وصل إلى الجوف أو الحلق أو الدماغ","m":0,"ex":"قسّمها مجموعات: أمور تطرأ على الصائم (الحيض والنفاس، والموت، والردة). ونية (العزم على الفطر، والتردد فيه). وخروج أو دخول (القيء عمداً، والحجامة، والاحتقان، وإنزال المني أو المذي بشهوة، وكل ما وصل إلى الجوف أو الحلق أو الدماغ).","w":["اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والاحتلام، والقيء غلبة، والحجامة، وإنزال المني بتكرار النظر","اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والعزم على الفطر، والقيء عمداً، والتفكر إذا أنزل، والفصد","اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والأكل ناسياً، والقيء عمداً، والحجامة، وإنزال المني بنظرة واحدة"],"ca":"اثنا عشر، منها: الحيض والنفاس، والموت، والردة، والعزم على الفطر، والقيء عمداً، والحجامة، وإنزال المني بتكرار النظر"},{"id":"s126","b":"الصيام والاعتكاف","q":"ما حكم من استخدم شيئاً من المفطرات ناسياً؟","a":"لا يفطر إن فعل شيئاً من جميع المفطرات ناسياً أو مكرهاً","m":0,"ex":"من فعل شيئاً من المفطرات وهو ناسٍ أو مكره فصومه صحيح؛ لأنه لم يقصد الفطر. والقاعدة عامة في كل المفطرات المعدودة. أما الجماع فليس منها، وله حكم خاص في بابه.","w":["يفطر إن فعل شيئاً من المفطرات ناسياً أو مكرهاً، وعليه القضاء","لا يفطر بالأكل والشرب ناسياً فقط، ويفطر بباقي المفطرات ولو ناسياً","لا يفطر إن فعل ناسياً، ويفطر إن كان مكرهاً"]},{"id":"s127","b":"الصيام والاعتكاف","q":"ماذا على من جامع في نهار رمضان وما هي كفارته؟","a":"القضاء والكفارة: عتق رقبة مؤمنة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكيناً، فإن لم يجد سقطت","m":0,"ex":"على المجامع أمران: قضاء اليوم، والكفارة. والكفارة مرتبة لا تخيير فيها: عتق رقبة، ثم صيام شهرين متتابعين، ثم إطعام ستين مسكي
