ويأكل مع الزوجة والمملوك والولد ولو طفلاً، ويلعق أصابعه، ويخلّل أسنانه","m":1,"ex":"هذه سنن الأكل: نظافة اليد، وذكر الله جهراً، والجلوس بأدب، والأكل باليمين بثلاث أصابع مما يليه، وتصغير اللقمة وإطالة مضغها، وعدم ترك طعام في الإناء أو ما سقط منه، وعدم النظر إلى الجليس، وإيثار المحتاج، والتواضع في الأكل مع الأهل.","ca":"غسل اليدين، والتسمية جهراً، والأكل باليمين بثلاث أصابع مما يليه، وتصغير اللقمة، وإطالة المضغ، ومسح الصحفة","mn":"قبل الأكل: غسل وتسمية وجلسة؛ أثناءه: يمين، ثلاث، مما يليه، لقمة صغيرة، مضغ طويل؛ بعده: مسح الصحفة، لعق الأصابع، تخليل","w":["التسمية سراً، والأكل بخمس أصابع، وتكبير اللقمة، والأكل من وسط الصحفة","غسل اليدين بعد الطعام فقط، والأكل متكئاً، ونفخ الطعام الحار","الأكل بالشمال، والأكل من أعلى الصحفة، والنظر إلى الجليس"]},{"id":"v11825","b":"النكاح وما يتبعه","q":"ما حكم ابتلاع ما أخرجه من بين أسنانه؟","a":"ما أخرجه بالخِلال يلقيه ويُكره أن يبتلعه، فإن قلعه بلسانه لم يُكره","m":1,"ex":"يُسنّ تخليل الأسنان بعد الأكل. فما خرج بعود الخلال ونحوه يُرمى ولا يُبلع، أما ما أخرجه بلسانه فلا بأس ببلعه.","w":["يحرم ابتلاعه مطلقاً سواء أخرجه بالخلال أو بلسانه","يُسنّ ابتلاعه مطلقاً","ما أخرجه بلسانه يُكره بلعه، وما أخرجه بالخلال لا يُكره"]},{"id":"v11843","b":"النكاح وما يتبعه","q":"ما مكروهات الأكل؟","a":"يُكره: نفخ الطعام، وكونه حارّاً، وأكله بأقل أو أكثر من ثلاث أصابع، أو بشماله، ومن أعلى الصحفة أو وسطها، ونفض يده في القصعة، وتقديم رأسه إليها عند وضع اللقمة في فمه، وكلامه بما يُستقذر، وأكله متكئاً أو مضطجعاً، وأكله كثيراً بحيث يؤذيه أو قليلاً بحيث يضره","m":1,"ex":"هذه أمور تخالف أدب الأكل أو تؤذي الآكل أو من معه: كالنفخ في الطعام، والأكل بالشمال، والأخذ من أعلى الطعام، ونفض اليد في الإناء، والكلام المستقذر، والاتكاء، والإفراط في الأكل أو التقليل المضر.","ca":"النفخ، والحار، وغير ثلاث أصابع، والشمال، وأعلى الصحفة، ونفض اليد، والكلام المستقذر، والاتكاء، والإفراط","w":["الأكل بثلاث أصابع، والأكل مما يليه، ولعق الأصابع، ومسح الصحفة","التسمية جهراً، وتصغير اللقمة، وإطالة المضغ","الأكل مع الزوجة والولد، وإيثار المحتاج، وتخليل الأسنان"]},{"id":"v11964","b":"النكاح وما يتبعه","q":"كيف يأكل ويشرب مع أبناء الدنيا، والفقراء، والعلماء، والإخوان؟","a":"مع أبناء الدنيا بالأدب والمروءة، ومع الفقراء بالإيثار، ومع العلماء بالتعلّم، ومع الإخوان بالانبساط والحديث الطيب والحكايات التي تليق بالحال","m":1,"ex":"يختلف أدب المجلس باختلاف من يأكل معهم: فمع أهل الدنيا يلتزم الأدب والمروءة، ومع الفقراء يقدّمهم على نفسه، ومع العلماء يتعلم منهم، ومع الإخوان يتبسّط ويتحدث بما يليق.","mn":"دنيا: أدب؛ فقراء: إيثار؛ علماء: تعلّم؛ إخوان: انبساط","w":["مع أبناء الدنيا بالإيثار، ومع الفقراء بالانبساط، ومع العلماء بالصمت، ومع الإخوان بالأدب","مع الجميع بالصمت وغض البصر","مع أبناء الدنيا بالانبساط، ومع الفقراء بالتعلم، ومع العلماء بالإيثار، ومع الإخوان بالمروءة"]},{"id":"v12061","b":"النكاح وما يتبعه","q":"ما الذي يُسنّ إذا فرغ من الطعام؟","a":"أن يحمد الله ويقول: الحمد لله الذي أطعمني هذا الطعام ورزقنيه من غير حولٍ مني ولا قوة، ويدعو لصاحب الطعام","m":1,"ex":"من سنن الفراغ من الأكل حمد الله بهذا الذكر، والدعاء لمن أطعمه.","w":["أن يقول: بسم الله أوله وآخره، ولا يدعو لأحد","أن يغسل يديه فقط، ولا يُشرع ذكر بعد الطعام","أن يقول: اللهم بارك لنا فيما رزقتنا وقنا عذاب النار، ويقوم فوراً"]},{"id":"v12101","b":"النكاح وما يتبعه","q":"ما حكم إعلان النكاح والضرب فيه بالدفّ؟","a":"يُسنّ إعلان النكاح، والضرب فيه بدفّ لا حِلَق فيه ولا صنوج للنساء، ويُكره للرجال","m":1,"ex":"إشهار النكاح سنة. ويُسنّ للنساء ضرب الدف الخالي من الحلق والصنوج (القطع المعدنية المصوّتة)، أما الرجال فيُكره لهم ذلك.","w":["يُكره إعلانه، ويحرم الضرب بالدف مطلقاً","يجب إعلانه، ويُسنّ الدف للرجال والنساء بكل أنواعه","يباح إعلانه، ويُسنّ الدف للرجال دون النساء"]},{"id":"v12173","b":"النكاح وما يتبعه","q":"ما شروط الخلع؟","a":"سبعة: أن يقع من زوج يصح طلاقه، وأن يكون على عِوَض ولو مجهولاً ممن يصح تبرعه، وأن يقع منجَّزاً، وأن يقع على جميع الزوجة، وألّا يقع حيلة لإسقاط يمين الطلاق، وألّا يقع بلفظ الطلاق بل بصيغته الموضوعة له، وألّا ينوي به الطلاق","m":1,"ex":"الخلع فراق الزوجة بعوض تدفعه هي أو غيرها. فلا يصح من مجنون أو صبي لا يصح طلاقه، ولا يصح معلّقاً على زمن أو فعل، ولا بلفظ الطلاق أو بنيّته، ولو عضلها ظلماً لتختلع لم يصح.","ca":"من زوج يصح طلاقه، على عوض، منجَّزاً، على جميع الزوجة، لا حيلة، لا بلفظ الطلاق، لا بنيته","mn":"زوج، عوض، منجّز، جميع، لا حيلة، لا لفظ طلاق، لا نية طلاق","w":["ثلاثة: رضا الزوجة، وحضور القاضي، ورد المهر كاملاً","خمسة: أن يقع بلفظ الطلاق، ومعلّقاً، وبلا عوض، وبنية الطلاق، ومن الولي","أربعة: أن يقع من الزوجة، وبحضرة شاهدين، وبلفظ الطلاق، وفي طهر لم يجامعها فيه"]},{"id":"v12243","b":"النكاح وما يتبعه","q":"إذا توفّرت شروط الخلع فما حكمه؟ وهل ينقص به عدد الطلاق؟","a":"كان فسخاً بائناً، لا ينقص به عدد الطلاق","m":1,"ex":"الخلع إذا استوفى شروطه فسخ لا طلاق، فتبين به الزوجة ولا رجعة له عليها إلا بعقد جديد، ولا يُحسب من الطلقات الثلاث.","w":["كان طلاقاً رجعياً، وينقص به عدد الطلاق","كان طلقة بائنة، وتُحسب من الثلاث","كان فسخاً رجعياً، وينقص به عدد الطلاق"]},{"id":"v12247","b":"النكاح وما يتبعه","q":"ما صيغ الخلع الصريحة والكناية؟","a":"الصريحة لا تحتاج إلى نية، وهي: خلعتُ، وفسختُ، وفاديتُ. والكناية: باريتُكِ، وأبرأتُكِ، وأبنتُكِ، ولا بد فيها من النية","m":1,"ex":"ألفاظ الخلع قسمان: صريح يقع به دون نية، وكناية تحتمل الخلع وغيره فلا يقع بها إلا مع النية أو ما يقوم مقامها.","ca":"الصريحة: خلعت، فسخت، فاديت؛ الكناية: باريتك، أبرأتك، أبنتك","w":["الصريحة: طلقتُ وسرّحتُ وفارقتُ؛ والكناية: خلعتُ وفسختُ","الصريحة: أبرأتُك وأبنتُك؛ والكناية: خلعتُ وفاديتُ","الصريحة: فسختُ فقط؛ والكناية: طلقتُ وخلعتُ"]},{"id":"v12307","b":"النكاح وما يتبعه","q":"ما شرط ثبوت تحريم الرضاع في النكاح وثبوت المحرمية؟","a":"أن يرتضع خمس رضعات في العامين؛ فيكون تحريم الرضاع في النكاح وثبوت المحرمية كالنسب","m":1,"ex":"الرضاع يحرّم ويثبت به المحرمية مثل النسب، بشرطين: أن تكون الرضعات خمساً، وأن تكون في الحولين. فلو ارتضع بقية الخمس بعد العامين بلحظة لم تثبت الحرمة.","ca":"خمس رضعات في العامين","w":["رضعة واحدة في أي عمر","ثلاث رضعات في العامين","عشر رضعات في السنة الأولى"]},{"id":"s167","b":"الصيد والذبائح","q":"ما هي شروط حل الصيد؟","a":"أربعة: كون الصائد أهلاً للذكاة، والآلة (محدد يجرح أو جارحة معلمة)، وقصد الفعل، وقول بسم الله عند الإرسال أو الرمي (ولا تسقط هنا سهواً)","m":1,"ex":"أربعة: الصائد (أهل للذكاة)، والآلة (محدد يجرح أو جارحة معلّمة)، والقصد، والتسمية عند الإرسال أو الرمي. والفرق المهم: التسمية في الذبح تسقط سهواً، أما في الصيد فلا تسقط ولو نسياناً.","w":["أربعة: كون الصائد أهلاً للذكاة، والآلة، وقصد الفعل، وقول بسم الله عند الإرسال (وتسقط هنا سهواً)","ثلاثة: كون الصائد مسلماً، والآلة، وقول بسم الله عند الأكل","أربعة: كون الصائد بالغاً، والآلة ولو قتلت بالصدم، وقصد الفعل، وقول بسم الله عند الإرسال"]},{"id":"s168","b":"الصيد والذبائح","q":"كيف يكون تعليم الجارحة (الكلب أو الطير) لكي يحل صيده؟","a":"الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل. والطير بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي","m":1,"ex":"الكلب والفهد يُعلَّمان بثلاثة: ينطلق إذا أُرسل، ويكفّ إذا زُجر، ولا يأكل مما أمسك. والطير بأمرين فقط: ينطلق إذا أُرسل، ويرجع إذا دُعي؛ فلا يشترط فيه ترك الأكل ولا الانزجار.","w":["الكلب والفهد بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي. والطير بثلاثة: يسترسل، وينزجر، ولا يأكل","الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، ويرجع إذا دعي. والطير بأمرين: يسترسل، ولا يأكل","الكلب والفهد والطير بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل"]},{"id":"v12627","b":"الصيد والذبائح","q":"من أدرك صيداً مجروحاً فيه حياة (متحركاً فوق حركة المذبوح) واتّسع الوقت لتذكيته، فما حكمه؟","a":"لم يُبَح إلا بالتذكية","m":1,"ex":"إذا أصاب الصيد ولم يمت فوراً، وأدركه حياً وكان عنده وقت لذبحه، وجب ذبحه، ولا تكفي الإصابة. أما إذا مات في الحال فيحلّ بالشروط الأربعة للصيد.","w":["يحل بالإصابة الأولى ولا يحتاج إلى ذبح","يُترك حتى يموت ثم يؤكل","يحرم أكله مطلقاً ولو ذبحه"]},{"id":"v12707","b":"الصيد والذبائح","q":"ما حكم الصيد إذا قتلته الآلة بصدمٍ أو خنقٍ دون أن تجرحه؟","a":"لم يُبَح؛ لأنه يشترط أن يجرح الصيد","m":1,"ex":"آلة الصيد نوعان: محدد يجرح كالسيف والسكين والسهم، وجارحة معلّمة ككلب وفهد وصقر. ويشترط في الحالين أن يجرح الصيد، فما مات بثقل الضربة أو بالخنق لا يحل.","w":["يحل مطلقاً إذا سمّى","يحل إن كانت الآلة جارحة معلّمة","يُكره أكله ولا يحرم"]},{"id":"v12866","b":"الصيد والذبائح","q":"ما المراد بشرط «قصد الفعل» في الصيد؟","a":"أن يرسل الآلة لقصد الصيد؛ فلو أرسلها لا لقصد الصيد، أو لقصده ولم يره، أو استرسل الجارح بنفسه فقتل صيداً، لم يحل","m":1,"ex":"قصد الفعل هو الشرط الثالث لحل الصيد. والصيد يباح لمن قصده، ويُكره إذا كان لهواً. فلا بد أن يرمي أو يرسل الجارحة قاصداً صيداً معيّناً رآه.","ca":"أن يرسل الآلة لقصد الصيد","w":["أن ينوي الأكل بعد الذبح فقط، ولو استرسل الجارح بنفسه","أن يقصد الرمي ولو لم يقصد الصيد","أن يكون الصائد مسلماً عاقلاً"]},{"id":"v12909","b":"الصيد والذبائح","q":"رجل رمى الصيد وسمّى، ثم توقّف عن الرمي، ثم عاد يرمي بعد مدة؛ فهل تكفيه التسمية الأولى؟","a":"لا تكفيه؛ بل يسمّي عند الرمي الجديد، لأن التسمية تكون عند إرسال الجارحة أو رمي السلاح، ولا تسقط في الصيد سهواً. أما الرمي المتوالي المتصل فتكفيه التسمية الأولى","m":1,"ex":"قول «بسم الله» هو الشرط الرابع لحل الصيد، ومحلّه عند الرمي أو الإرسال. وتختلف التسمية في الصيد عن الذبح، فلا تسقط هنا بالنسيان؛ فإن نسيها لم يحل الصيد.","ca":"يسمّي عند الرمي الجديد، ولا تسقط التسمية في الصيد سهواً","w":["تكفيه التسمية الأولى مهما طالت المدة","لا تشترط التسمية في الصيد أصلاً","تسقط التسمية في الصيد إذا نسيها"]},{"id":"s169","b":"الأيمان والنذور","q":"بم تنعقد اليمين؟","a":"بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته","m":1,"ex":"اليمين لا تنعقد إلا بالله: إما بلفظ الجلالة «والله»، أو باسم من أسمائه كالرحمن، أو بصفة من صفاته كعزة الله. ثلاثة: الذات، والاسم، والصفة. أما الحلف بمخلوق فحرام.","w":["بالله تعالى، أو بأحد أنبيائه، أو بكتبه","بالله تعالى فقط، دون أسمائه وصفاته","بكل معظم كالله تعالى، أو الكعبة، أو النبي"]},{"id":"s170","b":"الأيمان والنذور","q":"ما حكم الحلف بغير الله (كالكعبة والنبي)؟","a":"حرم، ولا كفارة","m":1,"ex":"الحلف بمخلوق كالأنبياء والأولياء والكعبة حرام، ولا كفارة فيه؛ فالكفارة إنما تكون في اليمين المنعقدة بالله أو أسمائه أو صفاته.","w":["يكره، ولا كفارة","حرم، وفيه كفارة يمين","مباح، وفيه كفارة إن حنث"]},{"id":"s171","b":"الأيمان والنذور","q":"ما هي شروط وجوب كفارة اليمين؟","a":"خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث","m":1,"ex":"خمسة: ثلاثة في الحالف (مكلف، مختار، قاصد لليمين)، فلا كفارة على مكره ولا على من جرت على لسانه بلا قصد. وواحد في المحلوف عليه: أن يكون أمراً مستقبلاً. والخامس: الحنث، أي مخالفة ما حلف عليه.","w":["خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر ماضٍ، والحنث","أربعة: كون الحالف مكلفاً، مختاراً، ولو غير قاصد لليمين، والحنث","خمسة: كون الحالف مكلفاً، ولو مكرهاً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث"]},{"id":"s172","b":"الأيمان والنذور","q":"ما هي كفارة اليمين؟","a":"على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو تحرير رقبة مؤمنة؛ فإن لم يجد صام ثلاثة أيام متتابعة","m":1,"ex":"الكفارة على مرحلتين: أولاً يختار واحداً من ثلاثة: إطعام عشرة مساكين، أو كسوتهم، أو عتق رقبة مؤمنة. فإن عجز عنها كلها انتقل إلى صيام ثلاثة أيام متتابعة. قارن: كفارة الجماع في رمضان مرتبة لا تخيير فيها.","w":["على الترتيب: عتق رقبة، فإن لم يجد فإطعام عشرة مساكين، فإن لم يجد فكسوتهم، ولا صيام فيها","على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو صيام ثلاثة أيام، أو تحرير رقبة","على التخيير: إطعام ستين مسكيناً، أو كسوتهم، أو تحرير رقبة؛ فإن لم يجد صام شهرين متتابعين"]},{"id":"s173","b":"الأيمان والنذور","q":"ما حكم النذر، وما شروطه ليصح؟","a":"مكروه، لا يأتي بخير ولا يرد قضاء. ولا يصح إلا بالقول، من مكلف مختار","m":1,"ex":"النذر مكروه؛ لأنه لا يجلب خيراً ولا يرد ما قُدّر. ولا ينعقد إلا باللفظ، من شخص مكلف مختار؛ فلا يصح بالنية وحدها، ولا من صبي أو مكره.","w":["مستحب، يتقرب به إلى الله. ولا يصح إلا بالقول، من مكلف مختار","مكروه، لا يأتي بخير ولا يرد قضاء. ويصح بالنية وحدها، ولو من صبي مميز","مباح، ويرد القضاء. ولا يصح إلا بالقول، من مسلم بالغ"]},{"id":"s174","b":"الأيمان والنذور","q":"اذكر أمثلة لأنواع النذر المنعقدة؟","a":"ستة: المطلق (كفارة يمين)، ونذر اللجاج والغضب (يخير بين الفعل وكفارة يمين)، والمباح (يخير أيضاً)، والمكروه (يسن أن يكفر ولا يفعله)، والمعصية (يحرم الوفاء ويكفر)، والتبرر (يجب الوفاء به)","m":1,"mn":"مُ لَ بَ كَ عَ تَ: مطلق، لجاج، مباح، مكروه، معصية، تبرر","ex":"ستة، وحكم كل واحد: المطلق فيه كفارة يمين. واللجاج والغضب والمباح يُخيّر فيهما بين الفعل والكفارة. والمكروه يسن أن يكفّر ولا يفعله. والمعصية يحرم الوفاء بها ويكفّر. والتبرر (الطاعة) يجب الوفاء به.","w":["ستة: المطلق، واللجاج والغضب، والمباح، والواجب، والمعصية، والتبرر","خمسة: المطلق، والمباح، والمكروه، والمعصية، والتبرر","ستة: المطلق، واللجاج والغضب، والمستحيل، والمكروه، والمعصية، والتبرر"],"ca":"ستة: المطلق، واللجاج والغضب، والمباح، والمكروه، والمعصية، والتبرر"},{"id":"v13062","b":"الأيمان والنذور","q":"إلى ماذا يُرجع في تفسير الأيمان؟ (بالترتيب)","a":"إلى نية الحالف، فإن لم ينوِ شيئاً رُجع إلى سبب اليمين وما هيّجها، فإن عُدمت النية والسبب رُجع إلى التعيين، فإن عُدم ذلك رُجع إلى ما تناوله الاسم، وهو ثلاثة: شرعي، فعرفي، فلغوي","m":1,"ex":"إذا اختُلف في معنى اليمين قُدّمت نية الحالف، ثم الشيء الذي دعاه إلى الحلف، ثم ما عيّنه بالإشارة، ثم معنى الاسم: الشرعي أولاً، ثم العرفي، ثم اللغوي.","ca":"النية، ثم السبب، ثم التعيين، ثم الاسم (شرعي، فعرفي، فلغوي)","mn":"نِيّة، سبب، تعيين، اسم","w":["إلى اللفظ اللغوي، ثم العرفي، ثم نية الحالف","إلى سبب اليمين، ثم نية الحالف، ثم العرف","إلى عرف البلد فقط"]}];
const EXAM=new Date('2026-10-06T00:00:00+03:00').getTime(), MIN=6e4, DAY=864e5;
const STEPS=['اشرح','اختر','من حفظك','اكتبها'];
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=ms=>ms<DAY?(ms<60*MIN?'بعد قليل':'اليوم'):(()=>{const d=Math.round(ms/DAY);return d===1?'يوم':d===2?'يومين':d+' أيام';})();

let tr=S.get('track',null), st={}, deck=[], sessionStart=0;
const key=()=> 'anki:'+tr;
const save=()=>S.set(key(),st);

function pick(){
  app.innerHTML=`<div class="pick"><h1>بطاقات الفقه</h1><p class="sub">أسئلة دورة الشيخ عبدالسلام الفيلكاوي</p>
    <button id="t-imam">إمام</button><button id="t-muadhin">مؤذن</button></div>`;
  app.querySelector('#t-imam').onclick=()=>{tr='imam';S.set('track',tr);load();};
  app.querySelector('#t-muadhin').onclick=()=>{tr='muadhin';S.set('track',tr);load();};
}
function load(){ if(!tr) return pick(); deck=CARDS.filter(c=>tr==='imam'||!c.m); st=S.get(key(),{}); home(); }

// حالة البطاقة: t = l (تتعلمها: step 0..3) | r (مراجعة: iv بالأيام، ease) — غير موجودة = جديدة
function counts(){
  const now=Date.now(); let n=0,l=0,r=0,d=0;
  for(const c of deck){const s=st[c.id]; if(!s) n++; else if(s.t==='l') l++; else if(s.due<=now) r++; else d++;}
  return {n,l,r,d};
}
function home(){
  const k=counts(), left=Math.max(0,Math.ceil((EXAM-Date.now())/DAY));
  app.innerHTML=`<div class="home"><h1>بطاقات الفقه · ${tr==='imam'?'إمام':'مؤذن'}</h1>
    <div class="stats"><div class="c-new"><b>${k.n}</b><span>جديدة</span></div><div class="c-learn"><b>${k.l}</b><span>تتعلمها</span></div>
      <div class="c-rev"><b>${k.r}</b><span>مراجعة اليوم</span></div><div class="c-done"><b>${k.d}</b><span>مؤجلة</span></div></div>
    <button class="big" id="go">${k.l+k.r+k.n?'ابدأ':'لا شيء الآن'}</button>
    <p class="note">باقي ${left} يوم على الاختبار. اختبر نفسك قدر ما تبي: اللي ما تعرفه يمر بالشرح ثم الاختيار ثم الحفظ ثم الكتابة، واللي تعرفه يتأجل.</p>
    <button class="link" id="sw">تغيير المسار</button></div>`;
  app.querySelector('#go').onclick=()=>{sessionStart=Date.now();next();};
  app.querySelector('#sw').onclick=()=>{tr=null;S.set('track',null);pick();};
}
// الترتيب: ما يتعلمه (حان وقته) ← المراجعة المستحقة ← الجديد
function queue(){
  const now=Date.now();
  const L=deck.filter(c=>st[c.id]?.t==='l'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const R=deck.filter(c=>st[c.id]?.t==='r'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const N=deck.filter(c=>!st[c.id]);
  return [...L,...R,...N];
}
function bar(){
  const k=counts(), m=Math.floor((Date.now()-sessionStart)/MIN);
  return `<div class="bar"><span class="cnt"><b style="color:var(--blue)">${k.n}</b><b style="color:var(--bad)">${k.l}</b><b style="color:var(--accent)">${k.r}</b></span><span>${m} دقيقة</span><button class="link" id="home">إنهاء</button></div>`;
}
function frame(c,tag,body){
  app.innerHTML=bar()+`<article class="card"><div class="tags"><span class="tag plain">${esc(c.b)}</span>${tag}</div>${body}</article>`;
  app.querySelector('#home').onclick=home;
}
function next(){
  const q=queue();
  if(!q.length){
    // لا شيء مستحق الآن؛ إن بقيت بطاقات تتعلمها بعد دقائق نعرض أقربها
    const soon=deck.filter(c=>st[c.id]?.t==='l').sort((a,b)=>st[a.id].due-st[b.id].due)[0];
    if(soon) return show(soon);
    return home();
  }
  show(q[0]);
}
function show(c){
  const s=st[c.id];
  if(!s) return flip(c,'<span class="tag new">جديدة</span>');
  if(s.t==='r') return flip(c,'<span class="tag">مراجعة</span>');
  [explain,mcq,recall,write][s.step](c);
}
// ضع البطاقة في مرحلة تعلّم، وتعود بعد دقائق (بعد بطاقات أخرى)
function learn(c,step,delay){ st[c.id]={t:'l',step,due:Date.now()+(delay??2*MIN),lapses:(st[c.id]?.lapses||0)}; save(); }
function graduate(c,iv){ const s=st[c.id]||{}; st[c.id]={t:'r',iv,ease:s.ease||2.5,due:Math.min(Date.now()+iv*DAY,EXAM-DAY/2),reps:(s.reps||0)+1}; save(); }

// بطاقة جديدة أو مراجعة: السؤال ← الجواب ← أزرار Anki
function flip(c,tag){
  frame(c,tag,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${c.n?`<div class="x">${esc(c.n)}</div>`:''}</div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div>`);
  app.querySelector('#show').onclick=()=>{
    app.querySelector('#ans').hidden=false;
    const s=st[c.id], iv=s?.iv||0, ease=s?.ease||2.5;
    const hard=s?Math.max(1,Math.round(iv*1.2)):1, good=s?Math.max(iv+1,Math.round(iv*ease)):1, easy=s?Math.max(good+1,Math.round(iv*ease*1.3)):3;
    app.querySelector('#acts').className='acts four';
    app.querySelector('#acts').innerHTML=`<button class="again" id="b0">ما عرفتها<small>أتعلّمها</small></button>
      <button class="hard" id="b1">صعبة<small>${fmt(hard*DAY)}</small></button>
      <button class="good" id="b2">عرفتها<small>${fmt(good*DAY)}</small></button>
      <button class="easy" id="b3">سهلة<small>${fmt(easy*DAY)}</small></button>`;
    app.querySelector('#b0').onclick=()=>{learn(c,0,0);next();};
    app.querySelector('#b1').onclick=()=>{graduate(c,hard);st[c.id].ease=Math.max(1.3,ease-.15);save();next();};
    app.querySelector('#b2').onclick=()=>{graduate(c,good);next();};
    app.querySelector('#b3').onclick=()=>{graduate(c,easy);st[c.id].ease=ease+.15;save();next();};
  };
}
const stepTag=i=>`<span class="tag s${i}">${i+1}/4 · ${STEPS[i]}</span>`;
// ١) الشرح
function explain(c){
  frame(c,stepTag(0),`<p class="q">${esc(c.q)}</p><div class="a">${esc(c.a)}</div>
    ${c.ex?`<div class="ex"><b>الشرح: </b>${esc(c.ex)}</div>`:''}${c.mn?`<div class="mn">للحفظ: ${esc(c.mn)}</div>`:''}${c.n?`<div class="x">${esc(c.n)}</div>`:''}
    <div class="acts"><button class="main" id="ok">فهمتها</button></div>`);
  app.querySelector('#ok').onclick=()=>{learn(c,1);next();};
}
// ٢) اختيار من متعدد
function mcq(c){
  if(!c.w||c.w.length<3){learn(c,2,0);return next();}
  const right=c.ca||c.a, opts=shuffle([right,...c.w]);
  frame(c,stepTag(1),`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===right;
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    app.querySelector('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'راجع الشرح مرة ثانية'}</button>`;
    app.querySelector('#nx').onclick=()=>{ ok?learn(c,2):learn(c,0,MIN); next(); };
  });
}
// ٣) من حفظك
function recall(c){
  frame(c,stepTag(2),`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div></div>
    <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
  app.querySelector('#show').onclick=()=>{
    app.querySelector('#ans').hidden=false;
    const a=app.querySelector('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`;
    a.querySelector('#no').onclick=()=>{learn(c,1,MIN);next();};
    a.querySelector('#yes').onclick=()=>{learn(c,3);next();};
  };
}
// ٤) اكتبها
const words=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').split(/[^ء-ي0-9]+/).filter(w=>w.length>2);
function write(c){
  frame(c,stepTag(3),`<p class="q">${esc(c.q)}</p><label for="w-${c.id}" class="x">اكتب الجواب من حفظك:</label><textarea id="w-${c.id}"></textarea>
    <div id="ans" hidden></div><div class="acts" id="acts"><button class="main" id="cmp">قارن بالجواب</button></div>`);
  app.querySelector('#cmp').onclick=()=>{
    const mine=new Set(words(app.querySelector('textarea').value)), need=[...new Set(words(c.a))];
    const hit=need.filter(w=>mine.has(w)).length, pct=need.length?Math.round(100*hit/need.length):0;
    const box=app.querySelector('#ans'); box.hidden=false;
    box.innerHTML=`<div class="a">${esc(c.a)}</div><p class="score">كلماتك طابقت ${pct}% من كلمات الجواب</p>`;
    const a=app.querySelector('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما كتبتها صح</button><button class="good" id="yes">كتبتها صح</button>`;
    a.querySelector('#no').onclick=()=>{learn(c,2,MIN);next();};
    a.querySelector('#yes').onclick=()=>{graduate(c,1);next();};
  };
}
load();
</script>
