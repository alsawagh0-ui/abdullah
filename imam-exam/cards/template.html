<title>بطاقات الفقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5A6660; --line:#DDE1DC;
  --accent:#145C49; --accent-ink:#FFFFFF; --soft:#E5EEEA; --bad:#A13A2C; --bad-soft:#F6E6E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
    --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
  --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{flex:1;display:grid;align-content:center;gap:14px}
.pick h1{margin:0 0 6px;font-size:1.5rem}
.pick button{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;text-align:right}
.pick button:hover{border-color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--ink)}
.bar .sw{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tag{align-self:flex-start;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.mn{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600;font-size:.95rem}
.fix{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);font-size:.9rem;line-height:1.8}
.fix b{color:var(--bad)}
.fix span{color:var(--muted)}
.pick .sub{margin:0 0 8px;color:var(--muted)}
.tag.again{background:var(--bad-soft);color:var(--bad)}
.q{font-size:1.28rem;font-weight:700;line-height:1.7;margin:0;text-wrap:pretty}
.a{border-top:1px solid var(--line);padding-top:14px;font-family:"Noto Naskh Arabic",serif;font-size:1.18rem;line-height:2;white-space:pre-line}
.x{font-size:.95rem;color:var(--muted);line-height:1.9;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.acts button{padding:16px;border-radius:10px;font-size:1.1rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.acts .show{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts .no{color:var(--bad);border-color:var(--bad)}
.acts .yes{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.done{flex:1;display:grid;align-content:center;gap:10px;text-align:center}
.done h2{margin:0;font-size:1.4rem}
.done p{margin:0;color:var(--muted);line-height:1.8}
.done button{justify-self:center;padding:12px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const CARDS=/*CARDS*/[];
const EXAM=new Date('2026-10-06T00:00:00+03:00').getTime(), DAY=864e5, GAPS=[1,2,4];
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

function pick(){
  app.innerHTML=`<div class="pick"><h1>بطاقات الفقه</h1><p class="sub">أسئلة دورة الشيخ عبدالسلام الفيلكاوي، مطابقة على دليل الطالب</p>
    <button id="t-imam">إمام</button><button id="t-muadhin">مؤذن</button></div>`;
  app.querySelector('#t-imam').onclick=()=>{S.set('track','imam');run();};
  app.querySelector('#t-muadhin').onclick=()=>{S.set('track','muadhin');run();};
}

function run(){
  const tr=S.get('track',null); if(!tr) return pick();
  const deck=CARDS.filter(c=>tr==='imam'||!c.m);
  const key='st:'+tr, st=S.get(key,{});
  const daysLeft=Math.max(1,Math.ceil((EXAM-Date.now())/DAY)-1), learnDays=Math.max(1,daysLeft-3);
  // حصة اليوم من الجديد: ما بقي مقسوماً على الأيام الباقية (تُحسب مرة في اليوم)
  let day=S.get('day:'+tr,{});
  if(day.d!==today()){
    const unseen=deck.filter(c=>!st[c.id]).length;
    day={d:today(),quota:Math.ceil(unseen/learnDays),newDone:0,revDone:0};
    S.set('day:'+tr,day);
  }
  const now=Date.now();
  const due=deck.filter(c=>st[c.id]&&st[c.id].due<=now);
  const fresh=deck.filter(c=>!st[c.id]).slice(0,Math.max(0,day.quota-day.newDone));
  let q=[...due,...fresh];
  const known=deck.filter(c=>st[c.id]&&st[c.id].box>=1).length;

  function head(){
    const got=day.newDone+day.revDone;
    return `<div class="bar"><span>اليوم <b>${got}</b> / ${got+q.length} · باقي ${daysLeft} يوم</span><span>ثبّتّ <b>${known}</b> / ${deck.length}</span><button class="sw" id="sw">${tr==='imam'?'إمام':'مؤذن'} ↺</button></div>
      <div class="prog"><i style="width:${Math.round(100*known/deck.length)}%"></i></div>`;
  }
  function bind(){const b=app.querySelector('#sw'); if(b) b.onclick=()=>{S.set('track',null);pick();};}

  function show(){
    if(!q.length){
      app.innerHTML=head()+`<div class="done"><h2>خلّصت بطاقات اليوم</h2>
        <p>ثبّتّ ${known} من ${deck.length}. ارجع بكرة، البطاقات اللي حان وقتها بتنتظرك.</p>
        <button id="more">زيدني ${Math.min(20,deck.filter(c=>!st[c.id]).length)} بطاقة جديدة</button></div>`;
      bind();
      const m=app.querySelector('#more'); if(m) m.onclick=()=>{day.quota+=20;S.set('day:'+tr,day);run();};
      return;
    }
    const c=q[0], s=st[c.id];
    app.innerHTML=head()+`<article class="card">
      <div class="tags"><span class="tag plain">${esc(c.b)}</span>${s?(s.box===0?'<span class="tag again">غلطت فيها قبل</span>':'<span class="tag">مراجعة</span>'):''}</div>
      <p class="q">${esc(c.q)}</p>
      <div id="ans" hidden><div class="a">${esc(c.a)}</div>${c.mn?`<div class="mn">للحفظ: ${esc(c.mn)}</div>`:''}${c.st==='fix'?`<div class="fix"><b>صُحّح من دليل الطالب${c.p?' (ص '+c.p+')':''}:</b> ${esc(c.w)}<br><span>جواب الدورة كان: ${esc(c.o)}</span></div>`:''}${c.st==='nb'?`<div class="fix nb"><b>غير مذكور في دليل الطالب</b>، وهذا جواب الدورة: ${esc(c.w||'')}</div>`:''}${c.n?`<div class="x">${esc(c.n)}</div>`:''}</div>
      <div class="acts" id="acts"><button class="show" id="show">اكشف الجواب</button></div>
    </article>`;
    bind();
    app.querySelector('#show').onclick=()=>{
      app.querySelector('#ans').hidden=false;
      app.querySelector('#acts').innerHTML=`<button class="no" id="no">غلطت</button><button class="yes" id="yes">عرفته</button>`;
      app.querySelector('#no').onclick=()=>grade(false);
      app.querySelector('#yes').onclick=()=>grade(true);
    };
  }
  function grade(ok){
    const c=q.shift(), s=st[c.id]||{box:-1}, wasNew=!st[c.id];
    if(ok){ s.box=Math.min(s.box+1,GAPS.length-1); s.due=Math.min(Date.now()+GAPS[s.box]*DAY, EXAM-DAY); }
    else { s.box=0; s.due=Date.now(); q.splice(Math.min(3,q.length),0,c); }
    st[c.id]=s; S.set(key,st);
    if(ok||wasNew){ if(wasNew) day.newDone++; else day.revDone++; S.set('day:'+tr,day); }
    show();
  }
  show();
}
run();
</script>
