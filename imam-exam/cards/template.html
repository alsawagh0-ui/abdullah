<title>بطاقات الاختبار</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5A6660; --line:#DDE1DC;
  --accent:#145C49; --accent-ink:#FFFFFF; --soft:#E5EEEA; --bad:#A13A2C; --bad-soft:#F6E6E3;
  --warn:#8A5A12; --warn-soft:#F5EDDD; --blue:#2A5B8C; --blue-soft:#E4ECF4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
    --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
    --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
  --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
  --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{flex:1;display:grid;align-content:center;gap:14px}
.pick h1{margin:0;font-size:1.5rem}
.pick .sub{margin:0 0 8px;color:var(--muted)}
.pick button{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;text-align:right}
.pick button:hover{border-color:var(--accent)}
.home{flex:1;display:grid;align-content:center;gap:18px}
.home h1{margin:0;font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats div{display:grid;gap:2px;padding:14px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.c-new b{color:var(--blue)} .c-learn b{color:var(--bad)} .c-rev b{color:var(--accent)} .c-done b{color:var(--muted)}
.big{padding:18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.25rem;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.note{margin:0;color:var(--muted);font-size:.9rem;line-height:1.8;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .cnt{display:flex;gap:10px}
.bar .cnt b{font-weight:700}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.s0{background:var(--warn-soft);color:var(--warn)} .tag.s1,.tag.s2,.tag.s3{background:var(--bad-soft);color:var(--bad)}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.q{font-size:1.28rem;font-weight:700;line-height:1.7;margin:0;text-wrap:pretty}
.a{border-top:1px solid var(--line);padding-top:14px;font-family:"Noto Naskh Arabic",serif;font-size:1.18rem;line-height:2;white-space:pre-line}
.ex{padding:12px 14px;border-radius:10px;background:var(--warn-soft);line-height:1.9}
.ex b{color:var(--warn)}
.mn{padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600;font-size:.95rem}
.x{font-size:.9rem;color:var(--muted);line-height:1.8}
.opts{display:grid;gap:8px}
.opt{text-align:right;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.8}
.opt.right{border-color:var(--accent);background:var(--soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:120px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.8;resize:vertical}
.score{font-weight:700}
.acts{display:grid;gap:8px;margin-top:auto}
.acts.two{grid-template-columns:1fr 1fr}
.acts.four{grid-template-columns:repeat(4,1fr)}
.acts button{padding:12px 6px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;gap:2px}
.acts button small{font-weight:400;font-size:.72rem;color:var(--muted)}
.acts .main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem;padding:15px}
.acts .again{color:var(--bad);border-color:var(--bad)}
.acts .hard{color:var(--warn);border-color:var(--warn)}
.acts .good{color:var(--accent);border-color:var(--accent)}
.acts .easy{color:var(--blue);border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem;display:inline-flex;gap:6px;align-items:baseline}
.chips button small{color:var(--muted);font-variant-numeric:tabular-nums}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button.on small{color:var(--accent-ink);opacity:.8}
.big.alt{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);font-size:1.1rem;padding:15px}
.lbl{margin:0;font-size:.85rem;font-weight:600;color:var(--muted)}
.sync{margin:0;font-size:.78rem;color:var(--muted);text-align:center}
@media (max-width:380px){.acts.four{grid-template-columns:1fr 1fr}}
.card{font-size:calc(1rem*var(--fs,1))}
.q{font-size:1.28em!important} .a{font-size:1.18em!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fsz{display:flex;gap:4px}
.fsz button,.ibtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:700}
.banner{padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:600;line-height:1.7}
.banner.ok{background:var(--soft);color:var(--accent)}
.goal{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.goal b{color:var(--ink)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chaps{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.chaps button{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:right}
.chaps button.on{background:var(--soft)}
.chaps button span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chaps small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem;min-width:52px;text-align:left}
.chaps .ms{color:var(--accent);font-weight:700}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{padding:13px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-align:right;display:grid;gap:2px;line-height:1.4}
.tools button small{font-weight:400;color:var(--muted);font-size:.76rem}
.pred{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pred b{font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.pred span{color:var(--muted);font-size:.85rem}
.page{display:grid;gap:12px;align-content:start}
.page h1{margin:0;font-size:1.3rem}
.back{justify-self:start}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.row .rq{font-weight:700;line-height:1.7}
.row .ra{font-family:"Noto Naskh Arabic",serif;line-height:1.9;border-top:1px dashed var(--line);padding-top:8px;white-space:pre-line}
.row .rt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.row .rt button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:7px;padding:3px 9px;font-size:.8rem}
.row .rt .badb{color:var(--bad)}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--muted);font-weight:600}
.set{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.set label{display:flex;gap:10px;align-items:center;font-weight:600}
.tfbox{padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);font-family:"Noto Naskh Arabic",serif;font-size:1.12em;line-height:1.9}
.swipehint{text-align:center;font-size:.78rem;color:var(--muted);margin:0}
.mapg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.mapg div{border-radius:10px;padding:12px;color:#fff;display:grid;gap:2px}
.mapg b{font-size:.92rem} .mapg small{opacity:.9;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.spark div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.spark i{width:100%;border-radius:4px 4px 0 0;display:block} .spark small{font-size:.7rem;color:var(--muted)}
.why{padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:var(--ink);line-height:1.8;font-size:.95em}
.why b{color:var(--blue)}
.trap{padding:10px 12px;border-radius:10px;background:var(--bad-soft);line-height:1.8;font-size:.95em}
.trap b{color:var(--bad)}
.node{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.node>span{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.node ul{margin:4px 0 0;padding-inline-start:18px;line-height:1.9}
.pg{font-size:.72rem;color:var(--muted);font-weight:400}
.rule{padding:12px 14px;border-radius:10px;border-inline-start:4px solid var(--accent);background:var(--soft);font-weight:600;line-height:1.8}
.story{position:relative;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 22px;overflow:hidden}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:var(--accent)}
.segs i.done b{width:100%}
.segs i.now b{animation:seg var(--dur,7s) linear forwards}
.story.paused .segs i.now b{animation-play-state:paused}
@keyframes seg{to{width:100%}}
.story .num{font-size:.8rem;font-weight:700;color:var(--muted)}
.story .hd{font-family:"Noto Naskh Arabic",serif;font-size:1.55em;line-height:1.8;font-weight:600;text-wrap:balance}
.story .who{display:grid;gap:8px}
.story .who div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.story .who span{font-size:.8rem;color:var(--muted);min-width:52px}
.story .who b{font-size:1.15em}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.95em}
.pill.both{background:var(--soft);color:var(--accent)} .pill.bk{background:var(--blue-soft);color:var(--blue)} .pill.ms{background:var(--warn-soft);color:var(--warn)} .pill.ot{background:var(--bad-soft);color:var(--bad)}
.story ul{margin:0;padding-inline-start:20px;display:grid;gap:10px;line-height:1.9;font-size:1.08em}
.story .mnb{padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--accent);font-weight:700;line-height:1.8}
.story .tap{position:absolute;top:60px;bottom:90px;width:35%;z-index:1}
.story .tap.l{left:0} .story .tap.r{right:0}
.story .ctl{margin-top:auto;display:flex;gap:8px;justify-content:space-between;align-items:center;position:relative;z-index:2}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cgrid button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right;display:grid;gap:4px;line-height:1.5}
.cgrid button b{color:var(--accent);font-size:.8rem}
.cgrid button.seen{border-color:var(--accent);background:var(--soft)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins button{padding:16px 8px;border-radius:12px;font-weight:700;font-size:1.05rem;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match div{display:grid;gap:8px;align-content:start}
.match button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right;line-height:1.5;min-height:52px}
.match button.sel{border-color:var(--accent);background:var(--soft)}
.match button.ok{opacity:.35;border-color:var(--accent)}
.match button.no{border-color:var(--bad);background:var(--bad-soft)}
.home.simple{align-content:start;gap:16px;padding-top:8px}
.today{display:grid;justify-items:center;gap:2px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.today b{font-size:3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.today span{color:var(--muted)}
.menu{display:grid;gap:10px}
.menu button{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:right;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.menu button span{grid-row:1/3;font-size:1.6rem;text-align:center}
.menu button b{font-size:1.1rem} .menu button small{color:var(--muted)}
.mpts{margin:0;padding-inline-start:22px;display:grid;gap:6px;font-family:"Noto Naskh Arabic",serif;font-size:1.12em;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
.big.small{font-size:1rem;padding:13px}
</style>

<div class="wrap" id="app"></div>

<script>
const CARDS=/*CARDS*/[];
const CONTENT=/*CONTENT*/[];
const MARKS=/*MARKS*/{};
const CLIPS=/*CLIPS*/[];
const MUFID=/*MUFID*/[];
const SUBJ={fiqh:'الفقه',hadith:'الحديث',aqeedah:'العقيدة',nahw:'النحو',tajweed:'التجويد',tafsir:'التفسير',mithaq:'ميثاق المسجد'};
const EXAM=new Date('2026-10-06T00:00:00+03:00').getTime(), MIN=6e4, DAY=864e5;
const STEPS=['اشرح','اختر','من حفظك','اكتبها'];
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=ms=>ms<DAY?(ms<60*MIN?'بعد قليل':'اليوم'):(()=>{const d=Math.round(ms/DAY);return d===1?'يوم':d===2?'يومين':d+' أيام';})();
const fmtIn=ms=>ms<60*MIN?Math.max(1,Math.round(ms/MIN))+' دقيقة':ms<DAY?Math.round(ms/36e5)+' ساعة':fmt(ms);
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const $=q=>app.querySelector(q), $$=q=>app.querySelectorAll(q);
const on=(q,f)=>{const e=$(q); if(e) e.onclick=f;};

let tr=S.get('track',null), st={}, X={}, deck=[], sessionStart=0;
const key=()=> 'anki:'+tr, xkey=()=> 'x:'+tr;
const blankX=()=>({star:{},mute:{},log:{},exams:[],mastered:{},u:0});
const save=()=>{S.set(key(),st);push();};
const saveX=()=>{X.u=Date.now();S.set(xkey(),X);push();};

// ===== المزامنة مع حسابك =====
let rdoc=null, rtr=null, rbusy=false, rdirty=false, rtimer=0, synced=false;
async function syncInit(){
  try{
    if(!window.claude||!claude.use||!tr) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    rtr=tr; rdoc=db.doc('data/users/'+uid+'/anki-'+tr);
    const snap=await rdoc.get(), d=(snap.exists&&snap.data())||{}, remote=d.st||{}, rx=d.x;
    let changed=false, needPush=false;
    for(const [id,r] of Object.entries(remote)){ const l=st[id]; if(!l||(r.u||0)>(l.u||0)){st[id]=r;changed=true;} }
    for(const [id,l] of Object.entries(st)){ const r=remote[id]; if(!r||(l.u||0)>(r.u||0)) needPush=true; }
    if(rx&&(rx.u||0)>(X.u||0)){X=Object.assign(blankX(),rx);changed=true;} else if((X.u||0)>((rx&&rx.u)||0)) needPush=true;
    synced=snap.exists; S.set(key(),st); S.set(xkey(),X);
    if(needPush||!snap.exists) push(true);
    if(changed&&$('.home')) home(); else { const e=$('.sync'); if(e) e.textContent=syncTxt(); }
  }catch(e){}
}
function push(now){
  if(!rdoc||rtr!==tr) return; rdirty=true; clearTimeout(rtimer);
  rtimer=setTimeout(async()=>{ if(rbusy) return; rbusy=true;
    while(rdirty){ rdirty=false; try{ await rdoc.set({st:JSON.parse(JSON.stringify(st)),x:JSON.parse(JSON.stringify(X))}); if(!synced){synced=true; const e=$('.sync'); if(e) e.textContent=syncTxt();} }catch(e){ rdoc=null; synced=false; break; } }
    rbusy=false; }, now?0:1500);
}
const syncTxt=()=>synced?'تقدمك محفوظ في حسابك ✓':'تقدمك محفوظ على هذا الجهاز';

// ===== الإعدادات =====
const lim=()=>S.get('lim','auto');
const PASS=80, FINAL=3;
const daysLeft=()=>Math.max(0,Math.ceil((EXAM-Date.now())/DAY));
const newToday=()=>X.log[dkey()]?.nw||0;
function plan(){ // كم بطاقة جديدة اليوم حتى تخلص كل شي قبل آخر 3 أيام
  const rem=deck.filter(c=>!muted(c)&&!st[c.id]).length, dl=daysLeft(), studyDays=dl-FINAL;
  if(studyDays<=0) return {today:0,left:0,rem,final:true};
  const today=Math.ceil((rem+newToday())/studyDays);
  return {today,left:Math.max(0,today-newToday()),rem,final:false};
}
const newLeft=()=>lim()==='auto'?plan().left:Math.max(0,lim()-sessNew);
const limTxt=()=>lim()==='auto'?plan().today:lim();
const goal=()=>S.get('goal',40);
const skipW=()=>S.get('skipW',false);
const fs=()=>S.get('fs',1);
const applyFs=()=>document.documentElement.style.setProperty('--fs',fs());
const chap=()=>S.get('ch:'+tr,'');
const flt=()=>S.get('flt:'+tr,'all');
// بطاقات الأرقام: جوابها فيه عدد

let lastAct=0;
function tick(ok){
  const k=dkey(), L=X.log[k]||(X.log[k]={n:0,ok:0,bad:0,sec:0}), now=Date.now();
  L.n++; if(ok===true) L.ok++; if(ok===false) L.bad++;
  if(lastAct) L.sec+=Math.round(Math.min(60e3,now-lastAct)/1000); lastAct=now;
  const ks=Object.keys(X.log).sort(); while(ks.length>40) delete X.log[ks.shift()];
  saveX();
}
function streak(){
  let n=0, t=Date.now(); const g=goal();
  if(!((X.log[dkey(t)]?.n||0)>=g)) t-=DAY; // اليوم ما اكتمل بعد: نحسب من أمس
  while((X.log[dkey(t)]?.n||0)>=g){n++;t-=DAY;}
  return n;
}
function miss(c){ const s=st[c.id]; if(s){s.bad=(s.bad||0)+1; s.u=Date.now();} save(); tick(false); }

// ===== توقع الدرجة =====
// من 100 بحسب درجات المقرر؛ المادة اللي ما لها بطاقات (التفسير) تُحسب 50%
function predict(){
  const M=marks(); let v=0, tot=0;
  for(const k in M){ tot+=M[k]; const cs=deck.filter(c=>c.s===k); v+=M[k]*(cs.length?cs.reduce((a,c)=>a+cardP(c),0)/cs.length:.5); }
  v=100*v/(tot||1);
  const last=X.exams.filter(e=>e.k==='شامل'&&(e.done??e.total)>=35).pop();
  if(last) v=(v+100*last.score/last.total)/2;
  return Math.round(v);
}

const cardP=c=>{ const s=st[c.id]; let p; if(muted(c)) p=.95; else if(!s) p=.15; else if(s.t==='l') p=.45+(s.step||0)*.05; else p=(s.iv||0)>=3?.92:.82; return Math.max(.1,p-Math.min(.3,(s?.bad||0)*.03)); };
function passBox(){
  const v=predict(), gain=.67*100/Math.max(1,deck.length), need=Math.max(0,Math.ceil((PASS-v)/gain));
  const pct=Math.min(100,v);
  return `<div class="set"><div class="topline"><span class="lbl" style="margin:0">عداد النجاح</span><span><b style="font-size:1.4rem;color:var(${v>=PASS?'--accent':'--ink'})">${v}</b> <span class="x">من 100 · النجاح ${PASS}</span></span></div>
    <div class="meter" style="position:relative;height:10px"><i style="width:${pct}%;background:var(${v>=PASS?'--accent':'--warn'})"></i><b style="position:absolute;top:-3px;bottom:-3px;inset-inline-start:80%;width:2px;background:var(--ink)"></b></div>
    <p class="x" style="margin:0">${v>=PASS?'أنت فوق خط النجاح تقريباً ✓ ثبّت اللي عندك.':`باقي لك تقريباً <b>${PASS-v}</b> درجة، يعني تقريباً <b>${need}</b> بطاقة تتقنها.`}</p></div>`;
}
function mapGrid(){
  return `<div class="mapg">${[...new Set(deck.map(c=>c.b))].map(b=>{const cs=deck.filter(c=>c.b===b), p=cs.reduce((a,c)=>a+cardP(c),0)/cs.length, t=Math.max(0,Math.min(1,(p-.15)/.77)), h=Math.round(t*130);
    return `<div style="background:hsl(${h} 55% 42%)"><b>${esc(b)}</b><small>${Math.round(100*t)}%${X.mastered[b]?' ✓':''}</small></div>`;}).join('')}</div>`;
}

function counts(P=pool()){
  const now=Date.now(); let n=0,l=0,r=0,d=0;
  for(const c of P){const s=st[c.id]; if(!s) n++; else if(s.t==='l') l++; else if(s.due<=now) r++; else d++;}
  return {n,l,r,d};
}
const EOD=()=>{const d=new Date(); d.setHours(23,59,59,999); return d.getTime();};
function dueInfo(){

  return {due,nextT};
}

const U=[];

// ===== خلط الأبواب: الجديد يجيك من كل باب على قد حجمه =====
const mix=()=>S.get('mix',true);
function mixNew(N){
  if(!mix()||chap()) return N;
  if(!sub()){ // وزن المواد بدرجاتها: المادة الأقل إنجازاً نسبةً لوزنها تتقدم
    const M=marks(), size={}, got={}, by={};
    for(const c of deck){ size[c.s]=(size[c.s]||0)+1; if(st[c.id]||muted(c)) got[c.s]=(got[c.s]||0)+1; }
    for(const c of mixChap(N)) (by[c.s]=by[c.s]||[]).push(c);
    const out=[]; let left=N.length;
    while(left){ let best=null,bv=Infinity; for(const k in by){ if(!by[k].length) continue; const v=((got[k]||0)/size[k])/Math.sqrt((M[k]||5)/60); if(v<bv){bv=v;best=k;} }
      out.push(by[best].shift()); got[best]=(got[best]||0)+1; left--; }
    return out;
  }
  return mixChap(N);
}
function mixChap(N){
  const by={}, size={}, got={};
  for(const c of deck){ size[c.b]=(size[c.b]||0)+1; if(st[c.id]||muted(c)) got[c.b]=(got[c.b]||0)+1; }
  for(const c of N) (by[c.b]=by[c.b]||[]).push(c);
  const out=[]; let left=N.length;
  while(left){ let best=null,bv=Infinity; for(const b in by){ if(!by[b].length) continue; const v=(got[b]||0)/size[b]; if(v<bv){bv=v;best=b;} }
    out.push(by[best].shift()); got[best]=(got[best]||0)+1; left--; }
  return out;
}
// ===== الفهم قبل الحفظ =====
const cOf=b=>CONTENT.find(x=>x.b===b);
const trapsOf=c=>{const k=cOf(c.b); return k?k.traps.filter(t=>t.card===c.id):[];};
const pgTxt=p=>p>8?` <span class="pg">(دليل الطالب ص${p})</span>`:'';
function extras(c){

}
// ===== الجلسة (Anki) =====
function queue(){
  const now=Date.now(), P=pool();
  const L=P.filter(c=>st[c.id]?.t==='l'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const R=P.filter(c=>st[c.id]?.t==='r'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const N=newLeft()>0?mixNew(P.filter(c=>!st[c.id])):[];
  return [...L,...R,...N];
}
function bar(){

}
function frame(c,tag,body,barHtml){
  SW=null;
  app.innerHTML=(barHtml||bar())+`<article class="card"><div class="tags"><span class="tag plain">${esc(tagOf(c))}</span>${tag}${cardTools(c)}</div>${body}</article>`;
  on('#home',home); on('#undo',undo);
  const am=AM; AM=null; wireTools(am||next);
}
let AM=null; // ماذا يحدث بعد «أعرفها أكيد» في الوضع الحالي
function next(){
  const q=queue();
  if(!q.length){
    const soon=pool().filter(c=>st[c.id]?.t==='l').sort((a,b)=>st[a.id].due-st[b.id].due)[0];
    if(soon) return show(soon);
    return home();
  }
  show(q[0]);
}
function show(c){
  const s=st[c.id];
  if(!s) return flip(c,'<span class="tag new">جديدة'+(lim()==='auto'?' · خطة اليوم '+(newToday()+1)+'/'+limTxt():' '+(sessNew+1)+'/'+lim())+'</span>',true);
  if(s.t==='r') return flip(c,'<span class="tag">مراجعة</span>');
  [explain,mcq,recall,write][s.step](c);
}
function learn(c,step,delay){ const o=st[c.id]||{}; st[c.id]={t:'l',step,due:Date.now()+(delay??2*MIN),lapses:(o.lapses||0),bad:o.bad||0,u:Date.now()}; save(); }
function graduate(c,iv){ const s=st[c.id]||{}; st[c.id]={t:'r',iv,ease:s.ease||2.5,due:Math.min(Date.now()+iv*DAY,EXAM-DAY/2),reps:(s.reps||0)+1,bad:s.bad||0,u:Date.now()}; save(); }
const sAct=(c,isNew)=>snap(c,()=>{ if(isNew){ sessNew=Math.max(0,sessNew-1); const L=X.log[dkey()]; if(L&&L.nw) {L.nw--; saveX();} } show(c); });

function flip(c,tag,isNew){
  frame(c,tag,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${c.n?`<div class="x">${esc(c.n)}</div>`:''}${extras(c)}</div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div>`);
  on('#show',()=>{
    $('#ans').hidden=false; if(isNew){ sessNew++; const L=X.log[dkey()]||(X.log[dkey()]={n:0,ok:0,bad:0,sec:0}); L.nw=(L.nw||0)+1; saveX(); }
    const s=st[c.id], iv=s?.iv||0, ease=s?.ease||2.5;
    const hard=s?Math.max(1,Math.round(iv*1.2)):1, good=s?Math.max(iv+1,Math.round(iv*ease)):1, easy=s?Math.max(good+1,Math.round(iv*ease*1.3)):3;
    $('#acts').className='acts four';
    $('#acts').innerHTML=`<button class="again" id="b0">ما عرفتها<small>أتعلّمها</small></button>
      <button class="hard" id="b1">صعبة<small>${fmt(hard*DAY)}</small></button>
      <button class="good" id="b2">عرفتها<small>${fmt(good*DAY)}</small></button>
      <button class="easy" id="b3">سهلة<small>${fmt(easy*DAY)}</small></button>`+swipeHint;
    const no=()=>{sAct(c,isNew);learn(c,0,0);miss(c);next();};
    const yes=()=>{sAct(c,isNew);graduate(c,good);tick(true);next();};
    on('#b0',no);
    on('#b1',()=>{sAct(c,isNew);graduate(c,hard);st[c.id].ease=Math.max(1.3,ease-.15);save();tick(true);next();});
    on('#b2',yes);
    on('#b3',()=>{sAct(c,isNew);graduate(c,easy);st[c.id].ease=ease+.15;save();tick(true);next();});
    SW={yes,no};
  });
}
const stepTag=i=>`<span class="tag s${i}">${i+1}/${skipW()?3:4} · ${STEPS[i]}</span>`;
function explain(c){
  frame(c,stepTag(0),`<p class="q">${esc(c.q)}</p><div class="a">${esc(c.a)}</div>
    ${c.ex?`<div class="ex"><b>الشرح: </b>${esc(c.ex)}</div>`:''}${extras(c)}${c.mn?`<div class="mn">للحفظ: ${esc(c.mn)}</div>`:''}${c.n?`<div class="x">${esc(c.n)}</div>`:''}
    <div class="acts"><button class="main" id="ok">فهمتها</button></div>`);
  on('#ok',()=>{sAct(c);learn(c,1);tick(null);next();});
}
function mcq(c){
  if(!c.w||c.w.length<3){learn(c,2,0);return next();}
  const right=c.ca||c.a, opts=shuffle([right,...c.w]);
  frame(c,stepTag(1),`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
  $$('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===right;
    $$('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    $('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'راجع الشرح مرة ثانية'}</button>`;
    on('#nx',()=>{ sAct(c); if(ok){learn(c,2);tick(true);} else {learn(c,0,MIN);miss(c);} next(); });
  });
}
function recall(c){
  frame(c,stepTag(2),`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${extras(c)}</div>
    <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
  on('#show',()=>{
    $('#ans').hidden=false;
    const a=$('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`+swipeHint;
    const no=()=>{sAct(c);learn(c,1,MIN);miss(c);next();};
    const yes=()=>{sAct(c); if(skipW()) graduate(c,1); else learn(c,3); tick(true); next();};
    on('#no',no); on('#yes',yes); SW={yes,no};
  });
}
const words=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').split(/[^ء-ي0-9]+/).filter(w=>w.length>2);
function write(c){
  if(skipW()){ graduate(c,1); return next(); }
  frame(c,stepTag(3),`<p class="q">${esc(c.q)}</p><label for="w-${c.id}" class="x">اكتب الجواب من حفظك:</label><textarea id="w-${c.id}"></textarea>
    <div id="ans" hidden></div><div class="acts" id="acts"><button class="main" id="cmp">قارن بالجواب</button></div>`);
  on('#cmp',()=>{
    const mine=new Set(words($('textarea').value)), need=[...new Set(words(c.a))];
    const hit=need.filter(w=>mine.has(w)).length, pct=need.length?Math.round(100*hit/need.length):0;
    const box=$('#ans'); box.hidden=false;
    box.innerHTML=`<div class="a">${esc(c.a)}</div><p class="score">كلماتك طابقت ${pct}% من كلمات الجواب</p>`;
    const a=$('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما كتبتها صح</button><button class="good" id="yes">كتبتها صح</button>`;
    on('#no',()=>{sAct(c);learn(c,2,MIN);miss(c);next();});
    on('#yes',()=>{sAct(c);graduate(c,1);tick(true);next();});
  });
}

// ===== صح أو خطأ (يُستعمل في المراجعة والاختبارات) =====
const STOP=new Set(['التي','الذي','الذين','وهو','وهي','فيه','فيها','عليه','عليها','إلى','على','حتى','إذا','إلا','ولا','وإن','لغير','بلا','كان','يكون','منه','منها','بعد','قبل','عند','أو','ذلك','هذا','مع','كل','غير','بين','ولو','إن','أن','لم','لا','ما','من','في','عن','بها','به','له','لها','فإن','وإلا','أي','ثم','فلا','وفي','وهما','وما','ومن']);
const toks=a=>String(a).split(/([\s،.؛:()«»]+)/);
function blankItem(c){ // أكمل الفراغ: تُخفى كلمة من جواب البطاقة، والخيارات كلمات من أجوبة الباب نفسه
  if(c.s&&c.s!=='fiqh') return null;
  const T=toks(c.a); const cand=T.map((w,i)=>[w,i]).filter(([w])=>w.replace(/^[وبفل]/,'').length>=4&&!STOP.has(w)&&!/[\s،.؛:()«»]/.test(w));
  if(cand.length<2) return null;
  const num=cand.filter(([w])=>NUMRE.test(' '+w)), src=num.length&&Math.random()<.5?num:cand, [word,idx]=src[Math.floor(Math.random()*src.length)];
  const inAns=new Set(T); const pool2=[...new Set(deck.filter(x=>x.b===c.b&&x.id!==c.id).flatMap(x=>toks(x.a)).filter(w=>w.length>=Math.max(3,word.length-3)&&w.length<=word.length+4&&!STOP.has(w)&&!inAns.has(w)&&!/[\s،.؛:()«»]/.test(w)&&(!NUMRE.test(' '+word)||NUMRE.test(' '+w))))];
  if(pool2.length<3) return null;
  const opts=shuffle([word,...shuffle(pool2).slice(0,3)]);
  const html=T.map((w,i)=>i===idx?'<b style="border-bottom:2px solid var(--accent);padding:0 1.5em"> ؟ </b>':esc(w)).join('');
  return {opts,right:word,html};
}
function tfItem(c){ const truth=!c.w||c.w.length<1||Math.random()<.5; return {truth, shown: truth?(c.ca||c.a):c.w[Math.floor(Math.random()*c.w.length)]}; }

// ===== المراجعة الحرة: تحتاج «عرفتها» مرتين متتاليتين، وبعدها تنجز وتتأجل أيام =====
const seen=()=>{const e=EOD(); return pool().filter(c=>{const s=st[c.id]; return s&&(s.t==='l'||s.due<=e);});};
const NEED=2, MAXSEEN=4;
const weak=c=>{const s=st[c.id]; return s.t==='l'?-100+(s.step||0):(s.iv||0)-(s.bad||0)*2;};
let cq=[], cdone=0, cleft=0, cshown={}, ctot=0, ctitle='مراجعة حرة', cback=null;
function cram(list,title,back){
  const L=list||seen();
  cq=shuffle(L.slice()).sort((a,b)=>(st[a.id]?weak(a):-50)-(st[b.id]?weak(b):-50)).slice(0,20);
  ctot=cq.length; cdone=0; cleft=0; cshown={}; ctitle=title||'مراجعة حرة'; cback=back||null; sessionStart=Date.now(); U.length=0; cramNext();
}
function cramNext(){ if(!cq.length) return cramDone(); cramShow(); }
function cramBar(){ return `<div class="bar"><span class="cnt"><b style="color:var(--accent)">أنجزت ${cdone}/${ctot}</b></span><span>${esc(ctitle)}</span>${undoBtn()}<button class="link" id="home">إنهاء</button></div>`; }
function cramFrame(c,body){ const k=st[c.id]?.ok||0; AM=()=>{cq.shift();cramNext();};
  frame(c,`<span class="tag">${'●'.repeat(k)+'○'.repeat(NEED-k)} باقي ${NEED-k} وتنجز</span>`,body,cramBar()); }
function cramDone(){
  const rest=cback?0:seen().length;
  app.innerHTML=`<div class="home"><h1>${cdone?'أحسنت!':'خلصت المراجعة'}</h1><div class="stats" style="grid-template-columns:1fr 1fr"><div class="c-rev"><b>${cdone}</b><span>أنجزتها وتأجلت أيام</span></div><div class="c-learn"><b>${cleft}</b><span>باقية تتعلمها</span></div></div>
    ${rest?`<button class="big" id="again">كمّل (${rest} باقية)</button>`:(cback?'':'<p class="note" style="font-size:1.05rem;color:var(--accent);font-weight:700">ما عليك شي الحين ✓ كل اللي درسته متأجل</p>')}
    <button class="big alt" id="back">${cback?'رجوع':'الرئيسية'}</button>
    <p class="note">كل بطاقة تقول فيها «عرفتها» مرتين ورا بعض تنجز وما ترجع إلا بعد أيام. واللي تغلط فيها ترجع من الصفر.</p></div>`;
  on('#again',()=>cram()); on('#back',cback||home);
}
function cramRes(c,ok){
  const saved={cq:cq.slice(),cdone,cleft,cshown:Object.assign({},cshown)};
  snap(c,()=>{cq=saved.cq;cdone=saved.cdone;cleft=saved.cleft;cshown=saved.cshown;cramShow();});
  cq.shift(); cshown[c.id]=(cshown[c.id]||0)+1;
  if(ok){
    tick(true);
    if(!st[c.id]) learn(c,0,0);
    const k=(st[c.id].ok||0)+1;
    if(k>=NEED){ const s=st[c.id]; graduate(c, s.t==='r'?Math.max((s.iv||1)+1,Math.round((s.iv||1)*(s.ease||2.5))):2); cdone++; return cramNext(); }
    st[c.id].ok=k; st[c.id].u=Date.now(); save();
  } else { learn(c,0,0); st[c.id].ok=0; miss(c); }
  if(cshown[c.id]<MAXSEEN) cq.splice(Math.min(cq.length,3),0,c); else cleft++;
  cramNext();
}
function cramShow(){
  const c=cq[0], r=Math.random(), hasW=c.w&&c.w.length>=3, bl=r<.2?blankItem(c):null;
  if(bl){
    cramFrame(c,`<p class="q">${esc(c.q)}</p><p class="lbl">أكمل الفراغ:</p><div class="tfbox">${bl.html}</div><div class="opts">${bl.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="ans"></div><div class="acts" id="acts"></div>`);
    $$('.opt').forEach(b=>b.onclick=()=>{ const ok=bl.opts[+b.dataset.i]===bl.right;
      $$('.opt').forEach(x=>{x.disabled=true; if(bl.opts[+x.dataset.i]===bl.right) x.classList.add('right');}); if(!ok) b.classList.add('wrong');
      $('#ans').innerHTML=`<div class="a">${esc(c.a)}</div>`; $('#acts').innerHTML=`<button class="main" id="nx">التالي</button>`; on('#nx',()=>cramRes(c,ok)); });
  } else if(hasW&&r<.4){
    const right=c.ca||c.a, opts=shuffle([right,...c.w]);
    cramFrame(c,`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
    $$('.opt').forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.i]===right;
      $$('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      $('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'التالي'}</button>`;
      on('#nx',()=>cramRes(c,ok));
    });
  } else if(hasW&&r<.6){
    const t=tfItem(c);
    cramFrame(c,`<p class="q">${esc(c.q)}</p><p class="lbl">هل هذا الجواب صحيح؟</p><div class="tfbox">${esc(t.shown)}</div><div id="ans" hidden></div>
      <div class="acts two" id="acts"><button class="good" id="tt">صح</button><button class="again" id="ff">خطأ</button></div>`);
    const ans=pick=>{ const ok=pick===t.truth; $('#ans').hidden=false;
      $('#ans').innerHTML=`<p class="score" style="color:var(${ok?'--accent':'--bad'})">${ok?'إجابتك صحيحة':'إجابتك غلط'}</p><div class="a">${esc(c.a)}</div>`;
      const a=$('#acts'); a.className='acts'; a.innerHTML=`<button class="main" id="nx">التالي</button>`; on('#nx',()=>cramRes(c,ok)); };
    on('#tt',()=>ans(true)); on('#ff',()=>ans(false));
  } else {
    cramFrame(c,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${extras(c)}</div>
      <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
    on('#show',()=>{
      $('#ans').hidden=false;
      const a=$('#acts'); a.className='acts two';
      a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`+swipeHint;
      const no=()=>cramRes(c,false), yes=()=>cramRes(c,true);
      on('#no',no); on('#yes',yes); SW={yes,no};
    });
  }
}

// ===== صفحات عامة =====
function page(title,body,back){
  SW=null; stopSpeech();
  app.innerHTML=`<div class="page"><button class="link back" id="pb">→ ${back?'رجوع':'الرئيسية'}</button><h1>${title}</h1>${body}</div>`;
  on('#pb',back||home);
}
function rows(list,showA){
  if(!list.length) return '<p class="note">ما فيه بطاقات هنا.</p>';
  return `<div class="list">${list.map(c=>{const b=st[c.id]?.bad||0;
    return `<div class="row"><div class="rq">${esc(c.q)}</div><div class="ra" ${showA?'':'hidden'} id="ra-${c.id}">${esc(c.a)}</div>
    <div class="rt"><span>${esc(c.b)}</span>${b?`<span class="badb">غلطت ${b}×</span>`:''}${muted(c)?'<span>مكتومة</span>':''}
      <button data-show="${c.id}">${showA?'أخفِ الجواب':'الجواب'}</button><button data-star="${c.id}">${X.star[c.id]?'★':'☆'}</button>
      <button data-tmute="${c.id}">${muted(c)?'رجّعها':'أعرفها أكيد'}</button></div></div>`;}).join('')}</div>`;
}
function wireRows(redraw){
  $$('[data-show]').forEach(b=>b.onclick=()=>{const e=$('#ra-'+b.dataset.show); e.hidden=!e.hidden; b.textContent=e.hidden?'الجواب':'أخفِ الجواب';});
  $$('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star; if(X.star[id]) delete X.star[id]; else X.star[id]=1; saveX(); b.textContent=X.star[id]?'★':'☆';});
  $$('[data-tmute]').forEach(b=>b.onclick=()=>{const id=b.dataset.tmute; if(X.mute[id]) delete X.mute[id]; else X.mute[id]=1; saveX(); redraw&&redraw();});
}
function hardPage(){
  const list=deck.filter(c=>(st[c.id]?.bad||0)>0&&!muted(c)).sort((a,b)=>(st[b.id].bad||0)-(st[a.id].bad||0));
  page('🔴 أصعب بطاقاتي',`${list.length?`<button class="big" id="q">اختبرني فيها (${Math.min(20,list.length)})</button>`:''}${rows(list)}`);
  on('#q',()=>cram(list.slice(0,20),'أصعب بطاقاتي',hardPage)); wireRows(hardPage);
}
function starPage(){
  const list=deck.filter(c=>X.star[c.id]);
  page('⭐ المعلّمة بنجمة',`${list.length?`<button class="big" id="q">اختبرني فيها</button>`:'<p class="note">حط نجمة ☆ على أي بطاقة وتطلع لك هنا.</p>'}${rows(list)}`);
  on('#q',()=>cram(list,'المعلّمة بنجمة',starPage)); wireRows(starPage);
}
const norm=t=>String(t).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
let lastQ='';
function searchPage(){
  page('🔍 بحث',`<input class="inp" id="sq" placeholder="اكتب كلمة، مثل: الخلع" value="${esc(lastQ)}"><div id="sr"></div>`);
  const run=()=>{ lastQ=$('#sq').value.trim(); const n=norm(lastQ);
    const list=n.length<2?[]:deck.filter(c=>norm(c.q+' '+c.a).includes(n));
    $('#sr').innerHTML=n.length<2?'<p class="note">اكتب حرفين أو أكثر.</p>':`<p class="lbl">${list.length} نتيجة</p>`+rows(list.slice(0,60),true); wireRows(run); };
  $('#sq').oninput=run; run(); $('#sq').focus();
}
function readPage(){
  const ch=chap(), list=deck.filter(c=>!ch||c.b===ch);
  page('📖 '+(ch||'كل الأبواب'),`<div class="chips" id="rc">${['',...chapters()].map(b=>`<button data-v="${esc(b)}" class="${ch===b?'on':''}">${esc(b||'الكل')}</button>`).join('')}</div>${rows(list,true)}`);
  $$('#rc button').forEach(b=>b.onclick=()=>{S.set('ch:'+tr,b.dataset.v);readPage();}); wireRows(readPage);
}
function setPage(){
  const mc=Object.keys(X.mute).length;
  page('⚙️ الإعدادات',`<div class="set"><p class="lbl">الهدف اليومي (عدد الإجابات)</p><div class="chips" id="gl">${[20,40,60,100].map(n=>`<button data-n="${n}" class="${goal()===n?'on':''}">${n}</button>`).join('')}</div></div>
    <div class="set"><label><input type="checkbox" id="sk" ${skipW()?'checked':''}> تخطّي خطوة «اكتبها»</label><p class="x" style="margin:0">التعلّم يصير 3 خطوات: الشرح، الاختيار، من حفظك.</p></div>
    <div class="set"><label><input type="checkbox" id="mx" ${mix()?'checked':''}> خلط الأبواب في البطاقات الجديدة</label><p class="x" style="margin:0">لما تختار «كل الأبواب»، الجديد يجيك من كل باب على قد حجمه، عشان ما يبقى باب ما درسته.</p></div>
    <div class="set"><p class="lbl">حجم الخط</p><div class="chips" id="fz">${[.9,1,1.15,1.3].map(n=>`<button data-n="${n}" class="${fs()===n?'on':''}">${n===1?'عادي':n<1?'أصغر':n<1.2?'كبير':'أكبر'}</button>`).join('')}</div></div>

let EX=null, exTimer=0;
function buildExam(n,from){
  const by={}; for(const c of from) (by[c.b]=by[c.b]||[]).push(c);
  const tot=from.length, out=[];
  for(const b in by){ const k=Math.max(1,Math.round(n*by[b].length/tot)); out.push(...shuffle(by[b].slice()).slice(0,k)); }
  if(out.length<n){ const have=new Set(out.map(c=>c.id)); out.push(...shuffle(from.filter(c=>!have.has(c.id))).slice(0,n-out.length)); }
  return shuffle(out).slice(0,n).map(c=>{ const hasW=c.w&&c.w.length>=3, r=Math.random();
    if(r<.25){ const bl=blankItem(c); if(bl) return {c,type:'blank',...bl}; }
    if(hasW&&r<.7){ const right=c.ca||c.a; return {c,type:'mcq',opts:shuffle([right,...c.w]),right}; }
    if(hasW) return {c,type:'tf',...tfItem(c)};
    return {c,type:'tf',truth:true,shown:c.ca||c.a}; });
}

const CW={'واجب واحد':1,'شيئان':2,'شرطان':2,'قسمان':2,'اثنان':2,'ثلاثة':3,'ثلاث':3,'أربعة':4,'أربع':4,'خمسة':5,'خمس':5,'ستة':6,'ست':6,'سبعة':7,'سبع':7,'ثمانية':8,'ثمان':8,'تسعة':9,'تسع':9,'عشرة':10,'عشر':10,'أربعة عشر':14};
function splitList(a){
  let t=a.split(/\.\s/)[0].replace(/\d+\)\s*/g,''), count=null;
  const m=t.match(/^([^:،(]{2,14}):\s*/); if(m&&CW[m[1].trim()]){count=m[1].trim(); t=t.slice(m[0].length);} else { const k=t.indexOf(':'); if(k>=0&&k<60) t=t.slice(k+1); }
  const out=[]; let d=0,cur='';
  for(const ch of t){ if(ch==='('||ch==='«')d++; if(ch===')'||ch==='»')d--; if(ch==='،'&&d===0){out.push(cur);cur='';} else cur+=ch; }
  out.push(cur);
  return {count, items: out.map(x=>x.trim().replace(/^و(?=\S)/,'').replace(/[.؛]$/,'').trim()).filter(x=>x.length>1)};
}

function allDue(){ const now=Date.now(); return deck.filter(c=>!muted(c)&&st[c.id]&&st[c.id].due<=now); }
function todayList(extra){
  const due=allDue().sort((a,b)=>st[a.id].due-st[b.id].due);
  const n=(extra||0)+(plan().final?0:plan().left);
  const fresh=mixNew(deck.filter(c=>!muted(c)&&!st[c.id])).slice(0,n);
  // نخلط المستحق مع الجديد ونفرّق المواد، عشان كل 20 بطاقة يكون فيها من كل المواد
  const by={}; for(const c of [...due,...fresh]) (by[c.s]=by[c.s]||[]).push(c);
  const M=marks(), keys=Object.keys(by).sort((a,b)=>(M[b]||0)-(M[a]||0)), out=[], used={};
  while(out.length<due.length+fresh.length){ let best=null,bv=Infinity;
    for(const k of keys){ if(!by[k].length) continue; const v=(used[k]||0)/Math.pow(M[k]||4,.75); if(v<bv){bv=v;best=k;} }
    out.push(by[best].shift()); used[best]=(used[best]||0)+1; }
  return out;
}

    <div class="today"><b>${left}</b><span>سؤال باقي عليك تراجعه</span></div>
    <div class="menu">${gs.map((g,i)=>{ const m=mstat(g), isCur=g===cur;
      return `<button data-g="${esc(g)}" style="${isCur?'border:2px solid var(--accent);background:var(--soft)':''}"><span>${m.ok?'✅':isCur?'▶':(i+1)}</span><b>${esc(g)}${isCur?' <small style="color:var(--accent)">← ابدأ هنا</small>':''}</b><small>أتقنت ${m.done} من ${m.act.length}${m.skip?` · ${m.skip} حافظها`:''}</small></button>`;}).join('')}</div>`);
  $$('.menu button').forEach(b=>b.onclick=()=>mufGroup(b.dataset.g));
}
function mufGroup(g){
  const m=mstat(g), sk=m.cs.filter(c=>mlev(c.id)===9);
  const L=l=>m.act.filter(c=>mlev(c.id)===l);
  const order=[...L(1),...L(0),...L(2)], extra=shuffle(L(3));
  if(!order.length&&!sk.length&&!extra.length) return mufPage();
  page('📗 '+esc(g),`<div class="today"><b>${m.done}/${m.act.length}</b><span>${m.ok?'أتقنت الباب ✓':'أتقنت'}</span></div>
    ${order.length?`<button class="big" id="go">ابدأ (${Math.min(15,order.length)} سؤال)</button>`:(extra.length?`<button class="big" id="go">راجع الباب مرة ثانية</button>`:'')}
    ${sk.length?`<p class="lbl">حافظها ولا تراجعها (${sk.length}) — اضغط أي وحدة ترجعها للمراجعة</p><div class="list">${sk.map(c=>`<button class="row" data-back="${c.id}" style="text-align:right;color:var(--ink)"><div class="rq">${esc(c.q)}</div><small class="x">↩ رجّعها</small></button>`).join('')}</div>`:''}`,mufPage);
  on('#go',()=>mufRun((order.length?order:extra).slice(0,15),0,0,g));
  $$('[data-back]').forEach(b=>b.onclick=()=>{ mset(b.dataset.back,1); mufGroup(g); });
}
function mufRun(Q,i,ok,g){
  SW=null;
  if(i>=Q.length){ const m=mstat(g);
    page('📗 خلصت الجولة',`<div class="today"><b>${ok}/${Q.length}</b><span>ذكرتها كاملة</span></div>${m.ok?'<div class="banner ok">✅ أتقنت باب '+esc(g)+'، روح للباب اللي بعده</div>':''}<button class="big" id="again">${m.ok?'الباب التالي':'كمّل هذا الباب'}</button><button class="big alt" id="bk">رجوع</button>`,mufPage);
    on('#again',()=>{ if(m.ok){ const nx=mgroups().find(x=>!mstat(x).ok); nx?mufGroup(nx):mufPage(); } else mufGroup(g); }); on('#bk',mufPage); return; }
  const c=Q[i], pct=Math.round(100*i/Q.length), lv=mlev(c.id);
  app.innerHTML=`<div class="bar"><button class="link" id="x">✕</button><div class="meter" style="flex:1"><i style="width:${pct}%"></i></div><span>${i}/${Q.length}</span></div>
    <article class="card"><p class="lbl" style="margin:0">${esc(g)}${lv===2?' · باقي مرة وتتقنه':''}</p><p class="q">${esc(c.q)}</p>
    <p class="note" style="text-align:right;margin:0">${c.need<c.pts.length?`اذكر ${c.need} منها على الأقل من حفظك`:'جاوب من حفظك'}</p>
    <div id="ans" hidden><ol class="mpts">${c.pts.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div></article>`;
  on('#x',()=>mufGroup(g));
  on('#show',()=>{ $('#ans').hidden=false; const a=$('#acts'); a.className='acts';
    a.innerHTML=`<div class="acts two"><button class="again" id="no">نسيت شي</button><button class="good" id="yes">ذكرتها كاملة</button></div><button class="link" id="skip" style="justify-self:center">✓ حافظه زين، لا تعيده</button>`;
    const res=good=>{ tick(good);
      if(good) mset(c.id,Math.max(2,Math.min(3,lv+1))); else { mset(c.id,1); if(!c._r){ c._r=1; Q.splice(Math.min(Q.length,i+4),0,c); } }
      mufRun(Q,i+1,ok+(good?1:0),g); };
    on('#no',()=>res(false)); on('#yes',()=>res(true)); on('#skip',()=>{ mset(c.id,9); mufRun(Q,i+1,ok+1,g); });
    SW={yes:()=>res(true),no:()=>res(false)}; });
}
applyFs();
load();
</script>
