<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تأهيل الأئمة والمؤذنين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F7F5EE; --surface:#FFFFFF; --ink:#1B2A23; --muted:#5E6E66; --line:#DCD9CF;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E3F0EA; --gold:#A87A20; --gold-soft:#F5EAD2;
  --danger:#9B3B2E; --ok:#2C7A4B; --radius:14px;
  --display:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
  --body:"Cairo","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121917; --surface:#1B2421; --ink:#ECEFEA; --muted:#A3B0A9; --line:#2E3A35;
    --accent:#4FB08F; --accent-ink:#0E1A15; --accent-soft:#1F332B; --gold:#D9B45E; --gold-soft:#332C1A;
    --danger:#E0796A; --ok:#66C48A;
  }
}
:root[data-theme="dark"]{
  --bg:#121917; --surface:#1B2421; --ink:#ECEFEA; --muted:#A3B0A9; --line:#2E3A35;
  --accent:#4FB08F; --accent-ink:#0E1A15; --accent-soft:#1F332B; --gold:#D9B45E; --gold-soft:#332C1A;
  --danger:#E0796A; --ok:#66C48A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
body{padding-block:0 40px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:700;text-decoration:none;color:var(--ink)}
.brand small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.02em}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.crumbs a{text-decoration:none}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:2rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.hero{padding-block:36px 20px}
.hero p{max-width:60ch;color:var(--muted);margin:10px 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}
.choice{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice .k{font-family:var(--display);font-size:1.7rem;font-weight:700}
.choice .d{color:var(--muted);font-size:.92rem;margin-top:4px}
.choice .go{display:inline-block;margin-top:14px;background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px}
.stack{display:grid;gap:14px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.count .l{color:var(--muted)}
.subjects{display:grid;gap:10px;margin-top:14px}
.subj{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.subj:hover{border-color:var(--accent)}
.subj .nm{grid-area:1/1;font-family:var(--display);font-size:1.2rem;font-weight:700}
.subj .src{grid-area:2/1;font-size:.85rem;color:var(--muted)}
.subj .mk{grid-area:1/2/3/3;align-self:center;text-align:center;min-width:64px;font-variant-numeric:tabular-nums}
.subj .mk b{display:block;font-size:1.5rem;line-height:1.1;color:var(--gold)}
.subj .mk span{font-size:.72rem;color:var(--muted)}
.subj .bar{grid-area:3/1/4/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.subj .bar i{display:block;height:100%;background:var(--gold)}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,.choice:focus-visible,.subj:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notes{max-width:72ch}
.notes h1{font-size:1.6rem;margin:22px 0 8px}
.notes h2{font-size:1.3rem;margin:26px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.notes h3{font-size:1.1rem;margin:18px 0 6px;color:var(--accent)}
.notes p{margin:8px 0}
.notes ul,.notes ol{padding-inline-start:22px;margin:6px 0}
.notes li{margin:3px 0}
.notes strong{color:var(--accent)}
.notes .tbl{overflow-x:auto;margin:10px 0}
.notes table{border-collapse:collapse;width:100%;font-size:.92rem}
.notes th,.notes td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}
.notes th{background:var(--accent-soft)}
.notes mark{background:var(--gold-soft);color:inherit;padding:0 3px;border-radius:3px}
.quiz{display:grid;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qcard .qn{font-size:.8rem;color:var(--muted)}
.qcard .qt{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:6px 0 12px}
.qcard .ans{border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;white-space:pre-line}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--danger);color:var(--danger)}
.prog{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink)}
.empty{color:var(--muted);padding:20px;text-align:center}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">تأهيل الأئمة والمؤذنين<small>وزارة الأوقاف الكويتية، اختبار الوظائف الدينية</small></a>
  <nav class="crumbs" id="crumbs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">المحتوى مأخوذ من المقررات المعتمدة ونماذج الاختبارات السابقة. لا يُحفظ أي شيء خارج جهازك.</footer>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const crumbs = document.getElementById('crumbs');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- تحويل Markdown مبسّط ----------
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/★/g,'<mark>★</mark>');
}
function mdToHtml(src){
  const lines = src.split('\n'); let out=[], i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^---+$/.test(l.trim())){i++;continue;}
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue;}
    if(l.trim().startsWith('|')){
      let rows=[]; while(i<lines.length && lines[i].trim().startsWith('|')){rows.push(lines[i].trim());i++;}
      rows=rows.filter(r=>!/^\|[\s:-|]+\|$/.test(r));
      let h='<div class="tbl"><table>';
      rows.forEach((r,ri)=>{const cells=r.slice(1,-1).split('|');const tag=ri===0?'th':'td';h+='<tr>'+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});
      out.push(h+'</table></div>');continue;
    }
    if(/^\s*[-•]\s+/.test(l)){
      let h='<ul>'; while(i<lines.length && /^\s*[-•]\s+/.test(lines[i])){
        let item=lines[i].replace(/^\s*[-•]\s+/,''); i++;
        let sub='';
        while(i<lines.length && /^\s{2,}[-•]\s+/.test(lines[i])){sub+=`<li>${inline(lines[i].replace(/^\s*[-•]\s+/,''))}</li>`;i++;}
        h+=`<li>${inline(item)}${sub?`<ul>${sub}</ul>`:''}</li>`;
      } out.push(h+'</ul>');continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      let h='<ol>'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`;i++;} out.push(h+'</ol>');continue;
    }
    let p=[]; while(i<lines.length && lines[i].trim() && !/^(#|\||\s*[-•]\s|\s*\d+[.)]\s|---)/.test(lines[i])){p.push(lines[i]);i++;}
    if(p.length) out.push(`<p>${inline(p.join(' '))}</p>`); else i++;
  }
  return out.join('\n');
}

// ---------- تخزين محلي للتقدم (اختياري) ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

// ---------- الصفحات ----------
function daysLeft(iso){const d=new Date(iso+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}

function home(){
  crumbs.innerHTML='';
  app.innerHTML=`<section class="hero">
    <h1>اختر المسار الذي تتقدم له</h1>
    <p>ملخصات المقررات المعتمدة، وبنك أسئلة من نماذج الاختبارات السابقة، مرتبة حسب وزن الدرجات. الاختبار التحريري في ${fmtDate(DATA.tracks.imam.exam_date)}.</p>
    <div class="choices">
      ${Object.entries(DATA.tracks).map(([id,t])=>`<a class="choice" href="#/${id}"><span class="k">${esc(t.name)}</span><span class="d">${t.marks_pending?'توزيع الدرجات يُحدَّث عند وصول المقرر':Object.keys(t.marks).length+' مواد، مجموع '+Object.values(t.marks).reduce((a,b)=>a+(b||0),0)+' درجة'}</span><span class="go">ابدأ المذاكرة</span></a>`).join('')}
    </div></section>`;
}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'});}

function track(tid){
  const t=DATA.tracks[tid]; if(!t) return home();
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <span>${esc(t.name)}</span>`;
  const left=daysLeft(t.exam_date);
  const total=Object.values(t.marks).reduce((a,b)=>a+(b||0),0);
  const done=store.get('done',{});
  app.innerHTML=`<section class="hero"><h1>مسار ${esc(t.name)}</h1><p>${esc(t.oral)}.</p></section>
  <div class="stack">
    <div class="card count"><span class="n">${left>=0?left:0}</span><span class="l">${left>=0?'يوماً على الاختبار التحريري':'انتهى موعد الاختبار'} (${fmtDate(t.exam_date)})</span></div>
    ${t.marks_pending?`<div class="card"><span class="pill gold">تنبيه</span> توزيع درجات هذا المسار لم يصل بعد. المواد أدناه حسب نموذج اختبار المؤذنين السابق، والمحتوى مشترك مع مسار الإمام لأن المقرر واحد.</div>`:''}
    <h2>المواد حسب وزن الدرجات</h2>
    <div class="subjects">
      ${Object.entries(t.marks).map(([sid,m])=>{const s=DATA.subjects[sid];const d=done[sid]||{};const known=Object.values(d).filter(x=>x==='y').length;return `<a class="subj" href="#/${tid}/${sid}">
        <span class="nm">${esc(s.name)}</span>
        <span class="mk"><b>${m==null?'؟':m}</b><span>${m==null?'درجة':'درجة'}</span></span>
        <span class="src">${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''} · ${s.questions.length} سؤال${known?` · أتقنت ${known}`:''}</span>
        ${m!=null?`<span class="bar"><i style="width:${Math.round(100*m/total)}%"></i></span>`:''}
      </a>`;}).join('')}
    </div>
    <div class="card"><h2>الخطة وتحليل الاختبارات السابقة</h2><div class="notes">${mdToHtml(DATA.plan)}</div></div>
  </div>`;
}

function subject(tid,sid,mode){
  const t=DATA.tracks[tid], s=DATA.subjects[sid]; if(!t||!s) return home();
  mode = mode||store.get('mode:'+sid,'notes');
  crumbs.innerHTML=`<a href="#/">الرئيسية</a> › <a href="#/${tid}">${esc(t.name)}</a> › <span>${esc(s.name)}</span>`;
  const m=t.marks[sid];
  app.innerHTML=`<section class="hero"><h1>${esc(s.name)} <span class="pill gold">${m==null?'الدرجة غير محددة':m+' درجة'}</span></h1><p>${esc(s.source)}${t.notes[sid]?' · '+esc(t.notes[sid]):''}</p></section>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-selected="${mode==='notes'}" data-mode="notes">الملخص</button>
    <button role="tab" id="tab-quiz" aria-selected="${mode==='quiz'}" data-mode="quiz">اختبر نفسك (${s.questions.length})</button>
  </div>
  <div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{store.set('mode:'+sid,b.dataset.mode);subject(tid,sid,b.dataset.mode);});
  const pane=document.getElementById('pane');
  if(mode==='notes'){pane.innerHTML=`<div class="card notes">${mdToHtml(s.notes)}</div>`;}
  else quiz(pane,sid,s);
}

function quiz(pane,sid,s){
  const qs=s.questions; if(!qs.length){pane.innerHTML='<div class="empty">لا توجد أسئلة لهذه المادة بعد.</div>';return;}
  const done=store.get('done',{}); done[sid]=done[sid]||{};
  let order=qs.map((_,i)=>i); let idx=store.get('idx:'+sid,0)%qs.length; let shown=false;
  function render(){
    const q=qs[order[idx]]; const st=done[sid];
    const known=Object.values(st).filter(x=>x==='y').length, weak=Object.values(st).filter(x=>x==='n').length;
    pane.innerHTML=`<div class="quiz">
      <div class="prog"><span>السؤال <b>${idx+1}</b> من <b>${qs.length}</b></span><span>أتقنت <b>${known}</b></span><span>تحتاج مراجعة <b>${weak}</b></span></div>
      <div class="qcard"><div class="qn">${esc(s.name)} · ${st[order[idx]]==='y'?'<span class="pill">متقن</span>':st[order[idx]]==='n'?'<span class="pill gold">للمراجعة</span>':''}</div>
        <div class="qt">${esc(q.q)}</div>
        ${shown?`<div class="ans">${esc(q.a)}</div>`:''}
        <div class="row" style="margin-top:14px">
          ${shown?`<button class="btn ok" id="y">أعرفها</button><button class="btn no" id="n">أحتاج مراجعة</button>`:`<button class="btn primary" id="show">أظهر الإجابة</button>`}
          <button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button>
        </div></div>
      <div class="row"><button class="btn" id="weakOnly">مراجعة ما أحتاجه فقط</button><button class="btn" id="all">كل الأسئلة</button><button class="btn" id="reset">تصفير التقدم</button></div>
    </div>`;
    const go=d=>{idx=(idx+d+order.length)%order.length;shown=false;store.set('idx:'+sid,idx);render();};
    pane.querySelector('#next').onclick=()=>go(1); pane.querySelector('#prev').onclick=()=>go(-1);
    const sh=pane.querySelector('#show'); if(sh) sh.onclick=()=>{shown=true;render();};
    const y=pane.querySelector('#y'); if(y) y.onclick=()=>{st[order[idx]]='y';store.set('done',done);go(1);};
    const n=pane.querySelector('#n'); if(n) n.onclick=()=>{st[order[idx]]='n';store.set('done',done);go(1);};
    pane.querySelector('#weakOnly').onclick=()=>{const w=qs.map((_,i)=>i).filter(i=>st[i]!=='y');if(w.length){order=w;idx=0;shown=false;render();}};
    pane.querySelector('#all').onclick=()=>{order=qs.map((_,i)=>i);idx=0;shown=false;render();};
    pane.querySelector('#reset').onclick=()=>{done[sid]={};store.set('done',done);order=qs.map((_,i)=>i);idx=0;shown=false;render();};
  }
  render();
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length) return home();
  if(h.length===1) return track(h[0]);
  return subject(h[0],h[1]);
}
window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
